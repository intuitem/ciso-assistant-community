# Enterprise backend tests. Run from this directory:
#     uv run --project ../../../backend pytest
# The ini lives here, not in enterprise/backend, because pytest collects the
# packages between its root and the tests: enterprise/backend's __init__.py
# only imports in the built image. The community backend goes on the path;
# its own tests are not collected.
[pytest]
DJANGO_SETTINGS_MODULE = enterprise_core.settings
pythonpath = .. ../../../backend
python_files = test_*.py
addopts = -p no:warnings
