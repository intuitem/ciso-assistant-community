services:
  backend:
    container_name: backend
    image: ghcr.io/intuitem/ciso-assistant-enterprise/backend:latest
    restart: always
    depends_on:
      - memcached
    environment:
      - ALLOWED_HOSTS=backend,u24.proxmox.lan
      - CISO_ASSISTANT_URL=https://u24.proxmox.lan:8443
      - DJANGO_DEBUG=True
      - AUTH_TOKEN_TTL=7200
      - ENABLE_MEMCACHED=True
      - MEMCACHED_LOCATION=memcached:11211
    volumes:
      - ./db:/code/db

  # huey:
  #   container_name: huey
  #   image: ghcr.io/intuitem/ciso-assistant-community/backend:latest
  #   restart: always
  #   environment:
  #     - ALLOWED_HOSTS=backend,localhost
  #     - DJANGO_DEBUG=False
  #   volumes:
  #     - ./db:/code/db
  #   entrypoint:
  #     - /bin/sh
  #     - -c
  #     - |
  #       poetry run python manage.py run_huey

  memcached:
    container_name: memcached
    image: memcached:1.6-alpine
    restart: unless-stopped
    command: ["memcached", "-m", "16"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    user: "1001:1001"

  frontend:
    container_name: frontend
    environment:
      - PUBLIC_BACKEND_API_URL=http://backend:8000/api
      - PROTOCOL_HEADER=x-forwarded-proto
      - HOST_HEADER=x-forwarded-host
      - ADDRESS_HEADER=x-forwarded-for
      - XFF_DEPTH=1

    image: ghcr.io/intuitem/ciso-assistant-enterprise/frontend:latest
    depends_on:
      - backend

  caddy:
    container_name: caddy
    image: caddy:2.11.4
    restart: unless-stopped
    ports:
      - 8443:8443
      - 9443:9443
    volumes:
      - ./db:/data
      - ./Caddyfile:/etc/caddy/Caddyfile
