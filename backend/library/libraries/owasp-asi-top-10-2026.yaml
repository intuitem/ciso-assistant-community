        Because agents rely on untyped natural-language inputs and loosely governed orchestration logic,
        they cannot reliably distinguish legitimate instructions from attacker -controlled content. Unlike
        LLM01:2025, which focuses on altering a single model response, ASI01 captures the broader agentic
        impact where manipulated inputs redirect goals, panning (when used) and multi-step behavior. Agent
        Goal Hijack differs from ASI06 (Memory & Context Poisoning) and ASI10 (Rogue Agents) because the
        attacker directly alters the agent’s goals, instructions, or decision pathways - regardless of
