    - urn: urn:intuitem:risk:req_node:owasp-asi-top-10-2026:asi10.5
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:owasp-asi-top-10-2026:asi10
      ref_id: ASI10.5
      name: Identity Attestation and Behavioral Integrity Enforcement
      description: 'Identity Attestation and Behavioral Integrity Enforcement: Implement per-agent cryptographic
        identity attestation and enforce behavioral integrity baselines throughout the agent lifecycle.
        Attach signed behavioral manifests declaring expected capabilities, tools, and goals that are
        validated by orchestration services before each action. Integrate a behavioral verification layer
        that continuously monitors tasks for deviations from the declared manifest for e.g. unapproved
        tool invocations, unexpected data exfiltration attempts etc.'
      threats:
      - urn:intuitem:risk:threat:owasp-asi-top-10-2026:asi10
    - urn: urn:intuitem:risk:req_node:owasp-asi-top-10-2026:asi10.6
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:owasp-asi-top-10-2026:asi10
      ref_id: ASI10.6
      description: 'Require periodic behavioral attestation: challenge tasks, signed bill of materials
        for prompts and tools, and per-run ephemeral credentials with one-time audience binding. All signing
        and attestation mechanisms assume hardened cryptographic key management (e.g., HSM/KMS-backed
        keys, least-privilege access, rotation and revocation). Keys must never be directly available
        to agents; instead, orchestrators should mediate signing operations so that a compromised agent
        cannot simply exfiltrate or misuse long-lived keys'
      threats:
      - urn:intuitem:risk:threat:owasp-asi-top-10-2026:asi10
