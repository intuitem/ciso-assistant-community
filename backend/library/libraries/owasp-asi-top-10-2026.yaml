      ref_id: ASI10.3
      name: Monitoring & Detection
      description: 'Monitoring & Detection: Deploy behavioral detection, such as watchdog agents to validate
        peer behavior and outputs, focusing on detecting collusion patterns and coordinated false signals.
        Monitor for anomalies such as excessive or abnormal actions executions.'
      threats:
      - urn:intuitem:risk:threat:owasp-asi-top-10-2026:asi10
    - urn: urn:intuitem:risk:req_node:owasp-asi-top-10-2026:asi10.4
      assessable: true
