      parent_urn: urn:intuitem:risk:req_node:owasp-asi-top-10-2026:asi10
      ref_id: ASI10.4
      name: Containment & Response
      description: 'Containment & Response: Implement rapid mechanisms like kill-switches and credential
        revocation to instantly disable rogue agents. Quarantine suspicious agents in sandboxed environments
        for forensic review.'
      threats:
