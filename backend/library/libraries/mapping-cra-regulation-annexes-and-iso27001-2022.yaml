urn: urn:intuitem:risk:library:mapping-cra-regulation-annexes-and-iso27001-2022
locale: en
ref_id: mapping-cra-regulation-annexes-and-iso27001-2022
name: Cyber Resilience Act (EU) 2024/2847 Annexes <-> ISO/IEC 27001:2022
description: Non-official, selective mapping of related security and documentation objectives between the annexes
  to Regulation (EU) 2024/2847 and ISO/IEC 27001:2022. Based on the CRA consolidated text of 20 November 2024 (https://eur-lex.europa.eu/eli/reg/2024/2847/2024-11-20)
  and the existing ISO library identifiers. Created and reviewed with AI assistance; no independent human validation
  is claimed. Every link denotes partial semantic overlap (intersect), not equivalence or full coverage. ISO controls
  concern the organisation and its ISMS; CRA requirements concern products and manufacturers. Links to documentation
  controls cover only information management, not the legal content or retention period. CE marking, declaration
  formalities, notified-body duties and other requirements without a sufficiently direct counterpart are intentionally
  unmapped. An absent link does not remove a CRA obligation. This mapping is neither official legal guidance nor
  evidence of certification or CRA conformity.
copyright: 'Community-authored, non-official mapping. CRA legal text: European Union law. ISO/IEC 27001 is referenced
  by identifier only.'
version: 2
publication_date: '2026-11-12'
provider: community
packager: community
translations:
  de:
    name: Cyberresilienz-Verordnung (EU) 2024/2847 - ISO/IEC 27001:2022
    description: Nicht amtliche, selektive Zuordnung verwandter Sicherheits- und Dokumentationsziele zwischen den
      Anhängen der Verordnung (EU) 2024/2847 und ISO/IEC 27001:2022. Grundlage sind der konsolidierte CRA-Rechtstext
      vom 20. November 2024 (https://eur-lex.europa.eu/eli/reg/2024/2847/2024-11-20) und die Kennungen der vorhandenen
      ISO-Bibliothek. Mit KI-Unterstützung erstellt und geprüft; eine unabhängige menschliche Validierung wird nicht
      behauptet. Jede Zuordnung bezeichnet eine teilweise inhaltliche Überschneidung (intersect), keine Gleichwertigkeit
      oder vollständige Abdeckung. ISO-Maßnahmen betreffen die Organisation und ihr ISMS; CRA-Anforderungen betreffen
      Produkte und Hersteller. Zuordnungen zu Dokumentationsanforderungen erfassen nur den Umgang mit Informationen,
      nicht den rechtlich vorgeschriebenen Inhalt oder die Aufbewahrungsfrist. CE-Kennzeichnung, Formalitäten der
      Konformitätserklärung, Pflichten benannter Stellen und weitere Anforderungen ohne hinreichend direkte Entsprechung
      bleiben bewusst ohne Zuordnung. Eine fehlende Zuordnung hebt keine CRA-Pflicht auf. Das Mapping ist weder
      eine amtliche Rechtsauslegung noch ein Nachweis einer Zertifizierung oder CRA-Konformität.
    copyright: 'Von der Community erstelltes, nicht amtliches Mapping. CRA-Rechtstext: Recht der Europäischen Union.
      ISO/IEC 27001 wird nur über Kennungen referenziert.'
  fr:
    name: Règlement (UE) 2024/2847 sur la cyberrésilience - ISO/IEC 27001:2022
    description: Correspondance non officielle et sélective entre des objectifs connexes de sécurité et de documentation
      des annexes du règlement (UE) 2024/2847 et de l'ISO/IEC 27001:2022. Fondée sur le texte consolidé du CRA du
      20 novembre 2024 (https://eur-lex.europa.eu/eli/reg/2024/2847/2024-11-20) et les identifiants de la bibliothèque
      ISO existante. Créée et vérifiée avec l'assistance de l'IA, sans revendication de validation humaine indépendante.
      Chaque lien indique un recoupement sémantique partiel (intersect), et non une équivalence ou une couverture
      complète. Les mesures ISO concernent l'organisme et son SMSI ; les exigences du CRA concernent les produits
      et les fabricants. Les liens documentaires couvrent uniquement la gestion des informations, pas leur contenu
      légal ni leur durée de conservation. Le marquage CE, les formalités de déclaration de conformité, les obligations
      des organismes notifiés et les autres exigences sans correspondance suffisamment directe sont volontairement
      exclus. L'absence de lien ne supprime aucune obligation du CRA. Cette correspondance ne constitue ni une interprétation
      juridique officielle ni une preuve de certification ou de conformité au CRA.
    copyright: 'Correspondance non officielle créée par la communauté. Texte juridique du CRA: droit de l''Union
      européenne. L''ISO/IEC 27001 est uniquement référencée par ses identifiants.'
