          - urn: urn:intuitem:risk:qf_page:vendor-tiering:context:question:regulated:choice:unsure
            value: Unsure
            translations:
              fr:
                value: Je ne sais pas
              it:
                value: Non so
              de:
                value: Unklar
          translations:
            fr:
              text: Le service soutient-il une fonction critique réglementée, comme une fonction critique
                ou importante au sens de DORA ou un service essentiel au sens de NIS2 ?
            it:
              text: Il servizio supporta una funzione critica soggetta a normativa, ad esempio una funzione
                critica o importante ai sensi di DORA oppure un servizio essenziale ai sensi della NIS2?
            de:
              text: Unterstützt die Leistung eine regulierte kritische Funktion, etwa eine kritische oder
