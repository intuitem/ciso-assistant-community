      translations:
        fr:
          name: Données, vie privée et sécurité
        it:
          name: Dati, privacy e sicurezza
        de:
          name: Daten, Datenschutz und Sicherheit
    translations:
      fr:
        name: Criticité des fournisseurs
        description: |-
          Classe un fournisseur selon son risque intrinsèque, avant toute revue de sa posture de sécurité.

          Chaque réponse notée va de 1 (faible) à 4 (critique). L'impact métier et l'exposition des données sont chacun la moyenne de leurs trois réponses, et le risque intrinsèque est le plus élevé des deux : un fournisseur qui fait tourner un processus critique compte même s'il ne détient aucune donnée, et inversement.

          Certaines réponses relèvent le niveau à elles seules : une fonction critique réglementée, un fournisseur unique derrière un processus critique, des données sensibles, ou un accès à privilèges à vos systèmes.
        annotation: 'Une réponse acceptée attribue le niveau du fournisseur sur l''échelle par défaut
          : Critique à partir d''un risque intrinsèque de 3,3, Important à partir de 2,6, Standard à partir
          de 2,0, Faible impact en dessous. Une fonction critique réglementée ou un point de défaillance
          unique rend le fournisseur au moins Critique ; des données sensibles ou un accès à privilèges,
          au moins Important. Le niveau retenu est le plus élevé de ces résultats. Chaque dimension fait
          la moyenne de trois réponses et évolue donc par tiers : 3,3 est atteint avec 4-4-2 ou 3-3-4,
          2,6 avec 3-3-2. Les niveaux sont désignés par leur clé : une échelle renommée ou réordonnée
          continue de fonctionner, une échelle sans ces clés envoie les réponses en relecture.'
      it:
        name: Classificazione della criticità dei fornitori
        description: |-
          Classifica un fornitore in base al rischio intrinseco, prima di qualsiasi valutazione delle sue misure di sicurezza.

          Ogni risposta con punteggio va da 1 (basso) a 4 (critico). L’impatto aziendale e l’esposizione dei dati sono calcolati ciascuno come media delle rispettive tre risposte; il rischio intrinseco corrisponde al valore più alto tra i due: un fornitore che gestisce un processo critico è rilevante anche se non detiene dati, e viceversa.

          Alcune risposte innalzano autonomamente il livello: una funzione critica soggetta a normativa, un fornitore unico per un processo critico, dati personali appartenenti a categorie particolari oppure accessi privilegiati ai sistemi.
        annotation: 'Una risposta approvata imposta il livello del fornitore sulla scala predefinita: Critico per un
          rischio intrinseco da 3,3, Importante da 2,6, Standard da 2,0, Impatto basso al di sotto. Una
          funzione critica soggetta a normativa o un punto singolo di guasto rendono il fornitore almeno
          Critico; i dati appartenenti a categorie particolari o gli accessi privilegiati lo rendono almeno
          Importante. Viene attribuito il livello più elevato tra questi. Ogni dimensione è la media di tre
          risposte e varia quindi per incrementi di un terzo: 3,3 si raggiunge con 4-4-2 o 3-3-4, 2,6 con
          3-3-2. I livelli sono identificati tramite chiave: la scala continua a funzionare anche se
          rinominata o riordinata; una scala priva di queste chiavi invia le risposte a revisione.'
      de:
        name: Anbietereinstufung
        description: |-
          Stuft einen Anbieter nach seinem inhärenten Risiko ein, bevor sein Sicherheitsstatus geprüft wird.

          Jede bewertete Antwort erhält 1 (niedrig) bis 4 (kritisch) Punkte. Geschäftliche Auswirkungen und Datenexposition ergeben sich jeweils aus dem Mittelwert ihrer drei Antworten. Das inhärente Risiko ist der höhere der beiden Werte: Ein Anbieter, der einen kritischen Prozess betreibt, ist auch ohne Datenhaltung bedeutsam – und umgekehrt.

          Einige Antworten erhöhen die Stufe unmittelbar: eine regulierte kritische Funktion, ein alleiniger Anbieter für einen kritischen Prozess, besondere Kategorien personenbezogener Daten oder privilegierter Zugriff auf Ihre Systeme.

          Hinweis zur Übersetzung: KI-gestützte maschinelle Übersetzung der englischen Formulartexte von intuitem mit anschließender sprachlicher und fachlicher Prüfung durch den KI-Assistenten. Keine offizielle Übersetzung von intuitem oder der genannten Behörden; keine unabhängige menschliche Prüfung. Bestehende Formularlogik und Bewertungsregeln wurden unverändert übernommen.
        annotation: 'Eine angenommene Antwort setzt die Stufe des Anbieters auf der Standardskala:
          Kritisch ab einem inhärenten Risiko von 3,3, Wichtig ab 2,6, Standard ab 2,0, darunter
          Geringe Auswirkungen. Eine regulierte kritische Funktion oder ein Single Point of Failure
          führt mindestens zu Kritisch; besondere Kategorien personenbezogener Daten oder privilegierter
          Zugriff mindestens zu Wichtig. Es gilt jeweils die höchste Stufe. Jede Dimension ist der
          Mittelwert von drei Antworten und verändert sich daher in Drittelschritten: 3,3 wird mit
          4-4-2 oder 3-3-4 erreicht, 2,6 mit 3-3-2. Die Stufen werden über ihre Schlüssel referenziert,
          sodass umbenannte oder neu geordnete Skalen weiterhin funktionieren. Bei einer Skala ohne
          diese Schlüssel werden die Antworten zur Prüfung weitergeleitet.'
translations:
  fr:
    name: Criticité des fournisseurs
    description: 'Un formulaire de départ, court, pour classer un fournisseur selon son risque intrinsèque
      : trois questions sur l''impact métier et opérationnel, trois sur les données, la vie privée et
      la sécurité. Lancez-le depuis un fournisseur avec « Évaluer le niveau » ; une réponse acceptée attribue
      le niveau au fournisseur.'
  it:
    name: Classificazione della criticità dei fornitori
    description: 'Un breve modulo iniziale per classificare un fornitore in base al rischio intrinseco: tre domande
      sull’impatto aziendale e operativo e tre su dati, privacy e sicurezza. Avvialo dalla scheda del
      fornitore con «Valuta il livello»; una risposta approvata assegna il livello al fornitore.'
  de:
    name: Anbietereinstufung
    description: |-
      Ein kurzes Einstiegsformular zur Einstufung eines Anbieters nach seinem inhärenten Risiko: drei Fragen zu geschäftlichen und betrieblichen Auswirkungen sowie drei zu Daten, Datenschutz und Sicherheit. Starten Sie es bei einem Anbieter über „Stufe bewerten“; eine angenommene Antwort überträgt die Stufe auf den Anbieter.

      Hinweis zur Übersetzung: KI-gestützte maschinelle Übersetzung der englischen Formulartexte von intuitem mit anschließender sprachlicher und fachlicher Prüfung durch den KI-Assistenten. Keine offizielle Übersetzung von intuitem oder der genannten Behörden; keine unabhängige menschliche Prüfung. Bestehende Formularlogik und Bewertungsregeln wurden unverändert übernommen.
