ref_id: BCCR-NT-RCS-ED7-INTEGRAL
name: BCCR–SINPE NT-RCS edición 7 — evaluación integral
description: '47 controles técnicos oficiales y 66 criterios procedimentales de checklist, agrupados por etapa.
  9 notas de contexto no evaluables. Español oficial para controles técnicos; traducciones inglesas no oficiales
  y síntesis editoriales para checklist. Los sufijos .A, .B, etc. son desgloses de ARG INNOVA, no numeración del
  BCCR. Checklist por estado, sin puntuación numérica en sus respuestas. Preparado por ARG INNOVA: https://www.arginnova.com.
  Vigencia normativa: 11/02/2026.'
copyright: 'Texto normativo: Banco Central de Costa Rica. MIT únicamente para contenido original autorizado de ARG
  INNOVA; excluye texto BCCR, traducciones y adaptaciones normativas.'
version: 2
publication_date: 2026-10-09
provider: Banco Central de Costa Rica
packager: ARG INNOVA — https://www.arginnova.com
translations:
  en:
    name: BCCR–SINPE NT-RCS edition 7 — comprehensive assessment
    description: '47 official technical controls and 66 procedural checklist criteria, grouped by stage. 9 non-assessable
      context notes. Official Spanish for technical controls; unofficial English translations and editorial checklist
      summaries. Suffixes .A, .B, etc. are ARG INNOVA subdivisions, not BCCR numbering. Checklist responses drive
      compliance status without numeric scores. Prepared by ARG INNOVA: https://www.arginnova.com. Regulatory effective
      date: February 11, 2026.'
