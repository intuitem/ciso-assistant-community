    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.3.1.a
      ref_id: 5.3.1.A
      assessable: true
      depth: 2
      name: Clasificación de conexiones con web services
      description: 'Verificar la clasificación en categoría 1 cuando se consume al menos un web service expuesto
        por SINPE, directamente o mediante proveedores, terminales de terceros, entidades del mismo grupo, instituciones
        que trabajan en conjunto o similares, entidades adquiridas o intervenidas. El esquema de comunicación con
        el proveedor no altera esta clasificación.


        Aplicabilidad: Cuando se consuma al menos un web service de SINPE.'
      translations:
        en:
          name: Classification of web-service connections
          description: 'Verify Category 1 classification when at least one SINPE web service is consumed directly
            or through providers, third-party terminals, entities in the same group, cooperating or similar institutions,
            acquired entities or entities under intervention. The communication arrangement with the provider does
            not alter classification.


            Applicability: When at least one SINPE web service is consumed.'
          annotation: 'ARG INNOVA editorial subdivision of section 5.3.1; the suffix is not in the standard. Source:
            5.3.1. PDF pages: 9. Record evidence, responsible person and date in available assessment fields or
            comments. Do not enter numeric scores. Leave unreviewed or future-stage items unassessed.'
