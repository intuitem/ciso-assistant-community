      ref_id: 5.4.1.C
      assessable: true
      depth: 2
      name: Continuidad del período auditado
      description: Verificar que el período auditado continúa el período equivalente del último informe sin dejar
        períodos descubiertos. Para una entidad en proceso de afiliación, el primer período podrá variar según criterio
        de auditoría.
      translations:
        en:
          name: Continuity of the audited period
          description: Verify that the audited period continues the equivalent period of the previous report without
            coverage gaps. For an applicant, the first period may vary at the auditor’s discretion.
          annotation: 'ARG INNOVA editorial subdivision of section 5.4.1; the suffix is not in the standard. Source:
            5.4.1. PDF pages: 10. Record evidence, responsible person and date in available assessment fields or
            comments. Do not enter numeric scores. Leave unreviewed or future-stage items unassessed.'
