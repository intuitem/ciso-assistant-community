        Asegúrese de que el inventario contenga como mínimo: el nombre del dispositivo, la dirección de red (si
        es estática) y la función o servicio. Revisar y actualizar el inventario al menos una vez al año.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 13; página impresa 11.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain an infrastructure inventory
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain an accurate, detailed and up-to-date inventory of the SINPE Interface Environment
            (AIS). Ensure that the inventory includes, at a minimum, the device name, network address (if static),
            and function or service. Review and update the inventory at least once a year.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 13; printed page 11.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.1.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.1
      ref_id: 6.1.2
      name: Establecer y mantener un diagrama de red detallado
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener un diagrama de red preciso, detallado y actualizado del Ambiente de Interfaz con el
        SINPE. El diagrama deberá incluir información detallada de la red, así como información de los protocolos
        y puertos utilizados. Revisar y actualizar el diagrama de red al menos una vez al año o cuando ocurran cambios
        significativos en la infraestructura.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 13; página impresa 11.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain a detailed network diagram
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain an accurate, detailed and up-to-date network diagram of the SINPE Interface Environment.
            The diagram must include detailed network information and information about the protocols and ports
            used. Review and update the network diagram at least once a year or when significant infrastructure
            changes occur.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 13; printed page 11.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.2
      ref_id: '6.2'
      assessable: false
      depth: 2
      name: Inventario y control de los activos de software
      description: ''
      translations:
        en:
          name: Inventory and control of software assets
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.2.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.2
      ref_id: 6.2.1
      name: Establecer y mantener un inventario de aplicaciones
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Elaborar y mantener un inventario detallado de todo el software instalado en la infraestructura del Ambiente
        de Interfaz con el SINPE. El inventario de software debe documentar el nombre, el fabricante, la versión
        y el propósito. Revisar y actualizar el inventario al menos una vez al año. Únicamente deberán mantenerse
        instaladas, las versiones de software que cuenten con el debido soporte y que no hayan concluido su ciclo
        de vida.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 14; página impresa 12.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain an application inventory
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Create and maintain a detailed inventory of all software installed on the SINPE Interface Environment
            infrastructure. The software inventory must document the name, vendor, version and purpose. Review and
            update the inventory at least once a year. Only software versions that are properly supported and have
            not reached end of life may remain installed.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 14; printed page 12.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.2.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.2
      ref_id: 6.2.2
      name: Establecer una lista de software autorizado
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Se deberá definir y mantener un listado del software autorizado o permitido para su instalación en el Ambiente
        de Interfaz con el SINPE. Actualizar, al menos cada 6 meses, la lista de software autorizado. De manera
        complementaria, se deberán implementar controles para detectar y eliminar el software que no forme parte
        de la lista autorizada y documentar las excepciones con el debido plan remedial.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 14; página impresa 12.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish an authorized software list
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Define and maintain a list of software authorized or permitted for installation in the SINPE Interface
            Environment. Update the authorized software list at least every six months. In addition, implement controls
            to detect and remove software that is not on the authorized list, and document exceptions with the corresponding
            remediation plan.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 14; printed page 12.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3
      ref_id: '6.3'
      assessable: false
      depth: 2
      name: Protección de los datos
      description: ''
      translations:
        en:
          name: Data protection
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3
      ref_id: 6.3.1
      name: Establecer y mantener procedimientos adecuados para la gestión de datos
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener procedimientos adecuados para la identificación y gestión de datos confidenciales
        o de acceso restringido que dé cobertura a aquellos relacionados con el SINPE. Como mínimo, deben considerarse
        los siguientes aspectos: la confidencialidad, requerimientos legales, el propietario y el manejo adecuado.
        Los datos confidenciales o de acceso restringido establecidos en el SINPE son: saldos de las cuentas de
        valores y efectivo, monto de las transacciones en efectivo y valores, identificación y nombre del cliente
        origen y destino de las transacciones.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 14; página impresa 12.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain appropriate data management procedures
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain appropriate procedures to identify and manage confidential or restricted-access
            data related to SINPE. At a minimum, consider confidentiality, legal requirements, the data owner and
            appropriate handling. The confidential or restricted-access data specified in SINPE are securities and
            cash account balances, cash and securities transaction amounts, and the identification and name of the
            originating and receiving customers in transactions.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 14; printed page 12.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3
      ref_id: 6.3.2
      name: Cifrar los datos confidenciales en tránsito
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Deben cifrarse los datos en tránsito (canal de comunicación), transmitidos entre la Plataforma Tecnológica
        de la entidad afiliada y el Ambiente de Interfaz con el SINPE (AIS). El cifrado debe hacerse mediante protocolos
        considerados seguros por las buenas prácticas internacionales. NOTA: Este control se debe implementar entre
        la plataforma tecnológica de la entidad afiliada y el ambiente AIS, por ejemplo, entre aplicaciones o sistemas
        transaccionales de la entidad que intercambian información con los nodos del SINPE o con otros aplicativos
        (propios o de terceros) que integran el AIS. Este control NO se trata de asegurar que la comunicación está
        cifrada entre los nodos de conexión y el SINPE (BCCR), ya que esa parte es gestionada por el BCCR.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: Intercambio PTA-AIS; excluye el
        tramo nodos-BCCR. PDF 15; página impresa 13.'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Encrypt confidential data in transit
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Encrypt data in transit (the communication channel) transmitted between the member entity’s Technology
            Platform and the SINPE Interface Environment (AIS). Use protocols considered secure under international
            good practices. NOTE: Implement this control between the member entity’s technology platform and the
            AIS, for example between the entity’s applications or transaction systems that exchange information
            with SINPE nodes or other applications (owned or third-party) forming part of the AIS. This control
            does NOT concern ensuring encryption between the connection nodes and SINPE (BCCR), since BCCR manages
            that part.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: PTA-AIS exchange; excludes the
            nodes-to-BCCR segment. PDF 15; printed page 13.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3
      ref_id: 6.3.3
      name: Política de disposición y/o destrucción de medios y hardware
      description: 'Clasificación BCCR — Categoría 1: Opcional; Categoría 2: Opcional.


        Definir una política para la gestión del ciclo de la información en medios de almacenamiento (incluido el
        hardware), cuándo se cumple su tiempo máximo de operación y se debe dar de baja, o debe enviarse fuera de
        la organización por temas de soporte.'
      annotation: 'Categoría 1: Opcional; categoría 2: Opcional. Alcance: AIS. PDF 15; página impresa 13.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Media and hardware disposal and/or destruction policy
          description: 'BCCR classification — Category 1: Optional; Category 2: Optional.


            Define a policy for managing the information lifecycle on storage media, including hardware, when their
            maximum operating lifetime has been reached and they must be retired, or when they must be sent outside
            the organization for support.'
          annotation: 'Category 1: Optional; category 2: Optional. Scope: AIS. PDF 15; printed page 13.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: recommended
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3.4
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.3
      ref_id: 6.3.4
      name: Cifrar datos confidenciales en reposo
      description: 'Clasificación BCCR — Categoría 1: Opcional; Categoría 2: Opcional.


        Deben cifrarse los datos de acceso restringido o confidenciales identificados con los procedimientos respectivos,
        que se encuentran en reposo (almacenados en bases de datos, discos duros, o cualquier otro medio de almacenamiento
        utilizado por la entidad).'
      annotation: 'Categoría 1: Opcional; categoría 2: Opcional. Alcance: AIS. PDF 15; página impresa 13.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Encrypt confidential data at rest
          description: 'BCCR classification — Category 1: Optional; Category 2: Optional.


            Encrypt restricted-access or confidential data identified through the corresponding procedures when
            at rest, whether stored in databases, hard drives or any other storage medium used by the entity.'
          annotation: 'Category 1: Optional; category 2: Optional. Scope: AIS. PDF 15; printed page 13.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: recommended
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.4
      ref_id: '6.4'
      assessable: false
      depth: 2
      name: Configuración segura
      description: ''
      translations:
        en:
          name: Secure configuration
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.4.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.4
      ref_id: 6.4.1
      name: Establecer y mantener un proceso de configuración seguro
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener un proceso seguro de la configuración (hardening) basado en un marco de ciberseguridad
        internacionalmente aceptado (por ejemplo: CIS) para la infraestructura del Ambiente de Interfaz con el SINPE.
        Deben establecerse mecanismos de revisión anuales de cumplimiento de esta configuración y deberán documentarse
        las excepciones.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 15; página impresa 13.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain a secure configuration process
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain a secure configuration (hardening) process based on an internationally accepted
            cybersecurity framework, such as CIS, for the SINPE Interface Environment infrastructure. Establish
            annual mechanisms to review compliance with this configuration and document exceptions.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 15; printed page 13.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.4.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.4
      ref_id: 6.4.2
      name: Implementar y administrar un firewall
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Implementar un firewall para controlar con mínimo privilegio todas las comunicaciones entre el Ambiente
        de Interfaz con el SINPE y cualquier otra red, incluida la salida a Internet, para restringir conexiones
        innecesarias y permitir una adecuada segmentación de redes. La configuración de las reglas del firewall
        debe incluir una lista documentada de todos los servicios, protocolos y puertos, incluida la justificación
        de negocio y la aprobación para cada una de dichas reglas. Las reglas del firewall deberán revisarse al
        menos cada seis meses.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 16; página impresa 14.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Implement and manage a firewall
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Implement a firewall to control, under least privilege, all communications between the SINPE Interface
            Environment and any other network, including outbound Internet access, to restrict unnecessary connections
            and enable appropriate network segmentation. Firewall rule configuration must include a documented list
            of all services, protocols and ports, including the business justification and approval for each rule.
            Review firewall rules at least every six months.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 16; printed page 14.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5
      ref_id: '6.5'
      assessable: false
      depth: 2
      name: Administración de cuentas y control de accesos
      description: ''
      translations:
        en:
          name: Account management and access control
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5
      ref_id: 6.5.1
      name: Establecer y mantener un inventario de cuentas
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener un inventario de todo el personal con acceso al Ambiente de Interfaz con el SINPE,
        el cual debe contener todas las cuentas de usuario, así como de administración y servicio. Las cuentas,
        los roles y sus privilegios, deben revisarse al menos de forma semestral y estar aprobados por el superior
        jerárquico. Las cuentas inactivas por más de 90 días deberán ser deshabilitadas. Como mínimo, el inventario
        debe contener los siguientes elementos:  El nombre de la persona responsable de la cuenta.  El detalle
        de la cuenta de usuario (FQDN).  El tipo de cuenta (usuario, servicio, administración).  El dominio. 
        El departamento.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 16; página impresa 14.  El
        PDF utiliza FQDN para los detalles de cuentas; se conserva literalmente, sin sustituirlo por correo o UPN.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain an account inventory
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain an inventory of all personnel with access to the SINPE Interface Environment,
            including all user, administrative and service accounts. Review accounts, roles and privileges at least
            every six months and obtain approval from the hierarchical superior. Disable accounts inactive for more
            than 90 days. At a minimum, include the name of the person responsible for the account, user account
            details (FQDN), account type (user, service or administration), domain and department.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 16; printed page 14.  The PDF
            uses FQDN for account details; this term is retained without substituting email or UPN. Unofficial translation;
            the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5
      ref_id: 6.5.2
      name: Establecer una política de contraseñas
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Implementar una política de contraseñas en las cuentas que se identificaron en el inventario del apartado
        6.5.1. Establecer y mantener un inventario de cuentas, donde cada usuario tenga una contraseña única con
        al menos las siguientes características:  Si utiliza Autenticación Multifactor (MFA), contraseñas de al
        menos 8 caracteres.  Si no tiene implementado Autenticación Multifactor (MFA), contraseñas de al menos
        14 caracteres.  Que implementen mecanismos para forzar su complejidad, de acuerdo con las mejores prácticas
        internacionales.  Las contraseñas deberán cambiarse al menos cada 90 días naturales, cuando no se utilice
        Autenticación Multifactor (MFA).'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 16; página impresa 14.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish a password policy
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Implement a password policy for the accounts identified in the inventory under section 6.5.1. Establish
            and maintain an account inventory in which each user has a unique password with at least the following
            characteristics: passwords of at least eight characters when multifactor authentication (MFA) is used,
            and at least 14 characters when MFA is not implemented. Implement mechanisms to enforce complexity according
            to international best practices. Change passwords at least every 90 calendar days when MFA is not used.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 16; printed page 14.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5
      ref_id: 6.5.3
      name: Restringir los privilegios de administrador
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener un inventario de las cuentas de tipo administración y servicio, identificadas en el
        inventario del apartado 6.5.1. Para estas cuentas, deberán restringirse las actividades que son propias
        de usuario final, por ejemplo: navegación por Internet y acceso al correo electrónico.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 17; página impresa 15.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Restrict administrator privileges
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain an inventory of administrative and service accounts identified in the inventory
            under section 6.5.1. For these accounts, restrict activities associated with end users, such as Internet
            browsing and email access.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 17; printed page 15.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5.4
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5
      ref_id: 6.5.4
      name: Establecer un proceso para conceder accesos
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y seguir un proceso para otorgar, revocar o modificar los accesos a la infraestructura del Ambiente
        de Interfaz con el SINPE, a fin de garantizar que los usuarios tengan acceso a los sistemas y datos necesarios
        para realizar sus funciones, siguiendo siempre el principio de mínimo privilegio y necesidad de saber.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 17; página impresa 15.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish a process for granting access
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and follow a process to grant, revoke or modify access to the SINPE Interface Environment
            infrastructure, ensuring that users have access to the systems and data needed to perform their duties,
            always following the principles of least privilege and need to know.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 17; printed page 15.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5.5
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.5
      ref_id: 6.5.5
      name: Implementar Autenticación Multifactor para los accesos privilegiados
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Opcional.


        Implementar Autenticación Multifactor (MFA) para todos los accesos administrativos a la infraestructura
        del Ambiente de Interfaz con el SINPE.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Opcional. Alcance: AIS. PDF 17; página impresa 15.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Implement multifactor authentication for privileged access
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Optional.


            Implement multifactor authentication (MFA) for all administrative access to the SINPE Interface Environment
            infrastructure.'
          annotation: 'Category 1: Mandatory; category 2: Optional. Scope: AIS. PDF 17; printed page 15.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: undefined
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.6
      ref_id: '6.6'
      assessable: false
      depth: 2
      name: Gestión de vulnerabilidades
      description: ''
      translations:
        en:
          name: Vulnerability management
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.6.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.6
      ref_id: 6.6.1
      name: Establecer y mantener un proceso de gestión de vulnerabilidades
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener documentado un proceso de gestión de vulnerabilidades para toda la infraestructura
        del Ambiente de Interfaz con el SINPE que cubra al menos, análisis, priorización y remediación de vulnerabilidades.
        Revisar y actualizar esta documentación anualmente, o cuando ocurran cambios significativos que puedan afectar
        este control.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 17; página impresa 15.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain a vulnerability management process
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain a documented vulnerability management process for all SINPE Interface Environment
            infrastructure, covering at least vulnerability analysis, prioritization and remediation. Review and
            update this documentation annually or when significant changes occur that could affect this control.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 17; printed page 15.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.6.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.6
      ref_id: 6.6.2
      name: Realizar análisis de vulnerabilidades internos y externos
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Realizar escaneos de vulnerabilidades internos y externos al menos una vez por semestre para la infraestructura
        del Ambiente de Interfaz con el SINPE y los servicios externos que se conectan con dicho ambiente. Todos
        los hallazgos detectados deberán corregirse de acuerdo con los procesos documentados.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 18; página impresa 16.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Perform internal and external vulnerability assessments
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Perform internal and external vulnerability scans at least once per six-month period for the SINPE Interface
            Environment infrastructure and the external services connected to it. Correct all detected findings
            according to the documented processes.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 18; printed page 16.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.6.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.6
      ref_id: 6.6.3
      name: Realizar una gestión de parches y actualizaciones
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Implementar un proceso de parchado o aplicación de actualizaciones y ejecutarlo, al menos de forma semestral,
        para toda la infraestructura del Ambiente de Interfaz con el SINPE.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 18; página impresa 16.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Manage patches and updates
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Implement a patching or update process and execute it at least once per six-month period for all SINPE
            Interface Environment infrastructure.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 18; printed page 16.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7
      ref_id: '6.7'
      assessable: false
      depth: 2
      name: Gestión de bitácoras de auditoría
      description: ''
      translations:
        en:
          name: Audit log management
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7
      ref_id: 6.7.1
      name: Recopilar registros de auditoría
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Opcional.


        Debe existir un proceso para gestionar bitácoras de auditoría que, como mínimo, aborde la recopilación,
        revisión y retención de los registros. Deben recopilarse los registros de auditoría de toda la infraestructura
        del Ambiente de Interfaz con el SINPE. Como mínimo, el registro debe incluir los siguientes elementos: 
        El origen del evento.  La fecha.  El nombre de usuario.  La marca de tiempo.  El dominio.  Las direcciones
        de origen.  Las direcciones de destino.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Opcional. Alcance: AIS. PDF 18; página impresa 16.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Collect audit logs
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Optional.


            Have an audit log management process that addresses, at a minimum, log collection, review and retention.
            Collect audit logs from all SINPE Interface Environment infrastructure. At a minimum, each record must
            include the event origin, date, username, timestamp, domain, source addresses and destination addresses.'
          annotation: 'Category 1: Mandatory; category 2: Optional. Scope: AIS. PDF 18; printed page 16.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: undefined
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7
      ref_id: 6.7.2
      name: Almacenar de forma adecuada los registros de auditoría
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Opcional.


        Los registros de auditoría deben almacenarse de acuerdo con lo que establece el proceso de gestión, en caso
        de ser requerido para análisis de eventos. El mínimo de retención solicitado es de 90 días.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Opcional. Alcance: AIS. PDF 18; página impresa 16.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Store audit logs appropriately
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Optional.


            Store audit logs according to the management process in case they are needed for event analysis. The
            required minimum retention period is 90 days.'
          annotation: 'Category 1: Mandatory; category 2: Optional. Scope: AIS. PDF 18; printed page 16.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: undefined
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7
      ref_id: 6.7.3
      name: Estandarizar la hora de los registros de auditoría
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Opcional.


        Con la finalidad de mantener la seguridad, precisión y disponibilidad de los registros de tiempo en los
        sistemas de registro de eventos (bitácoras o logs). Debe estandarizarse la hora, configurando al menos dos
        orígenes de hora sincronizados dentro de la infraestructura.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Opcional. Alcance: AIS. PDF 19; página impresa 17.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Standardize audit log time
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Optional.


            To maintain the security, accuracy and availability of time records in event logging systems, standardize
            time by configuring at least two synchronized time sources within the infrastructure.'
          annotation: 'Category 1: Mandatory; category 2: Optional. Scope: AIS. PDF 19; printed page 17.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: undefined
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7.4
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.7
      ref_id: 6.7.4
      name: Realizar revisiones de los registros de auditoría
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Opcional.


        Realizar revisiones, al menos semanalmente, de los registros de auditoría para detectar posibles anomalías
        o eventos anormales que podrían representar una amenaza.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Opcional. Alcance: AIS. PDF 19; página impresa 17.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Review audit logs
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Optional.


            Review audit logs at least weekly to detect potential anomalies or abnormal events that could represent
            a threat.'
          annotation: 'Category 1: Mandatory; category 2: Optional. Scope: AIS. PDF 19; printed page 17.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: undefined
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8
      ref_id: '6.8'
      assessable: false
      depth: 2
      name: Protección del correo electrónico y la navegación por Internet
      description: ''
      translations:
        en:
          name: Email and Internet browsing protection
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8
      ref_id: 6.8.1
      name: Aplicar filtrado de navegación
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Aplicar y mantener actualizados los filtros de navegación para limitar la conexión de los activos a sitios
        web potencialmente peligrosos o no aprobados. Documentar y aprobar formalmente las excepciones.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: Toda la plataforma tecnológica de
        la entidad. PDF 19; página impresa 17.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Apply web browsing filtering
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Apply and keep browsing filters up to date to limit asset connections to potentially dangerous or unapproved
            websites. Document and formally approve exceptions.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: Entire entity technology platform. PDF
            19; printed page 17.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8
      ref_id: 6.8.2
      name: Implementar protección contra correo no deseado
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Implementar una solución o herramienta de filtrado de correo con el propósito de reducir la cantidad de
        mensajes de correo no deseado (spam, phishing, etc.) que llegan a la bandeja de correo de los usuarios.
        Mantener actualizada la solución para garantizar un filtrado efectivo.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: Toda la plataforma tecnológica de
        la entidad. PDF 19; página impresa 17.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Implement protection against unwanted email
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Implement an email filtering solution or tool to reduce unwanted messages, such as spam and phishing,
            reaching users’ inboxes. Keep the solution up to date to ensure effective filtering.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: Entire entity technology platform. PDF
            19; printed page 17.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8
      ref_id: 6.8.3
      name: Implementar protección antimalware a nivel de correo electrónico
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Implementar protección antimalware para el correo electrónico, como el análisis de archivos adjuntos y el
        espacio aislado. Estas técnicas de protección deberán aplicarse en el servidor o plataforma de correo electrónico,
        antes de que los correos sean entregados a los usuarios. Gestionar las actualizaciones necesarias para mantener
        una protección efectiva.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: Toda la plataforma tecnológica de
        la entidad. PDF 20; página impresa 18.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Implement email antimalware protection
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Implement email antimalware protection, such as attachment scanning and sandboxing. Apply these protection
            techniques on the email server or platform before messages are delivered to users. Manage the updates
            needed to maintain effective protection.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: Entire entity technology platform. PDF
            20; printed page 18.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8.4
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.8
      ref_id: 6.8.4
      name: Bloquear archivos innecesarios
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer e implementar una política de bloqueo de archivos adjuntos en el correo electrónico para restringir
        el envío o recepción de archivos riesgosos, desconocidos, con versiones descontinuadas o vulnerables; archivos
        innecesarios para el trabajo, entre otros. Revisar y actualizar la lista de bloqueo al menos de forma semestral.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: Toda la plataforma tecnológica de
        la entidad. PDF 20; página impresa 18.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Block unnecessary files
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and implement an email attachment blocking policy to restrict the sending or receiving of
            risky or unknown files, files with discontinued or vulnerable versions, files unnecessary for work,
            and other such files. Review and update the blocklist at least once per six-month period.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: Entire entity technology platform. PDF
            20; printed page 18.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.9
      ref_id: '6.9'
      assessable: false
      depth: 2
      name: Defensa contra código malicioso
      description: ''
      translations:
        en:
          name: Malware defense
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.9.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.9
      ref_id: 6.9.1
      name: Implementar y mantener software contra código malicioso
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Implementar software de protección contra código malicioso en todos los endpoints de la plataforma tecnológica.
        Asegurarse de incluir este software como parte de la configuración inicial de nuevos equipos de usuario,
        máquinas virtuales, servidores y cualquier endpoint. Llevar a cabo revisiones periódicas para asegurar la
        correcta aplicación de este control.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: Toda la plataforma tecnológica de
        la entidad. PDF 20; página impresa 18.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Implement and maintain antimalware software
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Implement antimalware protection software on all endpoints of the technology platform. Include this
            software in the initial configuration of new user devices, virtual machines, servers and any endpoint.
            Conduct periodic reviews to ensure that this control is correctly applied.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: Entire entity technology platform. PDF
            20; printed page 18.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.9.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.9
      ref_id: 6.9.2
      name: Actualizar de forma automática las firmas contra código malicioso
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Configurar las actualizaciones automáticas para la solución de protección contra código malicioso, de manera
        que se asegure la protección más actualizada contra amenazas de este tipo sin requerir intervención humana.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: Toda la plataforma tecnológica de
        la entidad. PDF 20; página impresa 18.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Automatically update antimalware signatures
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Configure automatic updates for the antimalware protection solution to ensure the most up-to-date protection
            against these threats without requiring human intervention.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: Entire entity technology platform. PDF
            20; printed page 18.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.9.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.9
      ref_id: 6.9.3
      name: Utilizar herramientas de protección basadas en comportamiento
      description: 'Clasificación BCCR — Categoría 1: Opcional; Categoría 2: Opcional.


        Implementar software de protección contra código malicioso basado en comportamiento, en todos los endpoints
        de la plataforma tecnológica. Asegurarse de incluir este software como parte de la configuración inicial
        de nuevos equipos de usuario, máquinas virtuales, servidores y cualquier endpoint. Configurar las actualizaciones
        automáticas para la solución de protección contra código malicioso basada en comportamiento, de manera que
        se asegure la protección más actualizada contra amenazas de este tipo sin requerir intervención humana.
        Llevar a cabo revisiones periódicas para asegurar la correcta aplicación de este control.'
      annotation: 'Categoría 1: Opcional; categoría 2: Opcional. Alcance: Toda la plataforma tecnológica de la entidad.
        PDF 21; página impresa 19.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Use behavior-based protection tools
          description: 'BCCR classification — Category 1: Optional; Category 2: Optional.


            Implement behavior-based antimalware protection software on all endpoints of the technology platform.
            Include this software in the initial configuration of new user devices, virtual machines, servers and
            any endpoint. Configure automatic updates for the behavior-based protection solution to ensure the most
            up-to-date protection against these threats without requiring human intervention. Conduct periodic reviews
            to ensure that this control is correctly applied.'
          annotation: 'Category 1: Optional; category 2: Optional. Scope: Entire entity technology platform. PDF
            21; printed page 19.  Unofficial translation; the Spanish PDF prevails.'
      importance: recommended
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.10
      ref_id: '6.10'
      assessable: false
      depth: 2
      name: Recuperación de datos
      description: ''
      translations:
        en:
          name: Data recovery
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.10.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.10
      ref_id: 6.10.1
      name: Establecer y mantener un proceso de recuperación de datos
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Establecer y mantener un proceso de recuperación de datos del Ambiente de Interfaz con el SINPE. En el proceso
        debe establecerse el alcance de las actividades de recuperación, la priorización de la recuperación, las
        pruebas de recuperación y la seguridad de los datos de respaldo. Revisar y actualizar la documentación anualmente,
        o cuando ocurran cambios significativos que puedan afectar este requisito.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: AIS. PDF 21; página impresa 19.'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Establish and maintain a data recovery process
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Establish and maintain a data recovery process for the SINPE Interface Environment. Define the scope
            of recovery activities, recovery prioritization, recovery testing and backup data security in the process.
            Review and update the documentation annually or when significant changes occur that could affect this
            requirement.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: AIS. PDF 21; printed page 19.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.11
      ref_id: '6.11'
      assessable: false
      depth: 2
      name: Gestión de la infraestructura de red
      description: ''
      translations:
        en:
          name: Network infrastructure management
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.11.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.11
      ref_id: 6.11.1
      name: Establecer y mantener una arquitectura de red segura
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        La red donde se ubican los equipos del Ambiente de Interfaz con el SINPE debe segmentarse de forma que permita
        separar este ambiente del resto de la red empresarial. Dicha segmentación deberá permitir las comunicaciones
        estrictamente necesarias, bloqueando el tráfico entre la red empresarial y el Ambientes de Interfaz con
        el SINPE. Las comunicaciones permitidas deberán ser debidamente documentadas.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 21; página impresa 19.
        El texto combina bloqueo de tráfico con permiso de comunicaciones estrictamente necesarias. Interpretar
        conjuntamente; no como aislamiento absoluto.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain a secure network architecture
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Segment the network containing SINPE Interface Environment equipment to separate this environment from
            the rest of the enterprise network. This segmentation must allow strictly necessary communications,
            blocking traffic between the enterprise network and the SINPE Interface Environment. Document the permitted
            communications appropriately.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 21; printed page 19. The source
            combines traffic blocking with strictly necessary permitted communications. Read together; not as absolute
            isolation. Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.11.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.11
      ref_id: 6.11.2
      name: Utilizar mecanismos seguros para la administración de red
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Utilizar protocolos seguros de administración de red de acuerdo con las mejores prácticas de la industria,
        como son: SSH, SNMP v3 y HTTPS. Implementar mecanismos de identidad AAA (Autenticación, Autorización y Auditoría)
        para el acceso administrativo a la infraestructura de red.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 22; página impresa 20.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Use secure network administration mechanisms
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Use secure network administration protocols according to industry best practices, such as SSH, SNMP
            v3 and HTTPS. Implement AAA identity mechanisms (Authentication, Authorization and Auditing) for administrative
            access to network infrastructure.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 22; printed page 20.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.11.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.11
      ref_id: 6.11.3
      name: Gestionar el control de acceso para activos remotos
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Utilizar mecanismos seguros e inspección de estado de salud, para establecer conexiones remotas a la red
        empresarial, por ejemplo: VPN.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: Conexiones remotas a la red empresarial.
        PDF 22; página impresa 20.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Manage access control for remote assets
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Use secure mechanisms and health checks to establish remote connections to the enterprise network, for
            example a VPN.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: Remote connections to the enterprise
            network. PDF 22; printed page 20.  Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.12
      ref_id: '6.12'
      assessable: false
      depth: 2
      name: Monitoreo y defensa de la red
      description: ''
      translations:
        en:
          name: Network monitoring and defense
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.12.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.12
      ref_id: 6.12.1
      name: Implementar un IPS en la red
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Debe implementarse una solución de prevención de intrusiones entre las redes organizacionales y la red del
        Ambiente de Interfaz con el SINPE. Las implementaciones de ejemplo incluyen el uso de un sistema de prevención
        de intrusiones en la red (NIPS) o un servicio equivalente de proveedor de servicios en la nube (CSP).'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: AIS. PDF 22; página impresa 20.'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Implement a network IPS
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Implement an intrusion prevention solution between organizational networks and the SINPE Interface Environment
            network. Example implementations include a network intrusion prevention system (NIPS) or an equivalent
            cloud solution provider (CSP) service.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: AIS. PDF 22; printed page 20.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.12.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.12
      ref_id: 6.12.2
      name: Implementar una solución de Detección y Respuesta para punto final (Endpoint Detection and Response)
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Opcional.


        Implementar una solución de detección y respuesta a nivel de host.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Opcional. Alcance: AIS. PDF 22; página impresa 20.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Implement an Endpoint Detection and Response solution
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Optional.


            Implement a host-level detection and response solution.'
          annotation: 'Category 1: Mandatory; category 2: Optional. Scope: AIS. PDF 22; printed page 20.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: undefined
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.12.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.12
      ref_id: 6.12.3
      name: Realizar el filtrado en la capa de aplicación
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Realizar filtrado del tráfico externo, de forma que puedan identificarse las aplicaciones para bloquear
        o permitir, según corresponda. Entre las implementaciones de ejemplo se incluye un firewall de próxima generación.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: AIS. PDF 22; página impresa 20.'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Perform application-layer filtering
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Filter external traffic so that applications can be identified and blocked or allowed as appropriate.
            Example implementations include a next-generation firewall.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: AIS. PDF 22; printed page 20.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.13
      ref_id: '6.13'
      assessable: false
      depth: 2
      name: Concientización en Ciberseguridad y formación de habilidades
      description: ''
      translations:
        en:
          name: Cybersecurity awareness and skills training
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.13.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.13
      ref_id: 6.13.1
      name: Establecer y mantener un programa de concientización en ciberseguridad
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener un programa de concientización sobre ciberseguridad. El propósito del programa es
        educar al personal sobre cómo interactuar con los activos y datos de la entidad de manera segura. Realice
        la capacitación al momento de contratar y, como mínimo, anualmente.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 23; página impresa 21.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain a cybersecurity awareness program
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain a cybersecurity awareness program. Its purpose is to educate personnel on interacting
            safely with the entity’s assets and data. Conduct training upon hiring and, at a minimum, annually.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 23; printed page 21.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.13.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.13
      ref_id: 6.13.2
      name: Llevar a cabo capacitación en habilidades y concientización sobre ciberseguridad para roles específicos
      description: 'Clasificación BCCR — Categoría 1: Opcional; Categoría 2: Opcional.


        Llevar a cabo capacitación en habilidades y concientización sobre ciberseguridad para funciones específicas.
        Por ejemplo: cursos de administración de sistemas seguros para profesionales de TI, capacitación en prevención
        y concientización de vulnerabilidades de OWASP® Top 10 para desarrolladores de aplicaciones web y capacitación
        avanzada en concientización sobre ingeniería social para roles de alto perfil, entre otros.'
      annotation: 'Categoría 1: Opcional; categoría 2: Opcional. Alcance: AIS. PDF 23; página impresa 21.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Provide cybersecurity skills and awareness training for specific roles
          description: 'BCCR classification — Category 1: Optional; Category 2: Optional.


            Provide cybersecurity skills and awareness training for specific functions. Examples include secure
            systems administration courses for IT professionals, OWASP Top 10 vulnerability prevention and awareness
            training for web application developers, and advanced social engineering awareness training for high-profile
            roles, among others.'
          annotation: 'Category 1: Optional; category 2: Optional. Scope: AIS. PDF 23; printed page 21.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: recommended
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.14
      ref_id: '6.14'
      assessable: false
      depth: 2
      name: Gestión de proveedores de servicios
      description: ''
      translations:
        en:
          name: Service provider management
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.14.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.14
      ref_id: 6.14.1
      name: Establecer y mantener una política de gestión de proveedores de servicios
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener una política de gestión de proveedores de servicios para aquellos contratos relacionados
        con la implementación de servicios de interacción directa con el SINPE. Como mínimo, la política debe abordar
        la clasificación, el inventario, la evaluación, el seguimiento y requisitos de ciberseguridad; así como
        la finalización de la relación con los proveedores de servicios. Revisar y actualizar la política anualmente
        o cuando ocurran cambios significativos.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 23; página impresa 21.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain a service provider management policy
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain a service provider management policy for contracts related to implementing services
            that interact directly with SINPE. At a minimum, the policy must address classification, inventory,
            assessment, monitoring and cybersecurity requirements, as well as termination of provider relationships.
            Review and update the policy annually or when significant changes occur.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 23; printed page 21.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15
      ref_id: '6.15'
      assessable: false
      depth: 2
      name: Seguridad en las aplicaciones
      description: ''
      translations:
        en:
          name: Application security
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15
      ref_id: 6.15.1
      name: Ambientes de producción y no producción debidamente separados
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Mantener entornos separados para sistemas de producción y no producción, además no se deberán utilizar los
        datos confidenciales o de acceso restringido de producción en los ambientes no productivos.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: AIS. PDF 24; página impresa 22.
        Si no desarrolla soluciones propias, la entidad debe asegurar que su proveedor aplica estos controles (introducción
        6.15).'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Properly separate production and non-production environments
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Maintain separate environments for production and non-production systems. Do not use confidential or
            restricted-access production data in non-production environments.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: AIS. PDF 24; printed page 22. If
            the entity does not develop its own solutions, it must ensure its provider applies these controls (section
            6.15 introduction). Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15
      ref_id: 6.15.2
      name: Establecer y mantener un proceso de desarrollo de aplicaciones seguro
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Establecer y mantener un proceso de desarrollo de aplicaciones seguro. En el proceso, deben abordarse elementos
        tales como: estándares de diseño de aplicaciones seguras, prácticas de codificación segura, capacitación
        de desarrolladores, gestión de vulnerabilidades, seguridad de código de terceros y procedimientos de prueba
        de seguridad de aplicaciones. Revisar y actualizar la documentación anualmente o cuando ocurran cambios
        significativos.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: AIS. PDF 24; página impresa 22.
        Si no desarrolla soluciones propias, la entidad debe asegurar que su proveedor aplica estos controles (introducción
        6.15).'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Establish and maintain a secure application development process
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Establish and maintain a secure application development process. Address elements such as secure application
            design standards, secure coding practices, developer training, vulnerability management, third-party
            code security and application security testing procedures. Review and update the documentation annually
            or when significant changes occur.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: AIS. PDF 24; printed page 22. If
            the entity does not develop its own solutions, it must ensure its provider applies these controls (section
            6.15 introduction). Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15
      ref_id: 6.15.3
      name: Establecer y mantener un proceso para gestionar las vulnerabilidades de las aplicaciones
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Establecer y mantener un proceso para gestionar las vulnerabilidades de las aplicaciones que interactúan
        con el Ambiente de Interfaz con SINPE. El proceso debe incluir elementos tales como:  Una política de manejo
        de vulnerabilidades de las aplicaciones durante todo su ciclo de vida.  Un proceso de identificación, asignación,
        remediación y pruebas de remediación de las vulnerabilidades reportadas en las aplicaciones. Revisar y actualizar
        la documentación anualmente o cuando ocurran cambios significativos.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: AIS. PDF 24; página impresa 22.
        Si no desarrolla soluciones propias, la entidad debe asegurar que su proveedor aplica estos controles (introducción
        6.15).'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Establish and maintain a process to manage application vulnerabilities
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Establish and maintain a process to manage vulnerabilities in applications interacting with the SINPE
            Interface Environment. Include elements such as an application vulnerability handling policy throughout
            the application lifecycle, and a process for identifying, assigning, remediating and testing remediation
            of reported application vulnerabilities. Review and update the documentation annually or when significant
            changes occur.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: AIS. PDF 24; printed page 22. If
            the entity does not develop its own solutions, it must ensure its provider applies these controls (section
            6.15 introduction). Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15.4
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.15
      ref_id: 6.15.4
      name: Implementar verificaciones de seguridad a nivel de código
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: No aplicable.


        Implementar, en el ciclo de desarrollo de las aplicaciones, prácticas o actividades que permitan realizar
        comprobaciones de seguridad en el código.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: No aplicable. Alcance: AIS. PDF 24; página impresa 22.
        Si no desarrolla soluciones propias, la entidad debe asegurar que su proveedor aplica estos controles (introducción
        6.15).'
      implementation_groups:
      - cat1
      translations:
        en:
          name: Implement code-level security checks
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Not applicable.


            Implement practices or activities within the application development lifecycle that enable security
            checks in the code.'
          annotation: 'Category 1: Mandatory; category 2: Not applicable. Scope: AIS. PDF 24; printed page 22. If
            the entity does not develop its own solutions, it must ensure its provider applies these controls (section
            6.15 introduction). Unofficial translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16
      ref_id: '6.16'
      assessable: false
      depth: 2
      name: Gestión de respuesta ante incidentes
      description: ''
      translations:
        en:
          name: Incident response management
          description: ''
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-technical
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16.1
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16
      ref_id: 6.16.1
      name: Designar personal para administrar el manejo de incidentes
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Asignar las responsabilidades al personal encargado de gestionar el proceso de atención de incidentes. El
        personal de administración es responsable de la coordinación y documentación de la respuesta a incidentes
        y los esfuerzos de recuperación. Esta responsabilidad puede asignarse a empleados internos de la empresa,
        personal de proveedores externos o mediante un enfoque híbrido. Las responsabilidades deberán revisarse
        anualmente o cuando ocurran cambios significativos.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 25; página impresa 23.  El
        alcance del término «personal de administración» no se precisa; no se presume que se refiera a la alta dirección.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Designate personnel to manage incidents
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Assign responsibilities to personnel in charge of managing incident handling. Administrative personnel
            are responsible for coordinating and documenting incident response and recovery efforts. This responsibility
            may be assigned to internal employees, external provider personnel or a hybrid arrangement. Review responsibilities
            annually or when significant changes occur.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 25; printed page 23.  The scope
            of “administrative personnel” is not specified; senior management is not presumed. Unofficial translation;
            the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16.2
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16
      ref_id: 6.16.2
      name: Establecer y mantener un proceso de atención de incidentes de ciberseguridad
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener un proceso de atención de incidentes de ciberseguridad. El proceso debe considerar,
        como mínimo, los siguientes aspectos (no implica necesariamente un documento independiente para cada uno
        de ellos):  Declaración de incidentes.  Roles y responsabilidades.  Triage o determinación de severidad.
         Procedimientos detallados de respuesta (playbooks).  Plan de comunicación (escalamiento, información
        de contacto y plantillas para comunicación). El proceso y su documentación deberán revisarse anualmente
        o cuando ocurran cambios significativos.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 25; página impresa 23.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain a cybersecurity incident handling process
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain a cybersecurity incident handling process. At a minimum, consider incident declaration,
            roles and responsibilities, triage or severity determination, detailed response procedures (playbooks),
            and a communication plan covering escalation, contact information and communication templates. These
            aspects do not necessarily require separate documents. Review the process and its documentation annually
            or when significant changes occur.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 25; printed page 23.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16.3
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16
      ref_id: 6.16.3
      name: Establecer y mantener información de contacto para comunicar incidentes de ciberseguridad
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Establecer y mantener la información de contacto de las partes que necesitan ser informadas de incidentes
        de ciberseguridad. Los contactos pueden incluir personal interno, proveedores externos, proveedores de seguros,
        agencias gubernamentales u otras partes interesadas. Verificar los contactos anualmente para asegurarse
        de que la información está actualizada. En el caso de un incidente relacionado con el Ambiente de Interfaz
        con el SINPE, deberá informarse de forma inmediata al Centro de Atención del Ciudadano del BCCR y seguir
        el proceso establecido para la atención de incidentes de ciberseguridad.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 25; página impresa 23.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Establish and maintain contact information for reporting cybersecurity incidents
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Establish and maintain contact information for parties that need to be informed of cybersecurity incidents.
            Contacts may include internal personnel, external providers, insurers, government agencies or other
            stakeholders. Verify the contacts annually to ensure the information is up to date. Immediately notify
            the BCCR Citizen Service Center of any incident related to the SINPE Interface Environment and follow
            the established cybersecurity incident handling process.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 25; printed page 23.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16.4
      assessable: true
      depth: 3
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:6.16
      ref_id: 6.16.4
      name: Ejecutar ejercicios de respuesta a incidentes
      description: 'Clasificación BCCR — Categoría 1: Obligatorio; Categoría 2: Obligatorio.


        Ejecutar ejercicios y escenarios de respuesta a incidentes de ciberseguridad, aplicables al Ambiente de
        Interfaz con el SINPE, para el personal clave involucrado en el proceso de respuesta, con el propósito de
        prepararse para responder a incidentes reales. Los ejercicios deben probar los canales de comunicación,
        la toma de decisiones y los flujos de trabajo. Como mínimo, se deben realizar pruebas anualmente.'
      annotation: 'Categoría 1: Obligatorio; categoría 2: Obligatorio. Alcance: AIS. PDF 26; página impresa 24.'
      implementation_groups:
      - cat1
      - cat2
      translations:
        en:
          name: Conduct incident response exercises
          description: 'BCCR classification — Category 1: Mandatory; Category 2: Mandatory.


            Conduct cybersecurity incident response exercises and scenarios applicable to the SINPE Interface Environment
            for key personnel involved in response, to prepare them for actual incidents. Exercises must test communication
            channels, decision-making and workflows. At a minimum, conduct tests annually.'
          annotation: 'Category 1: Mandatory; category 2: Mandatory. Scope: AIS. PDF 26; printed page 24.  Unofficial
            translation; the Spanish PDF prevails.'
      importance: mandatory
