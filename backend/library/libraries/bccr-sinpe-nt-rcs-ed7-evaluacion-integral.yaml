    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.4.4.b
      ref_id: 5.4.4.B
      assessable: false
      depth: 2
      name: Vigencia del informe anual
      description: El informe anual tiene validez desde el 1 de julio del año en curso hasta el 30 de junio siguiente,
        cuando debe estar presentado el nuevo informe.
      translations:
        en:
          name: Annual report validity
          description: The annual report is valid from July 1 of the current year through the following June 30,
            by which time the next report must have been submitted.
          annotation: 'ARG INNOVA editorial subdivision of section 5.4.4; the suffix is not in the standard. Source:
            5.4.4. PDF pages: 11.'
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-context
      annotation: 'Desglose editorial de ARG INNOVA de la sección 5.4.4; el sufijo no aparece en la norma. Fuente:
