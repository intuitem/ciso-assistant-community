    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.1.c
      ref_id: 5.1.C
      assessable: true
      depth: 2
      name: Inclusión de servicios de terceros
      description: 'Verificar que los servicios de terceros comprendidos en los ámbitos regulados están incluidos
        en la evaluación. La responsabilidad de cumplimiento permanece en la entidad afiliada.


        Aplicabilidad: Cuando se utilicen servicios de terceros dentro del ámbito.'
      translations:
        en:
          name: Inclusion of third-party services
          description: 'Verify that third-party services within the regulated scope are included in the assessment.
            Compliance responsibility remains with the member entity.


            Applicability: When third-party services are used within scope.'
          annotation: 'ARG INNOVA editorial subdivision of section 5.1; the suffix is not in the standard. Source:
            5.1. PDF pages: 8. Record evidence, responsible person and date in available assessment fields or comments.
            Do not enter numeric scores. Leave unreviewed or future-stage items unassessed.'
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-preparation
