    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.4.4.f
      ref_id: 5.4.4.F
      assessable: false
      depth: 2
      name: Vigencia del primer informe
      description: Para una entidad que se afilia, el informe tiene validez desde la aceptación del BCCR hasta el
        próximo 30 de junio.
      translations:
        en:
          name: First report validity
          description: For an applicant, the report is valid from BCCR acceptance through the next June 30.
          annotation: 'ARG INNOVA editorial subdivision of section 5.4.4; the suffix is not in the standard. Source:
            5.4.4. PDF pages: 11.'
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-context
      annotation: 'Desglose editorial de ARG INNOVA de la sección 5.4.4; el sufijo no aparece en la norma. Fuente:
        5.4.4. Páginas PDF: 11.'
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.4.5.g
      ref_id: 5.4.5.G
      assessable: false
      depth: 2
      name: Consecuencias de incumplimiento persistente
      description: Agotadas las opciones y plazos sin subsanar incumplimientos, no se autoriza la afiliación del
        solicitante. Para afiliados, se informa a máximas autoridades y supervisor; según impacto, BCCR puede ordenar
        un proceso sancionatorio. Estas son consecuencias regulatorias, no acciones que deba ejecutar la entidad
        como checklist.
      translations:
        en:
          name: Consequences of persistent noncompliance
          description: After options and deadlines are exhausted without resolution, an applicant is not authorized
            to join. For members, highest authorities and supervisor are informed; depending on impact, BCCR may
            order sanction proceedings. These are regulatory consequences, not checklist actions for the entity.
          annotation: 'ARG INNOVA editorial subdivision of section 5.4.5; the suffix is not in the standard. Source:
            5.4.5. PDF pages: 12.'
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-context
      annotation: 'Desglose editorial de ARG INNOVA de la sección 5.4.5; el sufijo no aparece en la norma. Fuente:
        5.4.5. Páginas PDF: 12.'
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:7.x
      ref_id: 7.X
      assessable: false
      depth: 2
      name: Anexos adicionales permitidos
      description: Se pueden incluir documentos adicionales relevantes con evidencia de las pruebas u otros elementos
        pertinentes. Es una posibilidad, no una obligación general adicional; los atestados exigidos en 5.4.2 siguen
        siendo obligatorios.
      translations:
        en:
          name: Permitted additional annexes
          description: Additional relevant documents with test evidence or other pertinent items may be included.
            This is permission, not an additional general obligation; credentials required by 5.4.2 remain mandatory.
          annotation: 'ARG INNOVA editorial subdivision of section 7; the suffix is not in the standard. Source:
            7: Anexos. PDF pages: 28.'
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-context
      annotation: 'Desglose editorial de ARG INNOVA de la sección 7; el sufijo no aparece en la norma. Fuente: 7:
        Anexos. Páginas PDF: 28.'
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.a
      ref_id: 5.A
      assessable: false
      depth: 2
      name: Revisión anual y avisos de ajustes
      description: BCCR revisará la norma anualmente y notificará ajustes en diciembre, con vigencia para el siguiente
        período de evaluación. Es actividad del regulador, no obligación adicional del afiliado.
      translations:
        en:
          name: Annual review and adjustment notices
          description: BCCR will review the standard annually and notify adjustments in December, effective for
            the next assessment period. This is a regulator activity, not an additional member obligation.
          annotation: 'ARG INNOVA editorial subdivision of section 5; the suffix is not in the standard. Source:
            5; 5.2. PDF pages: 8-9.'
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-context
      annotation: 'Desglose editorial de ARG INNOVA de la sección 5; el sufijo no aparece en la norma. Fuente: 5;
        5.2. Páginas PDF: 8-9.'
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.2.a
      ref_id: 5.2.A
      assessable: false
      depth: 2
      name: Actualización de controles y requerimientos
      description: Los controles, su nivel de cumplimiento y los requerimientos pueden cambiar según el entorno
        de ciberseguridad. Conservar la referencia de edición utilizada. Esta nota es contexto, no un control adicional.
      translations:
        en:
          name: Updates to controls and requirements
          description: Controls, their compliance level and requirements may change with cybersecurity conditions.
            Retain the reference to the edition used. This is context, not an additional control.
          annotation: 'ARG INNOVA editorial subdivision of section 5.2; the suffix is not in the standard. Source:
            5; 5.2. PDF pages: 8-9.'
