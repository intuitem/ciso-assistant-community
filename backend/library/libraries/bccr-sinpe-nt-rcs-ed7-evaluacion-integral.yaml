    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.2.3.a
      ref_id: 5.2.3.A
      assessable: true
      depth: 2
      name: Exclusión de controles no aplicables
      description: Verificar que los controles clasificados como no aplicables a la categoría de conexión no se
        evalúan. No confundir esta exclusión con el incumplimiento de un control obligatorio.
      translations:
        en:
          name: Exclusion of non-applicable controls
          description: Verify that controls classified as not applicable to the connection category are not assessed.
            Do not confuse this exclusion with noncompliance with a mandatory control.
          annotation: 'ARG INNOVA editorial subdivision of section 5.2.3; the suffix is not in the standard. Source:
            5.2.2-5.2.3. PDF pages: 9. Record evidence, responsible person and date in available assessment fields
