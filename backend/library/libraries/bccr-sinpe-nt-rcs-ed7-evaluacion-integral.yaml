      ref_id: 5.3.2.B
      assessable: true
      depth: 2
      name: Transición a servicios de categoría 1
      description: 'Antes de la autorización para nuevos servicios con web services, verificar el cumplimiento de
        requisitos y del proceso de revisión de categoría 1.


        Aplicabilidad: Entidad de categoría 2 que solicita nuevos servicios con web services.'
      translations:
        en:
          name: Transition to Category 1 services
          description: 'Before authorization for new web-service-based services, verify compliance with Category
            1 requirements and its review process.


            Applicability: Category 2 entity requesting new web-service-based services.'
          annotation: 'ARG INNOVA editorial subdivision of section 5.3.2; the suffix is not in the standard. Source:
            5.3.2. PDF pages: 10. Record evidence, responsible person and date in available assessment fields or
            comments. Do not enter numeric scores. Leave unreviewed or future-stage items unassessed.'
