      ref_id: 5.3.2.A
      assessable: true
      depth: 2
      name: Clasificación de acceso directo sin web services
      description: 'Verificar que la clasificación en categoría 2 corresponde a una entidad que no utiliza servicios
        expuestos por web services y accede directamente desde la terminal SINPE.


        Aplicabilidad: Cuando se utilice categoría 2.'
      translations:
        en:
          name: Classification of direct access without web services
          description: 'Verify that Category 2 classification corresponds to an entity using no web-service-exposed
            services and accessing SINPE directly from its terminal.


            Applicability: When Category 2 is used.'
          annotation: 'ARG INNOVA editorial subdivision of section 5.3.2; the suffix is not in the standard. Source:
            5.3.2. PDF pages: 10. Record evidence, responsible person and date in available assessment fields or
            comments. Do not enter numeric scores. Leave unreviewed or future-stage items unassessed.'
