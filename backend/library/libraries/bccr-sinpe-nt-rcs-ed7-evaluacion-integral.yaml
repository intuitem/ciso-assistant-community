    requirement_nodes:
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-preparation
      assessable: false
      depth: 1
      name: Preparación y requisitos previos
      description: Agrupación editorial por etapa de la evaluación.
      translations:
        en:
          name: Preparation and prerequisites
          description: Editorial grouping by assessment stage.
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.1.a
      ref_id: 5.1.A
      assessable: true
      depth: 2
      name: Cobertura del ámbito de evaluación
      description: Verificar que la evaluación incluye la plataforma requerida para operar con SINPE, servidores
        y equipos interconectados, usuarios y accesos al AIS, intercambio de datos AIS–plataforma de la entidad
        y equipos de conexión. Considerar las ampliaciones de alcance de cada control.
      translations:
        en:
          name: Assessment scope coverage
          description: Verify that assessment covers the platform needed to operate with SINPE, interconnected servers
            and equipment, users and AIS access, AIS–entity platform data exchange and connection equipment. Consider
            scope extensions in individual controls.
          annotation: 'ARG INNOVA editorial subdivision of section 5.1; the suffix is not in the standard. Source:
            2; 3 (AIS); 5.1. PDF pages: 5-8. Record evidence, responsible person and date in available assessment
            fields or comments. Do not enter numeric scores. Leave unreviewed or future-stage items unassessed.'
      parent_urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:stage-preparation
      annotation: 'Desglose editorial de ARG INNOVA de la sección 5.1; el sufijo no aparece en la norma. Fuente:
        2; 3 (AIS); 5.1. Páginas PDF: 5-8. Registrar evidencia, responsable y fecha en los campos disponibles o
        comentarios de la evaluación. No ingresar puntuación numérica. Si falta revisión o la etapa está pendiente,
        mantener sin evaluar.'
      implementation_groups:
      - checklist-preparation
      questions:
        urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.1.a:question:resultado:
          type: unique_choice
          text: Resultado del checklist
          required: true
          translations:
            en:
              text: Checklist result
          choices:
          - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.1.a:question:resultado:choice:cumple
            value: Cumple
            compute_result: compliant
            translations:
              en:
                value: Compliant
          - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.1.a:question:resultado:choice:no-cumple
            value: No cumple
            compute_result: non_compliant
            translations:
              en:
                value: Noncompliant
    - urn: urn:arg-innova:risk:req_node:bccr-sinpe-nt-rcs-ed7-integral:5.1.b
      ref_id: 5.1.B
      assessable: true
      depth: 2
      name: Alcance completo de 6.8 y 6.9
      description: 'Verificar que los controles 6.8 y 6.9 abarcan toda la plataforma tecnológica de la entidad y
        no únicamente el AIS. Referencia adicional: sección 2.'
      translations:
        en:
          name: Full scope of 6.8 and 6.9
          description: 'Verify that controls 6.8 and 6.9 cover the entity’s entire technology platform, not only
            AIS. Additional reference: section 2.'
          annotation: 'ARG INNOVA editorial subdivision of section 5.1; the suffix is not in the standard. Source:
            2; 6.8; 6.9. PDF pages: 6. Record evidence, responsible person and date in available assessment fields
            or comments. Do not enter numeric scores. Leave unreviewed or future-stage items unassessed.'
