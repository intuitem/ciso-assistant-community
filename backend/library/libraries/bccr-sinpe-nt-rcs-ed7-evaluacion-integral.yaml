    implementation_groups_definition:
    - ref_id: cat1
      name: Categoría 1 — todos los controles aplicables
      description: '47 controles: 43 obligatorios y 4 opcionales. Los opcionales permanecen visibles y no se convierten
        en obligatorios. No combinar con categoría 2.'
      default_selected: true
      translations:
        en:
          name: Category 1 — all applicable controls
          description: '47 controls: 43 mandatory and 4 optional. Optional controls remain visible and do not become
            mandatory. Do not combine with category 2.'
    - ref_id: cat2
      name: Categoría 2 — todos los controles aplicables
      description: '39 controles: 29 obligatorios y 10 opcionales. Excluye 8 no aplicables. No combinar con categoría
        1.'
      default_selected: false
      translations:
        en:
          name: Category 2 — all applicable controls
          description: '39 controls: 29 mandatory and 10 optional. Excludes 8 non-applicable controls. Do not combine
            with category 1.'
    - ref_id: checklist-preparation
      name: Preparación y requisitos previos
      description: Checklist procedimental de la etapa. Usar No aplica solo cuando la condición indicada no concurra;
        dejar pendiente lo aún no revisado.
      default_selected: true
      translations:
        en:
          name: Preparation and prerequisites
          description: Procedural stage checklist. Use Not applicable only when its stated condition is absent;
            leave unreviewed items pending.
    - ref_id: checklist-report
