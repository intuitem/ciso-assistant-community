urn: urn:intuitem:risk:library:asd-essentials-enterprise-it
locale: en
ref_id: ASD Essentials for enterprise IT
name: ASD Essentials for enterprise IT
description: |-
  The ASD Essentials for enterprise IT helps organisations protect enterprise IT environments from sophisticated cyber threats. It replaces the Essential Eight. Principles describe the security outcomes, actions what to do to achieve them, and domains where the actions apply: six technical domains, sequenced by priority phase, and two capability domains that apply across all phases.

  Each action is rated separately in each domain it applies to, so it appears under each of its domains. Rate it from its Indicators of Good Practice: fully effective = compliant, partially effective = partially compliant, not effective = non compliant.

  Select the priority phases to assess when creating an audit, for example 1 and 2 for the first two phases: each phase covers its own domains and the capability domains.

  Assessment (ASD Essentials assessment process guide): a principle is rated, in each domain, by its lowest applicable action rating, and not assessed while any applicable action is not assessed. Each domain reports its principles at each rating and a percentage: not effective 0, partially effective 0.5, fully effective 1, summed and divided by the number of applicable principles.
  https://www.cyber.gov.au/essentials/essentials-for-enterprise-it
copyright: © Commonwealth of Australia 2026. Material from cyber.gov.au is provided under a Creative Commons
  Attribution 4.0 International licence and is attributed to the Australian Signals Directorate.
version: 1
publication_date: '2026-11-05'
provider: Australian Signals Directorate (ASD)
packager: intuitem
objects:
  framework:
    urn: urn:intuitem:risk:framework:asd-essentials-enterprise-it
    ref_id: ASD Essentials for enterprise IT
    name: ASD Essentials for enterprise IT
    description: |-
      The ASD Essentials for enterprise IT helps organisations protect enterprise IT environments from sophisticated cyber threats. It replaces the Essential Eight. Principles describe the security outcomes, actions what to do to achieve them, and domains where the actions apply: six technical domains, sequenced by priority phase, and two capability domains that apply across all phases.

      Each action is rated separately in each domain it applies to, so it appears under each of its domains. Rate it from its Indicators of Good Practice: fully effective = compliant, partially effective = partially compliant, not effective = non compliant.

      Select the priority phases to assess when creating an audit, for example 1 and 2 for the first two phases: each phase covers its own domains and the capability domains.

      Assessment (ASD Essentials assessment process guide): a principle is rated, in each domain, by its lowest applicable action rating, and not assessed while any applicable action is not assessed. Each domain reports its principles at each rating and a percentage: not effective 0, partially effective 0.5, fully effective 1, summed and divided by the number of applicable principles.
      https://www.cyber.gov.au/essentials/essentials-for-enterprise-it
    implementation_groups_definition:
    - ref_id: '1'
      name: Priority phase 1
      description: Boundary services and identity services, with the capability domains.
    - ref_id: '2'
      name: Priority phase 2
      description: Critical processes and services and privileged environments, with the capability domains.
    - ref_id: '3'
      name: Priority phase 3
      description: Business systems and user devices, with the capability domains.
    outcomes_definition:
    - ref_id: effectiveness
      kind: weakest_link
      label: Effectiveness
      rated_depth: 2
      per: depth_1
      result_labels:
        compliant: Fully effective
        partially_compliant: Partially effective
        non_compliant: Not effective
      section_label: domains
      annotation: 'A principle is rated in each domain by its lowest applicable action, and is not assessed
        while one of them is. Each domain scores its applicable principles: fully effective 1, partially
        effective 0.5, not effective and not assessed 0, averaged as a percentage. A domain with nothing
        assessed has no score.'
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      assessable: false
      depth: 1
      name: Governance and culture
      description: Policies, risk management processes, roles and security culture that underpin the cyber
        security program.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      ref_id: GOV-01
      name: Executive cyber security accountability
      description: The board of directors or executive committee is accountable for cyber security.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-01:it.gov-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-01
      ref_id: IT.GOV-01.1
      description: Formally define and establish executive and board-level accountabilities for cyber
        security, including setting, monitoring and adjusting organisational risk appetite, and review
        these accountabilities at a defined cadence.
      annotation: |-
        Not effective:
        - IT.GOV-01.1.NE-1: No named executive or board member is accountable for cyber security.
        - IT.GOV-01.1.NE-2: Cyber security accountability exists only informally, or is assumed rather than documented.
        - IT.GOV-01.1.NE-3: No evidence of cyber security reporting to the executive board.
        - IT.GOV-01.1.NE-4: Organisational risk appetite is not set.

        Partially effective:
        - IT.GOV-01.1.PE-1: A named executive or board member is accountable for cyber security, but reporting obligations are not formally defined.
        - IT.GOV-01.1.PE-2: Board-level reporting on cyber security occurs but is ad hoc rather than on a defined schedule.
        - IT.GOV-01.1.PE-3: Accountability is documented but has not been reviewed within the organisationally defined cadence or following relevant organisational restructuring or leadership changes.
        - IT.GOV-01.1.PE-4: Organisational risk appetite is set but is not monitored or adjusted over time.

        Fully effective:
        - IT.GOV-01.1.FE-1: A named executive or board member has documented accountability for cyber security with defined reporting obligations.
        - IT.GOV-01.1.FE-2: Regular reporting to the board or executives occurs on a defined cadence with evidence of reporting artefacts.
        - IT.GOV-01.1.FE-3: Accountability arrangements are reviewed when organisational structures or leadership changes occur.
        - IT.GOV-01.1.FE-4: Organisational risk appetite is set and is monitored and adjusted over time as required.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-08
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      ref_id: GOV-08
      name: Executive artificial intelligence accountability
      description: The board of directors or executive committee is accountable for ensuring that artificial
        intelligence is secure, controllable, human-supervised and used in an ethical and accountable
        manner.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-08:it.gov-08.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-08
      ref_id: IT.GOV-08.1
      description: Establish and maintain executive accountability for the use, governance and risk management
        of artificial intelligence within the organisation.
      annotation: |-
        Not effective:
        - IT.GOV-08.1.NE-1: No named executive is accountable for the use, governance or risk management of artificial intelligence.
        - IT.GOV-08.1.NE-2: Artificial intelligence is used within the organisation with no approval, risk assessment or oversight.
        - IT.GOV-08.1.NE-3: Artificial intelligence related risks are not reflected in the organisation’s risk register.
        - IT.GOV-08.1.NE-4: Artificial intelligence use and governance arrangements have not been reviewed within the schedule defined by the organisation.

        Partially effective:
        - IT.GOV-08.1.PE-1: A named executive is accountable for artificial intelligence but the governance process is informal or undocumented.
        - IT.GOV-08.1.PE-2: Approval and risk assessment occur for some artificial intelligence use cases but coverage is inconsistent across internally developed, third-party and embedded artificial intelligence.
        - IT.GOV-08.1.PE-3: Some artificial intelligence related risks are recorded but the organisation’s risk register does not capture all known artificial intelligence use cases.
        - IT.GOV-08.1.PE-4: Reviews occur within the schedule defined by the organisation, but do not consistently address changes in artificial intelligence capability, threat environment or organisational use.

        Fully effective:
        - IT.GOV-08.1.FE-1: A named executive has accountability for artificial intelligence, supported by an approved governance process that has evidence of being followed.
        - IT.GOV-08.1.FE-2: The governance process addresses approval, risk assessment and oversight for internally developed, third-party and embedded artificial intelligence use cases.
        - IT.GOV-08.1.FE-3: Artificial intelligence related risks are reflected in the organisation’s risk register and reported through standard governance channels.
        - IT.GOV-08.1.FE-4: Reviews of artificial intelligence use and governance arrangements are conducted on a schedule defined by the organisation and consistently address changes in artificial intelligence capability, threat environment or organisational use.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      ref_id: GOV-04
      name: Cyber security resourcing
      description: Suitable and sufficient personnel and resources are identified, acquired and maintained
        in support of cyber security activities.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-04:it.gov-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-04
      ref_id: IT.GOV-04.1
      description: Assign sufficient cyber security personnel and resources with the required skills to
        operate, monitor, maintain and manage the lifecycle of security controls and define cyber security
        responsibilities within role descriptions.
      annotation: |-
        Not effective:
        - IT.GOV-04.1.NE-1: Cyber security functions are staffed on an ad hoc basis without reference to required skills or capacity.
        - IT.GOV-04.1.NE-2: Critical cyber security roles are unfilled with no approved recruitment plan.
        - IT.GOV-04.1.NE-3: No resourcing plan for cyber security personnel exists.

        Partially effective:
        - IT.GOV-04.1.PE-1: Some critical roles are filled but identified skills gaps have no plan for remediation.
        - IT.GOV-04.1.PE-2: While assigned personnel provide some capability, there are gaps in capacity, resources, or expertise that hinder the operation, monitoring, maintenance, and lifecycle management of controls.
        - IT.GOV-04.1.PE-3: A resourcing plan exists but does not cover all required cyber security functions.
        - IT.GOV-04.1.PE-4: Outstanding cyber security positions are being actively recruited, but capacity or skills gaps remain.

        Fully effective:
        - IT.GOV-04.1.FE-1: Sufficient cyber security personnel are assigned to operate, monitor, maintain and manage the lifecycle of controls across the organisation.
        - IT.GOV-04.1.FE-2: Skills gaps are identified and addressed through recruitment, training or contracted services.
        - IT.GOV-04.1.FE-3: A resourcing plan identifies all required cyber security personnel, roles, skills, resources and capacity.
        - IT.GOV-04.1.FE-4: Cyber security responsibilities are defined within applicable role descriptions.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-04:it.gov-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-04
      ref_id: IT.GOV-04.2
      description: Periodically review cyber security resourcing against cyber threat trends, cyber security
        incident outcomes and organisational changes.
      annotation: |-
        Not effective:
        - IT.GOV-04.2.NE-1: No review of cyber security resourcing has been conducted.
        - IT.GOV-04.2.NE-2: Resourcing has not been reassessed following significant organisational or threat landscape changes.

        Partially effective:
        - IT.GOV-04.2.PE-1: A review has been conducted but did not reference current threat trends, cyber security incident outcomes, or organisational changes.
        - IT.GOV-04.2.PE-2: Review outcomes have identified required adjustments, but those adjustments have not been made.

        Fully effective:
        - IT.GOV-04.2.FE-1: A resourcing review has been completed within the review period defined by the organisation.
        - IT.GOV-04.2.FE-2: The review references current threat trends, cyber security incident outcomes and organisational changes.
        - IT.GOV-04.2.FE-3: Documented review outcomes include resourcing adjustments that are implemented within timeframes defined by the organisation, or formally risk accepted by an appropriate authority.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-03
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      ref_id: GOV-03
      name: Security risk management assurance
      description: Security risk management activities for an organisation and their systems (infrastructure,
        operating systems, applications and data) are embedded into organisational risk management frameworks
        and subject to ongoing monitoring and assurance activities by the board of directors or executive
        committee.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-03:it.gov-03.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-03
      ref_id: IT.GOV-03.1
      description: Establish and maintain an approved risk management methodology and plan that is used
        to assess and treat cyber security risks.
      annotation: |-
        Not effective:
        - IT.GOV-03.1.NE-1: No risk management methodology approved by the organisation is in place.
        - IT.GOV-03.1.NE-2: No current organisational risk register exists, or the register has not been reviewed within the cycle defined by the organisation.
        - IT.GOV-03.1.NE-3: Risk treatment decisions are not documented.

        Partially effective:
        - IT.GOV-03.1.PE-1: An approved risk management methodology exists but risk assessments have not been conducted within the defined cycle.
        - IT.GOV-03.1.PE-2: A risk register exists but treatment plans are incomplete or have not been actioned.
        - IT.GOV-03.1.PE-3: Risk assessments have been conducted but do not cover all in-scope assets.

        Fully effective:
        - IT.GOV-03.1.FE-1: An approved risk management methodology and plan are in place and used to assess and treat security risks.
        - IT.GOV-03.1.FE-2: A current risk register exists with documented and implemented treatment plans for all identified risks.
        - IT.GOV-03.1.FE-3: Risk assessments have been conducted or reviewed within the assessment cycle defined by the organisation.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-11
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      ref_id: GOV-11
      name: Supplier cyber security assurance
      description: Systems (infrastructure, operating systems, applications and data) are delivered and
        supported by trustworthy suppliers whose cyber security practices are regularly verified or otherwise
        risk-assessed.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-11:it.gov-11.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-11
      ref_id: IT.GOV-11.1
      description: Select and engage suppliers of software, hardware and services on the basis of a cyber
        supply chain risk assessment proportionate to the risk the supplier introduces, and retain appropriate
        assurance evidence to support the decision.
      annotation: |-
        Not effective:
        - IT.GOV-11.1.NE-1: No documented or approved governance process exists for evaluating the cyber security trustworthiness of suppliers.
        - IT.GOV-11.1.NE-2: No cyber security evaluation is performed before suppliers are onboarded.
        - IT.GOV-11.1.NE-3: Evaluation outcomes are not documented.
        - IT.GOV-11.1.NE-4: Findings from supplier evaluation outcomes are not used to inform supplier approval, contractual requirements or risk treatment decisions where concerns are identified.

        Partially effective:
        - IT.GOV-11.1.PE-1: An evaluation process exists but is not consistently applied to all suppliers within scope.
        - IT.GOV-11.1.PE-2: Evaluation is performed for some suppliers, but criteria are not documented or are inconsistently applied.
        - IT.GOV-11.1.PE-3: Outcomes are documented but contractual arrangements do not reflect identified risks or required controls.

        Fully effective:
        - IT.GOV-11.1.FE-1: A documented and approved governance process is in place and consistently applied.
        - IT.GOV-11.1.FE-2: Cyber security trustworthiness evaluations are performed for all suppliers within scope prior to onboarding.
        - IT.GOV-11.1.FE-3: Evaluation criteria are documented, approved and proportionate to the criticality of what the supplier delivers.
        - IT.GOV-11.1.FE-4: Evaluation outcomes are documented, reflected in contractual arrangements and recorded in the organisation’s risk register where residual risk remains.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-11:it.gov-11.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-11
      ref_id: IT.GOV-11.2
      description: Maintain current assurance that suppliers continue to meet their cyber security commitments,
        and act when that assurance lapses or the supplier’s risk changes.
      annotation: |-
        Not effective:
        - IT.GOV-11.2.NE-1: No process exists to obtain and risk-assess current supplier assurance evidence proportionate to supplier criticality and risk.
        - IT.GOV-11.2.NE-2: No documented and approved governance process exists for maintaining assurance that suppliers meet their cyber security commitments.
        - IT.GOV-11.2.NE-3: No actions are taken when supplier cyber security assurance lapses or supplier risk changes.

        Partially effective:
        - IT.GOV-11.2.PE-1: Supplier assurance evidence is obtained for some suppliers, but coverage is incomplete or the evidence is not reviewed and actioned.
        - IT.GOV-11.2.PE-2: Some findings are actioned but the response process is informal or inconsistent.
        - IT.GOV-11.2.PE-3: A process exists but acceptable forms and currency of assurance evidence are not defined or applied consistently.

        Fully effective:
        - IT.GOV-11.2.FE-1: Current assurance evidence is obtained from suppliers in proportion to their criticality and risk, and is reviewed for findings that affect the organisation.
        - IT.GOV-11.2.FE-2: Material concerns are addressed through contractual remediation, compensating controls or supplier substitution within defined timeframes.
        - IT.GOV-11.2.FE-3: A documented and approved governance process specifies the acceptable forms, scope and currency of supplier assurance evidence.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-14
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      ref_id: GOV-14
      name: Legacy system management
      description: Systems (infrastructure, operating systems, applications and data) that are not capable
        of meeting cyber security requirements are managed using compensating security controls, along
        with enhanced monitoring and assurance activities, to maintain an acceptable level of residual
        risk until they can be decommissioned or replaced.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-14:it.gov-14.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:gov-14
      ref_id: IT.GOV-14.1
      description: Establish and maintain a process for identifying, assessing and treating cyber security
        risks associated with legacy systems and unsupported technologies through compensating controls,
        enhanced monitoring and assurance until the systems can be removed or replaced.
      annotation: |-
        Not effective:
        - IT.GOV-14.1.NE-1: No documented or approved governance process exists for identifying or managing legacy systems.
        - IT.GOV-14.1.NE-2: Legacy systems are not formally identified within the environment.
        - IT.GOV-14.1.NE-3: Cyber security risks associated with legacy systems are not assessed or are assessed informally.
        - IT.GOV-14.1.NE-4: There are no interim compensating controls to manage identified cyber security risks associated with legacy systems.
        - IT.GOV-14.1.NE-5: Legacy systems remain in operation indefinitely with no documented decommissioning, replacement or migration path.

        Partially effective:
        - IT.GOV-14.1.PE-1: A process exists but the criteria for classifying a system as legacy are not documented or are inconsistently applied.
        - IT.GOV-14.1.PE-2: Some legacy systems are identified but the inventory is incomplete or is not maintained.
        - IT.GOV-14.1.PE-3: Risk assessments are conducted for some legacy systems but treatment decisions are not documented or approved.
        - IT.GOV-14.1.PE-4: Some compensating controls are in place to address risks associated with legacy systems, but coverage is not complete.
        - IT.GOV-14.1.PE-5: A path exists for some legacy systems but is not tracked to completion.

        Fully effective:
        - IT.GOV-14.1.FE-1: A documented and approved governance process exists with clear criteria for classifying systems as legacy.
        - IT.GOV-14.1.FE-2: Legacy systems are formally identified, inventoried and reviewed on a cycle defined by the organisation.
        - IT.GOV-14.1.FE-3: Cyber security risks associated with legacy systems are assessed, treated and approved by an appropriate authority.
        - IT.GOV-14.1.FE-4: Compensating controls are applied to manage cyber security risks for legacy systems while decommissioning or migration efforts are in progress.
        - IT.GOV-14.1.FE-5: A documented decommissioning, replacement or migration path exists for retained legacy systems and is tracked to completion.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:pro-14
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture
      ref_id: PRO-14
      name: Cyber security awareness training
      description: Personnel are provided with ongoing cyber security awareness training, including operational
        security considerations, tailored to their duties, access levels and current cyber threats.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:pro-14:it.pro-14.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:governance-and-culture:pro-14
      ref_id: IT.PRO-14.2
      description: Update and provide cyber security awareness training on a regular basis to reflect
        current threats and operational considerations.
      annotation: |-
        Not effective:
        - IT.PRO-14.2.NE-1: No cyber security awareness training program exists.
        - IT.PRO-14.2.NE-2: Cyber security awareness training is not reviewed or updated after initial deployment.
        - IT.PRO-14.2.NE-3: Lessons learnt from cyber security incidents are not incorporated into training content.
        - IT.PRO-14.2.NE-4: The cadence of review is not defined.

        Partially effective:
        - IT.PRO-14.2.PE-1: Training is reviewed but updates do not reflect current threat intelligence, sector relevant adversary techniques or organisational changes.
        - IT.PRO-14.2.PE-2: Some lessons are incorporated but the process is informal, or coverage is limited to a small number of incidents.
        - IT.PRO-14.2.PE-3: Some changes are reflected, but training is not updated to address recently introduced systems or significant changes to working arrangements.
        - IT.PRO-14.2.PE-4: A review cadence exists, but is not consistently met, or is not proportionate to the rate of change.

        Fully effective:
        - IT.PRO-14.2.FE-1: Training content is reviewed and updated on a defined cycle, with updates reflecting current threat intelligence, adversary techniques relevant to the workforce and organisation’s operating context.
        - IT.PRO-14.2.FE-2: Lessons learnt from cyber security incidents within the organisation or its sector are systematically incorporated into training content.
        - IT.PRO-14.2.FE-3: Training reflects the systems, platforms and working arrangements that personnel currently interact with, including newly introduced platforms and changes to ways of working.
        - IT.PRO-14.2.FE-4: The cadence of review is defined, proportionate to the rate of change in the threat environment, and consistently met.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      assessable: false
      depth: 1
      name: Visibility and response
      description: Procedures and capabilities for detecting, analysing and responding to cyber security
        events and incidents.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:ide-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: IDE-01
      name: Asset identification
      description: Systems (infrastructure, operating systems, applications, identities, credentials and
        data) are continually and centrally identified and documented.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:ide-01:it.ide-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:ide-01
      ref_id: IT.IDE-01.1
      description: Use an approved asset inventory mechanism that supports automated discovery to detect
        new and changed physical and non-physical assets.
      annotation: |-
        Not effective:
        - IT.IDE-01.1.NE-1: No approved asset inventory mechanism is in place.
        - IT.IDE-01.1.NE-2: Asset inventory records are maintained manually with no automated discovery capability.

        Partially effective:
        - IT.IDE-01.1.PE-1: An approved asset inventory mechanism is deployed but does not cover all network segments or asset types.
        - IT.IDE-01.1.PE-2: Automated discovery scans to detect new and changed physical and non-physical assets occur on a schedule but reconciliation with the approved inventory is manual or inconsistent.

        Fully effective:
        - IT.IDE-01.1.FE-1: An approved asset inventory mechanism which supports automated discovery is deployed to cover all applicable assets and network segments.
        - IT.IDE-01.1.FE-2: Discovery runs on a regular schedule defined by the organisation and new or changed physical or non-physical assets that are detected are reconciled with the approved inventory.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:ide-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: IDE-04
      name: Security risk identification
      description: Security risks for an organisation and their systems (infrastructure, operating systems,
        applications and data) are identified, including by using current strategic and sector-specific
        cyber threat intelligence and threat modelling, and are documented along with any associated risk
        management decisions.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:ide-04:it.ide-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:ide-04
      ref_id: IT.IDE-04.1
      description: Identify relevant weaknesses, malicious actor techniques and cyber threat behaviours
        when undertaking risk assessments and review these inputs on a continuous basis.
      annotation: |-
        Not effective:
        - IT.IDE-04.1.NE-1: Risk assessments do not reference relevant weaknesses, malicious actor techniques and cyber threat behaviours.
        - IT.IDE-04.1.NE-2: No process exists to incorporate threat information into risk assessment activities.
        - IT.IDE-04.1.NE-3: Current weaknesses, malicious actor techniques and cyber threat behaviours that are relevant to the organisation are not reviewed or updated.

        Partially effective:
        - IT.IDE-04.1.PE-1: Risk assessments reference threat intelligence but coverage is limited to well-known or generic threats.
        - IT.IDE-04.1.PE-2: Threat information is considered but not systematically mapped to organisational assets or detection gaps.
        - IT.IDE-04.1.PE-3: Current weaknesses, malicious actor techniques and cyber threat behaviours that are relevant to the organisation are reviewed or updated, but are not used to inform risk assessments or are reviewed only on an ad hoc basis.

        Fully effective:
        - IT.IDE-04.1.FE-1: Risk assessments incorporate and reference relevant weaknesses, malicious actor techniques relevant to the sector, and cyber threat behaviours.
        - IT.IDE-04.1.FE-2: Relevant weaknesses, malicious actor techniques and cyber threat behaviours are systematically related to applicable assets and used to inform risk treatment decisions.
        - IT.IDE-04.1.FE-3: Current weaknesses, malicious actor techniques and cyber threat behaviours relevant to the organisation are reviewed or updated on a continuous basis at a frequency that enables noted changes to inform risk assessments.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:pro-13
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: PRO-13
      name: Identity, credential and access management
      description: Robust and secure identity, credential and access management is used to establish,
        maintain and control access to systems (infrastructure, operating systems, applications and data)
        and to support effective detection of identity and credential misuse.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:pro-13:it.pro-13.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:pro-13
      ref_id: IT.PRO-13.3
      description: Identify and remediate unsecured keys, secrets and credentials by regularly scanning
        codebases, configuration files, file shares and user collaboration platforms.
      annotation: |-
        Not effective:
        - IT.PRO-13.3.NE-1: No secret scanning capability is deployed.
        - IT.PRO-13.3.NE-2: No process exists to identify credentials exposed in codebases, configuration files, file shares or user collaboration platforms.
        - IT.PRO-13.3.NE-3: Unsecured keys, secrets and credentials found exposed in codebases, configuration files, scripts, file shares or user collaboration platforms are left in place with no action taken.

        Partially effective:
        - IT.PRO-13.3.PE-1: Secret scanning is deployed but does not cover all repositories, pipelines or user collaboration platforms.
        - IT.PRO-13.3.PE-2: Scanning runs but discovered credentials are not assessed in a timely manner.
        - IT.PRO-13.3.PE-3: Unsecured keys, secrets and credentials that are discovered are assessed, but are not rotated or revoked in a timely manner.

        Fully effective:
        - IT.PRO-13.3.FE-1: Secret scanning tooling is deployed across codebases, configuration files, file shares and user collaboration platforms.
        - IT.PRO-13.3.FE-2: Scans to identify unsecured keys, secrets and credentials run on a regular schedule defined by the organisation.
        - IT.PRO-13.3.FE-3: Unsecured keys, secrets and credentials that are discovered are assessed, then rotated and/or revoked within timeframes defined by the organisation.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: DET-01
      name: Centralised event logging
      description: Security-relevant event logs and configuration changes for systems (infrastructure,
        operating systems, applications and data) are centrally collected, protected against unauthorised
        modification or deletion, and retained to support effective cyber security event detection and
        investigation.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-01:it.det-01.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-01
      ref_id: IT.DET-01.3
      description: Establish a centralised event log storage capability that protects logs from unauthorised
        access or modification.
      annotation: |-
        Not effective:
        - IT.DET-01.3.NE-1: No centralised capability exists for storing event logs collected from systems across the environment.
        - IT.DET-01.3.NE-2: Stored logs have no protection against modification or deletion by administrators of the systems generating them.
        - IT.DET-01.3.NE-3: Access to the centralised capability is not restricted, or access is granted to roles without a documented need.
        - IT.DET-01.3.NE-4: Log retention requirements are not defined.

        Partially effective:
        - IT.DET-01.3.PE-1: A centralised capability exists but does not receive logs from in-scope systems, or coverage is inconsistent.
        - IT.DET-01.3.PE-2: Stored logs are protected from modification, but the controls do not consistently prevent deletion, or controls are not applied to all log types.
        - IT.DET-01.3.PE-3: Access is restricted to a defined set of roles but access is not logged or monitored.
        - IT.DET-01.3.PE-4: A retention period is defined but is inconsistently applied, or some log types are retained for shorter periods than required.

        Fully effective:
        - IT.DET-01.3.FE-1: A centralised event log storage capability is in place for logs collected from in-scope systems.
        - IT.DET-01.3.FE-2: Stored logs are protected against unauthorised access, modification and deletion through technical controls including access restrictions, encryption at rest and integrity protection.
        - IT.DET-01.3.FE-3: Access to the centralised capability is restricted to security operations personnel and other roles with a documented need, with access logged and monitored.
        - IT.DET-01.3.FE-4: Log retention requirements are defined and aligned to investigative, regulatory and contractual obligations, with retention applied consistently across log types.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-02
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: DET-02
      name: Cyber security event detection
      description: Anomalous or unexpected events and behaviours for systems (infrastructure, operating
        systems, applications and data) are analysed in a timely manner to detect cyber security events.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-02:it.det-02.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-02
      ref_id: IT.DET-02.2
      description: Ensure detection logic identifies unauthorised changes, anomalous authentication activity
        and suspicious software execution.
      annotation: |-
        Not effective:
        - IT.DET-02.2.NE-1: No detection logic is deployed to identify unauthorised changes, anomalous authentication activity or suspicious software execution events originating from assets.
        - IT.DET-02.2.NE-2: Detection relies entirely on manual log review with no automated rules or alerting.

        Partially effective:
        - IT.DET-02.2.PE-1: Detection logic exists but does not cover all three categories (unauthorised changes, anomalous authentication, suspicious execution).
        - IT.DET-02.2.PE-2: Rules are deployed but are not tested or tuned on a regular cycle defined by the organisation.

        Fully effective:
        - IT.DET-02.2.FE-1: Detection logic is deployed, and unauthorised configuration changes, anomalous authentication patterns and suspicious process execution events are captured and produce alerts.
        - IT.DET-02.2.FE-2: Detection logic is tested and tuned on a regular cycle defined by the organisation to maintain effectiveness.
        - IT.DET-02.2.FE-3: Detection coverage is reviewed following cyber security incidents or significant environmental changes.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-03
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: DET-03
      name: Cyber security incident identification
      description: Cyber security events are analysed in a timely manner to identify cyber security incidents.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-03:it.det-03.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-03
      ref_id: IT.DET-03.1
      description: Triage alerts and events in a timely manner to determine whether cyber security incident
        thresholds have been met.
      annotation: |-
        Not effective:
        - IT.DET-03.1.NE-1: No documented triage process exists.
        - IT.DET-03.1.NE-2: Alerts are routinely ignored or left unreviewed.
        - IT.DET-03.1.NE-3: No incident severity thresholds are defined.

        Partially effective:
        - IT.DET-03.1.PE-1: A triage process exists but response times are not defined or consistently met.
        - IT.DET-03.1.PE-2: Severity thresholds are defined but escalation procedures are informal.

        Fully effective:
        - IT.DET-03.1.FE-1: A documented triage process with defined severity thresholds and response timeframes is in place.
        - IT.DET-03.1.FE-2: Alerts are triaged within the timeframes defined by the organisation and escalated where cyber security incident thresholds are met.
        - IT.DET-03.1.FE-3: Triage performance is tracked and reported.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-03:it.det-03.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-03
      ref_id: IT.DET-03.2
      description: Use indicators from across identities, applications, data and infrastructure activity
        rather than isolated signals when identifying cyber security incidents.
      annotation: |-
        Not effective:
        - IT.DET-03.2.NE-1: Investigation relies on single-source alerts with no cross-source correlation.
        - IT.DET-03.2.NE-2: Correlation rules do not consider signals from multiple data sources.

        Partially effective:
        - IT.DET-03.2.PE-1: Some correlation exists but is limited to specific data source pairs.
        - IT.DET-03.2.PE-2: Cross-source investigation is performed manually but not supported by automated correlation.

        Fully effective:
        - IT.DET-03.2.FE-1: Correlation rules and investigation procedures consider signals across identities, applications, data and infrastructure.
        - IT.DET-03.2.FE-2: Automated correlation supports detection of multi-stage adversary activity.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-05
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: DET-05
      name: Detection capability efficacy
      description: Cyber security event detection capabilities are regularly evaluated for effectiveness
        and continuously refined, including by using current strategic and sector-specific cyber threat
        intelligence, to improve the detection of cyber security events.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-05:it.det-05.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:det-05
      ref_id: IT.DET-05.1
      description: Review detection coverage periodically to identify gaps arising from new assets, services
        or architectural changes.
      annotation: |-
        Not effective:
        - IT.DET-05.1.NE-1: No review of detection coverage has been conducted within the period defined by the organisation.
        - IT.DET-05.1.NE-2: No process exists to assess new assets and services for log coverage or detection applicability.

        Partially effective:
        - IT.DET-05.1.PE-1: A review of detection coverage has been conducted but does not cover all recently deployed assets or services.
        - IT.DET-05.1.PE-2: Detection gaps have been identified and remediation is planned, but remediation has not been executed within timeframes defined by the organisation.

        Fully effective:
        - IT.DET-05.1.FE-1: A detection coverage review has been completed within the cycle defined by the organisation.
        - IT.DET-05.1.FE-2: New assets and services are assessed for log coverage and detection rule applicability.
        - IT.DET-05.1.FE-3: Identified detection gaps are remediated within risk-based timeframes defined by the organisation.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-05
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: RES-05
      name: Cyber security incident coordination
      description: Cyber security incident roles and responsibilities are defined, documented and exercised
        to support the internal and external coordination and management of cyber security incidents,
        including responsibilities for declaring cyber security incidents and undertaking pre-approved
        response and recovery activities.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-05:it.res-05.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-05
      ref_id: IT.RES-05.1
      description: Integrate external coordination obligations into cyber security incident response activities
        where required.
      annotation: |-
        Not effective:
        - IT.RES-05.1.NE-1: External coordination requirements for Cyber security incident response activities are neither identified nor documented.
        - IT.RES-05.1.NE-2: No defined triggers, contacts or timeframes exist for external reporting.

        Partially effective:
        - IT.RES-05.1.PE-1: External coordination requirements are documented but are not integrated into operational response procedures.
        - IT.RES-05.1.PE-2: Contacts and triggers are defined for some but not all required external parties.

        Fully effective:
        - IT.RES-05.1.FE-1: Cyber security incident response procedures include documented external coordination requirements with defined triggers, contacts and timeframes.
        - IT.RES-05.1.FE-2: Requirements cover all relevant external parties identified by applicable legal, regulatory, contractual and organisational obligations.
        - IT.RES-05.1.FE-3: Coordination procedures have been exercised or invoked and lessons learnt have been incorporated.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-03
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: RES-03
      name: Cyber security incident response
      description: Cyber security incidents are contained, eradicated and recovered from in a timely manner.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-03:it.res-03.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-03
      ref_id: IT.RES-03.1
      description: Use documented, tested and approved cyber security incident response procedures when
        responding to cyber security incidents.
      annotation: |-
        Not effective:
        - IT.RES-03.1.NE-1: No documented cyber security incident response plan or procedures exist.
        - IT.RES-03.1.NE-2: Incident response activities are conducted on an ad hoc basis without any defined roles, escalation paths, procedures or response objectives.
        - IT.RES-03.1.NE-3: Available incident records demonstrate systemic failures to contain, eradicate or recover from cyber security incidents within organisationally defined timeframes, and the causes of these failures are not addressed.

        Partially effective:
        - IT.RES-03.1.PE-1: A cyber security incident response plan exists but has not been exercised or invoked within the organisationally defined test cycle.
        - IT.RES-03.1.PE-2: The cyber security incident response plan defines roles, escalation paths, and response procedures, but target timeframes or intended response outcomes are not clearly defined.
        - IT.RES-03.1.PE-3: Incident records or exercise results demonstrate that response activities do not consistently meet organisationally defined timeframes or intended outcomes, but identified deficiencies are documented and subject to improvement actions.

        Fully effective:
        - IT.RES-03.1.FE-1: An approved cyber security incident response plan is in place and defines roles, escalation paths, response procedures, target timeframes and intended containment, eradication and recovery outcomes.
        - IT.RES-03.1.FE-2: The incident response plan and associated procedures have been exercised or invoked within the organisationally defined test cycle.
        - IT.RES-03.1.FE-3: Incident records demonstrate that cyber security incidents are contained, eradicated and recovered from within organisationally defined target timeframes and achieve the intended response outcomes, taking into account incident severity, complexity and business impact.
        - IT.RES-03.1.FE-4: Where target timeframes or intended outcomes are not achieved, the causes are analysed, improvement actions are assigned and tracked, and relevant plans, procedures and controls are updated.
        - IT.RES-03.1.FE-5: Where no relevant cyber security incident has occurred during the assessment period, appropriately scoped exercises demonstrate the organisation’s capability to achieve its target timeframes and intended response outcomes.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response
      ref_id: RES-04
      name: Cyber security incident insights
      description: Lessons learnt from cyber security incidents are captured, and areas for improvement
        are identified, prioritised and actioned in a timely manner.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-04:it.res-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-04
      ref_id: IT.RES-04.1
      description: Perform post-cyber security incident reviews to identify the security gaps that enabled
        each stage of the cyber security incident.
      annotation: |-
        Not effective:
        - IT.RES-04.1.NE-1: Post-incident reviews are not conducted.

        Partially effective:
        - IT.RES-04.1.PE-1: Post-incident reviews are conducted for some incidents but not all that meet the severity threshold defined by the organisation.
        - IT.RES-04.1.PE-2: Reviews are conducted but findings are not documented or actioned.

        Fully effective:
        - IT.RES-04.1.FE-1: Post-incident reviews are conducted for all incidents meeting the severity threshold defined by the organisation.
        - IT.RES-04.1.FE-2: Findings identify the specific gaps that enabled each stage of the incident.
        - IT.RES-04.1.FE-3: Remediation actions arising from findings are implemented and tracked to closure.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-04:it.res-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:visibility-and-response:res-04
      ref_id: IT.RES-04.2
      description: Evaluate the monitoring coverage and cyber security incident response procedures following
        cyber security incidents.
      annotation: |-
        Not effective:
        - IT.RES-04.2.NE-1: Detection rules, monitoring coverage and response procedures are not reviewed following incidents.

        Partially effective:
        - IT.RES-04.2.PE-1: Reviews are conducted but do not result in documented changes to detection or response capabilities.
        - IT.RES-04.2.PE-2: Some improvements are made but not systematically tracked or validated.

        Fully effective:
        - IT.RES-04.2.FE-1: Detection rules, monitoring coverage and cyber security incident response procedures are reviewed following incidents, with identified lessons incorporated into updates.
        - IT.RES-04.2.FE-2: Changes are documented, tested and validated for effectiveness.
      implementation_groups:
      - '1'
      - '2'
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      assessable: false
      depth: 1
      name: Boundary services
      description: Assets at network boundaries that broker connectivity between environments of different
        trust levels, including internet-facing services and edge devices.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:ide-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: IDE-01
      name: Asset identification
      description: Systems (infrastructure, operating systems, applications, identities, credentials and
        data) are continually and centrally identified and documented.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:ide-01:it.ide-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:ide-01
      ref_id: IT.IDE-01.2
      description: Maintain current records of infrastructure, operating systems, applications, identities,
        credentials and data assets.
      annotation: |-
        Not effective:
        - IT.IDE-01.2.NE-1: A maintained record of infrastructure, operating systems, applications, identities, credentials and data assets has not been established.
        - IT.IDE-01.2.NE-2: There is no defined process for identifying, recording, reviewing and updating asset records.

        Partially effective:
        - IT.IDE-01.2.PE-1: Asset records are maintained, but identified omissions, inaccuracies or newly discovered assets are not triaged and addressed within the timeframes or tolerances defined by the organisation.
        - IT.IDE-01.2.PE-2: A process to update the asset inventory runs on a schedule but the results are not reconciled or updated within a period defined by the organisation.

        Fully effective:
        - IT.IDE-01.2.FE-1: At each scheduled review or update, records of infrastructure, operating systems, applications, identities, credentials and data assets are complete and accurate within the tolerances defined by the organisation.
        - IT.IDE-01.2.FE-2: A defined process identifies changes and newly discovered assets between scheduled reviews, and ensures that records are reviewed, reconciled and updated within timeframes commensurate with the associated cyber security risk.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-01
      name: Secure system lifecycle
      description: Systems (infrastructure, operating systems and applications) are planned, designed,
        developed, tested, deployed, maintained and decommissioned according to their business criticality
        ratings and security and resilience requirements using Secure by Design and Secure by Default
        principles and practices.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-01:it.pro-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-01
      ref_id: IT.PRO-01.1
      description: Design systems securely to provide visibility, enforce authorised access, protect data,
        minimise required and default privileges, limit exposed services and remove unnecessary functionality.
      annotation: |-
        Not effective:
        - IT.PRO-01.1.NE-1: Systems are deployed with default configurations and no evidence of security design considerations.
        - IT.PRO-01.1.NE-2: Unnecessary services, protocols or functionality remain enabled with no documented rationale.
        - IT.PRO-01.1.NE-3: Security telemetry is not enabled or is not considered as part of system design.

        Partially effective:
        - IT.PRO-01.1.PE-1: Security is considered during system design but not consistently applied across all assets.
        - IT.PRO-01.1.PE-2: Some unnecessary services have been disabled but a systematic review has not been completed.
        - IT.PRO-01.1.PE-3: Security telemetry is partially enabled but gaps in coverage exist.

        Fully effective:
        - IT.PRO-01.1.FE-1: Systems are designed and deployed with exposed services limited, required and default permissions minimised, data protections in place, authorised access enforced, and only required functionality enabled.
        - IT.PRO-01.1.FE-2: Security telemetry is enabled by default.
        - IT.PRO-01.1.FE-3: Evidence exists that security design decisions are recorded and reviewed during system changes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-01:it.pro-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-01
      ref_id: IT.PRO-01.2
      description: Secure build and deployment processes to enforce controls consistently across systems.
      annotation: |-
        Not effective:
        - IT.PRO-01.2.NE-1: No controlled build or deployment process exists for applicable assets.
        - IT.PRO-01.2.NE-2: Changes to systems are applied ad hoc, without any version control, testing or approval.

        Partially effective:
        - IT.PRO-01.2.PE-1: A controlled deployment process exists but is not consistently followed for all changes.
        - IT.PRO-01.2.PE-2: Version control is in place but pre-deployment security verification is not performed.

        Fully effective:
        - IT.PRO-01.2.FE-1: A controlled build and deployment process is in place and consistently followed.
        - IT.PRO-01.2.FE-2: Configuration changes are subject to version control, testing and approval before deployment.
        - IT.PRO-01.2.FE-3: Security controls are confirmed to be implemented consistently across systems following deployment processes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-16
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-16
      name: Cyber supply chain security
      description: Cyber supply chains supporting systems (infrastructure, operating systems, applications
        and data) are secure, resilient and support effective and coordinated cyber security incident
        response.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-16:it.pro-16.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-16
      ref_id: IT.PRO-16.1
      description: Assess the integrity and authenticity of software, components and updates before use,
        and verify provenance where suitable supplier evidence is available.
      annotation: |-
        Not effective:
        - IT.PRO-16.1.NE-1: No verification of software, component or update integrity or authenticity is performed before introduction into systems.
        - IT.PRO-16.1.NE-2: Verification outcomes are not recorded or available for review.
        - IT.PRO-16.1.NE-3: Where verification cannot be performed, no compensating control or remediation paths are documented.

        Partially effective:
        - IT.PRO-16.1.PE-1: Verification is performed for some categories of software but not consistently across operating systems, applications, firmware and dependencies.
        - IT.PRO-16.1.PE-2: Integrity or provenance checks are performed, but they do not provide sufficient assurance for all software, components or updates.
        - IT.PRO-16.1.PE-3: Verification outcomes are recorded for some software, components or updates prior to being introduced into systems, but not consistently.
        - IT.PRO-16.1.PE-4: Compensating controls exist for some unverifiable components but are not formally approved or time-bound.

        Fully effective:
        - IT.PRO-16.1.FE-1: Verification of integrity and provenance is performed for software, components and updates across all relevant categories, and provenance is verified where suitable supplier evidence is available.
        - IT.PRO-16.1.FE-2: Verification uses one or more mechanisms appropriate to the software, component, update and source to provide reliable assurance of integrity and provenance.
        - IT.PRO-16.1.FE-3: Verification outcomes are recorded and available for review.
        - IT.PRO-16.1.FE-4: Where verification cannot be performed, compensating controls are applied, exceptions are time-bound and remediation paths are documented.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-16:it.pro-16.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-16
      ref_id: IT.PRO-16.2
      description: Use vendor advisories and threat intelligence to maintain awareness of supplier, product
        and component exposure to compromise, and act within timeframes proportionate to the risk.
      annotation: |-
        Not effective:
        - IT.PRO-16.2.NE-1: No monitoring is performed for indicators of supply chain compromise affecting software, components or services in use.
        - IT.PRO-16.2.NE-2: Vendor security notifications and threat advisories are not reviewed or actioned.
        - IT.PRO-16.2.NE-3: When supply chain compromise is identified, neither containment nor investigation is performed.
        - IT.PRO-16.2.NE-4: Supply chain compromise events are integrated into neither incident response nor risk management.

        Partially effective:
        - IT.PRO-16.2.PE-1: Monitoring occurs but does not draw on relevant threat intelligence sources or does not cover all in-scope systems.
        - IT.PRO-16.2.PE-2: Notifications and advisories are reviewed but exposure assessment and response are not conducted in a timely manner.
        - IT.PRO-16.2.PE-3: Containment occurs but investigation for evidence of exploitation is not consistently undertaken.
        - IT.PRO-16.2.PE-4: Some integration exists but findings are not reflected in the risk register or incident response procedures.

        Fully effective:
        - IT.PRO-16.2.FE-1: Monitoring covers software, components and services in use, drawing on relevant threat intelligence sources.
        - IT.PRO-16.2.FE-2: Vendor security notifications and threat advisories are reviewed, exposure is assessed and response actions are initiated within defined timeframes.
        - IT.PRO-16.2.FE-3: Identified supply chain compromises are responded to in timeframes defined by the organisation.
        - IT.PRO-16.2.FE-4: Supply chain compromise events are integrated with incident response and reflected in the risk register.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-13
      name: Identity, credential and access management
      description: Robust and secure identity, credential and access management is used to establish,
        maintain and control access to systems (infrastructure, operating systems, applications and data)
        and to support effective detection of identity and credential misuse.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13:it.pro-13.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13
      ref_id: IT.PRO-13.1
      description: Identify and disable or remove default and unused accounts regularly, permitting exceptions
        only where the account is documented, justified, hardened and monitored.
      annotation: |-
        Not effective:
        - IT.PRO-13.1.NE-1: No review of default or unused accounts has been conducted within the review period defined by the organisation.
        - IT.PRO-13.1.NE-2: Default vendor accounts remain enabled on production systems without appropriate documentation, justification, hardening and monitoring in place for their use.
        - IT.PRO-13.1.NE-3: No process exists to identify accounts that have not authenticated within a defined period.

        Partially effective:
        - IT.PRO-13.1.PE-1: A review has been conducted but does not cover all assets.
        - IT.PRO-13.1.PE-2: Default accounts have been identified but some remain enabled without documented justification.
        - IT.PRO-13.1.PE-3: Unused accounts are identified but remediation is incomplete or delayed beyond defined timeframes.

        Fully effective:
        - IT.PRO-13.1.FE-1: A review of accounts has been completed within the defined review period covering all assets.
        - IT.PRO-13.1.FE-2: Default accounts are disabled or have approved justification for remaining active, with appropriate monitoring and compensating controls for their use in place.
        - IT.PRO-13.1.FE-3: Accounts that show no evidence of use, other than approved emergency access accounts, are identified and either disabled or removed in accordance with defined timeframes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13:it.pro-13.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13
      ref_id: IT.PRO-13.2
      description: Store authentication keys, secrets and tokens in approved secure repositories with
        access controls, including MFA.
      annotation: |-
        Not effective:
        - IT.PRO-13.2.NE-1: Credentials are stored in plaintext, spreadsheets, shared drives or other unapproved locations as standard practice.
        - IT.PRO-13.2.NE-2: No approved secure repository is in use to store authentication keys, secrets and tokens.
        - IT.PRO-13.2.NE-3: Access to credential stores is neither controlled nor audited.
        - IT.PRO-13.2.NE-4: Access controls such as MFA are not enabled for authentication to secure repositories.

        Partially effective:
        - IT.PRO-13.2.PE-1: An approved secure repository is in use but does not cover all authentication keys, secrets and tokens within scope.
        - IT.PRO-13.2.PE-2: Access controls for secure repositories are in place but access logging is not enabled or not reviewed.
        - IT.PRO-13.2.PE-3: MFA is enforced for some, but not all, applicable users, repositories or authentication pathways, and the remaining exceptions are documented and subject to remediation.

        Fully effective:
        - IT.PRO-13.2.FE-1: Authentication keys, secrets and tokens within scope are stored in approved secure repositories, with any authorised exceptions documented, risk-assessed and managed in accordance with organisationally defined requirements.
        - IT.PRO-13.2.FE-2: Access to secure repositories is restricted using attribute or role-based access controls, MFA is enforced for all applicable authentication pathways, and access is logged and reviewed and investigated where necessary.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13:it.pro-13.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13
      ref_id: IT.PRO-13.4
      description: Use phishing-resistant MFA for users authenticating to systems, including from untrusted,
        external or high-risk locations.
      annotation: |-
        Not effective:
        - IT.PRO-13.4.NE-1: Phishing-resistant MFA is not enforced for interactive user authentication to systems.
        - IT.PRO-13.4.NE-2: MFA is deployed but uses non-phishing-resistant methods, such as SMS, voice, or push-only authentication instead of phishing-resistant MFA.
        - IT.PRO-13.4.NE-3: No access policies differentiate between trusted and untrusted, external or high-risk locations.
        - IT.PRO-13.4.NE-4: Access from untrusted, external or high-risk locations is permitted without MFA, or with non-phishing-resistant MFA.

        Partially effective:
        - IT.PRO-13.4.PE-1: Phishing-resistant MFA is deployed for some but not all systems within scope.
        - IT.PRO-13.4.PE-2: Access policies exist but do not cover all organisationally defined high-risk location categories.
        - IT.PRO-13.4.PE-3: Exceptions or alternative authentication pathways allow routine or recurring authentication without phishing-resistant MFA, or emergency access arrangements are not adequately restricted, monitored, tested or reviewed.

        Fully effective:
        - IT.PRO-13.4.FE-1: Phishing-resistant MFA is enforced for all routine interactive user authentication to systems within scope.
        - IT.PRO-13.4.FE-2: Phishing-resistant MFA is enforced for routine authentication attempts from untrusted, external or high-risk locations.
        - IT.PRO-13.4.FE-3: Customer-facing services provide a phishing-resistant MFA option for authentication.
        - IT.PRO-13.4.FE-4: Emergency access arrangements are periodically tested and reviewed to confirm that they remain operational, appropriately protected and limited to their intended purpose. Credentials or authentication factors used for emergency access are securely managed and are not used for routine administration.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13:it.pro-13.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13
      ref_id: IT.PRO-13.5
      description: Disable legacy authentication protocols or, where this is not feasible, restrict and
        monitor their use, apply compensating controls and establish a time-bound decommissioning plan.
      annotation: |-
        Not effective:
        - IT.PRO-13.5.NE-1: Legacy authentication protocols that cannot enforce modern authentication controls remain enabled and in active use without restriction.
        - IT.PRO-13.5.NE-2: No assessment has been conducted to identify which legacy authentication protocols are in use within the environment.
        - IT.PRO-13.5.NE-3: Authentication mechanisms transmitting credentials in cleartext or using weak cryptographic primitives remain enabled and no action has been taken to disable them.
        - IT.PRO-13.5.NE-4: Where legacy protocols are retained, no compensating controls, no monitoring and no decommissioning timelines are in place.

        Partially effective:
        - IT.PRO-13.5.PE-1: Legacy authentication protocols have been identified and are partially restricted but some remain enabled across systems within scope without justification.
        - IT.PRO-13.5.PE-2: An assessment has been conducted but does not cover all in-scope systems, or the inventory of legacy protocols in use is not maintained.
        - IT.PRO-13.5.PE-3: Some weak authentication mechanisms have been disabled but others remain enabled without documented justification or remediation plan.
        - IT.PRO-13.5.PE-4: Compensating controls exist for some retained legacy protocols but monitoring is inconsistent or decommissioning timelines are not defined.

        Fully effective:
        - IT.PRO-13.5.FE-1: Legacy authentication protocols that cannot enforce modern authentication controls have been identified and disabled across systems within scope, excluding documented and risk accepted exceptions.
        - IT.PRO-13.5.FE-2: An assessment of legacy authentication protocol use has been conducted across in-scope systems and the inventory is maintained.
        - IT.PRO-13.5.FE-3: Where retention is necessary, compensating controls are applied and decommissioning timelines are recorded and tracked.
        - IT.PRO-13.5.FE-4: Ongoing use of legacy authentication protocols is regularly risk reviewed, accepted and recorded in the organisation’s risk register.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13:it.pro-13.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-13
      ref_id: IT.PRO-13.6
      description: Ensure that user, machine, system and service account credentials are unique per system
        or account, particularly in high-privilege contexts.
      annotation: |-
        Not effective:
        - IT.PRO-13.6.NE-1: Local administrator credentials are shared across the device fleet, or service or privileged account credentials are routinely reused across systems.
        - IT.PRO-13.6.NE-2: Credential uniqueness is not enforced for applicable user, machine, system or service identities.
        - IT.PRO-13.6.NE-3: Credential uniqueness has not been addressed in high-privilege contexts, including domain administration, cloud administration or automation platforms.
        - IT.PRO-13.6.NE-4: Where credential uniqueness cannot be enforced, neither compensating controls nor remediation paths are in place.

        Partially effective:
        - IT.PRO-13.6.PE-1: Local administrator credential uniqueness has been implemented for some device populations but coverage is incomplete across the device fleet.
        - IT.PRO-13.6.PE-2: A technical mechanism is in place but applies to only a subset of credential types or systems within scope.
        - IT.PRO-13.6.PE-3: Credential uniqueness has been addressed in some high-privilege contexts but gaps remain in others.
        - IT.PRO-13.6.PE-4: Compensating controls exist for some shared credentials but monitoring is inconsistent or remediation plans do not exist.

        Fully effective:
        - IT.PRO-13.6.FE-1: Credentials for applicable local administrative accounts are unique to each system or account.
        - IT.PRO-13.6.FE-2: Credential uniqueness is consistently enforced for applicable user, machine, system and service identities.
        - IT.PRO-13.6.FE-3: Credential uniqueness is enforced consistently in high-privilege contexts, with managed identities or equivalent capabilities used in preference to shared static credentials wherever feasible.
        - IT.PRO-13.6.FE-4: Where uniqueness cannot be enforced, compensating controls are applied, the use of the shared credentials is monitored, and a remediation plan exists.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-12
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-12
      name: Least privilege access
      description: Users are granted the minimum access to systems (infrastructure, operating systems,
        applications and data) required to undertake their duties or functions.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-12:it.pro-12.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-12
      ref_id: IT.PRO-12.1
      description: Periodically review and update access privileges in alignment with current roles, duties
        and business requirements.
      annotation: |-
        Not effective:
        - IT.PRO-12.1.NE-1: Access privileges are not reviewed against current roles, duties and business requirements.
        - IT.PRO-12.1.NE-2: Access reviews do not identify privileges that are no longer required.
        - IT.PRO-12.1.NE-3: Access privileges are not updated when personnel roles, duties or business requirements change.
        - IT.PRO-12.1.NE-4: Access privileges are not mapped to roles, duties and business requirements.

        Partially effective:
        - IT.PRO-12.1.PE-1: Access reviews are conducted for some accounts or systems, but coverage is incomplete.
        - IT.PRO-12.1.PE-2: Reviews identify excessive or obsolete privileges, but updates are incomplete or not completed within timeframes defined by the organisation.
        - IT.PRO-12.1.PE-3: A process to review access privileges exists but only occurs on an ad hoc basis.
        - IT.PRO-12.1.PE-4: Some access privileges are mapped to roles, duties and business requirements, but not all.

        Fully effective:
        - IT.PRO-12.1.FE-1: Access privileges for all applicable accounts and systems are reviewed within a cycle defined by the organisation and aligned with current roles, duties and business requirements.
        - IT.PRO-12.1.FE-2: Privileges identified as excessive or obsolete are removed or updated within timeframes defined by the organisation.
        - IT.PRO-12.1.FE-3: Review outcomes and resulting access changes are documented and available as evidence.
        - IT.PRO-12.1.FE-4: Access privileges are mapped to current roles, duties and business requirements.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-12:it.pro-12.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-12
      ref_id: IT.PRO-12.2
      description: Grant only authorised administrative roles permissions to create, modify or delete
        accounts and roles, and access privileged functions or applications.
      annotation: |-
        Not effective:
        - IT.PRO-12.2.NE-1: Non-administrative users can create, modify or delete accounts or roles.
        - IT.PRO-12.2.NE-2: Delegated permissions are broad and have not been audited.

        Partially effective:
        - IT.PRO-12.2.PE-1: Permissions are restricted to administrative roles but some delegated permissions are broader than required.
        - IT.PRO-12.2.PE-2: Approval workflows exist for some high-impact changes but not all.

        Fully effective:
        - IT.PRO-12.2.FE-1: Only designated administrative roles can create, modify or delete accounts and roles.
        - IT.PRO-12.2.FE-2: Delegated permissions are audited and scoped to the minimum required.
        - IT.PRO-12.2.FE-3: Approval workflows are enforced for high-impact identity and access changes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-12:it.pro-12.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-12
      ref_id: IT.PRO-12.3
      description: Provision user, administrative and non-person accounts with only the minimum access
        and privileges required to perform defined operational functions.
      annotation: |-
        Not effective:
        - IT.PRO-12.3.NE-1: Accounts are provisioned with broad default permissions that exceed operational requirements.
        - IT.PRO-12.3.NE-2: Administrative and day-to-day user functions share the same account, with no separate privileged accounts.

        Partially effective:
        - IT.PRO-12.3.PE-1: Minimum privilege provisioning is defined but not consistently applied to all account types.
        - IT.PRO-12.3.PE-2: Administrative accounts are separated from user accounts but some exceptions exist without documented justification.

        Fully effective:
        - IT.PRO-12.3.FE-1: All accounts are provisioned with documented minimum permissions aligned to defined operational functions.
        - IT.PRO-12.3.FE-2: Separate accounts are allocated for privileged and day-to-day functions, and controls prevent privileged use from day-to-day context.
        - IT.PRO-12.3.FE-3: Non-person and service accounts are scoped to their specific integration requirements.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-05
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-05
      name: Secure administration
      description: Systems (infrastructure, operating systems, applications and data) are administered
        in a secure, accountable and auditable manner.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-05:it.pro-05.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-05
      ref_id: IT.PRO-05.1
      description: Ensure administrative activities can only be performed from dedicated and hardened
        environments that are isolated from unprivileged user workloads.
      annotation: |-
        Not effective:
        - IT.PRO-05.1.NE-1: Administrative access to systems is routinely performed from standard user devices without additional controls to protect the administrative session.
        - IT.PRO-05.1.NE-2: No dedicated or hardened administrative environment exists.
        - IT.PRO-05.1.NE-3: Exceptions to the use of dedicated administrative environments are neither identified nor assessed.

        Partially effective:
        - IT.PRO-05.1.PE-1: A dedicated administrative environment has been established, but administrative access is not consistently routed through it.
        - IT.PRO-05.1.PE-2: Administrative endpoints have been hardened, but unprivileged user workloads or unnecessary functions remain accessible.
        - IT.PRO-05.1.PE-3: Exceptions are documented, but their justification, risk acceptance, compensating controls or review arrangements are incomplete or inconsistently applied.

        Fully effective:
        - IT.PRO-05.1.FE-1: Administrative sessions originate from dedicated and hardened administrative environments that are isolated from unprivileged user workloads. Where this cannot be technically enforced, exceptions are documented, risk-assessed, formally accepted and protected by compensating controls.
        - IT.PRO-05.1.FE-2: Administrative environments are hardened and restricted to the functions required for authorised administration.
        - IT.PRO-05.1.FE-3: Exceptions are limited to systems or services that cannot support administration through a dedicated environment, are periodically reviewed and are removed when the technical limitation no longer applies.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-05:it.pro-05.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-05
      ref_id: IT.PRO-05.2
      description: Enforce explicit session establishment controls before privileged actions are permitted,
        including the use of time-bound privilege grants.
      annotation: |-
        Not effective:
        - IT.PRO-05.2.NE-1: Privileged access is standing and does not require explicit activation or time-bound grants, excluding approved break-glass and emergency access accounts.
        - IT.PRO-05.2.NE-2: No re-authentication or step-up authentication is required before privileged sessions.

        Partially effective:
        - IT.PRO-05.2.PE-1: Time-bound access is implemented for some privileged roles but standing access remains for others.
        - IT.PRO-05.2.PE-2: Session duration limits exist but are not consistently enforced or are set excessively long.

        Fully effective:
        - IT.PRO-05.2.FE-1: Time-bound privilege grants are enforced for applicable privileged roles, with defined maximum session durations and approved emergency access arrangements.
        - IT.PRO-05.2.FE-2: Re-authentication or step-up authentication is required before privilege activation.
        - IT.PRO-05.2.FE-3: All privilege activations are logged with activating user, role and timeframes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-05:it.pro-05.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-05
      ref_id: IT.PRO-05.3
      description: Record all administrative or management actions that modify systems, configurations
        or controls, including the details of the associated user, timestamp and target.
      annotation: |-
        Not effective:
        - IT.PRO-05.3.NE-1: Administrative or management actions that modify systems, configurations or controls are not logged.
        - IT.PRO-05.3.NE-2: Logs do not capture sufficient detail to identify who made a change, when and to what target.

        Partially effective:
        - IT.PRO-05.3.PE-1: Logging is enabled and provides useful coverage, but does not cover all applicable administrative or management platforms.
        - IT.PRO-05.3.PE-2: Logs capture the administrator identity and action but lack detail on the target or change nature.

        Fully effective:
        - IT.PRO-05.3.FE-1: Comprehensive audit logging to capture all administrative or management actions is enabled on all platforms in scope.
        - IT.PRO-05.3.FE-2: Logs capture administrator identity, timestamp, target object and nature of change.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-04
      name: Secure configuration management
      description: Systems (infrastructure, operating systems and applications) are securely configured
        to approved and maintained baselines, including by reducing attack surfaces and attack paths,
        with configurations continually monitored and consistently enforced.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-04:it.pro-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-04
      ref_id: IT.PRO-04.1
      description: Define approved configuration baselines, informed by vendor and industry hardening
        guidance, that disable or remove unnecessary services, insecure settings, and unsupported or weak
        communication protocols.
      annotation: |-
        Not effective:
        - IT.PRO-04.1.NE-1: No documented configuration baseline exists for assets.
        - IT.PRO-04.1.NE-2: Systems are deployed with vendor defaults and no documented hardening has been applied.

        Partially effective:
        - IT.PRO-04.1.PE-1: A baseline exists but does not address all applicable asset types.
        - IT.PRO-04.1.PE-2: The baseline is documented but has not been reviewed or updated within the cycle defined by the organisation.
        - IT.PRO-04.1.PE-3: The baseline exists but rationale for configuration decisions is not documented.

        Fully effective:
        - IT.PRO-04.1.FE-1: A documented and approved baseline exists for all applicable asset types.
        - IT.PRO-04.1.FE-2: The baseline disables or removes unnecessary services, insecure settings, and unsupported or weak communication protocols.
        - IT.PRO-04.1.FE-3: Configuration decisions are documented with rationale to support drift assessment.
        - IT.PRO-04.1.FE-4: The baseline is reviewed and updated on a cycle defined by the organisation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-04:it.pro-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-04
      ref_id: IT.PRO-04.2
      description: Deploy approved configuration baselines on systems, including infrastructure, operating
        systems and applications.
      annotation: |-
        Not effective:
        - IT.PRO-04.2.NE-1: Approved baselines have not been applied to assets.
        - IT.PRO-04.2.NE-2: Baseline deployment has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-04.2.PE-1: Approved baselines have been implemented where available, but some relevant asset types are not covered by an approved baseline.
        - IT.PRO-04.2.PE-2: Deployment has occurred but validation through technical assessment is incomplete or not current.
        - IT.PRO-04.2.PE-3: Approved baselines have been deployed, but coverage for all applicable assets is inconsistent.

        Fully effective:
        - IT.PRO-04.2.FE-1: Approved baselines have been applied to all applicable assets.
        - IT.PRO-04.2.FE-2: Deployment has been validated through technical assessment.
        - IT.PRO-04.2.FE-3: Coverage metrics are available demonstrating deployment completeness.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-04:it.pro-04.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-04
      ref_id: IT.PRO-04.3
      description: Detect and respond to configuration drift using scheduled technical assessments and,
        where supported, automated monitoring, based on system criticality and change rate.
      annotation: |-
        Not effective:
        - IT.PRO-04.3.NE-1: No mechanism exists to detect configuration drift from approved baselines.
        - IT.PRO-04.3.NE-2: Assessments to detect configuration drift have not been conducted within the review period defined by the organisation.
        - IT.PRO-04.3.NE-3: Assessments do not systematically identify instances of configuration drift for assets.

        Partially effective:
        - IT.PRO-04.3.PE-1: Drift detection is in place but does not cover all applicable assets.
        - IT.PRO-04.3.PE-2: Drift is detected but the remediation process is informal or response timeframes are not defined.

        Fully effective:
        - IT.PRO-04.3.FE-1: Automated configuration monitoring or regular technical assessments detect drift across the applicable assets, occurring at a frequency based on system criticality and change rate.
        - IT.PRO-04.3.FE-2: A documented remediation process exists with defined response timeframes aligned to severity.
        - IT.PRO-04.3.FE-3: Drift events are tracked to closure with evidence of remediation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-06
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-06
      name: Vulnerability management
      description: Vulnerabilities in systems (infrastructure, operating systems, applications and data)
        are identified, documented, validated and prioritised for remediation or mitigation in a timely
        manner, with all remediation and mitigation actions verified for effectiveness.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-06:it.pro-06.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-06
      ref_id: IT.PRO-06.1
      description: Identify known software and configuration weaknesses of assets through continuous and
        repeatable assessment activities, including vulnerability scanning activities.
      annotation: |-
        Not effective:
        - IT.PRO-06.1.NE-1: Vulnerability scanning activities are not undertaken.
        - IT.PRO-06.1.NE-2: No routine vulnerability assessment activity has been conducted within a period defined by the organisation.
        - IT.PRO-06.1.NE-3: Advisories for relevant software and configuration weaknesses for organisational assets are not reviewed and assessed for impact.

        Partially effective:
        - IT.PRO-06.1.PE-1: Vulnerability scanning is deployed but does not cover all applicable assets.
        - IT.PRO-06.1.PE-2: Vulnerability scans are conducted but results are not reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.PE-3: Vulnerability scans are conducted but frequency is not regular enough to enable timely response.
        - IT.PRO-06.1.PE-4: Scanning covers software vulnerabilities but not configuration weaknesses.
        - IT.PRO-06.1.PE-5: Advisories for relevant software and configuration weaknesses for organisational assets are reviewed on an ad hoc basis, or only for some assets.

        Fully effective:
        - IT.PRO-06.1.FE-1: All applicable assets are included in routine vulnerability scanning, and scanning frequency enables timely response.
        - IT.PRO-06.1.FE-2: Scanning covers both software vulnerabilities and configuration weaknesses.
        - IT.PRO-06.1.FE-3: Results are reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.FE-4: Advisories for relevant software and configuration weaknesses in all organisational assets are regularly reviewed and assessed for impact.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-06:it.pro-06.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-06
      ref_id: IT.PRO-06.2
      description: Apply security patches or updates within defined risk-based timeframes or automatically
        where operational impact is low.
      annotation: |-
        Not effective:
        - IT.PRO-06.2.NE-1: No defined patching timeframes exist for applicable assets.
        - IT.PRO-06.2.NE-2: Patches are not applied or are applied on an ad hoc basis with no tracking.

        Partially effective:
        - IT.PRO-06.2.PE-1: Expected patching timeframes are defined by the organisation but are not consistently met.
        - IT.PRO-06.2.PE-2: Patches are applied but compensating controls are not documented where operational constraints prevent timely patching.
        - IT.PRO-06.2.PE-3: Patching coverage metrics exist but show significant gaps.

        Fully effective:
        - IT.PRO-06.2.FE-1: Risk-based patching timeframes defined by the organisation are in place and consistently met.
        - IT.PRO-06.2.FE-2: Patching is prioritised based on vulnerability severity, exposure and exploit availability.
        - IT.PRO-06.2.FE-3: Where operational constraints prevent timely patching, compensating controls are documented and approved.
        - IT.PRO-06.2.FE-4: Patching coverage metrics account for all applicable assets, with any exclusions identified and formally risk accepted.
        - IT.PRO-06.2.FE-5: Automatic patching of assets is applied where available and the organisation has determined operational impact is low.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-06:it.pro-06.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-06
      ref_id: IT.PRO-06.3
      description: Remediate or mitigate vulnerabilities exceeding defined risk thresholds within defined
        timeframes based on exploitation, exposure, criticality, impact and compensating controls, and
        verify treatment effectiveness.
      annotation: |-
        Not effective:
        - IT.PRO-06.3.NE-1: No risk thresholds are defined for vulnerability remediation.
        - IT.PRO-06.3.NE-2: Vulnerabilities exceeding acceptable risk levels are not tracked or remediated.

        Partially effective:
        - IT.PRO-06.3.PE-1: Risk thresholds are defined but vulnerabilities exceeding them are not consistently remediated within defined timeframes.
        - IT.PRO-06.3.PE-2: Compensating controls are applied in some cases but are not formally documented or approved.

        Fully effective:
        - IT.PRO-06.3.FE-1: Risk thresholds defined by the organisation exist, and vulnerabilities exceeding them are remediated or have approved compensating controls within organisationally defined timeframes.
        - IT.PRO-06.3.FE-2: Remediation and mitigation actions are tracked to closure with verification that actions reduced the risk as intended.
        - IT.PRO-06.3.FE-3: The process is sustained, with historical data demonstrating consistent performance across organisationally defined reporting periods.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-07
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-07
      name: Trustworthy software
      description: Systems (operating systems and applications) only permit the execution of software
        that is supported, verified and authorised.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-07:it.pro-07.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-07
      ref_id: IT.PRO-07.1
      description: Permit only supported, verified and organisation-authorised software to execute on
        systems, with exceptions minimised, formally risk accepted, time-bound, monitored and regularly
        reviewed.
      annotation: |-
        Not effective:
        - IT.PRO-07.1.NE-1: Unsupported, unverified or unauthorised software can execute without restriction.
        - IT.PRO-07.1.NE-2: The list of approved software does not exist.

        Partially effective:
        - IT.PRO-07.1.PE-1: Execution restriction controls are deployed but do not cover all applicable assets.
        - IT.PRO-07.1.PE-2: The organisation maintains a list of approved software, but it has not been reviewed within timeframes defined by the organisation.
        - IT.PRO-07.1.PE-3: Execution restrictions are in place but integrity verification of approved software is not performed.
        - IT.PRO-07.1.PE-4: Exceptions to execution restrictions are granted without formal approval or time-bounding.

        Fully effective:
        - IT.PRO-07.1.FE-1: Controls restrict execution to supported, organisation-authorised and integrity-verified software on all applicable assets.
        - IT.PRO-07.1.FE-2: The organisation maintains a list of approved software and reviews it within the timeframes defined by the organisation.
        - IT.PRO-07.1.FE-3: Integrity of permitted software is verified using trusted mechanisms appropriate to the software and its source.
        - IT.PRO-07.1.FE-4: Exceptions are formally approved, documented, time-bound and reviewed on a regular cycle defined by the organisation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-07:it.pro-07.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-07
      ref_id: IT.PRO-07.2
      description: Restrict administrative and management tooling to approved software sets and executed
        from only authorised, known locations.
      annotation: |-
        Not effective:
        - IT.PRO-07.2.NE-1: No approved administrative toolset is defined.
        - IT.PRO-07.2.NE-2: No restrictions are placed on the location administrative tooling can be executed from.
        - IT.PRO-07.2.NE-3: No controls prevent unapproved administrative tools, including tools commonly used in post-compromise activity, from executing on managed assets.

        Partially effective:
        - IT.PRO-07.2.PE-1: An approved toolset is defined but not consistently enforced across all assets.
        - IT.PRO-07.2.PE-2: Administrative tooling is configured to execute from known locations, but privileged users can still run tooling from unapproved locations.
        - IT.PRO-07.2.PE-3: Some unapproved administrative tools are blocked but enforcement gaps exist.

        Fully effective:
        - IT.PRO-07.2.FE-1: A defined and enforced approved toolset exists for administrative and management activities, and execution is limited to authorised, known locations.
        - IT.PRO-07.2.FE-2: Administrative and management tooling outside the approved set is blocked from execution, including from unauthorised locations.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-10
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-10
      name: Regular and proven backups
      description: Systems (infrastructure, operating systems, applications and data) are regularly backed
        up in a secure and proven manner, including through the validation of restoration capabilities.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-10:it.pro-10.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-10
      ref_id: IT.PRO-10.1
      description: Back up important data, applications and settings on a defined schedule to secure,
        resilient storage protected by encryption and immutable, offline, logically isolated or equivalent
        controls.
      annotation: |-
        Not effective:
        - IT.PRO-10.1.NE-1: No managed backup process exists for important data, applications and settings.
        - IT.PRO-10.1.NE-2: Backup storage is neither encrypted nor protected by immutable, offline, logically isolated or equivalent controls.

        Partially effective:
        - IT.PRO-10.1.PE-1: Important data, applications and settings are backed up, but backup schedules are not defined, do not cover all important assets, or are not consistently met.
        - IT.PRO-10.1.PE-2: Backups are encrypted but no immutable, offline, logically isolated or equivalent resilience controls are consistently applied.
        - IT.PRO-10.1.PE-3: Backups use immutable, offline, logically isolated or equivalent controls, but encryption is not consistently enforced.

        Fully effective:
        - IT.PRO-10.1.FE-1: All important data, applications and settings are backed up according to schedules defined by the organisation and aligned with their recovery requirements.
        - IT.PRO-10.1.FE-2: Backup schedules are monitored, and missed or unsuccessful backups are identified, investigated and remediated within timeframes defined by the organisation.
        - IT.PRO-10.1.FE-3: Backup storage is encrypted and protected by immutable, offline, logically isolated or equivalent controls.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-10:it.pro-10.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-10
      ref_id: IT.PRO-10.2
      description: Isolate backup repositories from general user environments and production workloads,
        ensuring they are separated from primary systems to prevent unauthorised access, modification
        or deletion.
      annotation: |-
        Not effective:
        - IT.PRO-10.2.NE-1: Backup repositories are accessible from the production environment or by production administrators.
        - IT.PRO-10.2.NE-2: Compromise of a system would provide a direct path to access, modify or delete its own backups.

        Partially effective:
        - IT.PRO-10.2.PE-1: Backup repositories are logically separated but use credentials managed by the same identity platform as production.
        - IT.PRO-10.2.PE-2: Isolation is implemented but has not been tested or validated.

        Fully effective:
        - IT.PRO-10.2.FE-1: Backup repositories are isolated from production environments and general user access.
        - IT.PRO-10.2.FE-2: Access is controlled through credentials and administrative paths isolated from compromise of the primary identity environment.
        - IT.PRO-10.2.FE-3: Isolation has been validated to confirm that compromise of a system does not provide access to backups.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-10:it.pro-10.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-10
      ref_id: IT.PRO-10.3
      description: Conduct regular testing of backup and restoration procedures to ensure that backups
        are reliable and capable of meeting defined recovery time objectives and recovery point objectives.
      annotation: |-
        Not effective:
        - IT.PRO-10.3.NE-1: No restoration test has been conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.NE-2: No backup or restoration procedures exist.
        - IT.PRO-10.3.NE-3: Restoration testing demonstrates that backups cannot be restored, or consistently fail to meet defined recovery time or recovery point objectives.

        Partially effective:
        - IT.PRO-10.3.PE-1: Restoration testing has been conducted but does not cover all important assets.
        - IT.PRO-10.3.PE-2: Backup procedures exist but have never been tested.
        - IT.PRO-10.3.PE-3: Testing has been conducted but coverage is incomplete or some tests did not meet the expected recovery time or recovery point objectives.

        Fully effective:
        - IT.PRO-10.3.FE-1: Restoration testing covering important assets is conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.FE-2: Testing validates that restoration meets the expected recovery time and recovery point objectives.
        - IT.PRO-10.3.FE-3: Test results are documented and gaps identified during testing are remediated.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-18
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-18
      name: Network segmentation and segregation
      description: Systems (infrastructure, operating systems and applications) are segmented into network
        zones based on business criticality and trust levels, with only authorised, controlled and monitored
        inbound and outbound communication paths between network zones permitted.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-18:it.pro-18.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-18
      ref_id: IT.PRO-18.1
      description: Isolate systems within network zones based on business criticality and trust level,
        and restrict and monitor inbound and outbound access to explicitly approved pathways and services.
      annotation: |-
        Not effective:
        - IT.PRO-18.1.NE-1: Systems are deployed on shared or flat network segments with no segregation between functions or trust levels.
        - IT.PRO-18.1.NE-2: No access controls restrict network access from external or general user networks to in-scope systems.
        - IT.PRO-18.1.NE-3: Segmentation is documented or administratively defined but not enforced by technical controls.
        - IT.PRO-18.1.NE-4: Segmentation has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-18.1.PE-1: Network segmentation has been implemented but does not cover all in-scope systems, or segments are defined inconsistently.
        - IT.PRO-18.1.PE-2: Access controls exist between segments, but deny-by-default is not enforced, or some pathways are permitted without documented approval.
        - IT.PRO-18.1.PE-3: Technical enforcement is in place for some segments but relies on a single mechanism that does not provide meaningful isolation.
        - IT.PRO-18.1.PE-4: Validation has been performed for some segments but not consistently across in-scope systems, or validation is out of date.
        - IT.PRO-18.1.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.1.FE-1: Systems within scope are deployed in network segments defined according to function, criticality and trust level, with segmentation applied consistently.
        - IT.PRO-18.1.FE-2: Deny-by-default access controls are enforced between segments, with access from external and general user networks limited to documented and approved pathways.
        - IT.PRO-18.1.FE-3: Segmentation is enforced through network-layer technical controls that provide meaningful isolation.
        - IT.PRO-18.1.FE-4: Segmentation has been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.1.FE-5: Approved pathways are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and changes reflected in the access control configuration.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-18:it.pro-18.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-18
      ref_id: IT.PRO-18.2
      description: Limit lateral movement between, and within, network segments to explicitly approved
        pathways and services, based on business requirements and trust levels.
      annotation: |-
        Not effective:
        - IT.PRO-18.2.NE-1: No controls limit lateral movement between or within network segments.
        - IT.PRO-18.2.NE-2: Lateral movement is permitted by default across the environment, with restrictions applied only on an exception basis.
        - IT.PRO-18.2.NE-3: Approved pathways are not documented.
        - IT.PRO-18.2.NE-4: Lateral movement controls have not been validated through technical assessment.
        - IT.PRO-18.2.NE-5: Pathways and services are not reviewed after initial approval.

        Partially effective:
        - IT.PRO-18.2.PE-1: Controls limit lateral movement between segments but no controls operate within segments.
        - IT.PRO-18.2.PE-2: Restrictions are applied to some pathways, but the default position remains permissive in parts of the environment.
        - IT.PRO-18.2.PE-3: Approved pathways are documented but documentation is out of date or incomplete.
        - IT.PRO-18.2.PE-4: Validation has been performed but does not cover all in-scope segments, or is out of date.
        - IT.PRO-18.2.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.2.FE-1: Controls limit lateral movement both between and within segments, with deny-by-default applied at each boundary.
        - IT.PRO-18.2.FE-2: Pathways and services are explicitly approved based on documented business requirements and trust levels, with all other lateral movement denied.
        - IT.PRO-18.2.FE-3: Approved pathways are documented, reflect the current configuration and identify the business requirement and trust relationship justifying each.
        - IT.PRO-18.2.FE-4: Lateral movement controls have been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.2.FE-5: Pathways and services are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and the configuration updated to reflect approved changes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-09
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-09
      name: Content filtering
      description: Data communicated between different security domains for systems (infrastructure and
        applications) is controlled and subject to inspection and verification.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-09:it.pro-09.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-09
      ref_id: IT.PRO-09.1
      description: Inspect outbound content flows to detect unauthorised transfer of sensitive or high-value
        data.
      annotation: |-
        Not effective:
        - IT.PRO-09.1.NE-1: No outbound content inspection is deployed.
        - IT.PRO-09.1.NE-2: Sensitive data can leave the organisation through any egress path without detection or control.

        Partially effective:
        - IT.PRO-09.1.PE-1: Outbound inspection is deployed but does not cover all applicable egress paths.
        - IT.PRO-09.1.PE-2: Rules are configured but do not cover all classified, regulated or high-value data types.
        - IT.PRO-09.1.PE-3: Alerts are generated but are not triaged or acted upon in a timely manner.

        Fully effective:
        - IT.PRO-09.1.FE-1: Outbound content inspection is deployed covering all applicable egress paths.
        - IT.PRO-09.1.FE-2: Rules are configured to detect unauthorised transfer of classified, regulated and high-value data.
        - IT.PRO-09.1.FE-3: Alerts are triaged and responded to within accepted risk timeframes defined by the organisation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-09:it.pro-09.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-09
      ref_id: IT.PRO-09.2
      description: Block outbound network connections to known malicious or untrusted destinations.
      annotation: |-
        Not effective:
        - IT.PRO-09.2.NE-1: No controls are deployed to prevent systems from establishing outbound connections to known malicious or untrusted destinations.
        - IT.PRO-09.2.NE-2: Blocking decisions are not informed by current threat intelligence.
        - IT.PRO-09.2.NE-3: Destination categorisation is not used.

        Partially effective:
        - IT.PRO-09.2.PE-1: Controls to prevent outbound connections being established are deployed but cover only a subset of in-scope systems or egress paths.
        - IT.PRO-09.2.PE-2: Threat intelligence is used to inform block decisions for outbound connections, but updates are infrequent, manual or limited to a single source.
        - IT.PRO-09.2.PE-3: Categorisation is in place, but the categories blocked do not reflect the organisation’s risk position.

        Fully effective:
        - IT.PRO-09.2.FE-1: Controls are deployed and applied across in-scope systems, egress paths, services, and network boundaries.
        - IT.PRO-09.2.FE-2: Blocking decisions draw on current threat intelligence, with destination lists updated on a cycle defined by the organisation.
        - IT.PRO-09.2.FE-3: Destination reputation, category and age are considered alongside threat intelligence, with category-based blocking aligned to the organisation’s risk position.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-09:it.pro-09.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-09
      ref_id: IT.PRO-09.3
      description: Inspect inbound content from external or untrusted sources to prevent delivery of malicious
        or unsafe content.
      annotation: |-
        Not effective:
        - IT.PRO-09.3.NE-1: No inbound content inspection is deployed.

        Partially effective:
        - IT.PRO-09.3.PE-1: Inbound inspection is deployed but does not cover all applicable content channels.
        - IT.PRO-09.3.PE-2: Inspection is in place but detection signatures or rules are not maintained or updated.

        Fully effective:
        - IT.PRO-09.3.FE-1: Inbound content inspection covers all applicable content channels.
        - IT.PRO-09.3.FE-2: Detection signatures and rules are maintained and updated on a regular cycle defined by the organisation.
        - IT.PRO-09.3.FE-3: Blocked content is logged and available for review.
        - IT.PRO-09.3.FE-4: Current cyber threat intelligence is considered when implementing controls to prevent the delivery of malicious or unsafe content.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-14
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: PRO-14
      name: Cyber security awareness training
      description: Personnel are provided with ongoing cyber security awareness training, including operational
        security considerations, tailored to their duties, access levels and current cyber threats.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-14:it.pro-14.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:pro-14
      ref_id: IT.PRO-14.1
      description: Ensure all personnel receive cyber security awareness training, that is tailored to
        how they will interact with systems, applications and data in their assigned roles, before being
        granted access to organisational systems and data.
      annotation: |-
        Not effective:
        - IT.PRO-14.1.NE-1: No requirement exists for personnel to complete cyber security awareness training before being granted access to critical, privileged or business systems.
        - IT.PRO-14.1.NE-2: No training completion records are maintained.

        Partially effective:
        - IT.PRO-14.1.PE-1: A training program exists but is not tailored to the specific risks of the systems in-scope.
        - IT.PRO-14.1.PE-2: A requirement to complete training before access is granted exists but is not consistently enforced.
        - IT.PRO-14.1.PE-3: Completion records are maintained but show significant gaps in coverage.

        Fully effective:
        - IT.PRO-14.1.FE-1: Role-tailored training programs address the specific risks, data handling obligations and incident reporting requirements relevant to in-scope systems.
        - IT.PRO-14.1.FE-2: All personnel complete role-tailored training before being granted access to organisational systems and data, with refresher training mandated within a cycle defined by the organisation.
        - IT.PRO-14.1.FE-3: Completion records are maintained and demonstrate full coverage.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: DET-01
      name: Centralised event logging
      description: Security-relevant event logs and configuration changes for systems (infrastructure,
        operating systems, applications and data) are centrally collected, protected against unauthorised
        modification or deletion, and retained to support effective cyber security event detection and
        investigation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-01:it.det-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-01
      ref_id: IT.DET-01.1
      description: Protect event logs from unauthorised access, modification or deletion, including by
        encrypting them during transit and at rest and securing the systems and accounts used to store,
        manage and analyse them.
      annotation: |-
        Not effective:
        - IT.DET-01.1.NE-1: Logs generated by applicable assets are not protected from modification or deletion.
        - IT.DET-01.1.NE-2: Log access is not restricted to authorised roles with a business need.
        - IT.DET-01.1.NE-3: Logs are neither encrypted during transit nor at rest.

        Partially effective:
        - IT.DET-01.1.PE-1: Logs are forwarded but integrity protections are not in place at the source.
        - IT.DET-01.1.PE-2: Log access is restricted but some roles retain the ability to modify or delete logs.
        - IT.DET-01.1.PE-3: Logs are encrypted during transit but are not protected with encryption at rest (or vice versa).

        Fully effective:
        - IT.DET-01.1.FE-1: Logs are protected against modification or deletion.
        - IT.DET-01.1.FE-2: Logs are encrypted in transit and at rest.
        - IT.DET-01.1.FE-3: Access to logs is restricted to authorised roles with a business need.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-01:it.det-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-01
      ref_id: IT.DET-01.2
      description: Forward high-value, security-relevant event logs and configuration changes from infrastructure,
        operating systems and applications to a central log storage capability.
      annotation: |-
        Not effective:
        - IT.DET-01.2.NE-1: Security-relevant logs from assets are not forwarded to a central logging capability.
        - IT.DET-01.2.NE-2: High-value, security-relevant event logs or configuration changes from infrastructure, operating systems or applications are not forwarded.

        Partially effective:
        - IT.DET-01.2.PE-1: High-value, security-relevant event logs are forwarded, but coverage gaps are identified or completeness has not been validated.
        - IT.DET-01.2.PE-2: Configuration change logs are forwarded inconsistently.
        - IT.DET-01.2.PE-3: The utility of security log sources is reviewed, but on an ad hoc basis rather than according to a defined schedule.
        - IT.DET-01.2.PE-4: Log forwarding is in place but latency is excessive for effective detection.

        Fully effective:
        - IT.DET-01.2.FE-1: High-value security-relevant event logs and configuration changes from all relevant infrastructure, operating systems and application sources are forwarded to the central logging capability.
        - IT.DET-01.2.FE-2: Security log sources are reviewed at regular intervals to ensure their continued utility in detecting and responding to changing adversary techniques.
        - IT.DET-01.2.FE-3: Log completeness has been validated against the expected log sources.
        - IT.DET-01.2.FE-4: Logs are forwarded at a frequency that enables timely detection.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: DET-04
      name: Baseline high-risk access activities
      description: Baseline patterns of identity and credential access activities, privileged access activities,
        and remote access activities are established and maintained for systems (infrastructure, operating
        systems, applications and data) to enable the detection of anomalous or unexpected behaviour.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-04:it.det-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-04
      ref_id: IT.DET-04.1
      description: Continuously monitor and analyse software execution behaviour on systems to detect
        where legitimate tools and utilities are being used for malicious purposes.
      annotation: |-
        Not effective:
        - IT.DET-04.1.NE-1: No monitoring or equivalent analysis is used to identify anomalous or unexpected use of legitimate tools and utilities on applicable systems.
        - IT.DET-04.1.NE-2: Existing controls do not provide a reasonable capability to detect security-relevant patterns of legitimate software being used for malicious purposes.

        Partially effective:
        - IT.DET-04.1.PE-1: Monitoring or equivalent analysis covers some priority tools, execution behaviours or applicable systems, but risk-significant coverage gaps exist.
        - IT.DET-04.1.PE-2: Security-relevant execution telemetry is collected, but detection rules, behavioural analytics or equivalent analysis are incomplete or not consistently operational.
        - IT.DET-04.1.PE-3: Alerts relating to anomalous or unexpected software execution are generated, but they are not consistently triaged and investigated within organisationally defined timeframes.

        Fully effective:
        - IT.DET-04.1.FE-1: The organisation identifies the legitimate tools, utilities and execution behaviours that present heightened risk of malicious use within applicable systems.
        - IT.DET-04.1.FE-2: Security-relevant telemetry and contextual information are analysed using detection rules, behavioural analytics or equivalent methods to identify anomalous or unexpected use of priority tools and utilities.
        - IT.DET-04.1.FE-3: Detection coverage is periodically reviewed and adjusted in response to changes in applicable systems, threat intelligence, observed activity and the organisation’s risk profile.
        - IT.DET-04.1.FE-4: Alerts are prioritised, triaged and investigated within timeframes defined according to their assessed security risk.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-02
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services
      ref_id: DET-02
      name: Cyber security event detection
      description: Anomalous or unexpected events and behaviours for systems (infrastructure, operating
        systems, applications and data) are analysed in a timely manner to detect cyber security events.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-02:it.det-02.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:boundary-services:det-02
      ref_id: IT.DET-02.1
      description: Ensure event logs are normalised, time-synchronised and enriched to support correlation
        across systems and environments.
      annotation: |-
        Not effective:
        - IT.DET-02.1.NE-1: Logs are not time-synchronised to an authoritative source.
        - IT.DET-02.1.NE-2: Logs are ingested in raw format and are neither normalised nor enriched.

        Partially effective:
        - IT.DET-02.1.PE-1: Logs are time-synchronised but are not normalised to a common schema.
        - IT.DET-02.1.PE-2: Some enrichment is applied but critical contextual data such as asset classification or account type is missing.

        Fully effective:
        - IT.DET-02.1.FE-1: Logs are time-synchronised to the authoritative time source.
        - IT.DET-02.1.FE-2: Logs are normalised into the common log schema and enriched with contextual metadata.
        - IT.DET-02.1.FE-3: Enriched logs support correlation across relevant systems, environments and data sources in the central logging platform.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      assessable: false
      depth: 1
      name: Identity services
      description: Enterprise-wide identity, credential and access management services such as directories,
        authentication and authorisation services or credential stores.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:ide-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: IDE-01
      name: Asset identification
      description: Systems (infrastructure, operating systems, applications, identities, credentials and
        data) are continually and centrally identified and documented.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:ide-01:it.ide-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:ide-01
      ref_id: IT.IDE-01.2
      description: Maintain current records of infrastructure, operating systems, applications, identities,
        credentials and data assets.
      annotation: |-
        Not effective:
        - IT.IDE-01.2.NE-1: A maintained record of infrastructure, operating systems, applications, identities, credentials and data assets has not been established.
        - IT.IDE-01.2.NE-2: There is no defined process for identifying, recording, reviewing and updating asset records.

        Partially effective:
        - IT.IDE-01.2.PE-1: Asset records are maintained, but identified omissions, inaccuracies or newly discovered assets are not triaged and addressed within the timeframes or tolerances defined by the organisation.
        - IT.IDE-01.2.PE-2: A process to update the asset inventory runs on a schedule but the results are not reconciled or updated within a period defined by the organisation.

        Fully effective:
        - IT.IDE-01.2.FE-1: At each scheduled review or update, records of infrastructure, operating systems, applications, identities, credentials and data assets are complete and accurate within the tolerances defined by the organisation.
        - IT.IDE-01.2.FE-2: A defined process identifies changes and newly discovered assets between scheduled reviews, and ensures that records are reviewed, reconciled and updated within timeframes commensurate with the associated cyber security risk.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-01
      name: Secure system lifecycle
      description: Systems (infrastructure, operating systems and applications) are planned, designed,
        developed, tested, deployed, maintained and decommissioned according to their business criticality
        ratings and security and resilience requirements using Secure by Design and Secure by Default
        principles and practices.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-01:it.pro-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-01
      ref_id: IT.PRO-01.1
      description: Design systems securely to provide visibility, enforce authorised access, protect data,
        minimise required and default privileges, limit exposed services and remove unnecessary functionality.
      annotation: |-
        Not effective:
        - IT.PRO-01.1.NE-1: Systems are deployed with default configurations and no evidence of security design considerations.
        - IT.PRO-01.1.NE-2: Unnecessary services, protocols or functionality remain enabled with no documented rationale.
        - IT.PRO-01.1.NE-3: Security telemetry is not enabled or is not considered as part of system design.

        Partially effective:
        - IT.PRO-01.1.PE-1: Security is considered during system design but not consistently applied across all assets.
        - IT.PRO-01.1.PE-2: Some unnecessary services have been disabled but a systematic review has not been completed.
        - IT.PRO-01.1.PE-3: Security telemetry is partially enabled but gaps in coverage exist.

        Fully effective:
        - IT.PRO-01.1.FE-1: Systems are designed and deployed with exposed services limited, required and default permissions minimised, data protections in place, authorised access enforced, and only required functionality enabled.
        - IT.PRO-01.1.FE-2: Security telemetry is enabled by default.
        - IT.PRO-01.1.FE-3: Evidence exists that security design decisions are recorded and reviewed during system changes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-01:it.pro-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-01
      ref_id: IT.PRO-01.2
      description: Secure build and deployment processes to enforce controls consistently across systems.
      annotation: |-
        Not effective:
        - IT.PRO-01.2.NE-1: No controlled build or deployment process exists for applicable assets.
        - IT.PRO-01.2.NE-2: Changes to systems are applied ad hoc, without any version control, testing or approval.

        Partially effective:
        - IT.PRO-01.2.PE-1: A controlled deployment process exists but is not consistently followed for all changes.
        - IT.PRO-01.2.PE-2: Version control is in place but pre-deployment security verification is not performed.

        Fully effective:
        - IT.PRO-01.2.FE-1: A controlled build and deployment process is in place and consistently followed.
        - IT.PRO-01.2.FE-2: Configuration changes are subject to version control, testing and approval before deployment.
        - IT.PRO-01.2.FE-3: Security controls are confirmed to be implemented consistently across systems following deployment processes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-16
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-16
      name: Cyber supply chain security
      description: Cyber supply chains supporting systems (infrastructure, operating systems, applications
        and data) are secure, resilient and support effective and coordinated cyber security incident
        response.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-16:it.pro-16.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-16
      ref_id: IT.PRO-16.1
      description: Assess the integrity and authenticity of software, components and updates before use,
        and verify provenance where suitable supplier evidence is available.
      annotation: |-
        Not effective:
        - IT.PRO-16.1.NE-1: No verification of software, component or update integrity or authenticity is performed before introduction into systems.
        - IT.PRO-16.1.NE-2: Verification outcomes are not recorded or available for review.
        - IT.PRO-16.1.NE-3: Where verification cannot be performed, no compensating control or remediation paths are documented.

        Partially effective:
        - IT.PRO-16.1.PE-1: Verification is performed for some categories of software but not consistently across operating systems, applications, firmware and dependencies.
        - IT.PRO-16.1.PE-2: Integrity or provenance checks are performed, but they do not provide sufficient assurance for all software, components or updates.
        - IT.PRO-16.1.PE-3: Verification outcomes are recorded for some software, components or updates prior to being introduced into systems, but not consistently.
        - IT.PRO-16.1.PE-4: Compensating controls exist for some unverifiable components but are not formally approved or time-bound.

        Fully effective:
        - IT.PRO-16.1.FE-1: Verification of integrity and provenance is performed for software, components and updates across all relevant categories, and provenance is verified where suitable supplier evidence is available.
        - IT.PRO-16.1.FE-2: Verification uses one or more mechanisms appropriate to the software, component, update and source to provide reliable assurance of integrity and provenance.
        - IT.PRO-16.1.FE-3: Verification outcomes are recorded and available for review.
        - IT.PRO-16.1.FE-4: Where verification cannot be performed, compensating controls are applied, exceptions are time-bound and remediation paths are documented.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-16:it.pro-16.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-16
      ref_id: IT.PRO-16.2
      description: Use vendor advisories and threat intelligence to maintain awareness of supplier, product
        and component exposure to compromise, and act within timeframes proportionate to the risk.
      annotation: |-
        Not effective:
        - IT.PRO-16.2.NE-1: No monitoring is performed for indicators of supply chain compromise affecting software, components or services in use.
        - IT.PRO-16.2.NE-2: Vendor security notifications and threat advisories are not reviewed or actioned.
        - IT.PRO-16.2.NE-3: When supply chain compromise is identified, neither containment nor investigation is performed.
        - IT.PRO-16.2.NE-4: Supply chain compromise events are integrated into neither incident response nor risk management.

        Partially effective:
        - IT.PRO-16.2.PE-1: Monitoring occurs but does not draw on relevant threat intelligence sources or does not cover all in-scope systems.
        - IT.PRO-16.2.PE-2: Notifications and advisories are reviewed but exposure assessment and response are not conducted in a timely manner.
        - IT.PRO-16.2.PE-3: Containment occurs but investigation for evidence of exploitation is not consistently undertaken.
        - IT.PRO-16.2.PE-4: Some integration exists but findings are not reflected in the risk register or incident response procedures.

        Fully effective:
        - IT.PRO-16.2.FE-1: Monitoring covers software, components and services in use, drawing on relevant threat intelligence sources.
        - IT.PRO-16.2.FE-2: Vendor security notifications and threat advisories are reviewed, exposure is assessed and response actions are initiated within defined timeframes.
        - IT.PRO-16.2.FE-3: Identified supply chain compromises are responded to in timeframes defined by the organisation.
        - IT.PRO-16.2.FE-4: Supply chain compromise events are integrated with incident response and reflected in the risk register.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-13
      name: Identity, credential and access management
      description: Robust and secure identity, credential and access management is used to establish,
        maintain and control access to systems (infrastructure, operating systems, applications and data)
        and to support effective detection of identity and credential misuse.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13:it.pro-13.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13
      ref_id: IT.PRO-13.1
      description: Identify and disable or remove default and unused accounts regularly, permitting exceptions
        only where the account is documented, justified, hardened and monitored.
      annotation: |-
        Not effective:
        - IT.PRO-13.1.NE-1: No review of default or unused accounts has been conducted within the review period defined by the organisation.
        - IT.PRO-13.1.NE-2: Default vendor accounts remain enabled on production systems without appropriate documentation, justification, hardening and monitoring in place for their use.
        - IT.PRO-13.1.NE-3: No process exists to identify accounts that have not authenticated within a defined period.

        Partially effective:
        - IT.PRO-13.1.PE-1: A review has been conducted but does not cover all assets.
        - IT.PRO-13.1.PE-2: Default accounts have been identified but some remain enabled without documented justification.
        - IT.PRO-13.1.PE-3: Unused accounts are identified but remediation is incomplete or delayed beyond defined timeframes.

        Fully effective:
        - IT.PRO-13.1.FE-1: A review of accounts has been completed within the defined review period covering all assets.
        - IT.PRO-13.1.FE-2: Default accounts are disabled or have approved justification for remaining active, with appropriate monitoring and compensating controls for their use in place.
        - IT.PRO-13.1.FE-3: Accounts that show no evidence of use, other than approved emergency access accounts, are identified and either disabled or removed in accordance with defined timeframes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13:it.pro-13.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13
      ref_id: IT.PRO-13.2
      description: Store authentication keys, secrets and tokens in approved secure repositories with
        access controls, including MFA.
      annotation: |-
        Not effective:
        - IT.PRO-13.2.NE-1: Credentials are stored in plaintext, spreadsheets, shared drives or other unapproved locations as standard practice.
        - IT.PRO-13.2.NE-2: No approved secure repository is in use to store authentication keys, secrets and tokens.
        - IT.PRO-13.2.NE-3: Access to credential stores is neither controlled nor audited.
        - IT.PRO-13.2.NE-4: Access controls such as MFA are not enabled for authentication to secure repositories.

        Partially effective:
        - IT.PRO-13.2.PE-1: An approved secure repository is in use but does not cover all authentication keys, secrets and tokens within scope.
        - IT.PRO-13.2.PE-2: Access controls for secure repositories are in place but access logging is not enabled or not reviewed.
        - IT.PRO-13.2.PE-3: MFA is enforced for some, but not all, applicable users, repositories or authentication pathways, and the remaining exceptions are documented and subject to remediation.

        Fully effective:
        - IT.PRO-13.2.FE-1: Authentication keys, secrets and tokens within scope are stored in approved secure repositories, with any authorised exceptions documented, risk-assessed and managed in accordance with organisationally defined requirements.
        - IT.PRO-13.2.FE-2: Access to secure repositories is restricted using attribute or role-based access controls, MFA is enforced for all applicable authentication pathways, and access is logged and reviewed and investigated where necessary.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13:it.pro-13.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13
      ref_id: IT.PRO-13.4
      description: Use phishing-resistant MFA for users authenticating to systems, including from untrusted,
        external or high-risk locations.
      annotation: |-
        Not effective:
        - IT.PRO-13.4.NE-1: Phishing-resistant MFA is not enforced for interactive user authentication to systems.
        - IT.PRO-13.4.NE-2: MFA is deployed but uses non-phishing-resistant methods, such as SMS, voice, or push-only authentication instead of phishing-resistant MFA.
        - IT.PRO-13.4.NE-3: No access policies differentiate between trusted and untrusted, external or high-risk locations.
        - IT.PRO-13.4.NE-4: Access from untrusted, external or high-risk locations is permitted without MFA, or with non-phishing-resistant MFA.

        Partially effective:
        - IT.PRO-13.4.PE-1: Phishing-resistant MFA is deployed for some but not all systems within scope.
        - IT.PRO-13.4.PE-2: Access policies exist but do not cover all organisationally defined high-risk location categories.
        - IT.PRO-13.4.PE-3: Exceptions or alternative authentication pathways allow routine or recurring authentication without phishing-resistant MFA, or emergency access arrangements are not adequately restricted, monitored, tested or reviewed.

        Fully effective:
        - IT.PRO-13.4.FE-1: Phishing-resistant MFA is enforced for all routine interactive user authentication to systems within scope.
        - IT.PRO-13.4.FE-2: Phishing-resistant MFA is enforced for routine authentication attempts from untrusted, external or high-risk locations.
        - IT.PRO-13.4.FE-3: Customer-facing services provide a phishing-resistant MFA option for authentication.
        - IT.PRO-13.4.FE-4: Emergency access arrangements are periodically tested and reviewed to confirm that they remain operational, appropriately protected and limited to their intended purpose. Credentials or authentication factors used for emergency access are securely managed and are not used for routine administration.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13:it.pro-13.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13
      ref_id: IT.PRO-13.5
      description: Disable legacy authentication protocols or, where this is not feasible, restrict and
        monitor their use, apply compensating controls and establish a time-bound decommissioning plan.
      annotation: |-
        Not effective:
        - IT.PRO-13.5.NE-1: Legacy authentication protocols that cannot enforce modern authentication controls remain enabled and in active use without restriction.
        - IT.PRO-13.5.NE-2: No assessment has been conducted to identify which legacy authentication protocols are in use within the environment.
        - IT.PRO-13.5.NE-3: Authentication mechanisms transmitting credentials in cleartext or using weak cryptographic primitives remain enabled and no action has been taken to disable them.
        - IT.PRO-13.5.NE-4: Where legacy protocols are retained, no compensating controls, no monitoring and no decommissioning timelines are in place.

        Partially effective:
        - IT.PRO-13.5.PE-1: Legacy authentication protocols have been identified and are partially restricted but some remain enabled across systems within scope without justification.
        - IT.PRO-13.5.PE-2: An assessment has been conducted but does not cover all in-scope systems, or the inventory of legacy protocols in use is not maintained.
        - IT.PRO-13.5.PE-3: Some weak authentication mechanisms have been disabled but others remain enabled without documented justification or remediation plan.
        - IT.PRO-13.5.PE-4: Compensating controls exist for some retained legacy protocols but monitoring is inconsistent or decommissioning timelines are not defined.

        Fully effective:
        - IT.PRO-13.5.FE-1: Legacy authentication protocols that cannot enforce modern authentication controls have been identified and disabled across systems within scope, excluding documented and risk accepted exceptions.
        - IT.PRO-13.5.FE-2: An assessment of legacy authentication protocol use has been conducted across in-scope systems and the inventory is maintained.
        - IT.PRO-13.5.FE-3: Where retention is necessary, compensating controls are applied and decommissioning timelines are recorded and tracked.
        - IT.PRO-13.5.FE-4: Ongoing use of legacy authentication protocols is regularly risk reviewed, accepted and recorded in the organisation’s risk register.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13:it.pro-13.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-13
      ref_id: IT.PRO-13.6
      description: Ensure that user, machine, system and service account credentials are unique per system
        or account, particularly in high-privilege contexts.
      annotation: |-
        Not effective:
        - IT.PRO-13.6.NE-1: Local administrator credentials are shared across the device fleet, or service or privileged account credentials are routinely reused across systems.
        - IT.PRO-13.6.NE-2: Credential uniqueness is not enforced for applicable user, machine, system or service identities.
        - IT.PRO-13.6.NE-3: Credential uniqueness has not been addressed in high-privilege contexts, including domain administration, cloud administration or automation platforms.
        - IT.PRO-13.6.NE-4: Where credential uniqueness cannot be enforced, neither compensating controls nor remediation paths are in place.

        Partially effective:
        - IT.PRO-13.6.PE-1: Local administrator credential uniqueness has been implemented for some device populations but coverage is incomplete across the device fleet.
        - IT.PRO-13.6.PE-2: A technical mechanism is in place but applies to only a subset of credential types or systems within scope.
        - IT.PRO-13.6.PE-3: Credential uniqueness has been addressed in some high-privilege contexts but gaps remain in others.
        - IT.PRO-13.6.PE-4: Compensating controls exist for some shared credentials but monitoring is inconsistent or remediation plans do not exist.

        Fully effective:
        - IT.PRO-13.6.FE-1: Credentials for applicable local administrative accounts are unique to each system or account.
        - IT.PRO-13.6.FE-2: Credential uniqueness is consistently enforced for applicable user, machine, system and service identities.
        - IT.PRO-13.6.FE-3: Credential uniqueness is enforced consistently in high-privilege contexts, with managed identities or equivalent capabilities used in preference to shared static credentials wherever feasible.
        - IT.PRO-13.6.FE-4: Where uniqueness cannot be enforced, compensating controls are applied, the use of the shared credentials is monitored, and a remediation plan exists.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-12
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-12
      name: Least privilege access
      description: Users are granted the minimum access to systems (infrastructure, operating systems,
        applications and data) required to undertake their duties or functions.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-12:it.pro-12.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-12
      ref_id: IT.PRO-12.1
      description: Periodically review and update access privileges in alignment with current roles, duties
        and business requirements.
      annotation: |-
        Not effective:
        - IT.PRO-12.1.NE-1: Access privileges are not reviewed against current roles, duties and business requirements.
        - IT.PRO-12.1.NE-2: Access reviews do not identify privileges that are no longer required.
        - IT.PRO-12.1.NE-3: Access privileges are not updated when personnel roles, duties or business requirements change.
        - IT.PRO-12.1.NE-4: Access privileges are not mapped to roles, duties and business requirements.

        Partially effective:
        - IT.PRO-12.1.PE-1: Access reviews are conducted for some accounts or systems, but coverage is incomplete.
        - IT.PRO-12.1.PE-2: Reviews identify excessive or obsolete privileges, but updates are incomplete or not completed within timeframes defined by the organisation.
        - IT.PRO-12.1.PE-3: A process to review access privileges exists but only occurs on an ad hoc basis.
        - IT.PRO-12.1.PE-4: Some access privileges are mapped to roles, duties and business requirements, but not all.

        Fully effective:
        - IT.PRO-12.1.FE-1: Access privileges for all applicable accounts and systems are reviewed within a cycle defined by the organisation and aligned with current roles, duties and business requirements.
        - IT.PRO-12.1.FE-2: Privileges identified as excessive or obsolete are removed or updated within timeframes defined by the organisation.
        - IT.PRO-12.1.FE-3: Review outcomes and resulting access changes are documented and available as evidence.
        - IT.PRO-12.1.FE-4: Access privileges are mapped to current roles, duties and business requirements.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-12:it.pro-12.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-12
      ref_id: IT.PRO-12.2
      description: Grant only authorised administrative roles permissions to create, modify or delete
        accounts and roles, and access privileged functions or applications.
      annotation: |-
        Not effective:
        - IT.PRO-12.2.NE-1: Non-administrative users can create, modify or delete accounts or roles.
        - IT.PRO-12.2.NE-2: Delegated permissions are broad and have not been audited.

        Partially effective:
        - IT.PRO-12.2.PE-1: Permissions are restricted to administrative roles but some delegated permissions are broader than required.
        - IT.PRO-12.2.PE-2: Approval workflows exist for some high-impact changes but not all.

        Fully effective:
        - IT.PRO-12.2.FE-1: Only designated administrative roles can create, modify or delete accounts and roles.
        - IT.PRO-12.2.FE-2: Delegated permissions are audited and scoped to the minimum required.
        - IT.PRO-12.2.FE-3: Approval workflows are enforced for high-impact identity and access changes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-12:it.pro-12.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-12
      ref_id: IT.PRO-12.3
      description: Provision user, administrative and non-person accounts with only the minimum access
        and privileges required to perform defined operational functions.
      annotation: |-
        Not effective:
        - IT.PRO-12.3.NE-1: Accounts are provisioned with broad default permissions that exceed operational requirements.
        - IT.PRO-12.3.NE-2: Administrative and day-to-day user functions share the same account, with no separate privileged accounts.

        Partially effective:
        - IT.PRO-12.3.PE-1: Minimum privilege provisioning is defined but not consistently applied to all account types.
        - IT.PRO-12.3.PE-2: Administrative accounts are separated from user accounts but some exceptions exist without documented justification.

        Fully effective:
        - IT.PRO-12.3.FE-1: All accounts are provisioned with documented minimum permissions aligned to defined operational functions.
        - IT.PRO-12.3.FE-2: Separate accounts are allocated for privileged and day-to-day functions, and controls prevent privileged use from day-to-day context.
        - IT.PRO-12.3.FE-3: Non-person and service accounts are scoped to their specific integration requirements.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-05
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-05
      name: Secure administration
      description: Systems (infrastructure, operating systems, applications and data) are administered
        in a secure, accountable and auditable manner.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-05:it.pro-05.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-05
      ref_id: IT.PRO-05.1
      description: Ensure administrative activities can only be performed from dedicated and hardened
        environments that are isolated from unprivileged user workloads.
      annotation: |-
        Not effective:
        - IT.PRO-05.1.NE-1: Administrative access to systems is routinely performed from standard user devices without additional controls to protect the administrative session.
        - IT.PRO-05.1.NE-2: No dedicated or hardened administrative environment exists.
        - IT.PRO-05.1.NE-3: Exceptions to the use of dedicated administrative environments are neither identified nor assessed.

        Partially effective:
        - IT.PRO-05.1.PE-1: A dedicated administrative environment has been established, but administrative access is not consistently routed through it.
        - IT.PRO-05.1.PE-2: Administrative endpoints have been hardened, but unprivileged user workloads or unnecessary functions remain accessible.
        - IT.PRO-05.1.PE-3: Exceptions are documented, but their justification, risk acceptance, compensating controls or review arrangements are incomplete or inconsistently applied.

        Fully effective:
        - IT.PRO-05.1.FE-1: Administrative sessions originate from dedicated and hardened administrative environments that are isolated from unprivileged user workloads. Where this cannot be technically enforced, exceptions are documented, risk-assessed, formally accepted and protected by compensating controls.
        - IT.PRO-05.1.FE-2: Administrative environments are hardened and restricted to the functions required for authorised administration.
        - IT.PRO-05.1.FE-3: Exceptions are limited to systems or services that cannot support administration through a dedicated environment, are periodically reviewed and are removed when the technical limitation no longer applies.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-05:it.pro-05.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-05
      ref_id: IT.PRO-05.2
      description: Enforce explicit session establishment controls before privileged actions are permitted,
        including the use of time-bound privilege grants.
      annotation: |-
        Not effective:
        - IT.PRO-05.2.NE-1: Privileged access is standing and does not require explicit activation or time-bound grants, excluding approved break-glass and emergency access accounts.
        - IT.PRO-05.2.NE-2: No re-authentication or step-up authentication is required before privileged sessions.

        Partially effective:
        - IT.PRO-05.2.PE-1: Time-bound access is implemented for some privileged roles but standing access remains for others.
        - IT.PRO-05.2.PE-2: Session duration limits exist but are not consistently enforced or are set excessively long.

        Fully effective:
        - IT.PRO-05.2.FE-1: Time-bound privilege grants are enforced for applicable privileged roles, with defined maximum session durations and approved emergency access arrangements.
        - IT.PRO-05.2.FE-2: Re-authentication or step-up authentication is required before privilege activation.
        - IT.PRO-05.2.FE-3: All privilege activations are logged with activating user, role and timeframes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-05:it.pro-05.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-05
      ref_id: IT.PRO-05.3
      description: Record all administrative or management actions that modify systems, configurations
        or controls, including the details of the associated user, timestamp and target.
      annotation: |-
        Not effective:
        - IT.PRO-05.3.NE-1: Administrative or management actions that modify systems, configurations or controls are not logged.
        - IT.PRO-05.3.NE-2: Logs do not capture sufficient detail to identify who made a change, when and to what target.

        Partially effective:
        - IT.PRO-05.3.PE-1: Logging is enabled and provides useful coverage, but does not cover all applicable administrative or management platforms.
        - IT.PRO-05.3.PE-2: Logs capture the administrator identity and action but lack detail on the target or change nature.

        Fully effective:
        - IT.PRO-05.3.FE-1: Comprehensive audit logging to capture all administrative or management actions is enabled on all platforms in scope.
        - IT.PRO-05.3.FE-2: Logs capture administrator identity, timestamp, target object and nature of change.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-04
      name: Secure configuration management
      description: Systems (infrastructure, operating systems and applications) are securely configured
        to approved and maintained baselines, including by reducing attack surfaces and attack paths,
        with configurations continually monitored and consistently enforced.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-04:it.pro-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-04
      ref_id: IT.PRO-04.1
      description: Define approved configuration baselines, informed by vendor and industry hardening
        guidance, that disable or remove unnecessary services, insecure settings, and unsupported or weak
        communication protocols.
      annotation: |-
        Not effective:
        - IT.PRO-04.1.NE-1: No documented configuration baseline exists for assets.
        - IT.PRO-04.1.NE-2: Systems are deployed with vendor defaults and no documented hardening has been applied.

        Partially effective:
        - IT.PRO-04.1.PE-1: A baseline exists but does not address all applicable asset types.
        - IT.PRO-04.1.PE-2: The baseline is documented but has not been reviewed or updated within the cycle defined by the organisation.
        - IT.PRO-04.1.PE-3: The baseline exists but rationale for configuration decisions is not documented.

        Fully effective:
        - IT.PRO-04.1.FE-1: A documented and approved baseline exists for all applicable asset types.
        - IT.PRO-04.1.FE-2: The baseline disables or removes unnecessary services, insecure settings, and unsupported or weak communication protocols.
        - IT.PRO-04.1.FE-3: Configuration decisions are documented with rationale to support drift assessment.
        - IT.PRO-04.1.FE-4: The baseline is reviewed and updated on a cycle defined by the organisation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-04:it.pro-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-04
      ref_id: IT.PRO-04.2
      description: Deploy approved configuration baselines on systems, including infrastructure, operating
        systems and applications.
      annotation: |-
        Not effective:
        - IT.PRO-04.2.NE-1: Approved baselines have not been applied to assets.
        - IT.PRO-04.2.NE-2: Baseline deployment has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-04.2.PE-1: Approved baselines have been implemented where available, but some relevant asset types are not covered by an approved baseline.
        - IT.PRO-04.2.PE-2: Deployment has occurred but validation through technical assessment is incomplete or not current.
        - IT.PRO-04.2.PE-3: Approved baselines have been deployed, but coverage for all applicable assets is inconsistent.

        Fully effective:
        - IT.PRO-04.2.FE-1: Approved baselines have been applied to all applicable assets.
        - IT.PRO-04.2.FE-2: Deployment has been validated through technical assessment.
        - IT.PRO-04.2.FE-3: Coverage metrics are available demonstrating deployment completeness.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-04:it.pro-04.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-04
      ref_id: IT.PRO-04.3
      description: Detect and respond to configuration drift using scheduled technical assessments and,
        where supported, automated monitoring, based on system criticality and change rate.
      annotation: |-
        Not effective:
        - IT.PRO-04.3.NE-1: No mechanism exists to detect configuration drift from approved baselines.
        - IT.PRO-04.3.NE-2: Assessments to detect configuration drift have not been conducted within the review period defined by the organisation.
        - IT.PRO-04.3.NE-3: Assessments do not systematically identify instances of configuration drift for assets.

        Partially effective:
        - IT.PRO-04.3.PE-1: Drift detection is in place but does not cover all applicable assets.
        - IT.PRO-04.3.PE-2: Drift is detected but the remediation process is informal or response timeframes are not defined.

        Fully effective:
        - IT.PRO-04.3.FE-1: Automated configuration monitoring or regular technical assessments detect drift across the applicable assets, occurring at a frequency based on system criticality and change rate.
        - IT.PRO-04.3.FE-2: A documented remediation process exists with defined response timeframes aligned to severity.
        - IT.PRO-04.3.FE-3: Drift events are tracked to closure with evidence of remediation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-06
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-06
      name: Vulnerability management
      description: Vulnerabilities in systems (infrastructure, operating systems, applications and data)
        are identified, documented, validated and prioritised for remediation or mitigation in a timely
        manner, with all remediation and mitigation actions verified for effectiveness.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-06:it.pro-06.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-06
      ref_id: IT.PRO-06.1
      description: Identify known software and configuration weaknesses of assets through continuous and
        repeatable assessment activities, including vulnerability scanning activities.
      annotation: |-
        Not effective:
        - IT.PRO-06.1.NE-1: Vulnerability scanning activities are not undertaken.
        - IT.PRO-06.1.NE-2: No routine vulnerability assessment activity has been conducted within a period defined by the organisation.
        - IT.PRO-06.1.NE-3: Advisories for relevant software and configuration weaknesses for organisational assets are not reviewed and assessed for impact.

        Partially effective:
        - IT.PRO-06.1.PE-1: Vulnerability scanning is deployed but does not cover all applicable assets.
        - IT.PRO-06.1.PE-2: Vulnerability scans are conducted but results are not reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.PE-3: Vulnerability scans are conducted but frequency is not regular enough to enable timely response.
        - IT.PRO-06.1.PE-4: Scanning covers software vulnerabilities but not configuration weaknesses.
        - IT.PRO-06.1.PE-5: Advisories for relevant software and configuration weaknesses for organisational assets are reviewed on an ad hoc basis, or only for some assets.

        Fully effective:
        - IT.PRO-06.1.FE-1: All applicable assets are included in routine vulnerability scanning, and scanning frequency enables timely response.
        - IT.PRO-06.1.FE-2: Scanning covers both software vulnerabilities and configuration weaknesses.
        - IT.PRO-06.1.FE-3: Results are reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.FE-4: Advisories for relevant software and configuration weaknesses in all organisational assets are regularly reviewed and assessed for impact.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-06:it.pro-06.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-06
      ref_id: IT.PRO-06.2
      description: Apply security patches or updates within defined risk-based timeframes or automatically
        where operational impact is low.
      annotation: |-
        Not effective:
        - IT.PRO-06.2.NE-1: No defined patching timeframes exist for applicable assets.
        - IT.PRO-06.2.NE-2: Patches are not applied or are applied on an ad hoc basis with no tracking.

        Partially effective:
        - IT.PRO-06.2.PE-1: Expected patching timeframes are defined by the organisation but are not consistently met.
        - IT.PRO-06.2.PE-2: Patches are applied but compensating controls are not documented where operational constraints prevent timely patching.
        - IT.PRO-06.2.PE-3: Patching coverage metrics exist but show significant gaps.

        Fully effective:
        - IT.PRO-06.2.FE-1: Risk-based patching timeframes defined by the organisation are in place and consistently met.
        - IT.PRO-06.2.FE-2: Patching is prioritised based on vulnerability severity, exposure and exploit availability.
        - IT.PRO-06.2.FE-3: Where operational constraints prevent timely patching, compensating controls are documented and approved.
        - IT.PRO-06.2.FE-4: Patching coverage metrics account for all applicable assets, with any exclusions identified and formally risk accepted.
        - IT.PRO-06.2.FE-5: Automatic patching of assets is applied where available and the organisation has determined operational impact is low.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-06:it.pro-06.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-06
      ref_id: IT.PRO-06.3
      description: Remediate or mitigate vulnerabilities exceeding defined risk thresholds within defined
        timeframes based on exploitation, exposure, criticality, impact and compensating controls, and
        verify treatment effectiveness.
      annotation: |-
        Not effective:
        - IT.PRO-06.3.NE-1: No risk thresholds are defined for vulnerability remediation.
        - IT.PRO-06.3.NE-2: Vulnerabilities exceeding acceptable risk levels are not tracked or remediated.

        Partially effective:
        - IT.PRO-06.3.PE-1: Risk thresholds are defined but vulnerabilities exceeding them are not consistently remediated within defined timeframes.
        - IT.PRO-06.3.PE-2: Compensating controls are applied in some cases but are not formally documented or approved.

        Fully effective:
        - IT.PRO-06.3.FE-1: Risk thresholds defined by the organisation exist, and vulnerabilities exceeding them are remediated or have approved compensating controls within organisationally defined timeframes.
        - IT.PRO-06.3.FE-2: Remediation and mitigation actions are tracked to closure with verification that actions reduced the risk as intended.
        - IT.PRO-06.3.FE-3: The process is sustained, with historical data demonstrating consistent performance across organisationally defined reporting periods.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-07
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-07
      name: Trustworthy software
      description: Systems (operating systems and applications) only permit the execution of software
        that is supported, verified and authorised.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-07:it.pro-07.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-07
      ref_id: IT.PRO-07.1
      description: Permit only supported, verified and organisation-authorised software to execute on
        systems, with exceptions minimised, formally risk accepted, time-bound, monitored and regularly
        reviewed.
      annotation: |-
        Not effective:
        - IT.PRO-07.1.NE-1: Unsupported, unverified or unauthorised software can execute without restriction.
        - IT.PRO-07.1.NE-2: The list of approved software does not exist.

        Partially effective:
        - IT.PRO-07.1.PE-1: Execution restriction controls are deployed but do not cover all applicable assets.
        - IT.PRO-07.1.PE-2: The organisation maintains a list of approved software, but it has not been reviewed within timeframes defined by the organisation.
        - IT.PRO-07.1.PE-3: Execution restrictions are in place but integrity verification of approved software is not performed.
        - IT.PRO-07.1.PE-4: Exceptions to execution restrictions are granted without formal approval or time-bounding.

        Fully effective:
        - IT.PRO-07.1.FE-1: Controls restrict execution to supported, organisation-authorised and integrity-verified software on all applicable assets.
        - IT.PRO-07.1.FE-2: The organisation maintains a list of approved software and reviews it within the timeframes defined by the organisation.
        - IT.PRO-07.1.FE-3: Integrity of permitted software is verified using trusted mechanisms appropriate to the software and its source.
        - IT.PRO-07.1.FE-4: Exceptions are formally approved, documented, time-bound and reviewed on a regular cycle defined by the organisation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-07:it.pro-07.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-07
      ref_id: IT.PRO-07.2
      description: Restrict administrative and management tooling to approved software sets and executed
        from only authorised, known locations.
      annotation: |-
        Not effective:
        - IT.PRO-07.2.NE-1: No approved administrative toolset is defined.
        - IT.PRO-07.2.NE-2: No restrictions are placed on the location administrative tooling can be executed from.
        - IT.PRO-07.2.NE-3: No controls prevent unapproved administrative tools, including tools commonly used in post-compromise activity, from executing on managed assets.

        Partially effective:
        - IT.PRO-07.2.PE-1: An approved toolset is defined but not consistently enforced across all assets.
        - IT.PRO-07.2.PE-2: Administrative tooling is configured to execute from known locations, but privileged users can still run tooling from unapproved locations.
        - IT.PRO-07.2.PE-3: Some unapproved administrative tools are blocked but enforcement gaps exist.

        Fully effective:
        - IT.PRO-07.2.FE-1: A defined and enforced approved toolset exists for administrative and management activities, and execution is limited to authorised, known locations.
        - IT.PRO-07.2.FE-2: Administrative and management tooling outside the approved set is blocked from execution, including from unauthorised locations.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-10
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-10
      name: Regular and proven backups
      description: Systems (infrastructure, operating systems, applications and data) are regularly backed
        up in a secure and proven manner, including through the validation of restoration capabilities.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-10:it.pro-10.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-10
      ref_id: IT.PRO-10.1
      description: Back up important data, applications and settings on a defined schedule to secure,
        resilient storage protected by encryption and immutable, offline, logically isolated or equivalent
        controls.
      annotation: |-
        Not effective:
        - IT.PRO-10.1.NE-1: No managed backup process exists for important data, applications and settings.
        - IT.PRO-10.1.NE-2: Backup storage is neither encrypted nor protected by immutable, offline, logically isolated or equivalent controls.

        Partially effective:
        - IT.PRO-10.1.PE-1: Important data, applications and settings are backed up, but backup schedules are not defined, do not cover all important assets, or are not consistently met.
        - IT.PRO-10.1.PE-2: Backups are encrypted but no immutable, offline, logically isolated or equivalent resilience controls are consistently applied.
        - IT.PRO-10.1.PE-3: Backups use immutable, offline, logically isolated or equivalent controls, but encryption is not consistently enforced.

        Fully effective:
        - IT.PRO-10.1.FE-1: All important data, applications and settings are backed up according to schedules defined by the organisation and aligned with their recovery requirements.
        - IT.PRO-10.1.FE-2: Backup schedules are monitored, and missed or unsuccessful backups are identified, investigated and remediated within timeframes defined by the organisation.
        - IT.PRO-10.1.FE-3: Backup storage is encrypted and protected by immutable, offline, logically isolated or equivalent controls.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-10:it.pro-10.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-10
      ref_id: IT.PRO-10.2
      description: Isolate backup repositories from general user environments and production workloads,
        ensuring they are separated from primary systems to prevent unauthorised access, modification
        or deletion.
      annotation: |-
        Not effective:
        - IT.PRO-10.2.NE-1: Backup repositories are accessible from the production environment or by production administrators.
        - IT.PRO-10.2.NE-2: Compromise of a system would provide a direct path to access, modify or delete its own backups.

        Partially effective:
        - IT.PRO-10.2.PE-1: Backup repositories are logically separated but use credentials managed by the same identity platform as production.
        - IT.PRO-10.2.PE-2: Isolation is implemented but has not been tested or validated.

        Fully effective:
        - IT.PRO-10.2.FE-1: Backup repositories are isolated from production environments and general user access.
        - IT.PRO-10.2.FE-2: Access is controlled through credentials and administrative paths isolated from compromise of the primary identity environment.
        - IT.PRO-10.2.FE-3: Isolation has been validated to confirm that compromise of a system does not provide access to backups.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-10:it.pro-10.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-10
      ref_id: IT.PRO-10.3
      description: Conduct regular testing of backup and restoration procedures to ensure that backups
        are reliable and capable of meeting defined recovery time objectives and recovery point objectives.
      annotation: |-
        Not effective:
        - IT.PRO-10.3.NE-1: No restoration test has been conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.NE-2: No backup or restoration procedures exist.
        - IT.PRO-10.3.NE-3: Restoration testing demonstrates that backups cannot be restored, or consistently fail to meet defined recovery time or recovery point objectives.

        Partially effective:
        - IT.PRO-10.3.PE-1: Restoration testing has been conducted but does not cover all important assets.
        - IT.PRO-10.3.PE-2: Backup procedures exist but have never been tested.
        - IT.PRO-10.3.PE-3: Testing has been conducted but coverage is incomplete or some tests did not meet the expected recovery time or recovery point objectives.

        Fully effective:
        - IT.PRO-10.3.FE-1: Restoration testing covering important assets is conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.FE-2: Testing validates that restoration meets the expected recovery time and recovery point objectives.
        - IT.PRO-10.3.FE-3: Test results are documented and gaps identified during testing are remediated.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-18
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-18
      name: Network segmentation and segregation
      description: Systems (infrastructure, operating systems and applications) are segmented into network
        zones based on business criticality and trust levels, with only authorised, controlled and monitored
        inbound and outbound communication paths between network zones permitted.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-18:it.pro-18.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-18
      ref_id: IT.PRO-18.1
      description: Isolate systems within network zones based on business criticality and trust level,
        and restrict and monitor inbound and outbound access to explicitly approved pathways and services.
      annotation: |-
        Not effective:
        - IT.PRO-18.1.NE-1: Systems are deployed on shared or flat network segments with no segregation between functions or trust levels.
        - IT.PRO-18.1.NE-2: No access controls restrict network access from external or general user networks to in-scope systems.
        - IT.PRO-18.1.NE-3: Segmentation is documented or administratively defined but not enforced by technical controls.
        - IT.PRO-18.1.NE-4: Segmentation has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-18.1.PE-1: Network segmentation has been implemented but does not cover all in-scope systems, or segments are defined inconsistently.
        - IT.PRO-18.1.PE-2: Access controls exist between segments, but deny-by-default is not enforced, or some pathways are permitted without documented approval.
        - IT.PRO-18.1.PE-3: Technical enforcement is in place for some segments but relies on a single mechanism that does not provide meaningful isolation.
        - IT.PRO-18.1.PE-4: Validation has been performed for some segments but not consistently across in-scope systems, or validation is out of date.
        - IT.PRO-18.1.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.1.FE-1: Systems within scope are deployed in network segments defined according to function, criticality and trust level, with segmentation applied consistently.
        - IT.PRO-18.1.FE-2: Deny-by-default access controls are enforced between segments, with access from external and general user networks limited to documented and approved pathways.
        - IT.PRO-18.1.FE-3: Segmentation is enforced through network-layer technical controls that provide meaningful isolation.
        - IT.PRO-18.1.FE-4: Segmentation has been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.1.FE-5: Approved pathways are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and changes reflected in the access control configuration.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-18:it.pro-18.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-18
      ref_id: IT.PRO-18.2
      description: Limit lateral movement between, and within, network segments to explicitly approved
        pathways and services, based on business requirements and trust levels.
      annotation: |-
        Not effective:
        - IT.PRO-18.2.NE-1: No controls limit lateral movement between or within network segments.
        - IT.PRO-18.2.NE-2: Lateral movement is permitted by default across the environment, with restrictions applied only on an exception basis.
        - IT.PRO-18.2.NE-3: Approved pathways are not documented.
        - IT.PRO-18.2.NE-4: Lateral movement controls have not been validated through technical assessment.
        - IT.PRO-18.2.NE-5: Pathways and services are not reviewed after initial approval.

        Partially effective:
        - IT.PRO-18.2.PE-1: Controls limit lateral movement between segments but no controls operate within segments.
        - IT.PRO-18.2.PE-2: Restrictions are applied to some pathways, but the default position remains permissive in parts of the environment.
        - IT.PRO-18.2.PE-3: Approved pathways are documented but documentation is out of date or incomplete.
        - IT.PRO-18.2.PE-4: Validation has been performed but does not cover all in-scope segments, or is out of date.
        - IT.PRO-18.2.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.2.FE-1: Controls limit lateral movement both between and within segments, with deny-by-default applied at each boundary.
        - IT.PRO-18.2.FE-2: Pathways and services are explicitly approved based on documented business requirements and trust levels, with all other lateral movement denied.
        - IT.PRO-18.2.FE-3: Approved pathways are documented, reflect the current configuration and identify the business requirement and trust relationship justifying each.
        - IT.PRO-18.2.FE-4: Lateral movement controls have been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.2.FE-5: Pathways and services are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and the configuration updated to reflect approved changes.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-09
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-09
      name: Content filtering
      description: Data communicated between different security domains for systems (infrastructure and
        applications) is controlled and subject to inspection and verification.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-09:it.pro-09.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-09
      ref_id: IT.PRO-09.1
      description: Inspect outbound content flows to detect unauthorised transfer of sensitive or high-value
        data.
      annotation: |-
        Not effective:
        - IT.PRO-09.1.NE-1: No outbound content inspection is deployed.
        - IT.PRO-09.1.NE-2: Sensitive data can leave the organisation through any egress path without detection or control.

        Partially effective:
        - IT.PRO-09.1.PE-1: Outbound inspection is deployed but does not cover all applicable egress paths.
        - IT.PRO-09.1.PE-2: Rules are configured but do not cover all classified, regulated or high-value data types.
        - IT.PRO-09.1.PE-3: Alerts are generated but are not triaged or acted upon in a timely manner.

        Fully effective:
        - IT.PRO-09.1.FE-1: Outbound content inspection is deployed covering all applicable egress paths.
        - IT.PRO-09.1.FE-2: Rules are configured to detect unauthorised transfer of classified, regulated and high-value data.
        - IT.PRO-09.1.FE-3: Alerts are triaged and responded to within accepted risk timeframes defined by the organisation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-14
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: PRO-14
      name: Cyber security awareness training
      description: Personnel are provided with ongoing cyber security awareness training, including operational
        security considerations, tailored to their duties, access levels and current cyber threats.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-14:it.pro-14.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:pro-14
      ref_id: IT.PRO-14.1
      description: Ensure all personnel receive cyber security awareness training, that is tailored to
        how they will interact with systems, applications and data in their assigned roles, before being
        granted access to organisational systems and data.
      annotation: |-
        Not effective:
        - IT.PRO-14.1.NE-1: No requirement exists for personnel to complete cyber security awareness training before being granted access to critical, privileged or business systems.
        - IT.PRO-14.1.NE-2: No training completion records are maintained.

        Partially effective:
        - IT.PRO-14.1.PE-1: A training program exists but is not tailored to the specific risks of the systems in-scope.
        - IT.PRO-14.1.PE-2: A requirement to complete training before access is granted exists but is not consistently enforced.
        - IT.PRO-14.1.PE-3: Completion records are maintained but show significant gaps in coverage.

        Fully effective:
        - IT.PRO-14.1.FE-1: Role-tailored training programs address the specific risks, data handling obligations and incident reporting requirements relevant to in-scope systems.
        - IT.PRO-14.1.FE-2: All personnel complete role-tailored training before being granted access to organisational systems and data, with refresher training mandated within a cycle defined by the organisation.
        - IT.PRO-14.1.FE-3: Completion records are maintained and demonstrate full coverage.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: DET-01
      name: Centralised event logging
      description: Security-relevant event logs and configuration changes for systems (infrastructure,
        operating systems, applications and data) are centrally collected, protected against unauthorised
        modification or deletion, and retained to support effective cyber security event detection and
        investigation.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-01:it.det-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-01
      ref_id: IT.DET-01.1
      description: Protect event logs from unauthorised access, modification or deletion, including by
        encrypting them during transit and at rest and securing the systems and accounts used to store,
        manage and analyse them.
      annotation: |-
        Not effective:
        - IT.DET-01.1.NE-1: Logs generated by applicable assets are not protected from modification or deletion.
        - IT.DET-01.1.NE-2: Log access is not restricted to authorised roles with a business need.
        - IT.DET-01.1.NE-3: Logs are neither encrypted during transit nor at rest.

        Partially effective:
        - IT.DET-01.1.PE-1: Logs are forwarded but integrity protections are not in place at the source.
        - IT.DET-01.1.PE-2: Log access is restricted but some roles retain the ability to modify or delete logs.
        - IT.DET-01.1.PE-3: Logs are encrypted during transit but are not protected with encryption at rest (or vice versa).

        Fully effective:
        - IT.DET-01.1.FE-1: Logs are protected against modification or deletion.
        - IT.DET-01.1.FE-2: Logs are encrypted in transit and at rest.
        - IT.DET-01.1.FE-3: Access to logs is restricted to authorised roles with a business need.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-01:it.det-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-01
      ref_id: IT.DET-01.2
      description: Forward high-value, security-relevant event logs and configuration changes from infrastructure,
        operating systems and applications to a central log storage capability.
      annotation: |-
        Not effective:
        - IT.DET-01.2.NE-1: Security-relevant logs from assets are not forwarded to a central logging capability.
        - IT.DET-01.2.NE-2: High-value, security-relevant event logs or configuration changes from infrastructure, operating systems or applications are not forwarded.

        Partially effective:
        - IT.DET-01.2.PE-1: High-value, security-relevant event logs are forwarded, but coverage gaps are identified or completeness has not been validated.
        - IT.DET-01.2.PE-2: Configuration change logs are forwarded inconsistently.
        - IT.DET-01.2.PE-3: The utility of security log sources is reviewed, but on an ad hoc basis rather than according to a defined schedule.
        - IT.DET-01.2.PE-4: Log forwarding is in place but latency is excessive for effective detection.

        Fully effective:
        - IT.DET-01.2.FE-1: High-value security-relevant event logs and configuration changes from all relevant infrastructure, operating systems and application sources are forwarded to the central logging capability.
        - IT.DET-01.2.FE-2: Security log sources are reviewed at regular intervals to ensure their continued utility in detecting and responding to changing adversary techniques.
        - IT.DET-01.2.FE-3: Log completeness has been validated against the expected log sources.
        - IT.DET-01.2.FE-4: Logs are forwarded at a frequency that enables timely detection.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: DET-04
      name: Baseline high-risk access activities
      description: Baseline patterns of identity and credential access activities, privileged access activities,
        and remote access activities are established and maintained for systems (infrastructure, operating
        systems, applications and data) to enable the detection of anomalous or unexpected behaviour.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-04:it.det-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-04
      ref_id: IT.DET-04.1
      description: Continuously monitor and analyse software execution behaviour on systems to detect
        where legitimate tools and utilities are being used for malicious purposes.
      annotation: |-
        Not effective:
        - IT.DET-04.1.NE-1: No monitoring or equivalent analysis is used to identify anomalous or unexpected use of legitimate tools and utilities on applicable systems.
        - IT.DET-04.1.NE-2: Existing controls do not provide a reasonable capability to detect security-relevant patterns of legitimate software being used for malicious purposes.

        Partially effective:
        - IT.DET-04.1.PE-1: Monitoring or equivalent analysis covers some priority tools, execution behaviours or applicable systems, but risk-significant coverage gaps exist.
        - IT.DET-04.1.PE-2: Security-relevant execution telemetry is collected, but detection rules, behavioural analytics or equivalent analysis are incomplete or not consistently operational.
        - IT.DET-04.1.PE-3: Alerts relating to anomalous or unexpected software execution are generated, but they are not consistently triaged and investigated within organisationally defined timeframes.

        Fully effective:
        - IT.DET-04.1.FE-1: The organisation identifies the legitimate tools, utilities and execution behaviours that present heightened risk of malicious use within applicable systems.
        - IT.DET-04.1.FE-2: Security-relevant telemetry and contextual information are analysed using detection rules, behavioural analytics or equivalent methods to identify anomalous or unexpected use of priority tools and utilities.
        - IT.DET-04.1.FE-3: Detection coverage is periodically reviewed and adjusted in response to changes in applicable systems, threat intelligence, observed activity and the organisation’s risk profile.
        - IT.DET-04.1.FE-4: Alerts are prioritised, triaged and investigated within timeframes defined according to their assessed security risk.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-02
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services
      ref_id: DET-02
      name: Cyber security event detection
      description: Anomalous or unexpected events and behaviours for systems (infrastructure, operating
        systems, applications and data) are analysed in a timely manner to detect cyber security events.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-02:it.det-02.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:identity-services:det-02
      ref_id: IT.DET-02.1
      description: Ensure event logs are normalised, time-synchronised and enriched to support correlation
        across systems and environments.
      annotation: |-
        Not effective:
        - IT.DET-02.1.NE-1: Logs are not time-synchronised to an authoritative source.
        - IT.DET-02.1.NE-2: Logs are ingested in raw format and are neither normalised nor enriched.

        Partially effective:
        - IT.DET-02.1.PE-1: Logs are time-synchronised but are not normalised to a common schema.
        - IT.DET-02.1.PE-2: Some enrichment is applied but critical contextual data such as asset classification or account type is missing.

        Fully effective:
        - IT.DET-02.1.FE-1: Logs are time-synchronised to the authoritative time source.
        - IT.DET-02.1.FE-2: Logs are normalised into the common log schema and enriched with contextual metadata.
        - IT.DET-02.1.FE-3: Enriched logs support correlation across relevant systems, environments and data sources in the central logging platform.
      implementation_groups:
      - '1'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      assessable: false
      depth: 1
      name: Critical processes and services
      description: Core processes and services that are critical to delivering primary organisational
        outcomes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:ide-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: IDE-01
      name: Asset identification
      description: Systems (infrastructure, operating systems, applications, identities, credentials and
        data) are continually and centrally identified and documented.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:ide-01:it.ide-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:ide-01
      ref_id: IT.IDE-01.2
      description: Maintain current records of infrastructure, operating systems, applications, identities,
        credentials and data assets.
      annotation: |-
        Not effective:
        - IT.IDE-01.2.NE-1: A maintained record of infrastructure, operating systems, applications, identities, credentials and data assets has not been established.
        - IT.IDE-01.2.NE-2: There is no defined process for identifying, recording, reviewing and updating asset records.

        Partially effective:
        - IT.IDE-01.2.PE-1: Asset records are maintained, but identified omissions, inaccuracies or newly discovered assets are not triaged and addressed within the timeframes or tolerances defined by the organisation.
        - IT.IDE-01.2.PE-2: A process to update the asset inventory runs on a schedule but the results are not reconciled or updated within a period defined by the organisation.

        Fully effective:
        - IT.IDE-01.2.FE-1: At each scheduled review or update, records of infrastructure, operating systems, applications, identities, credentials and data assets are complete and accurate within the tolerances defined by the organisation.
        - IT.IDE-01.2.FE-2: A defined process identifies changes and newly discovered assets between scheduled reviews, and ensures that records are reviewed, reconciled and updated within timeframes commensurate with the associated cyber security risk.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-01
      name: Secure system lifecycle
      description: Systems (infrastructure, operating systems and applications) are planned, designed,
        developed, tested, deployed, maintained and decommissioned according to their business criticality
        ratings and security and resilience requirements using Secure by Design and Secure by Default
        principles and practices.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-01:it.pro-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-01
      ref_id: IT.PRO-01.1
      description: Design systems securely to provide visibility, enforce authorised access, protect data,
        minimise required and default privileges, limit exposed services and remove unnecessary functionality.
      annotation: |-
        Not effective:
        - IT.PRO-01.1.NE-1: Systems are deployed with default configurations and no evidence of security design considerations.
        - IT.PRO-01.1.NE-2: Unnecessary services, protocols or functionality remain enabled with no documented rationale.
        - IT.PRO-01.1.NE-3: Security telemetry is not enabled or is not considered as part of system design.

        Partially effective:
        - IT.PRO-01.1.PE-1: Security is considered during system design but not consistently applied across all assets.
        - IT.PRO-01.1.PE-2: Some unnecessary services have been disabled but a systematic review has not been completed.
        - IT.PRO-01.1.PE-3: Security telemetry is partially enabled but gaps in coverage exist.

        Fully effective:
        - IT.PRO-01.1.FE-1: Systems are designed and deployed with exposed services limited, required and default permissions minimised, data protections in place, authorised access enforced, and only required functionality enabled.
        - IT.PRO-01.1.FE-2: Security telemetry is enabled by default.
        - IT.PRO-01.1.FE-3: Evidence exists that security design decisions are recorded and reviewed during system changes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-01:it.pro-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-01
      ref_id: IT.PRO-01.2
      description: Secure build and deployment processes to enforce controls consistently across systems.
      annotation: |-
        Not effective:
        - IT.PRO-01.2.NE-1: No controlled build or deployment process exists for applicable assets.
        - IT.PRO-01.2.NE-2: Changes to systems are applied ad hoc, without any version control, testing or approval.

        Partially effective:
        - IT.PRO-01.2.PE-1: A controlled deployment process exists but is not consistently followed for all changes.
        - IT.PRO-01.2.PE-2: Version control is in place but pre-deployment security verification is not performed.

        Fully effective:
        - IT.PRO-01.2.FE-1: A controlled build and deployment process is in place and consistently followed.
        - IT.PRO-01.2.FE-2: Configuration changes are subject to version control, testing and approval before deployment.
        - IT.PRO-01.2.FE-3: Security controls are confirmed to be implemented consistently across systems following deployment processes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-16
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-16
      name: Cyber supply chain security
      description: Cyber supply chains supporting systems (infrastructure, operating systems, applications
        and data) are secure, resilient and support effective and coordinated cyber security incident
        response.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-16:it.pro-16.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-16
      ref_id: IT.PRO-16.1
      description: Assess the integrity and authenticity of software, components and updates before use,
        and verify provenance where suitable supplier evidence is available.
      annotation: |-
        Not effective:
        - IT.PRO-16.1.NE-1: No verification of software, component or update integrity or authenticity is performed before introduction into systems.
        - IT.PRO-16.1.NE-2: Verification outcomes are not recorded or available for review.
        - IT.PRO-16.1.NE-3: Where verification cannot be performed, no compensating control or remediation paths are documented.

        Partially effective:
        - IT.PRO-16.1.PE-1: Verification is performed for some categories of software but not consistently across operating systems, applications, firmware and dependencies.
        - IT.PRO-16.1.PE-2: Integrity or provenance checks are performed, but they do not provide sufficient assurance for all software, components or updates.
        - IT.PRO-16.1.PE-3: Verification outcomes are recorded for some software, components or updates prior to being introduced into systems, but not consistently.
        - IT.PRO-16.1.PE-4: Compensating controls exist for some unverifiable components but are not formally approved or time-bound.

        Fully effective:
        - IT.PRO-16.1.FE-1: Verification of integrity and provenance is performed for software, components and updates across all relevant categories, and provenance is verified where suitable supplier evidence is available.
        - IT.PRO-16.1.FE-2: Verification uses one or more mechanisms appropriate to the software, component, update and source to provide reliable assurance of integrity and provenance.
        - IT.PRO-16.1.FE-3: Verification outcomes are recorded and available for review.
        - IT.PRO-16.1.FE-4: Where verification cannot be performed, compensating controls are applied, exceptions are time-bound and remediation paths are documented.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-16:it.pro-16.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-16
      ref_id: IT.PRO-16.2
      description: Use vendor advisories and threat intelligence to maintain awareness of supplier, product
        and component exposure to compromise, and act within timeframes proportionate to the risk.
      annotation: |-
        Not effective:
        - IT.PRO-16.2.NE-1: No monitoring is performed for indicators of supply chain compromise affecting software, components or services in use.
        - IT.PRO-16.2.NE-2: Vendor security notifications and threat advisories are not reviewed or actioned.
        - IT.PRO-16.2.NE-3: When supply chain compromise is identified, neither containment nor investigation is performed.
        - IT.PRO-16.2.NE-4: Supply chain compromise events are integrated into neither incident response nor risk management.

        Partially effective:
        - IT.PRO-16.2.PE-1: Monitoring occurs but does not draw on relevant threat intelligence sources or does not cover all in-scope systems.
        - IT.PRO-16.2.PE-2: Notifications and advisories are reviewed but exposure assessment and response are not conducted in a timely manner.
        - IT.PRO-16.2.PE-3: Containment occurs but investigation for evidence of exploitation is not consistently undertaken.
        - IT.PRO-16.2.PE-4: Some integration exists but findings are not reflected in the risk register or incident response procedures.

        Fully effective:
        - IT.PRO-16.2.FE-1: Monitoring covers software, components and services in use, drawing on relevant threat intelligence sources.
        - IT.PRO-16.2.FE-2: Vendor security notifications and threat advisories are reviewed, exposure is assessed and response actions are initiated within defined timeframes.
        - IT.PRO-16.2.FE-3: Identified supply chain compromises are responded to in timeframes defined by the organisation.
        - IT.PRO-16.2.FE-4: Supply chain compromise events are integrated with incident response and reflected in the risk register.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-13
      name: Identity, credential and access management
      description: Robust and secure identity, credential and access management is used to establish,
        maintain and control access to systems (infrastructure, operating systems, applications and data)
        and to support effective detection of identity and credential misuse.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13:it.pro-13.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13
      ref_id: IT.PRO-13.1
      description: Identify and disable or remove default and unused accounts regularly, permitting exceptions
        only where the account is documented, justified, hardened and monitored.
      annotation: |-
        Not effective:
        - IT.PRO-13.1.NE-1: No review of default or unused accounts has been conducted within the review period defined by the organisation.
        - IT.PRO-13.1.NE-2: Default vendor accounts remain enabled on production systems without appropriate documentation, justification, hardening and monitoring in place for their use.
        - IT.PRO-13.1.NE-3: No process exists to identify accounts that have not authenticated within a defined period.

        Partially effective:
        - IT.PRO-13.1.PE-1: A review has been conducted but does not cover all assets.
        - IT.PRO-13.1.PE-2: Default accounts have been identified but some remain enabled without documented justification.
        - IT.PRO-13.1.PE-3: Unused accounts are identified but remediation is incomplete or delayed beyond defined timeframes.

        Fully effective:
        - IT.PRO-13.1.FE-1: A review of accounts has been completed within the defined review period covering all assets.
        - IT.PRO-13.1.FE-2: Default accounts are disabled or have approved justification for remaining active, with appropriate monitoring and compensating controls for their use in place.
        - IT.PRO-13.1.FE-3: Accounts that show no evidence of use, other than approved emergency access accounts, are identified and either disabled or removed in accordance with defined timeframes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13:it.pro-13.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13
      ref_id: IT.PRO-13.2
      description: Store authentication keys, secrets and tokens in approved secure repositories with
        access controls, including MFA.
      annotation: |-
        Not effective:
        - IT.PRO-13.2.NE-1: Credentials are stored in plaintext, spreadsheets, shared drives or other unapproved locations as standard practice.
        - IT.PRO-13.2.NE-2: No approved secure repository is in use to store authentication keys, secrets and tokens.
        - IT.PRO-13.2.NE-3: Access to credential stores is neither controlled nor audited.
        - IT.PRO-13.2.NE-4: Access controls such as MFA are not enabled for authentication to secure repositories.

        Partially effective:
        - IT.PRO-13.2.PE-1: An approved secure repository is in use but does not cover all authentication keys, secrets and tokens within scope.
        - IT.PRO-13.2.PE-2: Access controls for secure repositories are in place but access logging is not enabled or not reviewed.
        - IT.PRO-13.2.PE-3: MFA is enforced for some, but not all, applicable users, repositories or authentication pathways, and the remaining exceptions are documented and subject to remediation.

        Fully effective:
        - IT.PRO-13.2.FE-1: Authentication keys, secrets and tokens within scope are stored in approved secure repositories, with any authorised exceptions documented, risk-assessed and managed in accordance with organisationally defined requirements.
        - IT.PRO-13.2.FE-2: Access to secure repositories is restricted using attribute or role-based access controls, MFA is enforced for all applicable authentication pathways, and access is logged and reviewed and investigated where necessary.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13:it.pro-13.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13
      ref_id: IT.PRO-13.4
      description: Use phishing-resistant MFA for users authenticating to systems, including from untrusted,
        external or high-risk locations.
      annotation: |-
        Not effective:
        - IT.PRO-13.4.NE-1: Phishing-resistant MFA is not enforced for interactive user authentication to systems.
        - IT.PRO-13.4.NE-2: MFA is deployed but uses non-phishing-resistant methods, such as SMS, voice, or push-only authentication instead of phishing-resistant MFA.
        - IT.PRO-13.4.NE-3: No access policies differentiate between trusted and untrusted, external or high-risk locations.
        - IT.PRO-13.4.NE-4: Access from untrusted, external or high-risk locations is permitted without MFA, or with non-phishing-resistant MFA.

        Partially effective:
        - IT.PRO-13.4.PE-1: Phishing-resistant MFA is deployed for some but not all systems within scope.
        - IT.PRO-13.4.PE-2: Access policies exist but do not cover all organisationally defined high-risk location categories.
        - IT.PRO-13.4.PE-3: Exceptions or alternative authentication pathways allow routine or recurring authentication without phishing-resistant MFA, or emergency access arrangements are not adequately restricted, monitored, tested or reviewed.

        Fully effective:
        - IT.PRO-13.4.FE-1: Phishing-resistant MFA is enforced for all routine interactive user authentication to systems within scope.
        - IT.PRO-13.4.FE-2: Phishing-resistant MFA is enforced for routine authentication attempts from untrusted, external or high-risk locations.
        - IT.PRO-13.4.FE-3: Customer-facing services provide a phishing-resistant MFA option for authentication.
        - IT.PRO-13.4.FE-4: Emergency access arrangements are periodically tested and reviewed to confirm that they remain operational, appropriately protected and limited to their intended purpose. Credentials or authentication factors used for emergency access are securely managed and are not used for routine administration.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13:it.pro-13.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13
      ref_id: IT.PRO-13.5
      description: Disable legacy authentication protocols or, where this is not feasible, restrict and
        monitor their use, apply compensating controls and establish a time-bound decommissioning plan.
      annotation: |-
        Not effective:
        - IT.PRO-13.5.NE-1: Legacy authentication protocols that cannot enforce modern authentication controls remain enabled and in active use without restriction.
        - IT.PRO-13.5.NE-2: No assessment has been conducted to identify which legacy authentication protocols are in use within the environment.
        - IT.PRO-13.5.NE-3: Authentication mechanisms transmitting credentials in cleartext or using weak cryptographic primitives remain enabled and no action has been taken to disable them.
        - IT.PRO-13.5.NE-4: Where legacy protocols are retained, no compensating controls, no monitoring and no decommissioning timelines are in place.

        Partially effective:
        - IT.PRO-13.5.PE-1: Legacy authentication protocols have been identified and are partially restricted but some remain enabled across systems within scope without justification.
        - IT.PRO-13.5.PE-2: An assessment has been conducted but does not cover all in-scope systems, or the inventory of legacy protocols in use is not maintained.
        - IT.PRO-13.5.PE-3: Some weak authentication mechanisms have been disabled but others remain enabled without documented justification or remediation plan.
        - IT.PRO-13.5.PE-4: Compensating controls exist for some retained legacy protocols but monitoring is inconsistent or decommissioning timelines are not defined.

        Fully effective:
        - IT.PRO-13.5.FE-1: Legacy authentication protocols that cannot enforce modern authentication controls have been identified and disabled across systems within scope, excluding documented and risk accepted exceptions.
        - IT.PRO-13.5.FE-2: An assessment of legacy authentication protocol use has been conducted across in-scope systems and the inventory is maintained.
        - IT.PRO-13.5.FE-3: Where retention is necessary, compensating controls are applied and decommissioning timelines are recorded and tracked.
        - IT.PRO-13.5.FE-4: Ongoing use of legacy authentication protocols is regularly risk reviewed, accepted and recorded in the organisation’s risk register.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13:it.pro-13.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-13
      ref_id: IT.PRO-13.6
      description: Ensure that user, machine, system and service account credentials are unique per system
        or account, particularly in high-privilege contexts.
      annotation: |-
        Not effective:
        - IT.PRO-13.6.NE-1: Local administrator credentials are shared across the device fleet, or service or privileged account credentials are routinely reused across systems.
        - IT.PRO-13.6.NE-2: Credential uniqueness is not enforced for applicable user, machine, system or service identities.
        - IT.PRO-13.6.NE-3: Credential uniqueness has not been addressed in high-privilege contexts, including domain administration, cloud administration or automation platforms.
        - IT.PRO-13.6.NE-4: Where credential uniqueness cannot be enforced, neither compensating controls nor remediation paths are in place.

        Partially effective:
        - IT.PRO-13.6.PE-1: Local administrator credential uniqueness has been implemented for some device populations but coverage is incomplete across the device fleet.
        - IT.PRO-13.6.PE-2: A technical mechanism is in place but applies to only a subset of credential types or systems within scope.
        - IT.PRO-13.6.PE-3: Credential uniqueness has been addressed in some high-privilege contexts but gaps remain in others.
        - IT.PRO-13.6.PE-4: Compensating controls exist for some shared credentials but monitoring is inconsistent or remediation plans do not exist.

        Fully effective:
        - IT.PRO-13.6.FE-1: Credentials for applicable local administrative accounts are unique to each system or account.
        - IT.PRO-13.6.FE-2: Credential uniqueness is consistently enforced for applicable user, machine, system and service identities.
        - IT.PRO-13.6.FE-3: Credential uniqueness is enforced consistently in high-privilege contexts, with managed identities or equivalent capabilities used in preference to shared static credentials wherever feasible.
        - IT.PRO-13.6.FE-4: Where uniqueness cannot be enforced, compensating controls are applied, the use of the shared credentials is monitored, and a remediation plan exists.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-12
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-12
      name: Least privilege access
      description: Users are granted the minimum access to systems (infrastructure, operating systems,
        applications and data) required to undertake their duties or functions.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-12:it.pro-12.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-12
      ref_id: IT.PRO-12.1
      description: Periodically review and update access privileges in alignment with current roles, duties
        and business requirements.
      annotation: |-
        Not effective:
        - IT.PRO-12.1.NE-1: Access privileges are not reviewed against current roles, duties and business requirements.
        - IT.PRO-12.1.NE-2: Access reviews do not identify privileges that are no longer required.
        - IT.PRO-12.1.NE-3: Access privileges are not updated when personnel roles, duties or business requirements change.
        - IT.PRO-12.1.NE-4: Access privileges are not mapped to roles, duties and business requirements.

        Partially effective:
        - IT.PRO-12.1.PE-1: Access reviews are conducted for some accounts or systems, but coverage is incomplete.
        - IT.PRO-12.1.PE-2: Reviews identify excessive or obsolete privileges, but updates are incomplete or not completed within timeframes defined by the organisation.
        - IT.PRO-12.1.PE-3: A process to review access privileges exists but only occurs on an ad hoc basis.
        - IT.PRO-12.1.PE-4: Some access privileges are mapped to roles, duties and business requirements, but not all.

        Fully effective:
        - IT.PRO-12.1.FE-1: Access privileges for all applicable accounts and systems are reviewed within a cycle defined by the organisation and aligned with current roles, duties and business requirements.
        - IT.PRO-12.1.FE-2: Privileges identified as excessive or obsolete are removed or updated within timeframes defined by the organisation.
        - IT.PRO-12.1.FE-3: Review outcomes and resulting access changes are documented and available as evidence.
        - IT.PRO-12.1.FE-4: Access privileges are mapped to current roles, duties and business requirements.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-12:it.pro-12.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-12
      ref_id: IT.PRO-12.2
      description: Grant only authorised administrative roles permissions to create, modify or delete
        accounts and roles, and access privileged functions or applications.
      annotation: |-
        Not effective:
        - IT.PRO-12.2.NE-1: Non-administrative users can create, modify or delete accounts or roles.
        - IT.PRO-12.2.NE-2: Delegated permissions are broad and have not been audited.

        Partially effective:
        - IT.PRO-12.2.PE-1: Permissions are restricted to administrative roles but some delegated permissions are broader than required.
        - IT.PRO-12.2.PE-2: Approval workflows exist for some high-impact changes but not all.

        Fully effective:
        - IT.PRO-12.2.FE-1: Only designated administrative roles can create, modify or delete accounts and roles.
        - IT.PRO-12.2.FE-2: Delegated permissions are audited and scoped to the minimum required.
        - IT.PRO-12.2.FE-3: Approval workflows are enforced for high-impact identity and access changes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-12:it.pro-12.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-12
      ref_id: IT.PRO-12.3
      description: Provision user, administrative and non-person accounts with only the minimum access
        and privileges required to perform defined operational functions.
      annotation: |-
        Not effective:
        - IT.PRO-12.3.NE-1: Accounts are provisioned with broad default permissions that exceed operational requirements.
        - IT.PRO-12.3.NE-2: Administrative and day-to-day user functions share the same account, with no separate privileged accounts.

        Partially effective:
        - IT.PRO-12.3.PE-1: Minimum privilege provisioning is defined but not consistently applied to all account types.
        - IT.PRO-12.3.PE-2: Administrative accounts are separated from user accounts but some exceptions exist without documented justification.

        Fully effective:
        - IT.PRO-12.3.FE-1: All accounts are provisioned with documented minimum permissions aligned to defined operational functions.
        - IT.PRO-12.3.FE-2: Separate accounts are allocated for privileged and day-to-day functions, and controls prevent privileged use from day-to-day context.
        - IT.PRO-12.3.FE-3: Non-person and service accounts are scoped to their specific integration requirements.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-05
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-05
      name: Secure administration
      description: Systems (infrastructure, operating systems, applications and data) are administered
        in a secure, accountable and auditable manner.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-05:it.pro-05.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-05
      ref_id: IT.PRO-05.1
      description: Ensure administrative activities can only be performed from dedicated and hardened
        environments that are isolated from unprivileged user workloads.
      annotation: |-
        Not effective:
        - IT.PRO-05.1.NE-1: Administrative access to systems is routinely performed from standard user devices without additional controls to protect the administrative session.
        - IT.PRO-05.1.NE-2: No dedicated or hardened administrative environment exists.
        - IT.PRO-05.1.NE-3: Exceptions to the use of dedicated administrative environments are neither identified nor assessed.

        Partially effective:
        - IT.PRO-05.1.PE-1: A dedicated administrative environment has been established, but administrative access is not consistently routed through it.
        - IT.PRO-05.1.PE-2: Administrative endpoints have been hardened, but unprivileged user workloads or unnecessary functions remain accessible.
        - IT.PRO-05.1.PE-3: Exceptions are documented, but their justification, risk acceptance, compensating controls or review arrangements are incomplete or inconsistently applied.

        Fully effective:
        - IT.PRO-05.1.FE-1: Administrative sessions originate from dedicated and hardened administrative environments that are isolated from unprivileged user workloads. Where this cannot be technically enforced, exceptions are documented, risk-assessed, formally accepted and protected by compensating controls.
        - IT.PRO-05.1.FE-2: Administrative environments are hardened and restricted to the functions required for authorised administration.
        - IT.PRO-05.1.FE-3: Exceptions are limited to systems or services that cannot support administration through a dedicated environment, are periodically reviewed and are removed when the technical limitation no longer applies.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-05:it.pro-05.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-05
      ref_id: IT.PRO-05.2
      description: Enforce explicit session establishment controls before privileged actions are permitted,
        including the use of time-bound privilege grants.
      annotation: |-
        Not effective:
        - IT.PRO-05.2.NE-1: Privileged access is standing and does not require explicit activation or time-bound grants, excluding approved break-glass and emergency access accounts.
        - IT.PRO-05.2.NE-2: No re-authentication or step-up authentication is required before privileged sessions.

        Partially effective:
        - IT.PRO-05.2.PE-1: Time-bound access is implemented for some privileged roles but standing access remains for others.
        - IT.PRO-05.2.PE-2: Session duration limits exist but are not consistently enforced or are set excessively long.

        Fully effective:
        - IT.PRO-05.2.FE-1: Time-bound privilege grants are enforced for applicable privileged roles, with defined maximum session durations and approved emergency access arrangements.
        - IT.PRO-05.2.FE-2: Re-authentication or step-up authentication is required before privilege activation.
        - IT.PRO-05.2.FE-3: All privilege activations are logged with activating user, role and timeframes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-05:it.pro-05.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-05
      ref_id: IT.PRO-05.3
      description: Record all administrative or management actions that modify systems, configurations
        or controls, including the details of the associated user, timestamp and target.
      annotation: |-
        Not effective:
        - IT.PRO-05.3.NE-1: Administrative or management actions that modify systems, configurations or controls are not logged.
        - IT.PRO-05.3.NE-2: Logs do not capture sufficient detail to identify who made a change, when and to what target.

        Partially effective:
        - IT.PRO-05.3.PE-1: Logging is enabled and provides useful coverage, but does not cover all applicable administrative or management platforms.
        - IT.PRO-05.3.PE-2: Logs capture the administrator identity and action but lack detail on the target or change nature.

        Fully effective:
        - IT.PRO-05.3.FE-1: Comprehensive audit logging to capture all administrative or management actions is enabled on all platforms in scope.
        - IT.PRO-05.3.FE-2: Logs capture administrator identity, timestamp, target object and nature of change.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-04
      name: Secure configuration management
      description: Systems (infrastructure, operating systems and applications) are securely configured
        to approved and maintained baselines, including by reducing attack surfaces and attack paths,
        with configurations continually monitored and consistently enforced.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-04:it.pro-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-04
      ref_id: IT.PRO-04.1
      description: Define approved configuration baselines, informed by vendor and industry hardening
        guidance, that disable or remove unnecessary services, insecure settings, and unsupported or weak
        communication protocols.
      annotation: |-
        Not effective:
        - IT.PRO-04.1.NE-1: No documented configuration baseline exists for assets.
        - IT.PRO-04.1.NE-2: Systems are deployed with vendor defaults and no documented hardening has been applied.

        Partially effective:
        - IT.PRO-04.1.PE-1: A baseline exists but does not address all applicable asset types.
        - IT.PRO-04.1.PE-2: The baseline is documented but has not been reviewed or updated within the cycle defined by the organisation.
        - IT.PRO-04.1.PE-3: The baseline exists but rationale for configuration decisions is not documented.

        Fully effective:
        - IT.PRO-04.1.FE-1: A documented and approved baseline exists for all applicable asset types.
        - IT.PRO-04.1.FE-2: The baseline disables or removes unnecessary services, insecure settings, and unsupported or weak communication protocols.
        - IT.PRO-04.1.FE-3: Configuration decisions are documented with rationale to support drift assessment.
        - IT.PRO-04.1.FE-4: The baseline is reviewed and updated on a cycle defined by the organisation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-04:it.pro-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-04
      ref_id: IT.PRO-04.2
      description: Deploy approved configuration baselines on systems, including infrastructure, operating
        systems and applications.
      annotation: |-
        Not effective:
        - IT.PRO-04.2.NE-1: Approved baselines have not been applied to assets.
        - IT.PRO-04.2.NE-2: Baseline deployment has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-04.2.PE-1: Approved baselines have been implemented where available, but some relevant asset types are not covered by an approved baseline.
        - IT.PRO-04.2.PE-2: Deployment has occurred but validation through technical assessment is incomplete or not current.
        - IT.PRO-04.2.PE-3: Approved baselines have been deployed, but coverage for all applicable assets is inconsistent.

        Fully effective:
        - IT.PRO-04.2.FE-1: Approved baselines have been applied to all applicable assets.
        - IT.PRO-04.2.FE-2: Deployment has been validated through technical assessment.
        - IT.PRO-04.2.FE-3: Coverage metrics are available demonstrating deployment completeness.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-04:it.pro-04.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-04
      ref_id: IT.PRO-04.3
      description: Detect and respond to configuration drift using scheduled technical assessments and,
        where supported, automated monitoring, based on system criticality and change rate.
      annotation: |-
        Not effective:
        - IT.PRO-04.3.NE-1: No mechanism exists to detect configuration drift from approved baselines.
        - IT.PRO-04.3.NE-2: Assessments to detect configuration drift have not been conducted within the review period defined by the organisation.
        - IT.PRO-04.3.NE-3: Assessments do not systematically identify instances of configuration drift for assets.

        Partially effective:
        - IT.PRO-04.3.PE-1: Drift detection is in place but does not cover all applicable assets.
        - IT.PRO-04.3.PE-2: Drift is detected but the remediation process is informal or response timeframes are not defined.

        Fully effective:
        - IT.PRO-04.3.FE-1: Automated configuration monitoring or regular technical assessments detect drift across the applicable assets, occurring at a frequency based on system criticality and change rate.
        - IT.PRO-04.3.FE-2: A documented remediation process exists with defined response timeframes aligned to severity.
        - IT.PRO-04.3.FE-3: Drift events are tracked to closure with evidence of remediation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-06
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-06
      name: Vulnerability management
      description: Vulnerabilities in systems (infrastructure, operating systems, applications and data)
        are identified, documented, validated and prioritised for remediation or mitigation in a timely
        manner, with all remediation and mitigation actions verified for effectiveness.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-06:it.pro-06.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-06
      ref_id: IT.PRO-06.1
      description: Identify known software and configuration weaknesses of assets through continuous and
        repeatable assessment activities, including vulnerability scanning activities.
      annotation: |-
        Not effective:
        - IT.PRO-06.1.NE-1: Vulnerability scanning activities are not undertaken.
        - IT.PRO-06.1.NE-2: No routine vulnerability assessment activity has been conducted within a period defined by the organisation.
        - IT.PRO-06.1.NE-3: Advisories for relevant software and configuration weaknesses for organisational assets are not reviewed and assessed for impact.

        Partially effective:
        - IT.PRO-06.1.PE-1: Vulnerability scanning is deployed but does not cover all applicable assets.
        - IT.PRO-06.1.PE-2: Vulnerability scans are conducted but results are not reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.PE-3: Vulnerability scans are conducted but frequency is not regular enough to enable timely response.
        - IT.PRO-06.1.PE-4: Scanning covers software vulnerabilities but not configuration weaknesses.
        - IT.PRO-06.1.PE-5: Advisories for relevant software and configuration weaknesses for organisational assets are reviewed on an ad hoc basis, or only for some assets.

        Fully effective:
        - IT.PRO-06.1.FE-1: All applicable assets are included in routine vulnerability scanning, and scanning frequency enables timely response.
        - IT.PRO-06.1.FE-2: Scanning covers both software vulnerabilities and configuration weaknesses.
        - IT.PRO-06.1.FE-3: Results are reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.FE-4: Advisories for relevant software and configuration weaknesses in all organisational assets are regularly reviewed and assessed for impact.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-06:it.pro-06.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-06
      ref_id: IT.PRO-06.2
      description: Apply security patches or updates within defined risk-based timeframes or automatically
        where operational impact is low.
      annotation: |-
        Not effective:
        - IT.PRO-06.2.NE-1: No defined patching timeframes exist for applicable assets.
        - IT.PRO-06.2.NE-2: Patches are not applied or are applied on an ad hoc basis with no tracking.

        Partially effective:
        - IT.PRO-06.2.PE-1: Expected patching timeframes are defined by the organisation but are not consistently met.
        - IT.PRO-06.2.PE-2: Patches are applied but compensating controls are not documented where operational constraints prevent timely patching.
        - IT.PRO-06.2.PE-3: Patching coverage metrics exist but show significant gaps.

        Fully effective:
        - IT.PRO-06.2.FE-1: Risk-based patching timeframes defined by the organisation are in place and consistently met.
        - IT.PRO-06.2.FE-2: Patching is prioritised based on vulnerability severity, exposure and exploit availability.
        - IT.PRO-06.2.FE-3: Where operational constraints prevent timely patching, compensating controls are documented and approved.
        - IT.PRO-06.2.FE-4: Patching coverage metrics account for all applicable assets, with any exclusions identified and formally risk accepted.
        - IT.PRO-06.2.FE-5: Automatic patching of assets is applied where available and the organisation has determined operational impact is low.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-06:it.pro-06.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-06
      ref_id: IT.PRO-06.3
      description: Remediate or mitigate vulnerabilities exceeding defined risk thresholds within defined
        timeframes based on exploitation, exposure, criticality, impact and compensating controls, and
        verify treatment effectiveness.
      annotation: |-
        Not effective:
        - IT.PRO-06.3.NE-1: No risk thresholds are defined for vulnerability remediation.
        - IT.PRO-06.3.NE-2: Vulnerabilities exceeding acceptable risk levels are not tracked or remediated.

        Partially effective:
        - IT.PRO-06.3.PE-1: Risk thresholds are defined but vulnerabilities exceeding them are not consistently remediated within defined timeframes.
        - IT.PRO-06.3.PE-2: Compensating controls are applied in some cases but are not formally documented or approved.

        Fully effective:
        - IT.PRO-06.3.FE-1: Risk thresholds defined by the organisation exist, and vulnerabilities exceeding them are remediated or have approved compensating controls within organisationally defined timeframes.
        - IT.PRO-06.3.FE-2: Remediation and mitigation actions are tracked to closure with verification that actions reduced the risk as intended.
        - IT.PRO-06.3.FE-3: The process is sustained, with historical data demonstrating consistent performance across organisationally defined reporting periods.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-07
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-07
      name: Trustworthy software
      description: Systems (operating systems and applications) only permit the execution of software
        that is supported, verified and authorised.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-07:it.pro-07.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-07
      ref_id: IT.PRO-07.1
      description: Permit only supported, verified and organisation-authorised software to execute on
        systems, with exceptions minimised, formally risk accepted, time-bound, monitored and regularly
        reviewed.
      annotation: |-
        Not effective:
        - IT.PRO-07.1.NE-1: Unsupported, unverified or unauthorised software can execute without restriction.
        - IT.PRO-07.1.NE-2: The list of approved software does not exist.

        Partially effective:
        - IT.PRO-07.1.PE-1: Execution restriction controls are deployed but do not cover all applicable assets.
        - IT.PRO-07.1.PE-2: The organisation maintains a list of approved software, but it has not been reviewed within timeframes defined by the organisation.
        - IT.PRO-07.1.PE-3: Execution restrictions are in place but integrity verification of approved software is not performed.
        - IT.PRO-07.1.PE-4: Exceptions to execution restrictions are granted without formal approval or time-bounding.

        Fully effective:
        - IT.PRO-07.1.FE-1: Controls restrict execution to supported, organisation-authorised and integrity-verified software on all applicable assets.
        - IT.PRO-07.1.FE-2: The organisation maintains a list of approved software and reviews it within the timeframes defined by the organisation.
        - IT.PRO-07.1.FE-3: Integrity of permitted software is verified using trusted mechanisms appropriate to the software and its source.
        - IT.PRO-07.1.FE-4: Exceptions are formally approved, documented, time-bound and reviewed on a regular cycle defined by the organisation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-07:it.pro-07.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-07
      ref_id: IT.PRO-07.2
      description: Restrict administrative and management tooling to approved software sets and executed
        from only authorised, known locations.
      annotation: |-
        Not effective:
        - IT.PRO-07.2.NE-1: No approved administrative toolset is defined.
        - IT.PRO-07.2.NE-2: No restrictions are placed on the location administrative tooling can be executed from.
        - IT.PRO-07.2.NE-3: No controls prevent unapproved administrative tools, including tools commonly used in post-compromise activity, from executing on managed assets.

        Partially effective:
        - IT.PRO-07.2.PE-1: An approved toolset is defined but not consistently enforced across all assets.
        - IT.PRO-07.2.PE-2: Administrative tooling is configured to execute from known locations, but privileged users can still run tooling from unapproved locations.
        - IT.PRO-07.2.PE-3: Some unapproved administrative tools are blocked but enforcement gaps exist.

        Fully effective:
        - IT.PRO-07.2.FE-1: A defined and enforced approved toolset exists for administrative and management activities, and execution is limited to authorised, known locations.
        - IT.PRO-07.2.FE-2: Administrative and management tooling outside the approved set is blocked from execution, including from unauthorised locations.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-10
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-10
      name: Regular and proven backups
      description: Systems (infrastructure, operating systems, applications and data) are regularly backed
        up in a secure and proven manner, including through the validation of restoration capabilities.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-10:it.pro-10.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-10
      ref_id: IT.PRO-10.1
      description: Back up important data, applications and settings on a defined schedule to secure,
        resilient storage protected by encryption and immutable, offline, logically isolated or equivalent
        controls.
      annotation: |-
        Not effective:
        - IT.PRO-10.1.NE-1: No managed backup process exists for important data, applications and settings.
        - IT.PRO-10.1.NE-2: Backup storage is neither encrypted nor protected by immutable, offline, logically isolated or equivalent controls.

        Partially effective:
        - IT.PRO-10.1.PE-1: Important data, applications and settings are backed up, but backup schedules are not defined, do not cover all important assets, or are not consistently met.
        - IT.PRO-10.1.PE-2: Backups are encrypted but no immutable, offline, logically isolated or equivalent resilience controls are consistently applied.
        - IT.PRO-10.1.PE-3: Backups use immutable, offline, logically isolated or equivalent controls, but encryption is not consistently enforced.

        Fully effective:
        - IT.PRO-10.1.FE-1: All important data, applications and settings are backed up according to schedules defined by the organisation and aligned with their recovery requirements.
        - IT.PRO-10.1.FE-2: Backup schedules are monitored, and missed or unsuccessful backups are identified, investigated and remediated within timeframes defined by the organisation.
        - IT.PRO-10.1.FE-3: Backup storage is encrypted and protected by immutable, offline, logically isolated or equivalent controls.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-10:it.pro-10.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-10
      ref_id: IT.PRO-10.2
      description: Isolate backup repositories from general user environments and production workloads,
        ensuring they are separated from primary systems to prevent unauthorised access, modification
        or deletion.
      annotation: |-
        Not effective:
        - IT.PRO-10.2.NE-1: Backup repositories are accessible from the production environment or by production administrators.
        - IT.PRO-10.2.NE-2: Compromise of a system would provide a direct path to access, modify or delete its own backups.

        Partially effective:
        - IT.PRO-10.2.PE-1: Backup repositories are logically separated but use credentials managed by the same identity platform as production.
        - IT.PRO-10.2.PE-2: Isolation is implemented but has not been tested or validated.

        Fully effective:
        - IT.PRO-10.2.FE-1: Backup repositories are isolated from production environments and general user access.
        - IT.PRO-10.2.FE-2: Access is controlled through credentials and administrative paths isolated from compromise of the primary identity environment.
        - IT.PRO-10.2.FE-3: Isolation has been validated to confirm that compromise of a system does not provide access to backups.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-10:it.pro-10.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-10
      ref_id: IT.PRO-10.3
      description: Conduct regular testing of backup and restoration procedures to ensure that backups
        are reliable and capable of meeting defined recovery time objectives and recovery point objectives.
      annotation: |-
        Not effective:
        - IT.PRO-10.3.NE-1: No restoration test has been conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.NE-2: No backup or restoration procedures exist.
        - IT.PRO-10.3.NE-3: Restoration testing demonstrates that backups cannot be restored, or consistently fail to meet defined recovery time or recovery point objectives.

        Partially effective:
        - IT.PRO-10.3.PE-1: Restoration testing has been conducted but does not cover all important assets.
        - IT.PRO-10.3.PE-2: Backup procedures exist but have never been tested.
        - IT.PRO-10.3.PE-3: Testing has been conducted but coverage is incomplete or some tests did not meet the expected recovery time or recovery point objectives.

        Fully effective:
        - IT.PRO-10.3.FE-1: Restoration testing covering important assets is conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.FE-2: Testing validates that restoration meets the expected recovery time and recovery point objectives.
        - IT.PRO-10.3.FE-3: Test results are documented and gaps identified during testing are remediated.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-18
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-18
      name: Network segmentation and segregation
      description: Systems (infrastructure, operating systems and applications) are segmented into network
        zones based on business criticality and trust levels, with only authorised, controlled and monitored
        inbound and outbound communication paths between network zones permitted.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-18:it.pro-18.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-18
      ref_id: IT.PRO-18.1
      description: Isolate systems within network zones based on business criticality and trust level,
        and restrict and monitor inbound and outbound access to explicitly approved pathways and services.
      annotation: |-
        Not effective:
        - IT.PRO-18.1.NE-1: Systems are deployed on shared or flat network segments with no segregation between functions or trust levels.
        - IT.PRO-18.1.NE-2: No access controls restrict network access from external or general user networks to in-scope systems.
        - IT.PRO-18.1.NE-3: Segmentation is documented or administratively defined but not enforced by technical controls.
        - IT.PRO-18.1.NE-4: Segmentation has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-18.1.PE-1: Network segmentation has been implemented but does not cover all in-scope systems, or segments are defined inconsistently.
        - IT.PRO-18.1.PE-2: Access controls exist between segments, but deny-by-default is not enforced, or some pathways are permitted without documented approval.
        - IT.PRO-18.1.PE-3: Technical enforcement is in place for some segments but relies on a single mechanism that does not provide meaningful isolation.
        - IT.PRO-18.1.PE-4: Validation has been performed for some segments but not consistently across in-scope systems, or validation is out of date.
        - IT.PRO-18.1.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.1.FE-1: Systems within scope are deployed in network segments defined according to function, criticality and trust level, with segmentation applied consistently.
        - IT.PRO-18.1.FE-2: Deny-by-default access controls are enforced between segments, with access from external and general user networks limited to documented and approved pathways.
        - IT.PRO-18.1.FE-3: Segmentation is enforced through network-layer technical controls that provide meaningful isolation.
        - IT.PRO-18.1.FE-4: Segmentation has been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.1.FE-5: Approved pathways are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and changes reflected in the access control configuration.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-18:it.pro-18.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-18
      ref_id: IT.PRO-18.2
      description: Limit lateral movement between, and within, network segments to explicitly approved
        pathways and services, based on business requirements and trust levels.
      annotation: |-
        Not effective:
        - IT.PRO-18.2.NE-1: No controls limit lateral movement between or within network segments.
        - IT.PRO-18.2.NE-2: Lateral movement is permitted by default across the environment, with restrictions applied only on an exception basis.
        - IT.PRO-18.2.NE-3: Approved pathways are not documented.
        - IT.PRO-18.2.NE-4: Lateral movement controls have not been validated through technical assessment.
        - IT.PRO-18.2.NE-5: Pathways and services are not reviewed after initial approval.

        Partially effective:
        - IT.PRO-18.2.PE-1: Controls limit lateral movement between segments but no controls operate within segments.
        - IT.PRO-18.2.PE-2: Restrictions are applied to some pathways, but the default position remains permissive in parts of the environment.
        - IT.PRO-18.2.PE-3: Approved pathways are documented but documentation is out of date or incomplete.
        - IT.PRO-18.2.PE-4: Validation has been performed but does not cover all in-scope segments, or is out of date.
        - IT.PRO-18.2.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.2.FE-1: Controls limit lateral movement both between and within segments, with deny-by-default applied at each boundary.
        - IT.PRO-18.2.FE-2: Pathways and services are explicitly approved based on documented business requirements and trust levels, with all other lateral movement denied.
        - IT.PRO-18.2.FE-3: Approved pathways are documented, reflect the current configuration and identify the business requirement and trust relationship justifying each.
        - IT.PRO-18.2.FE-4: Lateral movement controls have been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.2.FE-5: Pathways and services are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and the configuration updated to reflect approved changes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-09
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-09
      name: Content filtering
      description: Data communicated between different security domains for systems (infrastructure and
        applications) is controlled and subject to inspection and verification.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-09:it.pro-09.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-09
      ref_id: IT.PRO-09.1
      description: Inspect outbound content flows to detect unauthorised transfer of sensitive or high-value
        data.
      annotation: |-
        Not effective:
        - IT.PRO-09.1.NE-1: No outbound content inspection is deployed.
        - IT.PRO-09.1.NE-2: Sensitive data can leave the organisation through any egress path without detection or control.

        Partially effective:
        - IT.PRO-09.1.PE-1: Outbound inspection is deployed but does not cover all applicable egress paths.
        - IT.PRO-09.1.PE-2: Rules are configured but do not cover all classified, regulated or high-value data types.
        - IT.PRO-09.1.PE-3: Alerts are generated but are not triaged or acted upon in a timely manner.

        Fully effective:
        - IT.PRO-09.1.FE-1: Outbound content inspection is deployed covering all applicable egress paths.
        - IT.PRO-09.1.FE-2: Rules are configured to detect unauthorised transfer of classified, regulated and high-value data.
        - IT.PRO-09.1.FE-3: Alerts are triaged and responded to within accepted risk timeframes defined by the organisation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-09:it.pro-09.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-09
      ref_id: IT.PRO-09.2
      description: Block outbound network connections to known malicious or untrusted destinations.
      annotation: |-
        Not effective:
        - IT.PRO-09.2.NE-1: No controls are deployed to prevent systems from establishing outbound connections to known malicious or untrusted destinations.
        - IT.PRO-09.2.NE-2: Blocking decisions are not informed by current threat intelligence.
        - IT.PRO-09.2.NE-3: Destination categorisation is not used.

        Partially effective:
        - IT.PRO-09.2.PE-1: Controls to prevent outbound connections being established are deployed but cover only a subset of in-scope systems or egress paths.
        - IT.PRO-09.2.PE-2: Threat intelligence is used to inform block decisions for outbound connections, but updates are infrequent, manual or limited to a single source.
        - IT.PRO-09.2.PE-3: Categorisation is in place, but the categories blocked do not reflect the organisation’s risk position.

        Fully effective:
        - IT.PRO-09.2.FE-1: Controls are deployed and applied across in-scope systems, egress paths, services, and network boundaries.
        - IT.PRO-09.2.FE-2: Blocking decisions draw on current threat intelligence, with destination lists updated on a cycle defined by the organisation.
        - IT.PRO-09.2.FE-3: Destination reputation, category and age are considered alongside threat intelligence, with category-based blocking aligned to the organisation’s risk position.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-09:it.pro-09.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-09
      ref_id: IT.PRO-09.3
      description: Inspect inbound content from external or untrusted sources to prevent delivery of malicious
        or unsafe content.
      annotation: |-
        Not effective:
        - IT.PRO-09.3.NE-1: No inbound content inspection is deployed.

        Partially effective:
        - IT.PRO-09.3.PE-1: Inbound inspection is deployed but does not cover all applicable content channels.
        - IT.PRO-09.3.PE-2: Inspection is in place but detection signatures or rules are not maintained or updated.

        Fully effective:
        - IT.PRO-09.3.FE-1: Inbound content inspection covers all applicable content channels.
        - IT.PRO-09.3.FE-2: Detection signatures and rules are maintained and updated on a regular cycle defined by the organisation.
        - IT.PRO-09.3.FE-3: Blocked content is logged and available for review.
        - IT.PRO-09.3.FE-4: Current cyber threat intelligence is considered when implementing controls to prevent the delivery of malicious or unsafe content.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-14
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: PRO-14
      name: Cyber security awareness training
      description: Personnel are provided with ongoing cyber security awareness training, including operational
        security considerations, tailored to their duties, access levels and current cyber threats.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-14:it.pro-14.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:pro-14
      ref_id: IT.PRO-14.1
      description: Ensure all personnel receive cyber security awareness training, that is tailored to
        how they will interact with systems, applications and data in their assigned roles, before being
        granted access to organisational systems and data.
      annotation: |-
        Not effective:
        - IT.PRO-14.1.NE-1: No requirement exists for personnel to complete cyber security awareness training before being granted access to critical, privileged or business systems.
        - IT.PRO-14.1.NE-2: No training completion records are maintained.

        Partially effective:
        - IT.PRO-14.1.PE-1: A training program exists but is not tailored to the specific risks of the systems in-scope.
        - IT.PRO-14.1.PE-2: A requirement to complete training before access is granted exists but is not consistently enforced.
        - IT.PRO-14.1.PE-3: Completion records are maintained but show significant gaps in coverage.

        Fully effective:
        - IT.PRO-14.1.FE-1: Role-tailored training programs address the specific risks, data handling obligations and incident reporting requirements relevant to in-scope systems.
        - IT.PRO-14.1.FE-2: All personnel complete role-tailored training before being granted access to organisational systems and data, with refresher training mandated within a cycle defined by the organisation.
        - IT.PRO-14.1.FE-3: Completion records are maintained and demonstrate full coverage.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: DET-01
      name: Centralised event logging
      description: Security-relevant event logs and configuration changes for systems (infrastructure,
        operating systems, applications and data) are centrally collected, protected against unauthorised
        modification or deletion, and retained to support effective cyber security event detection and
        investigation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-01:it.det-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-01
      ref_id: IT.DET-01.1
      description: Protect event logs from unauthorised access, modification or deletion, including by
        encrypting them during transit and at rest and securing the systems and accounts used to store,
        manage and analyse them.
      annotation: |-
        Not effective:
        - IT.DET-01.1.NE-1: Logs generated by applicable assets are not protected from modification or deletion.
        - IT.DET-01.1.NE-2: Log access is not restricted to authorised roles with a business need.
        - IT.DET-01.1.NE-3: Logs are neither encrypted during transit nor at rest.

        Partially effective:
        - IT.DET-01.1.PE-1: Logs are forwarded but integrity protections are not in place at the source.
        - IT.DET-01.1.PE-2: Log access is restricted but some roles retain the ability to modify or delete logs.
        - IT.DET-01.1.PE-3: Logs are encrypted during transit but are not protected with encryption at rest (or vice versa).

        Fully effective:
        - IT.DET-01.1.FE-1: Logs are protected against modification or deletion.
        - IT.DET-01.1.FE-2: Logs are encrypted in transit and at rest.
        - IT.DET-01.1.FE-3: Access to logs is restricted to authorised roles with a business need.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-01:it.det-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-01
      ref_id: IT.DET-01.2
      description: Forward high-value, security-relevant event logs and configuration changes from infrastructure,
        operating systems and applications to a central log storage capability.
      annotation: |-
        Not effective:
        - IT.DET-01.2.NE-1: Security-relevant logs from assets are not forwarded to a central logging capability.
        - IT.DET-01.2.NE-2: High-value, security-relevant event logs or configuration changes from infrastructure, operating systems or applications are not forwarded.

        Partially effective:
        - IT.DET-01.2.PE-1: High-value, security-relevant event logs are forwarded, but coverage gaps are identified or completeness has not been validated.
        - IT.DET-01.2.PE-2: Configuration change logs are forwarded inconsistently.
        - IT.DET-01.2.PE-3: The utility of security log sources is reviewed, but on an ad hoc basis rather than according to a defined schedule.
        - IT.DET-01.2.PE-4: Log forwarding is in place but latency is excessive for effective detection.

        Fully effective:
        - IT.DET-01.2.FE-1: High-value security-relevant event logs and configuration changes from all relevant infrastructure, operating systems and application sources are forwarded to the central logging capability.
        - IT.DET-01.2.FE-2: Security log sources are reviewed at regular intervals to ensure their continued utility in detecting and responding to changing adversary techniques.
        - IT.DET-01.2.FE-3: Log completeness has been validated against the expected log sources.
        - IT.DET-01.2.FE-4: Logs are forwarded at a frequency that enables timely detection.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: DET-04
      name: Baseline high-risk access activities
      description: Baseline patterns of identity and credential access activities, privileged access activities,
        and remote access activities are established and maintained for systems (infrastructure, operating
        systems, applications and data) to enable the detection of anomalous or unexpected behaviour.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-04:it.det-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-04
      ref_id: IT.DET-04.1
      description: Continuously monitor and analyse software execution behaviour on systems to detect
        where legitimate tools and utilities are being used for malicious purposes.
      annotation: |-
        Not effective:
        - IT.DET-04.1.NE-1: No monitoring or equivalent analysis is used to identify anomalous or unexpected use of legitimate tools and utilities on applicable systems.
        - IT.DET-04.1.NE-2: Existing controls do not provide a reasonable capability to detect security-relevant patterns of legitimate software being used for malicious purposes.

        Partially effective:
        - IT.DET-04.1.PE-1: Monitoring or equivalent analysis covers some priority tools, execution behaviours or applicable systems, but risk-significant coverage gaps exist.
        - IT.DET-04.1.PE-2: Security-relevant execution telemetry is collected, but detection rules, behavioural analytics or equivalent analysis are incomplete or not consistently operational.
        - IT.DET-04.1.PE-3: Alerts relating to anomalous or unexpected software execution are generated, but they are not consistently triaged and investigated within organisationally defined timeframes.

        Fully effective:
        - IT.DET-04.1.FE-1: The organisation identifies the legitimate tools, utilities and execution behaviours that present heightened risk of malicious use within applicable systems.
        - IT.DET-04.1.FE-2: Security-relevant telemetry and contextual information are analysed using detection rules, behavioural analytics or equivalent methods to identify anomalous or unexpected use of priority tools and utilities.
        - IT.DET-04.1.FE-3: Detection coverage is periodically reviewed and adjusted in response to changes in applicable systems, threat intelligence, observed activity and the organisation’s risk profile.
        - IT.DET-04.1.FE-4: Alerts are prioritised, triaged and investigated within timeframes defined according to their assessed security risk.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-02
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services
      ref_id: DET-02
      name: Cyber security event detection
      description: Anomalous or unexpected events and behaviours for systems (infrastructure, operating
        systems, applications and data) are analysed in a timely manner to detect cyber security events.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-02:it.det-02.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:critical-processes-and-services:det-02
      ref_id: IT.DET-02.1
      description: Ensure event logs are normalised, time-synchronised and enriched to support correlation
        across systems and environments.
      annotation: |-
        Not effective:
        - IT.DET-02.1.NE-1: Logs are not time-synchronised to an authoritative source.
        - IT.DET-02.1.NE-2: Logs are ingested in raw format and are neither normalised nor enriched.

        Partially effective:
        - IT.DET-02.1.PE-1: Logs are time-synchronised but are not normalised to a common schema.
        - IT.DET-02.1.PE-2: Some enrichment is applied but critical contextual data such as asset classification or account type is missing.

        Fully effective:
        - IT.DET-02.1.FE-1: Logs are time-synchronised to the authoritative time source.
        - IT.DET-02.1.FE-2: Logs are normalised into the common log schema and enriched with contextual metadata.
        - IT.DET-02.1.FE-3: Enriched logs support correlation across relevant systems, environments and data sources in the central logging platform.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      assessable: false
      depth: 1
      name: Privileged environments
      description: Systems and services that support privileged activities, management services and high-impact
        administrative functions.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:ide-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: IDE-01
      name: Asset identification
      description: Systems (infrastructure, operating systems, applications, identities, credentials and
        data) are continually and centrally identified and documented.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:ide-01:it.ide-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:ide-01
      ref_id: IT.IDE-01.2
      description: Maintain current records of infrastructure, operating systems, applications, identities,
        credentials and data assets.
      annotation: |-
        Not effective:
        - IT.IDE-01.2.NE-1: A maintained record of infrastructure, operating systems, applications, identities, credentials and data assets has not been established.
        - IT.IDE-01.2.NE-2: There is no defined process for identifying, recording, reviewing and updating asset records.

        Partially effective:
        - IT.IDE-01.2.PE-1: Asset records are maintained, but identified omissions, inaccuracies or newly discovered assets are not triaged and addressed within the timeframes or tolerances defined by the organisation.
        - IT.IDE-01.2.PE-2: A process to update the asset inventory runs on a schedule but the results are not reconciled or updated within a period defined by the organisation.

        Fully effective:
        - IT.IDE-01.2.FE-1: At each scheduled review or update, records of infrastructure, operating systems, applications, identities, credentials and data assets are complete and accurate within the tolerances defined by the organisation.
        - IT.IDE-01.2.FE-2: A defined process identifies changes and newly discovered assets between scheduled reviews, and ensures that records are reviewed, reconciled and updated within timeframes commensurate with the associated cyber security risk.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-01
      name: Secure system lifecycle
      description: Systems (infrastructure, operating systems and applications) are planned, designed,
        developed, tested, deployed, maintained and decommissioned according to their business criticality
        ratings and security and resilience requirements using Secure by Design and Secure by Default
        principles and practices.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-01:it.pro-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-01
      ref_id: IT.PRO-01.1
      description: Design systems securely to provide visibility, enforce authorised access, protect data,
        minimise required and default privileges, limit exposed services and remove unnecessary functionality.
      annotation: |-
        Not effective:
        - IT.PRO-01.1.NE-1: Systems are deployed with default configurations and no evidence of security design considerations.
        - IT.PRO-01.1.NE-2: Unnecessary services, protocols or functionality remain enabled with no documented rationale.
        - IT.PRO-01.1.NE-3: Security telemetry is not enabled or is not considered as part of system design.

        Partially effective:
        - IT.PRO-01.1.PE-1: Security is considered during system design but not consistently applied across all assets.
        - IT.PRO-01.1.PE-2: Some unnecessary services have been disabled but a systematic review has not been completed.
        - IT.PRO-01.1.PE-3: Security telemetry is partially enabled but gaps in coverage exist.

        Fully effective:
        - IT.PRO-01.1.FE-1: Systems are designed and deployed with exposed services limited, required and default permissions minimised, data protections in place, authorised access enforced, and only required functionality enabled.
        - IT.PRO-01.1.FE-2: Security telemetry is enabled by default.
        - IT.PRO-01.1.FE-3: Evidence exists that security design decisions are recorded and reviewed during system changes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-01:it.pro-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-01
      ref_id: IT.PRO-01.2
      description: Secure build and deployment processes to enforce controls consistently across systems.
      annotation: |-
        Not effective:
        - IT.PRO-01.2.NE-1: No controlled build or deployment process exists for applicable assets.
        - IT.PRO-01.2.NE-2: Changes to systems are applied ad hoc, without any version control, testing or approval.

        Partially effective:
        - IT.PRO-01.2.PE-1: A controlled deployment process exists but is not consistently followed for all changes.
        - IT.PRO-01.2.PE-2: Version control is in place but pre-deployment security verification is not performed.

        Fully effective:
        - IT.PRO-01.2.FE-1: A controlled build and deployment process is in place and consistently followed.
        - IT.PRO-01.2.FE-2: Configuration changes are subject to version control, testing and approval before deployment.
        - IT.PRO-01.2.FE-3: Security controls are confirmed to be implemented consistently across systems following deployment processes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-16
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-16
      name: Cyber supply chain security
      description: Cyber supply chains supporting systems (infrastructure, operating systems, applications
        and data) are secure, resilient and support effective and coordinated cyber security incident
        response.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-16:it.pro-16.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-16
      ref_id: IT.PRO-16.1
      description: Assess the integrity and authenticity of software, components and updates before use,
        and verify provenance where suitable supplier evidence is available.
      annotation: |-
        Not effective:
        - IT.PRO-16.1.NE-1: No verification of software, component or update integrity or authenticity is performed before introduction into systems.
        - IT.PRO-16.1.NE-2: Verification outcomes are not recorded or available for review.
        - IT.PRO-16.1.NE-3: Where verification cannot be performed, no compensating control or remediation paths are documented.

        Partially effective:
        - IT.PRO-16.1.PE-1: Verification is performed for some categories of software but not consistently across operating systems, applications, firmware and dependencies.
        - IT.PRO-16.1.PE-2: Integrity or provenance checks are performed, but they do not provide sufficient assurance for all software, components or updates.
        - IT.PRO-16.1.PE-3: Verification outcomes are recorded for some software, components or updates prior to being introduced into systems, but not consistently.
        - IT.PRO-16.1.PE-4: Compensating controls exist for some unverifiable components but are not formally approved or time-bound.

        Fully effective:
        - IT.PRO-16.1.FE-1: Verification of integrity and provenance is performed for software, components and updates across all relevant categories, and provenance is verified where suitable supplier evidence is available.
        - IT.PRO-16.1.FE-2: Verification uses one or more mechanisms appropriate to the software, component, update and source to provide reliable assurance of integrity and provenance.
        - IT.PRO-16.1.FE-3: Verification outcomes are recorded and available for review.
        - IT.PRO-16.1.FE-4: Where verification cannot be performed, compensating controls are applied, exceptions are time-bound and remediation paths are documented.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-16:it.pro-16.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-16
      ref_id: IT.PRO-16.2
      description: Use vendor advisories and threat intelligence to maintain awareness of supplier, product
        and component exposure to compromise, and act within timeframes proportionate to the risk.
      annotation: |-
        Not effective:
        - IT.PRO-16.2.NE-1: No monitoring is performed for indicators of supply chain compromise affecting software, components or services in use.
        - IT.PRO-16.2.NE-2: Vendor security notifications and threat advisories are not reviewed or actioned.
        - IT.PRO-16.2.NE-3: When supply chain compromise is identified, neither containment nor investigation is performed.
        - IT.PRO-16.2.NE-4: Supply chain compromise events are integrated into neither incident response nor risk management.

        Partially effective:
        - IT.PRO-16.2.PE-1: Monitoring occurs but does not draw on relevant threat intelligence sources or does not cover all in-scope systems.
        - IT.PRO-16.2.PE-2: Notifications and advisories are reviewed but exposure assessment and response are not conducted in a timely manner.
        - IT.PRO-16.2.PE-3: Containment occurs but investigation for evidence of exploitation is not consistently undertaken.
        - IT.PRO-16.2.PE-4: Some integration exists but findings are not reflected in the risk register or incident response procedures.

        Fully effective:
        - IT.PRO-16.2.FE-1: Monitoring covers software, components and services in use, drawing on relevant threat intelligence sources.
        - IT.PRO-16.2.FE-2: Vendor security notifications and threat advisories are reviewed, exposure is assessed and response actions are initiated within defined timeframes.
        - IT.PRO-16.2.FE-3: Identified supply chain compromises are responded to in timeframes defined by the organisation.
        - IT.PRO-16.2.FE-4: Supply chain compromise events are integrated with incident response and reflected in the risk register.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-13
      name: Identity, credential and access management
      description: Robust and secure identity, credential and access management is used to establish,
        maintain and control access to systems (infrastructure, operating systems, applications and data)
        and to support effective detection of identity and credential misuse.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13:it.pro-13.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13
      ref_id: IT.PRO-13.1
      description: Identify and disable or remove default and unused accounts regularly, permitting exceptions
        only where the account is documented, justified, hardened and monitored.
      annotation: |-
        Not effective:
        - IT.PRO-13.1.NE-1: No review of default or unused accounts has been conducted within the review period defined by the organisation.
        - IT.PRO-13.1.NE-2: Default vendor accounts remain enabled on production systems without appropriate documentation, justification, hardening and monitoring in place for their use.
        - IT.PRO-13.1.NE-3: No process exists to identify accounts that have not authenticated within a defined period.

        Partially effective:
        - IT.PRO-13.1.PE-1: A review has been conducted but does not cover all assets.
        - IT.PRO-13.1.PE-2: Default accounts have been identified but some remain enabled without documented justification.
        - IT.PRO-13.1.PE-3: Unused accounts are identified but remediation is incomplete or delayed beyond defined timeframes.

        Fully effective:
        - IT.PRO-13.1.FE-1: A review of accounts has been completed within the defined review period covering all assets.
        - IT.PRO-13.1.FE-2: Default accounts are disabled or have approved justification for remaining active, with appropriate monitoring and compensating controls for their use in place.
        - IT.PRO-13.1.FE-3: Accounts that show no evidence of use, other than approved emergency access accounts, are identified and either disabled or removed in accordance with defined timeframes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13:it.pro-13.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13
      ref_id: IT.PRO-13.2
      description: Store authentication keys, secrets and tokens in approved secure repositories with
        access controls, including MFA.
      annotation: |-
        Not effective:
        - IT.PRO-13.2.NE-1: Credentials are stored in plaintext, spreadsheets, shared drives or other unapproved locations as standard practice.
        - IT.PRO-13.2.NE-2: No approved secure repository is in use to store authentication keys, secrets and tokens.
        - IT.PRO-13.2.NE-3: Access to credential stores is neither controlled nor audited.
        - IT.PRO-13.2.NE-4: Access controls such as MFA are not enabled for authentication to secure repositories.

        Partially effective:
        - IT.PRO-13.2.PE-1: An approved secure repository is in use but does not cover all authentication keys, secrets and tokens within scope.
        - IT.PRO-13.2.PE-2: Access controls for secure repositories are in place but access logging is not enabled or not reviewed.
        - IT.PRO-13.2.PE-3: MFA is enforced for some, but not all, applicable users, repositories or authentication pathways, and the remaining exceptions are documented and subject to remediation.

        Fully effective:
        - IT.PRO-13.2.FE-1: Authentication keys, secrets and tokens within scope are stored in approved secure repositories, with any authorised exceptions documented, risk-assessed and managed in accordance with organisationally defined requirements.
        - IT.PRO-13.2.FE-2: Access to secure repositories is restricted using attribute or role-based access controls, MFA is enforced for all applicable authentication pathways, and access is logged and reviewed and investigated where necessary.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13:it.pro-13.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13
      ref_id: IT.PRO-13.4
      description: Use phishing-resistant MFA for users authenticating to systems, including from untrusted,
        external or high-risk locations.
      annotation: |-
        Not effective:
        - IT.PRO-13.4.NE-1: Phishing-resistant MFA is not enforced for interactive user authentication to systems.
        - IT.PRO-13.4.NE-2: MFA is deployed but uses non-phishing-resistant methods, such as SMS, voice, or push-only authentication instead of phishing-resistant MFA.
        - IT.PRO-13.4.NE-3: No access policies differentiate between trusted and untrusted, external or high-risk locations.
        - IT.PRO-13.4.NE-4: Access from untrusted, external or high-risk locations is permitted without MFA, or with non-phishing-resistant MFA.

        Partially effective:
        - IT.PRO-13.4.PE-1: Phishing-resistant MFA is deployed for some but not all systems within scope.
        - IT.PRO-13.4.PE-2: Access policies exist but do not cover all organisationally defined high-risk location categories.
        - IT.PRO-13.4.PE-3: Exceptions or alternative authentication pathways allow routine or recurring authentication without phishing-resistant MFA, or emergency access arrangements are not adequately restricted, monitored, tested or reviewed.

        Fully effective:
        - IT.PRO-13.4.FE-1: Phishing-resistant MFA is enforced for all routine interactive user authentication to systems within scope.
        - IT.PRO-13.4.FE-2: Phishing-resistant MFA is enforced for routine authentication attempts from untrusted, external or high-risk locations.
        - IT.PRO-13.4.FE-3: Customer-facing services provide a phishing-resistant MFA option for authentication.
        - IT.PRO-13.4.FE-4: Emergency access arrangements are periodically tested and reviewed to confirm that they remain operational, appropriately protected and limited to their intended purpose. Credentials or authentication factors used for emergency access are securely managed and are not used for routine administration.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13:it.pro-13.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13
      ref_id: IT.PRO-13.5
      description: Disable legacy authentication protocols or, where this is not feasible, restrict and
        monitor their use, apply compensating controls and establish a time-bound decommissioning plan.
      annotation: |-
        Not effective:
        - IT.PRO-13.5.NE-1: Legacy authentication protocols that cannot enforce modern authentication controls remain enabled and in active use without restriction.
        - IT.PRO-13.5.NE-2: No assessment has been conducted to identify which legacy authentication protocols are in use within the environment.
        - IT.PRO-13.5.NE-3: Authentication mechanisms transmitting credentials in cleartext or using weak cryptographic primitives remain enabled and no action has been taken to disable them.
        - IT.PRO-13.5.NE-4: Where legacy protocols are retained, no compensating controls, no monitoring and no decommissioning timelines are in place.

        Partially effective:
        - IT.PRO-13.5.PE-1: Legacy authentication protocols have been identified and are partially restricted but some remain enabled across systems within scope without justification.
        - IT.PRO-13.5.PE-2: An assessment has been conducted but does not cover all in-scope systems, or the inventory of legacy protocols in use is not maintained.
        - IT.PRO-13.5.PE-3: Some weak authentication mechanisms have been disabled but others remain enabled without documented justification or remediation plan.
        - IT.PRO-13.5.PE-4: Compensating controls exist for some retained legacy protocols but monitoring is inconsistent or decommissioning timelines are not defined.

        Fully effective:
        - IT.PRO-13.5.FE-1: Legacy authentication protocols that cannot enforce modern authentication controls have been identified and disabled across systems within scope, excluding documented and risk accepted exceptions.
        - IT.PRO-13.5.FE-2: An assessment of legacy authentication protocol use has been conducted across in-scope systems and the inventory is maintained.
        - IT.PRO-13.5.FE-3: Where retention is necessary, compensating controls are applied and decommissioning timelines are recorded and tracked.
        - IT.PRO-13.5.FE-4: Ongoing use of legacy authentication protocols is regularly risk reviewed, accepted and recorded in the organisation’s risk register.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13:it.pro-13.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-13
      ref_id: IT.PRO-13.6
      description: Ensure that user, machine, system and service account credentials are unique per system
        or account, particularly in high-privilege contexts.
      annotation: |-
        Not effective:
        - IT.PRO-13.6.NE-1: Local administrator credentials are shared across the device fleet, or service or privileged account credentials are routinely reused across systems.
        - IT.PRO-13.6.NE-2: Credential uniqueness is not enforced for applicable user, machine, system or service identities.
        - IT.PRO-13.6.NE-3: Credential uniqueness has not been addressed in high-privilege contexts, including domain administration, cloud administration or automation platforms.
        - IT.PRO-13.6.NE-4: Where credential uniqueness cannot be enforced, neither compensating controls nor remediation paths are in place.

        Partially effective:
        - IT.PRO-13.6.PE-1: Local administrator credential uniqueness has been implemented for some device populations but coverage is incomplete across the device fleet.
        - IT.PRO-13.6.PE-2: A technical mechanism is in place but applies to only a subset of credential types or systems within scope.
        - IT.PRO-13.6.PE-3: Credential uniqueness has been addressed in some high-privilege contexts but gaps remain in others.
        - IT.PRO-13.6.PE-4: Compensating controls exist for some shared credentials but monitoring is inconsistent or remediation plans do not exist.

        Fully effective:
        - IT.PRO-13.6.FE-1: Credentials for applicable local administrative accounts are unique to each system or account.
        - IT.PRO-13.6.FE-2: Credential uniqueness is consistently enforced for applicable user, machine, system and service identities.
        - IT.PRO-13.6.FE-3: Credential uniqueness is enforced consistently in high-privilege contexts, with managed identities or equivalent capabilities used in preference to shared static credentials wherever feasible.
        - IT.PRO-13.6.FE-4: Where uniqueness cannot be enforced, compensating controls are applied, the use of the shared credentials is monitored, and a remediation plan exists.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-12
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-12
      name: Least privilege access
      description: Users are granted the minimum access to systems (infrastructure, operating systems,
        applications and data) required to undertake their duties or functions.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-12:it.pro-12.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-12
      ref_id: IT.PRO-12.1
      description: Periodically review and update access privileges in alignment with current roles, duties
        and business requirements.
      annotation: |-
        Not effective:
        - IT.PRO-12.1.NE-1: Access privileges are not reviewed against current roles, duties and business requirements.
        - IT.PRO-12.1.NE-2: Access reviews do not identify privileges that are no longer required.
        - IT.PRO-12.1.NE-3: Access privileges are not updated when personnel roles, duties or business requirements change.
        - IT.PRO-12.1.NE-4: Access privileges are not mapped to roles, duties and business requirements.

        Partially effective:
        - IT.PRO-12.1.PE-1: Access reviews are conducted for some accounts or systems, but coverage is incomplete.
        - IT.PRO-12.1.PE-2: Reviews identify excessive or obsolete privileges, but updates are incomplete or not completed within timeframes defined by the organisation.
        - IT.PRO-12.1.PE-3: A process to review access privileges exists but only occurs on an ad hoc basis.
        - IT.PRO-12.1.PE-4: Some access privileges are mapped to roles, duties and business requirements, but not all.

        Fully effective:
        - IT.PRO-12.1.FE-1: Access privileges for all applicable accounts and systems are reviewed within a cycle defined by the organisation and aligned with current roles, duties and business requirements.
        - IT.PRO-12.1.FE-2: Privileges identified as excessive or obsolete are removed or updated within timeframes defined by the organisation.
        - IT.PRO-12.1.FE-3: Review outcomes and resulting access changes are documented and available as evidence.
        - IT.PRO-12.1.FE-4: Access privileges are mapped to current roles, duties and business requirements.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-12:it.pro-12.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-12
      ref_id: IT.PRO-12.2
      description: Grant only authorised administrative roles permissions to create, modify or delete
        accounts and roles, and access privileged functions or applications.
      annotation: |-
        Not effective:
        - IT.PRO-12.2.NE-1: Non-administrative users can create, modify or delete accounts or roles.
        - IT.PRO-12.2.NE-2: Delegated permissions are broad and have not been audited.

        Partially effective:
        - IT.PRO-12.2.PE-1: Permissions are restricted to administrative roles but some delegated permissions are broader than required.
        - IT.PRO-12.2.PE-2: Approval workflows exist for some high-impact changes but not all.

        Fully effective:
        - IT.PRO-12.2.FE-1: Only designated administrative roles can create, modify or delete accounts and roles.
        - IT.PRO-12.2.FE-2: Delegated permissions are audited and scoped to the minimum required.
        - IT.PRO-12.2.FE-3: Approval workflows are enforced for high-impact identity and access changes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-12:it.pro-12.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-12
      ref_id: IT.PRO-12.3
      description: Provision user, administrative and non-person accounts with only the minimum access
        and privileges required to perform defined operational functions.
      annotation: |-
        Not effective:
        - IT.PRO-12.3.NE-1: Accounts are provisioned with broad default permissions that exceed operational requirements.
        - IT.PRO-12.3.NE-2: Administrative and day-to-day user functions share the same account, with no separate privileged accounts.

        Partially effective:
        - IT.PRO-12.3.PE-1: Minimum privilege provisioning is defined but not consistently applied to all account types.
        - IT.PRO-12.3.PE-2: Administrative accounts are separated from user accounts but some exceptions exist without documented justification.

        Fully effective:
        - IT.PRO-12.3.FE-1: All accounts are provisioned with documented minimum permissions aligned to defined operational functions.
        - IT.PRO-12.3.FE-2: Separate accounts are allocated for privileged and day-to-day functions, and controls prevent privileged use from day-to-day context.
        - IT.PRO-12.3.FE-3: Non-person and service accounts are scoped to their specific integration requirements.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-05
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-05
      name: Secure administration
      description: Systems (infrastructure, operating systems, applications and data) are administered
        in a secure, accountable and auditable manner.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-05:it.pro-05.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-05
      ref_id: IT.PRO-05.1
      description: Ensure administrative activities can only be performed from dedicated and hardened
        environments that are isolated from unprivileged user workloads.
      annotation: |-
        Not effective:
        - IT.PRO-05.1.NE-1: Administrative access to systems is routinely performed from standard user devices without additional controls to protect the administrative session.
        - IT.PRO-05.1.NE-2: No dedicated or hardened administrative environment exists.
        - IT.PRO-05.1.NE-3: Exceptions to the use of dedicated administrative environments are neither identified nor assessed.

        Partially effective:
        - IT.PRO-05.1.PE-1: A dedicated administrative environment has been established, but administrative access is not consistently routed through it.
        - IT.PRO-05.1.PE-2: Administrative endpoints have been hardened, but unprivileged user workloads or unnecessary functions remain accessible.
        - IT.PRO-05.1.PE-3: Exceptions are documented, but their justification, risk acceptance, compensating controls or review arrangements are incomplete or inconsistently applied.

        Fully effective:
        - IT.PRO-05.1.FE-1: Administrative sessions originate from dedicated and hardened administrative environments that are isolated from unprivileged user workloads. Where this cannot be technically enforced, exceptions are documented, risk-assessed, formally accepted and protected by compensating controls.
        - IT.PRO-05.1.FE-2: Administrative environments are hardened and restricted to the functions required for authorised administration.
        - IT.PRO-05.1.FE-3: Exceptions are limited to systems or services that cannot support administration through a dedicated environment, are periodically reviewed and are removed when the technical limitation no longer applies.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-05:it.pro-05.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-05
      ref_id: IT.PRO-05.2
      description: Enforce explicit session establishment controls before privileged actions are permitted,
        including the use of time-bound privilege grants.
      annotation: |-
        Not effective:
        - IT.PRO-05.2.NE-1: Privileged access is standing and does not require explicit activation or time-bound grants, excluding approved break-glass and emergency access accounts.
        - IT.PRO-05.2.NE-2: No re-authentication or step-up authentication is required before privileged sessions.

        Partially effective:
        - IT.PRO-05.2.PE-1: Time-bound access is implemented for some privileged roles but standing access remains for others.
        - IT.PRO-05.2.PE-2: Session duration limits exist but are not consistently enforced or are set excessively long.

        Fully effective:
        - IT.PRO-05.2.FE-1: Time-bound privilege grants are enforced for applicable privileged roles, with defined maximum session durations and approved emergency access arrangements.
        - IT.PRO-05.2.FE-2: Re-authentication or step-up authentication is required before privilege activation.
        - IT.PRO-05.2.FE-3: All privilege activations are logged with activating user, role and timeframes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-05:it.pro-05.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-05
      ref_id: IT.PRO-05.3
      description: Record all administrative or management actions that modify systems, configurations
        or controls, including the details of the associated user, timestamp and target.
      annotation: |-
        Not effective:
        - IT.PRO-05.3.NE-1: Administrative or management actions that modify systems, configurations or controls are not logged.
        - IT.PRO-05.3.NE-2: Logs do not capture sufficient detail to identify who made a change, when and to what target.

        Partially effective:
        - IT.PRO-05.3.PE-1: Logging is enabled and provides useful coverage, but does not cover all applicable administrative or management platforms.
        - IT.PRO-05.3.PE-2: Logs capture the administrator identity and action but lack detail on the target or change nature.

        Fully effective:
        - IT.PRO-05.3.FE-1: Comprehensive audit logging to capture all administrative or management actions is enabled on all platforms in scope.
        - IT.PRO-05.3.FE-2: Logs capture administrator identity, timestamp, target object and nature of change.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-04
      name: Secure configuration management
      description: Systems (infrastructure, operating systems and applications) are securely configured
        to approved and maintained baselines, including by reducing attack surfaces and attack paths,
        with configurations continually monitored and consistently enforced.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-04:it.pro-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-04
      ref_id: IT.PRO-04.1
      description: Define approved configuration baselines, informed by vendor and industry hardening
        guidance, that disable or remove unnecessary services, insecure settings, and unsupported or weak
        communication protocols.
      annotation: |-
        Not effective:
        - IT.PRO-04.1.NE-1: No documented configuration baseline exists for assets.
        - IT.PRO-04.1.NE-2: Systems are deployed with vendor defaults and no documented hardening has been applied.

        Partially effective:
        - IT.PRO-04.1.PE-1: A baseline exists but does not address all applicable asset types.
        - IT.PRO-04.1.PE-2: The baseline is documented but has not been reviewed or updated within the cycle defined by the organisation.
        - IT.PRO-04.1.PE-3: The baseline exists but rationale for configuration decisions is not documented.

        Fully effective:
        - IT.PRO-04.1.FE-1: A documented and approved baseline exists for all applicable asset types.
        - IT.PRO-04.1.FE-2: The baseline disables or removes unnecessary services, insecure settings, and unsupported or weak communication protocols.
        - IT.PRO-04.1.FE-3: Configuration decisions are documented with rationale to support drift assessment.
        - IT.PRO-04.1.FE-4: The baseline is reviewed and updated on a cycle defined by the organisation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-04:it.pro-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-04
      ref_id: IT.PRO-04.2
      description: Deploy approved configuration baselines on systems, including infrastructure, operating
        systems and applications.
      annotation: |-
        Not effective:
        - IT.PRO-04.2.NE-1: Approved baselines have not been applied to assets.
        - IT.PRO-04.2.NE-2: Baseline deployment has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-04.2.PE-1: Approved baselines have been implemented where available, but some relevant asset types are not covered by an approved baseline.
        - IT.PRO-04.2.PE-2: Deployment has occurred but validation through technical assessment is incomplete or not current.
        - IT.PRO-04.2.PE-3: Approved baselines have been deployed, but coverage for all applicable assets is inconsistent.

        Fully effective:
        - IT.PRO-04.2.FE-1: Approved baselines have been applied to all applicable assets.
        - IT.PRO-04.2.FE-2: Deployment has been validated through technical assessment.
        - IT.PRO-04.2.FE-3: Coverage metrics are available demonstrating deployment completeness.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-04:it.pro-04.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-04
      ref_id: IT.PRO-04.3
      description: Detect and respond to configuration drift using scheduled technical assessments and,
        where supported, automated monitoring, based on system criticality and change rate.
      annotation: |-
        Not effective:
        - IT.PRO-04.3.NE-1: No mechanism exists to detect configuration drift from approved baselines.
        - IT.PRO-04.3.NE-2: Assessments to detect configuration drift have not been conducted within the review period defined by the organisation.
        - IT.PRO-04.3.NE-3: Assessments do not systematically identify instances of configuration drift for assets.

        Partially effective:
        - IT.PRO-04.3.PE-1: Drift detection is in place but does not cover all applicable assets.
        - IT.PRO-04.3.PE-2: Drift is detected but the remediation process is informal or response timeframes are not defined.

        Fully effective:
        - IT.PRO-04.3.FE-1: Automated configuration monitoring or regular technical assessments detect drift across the applicable assets, occurring at a frequency based on system criticality and change rate.
        - IT.PRO-04.3.FE-2: A documented remediation process exists with defined response timeframes aligned to severity.
        - IT.PRO-04.3.FE-3: Drift events are tracked to closure with evidence of remediation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-06
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-06
      name: Vulnerability management
      description: Vulnerabilities in systems (infrastructure, operating systems, applications and data)
        are identified, documented, validated and prioritised for remediation or mitigation in a timely
        manner, with all remediation and mitigation actions verified for effectiveness.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-06:it.pro-06.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-06
      ref_id: IT.PRO-06.1
      description: Identify known software and configuration weaknesses of assets through continuous and
        repeatable assessment activities, including vulnerability scanning activities.
      annotation: |-
        Not effective:
        - IT.PRO-06.1.NE-1: Vulnerability scanning activities are not undertaken.
        - IT.PRO-06.1.NE-2: No routine vulnerability assessment activity has been conducted within a period defined by the organisation.
        - IT.PRO-06.1.NE-3: Advisories for relevant software and configuration weaknesses for organisational assets are not reviewed and assessed for impact.

        Partially effective:
        - IT.PRO-06.1.PE-1: Vulnerability scanning is deployed but does not cover all applicable assets.
        - IT.PRO-06.1.PE-2: Vulnerability scans are conducted but results are not reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.PE-3: Vulnerability scans are conducted but frequency is not regular enough to enable timely response.
        - IT.PRO-06.1.PE-4: Scanning covers software vulnerabilities but not configuration weaknesses.
        - IT.PRO-06.1.PE-5: Advisories for relevant software and configuration weaknesses for organisational assets are reviewed on an ad hoc basis, or only for some assets.

        Fully effective:
        - IT.PRO-06.1.FE-1: All applicable assets are included in routine vulnerability scanning, and scanning frequency enables timely response.
        - IT.PRO-06.1.FE-2: Scanning covers both software vulnerabilities and configuration weaknesses.
        - IT.PRO-06.1.FE-3: Results are reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.FE-4: Advisories for relevant software and configuration weaknesses in all organisational assets are regularly reviewed and assessed for impact.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-06:it.pro-06.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-06
      ref_id: IT.PRO-06.2
      description: Apply security patches or updates within defined risk-based timeframes or automatically
        where operational impact is low.
      annotation: |-
        Not effective:
        - IT.PRO-06.2.NE-1: No defined patching timeframes exist for applicable assets.
        - IT.PRO-06.2.NE-2: Patches are not applied or are applied on an ad hoc basis with no tracking.

        Partially effective:
        - IT.PRO-06.2.PE-1: Expected patching timeframes are defined by the organisation but are not consistently met.
        - IT.PRO-06.2.PE-2: Patches are applied but compensating controls are not documented where operational constraints prevent timely patching.
        - IT.PRO-06.2.PE-3: Patching coverage metrics exist but show significant gaps.

        Fully effective:
        - IT.PRO-06.2.FE-1: Risk-based patching timeframes defined by the organisation are in place and consistently met.
        - IT.PRO-06.2.FE-2: Patching is prioritised based on vulnerability severity, exposure and exploit availability.
        - IT.PRO-06.2.FE-3: Where operational constraints prevent timely patching, compensating controls are documented and approved.
        - IT.PRO-06.2.FE-4: Patching coverage metrics account for all applicable assets, with any exclusions identified and formally risk accepted.
        - IT.PRO-06.2.FE-5: Automatic patching of assets is applied where available and the organisation has determined operational impact is low.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-06:it.pro-06.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-06
      ref_id: IT.PRO-06.3
      description: Remediate or mitigate vulnerabilities exceeding defined risk thresholds within defined
        timeframes based on exploitation, exposure, criticality, impact and compensating controls, and
        verify treatment effectiveness.
      annotation: |-
        Not effective:
        - IT.PRO-06.3.NE-1: No risk thresholds are defined for vulnerability remediation.
        - IT.PRO-06.3.NE-2: Vulnerabilities exceeding acceptable risk levels are not tracked or remediated.

        Partially effective:
        - IT.PRO-06.3.PE-1: Risk thresholds are defined but vulnerabilities exceeding them are not consistently remediated within defined timeframes.
        - IT.PRO-06.3.PE-2: Compensating controls are applied in some cases but are not formally documented or approved.

        Fully effective:
        - IT.PRO-06.3.FE-1: Risk thresholds defined by the organisation exist, and vulnerabilities exceeding them are remediated or have approved compensating controls within organisationally defined timeframes.
        - IT.PRO-06.3.FE-2: Remediation and mitigation actions are tracked to closure with verification that actions reduced the risk as intended.
        - IT.PRO-06.3.FE-3: The process is sustained, with historical data demonstrating consistent performance across organisationally defined reporting periods.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-07
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-07
      name: Trustworthy software
      description: Systems (operating systems and applications) only permit the execution of software
        that is supported, verified and authorised.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-07:it.pro-07.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-07
      ref_id: IT.PRO-07.1
      description: Permit only supported, verified and organisation-authorised software to execute on
        systems, with exceptions minimised, formally risk accepted, time-bound, monitored and regularly
        reviewed.
      annotation: |-
        Not effective:
        - IT.PRO-07.1.NE-1: Unsupported, unverified or unauthorised software can execute without restriction.
        - IT.PRO-07.1.NE-2: The list of approved software does not exist.

        Partially effective:
        - IT.PRO-07.1.PE-1: Execution restriction controls are deployed but do not cover all applicable assets.
        - IT.PRO-07.1.PE-2: The organisation maintains a list of approved software, but it has not been reviewed within timeframes defined by the organisation.
        - IT.PRO-07.1.PE-3: Execution restrictions are in place but integrity verification of approved software is not performed.
        - IT.PRO-07.1.PE-4: Exceptions to execution restrictions are granted without formal approval or time-bounding.

        Fully effective:
        - IT.PRO-07.1.FE-1: Controls restrict execution to supported, organisation-authorised and integrity-verified software on all applicable assets.
        - IT.PRO-07.1.FE-2: The organisation maintains a list of approved software and reviews it within the timeframes defined by the organisation.
        - IT.PRO-07.1.FE-3: Integrity of permitted software is verified using trusted mechanisms appropriate to the software and its source.
        - IT.PRO-07.1.FE-4: Exceptions are formally approved, documented, time-bound and reviewed on a regular cycle defined by the organisation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-07:it.pro-07.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-07
      ref_id: IT.PRO-07.2
      description: Restrict administrative and management tooling to approved software sets and executed
        from only authorised, known locations.
      annotation: |-
        Not effective:
        - IT.PRO-07.2.NE-1: No approved administrative toolset is defined.
        - IT.PRO-07.2.NE-2: No restrictions are placed on the location administrative tooling can be executed from.
        - IT.PRO-07.2.NE-3: No controls prevent unapproved administrative tools, including tools commonly used in post-compromise activity, from executing on managed assets.

        Partially effective:
        - IT.PRO-07.2.PE-1: An approved toolset is defined but not consistently enforced across all assets.
        - IT.PRO-07.2.PE-2: Administrative tooling is configured to execute from known locations, but privileged users can still run tooling from unapproved locations.
        - IT.PRO-07.2.PE-3: Some unapproved administrative tools are blocked but enforcement gaps exist.

        Fully effective:
        - IT.PRO-07.2.FE-1: A defined and enforced approved toolset exists for administrative and management activities, and execution is limited to authorised, known locations.
        - IT.PRO-07.2.FE-2: Administrative and management tooling outside the approved set is blocked from execution, including from unauthorised locations.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-10
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-10
      name: Regular and proven backups
      description: Systems (infrastructure, operating systems, applications and data) are regularly backed
        up in a secure and proven manner, including through the validation of restoration capabilities.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-10:it.pro-10.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-10
      ref_id: IT.PRO-10.1
      description: Back up important data, applications and settings on a defined schedule to secure,
        resilient storage protected by encryption and immutable, offline, logically isolated or equivalent
        controls.
      annotation: |-
        Not effective:
        - IT.PRO-10.1.NE-1: No managed backup process exists for important data, applications and settings.
        - IT.PRO-10.1.NE-2: Backup storage is neither encrypted nor protected by immutable, offline, logically isolated or equivalent controls.

        Partially effective:
        - IT.PRO-10.1.PE-1: Important data, applications and settings are backed up, but backup schedules are not defined, do not cover all important assets, or are not consistently met.
        - IT.PRO-10.1.PE-2: Backups are encrypted but no immutable, offline, logically isolated or equivalent resilience controls are consistently applied.
        - IT.PRO-10.1.PE-3: Backups use immutable, offline, logically isolated or equivalent controls, but encryption is not consistently enforced.

        Fully effective:
        - IT.PRO-10.1.FE-1: All important data, applications and settings are backed up according to schedules defined by the organisation and aligned with their recovery requirements.
        - IT.PRO-10.1.FE-2: Backup schedules are monitored, and missed or unsuccessful backups are identified, investigated and remediated within timeframes defined by the organisation.
        - IT.PRO-10.1.FE-3: Backup storage is encrypted and protected by immutable, offline, logically isolated or equivalent controls.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-10:it.pro-10.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-10
      ref_id: IT.PRO-10.2
      description: Isolate backup repositories from general user environments and production workloads,
        ensuring they are separated from primary systems to prevent unauthorised access, modification
        or deletion.
      annotation: |-
        Not effective:
        - IT.PRO-10.2.NE-1: Backup repositories are accessible from the production environment or by production administrators.
        - IT.PRO-10.2.NE-2: Compromise of a system would provide a direct path to access, modify or delete its own backups.

        Partially effective:
        - IT.PRO-10.2.PE-1: Backup repositories are logically separated but use credentials managed by the same identity platform as production.
        - IT.PRO-10.2.PE-2: Isolation is implemented but has not been tested or validated.

        Fully effective:
        - IT.PRO-10.2.FE-1: Backup repositories are isolated from production environments and general user access.
        - IT.PRO-10.2.FE-2: Access is controlled through credentials and administrative paths isolated from compromise of the primary identity environment.
        - IT.PRO-10.2.FE-3: Isolation has been validated to confirm that compromise of a system does not provide access to backups.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-10:it.pro-10.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-10
      ref_id: IT.PRO-10.3
      description: Conduct regular testing of backup and restoration procedures to ensure that backups
        are reliable and capable of meeting defined recovery time objectives and recovery point objectives.
      annotation: |-
        Not effective:
        - IT.PRO-10.3.NE-1: No restoration test has been conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.NE-2: No backup or restoration procedures exist.
        - IT.PRO-10.3.NE-3: Restoration testing demonstrates that backups cannot be restored, or consistently fail to meet defined recovery time or recovery point objectives.

        Partially effective:
        - IT.PRO-10.3.PE-1: Restoration testing has been conducted but does not cover all important assets.
        - IT.PRO-10.3.PE-2: Backup procedures exist but have never been tested.
        - IT.PRO-10.3.PE-3: Testing has been conducted but coverage is incomplete or some tests did not meet the expected recovery time or recovery point objectives.

        Fully effective:
        - IT.PRO-10.3.FE-1: Restoration testing covering important assets is conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.FE-2: Testing validates that restoration meets the expected recovery time and recovery point objectives.
        - IT.PRO-10.3.FE-3: Test results are documented and gaps identified during testing are remediated.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-18
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-18
      name: Network segmentation and segregation
      description: Systems (infrastructure, operating systems and applications) are segmented into network
        zones based on business criticality and trust levels, with only authorised, controlled and monitored
        inbound and outbound communication paths between network zones permitted.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-18:it.pro-18.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-18
      ref_id: IT.PRO-18.1
      description: Isolate systems within network zones based on business criticality and trust level,
        and restrict and monitor inbound and outbound access to explicitly approved pathways and services.
      annotation: |-
        Not effective:
        - IT.PRO-18.1.NE-1: Systems are deployed on shared or flat network segments with no segregation between functions or trust levels.
        - IT.PRO-18.1.NE-2: No access controls restrict network access from external or general user networks to in-scope systems.
        - IT.PRO-18.1.NE-3: Segmentation is documented or administratively defined but not enforced by technical controls.
        - IT.PRO-18.1.NE-4: Segmentation has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-18.1.PE-1: Network segmentation has been implemented but does not cover all in-scope systems, or segments are defined inconsistently.
        - IT.PRO-18.1.PE-2: Access controls exist between segments, but deny-by-default is not enforced, or some pathways are permitted without documented approval.
        - IT.PRO-18.1.PE-3: Technical enforcement is in place for some segments but relies on a single mechanism that does not provide meaningful isolation.
        - IT.PRO-18.1.PE-4: Validation has been performed for some segments but not consistently across in-scope systems, or validation is out of date.
        - IT.PRO-18.1.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.1.FE-1: Systems within scope are deployed in network segments defined according to function, criticality and trust level, with segmentation applied consistently.
        - IT.PRO-18.1.FE-2: Deny-by-default access controls are enforced between segments, with access from external and general user networks limited to documented and approved pathways.
        - IT.PRO-18.1.FE-3: Segmentation is enforced through network-layer technical controls that provide meaningful isolation.
        - IT.PRO-18.1.FE-4: Segmentation has been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.1.FE-5: Approved pathways are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and changes reflected in the access control configuration.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-18:it.pro-18.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-18
      ref_id: IT.PRO-18.2
      description: Limit lateral movement between, and within, network segments to explicitly approved
        pathways and services, based on business requirements and trust levels.
      annotation: |-
        Not effective:
        - IT.PRO-18.2.NE-1: No controls limit lateral movement between or within network segments.
        - IT.PRO-18.2.NE-2: Lateral movement is permitted by default across the environment, with restrictions applied only on an exception basis.
        - IT.PRO-18.2.NE-3: Approved pathways are not documented.
        - IT.PRO-18.2.NE-4: Lateral movement controls have not been validated through technical assessment.
        - IT.PRO-18.2.NE-5: Pathways and services are not reviewed after initial approval.

        Partially effective:
        - IT.PRO-18.2.PE-1: Controls limit lateral movement between segments but no controls operate within segments.
        - IT.PRO-18.2.PE-2: Restrictions are applied to some pathways, but the default position remains permissive in parts of the environment.
        - IT.PRO-18.2.PE-3: Approved pathways are documented but documentation is out of date or incomplete.
        - IT.PRO-18.2.PE-4: Validation has been performed but does not cover all in-scope segments, or is out of date.
        - IT.PRO-18.2.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.2.FE-1: Controls limit lateral movement both between and within segments, with deny-by-default applied at each boundary.
        - IT.PRO-18.2.FE-2: Pathways and services are explicitly approved based on documented business requirements and trust levels, with all other lateral movement denied.
        - IT.PRO-18.2.FE-3: Approved pathways are documented, reflect the current configuration and identify the business requirement and trust relationship justifying each.
        - IT.PRO-18.2.FE-4: Lateral movement controls have been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.2.FE-5: Pathways and services are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and the configuration updated to reflect approved changes.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-09
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-09
      name: Content filtering
      description: Data communicated between different security domains for systems (infrastructure and
        applications) is controlled and subject to inspection and verification.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-09:it.pro-09.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-09
      ref_id: IT.PRO-09.1
      description: Inspect outbound content flows to detect unauthorised transfer of sensitive or high-value
        data.
      annotation: |-
        Not effective:
        - IT.PRO-09.1.NE-1: No outbound content inspection is deployed.
        - IT.PRO-09.1.NE-2: Sensitive data can leave the organisation through any egress path without detection or control.

        Partially effective:
        - IT.PRO-09.1.PE-1: Outbound inspection is deployed but does not cover all applicable egress paths.
        - IT.PRO-09.1.PE-2: Rules are configured but do not cover all classified, regulated or high-value data types.
        - IT.PRO-09.1.PE-3: Alerts are generated but are not triaged or acted upon in a timely manner.

        Fully effective:
        - IT.PRO-09.1.FE-1: Outbound content inspection is deployed covering all applicable egress paths.
        - IT.PRO-09.1.FE-2: Rules are configured to detect unauthorised transfer of classified, regulated and high-value data.
        - IT.PRO-09.1.FE-3: Alerts are triaged and responded to within accepted risk timeframes defined by the organisation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-14
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: PRO-14
      name: Cyber security awareness training
      description: Personnel are provided with ongoing cyber security awareness training, including operational
        security considerations, tailored to their duties, access levels and current cyber threats.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-14:it.pro-14.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:pro-14
      ref_id: IT.PRO-14.1
      description: Ensure all personnel receive cyber security awareness training, that is tailored to
        how they will interact with systems, applications and data in their assigned roles, before being
        granted access to organisational systems and data.
      annotation: |-
        Not effective:
        - IT.PRO-14.1.NE-1: No requirement exists for personnel to complete cyber security awareness training before being granted access to critical, privileged or business systems.
        - IT.PRO-14.1.NE-2: No training completion records are maintained.

        Partially effective:
        - IT.PRO-14.1.PE-1: A training program exists but is not tailored to the specific risks of the systems in-scope.
        - IT.PRO-14.1.PE-2: A requirement to complete training before access is granted exists but is not consistently enforced.
        - IT.PRO-14.1.PE-3: Completion records are maintained but show significant gaps in coverage.

        Fully effective:
        - IT.PRO-14.1.FE-1: Role-tailored training programs address the specific risks, data handling obligations and incident reporting requirements relevant to in-scope systems.
        - IT.PRO-14.1.FE-2: All personnel complete role-tailored training before being granted access to organisational systems and data, with refresher training mandated within a cycle defined by the organisation.
        - IT.PRO-14.1.FE-3: Completion records are maintained and demonstrate full coverage.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: DET-01
      name: Centralised event logging
      description: Security-relevant event logs and configuration changes for systems (infrastructure,
        operating systems, applications and data) are centrally collected, protected against unauthorised
        modification or deletion, and retained to support effective cyber security event detection and
        investigation.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-01:it.det-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-01
      ref_id: IT.DET-01.1
      description: Protect event logs from unauthorised access, modification or deletion, including by
        encrypting them during transit and at rest and securing the systems and accounts used to store,
        manage and analyse them.
      annotation: |-
        Not effective:
        - IT.DET-01.1.NE-1: Logs generated by applicable assets are not protected from modification or deletion.
        - IT.DET-01.1.NE-2: Log access is not restricted to authorised roles with a business need.
        - IT.DET-01.1.NE-3: Logs are neither encrypted during transit nor at rest.

        Partially effective:
        - IT.DET-01.1.PE-1: Logs are forwarded but integrity protections are not in place at the source.
        - IT.DET-01.1.PE-2: Log access is restricted but some roles retain the ability to modify or delete logs.
        - IT.DET-01.1.PE-3: Logs are encrypted during transit but are not protected with encryption at rest (or vice versa).

        Fully effective:
        - IT.DET-01.1.FE-1: Logs are protected against modification or deletion.
        - IT.DET-01.1.FE-2: Logs are encrypted in transit and at rest.
        - IT.DET-01.1.FE-3: Access to logs is restricted to authorised roles with a business need.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-01:it.det-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-01
      ref_id: IT.DET-01.2
      description: Forward high-value, security-relevant event logs and configuration changes from infrastructure,
        operating systems and applications to a central log storage capability.
      annotation: |-
        Not effective:
        - IT.DET-01.2.NE-1: Security-relevant logs from assets are not forwarded to a central logging capability.
        - IT.DET-01.2.NE-2: High-value, security-relevant event logs or configuration changes from infrastructure, operating systems or applications are not forwarded.

        Partially effective:
        - IT.DET-01.2.PE-1: High-value, security-relevant event logs are forwarded, but coverage gaps are identified or completeness has not been validated.
        - IT.DET-01.2.PE-2: Configuration change logs are forwarded inconsistently.
        - IT.DET-01.2.PE-3: The utility of security log sources is reviewed, but on an ad hoc basis rather than according to a defined schedule.
        - IT.DET-01.2.PE-4: Log forwarding is in place but latency is excessive for effective detection.

        Fully effective:
        - IT.DET-01.2.FE-1: High-value security-relevant event logs and configuration changes from all relevant infrastructure, operating systems and application sources are forwarded to the central logging capability.
        - IT.DET-01.2.FE-2: Security log sources are reviewed at regular intervals to ensure their continued utility in detecting and responding to changing adversary techniques.
        - IT.DET-01.2.FE-3: Log completeness has been validated against the expected log sources.
        - IT.DET-01.2.FE-4: Logs are forwarded at a frequency that enables timely detection.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: DET-04
      name: Baseline high-risk access activities
      description: Baseline patterns of identity and credential access activities, privileged access activities,
        and remote access activities are established and maintained for systems (infrastructure, operating
        systems, applications and data) to enable the detection of anomalous or unexpected behaviour.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-04:it.det-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-04
      ref_id: IT.DET-04.1
      description: Continuously monitor and analyse software execution behaviour on systems to detect
        where legitimate tools and utilities are being used for malicious purposes.
      annotation: |-
        Not effective:
        - IT.DET-04.1.NE-1: No monitoring or equivalent analysis is used to identify anomalous or unexpected use of legitimate tools and utilities on applicable systems.
        - IT.DET-04.1.NE-2: Existing controls do not provide a reasonable capability to detect security-relevant patterns of legitimate software being used for malicious purposes.

        Partially effective:
        - IT.DET-04.1.PE-1: Monitoring or equivalent analysis covers some priority tools, execution behaviours or applicable systems, but risk-significant coverage gaps exist.
        - IT.DET-04.1.PE-2: Security-relevant execution telemetry is collected, but detection rules, behavioural analytics or equivalent analysis are incomplete or not consistently operational.
        - IT.DET-04.1.PE-3: Alerts relating to anomalous or unexpected software execution are generated, but they are not consistently triaged and investigated within organisationally defined timeframes.

        Fully effective:
        - IT.DET-04.1.FE-1: The organisation identifies the legitimate tools, utilities and execution behaviours that present heightened risk of malicious use within applicable systems.
        - IT.DET-04.1.FE-2: Security-relevant telemetry and contextual information are analysed using detection rules, behavioural analytics or equivalent methods to identify anomalous or unexpected use of priority tools and utilities.
        - IT.DET-04.1.FE-3: Detection coverage is periodically reviewed and adjusted in response to changes in applicable systems, threat intelligence, observed activity and the organisation’s risk profile.
        - IT.DET-04.1.FE-4: Alerts are prioritised, triaged and investigated within timeframes defined according to their assessed security risk.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-02
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments
      ref_id: DET-02
      name: Cyber security event detection
      description: Anomalous or unexpected events and behaviours for systems (infrastructure, operating
        systems, applications and data) are analysed in a timely manner to detect cyber security events.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-02:it.det-02.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:privileged-environments:det-02
      ref_id: IT.DET-02.1
      description: Ensure event logs are normalised, time-synchronised and enriched to support correlation
        across systems and environments.
      annotation: |-
        Not effective:
        - IT.DET-02.1.NE-1: Logs are not time-synchronised to an authoritative source.
        - IT.DET-02.1.NE-2: Logs are ingested in raw format and are neither normalised nor enriched.

        Partially effective:
        - IT.DET-02.1.PE-1: Logs are time-synchronised but are not normalised to a common schema.
        - IT.DET-02.1.PE-2: Some enrichment is applied but critical contextual data such as asset classification or account type is missing.

        Fully effective:
        - IT.DET-02.1.FE-1: Logs are time-synchronised to the authoritative time source.
        - IT.DET-02.1.FE-2: Logs are normalised into the common log schema and enriched with contextual metadata.
        - IT.DET-02.1.FE-3: Enriched logs support correlation across relevant systems, environments and data sources in the central logging platform.
      implementation_groups:
      - '2'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      assessable: false
      depth: 1
      name: Business systems
      description: Supporting enterprise functions that collectively enable organisational operations.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:ide-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: IDE-01
      name: Asset identification
      description: Systems (infrastructure, operating systems, applications, identities, credentials and
        data) are continually and centrally identified and documented.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:ide-01:it.ide-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:ide-01
      ref_id: IT.IDE-01.2
      description: Maintain current records of infrastructure, operating systems, applications, identities,
        credentials and data assets.
      annotation: |-
        Not effective:
        - IT.IDE-01.2.NE-1: A maintained record of infrastructure, operating systems, applications, identities, credentials and data assets has not been established.
        - IT.IDE-01.2.NE-2: There is no defined process for identifying, recording, reviewing and updating asset records.

        Partially effective:
        - IT.IDE-01.2.PE-1: Asset records are maintained, but identified omissions, inaccuracies or newly discovered assets are not triaged and addressed within the timeframes or tolerances defined by the organisation.
        - IT.IDE-01.2.PE-2: A process to update the asset inventory runs on a schedule but the results are not reconciled or updated within a period defined by the organisation.

        Fully effective:
        - IT.IDE-01.2.FE-1: At each scheduled review or update, records of infrastructure, operating systems, applications, identities, credentials and data assets are complete and accurate within the tolerances defined by the organisation.
        - IT.IDE-01.2.FE-2: A defined process identifies changes and newly discovered assets between scheduled reviews, and ensures that records are reviewed, reconciled and updated within timeframes commensurate with the associated cyber security risk.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-01
      name: Secure system lifecycle
      description: Systems (infrastructure, operating systems and applications) are planned, designed,
        developed, tested, deployed, maintained and decommissioned according to their business criticality
        ratings and security and resilience requirements using Secure by Design and Secure by Default
        principles and practices.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-01:it.pro-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-01
      ref_id: IT.PRO-01.1
      description: Design systems securely to provide visibility, enforce authorised access, protect data,
        minimise required and default privileges, limit exposed services and remove unnecessary functionality.
      annotation: |-
        Not effective:
        - IT.PRO-01.1.NE-1: Systems are deployed with default configurations and no evidence of security design considerations.
        - IT.PRO-01.1.NE-2: Unnecessary services, protocols or functionality remain enabled with no documented rationale.
        - IT.PRO-01.1.NE-3: Security telemetry is not enabled or is not considered as part of system design.

        Partially effective:
        - IT.PRO-01.1.PE-1: Security is considered during system design but not consistently applied across all assets.
        - IT.PRO-01.1.PE-2: Some unnecessary services have been disabled but a systematic review has not been completed.
        - IT.PRO-01.1.PE-3: Security telemetry is partially enabled but gaps in coverage exist.

        Fully effective:
        - IT.PRO-01.1.FE-1: Systems are designed and deployed with exposed services limited, required and default permissions minimised, data protections in place, authorised access enforced, and only required functionality enabled.
        - IT.PRO-01.1.FE-2: Security telemetry is enabled by default.
        - IT.PRO-01.1.FE-3: Evidence exists that security design decisions are recorded and reviewed during system changes.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-01:it.pro-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-01
      ref_id: IT.PRO-01.2
      description: Secure build and deployment processes to enforce controls consistently across systems.
      annotation: |-
        Not effective:
        - IT.PRO-01.2.NE-1: No controlled build or deployment process exists for applicable assets.
        - IT.PRO-01.2.NE-2: Changes to systems are applied ad hoc, without any version control, testing or approval.

        Partially effective:
        - IT.PRO-01.2.PE-1: A controlled deployment process exists but is not consistently followed for all changes.
        - IT.PRO-01.2.PE-2: Version control is in place but pre-deployment security verification is not performed.

        Fully effective:
        - IT.PRO-01.2.FE-1: A controlled build and deployment process is in place and consistently followed.
        - IT.PRO-01.2.FE-2: Configuration changes are subject to version control, testing and approval before deployment.
        - IT.PRO-01.2.FE-3: Security controls are confirmed to be implemented consistently across systems following deployment processes.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-16
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-16
      name: Cyber supply chain security
      description: Cyber supply chains supporting systems (infrastructure, operating systems, applications
        and data) are secure, resilient and support effective and coordinated cyber security incident
        response.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-16:it.pro-16.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-16
      ref_id: IT.PRO-16.1
      description: Assess the integrity and authenticity of software, components and updates before use,
        and verify provenance where suitable supplier evidence is available.
      annotation: |-
        Not effective:
        - IT.PRO-16.1.NE-1: No verification of software, component or update integrity or authenticity is performed before introduction into systems.
        - IT.PRO-16.1.NE-2: Verification outcomes are not recorded or available for review.
        - IT.PRO-16.1.NE-3: Where verification cannot be performed, no compensating control or remediation paths are documented.

        Partially effective:
        - IT.PRO-16.1.PE-1: Verification is performed for some categories of software but not consistently across operating systems, applications, firmware and dependencies.
        - IT.PRO-16.1.PE-2: Integrity or provenance checks are performed, but they do not provide sufficient assurance for all software, components or updates.
        - IT.PRO-16.1.PE-3: Verification outcomes are recorded for some software, components or updates prior to being introduced into systems, but not consistently.
        - IT.PRO-16.1.PE-4: Compensating controls exist for some unverifiable components but are not formally approved or time-bound.

        Fully effective:
        - IT.PRO-16.1.FE-1: Verification of integrity and provenance is performed for software, components and updates across all relevant categories, and provenance is verified where suitable supplier evidence is available.
        - IT.PRO-16.1.FE-2: Verification uses one or more mechanisms appropriate to the software, component, update and source to provide reliable assurance of integrity and provenance.
        - IT.PRO-16.1.FE-3: Verification outcomes are recorded and available for review.
        - IT.PRO-16.1.FE-4: Where verification cannot be performed, compensating controls are applied, exceptions are time-bound and remediation paths are documented.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-13
      name: Identity, credential and access management
      description: Robust and secure identity, credential and access management is used to establish,
        maintain and control access to systems (infrastructure, operating systems, applications and data)
        and to support effective detection of identity and credential misuse.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13:it.pro-13.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13
      ref_id: IT.PRO-13.1
      description: Identify and disable or remove default and unused accounts regularly, permitting exceptions
        only where the account is documented, justified, hardened and monitored.
      annotation: |-
        Not effective:
        - IT.PRO-13.1.NE-1: No review of default or unused accounts has been conducted within the review period defined by the organisation.
        - IT.PRO-13.1.NE-2: Default vendor accounts remain enabled on production systems without appropriate documentation, justification, hardening and monitoring in place for their use.
        - IT.PRO-13.1.NE-3: No process exists to identify accounts that have not authenticated within a defined period.

        Partially effective:
        - IT.PRO-13.1.PE-1: A review has been conducted but does not cover all assets.
        - IT.PRO-13.1.PE-2: Default accounts have been identified but some remain enabled without documented justification.
        - IT.PRO-13.1.PE-3: Unused accounts are identified but remediation is incomplete or delayed beyond defined timeframes.

        Fully effective:
        - IT.PRO-13.1.FE-1: A review of accounts has been completed within the defined review period covering all assets.
        - IT.PRO-13.1.FE-2: Default accounts are disabled or have approved justification for remaining active, with appropriate monitoring and compensating controls for their use in place.
        - IT.PRO-13.1.FE-3: Accounts that show no evidence of use, other than approved emergency access accounts, are identified and either disabled or removed in accordance with defined timeframes.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13:it.pro-13.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13
      ref_id: IT.PRO-13.2
      description: Store authentication keys, secrets and tokens in approved secure repositories with
        access controls, including MFA.
      annotation: |-
        Not effective:
        - IT.PRO-13.2.NE-1: Credentials are stored in plaintext, spreadsheets, shared drives or other unapproved locations as standard practice.
        - IT.PRO-13.2.NE-2: No approved secure repository is in use to store authentication keys, secrets and tokens.
        - IT.PRO-13.2.NE-3: Access to credential stores is neither controlled nor audited.
        - IT.PRO-13.2.NE-4: Access controls such as MFA are not enabled for authentication to secure repositories.

        Partially effective:
        - IT.PRO-13.2.PE-1: An approved secure repository is in use but does not cover all authentication keys, secrets and tokens within scope.
        - IT.PRO-13.2.PE-2: Access controls for secure repositories are in place but access logging is not enabled or not reviewed.
        - IT.PRO-13.2.PE-3: MFA is enforced for some, but not all, applicable users, repositories or authentication pathways, and the remaining exceptions are documented and subject to remediation.

        Fully effective:
        - IT.PRO-13.2.FE-1: Authentication keys, secrets and tokens within scope are stored in approved secure repositories, with any authorised exceptions documented, risk-assessed and managed in accordance with organisationally defined requirements.
        - IT.PRO-13.2.FE-2: Access to secure repositories is restricted using attribute or role-based access controls, MFA is enforced for all applicable authentication pathways, and access is logged and reviewed and investigated where necessary.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13:it.pro-13.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13
      ref_id: IT.PRO-13.4
      description: Use phishing-resistant MFA for users authenticating to systems, including from untrusted,
        external or high-risk locations.
      annotation: |-
        Not effective:
        - IT.PRO-13.4.NE-1: Phishing-resistant MFA is not enforced for interactive user authentication to systems.
        - IT.PRO-13.4.NE-2: MFA is deployed but uses non-phishing-resistant methods, such as SMS, voice, or push-only authentication instead of phishing-resistant MFA.
        - IT.PRO-13.4.NE-3: No access policies differentiate between trusted and untrusted, external or high-risk locations.
        - IT.PRO-13.4.NE-4: Access from untrusted, external or high-risk locations is permitted without MFA, or with non-phishing-resistant MFA.

        Partially effective:
        - IT.PRO-13.4.PE-1: Phishing-resistant MFA is deployed for some but not all systems within scope.
        - IT.PRO-13.4.PE-2: Access policies exist but do not cover all organisationally defined high-risk location categories.
        - IT.PRO-13.4.PE-3: Exceptions or alternative authentication pathways allow routine or recurring authentication without phishing-resistant MFA, or emergency access arrangements are not adequately restricted, monitored, tested or reviewed.

        Fully effective:
        - IT.PRO-13.4.FE-1: Phishing-resistant MFA is enforced for all routine interactive user authentication to systems within scope.
        - IT.PRO-13.4.FE-2: Phishing-resistant MFA is enforced for routine authentication attempts from untrusted, external or high-risk locations.
        - IT.PRO-13.4.FE-3: Customer-facing services provide a phishing-resistant MFA option for authentication.
        - IT.PRO-13.4.FE-4: Emergency access arrangements are periodically tested and reviewed to confirm that they remain operational, appropriately protected and limited to their intended purpose. Credentials or authentication factors used for emergency access are securely managed and are not used for routine administration.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13:it.pro-13.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13
      ref_id: IT.PRO-13.5
      description: Disable legacy authentication protocols or, where this is not feasible, restrict and
        monitor their use, apply compensating controls and establish a time-bound decommissioning plan.
      annotation: |-
        Not effective:
        - IT.PRO-13.5.NE-1: Legacy authentication protocols that cannot enforce modern authentication controls remain enabled and in active use without restriction.
        - IT.PRO-13.5.NE-2: No assessment has been conducted to identify which legacy authentication protocols are in use within the environment.
        - IT.PRO-13.5.NE-3: Authentication mechanisms transmitting credentials in cleartext or using weak cryptographic primitives remain enabled and no action has been taken to disable them.
        - IT.PRO-13.5.NE-4: Where legacy protocols are retained, no compensating controls, no monitoring and no decommissioning timelines are in place.

        Partially effective:
        - IT.PRO-13.5.PE-1: Legacy authentication protocols have been identified and are partially restricted but some remain enabled across systems within scope without justification.
        - IT.PRO-13.5.PE-2: An assessment has been conducted but does not cover all in-scope systems, or the inventory of legacy protocols in use is not maintained.
        - IT.PRO-13.5.PE-3: Some weak authentication mechanisms have been disabled but others remain enabled without documented justification or remediation plan.
        - IT.PRO-13.5.PE-4: Compensating controls exist for some retained legacy protocols but monitoring is inconsistent or decommissioning timelines are not defined.

        Fully effective:
        - IT.PRO-13.5.FE-1: Legacy authentication protocols that cannot enforce modern authentication controls have been identified and disabled across systems within scope, excluding documented and risk accepted exceptions.
        - IT.PRO-13.5.FE-2: An assessment of legacy authentication protocol use has been conducted across in-scope systems and the inventory is maintained.
        - IT.PRO-13.5.FE-3: Where retention is necessary, compensating controls are applied and decommissioning timelines are recorded and tracked.
        - IT.PRO-13.5.FE-4: Ongoing use of legacy authentication protocols is regularly risk reviewed, accepted and recorded in the organisation’s risk register.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13:it.pro-13.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-13
      ref_id: IT.PRO-13.6
      description: Ensure that user, machine, system and service account credentials are unique per system
        or account, particularly in high-privilege contexts.
      annotation: |-
        Not effective:
        - IT.PRO-13.6.NE-1: Local administrator credentials are shared across the device fleet, or service or privileged account credentials are routinely reused across systems.
        - IT.PRO-13.6.NE-2: Credential uniqueness is not enforced for applicable user, machine, system or service identities.
        - IT.PRO-13.6.NE-3: Credential uniqueness has not been addressed in high-privilege contexts, including domain administration, cloud administration or automation platforms.
        - IT.PRO-13.6.NE-4: Where credential uniqueness cannot be enforced, neither compensating controls nor remediation paths are in place.

        Partially effective:
        - IT.PRO-13.6.PE-1: Local administrator credential uniqueness has been implemented for some device populations but coverage is incomplete across the device fleet.
        - IT.PRO-13.6.PE-2: A technical mechanism is in place but applies to only a subset of credential types or systems within scope.
        - IT.PRO-13.6.PE-3: Credential uniqueness has been addressed in some high-privilege contexts but gaps remain in others.
        - IT.PRO-13.6.PE-4: Compensating controls exist for some shared credentials but monitoring is inconsistent or remediation plans do not exist.

        Fully effective:
        - IT.PRO-13.6.FE-1: Credentials for applicable local administrative accounts are unique to each system or account.
        - IT.PRO-13.6.FE-2: Credential uniqueness is consistently enforced for applicable user, machine, system and service identities.
        - IT.PRO-13.6.FE-3: Credential uniqueness is enforced consistently in high-privilege contexts, with managed identities or equivalent capabilities used in preference to shared static credentials wherever feasible.
        - IT.PRO-13.6.FE-4: Where uniqueness cannot be enforced, compensating controls are applied, the use of the shared credentials is monitored, and a remediation plan exists.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-12
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-12
      name: Least privilege access
      description: Users are granted the minimum access to systems (infrastructure, operating systems,
        applications and data) required to undertake their duties or functions.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-12:it.pro-12.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-12
      ref_id: IT.PRO-12.1
      description: Periodically review and update access privileges in alignment with current roles, duties
        and business requirements.
      annotation: |-
        Not effective:
        - IT.PRO-12.1.NE-1: Access privileges are not reviewed against current roles, duties and business requirements.
        - IT.PRO-12.1.NE-2: Access reviews do not identify privileges that are no longer required.
        - IT.PRO-12.1.NE-3: Access privileges are not updated when personnel roles, duties or business requirements change.
        - IT.PRO-12.1.NE-4: Access privileges are not mapped to roles, duties and business requirements.

        Partially effective:
        - IT.PRO-12.1.PE-1: Access reviews are conducted for some accounts or systems, but coverage is incomplete.
        - IT.PRO-12.1.PE-2: Reviews identify excessive or obsolete privileges, but updates are incomplete or not completed within timeframes defined by the organisation.
        - IT.PRO-12.1.PE-3: A process to review access privileges exists but only occurs on an ad hoc basis.
        - IT.PRO-12.1.PE-4: Some access privileges are mapped to roles, duties and business requirements, but not all.

        Fully effective:
        - IT.PRO-12.1.FE-1: Access privileges for all applicable accounts and systems are reviewed within a cycle defined by the organisation and aligned with current roles, duties and business requirements.
        - IT.PRO-12.1.FE-2: Privileges identified as excessive or obsolete are removed or updated within timeframes defined by the organisation.
        - IT.PRO-12.1.FE-3: Review outcomes and resulting access changes are documented and available as evidence.
        - IT.PRO-12.1.FE-4: Access privileges are mapped to current roles, duties and business requirements.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-04
      name: Secure configuration management
      description: Systems (infrastructure, operating systems and applications) are securely configured
        to approved and maintained baselines, including by reducing attack surfaces and attack paths,
        with configurations continually monitored and consistently enforced.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-04:it.pro-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-04
      ref_id: IT.PRO-04.1
      description: Define approved configuration baselines, informed by vendor and industry hardening
        guidance, that disable or remove unnecessary services, insecure settings, and unsupported or weak
        communication protocols.
      annotation: |-
        Not effective:
        - IT.PRO-04.1.NE-1: No documented configuration baseline exists for assets.
        - IT.PRO-04.1.NE-2: Systems are deployed with vendor defaults and no documented hardening has been applied.

        Partially effective:
        - IT.PRO-04.1.PE-1: A baseline exists but does not address all applicable asset types.
        - IT.PRO-04.1.PE-2: The baseline is documented but has not been reviewed or updated within the cycle defined by the organisation.
        - IT.PRO-04.1.PE-3: The baseline exists but rationale for configuration decisions is not documented.

        Fully effective:
        - IT.PRO-04.1.FE-1: A documented and approved baseline exists for all applicable asset types.
        - IT.PRO-04.1.FE-2: The baseline disables or removes unnecessary services, insecure settings, and unsupported or weak communication protocols.
        - IT.PRO-04.1.FE-3: Configuration decisions are documented with rationale to support drift assessment.
        - IT.PRO-04.1.FE-4: The baseline is reviewed and updated on a cycle defined by the organisation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-04:it.pro-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-04
      ref_id: IT.PRO-04.2
      description: Deploy approved configuration baselines on systems, including infrastructure, operating
        systems and applications.
      annotation: |-
        Not effective:
        - IT.PRO-04.2.NE-1: Approved baselines have not been applied to assets.
        - IT.PRO-04.2.NE-2: Baseline deployment has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-04.2.PE-1: Approved baselines have been implemented where available, but some relevant asset types are not covered by an approved baseline.
        - IT.PRO-04.2.PE-2: Deployment has occurred but validation through technical assessment is incomplete or not current.
        - IT.PRO-04.2.PE-3: Approved baselines have been deployed, but coverage for all applicable assets is inconsistent.

        Fully effective:
        - IT.PRO-04.2.FE-1: Approved baselines have been applied to all applicable assets.
        - IT.PRO-04.2.FE-2: Deployment has been validated through technical assessment.
        - IT.PRO-04.2.FE-3: Coverage metrics are available demonstrating deployment completeness.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-04:it.pro-04.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-04
      ref_id: IT.PRO-04.3
      description: Detect and respond to configuration drift using scheduled technical assessments and,
        where supported, automated monitoring, based on system criticality and change rate.
      annotation: |-
        Not effective:
        - IT.PRO-04.3.NE-1: No mechanism exists to detect configuration drift from approved baselines.
        - IT.PRO-04.3.NE-2: Assessments to detect configuration drift have not been conducted within the review period defined by the organisation.
        - IT.PRO-04.3.NE-3: Assessments do not systematically identify instances of configuration drift for assets.

        Partially effective:
        - IT.PRO-04.3.PE-1: Drift detection is in place but does not cover all applicable assets.
        - IT.PRO-04.3.PE-2: Drift is detected but the remediation process is informal or response timeframes are not defined.

        Fully effective:
        - IT.PRO-04.3.FE-1: Automated configuration monitoring or regular technical assessments detect drift across the applicable assets, occurring at a frequency based on system criticality and change rate.
        - IT.PRO-04.3.FE-2: A documented remediation process exists with defined response timeframes aligned to severity.
        - IT.PRO-04.3.FE-3: Drift events are tracked to closure with evidence of remediation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-06
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-06
      name: Vulnerability management
      description: Vulnerabilities in systems (infrastructure, operating systems, applications and data)
        are identified, documented, validated and prioritised for remediation or mitigation in a timely
        manner, with all remediation and mitigation actions verified for effectiveness.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-06:it.pro-06.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-06
      ref_id: IT.PRO-06.1
      description: Identify known software and configuration weaknesses of assets through continuous and
        repeatable assessment activities, including vulnerability scanning activities.
      annotation: |-
        Not effective:
        - IT.PRO-06.1.NE-1: Vulnerability scanning activities are not undertaken.
        - IT.PRO-06.1.NE-2: No routine vulnerability assessment activity has been conducted within a period defined by the organisation.
        - IT.PRO-06.1.NE-3: Advisories for relevant software and configuration weaknesses for organisational assets are not reviewed and assessed for impact.

        Partially effective:
        - IT.PRO-06.1.PE-1: Vulnerability scanning is deployed but does not cover all applicable assets.
        - IT.PRO-06.1.PE-2: Vulnerability scans are conducted but results are not reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.PE-3: Vulnerability scans are conducted but frequency is not regular enough to enable timely response.
        - IT.PRO-06.1.PE-4: Scanning covers software vulnerabilities but not configuration weaknesses.
        - IT.PRO-06.1.PE-5: Advisories for relevant software and configuration weaknesses for organisational assets are reviewed on an ad hoc basis, or only for some assets.

        Fully effective:
        - IT.PRO-06.1.FE-1: All applicable assets are included in routine vulnerability scanning, and scanning frequency enables timely response.
        - IT.PRO-06.1.FE-2: Scanning covers both software vulnerabilities and configuration weaknesses.
        - IT.PRO-06.1.FE-3: Results are reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.FE-4: Advisories for relevant software and configuration weaknesses in all organisational assets are regularly reviewed and assessed for impact.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-06:it.pro-06.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-06
      ref_id: IT.PRO-06.2
      description: Apply security patches or updates within defined risk-based timeframes or automatically
        where operational impact is low.
      annotation: |-
        Not effective:
        - IT.PRO-06.2.NE-1: No defined patching timeframes exist for applicable assets.
        - IT.PRO-06.2.NE-2: Patches are not applied or are applied on an ad hoc basis with no tracking.

        Partially effective:
        - IT.PRO-06.2.PE-1: Expected patching timeframes are defined by the organisation but are not consistently met.
        - IT.PRO-06.2.PE-2: Patches are applied but compensating controls are not documented where operational constraints prevent timely patching.
        - IT.PRO-06.2.PE-3: Patching coverage metrics exist but show significant gaps.

        Fully effective:
        - IT.PRO-06.2.FE-1: Risk-based patching timeframes defined by the organisation are in place and consistently met.
        - IT.PRO-06.2.FE-2: Patching is prioritised based on vulnerability severity, exposure and exploit availability.
        - IT.PRO-06.2.FE-3: Where operational constraints prevent timely patching, compensating controls are documented and approved.
        - IT.PRO-06.2.FE-4: Patching coverage metrics account for all applicable assets, with any exclusions identified and formally risk accepted.
        - IT.PRO-06.2.FE-5: Automatic patching of assets is applied where available and the organisation has determined operational impact is low.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-06:it.pro-06.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-06
      ref_id: IT.PRO-06.3
      description: Remediate or mitigate vulnerabilities exceeding defined risk thresholds within defined
        timeframes based on exploitation, exposure, criticality, impact and compensating controls, and
        verify treatment effectiveness.
      annotation: |-
        Not effective:
        - IT.PRO-06.3.NE-1: No risk thresholds are defined for vulnerability remediation.
        - IT.PRO-06.3.NE-2: Vulnerabilities exceeding acceptable risk levels are not tracked or remediated.

        Partially effective:
        - IT.PRO-06.3.PE-1: Risk thresholds are defined but vulnerabilities exceeding them are not consistently remediated within defined timeframes.
        - IT.PRO-06.3.PE-2: Compensating controls are applied in some cases but are not formally documented or approved.

        Fully effective:
        - IT.PRO-06.3.FE-1: Risk thresholds defined by the organisation exist, and vulnerabilities exceeding them are remediated or have approved compensating controls within organisationally defined timeframes.
        - IT.PRO-06.3.FE-2: Remediation and mitigation actions are tracked to closure with verification that actions reduced the risk as intended.
        - IT.PRO-06.3.FE-3: The process is sustained, with historical data demonstrating consistent performance across organisationally defined reporting periods.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-07
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-07
      name: Trustworthy software
      description: Systems (operating systems and applications) only permit the execution of software
        that is supported, verified and authorised.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-07:it.pro-07.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-07
      ref_id: IT.PRO-07.1
      description: Permit only supported, verified and organisation-authorised software to execute on
        systems, with exceptions minimised, formally risk accepted, time-bound, monitored and regularly
        reviewed.
      annotation: |-
        Not effective:
        - IT.PRO-07.1.NE-1: Unsupported, unverified or unauthorised software can execute without restriction.
        - IT.PRO-07.1.NE-2: The list of approved software does not exist.

        Partially effective:
        - IT.PRO-07.1.PE-1: Execution restriction controls are deployed but do not cover all applicable assets.
        - IT.PRO-07.1.PE-2: The organisation maintains a list of approved software, but it has not been reviewed within timeframes defined by the organisation.
        - IT.PRO-07.1.PE-3: Execution restrictions are in place but integrity verification of approved software is not performed.
        - IT.PRO-07.1.PE-4: Exceptions to execution restrictions are granted without formal approval or time-bounding.

        Fully effective:
        - IT.PRO-07.1.FE-1: Controls restrict execution to supported, organisation-authorised and integrity-verified software on all applicable assets.
        - IT.PRO-07.1.FE-2: The organisation maintains a list of approved software and reviews it within the timeframes defined by the organisation.
        - IT.PRO-07.1.FE-3: Integrity of permitted software is verified using trusted mechanisms appropriate to the software and its source.
        - IT.PRO-07.1.FE-4: Exceptions are formally approved, documented, time-bound and reviewed on a regular cycle defined by the organisation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-07:it.pro-07.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-07
      ref_id: IT.PRO-07.2
      description: Restrict administrative and management tooling to approved software sets and executed
        from only authorised, known locations.
      annotation: |-
        Not effective:
        - IT.PRO-07.2.NE-1: No approved administrative toolset is defined.
        - IT.PRO-07.2.NE-2: No restrictions are placed on the location administrative tooling can be executed from.
        - IT.PRO-07.2.NE-3: No controls prevent unapproved administrative tools, including tools commonly used in post-compromise activity, from executing on managed assets.

        Partially effective:
        - IT.PRO-07.2.PE-1: An approved toolset is defined but not consistently enforced across all assets.
        - IT.PRO-07.2.PE-2: Administrative tooling is configured to execute from known locations, but privileged users can still run tooling from unapproved locations.
        - IT.PRO-07.2.PE-3: Some unapproved administrative tools are blocked but enforcement gaps exist.

        Fully effective:
        - IT.PRO-07.2.FE-1: A defined and enforced approved toolset exists for administrative and management activities, and execution is limited to authorised, known locations.
        - IT.PRO-07.2.FE-2: Administrative and management tooling outside the approved set is blocked from execution, including from unauthorised locations.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-10
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-10
      name: Regular and proven backups
      description: Systems (infrastructure, operating systems, applications and data) are regularly backed
        up in a secure and proven manner, including through the validation of restoration capabilities.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-10:it.pro-10.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-10
      ref_id: IT.PRO-10.1
      description: Back up important data, applications and settings on a defined schedule to secure,
        resilient storage protected by encryption and immutable, offline, logically isolated or equivalent
        controls.
      annotation: |-
        Not effective:
        - IT.PRO-10.1.NE-1: No managed backup process exists for important data, applications and settings.
        - IT.PRO-10.1.NE-2: Backup storage is neither encrypted nor protected by immutable, offline, logically isolated or equivalent controls.

        Partially effective:
        - IT.PRO-10.1.PE-1: Important data, applications and settings are backed up, but backup schedules are not defined, do not cover all important assets, or are not consistently met.
        - IT.PRO-10.1.PE-2: Backups are encrypted but no immutable, offline, logically isolated or equivalent resilience controls are consistently applied.
        - IT.PRO-10.1.PE-3: Backups use immutable, offline, logically isolated or equivalent controls, but encryption is not consistently enforced.

        Fully effective:
        - IT.PRO-10.1.FE-1: All important data, applications and settings are backed up according to schedules defined by the organisation and aligned with their recovery requirements.
        - IT.PRO-10.1.FE-2: Backup schedules are monitored, and missed or unsuccessful backups are identified, investigated and remediated within timeframes defined by the organisation.
        - IT.PRO-10.1.FE-3: Backup storage is encrypted and protected by immutable, offline, logically isolated or equivalent controls.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-10:it.pro-10.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-10
      ref_id: IT.PRO-10.2
      description: Isolate backup repositories from general user environments and production workloads,
        ensuring they are separated from primary systems to prevent unauthorised access, modification
        or deletion.
      annotation: |-
        Not effective:
        - IT.PRO-10.2.NE-1: Backup repositories are accessible from the production environment or by production administrators.
        - IT.PRO-10.2.NE-2: Compromise of a system would provide a direct path to access, modify or delete its own backups.

        Partially effective:
        - IT.PRO-10.2.PE-1: Backup repositories are logically separated but use credentials managed by the same identity platform as production.
        - IT.PRO-10.2.PE-2: Isolation is implemented but has not been tested or validated.

        Fully effective:
        - IT.PRO-10.2.FE-1: Backup repositories are isolated from production environments and general user access.
        - IT.PRO-10.2.FE-2: Access is controlled through credentials and administrative paths isolated from compromise of the primary identity environment.
        - IT.PRO-10.2.FE-3: Isolation has been validated to confirm that compromise of a system does not provide access to backups.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-10:it.pro-10.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-10
      ref_id: IT.PRO-10.3
      description: Conduct regular testing of backup and restoration procedures to ensure that backups
        are reliable and capable of meeting defined recovery time objectives and recovery point objectives.
      annotation: |-
        Not effective:
        - IT.PRO-10.3.NE-1: No restoration test has been conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.NE-2: No backup or restoration procedures exist.
        - IT.PRO-10.3.NE-3: Restoration testing demonstrates that backups cannot be restored, or consistently fail to meet defined recovery time or recovery point objectives.

        Partially effective:
        - IT.PRO-10.3.PE-1: Restoration testing has been conducted but does not cover all important assets.
        - IT.PRO-10.3.PE-2: Backup procedures exist but have never been tested.
        - IT.PRO-10.3.PE-3: Testing has been conducted but coverage is incomplete or some tests did not meet the expected recovery time or recovery point objectives.

        Fully effective:
        - IT.PRO-10.3.FE-1: Restoration testing covering important assets is conducted within the test cycle defined by the organisation.
        - IT.PRO-10.3.FE-2: Testing validates that restoration meets the expected recovery time and recovery point objectives.
        - IT.PRO-10.3.FE-3: Test results are documented and gaps identified during testing are remediated.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-18
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-18
      name: Network segmentation and segregation
      description: Systems (infrastructure, operating systems and applications) are segmented into network
        zones based on business criticality and trust levels, with only authorised, controlled and monitored
        inbound and outbound communication paths between network zones permitted.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-18:it.pro-18.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-18
      ref_id: IT.PRO-18.1
      description: Isolate systems within network zones based on business criticality and trust level,
        and restrict and monitor inbound and outbound access to explicitly approved pathways and services.
      annotation: |-
        Not effective:
        - IT.PRO-18.1.NE-1: Systems are deployed on shared or flat network segments with no segregation between functions or trust levels.
        - IT.PRO-18.1.NE-2: No access controls restrict network access from external or general user networks to in-scope systems.
        - IT.PRO-18.1.NE-3: Segmentation is documented or administratively defined but not enforced by technical controls.
        - IT.PRO-18.1.NE-4: Segmentation has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-18.1.PE-1: Network segmentation has been implemented but does not cover all in-scope systems, or segments are defined inconsistently.
        - IT.PRO-18.1.PE-2: Access controls exist between segments, but deny-by-default is not enforced, or some pathways are permitted without documented approval.
        - IT.PRO-18.1.PE-3: Technical enforcement is in place for some segments but relies on a single mechanism that does not provide meaningful isolation.
        - IT.PRO-18.1.PE-4: Validation has been performed for some segments but not consistently across in-scope systems, or validation is out of date.
        - IT.PRO-18.1.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.1.FE-1: Systems within scope are deployed in network segments defined according to function, criticality and trust level, with segmentation applied consistently.
        - IT.PRO-18.1.FE-2: Deny-by-default access controls are enforced between segments, with access from external and general user networks limited to documented and approved pathways.
        - IT.PRO-18.1.FE-3: Segmentation is enforced through network-layer technical controls that provide meaningful isolation.
        - IT.PRO-18.1.FE-4: Segmentation has been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.1.FE-5: Approved pathways are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and changes reflected in the access control configuration.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-18:it.pro-18.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-18
      ref_id: IT.PRO-18.2
      description: Limit lateral movement between, and within, network segments to explicitly approved
        pathways and services, based on business requirements and trust levels.
      annotation: |-
        Not effective:
        - IT.PRO-18.2.NE-1: No controls limit lateral movement between or within network segments.
        - IT.PRO-18.2.NE-2: Lateral movement is permitted by default across the environment, with restrictions applied only on an exception basis.
        - IT.PRO-18.2.NE-3: Approved pathways are not documented.
        - IT.PRO-18.2.NE-4: Lateral movement controls have not been validated through technical assessment.
        - IT.PRO-18.2.NE-5: Pathways and services are not reviewed after initial approval.

        Partially effective:
        - IT.PRO-18.2.PE-1: Controls limit lateral movement between segments but no controls operate within segments.
        - IT.PRO-18.2.PE-2: Restrictions are applied to some pathways, but the default position remains permissive in parts of the environment.
        - IT.PRO-18.2.PE-3: Approved pathways are documented but documentation is out of date or incomplete.
        - IT.PRO-18.2.PE-4: Validation has been performed but does not cover all in-scope segments, or is out of date.
        - IT.PRO-18.2.PE-5: Pathways are reviewed, but findings are not actioned, or the review cycle is not defined by the organisation.

        Fully effective:
        - IT.PRO-18.2.FE-1: Controls limit lateral movement both between and within segments, with deny-by-default applied at each boundary.
        - IT.PRO-18.2.FE-2: Pathways and services are explicitly approved based on documented business requirements and trust levels, with all other lateral movement denied.
        - IT.PRO-18.2.FE-3: Approved pathways are documented, reflect the current configuration and identify the business requirement and trust relationship justifying each.
        - IT.PRO-18.2.FE-4: Lateral movement controls have been validated through technical assessment with results documented and gaps remediated.
        - IT.PRO-18.2.FE-5: Pathways and services are reviewed on a regular cycle defined by the organisation, with unjustified pathways removed and the configuration updated to reflect approved changes.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-09
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: PRO-09
      name: Content filtering
      description: Data communicated between different security domains for systems (infrastructure and
        applications) is controlled and subject to inspection and verification.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-09:it.pro-09.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:pro-09
      ref_id: IT.PRO-09.1
      description: Inspect outbound content flows to detect unauthorised transfer of sensitive or high-value
        data.
      annotation: |-
        Not effective:
        - IT.PRO-09.1.NE-1: No outbound content inspection is deployed.
        - IT.PRO-09.1.NE-2: Sensitive data can leave the organisation through any egress path without detection or control.

        Partially effective:
        - IT.PRO-09.1.PE-1: Outbound inspection is deployed but does not cover all applicable egress paths.
        - IT.PRO-09.1.PE-2: Rules are configured but do not cover all classified, regulated or high-value data types.
        - IT.PRO-09.1.PE-3: Alerts are generated but are not triaged or acted upon in a timely manner.

        Fully effective:
        - IT.PRO-09.1.FE-1: Outbound content inspection is deployed covering all applicable egress paths.
        - IT.PRO-09.1.FE-2: Rules are configured to detect unauthorised transfer of classified, regulated and high-value data.
        - IT.PRO-09.1.FE-3: Alerts are triaged and responded to within accepted risk timeframes defined by the organisation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: DET-01
      name: Centralised event logging
      description: Security-relevant event logs and configuration changes for systems (infrastructure,
        operating systems, applications and data) are centrally collected, protected against unauthorised
        modification or deletion, and retained to support effective cyber security event detection and
        investigation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-01:it.det-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-01
      ref_id: IT.DET-01.1
      description: Protect event logs from unauthorised access, modification or deletion, including by
        encrypting them during transit and at rest and securing the systems and accounts used to store,
        manage and analyse them.
      annotation: |-
        Not effective:
        - IT.DET-01.1.NE-1: Logs generated by applicable assets are not protected from modification or deletion.
        - IT.DET-01.1.NE-2: Log access is not restricted to authorised roles with a business need.
        - IT.DET-01.1.NE-3: Logs are neither encrypted during transit nor at rest.

        Partially effective:
        - IT.DET-01.1.PE-1: Logs are forwarded but integrity protections are not in place at the source.
        - IT.DET-01.1.PE-2: Log access is restricted but some roles retain the ability to modify or delete logs.
        - IT.DET-01.1.PE-3: Logs are encrypted during transit but are not protected with encryption at rest (or vice versa).

        Fully effective:
        - IT.DET-01.1.FE-1: Logs are protected against modification or deletion.
        - IT.DET-01.1.FE-2: Logs are encrypted in transit and at rest.
        - IT.DET-01.1.FE-3: Access to logs is restricted to authorised roles with a business need.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-01:it.det-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-01
      ref_id: IT.DET-01.2
      description: Forward high-value, security-relevant event logs and configuration changes from infrastructure,
        operating systems and applications to a central log storage capability.
      annotation: |-
        Not effective:
        - IT.DET-01.2.NE-1: Security-relevant logs from assets are not forwarded to a central logging capability.
        - IT.DET-01.2.NE-2: High-value, security-relevant event logs or configuration changes from infrastructure, operating systems or applications are not forwarded.

        Partially effective:
        - IT.DET-01.2.PE-1: High-value, security-relevant event logs are forwarded, but coverage gaps are identified or completeness has not been validated.
        - IT.DET-01.2.PE-2: Configuration change logs are forwarded inconsistently.
        - IT.DET-01.2.PE-3: The utility of security log sources is reviewed, but on an ad hoc basis rather than according to a defined schedule.
        - IT.DET-01.2.PE-4: Log forwarding is in place but latency is excessive for effective detection.

        Fully effective:
        - IT.DET-01.2.FE-1: High-value security-relevant event logs and configuration changes from all relevant infrastructure, operating systems and application sources are forwarded to the central logging capability.
        - IT.DET-01.2.FE-2: Security log sources are reviewed at regular intervals to ensure their continued utility in detecting and responding to changing adversary techniques.
        - IT.DET-01.2.FE-3: Log completeness has been validated against the expected log sources.
        - IT.DET-01.2.FE-4: Logs are forwarded at a frequency that enables timely detection.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-02
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems
      ref_id: DET-02
      name: Cyber security event detection
      description: Anomalous or unexpected events and behaviours for systems (infrastructure, operating
        systems, applications and data) are analysed in a timely manner to detect cyber security events.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-02:it.det-02.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:business-systems:det-02
      ref_id: IT.DET-02.1
      description: Ensure event logs are normalised, time-synchronised and enriched to support correlation
        across systems and environments.
      annotation: |-
        Not effective:
        - IT.DET-02.1.NE-1: Logs are not time-synchronised to an authoritative source.
        - IT.DET-02.1.NE-2: Logs are ingested in raw format and are neither normalised nor enriched.

        Partially effective:
        - IT.DET-02.1.PE-1: Logs are time-synchronised but are not normalised to a common schema.
        - IT.DET-02.1.PE-2: Some enrichment is applied but critical contextual data such as asset classification or account type is missing.

        Fully effective:
        - IT.DET-02.1.FE-1: Logs are time-synchronised to the authoritative time source.
        - IT.DET-02.1.FE-2: Logs are normalised into the common log schema and enriched with contextual metadata.
        - IT.DET-02.1.FE-3: Enriched logs support correlation across relevant systems, environments and data sources in the central logging platform.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      assessable: false
      depth: 1
      name: User devices
      description: Endpoints issued to the workforce, including desktops and laptops.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:ide-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: IDE-01
      name: Asset identification
      description: Systems (infrastructure, operating systems, applications, identities, credentials and
        data) are continually and centrally identified and documented.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:ide-01:it.ide-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:ide-01
      ref_id: IT.IDE-01.2
      description: Maintain current records of infrastructure, operating systems, applications, identities,
        credentials and data assets.
      annotation: |-
        Not effective:
        - IT.IDE-01.2.NE-1: A maintained record of infrastructure, operating systems, applications, identities, credentials and data assets has not been established.
        - IT.IDE-01.2.NE-2: There is no defined process for identifying, recording, reviewing and updating asset records.

        Partially effective:
        - IT.IDE-01.2.PE-1: Asset records are maintained, but identified omissions, inaccuracies or newly discovered assets are not triaged and addressed within the timeframes or tolerances defined by the organisation.
        - IT.IDE-01.2.PE-2: A process to update the asset inventory runs on a schedule but the results are not reconciled or updated within a period defined by the organisation.

        Fully effective:
        - IT.IDE-01.2.FE-1: At each scheduled review or update, records of infrastructure, operating systems, applications, identities, credentials and data assets are complete and accurate within the tolerances defined by the organisation.
        - IT.IDE-01.2.FE-2: A defined process identifies changes and newly discovered assets between scheduled reviews, and ensures that records are reviewed, reconciled and updated within timeframes commensurate with the associated cyber security risk.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: PRO-01
      name: Secure system lifecycle
      description: Systems (infrastructure, operating systems and applications) are planned, designed,
        developed, tested, deployed, maintained and decommissioned according to their business criticality
        ratings and security and resilience requirements using Secure by Design and Secure by Default
        principles and practices.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-01:it.pro-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-01
      ref_id: IT.PRO-01.1
      description: Design systems securely to provide visibility, enforce authorised access, protect data,
        minimise required and default privileges, limit exposed services and remove unnecessary functionality.
      annotation: |-
        Not effective:
        - IT.PRO-01.1.NE-1: Systems are deployed with default configurations and no evidence of security design considerations.
        - IT.PRO-01.1.NE-2: Unnecessary services, protocols or functionality remain enabled with no documented rationale.
        - IT.PRO-01.1.NE-3: Security telemetry is not enabled or is not considered as part of system design.

        Partially effective:
        - IT.PRO-01.1.PE-1: Security is considered during system design but not consistently applied across all assets.
        - IT.PRO-01.1.PE-2: Some unnecessary services have been disabled but a systematic review has not been completed.
        - IT.PRO-01.1.PE-3: Security telemetry is partially enabled but gaps in coverage exist.

        Fully effective:
        - IT.PRO-01.1.FE-1: Systems are designed and deployed with exposed services limited, required and default permissions minimised, data protections in place, authorised access enforced, and only required functionality enabled.
        - IT.PRO-01.1.FE-2: Security telemetry is enabled by default.
        - IT.PRO-01.1.FE-3: Evidence exists that security design decisions are recorded and reviewed during system changes.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-01:it.pro-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-01
      ref_id: IT.PRO-01.2
      description: Secure build and deployment processes to enforce controls consistently across systems.
      annotation: |-
        Not effective:
        - IT.PRO-01.2.NE-1: No controlled build or deployment process exists for applicable assets.
        - IT.PRO-01.2.NE-2: Changes to systems are applied ad hoc, without any version control, testing or approval.

        Partially effective:
        - IT.PRO-01.2.PE-1: A controlled deployment process exists but is not consistently followed for all changes.
        - IT.PRO-01.2.PE-2: Version control is in place but pre-deployment security verification is not performed.

        Fully effective:
        - IT.PRO-01.2.FE-1: A controlled build and deployment process is in place and consistently followed.
        - IT.PRO-01.2.FE-2: Configuration changes are subject to version control, testing and approval before deployment.
        - IT.PRO-01.2.FE-3: Security controls are confirmed to be implemented consistently across systems following deployment processes.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-16
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: PRO-16
      name: Cyber supply chain security
      description: Cyber supply chains supporting systems (infrastructure, operating systems, applications
        and data) are secure, resilient and support effective and coordinated cyber security incident
        response.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-16:it.pro-16.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-16
      ref_id: IT.PRO-16.1
      description: Assess the integrity and authenticity of software, components and updates before use,
        and verify provenance where suitable supplier evidence is available.
      annotation: |-
        Not effective:
        - IT.PRO-16.1.NE-1: No verification of software, component or update integrity or authenticity is performed before introduction into systems.
        - IT.PRO-16.1.NE-2: Verification outcomes are not recorded or available for review.
        - IT.PRO-16.1.NE-3: Where verification cannot be performed, no compensating control or remediation paths are documented.

        Partially effective:
        - IT.PRO-16.1.PE-1: Verification is performed for some categories of software but not consistently across operating systems, applications, firmware and dependencies.
        - IT.PRO-16.1.PE-2: Integrity or provenance checks are performed, but they do not provide sufficient assurance for all software, components or updates.
        - IT.PRO-16.1.PE-3: Verification outcomes are recorded for some software, components or updates prior to being introduced into systems, but not consistently.
        - IT.PRO-16.1.PE-4: Compensating controls exist for some unverifiable components but are not formally approved or time-bound.

        Fully effective:
        - IT.PRO-16.1.FE-1: Verification of integrity and provenance is performed for software, components and updates across all relevant categories, and provenance is verified where suitable supplier evidence is available.
        - IT.PRO-16.1.FE-2: Verification uses one or more mechanisms appropriate to the software, component, update and source to provide reliable assurance of integrity and provenance.
        - IT.PRO-16.1.FE-3: Verification outcomes are recorded and available for review.
        - IT.PRO-16.1.FE-4: Where verification cannot be performed, compensating controls are applied, exceptions are time-bound and remediation paths are documented.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: PRO-13
      name: Identity, credential and access management
      description: Robust and secure identity, credential and access management is used to establish,
        maintain and control access to systems (infrastructure, operating systems, applications and data)
        and to support effective detection of identity and credential misuse.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13:it.pro-13.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13
      ref_id: IT.PRO-13.1
      description: Identify and disable or remove default and unused accounts regularly, permitting exceptions
        only where the account is documented, justified, hardened and monitored.
      annotation: |-
        Not effective:
        - IT.PRO-13.1.NE-1: No review of default or unused accounts has been conducted within the review period defined by the organisation.
        - IT.PRO-13.1.NE-2: Default vendor accounts remain enabled on production systems without appropriate documentation, justification, hardening and monitoring in place for their use.
        - IT.PRO-13.1.NE-3: No process exists to identify accounts that have not authenticated within a defined period.

        Partially effective:
        - IT.PRO-13.1.PE-1: A review has been conducted but does not cover all assets.
        - IT.PRO-13.1.PE-2: Default accounts have been identified but some remain enabled without documented justification.
        - IT.PRO-13.1.PE-3: Unused accounts are identified but remediation is incomplete or delayed beyond defined timeframes.

        Fully effective:
        - IT.PRO-13.1.FE-1: A review of accounts has been completed within the defined review period covering all assets.
        - IT.PRO-13.1.FE-2: Default accounts are disabled or have approved justification for remaining active, with appropriate monitoring and compensating controls for their use in place.
        - IT.PRO-13.1.FE-3: Accounts that show no evidence of use, other than approved emergency access accounts, are identified and either disabled or removed in accordance with defined timeframes.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13:it.pro-13.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13
      ref_id: IT.PRO-13.4
      description: Use phishing-resistant MFA for users authenticating to systems, including from untrusted,
        external or high-risk locations.
      annotation: |-
        Not effective:
        - IT.PRO-13.4.NE-1: Phishing-resistant MFA is not enforced for interactive user authentication to systems.
        - IT.PRO-13.4.NE-2: MFA is deployed but uses non-phishing-resistant methods, such as SMS, voice, or push-only authentication instead of phishing-resistant MFA.
        - IT.PRO-13.4.NE-3: No access policies differentiate between trusted and untrusted, external or high-risk locations.
        - IT.PRO-13.4.NE-4: Access from untrusted, external or high-risk locations is permitted without MFA, or with non-phishing-resistant MFA.

        Partially effective:
        - IT.PRO-13.4.PE-1: Phishing-resistant MFA is deployed for some but not all systems within scope.
        - IT.PRO-13.4.PE-2: Access policies exist but do not cover all organisationally defined high-risk location categories.
        - IT.PRO-13.4.PE-3: Exceptions or alternative authentication pathways allow routine or recurring authentication without phishing-resistant MFA, or emergency access arrangements are not adequately restricted, monitored, tested or reviewed.

        Fully effective:
        - IT.PRO-13.4.FE-1: Phishing-resistant MFA is enforced for all routine interactive user authentication to systems within scope.
        - IT.PRO-13.4.FE-2: Phishing-resistant MFA is enforced for routine authentication attempts from untrusted, external or high-risk locations.
        - IT.PRO-13.4.FE-3: Customer-facing services provide a phishing-resistant MFA option for authentication.
        - IT.PRO-13.4.FE-4: Emergency access arrangements are periodically tested and reviewed to confirm that they remain operational, appropriately protected and limited to their intended purpose. Credentials or authentication factors used for emergency access are securely managed and are not used for routine administration.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13:it.pro-13.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13
      ref_id: IT.PRO-13.5
      description: Disable legacy authentication protocols or, where this is not feasible, restrict and
        monitor their use, apply compensating controls and establish a time-bound decommissioning plan.
      annotation: |-
        Not effective:
        - IT.PRO-13.5.NE-1: Legacy authentication protocols that cannot enforce modern authentication controls remain enabled and in active use without restriction.
        - IT.PRO-13.5.NE-2: No assessment has been conducted to identify which legacy authentication protocols are in use within the environment.
        - IT.PRO-13.5.NE-3: Authentication mechanisms transmitting credentials in cleartext or using weak cryptographic primitives remain enabled and no action has been taken to disable them.
        - IT.PRO-13.5.NE-4: Where legacy protocols are retained, no compensating controls, no monitoring and no decommissioning timelines are in place.

        Partially effective:
        - IT.PRO-13.5.PE-1: Legacy authentication protocols have been identified and are partially restricted but some remain enabled across systems within scope without justification.
        - IT.PRO-13.5.PE-2: An assessment has been conducted but does not cover all in-scope systems, or the inventory of legacy protocols in use is not maintained.
        - IT.PRO-13.5.PE-3: Some weak authentication mechanisms have been disabled but others remain enabled without documented justification or remediation plan.
        - IT.PRO-13.5.PE-4: Compensating controls exist for some retained legacy protocols but monitoring is inconsistent or decommissioning timelines are not defined.

        Fully effective:
        - IT.PRO-13.5.FE-1: Legacy authentication protocols that cannot enforce modern authentication controls have been identified and disabled across systems within scope, excluding documented and risk accepted exceptions.
        - IT.PRO-13.5.FE-2: An assessment of legacy authentication protocol use has been conducted across in-scope systems and the inventory is maintained.
        - IT.PRO-13.5.FE-3: Where retention is necessary, compensating controls are applied and decommissioning timelines are recorded and tracked.
        - IT.PRO-13.5.FE-4: Ongoing use of legacy authentication protocols is regularly risk reviewed, accepted and recorded in the organisation’s risk register.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13:it.pro-13.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-13
      ref_id: IT.PRO-13.6
      description: Ensure that user, machine, system and service account credentials are unique per system
        or account, particularly in high-privilege contexts.
      annotation: |-
        Not effective:
        - IT.PRO-13.6.NE-1: Local administrator credentials are shared across the device fleet, or service or privileged account credentials are routinely reused across systems.
        - IT.PRO-13.6.NE-2: Credential uniqueness is not enforced for applicable user, machine, system or service identities.
        - IT.PRO-13.6.NE-3: Credential uniqueness has not been addressed in high-privilege contexts, including domain administration, cloud administration or automation platforms.
        - IT.PRO-13.6.NE-4: Where credential uniqueness cannot be enforced, neither compensating controls nor remediation paths are in place.

        Partially effective:
        - IT.PRO-13.6.PE-1: Local administrator credential uniqueness has been implemented for some device populations but coverage is incomplete across the device fleet.
        - IT.PRO-13.6.PE-2: A technical mechanism is in place but applies to only a subset of credential types or systems within scope.
        - IT.PRO-13.6.PE-3: Credential uniqueness has been addressed in some high-privilege contexts but gaps remain in others.
        - IT.PRO-13.6.PE-4: Compensating controls exist for some shared credentials but monitoring is inconsistent or remediation plans do not exist.

        Fully effective:
        - IT.PRO-13.6.FE-1: Credentials for applicable local administrative accounts are unique to each system or account.
        - IT.PRO-13.6.FE-2: Credential uniqueness is consistently enforced for applicable user, machine, system and service identities.
        - IT.PRO-13.6.FE-3: Credential uniqueness is enforced consistently in high-privilege contexts, with managed identities or equivalent capabilities used in preference to shared static credentials wherever feasible.
        - IT.PRO-13.6.FE-4: Where uniqueness cannot be enforced, compensating controls are applied, the use of the shared credentials is monitored, and a remediation plan exists.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-12
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: PRO-12
      name: Least privilege access
      description: Users are granted the minimum access to systems (infrastructure, operating systems,
        applications and data) required to undertake their duties or functions.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-12:it.pro-12.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-12
      ref_id: IT.PRO-12.1
      description: Periodically review and update access privileges in alignment with current roles, duties
        and business requirements.
      annotation: |-
        Not effective:
        - IT.PRO-12.1.NE-1: Access privileges are not reviewed against current roles, duties and business requirements.
        - IT.PRO-12.1.NE-2: Access reviews do not identify privileges that are no longer required.
        - IT.PRO-12.1.NE-3: Access privileges are not updated when personnel roles, duties or business requirements change.
        - IT.PRO-12.1.NE-4: Access privileges are not mapped to roles, duties and business requirements.

        Partially effective:
        - IT.PRO-12.1.PE-1: Access reviews are conducted for some accounts or systems, but coverage is incomplete.
        - IT.PRO-12.1.PE-2: Reviews identify excessive or obsolete privileges, but updates are incomplete or not completed within timeframes defined by the organisation.
        - IT.PRO-12.1.PE-3: A process to review access privileges exists but only occurs on an ad hoc basis.
        - IT.PRO-12.1.PE-4: Some access privileges are mapped to roles, duties and business requirements, but not all.

        Fully effective:
        - IT.PRO-12.1.FE-1: Access privileges for all applicable accounts and systems are reviewed within a cycle defined by the organisation and aligned with current roles, duties and business requirements.
        - IT.PRO-12.1.FE-2: Privileges identified as excessive or obsolete are removed or updated within timeframes defined by the organisation.
        - IT.PRO-12.1.FE-3: Review outcomes and resulting access changes are documented and available as evidence.
        - IT.PRO-12.1.FE-4: Access privileges are mapped to current roles, duties and business requirements.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-04
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: PRO-04
      name: Secure configuration management
      description: Systems (infrastructure, operating systems and applications) are securely configured
        to approved and maintained baselines, including by reducing attack surfaces and attack paths,
        with configurations continually monitored and consistently enforced.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-04:it.pro-04.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-04
      ref_id: IT.PRO-04.1
      description: Define approved configuration baselines, informed by vendor and industry hardening
        guidance, that disable or remove unnecessary services, insecure settings, and unsupported or weak
        communication protocols.
      annotation: |-
        Not effective:
        - IT.PRO-04.1.NE-1: No documented configuration baseline exists for assets.
        - IT.PRO-04.1.NE-2: Systems are deployed with vendor defaults and no documented hardening has been applied.

        Partially effective:
        - IT.PRO-04.1.PE-1: A baseline exists but does not address all applicable asset types.
        - IT.PRO-04.1.PE-2: The baseline is documented but has not been reviewed or updated within the cycle defined by the organisation.
        - IT.PRO-04.1.PE-3: The baseline exists but rationale for configuration decisions is not documented.

        Fully effective:
        - IT.PRO-04.1.FE-1: A documented and approved baseline exists for all applicable asset types.
        - IT.PRO-04.1.FE-2: The baseline disables or removes unnecessary services, insecure settings, and unsupported or weak communication protocols.
        - IT.PRO-04.1.FE-3: Configuration decisions are documented with rationale to support drift assessment.
        - IT.PRO-04.1.FE-4: The baseline is reviewed and updated on a cycle defined by the organisation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-04:it.pro-04.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-04
      ref_id: IT.PRO-04.2
      description: Deploy approved configuration baselines on systems, including infrastructure, operating
        systems and applications.
      annotation: |-
        Not effective:
        - IT.PRO-04.2.NE-1: Approved baselines have not been applied to assets.
        - IT.PRO-04.2.NE-2: Baseline deployment has not been validated through technical assessment.

        Partially effective:
        - IT.PRO-04.2.PE-1: Approved baselines have been implemented where available, but some relevant asset types are not covered by an approved baseline.
        - IT.PRO-04.2.PE-2: Deployment has occurred but validation through technical assessment is incomplete or not current.
        - IT.PRO-04.2.PE-3: Approved baselines have been deployed, but coverage for all applicable assets is inconsistent.

        Fully effective:
        - IT.PRO-04.2.FE-1: Approved baselines have been applied to all applicable assets.
        - IT.PRO-04.2.FE-2: Deployment has been validated through technical assessment.
        - IT.PRO-04.2.FE-3: Coverage metrics are available demonstrating deployment completeness.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-04:it.pro-04.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-04
      ref_id: IT.PRO-04.3
      description: Detect and respond to configuration drift using scheduled technical assessments and,
        where supported, automated monitoring, based on system criticality and change rate.
      annotation: |-
        Not effective:
        - IT.PRO-04.3.NE-1: No mechanism exists to detect configuration drift from approved baselines.
        - IT.PRO-04.3.NE-2: Assessments to detect configuration drift have not been conducted within the review period defined by the organisation.
        - IT.PRO-04.3.NE-3: Assessments do not systematically identify instances of configuration drift for assets.

        Partially effective:
        - IT.PRO-04.3.PE-1: Drift detection is in place but does not cover all applicable assets.
        - IT.PRO-04.3.PE-2: Drift is detected but the remediation process is informal or response timeframes are not defined.

        Fully effective:
        - IT.PRO-04.3.FE-1: Automated configuration monitoring or regular technical assessments detect drift across the applicable assets, occurring at a frequency based on system criticality and change rate.
        - IT.PRO-04.3.FE-2: A documented remediation process exists with defined response timeframes aligned to severity.
        - IT.PRO-04.3.FE-3: Drift events are tracked to closure with evidence of remediation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-06
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: PRO-06
      name: Vulnerability management
      description: Vulnerabilities in systems (infrastructure, operating systems, applications and data)
        are identified, documented, validated and prioritised for remediation or mitigation in a timely
        manner, with all remediation and mitigation actions verified for effectiveness.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-06:it.pro-06.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-06
      ref_id: IT.PRO-06.1
      description: Identify known software and configuration weaknesses of assets through continuous and
        repeatable assessment activities, including vulnerability scanning activities.
      annotation: |-
        Not effective:
        - IT.PRO-06.1.NE-1: Vulnerability scanning activities are not undertaken.
        - IT.PRO-06.1.NE-2: No routine vulnerability assessment activity has been conducted within a period defined by the organisation.
        - IT.PRO-06.1.NE-3: Advisories for relevant software and configuration weaknesses for organisational assets are not reviewed and assessed for impact.

        Partially effective:
        - IT.PRO-06.1.PE-1: Vulnerability scanning is deployed but does not cover all applicable assets.
        - IT.PRO-06.1.PE-2: Vulnerability scans are conducted but results are not reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.PE-3: Vulnerability scans are conducted but frequency is not regular enough to enable timely response.
        - IT.PRO-06.1.PE-4: Scanning covers software vulnerabilities but not configuration weaknesses.
        - IT.PRO-06.1.PE-5: Advisories for relevant software and configuration weaknesses for organisational assets are reviewed on an ad hoc basis, or only for some assets.

        Fully effective:
        - IT.PRO-06.1.FE-1: All applicable assets are included in routine vulnerability scanning, and scanning frequency enables timely response.
        - IT.PRO-06.1.FE-2: Scanning covers both software vulnerabilities and configuration weaknesses.
        - IT.PRO-06.1.FE-3: Results are reviewed and prioritised within timeframes defined by the organisation.
        - IT.PRO-06.1.FE-4: Advisories for relevant software and configuration weaknesses in all organisational assets are regularly reviewed and assessed for impact.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-06:it.pro-06.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-06
      ref_id: IT.PRO-06.2
      description: Apply security patches or updates within defined risk-based timeframes or automatically
        where operational impact is low.
      annotation: |-
        Not effective:
        - IT.PRO-06.2.NE-1: No defined patching timeframes exist for applicable assets.
        - IT.PRO-06.2.NE-2: Patches are not applied or are applied on an ad hoc basis with no tracking.

        Partially effective:
        - IT.PRO-06.2.PE-1: Expected patching timeframes are defined by the organisation but are not consistently met.
        - IT.PRO-06.2.PE-2: Patches are applied but compensating controls are not documented where operational constraints prevent timely patching.
        - IT.PRO-06.2.PE-3: Patching coverage metrics exist but show significant gaps.

        Fully effective:
        - IT.PRO-06.2.FE-1: Risk-based patching timeframes defined by the organisation are in place and consistently met.
        - IT.PRO-06.2.FE-2: Patching is prioritised based on vulnerability severity, exposure and exploit availability.
        - IT.PRO-06.2.FE-3: Where operational constraints prevent timely patching, compensating controls are documented and approved.
        - IT.PRO-06.2.FE-4: Patching coverage metrics account for all applicable assets, with any exclusions identified and formally risk accepted.
        - IT.PRO-06.2.FE-5: Automatic patching of assets is applied where available and the organisation has determined operational impact is low.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-06:it.pro-06.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-06
      ref_id: IT.PRO-06.3
      description: Remediate or mitigate vulnerabilities exceeding defined risk thresholds within defined
        timeframes based on exploitation, exposure, criticality, impact and compensating controls, and
        verify treatment effectiveness.
      annotation: |-
        Not effective:
        - IT.PRO-06.3.NE-1: No risk thresholds are defined for vulnerability remediation.
        - IT.PRO-06.3.NE-2: Vulnerabilities exceeding acceptable risk levels are not tracked or remediated.

        Partially effective:
        - IT.PRO-06.3.PE-1: Risk thresholds are defined but vulnerabilities exceeding them are not consistently remediated within defined timeframes.
        - IT.PRO-06.3.PE-2: Compensating controls are applied in some cases but are not formally documented or approved.

        Fully effective:
        - IT.PRO-06.3.FE-1: Risk thresholds defined by the organisation exist, and vulnerabilities exceeding them are remediated or have approved compensating controls within organisationally defined timeframes.
        - IT.PRO-06.3.FE-2: Remediation and mitigation actions are tracked to closure with verification that actions reduced the risk as intended.
        - IT.PRO-06.3.FE-3: The process is sustained, with historical data demonstrating consistent performance across organisationally defined reporting periods.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-07
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: PRO-07
      name: Trustworthy software
      description: Systems (operating systems and applications) only permit the execution of software
        that is supported, verified and authorised.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-07:it.pro-07.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-07
      ref_id: IT.PRO-07.1
      description: Permit only supported, verified and organisation-authorised software to execute on
        systems, with exceptions minimised, formally risk accepted, time-bound, monitored and regularly
        reviewed.
      annotation: |-
        Not effective:
        - IT.PRO-07.1.NE-1: Unsupported, unverified or unauthorised software can execute without restriction.
        - IT.PRO-07.1.NE-2: The list of approved software does not exist.

        Partially effective:
        - IT.PRO-07.1.PE-1: Execution restriction controls are deployed but do not cover all applicable assets.
        - IT.PRO-07.1.PE-2: The organisation maintains a list of approved software, but it has not been reviewed within timeframes defined by the organisation.
        - IT.PRO-07.1.PE-3: Execution restrictions are in place but integrity verification of approved software is not performed.
        - IT.PRO-07.1.PE-4: Exceptions to execution restrictions are granted without formal approval or time-bounding.

        Fully effective:
        - IT.PRO-07.1.FE-1: Controls restrict execution to supported, organisation-authorised and integrity-verified software on all applicable assets.
        - IT.PRO-07.1.FE-2: The organisation maintains a list of approved software and reviews it within the timeframes defined by the organisation.
        - IT.PRO-07.1.FE-3: Integrity of permitted software is verified using trusted mechanisms appropriate to the software and its source.
        - IT.PRO-07.1.FE-4: Exceptions are formally approved, documented, time-bound and reviewed on a regular cycle defined by the organisation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-07:it.pro-07.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:pro-07
      ref_id: IT.PRO-07.2
      description: Restrict administrative and management tooling to approved software sets and executed
        from only authorised, known locations.
      annotation: |-
        Not effective:
        - IT.PRO-07.2.NE-1: No approved administrative toolset is defined.
        - IT.PRO-07.2.NE-2: No restrictions are placed on the location administrative tooling can be executed from.
        - IT.PRO-07.2.NE-3: No controls prevent unapproved administrative tools, including tools commonly used in post-compromise activity, from executing on managed assets.

        Partially effective:
        - IT.PRO-07.2.PE-1: An approved toolset is defined but not consistently enforced across all assets.
        - IT.PRO-07.2.PE-2: Administrative tooling is configured to execute from known locations, but privileged users can still run tooling from unapproved locations.
        - IT.PRO-07.2.PE-3: Some unapproved administrative tools are blocked but enforcement gaps exist.

        Fully effective:
        - IT.PRO-07.2.FE-1: A defined and enforced approved toolset exists for administrative and management activities, and execution is limited to authorised, known locations.
        - IT.PRO-07.2.FE-2: Administrative and management tooling outside the approved set is blocked from execution, including from unauthorised locations.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-01
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: DET-01
      name: Centralised event logging
      description: Security-relevant event logs and configuration changes for systems (infrastructure,
        operating systems, applications and data) are centrally collected, protected against unauthorised
        modification or deletion, and retained to support effective cyber security event detection and
        investigation.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-01:it.det-01.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-01
      ref_id: IT.DET-01.1
      description: Protect event logs from unauthorised access, modification or deletion, including by
        encrypting them during transit and at rest and securing the systems and accounts used to store,
        manage and analyse them.
      annotation: |-
        Not effective:
        - IT.DET-01.1.NE-1: Logs generated by applicable assets are not protected from modification or deletion.
        - IT.DET-01.1.NE-2: Log access is not restricted to authorised roles with a business need.
        - IT.DET-01.1.NE-3: Logs are neither encrypted during transit nor at rest.

        Partially effective:
        - IT.DET-01.1.PE-1: Logs are forwarded but integrity protections are not in place at the source.
        - IT.DET-01.1.PE-2: Log access is restricted but some roles retain the ability to modify or delete logs.
        - IT.DET-01.1.PE-3: Logs are encrypted during transit but are not protected with encryption at rest (or vice versa).

        Fully effective:
        - IT.DET-01.1.FE-1: Logs are protected against modification or deletion.
        - IT.DET-01.1.FE-2: Logs are encrypted in transit and at rest.
        - IT.DET-01.1.FE-3: Access to logs is restricted to authorised roles with a business need.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-01:it.det-01.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-01
      ref_id: IT.DET-01.2
      description: Forward high-value, security-relevant event logs and configuration changes from infrastructure,
        operating systems and applications to a central log storage capability.
      annotation: |-
        Not effective:
        - IT.DET-01.2.NE-1: Security-relevant logs from assets are not forwarded to a central logging capability.
        - IT.DET-01.2.NE-2: High-value, security-relevant event logs or configuration changes from infrastructure, operating systems or applications are not forwarded.

        Partially effective:
        - IT.DET-01.2.PE-1: High-value, security-relevant event logs are forwarded, but coverage gaps are identified or completeness has not been validated.
        - IT.DET-01.2.PE-2: Configuration change logs are forwarded inconsistently.
        - IT.DET-01.2.PE-3: The utility of security log sources is reviewed, but on an ad hoc basis rather than according to a defined schedule.
        - IT.DET-01.2.PE-4: Log forwarding is in place but latency is excessive for effective detection.

        Fully effective:
        - IT.DET-01.2.FE-1: High-value security-relevant event logs and configuration changes from all relevant infrastructure, operating systems and application sources are forwarded to the central logging capability.
        - IT.DET-01.2.FE-2: Security log sources are reviewed at regular intervals to ensure their continued utility in detecting and responding to changing adversary techniques.
        - IT.DET-01.2.FE-3: Log completeness has been validated against the expected log sources.
        - IT.DET-01.2.FE-4: Logs are forwarded at a frequency that enables timely detection.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-02
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices
      ref_id: DET-02
      name: Cyber security event detection
      description: Anomalous or unexpected events and behaviours for systems (infrastructure, operating
        systems, applications and data) are analysed in a timely manner to detect cyber security events.
      implementation_groups:
      - '3'
    - urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-02:it.det-02.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:asd-essentials-enterprise-it:user-devices:det-02
      ref_id: IT.DET-02.1
      description: Ensure event logs are normalised, time-synchronised and enriched to support correlation
        across systems and environments.
      annotation: |-
        Not effective:
        - IT.DET-02.1.NE-1: Logs are not time-synchronised to an authoritative source.
        - IT.DET-02.1.NE-2: Logs are ingested in raw format and are neither normalised nor enriched.

        Partially effective:
        - IT.DET-02.1.PE-1: Logs are time-synchronised but are not normalised to a common schema.
        - IT.DET-02.1.PE-2: Some enrichment is applied but critical contextual data such as asset classification or account type is missing.

        Fully effective:
        - IT.DET-02.1.FE-1: Logs are time-synchronised to the authoritative time source.
        - IT.DET-02.1.FE-2: Logs are normalised into the common log schema and enriched with contextual metadata.
        - IT.DET-02.1.FE-3: Enriched logs support correlation across relevant systems, environments and data sources in the central logging platform.
      implementation_groups:
      - '3'
