urn: urn:intuitem:risk:library:workflow-operations-privileged-credential-notice
locale: en
ref_id: workflow-operations-privileged-credential-notice
name: Personal access token created — notify security
description: Tells the security team whenever a personal access token is minted, so long-lived credentials
  are noticed rather than discovered.
copyright: © intuitem
version: 1
publication_date: 2026-08-28
provider: intuitem
packager: intuitem
objects:
  workflows:
  - urn: urn:intuitem:risk:library:workflow-operations-privileged-credential-notice:workflow:privileged-credential-notice
    schema_version: 1
    ref_id: privileged-credential-notice
    name: Personal access token created — notify security
    description: Tells the security team whenever a personal access token is minted, so long-lived credentials
      are noticed rather than discovered.
    graph:
      variables:
      - key: notify_emails
        type: string
        default_value: security@example.com
      nodes:
      - ref: on_token
        type: trigger
        label: Token created
        trigger_config:
          type: internal_event
          event_key: personalaccesstoken.created
      - ref: notify
        type: action
        label: Send the notice
        action_config:
          type: send_email
          recipients: '{{notify_emails}}'
          subject: Personal access token created
          body: '{{payload.object_repr}} was created on {{today}} by {{payload.actor_email}}.'
      - ref: done
        type: end
      edges:
      - source: on_token
        target: notify
      - source: notify
        target: done
