urn: urn:intuitem:risk:library:essential-eight-2023
locale: en
ref_id: Essential Eight 2023
name: Essential Eight Maturity Model (November 2023)
description: |-
  The Australian Signals Directorate (ASD) has developed prioritised mitigation strategies, in the form of the Strategies to mitigate cyber security incidents, to help organisations protect themselves against various cyber threats. The most effective of these mitigation strategies are the Essential Eight.

  The Essential Eight has been designed to protect organisations’ internet-connected information technology networks. While the principles behind the Essential Eight may be applied to enterprise mobility and operational technology networks, it was not designed for such purposes and alternative mitigation strategies may be more appropriate to defend against unique cyber threats to these environments.

  Select a single target maturity level when creating an audit: requirements are tagged with the exact levels at which ASD lists them, so statements superseded at a higher level are not asked there. Requirement ref_ids are the ISM controls from ASD's Essential Eight maturity model and ISM mapping.

  Assessment (Essential Eight assessment process guide): a mitigation strategy is implemented at a maturity level only when all of its controls for that level are assessed as effective or alternate control; if one or more mitigation strategies are not implemented, the target maturity level for the system cannot be claimed.
  https://www.cyber.gov.au/business-government/asds-cyber-security-frameworks/essential-eight/essential-eight-maturity-model
