  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0024
    ref_id: AML.T0024
    name: Exfiltration via AI Inference API
    description: 'Adversaries may exfiltrate private information via [AI Model Inference
      API Access](https://atlas.mitre.org/techniques/AML.T0040).

      AI Models have been shown leak private information about their training data
      (e.g.  [Infer Training Data Membership](https://atlas.mitre.org/techniques/AML.T0024.000),
      [Invert AI Model](https://atlas.mitre.org/techniques/AML.T0024.001)).

      The model itself may also be extracted ([Extract AI Model](https://atlas.mitre.org/techniques/AML.T0024.002))
      for the purposes of [AI Intellectual Property Theft](https://atlas.mitre.org/techniques/AML.T0048.004).


      Exfiltration of information relating to private training data raises privacy
      concerns.

      Private training data may include personally identifiable information, or other
      protected data.'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
