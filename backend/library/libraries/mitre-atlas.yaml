  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0016
    ref_id: AML.T0016
    name: Obtain Capabilities
    description: 'Adversaries may search for and obtain software capabilities for
      use in their operations.

      Capabilities may be specific to AI-based attacks [Adversarial AI Attack Implementations](https://atlas.mitre.org/techniques/AML.T0016.000)
      or generic software tools repurposed for malicious intent ([Software Tools](https://atlas.mitre.org/techniques/AML.T0016.001)).
      In both instances, an adversary may modify or customize the capability to aid
      in targeting a particular AI-enabled system.'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - enterprise
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0001
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0016.000
    ref_id: AML.T0016.000
    name: Adversarial AI Attack Implementations
    description: 'Adversaries may search for existing open source implementations
      of AI attacks. The research community often publishes their code for reproducibility
      and to further future research. Libraries intended for research purposes, such
      as CleverHans, the Adversarial Robustness Toolbox, and FoolBox, can be weaponized
      by an adversary. Adversaries may also obtain and use tools that were not originally
      designed for adversarial AI attacks as part of their attack.

      https://atlas.mitre.org/techniques/AML.T0016.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0016
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0016.001
    ref_id: AML.T0016.001
    name: Software Tools
    description: 'Adversaries may search for and obtain software tools to support
      their operations.

      Software designed for legitimate use may be repurposed by an adversary for malicious
      intent.

      An adversary may modify or customize software tools to achieve their purpose.

      Software tools used to support attacks on AI systems are not necessarily AI-based
      themselves.

      https://atlas.mitre.org/techniques/AML.T0016.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0016
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    groups:
    - enterprise
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0016.002
    ref_id: AML.T0016.002
    name: Generative AI
    description: 'Adversaries may search for and obtain generative AI models or tools,
      such as large language models (LLMs), to assist them in various steps of their
      operation. Generative AI can be used in a variety of malicious ways, such as
      to {{ create_internal_link(undefined) }}, to [Generate Deepfakes](https://atlas.mitre.org/techniques/AML.T0088),
      to [Generate Malicious Commands](https://atlas.mitre.org/techniques/AML.T0102),
      for [Retrieval Content Crafting](https://atlas.mitre.org/techniques/AML.T0066),
      or to generate [Phishing](https://atlas.mitre.org/techniques/AML.T0052) content.


      Adversaries may obtain open source models and serve them locally using frameworks
      such as [Ollama](https://ollama.com/) or [vLLM]( https://docs.vllm.ai/en/latest/).
      They may host them using cloud infrastructure. Or, they may leverage AI service
      providers such as HuggingFace.


      They may need to jailbreak the model (see [LLM Jailbreak](https://atlas.mitre.org/techniques/AML.T0054))
      to bypass any restrictions put in place to limit the types of responses it can
      generate. They may also need to break the terms of service of the model''s developer.


      Generative AI models may also be "uncensored" meaning they are designed to generate
      content without any restrictions such as guardrails or content filters. Uncensored
      GenAI is ripe for abuse by cybercriminals [[blog]] [[gbhackers]]. Models may
      be fine-tuned to remove alignment and guardrails [[erichartford]] or be subjected
      to targeted manipulations to bypass refusal [[arxiv]] resulting in uncensored
      variants of the model. Uncensored models may be built for offensive and defensive
      cybersecurity [[taico]], which can be abused by an adversary. There are also
      models that are expressly designed and advertised for malicious use [[gbhackers-1]].

      https://atlas.mitre.org/techniques/AML.T0016.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0016
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    groups:
    - enterprise
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0001
    - urn:intuitem:risk:function:mitre-atlas:aml.m0020
    - urn:intuitem:risk:function:mitre-atlas:aml.m0022
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0017
    ref_id: AML.T0017
    name: Develop Capabilities
    description: 'Adversaries may develop their own capabilities to support operations.
      This process encompasses identifying requirements, building solutions, and deploying
      capabilities. Capabilities used to support attacks on AI-enabled systems are
      not necessarily AI-based themselves. Examples include setting up websites with
      adversarial information or creating Jupyter notebooks with obfuscated exfiltration
      code.

      https://atlas.mitre.org/techniques/AML.T0017'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - enterprise
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0017.000
    ref_id: AML.T0017.000
    name: Adversarial AI Attacks
    description: 'Adversaries may develop their own adversarial attacks.

      They may leverage existing libraries as a starting point ([Adversarial AI Attack
      Implementations](https://atlas.mitre.org/techniques/AML.T0016.000)).

      They may implement ideas described in public research papers or develop custom
      made attacks for the victim model.

      https://atlas.mitre.org/techniques/AML.T0017.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0017
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0018
    ref_id: AML.T0018
    name: Manipulate AI Model
    description: "Adversaries may manipulate an AI model artifact or its bundled components\
      \ to change AI system behavior, introduce malicious code, or establish persistent\
      \ malicious functionality. This may include modifying model weights, model architecture,\
      \ or prompt-construction logic.  \n\nManipulated artifacts may retain expected\
      \ behavior under ordinary conditions while activating malicious behavior only\
      \ for selected inputs, contexts, or deployment conditions.\nhttps://atlas.mitre.org/techniques/AML.T0018"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
