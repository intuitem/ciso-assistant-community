  - urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0005.000
    ref_id: AML.T0005.000
    name: Train Proxy via Gathered AI Artifacts
    description: 'Proxy models may be trained from AI artifacts (such as data, model
      architectures, and pre-trained models) that are representative of the target
      model gathered by the adversary.

      This can be used to develop attacks that require higher levels of access than
      the adversary has available or as a means to validate pre-existing attacks without
      interacting with the target model.

      https://atlas.mitre.org/techniques/AML.T0005.000'
    type: technique
    catalog_urn: urn:intuitem:risk:threat_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0005
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
    - AML.TA0001
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0000
    - urn:intuitem:risk:function:mitre-atlas:aml.m0001
  - urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0005.001
    ref_id: AML.T0005.001
    name: Train Proxy via Replication
    description: 'Adversaries may replicate a private model.

      By repeatedly querying the victim''s [AI Model Inference API Access](https://atlas.mitre.org/techniques/AML.T0040),
      the adversary can collect the target model''s inferences into a dataset.

      The inferences are used as labels for training a separate model offline that
      will mimic the behavior and performance of the target model.


      A replicated model that closely mimic''s the target model is a valuable resource
      in staging the attack.

      The adversary can use the replicated model to [Craft Adversarial Data](https://atlas.mitre.org/techniques/AML.T0043)
      for various purposes (e.g. [Evade AI Model](https://atlas.mitre.org/techniques/AML.T0015),
      [Spamming AI System with Chaff Data](https://atlas.mitre.org/techniques/AML.T0046)).

      https://atlas.mitre.org/techniques/AML.T0005.001'
    type: technique
    catalog_urn: urn:intuitem:risk:threat_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0005
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
    - AML.TA0001
