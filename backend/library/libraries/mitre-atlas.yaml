    - enterprise
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0048.002
    ref_id: AML.T0048.002
    name: Societal Harm
    description: 'Societal harms might generate harmful outcomes that reach either
      the general public or specific vulnerable groups such as the exposure of children
      to vulgar content.

      https://atlas.mitre.org/techniques/AML.T0048.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0048
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0011
