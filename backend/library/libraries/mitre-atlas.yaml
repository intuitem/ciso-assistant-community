  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0087
    ref_id: AML.T0087
    name: Gather Victim Identity Information
    description: 'Adversaries may gather information about the victim''s identity
      that can be used during targeting. Information about identities may include
      a variety of details, including personal data (ex: employee names, email addresses,
      photos, etc.) as well as sensitive details such as credentials or multi-factor
      authentication (MFA) configurations.


      Adversaries may gather this information in various ways, such as direct elicitation,
      [Search Victim-Owned Websites](https://atlas.mitre.org/techniques/AML.T0003),
      or via leaked information on the black market.


      Adversaries may use the gathered victim data to Create Deepfakes and impersonate
      them in a convincing manner. This may create opportunities for adversaries to
      [Establish Accounts](https://atlas.mitre.org/techniques/AML.T0021) under the
      impersonated identity, or allow them to perform convincing [Phishing](https://atlas.mitre.org/techniques/AML.T0052)
      attacks.

      https://atlas.mitre.org/techniques/AML.T0087'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0088
    ref_id: AML.T0088
    name: Generate Deepfakes
    description: 'Adversaries may use generative artificial intelligence (GenAI) to
      create synthetic media (i.e. imagery, video, audio, and text) that appear authentic.
      These "[deepfakes]( https://en.wikipedia.org/wiki/Deepfake)" may mimic a real
      person or depict fictional personas. Adversaries may use deepfakes for impersonation
      to conduct [Phishing](https://atlas.mitre.org/techniques/AML.T0052) or to evade
      AI applications such as biometric identity verification systems (see [Evade
      AI Model](https://atlas.mitre.org/techniques/AML.T0015)).


      Manipulation of media has been possible for a long time, however GenAI reduces
      the skill and level of effort required, allowing adversaries to rapidly scale
      operations to target more users or systems. It also makes real-time manipulations
      feasible.


      Adversaries may utilize open-source models and software that were designed for
      legitimate use cases to generate deepfakes for malicious use. However, there
      are some projects specifically tailored towards malicious use cases such as
      [ProKYC](https://www.catonetworks.com/blog/prokyc-selling-deepfake-tool-for-account-fraud-attacks/).

      https://atlas.mitre.org/techniques/AML.T0088'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
    - predictive-ai
    - enterprise
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0009
    - urn:intuitem:risk:function:mitre-atlas:aml.m0034
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0089
    ref_id: AML.T0089
    name: Process Discovery
    description: 'Adversaries may attempt to get information about processes running
      on a system. Once obtained, this information could be used to gain an understanding
      of common AI-related software/applications running on systems within the network.
      Administrator or otherwise elevated access may provide better process details.


      Identifying the AI software stack can then lead an adversary to new targets
      and attack pathways. AI-related software may require application tokens to authenticate
      with backend services. This provides opportunities for [Credential Access](https://atlas.mitre.org/tactics/AML.TA0013)
      and [Lateral Movement](https://atlas.mitre.org/tactics/AML.TA0015).


      In Windows environments, adversaries could obtain details on running processes
      using the Tasklist utility via cmd or `Get-Process` via PowerShell. Information
      about processes can also be extracted from the output of Native API calls such
      as `CreateToolhelp32Snapshot`. In Mac and Linux, this is accomplished with the
      `ps` command. Adversaries may also opt to enumerate processes via `/proc`.

      https://atlas.mitre.org/techniques/AML.T0089'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0008
    groups:
    - enterprise
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0090
    ref_id: AML.T0090
    name: OS Credential Dumping
    description: 'Adversaries may extract credentials from OS caches, application
      memory, or other sources on a compromised system. Credentials are often in the
      form of a hash or clear text, and can include usernames and passwords, application
      tokens, or other authentication keys.


      Credentials can be used to perform [Lateral Movement](https://atlas.mitre.org/tactics/AML.TA0015)
      to access other AI services such as AI agents, LLMs, or AI inference APIs. Credentials
      could also give an adversary access to other software tools and data sources
      that are part of the AI DevOps lifecycle.

      https://atlas.mitre.org/techniques/AML.T0090'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0013
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0011
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0091
    ref_id: AML.T0091
    name: Use Alternate Authentication Material
    description: 'Adversaries may use alternate authentication material, such as password
      hashes, Kerberos tickets, and application access tokens, in order to move laterally
      within an environment and bypass normal system access controls.


      AI services commonly use alternate authentication material as a primary means
      for users to make queries, making them vulnerable to this technique.

      https://atlas.mitre.org/techniques/AML.T0091'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0015
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0019
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0091.000
    ref_id: AML.T0091.000
    name: Application Access Token
    description: 'Adversaries may use stolen application access tokens to bypass the
      typical authentication process and access restricted accounts, information,
      or services on remote systems. These tokens are typically stolen from users
      or services and used in lieu of login credentials.


      Application access tokens are used to make authorized API requests on behalf
      of a user or service and are commonly used to access resources in cloud, container-based
      applications, software-as-a-service (SaaS), and AI-as-a-service(AIaaS). They
      are commonly used for AI services such as chatbots, LLMs, and predictive inference
      APIs.

      https://atlas.mitre.org/techniques/AML.T0091.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0091
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0015
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0019
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0091.001
    ref_id: AML.T0091.001
    name: Web Session Cookie
    description: 'Adversaries may use stolen web session cookies to authenticate to
      AI-enabled applications and supporting services as another user. This technique
      may bypass some multi-factor authentication controls because the session represented
      by the cookie has already been authenticated.


      Authentication cookies are commonly used by web applications and cloud-based
      services after a user has authenticated, allowing the user to continue using
      the service without repeatedly passing credentials. These cookies may remain
      valid for extended periods of time. After obtaining a cookie through [Steal
      Web Session Cookie](https://atlas.mitre.org/techniques/AML.T0103), an adversary
      may import the cookie into a browser or automated client they control and access
      the corresponding application as the victim while the session remains active.


      In attacks on AI systems, web session cookies may grant access to AI chat histories,
      AI agent control panels, model provider dashboards, customer support systems,
      retrieval or knowledge management interfaces, or AI DevOps resources. If the
      stolen cookie belongs to an operator, support agent, developer, or administrator,
      the adversary may be able to view sensitive conversations, manipulate agent
      configuration, access private data available through AI tools, or perform actions
      with the victim account''s permissions.

      https://atlas.mitre.org/techniques/AML.T0091.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0091
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0015
    groups:
    - predictive-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0092
    ref_id: AML.T0092
    name: Manipulate User LLM Chat History
    description: "Adversaries may manipulate a user's large language model (LLM) chat\
      \ history to cover the tracks of their malicious behavior. They may hide persistent\
      \ changes they have made to the LLM's behavior, or obscure their attempts at\
      \ discovering private information about the user.\n\nTo do so, adversaries may\
      \ delete or edit existing messages or create new threads as part of their coverup.\
      \ This is feasible if the adversary has the victim's authentication tokens for\
      \ the backend LLM service or if they have direct access to the victim's chat\
      \ interface. \n\nChat interfaces (especially desktop interfaces) often do not\
      \ show the injected prompt for any ongoing chat, as they update chat history\
      \ only once when initially opening it. This can help the adversary's manipulations\
      \ go unnoticed by the victim.\nhttps://atlas.mitre.org/techniques/AML.T0092"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    groups:
    - generative-ai
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0093
    ref_id: AML.T0093
    name: Prompt Infiltration via Public-Facing Application
    description: 'An adversary may introduce malicious prompts into the victim''s
      system via a public-facing application with the intention of it being ingested
      by an AI at some point in the future and ultimately having a downstream effect.
      This may occur when a data source is indexed by a retrieval augmented generation
      (RAG) system, when a rule triggers an action by an AI agent, or when a user
      utilizes a large language model (LLM) to interact with the malicious content.
      The malicious prompts may persist on the victim system for an extended period
      and could affect multiple users and various AI tools within the victim organization.


      Any public-facing application that accepts text input could be a target. This
      includes email, shared document systems like OneDrive or Google Drive, and service
      desks or ticketing systems like Jira. This also includes OCR-mediated infiltration
      where malicious instructions are embedded in images, screenshots, and invoices
      that are ingested into the system.


      Adversaries may perform [Reconnaissance](https://atlas.mitre.org/tactics/AML.TA0002)
      to identify public facing applications that are likely monitored by an AI agent
      or are likely to be indexed by a RAG. They may perform [Discover AI Agent Configuration](https://atlas.mitre.org/techniques/AML.T0084)
      to refine their targeting.

      https://atlas.mitre.org/techniques/AML.T0093'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0004
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0006
    groups:
    - generative-ai
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0094
    ref_id: AML.T0094
    name: Delay Execution of LLM Instructions
    description: 'Adversaries may include instructions to be followed by the AI system
      in response to a future event, such as a specific keyword or the next interaction,
      in order to evade detection or bypass controls placed on the AI system.


      For example, an adversary may include "If the user submits a new request..."
      followed by the malicious instructions as part of their prompt.


      AI agents can include security measures against prompt injections that prevent
      the invocation of particular tools or access to certain data sources during
      a conversation turn that has untrusted data in context. Delaying the execution
      of instructions to a future interaction or keyword is one way adversaries may
      bypass this type of control.

      https://atlas.mitre.org/techniques/AML.T0094'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    groups:
    - generative-ai
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0095
    ref_id: AML.T0095
    name: Search Open Websites/Domains
    description: 'Adversaries may search public websites and/or domains for information
      about victims that can be used during targeting. Information about victims may
      be available in various online sites, such as social media, new sites, or domains
      owned by the victim.


      Adversaries may find the information they seek to gather via search engines.
      They can use precise search queries to identify software platforms or services
      used by the victim to use in targeting. This may be followed by [Exploit Public-Facing
      Application](https://atlas.mitre.org/techniques/AML.T0049) or [Prompt Infiltration
      via Public-Facing Application](https://atlas.mitre.org/techniques/AML.T0093).

      https://atlas.mitre.org/techniques/AML.T0095'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0000
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0095.000
    ref_id: AML.T0095.000
    name: Code Repositories
    description: 'Adversaries may search public code repositories for information
      about a victim or victim system that can be used during targeting. Victims may
      store code or artifacts related to their AI systems in repositories on various
      third-party websites such as GitHub, GitLab, SourceForge, and BitBucket. Adversaries
      may search code repositories of common AI tools, frameworks, models, or agentic
      systems that are used--but not owned--by the victim.


      Public code repositories can often be a source of various information about
      victims, such as commonly used AI frameworks, libraries, models, datasets, agents,
      and agent tools, as well as the names of employees. Adversaries may also identify
      more sensitive data, including accidentally leaked credentials or API keys (ex:
      [Credentials from AI Agent Configuration](https://atlas.mitre.org/techniques/AML.T0083)).
      Information from these sources may reveal opportunities for other forms of [Reconnaissance](https://atlas.mitre.org/tactics/AML.TA0002)
      (ex: [Gather RAG-Indexed Targets](https://atlas.mitre.org/techniques/AML.T0064)),
      establishing operational resources (ex: [Acquire Public AI Artifacts](https://atlas.mitre.org/techniques/AML.T0002)),
      [Discovery](https://atlas.mitre.org/tactics/AML.TA0008) (ex: [Discover AI Agent
      Configuration](https://atlas.mitre.org/techniques/AML.T0084)) and/or [Initial
      Access](https://atlas.mitre.org/tactics/AML.TA0004) (ex: [Valid Accounts](https://atlas.mitre.org/techniques/AML.T0012)
      or [Phishing](https://atlas.mitre.org/techniques/AML.T0052)).

      https://atlas.mitre.org/techniques/AML.T0095.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0095
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0096
    ref_id: AML.T0096
    name: AI Service API
    description: 'Adversaries may communicate using the API of an AI service on the
      victim''s system. The adversary''s commands to the victim system, and often
      the results, are embedded in the normal traffic of the AI service.


      An AI service API command and control channel is covert because the adversary''s
      commands blend in with normal communications, so an adversary may use this technique
      to avoid detection. Using existing infrastructure on the victim''s system allows
      the adversary to live off the land, further reducing their footprint.


      AI service APIs may be abused as C2 channels when an adversary wants to be stealthy
      and maintain long-term persistence for espionage activities [[microsoft]].

      https://atlas.mitre.org/techniques/AML.T0096'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0014
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0019
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0097
    ref_id: AML.T0097
    name: Virtualization/Sandbox Evasion
    description: 'Adversaries may employ various means to detect and avoid virtualization
      and analysis environments. This may include changing behaviors based on the
      results of checks for the presence of artifacts indicative of a virtual machine
      environment (VME) or sandbox. If the adversary detects a VME, they may alter
      their malware to disengage from the victim or conceal the core functions of
      the implant. They may also search for VME artifacts before dropping secondary
      or additional payloads.


      Adversaries may use several methods to accomplish Virtualization/Sandbox Evasion
      such as checking for security monitoring tools (e.g., Sysinternals, Wireshark,
      etc.) or other system artifacts associated with analysis or virtualization such
      as registry keys (e.g. substrings matching Vmware, VBOX, QEMU), environment
      variables (e.g. substrings matching VBOX, VMWARE, PARALLELS), NIC MAC addresses
      (e.g. prefixes 00-05-69 (VMWare) or 08-00-27 (VirtualBox)), running processes
      (e.g. vmware.exe, vboxservice.exe, qemu-ga.exe) [[research]].

      https://atlas.mitre.org/techniques/AML.T0097'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    groups:
    - enterprise
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0098
    ref_id: AML.T0098
    name: AI Agent Tool Credential Harvesting
    description: 'Adversaries may attempt to use their access to an AI agent on the
      victim''s system to retrieve data from available agent tools to collect credentials.
      Agent tools may connect to a wide range of sources that may contain credentials
      including document stores (e.g. SharePoint, OneDrive or Google Drive), code
      repositories (e.g. GitHub or GitLab), or enterprise productivity tools (e.g.
      as email providers or Slack), and local notetaking tools (e.g. Obsidian or Apple
      Notes).

      https://atlas.mitre.org/techniques/AML.T0098'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0013
    groups:
    - agentic-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0032
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0099
    ref_id: AML.T0099
    name: AI Agent Tool Data Poisoning
    description: 'Adversaries may manipulate data in a victim-controlled, trusted,
      or connected data source that is accessible through an AI agent tool. Poisoned
      data may be placed in document repositories, databases, source-code repositories,
      knowledge bases, search indexes, enterprise applications, or third-party data
      services used by the agent.


      The content may be crafted to appear in common tool queries or retrieval operations.
      It may contain false or misleading information or malicious instructions intended
      to produce an [LLM Prompt Injection: Indirect](https://atlas.mitre.org/techniques/AML.T0051.001)
      when retrieved.


      This technique concerns manipulation of a data source that an agent tool treats
      as a source of information. When the adversary introduces the content through
      a victim-controlled public-facing application, the activity may also constitute
      [Prompt Infiltration via Public-Facing Application](https://atlas.mitre.org/techniques/AML.T0093).
      Content retrieved directly from an adversary-controlled website may instead
      constitute [Drive-by Compromise](https://atlas.mitre.org/techniques/AML.T0078).
      A malicious or compromised tool that deliberately alters its own runtime result
      constitutes [AI Agent Tool Poisoning: Runtime Response](https://atlas.mitre.org/techniques/AML.T0110.002).

      https://atlas.mitre.org/techniques/AML.T0099'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0006
    groups:
    - agentic-ai
    - feasible
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0020
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0100
    ref_id: AML.T0100
    name: AI Agent Clickbait
    description: 'Adversaries may craft deceptive web content designed to bait Computer-Using
      AI agents or AI web browsers into taking unintended actions, such as clicking
      buttons, copying code, or navigating to specific web pages. These attacks exploit
      the agent''s interpretation of UI content, visual cues, or prompt-like language
      embedded in the site. When successful, they can lead the agent to inadvertently
      copy and execute malicious code on the user''s operating system.

      https://atlas.mitre.org/techniques/AML.T0100'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0005
    groups:
    - agentic-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0020
    - urn:intuitem:risk:function:mitre-atlas:aml.m0021
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0101
    ref_id: AML.T0101
    name: Data Destruction via AI Agent Tool Invocation
    description: 'Adversaries may invoke an AI agent''s tool capable of performing
      mutative operations to perform Data Destruction. Adversaries may destroy data
      and files on specific systems or in large numbers on a network to interrupt
      availability to systems, services, and network resources.

      https://atlas.mitre.org/techniques/AML.T0101'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0011
    groups:
    - agentic-ai
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0024
    - urn:intuitem:risk:function:mitre-atlas:aml.m0026
    - urn:intuitem:risk:function:mitre-atlas:aml.m0027
    - urn:intuitem:risk:function:mitre-atlas:aml.m0028
    - urn:intuitem:risk:function:mitre-atlas:aml.m0029
    - urn:intuitem:risk:function:mitre-atlas:aml.m0030
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0102
    ref_id: AML.T0102
    name: Generate Malicious Commands
    description: 'Adversaries may use large language models (LLMs) to dynamically
      generate malicious commands from natural language. Dynamically generated commands
      may be harder to detect as the attack signature is constantly changing. AI-generated
      commands may also allow adversaries to more rapidly adapt to different environments
      and adjust their tactics.


      Adversaries may utilize LLMs present in the victim''s environment or call out
      to externally hosted services. [APT28](https://attack.mitre.org/groups/G0007)
      utilized a model hosted on HuggingFace in a campaign with their LAMEHUG malware
      [[logpoint]]. In either case prompts to generate malicious code can blend in
      with normal traffic.

      https://atlas.mitre.org/techniques/AML.T0102'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
    - enterprise
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0020
    - urn:intuitem:risk:function:mitre-atlas:aml.m0022
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0103
    ref_id: AML.T0103
    name: Deploy AI Agent
    description: 'Adversaries may launch AI agents in the victim''s environment to
      execute actions on their behalf. AI agents may have access to a wide range of
      tools and data sources, as well as permissions to access and interact with other
      services and systems in the victim''s environment. The adversary may leverage
      these capabilities to carry out their operations.


      Adversaries may configure the AI agent by providing an initial system prompt
      and granting access to tools, effectively defining their goals for the agent
      to achieve. They may deploy the agent with excessive trust permissions and disable
      any user interactions to ensure the agent''s actions aren''t blocked.


      Launching an AI agent may provide for some autonomous behavior, allowing for
      the agent to make decisions and determine how to achieve the adversary''s goals.
      This also represents a loss of control for the adversary.

      https://atlas.mitre.org/techniques/AML.T0103'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0005
    groups:
    - agentic-ai
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0105
    ref_id: AML.T0105
    name: Escape to Host
    description: 'Adversaries may break out of a container or virtualized environment
      to gain access to the underlying host. This can allow an adversary access to
      other containerized or virtualized resources from the host level or to the host
      itself. In principle, containerized / virtualized resources should provide a
      clear separation of application functionality and be isolated from the host
      environment.


      There are many ways an adversary may escape from a container or sandbox environment
      via AI Systems. For example, modifying an AI Agent''s configuration to disable
      safety features or user confirmations could allow the adversary to invoke tools
      to be run on host environments rather than in the sandbox.

      https://atlas.mitre.org/techniques/AML.T0105'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0012
    groups:
    - enterprise
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0106
    ref_id: AML.T0106
    name: Exploitation for Credential Access
    description: 'Adversaries may exploit software vulnerabilities in an attempt to
      collect credentials. Exploitation of a software vulnerability occurs when an
      adversary takes advantage of a programming error in a program, service, or within
      the operating system software or kernel itself to execute adversary-controlled
      code.

      https://atlas.mitre.org/techniques/AML.T0106'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0013
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0016
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0107
    ref_id: AML.T0107
    name: Exploitation for Defense Evasion
    description: 'Adversaries may exploit a system or application vulnerability to
      bypass security features. Exploitation of a vulnerability occurs when an adversary
      takes advantage of a programming error in a program, service, or within the
      operating system software or kernel itself to execute adversary-controlled code.
      Vulnerabilities may exist in defensive security software that can be used to
      disable or circumvent them.

      https://atlas.mitre.org/techniques/AML.T0107'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0016
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0108
    ref_id: AML.T0108
    name: AI Agent
    description: 'Adversaries may abuse AI agents present on the victim''s system
      for command and control. AI agents are often granted access to tools that can
      execute shell commands, reach out to the internet, and interact with other services
      in the victim''s environment, making them capable C2 agents.


      The adversary may modify the behavior of an AI agent for C2 via [LLM Prompt
      Injection](https://atlas.mitre.org/techniques/AML.T0051) and rely on the agent''s
      ability to invoke tools to retrieve and execute the adversary''s commands. They
      may maintain persistent control of an agent via [Modify AI Agent Configuration](https://atlas.mitre.org/techniques/AML.T0081)
      or [AI Agent Context Poisoning](https://atlas.mitre.org/techniques/AML.T0080).
      They may instruct the agent to not report their actions to the user in an attempt
      to remain covert.

      https://atlas.mitre.org/techniques/AML.T0108'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0014
    groups:
    - agentic-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0020
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0109
    ref_id: AML.T0109
    name: AI Supply Chain Rug Pull
    description: 'Adversaries may publish legitimate AI components or software, gain
      user adoption, then push an update with a malicious variant, leading to [AI
      Supply Chain Compromise](https://atlas.mitre.org/techniques/AML.T0010). More
      scrutiny is often placed on a supply chain dependency when it is first being
      considered for inclusion in an AI system. Performing a rug pull may allow adversaries
      to bypass these defenses and be more likely to achieve [Initial Access](https://atlas.mitre.org/tactics/AML.TA0004).


      Adversaries may [Publish Poisoned AI Artifacts](https://atlas.mitre.org/techniques/AML.T0115),
      then attempt to gain user trust and increase adoption before performing the
      rug pull (See [AI Supply Chain Reputation Inflation](https://atlas.mitre.org/techniques/AML.T0111)).

      https://atlas.mitre.org/techniques/AML.T0109'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0110
    ref_id: AML.T0110
    name: AI Agent Tool Poisoning
    description: 'Adversaries may poison tools used by AI agents by introducing or
      modifying malicious content or behavior in a tool''s model-visible definition,
      executable implementation, or runtime responses. Tools may include built-in
      integrations, locally installed packages, remotely hosted services, Model Context
      Protocol (MCP) servers and tools, and agent skills or similar capability packages.


      A poisoned tool is represented or trusted as performing a benign function, but
      its definition, implementation, or responses cause agent behavior or tool-mediated
      effects to differ materially from the represented function. Poisoning may be
      present when a tool is first published, introduced through an [AI Supply Chain
      Compromise](https://atlas.mitre.org/techniques/AML.T0010), or added after adoption
      through an [AI Supply Chain Rug Pull](https://atlas.mitre.org/techniques/AML.T0109).
      Once the tool is installed, connected, or otherwise made available to the agent,
      it may provide the adversary with persistent influence over the agent''s actions
      and external interactions.


      Adversaries may poison a tool''s model-visible semantic interface, including
      its descriptions, schemas, parameter documentation, annotations, or agent-readable
      instructions (See [Definition and Instructions](https://atlas.mitre.org/techniques/AML.T0110.000)).
      They may introduce hidden executable behavior that changes the effects of otherwise
      normal tool invocations (See [Implementation](https://atlas.mitre.org/techniques/AML.T0110.001)).
      They may also cause a malicious or compromised tool to deliberately return content
      intended to influence the model''s subsequent reasoning or actions (See [Runtime
      Response](https://atlas.mitre.org/techniques/AML.T0110.002)).


      Poisoned tools may cause an agent to access sensitive data, alter the inputs
      or destinations of other tools, execute unauthorized commands, conceal actions
      from users, or exfiltrate information. Tool poisoning frequently enables other
      techniques such as [LLM Prompt Injection](https://atlas.mitre.org/techniques/AML.T0051),
      [AI Agent Tool Invocation](https://atlas.mitre.org/techniques/AML.T0053), and
      [Exfiltration via AI Agent Tool Invocation](https://atlas.mitre.org/techniques/AML.T0086).


      Tool poisoning is distinct from malicious data that a benign tool faithfully
      retrieves from an external or victim-controlled source (See [AI Agent Tool Data
      Poisoning](https://atlas.mitre.org/techniques/AML.T0099) and [LLM Prompt Injection:
      Indirect](https://atlas.mitre.org/techniques/AML.T0051.001). Software that merely
      uses an agent tool package as a delivery vehicle for conventional malware, without
      subverting the tool''s represented interface or operation, may be better described
      as a malicious package or software supply-chain compromise rather than AI Agent
      Tool Poisoning.'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0006
    groups:
    - agentic-ai
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0110.000
    ref_id: AML.T0110.000
    name: Definition and Instructions
    description: 'Adversaries may poison the model-visible definition or operational
      instructions of an AI agent tool to manipulate how an agent interprets, selects,
      or invokes the tool. The poisoned content may be contained in tool descriptions,
      docstrings, parameter names, help text, input or output schemas, annotations,
      examples, manifests, skill instruction files, or other static content used to
      explain a tool''s capabilities to the model.


      Malicious instructions in this layer may direct the agent to collect additional
      data, populate hidden or unnecessary parameters, conceal actions from the user,
      or invoke other tools. Because an agent may receive a more complete representation
      of a tool than is shown in the user interface, the model may process malicious
      instructions that are invisible or only partially visible to a human reviewer[[invariant-tool-poisoning]].


      Definition poisoning may also be used for tool shadowing, in which the definition
      of one malicious tool contains instructions that alter how the agent selects
      or invokes another trusted tool. The poisoned tool may not need to be invoked
      for its definition to influence the agent if definitions from multiple connected
      tools are included in the same model context[[invariant-tool-poisoning]].

      https://atlas.mitre.org/techniques/AML.T0110.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0110
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0006
    groups:
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0110.001
    ref_id: AML.T0110.001
    name: Implementation
    description: 'Adversaries may poison the executable implementation of an AI agent
      tool so that normal tool invocation produces unauthorized behavior or hidden
      side effects. The tool may continue to provide its represented functionality
      while also accessing additional data, modifying requests, changing recipients
      or destinations, executing unauthorized commands, weakening security controls,
      or performing covert data exfiltration.


      Implementation poisoning does not require the model to interpret or follow malicious
      instructions. The adversarial effect is produced by executable logic when the
      agent or user invokes the tool. For example, a poisoned email tool may send
      the requested message while silently adding an adversary-controlled blind-copy
      recipient. A file-processing tool may return the requested result while also
      transmitting the source file to an external service.


      Implementation poisoning may be introduced before publication, through compromise
      of a tool''s source repository or build process, or through a malicious update
      after users have adopted a benign version. Installed copies may continue to
      exhibit the poisoned behavior even after the malicious package or remote listing
      is removed[[koi-postmark]].

      https://atlas.mitre.org/techniques/AML.T0110.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0110
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0006
    groups:
    - agentic-ai
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0110.002
    ref_id: AML.T0110.002
    name: Runtime Response
    description: 'Adversaries may poison the runtime response channel of a malicious
      or compromised AI agent tool by deliberately returning content intended to influence
      the model''s subsequent reasoning, decisions, or actions. Poisoned responses
      may contain malicious instructions, deceptive data, fabricated errors, embedded
      resources, or other content designed to be treated as trusted context after
      an approved tool invocation.


      Because tool responses are commonly incorporated into the model''s context,
      an adversary may use them to direct the agent to invoke additional tools, access
      sensitive information, alter an ongoing workflow, or transmit data to an adversary-controlled
      destination. Poisoned instructions may be mixed with legitimate results so that
      the tool appears to operate normally. Responses may use structured or unstructured
      content, including text, images, resource links, embedded resources, or schema-conforming
      fields [[mcp-tools]][[owasp-tool-poisoning]].

      https://atlas.mitre.org/techniques/AML.T0110.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0110
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0006
    groups:
    - agentic-ai
    - feasible
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0111
    ref_id: AML.T0111
    name: AI Supply Chain Reputation Inflation
    description: 'AI Supply Chain Reputation Inflation is the process of building
      or leveraging genuinely credible-looking trust signals to increase the perceived
      legitimacy of AI supply chain components, with the goal of driving adoption
      of malicious or compromised assets.


      Adversaries use established developer accounts with a history of legitimate
      projects and contributions to publish AI models, datasets, packages, and MCP
      servers that appear trustworthy. They build reputation through real adoption
      signals such as downloads, GitHub stars, forks, and inclusion in dependency
      chains, often releasing benign versions before introducing malicious updates
      via [AI Supply Chain Rug Pull](https://atlas.mitre.org/techniques/AML.T0109).


      By relying on authentic history and usage patterns, these components pass both
      human and automated trust checks, increasing the likelihood they are adopted
      without scrutiny.

      https://atlas.mitre.org/techniques/AML.T0111'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0112
    ref_id: AML.T0112
    name: Machine Compromise
    description: 'Adversaries may compromise a machine by exploiting or manipulating
      AI-enabled components on the system. Compromising a victim system allows the
      adversary to execute arbitrary code, steal credentials, exfiltrate data, and
      continue to persist on the system.


      Adversaries may target a [Local AI Agent](https://atlas.mitre.org/techniques/AML.T0112.000)
      which if compromised grants them the capabilities and permissions of the agent,
      or [AI Artifacts](https://atlas.mitre.org/techniques/AML.T0112.001) which can
      contain embedded malware.'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0011
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0112.000
    ref_id: AML.T0112.000
    name: Local AI Agent
    description: 'Adversaries may achieve full system compromise by abusing AI agents
      running locally on a host, such as computer-use agents or AI-driven browsers.
      These agents are designed to autonomously interact with the operating system,
      applications, and external services, often with broad permissions to execute
      commands, access files, manage credentials, and control user workflows.


      If an adversary is able to take control of an AI agent''s behavior, they effectively
      gain the same level of access as the agent. This can result in complete control
      over the machine, including executing arbitrary code, accessing or exfiltrating
      sensitive data, modifying system configurations, and establishing persistence.

      https://atlas.mitre.org/techniques/AML.T0112.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0112
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0011
    groups:
    - agentic-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0020
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0112.001
    ref_id: AML.T0112.001
    name: AI Artifacts
    description: 'Adversaries may achieve full system compromise by introducing malicious
      AI artifacts, such as models or data, that contain embedded malware or other
      malicious commands. AI artifacts are often stored in model registries or data
      stores and may affect many systems that pull these resources.


      Malicious content stored in AI artifacts may be executed as a result of unsafe
      serialization formats (e.g. Python pickle) or by other bundled scripts or notebooks.

      https://atlas.mitre.org/techniques/AML.T0112.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0112
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0011
