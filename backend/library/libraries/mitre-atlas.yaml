  - urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0048.004
    ref_id: AML.T0048.004
    name: AI Intellectual Property Theft
    description: 'Adversaries may exfiltrate AI artifacts to steal intellectual property
      and cause economic harm to the victim organization.


      Proprietary training data is costly to collect and annotate and may be a target
      for [Exfiltration](https://atlas.mitre.org/tactics/AML.TA0010) and theft.


      AIaaS providers charge for use of their API.

      An adversary who has stolen a model via [Exfiltration](https://atlas.mitre.org/tactics/AML.TA0010)
      or via [Extract AI Model](https://atlas.mitre.org/techniques/AML.T0024.002)
      now has unlimited use of that service without paying the owner of the intellectual
      property.

      https://atlas.mitre.org/techniques/AML.T0048.004'
    type: technique
    catalog_urn: urn:intuitem:risk:threat_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0048
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
