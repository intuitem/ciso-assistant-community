    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0007
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0115.001
    ref_id: AML.T0115.001
    name: Models
    description: 'Adversaries may publish poisoned AI models through model registries,
      code repositories, or other model distribution channels. The model may be newly
      created or a modified variant of a legitimate model and may contain manipulated
      weights, configurations, architecture, serialized code, or other components
      that produce malicious behavior or execute malicious code.


      Victims may subsequently download and integrate the model through [AI Supply
      Chain Compromise](https://atlas.mitre.org/techniques/AML.T0010).

      https://atlas.mitre.org/techniques/AML.T0115.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0115
