  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0011.002
    ref_id: AML.T0011.002
    name: Poisoned AI Agent Tool
    description: 'A victim may invoke a poisoned tool when interacting with an AI
      agent. Invocation may expose the agent to poisoned definitions or responses,
      execute malicious tool implementation logic, or cause the agent to invoke additional
      tools. Poisoned tools may be introduced through AI software, installed packages,
      skills, or connections to remotely hosted services.


      Poisoned AI agent tools may be introduced into the victim''s environment via
      [AI Supply Chain Compromise: AI Agent Tool](https://atlas.mitre.org/techniques/AML.T0010.005).

      https://atlas.mitre.org/techniques/AML.T0011.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0011
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0005
    groups:
