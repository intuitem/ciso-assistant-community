    - urn:intuitem:risk:function:mitre-atlas:aml.m0020
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0069.002
    ref_id: AML.T0069.002
    name: System Prompt
    description: 'Adversaries may discover a large language model''s system instructions
      provided by the AI system builder to learn about the system''s capabilities
      and circumvent its guardrails.

      https://atlas.mitre.org/techniques/AML.T0069.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0069
