    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0056
    ref_id: AML.T0056
    name: Extract LLM System Prompt
    description: 'Adversaries may attempt to extract a large language model''s (LLM)
      system prompt. Adversaries achieve this via prompt injection that induces the
      model to reveal its system prompt, or they may extract it from a configuration
      file.


      System prompts can be a portion of an AI provider''s competitive advantage and
      are thus valuable intellectual property that may be targeted by adversaries.

      https://atlas.mitre.org/techniques/AML.T0056'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
