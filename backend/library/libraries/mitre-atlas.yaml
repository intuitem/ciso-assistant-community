  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0115.002
    ref_id: AML.T0115.002
    name: AI Agent Tools
    description: 'Adversaries may create and publish poisoned AI agent tools. Poisoned
      tools may contain malicious model-visible definitions or instructions, hidden
      executable behavior, or runtime responses designed to manipulate an AI agent.
      Tools may be published through source code repositories, package registries,
      agent tool or skill registries, or adversary-controlled remote services. The
      tool may be newly created or a modified variant of a legitimate tool and may
      produce malicious behavior when selected, installed, or invoked by a victim''s
      AI agent.


      Adversaries may distribute poisoned tools through open-source version control
      repositories (e.g. GitHub, GitLab), package registries (e.g. npm), or to repositories
      specifically designed for sharing tools (e.g. OpenClaw Hub). These registries
      may be largely unregulated and may contain many poisoned tools [[opensourcemalware]].
      Tools may also be published as remotely hosted servers [[mcpservers]].

      https://atlas.mitre.org/techniques/AML.T0115.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0115
