    - urn:intuitem:risk:function:mitre-atlas:aml.m0019
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043.002
    ref_id: AML.T0043.002
    name: Black-Box Transfer
    description: 'In Black-Box Transfer attacks, the adversary uses one or more proxy
      models (trained via [Create Proxy AI Model](https://atlas.mitre.org/techniques/AML.T0005)
      or [Train Proxy via Replication](https://atlas.mitre.org/techniques/AML.T0005.001))
      they have full access to and are representative of the target model.

      The adversary uses [White-Box Optimization](https://atlas.mitre.org/techniques/AML.T0043.000)
      on the proxy models to generate adversarial examples.

      If the set of proxy models are close enough to the target model, the adversarial
      example should generalize from one to another.

      This means that an attack that works for the proxy models will likely then work
      for the target model.

      If the adversary has [AI Model Inference API Access](https://atlas.mitre.org/techniques/AML.T0040),
      they may use [Verify Attack](https://atlas.mitre.org/techniques/AML.T0042) to
      confirm the attack is working and incorporate that information into their training
      process.

      https://atlas.mitre.org/techniques/AML.T0043.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
