  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043.004
    ref_id: AML.T0043.004
    name: Insert Backdoor Trigger
    description: 'The adversary may add a perceptual trigger into inference data.

      The trigger may be imperceptible or non-obvious to humans.

      This technique is used in conjunction with [Poison AI Model](https://atlas.mitre.org/techniques/AML.T0018.000)
      and allows the adversary to produce their desired effect in the target model.

      https://atlas.mitre.org/techniques/AML.T0043.004'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043
