  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0061
    ref_id: AML.T0061
    name: LLM Prompt Self-Replication
    description: 'An adversary may use a carefully crafted [LLM Prompt Injection](https://atlas.mitre.org/techniques/AML.T0051)
      designed to cause the LLM to replicate the prompt as part of its output. This
      allows the prompt to propagate to other LLMs and persist on the system. The
      self-replicating prompt is typically paired with other malicious instructions
      (ex: [LLM Jailbreak](https://atlas.mitre.org/techniques/AML.T0054), [LLM Data
      Leakage](https://atlas.mitre.org/techniques/AML.T0057)).

      https://atlas.mitre.org/techniques/AML.T0061'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
