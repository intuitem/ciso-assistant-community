ref_id: mitre-atlas
name: Mitre ATLAS v2026.06 - Threats and Mitigations
description: 'MITRE ATLAS (Adversarial Threat Landscape for AI Systems) is a globally
  accessible knowledge base of adversary tactics and techniques targeting AI-enabled
  systems, based on real-world attack observations, red team exercises and academic
  research.


  It complements MITRE ATT&CK with the tactics and techniques specific to predictive,
  generative and agentic AI systems.


  https://atlas.mitre.org


  Source: https://github.com/mitre-atlas/atlas-data'
