    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0048.001
    ref_id: AML.T0048.001
    name: Reputational Harm
    description: 'Reputational harm involves a degradation of public perception and
      trust in organizations.  Examples of reputation-harming incidents include scandals
      or false impersonations.

      https://atlas.mitre.org/techniques/AML.T0048.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0048
