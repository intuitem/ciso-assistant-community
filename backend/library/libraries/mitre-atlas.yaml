  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0044
    ref_id: AML.T0044
    name: Full AI Model Access
    description: 'Adversaries may gain full "white-box" access to an AI model.

      This means the adversary has complete knowledge of the model architecture, its
      parameters, and class ontology.

      They may exfiltrate the model to [Craft Adversarial Data](https://atlas.mitre.org/techniques/AML.T0043)
      and [Verify Attack](https://atlas.mitre.org/techniques/AML.T0042) in an offline
      environment where it is hard to detect their behavior.

      https://atlas.mitre.org/techniques/AML.T0044'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0000
    groups:
