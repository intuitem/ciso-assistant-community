    - urn:intuitem:risk:function:mitre-atlas:aml.m0004
    - urn:intuitem:risk:function:mitre-atlas:aml.m0006
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0015
    ref_id: AML.T0015
    name: Evade AI Model
    description: 'Adversaries can [Craft Adversarial Data](https://atlas.mitre.org/techniques/AML.T0043)
      that prevents an AI model from correctly identifying the contents of the data
      or [Generate Deepfakes](https://atlas.mitre.org/techniques/AML.T0088) that fools
      an AI model expecting authentic data.


      This technique can be used to evade a downstream task where AI is utilized.
      The adversary may evade AI-based virus/malware detection or network scanning
      towards the goal of a traditional cyber attack. AI model evasion through deepfake
      generation may also provide initial access to systems that use AI-based biometric
      authentication.

      https://atlas.mitre.org/techniques/AML.T0015'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0004
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0011
