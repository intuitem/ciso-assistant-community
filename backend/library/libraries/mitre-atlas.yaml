    - urn:intuitem:risk:function:mitre-atlas:aml.m0008
    - urn:intuitem:risk:function:mitre-atlas:aml.m0016
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0115.000
    ref_id: AML.T0115.000
    name: Datasets
    description: 'Adversaries may publish poisoned datasets intended for training
      or fine-tuning AI models. The dataset may be newly created or a modified variant
      of a legitimate dataset and may contain manipulated samples, labels, annotations,
      or metadata.


      Adversaries may distribute poisoned datasets through dataset repositories, code
      repositories, file-sharing services, or compromised data sources. A victim that
      incorporates the dataset into a training pipeline may be affected by [Training
      Data Poisoning](https://atlas.mitre.org/techniques/AML.T0020), potentially through
      [AI Supply Chain Compromise](https://atlas.mitre.org/techniques/AML.T0010).

      https://atlas.mitre.org/techniques/AML.T0115.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0115
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
