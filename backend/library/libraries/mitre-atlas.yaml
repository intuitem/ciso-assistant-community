    - agentic-ai
    - feasible
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0005
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0113
    ref_id: AML.T0113
    name: Steal Web Session Cookie
    description: 'Adversaries may steal web application or service session cookies
      used to authenticate users to AI-enabled systems, AI services, or supporting
      enterprise applications.


      Web applications often use session cookies as authentication tokens after a
      user has signed in. These cookies may remain valid for extended periods of time,
      even when the application is not actively being used. In AI systems, session
      cookies may provide access to chat interfaces, AI agents, AI service consoles,
      customer support platforms, model management dashboards, or other tools connected
      to sensitive data and workflows.


      Adversaries may obtain session cookies from browser storage, process memory,
      network traffic, or applications that store authentication material in memory.
      They may also steal cookies by injecting malicious JavaScript into AI-rendered
      content, abusing unsafe rendering of LLM outputs, or tricking users or AI operators
      into opening poisoned content that executes in their browser.


      In attacks on AI systems, session cookie theft can allow adversaries to bypass
      normal authentication flows and gain access to privileged AI-enabled applications
      without knowing the victim''s username, password, or MFA secret. Stolen cookies
      may then be used with [Use Alternate Authentication Material: Web Session Cookie](https://atlas.mitre.org/techniques/AML.T0091.001)
      to access the corresponding service as the victim.

      https://atlas.mitre.org/techniques/AML.T0113'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0013
    groups:
    - enterprise
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0114
    ref_id: AML.T0114
    name: AI Service Web Interface
    description: 'Adversaries may communicate with compromised systems by abusing
      the web interface of an AI service as an intermediary command-and-control relay.
      Instead of connecting directly to attacker-controlled infrastructure or using
      an AI provider''s API, malware may open or automate a browser, embedded browser,
      or WebView component to interact with a public AI assistant.


      The malware may prompt the AI assistant to fetch an attacker-controlled URL,
      include victim data in URL parameters or prompt content, and return attacker-supplied
      content through the AI assistant''s response. The implant can then parse the
      response and execute embedded instructions.


      This technique is especially useful when an AI web interface permits anonymous
      or unauthenticated browsing, summarization, or URL-fetch behavior. In those
      cases, adversaries may avoid controls that depend on API keys, service accounts,
      user identities, or revocable credentials.


      This technique allows command-and-control traffic to blend into apparently legitimate
      AI web traffic to trusted service domains. In this pattern, the AI service acts
      as a proxy between the compromised system and attacker-controlled infrastructure,
      shifting detection from API key and account monitoring toward browser automation,
      prompt content, URL-fetch behavior, and AI service telemetry.

      https://atlas.mitre.org/techniques/AML.T0114'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0014
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0024
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0115
    ref_id: AML.T0115
    name: Publish Poisoned AI Artifacts
    description: 'Adversaries may create or modify AI artifacts and publish them through
      public or shared distribution channels to facilitate compromise of downstream
      AI systems. Poisoned AI artifacts may include datasets, models, and AI agent
      tools containing malicious content, behaviors, code, or configurations.


      Adversaries may publish novel artifacts or malicious variants of legitimate
      artifacts through dataset or model repositories, package registries, source
      code repositories, tool hubs, or remotely hosted services. Victims may subsequently
      acquire and integrate these artifacts through [AI Supply Chain Compromise](https://atlas.mitre.org/techniques/AML.T0010).

      https://atlas.mitre.org/techniques/AML.T0115'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    groups:
