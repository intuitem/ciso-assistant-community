    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0002
    - urn:intuitem:risk:function:mitre-atlas:aml.m0004
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0014
    ref_id: AML.T0014
    name: Discover AI Model Family
    description: 'Adversaries may discover the general family of a model.

      General information about the model may be revealed in documentation, or the
      adversary may use carefully constructed examples and analyze the model''s responses
      to categorize it.


      Knowledge of the model family can help the adversary identify means of attacking
      the model and help tailor the attack.

      https://atlas.mitre.org/techniques/AML.T0014'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0008
    groups:
    - predictive-ai
