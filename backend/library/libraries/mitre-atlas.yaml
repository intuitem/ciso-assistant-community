  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0035
    ref_id: AML.T0035
    name: AI Artifact Collection
    description: 'Adversaries may collect AI artifacts for [Exfiltration](https://atlas.mitre.org/tactics/AML.TA0010)
      or for use in [AI Attack Staging](https://atlas.mitre.org/tactics/AML.TA0001).

      AI artifacts include models and datasets as well as other telemetry data produced
      when interacting with a model.

      https://atlas.mitre.org/techniques/AML.T0035'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0009
    groups:
    - predictive-ai
