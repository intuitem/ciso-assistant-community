    - urn:intuitem:risk:function:mitre-atlas:aml.m0006
    - urn:intuitem:risk:function:mitre-atlas:aml.m0010
    - urn:intuitem:risk:function:mitre-atlas:aml.m0015
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043.003
    ref_id: AML.T0043.003
    name: Manual Modification
    description: 'Adversaries may manually modify the input data to craft adversarial
      data.

      They may use their knowledge of the target model to modify parts of the data
      they suspect helps the model in performing its task.

      The adversary may use trial and error until they are able to verify they have
      a working adversarial input.

      https://atlas.mitre.org/techniques/AML.T0043.003'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043
