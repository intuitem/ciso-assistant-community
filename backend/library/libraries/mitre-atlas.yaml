  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0062
    ref_id: AML.T0062
    name: Discover LLM Hallucinations
    description: 'Adversaries may prompt large language models and identify hallucinated
      entities.

      They may request software packages, commands, URLs, organization names, or e-mail
      addresses, and identify hallucinations with no connected real-world source.
      Discovered hallucinations provide the adversary with potential targets to [Publish
      Hallucinated Entities](https://atlas.mitre.org/techniques/AML.T0060). Different
      LLMs have been shown to produce the same hallucinations, so the hallucinations
      exploited by an adversary may affect users of other LLMs.

      https://atlas.mitre.org/techniques/AML.T0062'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
