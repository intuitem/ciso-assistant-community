  - urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0048
    ref_id: AML.T0048
    name: External Harms
    description: 'Adversaries may abuse their access to a victim system and use its
      resources or capabilities to further their goals by causing harms external to
      that system.

      These harms could affect the organization (e.g. Financial Harm, Reputational
      Harm), its users (e.g. User Harm), or the general public (e.g. Societal Harm).

      https://atlas.mitre.org/techniques/AML.T0048'
    type: technique
    catalog_urn: urn:intuitem:risk:threat_catalog:mitre-atlas
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - enterprise
    - realized
    - AML.TA0011
  - urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0048.000
    ref_id: AML.T0048.000
    name: Financial Harm
    description: 'Financial harm involves the loss of wealth, property, or other monetary
      assets due to theft, fraud or forgery, or pressure to provide financial resources
      to the adversary.

      https://atlas.mitre.org/techniques/AML.T0048.000'
    type: technique
    catalog_urn: urn:intuitem:risk:threat_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0048
