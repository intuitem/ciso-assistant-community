    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0020
    ref_id: AML.T0020
    name: Training Data Poisoning
    description: 'Adversaries may manipulate data used for training or fine-tuning
      an AI model to influence the resulting model''s behavior. Adversaries may add,
      remove, or modify data samples; alter labels or annotations; or manipulate feedback
      and data-collection processes.


      Training data poisoning may cause targeted errors, introduce biased or unsafe
      behavior, degrade model performance, or embed backdoors activated by specific
      inputs. The resulting behavior may persist in the trained model after the poisoned
      data is no longer accessible.


      Adversaries may poison data directly after gaining access to a training pipeline,
      or poisoned datasets may be introduced through [AI Supply Chain Compromise](https://atlas.mitre.org/techniques/AML.T0010).

      https://atlas.mitre.org/techniques/AML.T0020'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
