  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0018.003
    ref_id: AML.T0018.003
    name: Modify Prompt Construction Logic
    description: 'Adversaries may modify templates, role delimiters, embedded system
      instructions, tokenizer settings, tool-call formatting, or other artifact-bundled
      logic that constructs the context sent to an AI model. Model file formats such
      as GGUF can package this logic alongside model weights in a single distributable
      artifact. A compatible inference runtime may interpret the modified logic during
      future inference requests, enabling persistent covert instruction injection,
      altered instruction precedence, redirected tool use, or manipulated model output
      without changing model weights.

      https://atlas.mitre.org/techniques/AML.T0018.003'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0018
