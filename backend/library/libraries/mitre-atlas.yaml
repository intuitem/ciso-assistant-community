  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0024.002
    ref_id: AML.T0024.002
    name: Extract AI Model
    description: 'Adversaries may extract a functional copy of a private model.

      By repeatedly querying the victim''s [AI Model Inference API Access](https://atlas.mitre.org/techniques/AML.T0040),
      the adversary can collect the target model''s inferences into a dataset.

      The inferences are used as labels for training a separate model offline that
      will mimic the behavior and performance of the target model.


      Adversaries may extract the model to avoid paying per query in an artificial-intelligence-as-a-service
      (AIaaS) setting.

      Model extraction is used for [AI Intellectual Property Theft](https://atlas.mitre.org/techniques/AML.T0048.004).

      https://atlas.mitre.org/techniques/AML.T0024.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0024
