  - urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0051.002
    ref_id: AML.T0051.002
    name: Triggered
    description: 'An adversary may trigger a prompt injection via a user action or
      event that occurs within the victim''s environment. Triggered prompt injections
      often target AI agents, which can be activated by means the adversary identifies
      during [Discovery](https://atlas.mitre.org/tactics/AML.TA0008) (See [Activation
      Triggers](https://atlas.mitre.org/techniques/AML.T0084.002)). These malicious
      prompts may be hidden or obfuscated from the user and may already exist somewhere
      in the victim''s environment from the adversary performing [Prompt Infiltration
      via Public-Facing Application](https://atlas.mitre.org/techniques/AML.T0093).
      This type of injection may be used by the adversary to gain a foothold in the
      system or to target an unwitting user of the system.

      https://atlas.mitre.org/techniques/AML.T0051.002'
    type: technique
    catalog_urn: urn:intuitem:risk:threat_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0051
    groups:
