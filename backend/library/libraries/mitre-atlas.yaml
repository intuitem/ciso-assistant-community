    - enterprise
    - realized
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0040
    ref_id: AML.T0040
    name: AI Model Inference API Access
    description: 'Adversaries may gain access to a model via legitimate access to
      the inference API.

      Inference API access can be a source of information to the adversary ([Discover
      AI Model Ontology](https://atlas.mitre.org/techniques/AML.T0013), [Discover
      AI Model Family](https://atlas.mitre.org/techniques/AML.T0014)), a means of
      staging the attack ([Verify Attack](https://atlas.mitre.org/techniques/AML.T0042),
      [Craft Adversarial Data](https://atlas.mitre.org/techniques/AML.T0043)), or
      for introducing data to the target system for Impact ([Evade AI Model](https://atlas.mitre.org/techniques/AML.T0015),
      [Erode AI Model Integrity](https://atlas.mitre.org/techniques/AML.T0031)).


      Many systems rely on the same models provided via an inference API, which means
      they share the same vulnerabilities. This is especially true of foundation models
      which are prohibitively resource intensive to train. Adversaries may use their
      access to model APIs to identify vulnerabilities such as jailbreaks or hallucinations
      and then target applications that use the same models.

      https://atlas.mitre.org/techniques/AML.T0040'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0000
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0019
    - urn:intuitem:risk:function:mitre-atlas:aml.m0024
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0041
    ref_id: AML.T0041
    name: Physical Environment Access
    description: 'In addition to the attacks that take place purely in the digital
      domain, adversaries may also exploit the physical environment for their attacks.

      If the model is interacting with data collected from the real world in some
      way, the adversary can influence the model through access to wherever the data
      is being collected.

      By modifying the data in the collection process, the adversary can perform modified
      versions of attacks designed for digital access.

      https://atlas.mitre.org/techniques/AML.T0041'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0000
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0009
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0042
    ref_id: AML.T0042
    name: Verify Attack
    description: 'Adversaries can verify the efficacy of their attack via an inference
      API or access to an offline copy of the target model.

      This gives the adversary confidence that their approach works and allows them
      to carry out the attack at a later time of their choosing.

      The adversary may verify the attack once but use it against many edge devices
      running copies of the target model.

      The adversary may verify their attack digitally, then deploy it in the [Physical
      Environment Access](https://atlas.mitre.org/techniques/AML.T0041) at a later
      time.

      Verifying the attack may be hard to detect since the adversary can use a minimal
      number of queries or an offline copy of the model.

      https://atlas.mitre.org/techniques/AML.T0042'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0002
    - urn:intuitem:risk:function:mitre-atlas:aml.m0004
    - urn:intuitem:risk:function:mitre-atlas:aml.m0005
    - urn:intuitem:risk:function:mitre-atlas:aml.m0019
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043
    ref_id: AML.T0043
    name: Craft Adversarial Data
    description: 'Adversarial data are inputs to an AI model that have been modified
      such that they cause the adversary''s desired effect in the target model.

      Effects can range from misclassification, to missed detections, to maximizing
      energy consumption.

      Typically, the modification is constrained in magnitude or location so that
      a human still perceives the data as if it were unmodified, but human perceptibility
      may not always be a concern depending on the adversary''s intended effect.

      For example, an adversarial input for an image classification task is an image
      the AI model would misclassify, but a human would still recognize as containing
      the correct class.


      Depending on the adversary''s knowledge of and access to the target model, the
      adversary may use different classes of algorithms to develop the adversarial
      example such as [White-Box Optimization](https://atlas.mitre.org/techniques/AML.T0043.000),
      [Black-Box Optimization](https://atlas.mitre.org/techniques/AML.T0043.001),
      [Black-Box Transfer](https://atlas.mitre.org/techniques/AML.T0043.002), or [Manual
      Modification](https://atlas.mitre.org/techniques/AML.T0043.003).


      The adversary may perform [Verify Attack](https://atlas.mitre.org/techniques/AML.T0042)
      to confirm that their approach works if they have white-box or inference API
      access to the model.

      This allows the adversary to gain confidence their attack is effective in a
      live environment where their attack may be noticed.

      They can then use the attack at a later time to accomplish their goals.

      An adversary may optimize adversarial examples for [Evade AI Model](https://atlas.mitre.org/techniques/AML.T0015),
      or to [Erode AI Model Integrity](https://atlas.mitre.org/techniques/AML.T0031).'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
    - predictive-ai
