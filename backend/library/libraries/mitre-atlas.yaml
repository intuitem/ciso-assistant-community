    - urn:intuitem:risk:function:mitre-atlas:aml.m0014
    - urn:intuitem:risk:function:mitre-atlas:aml.m0025
    - urn:intuitem:risk:function:mitre-atlas:aml.m0035
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0010.003
    ref_id: AML.T0010.003
    name: Model
    description: 'AI-enabled systems often rely on open-source models in various ways.

      Most commonly, the victim organization may be using these models for fine-tuning.

      These models will be downloaded from an external source and then used as the
      base for the model as it is tuned on a smaller, private dataset.

      Loading models often requires executing some saved code in the form of a saved
      model file.

      These can be compromised with traditional malware, or through some adversarial
      AI techniques.

      https://atlas.mitre.org/techniques/AML.T0010.003'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0010
