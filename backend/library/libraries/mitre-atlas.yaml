  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0005.001
    ref_id: AML.T0005.001
    name: Train Proxy via Replication
    description: 'Adversaries may replicate a private model.

      By repeatedly querying the victim''s [AI Model Inference API Access](https://atlas.mitre.org/techniques/AML.T0040),
      the adversary can collect the target model''s inferences into a dataset.

      The inferences are used as labels for training a separate model offline that
      will mimic the behavior and performance of the target model.


      A replicated model that closely mimics the target model is a valuable resource
      in staging the attack.

      The adversary can use the replicated model to [Craft Adversarial Data](https://atlas.mitre.org/techniques/AML.T0043)
      for various purposes (e.g. [Evade AI Model](https://atlas.mitre.org/techniques/AML.T0015),
      [Spamming AI System with Chaff Data](https://atlas.mitre.org/techniques/AML.T0046)).

      https://atlas.mitre.org/techniques/AML.T0005.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0005
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0002
    - urn:intuitem:risk:function:mitre-atlas:aml.m0004
    - urn:intuitem:risk:function:mitre-atlas:aml.m0024
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0005.002
    ref_id: AML.T0005.002
    name: Use Pre-Trained Model
    description: 'Adversaries may use an off-the-shelf pre-trained model as a proxy
      for the victim model to aid in staging the attack.

      https://atlas.mitre.org/techniques/AML.T0005.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0005
