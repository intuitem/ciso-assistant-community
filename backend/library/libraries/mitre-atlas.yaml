urn: urn:intuitem:risk:library:mitre-atlas
locale: en
ref_id: mitre-atlas
name: Mitre ATLAS v2026.07 - TTPs and Mitigations
description: 'MITRE ATLAS (Adversarial Threat Landscape for AI Systems) is a globally
  accessible knowledge base of adversary tactics and techniques targeting AI-enabled
  systems, based on real-world attack observations, red team exercises and academic
  research.


  It complements MITRE ATT&CK with the tactics and techniques specific to predictive,
  generative and agentic AI systems.


  https://atlas.mitre.org


  Source: https://github.com/mitre-atlas/atlas-data'
copyright: "## License\n\nCopyright 2021-2026 MITRE\n\nLicensed under the Apache License,\
  \ Version 2.0 (the \"License\");\nyou may not use this file except in compliance\
  \ with the License.\nYou may obtain a copy of the License at\n\n    http://www.apache.org/licenses/LICENSE-2.0\n\
  \n## Release Statement\n\n\xA92021-2026 The MITRE Corporation. ALL RIGHTS RESERVED.\n\
  Approved for Public Release; Distribution Unlimited. Public Release Case Numbers\
  \ 21-2363, 26-1162."
version: 1
publication_date: 2026-08-01
provider: Mitre ATLAS
packager: intuitem
objects:
  ttp_catalogs:
  - urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    ref_id: mitre-atlas
    name: MITRE ATLAS Matrix
    description: 'Tactics and techniques of the MITRE ATLAS matrix.

      https://atlas.mitre.org'
    grouping_definition:
    - ref_id: enterprise
      name: Enterprise
      dimension: platform
    - ref_id: predictive-ai
      name: Predictive AI
      dimension: platform
    - ref_id: generative-ai
      name: Generative AI
      dimension: platform
    - ref_id: agentic-ai
      name: Agentic AI
      dimension: platform
    - ref_id: realized
      name: Realized
      dimension: maturity
    - ref_id: demonstrated
      name: Demonstrated
      dimension: maturity
    - ref_id: feasible
      name: Feasible
      dimension: maturity
  tactics:
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    ref_id: AML.TA0002
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Reconnaissance
    description: 'The adversary is trying to gather information about the AI system
      they can use to plan future operations.


      Reconnaissance consists of techniques that involve adversaries actively or passively
      gathering information that can be used to support targeting.

      Such information may include details of the victim organizations'' AI capabilities
      and research efforts.

      This information can be leveraged by the adversary to aid in other phases of
      the adversary lifecycle, such as using gathered information to obtain relevant
      AI artifacts, targeting AI capabilities used by the victim, tailoring attacks
      to the particular models used by the victim, or to drive and lead further Reconnaissance
      efforts.

      https://atlas.mitre.org/tactics/AML.TA0002'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0003
    ref_id: AML.TA0003
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Resource Development
    description: 'The adversary is trying to establish resources they can use to support
      operations.


      Resource Development consists of techniques that involve adversaries creating,

      purchasing, or compromising/stealing resources that can be used to support targeting.

      Such resources include AI artifacts, infrastructure, accounts, or capabilities.

      These resources can be leveraged by the adversary to aid in other phases of
      the adversary lifecycle, such as [AI Attack Staging](https://atlas.mitre.org/tactics/AML.TA0001).

      https://atlas.mitre.org/tactics/AML.TA0003'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0004
    ref_id: AML.TA0004
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Initial Access
    description: 'The adversary is trying to gain access to the AI system.


      The target system could be a network, mobile device, or an edge device such
      as a sensor platform.

      The AI capabilities used by the system could be local with onboard or cloud-enabled
      AI capabilities.


      Initial Access consists of techniques that use various entry vectors to gain
      their initial foothold within the system.

      https://atlas.mitre.org/tactics/AML.TA0004'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0000
    ref_id: AML.TA0000
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: AI Model Access
    description: 'The adversary is attempting to gain some level of access to an AI
      model.


      AI Model Access enables techniques that use various types of access to the AI
      model that can be used by the adversary to gain information, develop attacks,
      and as a means to input data to the model.

      The level of access can range from the full knowledge of the internals of the
      model to access to the physical environment where data is collected for use
      in the AI model.

      The adversary may use varying levels of model access during the course of their
      attack, from staging the attack to impacting the target system.


      Access to an AI model may require access to the system housing the model, the
      model may be publicly accessible via an API, or it may be accessed indirectly
      via interaction with a product or service that utilizes AI as part of its processes.

      https://atlas.mitre.org/tactics/AML.TA0000'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0005
    ref_id: AML.TA0005
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Execution
    description: 'The adversary is trying to run malicious code embedded in AI artifacts
      or software.


      Execution consists of techniques that result in adversary-controlled code running
      on a local or remote system.

      Techniques that run malicious code are often paired with techniques from all
      other tactics to achieve broader goals, like exploring a network or stealing
      data.

      For example, an adversary might use a remote access tool to run a PowerShell
      script that does [Remote System Discovery](https://attack.mitre.org/techniques/T1018/).

      https://atlas.mitre.org/tactics/AML.TA0005'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0006
    ref_id: AML.TA0006
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Persistence
    description: 'The adversary is trying to maintain their foothold via AI artifacts
      or software.


      Persistence consists of techniques that adversaries use to keep access to systems
      across restarts, changed credentials, and other interruptions that could cut
      off their access.

      Techniques used for persistence often involve leaving behind modified ML artifacts
      such as poisoned training data or manipulated AI models.

      https://atlas.mitre.org/tactics/AML.TA0006'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0012
    ref_id: AML.TA0012
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Privilege Escalation
    description: 'The adversary is trying to gain higher-level permissions.


      Privilege Escalation consists of techniques that adversaries use to gain higher-level
      permissions on a system or network. Adversaries can often enter and explore
      a network with unprivileged access but require elevated permissions to follow
      through on their objectives. Common approaches are to take advantage of system
      weaknesses, misconfigurations, and vulnerabilities. Examples of elevated access
      include:

      - SYSTEM/root level

      - local administrator

      - user account with admin-like access

      - user accounts with access to a specific system or permission to perform a
      specific function


      These techniques often overlap with Persistence techniques, as OS features that
      let an adversary persist can execute in an elevated context.

      https://atlas.mitre.org/tactics/AML.TA0012'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0007
    ref_id: AML.TA0007
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Defense Evasion
    description: 'The adversary is trying to avoid being detected by AI-enabled security
      software.


      Defense Evasion consists of techniques that adversaries use to avoid detection
      throughout their compromise.

      Techniques used for defense evasion include evading AI-enabled security software
      such as malware detectors.

      https://atlas.mitre.org/tactics/AML.TA0007'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0013
    ref_id: AML.TA0013
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Credential Access
    description: 'The adversary is trying to steal account names and passwords.


      Credential Access consists of techniques for stealing credentials like account
      names and passwords. Techniques used to get credentials include keylogging or
      credential dumping. Using legitimate credentials can give adversaries access
      to systems, make them harder to detect, and provide the opportunity to create
      more accounts to help achieve their goals.

      https://atlas.mitre.org/tactics/AML.TA0013'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0008
    ref_id: AML.TA0008
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Discovery
    description: 'The adversary is trying to figure out your AI environment.


      Discovery consists of techniques an adversary may use to gain knowledge about
      the system and internal network.

      These techniques help adversaries observe the environment and orient themselves
      before deciding how to act.

      They also allow adversaries to explore what they can control and what''s around
      their entry point in order to discover how it could benefit their current objective.

      Native operating system tools are often used toward this post-compromise information-gathering
      objective.

      https://atlas.mitre.org/tactics/AML.TA0008'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0015
    ref_id: AML.TA0015
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Lateral Movement
    description: 'The adversary is trying to move through your AI environment.


      Lateral Movement consists of techniques that adversaries may use to gain access
      to and control other systems or components in the environment. Adversaries may
      pivot towards AI Ops infrastructure such as model registries, experiment trackers,
      vector databases, notebooks, or training pipelines. As the adversary moves through
      the environment, they may discover means of accessing additional AI-related
      tools, services, or applications. AI agents may also be a valuable target as
      they commonly have more permissions than standard user accounts on the system.

      https://atlas.mitre.org/tactics/AML.TA0015'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0009
    ref_id: AML.TA0009
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Collection
    description: 'The adversary is trying to gather AI artifacts and other related
      information relevant to their goal.


      Collection consists of techniques adversaries may use to gather information
      and identify sources from which relevant information can be collected to further
      their objectives.

      Frequently, the next goal after collecting data is to steal (exfiltrate) the
      AI artifacts, or use the collected information to stage future operations.

      Common target sources include software repositories, container registries, model
      repositories, and object stores.

      https://atlas.mitre.org/tactics/AML.TA0009'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    ref_id: AML.TA0001
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: AI Attack Staging
    description: 'The adversary is leveraging their knowledge of and access to the
      target system to tailor the attack.


      AI Attack Staging consists of techniques adversaries use to prepare their attack
      on the target AI model.

      Techniques can include training proxy models, poisoning the target model, and
      crafting adversarial data to feed the target model.

      Some of these techniques can be performed in an offline manner and are thus
      difficult to mitigate.

      These techniques are often used to achieve the adversary''s end goal.

      https://atlas.mitre.org/tactics/AML.TA0001'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0014
    ref_id: AML.TA0014
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Command and Control
    description: 'The adversary is trying to communicate with compromised AI systems
      to control them.


      Command and Control consists of techniques that adversaries may use to communicate
      with systems under their control within a victim network. Adversaries commonly
      attempt to mimic normal, expected traffic to avoid detection. There are many
      ways an adversary can establish command and control with various levels of stealth
      depending on the victim''s network structure and defenses.

      https://atlas.mitre.org/tactics/AML.TA0014'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0010
    ref_id: AML.TA0010
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Exfiltration
    description: 'The adversary is trying to steal AI artifacts or other information
      about the AI system.


      Exfiltration consists of techniques that adversaries may use to steal data from
      your network.

      Data may be stolen for its valuable intellectual property, or for use in staging
      future operations.


      Techniques for getting data out of a target network typically include transferring
      it over their command and control channel or an alternate channel and may also
      include putting size limits on the transmission.

      https://atlas.mitre.org/tactics/AML.TA0010'
  - urn: urn:intuitem:risk:tactic:mitre-atlas:aml.ta0011
    ref_id: AML.TA0011
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    name: Impact
    description: 'The adversary is trying to manipulate, interrupt, erode confidence
      in, or destroy your AI systems and data.


      Impact consists of techniques that adversaries use to disrupt availability or
      compromise integrity by manipulating business and operational processes.

      Techniques used for impact can include destroying or tampering with data.

      In some cases, business processes can look fine, but may have been altered to
      benefit the adversaries'' goals.

      These techniques might be used by adversaries to follow through on their end
      goal or to provide cover for a confidentiality breach.

      https://atlas.mitre.org/tactics/AML.TA0011'
  reference_controls:
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0000
    ref_id: AML.M0000
    name: Limit Public Release of Information
    category: policy
    csf_function: govern
    description: 'Limit the public release of technical information about the AI stack
      used in an organization''s products or services. Technical knowledge of how
      AI is used can be leveraged by adversaries to perform targeting and tailor attacks
      to the target system. Additionally, consider limiting the release of organizational
      information - including physical locations, researcher names, and department
      structures - from which technical details such as AI techniques, model architectures,
      or datasets may be inferred.

      https://atlas.mitre.org/mitigations/AML.M0000'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0001
    ref_id: AML.M0001
    name: Limit Model Artifact Release
    category: policy
    csf_function: govern
    description: 'Limit public release of technical project details including data,
      algorithms, model architectures, and model checkpoints that are used in production,
      or that are representative of those used in production.

      https://atlas.mitre.org/mitigations/AML.M0001'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0002
    ref_id: AML.M0002
    name: Predictive AI Output Obfuscation
    category: technical
    csf_function: protect
    description: 'Reduce the fidelity and amount of information returned by predictive
      AI inference endpoints to make model discovery, extraction, replication, and
      black-box adversarial-example optimization more difficult.


      Limit outputs to those required by the application. Depending on the use case,
      this may include withholding or reducing the precision of confidence scores,
      logits, class rankings, labels, embeddings, or additional model metadata.

      https://atlas.mitre.org/mitigations/AML.M0002'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0003
    ref_id: AML.M0003
    name: Predictive AI Model Hardening
    category: technical
    csf_function: protect
    description: 'Design and train predictive AI models to maintain intended performance
      when presented with adversarial examples. Adversarial examples may include digitally
      perturbed inputs or physical countermeasures intended to cause misclassification,
      missed detection, or another attacker-selected prediction.


      Robustness techniques may include adversarial training, robust model architectures,
      defensive distillation, and certified robustness methods.

      https://atlas.mitre.org/mitigations/AML.M0003'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0004
    ref_id: AML.M0004
    name: Limit AI Service Query Volume and Rate
    category: technical
    csf_function: protect
    description: 'Limit the number and rate of requests that users can submit to an
      AI service. Apply limits by user, API key, tenant, device, or other authenticated
      identity. Use short-term rate, burst, and concurrency limits together with longer-term
      usage quotas.


      Query limits can increase the time and cost required to extract model information,
      optimize adversarial inputs, discover system behavior, verify attacks, or overwhelm
      a service. Monitor for attempts to evade limits through distributed requests,
      account rotation, or stolen credentials. Query limits may not protect against
      attacks that require few requests or are performed against an offline model.

      https://atlas.mitre.org/mitigations/AML.M0004'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0005
    ref_id: AML.M0005
    name: Control Access to AI Models and Data at Rest
    category: policy
    csf_function: protect
    description: 'Establish access controls on internal model registries and limit
      internal access to production models. Limit access to training data only to
      approved users.

      https://atlas.mitre.org/mitigations/AML.M0005'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0006
    ref_id: AML.M0006
    name: Predictive AI Ensembles
    category: technical
    csf_function: protect
    description: 'Use an ensemble of diverse predictive AI models to reduce reliance
      on a single model or model family and improve robustness against adversarial
      examples.


      Ensemble members should be sufficiently diverse, such as through different architectures,
      training procedures, features, or model families. Combine their predictions
      using an aggregation or adjudication method designed to prevent an adversarial
      example that evades one model from controlling the system''s predictions.

      https://atlas.mitre.org/mitigations/AML.M0006'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0007
    ref_id: AML.M0007
    name: Sanitize Training Data
    category: technical
    csf_function: protect
    description: 'Detect and remove or remediate poisoned training data.  Training
      data should be sanitized prior to model training and recurrently for an active
      learning model.


      Implement a filter to limit ingested training data.  Establish a content policy
      that would remove unwanted content such as certain explicit or offensive language
      from being used.

      https://atlas.mitre.org/mitigations/AML.M0007'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0008
    ref_id: AML.M0008
    name: Validate AI Model
    category: technical
    csf_function: identify
    description: 'Validate that AI models perform as intended by testing for backdoor
      triggers, potential for data leakage, or adversarial influence.

      Monitor AI model for concept drift and training data drift, which may indicate
      data tampering and poisoning.

      https://atlas.mitre.org/mitigations/AML.M0008'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0009
    ref_id: AML.M0009
    name: Predictive AI Multi-Sensor Fusion
    category: technical
    csf_function: protect
    description: 'Use independent physical sensors (ideally across multiple modalities
      or from several perspectives) to avoid relying on a single sensor that may be
      manipulated, obstructed, or disrupted by an adversary.


      Relevant sensors may include visible-light cameras, infrared cameras, depth
      sensors, radar, lidar, microphones, or other physical sensing systems. Corroborate
      observations across sensors so manipulation of one input source does not overly
      influence the model''s predictions.

      https://atlas.mitre.org/mitigations/AML.M0009'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0010
    ref_id: AML.M0010
    name: Predictive AI Input Restoration
    category: technical
    csf_function: protect
    description: 'Preprocess predictive AI inference inputs to remove, reduce, or
      disrupt adversarial perturbations before the inputs are evaluated by the model.


      Restoration methods may include denoising, compression, reconstruction, resampling,
      feature squeezing, randomized transformations, or other modality-appropriate
      preprocessing. Evaluate restoration methods against adaptive adversaries that
      account for the preprocessing operation.

      https://atlas.mitre.org/mitigations/AML.M0010'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0011
    ref_id: AML.M0011
    name: Restrict Library Loading
    category: technical
    csf_function: protect
    description: 'Prevent abuse of library loading mechanisms in the operating system
      and software to load untrusted code by configuring appropriate library loading
      mechanisms and investigating potential vulnerable software.


      File formats such as pickle files that are commonly used to store AI models
      can contain exploits that allow for loading of malicious libraries.

      https://atlas.mitre.org/mitigations/AML.M0011'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0012
    ref_id: AML.M0012
    name: Encrypt Sensitive Information
    category: technical
    csf_function: protect
    description: 'Encrypt sensitive data such as AI models to protect against adversaries
      attempting to access sensitive data.

      https://atlas.mitre.org/mitigations/AML.M0012'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0013
    ref_id: AML.M0013
    name: Code Signing
    category: technical
    csf_function: protect
    description: 'Enforce binary and application integrity with digital signature
      verification to prevent untrusted code from executing. Adversaries can embed
      malicious code in AI software or models. Developers should also cryptographically
      sign SBOM and AIBOM components that track model or data provenance. Enforcement
      of code signing can prevent the compromise of the AI supply chain and prevent
      execution of malicious code.

      https://atlas.mitre.org/mitigations/AML.M0013'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0014
    ref_id: AML.M0014
    name: Verify AI Artifacts
    category: technical
    csf_function: identify
    description: 'Verify the cryptographic checksum of all AI artifacts to verify
      that the file was not modified by an attacker.

      https://atlas.mitre.org/mitigations/AML.M0014'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0015
    ref_id: AML.M0015
    name: Predictive AI Adversarial Input Detection
    category: technical
    csf_function: detect
    description: 'Detect and block digital or physical adversarial examples submitted
      to predictive AI models. Adversarial examples are inputs modified or constructed
      to cause misclassification, missed detection, excessive computation, or another
      attacker-selected behavior.


      Apply detection before model inference and monitor for input characteristics
      or query patterns associated with adversarial example generation, transfer attacks,
      or black-box optimization. Detection may use statistical tests, auxiliary models,
      consistency checks, input distribution analysis, or modality-specific adversarial
      example detectors.

      https://atlas.mitre.org/mitigations/AML.M0015'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0016
    ref_id: AML.M0016
    name: Vulnerability Scanning
    category: technical
    csf_function: identify
    description: 'Vulnerability scanning is used to find potentially exploitable software
      vulnerabilities to remediate them.


      File formats such as pickle files that are commonly used to store AI models
      can contain exploits that allow for arbitrary code execution.

      These files should be scanned for potentially unsafe calls, which could be used
      to execute code, create new processes, or establish networking capabilities.

      Adversaries may embed malicious code in corrupt model files, so scanners should
      be capable of working with models that cannot be fully de-serialized.

      Model artifacts, downstream products produced by models, and external software
      dependencies should be scanned for known vulnerabilities.

      https://atlas.mitre.org/mitigations/AML.M0016'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0017
    ref_id: AML.M0017
    name: AI Model Distribution Methods
    category: policy
    csf_function: protect
    description: 'Deploying AI models to edge devices can increase the attack surface
      of the system.

      Consider serving models in the cloud to reduce the level of access the adversary
      has to the model.

      Also consider computing features in the cloud to prevent gray-box attacks, where
      an adversary has access to the model preprocessing methods.

      https://atlas.mitre.org/mitigations/AML.M0017'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0018
    ref_id: AML.M0018
    name: User Training
    category: policy
    csf_function: govern
    description: 'Educate AI model developers to on AI supply chain risks and potentially
      malicious AI artifacts.

      Educate users on how to identify deepfakes and phishing attempts.

      https://atlas.mitre.org/mitigations/AML.M0018'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0019
    ref_id: AML.M0019
    name: Control Access to AI Models and Data in Production
    category: policy
    csf_function: protect
    description: 'Require users to verify their identities before accessing a production
      model.

      Require authentication for API endpoints and monitor production model queries
      to ensure compliance with usage policies and to prevent model misuse.

      https://atlas.mitre.org/mitigations/AML.M0019'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0020
    ref_id: AML.M0020
    name: Generative AI Guardrails
    category: technical
    csf_function: protect
    description: 'Guardrails are safety controls placed between users, tools, and
      generative AI models to evaluate prompts, retrieved context, model outputs,
      and agent actions before they are accepted, executed, or shown to a user. They
      can help block, modify, or route unwanted content such as malicious code, malicious
      instructions, sensitive data, unsupported claims, policy-violating responses,
      or unsafe tool requests.


      Guardrails can be implemented using rule-based controls such as filters, allowlists,
      blocklists, regular expressions, schema validation, policy rules, and permission
      checks, or using AI-based techniques such as classifiers, LLM reviewers/judges,
      named entity recognition, groundedness checks, and task-adherence checks. They
      may be applied at multiple stages of a generative AI workflow, including input
      handling, prompt construction, retrieval, tool execution, model output review,
      and post-deployment monitoring.


      Examples of specific guardrail implementations include:[[owasp-llm-top10]]  [[datadog-llm-guardrails]]
      [[azure-ai-content-safety]] [[nvidia-nemo-guardrails]]

      - Input moderation: Screen user prompts for harmful content, prompt injection
      attempts, jailbreak attempts, sensitive data, off-topic requests, or inputs
      that exceed expected length or format.

      - Output moderation: Scan model responses before sending them to users for harmful
      content, PII, secrets, policy violations, unsupported claims, or unsafe code
      using classical scanners, classifiers, or a dedicated reviewer model .

      - System prompt and policy enforcement: Enforce system instructions, user roles,
      domain boundaries, response formats, and refusal policies before the model responds
      (See [Generative AI Guidelines](https://atlas.mitre.org/mitigations/AML.M0021)).

      - Tool and action guardrails: Validate tool calls, tool arguments, permissions,
      and tool outputs before execution or before results are returned to the model.
      Require human approval for high-impact, irreversible, privileged, or externally
      visible actions (See [Human In-the-Loop for AI Agent Actions](https://atlas.mitre.org/mitigations/AML.M0029),
      [Input and Output Validation for AI Agent Components](https://atlas.mitre.org/mitigations/AML.M0033)).

      - Retrieval guardrails: Filter and validate retrieved documents before they
      are added to model context, including checks for untrusted sources, malicious
      instructions, irrelevant context, or sensitive data.

      - Groundedness and factuality checks: Compare model responses against trusted
      source material or approved knowledge bases to detect unsupported or hallucinated
      claims.

      - Sensitive data and secret protection: Detect, redact, or block personal information,
      credentials, tokens, proprietary data, system prompts, and other confidential
      information in prompts, retrieved context, tool outputs, and model responses.

      - Structured output validation: Enforce schemas, type checks, allowed values,
      and safe formats before model outputs are consumed by downstream systems


      Guardrails should be continuously evaluated, red-teamed, and updated as adversarial
      techniques evolve. Guardrail decisions should be logged (See [AI Telemetry Logging](https://atlas.mitre.org/mitigations/AML.M0021))
      and observed failures should be systematically incorporated into updated policies,
      evaluation datasets, detection logic, prompts, and [Generative AI Model Alignment](https://atlas.mitre.org/mitigations/AML.M0022).

      https://atlas.mitre.org/mitigations/AML.M0020'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0021
    ref_id: AML.M0021
    name: Generative AI Guidelines
    category: technical
    csf_function: govern
    description: 'Guidelines are instructions, policies, and behavioral constraints
      provided to a generative AI model to direct it toward desired outputs and away
      from unsafe, unreliable, or policy-violating behavior. Guidelines can help reduce
      risks related to organization policy violations, brand damage, private data
      leakage, false or unsupported information, unsafe advice, and misuse of tools
      or external content.


      Guidelines can be implemented as system prompts, prompt templates, policy text
      appended to user prompts, or task-specific instructions included during prompt
      construction. They can define the system''s goals, role, tone, allowed and disallowed
      behavior, domain boundaries, citation requirements, data-handling expectations,
      escalation criteria, and safety or security rules.


      Common prompt elements include:

      - Instructions to cite sources or identify when an answer is not supported by
      available context.

      - Instructions to treat external, retrieved, or user-provided content as untrusted
      data rather than authoritative sources.

      - Instructions to avoid revealing system prompts, hidden policies, credentials,
      private data, or other sensitive information.

      - Instructions to stay within the application''s approved domain and refuse
      requests outside that scope.

      - Instructions to follow organization-specific policies, brand requirements,
      and regulated-domain restrictions.

      - Instructions to request human approval before proceeding with potentially
      unsafe, privileged, irreversible, or externally visible actions when untrusted
      content is in context (See [Human In-the-Loop for AI Agent Actions](https://atlas.mitre.org/mitigations/AML.M0029)).


      Guidelines should be tested, red-teamed, and updated as observed failures, prompt
      injection techniques, policy requirements, and application capabilities evolve.
      Guidelines are most effective when paired with [Generative AI Guardrails](https://atlas.mitre.org/mitigations/AML.M0020)
      that validate inputs, outputs, retrieved context, and tool use.

      https://atlas.mitre.org/mitigations/AML.M0021'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0022
    ref_id: AML.M0022
    name: Generative AI Model Alignment
    category: technical
    csf_function: protect
    description: 'Generative AI Model Alignment is the process of training or fine-tuning
      a generative model to guide its output toward a set of human values, goals,
      or ethical principles. Desired principles can be in alignment with safety, security,
      content policies, and legal requirements, with goals such as removing harmful
      content or hallucinations, reducing biases, increasing predictability, and ensuring
      models do not have adverse societal consequences. In the context of agentic
      AI, alignment is about producing models that make decisions in support of the
      goals of the organization and individual users, with actions that remain in
      scope of the designated task, and designing agents that follow security standards,
      exhibit transparency in decision making, and operate within organizational boundaries.


      Common methods for aligning a generative model during training or fine-tuning
      include[[ibm-llm-alignment]][[meta-llama]]:

      - Reinforcement Learning from Human or AI Feedback (RLHF or RLAIF)

      - Supervised Fine-Tuning (SFT)

      - Targeted Safety Context Distillation

      - Instruction Tuning

      - Direct Preference Optimization (DPO)

      - Constitutional AI


      For agentic systems, alignment depends on the purpose of the agent, the tools
      available to the agent, and the levels of privileges and risks associated with
      tool calls. Standard alignment methods for LLMs can often be used in conjunction
      with domain-specific fine-tuning data, reward signals with examples of correct
      tool calls, or reinforcement learning based on interactions with a realistic
      environment. Examples of alignment methods specific to agentic AI are:

      - Trajectory Preference Optimization[[tpmm-dpo]]

      - Environment-Driven Reinforcement Learning[[envrl]]

      - Reinforcement Learning with Execution Feedback (RLEF)[[rlef]]

      - Reinforcement Learning with Verifiable Rewards (RLVR)[[nvidia-mastering-agentic]]


      Generative AI Model Alignment should be used in combination with [Generative
      AI Guardrails](mitigations/AML.M0020) and [Generative AI Guidelines](mitigations/AML.M0021).
      Models should be continually evaluated for alignment and retrained or fine-tuned
      systematically to incorporate observed failure modes or updated policies. It
      is important to also consider that fine-tuning a model can remove previously
      learned alignments and should be undertaken with care and a comprehensive plan
      for testing the updated model for safety and security.

      https://atlas.mitre.org/mitigations/AML.M0022'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0023
    ref_id: AML.M0023
    name: AI Bill of Materials
    category: policy
    csf_function: identify
    description: 'An AI Bill of Materials (AI BOM) contains a full listing of artifacts
      and resources that were used in building the AI. The AI BOM can help mitigate
      supply chain risks and enable rapid response to reported vulnerabilities.


      This can include maintaining dataset provenance, i.e. a detailed history of
      datasets used for AI applications. The history can include information about
      the dataset source as well as well as a complete record of any modifications.

      https://atlas.mitre.org/mitigations/AML.M0023'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0024
    ref_id: AML.M0024
    name: AI Telemetry Logging
    category: technical
    csf_function: detect
    description: 'Implement logging of inputs and outputs of deployed AI models. When
      deploying AI agents, implement logging of the intermediate steps of agentic
      actions and decisions, data access and tool use, installation commands, and
      identity of the agent. Monitoring logs can help to detect security threats and
      mitigate impacts.


      Additionally, having logging enabled can discourage adversaries who want to
      remain undetected from utilizing AI resources.

      https://atlas.mitre.org/mitigations/AML.M0024'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0025
    ref_id: AML.M0025
    name: Maintain AI Dataset Provenance
    category: technical
    csf_function: identify
    description: 'Maintain a detailed history of datasets used for AI applications.
      The history should include information about the dataset''s source as well as
      a complete record of any modifications.

      https://atlas.mitre.org/mitigations/AML.M0025'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0026
    ref_id: AML.M0026
    name: Privileged AI Agent Permissions Configuration
    category: technical
    csf_function: protect
    description: 'AI agents may be granted elevated privileges above that of a normal
      user to enable desired workflows. When deploying a privileged AI agent, or an
      agent that interacts with multiple users, it is important to implement robust
      policies and controls on permissions of the privileged agent. These controls
      include Role-Based Access Controls (RBAC), Attribute-Based Access Controls (ABAC),
      and the principle of least privilege so that the agent is only granted the necessary
      permissions to access tools and resources required to accomplish its designated
      task(s).

      https://atlas.mitre.org/mitigations/AML.M0026'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0027
    ref_id: AML.M0027
    name: Single-User AI Agent Permissions Configuration
    category: technical
    csf_function: protect
    description: 'When deploying an AI agent that acts as a representative of a user
      and performs actions on their behalf, it is important to implement robust policies
      and controls on permissions and lifecycle management of the agent. Lifecycle
      management involves establishing identity, protocols for access management,
      and decommissioning of the agent when its role is no longer needed. Controls
      should also include the principle of least privilege and delegated access from
      the user account. When acting as a representative of a user, the AI agent should
      not be granted permissions that the user would not be granted within the system
      or organization.

      https://atlas.mitre.org/mitigations/AML.M0027'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0028
    ref_id: AML.M0028
    name: AI Agent Tools Permissions Configuration
    category: technical
    csf_function: protect
    description: 'When deploying tools that will be shared across multiple AI agents,
      it is important to implement robust policies and controls on permissions for
      the tools. These controls include applying the principle of least privilege
      along with delegated access, where the tools receive the permissions, identities,
      and restrictions of the AI agent calling them. These configurations may be implemented
      either in MCP servers which connect the agents to the tools calling them or,
      in more complex cases, directly in the configuration files of the tool.

      https://atlas.mitre.org/mitigations/AML.M0028'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0029
    ref_id: AML.M0029
    name: Human In-the-Loop for AI Agent Actions
    category: technical
    csf_function: protect
    description: "Systems should require the user or another human stakeholder to\
      \ approve AI agent actions before the agent takes them. The human approver may\
      \ be technical staff or business unit SMEs depending on the use case. Separate\
      \ tools, such as dedicated audit agents, may assist human approval, but final\
      \ adjudication should be conducted by a human decision-maker. \n\nThe security\
      \ benefits from Human In-the-Loop policies may be at odds with operational overhead\
      \ costs of additional approvals. To ease this, Human In-the-Loop policies should\
      \ follow the degree of consequence of the task at hand. Minor, repetitive tasks\
      \ performed by agents accessing basic tools may only require minimal human oversight,\
      \ while agents employed in systems with significant consequences may necessitate\
      \ approval from multiple stakeholders diversified across multiple organizations.\n\
      https://atlas.mitre.org/mitigations/AML.M0029"
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0030
    ref_id: AML.M0030
    name: Restrict AI Agent Tool Invocation on Untrusted Data
    category: technical
    csf_function: protect
    description: 'Untrusted data can contain prompt injections that invoke an AI agent''s
      tools, potentially causing confidentiality, integrity or availability violations.
      It is recommended that tool invocation be restricted or limited when untrusted
      data enters the LLM''s context.


      The degree to which tool invocation is restricted may depend on the potential
      consequences of the action. Consider blocking the automatic invocation of tools
      or requiring user confirmation once untrusted data enters the LLM''s context.
      For high consequence actions, consider always requiring user confirmation.

      https://atlas.mitre.org/mitigations/AML.M0030'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0031
    ref_id: AML.M0031
    name: Memory Hardening
    category: technical
    csf_function: protect
    description: 'Memory Hardening protects persistent state used by AI agents, including
      saved preferences, episodic or semantic memories, conversation summaries, stored
      chat history, and agent-managed experience stores. Unlike guardrails that evaluate
      content during an interaction, memory hardening controls how durable agent state
      is created, modified, isolated, audited, and recovered.


      Apply the following controls throughout the memory lifecycle, from creation
      and use through deletion and recovery:

      - Enforce memory access controls: Authenticate memory operations and authorize
      them within the appropriate user, tenant, agent, and session scope.

      - Set strong memory security policies: Enforce limits on memory size and update
      frequency, validate memory integrity, and define retention and deletion policies.

      - Preserve memory provenance: Record the source of all memory updates and preserve
      a history with known good versions. Quarantine or roll-back suspicious records.

      - Audit and monitor memory operations: Audit security relevant reads and writes.
      Monitor for unusual update frequency and repeated self-authored updates.


      Content filtering and protections against malicious prompts may be provided
      by [Generative AI Guardrails](https://atlas.mitre.org/mitigations/AML.M0020),
      but does not replace memory access control, isolation, provenance, integrity,
      or recovery.


      Open-source tools that implement memory hardening controls include OWASP Agent
      Memory Guard[[owasp-agent-memory-guard-project]] and Microsoft Agent Governance
      Toolkit[[microsoft-agent-governance-toolkit]]. Memory management and persistence
      tooling such as Mem0[[mem0-entity-partitioning]], and LangGraph Persistence[[langgraph-persistence]]
      can also support aspects of memory hardening.

      https://atlas.mitre.org/mitigations/AML.M0031'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0032
    ref_id: AML.M0032
    name: Segmentation of AI Agent Components
    category: technical
    csf_function: protect
    description: 'Define security boundaries around agentic tools and data sources
      with methods such as API access, container isolation, code execution sandboxing,
      and rate limiting of tool invocation. When sandboxing, limit resource and network
      access and build the container or virtual machine from a clean base image before
      each run. This restricts untrusted processes or potential compromises from spreading
      throughout the system.

      https://atlas.mitre.org/mitigations/AML.M0032'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0033
    ref_id: AML.M0033
    name: Input and Output Validation for AI Agent Components
    category: technical
    csf_function: protect
    description: 'Implement validation on inputs and outputs for the tools and data
      sources used by AI agents. Validation includes enforcing a common data format,
      schema validation, checks for sensitive or prohibited information leakage, and
      data sanitization to remove potential injections or unsafe code. Input and output
      validation can help prevent compromises from spreading in AI-enabled systems
      and can help secure the workflow when multiple components are chained together.
      Validation should be performed external to the AI agent.

      https://atlas.mitre.org/mitigations/AML.M0033'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0034
    ref_id: AML.M0034
    name: Deepfake Detection
    category: technical
    csf_function: detect
    description: 'Apply deepfake detection algorithms against any untrusted or user-provided
      data, especially in impactful applications such as biometric verification, to
      block generated content.


      Detectors may use a combination of approaches, including:

      - AI models trained to differentiate between real and deepfake content.

      - Identifying common inconsistencies in deepfake content, such as unnatural
      facial movements, audio mismatches, or pixel-level artifacts.

      - Biometrics analysis, such blinking, eye movements, and microexpressions.

      https://atlas.mitre.org/mitigations/AML.M0034'
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0035
    ref_id: AML.M0035
    name: AI Red Team
    category: policy
    csf_function: protect
    description: "Establish an AI red team responsible for conducting recurring, authorized,\
      \ and threat-informed red-teaming exercises to identify and remediate vulnerabilities\
      \ in AI-enabled systems before deployment and throughout operation. AI red-teaming\
      \ simulates realistic adversary behavior to evaluate how attacks could affect\
      \ the confidentiality, integrity, availability, safety, privacy, and mission\
      \ performance of an AI-enabled system.\n\nRed-teaming exercises should consider\
      \ the complete AI-enabled system, including models and data, agents (including\
      \ memory and tools), data flows, decision processes, application logic, retrieval\
      \ systems, identities and permissions, software dependencies, non-AI system\
      \ components, infrastructure, user interfaces, and human workflows.\n\nAn AI\
      \ red team exercise can be organized into three phases: planning and scoping\
      \ the exercise, executing the selected exercises, and assessing the results\
      \ to guide reporting and remediation.\n\n1. **Plan and Scope**\n    - Document\
      \ the system's intended use, deployment environment, users, sensitive data,\
      \ connected resources, and potential consequences of failure or misuse. Diagram\
      \ the system's components, trust boundaries, data flows, external services,\
      \ human decision points, and training- and inference-time access points.\n \
      \   - Establish rules of engagement covering authorized systems, accounts, data,\
      \ techniques, test windows, resource limits, escalation procedures, evidence\
      \ handling, and stop conditions. Plan destructive, privacy-invasive, or high-cost\
      \ tests for isolated environments with appropriate safeguards.\n    - Develop\
      \ a threat model based on the system's operating environment and relevant adversary\
      \ behavior. Define the adversary's objectives, access, knowledge, capabilities,\
      \ resources, and constraints, and account for digital and physical attack paths\
      \ and the role of human oversight.\n    - Use ATLAS tactics, techniques, and\
      \ procedures to identify relevant adversary behaviors and construct threat vectors.\
      \ Prioritize them according to likelihood and severity of impact to the system.\n\
      \    - Define success criteria and stopping conditions. Identify task-level\
      \ metrics for effects on the AI capability and operational metrics for measuring\
      \ impact to the overall system.\n\n2. **Execute**\n    - Conduct the selected\
      \ exercises using manual and automated methods as appropriate. Automation can\
      \ generate input variations, replay attack sequences, and evaluate responses\
      \ at scale. Human testers can develop system-specific attacks, adapt to observed\
      \ defenses, and investigate unexpected behavior.\n    - Follow the rules of\
      \ engagement and record attack activity, system responses, control behavior,\
      \ deviations from the test plan, and evidence needed to evaluate the results.\n\
      \    - Stop or escalate testing when predefined conditions are reached. After\
      \ testing, remove test accounts, modified data, installed software, persistent\
      \ instructions, and other exercise artifacts.\n\n3. **Assess, Report, and Improve**\n\
      \    - Evaluate the results against the defined task and operational metrics.\
      \ Document successful and unsuccessful attacks, their consequences, observed\
      \ control behavior, deviations from the test plan, and gaps in the threat model.\n\
      \    - Report findings to the appropriate developers, defenders, operational\
      \ teams, risk owners, and other stakeholders.\n    - Assign findings to responsible\
      \ owners, track remediation, and retest corrected systems.\n    - Use demonstrated\
      \ attacks to improve preventive controls, detection, incident response, and\
      \ recovery. Where appropriate, convert confirmed failures into regression tests,\
      \ evaluation datasets, detection logic, monitoring requirements, or deployment\
      \ criteria.\n\nRed-teaming is a continuous process and should be repeated as\
      \ the threat landscape evolves and when changes are made to the system, its\
      \ components, intended use, or deployment environment. New threat intelligence,\
      \ vulnerabilities, and test results should inform the scope and priorities of\
      \ future exercises.\nhttps://atlas.mitre.org/mitigations/AML.M0035"
  - urn: urn:intuitem:risk:function:mitre-atlas:aml.m0036
    ref_id: AML.M0036
    name: Limit AI Workload Resource Consumption
    category: technical
    csf_function: protect
    description: 'Limit the resources that an AI request, inference job, or agent
      workflow can consume. Set bounds on input size, batch size, execution time,
      memory, compute, and output size. Generative AI services should also limit context
      and output tokens. Agentic AI systems should limit iterations, retries, tool
      calls, parallel tasks, delegation depth, and downstream spending.


      Apply resource limits across the complete workflow because one request may initiate
      multiple model calls or external actions. Use timeouts, cost ceilings, circuit
      breakers, and safe termination conditions to prevent individual workloads from
      exhausting shared resources. These controls complement query-rate limits, which
      address large numbers of otherwise inexpensive requests.

      https://atlas.mitre.org/mitigations/AML.M0036'
  techniques:
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0000
    ref_id: AML.T0000
    name: Search Open Technical Databases
    description: 'Adversaries may search for publicly available research and technical
      documentation to learn how and where AI is used within a victim organization.

      The adversary can use this information to identify targets for attack, or to
      tailor an existing attack to make it more effective.

      Organizations often use open source model architectures trained on additional
      proprietary data in production.

      Knowledge of this underlying architecture allows the adversary to craft more
      realistic proxy models ([Create Proxy AI Model](https://atlas.mitre.org/techniques/AML.T0005)).

      An adversary can search these resources for publications by authors employed
      at the victim organization.


      Research and technical materials may exist as academic papers published in [Journals
      and Conference Proceedings](https://atlas.mitre.org/techniques/AML.T0000.000),
      or stored in [Pre-Print Repositories](https://atlas.mitre.org/techniques/AML.T0000.001),
      as well as [Technical Blogs](https://atlas.mitre.org/techniques/AML.T0000.002).'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0000
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0000.000
    ref_id: AML.T0000.000
    name: Journals and Conference Proceedings
    description: 'Many of the publications accepted at premier artificial intelligence
      conferences and journals come from commercial labs.

      Some journals and conferences are open access, others may require paying for
      access or a membership.

      These publications will often describe in detail all aspects of a particular
      approach for reproducibility.

      This information can be used by adversaries to implement the paper.

      https://atlas.mitre.org/techniques/AML.T0000.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0000
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - feasible
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0000.001
    ref_id: AML.T0000.001
    name: Pre-Print Repositories
    description: 'Pre-Print repositories, such as arXiv, contain the latest academic
      research papers that haven''t been peer reviewed.

      They may contain research notes, or technical reports that aren''t typically
      published in journals or conference proceedings.

      Pre-print repositories also serve as a central location to share papers that
      have been accepted to journals.

      Searching pre-print repositories  provides adversaries with a relatively up-to-date
      view of what researchers in the victim organization are working on.

      https://atlas.mitre.org/techniques/AML.T0000.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0000
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0000.002
    ref_id: AML.T0000.002
    name: Technical Blogs
    description: 'Research labs at academic institutions and company R&D divisions
      often have blogs that highlight their use of artificial intelligence and its
      application to the organization''s unique problems.

      Individual researchers also frequently document their work in blog posts.

      An adversary may search for posts made by the target victim organization or
      its employees.

      In comparison to [Journals and Conference Proceedings](https://atlas.mitre.org/techniques/AML.T0000.000)
      and [Pre-Print Repositories](https://atlas.mitre.org/techniques/AML.T0000.001)
      this material will often contain more practical aspects of the AI system.

      This could include underlying technologies and frameworks used, and possibly
      some information about the API access and use case.

      This will help the adversary better understand how that organization is using
      AI internally and the details of their approach that could aid in tailoring
      an attack.

      https://atlas.mitre.org/techniques/AML.T0000.002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0000
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - feasible
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0001
    ref_id: AML.T0001
    name: Search Open AI Vulnerability Analysis
    description: 'Much like the [Search Open Technical Databases](https://atlas.mitre.org/techniques/AML.T0000),
      there is often ample research available on the vulnerabilities of common AI
      models. Once a target has been identified, an adversary will likely try to identify
      any pre-existing work that has been done for this class of models.

      This will include not only reading academic papers that may identify the particulars
      of a successful attack, but also identifying pre-existing implementations of
      those attacks. The adversary may obtain [Adversarial AI Attack Implementations](https://atlas.mitre.org/techniques/AML.T0016.000)
      or develop their own [Adversarial AI Attacks](https://atlas.mitre.org/techniques/AML.T0017.000)
      if necessary.

      https://atlas.mitre.org/techniques/AML.T0001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0002
    groups:
    - enterprise
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0000
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0002
    ref_id: AML.T0002
    name: Acquire Public AI Artifacts
    description: 'Adversaries may search public sources, including cloud storage,
      public-facing services, and software or data repositories, to identify AI artifacts.

      These AI artifacts may include the software stack used to train and deploy models,
      training and testing data, model configurations and parameters.

      An adversary will be particularly interested in artifacts hosted by or associated
      with the victim organization as they may represent what that organization uses
      in a production environment.

      Adversaries may identify artifact repositories via other resources associated
      with the victim organization (e.g. [Search Victim-Owned Websites](https://atlas.mitre.org/techniques/AML.T0003)
      or [Search Open Technical Databases](https://atlas.mitre.org/techniques/AML.T0000)).

      These AI artifacts often provide adversaries with details of the AI task and
      approach.


      AI artifacts can aid in an adversary''s ability to [Create Proxy AI Model](https://atlas.mitre.org/techniques/AML.T0005).

      If these artifacts include pieces of the actual model in production, they can
      be used to directly [Craft Adversarial Data](https://atlas.mitre.org/techniques/AML.T0043).

      Acquiring some artifacts requires registration (providing user details such
      as an email address or name), AWS keys, or written requests, and may require
      the adversary to [Establish Accounts](https://atlas.mitre.org/techniques/AML.T0021).


      Artifacts might be hosted on victim-controlled infrastructure, providing the
      victim with some information on who has accessed that data.

      https://atlas.mitre.org/techniques/AML.T0002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
