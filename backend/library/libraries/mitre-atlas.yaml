  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043.000
    ref_id: AML.T0043.000
    name: White-Box Optimization
    description: 'In White-Box Optimization, the adversary has full access to the
      target model and optimizes the adversarial example directly.

      Adversarial examples trained in this manner are most effective against the target
      model.

      https://atlas.mitre.org/techniques/AML.T0043.000'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
    - predictive-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0003
    - urn:intuitem:risk:function:mitre-atlas:aml.m0005
    - urn:intuitem:risk:function:mitre-atlas:aml.m0006
    - urn:intuitem:risk:function:mitre-atlas:aml.m0010
    - urn:intuitem:risk:function:mitre-atlas:aml.m0015
    - urn:intuitem:risk:function:mitre-atlas:aml.m0017
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043.001
    ref_id: AML.T0043.001
    name: Black-Box Optimization
    description: 'In Black-Box attacks, the adversary has black-box (i.e. [AI Model
      Inference API Access](https://atlas.mitre.org/techniques/AML.T0040) via API
      access) access to the target model.

      With black-box attacks, the adversary may be using an API that the victim is
      monitoring.

      These attacks are generally less effective and require more inferences than
      [White-Box Optimization](https://atlas.mitre.org/techniques/AML.T0043.000) attacks,
      but they require much less access.

      https://atlas.mitre.org/techniques/AML.T0043.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0043
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0001
    groups:
    - predictive-ai
    - demonstrated
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0002
    - urn:intuitem:risk:function:mitre-atlas:aml.m0003
    - urn:intuitem:risk:function:mitre-atlas:aml.m0004
