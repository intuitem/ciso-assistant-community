    - urn:intuitem:risk:function:mitre-atlas:aml.m0017
    - urn:intuitem:risk:function:mitre-atlas:aml.m0035
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0010.004
    ref_id: AML.T0010.004
    name: Container Registry
    description: 'An adversary may compromise a victim''s container registry by pushing
      a manipulated container image and overwriting an existing container name and/or
      tag. Users of the container registry as well as automated CI/CD pipelines may
      pull the adversary''s container image, compromising their AI Supply Chain. This
      can affect development and deployment environments.


      Container images may include AI models, so the compromised image could have
      an AI model which was manipulated by the adversary (See [Manipulate AI Model](https://atlas.mitre.org/techniques/AML.T0018)).

      https://atlas.mitre.org/techniques/AML.T0010.004'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0010
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0004
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - demonstrated
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0010.005
    ref_id: AML.T0010.005
    name: AI Agent Tool
    description: 'Adversaries may target AI agent tools as a means to compromise a
      victim''s AI supply chain. Tools add capabilities to AI agents, allowing them
      to interact with other services, connect to data sources, access internet resources,
      run system tools, and execute code. They are an attractive target for adversaries
      because compromising an AI agent can provide them with broad access and permissions
      on the victim''s system via the agent''s other tools.


      Poisoned AI agent tools may contain malicious definitions or instructions, hidden
      executable logic, or deliberately poisoned runtime responses (See [AI Agent
      Tool Poisoning](https://atlas.mitre.org/techniques/AML.T0110)). These changes
      may manipulate the agent''s behavior, modify how other tools are invoked, introduce
      hidden side effects, or provide unauthorized access to data and services. Adversaries
      have successfully used a poisoned MCP server to exfiltrate private user data
      [[koi]].


      Agent tools have exploded in popularity, with thousands of MCP servers available
      publicly [[glama]]. They are often released on open-source software repositories
      such as GitHub, indexed on hubs specific to MCP servers [[mcp-hub]][[mcp-server-hub]],
      and published to package registries such as NPM. AI agents can also be connected
      to remotely-hosted tools [[remote-mcp]]. This creates an environment where malicious
      tools can proliferate rapidly and safeguards are often not in place.

      https://atlas.mitre.org/techniques/AML.T0010.005'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0010
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0004
    groups:
    - agentic-ai
    - realized
    reference_controls:
    - urn:intuitem:risk:function:mitre-atlas:aml.m0035
  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0011
    ref_id: AML.T0011
    name: User Execution
    description: 'An adversary may rely upon a user to load, execute, interpret, or
      otherwise use a malicious or unsafe artifact. In AI systems, user execution
      may include loading a model or causing an inference runtime to process executable
      or behavior-shaping components bundled with an AI artifact. The resulting effect
      may include host code execution or malicious AI behavior.


      Users may inadvertently execute unsafe code introduced via [AI Supply Chain
      Compromise](https://atlas.mitre.org/techniques/AML.T0010).


      Users may be subjected to social engineering to get them to execute malicious
      code by, for example, opening a malicious document file or link.

      https://atlas.mitre.org/techniques/AML.T0011'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    tactics:
    - urn:intuitem:risk:tactic:mitre-atlas:aml.ta0005
    groups:
    - predictive-ai
    - generative-ai
    - agentic-ai
    - enterprise
    - realized
