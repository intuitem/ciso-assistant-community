    - urn:intuitem:risk:function:mitre-atlas:aml.m0027
    - urn:intuitem:risk:function:mitre-atlas:aml.m0032
  - urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0085.001
    ref_id: AML.T0085.001
    name: AI Agent Tools
    description: 'Adversaries may prompt the AI service to invoke various tools the
      agent has access to. Tools may retrieve data from different APIs or services
      in an organization.

      https://atlas.mitre.org/techniques/AML.T0085.001'
    type: technique
    catalog_urn: urn:intuitem:risk:threat_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:threat:mitre-atlas:aml.t0085
    groups:
    - agentic-ai
