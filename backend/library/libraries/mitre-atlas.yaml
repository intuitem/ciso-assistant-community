  - urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0011.001
    ref_id: AML.T0011.001
    name: Malicious Package
    description: 'Adversaries may develop malicious software packages that when imported
      by a user have a deleterious effect.

      Malicious packages may behave as expected to the user. They may be introduced
      via [AI Supply Chain Compromise](https://atlas.mitre.org/techniques/AML.T0010).
      They may not present as obviously malicious to the user and may appear to be
      useful for an AI-related task.

      https://atlas.mitre.org/techniques/AML.T0011.001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-atlas
    parent_urn: urn:intuitem:risk:technique:mitre-atlas:aml.t0011
