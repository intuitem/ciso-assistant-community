urn: urn:intuitem:risk:library:iso27701-2025
locale: en
ref_id: iso27701-2025
name: "ISO 27701-2025 \u2014 Privacy information management systems \u2014 Requirements\
  \ and Controls outline"
description: "Outline of ISO/IEC 27701:2025 \u2014 Privacy information management\
  \ system (PIMS), with Annex A reference controls for PII controllers (A.1), PII\
  \ processors (A.2) and the information security controls shared by both (A.3).\n\
  You can purchase the standard for full details."
copyright: ISO - You can purchase the standard for full details.
version: 2
publication_date: 2026-11-25
provider: ISO
packager: intuitem
objects:
  framework:
    urn: urn:intuitem:risk:framework:iso27701-2025
    ref_id: iso27701-2025
    name: "ISO 27701-2025 \u2014 Privacy information management systems \u2014 Requirements\
      \ and Controls outline"
    description: "Outline of ISO/IEC 27701:2025 \u2014 Privacy information management\
      \ system (PIMS), with Annex A reference controls for PII controllers (A.1),\
      \ PII processors (A.2) and the information security controls shared by both\
      \ (A.3).\nYou can purchase the standard for full details."
    min_score: 0
    max_score: 5
    scores_definition:
    - score: 0
      name: Incomplete
      description: Ad hoc and unknown
    - score: 1
      name: Initial
      description: Unpredictable and reactive
    - score: 2
      name: Managed
      description: Managed on the project level
    - score: 3
      name: Defined
      description: Proactive, rather than reactive
    - score: 4
      name: Quantitatively managed
      description: Measured and controlled
    - score: 5
      name: Optimizing
      description: Stable and flexible
    implementation_groups_definition:
    - ref_id: clauses
      name: Clauses
      description: PIMS requirements, clauses 4 to 10
      translations:
        nl:
          name: Hoofdstukken
    - ref_id: controller
      name: PII controller controls
      description: Annex A, Table A.1
      translations:
        nl:
          name: Beheersmaatregelen voor verwerkingsverantwoordelijken
    - ref_id: processor
      name: PII processor controls
      description: Annex A, Table A.2
      translations:
        nl:
          name: Beheersmaatregelen voor verwerkers
    - ref_id: shared
      name: Shared information security controls
      description: Annex A, Table A.3
      translations:
        nl:
          name: Gedeelde beheersmaatregelen voor informatiebeveiliging
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:iso27701-2025:4
      assessable: false
      depth: 1
      ref_id: '4'
      name: Context of the organization
      description: Requirements for establishing the organizational context of the
        PIMS.
      translations:
        nl:
          name: Context van de organisatie
          description: Eisen voor het vastleggen van de context van de organisatie
            voor het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:4.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:4
      ref_id: '4.1'
      name: Understanding the organization and its context
      description: Determine internal and external issues relevant to privacy, including
        applicable privacy legislation, and whether climate change is a relevant issue.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Inzicht in de organisatie en haar context
          description: Bepaal de interne en externe kwesties die van belang zijn voor
            privacy, waaronder de geldende privacywetgeving, en of klimaatverandering
            een relevante kwestie is.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:4.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:4
      ref_id: '4.2'
      name: Understanding the needs and expectations of interested parties
      description: Identify interested parties and their privacy-related requirements,
        including PII principals and regulators; these can include requirements related
        to climate change.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Inzicht in de behoeften en verwachtingen van belanghebbenden
          description: Bepaal de belanghebbenden en hun eisen op het gebied van privacy,
            onder wie betrokkenen en toezichthouders; die eisen kunnen ook over klimaatverandering
            gaan.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:4.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:4
      ref_id: '4.3'
      name: Determining the scope of the privacy information management system
      description: Define the boundaries and applicability of the PIMS, including
        the roles of PII controller and PII processor.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Bepalen van de reikwijdte van het managementsysteem voor privacy-informatie
          description: Leg de grenzen en de toepasbaarheid van het PIMS vast, inclusief
            de rollen van verwerkingsverantwoordelijke en verwerker.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:4.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:4
      ref_id: '4.4'
      name: Privacy information management system
      description: Establish, implement, maintain and continually improve the PIMS.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Managementsysteem voor privacy-informatie
          description: Richt het PIMS in, voer het in, houd het in stand en verbeter
            het voortdurend.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:5
      assessable: false
      depth: 1
      ref_id: '5'
      name: Leadership
      description: Requirements for top management commitment and direction of the
        PIMS.
      translations:
        nl:
          name: Leiderschap
          description: Eisen voor de betrokkenheid en sturing van de directie bij
            het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:5.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:5
      ref_id: '5.1'
      name: Leadership and commitment
      description: Demonstrate top management commitment to the PIMS and the protection
        of PII.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Leiderschap en betrokkenheid
          description: Toon de betrokkenheid van de directie bij het PIMS en bij de
            bescherming van persoonsgegevens.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:5.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:5
      ref_id: '5.2'
      name: Privacy policy
      description: Establish, communicate and make available a privacy policy appropriate
        to the organization.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Privacybeleid
          description: Stel een privacybeleid op dat bij de organisatie past, communiceer
            het en maak het beschikbaar.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:5.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:5
      ref_id: '5.3'
      name: Roles, responsibilities and authorities
      description: Assign and communicate privacy roles, responsibilities and authorities.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Rollen, verantwoordelijkheden en bevoegdheden
          description: Wijs rollen, verantwoordelijkheden en bevoegdheden voor privacy
            toe en communiceer ze.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:6
      assessable: false
      depth: 1
      ref_id: '6'
      name: Planning
      description: Requirements for planning the PIMS.
      translations:
        nl:
          name: Planning
          description: Eisen voor het plannen van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:6.1
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:6
      ref_id: '6.1'
      name: Actions to address risks and opportunities
      description: Requirements for addressing privacy risks and opportunities.
      translations:
        nl:
          name: Maatregelen om risico's en kansen aan te pakken
          description: Eisen voor het aanpakken van privacyrisico's en -kansen.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:6.1.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:6.1
      ref_id: 6.1.1
      name: General
      description: Consider issues and requirements when planning actions to address
        risks and opportunities.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Algemeen
          description: Houd bij het plannen van maatregelen voor risico's en kansen
            rekening met de kwesties en eisen.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:6.1.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:6.1
      ref_id: 6.1.2
      name: Privacy risk assessment
      description: Define and apply a privacy risk assessment process, including risks
        to PII principals.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Privacyrisicobeoordeling
          description: Leg een proces vast voor het beoordelen van privacyrisico's,
            ook voor betrokkenen, en pas het toe.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:6.1.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:6.1
      ref_id: 6.1.3
      name: Privacy risk treatment
      description: Define and apply a privacy risk treatment process, select controls
        and produce a Statement of Applicability against Annex A.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Privacyrisicobehandeling
          description: Leg een proces vast voor het behandelen van privacyrisico's
            en pas het toe, kies beheersmaatregelen en stel een verklaring van toepasselijkheid
            op tegen bijlage A.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:6.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:6
      ref_id: '6.2'
      name: Privacy objectives and planning to achieve them
      description: Establish measurable privacy objectives and plan how to achieve
        them.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Privacydoelstellingen en de planning om ze te halen
          description: Stel meetbare privacydoelen vast en plan hoe die worden gehaald.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:6.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:6
      ref_id: '6.3'
      name: Planning of changes
      description: Plan changes to the PIMS in a controlled manner.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Planning van wijzigingen
          description: Plan wijzigingen in het PIMS op een beheerste manier.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7
      assessable: false
      depth: 1
      ref_id: '7'
      name: Support
      description: Requirements for the resources and support of the PIMS.
      translations:
        nl:
          name: Ondersteuning
          description: Eisen voor de middelen en ondersteuning van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7
      ref_id: '7.1'
      name: Resources
      description: Determine and provide the resources needed for the PIMS.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Middelen
          description: Bepaal welke middelen het PIMS nodig heeft en stel ze beschikbaar.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7
      ref_id: '7.2'
      name: Competence
      description: Ensure the competence of persons performing privacy-related work.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Competentie
          description: Zorg dat mensen die werk op het gebied van privacy doen daarvoor
            bekwaam zijn.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7
      ref_id: '7.3'
      name: Awareness
      description: Ensure awareness of the privacy policy, individual contributions
        and consequences of nonconformity.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Bewustzijn
          description: Zorg dat mensen het privacybeleid kennen, weten wat hun eigen
            bijdrage is en wat de gevolgen zijn als eisen niet worden nageleefd.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.4
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7
      ref_id: '7.4'
      name: Communication
      description: Determine internal and external communications relevant to the
        PIMS.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Communicatie
          description: Bepaal welke interne en externe communicatie voor het PIMS
            van belang is.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.5
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7
      ref_id: '7.5'
      name: Documented information
      description: Requirements for documented information of the PIMS.
      translations:
        nl:
          name: Gedocumenteerde informatie
          description: Eisen voor de gedocumenteerde informatie van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.5.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7.5
      ref_id: 7.5.1
      name: General
      description: Maintain the documented information required by the standard and
        by the organization.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Algemeen
          description: Houd de gedocumenteerde informatie bij die de norm en de organisatie
            vragen.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.5.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7.5
      ref_id: 7.5.2
      name: Creating and updating documented information
      description: Ensure appropriate identification, format and review of documented
        information.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Opstellen en bijwerken van gedocumenteerde informatie
          description: Zorg voor een juiste aanduiding, vorm en beoordeling van gedocumenteerde
            informatie.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:7.5.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:7.5
      ref_id: 7.5.3
      name: Control of documented information
      description: Control documented information for availability, protection, distribution
        and retention.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Beheersing van gedocumenteerde informatie
          description: Beheer gedocumenteerde informatie op beschikbaarheid, bescherming,
            verspreiding en bewaring.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:8
      assessable: false
      depth: 1
      ref_id: '8'
      name: Operation
      description: Requirements for operating the PIMS.
      translations:
        nl:
          name: Uitvoering
          description: Eisen voor het uitvoeren van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:8.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:8
      ref_id: '8.1'
      name: Operational planning and control
      description: Plan, implement and control the processes needed to meet PIMS requirements,
        including outsourced processes.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Operationele planning en beheersing
          description: Plan, voer uit en beheers de processen die nodig zijn om aan
            de eisen van het PIMS te voldoen, ook uitbestede processen.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:8.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:8
      ref_id: '8.2'
      name: Privacy risk assessment
      description: Perform privacy risk assessments at planned intervals and upon
        significant change, and retain the results.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Privacyrisicobeoordeling
          description: Voer privacyrisicobeoordelingen uit op geplande momenten en
            bij grote wijzigingen, en bewaar de uitkomsten.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:8.3
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:8
      ref_id: '8.3'
      name: Privacy risk treatment
      description: Implement the privacy risk treatment plan and retain the results.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Privacyrisicobehandeling
          description: Voer het plan voor privacyrisicobehandeling uit en bewaar de
            uitkomsten.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9
      assessable: false
      depth: 1
      ref_id: '9'
      name: Performance evaluation
      description: Requirements for evaluating PIMS performance.
      translations:
        nl:
          name: Evaluatie van de prestaties
          description: Eisen voor het evalueren van de prestaties van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9
      ref_id: '9.1'
      name: Monitoring, measurement, analysis and evaluation
      description: Determine what to monitor and measure, and evaluate the performance
        and effectiveness of the PIMS.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Monitoren, meten, analyseren en evalueren
          description: Bepaal wat wordt gemonitord en gemeten, en evalueer de prestaties
            en de doeltreffendheid van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.2
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9
      ref_id: '9.2'
      name: Internal audit
      description: Requirements for internal audits of the PIMS.
      translations:
        nl:
          name: Interne audit
          description: Eisen voor interne audits van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.2.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9.2
      ref_id: 9.2.1
      name: General
      description: Conduct internal audits at planned intervals to verify conformity
        and effective implementation.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Algemeen
          description: Voer op geplande momenten interne audits uit om na te gaan
            of het PIMS aan de eisen voldoet en goed is ingevoerd.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.2.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9.2
      ref_id: 9.2.2
      name: Internal audit programme
      description: Plan, establish, implement and maintain an internal audit programme.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Programma voor interne audits
          description: Plan een programma voor interne audits, richt het in, voer
            het uit en houd het bij.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.3
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9
      ref_id: '9.3'
      name: Management review
      description: Requirements for management review of the PIMS.
      translations:
        nl:
          name: Directiebeoordeling
          description: Eisen voor de directiebeoordeling van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.3.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9.3
      ref_id: 9.3.1
      name: General
      description: Review the PIMS at planned intervals to ensure continuing suitability,
        adequacy and effectiveness.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Algemeen
          description: Beoordeel het PIMS op geplande momenten om na te gaan of het
            geschikt, toereikend en doeltreffend blijft.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.3.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9.3
      ref_id: 9.3.2
      name: Management review inputs
      description: Include the specified inputs in the management review.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Input voor de directiebeoordeling
          description: Neem de voorgeschreven onderwerpen mee in de directiebeoordeling.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:9.3.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:9.3
      ref_id: 9.3.3
      name: Management review results
      description: Record decisions and actions arising from the management review.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Resultaten van de directiebeoordeling
          description: Leg de besluiten en acties uit de directiebeoordeling vast.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:10
      assessable: false
      depth: 1
      ref_id: '10'
      name: Improvement
      description: Requirements for continual improvement of the PIMS.
      translations:
        nl:
          name: Verbetering
          description: Eisen voor voortdurende verbetering van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:10.1
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:10
      ref_id: '10.1'
      name: Continual improvement
      description: Continually improve the suitability, adequacy and effectiveness
        of the PIMS.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Voortdurende verbetering
          description: Verbeter voortdurend de geschiktheid, toereikendheid en doeltreffendheid
            van het PIMS.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:10.2
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:iso27701-2025:10
      ref_id: '10.2'
      name: Nonconformity and corrective action
      description: React to nonconformities, evaluate causes and take corrective action.
      implementation_groups:
      - clauses
      translations:
        nl:
          name: Afwijkingen en corrigerende maatregelen
          description: Reageer op afwijkingen, onderzoek de oorzaken en neem corrigerende
            maatregelen.
    - urn: urn:intuitem:risk:req_node:iso27701-2025:a.1
      assessable: false
      depth: 1
      ref_id: A.1
      name: PIMS reference control objectives and controls for PII controllers
      description: "Annex A, Table A.1 \u2014 controls applicable to organizations\
        \ acting as PII controllers."
      translations:
        nl:
          name: Referentiedoelen en beheersmaatregelen van het PIMS voor verwerkingsverantwoordelijken
