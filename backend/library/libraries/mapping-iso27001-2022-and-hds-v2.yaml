ref_id: mapping-iso27001-2022-and-hds-v2
name: ISO/IEC 27001:2022 <-> HDS v2.0
description: Mapping between International standard ISO/IEC 27001:2022 and the French Health Data Hosting (HDS) certification framework v2.0. Chapter 5 links follow the ISO clause each HDS requirement complements (subset); Annex A links are partial overlaps (intersect). Contract (chapter 6) and sovereignty (chapter 7) requirements are largely unmapped because ISO 27001 has no equivalent.
