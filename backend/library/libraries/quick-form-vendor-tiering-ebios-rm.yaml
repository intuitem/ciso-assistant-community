urn: urn:intuitem:risk:library:vendor-tiering-ebios-rm
locale: en
ref_id: vendor-tiering-ebios-rm
name: Vendor tiering (EBIOS RM)
description: 'A starter form to tier a vendor with the four EBIOS Risk Manager stakeholder criteria. Start
  it from a vendor with "Assess tier"; an accepted response writes the tier onto the vendor. It is an
  alternative to the "Vendor tiering" form: use one tiering method per organisation.'
copyright: © intuitem. Criteria and rating scales after the EBIOS Risk Manager method, ANSSI.
version: 3
publication_date: '2026-10-08'
provider: intuitem
packager: intuitem
objects:
  quick_forms:
  - urn: urn:intuitem:risk:quick_form:vendor-tiering-ebios-rm
    ref_id: vendor-tiering-ebios-rm
    name: Vendor tiering (EBIOS RM)
    description: 'Tiers a vendor with the stakeholder criteria of the EBIOS Risk Manager method (ANSSI,
      workshop 3): exposure (dependency, penetration) and cyber reliability (cyber maturity, trust), each
      rated from 1 to 4.


      The threat level is dependency × penetration ÷ (maturity × trust), from 0.06 to 16, the value the
      EBIOS RM ecosystem map places stakeholders by.'
    annotation: 'An accepted response sets the vendor''s tier on the default scale from the threat level,
      with the default zones of the EBIOS RM ecosystem map: Critical from 2.5 (danger zone), Important
      from 0.9 (control zone), Standard from 0.2 (watch zone), Low impact below. EBIOS RM leaves these
      thresholds to each organisation: adjust them in the form''s settings to match your own. The tiers
      are named by key, so a renamed or reordered scale keeps working.'
    ref_id_prefix: VTE
    subject_question_urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:context:question:vendor
    on_accept:
    - target: entity.tier
      config:
        mapping:
        - outcome: threat_level
          thresholds:
          - tier: critical
            min: 2.5
          - tier: important
            min: 0.9
          - tier: standard
            min: 0.2
          - tier: low-impact
    outcomes_definition:
    - ref_id: dependency
      label: Dependency
      kind: number
      expression: '"exposure:question:dependency:choice:l4" in answers["exposure:question:dependency"].selected_choices
        ? 4.0 : ("exposure:question:dependency:choice:l3" in answers["exposure:question:dependency"].selected_choices
        ? 3.0 : ("exposure:question:dependency:choice:l2" in answers["exposure:question:dependency"].selected_choices
        ? 2.0 : 1.0))'
      translations:
        fr:
          label: Dépendance
        it:
          label: Dipendenza
        de:
          label: Abhängigkeit
    - ref_id: penetration
      label: Penetration
      kind: number
      expression: '"exposure:question:penetration:choice:l4" in answers["exposure:question:penetration"].selected_choices
        ? 4.0 : ("exposure:question:penetration:choice:l3" in answers["exposure:question:penetration"].selected_choices
        ? 3.0 : ("exposure:question:penetration:choice:l2" in answers["exposure:question:penetration"].selected_choices
        ? 2.0 : 1.0))'
      translations:
        fr:
          label: Pénétration
        it:
          label: Penetrazione
        de:
          label: Durchdringung
    - ref_id: maturity
      label: Cyber maturity
      kind: number
      expression: '"reliability:question:maturity:choice:l4" in answers["reliability:question:maturity"].selected_choices
        ? 4.0 : ("reliability:question:maturity:choice:l3" in answers["reliability:question:maturity"].selected_choices
        ? 3.0 : ("reliability:question:maturity:choice:l2" in answers["reliability:question:maturity"].selected_choices
        ? 2.0 : 1.0))'
      translations:
        fr:
          label: Maturité cyber
        it:
          label: Maturità cyber
        de:
          label: Cyberreife
    - ref_id: trust
      label: Trust
      kind: number
      expression: '"reliability:question:trust:choice:l4" in answers["reliability:question:trust"].selected_choices
        ? 4.0 : ("reliability:question:trust:choice:l3" in answers["reliability:question:trust"].selected_choices
        ? 3.0 : ("reliability:question:trust:choice:l2" in answers["reliability:question:trust"].selected_choices
        ? 2.0 : 1.0))'
      translations:
        fr:
          label: Confiance
        it:
          label: Fiducia
        de:
          label: Vertrauen
    - ref_id: threat_level
      label: Threat level
      kind: number
      expression: values.dependency * values.penetration / (values.maturity * values.trust)
      translations:
        fr:
          label: Niveau de menace
        it:
          label: Livello di minaccia
        de:
          label: Bedrohungsniveau
    pages:
    - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:context
      ref_id: context
      name: Context
      questions:
        urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:context:question:vendor:
          type: object_reference
          text: Vendor
          config:
            model: entity
          translations:
            fr:
              text: Fournisseur
            it:
              text: Fornitore
            de:
              text: Anbieter
        urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:context:question:service:
          type: text
          text: What service does the vendor provide?
          translations:
            fr:
              text: Quel service le fournisseur assure-t-il ?
            it:
              text: Quale servizio fornisce il fornitore?
            de:
              text: Welche Leistung erbringt der Anbieter?
      translations:
        fr:
          name: Contexte
        it:
          name: Contesto
        de:
          name: Kontext
    - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure
      ref_id: exposure
      name: Exposure
      description: How much the vendor matters to you and how far it reaches into your systems.
      questions:
        urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:dependency:
          type: unique_choice
          text: How vital is the relationship with this vendor to your activity?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:dependency:choice:l1
            value: 1 – Not needed
            description: Your mission can be carried out without any link to this vendor's systems.
            translations:
              fr:
                value: 1 – Pas nécessaire
                description: Votre mission peut être menée sans aucun lien avec le SI de ce fournisseur.
              it:
                value: 1 – Non necessario
                description: L’attività dell’organizzazione può essere svolta senza alcun collegamento con
                  i sistemi di questo fornitore.
              de:
                value: 1 – Nicht benötigt
                description: Sie können Ihre Aufgaben ohne Anbindung an die Systeme dieses Anbieters erfüllen.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:dependency:choice:l2
            value: 2 – Useful
            description: The link helps carry out your mission, which could do without it.
            translations:
              fr:
                value: 2 – Utile
                description: Le lien facilite votre mission, qui pourrait s'en passer.
              it:
                value: 2 – Utile
                description: Il collegamento agevola lo svolgimento dell’attività, che potrebbe comunque
                  proseguire senza di esso.
              de:
                value: 2 – Nützlich
                description: Die Anbindung unterstützt Ihre Aufgabenerfüllung, ist dafür aber nicht zwingend
                  erforderlich.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:dependency:choice:l3
            value: 3 – Essential, replaceable
            description: The link is essential, but another provider could take over.
            translations:
              fr:
                value: 3 – Indispensable, remplaçable
                description: Le lien est indispensable, mais un autre prestataire pourrait prendre le
                  relais.
              it:
                value: 3 – Essenziale, fungibile
                description: Il collegamento è essenziale, ma un altro fornitore potrebbe subentrare.
              de:
                value: 3 – Unverzichtbar, ersetzbar
                description: Die Anbindung ist unverzichtbar, aber ein anderer Anbieter könnte sie übernehmen.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:dependency:choice:l4
            value: 4 – Essential, irreplaceable
            description: The link is essential and no other provider could take over.
            translations:
              fr:
                value: 4 – Indispensable, irremplaçable
                description: Le lien est indispensable et aucun autre prestataire ne pourrait prendre
                  le relais.
              it:
                value: 4 – Essenziale, non fungibile
                description: Il collegamento è essenziale e nessun altro fornitore potrebbe subentrare.
              de:
                value: 4 – Unverzichtbar, nicht ersetzbar
                description: Die Anbindung ist unverzichtbar und kein anderer Anbieter könnte sie übernehmen.
          translations:
            fr:
              text: La relation avec ce fournisseur est-elle vitale pour votre activité ?
            it:
              text: Quanto è essenziale il rapporto con questo fornitore per l’attività
                dell’organizzazione?
            de:
              text: Wie entscheidend ist die Beziehung zu diesem Anbieter für Ihre Tätigkeit?
        urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:penetration:
          type: unique_choice
          text: How far does this vendor reach into your internal resources?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:penetration:choice:l1
            value: 1 – No access or user access
            description: No access, or standard user rights on end-user devices such as workstations or
              phones.
            translations:
              fr:
                value: 1 – Aucun accès ou accès utilisateur
                description: Aucun accès, ou des droits d'utilisateur standard sur des terminaux comme
                  les postes de travail ou les téléphones.
              it:
                value: 1 – Nessun accesso o accesso come utente
                description: Nessun accesso oppure privilegi di utente standard sui dispositivi degli
                  utenti finali, come postazioni di lavoro o telefoni.
              de:
                value: 1 – Kein Zugriff oder Benutzerzugriff
                description: Kein Zugriff oder normale Benutzerrechte auf Endgeräten wie Arbeitsplätzen
                  oder Telefonen.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:penetration:choice:l2
            value: 2 – Administrator of end-user devices
            description: Administrator rights on end-user devices or fleets, or physical access to your
              offices.
            translations:
              fr:
                value: 2 – Administrateur des terminaux
                description: Des droits d'administrateur sur des terminaux ou des flottes, ou un accès
                  physique à vos bureaux.
              it:
                value: 2 – Amministratore dei dispositivi degli utenti finali
                description: Privilegi di amministratore sui dispositivi degli utenti finali o sui
                  relativi parchi dispositivi, oppure accesso fisico agli uffici.
              de:
                value: 2 – Administrator von Endgeräten
                description: Administratorrechte auf Endgeräten oder Geräteflotten oder physischer Zugang
                  zu Ihren Büroräumen.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:penetration:choice:l3
            value: 3 – Administrator of business servers
            description: 'Administrator rights on business servers: files, databases, web or application
              servers.'
            translations:
              fr:
                value: 3 – Administrateur des serveurs métier
                description: 'Des droits d''administrateur sur des serveurs métier : fichiers, bases de
                  données, serveurs web ou d''application.'
              it:
                value: 3 – Amministratore dei server applicativi
                description: 'Privilegi di amministratore sui server applicativi: file server, database,
                  server web o applicativi.'
              de:
                value: 3 – Administrator von Geschäftsservern
                description: 'Administratorrechte auf Geschäftsservern: Datei-, Datenbank-, Web- oder Anwendungsserver.'
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:exposure:question:penetration:choice:l4
            value: 4 – Administrator of the infrastructure
            description: Administrator rights on core infrastructure (directory, DNS, network, firewalls,
              hypervisors, storage) or physical access to server rooms.
            translations:
              fr:
                value: 4 – Administrateur de l'infrastructure
                description: Des droits d'administrateur sur l'infrastructure (annuaire, DNS, réseau,
                  pare-feu, hyperviseurs, stockage) ou un accès physique aux salles serveurs.
              it:
                value: 4 – Amministratore dell’infrastruttura
                description: Privilegi di amministratore sull’infrastruttura centrale (directory, DNS,
                  rete, firewall, hypervisor, storage) oppure accesso fisico alle sale server.
              de:
                value: 4 – Administrator der Infrastruktur
                description: Administratorrechte auf zentraler Infrastruktur (Verzeichnisdienst, DNS, Netzwerk,
                  Firewalls, Hypervisoren, Speicher) oder physischer Zugang zu Serverräumen.
          translations:
            fr:
              text: Jusqu'où ce fournisseur accède-t-il à vos ressources internes ?
            it:
              text: Fino a che punto questo fornitore può accedere alle risorse interne
                dell’organizzazione?
            de:
              text: Wie weit reicht der Zugriff dieses Anbieters auf Ihre internen Ressourcen?
      translations:
        fr:
          name: Exposition
          description: Le poids du fournisseur pour vous et jusqu'où il accède à vos systèmes.
        it:
          name: Esposizione
          description: La rilevanza del fornitore per l’organizzazione e l’ampiezza del suo accesso ai
            sistemi interni.
        de:
          name: Exposition
          description: Wie wichtig der Anbieter für Sie ist und wie weit sein Zugriff auf Ihre Systeme
            reicht.
    - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability
      ref_id: reliability
      name: Cyber reliability
      description: How well the vendor protects itself, and whether its interests match yours. Higher
        levels lower the threat.
      questions:
        urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:maturity:
          type: unique_choice
          text: What are this vendor's security capabilities?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:maturity:choice:l1
            value: 1 – Ad hoc
            description: Basic hygiene is applied now and then, nothing is formalised, and incident response
              is uncertain.
            translations:
              fr:
                value: 1 – Ponctuelle
                description: L'hygiène de base est appliquée ponctuellement, rien n'est formalisé et la
                  réaction aux incidents est incertaine.
              it:
                value: 1 – Non strutturato
                description: Le misure di sicurezza di base sono applicate saltuariamente, nulla è
                  formalizzato e la risposta agli incidenti è incerta.
              de:
                value: 1 – Ad hoc
                description: Grundlegende Cyberhygiene wird gelegentlich angewendet, nichts ist formell
                  geregelt und die Reaktion auf Vorfälle ist ungewiss.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:maturity:choice:l2
            value: 2 – Reactive
            description: Hygiene rules and regulations are followed but not part of an overall policy;
              security is handled as issues arise.
            translations:
              fr:
                value: 2 – Réactive
                description: Les règles d'hygiène et la réglementation sont suivies sans politique d'ensemble
                  ; la sécurité est traitée au fil des problèmes.
              it:
                value: 2 – Reattiva
                description: Le regole di sicurezza di base e gli obblighi normativi sono rispettati, ma
                  non rientrano in una politica complessiva; la sicurezza è gestita quando emergono
                  problemi.
              de:
                value: 2 – Reaktiv
                description: Regeln zur Cyberhygiene und Vorschriften werden eingehalten, sind aber nicht
                  Teil einer übergreifenden Richtlinie; Sicherheitsprobleme werden erst bei ihrem Auftreten
                  behandelt.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:maturity:choice:l3
            value: 3 – Policy-driven
            description: An overall security policy is applied, still mostly reactive, with some risks
              centralised and anticipated.
            translations:
              fr:
                value: 3 – Encadrée
                description: Une politique de sécurité d'ensemble est appliquée, encore surtout réactive,
                  avec certains risques centralisés et anticipés.
              it:
                value: 3 – Basata su politiche
                description: È applicata una politica di sicurezza complessiva, ancora prevalentemente
                  reattiva, con alcuni rischi gestiti centralmente e anticipati.
              de:
                value: 3 – Richtlinienbasiert
                description: Eine übergreifende Sicherheitsrichtlinie wird angewendet, weiterhin überwiegend
                  reaktiv; einige Risiken werden zentral erfasst und vorausschauend berücksichtigt.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:maturity:choice:l4
            value: 4 – Managed and proactive
            description: The vendor manages its risks through an integrated, proactive security policy.
            translations:
              fr:
                value: 4 – Pilotée et proactive
                description: Le fournisseur pilote ses risques par une politique de sécurité intégrée
                  et proactive.
              it:
                value: 4 – Gestita e proattiva
                description: Il fornitore gestisce i propri rischi mediante una politica di sicurezza
                  integrata e proattiva.
              de:
                value: 4 – Gesteuert und proaktiv
                description: Der Anbieter steuert seine Risiken mithilfe einer integrierten, proaktiven
                  Sicherheitsrichtlinie.
          translations:
            fr:
              text: Quelles sont les capacités de ce fournisseur en matière de sécurité ?
            it:
              text: Quali sono le capacità di sicurezza di questo fornitore?
            de:
              text: Über welche Sicherheitsfähigkeiten verfügt dieser Anbieter?
        urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:trust:
          type: unique_choice
          text: Could this vendor's intentions or interests run against yours?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:trust:choice:l1
            value: 1 – Unknown
            description: You don't know the vendor's intentions.
            translations:
              fr:
                value: 1 – Inconnues
                description: Vous ne connaissez pas les intentions du fournisseur.
              it:
                value: 1 – Non definibili
                description: Non si conoscono le intenzioni del fornitore.
              de:
                value: 1 – Unbekannt
                description: Sie kennen die Absichten des Anbieters nicht.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:trust:choice:l2
            value: 2 – Neutral
            description: The vendor's intentions are considered neutral.
            translations:
              fr:
                value: 2 – Neutres
                description: Les intentions du fournisseur sont considérées comme neutres.
              it:
                value: 2 – Neutrali
                description: Le intenzioni del fornitore sono considerate neutrali.
              de:
                value: 2 – Neutral
                description: Die Absichten des Anbieters werden als neutral eingeschätzt.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:trust:choice:l3
            value: 3 – Probably favourable
            description: The vendor's intentions are known and likely favourable to you.
            translations:
              fr:
                value: 3 – Probablement favorables
                description: Les intentions du fournisseur sont connues et probablement favorables.
              it:
                value: 3 – Probabilmente favorevoli
                description: Le intenzioni del fornitore sono note e probabilmente favorevoli
                  all’organizzazione.
              de:
                value: 3 – Vermutlich wohlwollend
                description: Die Absichten des Anbieters sind bekannt und voraussichtlich für Sie günstig.
          - urn: urn:intuitem:risk:qf_page:vendor-tiering-ebios-rm:reliability:question:trust:choice:l4
            value: 4 – Fully aligned
            description: The vendor's intentions are well known and fully compatible with yours.
            translations:
              fr:
                value: 4 – Pleinement alignées
                description: Les intentions du fournisseur sont bien connues et pleinement compatibles
                  avec les vôtres.
              it:
                value: 4 – Pienamente allineate
                description: Le intenzioni del fornitore sono ben note e pienamente compatibili con quelle
                  dell’organizzazione.
              de:
                value: 4 – Vollständig übereinstimmend
                description: Die Absichten des Anbieters sind gut bekannt und vollständig mit Ihren vereinbar.
          translations:
            fr:
              text: Les intentions ou les intérêts de ce fournisseur peuvent-ils être contraires aux vôtres
                ?
            it:
              text: Le intenzioni o gli interessi di questo fornitore potrebbero essere contrari a quelli
                dell’organizzazione?
            de:
              text: Könnten die Absichten oder Interessen dieses Anbieters Ihren entgegenstehen?
      translations:
        fr:
          name: Fiabilité cyber
          description: La capacité du fournisseur à se protéger, et la convergence de ses intérêts avec
            les vôtres. Des niveaux élevés réduisent la menace.
        it:
          name: Affidabilità cyber
          description: La capacità del fornitore di proteggersi e la convergenza dei suoi interessi con
            quelli dell’organizzazione. Livelli più elevati riducono la minaccia.
        de:
          name: Cyber-Zuverlässigkeit
          description: Wie gut sich der Anbieter selbst schützt und ob seine Interessen mit Ihren
            übereinstimmen. Höhere Werte verringern das Bedrohungsniveau.
    translations:
      fr:
        name: Criticité des fournisseurs (EBIOS RM)
        description: 'Classe un fournisseur selon les critères d''évaluation des parties prenantes de
          la méthode EBIOS Risk Manager (ANSSI, atelier 3) : l''exposition (dépendance, pénétration) et
          la fiabilité cyber (maturité cyber, confiance), chacun noté de 1 à 4.


          Le niveau de menace vaut dépendance × pénétration ÷ (maturité × confiance), de 0,06 à 16 : c''est
          la valeur selon laquelle la cartographie de l''écosystème d''EBIOS RM place les parties prenantes.'
        annotation: 'Une réponse acceptée attribue le niveau du fournisseur sur l''échelle par défaut
          à partir du niveau de menace, selon les zones par défaut de la cartographie de l''écosystème
          d''EBIOS RM : Critique à partir de 2,5 (zone de danger), Important à partir de 0,9 (zone de
          contrôle), Standard à partir de 0,2 (zone de veille), Faible impact en dessous. EBIOS RM laisse
          ces seuils à chaque organisation : ajustez-les dans les paramètres du formulaire. Les niveaux
          sont désignés par leur clé : une échelle renommée ou réordonnée continue de fonctionner.'
      it:
        name: Classificazione dei fornitori (EBIOS RM)
        description: 'Classifica un fornitore secondo i criteri di valutazione delle parti interessate del
          metodo EBIOS Risk Manager (ANSSI, workshop 3): esposizione (dipendenza, penetrazione) e
          affidabilità cyber (maturità cyber, fiducia), ciascuno valutato da 1 a 4.


          Il livello di minaccia è pari a dipendenza × penetrazione ÷ (maturità × fiducia), da 0,06 a 16:
          è il valore in base al quale la mappa dell’ecosistema EBIOS RM posiziona le parti interessate.'
        annotation: 'Una risposta accettata assegna il livello del fornitore sulla scala predefinita in
          base al livello di minaccia, usando le zone predefinite della mappa dell’ecosistema EBIOS RM:
          Critico da 2,5 (zona di pericolo), Importante da 0,9 (zona di controllo), Standard da 0,2 (zona
          di sorveglianza), Impatto basso al di sotto. EBIOS RM lascia la scelta di queste soglie a
          ciascuna organizzazione: modificarle nelle impostazioni del modulo secondo le proprie esigenze.
          I livelli sono identificati dalle rispettive chiavi, quindi la procedura continua a funzionare
          anche se la scala viene rinominata o riordinata.'
      de:
        name: Anbietereinstufung (EBIOS RM)
        description: |-
          Stuft einen Anbieter anhand der Stakeholder-Kriterien der EBIOS-Risk-Manager-Methode ein (ANSSI, Workshop 3): Exposition (Abhängigkeit, Durchdringung) und Cyber-Zuverlässigkeit (Cyberreife, Vertrauen), jeweils von 1 bis 4 bewertet.

          Das Bedrohungsniveau berechnet sich als Abhängigkeit × Durchdringung ÷ (Reife × Vertrauen) und reicht von 0,06 bis 16. Anhand dieses Werts werden Stakeholder in der EBIOS-RM-Ökosystemkarte eingeordnet.
        annotation: 'Eine angenommene Antwort setzt die Stufe des Anbieters auf der Standardskala
          anhand des Bedrohungsniveaus und der Standardzonen der EBIOS-RM-Ökosystemkarte: Kritisch
          ab 2,5 (Gefahrenzone), Wichtig ab 0,9 (Kontrollzone), Standard ab 0,2 (Beobachtungszone),
          darunter Geringe Auswirkungen. EBIOS RM überlässt diese Schwellenwerte der jeweiligen
          Organisation: Passen Sie sie in den Formulareinstellungen an Ihre eigenen Vorgaben an.
          Die Stufen werden über ihre Schlüssel referenziert, sodass umbenannte oder neu geordnete
          Skalen weiterhin funktionieren.'
translations:
  fr:
    name: Criticité des fournisseurs (EBIOS RM)
    description: 'Un formulaire de départ pour classer un fournisseur selon les quatre critères d''évaluation
      des parties prenantes d''EBIOS Risk Manager. Lancez-le depuis un fournisseur avec « Évaluer le niveau
      » ; une réponse acceptée attribue le niveau au fournisseur. C''est une alternative au formulaire
      « Criticité des fournisseurs » : retenez une seule méthode de classement par organisation.'
  it:
    name: Classificazione dei fornitori (EBIOS RM)
    description: 'Un modulo iniziale per classificare un fornitore secondo i quattro criteri EBIOS Risk
      Manager di valutazione delle parti interessate. Avviarlo dalla scheda del fornitore con «Valuta
      livello»; una risposta accettata assegna il livello al fornitore. È un’alternativa al modulo
      «Classificazione dei fornitori»: utilizzare un solo metodo di classificazione per organizzazione.'
  de:
    name: Anbietereinstufung (EBIOS RM)
    description: |-
      Ein Einstiegsformular zur Einstufung eines Anbieters anhand der vier Kriterien für Stakeholder aus EBIOS Risk Manager. Starten Sie es bei einem Anbieter über „Stufe bewerten“; eine angenommene Antwort überträgt die Stufe auf den Anbieter. Es ist eine Alternative zum Formular „Anbietereinstufung“: Verwenden Sie pro Organisation eine Einstufungsmethode.

      Hinweis zur Übersetzung: KI-gestützte Übersetzung der englischen Fassung, ohne unabhängige menschliche Prüfung. Im Zweifel gilt die englische Fassung.
