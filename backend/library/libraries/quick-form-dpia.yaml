    - urn: urn:intuitem:risk:qf_page:dpia:by_design
      ref_id: by_design
      name: 'Risks: by-design risks'
      description: Risks the processing creates for data subjects even when everything works as intended
        (profiling, excessive monitoring, unfair automated decisions…), beyond security incidents.
      questions:
        urn:intuitem:risk:qf_page:dpia:by_design:question:risks:
          type: text
          text: Which risks does the processing create by design?
          required: false
          translations:
            fr:
              text: Quels risques le traitement crée-t-il par sa conception même ?
            it:
              text: Quali rischi per gli interessati derivano dalla progettazione stessa del trattamento?
            nb:
              text: Hvilken risiko skaper behandlingen gjennom selve utformingen?
        urn:intuitem:risk:qf_page:dpia:by_design:question:measures:
          type: object_reference
          text: Which measures treat them?
          config:
            model: applied_control
            multiple: true
            subject_field: associated_controls
          required: false
          translations:
            fr:
              text: Quelles mesures les traitent ?
            it:
              text: Quali misure sono previste per trattare tali rischi?
            nb:
              text: Hvilke tiltak håndterer den?
      translations:
        fr:
          name: 'Risques : risques inhérents au traitement'
          description: Les risques que le traitement fait peser sur les personnes concernées même lorsque
            tout fonctionne comme prévu (profilage, surveillance excessive, décisions automatisées inéquitables…),
            au-delà des incidents de sécurité.
        it:
          name: 'Rischi: rischi intrinseci al trattamento'
          description: Rischi che il trattamento comporta per gli interessati anche quando opera come
            previsto (profilazione, monitoraggio eccessivo, decisioni automatizzate non eque…), indipendentemente
            dagli incidenti di sicurezza.
        nb:
          name: 'Risiko: utformingsrisiko'
          description: Risiko som behandlingen skaper for de registrerte selv når alt fungerer som tiltenkt
            (profilering, overdreven overvåking, urettferdige automatiserte avgjørelser …), utover sikkerhetshendelser.
    - urn: urn:intuitem:risk:qf_page:dpia:validation
      ref_id: validation
      name: Validation
      description: Record the opinions sought and the decision on the processing.
      questions:
        urn:intuitem:risk:qf_page:dpia:validation:question:dpo_opinion:
          type: text
          text: What is the DPO's opinion?
          translations:
            fr:
              text: Quel est l'avis du DPD ?
            it:
              text: Qual è il parere del Responsabile della protezione dei dati (RPD/DPO)?
            nb:
              text: Hva er personvernombudets uttalelse?
        urn:intuitem:risk:qf_page:dpia:validation:question:dpo_advice_applied:
          type: text
          text: How was the DPO's advice applied, or why not?
          required: false
          translations:
            fr:
              text: Comment l'avis du DPD a-t-il été suivi, ou pourquoi ne l'a-t-il pas été ?
            it:
              text: In che modo sono state recepite le indicazioni del RPD/DPO o, in caso contrario, perché
                non sono state seguite?
            nb:
              text: Hvordan ble personvernombudets råd fulgt, eller hvorfor ble det ikke fulgt?
        urn:intuitem:risk:qf_page:dpia:validation:question:data_subject_views:
          type: text
          text: What are the views of the data subjects or their representatives?
          required: false
          translations:
            fr:
              text: Quel est l'avis des personnes concernées ou de leurs représentants ?
            it:
              text: Qual è il parere degli interessati o dei loro rappresentanti?
            nb:
              text: Hva mener de registrerte eller deres representanter?
        urn:intuitem:risk:qf_page:dpia:validation:question:views_not_sought_reason:
          type: text
          text: If their views were not sought, why not?
          required: false
          translations:
            fr:
              text: Si leur avis n'a pas été recueilli, pourquoi ?
            it:
              text: Se il loro parere non è stato richiesto, per quale motivo?
            nb:
              text: 'Hvis synspunktene deres ikke ble innhentet: Hvorfor ikke?'
        urn:intuitem:risk:qf_page:dpia:validation:question:decision:
          type: unique_choice
          text: Decision
          choices:
          - urn: urn:intuitem:risk:qf_page:dpia:validation:question:decision:choice:proceed
            value: Proceed
            translations:
              fr:
                value: Mettre en œuvre
              it:
                value: Procedere con il trattamento
              nb:
                value: Gå videre
