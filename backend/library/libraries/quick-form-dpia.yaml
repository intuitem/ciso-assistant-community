translations:
  fr:
    name: Analyse d'impact relative à la protection des données (AIPD)
    description: 'Une AIPD suivant la structure de la méthode PIA de la CNIL : contexte, principes fondamentaux,
      risques pour les personnes concernées et validation. Accepter une réponse en fait l''AIPD du traitement
      et ajoute au traitement les mesures retenues.'
  it:
    name: Valutazione d’impatto sulla protezione dei dati (DPIA)
    description: 'Una valutazione d’impatto sulla protezione dei dati (DPIA) strutturata secondo il metodo
      PIA della CNIL: contesto, principi fondamentali, rischi per i diritti e le libertà degli interessati
      e validazione. L’accettazione della risposta la registra come DPIA del trattamento e associa al
      trattamento le misure selezionate.'
  nb:
    name: Vurdering av personvernkonsekvenser (DPIA)
    description: 'En DPIA etter strukturen i CNILs PIA-metode: kontekst, grunnleggende prinsipper, risiko
      for de registrerte og godkjenning. Når et svar godtas, registreres det som behandlingens DPIA, og
      tiltakene som er valgt, legges til behandlingen.'
