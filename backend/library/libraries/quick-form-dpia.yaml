urn: urn:intuitem:risk:library:dpia
locale: en
ref_id: dpia
name: Data protection impact assessment (DPIA)
description: 'A DPIA following the structure of the CNIL PIA method: context, core principles, risks to
  data subjects and validation. Accepting a response records it as the processing''s DPIA and adds the
  measures it picks to the processing.'
copyright: © intuitem
version: 9
publication_date: '2026-10-29'
provider: intuitem
packager: intuitem
objects:
  quick_forms:
  - urn: urn:intuitem:risk:quick_form:dpia
    ref_id: dpia
    name: DPIA
    description: Data protection impact assessment of a processing.
    ref_id_prefix: DPIA
    subject_question_urn: urn:intuitem:risk:qf_page:dpia:overview:question:processing
    on_accept:
    - target: processing.dpia
      config: {}
    - target: processing.controls
      config: {}
    scales_definition:
    - ref_id: severity
      label: Severity
      translations:
        fr:
          label: Gravité
        it:
          label: Gravità
        nb:
          label: Alvorlighet
      levels:
      - ref_id: negligible
        label: Negligible
        description: Data subjects are not affected, or face minor inconveniences they overcome without
          difficulty.
        translations:
          fr:
            label: Négligeable
            description: Les personnes ne sont pas impactées ou subissent des désagréments mineurs qu'elles
              surmontent sans difficulté.
          it:
            label: Trascurabile
            description: Gli interessati non subiscono conseguenze oppure affrontano disagi di lieve entità,
              superabili senza difficoltà.
          nb:
            label: Ubetydelig
            description: De registrerte påvirkes ikke, eller får mindre ulemper som de kommer over uten
              problemer.
      - ref_id: limited
        label: Limited
        description: Data subjects face significant inconveniences they overcome despite some difficulty.
        translations:
          fr:
            label: Limitée
            description: Les personnes subissent des désagréments significatifs qu'elles surmontent malgré
              quelques difficultés.
          it:
            label: Limitata
            description: Gli interessati subiscono disagi significativi, che riescono a superare con qualche
              difficoltà.
          nb:
            label: Begrenset
            description: De registrerte får merkbare ulemper som de kommer over, men med noen vanskeligheter.
      - ref_id: significant
        label: Significant
        description: Data subjects face significant consequences they overcome only with serious difficulty.
        translations:
          fr:
            label: Importante
            description: Les personnes subissent des conséquences significatives qu'elles ne surmontent
              qu'avec de sérieuses difficultés.
          it:
            label: Significativa
            description: Gli interessati subiscono conseguenze significative, superabili soltanto con
              gravi difficoltà.
          nb:
            label: Betydelig
            description: De registrerte får alvorlige konsekvenser som de bare kommer over med store vanskeligheter.
      - ref_id: maximum
        label: Maximum
        description: Data subjects face significant, possibly irreversible consequences they may not overcome.
        translations:
          fr:
            label: Maximale
            description: Les personnes subissent des conséquences significatives, voire irrémédiables,
              qu'elles pourraient ne pas surmonter.
          it:
            label: Massima
            description: Gli interessati subiscono conseguenze significative, potenzialmente irreversibili,
              che potrebbero non riuscire a superare.
          nb:
            label: Maksimal
            description: De registrerte får alvorlige, muligens uopprettelige konsekvenser som de kanskje
              ikke kommer over.
    - ref_id: likelihood
      label: Likelihood
      translations:
        fr:
          label: Vraisemblance
        it:
          label: Probabilità
        nb:
          label: Sannsynlighet
      levels:
      - ref_id: negligible
        label: Negligible
        description: The feared event does not seem possible given the properties of the supporting assets.
        translations:
          fr:
            label: Négligeable
            description: L'événement redouté ne semble pas pouvoir se produire compte tenu des propriétés
              des supports.
          it:
            label: Trascurabile
            description: L’evento temuto non sembra potersi verificare, considerate le caratteristiche
              degli asset di supporto.
          nb:
            label: Ubetydelig
            description: Den uønskede hendelsen virker ikke mulig ut fra egenskapene til støtteverdiene.
      - ref_id: limited
        label: Limited
        description: The feared event seems difficult to bring about given the properties of the supporting
          assets.
        translations:
          fr:
            label: Limitée
            description: L'événement redouté semble difficile à provoquer compte tenu des propriétés des
              supports.
          it:
            label: Limitata
            description: L’evento temuto sembra difficile da provocare, considerate le caratteristiche
              degli asset di supporto.
          nb:
            label: Begrenset
            description: Den uønskede hendelsen virker vanskelig å utløse ut fra egenskapene til støtteverdiene.
      - ref_id: significant
        label: Significant
        description: The feared event seems possible given the properties of the supporting assets.
        translations:
          fr:
            label: Importante
            description: L'événement redouté semble possible compte tenu des propriétés des supports.
          it:
            label: Significativa
            description: L’evento temuto sembra potersi verificare, considerate le caratteristiche degli
              asset di supporto.
          nb:
            label: Betydelig
            description: Den uønskede hendelsen virker mulig ut fra egenskapene til støtteverdiene.
      - ref_id: maximum
        label: Maximum
        description: The feared event seems easy to bring about given the properties of the supporting
          assets.
        translations:
          fr:
            label: Maximale
            description: L'événement redouté semble facile à provoquer compte tenu des propriétés des
              supports.
          it:
            label: Massima
            description: L’evento temuto sembra facile da provocare, considerate le caratteristiche degli
              asset di supporto.
          nb:
            label: Maksimal
            description: Den uønskede hendelsen virker lett å utløse ut fra egenskapene til støtteverdiene.
    outcomes_definition:
    - ref_id: privacy_risk
      kind: rating
      label: Privacy risk
      translations:
        fr:
          label: Risque vie privée
        it:
          label: Rischio per i diritti e le libertà degli interessati
        nb:
          label: Personvernrisiko
      dimensions:
      - severity
      - likelihood
      levels:
      - ref_id: acceptable
        label: Acceptable
        description: The risk can be accepted with the measures in place.
        translations:
          fr:
            label: Acceptable
            description: Le risque peut être accepté avec les mesures en place.
          it:
            label: Accettabile
            description: Il rischio può essere accettato tenuto conto delle misure in essere.
          nb:
            label: Akseptabel
            description: Risikoen kan aksepteres med tiltakene som er på plass.
        color: '#BBF7D0'
      - ref_id: to_reduce
        label: To reduce
        description: Additional measures should reduce the risk before the processing goes ahead.
        translations:
          fr:
            label: À réduire
            description: Des mesures complémentaires doivent réduire le risque avant la mise en œuvre
              du traitement.
          it:
            label: Da ridurre
            description: Prima di avviare il trattamento, occorre ridurre il rischio mediante misure aggiuntive.
          nb:
            label: Må reduseres
            description: Risikoen må reduseres med ytterligere tiltak før behandlingen settes i gang.
        color: '#FEF08A'
      - ref_id: unacceptable
        label: Unacceptable
        description: The risk is not acceptable. Reduce it or consult the supervisory authority.
        translations:
          fr:
            label: Inacceptable
            description: Le risque n'est pas acceptable. Le réduire ou consulter l'autorité de contrôle.
          it:
            label: Inaccettabile
            description: Il rischio non è accettabile. È necessario ridurlo o consultare l’autorità di
              controllo.
          nb:
            label: Uakseptabel
            description: Risikoen er ikke akseptabel. Reduser den, eller forhåndsdrøft behandlingen med
              tilsynsmyndigheten.
        color: '#FCA5A5'
      grid:
      - - acceptable
        - acceptable
        - acceptable
        - to_reduce
      - - acceptable
        - to_reduce
        - to_reduce
        - to_reduce
      - - to_reduce
        - to_reduce
        - unacceptable
        - unacceptable
      - - unacceptable
        - unacceptable
        - unacceptable
        - unacceptable
    - ref_id: residual_risk_unacceptable
      label: 'Residual risk unacceptable: consult the supervisory authority'
      description: A risk stays unacceptable once the planned measures are in place. Article 36 GDPR requires
        prior consultation of the supervisory authority.
      color: '#dc2626'
      expression: has(values.privacy_risk_residual) && values.privacy_risk_residual >= 3.0
      translations:
        fr:
          label: 'Risque résiduel inacceptable : consulter l''autorité de contrôle'
          description: Un risque reste inacceptable une fois les mesures prévues en place. L'article 36
            du RGPD impose de consulter l'autorité de contrôle au préalable.
        it:
          label: 'Rischio residuo inaccettabile: consultare l’autorità di controllo'
          description: Il rischio rimane inaccettabile anche dopo l’attuazione delle misure previste.
            L’articolo 36 del GDPR richiede la consultazione preventiva dell’autorità di controllo.
        nb:
          label: 'Restrisiko uakseptabel: forhåndsdrøft med tilsynsmyndigheten'
          description: En risiko er fortsatt uakseptabel når de planlagte tiltakene er på plass. GDPR
            art. 36 krever forhåndsdrøfting med tilsynsmyndigheten.
    pages:
    - urn: urn:intuitem:risk:qf_page:dpia:overview
      ref_id: overview
      name: 'Context: overview'
      description: 'Identify the processing under study. Its purposes, data, parties and measures come
        from its record: the following pages show them for you to assess.


        Keep the completed response as the record of the assessment: Article 35 GDPR requires it.'
      questions:
        urn:intuitem:risk:qf_page:dpia:overview:question:processing:
          type: object_reference
          text: Processing
          config:
            model: processing
          translations:
            fr:
              text: Traitement
            it:
              text: Trattamento
            nb:
              text: Behandling
        urn:intuitem:risk:qf_page:dpia:overview:question:benefits:
          type: text
          text: What benefits are expected from the processing, and in what context is it used?
          translations:
            fr:
              text: Quels bénéfices attend-on du traitement, et dans quel contexte est-il utilisé ?
            it:
              text: Quali benefici si prevedono dal trattamento e in quale contesto viene svolto?
            nb:
              text: Hvilke fordeler forventes av behandlingen, og i hvilken sammenheng brukes den?
        urn:intuitem:risk:qf_page:dpia:overview:question:standards:
          type: text
          text: Which standards apply to the processing? (approved codes of conduct, certifications…)
          required: false
          translations:
            fr:
              text: Quels référentiels s'appliquent au traitement ? (codes de conduite approuvés, certifications…)
            it:
              text: Quali standard si applicano al trattamento? (codici di condotta approvati, certificazioni…)
            nb:
              text: Hvilke normer gjelder for behandlingen? (godkjente atferdsnormer, sertifiseringer
                …)
      translations:
        fr:
          name: 'Contexte : vue d''ensemble'
          description: 'Identifiez le traitement étudié. Ses finalités, ses données, les parties prenantes
            et ses mesures viennent de sa fiche : les pages suivantes les présentent pour que vous les
            évaluiez.


            Conservez la réponse complétée comme trace de l''analyse : l''article 35 du RGPD l''exige.'
        it:
          name: 'Contesto: panoramica'
          description: 'Identificare il trattamento oggetto della valutazione. Le finalità, i dati, i
            soggetti coinvolti e le misure sono ricavati dalla relativa scheda: le pagine successive li
            presentano ai fini della valutazione.


            Conservare la risposta compilata come evidenza documentale della valutazione, ai sensi dell’articolo
            35 del GDPR.'
        nb:
          name: 'Kontekst: oversikt'
          description: 'Velg behandlingen som vurderes. Formål, opplysninger, parter og tiltak hentes
            fra behandlingens oppføring: de neste sidene viser dem slik at du kan vurdere dem.


            Ta vare på det utfylte svaret som dokumentasjon av vurderingen, jf. GDPR art. 35 nr. 7 og
            ansvarsprinsippet i art. 5 nr. 2.'
    - urn: urn:intuitem:risk:qf_page:dpia:data
      ref_id: data
      name: 'Context: data, processes and supports'
      description: 'The data processed, about whom and for whom. Shown from the processing''s record.
        To correct it, edit the processing: submitting this form keeps a copy of what was assessed.'
      facts:
      - processing.personal_data
      - processing.data_subjects
      - processing.recipients
      questions:
        urn:intuitem:risk:qf_page:dpia:data:question:access:
          type: text
          text: Who can access the data, beyond the recipients listed?
          translations:
            fr:
              text: Qui peut accéder aux données, au-delà des destinataires listés ?
            it:
              text: Chi può accedere ai dati, oltre ai destinatari già elencati?
            nb:
              text: Hvem har tilgang til opplysningene, utover mottakerne som er oppført?
        urn:intuitem:risk:qf_page:dpia:data:question:lifecycle:
          type: text
          text: How does the data lifecycle unfold, from collection to deletion?
          translations:
            fr:
              text: Comment se déroule le cycle de vie des données, de la collecte à l'effacement ?
            it:
              text: Come si articola il ciclo di vita dei dati, dalla raccolta alla cancellazione?
            nb:
              text: Hvordan er livsløpet til opplysningene, fra innsamling til sletting?
        urn:intuitem:risk:qf_page:dpia:data:question:supports:
          type: text
          text: What else does the data rely on, beyond the assets listed? (people, paper…)
          required: false
          translations:
            fr:
              text: Sur quoi d'autre les données reposent-elles, au-delà des actifs listés ? (personnes,
                papier…)
            it:
              text: Su quali ulteriori risorse si basa il trattamento dei dati, oltre agli asset elencati?
                (persone, supporti cartacei…)
            nb:
              text: Hva annet er opplysningene avhengige av, utover verdiene som er oppført? (personer,
                papir …)
      translations:
        fr:
          name: 'Contexte : données, processus et supports'
          description: 'Les données traitées, sur qui et pour qui. Repris de la fiche du traitement. Pour
            le corriger, modifiez le traitement : la soumission de ce formulaire conserve une copie de
            ce qui a été évalué.'
        it:
          name: 'Contesto: dati, processi e supporti'
          description: 'I dati trattati, gli interessati e i destinatari sono riportati nella scheda del
            trattamento. Per correggere tali informazioni, modificare la scheda del trattamento: l’invio
            del presente modulo conserva una copia delle informazioni valutate.'
        nb:
          name: 'Kontekst: opplysninger, prosesser og støtteverdier'
          description: 'Opplysningene som behandles, om hvem og for hvem. Hentet fra behandlingens oppføring.
            Endre behandlingen for å rette den: når skjemaet sendes inn, lagres en kopi av det som ble
            vurdert.'
    - urn: urn:intuitem:risk:qf_page:dpia:proportionality
      ref_id: proportionality
      name: 'Core principles: proportionality and necessity'
      description: 'Show that the processing complies with the core data protection principles. Shown
        from the processing''s record. To correct it, edit the processing: submitting this form keeps
        a copy of what was assessed.'
      facts:
      - processing.purposes
      questions:
        urn:intuitem:risk:qf_page:dpia:proportionality:question:purposes:
          type: text
          text: Are these purposes specified, explicit and legitimate, and does each rest on the right
            legal basis?
          translations:
            fr:
              text: Ces finalités sont-elles déterminées, explicites et légitimes, et chacune repose-t-elle
                sur la bonne base légale ?
            it:
              text: Le finalità sono determinate, esplicite e legittime e ciascuna è fondata su una base
                giuridica appropriata?
            nb:
              text: Er formålene spesifikke, uttrykkelig angitte og berettigede, og har hvert av dem riktig
                behandlingsgrunnlag?
        urn:intuitem:risk:qf_page:dpia:proportionality:question:minimisation:
          type: text
          text: Is the data adequate, relevant and limited to what is necessary for the purposes?
          translations:
            fr:
              text: Les données sont-elles adéquates, pertinentes et limitées à ce qui est nécessaire
                aux finalités ?
            it:
              text: I dati sono adeguati, pertinenti e limitati a quanto necessario rispetto alle finalità
                perseguite?
            nb:
              text: Er opplysningene adekvate, relevante og begrenset til det som er nødvendig for formålene?
        urn:intuitem:risk:qf_page:dpia:proportionality:question:accuracy:
          type: text
          text: Is the data accurate and kept up to date?
          translations:
            fr:
              text: Les données sont-elles exactes et tenues à jour ?
            it:
              text: I dati sono esatti e mantenuti aggiornati?
            nb:
              text: Er opplysningene korrekte og oppdaterte?
        urn:intuitem:risk:qf_page:dpia:proportionality:question:retention:
          type: text
          text: Why are the retention periods recorded for each kind of data necessary?
          translations:
            fr:
              text: Pourquoi les durées de conservation indiquées pour chaque type de données sont-elles
                nécessaires ?
            it:
              text: Perché i periodi di conservazione previsti per ciascuna categoria di dati sono necessari?
            nb:
              text: Hvorfor er lagringstidene som er registrert for hver type opplysninger, nødvendige?
      translations:
        fr:
          name: 'Principes fondamentaux : proportionnalité et nécessité'
          description: 'Montrez que le traitement respecte les principes fondamentaux de la protection
            des données. Repris de la fiche du traitement. Pour le corriger, modifiez le traitement :
            la soumission de ce formulaire conserve une copie de ce qui a été évalué.'
        it:
          name: 'Principi fondamentali: proporzionalità e necessità'
          description: 'Dimostrare che il trattamento rispetta i principi fondamentali in materia di protezione
            dei dati personali. Le informazioni sono ricavate dalla scheda del trattamento. Per correggerle,
            modificare la scheda: l’invio del modulo conserva una copia delle informazioni valutate.'
        nb:
          name: 'Grunnleggende prinsipper: forholdsmessighet og nødvendighet'
          description: 'Vis at behandlingen oppfyller de grunnleggende prinsippene for personvern. Hentet
            fra behandlingens oppføring. Endre behandlingen for å rette den: når skjemaet sendes inn,
            lagres en kopi av det som ble vurdert.'
    - urn: urn:intuitem:risk:qf_page:dpia:rights
      ref_id: rights
      name: 'Core principles: measures protecting data subjects'' rights'
      description: 'Show how data subjects can exercise their rights. Shown from the processing''s record.
        To correct it, edit the processing: submitting this form keeps a copy of what was assessed.'
      facts:
      - processing.contractors
      - processing.transfers
      questions:
        urn:intuitem:risk:qf_page:dpia:rights:question:information:
          type: text
          text: How are data subjects informed about the processing?
          translations:
            fr:
              text: Comment les personnes concernées sont-elles informées du traitement ?
            it:
              text: Come sono informati gli interessati in merito al trattamento?
            nb:
              text: Hvordan informeres de registrerte om behandlingen?
        urn:intuitem:risk:qf_page:dpia:rights:question:consent:
          type: text
          text: If applicable, how is the data subjects' consent obtained?
          required: false
          translations:
            fr:
              text: Le cas échéant, comment le consentement des personnes concernées est-il recueilli
                ?
            it:
              text: Ove applicabile, come viene raccolto il consenso degli interessati?
            nb:
              text: 'Hvis det er aktuelt: Hvordan innhentes samtykke fra de registrerte?'
        urn:intuitem:risk:qf_page:dpia:rights:question:access_portability:
          type: text
          text: How can data subjects exercise their rights of access and to data portability?
          translations:
            fr:
              text: Comment les personnes concernées peuvent-elles exercer leurs droits d'accès et à la
                portabilité ?
            it:
              text: Come possono gli interessati esercitare il diritto di accesso e il diritto alla portabilità
                dei dati?
            nb:
              text: Hvordan kan de registrerte utøve retten til innsyn og dataportabilitet?
        urn:intuitem:risk:qf_page:dpia:rights:question:rectification_erasure:
          type: text
          text: How can data subjects exercise their rights to rectification and erasure?
          translations:
            fr:
              text: Comment les personnes concernées peuvent-elles exercer leurs droits de rectification
                et d'effacement ?
            it:
              text: Come possono gli interessati esercitare i diritti di rettifica e di cancellazione
                dei dati?
            nb:
              text: Hvordan kan de registrerte utøve retten til retting og sletting?
        urn:intuitem:risk:qf_page:dpia:rights:question:restriction_objection:
          type: text
          text: How can data subjects exercise their rights to restriction and to object?
          translations:
            fr:
              text: Comment les personnes concernées peuvent-elles exercer leurs droits à la limitation
                et d'opposition ?
            it:
              text: Come possono gli interessati esercitare i diritti di limitazione del trattamento e
                di opposizione?
            nb:
              text: Hvordan kan de registrerte utøve retten til begrensning av behandling og retten til
                å protestere?
        urn:intuitem:risk:qf_page:dpia:rights:question:processors:
          type: text
          text: Is a contract setting out their obligations in place with each of these parties?
          translations:
            fr:
              text: Un contrat précisant leurs obligations est-il en place avec chacune de ces parties
                ?
            it:
              text: È presente un contratto che definisce gli obblighi di ciascuno dei soggetti indicati?
            nb:
              text: Er det inngått en avtale med hver av disse partene som fastsetter pliktene deres?
        urn:intuitem:risk:qf_page:dpia:rights:question:transfers:
          type: text
          text: Do the safeguards listed protect the data transferred outside the EU adequately?
          required: false
          translations:
            fr:
              text: Les garanties listées protègent-elles suffisamment les données transférées hors de
                l'UE ?
            it:
              text: Le garanzie elencate assicurano un’adeguata protezione dei dati trasferiti al di fuori
                dell’Unione europea?
            nb:
              text: Gir garantiene som er oppført, tilstrekkelig vern for opplysninger som overføres ut
                av EU/EØS?
      translations:
        fr:
          name: 'Principes fondamentaux : mesures protégeant les droits des personnes'
          description: 'Montrez comment les personnes concernées peuvent exercer leurs droits. Repris
            de la fiche du traitement. Pour le corriger, modifiez le traitement : la soumission de ce
            formulaire conserve une copie de ce qui a été évalué.'
        it:
          name: 'Principi fondamentali: misure a tutela dei diritti degli interessati'
          description: 'Descrivere in che modo gli interessati possono esercitare i propri diritti. Le
            informazioni sono ricavate dalla scheda del trattamento. Per correggerle, modificare la scheda:
            l’invio del modulo conserva una copia delle informazioni valutate.'
        nb:
          name: 'Grunnleggende prinsipper: tiltak som ivaretar de registrertes rettigheter'
          description: 'Vis hvordan de registrerte kan utøve rettighetene sine. Hentet fra behandlingens
            oppføring. Endre behandlingen for å rette den: når skjemaet sendes inn, lagres en kopi av
            det som ble vurdert.'
    - urn: urn:intuitem:risk:qf_page:dpia:measures
      ref_id: measures
      name: 'Risks: existing or planned measures'
      description: The measures the processing already has, existing or planned. Each is an applied control,
        so its owner, due date and status are tracked like any other. Measures picked in this form join
        the processing once the DPIA is accepted.
      facts:
      - processing.controls
      questions:
        urn:intuitem:risk:qf_page:dpia:measures:question:measures:
          type: object_reference
          text: Which measures should the processing add?
          config:
            model: applied_control
            multiple: true
            subject_field: associated_controls
          required: false
          translations:
            fr:
              text: Quelles mesures le traitement doit-il ajouter ?
            it:
              text: Quali ulteriori misure devono essere associate al trattamento?
            nb:
              text: Hvilke tiltak bør legges til behandlingen?
        urn:intuitem:risk:qf_page:dpia:measures:question:notes:
          type: text
          text: Anything to add about these measures?
          required: false
          translations:
            fr:
              text: Quelque chose à ajouter sur ces mesures ?
            it:
              text: Ci sono ulteriori osservazioni sulle misure indicate?
            nb:
              text: Noe å tilføye om disse tiltakene?
      translations:
        fr:
          name: 'Risques : mesures existantes ou prévues'
          description: 'Les mesures dont le traitement dispose déjà, existantes ou prévues. Chacune est
            une mesure appliquée : son responsable, son échéance et son statut sont suivis comme les autres.
            Les mesures retenues dans ce formulaire rejoignent le traitement une fois l''AIPD acceptée.'
        it:
          name: 'Rischi: misure esistenti o pianificate'
          description: Le misure associate al trattamento, già attuate o pianificate. Ogni misura è un
            controllo applicato, di cui vengono monitorati il responsabile, la scadenza e lo stato. Le
            misure selezionate in questo modulo saranno associate al trattamento una volta accettata la
            DPIA.
        nb:
          name: 'Risiko: eksisterende eller planlagte tiltak'
          description: Tiltakene behandlingen allerede har, eksisterende eller planlagte. Hvert av dem
            er et tiltak i CISO Assistant, så eier, frist og status følges opp som for andre tiltak. Tiltak
            som velges i dette skjemaet, legges til behandlingen når DPIA-en er godtatt.
    - urn: urn:intuitem:risk:qf_page:dpia:illegitimate_access
      ref_id: illegitimate_access
      name: 'Risks: illegitimate access to data'
      description: Analyse the causes and consequences of an illegitimate access to data, then estimate
        its severity and likelihood given the measures in place. Then estimate them again as they will
        stand once the planned measures are implemented.
      questions:
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:impacts:
          type: text
          text: What would the main impacts on the data subjects be if this happened?
          translations:
            fr:
              text: Quels seraient les principaux impacts sur les personnes concernées si cela se produisait
                ?
            it:
              text: Quali sarebbero le principali conseguenze per gli interessati se l’evento si verificasse?
            nb:
              text: Hva ville de viktigste konsekvensene for de registrerte være hvis dette skjedde?
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:threats:
          type: text
          text: What are the main threats that could make it happen?
          translations:
            fr:
              text: Quelles sont les principales menaces qui pourraient le provoquer ?
            it:
              text: Quali sono le principali minacce che potrebbero causare l’evento?
            nb:
              text: Hvilke trusler kan føre til at det skjer?
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:sources:
          type: text
          text: Which risk sources could be behind it (internal or external people, non-human sources)?
          translations:
            fr:
              text: Quelles sources de risques pourraient en être à l'origine (personnes internes ou externes,
                sources non humaines) ?
            it:
              text: Quali fonti di rischio potrebbero causare l’evento (soggetti interni o esterni, fattori
                non umani)?
            nb:
              text: Hvilke risikokilder kan stå bak (interne eller eksterne personer, ikke-menneskelige
                kilder)?
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:measures:
          type: object_reference
          text: Which measures treat this risk?
          config:
            model: applied_control
            multiple: true
            subject_field: associated_controls
          required: false
          translations:
            fr:
              text: Quelles mesures traitent ce risque ?
            it:
              text: Quali misure trattano questo rischio?
            nb:
              text: Hvilke tiltak håndterer denne risikoen?
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:severity:
          type: unique_choice
          text: How severe is the risk, given the potential impacts and the measures in place?
          config:
            widget: slider
            scale: severity
          translations:
            fr:
              text: Quelle est la gravité du risque, compte tenu des impacts potentiels et des mesures
                en place ?
            it:
              text: Qual è la gravità del rischio, considerando le potenziali conseguenze per gli interessati
                e le misure in essere?
            nb:
              text: Hvor alvorlig er risikoen, gitt de mulige konsekvensene og tiltakene som er på plass?
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:severity_justification:
          type: text
          text: Justify the severity
          translations:
            fr:
              text: Justifiez la gravité
            it:
              text: Motivare la valutazione della gravità
            nb:
              text: Begrunn alvorligheten
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:likelihood:
          type: unique_choice
          text: How likely is the risk, given the threats, the risk sources and the measures in place?
          config:
            widget: slider
            scale: likelihood
          translations:
            fr:
              text: Quelle est la vraisemblance du risque, compte tenu des menaces, des sources de risques
                et des mesures en place ?
            it:
              text: Qual è la probabilità del rischio, considerando le minacce, le fonti di rischio e
                le misure in essere?
            nb:
              text: Hvor sannsynlig er risikoen, gitt truslene, risikokildene og tiltakene som er på plass?
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:likelihood_justification:
          type: text
          text: Justify the likelihood
          translations:
            fr:
              text: Justifiez la vraisemblance
            it:
              text: Motivare la valutazione della probabilità
            nb:
              text: Begrunn sannsynligheten
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:residual_severity:
          type: unique_choice
          text: Severity once the planned measures are implemented
          config:
            widget: slider
            scale: severity
            stage: residual
          required: false
          translations:
            fr:
              text: Gravité une fois les mesures prévues mises en œuvre
            it:
              text: Gravità dopo l’attuazione delle misure pianificate
            nb:
              text: Alvorlighet når de planlagte tiltakene er gjennomført
        urn:intuitem:risk:qf_page:dpia:illegitimate_access:question:residual_likelihood:
          type: unique_choice
          text: Likelihood once the planned measures are implemented
          config:
            widget: slider
            scale: likelihood
            stage: residual
          required: false
          translations:
            fr:
              text: Vraisemblance une fois les mesures prévues mises en œuvre
            it:
              text: Probabilità dopo l’attuazione delle misure pianificate
            nb:
              text: Sannsynlighet når de planlagte tiltakene er gjennomført
      translations:
        fr:
          name: 'Risques : accès illégitime à des données'
          description: Analysez les causes et les conséquences d'un accès illégitime à des données, puis
            estimez sa gravité et sa vraisemblance compte tenu des mesures en place. Estimez-les ensuite
            de nouveau telles qu'elles seront une fois les mesures prévues mises en œuvre.
        it:
          name: 'Rischi: accesso illegittimo ai dati'
          description: Analizzare le cause e le conseguenze di un accesso illegittimo ai dati, quindi
            stimarne la gravità e la probabilità tenendo conto delle misure in essere. Ripetere la valutazione
            considerando l’attuazione delle misure pianificate.
        nb:
          name: 'Risiko: uberettiget tilgang til opplysninger'
          description: Analyser årsakene til og konsekvensene av uberettiget tilgang til opplysninger,
            og anslå deretter alvorlighet og sannsynlighet ut fra tiltakene som er på plass. Anslå dem
            så på nytt slik de vil være når de planlagte tiltakene er gjennomført.
