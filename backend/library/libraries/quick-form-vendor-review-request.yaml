urn: urn:intuitem:risk:library:vendor-review-request
locale: en
ref_id: vendor-review-request
name: Vendor review request
description: >
  Ask for a third party to be reviewed before you start using them. The answers scope
  the review rather than perform it: who the vendor is, how the service is delivered,
  what they would hold or reach, and how much the business would depend on them.
copyright: © intuitem
version: 2
publication_date: 2026-09-12
provider: intuitem
packager: intuitem
objects:
  quick_forms:
  - urn: urn:intuitem:risk:quick_form:vendor-review-request
    ref_id: vendor-review-request
    name: Vendor review request
    description: >
      Feeds a third-party assessment. Criticality, dependency and trust stay the
      assessor's judgement — this only gathers what is needed to scope and prioritise.
    ref_id_prefix: VDR
    title_question_urn: urn:intuitem:risk:qf_page:vendor-review-request:vendor:question:vendor_name
    # Bounds clamp the *displayed* score only. Outcome rules read `response.score_sum`,
    # which is the raw total, so the threshold below is unaffected by `max`.
    scores_definition:
      min: 0
      max: 400
      aggregation: sum
    outcomes_definition:
    # Routing on the total rather than on named answers: one threshold to tune instead
    # of an enumeration of combinations that grows every time a choice is added.
    - ref_id: full_assessment_required
      label: Full assessment required
      expression: 'response.score_sum >= 100'
      translations:
        de:
          label: Vollständige Prüfung erforderlich
    - ref_id: personal_data_involved
      label: Personal data involved
      expression: >-
        "exposure:question:data_types:choice:personal" in answers["exposure:question:data_types"].selected_choices ||
        "exposure:question:data_types:choice:sensitive" in answers["exposure:question:data_types"].selected_choices
      translations:
        de:
          label: Personenbezogene Daten betroffen
    - ref_id: concentration_risk
      label: Concentration risk
      expression: >-
        "dependency:question:business_impact:choice:cannot_operate" in answers["dependency:question:business_impact"].selected_choices &&
        answers["dependency:question:alternatives"].answered &&
        answers["dependency:question:alternatives"].value == false
      translations:
        de:
          label: Konzentrationsrisiko
    pages:
    - urn: urn:intuitem:risk:qf_page:vendor-review-request:vendor
      ref_id: vendor
      name: Who and what
      description: |
        Identify the third party and what you intend to use them for.
      questions:
        urn:intuitem:risk:qf_page:vendor-review-request:vendor:question:vendor_name:
          type: text
          text: Which company?
          annotation: The legal entity you would contract with, not the product name.
          translations:
            de:
              text: Welches Unternehmen?
              annotation: Die juristische Person, mit der Sie den Vertrag schließen würden, nicht der
                Produktname.
        urn:intuitem:risk:qf_page:vendor-review-request:vendor:question:service:
          type: text
          text: What will they do for us?
          translations:
            de:
              text: Was wird der Anbieter für uns tun?
        urn:intuitem:risk:qf_page:vendor-review-request:vendor:question:already_used:
          type: boolean
          text: Are we already working with them?
          annotation: A renewal or an extension of scope still needs a review.
          translations:
            de:
              text: Arbeiten wir bereits mit diesem Anbieter zusammen?
              annotation: Auch eine Verlängerung oder eine Erweiterung des Leistungsumfangs erfordert
                eine Prüfung.
        urn:intuitem:risk:qf_page:vendor-review-request:vendor:question:website:
          type: text
          text: Website or contract reference
          required: false

          translations:
            de:
              text: Website oder Vertragsreferenz
      translations:
        de:
          name: Anbieter und Leistung
          description: |
            Benennen Sie die Drittpartei und wofür Sie deren Leistungen nutzen möchten.
    - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure
      ref_id: exposure
      name: What they would touch
      description: |
        Delivery model, where the data sits, what data it is, and what they can reach.
        These four answers carry the score.
      questions:
        urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:hosting_model:
          type: unique_choice
          text: How is the service delivered?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:hosting_model:choice:saas
            value: SaaS — they run the application and the infrastructure
            add_score: 30
            translations:
              de:
                value: SaaS – der Anbieter betreibt Anwendung und Infrastruktur
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:hosting_model:choice:paas_iaas
            value: Hosting (PaaS, IaaS) — they run the infrastructure, we run the application
            add_score: 20
            translations:
              de:
                value: Hosting (PaaS, IaaS) – der Anbieter betreibt die Infrastruktur, wir die Anwendung
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:hosting_model:choice:on_premises
            value: On-premises — it runs on our own infrastructure
            add_score: 0
            translations:
              de:
                value: On-Premises – Betrieb auf unserer eigenen Infrastruktur
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:hosting_model:choice:hybrid
            value: Hybrid — part ours, part theirs
            add_score: 20
            translations:
              de:
                value: Hybrid – teilweise bei uns, teilweise beim Anbieter
          translations:
            de:
              text: Wie wird die Leistung bereitgestellt?
        urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_location:
          type: unique_choice
          text: Where would the data sit?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_location:choice:eu
            value: EU / EEA
            add_score: 0
            translations:
              de:
                value: EU / EWR
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_location:choice:adequacy
            value: Country with an adequacy decision
            add_score: 10
            translations:
              de:
                value: Land mit Angemessenheitsbeschluss
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_location:choice:elsewhere
            value: Elsewhere
            add_score: 40
            translations:
              de:
                value: Anderswo
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_location:choice:unknown
            value: We do not know yet
            add_score: 40
            translations:
              de:
                value: Noch nicht bekannt
          translations:
            de:
              text: Wo würden die Daten gespeichert?
        urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_types:
          type: multiple_choice
          text: What data would they hold or see?
          annotation: Tick everything that applies — the score adds up.
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_types:choice:none
            value: None
            add_score: 0
            translations:
              de:
                value: Keine
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_types:choice:internal
            value: Internal business data
            add_score: 10
            translations:
              de:
                value: Interne Geschäftsdaten
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_types:choice:personal
            value: Personal data
            add_score: 40
            translations:
              de:
                value: Personenbezogene Daten
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_types:choice:sensitive
            value: Sensitive personal data (health, biometrics, opinions)
            add_score: 60
            translations:
              de:
                value: Sensible personenbezogene Daten (Gesundheit, Biometrie, Meinungen)
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_types:choice:financial
            value: Financial or otherwise regulated data
            add_score: 60
            translations:
              de:
                value: Finanzdaten oder anderweitig regulierte Daten
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:data_types:choice:credentials
            value: Credentials or secrets
            add_score: 80
            translations:
              de:
                value: Zugangsdaten oder Geheimnisse
          translations:
            de:
              text: Welche Daten würde der Anbieter speichern oder einsehen?
              annotation: Wählen Sie alles Zutreffende aus – die Punkte werden addiert.
        urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:access:
          type: multiple_choice
          text: What access would they need?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:access:choice:none
            value: No access to our systems
            add_score: 0
            translations:
              de:
                value: Keinen Zugriff auf unsere Systeme
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:access:choice:staff_data
            value: Our staff directory or contact data
            add_score: 10
            translations:
              de:
                value: Unser Mitarbeiterverzeichnis oder Kontaktdaten
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:access:choice:network
            value: Our internal network
            add_score: 40
            translations:
              de:
                value: Unser internes Netzwerk
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:access:choice:production
            value: Production systems
            add_score: 60
            translations:
              de:
                value: Produktivsysteme
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:exposure:question:access:choice:source_code
            value: Our source code
            add_score: 40

            translations:
              de:
                value: Unseren Quellcode
          translations:
            de:
              text: Welchen Zugriff würde der Anbieter benötigen?
      translations:
        de:
          name: Daten und Zugriffe
          description: |
            Bereitstellungsmodell, Speicherort und Art der Daten sowie Zugriffsmöglichkeiten. Diese vier Antworten bestimmen den Punktwert.
    - urn: urn:intuitem:risk:qf_page:vendor-review-request:dependency
      ref_id: dependency
      name: How much we would depend on them
      description: |
        What happens if they stop, and how quickly we could replace them.
      questions:
        urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:business_impact:
          type: unique_choice
          text: If they were unavailable for a week, what happens?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:business_impact:choice:negligible
            value: Negligible — we would barely notice
            add_score: 0
            translations:
              de:
                value: Vernachlässigbar – wir würden es kaum bemerken
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:business_impact:choice:degraded
            value: Degraded — a workaround exists
            add_score: 20
            translations:
              de:
                value: Beeinträchtigt – eine Ausweichlösung ist vorhanden
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:business_impact:choice:major
            value: Major disruption — a service would be visibly affected
            add_score: 50
            translations:
              de:
                value: Erhebliche Störung – eine Leistung wäre spürbar beeinträchtigt
          - urn: urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:business_impact:choice:cannot_operate
            value: We could not operate
            add_score: 80
            translations:
              de:
                value: Wir könnten nicht weiterarbeiten
          translations:
            de:
              text: Was geschieht, wenn der Anbieter eine Woche lang nicht verfügbar ist?
        urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:alternatives:
          type: boolean
          text: Could we switch to another provider within three months?
          translations:
            de:
              text: Könnten wir innerhalb von drei Monaten zu einem anderen Anbieter wechseln?
        urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:needed_by:
          type: date
          text: When do you need the decision?
          translations:
            de:
              text: Bis wann benötigen Sie die Entscheidung?
        urn:intuitem:risk:qf_page:vendor-review-request:dependency:question:documentation:
          type: file
          text: Security documentation they have already given you
          required: false
          annotation: SOC 2 report, ISO 27001 certificate, pentest summary, DPA draft.
          config:
            accept: .pdf,.docx,.png,.jpg
          translations:
            de:
              text: Bereits erhaltene Sicherheitsdokumentation des Anbieters
              annotation: SOC-2-Bericht, ISO-27001-Zertifikat, Zusammenfassung eines Penetrationstests,
                Entwurf einer Auftragsverarbeitungsvereinbarung.
      translations:
        de:
          name: Abhängigkeit vom Anbieter
          description: |
            Was bei einem Ausfall geschieht und wie schnell wir den Anbieter ersetzen könnten.
    translations:
      de:
        name: Antrag auf Anbieterprüfung
        description: |-
          Liefert Angaben für eine Drittparteiprüfung. Kritikalität, Abhängigkeit und Vertrauen bleiben im Ermessen der bewertenden Person – hier werden nur die zur Abgrenzung und Priorisierung benötigten Angaben gesammelt.
translations:
  de:
    name: Antrag auf Anbieterprüfung
    description: |-
      Beantragen Sie eine Prüfung einer Drittpartei, bevor Sie deren Leistungen nutzen. Die Antworten legen den Prüfumfang fest; sie stellen noch keine Prüfung dar: Wer ist der Anbieter, wie wird die Leistung erbracht, welche Daten würde er halten oder worauf zugreifen und wie stark wäre das Unternehmen von ihm abhängig?

      Hinweis zur Übersetzung: KI-gestützte Übersetzung der englischen Fassung, ohne unabhängige menschliche Prüfung. Im Zweifel gilt die englische Fassung.
