urn: urn:intuitem:risk:library:risk-matrix-4x4-privacy
locale: en
ref_id: risk-matrix-4x4-privacy
name: 4x4 privacy risk matrix (DPIA)
description: Risk to the rights and freedoms of data subjects, for data protection
  impact assessments. Four levels of severity and likelihood; a maximum severity is
  never acceptable, whatever its likelihood.
copyright: intuitem
version: 2
publication_date: 2026-09-28
provider: intuitem
packager: intuitem
translations:
  fr:
    name: Matrice 4x4 de risque vie privée (AIPD)
    description: Risque pour les droits et libertés des personnes concernées, pour les
      analyses d'impact relatives à la protection des données. Quatre niveaux de gravité
      et de vraisemblance ; une gravité maximale n'est jamais acceptable, quelle que
      soit sa vraisemblance.
  nb:
    name: 4x4-risikomatrise for personvern (DPIA)
    description: Risiko for de registrertes rettigheter og friheter, for vurderinger
      av personvernkonsekvenser. Fire nivåer for alvorlighet og sannsynlighet; maksimal
      alvorlighet er aldri akseptabel, uansett sannsynlighet.
objects:
  risk_matrix:
  - urn: urn:intuitem:risk:matrix:risk-matrix-4x4-privacy
    ref_id: risk-matrix-4x4-privacy
    name: 4x4 privacy risk matrix (DPIA)
    description: Risk to the rights and freedoms of data subjects.
    probability:
    - id: 0
      abbreviation: L1
      name: Negligible
      description: The feared event does not seem possible given the properties of the
        supporting assets.
      translations:
        fr:
          name: Négligeable
          description: L'événement redouté ne semble pas pouvoir se produire compte tenu
            des propriétés des supports.
        nb:
          name: Ubetydelig
          description: Den uønskede hendelsen virker ikke mulig ut fra egenskapene
            til støtteverdiene.
      hexcolor: '#F0F4E8'
    - id: 1
      abbreviation: L2
      name: Limited
      description: The feared event seems difficult to bring about given the properties
        of the supporting assets.
      translations:
        fr:
          name: Limitée
          description: L'événement redouté semble difficile à provoquer compte tenu des
            propriétés des supports.
        nb:
          name: Begrenset
          description: Den uønskede hendelsen virker vanskelig å utløse ut fra
            egenskapene til støtteverdiene.
      hexcolor: '#DDE8C8'
    - id: 2
      abbreviation: L3
      name: Significant
      description: The feared event seems possible given the properties of the
        supporting assets.
      translations:
        fr:
          name: Importante
          description: L'événement redouté semble possible compte tenu des propriétés
            des supports.
        nb:
          name: Betydelig
          description: Den uønskede hendelsen virker mulig ut fra egenskapene til
            støtteverdiene.
      hexcolor: '#C3D69F'
    - id: 3
      abbreviation: L4
      name: Maximum
      description: The feared event seems easy to bring about given the properties of
        the supporting assets.
      translations:
        fr:
          name: Maximale
          description: L'événement redouté semble facile à provoquer compte tenu des
            propriétés des supports.
        nb:
          name: Maksimal
          description: Den uønskede hendelsen virker lett å utløse ut fra egenskapene
            til støtteverdiene.
      hexcolor: '#A4C170'
    impact:
    - id: 0
      abbreviation: S1
      name: Negligible
      description: Data subjects are not affected, or face minor inconveniences they
        overcome without difficulty.
      translations:
        fr:
          name: Négligeable
          description: Les personnes ne sont pas impactées ou subissent des désagréments
            mineurs qu'elles surmontent sans difficulté.
        nb:
          name: Ubetydelig
          description: De registrerte påvirkes ikke, eller får mindre ulemper som
            de kommer over uten problemer.
      hexcolor: '#E8F0F8'
    - id: 1
      abbreviation: S2
      name: Limited
      description: Data subjects face significant inconveniences they overcome despite
        some difficulty.
      translations:
        fr:
          name: Limitée
          description: Les personnes subissent des désagréments significatifs qu'elles
            surmontent malgré quelques difficultés.
        nb:
          name: Begrenset
          description: De registrerte får merkbare ulemper som de kommer over, men
            med noen vanskeligheter.
      hexcolor: '#C6DAEE'
    - id: 2
      abbreviation: S3
      name: Significant
      description: Data subjects face significant consequences they overcome only with
        serious difficulty.
      translations:
        fr:
          name: Importante
          description: Les personnes subissent des conséquences significatives qu'elles
            ne surmontent qu'avec de sérieuses difficultés.
        nb:
          name: Betydelig
          description: De registrerte får alvorlige konsekvenser som de bare kommer
            over med store vanskeligheter.
      hexcolor: '#94BBE0'
    - id: 3
      abbreviation: S4
      name: Maximum
      description: Data subjects face significant, possibly irreversible consequences
        they may not overcome.
      translations:
        fr:
          name: Maximale
          description: Les personnes subissent des conséquences significatives, voire
            irrémédiables, qu'elles pourraient ne pas surmonter.
        nb:
          name: Maksimal
          description: De registrerte får alvorlige, muligens uopprettelige konsekvenser
            som de kanskje ikke kommer over.
      hexcolor: '#5E97CF'
    risk:
    - id: 0
      abbreviation: A
      name: Acceptable
      description: The risk can be accepted with the measures in place.
      translations:
        fr:
          name: Acceptable
          description: Le risque peut être accepté avec les mesures en place.
        nb:
          name: Akseptabel
          description: Risikoen kan aksepteres med tiltakene som er på plass.
      hexcolor: '#BBF7D0'
    - id: 1
      abbreviation: R
      name: To reduce
      description: Additional measures should reduce the risk before the processing
        goes ahead.
      translations:
        fr:
          name: À réduire
          description: Des mesures complémentaires doivent réduire le risque avant la
            mise en œuvre du traitement.
        nb:
          name: Må reduseres
          description: Risikoen må reduseres med ytterligere tiltak før behandlingen
            settes i gang.
      hexcolor: '#FEF08A'
    - id: 2
      abbreviation: U
      name: Unacceptable
      description: The risk is not acceptable. Reduce it or consult the supervisory
        authority.
      translations:
        fr:
          name: Inacceptable
          description: Le risque n'est pas acceptable. Le réduire ou consulter l'autorité
            de contrôle.
        nb:
          name: Uakseptabel
          description: Risikoen er ikke akseptabel. Reduser den, eller forhåndsdrøft
            behandlingen med tilsynsmyndigheten.
      hexcolor: '#FCA5A5'
    grid:
    - - 0
      - 0
      - 1
      - 2
    - - 0
      - 1
      - 1
      - 2
    - - 0
      - 1
      - 2
      - 2
    - - 1
      - 1
      - 2
      - 2
    translations:
      fr:
        name: Matrice 4x4 de risque vie privée (AIPD)
        description: Risque pour les droits et libertés des personnes concernées.

      nb:
        name: 4x4-risikomatrise for personvern (DPIA)
        description: Risiko for de registrertes rettigheter og friheter.