urn: urn:intuitem:risk:library:bsi-bsig-nis2-2025
locale: de
ref_id: BSI-BSIG-NIS2-2025
name: BSI-Gesetz (BSIG) zur NIS2 Umsetzung 2025
description: "Gesetz \xFCber das Bundesamt f\xFCr Sicherheit in der Informationstechnik\
  \ und \xFCber die Sicherheit in der Informationstechnik von Einrichtungen (BSIG),\
  \ Teile 3 bis 5 (\xA7\xA7 28 bis 55), in der konsolidierten Fassung, zuletzt ge\xE4\
  ndert durch Art. 8 G v. 22.10.2026 (BGBl. 2026 I Nr. 318).\nQuelle: https://www.gesetze-im-internet.de/bsig_2025/\n\
  Die Bibliothek liegt nur auf Deutsch vor: Eine amtliche englische Fassung gibt es\
  \ nicht."
copyright: Gemeinfrei - amtlicher Gesetzestext
version: 1
publication_date: 2026-10-22
provider: Bundesministerium des Innern
packager: intuitem
objects:
  frameworks:
  - urn: urn:intuitem:risk:framework:bsi-bsig-nis2-2025
    ref_id: BSI-BSIG-NIS2-2025
    name: BSI-Gesetz (BSIG) - Umsetzung der NIS-2-Richtlinie (2025)
    description: "BSIG in der Fassung des NIS-2-Umsetzungsgesetzes (BGBl. 2025 I Nr.\
      \ 301), Teile 3 bis 5 (\xA7\xA7 28 bis 55), Stand der konsolidierten Fassung:\
      \ letzte \xC4nderung durch Art. 8 G v. 22.10.2026 (BGBl. 2026 I Nr. 318).\n\n\
      Bewertbar sind die Abs\xE4tze, die der gepr\xFCften Organisation eine eigenst\xE4\
      ndige, dauerhafte Pflicht auferlegen; \xA7 30 Abs. 2 und \xA7 32 Abs. 1 sind\
      \ nach Nummern gegliedert. Als nicht bewertbarer Kontext bleiben erhalten: Vorschriften\
      \ zum Anwendungsbereich, Aufgaben und Befugnisse von Beh\xF6rden, Wahlm\xF6\
      glichkeiten, Pflichten, die erst durch eine Anordnung oder ein Verlangen einer\
      \ Beh\xF6rde entstehen, Pflichten, die eine noch zu erlassende Rechtsverordnung\
      \ voraussetzen (\xA7 30 Abs. 6), sowie die Bedingungen freiwilliger Verfahren\
      \ (\xA7\xA7 52 bis 55).\n\nDie Implementierungsgruppen bilden die Art der Einrichtung\
      \ ab: Damit werden nur die jeweils einschl\xE4gigen Pflichten gepr\xFCft. Sektorspezifische\
      \ Ausnahmen (\xA7 28 Abs. 5 bis 7, \xA7 29 Abs. 3, \xA7 37) sind im Einzelfall\
      \ zu pr\xFCfen. Begriffsbestimmungen (\xA7 2), Aufsicht und Bu\xDFgelder sind\
      \ nicht enthalten."
    implementation_groups_definition:
    - ref_id: EINR
      name: Besonders wichtige Einrichtungen und wichtige Einrichtungen
      description: "\xA7 28 Abs. 1 und 2"
      default_selected: true
    - ref_id: KRITIS
      name: Betreiber kritischer Anlagen
      description: "\xA7 28 Abs. 1 Nr. 1. Enth\xE4lt die Pflichten besonders wichtiger\
        \ Einrichtungen sowie \xA7 31, \xA7 32 Abs. 3, \xA7 33 Abs. 2 und \xA7 39."
    - ref_id: BUND
      name: Einrichtungen der Bundesverwaltung
      description: "\xA7 29 Abs. 1. Enth\xE4lt die nach \xA7 29 Abs. 2 anzuwendenden\
        \ Pflichten sowie \xA7\xA7 43 bis 45 und \xA7 47."
    - ref_id: RESSORT
      name: "Ressorts und weitere oberste Bundesbeh\xF6rden"
      description: "\xA7 46. Erg\xE4nzend zu BUND zu w\xE4hlen."
    - ref_id: DNS
      name: Top Level Domain Name Registries und Domain-Name-Registry-Dienstleister
      description: "\xA7 33 und \xA7\xA7 49 bis 51. Erg\xE4nzend zur jeweiligen Einrichtungsgruppe\
        \ zu w\xE4hlen."
    - ref_id: DIG
      name: "Einrichtungsarten nach \xA7 60 Abs. 1 Satz 1"
      description: "\xA7 34. Erg\xE4nzend zur jeweiligen Einrichtungsgruppe zu w\xE4\
        hlen."
