      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      ref_id: 30.2.9
      name: "\xA7 30 Abs. 2 Nr. 9"
      description: "Erstellung von Konzepten f\xFCr die Sicherheit des Personals,\
