      name: Kapitel 1 - Anwendungsbereich
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:teil-3.kapitel-1
      ref_id: '28'
      name: "\xA7 28 - Besonders wichtige Einrichtungen und wichtige Einrichtungen"
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.1
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.1'
      name: "\xA7 28 Abs. 1"
      description: "Als besonders wichtige Einrichtung gelten\n1. Betreiber kritischer\
        \ Anlagen,\n2. qualifizierte Vertrauensdiensteanbieter, Top Level Domain Name\
        \ Registries oder DNS-Diensteanbieter,\n3. Anbieter \xF6ffentlich zug\xE4\
        nglicher Telekommunikationsdienste oder Betreiber \xF6ffentlicher Telekommunikationsnetze,\
        \ die\na) mindestens 50 Mitarbeiter besch\xE4ftigen oder\nb) einen Jahresumsatz\
        \ und eine Jahresbilanzsumme von jeweils \xFCber 10 Millionen Euro aufweisen,\n\
        4. sonstige nat\xFCrliche oder juristische Personen oder rechtlich unselbstst\xE4\
        ndige Organisationseinheiten einer Gebietsk\xF6rperschaft, die anderen nat\xFC\
        rlichen oder juristischen Personen entgeltlich Waren oder Dienstleistungen\
        \ anbieten und die einer der in Anlage 1 bestimmten Einrichtungsarten zuzuordnen\
        \ sind, und\na) mindestens 250 Mitarbeiter besch\xE4ftigen oder\nb) einen\
        \ Jahresumsatz von \xFCber 50 Millionen Euro und zudem eine Jahresbilanzsumme\
        \ von \xFCber 43 Millionen Euro aufweisen.\nDavon ausgenommen sind Einrichtungen\
        \ der Bundesverwaltung, sofern sie nicht gleichzeitig Betreiber kritischer\
        \ Anlagen sind."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.2
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.2'
      name: "\xA7 28 Abs. 2"
      description: "Als wichtige Einrichtungen gelten\n1. Vertrauensdiensteanbieter,\n\
        2. Anbieter \xF6ffentlich zug\xE4nglicher Telekommunikationsdienste oder Betreiber\
        \ \xF6ffentlicher Telekommunikationsnetze, die\na) weniger als 50 Mitarbeiter\
        \ besch\xE4ftigen und\nb) einen Jahresumsatz oder eine Jahresbilanzsumme von\
        \ jeweils 10 Millionen Euro oder weniger aufweisen,\n3. sonstige nat\xFCrliche\
        \ oder juristische Personen oder rechtlich unselbstst\xE4ndige Organisationseinheiten\
        \ einer Gebietsk\xF6rperschaft, die anderen nat\xFCrlichen oder juristischen\
        \ Personen entgeltlich Waren oder Dienstleistungen anbieten und die einer\
        \ der in den Anlagen 1 und 2 bestimmten Einrichtungsarten zuzuordnen sind\
        \ und\na) mindestens 50 Mitarbeiter besch\xE4ftigen oder\nb) einen Jahresumsatz\
        \ und eine Jahresbilanzsumme von jeweils \xFCber 10 Millionen Euro aufweisen.\n\
        Davon ausgenommen sind besonders wichtige Einrichtungen und Einrichtungen\
        \ der Bundesverwaltung."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.3
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.3'
      name: "\xA7 28 Abs. 3"
      description: "Bei der Zuordnung zu einer der Einrichtungsarten nach den Anlagen\
        \ 1 und 2 k\xF6nnen solche Gesch\xE4ftst\xE4tigkeiten unber\xFCcksichtigt\
        \ bleiben, die im Hinblick auf die gesamte Gesch\xE4ftst\xE4tigkeit der Einrichtung\
        \ vernachl\xE4ssigbar sind."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.4
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.4'
      name: "\xA7 28 Abs. 4"
      description: "Bei der Bestimmung von Mitarbeiteranzahl, Jahresumsatz und Jahresbilanzsumme\
        \ nach den Abs\xE4tzen 1 und 2 ist au\xDFer f\xFCr rechtlich unselbstst\xE4\
        ndige Organisationseinheiten einer Gebietsk\xF6rperschaft die Empfehlung der\
        \ Kommission (2003/361/EG) mit Ausnahme von Artikel 3 Absatz 4 des Anhangs\
        \ anzuwenden. Die Daten von Partner- oder verbundenen Unternehmen im Sinne\
        \ der Empfehlung der Kommission (2003/361/EG) sind nicht hinzuzurechnen, wenn\
        \ das Unternehmen unter Ber\xFCcksichtigung der rechtlichen, wirtschaftlichen\
        \ und tats\xE4chlichen Umst\xE4nde mit Blick auf die Beschaffenheit und den\
        \ Betrieb der informationstechnischen Systeme, Komponenten und Prozesse unabh\xE4\
        ngig von seinen Partner- oder verbundenen Unternehmen ist."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.5
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.5'
      name: "\xA7 28 Abs. 5"
      description: "Die \xA7\xA7 30, 31, 32, 35, 36, 38, 39, 61 und 62 gelten nicht\
        \ f\xFCr besonders wichtige Einrichtungen und wichtige Einrichtungen, die\n\
        1. ein \xF6ffentliches Telekommunikationsnetz betreiben oder \xF6ffentlich\
        \ zug\xE4ngliche Telekommunikationsdienste erbringen oder\n2. Energieversorgungsnetze,\
        \ Energieanlagen oder digitale Energiedienste nach dem Energiewirtschaftsgesetz\
        \ betreiben und den Regelungen der \xA7\xA7 5c bis 5e des Energiewirtschaftsgesetzes\
        \ unterliegen.\nSatz 1 gilt nicht f\xFCr die dort aufgef\xFChrten besonders\
        \ wichtigen und wichtigen Einrichtungen, soweit sie \xFCber die in Satz 1\
        \ Nummer 1 und 2 genannten Anlagen hinaus weitere kritische Anlagen nach \xA7\
        \ 2 Nummer 22 betreiben oder aufgrund weiterer T\xE4tigkeiten einer der in\
        \ Anlage 1 oder 2 bestimmten Einrichtungsarten zuzuordnen sind. Satz 2 gilt\
        \ f\xFCr alle informationstechnischen Systeme, die f\xFCr den Betrieb der\
        \ weiteren kritischen Anlagen erforderlich sind. Im Fall, dass der Betrieb\
        \ einer Energieanlage nach Satz 1 Nummer 2 einer in Satz 1 aufgef\xFChrten\
        \ besonders wichtigen und wichtigen Einrichtung im Hinblick auf die gesamte\
        \ Gesch\xE4ftst\xE4tigkeit dieser Einrichtung eine Nebent\xE4tigkeit darstellt,\
        \ findet dieser Absatz keine Anwendung."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.6
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.6'
      name: "\xA7 28 Abs. 6"
      description: "Die \xA7\xA7 30, 31, 32, 35, 36, 38 und 39 gelten nicht f\xFC\
        r\n1. Finanzunternehmen nach Artikel 2 Absatz 2 der Verordnung (EU) 2022/2554\
        \ und Unternehmen, f\xFCr die die Anforderungen der Verordnung (EU) 2022/2554\
        \ aufgrund von \xA7 1a Absatz 2 und 2a des Kreditwesengesetzes oder \xA7 293\
        \ Absatz 5 des Versicherungsaufsichtsgesetzes gelten,\n2. die Gesellschaft\
        \ f\xFCr Telematik nach \xA7 306 Absatz 1 Satz 3 des F\xFCnften Buches Sozialgesetzbuch,\
        \ Betreiber von Diensten der Telematikinfrastruktur im Hinblick auf die nach\
        \ \xA7 311 Absatz 6 und \xA7 325 des F\xFCnften Buches Sozialgesetzbuch zugelassenen\
        \ Dienste und Betreiber von Diensten, soweit sie die Telematikinfrastruktur\
        \ f\xFCr nach \xA7 327 Absatz 2 bis 5 des F\xFCnften Buches Sozialgesetzbuch\
        \ best\xE4tigte Anwendungen nutzen."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.7
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.7'
      name: "\xA7 28 Abs. 7"
      description: "\xA7 32 gilt nicht f\xFCr Betreiber kritischer Anlagen, soweit\
        \ sie eine Anlage f\xFCr Unternehmen nach Absatz 6 Nummer 1 betreiben."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28.8
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:28
      ref_id: '28.8'
      name: "\xA7 28 Abs. 8"
      description: "Dieses Gesetz findet keine Anwendung auf rechtlich unselbstst\xE4\
        ndige Organisationseinheiten von Gebietsk\xF6rperschaften und auf juristische\
        \ Personen, an denen ausschlie\xDFlich Gebietsk\xF6rperschaften, ausgenommen\
        \ der Bund, beteiligt sind, wenn sie\n1. zu dem Zweck errichtet wurden, im\
        \ \xF6ffentlichen Auftrag Leistungen f\xFCr Verwaltungen zu erbringen, und\n\
        2. durch vergleichbare landesrechtliche Vorschriften unter Bezugnahme auf\
        \ diesen Absatz reguliert werden."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:29
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:teil-3.kapitel-1
      ref_id: '29'
      name: "\xA7 29 - Einrichtungen der Bundesverwaltung"
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:29.1
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:29
      ref_id: '29.1'
      name: "\xA7 29 Abs. 1"
      description: "Einrichtungen der Bundesverwaltung im Sinne dieses Gesetzes sind,\
        \ mit Ausnahme der Institutionen der Sozialen Sicherung und der Deutschen\
        \ Bundesbank,\n1. Bundesbeh\xF6rden,\n2. \xF6ffentlich-rechtlich organisierte\
        \ IT-Dienstleister der Bundesverwaltung sowie\n3. weitere K\xF6rperschaften,\
        \ Anstalten und Stiftungen des \xF6ffentlichen Rechts sowie ihre Vereinigungen,\
        \ ungeachtet ihrer Rechtsform, auf Bundesebene, soweit durch das Bundesamt\
        \ im Einvernehmen mit dem jeweils zust\xE4ndigen Ressort angeordnet."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:29.2
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:29
      ref_id: '29.2'
      name: "\xA7 29 Abs. 2"
      description: "F\xFCr Einrichtungen der Bundesverwaltung sind die Regelungen\
        \ f\xFCr besonders wichtige Einrichtungen anzuwenden, nicht jedoch die Regelungen\
        \ der \xA7\xA7 38, 40 Absatz 3 und der \xA7\xA7 61 und 65."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:29.3
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:29
      ref_id: '29.3'
      name: "\xA7 29 Abs. 3"
      description: "Die Gesch\xE4ftsbereiche des Ausw\xE4rtigen Amts und des Bundesministeriums\
        \ der Verteidigung sowie der Bundesnachrichtendienst und das Bundesamt f\xFC\
        r Verfassungsschutz sind zus\xE4tzlich zu den Regelungen gem\xE4\xDF Absatz\
        \ 2 von den Regelungen des \xA7 7 Absatz 5 Satz 4, der \xA7\xA7 10, 13 Absatz\
        \ 1 Satz 1 Nummer 1 Buchstabe e sowie der \xA7\xA7 30, 33 und 35 ausgenommen.\
        \ Das Ausw\xE4rtige Amt erl\xE4sst im Einvernehmen mit dem Bundesministerium\
        \ f\xFCr Digitales und Staatsmodernisierung eine allgemeine Verwaltungsvorschrift,\
        \ um die Ziele der NIS-2-Richtlinie im Gesch\xE4ftsbereich des Ausw\xE4rtigen\
        \ Amts durch ergebnis\xE4quivalente Ma\xDFnahmen umzusetzen."
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:teil-3.kapitel-2
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:teil-3
      ref_id: Teil-3.Kapitel-2
      name: Kapitel 2 - Risikomanagement, Melde-, Registrierungs-, Nachweis- und Unterrichtungspflichten
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:teil-3.kapitel-2
      ref_id: '30'
      name: "\xA7 30 - Risikomanagementma\xDFnahmen besonders wichtiger Einrichtungen\
        \ und wichtiger Einrichtungen"
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30
      ref_id: '30.1'
      name: "\xA7 30 Abs. 1"
      description: "Besonders wichtige Einrichtungen und wichtige Einrichtungen sind\
        \ verpflichtet, geeignete, verh\xE4ltnism\xE4\xDFige und wirksame technische\
        \ und organisatorische Ma\xDFnahmen, die in Absatz 2 konkretisiert werden,\
        \ zu ergreifen, um St\xF6rungen der Verf\xFCgbarkeit, Integrit\xE4t und Vertraulichkeit\
        \ der informationstechnischen Systeme, Komponenten und Prozesse, die sie f\xFC\
        r die Erbringung ihrer Dienste nutzen, zu vermeiden und Auswirkungen von Sicherheitsvorf\xE4\
        llen m\xF6glichst gering zu halten. Bei der Bewertung der Verh\xE4ltnism\xE4\
        \xDFigkeit der Ma\xDFnahmen nach Satz 1 sind das Ausma\xDF der Risikoexposition,\
        \ die Gr\xF6\xDFe der Einrichtung, die Umsetzungskosten und die Eintrittswahrscheinlichkeit\
        \ und Schwere von Sicherheitsvorf\xE4llen sowie ihre gesellschaftlichen und\
        \ wirtschaftlichen Auswirkungen zu ber\xFCcksichtigen. Die Einhaltung der\
        \ Verpflichtung nach Satz 1 ist durch die Einrichtungen zu dokumentieren."
      implementation_groups:
      - EINR
      - KRITIS
      - BUND
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30
      ref_id: '30.2'
      name: "\xA7 30 Abs. 2"
      description: "Ma\xDFnahmen nach Absatz 1 sollen den Stand der Technik einhalten,\
        \ die einschl\xE4gigen europ\xE4ischen und internationalen Normen ber\xFC\
        cksichtigen und m\xFCssen auf einem gefahren\xFCbergreifenden Ansatz beruhen.\
        \ Die Ma\xDFnahmen m\xFCssen zumindest Folgendes umfassen:"
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2.1
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      ref_id: 30.2.1
      name: "\xA7 30 Abs. 2 Nr. 1"
      description: Konzepte in Bezug auf die Risikoanalyse und auf die Sicherheit
        in der Informationstechnik,
      implementation_groups:
      - EINR
      - KRITIS
      - BUND
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2.2
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      ref_id: 30.2.2
      name: "\xA7 30 Abs. 2 Nr. 2"
      description: "Bew\xE4ltigung von Sicherheitsvorf\xE4llen,"
      implementation_groups:
      - EINR
      - KRITIS
      - BUND
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2.3
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      ref_id: 30.2.3
      name: "\xA7 30 Abs. 2 Nr. 3"
      description: Aufrechterhaltung des Betriebs, wie Backup-Management und Wiederherstellung
        nach einem Notfall, und Krisenmanagement,
      implementation_groups:
      - EINR
      - KRITIS
      - BUND
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2.4
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      ref_id: 30.2.4
      name: "\xA7 30 Abs. 2 Nr. 4"
      description: "Sicherheit der Lieferkette einschlie\xDFlich sicherheitsbezogener\
        \ Aspekte der Beziehungen zu unmittelbaren Anbietern oder Diensteanbietern,"
      implementation_groups:
      - EINR
      - KRITIS
      - BUND
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2.5
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      ref_id: 30.2.5
      name: "\xA7 30 Abs. 2 Nr. 5"
      description: "Sicherheitsma\xDFnahmen bei Erwerb, Entwicklung und Wartung von\
        \ informationstechnischen Systemen, Komponenten und Prozessen, einschlie\xDF\
        lich Management und Offenlegung von Schwachstellen,"
      implementation_groups:
      - EINR
      - KRITIS
      - BUND
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2.6
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2
      ref_id: 30.2.6
      name: "\xA7 30 Abs. 2 Nr. 6"
      description: "Konzepte und Verfahren zur Bewertung der Wirksamkeit von Risikomanagementma\xDF\
        nahmen im Bereich der Sicherheit in der Informationstechnik,"
      implementation_groups:
      - EINR
      - KRITIS
      - BUND
    - urn: urn:intuitem:risk:req_node:bsi-bsig-nis2-2025:30.2.7
      assessable: true
