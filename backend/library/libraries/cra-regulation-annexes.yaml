        de:
          description: gegebenenfalls den Namen und die Kennnummer der notifizierten Stelle, eine Beschreibung
            des durchgeführten Konformitätsbewertungsverfahrens und die Kennnummer der ausgestellten Bescheinigung
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:5.8
      assessable: true
