urn: urn:intuitem:risk:library:cra-resolution-annexes
locale: en
ref_id: CRA-resolution-annexes
name: Cyber Resilience Act - Annexes (CRA)
description: Annexes to the REGULATION (EU) 2024/2847 OF THE EUROPEAN PARLIAMENT AND
  OF THE COUNCIL of 23 October 2024 on horizontal cybersecurity requirements for products
  with digital elements and amending Regulations (EU) No 168/2013 and (EU) No 2019/1020
  and Directive (EU) 2020/1828 (Cyber Resilience Act)
copyright: European Union law
version: 4
publication_date: 2024-06-25
provider: EU
packager: intuitem
translations:
  de:
    name: Cyberresilienz-Verordnung – Anhänge (CRA)
    description: |-
      Anhänge der Verordnung (EU) 2024/2847 des Europäischen Parlaments und des Rates vom 23. Oktober 2024 über horizontale Cybersicherheitsanforderungen für Produkte mit digitalen Elementen und zur Änderung der Verordnungen (EU) Nr. 168/2013 und (EU) 2019/1020 und der Richtlinie (EU) 2020/1828 (Cyberresilienz-Verordnung).

      Herkunft: Die Anforderungstexte und Überschriften wurden aus der amtlichen deutschen Sprachfassung in der konsolidierten EUR-Lex-Fassung 02024R2847-20241120 übernommen. Automatisierte Zuordnung und Prüfung durch den KI-Assistenten; keine maschinelle Übersetzung des Rechtstexts. Die Bibliotheksmetadaten wurden mit KI-Unterstützung formuliert. Maßgeblich sind die im Amtsblatt veröffentlichten Fassungen. Quelle: https://eur-lex.europa.eu/legal-content/DE/TXT/?uri=CELEX:02024R2847-20241120
    copyright: Recht der Europäischen Union
objects:
  framework:
    urn: urn:intuitem:risk:framework:cra-resolution-annexes
    ref_id: CRA-resolution-annexes
    name: Cyber Resilience Act - Annexes (CRA)
    description: Annexes to the REGULATION (EU) 2024/2847 OF THE EUROPEAN PARLIAMENT
      AND OF THE COUNCIL of 23 October 2024 on horizontal cybersecurity requirements
      for products with digital elements and amending Regulations (EU) No 168/2013
      and (EU) No 2019/1020 and Directive (EU) 2020/1828 (Cyber Resilience Act)
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1
      assessable: false
      depth: 1
      ref_id: '1'
      name: ANNEX I
      description: ESSENTIAL CYBERSECURITY REQUIREMENTS
      translations:
        de:
          name: ANHANG I
          description: GRUNDLEGENDE CYBERSECURITYANFORDERUNGEN
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1
      ref_id: '1.1'
      name: Part I
      description: Cybersecurity requirements relating to the properties of products
        with digital elements
      translations:
        de:
          name: Teil I
          description: Cybersicherheitsanforderungen in Bezug auf die Eigenschaften von Produkten mit digitalen
            Elementen
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1
      ref_id: 1.1.1
      description: Products with digital elements shall be designed, developed and produced in such a way that
        they ensure an appropriate level of cybersecurity based on the risks.
      translations:
        de:
          description: Produkte mit digitalen Elementen werden so konzipiert, entwickelt und hergestellt, dass
            sie angesichts der Risiken ein angemessenes Cybersicherheitsniveau gewährleisten.
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1
      ref_id: 1.1.2
      description: 'On the basis of the cybersecurity risk assessment referred to in Article 13(2) and where
        applicable, products with digital elements shall:'
      translations:
        de:
          description: Auf der Grundlage der Bewertung der Cybersicherheitsrisiken gemäß Artikel 13 Absatz 2
            müssen Produkte mit digitalen Elementen, soweit zutreffend,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.a
      description: be made available on the market without known exploitable vulnerabilities;
      translations:
        de:
          description: ohne bekannte ausnutzbare Schwachstellen auf dem Markt bereitgestellt werden,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.b
      description: be made available on the market with a secure by default configuration,
        unless otherwise agreed between manufacturer and business user in relation
        to a tailor-made product with digital elements, including the possibility
        to reset the product to its original state;
      translations:
        de:
          description: mit einer sicheren Standardkonfiguration auf dem Markt bereitgestellt werden, sofern
            zwischen dem Hersteller und dem gewerblichen Nutzer in Bezug auf ein maßgeschneidertes Produkt mit
            digitalen Elementen nichts anderes vereinbart wurde, und die Möglichkeit bieten, das Produkt in
            seinen ursprünglichen Zustand zurückzusetzen,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.c
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.c
      description: ensure that vulnerabilities can be addressed through security updates,
        including, where applicable, through automatic security updates that are installed
        within an appropriate timeframe enabled as a default setting, with a clear
        and easy-to-use opt-out mechanism, through the notification of available updates
        to users, and the option to temporarily postpone them;
      translations:
        de:
          description: sicherstellen, dass Schwachstellen durch Sicherheitsaktualisierungen behoben werden können,
            gegebenenfalls auch durch automatische Sicherheitsaktualisierungen, die als Standardeinstellung
            innerhalb eines angemessenen Zeitrahmens installiert werden sowie über einen klaren und benutzerfreundlichen
            Opt-out-Mechanismus verfügen, bei dem die Nutzer über verfügbare Aktualisierungen informiert werden
            und sie vorübergehend verschieben können;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.d
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.d
      description: ensure protection from unauthorised access by appropriate control
        mechanisms, including but not limited to authentication, identity or access
        management systems, and report on possible unauthorised access;
      translations:
        de:
          description: durch geeignete Kontrollmechanismen Schutz vor unbefugtem Zugriff bieten, darunter u.
            a. zumindest Authentifizierungs-, Identitäts- oder Zugangsverwaltungssysteme, und einen möglicherweise
            unbefugten Zugriff melden,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.e
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.e
      description: protect the confidentiality of stored, transmitted or otherwise
        processed data, personal or other, such as by encrypting relevant data at
        rest or in transit by state of the art mechanisms, and by using other technical
        means;
      translations:
        de:
          description: die Vertraulichkeit gespeicherter, übermittelter oder anderweitig verarbeiteter personenbezogener
            oder sonstiger Daten schützen, z. B. durch Verschlüsselung relevanter Daten, die gespeichert sind
            oder gerade verwendet oder übermittelt werden, durch modernste Mechanismen und durch den Einsatz
            anderer technischer Mittel,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.f
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.f
      description: protect the integrity of stored, transmitted or otherwise processed
        data, personal or other, commands, programs and configuration against any
        manipulation or modification not authorised by the user, and report on corruptions;
      translations:
        de:
          description: die Integrität gespeicherter, übermittelter oder anderweitig verarbeiteter Daten, ob
            personenbezogener oder sonstiger Daten, Befehle, Programme und Konfigurationen vor einer vom Nutzer
            nicht genehmigten Manipulation oder Veränderung schützen und deren Beschädigung melden,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.g
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.g
      description: process only data, personal or other, that are adequate, relevant and limited to what is
        necessary in relation to the intended purpose of the product with digital elements (data minimisation);
      translations:
        de:
          description: die Verarbeitung personenbezogener oder sonstiger Daten auf solche, die angemessen und
            von Bedeutung sind, und auf das für die Zweckbestimmung des Produkts mit digitalen Elementen erforderliche
            Maß beschränken („Datenminimierung“),
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.h
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.h
      description: protect the availability of essential and basic functions, also
        after an incident, including through resilience and mitigation measures against
        denial-of-service attacks;
      translations:
        de:
          description: die Verfügbarkeit wesentlicher und grundlegender Funktionen, auch nach einem Sicherheitsvorfall,
            einschließlich über Abwehr- und Eindämmungsmaßnahmen gegen Überlastungsangriffe auf Server (Denial-of-Service-Angriffe),
            sicherstellen,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.i
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.i
      description: minimise the negative impact by the products themselves or connected
        devices on the availability of services provided by other devices or networks;
      translations:
        de:
          description: die negativen Auswirkungen von den Produkten selbst oder von vernetzten Geräten auf die
            Verfügbarkeit der von anderen Geräten oder Netzen bereitgestellten Dienste minimieren,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.j
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.j
      description: be designed, developed and produced to limit attack surfaces, including
        external interfaces;
      translations:
        de:
          description: so konzipiert, entwickelt und hergestellt werden, dass sie — auch bei externen Schnittstellen
            — möglichst geringe Angriffsflächen bieten,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.k
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.k
      description: be designed, developed and produced to reduce the impact of an
        incident using appropriate exploitation mitigation mechanisms and techniques;
      translations:
        de:
          description: so konzipiert, entwickelt und hergestellt werden, dass die Auswirkungen eines Sicherheitsvorfalls
            durch geeignete Mechanismen und Techniken zur Minderung der möglichen Ausnutzung verringert werden,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.l
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.l
      description: provide security related information by recording and monitoring
        relevant internal activity, including the access to or modification of data,
        services or functions, with an opt-out mechanism for the user;
      translations:
        de:
          description: sicherheitsbezogene Informationen durch Aufzeichnung und/oder Überwachung einschlägiger
            interner Vorgänge wie Zugang zu Daten, Diensten oder Funktionen und Änderungen daran bereitstellen
            und den Nutzern einen Opt-out-Mechanismus zur Verfügung stellen,
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2.m
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.1.2
      ref_id: 1.1.2.m
      description: provide the possibility for users to securely and easily remove
        on a permanent basis all data and settings and, where such data can be transferred
        to other products or systems, ensure that this is done in a secure manner.
      translations:
        de:
          description: den Nutzern die Möglichkeit bieten, alle Daten und Einstellungen dauerhaft sicher und
            einfach zu löschen, und, wenn diese Daten auf andere Produkte oder Systeme übertragen werden können,
            sicherstellen, dass dies auf sichere Weise geschieht.
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1
      ref_id: '1.2'
      name: Part II
      description: Vulnerability handling requirements
      translations:
        de:
          name: Teil II
          description: Anforderungen an die Behandlung von Schwachstellen
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2
      description: 'Manufacturers of products with digital elements shall:'
      translations:
        de:
          description: Die Hersteller von Produkten mit digitalen Elementen müssen
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.1
      description: identify and document vulnerabilities and components contained
        in products with digital elements, including by drawing up a software bill
        of materials in a commonly used and machine-readable format covering at the
        very least the top-level dependencies of the products;
      translations:
        de:
          description: Schwachstellen und Komponenten der Produkte mit digitalen Elementen ermitteln und dokumentieren,
            u. a. durch Erstellung einer Software-Stückliste in einem gängigen maschinenlesbaren Format, aus
            der zumindest die obersten Abhängigkeiten der Produkte hervorgehen;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.2
      description: in relation to the risks posed to products with digital elements,
        address and remediate vulnerabilities without delay, including by providing
        security updates; where technically feasible, new security updates shall be
        provided separately from functionality updates;
      translations:
        de:
          description: im Hinblick auf die Risiken im Zusammenhang mit den Produkten mit digitalen Elementen
            unverzüglich Schwachstellen behandeln und beheben, unter anderem durch Bereitstellung von Sicherheitsaktualisierungen;
            soweit technisch machbar, müssen neue Sicherheitsaktualisierungen getrennt von den Funktionsaktualisierungen
            bereitgestellt werden;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.3
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.3
      description: apply effective and regular tests and reviews of the security of
        the product with digital elements;
      translations:
        de:
          description: die Sicherheit des Produkts mit digitalen Elementen regelmäßig und wirksam testen und
            überprüfen;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.4
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.4
      description: once a security update has been made available, share and publicly
        disclose information about fixed vulnerabilities, including a description
        of the vulnerabilities, information allowing users to identify the product
        with digital elements affected, the impacts of the vulnerabilities, their
        severity and clear and accessible information helping users to remediate the
        vulnerabilities; in duly justified cases, where manufacturers consider the
        security risks of publication to outweigh the security benefits, they may
        delay making public information regarding a fixed vulnerability until after
        users have been given the possibility to apply the relevant patch;
      translations:
        de:
          description: sobald eine Sicherheitsaktualisierung bereitgestellt worden ist, Informationen über beseitigte
            Schwachstellen teilen und veröffentlichen, einschließlich einer Beschreibung der Schwachstellen
            mit Angaben, anhand deren die Nutzer das betroffene Produkt mit digitalen Elementen, die Auswirkungen
            der Schwachstellen und ihre Schwere erkennen können, sowie eindeutige und verständliche Informationen,
            die den Nutzern helfen, die Schwachstellen zu beheben; in hinreichend begründeten Fällen, in denen
            die Hersteller der Auffassung sind, dass die Risiken der Veröffentlichung die Vorteile in Bezug
            auf die Sicherheit überwiegen, können sie die Veröffentlichung von Informationen über eine behobene
            Schwachstelle so lange aufschieben, bis den Nutzern die Möglichkeit gegeben wurde, den entsprechenden
            Patch anzuwenden;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.5
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.5
      description: put in place and enforce a policy on coordinated vulnerability
        disclosure;
      translations:
        de:
          description: eine Strategie für die koordinierte Offenlegung von Schwachstellen aufstellen und umsetzen;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.6
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.6
      description: take measures to facilitate the sharing of information about potential vulnerabilities in
        their product with digital elements as well as in third-party components contained in that product,
        including by providing a contact address for the reporting of the vulnerabilities discovered in the
        product with digital elements;
      translations:
        de:
          description: Maßnahmen ergreifen, um den Austausch von Informationen über mögliche Schwachstellen
            in ihrem Produkt mit digitalen Elementen und darin enthaltenen Komponenten Dritter zu erleichtern,
            und dazu u. a. eine Kontaktadresse für die Meldung der in dem Produkt mit digitalen Elementen entdeckten
            Schwachstellen angeben;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.7
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.7
      description: provide for mechanisms to securely distribute updates for products
        with digital elements to ensure that vulnerabilities are fixed or mitigated
        in a timely manner and, where applicable for security updates, in an automatic
        manner;
      translations:
        de:
          description: Mechanismen für die sichere Verbreitung von Aktualisierungen für Produkte mit digitalen
            Elementen bereitstellen, damit Schwachstellen rechtzeitig und im Falle von Sicherheitsaktualisierungen
            gegebenenfalls automatisch behoben oder eingedämmt werden;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:1.2.8
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node20
      ref_id: 1.2.8
      description: ensure that, where security updates are available to address identified security issues,
        they are disseminated without delay and, unless otherwise agreed between a manufacturer and a business
        user in relation to a tailor-made product with digital elements, free of charge, accompanied by advisory
        messages providing users with the relevant information, including on potential action to be taken.
      translations:
        de:
          description: dafür sorgen, dass Sicherheitsaktualisierungen, die zur Bewältigung festgestellter Sicherheitsprobleme
            zur Verfügung stehen, unverzüglich und — sofern zwischen dem Hersteller und dem gewerblichen Nutzer
            in Bezug auf ein maßgeschneidertes Produkt mit digitalen Elementen nichts anderes vereinbart wurde
            — kostenlos verbreitet werden, zusammen mit Hinweisen und einschlägigen Informationen, auch über
            zu treffende mögliche Maßnahmen.
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2
      assessable: false
      depth: 1
      ref_id: '2'
      name: ANNEX II
      description: INFORMATION AND INSTRUCTIONS TO THE USER
      translations:
        de:
          name: ANHANG II
          description: INFORMATIONEN UND ANLEITUNGEN FÜR DEN NUTZER
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2
      description: 'At minimum, the product with digital elements shall be accompanied by:'
      translations:
        de:
          description: 'Dem Produkt mit digitalen Elementen muss mindestens Folgendes beigefügt sein:'
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.1'
      description: the name, registered trade name or registered trademark of the
        manufacturer, and the postal address, the email address or other digital contact
        as well as, where available, the website at which the manufacturer can be
        contacted;
      translations:
        de:
          description: Name, eingetragener Handelsname oder eingetragene Handelsmarke des Herstellers, die Postanschrift,
            E-Mail-Adresse oder andere digitale Kontaktmöglichkeit und, falls vorhanden, Website, unter denen
            der Hersteller erreichbar ist;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.2'
      description: "the single point of contact where information about vulnerabilities\
        \ of the product with digital elements can be reported and received, and where\
        \ the manufacturer\u2019s policy on coordinated vulnerability disclosure can\
        \ be found;"
      translations:
        de:
          description: die zentrale Kontaktstelle, bei der Informationen über Schwachstellen des Produkts mit
            digitalen Elementen gemeldet werden können und entgegengenommen werden und das Konzept für die koordinierte
            Offenlegung von Schwachstellen zu finden ist;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.3'
      description: name and type and any additional information enabling the unique identification of the product
        with digital elements;
      translations:
        de:
          description: Name und Typ sowie alle zusätzlichen Informationen, die eine eindeutige Identifizierung
            des Produkts mit digitalen Elementen ermöglichen;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.4'
      description: "the intended purpose of the product with digital elements, including\
        \ the security environment provided by the manufacturer, as well as the product\u2019\
        s essential functionalities and information about the security properties;"
      translations:
        de:
          description: die Zweckbestimmung des Produkts mit digitalen Elementen, einschließlich des vom Hersteller
            bereitgestellten Sicherheitsumfelds, sowie die Hauptfunktionen des Produkts und Informationen über
            die Sicherheitseigenschaften;
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:2.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cra-resolution-annexes:node30
      ref_id: '2.5'
      description: any known or foreseeable circumstance, related to the use of the product with digital elements
        in accordance with its intended purpose or under conditions of reasonably foreseeable misuse, which
        may lead to significant cybersecurity risks;
      translations:
