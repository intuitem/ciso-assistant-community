        address: …'
      translations:
        de:
          description: 'Der vollständige Text der EU-Konformitätserklärung kann unter der folgenden Internetadresse
            abgerufen werden: …'
    - urn: urn:intuitem:risk:req_node:cra-resolution-annexes:7
