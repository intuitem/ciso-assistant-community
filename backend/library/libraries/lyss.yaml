    - urn: urn:lyss:risk:req_node:lyss:l3.acc
      assessable: false
      depth: 2
      parent_urn: urn:lyss:risk:req_node:lyss:l3
      ref_id: L3.ACC
      name: Access-layer protection
      implementation_groups:
      - L3
    - urn: urn:lyss:risk:req_node:lyss:lyss-acc-020
      assessable: true
      depth: 3
      parent_urn: urn:lyss:risk:req_node:lyss:l3.acc
      ref_id: LYSS-ACC-020
      name: DHCP snooping is enabled on user VLANs
      description: DHCP snooping is enabled globally and on every VLAN used by an
        access port, so that DHCP server messages are only accepted from trusted (uplink)
        ports.
      annotation: 'Rationale: A rogue DHCP server on a user port can hand out its
        own gateway and DNS server and intercept traffic; DHCP snooping drops server
        messages from untrusted ports and builds the binding table that ARP inspection
        and IP source guard rely on.


        Test procedure: Fail if DHCP snooping is not enabled globally, if a VLAN used
        by an access port is not in the snooping VLAN list, or if an access port is
        trusted for DHCP (it would accept server messages). Pass if it is enabled,
        every such VLAN is covered (on platforms where snooping applies to the whole
        bridge, the bridge setting covers every access port) and no access port is
        trusted. Not applicable without access ports.


        Informative references: ISO/IEC 27001:2022 A.8.20, A.8.22; NIST SP 800-53
        r5 SC-7, SI-4.'
      typical_evidence: '- Running configuration of the switch

        - LYSS assessment report showing the verdict and evidence for LYSS-ACC-020'
      implementation_groups:
      - L3
    - urn: urn:lyss:risk:req_node:lyss:lyss-acc-021
      assessable: true
      depth: 3
      parent_urn: urn:lyss:risk:req_node:lyss:l3.acc
      ref_id: LYSS-ACC-021
      name: Dynamic ARP inspection is enabled on user VLANs
      description: ARP packets received on access ports are checked against the DHCP
        snooping bindings (or static ARP access lists) on every VLAN used by an access
        port.
      annotation: 'Rationale: Without ARP inspection, any user device can claim the
        gateway''s IP address (ARP spoofing) and read or alter the traffic of every
        host in the VLAN.


        Test procedure: Fail if a VLAN used by an access port is not covered by dynamic
        ARP inspection, or if an access port is trusted for ARP inspection (its ARP
        packets would not be checked). A platform that offers no ARP inspection also
        fails; this is not an exception, and the report names the platform limit so
        that the reason is clear. Pass if every such VLAN is covered and no access
        port is trusted. Not applicable without access ports.


        Informative references: ISO/IEC 27001:2022 A.8.20, A.8.22; NIST SP 800-53
        r5 SC-7, SI-4.'
      typical_evidence: '- Running configuration of the switch

        - LYSS assessment report showing the verdict and evidence for LYSS-ACC-021'
      implementation_groups:
      - L3
    - urn: urn:lyss:risk:req_node:lyss:lyss-acc-022
      assessable: true
      depth: 3
      parent_urn: urn:lyss:risk:req_node:lyss:l3.acc
      ref_id: LYSS-ACC-022
      name: Access ports require 802.1X or MAC authentication
      description: Every access port authenticates the connected device (IEEE 802.1X,
        or MAC authentication bypass for devices without a supplicant) before granting
        network access.
      annotation: 'Rationale: Without port authentication, anyone who can plug a cable
        into a wall socket is on the internal network.


        Test procedure: Fail if port authentication is not enabled globally where
        the platform requires it, if an access port has no 802.1X / MAC authentication
        setting, or if an access port forwards traffic before authentication succeeds
        (open mode, e.g. Cisco "authentication open"). Pass if every access port enforces
        one. Not applicable without access ports.


        Informative references: ISO/IEC 27001:2022 A.8.20, A.5.15; NIST SP 800-53
        r5 IA-3, AC-3; CIS Controls v8 13.9.'
      typical_evidence: '- Running configuration of the switch

        - LYSS assessment report showing the verdict and evidence for LYSS-ACC-022'
      implementation_groups:
      - L3
    - urn: urn:lyss:risk:req_node:lyss:lyss-acc-023
      assessable: true
      depth: 3
      parent_urn: urn:lyss:risk:req_node:lyss:l3.acc
      ref_id: LYSS-ACC-023
      name: Storm control limits broadcast traffic on access ports
      description: Every access port limits the rate of broadcast traffic it accepts
        (storm control).
      annotation: 'Rationale: A loop or a misbehaving device on one user port can
        flood broadcast traffic to every port of the VLAN and take the network down;
        a rate limit contains it on the offending port.


        Test procedure: Fail if an access port has no broadcast rate limit, or a limit
        of 100 % (which limits nothing). Pass if every access port has an effective
        one. Unknown when the platform sets it on the switch chip and the setting
        cannot be read. Not applicable without access ports.


        Informative references: ISO/IEC 27001:2022 A.8.20, A.8.6; NIST SP 800-53 r5
        SC-5.'
      typical_evidence: '- Running configuration of the switch

        - LYSS assessment report showing the verdict and evidence for LYSS-ACC-023'
      implementation_groups:
      - L3
    - urn: urn:lyss:risk:req_node:lyss:lyss-acc-024
      assessable: true
      depth: 3
      parent_urn: urn:lyss:risk:req_node:lyss:l3.acc
      ref_id: LYSS-ACC-024
      name: Neighbor discovery (CDP/LLDP) is not sent on untrusted access ports
      description: Access ports do not transmit CDP or LLDP advertisements, except
        ports that serve IP phones (a voice VLAN), which need LLDP-MED or CDP.
      annotation: 'Rationale: CDP and LLDP advertisements tell anyone on a user port
        the switch name, model, software version, management address and VLANs, which
        helps an attacker choose an exploit.


        Test procedure: Pass if neighbor discovery transmission is disabled globally,
        or on every access port without a voice VLAN, for each protocol the platform
        sends by default or that is enabled. Fail otherwise. Not applicable without
        access ports.


        Informative references: ISO/IEC 27001:2022 A.8.20; NIST SP 800-53 r5 CM-7;
        CIS Controls v8 4.8.'
      typical_evidence: '- Running configuration of the switch

        - LYSS assessment report showing the verdict and evidence for LYSS-ACC-024'
      implementation_groups:
      - L3
