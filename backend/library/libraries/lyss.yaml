    - urn: urn:lyss:risk:req_node:lyss:lyss-acc-011
      assessable: true
      depth: 3
      parent_urn: urn:lyss:risk:req_node:lyss:l2.acc
      ref_id: LYSS-ACC-011
      name: Edge ports are protected against rogue spanning-tree participants (BPDU
        guard)
      description: Every edge port disables itself when it receives a spanning-tree
        BPDU. Links to other switches are configured as such (trunks or link aggregations);
        every other port is an edge port.
      annotation: 'Rationale: A rogue or misconnected switch on an access port can
        take over the spanning tree or create a loop.


        Test procedure: Edge ports are all ports minus uplinks, and uplinks are only
        the ports configured as trunks or link-aggregation members (tagged on HPE
        AOS-S). Neighbour discovery never exempts a port: a rogue device can advertise
        bridge capability. Fail if an edge port lacks BPDU protection, unless a global
        default protects all edge ports.


        Informative references: ISO/IEC 27001:2022 A.8.20; NIST SP 800-53 r5 SC-5,
        CM-6; CIS Controls v8 12.2.'
      typical_evidence: '- Running configuration of the switch

        - Read-only device state (listening services, SSH identification and algorithms,
        port status)

        - LYSS assessment report showing the verdict and evidence for LYSS-ACC-011'
      implementation_groups:
      - L2
      - L3
