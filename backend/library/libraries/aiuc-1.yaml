    urn: urn:intuitem:risk:framework:aiuc-1
    ref_id: AIUC-1
    name: AIUC-1 — AI agent standard
    description: AIUC-1 release of 2026-04-15.
    implementation_groups_definition:
    - ref_id: M
      name: Mandatory
      description: Required for AIUC-1 certification.
    - ref_id: O
      name: Optional
      description: Not required for certification.
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:aiuc-1:a
      assessable: false
      depth: 1
      ref_id: A
      name: Data & Privacy
    - urn: urn:intuitem:risk:req_node:aiuc-1:a001
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:aiuc-1:a
      ref_id: A001
      name: Establish input data policy
      description: Establish and communicate AI input data policies covering how customer data is used
        for model training, inference processing, data retention periods, and customer data rights
      implementation_groups:
      - M
      annotation: 'Review frequency: Every 12 months


        Control type: Preventative


        Keywords: Data Retention, Model Training Data, Opt-Out


        Typical evidence:

        - A001.1 Documentation: Policy for input data ownership, usage and retention

        - A001.2 Config: Data retention implementation

        - A001.3 Documentation: Data subject right processes'
    - urn: urn:intuitem:risk:req_node:aiuc-1:a002
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:aiuc-1:a
      ref_id: A002
      name: Establish output data policy
      description: Establish AI output ownership, usage, opt-in/out and deletion policies to customers
        and communicate these policies
      implementation_groups:
      - M
      annotation: 'Review frequency: Every 12 months


        Control type: Preventative


        Keywords: Data Ownership, Usage, Deletion, Consent, Opt-Out


        Typical evidence:

        - A002.1 Documentation: Output usage and ownership policy

        - A002.2 Config: Opt-in/opt-out and output deletion implementation'
