urn: urn:intuitem:risk:library:aiuc-1
locale: en
ref_id: AIUC-1
name: AIUC-1 — AI agent standard
description: 'AIUC-1 is a security, safety and reliability standard for AI agents, published by the Artificial
  Intelligence Underwriting Company (AIUC). It covers six pillars: Data & Privacy, Security, Safety, Reliability,
  Accountability and Society.'
