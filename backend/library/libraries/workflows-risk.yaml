urn: urn:intuitem:risk:library:workflows-risk
locale: en
ref_id: workflows-risk
name: Workflow starters — risk and findings
description: >-
  Sample workflows for risk treatment and finding follow-up: untreated risk
  sweeps, remediation controls opened from findings, overdue digests, and
  security exception expiry. Thresholds depend on your risk matrix — check them
  before publishing.
copyright: © intuitem
version: 1
publication_date: 2026-08-28
provider: intuitem
packager: intuitem
objects:
  workflows:
    - urn: urn:intuitem:risk:library:workflows-risk:workflow:high-risk-untreated
      schema_version: 1
      ref_id: high-risk-untreated
      name: Untreated high risks — weekly sweep
      description: >-
        Lists risk scenarios rated at or above the threshold whose treatment is
        still open. The level index depends on your matrix; adjust it.
      graph:
        variables:
          - key: notify_emails
            type: string
            default_value: risk@example.com
        nodes:
          - ref: every_monday
            type: trigger
            label: Monday 09:00
            trigger_config:
              type: schedule
              cron_expression: 0 9 * * 1
              timezone: UTC
          - ref: fetch_risks
            type: action
            label: High risks left open
            action_config:
              type: read_objects
              model: risk_scenario
              mode: list
              order_by: -current_level
              limit: 50
              filters:
                operator: and
                conditions:
                  - field: current_level
                    op: gte
                    value: 3
                  - field: treatment
                    op: eq
                    value: open
          - ref: per_risk
            type: loop
            label: One line per scenario
            loop_config:
              collection: '{{nodes.fetch_risks.results}}'
              collect: '{{item.name}}'
              on_item_error: continue
          - ref: note_risk
            type: action
            label: Log the scenario
            action_config:
              type: log
              message: '{{item.ref_id}} {{item.name}} · {{item.risk_assessment.name}}'
          - ref: send_digest
            type: action
            label: Email the sweep
            action_config:
              type: send_email
              recipients: '{{notify_emails}}'
              subject: 'Untreated high risks: {{nodes.fetch_risks.count}}'
              body: >-
                As of {{today}}, {{nodes.fetch_risks.count}} scenario(s) are
                rated high and still untreated: {{nodes.per_risk.results}}
          - ref: done
            type: end
        edges:
          - source: every_monday
            target: fetch_risks
          - source: fetch_risks
            target: per_risk
          - source: per_risk
            target: note_risk
            source_port: each
          - source: note_risk
            target: per_risk
          - source: per_risk
            target: send_digest
            source_port: done
          - source: send_digest
            target: done
    - urn: urn:intuitem:risk:library:workflows-risk:workflow:critical-finding-control
      schema_version: 1
      ref_id: critical-finding-control
      name: Critical finding — open and link a remediation control
      description: >-
        A high-severity finding opens an applied control, links it to the
        finding, and notifies the responders. Triage stays human: the finding's
        own status is left alone.
      graph:
        variables:
          - key: notify_emails
            type: string
            default_value: security@example.com
        nodes:
          - ref: on_finding
            type: trigger
            label: Critical finding raised
            trigger_config:
              type: internal_event
              event_key: finding.created
              filters:
                operator: and
                conditions:
                  - field: severity
                    op: gte
                    value: 3
          - ref: create_control
            type: action
            label: Open a remediation control
            action_config:
              type: create_object
              model: applied_control
              fields:
                name: 'Remediation: {{payload.object_repr}}'
                description: >-
                  Opened automatically on {{today}} from a critical finding.
          - ref: link_control
            type: action
            label: Link it to the finding
            action_config:
              type: update_object
              model: finding
              id: '{{payload.object_id}}'
              m2m:
                applied_controls:
                  op: add
                  values: '{{nodes.create_control.created_object_id}}'
          - ref: notify
            type: action
            label: Tell the responders
            action_config:
              type: send_email
              recipients: '{{notify_emails}}'
              subject: 'Critical finding: {{payload.object_repr}}'
              body: >-
                {{payload.object_repr}} was raised on {{today}}.
                {{nodes.create_control.created_object_name}} was opened and
                linked to it.
          - ref: done
            type: end
        edges:
          - source: on_finding
            target: create_control
          - source: create_control
            target: link_control
          - source: link_control
            target: notify
          - source: notify
            target: done
    - urn: urn:intuitem:risk:library:workflows-risk:workflow:findings-overdue
      schema_version: 1
      ref_id: findings-overdue
      name: Overdue findings — daily digest
      description: >-
        Findings whose due date has passed and that are not closed yet, mailed
        once a day.
      graph:
        variables:
          - key: notify_emails
            type: string
            default_value: security@example.com
        nodes:
          - ref: every_morning
            type: trigger
            label: Every day 07:00
            trigger_config:
              type: schedule
              cron_expression: 0 7 * * *
              timezone: UTC
          - ref: fetch_overdue
            type: action
            label: Past due, still open
            action_config:
              type: read_objects
              model: finding
              mode: list
              order_by: due_date
              limit: 50
              filters:
                operator: and
                conditions:
                  - field: due_date
                    op: lt
                    value: '{{today}}'
                  - field: status
                    op: not_in
                    value: resolved,closed,dismissed,deprecated
          - ref: send_digest
            type: action
            label: Email the digest
            action_config:
              type: send_email
              recipients: '{{notify_emails}}'
              subject: 'Overdue findings: {{nodes.fetch_overdue.count}}'
              body: >-
                {{nodes.fetch_overdue.count}} finding(s) were due before
                {{today}} and are still open.
          - ref: done
            type: end
        edges:
          - source: every_morning
            target: fetch_overdue
          - source: fetch_overdue
            target: send_digest
          - source: send_digest
            target: done
    - urn: urn:intuitem:risk:library:workflows-risk:workflow:exception-expiry
      schema_version: 1
      ref_id: exception-expiry
      name: Security exceptions past their date — mark expired
      description: >-
        Marks exceptions whose expiration date has passed as expired, and mails
        the list. Expiry is a fact about a date; granting or refusing an
        exception stays human, and the engine refuses those values anyway.
      graph:
        variables:
          - key: notify_emails
            type: string
            default_value: security@example.com
        nodes:
          - ref: every_morning
            type: trigger
            label: Every day 06:00
            trigger_config:
              type: schedule
              cron_expression: 0 6 * * *
              timezone: UTC
          - ref: fetch_lapsed
            type: action
            label: Lapsed exceptions
            action_config:
              type: read_objects
              model: security_exception
              mode: list
              order_by: expiration_date
              limit: 50
              filters:
                operator: and
                conditions:
                  - field: expiration_date
                    op: lte
                    value: '{{today}}'
                  - field: status
                    op: not_in
                    value: expired,deprecated
          - ref: per_exception
            type: loop
            label: One per exception
            loop_config:
              collection: '{{nodes.fetch_lapsed.results}}'
              collect: '{{item.name}}'
              on_item_error: continue
          - ref: expire_it
            type: action
            label: Mark it expired
            action_config:
              type: update_object
              model: security_exception
              id: '{{item.id}}'
              fields:
                status: expired
          - ref: send_digest
            type: action
            label: Email what expired
            action_config:
              type: send_email
              recipients: '{{notify_emails}}'
              subject: 'Security exceptions expired: {{nodes.fetch_lapsed.count}}'
              body: >-
                Expired on {{today}}: {{nodes.per_exception.results}}
          - ref: done
            type: end
        edges:
          - source: every_morning
            target: fetch_lapsed
          - source: fetch_lapsed
            target: per_exception
          - source: per_exception
            target: expire_it
            source_port: each
          - source: expire_it
            target: per_exception
          - source: per_exception
            target: send_digest
            source_port: done
          - source: send_digest
            target: done
    - urn: urn:intuitem:risk:library:workflows-risk:workflow:acceptance-lifecycle
      schema_version: 1
      ref_id: acceptance-lifecycle
      name: Risk acceptance lifecycle — submitted and decided
      description: >-
        Two triggers in one workflow: a new acceptance notifies the approver, a
        decided one notifies the requester. The decision itself is never
        written by the workflow.
      graph:
        variables:
          - key: approver_emails
            type: string
            default_value: approvals@example.com
          - key: requester_emails
            type: string
            default_value: risk@example.com
        nodes:
          - ref: on_submitted
            type: trigger
            label: Acceptance created
            trigger_config:
              type: internal_event
              event_key: riskacceptance.created
          - ref: tell_approver
            type: action
            label: Email the approver
            action_config:
              type: send_email
              recipients: '{{approver_emails}}'
              subject: 'Risk acceptance to review: {{payload.object_repr}}'
              body: '{{payload.object_repr}} was submitted on {{today}}.'
          - ref: on_decided
            type: trigger
            label: Acceptance state changed
            trigger_config:
              type: internal_event
              event_key: riskacceptance.updated
              filters:
                operator: and
                conditions:
                  - field: state
                    op: in
                    value: accepted,rejected,revoked
                    changed: true
          - ref: tell_requester
            type: action
            label: Email the requester
            action_config:
              type: send_email
              recipients: '{{requester_emails}}'
              subject: 'Risk acceptance updated: {{payload.object_repr}}'
              body: >-
                {{payload.object_repr}} is now
                {{payload.new_values.state}} as of {{today}}.
          - ref: done
            type: end
        edges:
          - source: on_submitted
            target: tell_approver
          - source: tell_approver
            target: done
          - source: on_decided
            target: tell_requester
          - source: tell_requester
            target: done
    - urn: urn:intuitem:risk:library:workflows-risk:workflow:critical-vulnerability
      schema_version: 1
      ref_id: critical-vulnerability
      name: Critical vulnerability recorded — notify
      description: >-
        Sends a notice when a vulnerability is recorded at high severity,
        whatever created it — a person, an import, or a scanner webhook.
      graph:
        variables:
          - key: notify_emails
            type: string
            default_value: security@example.com
        nodes:
          - ref: on_vulnerability
            type: trigger
            label: High-severity vulnerability
            trigger_config:
              type: internal_event
              event_key: vulnerability.created
              filters:
                operator: and
                conditions:
                  - field: severity
                    op: gte
                    value: 3
          - ref: notify
            type: action
            label: Send the notice
            action_config:
              type: send_email
              recipients: '{{notify_emails}}'
              subject: 'High-severity vulnerability: {{payload.object_repr}}'
              body: '{{payload.object_repr}} was recorded on {{today}}.'
          - ref: done
            type: end
        edges:
          - source: on_vulnerability
            target: notify
          - source: notify
            target: done
