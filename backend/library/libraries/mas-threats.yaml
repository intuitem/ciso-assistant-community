urn: urn:intuitem:risk:library:owasp-mas-threats
locale: en
ref_id: owasp-mas-threats
name: OWASP GenAI Security Project - Multi-Agentic System Threat Modelling Guide
description: "This guide builds on the OWASP Agentic AI \u2013 Threats and Mitigations\
  \ publication, our master agentic threat taxonomy, by applying its threat taxonomy\
  \ to real-world multi-agent systems (MAS). These systems, characterized by multiple\
  \ autonomous agents coordinating to achieve shared or distributed goals, introduce\n\
  additional complexity and new attack surfaces.\nhttps://genai.owasp.org/resource/multi-agentic-system-threat-modeling-guide-v1-0/"
copyright: OWASP - Creative Commons Attribution-ShareAlike 4.0
version: 2
publication_date: 2025-04-24
provider: OWASP
packager: intuitem
translations:
  de:
    name: OWASP GenAI Security Project – Bedrohungsmodellierung für Multi-Agenten-Systeme
    description: |-
      Dieser Leitfaden baut auf der Veröffentlichung „OWASP Agentic AI – Threats and Mitigations“, der übergeordneten Taxonomie für Bedrohungen agentischer KI, auf und wendet diese auf reale Multi-Agenten-Systeme (MAS) an. Mehrere autonome Agenten koordinieren sich in solchen Systemen, um gemeinsame oder verteilte Ziele zu erreichen. Dadurch entstehen zusätzliche Komplexität und neue Angriffsflächen.
      https://genai.owasp.org/resource/multi-agentic-system-threat-modeling-guide-v1-0/

      Hinweis zur Übersetzung: KI-gestützte maschinelle Übersetzung mit anschließender sprachlicher und fachlicher Prüfung durch den KI-Assistenten. Keine offizielle Übersetzung der Herausgeber; keine unabhängige menschliche Prüfung. Die deutschen Ergänzungen umfassen die Bibliotheksmetadaten und Bedrohungstexte.
objects:
  threats:
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t1
    ref_id: T1
    name: 'Memory Poisoning '
    description: "Memory Poisoning involves exploiting an AI's memory systems, both\
      \ short and long-term, to introduce malicious or false data and exploit the\
      \ agent\u2019s context. This can lead to altered decision-making and unauthorized\
      \ operations. "
    annotation: 'Implement memory content validation, session isolation, robust authentication
      mechanisms for memory access, anomaly detection systems, and regular memory
      sanitization routines. Require AIgenerated memory snapshots for forensic analysis
      and rollback if anomalies are detected. '
    translations:
      de:
        name: Vergiftung des Agentengedächtnisses
        description: Bei der Vergiftung des Agentengedächtnisses werden kurz- und langfristige Gedächtnissysteme
          einer KI ausgenutzt, um schädliche oder falsche Daten einzuschleusen und den Kontext des Agenten
          zu missbrauchen. Dies kann Entscheidungen verändern und zu unbefugten Vorgängen führen.
        annotation: Validieren Sie Gedächtnisinhalte, isolieren Sie Sitzungen und setzen Sie robuste Authentisierungsmechanismen
          für den Gedächtniszugriff, Systeme zur Anomalieerkennung und regelmäßige Bereinigungsroutinen ein.
          Verlangen Sie KI-generierte Momentaufnahmen des Gedächtnisses für die forensische Analyse und zum
          Zurücksetzen bei erkannten Anomalien.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t2
    ref_id: T2
    name: 'Tool Misuse '
    description: Tool Misuse occurs when attackers manipulate AI agents to abuse their
      integrated tools through deceptive prompts or commands, operating within authorized
      permissions. This includes Agent Hijacking, where an AI agent ingests adversarial
      manipulated data and subsequently executes unintended actions, potentially triggering
      malicious tool interactions. For more information on Agent Hijacking see  https://www.nist.gov/news-events/news/2025/01/technical-blog-strengthening-ai-agent-hijacking-evaluations
    annotation: 'Enforce strict tool access verification, monitor tool usage patterns,
      validate agent instructions, and set clear operational boundaries to detect
      and prevent misuse. Implement execution logs that track AI tool calls for anomaly
      detection and post-incident review. '
    translations:
      de:
        name: Werkzeugmissbrauch
        description: 'Werkzeugmissbrauch liegt vor, wenn Angreifer KI-Agenten durch täuschende Prompts oder
          Befehle dazu bringen, ihre integrierten Werkzeuge innerhalb der erteilten Berechtigungen zu missbrauchen.
          Dazu zählt Agent Hijacking: Ein KI-Agent verarbeitet gezielt manipulierte Daten und führt anschließend
          unbeabsichtigte Aktionen aus, die schädliche Werkzeuginteraktionen auslösen können. Weitere Informationen
          zu Agent Hijacking: https://www.nist.gov/news-events/news/2025/01/technical-blog-strengthening-ai-agent-hijacking-evaluations'
        annotation: Prüfen Sie Werkzeugzugriffe strikt, überwachen Sie Nutzungsmuster, validieren Sie Agentenanweisungen
          und setzen Sie klare Handlungsgrenzen, um Missbrauch zu erkennen und zu verhindern. Protokollieren
          Sie KI-Werkzeugaufrufe zur Anomalieerkennung und nachträglichen Vorfallanalyse.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t3
    ref_id: T3
    name: Privilege Compromise
    description: 'Privilege Compromise arises when attackers exploit weaknesses in
      permission management to perform unauthorized actions. This often involves dynamic
      role inheritance or misconfigurations.   '
    annotation: 'Implement granular permission controls, dynamic access validation,
      robust monitoring of role changes, and thorough auditing of elevated privilege
      operations. Prevent cross-agent privilege delegation unless explicitly authorized
      through predefined workflows.  '
    translations:
      de:
        name: Kompromittierung von Berechtigungen
        description: Angreifer nutzen Schwächen im Berechtigungsmanagement aus, um unbefugte Handlungen auszuführen.
          Häufig betrifft dies die dynamische Vererbung von Rollen oder Fehlkonfigurationen.
        annotation: Setzen Sie granulare Berechtigungskontrollen, dynamische Zugriffsprüfungen, eine robuste
          Überwachung von Rollenänderungen und gründliche Prüfungen von Vorgängen mit erhöhten Berechtigungen
          um. Unterbinden Sie die Weitergabe von Berechtigungen zwischen Agenten, sofern diese nicht ausdrücklich
          durch vordefinierte Workflows autorisiert ist.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t4
    ref_id: T4
    name: 'Resource Overload '
    description: 'Resource Overload targets the computational, memory, and service
      capacities of AI systems to degrade performance or cause failures, exploiting
      their resource-intensive nature.   '
    annotation: 'Deploy resource management controls, implement adaptive scaling mechanisms,
      establish quotas, and monitor system load in real-time to detect and mitigate
      overload attempts. Implement AI ratelimiting policies to restrict high-frequency
      task requests per agent session. '
    translations:
      de:
        name: Ressourcenüberlastung
        description: Ressourcenüberlastung zielt auf die Rechen-, Speicher- und Dienstkapazitäten von KI-Systemen
          ab. Der hohe Ressourcenbedarf wird ausgenutzt, um die Leistung zu verschlechtern oder Ausfälle zu
          verursachen.
        annotation: Setzen Sie Maßnahmen zur Ressourcenverwaltung, adaptive Skalierung und Kontingente ein.
          Überwachen Sie die Systemlast in Echtzeit, um Überlastungsversuche zu erkennen und abzumildern.
          Begrenzen Sie die Anfragerate von KI-Systemen, um hochfrequente Aufgabenanforderungen je Agentensitzung
          einzuschränken.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t5
    ref_id: T5
    name: Cascading Hallucination Attacks
    description: 'These attacks exploit an AI''s tendency to generate contextually
      plausible but false information, which can propagate through systems and disrupt
      decision-making. This can also lead to destructive reasoning affecting tools
      invocation. '
    annotation: 'Establish robust output validation mechanisms, implement behavioral
      constraints, deploy multisource validation, and ensure ongoing system corrections
      through feedback loops. Require secondary validation of AI-generated knowledge
      before it is used in critical decision-making processes. This will face the
      same constraints of scaling AI as discussed in Overwhelming Human In the Loop
      and would require similar approaches. '
    translations:
      de:
        name: Kaskadierende Halluzinationsangriffe
        description: Diese Angriffe nutzen die Neigung einer KI aus, im Kontext plausibel wirkende, aber falsche
          Informationen zu erzeugen. Diese können sich über Systeme hinweg verbreiten und die Entscheidungsfindung
          beeinträchtigen. Daraus können auch schädliche Schlussfolgerungen entstehen, die Werkzeugaufrufe
          beeinflussen.
        annotation: Validieren Sie Ausgaben robust, begrenzen Sie das Verhalten, prüfen Sie Informationen
          anhand mehrerer Quellen und ermöglichen Sie laufende Systemkorrekturen durch Rückkopplung. Verlangen
          Sie eine zweite Prüfung KI-generierten Wissens, bevor es in kritische Entscheidungsprozesse einfließt.
          Dabei bestehen dieselben Skalierungsgrenzen wie bei „Überlastung der menschlichen Aufsicht“, weshalb
          ähnliche Ansätze erforderlich sind.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t6
    ref_id: T6
    name: 'Intent Breaking & Goal Manipulation '
    description: This threat exploits vulnerabilities in an AI agent's planning and
      goal-setting capabilities, allowing attackers to manipulate or redirect the
      agent's objectives and reasoning. One common approach is Agent Hijacking mentioned
      in Tool Misuse.
    annotation: 'Implement planning validation frameworks, boundary management for
      reflection processes, and dynamic protection mechanisms for goal alignment.
      Deploy AI behavioral auditing by having another model check the agent and flag
      significant goal deviations that could indicate manipulation. '
    translations:
      de:
        name: Unterlaufen von Absichten und Manipulation von Zielen
        description: Diese Bedrohung nutzt Schwachstellen in der Planung und Zielfestlegung eines KI-Agenten
          aus. Angreifer können dadurch seine Ziele und Schlussfolgerungen manipulieren oder umlenken. Ein
          gängiger Ansatz ist das unter „Werkzeugmissbrauch“ genannte Agent Hijacking.
        annotation: Führen Sie Verfahren zur Validierung von Planungen, Grenzen für Reflexionsprozesse und
          dynamische Schutzmechanismen zur Ausrichtung an den vorgesehenen Zielen ein. Lassen Sie das Verhalten
          des Agenten durch ein weiteres Modell prüfen und erhebliche Zielabweichungen kennzeichnen, die auf
          Manipulation hindeuten könnten.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t7
    ref_id: T7
    name: 'Misaligned & Deceptive Behaviors '
    description: 'AI agents executing harmful or disallowed actions by exploiting
      reasoning and deceptive responses to meet their objectives.   '
    annotation: 'Train models to recognize and refuse harmful tasks, enforce policy
      restrictions, require human confirmations for high-risk actions, implement logging
      and monitoring. Utilize deception detection strategies such as behavioral consistency
      analysis, truthfulness verification models, and adversarial red teaming to assess
      inconsistencies between AI outputs and expected reasoning pathways.  '
    translations:
      de:
        name: Fehlausgerichtetes und täuschendes Verhalten
        description: KI-Agenten führen schädliche oder unzulässige Handlungen aus und nutzen dabei Schlussfolgerungen
          sowie täuschende Antworten, um ihre Ziele zu erreichen.
        annotation: Trainieren Sie Modelle darauf, schädliche Aufgaben zu erkennen und abzulehnen. Setzen
          Sie Richtlinienbeschränkungen durch, verlangen Sie menschliche Bestätigungen für risikoreiche Aktionen
          und führen Sie Protokollierung und Überwachung ein. Nutzen Sie zur Erkennung von Täuschung beispielsweise
          die Analyse der Verhaltenskonsistenz, Modelle zur Prüfung des Wahrheitsgehalts und adversariales
          Red Teaming, um Abweichungen zwischen KI-Ausgaben und erwarteten Schlussfolgerungen zu untersuchen.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t8
    ref_id: T8
    name: 'Repudiation & Untraceability '
    description: 'Occurs when actions performed by AI agents cannot be traced back
      or accounted for due to insufficient logging or transparency in decision-making
      processes.   '
    annotation: 'Implement comprehensive logging, cryptographic verification, enriched
      metadata, and real-time monitoring to ensure accountability and traceability.
      Require AI-generated logs to be cryptographically signed and immutable for regulatory
      compliance. '
    translations:
      de:
        name: Abstreitbarkeit und fehlende Nachvollziehbarkeit
        description: Handlungen von KI-Agenten lassen sich aufgrund unzureichender Protokollierung oder mangelnder
          Transparenz der Entscheidungsprozesse nicht zurückverfolgen oder zuordnen.
        annotation: Setzen Sie umfassende Protokollierung, kryptografische Prüfung, erweiterte Metadaten und
          Echtzeitüberwachung ein, um Rechenschaftspflicht und Nachvollziehbarkeit sicherzustellen. Verlangen
          Sie für die Einhaltung regulatorischer Anforderungen kryptografisch signierte und unveränderliche
          KI-generierte Protokolle.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t9
    ref_id: T9
    name: 'Identity Spoofing & Impersonation '
    description: Attackers exploit authentication mechanisms to impersonate AI agents
      or human users, enabling them to execute unauthorized actions under false identities.
    annotation: 'Develop comprehensive identity validation frameworks, enforce trust
      boundaries, and deploy continuous monitoring to detect impersonation attempts.
      Use behavioral profiling, involving a second model, to detect deviations in
      AI agent activity that may indicate identity spoofing. '
    translations:
      de:
        name: Identitätsvortäuschung
        description: Angreifer nutzen Authentisierungsmechanismen aus, um sich als KI-Agenten oder menschliche
          Nutzer auszugeben und unter falscher Identität unbefugte Handlungen auszuführen.
        annotation: Entwickeln Sie umfassende Verfahren zur Identitätsprüfung, setzen Sie Vertrauensgrenzen
          durch und überwachen Sie kontinuierlich auf Identitätsvortäuschung. Nutzen Sie Verhaltensprofile
          unter Einbeziehung eines zweiten Modells, um Abweichungen in der Aktivität von KI-Agenten zu erkennen,
          die darauf hindeuten könnten.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t10
    ref_id: T10
    name: 'Overwhelming Human in the Loop  '
    description: 'This threat targets systems with human oversight and decision validation,
      aiming to exploit human cognitive limitations or compromise interaction frameworks.   '
    annotation: 'Develop advanced human-AI interaction frameworks, and adaptive trust
      mechanisms. These are dynamic AI governance models that employ dynamic intervention
      thresholds to adjust the level of human oversight and automation based on risk,
      confidence, and context. Apply hierarchical AI-human collaboration where low-risk
      decisions are automated, and human intervention is prioritized for high-risk
      anomalies. '
    translations:
      de:
        name: Überlastung der menschlichen Aufsicht
        description: Diese Bedrohung richtet sich gegen Systeme mit menschlicher Aufsicht und Entscheidungsprüfung.
          Sie zielt darauf ab, menschliche kognitive Grenzen auszunutzen oder die Interaktionsmechanismen
          zu kompromittieren.
        annotation: 'Entwickeln Sie fortgeschrittene Verfahren für die Interaktion zwischen Mensch und KI
          sowie adaptive Vertrauensmechanismen. Gemeint sind dynamische KI-Governance-Modelle, deren Eingriffsschwellen
          den Umfang menschlicher Aufsicht und Automatisierung an Risiko, Konfidenz und Kontext anpassen.
          Nutzen Sie eine abgestufte Zusammenarbeit: Automatisieren Sie Entscheidungen mit geringem Risiko
          und priorisieren Sie menschliche Eingriffe bei Anomalien mit hohem Risiko.'
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t11
    ref_id: T11
    name: 'Unexpected RCE and Code Attacks '
    description: 'Attackers exploit AI-generated execution environments to inject
      malicious code, trigger unintended system behaviors, or execute unauthorized
      scripts. '
    annotation: 'Restrict AI code generation permissions, sandbox execution, and monitor
      AI-generated scripts. Implement execution control policies that flag AIgenerated
      code with elevated privileges for manual review. '
    translations:
      de:
        name: Unerwartete Remotecodeausführung und Codeangriffe
        description: Angreifer nutzen KI-generierte Ausführungsumgebungen aus, um Schadcode einzuschleusen,
          unbeabsichtigtes Systemverhalten auszulösen oder unbefugte Skripte auszuführen.
        annotation: Beschränken Sie Berechtigungen zur KI-Codegenerierung, führen Sie Code in einer Sandbox
          aus und überwachen Sie KI-generierte Skripte. Setzen Sie Regeln zur Ausführungskontrolle um, die
          KI-generierten Code mit erhöhten Berechtigungen zur manuellen Prüfung kennzeichnen.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t12
    ref_id: T12
    name: 'Agent Communication Poisoning '
    description: 'Attackers manipulate communication channels between AI agents to
      spread false information, disrupt workflows, or influence decision-making.   '
    annotation: 'Deploy cryptographic message authentication, enforce communication
      validation policies, and monitor inter-agent interactions for anomalies. Require
      multi-agent consensus verification for mission-critical decision-making processes. '
    translations:
      de:
        name: Vergiftung der Agentenkommunikation
        description: Angreifer manipulieren Kommunikationskanäle zwischen KI-Agenten, um falsche Informationen
          zu verbreiten, Workflows zu stören oder Entscheidungen zu beeinflussen.
        annotation: Setzen Sie kryptografische Nachrichtenauthentisierung und Regeln zur Kommunikationsprüfung
          durch. Überwachen Sie Interaktionen zwischen Agenten auf Anomalien. Verlangen Sie für geschäftskritische
          Entscheidungsprozesse eine Konsensprüfung durch mehrere Agenten.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t13
    ref_id: T13
    name: 'Rogue Agents in Multi-Agent Systems '
    description: 'Malicious or compromised AI agents operate outside normal monitoring
      boundaries, executing unauthorized actions or exfiltrating data.   '
    annotation: 'Restrict AI agent autonomy using policy constraints and continuous
      behavioral monitoring. While cryptographic attestation mechanisms for LLMs do
      not yet exist, agent integrity can be maintained via controlled hosting environments,
      regular AI red teaming, and input/output monitoring for deviations '
    translations:
      de:
        name: Bösartige Agenten in Multi-Agenten-Systemen
        description: Bösartige oder kompromittierte KI-Agenten handeln außerhalb der üblichen Überwachungsgrenzen
          und führen unbefugte Aktionen aus oder schleusen Daten aus.
        annotation: Beschränken Sie die Autonomie von KI-Agenten durch Richtlinienvorgaben und kontinuierliche
          Verhaltensüberwachung. Obwohl kryptografische Attestierungsmechanismen für LLMs noch nicht existieren,
          lässt sich die Integrität von Agenten durch kontrollierte Hosting-Umgebungen, regelmäßiges KI-Red-Teaming
          sowie die Überwachung von Ein- und Ausgaben auf Abweichungen erhalten.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t14
    ref_id: T14
    name: 'Human Attacks on Multi-Agent Systems '
    description: 'Adversaries exploit inter-agent delegation, trust relationships,
      and workflow dependencies to escalate privileges or manipulate AI-driven operations.   '
    annotation: 'Restrict agent delegation mechanisms, enforce interagent authentication,
      and deploy behavioral monitoring to detect manipulation attempts. Enforce multi-agent
      task segmentation to prevent attackers from escalating privileges across interconnected
      agents. '
    translations:
      de:
        name: Menschliche Angriffe auf Multi-Agenten-Systeme
        description: Angreifer nutzen die Delegation zwischen Agenten, Vertrauensbeziehungen und Workflow-Abhängigkeiten
          aus, um Berechtigungen auszuweiten oder KI-gesteuerte Abläufe zu manipulieren.
        annotation: Beschränken Sie Delegationsmechanismen, setzen Sie Authentisierung zwischen Agenten durch
          und überwachen Sie das Verhalten, um Manipulationsversuche zu erkennen. Segmentieren Sie Aufgaben
          in Multi-Agenten-Systemen, damit Angreifer ihre Berechtigungen nicht über vernetzte Agenten hinweg
          ausweiten können.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t15
    ref_id: T15
    name: 'Human Manipulation '
    description: 'In scenarios where AI agents engage in direct interaction with human
      users, the trust relationship reduces user skepticism, increasing reliance on
      the agent''s responses and autonomy. This implicit trust and direct human/agent
      interaction create risks, as attackers can coerce agents to manipulate users,
      spread misinformation, and take covert actions. '
    annotation: "Monitor agent behavior to ensure it aligns with its defined role\
      \ and expected actions. Restrict tool access to minimize the attack surface,\
      \ limit the agent\u2019s ability to print links, implement validation mechanisms\
      \ to detect and filter manipulated responses using guardrails, moderation APIs,\
      \ or another model "
    translations:
      de:
        name: Manipulation von Menschen
        description: 'Bei der direkten Interaktion von KI-Agenten mit Menschen verringert die Vertrauensbeziehung
          die Skepsis der Nutzer und verstärkt deren Vertrauen in die Antworten und Autonomie des Agenten.
          Dieses implizite Vertrauen und die unmittelbare Interaktion schaffen Risiken: Angreifer können Agenten
          dazu bringen, Nutzer zu manipulieren, Fehlinformationen zu verbreiten und verdeckte Handlungen auszuführen.'
        annotation: Überwachen Sie, ob das Verhalten des Agenten seiner definierten Rolle und den erwarteten
          Handlungen entspricht. Beschränken Sie Werkzeugzugriffe, um die Angriffsfläche zu verringern, und
          begrenzen Sie die Ausgabe von Links. Erkennen und filtern Sie manipulierte Antworten mithilfe von
          Schutzmechanismen, Moderations-APIs oder einem weiteren Modell.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t16
    ref_id: T16
    name: Model Inconsistency Leading to Variable Approvals
    description: Foundation model exhibits non-deterministic behaviour, leading to
      inconsistent processing.
    translations:
      de:
        name: Uneinheitliche Freigaben durch Modellinkonsistenz
        description: Das Basismodell verhält sich nicht deterministisch und verarbeitet Vorgänge dadurch uneinheitlich.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t17
    ref_id: T17
    name: Semantic Drift in Expense Policy Embeddings
    description: Outdated embeddings in the vector database cause the agent to apply
      incorrect policies
    translations:
      de:
        name: Bedeutungsverschiebung in Embeddings von Spesenrichtlinien
        description: Veraltete Embeddings in der Vektordatenbank führen dazu, dass der Agent falsche Richtlinien
          anwendet.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t18
    ref_id: T18
    name: RAG Input Manipulation Leading to Policy Bypass
    description: Attacker crafts inputs to exploit RAG and bypass policy checks
    translations:
      de:
        name: Umgehung von Richtlinien durch RAG-Eingabemanipulation
        description: Ein Angreifer gestaltet Eingaben gezielt so, dass RAG ausgenutzt und Richtlinienprüfungen
          umgangen werden.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t19
    ref_id: T19
    name: Unintended Workflow Execution
    description: Agent executes workflow steps incorrectly or skips validation.
    translations:
      de:
        name: Unbeabsichtigte Workflow-Ausführung
        description: Der Agent führt Workflow-Schritte falsch aus oder überspringt die Validierung.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t20
    ref_id: T20
    name: Framework Vulnerability to code injection
    description: Agent Framework has security bug
    translations:
      de:
        name: Code-Injection-Schwachstelle im Framework
        description: Das Agentenframework weist einen Sicherheitsfehler auf.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t21
    ref_id: T21
    name: "Inconsistency Workflow\u2019s State"
    description: Inconsistent\ unsynchronized views of the workflow's state \ shareable
      objects (e.g., shared memory or graph objects) among agents can lead to conflicting
      actions or result in a denial of service.
    translations:
      de:
        name: Inkonsistenter Workflow-Zustand
        description: Inkonsistente oder nicht synchronisierte Sichten der Agenten auf den Workflow-Zustand
          oder gemeinsam nutzbare Objekte, etwa gemeinsamen Speicher oder Graphobjekte, können zu widersprüchlichen
          Aktionen oder einem Dienstausfall führen.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t22
    ref_id: T22
    name: Service Account Exposure
    description: Agent's service account credentials are accidentally exposed.
    translations:
      de:
        name: Offenlegung von Dienstkontozugangsdaten
        description: Die Zugangsdaten des Dienstkontos des Agenten werden versehentlich offengelegt.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t23
    ref_id: T23
    name: Selective Log Manipulation
    description: Attacker selectively modifies logs to remove evidence of specific
      actions
    translations:
      de:
        name: Gezielte Protokollmanipulation
        description: Ein Angreifer verändert Protokolle gezielt, um Nachweise bestimmter Handlungen zu entfernen.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t24
    ref_id: T24
    name: Dynamic Policy Enforcement Failure
    description: Flaw in the dynamic policy engine causes incorrect policy application
    translations:
      de:
        name: Fehler bei der dynamischen Richtliniendurchsetzung
        description: Ein Fehler in der dynamischen Richtlinien-Engine führt zur falschen Anwendung von Richtlinien.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t25
    ref_id: T25
    name: Workflow Disruption via Dependency Exploitation
    description: Attacker disrupts the workflow by attacking a system the RPA agent
      depends on
    translations:
      de:
        name: Workflow-Unterbrechung durch Angriff auf Abhängigkeiten
        description: Ein Angreifer stört den Workflow, indem er ein System angreift, von dem der RPA-Agent
          abhängt.
  - urn: urn:intuitem:risk:threat:owasp-mas-threats:t26
    ref_id: T26
    name: Model Instability
