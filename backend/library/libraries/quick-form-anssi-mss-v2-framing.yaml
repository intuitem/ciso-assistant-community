urn: urn:intuitem:risk:library:quick-form-anssi-mss-v2-framing
locale: fr
ref_id: quick-form-anssi-mss-v2-framing
name: 'ANSSI - MonServiceSécurisé : cadrage du service'
description: |-
  Description d'un service numérique telle que MonServiceSécurisé la demande (type, hébergement, données, audience, disponibilité, ouverture). Les résultats reprennent les règles de MonServiceSécurisé V2 : besoins de sécurité, avec les groupes d'implémentation du référentiel de mesures qu'ils appliquent, risques retenus parmi les 14 du référentiel et objectifs visés.

  Source : https://github.com/betagouv/mon-service-securise (commit 1362dc43fde880dc2f188383b760cbe38fada8c8)
copyright: |-
  Copyright ANSSI - Agence nationale de la sécurité des systèmes d'information (https://cyber.gouv.fr)

