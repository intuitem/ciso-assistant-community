name: "7/2024. (VI. 24.) MK rendelet \u2013 Kock\xE1zati m\xE1trix"
description: "N\xE9gyszer n\xE9gyes kock\xE1zati m\xE1trix a 7/2024. (VI. 24.) MK\
  \ rendelet 1. mell\xE9klet 5.1.1.5. pontja szerinti n\xE9gy kock\xE1zati kateg\xF3\
  ri\xE1val (\u201Ealacsony\u201D, \u201Ek\xF6zepes\u201D, \u201Emagas\u201D, \u201E\
  kritikus\u201D): a kock\xE1zatot a fenyeget\xE9s bek\xF6vetkez\xE9s\xE9nek val\xF3\
  sz\xEDn\u0171s\xE9ge \xE9s k\xE1ros hat\xE1s\xE1nak m\xE9rt\xE9ke hat\xE1rozza meg.\
  \ A hat\xE1s fokozatai az 1. mell\xE9klet 2.2.2\u20132.2.4. pontja szerinti k\xE1\
  resem\xE9nyszinteket (csek\xE9ly, k\xF6zepes, nagy) k\xF6vetik, egy elhanyagolhat\xF3\
  \ fokozattal kieg\xE9sz\xEDtve, \xEDgy a biztons\xE1gi oszt\xE1lyba sorol\xE1s hat\xE1\
  selemz\xE9se \xE9s a kock\xE1zatelemz\xE9s ugyanazt a m\xE9rc\xE9t haszn\xE1lja.\
  \ A val\xF3sz\xEDn\u0171s\xE9g sk\xE1l\xE1j\xE1t a rendelet nem hat\xE1rozza meg:\
  \ a fokozatok le\xEDr\xE1sa kiindul\xF3pont, amelyet a szervezet a kock\xE1zatmenedzsment-elj\xE1\
  r\xE1s\xE1ban pontos\xEDthat. Az 5.1.2.2. pont szerint r\xE9szletes indokl\xE1s\
  \ n\xE9lk\xFCli kock\xE1zatfelv\xE1llal\xE1s csak az \u201Ealacsony\u201D kateg\xF3\
  ri\xE1ban alkalmazhat\xF3. A hu-7-2024-mk-rendelet keretrendszerhez \xE9s a hu-7-2024-mk-rendelet-fenyegetesek\
  \ fenyeget\xE9skatal\xF3gushoz tartoz\xF3 m\xE1trix.\nSz\xF6veg\xE1llapot: a 7/2024.\
  \ MK rendelet njt.hu szerinti egys\xE9ges szerkezete (2025. 01. 02.)."
copyright: "A kock\xE1zati kateg\xF3ri\xE1k \xE9s a k\xE1resem\xE9nyszintek a 7/2024.\
  \ (VI. 24.) MK rendeletb\u0151l sz\xE1rmaznak; a jogszab\xE1lyok sz\xF6vege a szerz\u0151\
  i jogr\xF3l sz\xF3l\xF3 1999. \xE9vi LXXVI. t\xF6rv\xE9ny 1. \xA7 (4) bekezd\xE9\
  se alapj\xE1n nem \xE1ll szerz\u0151i jogi v\xE9delem alatt. Forr\xE1sok: Magyar\
  \ K\xF6zl\xF6ny 2024/68. sz\xE1m, Nemzeti Jogszab\xE1lyt\xE1r (njt.hu). Hungarian\
  \ legal texts are not subject to copyright (Act LXXVI of 1999, Section 1(4))."
