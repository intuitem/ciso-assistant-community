    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
    - urn:intuitem:risk:function:mitre-attack-mobile:m1014
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1430.001
    ref_id: T1430.001
    name: Remote Device Management Services
    description: 'An adversary may use access to cloud services (e.g. Google''s Android
      Device Manager or Apple iCloud''s Find my iPhone) or to an enterprise mobility
      management (EMM)/mobile device management (MDM) server console to track the
      location of mobile devices managed by the service.(Citation: Krebs-Location)

      https://attack.mitre.org/techniques/T1430/001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1430
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1430.002
    ref_id: T1430.002
    name: Impersonate SS7 Nodes
    description: "Adversaries may exploit the lack of authentication in signaling\
      \ system network nodes to track the location of mobile devices by impersonating\
      \ a node.(Citation: Engel-SS7)(Citation: Engel-SS7-2008)(Citation: 3GPP-Security)(Citation:\
      \ Positive-SS7)(Citation: CSRIC5-WG10-FinalReport) \n\n \n\nBy providing the\
      \ victim\u2019s MSISDN (phone number) and impersonating network internal nodes\
      \ to query subscriber information from other nodes, adversaries may use data\
      \ collected from each hop to eventually determine the device\u2019s geographical\
      \ cell area or nearest cell tower.(Citation: Engel-SS7)\nhttps://attack.mitre.org/techniques/T1430/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1430
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
