  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1521
    ref_id: T1521
    name: Encrypted Channel
    description: 'Adversaries may explicitly employ a known encryption algorithm to
      conceal command and control traffic rather than relying on any inherent protections
      provided by a communication protocol. Despite the use of a secure algorithm,
      these implementations may be vulnerable to reverse engineering if necessary
      secret keys are encoded and/or generated within malware samples/configuration
      files.

      https://attack.mitre.org/techniques/T1521'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1521.001
    ref_id: T1521.001
    name: Symmetric Cryptography
    description: 'Adversaries may employ a known symmetric encryption algorithm to
      conceal command and control traffic, rather than relying on any inherent protections
      provided by a communication protocol. Symmetric encryption algorithms use the
      same key for plaintext encryption and ciphertext decryption. Common symmetric
      encryption algorithms include AES, Blowfish, and RC4.

      https://attack.mitre.org/techniques/T1521/001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1521
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1521.002
    ref_id: T1521.002
    name: Asymmetric Cryptography
    description: "Adversaries may employ a known asymmetric encryption algorithm to\
      \ conceal command and control traffic, rather than relying on any inherent protections\
      \ provided by a communication protocol. Asymmetric cryptography, also known\
      \ as public key cryptography, uses a keypair per party: one public that can\
      \ be freely distributed, and one private that should not be distributed. Due\
      \ to how asymmetric algorithms work, the sender encrypts data with the receiver\u2019\
      s public key and the receiver decrypts the data with their private key. This\
      \ ensures that only the intended recipient can read the encrypted data. Common\
      \ public key encryption algorithms include RSA, ElGamal, and ECDSA.\n\nFor efficiency,\
      \ many protocols (including SSL/TLS) use symmetric cryptography once a connection\
      \ is established, but use asymmetric cryptography to establish or transmit a\
      \ key. As such, these protocols are classified as [Asymmetric Cryptography](https://attack.mitre.org/techniques/T1521/002)."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1521
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1521.003
    ref_id: T1521.003
    name: SSL Pinning
    description: "Adversaries may use [SSL Pinning](https://attack.mitre.org/techniques/T1521/003)\
      \  to protect the C2 traffic from being intercepted and analyzed.\n\n[SSL Pinning](https://attack.mitre.org/techniques/T1521/003)\
      \  is a technique commonly utilized by legitimate websites to ensure that encrypted\
      \ communications are only allowed with a pre-defined certificate. If another\
      \ certificate is presented, it could indicate device compromise, traffic interception,\
      \ or another upstream issue. While benign usages are common, it is also possible\
      \ for adversaries to abuse this technology to protect malicious C2 traffic.\n\
      \nIn normal, not pinned SSL validation, when a client connects to a server using\
      \ HTTPS, it typically checks whether the server\u2019s SSL/TLS certificate is\
      \ signed by a trusted Certificate Authority (CA) in the device\u2019s trust\
      \ store. If the certificate is valid and signed by a trusted CA, the connection\
      \ is established. However, with [SSL Pinning](https://attack.mitre.org/techniques/T1521/003)\
      \ , the client is configured to trust a specific SSL/TLS certificate or public\
      \ key, rather than relying on the device\u2019s trust store. This means that\
      \ even if the server\u2019s certificate is signed by a trusted CA, the client\
      \ will only establish the connection of the certificate or key is pinned.\n\n\
      There are two types of [SSL Pinning](https://attack.mitre.org/techniques/T1521/003)\
      \ :\n\n1.\tCertificate Pinning: The client stores a copy of the server\u2019\
      s certificate and compares it with the certificate received during the SSL handshake.\
      \ If the certificates match, then the client proceeds with the connection. This\
      \ approach also works with self-signed certificates.\n\n2.\tPublic Key Pinning:\
      \ Instead of pinning the entire certificate, the client pins just the public\
      \ key extracted from the certificate. This is often more flexible, as it allows\
      \ the server to renew its certificate without having to update the pinned certificate\
      \ or breaking the SSL connection."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1521
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
