  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1630.003
    ref_id: T1630.003
    name: Disguise Root/Jailbreak Indicators
    description: 'An adversary could use knowledge of the techniques used by security
      software to evade detection.(Citation: Brodie)(Citation: Tan) For example, some
      mobile security products perform compromised device detection by searching for
      particular artifacts such as an installed "su" binary, but that check could
      be evaded by naming the binary something else. Similarly, polymorphic code techniques
      could be used to evade signature-based detection.(Citation: Rastogi)

      https://attack.mitre.org/techniques/T1630/003'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1630
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1631
    ref_id: T1631
    name: Process Injection
    description: "Adversaries may inject code into processes in order to evade process-based\
      \ defenses or even elevate privileges. Process injection is a method of executing\
      \ arbitrary code in the address space of a separate live process. Running code\
      \ in the context of another process may allow access to the process's memory,\
      \ system/network resources, and possibly elevated privileges. Execution via\
      \ process injection may also evade detection from security products since the\
      \ execution is masked under a legitimate process. \n\nBoth Android and iOS have\
      \ no legitimate way to achieve process injection. The only way this is possible\
      \ is by abusing existing root access or exploiting a vulnerability.\nhttps://attack.mitre.org/techniques/T1631"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0029
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1631.001
    ref_id: T1631.001
    name: Ptrace System Calls
    description: "Adversaries may inject malicious code into processes via ptrace\
      \ (process trace) system calls in order to evade process-based defenses as well\
      \ as possibly elevate privileges. Ptrace system call injection is a method of\
      \ executing arbitrary code in the address space of a separate live process.\
      \  \n\nPtrace system call injection involves attaching to and modifying a running\
      \ process. The ptrace system call enables a debugging process to observe and\
      \ control another process (and each individual thread), including changing memory\
      \ and register values.(Citation: PTRACE man) Ptrace system call injection is\
      \ commonly performed by writing arbitrary code into a running process (e.g.,\
      \ by using `malloc`) then invoking that memory with `PTRACE_SETREGS` to set\
      \ the register containing the next instruction to execute. Ptrace system call\
      \ injection can also be done with `PTRACE_POKETEXT`/`PTRACE_POKEDATA`, which\
      \ copy data to a specific address in the target process's memory (e.g., the\
      \ current address of the next instruction).(Citation: PTRACE man)(Citation:\
      \ Medium Ptrace JUL 2018)  \n\nPtrace system call injection may not be possible\
      \ when targeting processes with high-privileges, and on some systems those that\
      \ are non-child processes.(Citation: BH Linux Inject)  \n\nRunning code in the\
      \ context of another process may allow access to the process's memory, system/network\
      \ resources, and possibly elevated privileges. Execution via ptrace system call\
      \ injection may also evade detection from security products since the execution\
      \ is masked under a legitimate process.\nhttps://attack.mitre.org/techniques/T1631/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1631
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0029
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1632
    ref_id: T1632
    name: Subvert Trust Controls
    description: 'Adversaries may undermine security controls that will either warn
      users of untrusted activity or prevent execution of untrusted applications.
      Operating systems and security products may contain mechanisms to identify programs
      or websites as possessing some level of trust. Examples of such features include:
      an app being allowed to run because it is signed by a valid code signing certificate;
      an OS prompt alerting the user that an app came from an untrusted source; or
      getting an indication that you are about to connect to an untrusted site. The
      method adversaries use will depend on the specific mechanism they seek to subvert.

      https://attack.mitre.org/techniques/T1632'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1632.001
    ref_id: T1632.001
    name: Code Signing Policy Modification
    description: "Adversaries may modify code signing policies to enable execution\
      \ of applications signed with unofficial or unknown keys. Code signing provides\
      \ a level of authenticity on an app from a developer, guaranteeing that the\
      \ program has not been tampered with and comes from an official source. Security\
      \ controls can include enforcement mechanisms to ensure that only valid, signed\
      \ code can be run on a device. \n\nMobile devices generally enable these security\
      \ controls by default, such as preventing the installation of unknown applications\
      \ on Android. Adversaries may modify these policies in a number of ways, including\
      \ [Input Injection](https://attack.mitre.org/techniques/T1516) or malicious\
      \ configuration profiles.\nhttps://attack.mitre.org/techniques/T1632/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1632
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1633
    ref_id: T1633
    name: Virtualization/Sandbox Evasion
    description: "Adversaries may employ various means to detect and avoid virtualization\
      \ and analysis environments. This may include changing behaviors after checking\
      \ for the presence of artifacts indicative of a virtual machine environment\
      \ (VME) or sandbox. If the adversary detects a VME, they may alter their malware\u2019\
      s behavior to disengage from the victim or conceal the core functions of the\
      \ payload. They may also search for VME artifacts before dropping further payloads.\
      \ Adversaries may use the information learned from [Virtualization/Sandbox Evasion](https://attack.mitre.org/techniques/T1633)\
      \ during automated discovery to shape follow-on behaviors. \n\nAdversaries may\
      \ use several methods to accomplish [Virtualization/Sandbox Evasion](https://attack.mitre.org/techniques/T1633)\
      \ such as checking for system artifacts associated with analysis or virtualization.\
      \ Adversaries may also check for legitimate user activity to help determine\
      \ if it is in an analysis environment."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1633.001
    ref_id: T1633.001
    name: System Checks
    description: "Adversaries may employ various system checks to detect and avoid\
      \ virtualization and analysis environments. This may include changing behavior\
      \ after checking for the presence of artifacts indicative of a virtual environment\
      \ or sandbox. If the adversary detects a virtual environment, they may alter\
      \ their malware\u2019s behavior to disengage from the victim or conceal the\
      \ core functions of the implant. They may also search for virtualization artifacts\
      \ before dropping secondary or additional payloads. \n\nChecks could include\
      \ generic system properties such as host/domain name and samples of network\
      \ traffic. Adversaries may also check the network adapters addresses, CPU core\
      \ count, and available memory/drive size. \n\nHardware checks, such as the presence\
      \ of motion sensors, could also be used to gather evidence that can be indicative\
      \ a virtual environment. Adversaries may also query for specific readings from\
      \ these devices.\nhttps://attack.mitre.org/techniques/T1633/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1633
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1634
    ref_id: T1634
    name: Credentials from Password Store
    description: 'Adversaries may search common password storage locations to obtain
      user credentials. Passwords can be stored in several places on a device, depending
      on the operating system or application holding the credentials. There are also
      specific applications that store passwords to make it easier for users to manage
      and maintain. Once credentials are obtained, they can be used to perform lateral
      movement and access restricted information.

      https://attack.mitre.org/techniques/T1634'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1634.001
    ref_id: T1634.001
    name: Keychain
    description: "Adversaries may collect keychain data from an iOS device to acquire\
      \ credentials. Keychains are the built-in way for iOS to keep track of users'\
      \ passwords and credentials for many services and features such as Wi-Fi passwords,\
      \ websites, secure notes, certificates, private keys, and VPN credentials. \n\
      \nOn the device, the keychain database is stored outside of application sandboxes\
      \ to prevent unauthorized access to the raw data. Standard iOS APIs allow applications\
      \ access to their own keychain contained within the database. By utilizing a\
      \ privilege escalation exploit or existing root access, adversaries can access\
      \ the entire encrypted database.(Citation: Apple Keychain Services)(Citation:\
      \ Elcomsoft Decrypt Keychain)\nhttps://attack.mitre.org/techniques/T1634/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1634
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1635
    ref_id: T1635
    name: Steal Application Access Token
    description: "Adversaries can steal user application access tokens as a means\
      \ of acquiring credentials to access remote systems and resources. This can\
      \ occur through social engineering or URI hijacking and typically requires user\
      \ action to grant access, such as through a system \u201COpen With\u201D dialogue.\
      \  \n\nApplication access tokens are used to make authorized API requests on\
      \ behalf of a user and are commonly used as a way to access resources in cloud-based\
      \ applications and software-as-a-service (SaaS).(Citation: Auth0 - Why You Should\
      \ Always Use Access Tokens to Secure APIs Sept 2019) OAuth is one commonly implemented\
      \ framework used to issue tokens to users for access to systems. An application\
      \ desiring access to cloud-based services or protected APIs can gain entry through\
      \ OAuth 2.0 using a variety of authorization protocols. An example of a commonly-used\
      \ sequence is Microsoft's Authorization Code Grant flow.(Citation: Microsoft\
      \ Identity Platform Protocols May 2019)(Citation: Microsoft - OAuth Code Authorization\
      \ flow - June 2019) An OAuth access token enables a third-party application\
      \ to interact with resources containing user data in the ways requested without\
      \ requiring user credentials.\nhttps://attack.mitre.org/techniques/T1635"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack:m1013
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1635.001
    ref_id: T1635.001
    name: URI Hijacking
    description: "Adversaries may register Uniform Resource Identifiers (URIs) to\
      \ intercept sensitive data. \n\nApplications regularly register URIs with the\
      \ operating system to act as a response handler for various actions, such as\
      \ logging into an app using an external account via single sign-on. This allows\
      \ redirections to that specific URI to be intercepted by the application. If\
      \ an adversary were to register for a URI that was already in use by a genuine\
      \ application, the adversary may be able to intercept data intended for the\
      \ genuine application or perform a phishing attack against the genuine application.\
      \ Intercepted data may include OAuth authorization codes or tokens that could\
      \ be used by the adversary to gain access to protected resources.(Citation:\
      \ Trend Micro iOS URL Hijacking)(Citation: IETF-PKCE)\nhttps://attack.mitre.org/techniques/T1635/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1635
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack:m1013
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636
    ref_id: T1636
    name: Protected User Data
    description: "Adversaries may utilize standard operating system APIs to collect\
      \ data from permission-backed data stores on a device, such as the calendar\
      \ or contact list. These permissions need to be declared ahead of time. On Android,\
      \ they must be included in the application\u2019s manifest. On iOS, they must\
      \ be included in the application\u2019s `Info.plist` file.  \n\n \n\nIn almost\
      \ all cases, the user is required to grant access to the data store that the\
      \ application is trying to access. In recent OS versions, vendors have introduced\
      \ additional privacy controls for users, such as the ability to grant permission\
      \ to an application only while the application is being actively used by the\
      \ user. \n\n \n\nIf the device has been jailbroken or rooted, an adversary may\
      \ be able to access [Protected User Data](https://attack.mitre.org/techniques/T1636)\
      \ without the user\u2019s knowledge or approval."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636.001
    ref_id: T1636.001
    name: Calendar Entries
    description: "Adversaries may utilize standard operating system APIs to gather\
      \ calendar entry data. On Android, this can be accomplished using the Calendar\
      \ Content Provider. On iOS, this can be accomplished using the `EventKit` framework.\
      \ \n\n \n\nIf the device has been jailbroken or rooted, an adversary may be\
      \ able to access [Calendar Entries](https://attack.mitre.org/techniques/T1636/001)\
      \ without the user\u2019s knowledge or approval."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636.002
    ref_id: T1636.002
    name: Call Log
    description: "Adversaries may utilize standard operating system APIs to gather\
      \ call log data. On Android, this can be accomplished using the Call Log Content\
      \ Provider. iOS provides no standard API to access the call log. \n\n \n\nIf\
      \ the device has been jailbroken or rooted, an adversary may be able to access\
      \ the [Call Log](https://attack.mitre.org/techniques/T1636/002) without the\
      \ user\u2019s knowledge or approval."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636.003
    ref_id: T1636.003
    name: Contact List
    description: "Adversaries may utilize standard operating system APIs to gather\
      \ contact list data. On Android, this can be accomplished using the Contacts\
      \ Content Provider. On iOS, this can be accomplished using the `Contacts` framework.\
      \ \n\n \n\nIf the device has been jailbroken or rooted, an adversary may be\
      \ able to access the [Contact List](https://attack.mitre.org/techniques/T1636/003)\
      \ without the user\u2019s knowledge or approval."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636.004
    ref_id: T1636.004
    name: SMS Messages
    description: "Adversaries may utilize standard operating system APIs to gather\
      \ SMS messages. On Android, this can be accomplished using the SMS Content Provider.\
      \ iOS provides no standard API to access SMS messages. \n\nIf the device has\
      \ been jailbroken or rooted, an adversary may be able to access [SMS Messages](https://attack.mitre.org/techniques/T1636/004)\
      \ without the user\u2019s knowledge or approval."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636.005
    ref_id: T1636.005
    name: Accounts
    description: "Adversaries may utilize standard operating system APIs to gather\
      \ account data. On Android, this can be accomplished by using the AccountManager\
      \ API. For example, adversaries may use the `getAccounts()` method to list all\
      \ accounts.(Citation: Android_AccountManager_Feb2025) On iOS, this can be accomplished\
      \ by using the Keychain services.  \n\nIf the device has been jailbroken or\
      \ rooted, adversaries may be able to access [Accounts](https://attack.mitre.org/techniques/T1636/005)\
      \ without the users\u2019 knowledge or approval."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1636
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1637
    ref_id: T1637
    name: Dynamic Resolution
    description: 'Adversaries may dynamically establish connections to command and
      control infrastructure to evade common detections and remediations. This may
      be achieved by using malware that shares a common algorithm with the infrastructure
      the adversary uses to receive the malware''s communications. This algorithm
      can be used to dynamically adjust parameters such as the domain name, IP address,
      or port number the malware uses for command and control.

      https://attack.mitre.org/techniques/T1637'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1637.001
    ref_id: T1637.001
    name: Domain Generation Algorithms
    description: 'Adversaries may use [Domain Generation Algorithms](https://attack.mitre.org/techniques/T1637/001)
      (DGAs) to procedurally generate domain names for uses such as command and control
      communication   or malicious application distribution.(Citation: securelist
      rotexy 2018)


      DGAs increase the difficulty for defenders to block, track, or take over the
      command and control channel, as there could potentially be thousands of domains
      that malware can check for instructions.'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1637
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1638
    ref_id: T1638
    name: Adversary-in-the-Middle
    description: "Adversaries may attempt to position themselves between two or more\
      \ networked devices to support follow-on behaviors such as [Transmitted Data\
      \ Manipulation](https://attack.mitre.org/techniques/T1565/002) or [Endpoint\
      \ Denial of Service](https://attack.mitre.org/techniques/T1642).  \n\n \n\n\
      [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T1638) can be\
      \ achieved through several mechanisms. For example, a malicious application\
      \ may register itself as a VPN client, effectively redirecting device traffic\
      \ to adversary-owned resources. Registering as a VPN client requires user consent\
      \ on both Android and iOS; additionally, a special entitlement granted by Apple\
      \ is needed for iOS devices. Alternatively, a malicious application with escalation\
      \ privileges may utilize those privileges to gain access to network traffic.\
      \   \n\n\n Specific to Android devices, adversary-in-the-disk is a type of AiTM\
      \ attack where adversaries monitor and manipulate data that is exchanged between\
      \ applications and external storage.(Citation: mitd_kaspersky)(Citation: mitd_checkpoint)(Citation:\
      \ mitd_checkpoint_research) To accomplish this, a malicious application firsts\
      \ requests for access to multimedia files on the device (`READ_EXTERNAL STORAGE`\
      \ and `WRITE_EXTERNAL_STORAGE`), then the application reads data on the device\
      \ and/or writes malware to the device. Though the request for access is common,\
      \ when used maliciously, adversaries may access files and other sensitive data\
      \ due to abusing the permission. Multiple applications were shown to be vulnerable\
      \ against this attack; however, scrutiny of permissions and input validations\
      \ may mitigate this attack.    \n\nOutside of a mobile device, adversaries may\
      \ be able to capture traffic by employing a rogue base station or Wi-Fi access\
      \ point. These devices will allow adversaries to capture network traffic after\
      \ it has left the device, while it is flowing to its destination. On a local\
      \ network, enterprise techniques could be used, such as [ARP Cache Poisoning](https://attack.mitre.org/techniques/T1557/002)\
      \ or [DHCP Spoofing](https://attack.mitre.org/techniques/T1557/003).  \n\n \n\
      \nIf applications properly encrypt their network traffic, sensitive data may\
      \ not be accessible to adversaries, depending on the point of capture. For example,\
      \ properly implementing Apple\u2019s Application Transport Security (ATS) and\
      \ Android\u2019s Network Security Configuration (NSC) may prevent sensitive\
      \ data leaks.(Citation: NSC_Android)"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
