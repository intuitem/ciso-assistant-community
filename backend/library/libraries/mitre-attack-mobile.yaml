    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1418
    ref_id: T1418
    name: Software Discovery
    description: "Adversaries may attempt to get a listing of applications that are\
      \ installed on a device. Adversaries may use the information from [Software\
      \ Discovery](https://attack.mitre.org/techniques/T1418) during automated discovery\
      \ to shape follow-on behaviors, including whether or not to fully infect the\
      \ target and/or attempts specific actions. \n\n \n\nAdversaries may attempt\
      \ to enumerate applications for a variety of reasons, such as figuring out what\
      \ security measures are present or to identify the presence of target applications."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1418.001
    ref_id: T1418.001
    name: Security Software Discovery
    description: Adversaries may attempt to get a listing of security applications
      and configurations that are installed on a device. This may include things such
      as mobile security products. Adversaries may use the information from [Security
      Software Discovery](https://attack.mitre.org/techniques/T1418/001) during automated
      discovery to shape follow-on behaviors, including whether or not to fully infect
      the target and/or attempt specific actions.
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1418
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1420
    ref_id: T1420
    name: File and Directory Discovery
    description: "Adversaries may enumerate files and directories or search in specific\
      \ device locations for desired information within a filesystem. Adversaries\
      \ may use the information from [File and Directory Discovery](https://attack.mitre.org/techniques/T1420)\
      \ during automated discovery to shape follow-on behaviors, including deciding\
      \ if the adversary should fully infect the target and/or attempt specific actions.\
      \ \n\nOn Android, Linux file permissions and SELinux policies typically stringently\
      \ restrict what can be accessed by apps without taking advantage of a privilege\
      \ escalation exploit. The contents of the external storage directory are generally\
      \ visible, which could present concerns if sensitive data is inappropriately\
      \ stored there. iOS's security architecture generally restricts the ability\
      \ to perform any type of [File and Directory Discovery](https://attack.mitre.org/techniques/T1420)\
      \ without use of escalated privileges."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1421
    ref_id: T1421
    name: System Network Connections Discovery
    description: "Adversaries may attempt to get a listing of network connections\
      \ to or from the compromised device they are currently accessing or from remote\
      \ systems by querying for information over the network. \n\n \n\nThis is typically\
      \ accomplished by utilizing device APIs to collect information about nearby\
      \ networks, such as Wi-Fi, Bluetooth, and cellular tower connections. On Android,\
      \ this can be done by querying the respective APIs: \n\n \n\n* `WifiInfo` for\
      \ information about the current Wi-Fi connection, as well as nearby Wi-Fi networks.\
      \ Querying the `WiFiInfo` API requires the application to hold the `ACCESS_FINE_LOCATION`\
      \ permission. \n\n* `BluetoothAdapter` for information about Bluetooth devices,\
      \ which also requires the application to hold several permissions granted by\
      \ the user at runtime. \n\n* For Android versions prior to Q, applications can\
      \ use the `TelephonyManager.getNeighboringCellInfo()` method. For Q and later,\
      \ applications can use the `TelephonyManager.getAllCellInfo()` method. Both\
      \ methods require the application hold the `ACCESS_FINE_LOCATION` permission.\n\
      https://attack.mitre.org/techniques/T1421"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1422
    ref_id: T1422
    name: System Network Configuration Discovery
    description: "Adversaries may look for details about the network configuration\
      \ and settings, such as IP and/or MAC addresses, of devices they access or through\
      \ information discovery of remote systems. \n\nAdversaries may use the information\
      \ from [System Network Configuration Discovery](https://attack.mitre.org/techniques/T1422)\
      \ during automated discovery to shape follow-on behaviors, including determining\
      \ certain access within the target network and what actions to do next. \n\n\
      On Android, details of onboard network interfaces are accessible to apps through\
      \ the `java.net.NetworkInterface` class.(Citation: NetworkInterface) Previously,\
      \ the Android `TelephonyManager` class could be used to gather telephony-related\
      \ device identifiers, information such as the IMSI, IMEI, and phone number.\
      \ However, starting with Android 10, only preloaded, carrier, the default SMS,\
      \ or device and profile owner applications can access the telephony-related\
      \ device identifiers.(Citation: TelephonyManager) \n\n \n\nOn iOS, gathering\
      \ network configuration information is not possible without root access. \n\n\
      \ \n\nAdversaries may use the information from [System Network Configuration\
      \ Discovery](https://attack.mitre.org/techniques/T1422) during automated discovery\
      \ to shape follow-on behaviors, including determining certain access within\
      \ the target network and what actions to do next."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1422.001
    ref_id: T1422.001
    name: Internet Connection Discovery
    description: 'Adversaries may check for Internet connectivity on compromised systems.
      This may be performed during automated discovery and can be accomplished in
      numerous ways such as using `adb shell netstat` for Android.(Citation: adb_commands)


      Adversaries may use the results and responses from these requests to determine
      if the mobile devices are capable of communicating with adversary-owned C2 servers
      before attempting to connect to them. The results may also be used to identify
      routes, redirectors, and proxy servers.

      https://attack.mitre.org/techniques/T1422/001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1422
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1009
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1422.002
    ref_id: T1422.002
    name: Wi-Fi Discovery
    description: 'Adversaries may search for information about Wi-Fi networks, such
      as network names and passwords, on compromised systems. Adversaries may use
      Wi-Fi information as part of [Discovery](https://attack.mitre.org/tactics/TA0032)
      or [Credential Access](https://attack.mitre.org/tactics/TA0031) activity to
      support both ongoing and future campaigns.

      https://attack.mitre.org/techniques/T1422/002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1422
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1423
    ref_id: T1423
    name: Network Service Scanning
    description: 'Adversaries may attempt to get a listing of services running on
      remote hosts, including those that may be vulnerable to remote software exploitation.
      Methods to acquire this information include port scans and vulnerability scans
      from the mobile device. This technique may take advantage of the mobile device''s
      access to an internal enterprise network either through local connectivity or
      through a Virtual Private Network (VPN).

      https://attack.mitre.org/techniques/T1423'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1424
    ref_id: T1424
    name: Process Discovery
    description: "Adversaries may attempt to get information about running processes\
      \ on a device. Information obtained could be used to gain an understanding of\
      \ common software/applications running on devices within a network. Adversaries\
      \ may use the information from [Process Discovery](https://attack.mitre.org/techniques/T1424)\
      \ during automated discovery to shape follow-on behaviors, including whether\
      \ or not the adversary fully infects the target and/or attempts specific actions.\
      \ \n\n \n\nRecent Android security enhancements have made it more difficult\
      \ to obtain a list of running processes. On Android 7 and later, there is no\
      \ way for an application to obtain the process list without abusing elevated\
      \ privileges. This is due to the Android kernel utilizing the `hidepid` mount\
      \ feature. Prior to Android 7, applications could utilize the `ps` command or\
      \ examine the `/proc` directory on the device.(Citation: Android-SELinuxChanges)\
      \ \n\n \n\nIn iOS, applications have previously been able to use the `sysctl`\
      \ command to obtain a list of running processes. This functionality has been\
      \ removed in later iOS versions."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1426
    ref_id: T1426
    name: System Information Discovery
    description: "Adversaries may attempt to get detailed information about a device\u2019\
      s operating system and hardware, including versions, patches, and architecture.\
      \ Adversaries may use the information from [System Information Discovery](https://attack.mitre.org/techniques/T1426)\
      \ during automated discovery to shape follow-on behaviors, including whether\
      \ or not to fully infects the target and/or attempts specific actions. \n\n\
      \ \n\nOn Android, much of this information is programmatically accessible to\
      \ applications through the `android.os.Build` class. (Citation: Android-Build)\
      \ iOS is much more restrictive with what information is visible to applications.\
      \ Typically, applications will only be able to query the device model and which\
      \ version of iOS it is running."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1428
    ref_id: T1428
    name: Exploitation of Remote Services
    description: "Adversaries may exploit remote services of enterprise servers, workstations,\
      \ or other resources to gain unauthorized access to internal systems once inside\
      \ of a network. Adversaries may exploit remote services by taking advantage\
      \ of a mobile device\u2019s access to an internal enterprise network through\
      \ local connectivity or through a Virtual Private Network (VPN). Exploitation\
      \ of a software vulnerability occurs when an adversary takes advantage of a\
      \ programming error in a program, service, or within the operating system software\
      \ or kernel itself to execute adversary-controlled code. A common goal for post-compromise\
      \ exploitation of remote services is for lateral movement to enable access to\
      \ a remote system. \n\nAn adversary may need to determine if the remote system\
      \ is in a vulnerable state, which may be done through [Network Service Scanning](https://attack.mitre.org/techniques/T1423)\
      \ or other Discovery methods. These look for common, vulnerable software that\
      \ may be deployed in the network, the lack of certain patches that may indicate\
      \ vulnerabilities, or security software that may be used to detect or contain\
      \ remote exploitation. Servers are likely a high value target for lateral movement\
      \ exploitation, but endpoint systems may also be at risk if they provide an\
      \ advantage or access to additional resources.\n\nDepending on the permissions\
      \ level of the vulnerable remote service, an adversary may achieve [Exploitation\
      \ for Privilege Escalation](https://attack.mitre.org/techniques/T1404) as a\
      \ result of lateral movement exploitation as well.\nhttps://attack.mitre.org/techniques/T1428"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0033
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1429
    ref_id: T1429
    name: Audio Capture
    description: "Adversaries may capture audio to collect information by leveraging\
      \ standard operating system APIs of a mobile device. Examples of audio information\
      \ adversaries may target include user conversations, surroundings, phone calls,\
      \ or other sensitive information. \n\n \n\nAndroid and iOS, by default, require\
      \ that applications request device microphone access from the user.  \n\n \n\
      \nOn Android devices, applications must hold the `RECORD_AUDIO` permission to\
      \ access the microphone or the `CAPTURE_AUDIO_OUTPUT` permission to access audio\
      \ output. Because Android does not allow third-party applications to hold the\
      \ `CAPTURE_AUDIO_OUTPUT` permission by default, only privileged applications,\
      \ such as those distributed by Google or the device vendor, can access audio\
      \ output.(Citation: Android Permissions) However, adversaries may be able to\
      \ gain this access after successfully elevating their privileges. With the `CAPTURE_AUDIO_OUTPUT`\
      \ permission, adversaries may pass the `MediaRecorder.AudioSource.VOICE_CALL`\
      \ constant to `MediaRecorder.setAudioOutput`, allowing capture of both voice\
      \ call uplink and downlink.(Citation: Manifest.permission) \n\n \n\nOn iOS devices,\
      \ applications must include the `NSMicrophoneUsageDescription` key in their\
      \ `Info.plist` file to access the microphone.(Citation: Requesting Auth-Media\
      \ Capture)\nhttps://attack.mitre.org/techniques/T1429"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1430
    ref_id: T1430
    name: Location Tracking
    description: "Adversaries may track a device\u2019s physical location through\
      \ use of standard operating system APIs via malicious or exploited applications\
      \ on the compromised device. \n\n \n\nOn Android, applications holding the `ACCESS_COAURSE_LOCATION`\
      \ or `ACCESS_FINE_LOCATION` permissions provide access to the device\u2019s\
      \ physical location. On Android 10 and up, declaration of the `ACCESS_BACKGROUND_LOCATION`\
      \ permission in an application\u2019s manifest will allow applications to request\
      \ location access even when the application is running in the background.(Citation:\
      \ Android Request Location Permissions) Some adversaries have utilized integration\
      \ of Baidu map services to retrieve geographical location once the location\
      \ access permissions had been obtained.(Citation: PaloAlto-SpyDealer)(Citation:\
      \ Palo Alto HenBox) \n\n \n\nOn iOS, applications must include the `NSLocationWhenInUseUsageDescription`,\
      \ `NSLocationAlwaysAndWhenInUseUsageDescription`, and/or `NSLocationAlwaysUsageDescription`\
      \ keys in their `Info.plist` file depending on the extent of requested access\
      \ to location information.(Citation: Apple Requesting Authorization for Location\
      \ Services) On iOS 8.0 and up, applications call `requestWhenInUseAuthorization()`\
      \ to request access to location information when the application is in use or\
      \ `requestAlwaysAuthorization()` to request access to location information regardless\
      \ of whether the application is in use. With elevated privileges, an adversary\
      \ may be able to access location data without explicit user consent with the\
      \ `com.apple.locationd.preauthorized` entitlement key.(Citation: Google Project\
      \ Zero Insomnia)\nhttps://attack.mitre.org/techniques/T1430"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
