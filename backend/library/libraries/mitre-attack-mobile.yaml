  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1544
    ref_id: T1544
    name: Ingress Tool Transfer
    description: 'Adversaries may transfer tools or other files from an external system
      onto a compromised device to facilitate follow-on actions. Files may be copied
      from an external adversary-controlled system through the command and control
      channel  or through alternate protocols with another tool such as FTP.

      https://attack.mitre.org/techniques/T1544'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1575
    ref_id: T1575
    name: Native API
    description: "Adversaries may use Android\u2019s Native Development Kit (NDK)\
      \ to write native functions that can achieve execution of binaries or functions.\
      \ Like system calls on a traditional desktop operating system, native code achieves\
      \ execution on a lower level than normal Android SDK calls.\n\nThe NDK allows\
      \ developers to write native code in C or C++ that is compiled directly to machine\
      \ code, avoiding all intermediate languages and steps in compilation that higher\
      \ level languages, like Java, typically have. The Java Native Interface (JNI)\
      \ is the component that allows Java functions in the Android app to call functions\
      \ in a native library.(Citation: Google NDK Getting Started)\n\nAdversaries\
      \ may also choose to use native functions to execute malicious code since native\
      \ actions are typically much more difficult to analyze than standard, non-native\
      \ behaviors.(Citation: MITRE App Vetting Effectiveness)\nhttps://attack.mitre.org/techniques/T1575"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0041
    groups:
    - android
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1577
    ref_id: T1577
    name: Compromise Application Executable
    description: 'Adversaries may modify applications installed on a device to establish
      persistent access to a victim. These malicious modifications can be used to
      make legitimate applications carry out adversary tasks when these applications
      are in use.


      There are multiple ways an adversary can inject malicious code into applications.
      One method is by taking advantages of device vulnerabilities, the most well-known
      being Janus, an Android vulnerability that allows adversaries to add extra bytes
      to APK (application) and DEX (executable) files without affecting the file''s
      signature. By being able to add arbitrary bytes to valid applications, attackers
      can seamlessly inject code into genuine executables without the user''s knowledge.(Citation:
      Guardsquare Janus)


      Adversaries may also rebuild applications to include malicious modifications.
      This can be achieved by decompiling the genuine application, merging it with
      the malicious code, and recompiling it.(Citation: CheckPoint Agent Smith)


      Adversaries may also take action to conceal modifications to application executables
      and bypass user consent. These actions include altering modifications to appear
      as an update or exploiting vulnerabilities that allow activities of the malicious
      application to run inside a system application.(Citation: CheckPoint Agent Smith)

      https://attack.mitre.org/techniques/T1577'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1582
    ref_id: T1582
    name: SMS Control
    description: 'Adversaries may delete, alter, or send SMS messages without user
      authorization. This could be used to hide C2 SMS messages, spread malware, or
      various external effects.


      This can be accomplished by requesting the `RECEIVE_SMS` or `SEND_SMS` permissions
      depending on what the malware is attempting to do. If the app is set as the
      default SMS handler on the device, the `SMS_DELIVER` broadcast intent can be
      registered, which allows the app to write to the SMS content provider. The content
      provider directly modifies the messaging database on the device, which could
      allow malicious applications with this ability to insert, modify, or delete
      arbitrary messages on the device.(Citation: SMS KitKat)(Citation: Android SmsProvider)

      https://attack.mitre.org/techniques/T1582'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1603
    ref_id: T1603
    name: Scheduled Task/Job
    description: 'Adversaries may abuse task scheduling functionality to facilitate
      initial or recurring execution of malicious code. On Android and iOS, APIs and
      libraries exist to facilitate scheduling tasks to execute at a specified date,
      time, or interval.


      On Android, the `WorkManager` API allows asynchronous tasks to be scheduled
      with the system. `WorkManager` was introduced to unify task scheduling on Android,
      using `JobScheduler`, `GcmNetworkManager`, and `AlarmManager` internally. `WorkManager`
      offers a lot of flexibility for scheduling, including periodically, one time,
      or constraint-based (e.g. only when the device is charging).(Citation: Android
      WorkManager)


      On iOS, the `NSBackgroundActivityScheduler` API allows asynchronous tasks to
      be scheduled with the system. The tasks can be scheduled to be repeating or
      non-repeating, however, the system chooses when the tasks will be executed.
      The app can choose the interval for repeating tasks, or the delay between scheduling
      and execution for one-time tasks.(Citation: Apple NSBackgroundActivityScheduler)

      https://attack.mitre.org/techniques/T1603'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0041
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1604
    ref_id: T1604
    name: Proxy Through Victim
    description: "Adversaries may use a compromised device as a proxy server to the\
      \ Internet. By utilizing a proxy, adversaries hide the true IP address of their\
      \ C2 server and associated infrastructure from the destination of the network\
      \ traffic. This masquerades an adversary\u2019s traffic as legitimate traffic\
      \ originating from the compromised device, which can evade IP-based restrictions\
      \ and alerts on certain services, such as bank accounts and social media websites.(Citation:\
      \ Threat Fabric Exobot)\n\nThe most common type of proxy is a SOCKS proxy. It\
      \ can typically be implemented using standard OS-level APIs and 3rd party libraries\
      \ with no indication to the user. On Android, adversaries can use the `Proxy`\
      \ API to programmatically establish a SOCKS proxy connection, or lower-level\
      \ APIs to interact directly with raw sockets.\nhttps://attack.mitre.org/techniques/T1604"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1616
    ref_id: T1616
    name: Call Control
    description: 'Adversaries may make, forward, or block phone calls without user
      authorization. This could be used for adversary goals such as audio surveillance,
      blocking or forwarding calls from the device owner, or C2 communication.


      Several permissions may be used to programmatically control phone calls, including:


      * `ANSWER_PHONE_CALLS` - Allows the application to answer incoming phone calls(Citation:
      Android Permissions)

      * `CALL_PHONE` - Allows the application to initiate a phone call without going
      through the Dialer interface(Citation: Android Permissions)

      * `PROCESS_OUTGOING_CALLS` - Allows the application to see the number being
      dialed during an outgoing call with the option to redirect the call to a different
      number or abort the call altogether(Citation: Android Permissions)

      * `MANAGE_OWN_CALLS` - Allows a calling application which manages its own calls
      through the self-managed `ConnectionService` APIs(Citation: Android Permissions)

      * `BIND_TELECOM_CONNECTION_SERVICE` - Required permission when using a `ConnectionService`(Citation:
      Android Permissions)

      * `WRITE_CALL_LOG` - Allows an application to write to the device call log,
      potentially to hide malicious phone calls(Citation: Android Permissions)


      When granted some of these permissions, an application can make a phone call
      without opening the dialer first. However, if an application desires to simply
      redirect the user to the dialer with a phone number filled in, it can launch
      an Intent using `Intent.ACTION_DIAL`, which requires no specific permissions.
      This then requires the user to explicitly initiate the call or use some form
      of [Input Injection](https://attack.mitre.org/techniques/T1516) to programmatically
      initiate it.

      https://attack.mitre.org/techniques/T1616'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1617
    ref_id: T1617
    name: Hooking
    description: 'Adversaries may utilize hooking to hide the presence of artifacts
      associated with their behaviors to evade detection. Hooking can be used to modify
      return values or data structures of system APIs and function calls. This process
      typically involves using 3rd party root frameworks, such as Xposed or Magisk,
      with either a system exploit or pre-existing root access. By including custom
      modules for root frameworks, adversaries can hook system APIs and alter the
      return value and/or system data structures to alter functionality/visibility
      of various aspects of the system.

      https://attack.mitre.org/techniques/T1617'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1623
    ref_id: T1623
    name: Command and Scripting Interpreter
    description: "Adversaries may abuse command and script interpreters to execute\
      \ commands, scripts, or binaries. These interfaces and languages provide ways\
      \ of interacting with computer systems and are a common feature across many\
      \ different platforms. Most systems come with some built-in command-line interface\
      \ and scripting capabilities, for example, Android is a UNIX-like OS and includes\
      \ a basic [Unix Shell](https://attack.mitre.org/techniques/T1623/001) that can\
      \ be accessed via the Android Debug Bridge (ADB) or Java\u2019s `Runtime` package.\n\
      \nAdversaries may abuse these technologies in various ways as a means of executing\
      \ arbitrary commands. Commands and scripts can be embedded in [Initial Access](https://attack.mitre.org/tactics/TA0027)\
      \ payloads delivered to victims as lure documents or as secondary payloads downloaded\
      \ from an existing C2. Adversaries may also execute commands through interactive\
      \ terminals/shells."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0041
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1623.001
    ref_id: T1623.001
    name: Unix Shell
    description: "Adversaries may abuse Unix shell commands and scripts for execution.\
      \ Unix shells are the underlying command prompts on Android and iOS devices.\
      \ Unix shells can control every aspect of a system, with certain commands requiring\
      \ elevated privileges that are only accessible if the device has been rooted\
      \ or jailbroken. \n\nUnix shells also support scripts that enable sequential\
      \ execution of commands as well as other typical programming operations such\
      \ as conditionals and loops. Common uses of shell scripts include long or repetitive\
      \ tasks, or the need to run the same set of commands on multiple systems. \n\
      \nAdversaries may abuse Unix shells to execute various commands or payloads.\
      \ Interactive shells may be accessed through command and control channels or\
      \ during lateral movement such as with SSH. Adversaries may also leverage shell\
      \ scripts to deliver and execute multiple commands on victims or as part of\
      \ payloads used for persistence. \n\nIf the device has been rooted or jailbroken,\
      \ adversaries may locate and invoke a superuser binary to elevate their privileges\
      \ and interact with the system as the root user. This dangerous level of permissions\
      \ allows the adversary to run special commands and modify protected system files.\n\
      https://attack.mitre.org/techniques/T1623/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1623
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0041
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1624
    ref_id: T1624
    name: Event Triggered Execution
    description: "Adversaries may establish persistence using system mechanisms that\
      \ trigger execution based on specific events. Mobile operating systems have\
      \ means to subscribe to events such as receiving an SMS message, device boot\
      \ completion, or other device activities. \n\nAdversaries may abuse these mechanisms\
      \ as a means of maintaining persistent access to a victim via automatically\
      \ and repeatedly executing malicious code. After gaining access to a victim\u2019\
      s system, adversaries may create or modify event triggers to point to malicious\
      \ content that will be executed whenever the event trigger is invoked.\nhttps://attack.mitre.org/techniques/T1624"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1624.001
    ref_id: T1624.001
    name: Broadcast Receivers
    description: "Adversaries may establish persistence using system mechanisms that\
      \ trigger execution based on specific events. Mobile operating systems have\
      \ means to subscribe to events such as receiving an SMS message, device boot\
      \ completion, or other device activities. \n\nAn intent is a message passed\
      \ between Android applications or system components. Applications can register\
      \ to receive broadcast intents at runtime, which are system-wide intents delivered\
      \ to each app when certain events happen on the device, such as network changes\
      \ or the user unlocking the screen. Malicious applications can then trigger\
      \ certain actions within the app based on which broadcast intent was received.\
      \ \n\nIn addition to Android system intents, malicious applications can register\
      \ for intents broadcasted by other applications. This allows the malware to\
      \ respond based on actions in other applications. This behavior typically indicates\
      \ a more intimate knowledge, or potentially the targeting of specific devices,\
      \ users, or applications. \n\nIn Android 8 (API level 26), broadcast intent\
      \ behavior was changed, limiting the implicit intents that applications can\
      \ register for in the manifest. In most cases, applications that register through\
      \ the manifest will no longer receive the broadcasts. Now, applications must\
      \ register context-specific broadcast receivers while the user is actively using\
      \ the app.(Citation: Android Changes to System Broadcasts)\nhttps://attack.mitre.org/techniques/T1624/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1624
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1625
    ref_id: T1625
    name: Hijack Execution Flow
    description: "Adversaries may execute their own malicious payloads by hijacking\
      \ the way operating systems run applications. Hijacking execution flow can be\
      \ for the purposes of persistence since this hijacked execution may reoccur\
      \ over time. \n\nThere are many ways an adversary may hijack the flow of execution.\
      \ A primary way is by manipulating how the operating system locates programs\
      \ to be executed. How the operating system locates libraries to be used by a\
      \ program can also be intercepted. Locations where the operating system looks\
      \ for programs or resources, such as file directories, could also be poisoned\
      \ to include malicious payloads.\nhttps://attack.mitre.org/techniques/T1625"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1004
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1625.001
    ref_id: T1625.001
    name: System Runtime API Hijacking
    description: "Adversaries may execute their own malicious payloads by hijacking\
      \ the way an operating system runs applications. Hijacking execution flow can\
      \ be for the purposes of persistence since this hijacked execution may reoccur\
      \ at later points in time. \n\n\nOn Android, adversaries may overwrite the standard\
      \ OS API library with a malicious alternative to hook into core functions to\
      \ achieve persistence. By doing this, the adversary\u2019s code will be executed\
      \ every time the overwritten API function is called by an app on the infected\
      \ device.\nhttps://attack.mitre.org/techniques/T1625/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1625
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1004
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1626
    ref_id: T1626
    name: Abuse Elevation Control Mechanism
    description: 'Adversaries may circumvent mechanisms designed to control elevated
      privileges to gain higher-level permissions. Most modern systems contain native
      elevation control mechanisms that are intended to limit privileges that a user
      can gain on a machine. Authorization has to be granted to specific users in
      order to perform tasks that are designated as higher risk. An adversary can
      use several methods to take advantage of built-in control mechanisms in order
      to escalate privileges on a system.

      https://attack.mitre.org/techniques/T1626'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0029
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack:m1013
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1626.001
    ref_id: T1626.001
    name: Device Administrator Permissions
    description: "Adversaries may abuse Android\u2019s device administration API to\
      \ obtain a higher degree of control over the device. By abusing the API, adversaries\
      \ can perform several nefarious actions, such as resetting the device\u2019\
      s password for [Endpoint Denial of Service](https://attack.mitre.org/techniques/T1642),\
      \ factory resetting the device for [File Deletion](https://attack.mitre.org/techniques/T1630/002)\
      \ and to delete any traces of the malware, disabling all the device\u2019s cameras,\
      \ or to make it more difficult to uninstall the app.\n\nDevice administrators\
      \ must be approved by the user at runtime, with a system popup showing which\
      \ actions have been requested by the app. In conjunction with other techniques,\
      \ such as [Input Injection](https://attack.mitre.org/techniques/T1516), an app\
      \ can programmatically grant itself administrator permissions without any user\
      \ input.\nhttps://attack.mitre.org/techniques/T1626/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1626
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0029
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1627
    ref_id: T1627
    name: Execution Guardrails
    description: "Adversaries may use execution guardrails to constrain execution\
      \ or actions based on adversary supplied and environment specific conditions\
      \ that are expected to be present on the target. Guardrails ensure that a payload\
      \ only executes against an intended target and reduces collateral damage from\
      \ an adversary\u2019s campaign. Values an adversary can provide about a target\
      \ system or environment to use as guardrails may include environment information\
      \ such as location.(Citation: SWB Exodus March 2019)\n\nGuardrails can be used\
      \ to prevent exposure of capabilities in environments that are not intended\
      \ to be compromised or operated within. This use of guardrails is distinct from\
      \ typical [System Checks](https://attack.mitre.org/techniques/T1633/001). While\
      \ use of [System Checks](https://attack.mitre.org/techniques/T1633/001) may\
      \ involve checking for known sandbox values and continuing with execution only\
      \ if there is no match, the use of guardrails will involve checking for an expected\
      \ target-specific value and only continuing with execution if there is such\
      \ a match.\nhttps://attack.mitre.org/techniques/T1627"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1627.001
    ref_id: T1627.001
    name: Geofencing
    description: "Adversaries may use a device\u2019s geographical location to limit\
      \ certain malicious behaviors. For example, malware operators may limit the\
      \ distribution of a second stage payload to certain geographic regions.(Citation:\
      \ Lookout eSurv)\n\n[Geofencing](https://attack.mitre.org/techniques/T1627/001)\u202F\
      is accomplished by persuading the user to grant the application permission to\
      \ access location services. The application can then collect, process, and exfiltrate\
      \ the device\u2019s location to perform location-based actions, such as ceasing\
      \ malicious behavior or showing region-specific advertisements. \n\nOne method\
      \ to accomplish\u202F[Geofencing](https://attack.mitre.org/techniques/T1627/001)\u202F\
      on Android is to use the built-in Geofencing API to automatically trigger certain\
      \ behaviors when the device enters or exits a specified radius around a geographical\
      \ location. Similar to  other\u202F[Geofencing](https://attack.mitre.org/techniques/T1627/001)\
      \ methods, this requires that the user has granted the `ACCESS_FINE_LOCATION`\
      \ and `ACCESS_BACKGROUND_LOCATION` permissions. The latter is only required\
      \ if the application targets Android 10 (API level 29) or higher. However, Android\
      \ 11 introduced additional permission controls that may restrict background\
      \ location collection based on user permission choices at runtime. These additional\
      \ controls include \"Allow only while using the app\", which will effectively\
      \ prohibit background location collection.  \n\nSimilarly, on iOS, developers\
      \ can use built-in APIs to setup and execute geofencing. Depending on the use\
      \ case, the app will either need to call\u202F`requestWhenInUseAuthorization()`\u202F\
      or\u202F`requestAlwaysAuthorization()`, depending on when access to the location\
      \ services is required. Similar to Android, users also have the option to limit\
      \ when the application can access the device\u2019s location, including one-time\
      \ use and only when the application is running in the foreground.  \n\n[Geofencing](https://attack.mitre.org/techniques/T1627/001)\u202F\
      can be used to prevent exposure of capabilities in environments that are not\
      \ intended to be compromised or operated within. For example, location data\
      \ could be used to limit malware spread and/or capabilities, which could also\
      \ potentially evade application analysis environments (ex: malware analysis\
      \ outside of the target geographic area). Other malicious usages could include\
      \ showing language-specific input prompts and/or advertisements."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1627
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1628
    ref_id: T1628
    name: Hide Artifacts
    description: "Adversaries may attempt to hide artifacts associated with their\
      \ behaviors to evade detection. Mobile operating systems have features and developer\
      \ APIs to hide various artifacts, such as an application\u2019s launcher icon.\
      \ These APIs have legitimate usages, such as hiding an icon to avoid application\
      \ drawer clutter when an application does not have a usable interface. Adversaries\
      \ may abuse these features and APIs to hide artifacts from the user to evade\
      \ detection.\nhttps://attack.mitre.org/techniques/T1628"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1628.001
    ref_id: T1628.001
    name: Suppress Application Icon
    description: "A malicious application could suppress its icon from being displayed\
      \ to the user in the application launcher. This hides the fact that it is installed,\
      \ and can make it more difficult for the user to uninstall the application.\
      \ Hiding the application's icon programmatically does not require any special\
      \ permissions. \n\nThis behavior has been seen in the BankBot/Spy Banker family\
      \ of malware.(Citation: android-trojan-steals-paypal-2fa)(Citation: sunny-stolen-credentials)(Citation:\
      \ bankbot-spybanker) \n\nBeginning in Android 10, changes were introduced to\
      \ inhibit malicious applications\u2019 ability to hide their icon. If an app\
      \ is a system app, requests no permissions, or does not have a launcher activity,\
      \ the application\u2019s icon will be fully hidden. Further, if the device is\
      \ fully managed or the application is in a work profile, the icon will be fully\
      \ hidden. Otherwise, a synthesized activity is shown, which is a launcher icon\
      \ that represents the app\u2019s details page in the system settings. If the\
      \ user clicks the synthesized activity in the launcher, they are taken to the\
      \ application\u2019s details page in the system settings.(Citation: Android\
      \ 10 Limitations to Hiding App Icons)(Citation: LauncherApps getActivityList)\n\
      https://attack.mitre.org/techniques/T1628/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1628
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1628.002
    ref_id: T1628.002
    name: User Evasion
    description: "Adversaries may attempt to avoid detection by hiding malicious behavior\
      \ from the user. By doing this, an adversary\u2019s modifications would most\
      \ likely remain installed on the device for longer, allowing the adversary to\
      \ continue to operate on that device. \n\nWhile there are many ways this can\
      \ be accomplished, one method is by using the device\u2019s sensors. By utilizing\
      \ the various motion sensors on a device, such as accelerometer or gyroscope,\
      \ an application could detect that the device is being interacted with. That\
      \ way, the application could continue to run while the device is not in use\
      \ but cease operating while the user is using the device, hiding anything that\
      \ would indicate malicious activity was ongoing. Accessing the sensors in this\
      \ way does not require any permissions from the user, so it would be completely\
      \ transparent.\nhttps://attack.mitre.org/techniques/T1628/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1628
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1628.003
    ref_id: T1628.003
    name: Conceal Multimedia Files
    description: "Adversaries may attempt to hide multimedia files from the user.\
      \ By doing so, adversaries may conceal captured files, such as pictures, videos\
      \ and/or screenshots, then later exfiltrate those files.  \n\nSpecific to Android\
      \ devices, if the `.nomedia` file is present in a folder, multimedia files in\
      \ that folder will not be visible to the user in the Gallery application. Additionally,\
      \ other applications are asked not to scan the folder with the `.nomedia` file,\
      \ effectively making the folder appear invisible to the user.  \n\nThis technique\
      \ is often used by stalkerware and spyware applications.\nhttps://attack.mitre.org/techniques/T1628/003"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1628
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1629
    ref_id: T1629
    name: Impair Defenses
    description: 'Adversaries may maliciously modify components of a victim environment
      in order to hinder or disable defensive mechanisms. This not only involves impairing
      preventative defenses, such as anti-virus, but also detection capabilities that
      defenders can use to audit activity and identify malicious behavior. This may
      span both native defenses as well as supplemental capabilities installed by
      users or mobile endpoint administrators.

      https://attack.mitre.org/techniques/T1629'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1004
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1629.001
    ref_id: T1629.001
    name: Prevent Application Removal
    description: "Adversaries may abuse the Android device administration API to prevent\
      \ the user from uninstalling a target application. In earlier versions of Android,\
      \ device administrator applications needed their administration capabilities\
      \ explicitly deactivated by the user before the application could be uninstalled.\
      \ This was later updated so the user could deactivate and uninstall the administrator\
      \ application in one step.\n\nAdversaries may also abuse the device accessibility\
      \ APIs to prevent removal. This set of APIs allows the application to perform\
      \ certain actions on behalf of the user and programmatically determine what\
      \ is being shown on the screen. The malicious application could monitor the\
      \ device screen for certain modals (e.g., the confirmation modal to uninstall\
      \ an application) and inject screen input or a back button tap to close the\
      \ modal. For example, Android's `performGlobalAction(int)` API could be utilized\
      \ to prevent the user from removing the malicious application from the device\
      \ after installation. If the user wants to uninstall the malicious application,\
      \ two cases may occur, both preventing the user from removing the application.\n\
      \n* Case 1: If the integer argument passed to the API call is `2` or `GLOBAL_ACTION_HOME`,\
      \ the malicious application may direct the user to the home screen from settings\
      \ screen \n\n* Case 2: If the integer argument passed to the API call is `1`\
      \ or `GLOBAL_ACTION_BACK`, the malicious application may emulate the back press\
      \ event\nhttps://attack.mitre.org/techniques/T1629/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1629
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1629.002
    ref_id: T1629.002
    name: Device Lockout
    description: "An adversary may seek to inhibit user interaction by locking the\
      \ legitimate user out of the device. This is typically accomplished by requesting\
      \ device administrator permissions and then locking the screen using `DevicePolicyManager.lockNow()`.\
      \ Other novel techniques for locking the user out of the device have been observed,\
      \ such as showing a persistent overlay, using carefully crafted \u201Ccall\u201D\
      \ notification screens, and locking HTML pages in the foreground. These techniques\
      \ can be very difficult to get around, and typically require booting the device\
      \ into safe mode to uninstall the malware.(Citation: Microsoft MalLockerB)(Citation:\
      \ Talos GPlayed)(Citation: securelist rotexy 2018)\n\nPrior to Android 7, device\
      \ administrators were able to reset the device lock passcode to prevent the\
      \ user from unlocking the device. The release of Android 7 introduced updates\
      \ that only allow device or profile owners (e.g. MDMs) to reset the device\u2019\
      s passcode.(Citation: Android resetPassword)\nhttps://attack.mitre.org/techniques/T1629/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1629
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1629.003
    ref_id: T1629.003
    name: Disable or Modify Tools
    description: 'Adversaries may disable security tools to avoid potential detection
      of their tools and activities. This can take the form of disabling security
      software, modifying SELinux configuration, or other methods to interfere with
      security tools scanning or reporting information. This is typically done by
      abusing device administrator permissions or using system exploits to gain root
      access to the device to modify protected system files.

      https://attack.mitre.org/techniques/T1629/003'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1629
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1004
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1630
    ref_id: T1630
    name: Indicator Removal on Host
    description: 'Adversaries may delete, alter, or hide generated artifacts on a
      device, including files, jailbreak status, or the malicious application itself.
      These actions may interfere with event collection, reporting, or other notifications
      used to detect intrusion activity. This may compromise the integrity of mobile
      security solutions by causing notable events or information to go unreported.

      https://attack.mitre.org/techniques/T1630'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1630.001
    ref_id: T1630.001
    name: Uninstall Malicious Application
    description: "Adversaries may include functionality in malware that uninstalls\
      \ the malicious application from the device. This can be achieved by: \n \n\
      * Abusing device owner permissions to perform silent uninstallation using device\
      \ owner API calls. \n* Abusing root permissions to delete files from the filesystem.\
      \ \n* Abusing the accessibility service. This requires sending an intent to\
      \ the system to request uninstallation, and then abusing the accessibility service\
      \ to click the proper places on the screen to confirm uninstallation.\nhttps://attack.mitre.org/techniques/T1630/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1630
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1630.002
    ref_id: T1630.002
    name: File Deletion
    description: "Adversaries may wipe a device or delete individual files in order\
      \ to manipulate external outcomes or hide activity. An application must have\
      \ administrator access to fully wipe the device, while individual files may\
      \ not require special permissions to delete depending on their storage location.(Citation:\
      \ Android DevicePolicyManager 2019) \n\nStored data could include a variety\
      \ of file formats, such as Office files, databases, stored emails, and custom\
      \ file formats. The impact file deletion will have depends on the type of data\
      \ as well as the goals and objectives of the adversary, but can include deleting\
      \ update files to evade detection or deleting attacker-specified files for impact.\n\
      https://attack.mitre.org/techniques/T1630/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
