  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1461
    ref_id: T1461
    name: Lockscreen Bypass
    description: "An adversary with physical access to a mobile device may seek to\
      \ bypass the device\u2019s lockscreen. Several methods exist to accomplish this,\
      \ including:\n\n* Biometric spoofing: If biometric authentication is used, an\
      \ adversary could attempt to spoof a mobile device\u2019s biometric authentication\
      \ mechanism. Both iOS and Android partly mitigate this attack by requiring the\
      \ device\u2019s passcode rather than biometrics to unlock the device after every\
      \ device restart, and after a set or random amount of time.(Citation: SRLabs-Fingerprint)(Citation:\
      \ TheSun-FaceID)\n* Unlock code bypass: An adversary could attempt to brute-force\
      \ or otherwise guess the lockscreen passcode (typically a PIN or password),\
      \ including physically observing (\u201Cshoulder surfing\u201D) the device owner\u2019\
      s use of the lockscreen passcode. Mobile OS vendors partly mitigate this by\
      \ implementing incremental backoff timers after a set number of failed unlock\
      \ attempts, as well as a configurable full device wipe after several failed\
      \ unlock attempts.\n* Vulnerability exploit: Techniques have been periodically\
      \ demonstrated that exploit mobile devices to bypass the lockscreen. The vulnerabilities\
      \ are generally patched by the device or OS vendor once disclosed.(Citation:\
      \ Wired-AndroidBypass)(Citation: Kaspersky-iOSBypass)\nhttps://attack.mitre.org/techniques/T1461"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    groups:
    - android
