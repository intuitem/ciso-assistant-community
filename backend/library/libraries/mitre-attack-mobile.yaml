  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1404
    ref_id: T1404
    name: Exploitation for Privilege Escalation
    description: "Adversaries may exploit software vulnerabilities in order to elevate\
      \ privileges. Exploitation of a software vulnerability occurs when an adversary\
      \ takes advantage of a programming error in an application, service, within\
      \ the operating system software, or kernel itself to execute adversary-controlled\
      \ code. Security constructions, such as permission levels, will often hinder\
      \ access to information and use of certain techniques. Adversaries will likely\
      \ need to perform privilege escalation to include use of software exploitation\
      \ to circumvent those restrictions. \n\nWhen initially gaining access to a device,\
      \ an adversary may be operating within a lower privileged process which will\
      \ prevent them from accessing certain resources on the system. Vulnerabilities\
      \ may exist, usually in operating system components and applications running\
      \ at higher permissions, that can be exploited to gain higher levels of access\
      \ on the system. This could enable someone to move from unprivileged or user-\
      \ level permission to root permissions depending on the component that is vulnerable.\n\
      https://attack.mitre.org/techniques/T1404"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0029
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1010
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1406
    ref_id: T1406
    name: Obfuscated Files or Information
    description: "Adversaries may attempt to make a payload or file difficult to discover\
      \ or analyze by encrypting, encoding, or otherwise obfuscating its contents\
      \ on the device or in transit. This is common behavior that can be used across\
      \ different platforms and the network to evade defenses. \n \nPayloads may be\
      \ compressed, archived, or encrypted in order to avoid detection. These payloads\
      \ may be used during Initial Access or later to mitigate detection. Portions\
      \ of files can also be encoded to hide the plaintext strings that would otherwise\
      \ help defenders with discovery. Payloads may also be split into separate, seemingly\
      \ benign files that only reveal malicious functionality when reassembled.(Citation:\
      \ Microsoft MalLockerB)\nhttps://attack.mitre.org/techniques/T1406"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1406.001
    ref_id: T1406.001
    name: Steganography
    description: 'Adversaries may use steganography techniques in order to prevent
      the detection of hidden information. Steganographic techniques can be used to
      hide data in digital media such as images, audio tracks, video clips, or text
      files.

      https://attack.mitre.org/techniques/T1406/001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1406
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1406.002
    ref_id: T1406.002
    name: Software Packing
    description: "Adversaries may perform software packing to conceal their code.\
      \ Software packing is a method of compressing or encrypting an executable. Packing\
      \ an executable changes the file signature in an attempt to avoid signature-based\
      \ detection. Most decompression techniques decompress the executable code in\
      \ memory. \n\nUtilities used to perform software packing are called packers.\
      \ An example packer is FTT. A more comprehensive list of known packers is available,\
      \ but adversaries may create their own packing techniques that do not leave\
      \ the same artifacts as well-known packers to evade defenses.\nhttps://attack.mitre.org/techniques/T1406/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1406
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1407
    ref_id: T1407
    name: Download New Code at Runtime
    description: "Adversaries may download and execute dynamic code not included in\
      \ the original application package after installation. This technique is primarily\
      \ used to evade static analysis checks and pre-publication scans in official\
      \ app stores. In some cases, more advanced dynamic or behavioral analysis techniques\
      \ could detect this behavior. However, in conjunction with [Execution Guardrails](https://attack.mitre.org/techniques/T1627)\
      \ techniques, detecting malicious code downloaded after installation could be\
      \ difficult.\n\nOn Android, dynamic code could include native code, Dalvik code,\
      \ or JavaScript code that utilizes Android WebView\u2019s `JavascriptInterface`\
      \ capability. \n\nOn iOS, dynamic code could be downloaded and executed through\
      \ 3rd party libraries such as JSPatch. (Citation: FireEye-JSPatch)\nhttps://attack.mitre.org/techniques/T1407"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1409
    ref_id: T1409
    name: Stored Application Data
    description: "Adversaries may try to access and collect application data resident\
      \ on the device. Adversaries often target popular applications, such as Facebook,\
      \ WeChat, and Gmail.(Citation: SWB Exodus March 2019) \n\n \n\nDue to mobile\
      \ OS sandboxing, this technique is only possible in three scenarios: \n\n \n\
      \n* An application stores files in unprotected external storage \n* An application\
      \ stores files in its internal storage directory with insecure permissions (e.g.\
      \ 777) \n* The adversary gains root permissions on the device\nhttps://attack.mitre.org/techniques/T1409"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1414
    ref_id: T1414
    name: Clipboard Data
    description: "Adversaries may abuse clipboard manager APIs to obtain sensitive\
      \ information copied to the device clipboard. For example, passwords being copied\
      \ and pasted from a password manager application could be captured by a malicious\
      \ application installed on the device.(Citation: Fahl-Clipboard) \n\n \n\nOn\
      \ Android, applications can use the `ClipboardManager.OnPrimaryClipChangedListener()`\
      \ API to register as a listener and monitor the clipboard for changes. However,\
      \ starting in Android 10, this can only be used if the application is in the\
      \ foreground, or is set as the device\u2019s default input method editor (IME).(Citation:\
      \ Github Capture Clipboard 2019)(Citation: Android 10 Privacy Changes) \n\n\
      \ \n\nOn iOS, this can be accomplished by accessing the `UIPasteboard.general.string`\
      \ field. However, starting in iOS 14, upon accessing the clipboard, the user\
      \ will be shown a system notification if the accessed text originated in a different\
      \ application. For example, if the user copies the text of an iMessage from\
      \ the Messages application, the notification will read \u201Capplication_name\
      \ has pasted from Messages\u201D when the text was pasted in a different application.(Citation:\
      \ UIPPasteboard)\nhttps://attack.mitre.org/techniques/T1414"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1417
    ref_id: T1417
    name: Input Capture
    description: Adversaries may use methods of capturing user input to obtain credentials
      or collect information. During normal device usage, users often provide credentials
      to various locations, such as login pages/portals or system dialog boxes. Input
      capture mechanisms may be transparent to the user (e.g. [Keylogging](https://attack.mitre.org/techniques/T1417/001))
      or rely on deceiving the user into providing input into what they believe to
      be a genuine application prompt (e.g. [GUI Input Capture](https://attack.mitre.org/techniques/T1417/002)).
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1417.001
    ref_id: T1417.001
    name: Keylogging
    description: "Adversaries may log user keystrokes to intercept credentials or\
      \ other information from the user as the user types them.\n\nSome methods of\
      \ keylogging include:\n\n* Masquerading as a legitimate third-party keyboard\
      \ to record user keystrokes.(Citation: Zeltser-Keyboard) On both Android and\
      \ iOS, users must explicitly authorize the use of third-party keyboard apps.\
      \ Users should be advised to use extreme caution before granting this authorization\
      \ when it is requested.\n* Abusing accessibility features. On Android, adversaries\
      \ may abuse accessibility features to record keystrokes by registering an `AccessibilityService`\
      \ class, overriding the `onAccessibilityEvent` method, and listening for the\
      \ `AccessibilityEvent.TYPE_VIEW_TEXT_CHANGED` event type. The event object passed\
      \ into the function will contain the data that the user typed. \n*Additional\
      \ methods of keylogging may be possible if root access is available.\nhttps://attack.mitre.org/techniques/T1417/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1417
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1417.002
    ref_id: T1417.002
    name: GUI Input Capture
    description: "Adversaries may mimic common operating system GUI components to\
      \ prompt users for sensitive information with a seemingly legitimate prompt.\
      \ The operating system and installed applications often have legitimate needs\
      \ to prompt the user for sensitive information such as account credentials,\
      \ bank account information, or Personally Identifiable Information (PII). Compared\
      \ to traditional PCs, the constrained display size of mobile devices may impair\
      \ the ability to provide users with contextual information, making users more\
      \ susceptible to this technique\u2019s use.(Citation: Felt-PhishingOnMobileDevices)\n\
      \nThere are several approaches adversaries may use to mimic this functionality.\
      \ Adversaries may impersonate the identity of a legitimate application (e.g.\
      \ use the same application name and/or icon) and, when installed on the device,\
      \ may prompt the user for sensitive information.(Citation: eset-finance) Adversaries\
      \ may also send fake device notifications to the user that may trigger the display\
      \ of an input prompt when clicked.(Citation: Group IB Gustuff Mar 2019) \n\n\
      Additionally, adversaries may display a prompt on top of a running, legitimate\
      \ application to trick users into entering sensitive information into a malicious\
      \ application rather than the legitimate application. Typically, adversaries\
      \ need to know when the targeted application and the individual activity within\
      \ the targeted application is running in the foreground to display the prompt\
      \ at the proper time. Adversaries can abuse Android\u2019s accessibility features\
      \ to determine which application is currently in the foreground.(Citation: ThreatFabric\
      \ Cerberus) Two known approaches to displaying a prompt include:\n\n* Adversaries\
      \ start a new activity on top of a running legitimate application.(Citation:\
      \ Felt-PhishingOnMobileDevices)(Citation: Hassell-ExploitingAndroid) Android\
      \ 10 places new restrictions on the ability for an application to start a new\
      \ activity on top of another application, which may make it more difficult for\
      \ adversaries to utilize this technique.(Citation: Android Background)\n* Adversaries\
      \ create an application overlay window on top of a running legitimate application.\
      \ Applications must hold the `SYSTEM_ALERT_WINDOW` permission to create overlay\
      \ windows. This permission is handled differently than typical Android permissions\
      \ and, at least under certain conditions, is automatically granted to applications\
      \ installed from the Google Play Store.(Citation: Cloak and Dagger)(Citation:\
      \ NowSecure Android Overlay)(Citation: Skycure-Accessibility) The `SYSTEM_ALERT_WINDOW`\
      \ permission and its associated ability to create application overlay windows\
      \ are expected to be deprecated in a future release of Android in favor of a\
      \ new API.(Citation: XDA Bubbles)\nhttps://attack.mitre.org/techniques/T1417/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1417
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
