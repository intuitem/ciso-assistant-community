    reference_controls:
    - urn:intuitem:risk:function:mitre-attack:m1013
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1474.002
    ref_id: T1474.002
    name: Compromise Hardware Supply Chain
    description: 'Adversaries may manipulate hardware components in products prior
      to receipt by a final consumer for the purpose of data or system compromise.
      By modifying hardware or firmware in the supply chain, adversaries can insert
      a backdoor into consumer networks that may be difficult to detect and give the
      adversary a high degree of control over the system.

      https://attack.mitre.org/techniques/T1474/002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1474
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
