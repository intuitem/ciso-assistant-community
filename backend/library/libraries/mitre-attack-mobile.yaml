    - urn:intuitem:risk:function:mitre-attack-mobile:m1004
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1481
    ref_id: T1481
    name: Web Service
    description: "Adversaries may use an existing, legitimate external Web service\
      \ as a means for relaying data to/from a compromised system. Popular websites\
      \ and social media, acting as a mechanism for C2, may give a significant amount\
      \ of cover. This is due to the likelihood that hosts within a network are already\
      \ communicating with them prior to a compromise. Using common services, such\
      \ as those offered by Google or Twitter, makes it easier for adversaries to\
      \ hide in expected noise. Web service providers commonly use SSL/TLS encryption,\
      \ giving adversaries an added level of protection. \n\n \n\nUse of Web services\
      \ may also protect back-end C2 infrastructure from discovery through malware\
      \ binary analysis, or enable operational resiliency (since this infrastructure\
      \ may be dynamically changed).\nhttps://attack.mitre.org/techniques/T1481"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1481.001
    ref_id: T1481.001
    name: Dead Drop Resolver
    description: "Adversaries may use an existing, legitimate external Web service\
      \ to host information that points to additional command and control (C2) infrastructure.\
      \ Adversaries may post content, known as a dead drop resolver, on Web services\
      \ with embedded (and often obfuscated/encoded) domains or IP addresses. Once\
      \ infected, victims will reach out to and be redirected by these resolvers.\
      \ \n\n \n\nPopular websites and social media, acting as a mechanism for C2,\
      \ may give a significant amount of cover. This is due to the likelihood that\
      \ hosts within a network are already communicating with them prior to a compromise.\
      \ Using common services, such as those offered by Google or Twitter, makes it\
      \ easier for adversaries to hide in expected noise. Web service providers commonly\
      \ use SSL/TLS encryption, giving adversaries an added level of protection. \n\
      \n \n\nUse of a dead drop resolver may also protect back-end C2 infrastructure\
      \ from discovery through malware binary analysis, or enable operational resiliency\
      \ (since this infrastructure may be dynamically changed).\nhttps://attack.mitre.org/techniques/T1481/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1481
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1481.002
    ref_id: T1481.002
    name: Bidirectional Communication
    description: "Adversaries may use an existing, legitimate external Web service\
      \ channel as a means for sending commands to and receiving output from a compromised\
      \ system. Compromised systems may leverage popular websites and social media\
      \ to host command and control (C2) instructions. Those infected systems can\
      \ then send the output from those commands back over that Web service channel.\
      \ The return traffic may occur in a variety of ways, depending on the Web service\
      \ being utilized. For example, the return traffic may take the form of the compromised\
      \ system posting a comment on a forum, issuing a pull request to development\
      \ project, updating a document hosted on a Web service, or by sending a Tweet.\
      \ \n\n \n\nPopular websites and social media, acting as a mechanism for C2,\
      \ may give a significant amount of cover. This is due to the likelihood that\
      \ hosts within a network are already communicating with them prior to a compromise.\
      \ Using common services, such as those offered by Google or Twitter, makes it\
      \ easier for adversaries to hide in expected noise. Web service providers commonly\
      \ use SSL/TLS encryption, giving adversaries an added level of protection.\n\
      https://attack.mitre.org/techniques/T1481/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1481
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1481.003
    ref_id: T1481.003
    name: One-Way Communication
    description: "Adversaries may use an existing, legitimate external Web service\
      \ channel as a means for sending commands to a compromised system without receiving\
      \ return output. Compromised systems may leverage popular websites and social\
      \ media to host command and control (C2) instructions. Those infected systems\
      \ may opt to send the output from those commands back over a different C2 channel,\
      \ including to another distinct Web service. Alternatively, compromised systems\
      \ may return no output at all in cases where adversaries want to send instructions\
      \ to systems and do not want a response. \n\n \n\nPopular websites and social\
      \ media, acting as a mechanism for C2, may give a significant amount of cover.\
      \ This is due to the likelihood that hosts within a network are already communicating\
      \ with them prior to a compromise. Using common services, such as those offered\
      \ by Google or Twitter, makes it easier for adversaries to hide in expected\
      \ noise. Web service providers commonly use SSL/TLS encryption, giving adversaries\
      \ an added level of protection.\nhttps://attack.mitre.org/techniques/T1481/003"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1481
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1509
    ref_id: T1509
    name: Non-Standard Port
    description: 'Adversaries may generate network traffic using a protocol and port
      pairing that are typically not associated. For example, HTTPS over port 8088
      or port 587 as opposed to the traditional port 443. Adversaries may make changes
      to the standard port used by a protocol to bypass filtering or muddle analysis/parsing
      of network data.

      https://attack.mitre.org/techniques/T1509'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1512
    ref_id: T1512
    name: Video Capture
    description: "An adversary can leverage a device\u2019s cameras to gather information\
      \ by capturing video recordings. Images may also be captured, potentially in\
      \ specified intervals, in lieu of video files.  \n\n \n\nMalware or scripts\
      \ may interact with the device cameras through an available API provided by\
      \ the operating system. Video or image files may be written to disk and exfiltrated\
      \ later. This technique differs from [Screen Capture](https://attack.mitre.org/techniques/T1513)\
      \ due to use of the device\u2019s cameras for video recording rather than capturing\
      \ the victim\u2019s screen. \n\n \n\nIn Android, an application must hold the\
      \ `android.permission.CAMERA` permission to access the cameras. In iOS, applications\
      \ must include the `NSCameraUsageDescription` key in the `Info.plist` file.\
      \ In both cases, the user must grant permission to the requesting application\
      \ to use the camera. If the device has been rooted or jailbroken, an adversary\
      \ may be able to access the camera without knowledge of the user.\nhttps://attack.mitre.org/techniques/T1512"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1513
    ref_id: T1513
    name: Screen Capture
    description: 'Adversaries may use screen capture to collect additional information
      about a target device, such as applications running in the foreground, user
      data, credentials, or other sensitive information. Applications running in the
      background can capture screenshots or videos of another application running
      in the foreground by using the Android `MediaProjectionManager` (generally requires
      the device user to grant consent).(Citation: Fortinet screencap July 2019)(Citation:
      Android ScreenCap1 2019) Background applications can also use Android accessibility
      services to capture screen contents being displayed by a foreground application.(Citation:
      Lookout-Monokle) An adversary with root access or Android Debug Bridge (adb)
      access could call the Android `screencap` or `screenrecord` commands.(Citation:
      Android ScreenCap2 2019)(Citation: Trend Micro ScreenCap July 2015)

      https://attack.mitre.org/techniques/T1513'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
