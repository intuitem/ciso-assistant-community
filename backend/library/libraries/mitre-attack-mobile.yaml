  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1437
    ref_id: T1437
    name: Application Layer Protocol
    description: "Adversaries may communicate using application layer protocols to\
      \ avoid detection/network filtering by blending in with existing traffic. Commands\
      \ to the mobile device, and often the results of those commands, will be embedded\
      \ within the protocol traffic between the mobile device and server. \n\nAdversaries\
      \ may utilize many different protocols, including those used for web browsing,\
      \ transferring files, electronic mail, or DNS.\nhttps://attack.mitre.org/techniques/T1437"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1437.001
    ref_id: T1437.001
    name: Web Protocols
    description: "Adversaries may communicate using application layer protocols associated\
      \ with web protocols traffic to avoid detection/network filtering by blending\
      \ in with existing traffic. Commands to remote mobile devices, and often the\
      \ results of those commands, will be embedded within the protocol traffic between\
      \ the mobile client and server. \n\nWeb protocols such as HTTP and HTTPS are\
      \ used for web traffic as well as well as notification services native to mobile\
      \ messaging services such as Google Cloud Messaging (GCM) and newly, Firebase\
      \ Cloud Messaging (FCM), (GCM/FCM: two-way communication) and Apple Push Notification\
      \ Service (APNS; one-way server-to-device).  Such notification services leverage\
      \ HTTP/S via the respective API and are commonly abused on Android and iOS respectively\
      \ in order blend in with routine device traffic making it difficult for enterprises\
      \ to inspect.\nhttps://attack.mitre.org/techniques/T1437/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1437
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1451
    ref_id: T1451
    name: SIM Card Swap
    description: "Adversaries may gain access to mobile devices through transfers\
      \ or swaps from victims\u2019 phone numbers to adversary-controlled SIM cards\
      \ and mobile devices.(Citation: ATT SIM Swap Scams)(Citation: Verizon SIM Swapping)\
      \ \n\nThe typical process is as follows:  \n\n1. Adversaries will first gather\
      \ information about victims through [Phishing](https://attack.mitre.org/techniques/T1660),\
      \ social engineering, data breaches, or other avenues. \n2. Adversaries will\
      \ then impersonate victims as they contact mobile carriers to request for the\
      \ SIM swaps. For example, adversaries would provide victims\u2019 name and address\
      \ to mobile carriers; once authenticated, adversaries would request for victims\u2019\
      \ phone numbers to be transferred to adversary-controlled SIM cards.  \n3. Once\
      \ completed, victims will lose mobile data, such as text messages and phone\
      \ calls, on their mobile devices. In turn, adversaries will receive mobile data\
      \ that was intended for the victims.  \n\nAdversaries may use the intercepted\
      \ SMS messages to log into online accounts that use SMS-based authentication.\
      \ Specifically, adversaries may use SMS-based authentication to log into banking\
      \ and/or cryptocurrency accounts, then transfer funds to adversary-controlled\
      \ wallets.\nhttps://attack.mitre.org/techniques/T1451"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1453
    ref_id: T1453
    name: Abuse Accessibility Features
    description: "Adversaries may abuse accessibility features in Android devices\
      \ to steal sensitive data and to spread malware to other devices. Accessibility\
      \ features in Android are designed to assist users with disabilities, performing\
      \ a variety of tasks, such as using Action Blocks to control lightbulbs, and\
      \ changing the device\u2019s user interface, such as changing the font size\
      \ and adjusting contract or colors.(Citation: Google_AndroidAcsOverview) \n\n\
      One example of how adversaries abuse accessibility features is overlaying an\
      \ HTML object mimicking a legitimate login screen. The user types their credentials\
      \ in the overlay HTML object, which is then sent to the adversaries.(Citation:\
      \ SahinSRLabs_FluBot_Dec2021)  \n\nAnother example is a malicious accessibility\
      \ feature acting as a keylogger. The keylogger monitors changes on the EditText\
      \ fields and sends it to the adversaries.(Citation: SahinSRLabs_FluBot_Dec2021)\
      \ This method of attack is also described in [Keylogging](https://attack.mitre.org/techniques/T1417/001);\
      \ whereas [Abuse Accessibility Features](https://attack.mitre.org/techniques/T1453)\
      \ captures the overall abuse of accessibility features."
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1456
    ref_id: T1456
    name: Drive-By Compromise
    description: "Adversaries may gain access to a system through a user visiting\
      \ a website over the normal course of browsing. With this technique, the user's\
      \ web browser is typically targeted for exploitation, but adversaries may also\
      \ use compromised websites for non-exploitation behavior such as acquiring an\
      \ [Application Access Token](https://attack.mitre.org/techniques/T1550/001).\n\
      \nMultiple ways of delivering exploit code to a browser exist, including:\n\n\
      * A legitimate website is compromised where adversaries have injected some form\
      \ of malicious code such as JavaScript, iFrames, and cross-site scripting.\n\
      * Malicious ads are paid for and served through legitimate ad providers.\n*\
      \ Built-in web application interfaces are leveraged for the insertion of any\
      \ other kind of object that can be used to display web content or contain a\
      \ script that executes on the visiting client (e.g. forum posts, comments, and\
      \ other user controllable web content).\n\nOften the website used by an adversary\
      \ is one visited by a specific community, such as government, a particular industry,\
      \ or region, where the goal is to compromise a specific user or set of users\
      \ based on a shared interest. This kind of targeted attack is referred to a\
      \ strategic web compromise or watering hole attack. There are several known\
      \ examples of this occurring.(Citation: Lookout-StealthMango)\n\nTypical drive-by\
      \ compromise process:\n\n1. A user visits a website that is used to host the\
      \ adversary controlled content.\n2. Scripts automatically execute, typically\
      \ searching versions of the browser and plugins for a potentially vulnerable\
      \ version. \n    * The user may be required to assist in this process by enabling\
      \ scripting or active website components and ignoring warning dialog boxes.\n\
      3. Upon finding a vulnerable version, exploit code is delivered to the browser.\n\
      4. If exploitation is successful, then it will give the adversary code execution\
      \ on the user's system unless other protections are in place.\n    * In some\
      \ cases a second visit to the website after the initial scan is required before\
      \ exploit code is delivered.\nhttps://attack.mitre.org/techniques/T1456"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1458
    ref_id: T1458
    name: Replication Through Removable Media
    description: "Adversaries may move onto devices by exploiting or copying malware\
      \ to devices connected via USB. In the case of Lateral Movement, adversaries\
      \ may utilize the physical connection of a device to a compromised or malicious\
      \ charging station or PC to bypass application store requirements and install\
      \ malicious applications directly.(Citation: Lau-Mactans) In the case of Initial\
      \ Access, adversaries may attempt to exploit the device via the connection to\
      \ gain access to data stored on the device.(Citation: Krebs-JuiceJacking) Examples\
      \ of this include: \n \n* Exploiting insecure bootloaders in a Nexus 6 or 6P\
      \ device over USB and gaining the ability to perform actions including intercepting\
      \ phone calls, intercepting network traffic, and obtaining the device physical\
      \ location.(Citation: IBM-NexusUSB) \n* Exploiting weakly-enforced security\
      \ boundaries in Android devices such as the Google Pixel 2 over USB.(Citation:\
      \ GoogleProjectZero-OATmeal) \n* Products from Cellebrite and Grayshift purportedly\
      \ that can exploit some iOS devices using physical access to the data port to\
      \ unlock the passcode.(Citation: Computerworld-iPhoneCracking)\nhttps://attack.mitre.org/techniques/T1458"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0033
