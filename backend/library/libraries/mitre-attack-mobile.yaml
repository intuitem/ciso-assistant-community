    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1464
    ref_id: T1464
    name: Network Denial of Service
    description: "Adversaries may perform Network Denial of Service (DoS) attacks\
      \ to degrade or block the availability of targeted resources to users. Network\
      \ DoS can be performed by exhausting the network bandwidth that services rely\
      \ on, or by jamming the signal going to or coming from devices. \n\nA Network\
      \ DoS will occur when an adversary is able to jam radio signals (e.g. Wi-Fi,\
      \ cellular, GPS) around a device to prevent it from communicating. For example,\
      \ to jam cellular signal, an adversary may use a handheld signal jammer, which\
      \ jam devices within the jammer\u2019s operational range.(Citation: NIST-SP800187)\
      \ \n\nUsage of cellular jamming has been documented in several arrests reported\
      \ in the news.(Citation: CNET-Celljammer)(Citation: NYTimes-Celljam)(Citation:\
      \ Digitaltrends-Celljam)(Citation: Arstechnica-Celljam)\nhttps://attack.mitre.org/techniques/T1464"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1471
    ref_id: T1471
    name: Data Encrypted for Impact
    description: 'An adversary may encrypt files stored on a mobile device to prevent
      the user from accessing them. This may be done in order to extract monetary
      compensation from a victim in exchange for decryption or a decryption key (ransomware)
      or to render data permanently inaccessible in cases where the key is not saved
      or transmitted.

      https://attack.mitre.org/techniques/T1471'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1474
    ref_id: T1474
    name: Supply Chain Compromise
    description: 'Adversaries may manipulate products or product delivery mechanisms
      prior to receipt by a final consumer for the purpose of data or system compromise.


      Supply chain compromise can take place at any stage of the supply chain including:


      * Manipulation of development tools

      * Manipulation of a development environment

      * Manipulation of source code repositories (public or private)

      * Manipulation of source code in open-source dependencies

      * Manipulation of software update/distribution mechanisms

      * Compromised/infected system images

      * Replacement of legitimate software with modified versions

      * Sales of modified/counterfeit products to legitimate distributors

      * Shipment interdiction


      While supply chain compromise can impact any component of hardware or software,
      attackers looking to gain execution have often focused on malicious additions
      to legitimate software in software distribution or update channels. Targeting
      may be specific to a desired victim set or malicious software may be distributed
      to a broad set of consumers but only move on to additional tactics on specific
      victims.  Popular open source projects that are used as dependencies in many
      applications may also be targeted as a means to add malicious code to users
      of the dependency, specifically with the widespread usage of third-party advertising
      libraries.(Citation: Grace-Advertisement)(Citation: NowSecure-RemoteCode)

      https://attack.mitre.org/techniques/T1474'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack:m1013
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1474.001
    ref_id: T1474.001
    name: Compromise Software Dependencies and Development Tools
    description: 'Adversaries may manipulate products or product delivery mechanisms
      prior to receipt by a final consumer for the purpose of data or system compromise.
      Applications often depend on external software to function properly. Popular
      open source projects that are used as dependencies in many applications may
      be targeted as a means to add malicious code to users of the dependency.(Citation:
      Grace-Advertisement)

      https://attack.mitre.org/techniques/T1474/001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1474
    tactics:
