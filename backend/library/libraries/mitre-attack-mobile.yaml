  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1639
    ref_id: T1639
    name: Exfiltration Over Alternative Protocol
    description: "Adversaries may steal data by exfiltrating it over a different protocol\
      \ than that of the existing command and control channel. The data may also be\
      \ sent to an alternate network location from the main command and control server.\
      \ \n\nAlternate protocols include FTP, SMTP, HTTP/S, DNS, SMB, or any other\
      \ network protocol not being used as the main command and control channel. Different\
      \ protocol channels could also include Web services such as cloud storage. Adversaries\
      \ may opt to also encrypt and/or obfuscate these alternate channels.\nhttps://attack.mitre.org/techniques/T1639"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0036
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1639.001
    ref_id: T1639.001
    name: Exfiltration Over Unencrypted Non-C2 Protocol
    description: 'Adversaries may steal data by exfiltrating it over an un-encrypted
      network protocol other than that of the existing command and control channel.
      The data may also be sent to an alternate network location from the main command
      and control server.


      Adversaries may opt to obfuscate this data, without the use of encryption, within
      network protocols that are natively unencrypted (such as HTTP, FTP, or DNS).
      Adversaries may employ custom or publicly available encoding/compression algorithms
      (such as base64) or embed data within protocol headers and fields.

      https://attack.mitre.org/techniques/T1639/001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1639
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0036
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1640
    ref_id: T1640
    name: Account Access Removal
    description: 'Adversaries may interrupt availability of system and network resources
      by inhibiting access to accounts utilized by legitimate users. Accounts may
      be deleted, locked, or manipulated (ex: credentials changed) to remove access
      to accounts.

      https://attack.mitre.org/techniques/T1640'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1641
    ref_id: T1641
    name: Data Manipulation
    description: 'Adversaries may insert, delete, or alter data in order to manipulate
      external outcomes or hide activity. By manipulating data, adversaries may attempt
      to affect a business process, organizational understanding, or decision making.


      The type of modification and the impact it will have depends on the target application,
      process, and the goals and objectives of the adversary. For complex systems,
      an adversary would likely need special expertise and possibly access to specialized
      software related to the system, typically gained through a prolonged information
      gathering campaign, in order to have the desired impact.

      https://attack.mitre.org/techniques/T1641'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1641.001
    ref_id: T1641.001
    name: Transmitted Data Manipulation
    description: 'Adversaries may alter data en route to storage or other systems
      in order to manipulate external outcomes or hide activity. By manipulating transmitted
      data, adversaries may attempt to affect a business process, organizational understanding,
      or decision making.


      Manipulation may be possible over a network connection or between system processes
      where there is an opportunity to deploy a tool that will intercept and change
      information. The type of modification and the impact it will have depends on
      the target transmission mechanism as well as the goals and objectives of the
      adversary. For complex systems, an adversary would likely need special expertise
      and possibly access to specialized software related to the system, typically
      gained through a prolonged information gathering campaign, in order to have
      the desired impact.


      One method to achieve [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1641/001)
      is by modifying the contents of the device clipboard. Malicious applications
      may monitor clipboard activity through the `ClipboardManager.OnPrimaryClipChangedListener`
      interface on Android to determine when clipboard contents have changed. Listening
      to clipboard activity, reading clipboard contents, and modifying clipboard contents
      requires no explicit application permissions and can be performed by applications
      running in the background. However, this behavior has changed with the release
      of Android 10.


      Adversaries may use [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1641/001)
      to replace text prior to being pasted. For example, replacing a copied Bitcoin
      wallet address with a wallet address that is under adversarial control.


      [Transmitted Data Manipulation](https://attack.mitre.org/techniques/T1641/001)
      was seen within the Android/Clipper.C trojan. This sample was detected by ESET
      in an application distributed through the Google Play Store targeting cryptocurrency
      wallet numbers.(Citation: ESET Clipboard Modification February 2019)'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1641
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1642
    ref_id: T1642
    name: Endpoint Denial of Service
    description: "Adversaries may perform Endpoint Denial of Service (DoS) attacks\
      \ to degrade or block the availability of services to users.\n\nOn Android versions\
      \ prior to 7, apps can abuse Device Administrator access to reset the device\
      \ lock passcode, preventing the user from unlocking the device. After Android\
      \ 7, only device or profile owners (e.g. MDMs) can reset the device\u2019s passcode.(Citation:\
      \ Android resetPassword)\n\nOn iOS devices, this technique does not work because\
      \ mobile device management servers can only remove the screen lock passcode;\
      \ they cannot set a new passcode. However, on jailbroken devices, malware has\
      \ been discovered that can lock the user out of the device.(Citation: Xiao-KeyRaider)\n\
      https://attack.mitre.org/techniques/T1642"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1643
    ref_id: T1643
    name: Generate Traffic from Victim
    description: 'Adversaries may generate outbound traffic from devices. This is
      typically performed to manipulate external outcomes, such as to achieve carrier
      billing fraud or to manipulate app store rankings or ratings. Outbound traffic
      is typically generated as SMS messages or general web traffic, but may take
      other forms as well.


      If done via SMS messages, Android apps must hold the `SEND_SMS` permission.
      Additionally, sending an SMS message requires user consent if the recipient
      is a premium number. Applications cannot send SMS messages on iOS

      https://attack.mitre.org/techniques/T1643'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1644
    ref_id: T1644
    name: Out of Band Data
    description: "Adversaries may communicate with compromised devices using out of\
      \ band data streams. This could be done for a variety of reasons, including\
      \ evading network traffic monitoring, as a backup method of command and control,\
      \ or for data exfiltration if the device is not connected to any Internet-providing\
      \ networks (i.e. cellular or Wi-Fi). Several out of band data streams exist,\
      \ such as SMS messages, NFC, and Bluetooth. \n\n \n\nOn Android, applications\
      \ can read push notifications to capture content from SMS messages, or other\
      \ out of band data streams. This requires that the user manually grant notification\
      \ access to the application via the settings menu. However, the application\
      \ could launch an Intent to take the user directly there. \n\n \n\nOn iOS, there\
      \ is no way to programmatically read push notifications.\nhttps://attack.mitre.org/techniques/T1644"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1645
    ref_id: T1645
    name: Compromise Client Software Binary
    description: "Adversaries may modify system software binaries to establish persistent\
      \ access to devices. System software binaries are used by the underlying operating\
      \ system and users over adb or terminal emulators. \n\nAdversaries may make\
      \ modifications to client software binaries to carry out malicious tasks when\
      \ those binaries are executed. For example, malware may come with a pre-compiled\
      \ malicious binary intended to overwrite the genuine one on the device. Since\
      \ these binaries may be routinely executed by the system or user, the adversary\
      \ can leverage this for persistent access to the device.\nhttps://attack.mitre.org/techniques/T1645"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1002
    - urn:intuitem:risk:function:mitre-attack-mobile:m1003
    - urn:intuitem:risk:function:mitre-attack-mobile:m1004
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1646
    ref_id: T1646
    name: Exfiltration Over C2 Channel
    description: 'Adversaries may steal data by exfiltrating it over an existing command
      and control channel. Stolen data is encoded into the normal communications channel
      using the same protocol as command and control communications.

      https://attack.mitre.org/techniques/T1646'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
