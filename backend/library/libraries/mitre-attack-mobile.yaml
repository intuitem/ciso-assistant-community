    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1532
    ref_id: T1532
    name: Archive Collected Data
    description: "Adversaries may compress and/or encrypt data that is collected prior\
      \ to exfiltration. Compressing data can help to obfuscate its contents and minimize\
      \ use of network resources. Encryption can be used to hide information that\
      \ is being exfiltrated from detection or make exfiltration less conspicuous\
      \ upon inspection by a defender. \n\n \n\nBoth compression and encryption are\
      \ done prior to exfiltration, and can be performed using a utility, programming\
      \ library, or custom algorithm.\nhttps://attack.mitre.org/techniques/T1532"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1533
    ref_id: T1533
    name: Data from Local System
    description: "Adversaries may search local system sources, such as file systems\
      \ or local databases, to find files of interest and sensitive data prior to\
      \ exfiltration.  \n\n \n\nAccess to local system data, which includes information\
      \ stored by the operating system, often requires escalated privileges. Examples\
      \ of local system data include authentication tokens, the device keyboard cache,\
      \ Wi-Fi passwords, and photos. On Android, adversaries may also attempt to access\
      \ files from external storage which may require additional storage-related permissions.\n\
      https://attack.mitre.org/techniques/T1533"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    groups:
    - android
    - ios
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1541
    ref_id: T1541
    name: Foreground Persistence
    description: "Adversaries may abuse Android's `startForeground()` API method to\
      \ maintain continuous sensor access. Beginning in Android 9, idle applications\
      \ running in the background no longer have access to device sensors, such as\
      \ the camera, microphone, and gyroscope.(Citation: Android-SensorsOverview)\
      \ Applications can retain sensor access by running in the foreground, using\
      \ Android\u2019s `startForeground()` API method. This informs the system that\
      \ the user is actively interacting with the application, and it should not be\
      \ killed. The only requirement to start a foreground service is showing a persistent\
      \ notification to the user.(Citation: Android-ForegroundServices)\n\nMalicious\
      \ applications may abuse the `startForeground()` API method to continue running\
      \ in the foreground, while presenting a notification to the user pretending\
      \ to be a genuine application. This would allow unhindered access to the device\u2019\
      s sensors, assuming permission has been previously granted.(Citation: BlackHat\
      \ Sutter Android Foreground 2019)\n\nMalicious applications may also abuse the\
      \ `startForeground()` API to inform the Android system that the user is actively\
      \ interacting with the application, thus preventing it from being killed by\
      \ the low memory killer.(Citation: TrendMicro-Yellow Camera)\nhttps://attack.mitre.org/techniques/T1541"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    groups:
