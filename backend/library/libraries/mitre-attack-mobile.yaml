dependencies:
- urn:intuitem:risk:library:mitre-attack
objects:
  ttp_catalogs:
  - urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    ref_id: mitre-attack-mobile
    name: MITRE ATT&CK for Mobile Matrix
    description: 'Tactics and techniques of the MITRE ATT&CK for Mobile matrix, covering
      adversary behaviour against Android and iOS devices.

      https://attack.mitre.org/matrices/mobile'
    grouping_definition:
    - ref_id: android
      name: Android
      dimension: platform
    - ref_id: ios
      name: iOS
      dimension: platform
  tactics:
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    ref_id: TA0027
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Initial Access
    description: 'The adversary is trying to get into your device.


      The initial access tactic represents the vectors adversaries use to gain an
      initial foothold onto a mobile device.

      https://attack.mitre.org/tactics/TA0027'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0041
    ref_id: TA0041
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Execution
    description: 'The adversary is trying to run malicious code.


      Execution consists of techniques that result in adversary-controlled code running
      on a mobile device. Techniques that run malicious code are often paired with
      techniques from all other tactics to achieve broader goals, like exploring a
      network or stealing data.

      https://attack.mitre.org/tactics/TA0041'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0028
    ref_id: TA0028
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Persistence
    description: 'The adversary is trying to maintain their foothold.


      Persistence is any access, action, or configuration change to a mobile device
      that gives an attacker a persistent presence on the device. Attackers often
      will need to maintain access to mobile devices through interruptions such as
      device reboots and potentially even factory data resets.

      https://attack.mitre.org/tactics/TA0028'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0029
    ref_id: TA0029
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Privilege Escalation
    description: 'The adversary is trying to gain higher-level permissions.


      Privilege escalation includes techniques that allow an attacker to obtain a
      higher level of permissions on the mobile device. Attackers may enter the mobile
      device with very limited privileges and may be required to take advantage of
      a device weakness to obtain higher privileges necessary to successfully carry
      out their mission objectives.

      https://attack.mitre.org/tactics/TA0029'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    ref_id: TA0030
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Defense Evasion
    description: 'The adversary is trying to avoid being detected.


      Defense evasion consists of techniques an adversary may use to evade detection
      or avoid other defenses. Sometimes these actions are the same as or variations
      of techniques in other categories that have the added benefit of subverting
      a particular defense or mitigation. Defense evasion may be considered a set
      of attributes the adversary applies to all other phases of the operation.

      https://attack.mitre.org/tactics/TA0030'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0031
    ref_id: TA0031
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Credential Access
    description: 'The adversary is trying to steal account names, passwords, or other
      secrets that enable access to resources.


      Credential access represents techniques that can be used by adversaries to obtain
      access to or control over passwords, tokens, cryptographic keys, or other values
      that could be used by an adversary to gain unauthorized access to resources.
      Credential access allows the adversary to assume the identity of an account,
      with all of that account''s permissions on the system and network, and makes
      it harder for defenders to detect the adversary. With sufficient access within
      a network, an adversary can create accounts for later use within the environment.

      https://attack.mitre.org/tactics/TA0031'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0032
    ref_id: TA0032
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Discovery
    description: 'The adversary is trying to figure out your environment.


      Discovery consists of techniques that allow the adversary to gain knowledge
      about the characteristics of the mobile device and potentially other networked
      systems. When adversaries gain access to a new system, they must orient themselves
      to what they now have control of and what benefits operating from that system
      give to their current objective or overall goals during the intrusion. The operating
      system may provide capabilities that aid in this post-compromise information-gathering
      phase.

      https://attack.mitre.org/tactics/TA0032'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0033
    ref_id: TA0033
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Lateral Movement
    description: 'The adversary is trying to move through your environment.


      Lateral movement consists of techniques that enable an adversary to access and
      control remote systems on a network and could, but does not necessarily, include
      execution of tools on remote systems. The lateral movement techniques could
      allow an adversary to gather information from a system without needing additional
      tools, such as a remote access tool.

      https://attack.mitre.org/tactics/TA0033'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0035
    ref_id: TA0035
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Collection
    description: 'The adversary is trying to gather data of interest to their goal.


      Collection consists of techniques used to identify and gather information, such
      as sensitive files, from a target network prior to exfiltration. This category
      also covers locations on a system or network where the adversary may look for
      information to exfiltrate.

      https://attack.mitre.org/tactics/TA0035'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    ref_id: TA0037
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Command and Control
    description: "The adversary is trying to communicate with compromised devices\
      \ to control them.\n\nThe command and control tactic represents how adversaries\
      \ communicate with systems under their control within a target network. There\
      \ are many ways an adversary can establish command and control with various\
      \ levels of covertness, depending on system configuration and network topology.\
      \ Due to the wide degree of variation available to the adversary at the network\
      \ level, only the most common factors were used to describe the differences\
      \ in command and control. There are still a great many specific techniques within\
      \ the documented methods, largely due to how easy it is to define new protocols\
      \ and use existing, legitimate protocols and network services for communication.\
      \ \n\nThe resulting breakdown should help convey the concept that detecting\
      \ intrusion through command and control protocols without prior knowledge is\
      \ a difficult proposition over the long term. Adversaries' main constraints\
      \ in network-level defense avoidance are testing and deployment of tools to\
      \ rapidly change their protocols, awareness of existing defensive technologies,\
      \ and access to legitimate Web services that, when used appropriately, make\
      \ their tools difficult to distinguish from benign traffic.\n\nAdditionally,\
      \ in the mobile environment, mobile devices are frequently connected to networks\
      \ outside enterprise control such as cellular networks or public Wi-Fi networks.\
      \ Adversaries could attempt to evade detection by communicating on these networks,\
      \ and potentially even by using non-Internet Protocol mechanisms such as Short\
      \ Message Service (SMS). However, cellular networks often have data caps and/or\
      \ extra data charges that could increase the potential for adversarial communication\
      \ to be detected.\nhttps://attack.mitre.org/tactics/TA0037"
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0036
    ref_id: TA0036
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Exfiltration
    description: 'The adversary is trying to steal data.


      Exfiltration refers to techniques and attributes that result or aid in the adversary
      removing files and information from the targeted mobile device.


      In the mobile environment, mobile devices are frequently connected to networks
      outside enterprise control such as cellular networks or public Wi-Fi networks.
      Adversaries could attempt to evade detection by communicating on these networks,
      and potentially even by using non-Internet Protocol mechanisms such as Short
      Message Service (SMS). However, cellular networks often have data caps and/or
      extra data charges that could increase the potential for adversarial communication
      to be detected.

      https://attack.mitre.org/tactics/TA0036'
  - urn: urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    ref_id: TA0034
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    name: Impact
    description: 'The adversary is trying to manipulate, interrupt, or destroy your
      devices and data.


      The impact tactic consists of techniques used by the adversary to execute his
      or her mission objectives but that do not cleanly fit into another category
      such as Collection. Mission objectives vary based on each adversary''s goals,
      but examples include toll fraud, destruction of device data, or locking the
      user out of his or her device until a ransom is paid.

      https://attack.mitre.org/tactics/TA0034'
  reference_controls:
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1001
    ref_id: M1001
    name: Security Updates
    category: technical
    csf_function: protect
    description: 'Install security updates in response to discovered vulnerabilities.


      Purchase devices with a vendor and/or mobile carrier commitment to provide security
      updates in a prompt manner for a set period of time.


      Decommission devices that will no longer receive security updates.


      Limit or block access to enterprise resources from devices that have not installed
      recent security updates.


      On Android devices, access can be controlled based on each device''s security
      patch level. On iOS devices, access can be controlled based on the iOS version.

      https://attack.mitre.org/mitigations/M1001'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1002
    ref_id: M1002
    name: Attestation
    category: technical
    csf_function: detect
    description: 'Enable remote attestation capabilities when available (such as Android
      SafetyNet or Samsung Knox TIMA Attestation) and prohibit devices that fail the
      attestation from accessing enterprise resources.

      https://attack.mitre.org/mitigations/M1002'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1003
    ref_id: M1003
    name: Lock Bootloader
    category: technical
    csf_function: protect
    description: 'On devices that provide the capability to unlock the bootloader
      (hence allowing any operating system code to be flashed onto the device), perform
      periodic checks to ensure that the bootloader is locked.

      https://attack.mitre.org/mitigations/M1003'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1004
    ref_id: M1004
    name: System Partition Integrity
    category: technical
    csf_function: protect
    description: 'Ensure that Android devices being used include and enable the Verified
      Boot capability, which cryptographically ensures the integrity of the system
      partition.

      https://attack.mitre.org/mitigations/M1004'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1006
    ref_id: M1006
    name: Use Recent OS Version
    category: technical
    csf_function: protect
    description: 'New mobile operating system versions bring not only patches against
      discovered vulnerabilities but also often bring security architecture improvements
      that provide resilience against potential vulnerabilities or weaknesses that
      have not yet been discovered. They may also bring improvements that block use
      of observed adversary techniques.

      https://attack.mitre.org/mitigations/M1006'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1009
    ref_id: M1009
    name: Encrypt Network Traffic
    category: technical
    csf_function: protect
    description: 'Application developers should encrypt all of their application network
      traffic using the Transport Layer Security (TLS) protocol to ensure protection
      of sensitive data and deter network-based attacks. If desired, application developers
      could perform message-based encryption of data before passing it for TLS encryption.


      iOS''s App Transport Security feature can be used to help ensure that all application
      network traffic is appropriately protected. Apple intends to mandate use of
      App Transport Security  (Citation: TechCrunch-ATS) for all apps in the Apple
      App Store unless appropriate justification is given.


      Android''s Network Security Configuration feature similarly can be used by app
      developers to help ensure that all of their application network traffic is appropriately
      protected  (Citation: Android-NetworkSecurityConfig).


      Use of Virtual Private Network (VPN) tunnels, e.g. using the IPsec protocol,
      can help mitigate some types of network attacks as well.

      https://attack.mitre.org/mitigations/M1009'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1010
    ref_id: M1010
    name: Deploy Compromised Device Detection Method
    category: technical
    csf_function: detect
    description: 'A variety of methods exist that can be used to enable enterprises
      to identify compromised (e.g. rooted/jailbroken) devices, whether using security
      mechanisms built directly into the device, third-party mobile security applications,
      enterprise mobility management (EMM)/mobile device management (MDM) capabilities,
      or other methods. Some methods may be trivial to evade while others may be more
      sophisticated.

      https://attack.mitre.org/mitigations/M1010'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1011
    ref_id: M1011
    name: User Guidance
    category: technical
    csf_function: govern
    description: 'Describes any guidance or training given to users to set particular
      configuration settings or avoid specific potentially risky behaviors.

      https://attack.mitre.org/mitigations/M1011'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1012
    ref_id: M1012
    name: Enterprise Policy
    category: technical
    csf_function: govern
    description: 'An enterprise mobility management (EMM), also known as mobile device
      management (MDM), system can be used to provision policies to mobile devices
      to control aspects of their allowed behavior.

      https://attack.mitre.org/mitigations/M1012'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1014
    ref_id: M1014
    name: Interconnection Filtering
    category: technical
    csf_function: protect
    description: 'In order to mitigate Signaling System 7 (SS7) exploitation, the
      Communications, Security, Reliability, and Interoperability Council (CSRIC)
      describes filtering interconnections between network operators to block inappropriate
      requests (Citation: CSRIC5-WG10-FinalReport).

      https://attack.mitre.org/mitigations/M1014'
  - urn: urn:intuitem:risk:function:mitre-attack-mobile:m1058
    ref_id: M1058
    name: Antivirus/Antimalware
    category: technical
    csf_function: detect
    description: 'Mobile security products, such as Mobile Threat Defense (MTD), offer
      various device-based mitigations against certain behaviors.

      https://attack.mitre.org/mitigations/M1058'
  techniques:
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1398
    ref_id: T1398
    name: Boot or Logon Initialization Scripts
    description: 'Adversaries may use scripts automatically executed at boot or logon
      initialization to establish persistence. Initialization scripts are part of
      the underlying operating system and are not accessible to the user unless the
      device has been rooted or jailbroken.

      https://attack.mitre.org/techniques/T1398'
