  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1655
    ref_id: T1655
    name: Masquerading
    description: 'Adversaries may attempt to manipulate features of their artifacts
      to make them appear legitimate or benign to users and/or security tools. Masquerading
      occurs when the name, location, or appearance of an object, legitimate or malicious,
      is manipulated or abused for the sake of evading defenses and observation. This
      may include manipulating file metadata, tricking users into misidentifying the
      file type, and giving legitimate task or service names.


      Renaming abusable system utilities to evade security monitoring is also a form
      of [Masquerading](https://attack.mitre.org/techniques/T1655)'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1655.001
    ref_id: T1655.001
    name: Match Legitimate Name or Location
    description: "Adversaries may match or approximate the name or location of legitimate\
      \ files or resources when naming/placing them. This is done for the sake of\
      \ evading defenses and observation. This may be done by giving artifacts the\
      \ name and icon of a legitimate, trusted application (i.e., Settings), or using\
      \ a package name that matches legitimate, trusted applications (i.e., `com.google.android.gm`).\
      \ \n\nAdversaries may also use the same icon of the file or application they\
      \ are trying to mimic.\nhttps://attack.mitre.org/techniques/T1655/001"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    parent_urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1655
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1658
    ref_id: T1658
    name: Exploitation for Client Execution
    description: "Adversaries may exploit software vulnerabilities in client applications\
      \ to execute code. Vulnerabilities can exist in software due to insecure coding\
      \ practices that can lead to unanticipated behavior. Adversaries may take advantage\
      \ of certain vulnerabilities through targeted exploitation for the purpose of\
      \ arbitrary code execution. Oftentimes the most valuable exploits to an offensive\
      \ toolkit are those that can be used to obtain code execution on a remote system\
      \ because they can be used to gain access to that system. Users will expect\
      \ to see files related to the applications they commonly used to do work, so\
      \ they are a useful target for exploit research and development because of their\
      \ high utility. \n\nAdversaries may use device-based zero-click exploits for\
      \ code execution. These exploits are powerful because there is no user interaction\
      \ required for code execution. \n\n### SMS/iMessage Delivery  \n\nSMS and iMessage\
      \ in iOS are common targets through [Drive-By Compromise](https://attack.mitre.org/techniques/T1456),\
      \ [Phishing](https://attack.mitre.org/techniques/T1660), etc. Adversaries may\
      \ use embed malicious links, files, etc. in SMS messages or iMessages. Mobile\
      \ devices may be compromised through one-click exploits, where the victim must\
      \ interact with a text message, or zero-click exploits, where no user interaction\
      \ is required. \n\n### AirDrop \n\nUnique to iOS, AirDrop is a network protocol\
      \ that allows iOS users to transfer files between iOS devices. Before patches\
      \ from Apple were released, on iOS 13.4 and earlier, adversaries may force the\
      \ Apple Wireless Direct Link (AWDL) interface to activate, then exploit a buffer\
      \ overflow to gain access to the device and run as root without interaction\
      \ from the user.\nhttps://attack.mitre.org/techniques/T1658"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0041
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1660
    ref_id: T1660
    name: Phishing
    description: "Adversaries may send malicious content to users in order to gain\
      \ access to their mobile devices. All forms of phishing are electronically delivered\
      \ social engineering. Adversaries can conduct both non-targeted phishing, such\
      \ as in mass malware spam campaigns, as well as more targeted phishing tailored\
      \ for a specific individual, company, or industry, known as \u201Cspearphishing.\u201D\
      \ Phishing often involves social engineering techniques, such as posing as a\
      \ trusted source, as well as evasion techniques, such as removing or manipulating\
      \ emails or metadata/headers from compromised accounts being abused to send\
      \ messages.\n\nMobile phishing may take various forms. For example, adversaries\
      \ may send emails containing malicious attachments or links, typically to deliver\
      \ and then execute malicious code on victim devices. Phishing may also be conducted\
      \ via third-party services, like social media platforms. Adversaries may also\
      \ impersonate executives of organizations to persuade victims into performing\
      \ some action on their behalf. For example, adversaries will often use social\
      \ engineering techniques in text messages to trick the victims into acting quickly,\
      \ which leads to adversaries obtaining credentials and other information. \n\
      \nMobile devices are a particularly attractive target for adversaries executing\
      \ phishing campaigns.  Due to their smaller form factor than traditional desktop\
      \ endpoints, users may not be able to notice minor differences between genuine\
      \ and phishing websites. Further, mobile devices have additional sensors and\
      \ radios that allow adversaries to execute phishing attempts over several different\
      \ vectors, such as: \n\n- SMS messages: Adversaries may send SMS messages (known\
      \ as \u201Csmishing\u201D) from compromised devices to potential targets to\
      \ convince the target to, for example, install malware, navigate to a specific\
      \ website, or enable certain insecure configurations on their device.\n- Quick\
      \ Response (QR) Codes: Adversaries may use QR codes (known as \u201Cquishing\u201D\
      ) to redirect users to a phishing website. For example, an adversary could replace\
      \ a legitimate public QR Code with one that leads to a different destination,\
      \ such as a phishing website. A malicious QR code could also be delivered via\
      \ other means, such as SMS or email. In the latter case, an adversary could\
      \ utilize a malicious QR code in an email to pivot from the user\u2019s desktop\
      \ computer to their mobile device.\n- Phone Calls: Adversaries may call victims\
      \ (known as \"vishing\") to persuade them to perform an action, such as providing\
      \ login credentials or navigating to malicious websites. Common vishing targets\
      \ include employees, especially executives of organizations, and help desks.\
      \ This may also be used as a technique to perform the initial access on a mobile\
      \ device, but then pivot to a desktop computer by having the victims perform\
      \ actions on a desktop computer. With the rise of artificial intelligence (AI),\
      \ adversaries may also use AI to clone a person\u2019s voice, resulting in deepfake\
      \ vishing. The cloned voice provides familiarity to the victims, increasing\
      \ the likelihood of successful malicious actions performed by the victims. Additionally,\
      \ adversaries may leave voicemails, which may use a real person\u2019s voice\
      \ or an AI-generated voice; these scams would urgently ask victims into calling\
      \ back to perform an action, e.g. sending money or providing sensitive information\
      \ and credentials.\nhttps://attack.mitre.org/techniques/T1660"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1058
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1661
    ref_id: T1661
    name: Application Versioning
    description: "An adversary may push an update to a previously benign application\
      \ to add malicious code. This can be accomplished by pushing an initially benign,\
      \ functional application to a trusted application store, such as the Google\
      \ Play Store or the Apple App Store. This allows the adversary to establish\
      \ a trusted userbase that may grant permissions to the application prior to\
      \ the introduction of malicious code. Then, an application update could be pushed\
      \ to introduce malicious code.(Citation: android_app_breaking_bad)\n\nThis technique\
      \ could also be accomplished by compromising a developer\u2019s account. This\
      \ would allow an adversary to take advantage of an existing userbase without\
      \ having to establish the userbase themselves.\nhttps://attack.mitre.org/techniques/T1661"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1006
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1662
    ref_id: T1662
    name: Data Destruction
    description: "Adversaries may destroy data and files on specific devices or in\
      \ large numbers to interrupt availability to systems, services, and network\
      \ resources. Data destruction is likely to render stored data irrecoverable\
      \ by forensic techniques through overwriting files or data on local and remote\
      \ drives.  \n\nTo achieve data destruction, adversaries may use the `pm uninstall`\
      \ command to uninstall packages or the `rm` command to remove specific files.\
      \ For example, adversaries may first use `pm uninstall` to uninstall non-system\
      \ apps, and then use `rm (-f) <file(s)>` to delete specific files, further hiding\
      \ malicious activity.(Citation: rootnik_rooting_tool)(Citation: abuse_native_linux_tools)\n\
      https://attack.mitre.org/techniques/T1662"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0034
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1663
    ref_id: T1663
    name: Remote Access Software
    description: "Adversaries may use legitimate remote access software, such as `VNC`,\
      \ `TeamViewer`, `AirDroid`, `AirMirror`, etc., to establish an interactive command\
      \ and control channel to target mobile devices.  \n\nRemote access applications\
      \ may be installed and used post-compromise as an alternate communication channel\
      \ for redundant access or as a way to establish an interactive remote session\
      \ with the target device. They may also be used as a component of malware to\
      \ establish a reverse connection to an adversary-controlled system or service.\
      \ Installation of remote access tools may also include persistence.\nhttps://attack.mitre.org/techniques/T1663"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0037
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
    - urn:intuitem:risk:function:mitre-attack-mobile:m1012
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1664
    ref_id: T1664
    name: Exploitation for Initial Access
    description: "Adversaries may exploit software vulnerabilities to gain initial\
      \ access to a mobile device. \n\nThis can be accomplished in a variety of ways.\
      \ Vulnerabilities may be present in the applications, the services, the underlying\
      \ operating system, or the kernel itself. Several well-known mobile device exploits\
      \ exist, including FORCEDENTRY, StageFright, and BlueBorne. Furthermore, some\
      \ exploits may be possible to exploit without any user interaction (i.e. zero-click\
      \ exploits, see [Exploitation for Client Execution](https://attack.mitre.org/techniques/T1658)),\
      \ making them particularly dangerous. Mobile operating system vendors are typically\
      \ very quick to patch such critical bugs, ensuring only a small window where\
      \ they can be exploited.\nhttps://attack.mitre.org/techniques/T1664"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0027
    groups:
    - android
    - ios
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1001
    - urn:intuitem:risk:function:mitre-attack-mobile:m1058
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1670
    ref_id: T1670
    name: Virtualization Solution
    description: "Adversaries may carry out malicious operations using virtualization\
      \ solutions to escape from Android sandboxes and to avoid detection. Android\
      \ uses sandboxes to separate resources and code execution between applications\
      \ and the operating system.(Citation: Android Application Sandbox) There are\
      \ a few virtualization solutions available on Android, such as the Android Virtualization\
      \ Framework (AVF).(Citation: Android AVF Overview)  \n\n \n\nThrough virtualization\
      \ solutions, adversaries may execute malicious operations without user knowledge.\
      \ For example, adversaries may mimic a legitimate banking application\u2019\
      s functionalities in a virtual environment, thanks to the virtualization solution,\
      \ while malicious code captures credentials.\nhttps://attack.mitre.org/techniques/T1670"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-mobile
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-mobile:ta0030
    groups:
    - android
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-mobile:m1011
  - urn: urn:intuitem:risk:technique:mitre-attack-mobile:t1676
    ref_id: T1676
    name: Linked Devices
    description: "Adversaries may abuse the \u201Clinked devices\u201D feature on\
      \ messaging applications, such as Signal and WhatsApp, to register the user\u2019\
      s account to an adversary-controlled device. By abusing the \u201Clinked devices\u201D\
      \ feature, adversaries may achieve and maintain persistence through the user\u2019\
      s account, may collect information, such as the user\u2019s messages and contacts\
      \ list, and may send future messages from the linked device.\n\nSignal is a\
      \ messaging application that uses the open-source Signal Protocol to encrypt\
      \ messages and calls; similarly, WhatsApp is a messaging application that has\
      \ end-to-end encryption and other security measures to protect messages and\
      \ calls. Both applications have a \u201Clinked devices\u201D feature that allows\
      \ users to access their Signal and/or WhatsApp accounts from different devices,\
      \ such as a Windows or Mac desktop, an iPad or an Android tablet.(Citation:\
      \ WhatsApp_LinkDevice_NoDate)(Citation: Signal_LinkedDevices_NoDate)\n\nAdversaries\
      \ may use [Phishing](https://attack.mitre.org/techniques/T1660) techniques to\
      \ trick the user into scanning a quick-response (QR) code, which is used to\
      \ link the user\u2019s Signal and/or WhatsApp account to an adversary-controlled\
      \ device. For example, adversaries may masquerade QR codes as group invites,\
      \ security alerts or as legitimate instructions for pairing linked devices.\
      \ \nUpon scanning the QR code in Signal, users may click on the \u201CTransfer\
      \ Message History\u201D option to sync the linked devices, which may allow adversaries\
      \ to collect more information about the user. Upon scanning the QR code in WhatsApp,\
      \ the user\u2019s device will automatically send an end-to-end encrypted copy\
      \ of recent message history to the adversary-controlled device.\nhttps://attack.mitre.org/techniques/T1676"
