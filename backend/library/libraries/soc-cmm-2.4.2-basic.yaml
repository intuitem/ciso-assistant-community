      ref_id: Process.7.8
      description: 'Is logging encrypted in transfer, in use, and at rest?


        Maturity guidance:

        1 - No encryption performed

        2 - Some logging encrypted at rest or in transfer

        3 - Most logging encrypted at rest and in transfer

        4 - All logging encrypted (rest & transfer), encryption keys not formally
