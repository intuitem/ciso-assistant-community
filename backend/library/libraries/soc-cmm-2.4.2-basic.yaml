      ref_id: Process.7.7
      description: 'Is the log management process aligned with all stakeholders?


        Maturity guidance:

        1 - Stakeholders are unfamiliar with the process

        2 - Some stakeholders are aware of the process, but not its details

        3 - Process awareness in most stakeholders, but no process alignment

        4 - Process aligned with all relevant stakeholders, no formal approval

        5 - Process aligned with all relevant stakeholders, formal approval in place'
      translations:
        fr:
          description: "Is the log management process align\xE9 avec toutes les parties\
            \ prenantes?"
