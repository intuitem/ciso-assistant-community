    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2
      ref_id: Business.2.4
      description: 'Do you differentiate output towards these specific customers &
        stakeholders?


        Maturity guidance:

        1 - Output is the same for all customers

        2 - Output is somewhat contextualized

        3 - Some customers receive differentiated output

        4 - All important customers receive differentiated output

        5 - All customers receive specific output based on context and type'
      translations:
        fr:
          description: "Diff\xE9renciez-vous output towards these specific les clients\
            \ & parties prenantes?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2
      ref_id: Business.2.5
      description: 'Do you have service level agreements with these customers & stakeholders?


        Maturity guidance:

        1 - Contractual agreements not in place

        2 - No contract in place, ad-hoc agreements made

        3 - Basic contract in place, not formally signed of

        4 - Contract signed, but not regularly reviewed

        5 - Contract signed, approved by- and regularly reviewed with customers'
      translations:
        fr:
          description: Avez-vous des accords de niveau de service agreements with
            these les clients & parties prenantes?
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2.6
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2
      ref_id: Business.2.6
      description: 'Do you regularly send updates to your customers & stakeholders?


        Maturity guidance:

        1 - No updates sent to customers

        2 - Ad-hoc updates sent to some customers

        3 - Frequent updates sent to most customers

        4 - Periodical updates sent to all customers

        5 - Periodical updates sent and discussed with all customers'
      translations:
        fr:
          description: "Envoyez-vous r\xE9guli\xE8rement updates to your les clients\
            \ & parties prenantes?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2.7
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2
      ref_id: Business.2.7
      description: 'Do you actively measure and manage customer & stakeholder satisfaction?


        Maturity guidance:

        1 - Customer satisfaction not measured or managed

        2 - Customer satisfaction managed in ad-hoc fashion

        3 - Customer satisfaction metrics defined, not applied structurally

        4 - Customer satisfaction measured structurally, not actively managed

        5 - Customer satisfaction fully managed and improved over time'
      translations:
        fr:
          description: "Mesurez-vous et g\xE9rez-vous activement and manage customer\
            \ & stakeholder satisfaction?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.3
