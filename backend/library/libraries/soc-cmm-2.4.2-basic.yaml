urn: urn:intuitem:risk:library:soc-cmm-2.4.2-basic
locale: en
ref_id: soc-cmm-2.4.2-basic
name: SOC-CMM 2.4.2 - Basic Self-Assessment
description: 'SOC-CMM is a capability maturity model used to perform a self-assessment
  of a Security Operations Center (SOC). It evaluates 5 domains (Business, People,
  Process, Technology, Services) using a continuous 0-5 maturity scale, with no prerequisites
  between levels: every element adds individually to the maturity score.

  Source: https://www.soc-cmm.com/ (Rob van Os)'
copyright: Copyright (C) 2025 - SOC-CMM. Licensed under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)
version: 1
publication_date: 2026-07-21
provider: SOC-CMM (Rob van Os)
packager: Nadia Qoudhadh
translations:
  fr:
    name: "SOC-CMM 2.4.2 - Auto-\xE9valuation de base"
    description: "SOC-CMM est un mod\xE8le de maturit\xE9 des capacit\xE9s utilis\xE9\
      \ pour r\xE9aliser l'auto-\xE9valuation d'un centre des op\xE9rations de s\xE9\
      curit\xE9 (SOC). Il \xE9value 5 domaines (Business, People, Process, Technology,\
      \ Services) sur une \xE9chelle de maturit\xE9 continue de 0 \xE0 5, sans pr\xE9\
      requis entre les niveaux : chaque \xE9l\xE9ment contribue individuellement au\
      \ score de maturit\xE9.\nSource : https://www.soc-cmm.com/ (Rob van Os)"
    copyright: Copyright (C) 2025 - SOC-CMM. Licensed under CC BY-SA 4.0 (https://creativecommons.org/licenses/by-sa/4.0/)
objects:
  framework:
    urn: urn:intuitem:risk:framework:soc-cmm-2.4.2-basic
    ref_id: soc-cmm-2.4.2-basic
    name: SOC-CMM 2.4.2 - Basic Self-Assessment
    description: 'SOC-CMM is a capability maturity model used to perform a self-assessment
      of a Security Operations Center (SOC). It evaluates 5 domains (Business, People,
      Process, Technology, Services) using a continuous 0-5 maturity scale, with no
      prerequisites between levels: every element adds individually to the maturity
      score.

      Source: https://www.soc-cmm.com/ (Rob van Os)'
    translations:
      fr:
        name: "SOC-CMM 2.4.2 - Auto-\xE9valuation de base"
        description: "SOC-CMM est un mod\xE8le de maturit\xE9 des capacit\xE9s utilis\xE9\
          \ pour r\xE9aliser l'auto-\xE9valuation d'un centre des op\xE9rations de\
          \ s\xE9curit\xE9 (SOC). Il \xE9value 5 domaines (Business, People, Process,\
          \ Technology, Services) sur une \xE9chelle de maturit\xE9 continue de 0\
          \ \xE0 5, sans pr\xE9requis entre les niveaux : chaque \xE9l\xE9ment contribue\
          \ individuellement au score de maturit\xE9.\nSource : https://www.soc-cmm.com/\
          \ (Rob van Os)"
    min_score: 0
    max_score: 5
    scores_definition:
    - score: 0
      name: Non-existent
      description: The process is not implemented or not recognized within the SOC.
      translations:
        fr:
          name: Inexistant
          description: "Le processus n'est pas mis en \u0153uvre ou pas reconnu au\
            \ sein du SOC."
    - score: 1
      name: Initial
      description: The process is performed, but in an ad hoc and inconsistent manner.
      translations:
        fr:
          name: Initial
          description: "Le processus est r\xE9alis\xE9, mais de mani\xE8re ad hoc\
            \ et non syst\xE9matique."
    - score: 2
      name: Managed
      description: The process is planned and executed according to a defined approach;
        performance is managed but not yet standardized.
      translations:
        fr:
          name: "G\xE9r\xE9"
          description: "Le processus est planifi\xE9 et ex\xE9cut\xE9 selon une approche\
            \ d\xE9finie ; la performance est g\xE9r\xE9e mais pas encore standardis\xE9\
            e."
    - score: 3
      name: Defined
      description: The process is well characterized, documented, and standardized
        across the SOC.
      translations:
        fr:
          name: "D\xE9fini"
          description: "Le processus est bien caract\xE9ris\xE9, document\xE9 et standardis\xE9\
            \ au sein du SOC."
    - score: 4
      name: Quantitatively managed
      description: The process is measured and controlled using quantitative techniques.
      translations:
        fr:
          name: "G\xE9r\xE9 quantitativement"
          description: "Le processus est mesur\xE9 et pilot\xE9 \xE0 l'aide de techniques\
            \ quantitatives."
    - score: 5
      name: Optimizing
      description: The process is continuously improved based on quantitative feedback
        and innovative practices.
      translations:
        fr:
          name: "Optimis\xE9"
          description: "Le processus est am\xE9lior\xE9 en continu sur la base de\
            \ retours quantitatifs et de pratiques innovantes."
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business
      assessable: false
      depth: 1
      ref_id: Business
      name: Business
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business
      ref_id: Business.1
      name: Business Drivers
      translations:
        fr:
          name: "Moteurs M\xE9tier"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1
      ref_id: Business.1.1
      description: 'Have you identified the main business drivers?


        Maturity guidance:

        1 - Business drivers are unknown

        2 - Basic awareness of business drivers

        3 - Some business drivers have been identified

        4 - Most business drivers have been identified

        5 - All business drivers are well known within the SOC'
      translations:
        fr:
          description: "Avez-vous identifi\xE9 les principaux moteurs m\xE9tier?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1.2
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1
      ref_id: Business.1.2
      description: 'Have you documented the main business drivers?


        Maturity guidance:

        1 - No documentation in place

        2 - Some ad-hoc information across documents

        3 - Basic documentation of business drivers

        4 - Single document, full description of business drivers

        5 - Document completed, approved and formally published'
      translations:
        fr:
          description: "Avez-vous document\xE9 les principaux moteurs m\xE9tier?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1.3
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1
      ref_id: Business.1.3
      description: 'Do you use business drivers in the decision making process?


        Maturity guidance:

        1 - Business drivers are not part of decision making

        2 - Business drivers are referred to on an ad-hoc basis

        3 - Business drivers are occasionally used in decisions

        4 - Business drivers are used in most decisions

        5 - Business drivers are used in all relevant decisions'
      translations:
        fr:
          description: "Utilisez-vous les moteurs m\xE9tier dans le processus de prise\
            \ de d\xE9cision?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1.4
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1
      ref_id: Business.1.4
      description: 'Do you regularly check if the current service catalogue is aligned
        with business drivers?


        Maturity guidance:

        1 - Service catalogue has not been checked for alignment

        2 - Alignment is performed on an ad-hoc basis

        3 - Alignment was performed but not maintained

        4 - Alignment is performed and maintained regularly

        5 - Every change in the catalogue is checked against drivers'
      translations:
        fr:
          description: "V\xE9rifiez-vous r\xE9guli\xE8rement si le catalogue de services\
            \ actuel is align\xE9 avec les moteurs m\xE9tier?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1.5
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.1
      ref_id: Business.1.5
      description: 'Have the business drivers been validated with business stakeholders?


        Maturity guidance:

        1 - Business drivers have not been validated

        2 - Basic awareness of SOC drivers exists among stakeholders

        3 - Stakeholders informally informed of business drivers

        4 - Alignment of SOC drivers with stakeholders is performed

        5 - Business drivers are formally validated by stakeholders'
      translations:
        fr:
          description: "Les moteurs m\xE9tier ont-ils ont \xE9t\xE9 valid\xE9s avec\
            \ les parties prenantes m\xE9tier?"
    - urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business.2
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:business
