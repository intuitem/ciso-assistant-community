      description: 'Is the SOC charter document regularly updated?


        Maturity guidance:

        1 - Charter is never updated

        2 - Charter is updated on ad-hoc basis

        3 - Charter is updated on major changes in business strategy

        4 - Charter is regularly updated

        5 - Charter periodically updated and realigned with business strategy'
      translations:
