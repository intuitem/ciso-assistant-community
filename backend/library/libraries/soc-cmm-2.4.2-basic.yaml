      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:soc-cmm-2.4.2-basic:process.7
      ref_id: Process.7.6
      description: 'Is the log management process compliant with applicable standards
        & regulations?


        Maturity guidance:

        1 - Regulations are not known and the process is non-compliant

        2 - Some regulations are known and the process is non-compliant

        3 - Most regulations are known and the process is partially compliant

        4 - Regulations are fully known and the process is mostly compliant

        5 - Regulations are fully known and the process is fully compliant'
      translations:
        fr:
          description: Is the log management process compliant with applicable standards
            & regulations?
