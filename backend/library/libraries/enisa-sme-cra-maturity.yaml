urn: urn:intuitem:risk:library:enisa-sme-cra-maturity
locale: en
ref_id: ENISA-CRA-Maturity
name: ENISA SME Cyber Resilience Maturity Assessment (CRA)
description: 'Based on the ENISA SME Cyber Resilience Maturity Assessment Model (tool
  v1.1). This self-assessment helps organisations check their current maturity against
  the Cyber Resilience Act (CRA) across 5 domains: Governance and Documentation; Risk
  Management and Security by Design and by Default; Vulnerability and Patch Management;
  Product Lifecycle Management; and Awareness, Competence and Skills. Each question
  is answered by selecting the description matching current practice, which sets the
  maturity score (1 Initial to 5 Optimised) automatically. Maturity bands: Basic (1.0-2.5),
  Intermediate (2.6-3.9), Advanced (4.0-5.0). It is intended as a self-check aid,
  not a substitute for formal legal or conformity advice.'
copyright: ENISA
version: 3
publication_date: 2026-07-13
provider: ENISA
packager: intuitem
translations:
  de:
    name: ENISA-Reifegradbewertung der Cyberresilienz für KMU (CRA)
    description: 'Basiert auf dem ENISA-Modell zur Reifegradbewertung der Cyberresilienz für
      Kleinstunternehmen sowie kleine und mittlere Unternehmen (Tool v1.1). Diese Selbstbewertung
      hilft Organisationen, ihren aktuellen Reifegrad im Hinblick auf den Cyber Resilience
      Act (CRA) in fünf Bereichen zu prüfen: Governance und Dokumentation; Risikomanagement
      und Security by Design und by Default; Schwachstellen- und Patchmanagement; Management
      des Produktlebenszyklus; sowie Sensibilisierung, Kompetenz und Fähigkeiten. Jede Frage
      wird durch Auswahl der Beschreibung beantwortet, die der aktuellen Praxis entspricht.
      Dadurch wird der Reifegradwert automatisch festgelegt (1 Initial bis 5 Optimiert). Reifegradbereiche:
      Basis (1,0–2,5), Mittel (2,6–3,9), Fortgeschritten (4,0–5,0). Das Modell dient als Hilfsmittel
      zur Selbstbewertung und ersetzt keine formelle Rechts- oder Konformitätsberatung.


      Hinweis zur Übersetzung: KI-gestützte maschinelle Übersetzung der englischen Bibliotheksinhalte
      mit anschließender sprachlicher und fachlicher Prüfung durch den KI-Assistenten; keine
      offizielle oder von ENISA autorisierte deutsche Übersetzung. Quelle: [ENISA, SME Cyber
      Resilience Maturity Assessment Model (Tool v1.1)](https://www.enisa.europa.eu/publications/sme-cyber-resilience-maturity-assessment-model).
      Das Original wurde für diese deutsche Fassung übersetzt; Reifegradwerte und Bewertungslogik
      wurden nicht verändert.'
    copyright: '© European Union Agency for Cybersecurity (ENISA), 2026. Ausgangsveröffentlichung
      unter [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/). Deutsche Übersetzung:
      KI-gestützt erstellt und durch den KI-Assistenten geprüft; nicht von ENISA autorisiert.'
