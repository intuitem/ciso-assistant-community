urn: urn:intuitem:risk:library:enisa-sme-cra-maturity
locale: en
ref_id: ENISA-CRA-Maturity
name: ENISA SME Cyber Resilience Maturity Assessment (CRA)
description: 'Based on the ENISA SME Cyber Resilience Maturity Assessment Model (tool
  v1.1). This self-assessment helps organisations check their current maturity against
  the Cyber Resilience Act (CRA) across 5 domains: Governance and Documentation; Risk
  Management and Security by Design and by Default; Vulnerability and Patch Management;
  Product Lifecycle Management; and Awareness, Competence and Skills. Each question
  is answered by selecting the description matching current practice, which sets the
  maturity score (1 Initial to 5 Optimised) automatically. Maturity bands: Basic (1.0-2.5),
  Intermediate (2.6-3.9), Advanced (4.0-5.0). It is intended as a self-check aid,
  not a substitute for formal legal or conformity advice.'
copyright: ENISA
version: 1
publication_date: 2026-07-13
provider: ENISA
packager: intuitem
