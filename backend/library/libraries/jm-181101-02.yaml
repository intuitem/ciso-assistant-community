      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3
      ref_id: 3.P
      name: "P\xE1rr."
      description: "La aplicaci\xF3n de este Reglamento se extender\xE1 a las entidades\
        \ de apoyo y servicios conexos vinculadas, mediante el mantenimiento de una\
        \ conexi\xF3n electr\xF3nica o el intercambio de informaci\xF3n esencial,\
        \ a trav\xE9s de cualquier medio digital, en la medida en que dicha vinculaci\xF3\
        n pueda comprometer los objetivos del SIPARD."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:4
      assessable: true
      depth: 1
      ref_id: '4'
      name: "Art. 4 \u2013 Principios Rectores"
      description: "Este Reglamento tendr\xE1 como principios rectores b\xE1sicos,\
        \ los siguientes:"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:4.a
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:4
      ref_id: 4.a
      name: lit. a)
      description: "Principio de Cooperaci\xF3n. Cooperar de forma abierta, eficaz\
        \ y transparente para el intercambio de la informaci\xF3n que sea pertinente;\
        \ y,"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:4.b
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:4
      ref_id: 4.b
      name: lit. b)
      description: "Principio de Territorialidad. Gestionar los riesgos de Seguridad\
        \ Cibern\xE9tica y de la Informaci\xF3n en los casos en que la amenaza tenga\
        \ incidencia en la Rep\xFAblica Dominicana."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      assessable: false
      depth: 1
      ref_id: '5'
      name: "Art. 5 \u2013 Definiciones"
      description: "Para efectos de este Reglamento, los t\xE9rminos y conceptos que\
        \ se detallan a continuaci\xF3n, tendr\xE1n los significados siguientes:"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.a
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.a
      name: lit. a)
      description: "Acceso: Capacidad y medios para comunicarse o interactuar con\
        \ un sistema, utilizar recursos del mismo para manejar y adquirir conocimiento\
        \ de la informaci\xF3n contenida en el sistema o controlar componentes y funciones\
        \ del mismo;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.b
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.b
      name: lit. b)
      description: "Activo de Informaci\xF3n: Bien tangible o intangible, que almacena,\
        \ procesa y/o transmite informaci\xF3n;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.c
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.c
      name: lit. c)
      description: "Administrador de un Sistema de Pagos o de Liquidaci\xF3n de Valores:\
        \ El Banco Central de la Rep\xFAblica Dominicana u otra entidad debidamente\
        \ autorizada por la Junta Monetaria que opere un sistema de pagos; o una entidad\
        \ autorizada a ofrecer servicios de registro, transferencia, compensaci\xF3\
        n y liquidaci\xF3n de valores en lo relativo al traspaso de los valores negociables;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.d
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.d
      name: lit. d)
      description: "Alta Gerencia: La integran los principales ejecutivos u \xF3rganos\
        \ de gesti\xF3n, responsables de planificar, dirigir y controlar las estrategias\
        \ y operaciones generales de las entidades, que han sido previamente aprobadas\
        \ por el Consejo;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.e
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.e
      name: lit. e)
      description: "Amenaza: Circunstancia desfavorable que puede ocurrir y que, de\
        \ suceder, tendr\xEDa consecuencias negativas sobre la Seguridad Cibern\xE9\
        tica y de la Informaci\xF3n. Una amenaza puede tener causas naturales, ser\
        \ accidental o intencionada. Si esta circunstancia desfavorable acontece a\
        \ la vez que existe una vulnerabilidad o debilidad de los sistemas o aprovechando\
        \ su existencia, puede derivar en un incidente de seguridad;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.f
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.f
      name: lit. f)
      description: "Apetito de Riesgo: Es el l\xEDmite agregado en funci\xF3n de los\
        \ tipos de riesgos que el Consejo y la Alta Gerencia est\xE1n dispuestos a\
        \ asumir y gestionar para cumplir sus objetivos de negocios;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.g
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.g
      name: lit. g)
      description: "Arquitectura Empresarial: Conjunto de sistemas de informaci\xF3\
        n de una empresa, su configuraci\xF3n, integraci\xF3n, as\xED como su interacci\xF3\
        n con el entorno interno y externo, y la forma de operar para respaldar la\
        \ misi\xF3n y contribuir a la posici\xF3n de seguridad general de la misma;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.h
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.h
      name: lit. h)
      description: "Arquitectura de Seguridad Cibern\xE9tica y de la Informaci\xF3\
        n: Parte integral de la Arquitectura Empresarial, que describe la estructura\
        \ y el comportamiento de los esquemas de Seguridad Cibern\xE9tica y de la\
        \ Informaci\xF3n de una entidad, sus departamentos, colaboradores y los sistemas\
        \ de informaci\xF3n e Infraestructura Tecnol\xF3gica que los apoyan, mostrando\
        \ su alineaci\xF3n a las pol\xEDticas definidas por la misma y sus planes\
        \ estrat\xE9gicos;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.i
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.i
      name: lit. i)
      description: "Ataque: Intento de obtener acceso no autorizado a los sistemas,\
        \ sus recursos, servicios o informaci\xF3n, o de comprometer la integridad\
        \ de los mismos. Comprende cualquier tipo de actividad maliciosa que pretenda\
        \ recopilar, degradar o destruir los recursos de los sistemas de informaci\xF3\
        n, la informaci\xF3n contenida en \xE9stos, interrumpir o provocar negaci\xF3\
        n de sus servicios, o el da\xF1o a la Infraestructura Tecnol\xF3gica que los\
        \ soporta;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.j
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.j
      name: lit. j)
      description: "Ataque Cibernético: Ataque a la Infraestructura Tecnológica a través del ciberespacio;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.k
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.k
      name: lit. k)
      description: "Autenticaci\xF3n: Acto de validar la identidad de un usuario para\
        \ otorgarle acceso a recursos tecnol\xF3gicos;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.l
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.l
      name: lit. l)
      description: "Ciberespacio: Dominio global dentro del entorno de informaci\xF3\
        n que consiste en una red interdependiente de Infraestructuras Tecnol\xF3\
        gicas, el Internet, redes de telecomunicaciones, procesadores y controladores\
        \ integrados, sin menoscabo de otros componentes que puedan surgir en el futuro;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.m
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.m
      name: lit. m)
      description: "Cifrado: Proceso mediante el cual la informaci\xF3n o archivos\
        \ son alterados en forma matem\xE1tica, mediante un control de acceso con\
        \ el objetivo de evitar que una persona no autorizada, al verlos o copiarlos\
        \ pueda interpretarlos;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.n
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.n
      name: lit. n)
      description: "Colaboradores: Personal interno que presta sus servicios de manera\
        \ permanente o temporal a una entidad, a cambio de una contraprestaci\xF3\
        n econ\xF3mica y que est\xE1 asociado a la misma por un contrato de trabajo;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.o
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.o
      name: lit. o)
      description: "Confidencialidad: Es la preservaci\xF3n de la informaci\xF3n,\
        \ a fin de que la misma no sea divulgada en todo o en parte a personas f\xED\
        sicas o jur\xEDdicas, o procesos, a menos que \xE9stos hayan sido autorizados\
        \ para acceder a dicha informaci\xF3n. Incluye los medios para proteger la\
        \ privacidad personal y la Informaci\xF3n Esencial;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.p
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.p
      name: lit. p)
      description: "Consejo: \xD3rgano m\xE1ximo de direcci\xF3n que tiene todas las\
        \ facultades de administraci\xF3n y representaci\xF3n de la entidad, responsable\
        \ de velar por el buen desempe\xF1o de la Alta Gerencia en la gesti\xF3n,\
        \ no pudiendo delegar su responsabilidad. Se refiere al consejo de directores,\
        \ consejo de administraci\xF3n o junta de directores, seg\xFAn corresponda;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.q
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.q
      name: lit. q)
      description: "Control de Acceso: Proceso de concesi\xF3n o denegaci\xF3n de\
        \ solicitudes espec\xEDficas, para obtener y utilizar informaci\xF3n y servicios\
        \ de procesamiento de informaci\xF3n relacionados, o entrar en instalaciones\
        \ f\xEDsicas espec\xEDficas;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.r
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.r
      name: lit. r)
      description: "Copias de Resguardo: Proceso de copiar informaci\xF3n para facilitar\
        \ la recuperaci\xF3n de las mismas, en caso de que sea necesario."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.s
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.s
      name: lit. s)
      description: "Data: Subconjunto de informaci\xF3n en formato electr\xF3nico\
        \ que permite ser recuperado o transmitido;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.t
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.t
      name: lit. t)
      description: "Datos de Car\xE1cter Personal: Cualquier informaci\xF3n num\xE9\
        rica, alfab\xE9tica, gr\xE1fica, fotogr\xE1fica, ac\xFAstica o de cualquier\
        \ otro tipo, concerniente a personas f\xEDsicas identificadas o identificables;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.u
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.u
      name: lit. u)
      description: "Disponibilidad: La propiedad de la informaci\xF3n, de ser accesible\
        \ y utilizable a pedido de un usuario, entidad o proceso autorizado;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.v
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.v
      name: lit. v)
      description: "Dispositivo M\xF3vil: Dispositivo inform\xE1tico port\xE1til que:\
        \ (i) es de tama\xF1o peque\xF1o, de modo que puede ser transportado f\xE1\
        cilmente por un solo individuo; (ii) est\xE1 dise\xF1ado para funcionar sin\
        \ una conexi\xF3n f\xEDsica (por ejemplo, transmitir o recibir informaci\xF3\
        n de forma inal\xE1mbrica); (iii) posee almacenamiento de datos local, no\
        \ extra\xEDble; y, (iv) opera durante largos per\xEDodos con una fuente de\
        \ alimentaci\xF3n aut\xF3noma. Los dispositivos m\xF3viles tambi\xE9n pueden\
        \ incluir capacidades de comunicaci\xF3n de voz, sensores electr\xF3nicos\
        \ que les permiten capturar y procesar informaci\xF3n (por ejemplo, im\xE1\
        genes, videos, datos biom\xE9tricos, ubicaci\xF3n, entre otros) y/o caracter\xED\
        sticas integradas para sincronizar datos locales con ubicaciones remotas;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.w
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.w
      name: lit. w)
      description: "Documento Digital: Informaci\xF3n codificada en forma digital\
        \ sobre un soporte l\xF3gico o f\xEDsico, que se constituye en representaci\xF3\
        n de actos, hechos o datos jur\xEDdicamente relevantes y a la cual se accede\
        \ utilizando m\xE9todos electr\xF3nicos, \xF3pticos o similares;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5.x
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:5
      ref_id: 5.x
      name: lit. x)
      description: "Empresa de Adquirencia o Adquirente: Entidad que, a trav\xE9s\
        \ de dispositivos electr\xF3nicos, sirve de enlace entre una entidad emisora\
        \ de tarjetas bancarias y el establecimiento donde se realiza una operaci\xF3\
        n de pago a trav\xE9s de dichas tarjetas;"
