ref_id: JM-181101-02
name: "JM 181101-02 \u2013 Reglamento de Seguridad Cibern\xE9tica y de la Informaci\xF3\
  n"
description: "Reglamento de Seguridad Cibernética y de la Información, aprobado por la Junta Monetaria de la República Dominicana mediante su Segunda Resolución del 1 de noviembre de 2018 (JM 181101-02). Aplica a las entidades de intermediación financiera, a los administradores y participantes del Sistema de Pagos y Liquidación de Valores (SIPARD) y a las entidades de apoyo y servicios conexos. Texto literal estructurado por artículo, párrafo, numeral y literal. Fuente oficial: https://sb.gob.do/media/dtydqoiv/20181101_segunda-resolucion_reglamento_seguridad_cibernetica_de_la_informacion.pdf"
copyright: "Texto oficial de la Junta Monetaria de la República Dominicana (Segunda Resolución del 1 de noviembre de 2018). Transcripción estructurada por Soluciones GE, SRL."
version: 3
publication_date: 2026-10-03
provider: "Junta Monetaria de la Rep\xFAblica Dominicana"
packager: soluciones-ge
objects:
  framework:
    urn: urn:soluciones-ge:risk:framework:jm-181101-02
    ref_id: JM-181101-02
    name: "JM 181101-02 \u2013 Reglamento de Seguridad Cibern\xE9tica y de la Informaci\xF3\
      n"
    description: "Texto del JM 181101-02 \u2013 Reglamento de Seguridad Cibern\xE9\
      tica y de la Informaci\xF3n."
    requirement_nodes:
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:1
      assessable: false
      depth: 1
      ref_id: '1'
      name: "Art. 1 \u2013 Objeto"
      description: "Este Reglamento tiene por objeto establecer los principios y lineamientos\
        \ generales que servir\xE1n de base a las entidades de intermediaci\xF3n financiera,\
        \ los administradores y participantes del Sistema de Pagos y Liquidaci\xF3\
        n de Valores de la Rep\xFAblica Dominicana (SIPARD), a los participantes de\
        \ los sistemas de pago y liquidaci\xF3n de valores que lo componen; y, a las\
        \ entidades de apoyo y servicios conexos interconectadas con las entidades\
        \ de intermediaci\xF3n financiera y con el SIPARD, para procurar la integridad,\
        \ disponibilidad y confidencialidad de la informaci\xF3n, y el funcionamiento\
        \ \xF3ptimo de los sistemas de informaci\xF3n y de la infraestructura tecnol\xF3\
        gica. Asimismo, la adopci\xF3n e implementaci\xF3n de pr\xE1cticas para la\
        \ gesti\xF3n de riesgos de la Seguridad Cibern\xE9tica y de la Informaci\xF3\
        n, acorde a su naturaleza, tama\xF1o, complejidad, perfil de riesgo e importancia\
        \ sist\xE9mica, conforme a la Ley No.183-02, Monetaria y Financiera de fecha\
        \ 21 de noviembre del 2002 y sus modificaciones, y a los est\xE1ndares internacionales\
        \ en la materia."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:2
      assessable: false
      depth: 1
      ref_id: '2'
      name: "Art. 2 \u2013 Alcance"
      description: "El alcance de este Reglamento comprende los principios y lineamientos\
        \ generales que deber\xE1n adoptarse para la integridad, disponibilidad y\
        \ confidencialidad de la informaci\xF3n, el funcionamiento \xF3ptimo de los\
        \ sistemas de informaci\xF3n y de la infraestructura tecnol\xF3gica, as\xED\
        \ como la adopci\xF3n e implementaci\xF3n de pr\xE1cticas para la gesti\xF3\
        n de riesgos de la Seguridad Cibern\xE9tica y de la Informaci\xF3n."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3
      assessable: false
      depth: 1
      ref_id: '3'
      name: "Art. 3 \u2013 \xC1mbito de Aplicaci\xF3n"
      description: "Las disposiciones establecidas en este Reglamento son de aplicaci\xF3\
        n para las entidades que se identifican a continuaci\xF3n:"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3.a
