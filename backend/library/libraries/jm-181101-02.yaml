      description: "El presupuesto requerido, as\xED como las modalidades de ejecuci\xF3\
        n del mismo, para la puesta en funcionamiento y mantenimiento de las operaciones\
        \ del Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9tica (CSIRT,\
        \ por sus siglas en ingl\xE9s), ser\xE1 determinado por la Junta Monetaria."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:53
      assessable: false
      depth: 1
      ref_id: '53'
      name: "Art. 53 \u2013 Responsabilidades"
      description: "El Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9tica\
        \ (CSIRT, por sus siglas en ingl\xE9s) debe cumplir con los deberes y responsabilidades\
        \ que le sean otorgadas por el Consejo Sectorial."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:54
      assessable: false
      depth: 1
      ref_id: '54'
      name: "Art. 54 \u2013 Estructura"
      description: "El Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9tica\
        \ (CSIRT, por sus siglas en ingl\xE9s) debe contar con una estructura org\xE1\
        nica que facilite el cumplimiento de sus deberes y responsabilidades."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:55
      assessable: false
      depth: 1
      ref_id: '55'
      name: "Art. 55 \u2013 Direcci\xF3n"
      description: "El Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9tica\
        \ (CSIRT, por sus siglas en ingl\xE9s), estar\xE1 dirigido por un profesional\
        \ designado por el Banco Central, en virtud de sus competencias administrativas\
        \ y capacidad requerida para la direcci\xF3n de equipos de respuesta de esta\
        \ naturaleza."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:56
      assessable: false
      depth: 1
      ref_id: '56'
      name: "Art. 56 \u2013 Instalaciones"
      description: "El Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9tica\
        \ (CSIRT, por sus siglas en ingl\xE9s), operar\xE1 en un lugar aislado, asegurado\
        \ y sus sistemas de informaci\xF3n e infraestructura tecnol\xF3gica, deben\
        \ estar implementados tomando en consideraci\xF3n la protecci\xF3n de la informaci\xF3\
        n sensible recibida y almacenada en sus sistemas de informaci\xF3n. Asimismo,\
        \ deber\xE1 contar con controles de seguridad f\xEDsicos y l\xF3gicos de manera\
        \ permanente."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:56.p1
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:56
      ref_id: 56.P1
      name: "P\xE1rr. I"
      description: "Las instalaciones de dicho Equipo estar\xE1n en un \xE1rea restringida\
        \ con el fin de evitar el acceso no autorizado a los recursos y a la informaci\xF3\
        n."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:56.p2
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:56
      ref_id: 56.P2
      name: "P\xE1rr. II"
      description: "Los servidores, los equipos de comunicaciones, los dispositivos\
        \ de seguridad l\xF3gica y los repositorios de datos, deben permanecer en\
        \ las instalaciones del Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9\
        tica (CSIRT, por sus siglas en ingl\xE9s) o en un centro de datos autorizado\
        \ por el Consejo Sectorial, donde el acceso f\xEDsico y l\xF3gico se regir\xE1\
        \ por un estricto control de acceso, seg\xFAn lo definido en las pol\xEDticas\
        \ de acceso a ser elaboradas para esos fines."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:57
      assessable: false
      depth: 1
      ref_id: '57'
      name: "Art. 57 \u2013 Definici\xF3n de Pol\xEDticas"
      description: "El Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9tica\
        \ (CSIRT, por sus siglas en ingl\xE9s) debe contar con pol\xEDticas que deben\
        \ ser seguidas por su personal en la realizaci\xF3n de sus operaciones acorde\
        \ a los lineamientos definidos por este Reglamento y por las disposiciones\
        \ del Consejo Sectorial."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:58
      assessable: false
      depth: 1
      ref_id: '58'
      name: "Art. 58 \u2013 Establecimiento de los Servicios"
      description: "El Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9tica\
        \ (CSIRT, por sus siglas en ingl\xE9s), debe establecer servicios de seguridad\
        \ cibern\xE9tica, a fin de dar apoyo a las entidades de intermediaci\xF3n\
        \ financiera, los administradores y participantes del SIPARD, las entidades\
        \ p\xFAblicas de intermediaci\xF3n financiera y, las entidades de apoyo y\
        \ servicios conexos, en sus procesos de respuesta a incidentes de seguridad\
        \ cibern\xE9tica."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:59
      assessable: false
      depth: 1
      ref_id: '59'
      name: "Art. 59 \u2013 Sanciones"
      description: "Las entidades de intermediaci\xF3n financiera y las entidades\
        \ p\xFAblicas de intermediaci\xF3n financiera que infrinjan cualesquiera de\
        \ las disposiciones contenidas en este Reglamento y en los instructivos que\
        \ fueren creados para su implementaci\xF3n, ser\xE1n pasibles de la aplicaci\xF3\
        n de las sanciones establecidas en la Ley Monetaria y Financiera y en el Reglamento\
        \ de Sanciones."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:60
      assessable: false
      depth: 1
      ref_id: '60'
      name: "Art. 60 \u2013 Medidas Precautorias"
      description: "Cuando los administradores y participantes del SIPARD previstos\
        \ en este Reglamento, as\xED como las entidades de apoyo y servicios conexos\
        \ que mantengan una interconexi\xF3n o intercambio de informaci\xF3n con el\
        \ SIPARD, y sus administradores y participantes, incumplan alguna de las disposiciones\
        \ contenidas en este Reglamento y en los instructivos que fueren creados para\
        \ su implementaci\xF3n, el Banco Central podr\xE1 suspender temporalmente\
        \ su participaci\xF3n en el SIPARD, como medida precautoria y para minimizar\
        \ el riesgo sist\xE9mico. De verificarse el incumplimiento continuo de las\
        \ disposiciones enunciadas, podr\xE1 ser gestionado en coordinaci\xF3n con\
        \ el organismo regulador correspondiente, la exclusi\xF3n definitiva del Sistema\
        \ de Pagos y Liquidaci\xF3n de Valores."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:61
      assessable: false
      depth: 1
      ref_id: '61'
      name: "Art. 61 \u2013 Elaboraci\xF3n de Instructivos y Circulares"
      description: "El Banco Central y la Superintendencia de Bancos, deber\xE1n elaborar\
        \ los instructivos y circulares con los lineamientos que consideren necesarios\
        \ para la aplicaci\xF3n de este Reglamento."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:62
      assessable: true
      depth: 1
      ref_id: '62'
      name: "Art. 62 \u2013 Plazo de Adecuaci\xF3n"
      description: "Las entidades de intermediaci\xF3n financiera, los administradores\
        \ y participantes del SIPARD, las entidades p\xFAblicas de intermediaci\xF3\
        n financiera y, las entidades de apoyo y servicios conexos, deben ajustarse\
