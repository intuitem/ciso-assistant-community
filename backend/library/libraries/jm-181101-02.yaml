      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3
      ref_id: 3.d
      name: lit. d)
      description: "Asociaciones de Ahorros y Pr\xE9stamos;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3.e
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3
      ref_id: 3.e
      name: lit. e)
      description: "Entidades P\xFAblicas de Intermediaci\xF3n Financiera;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3.f
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3
      ref_id: 3.f
      name: lit. f)
      description: "Administradores de Sistemas de Pago y Liquidaci\xF3n de Valores;"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3.g
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3
      ref_id: 3.g
      name: lit. g)
      description: Participantes del SIPARD autorizados por la Junta Monetaria; y,
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3.h
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:3
      ref_id: 3.h
      name: lit. h)
      description: Cualquier otro tipo de entidad del SIPARD, que la Junta Monetaria
