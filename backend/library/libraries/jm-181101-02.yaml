      ref_id: '51'
      name: "Art. 51 \u2013 Funcionamiento"
      description: "El Consejo Sectorial deber\xE1 reunirse de manera ordinaria previa\
        \ convocatoria de su Presidente, quien establecer\xE1 el orden del d\xEDa\
        \ y sesionar\xE1 v\xE1lidamente con la presencia de al menos de 4 (cuatro)\
        \ de sus miembros permanentes y el secretario de dicho Consejo, con una frecuencia\
        \ de por lo menos 1 (una) vez por trimestre. El Presidente, podr\xE1 convocar\
        \ extraordinariamente a tantas sesiones de trabajo como sean necesarias."
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:52
      assessable: false
      depth: 1
      ref_id: '52'
      name: "Art. 52 \u2013 Creaci\xF3n del Mecanismo"
      description: "Se crea el Equipo de Respuesta a Incidentes de Seguridad Cibern\xE9\
        tica para el Sector Financiero (CSIRT, por sus siglas en ingl\xE9s), bajo\
        \ la dependencia administrativa del Banco Central y funcional del Consejo\
        \ Sectorial, con la finalidad de definir acciones inmediatas para la prevenci\xF3\
        n, detecci\xF3n, contenci\xF3n, erradicaci\xF3n y recuperaci\xF3n frente a\
        \ incidentes de seguridad cibern\xE9tica que afecten las entidades definidas\
        \ en el objeto y \xE1mbito de este Reglamento;"
