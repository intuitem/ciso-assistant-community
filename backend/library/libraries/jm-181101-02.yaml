      ref_id: '7'
      name: "Art. 7 \u2013 Estructura"
      description: "Las entidades de intermediaci\xF3n financiera, administradores\
        \ y participantes del SIPARD, entidades p\xFAblicas de intermediaci\xF3n financiera\
        \ y las entidades de apoyo y servicios conexos, deben contar con una estructura\
