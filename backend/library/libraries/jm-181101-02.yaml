        gico relevantes establecidos por el consejo relacionados con amenazas o incidentes\
        \ de Seguridad Cibern\xE9tica y de la Informaci\xF3n; y,"
    - urn: urn:soluciones-ge:risk:req_node:jm-181101-02:11.f
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:jm-181101-02:11
      ref_id: 11.f
