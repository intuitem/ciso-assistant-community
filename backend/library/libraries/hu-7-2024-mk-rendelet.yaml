        ttm\u0171k\xF6d\xE9s kereteit \xE9s a megfelel\u0151s\xE9gi krit\xE9riumokat,\
        \ tov\xE1bb\xE1\n8.1.1.1.2. \xF6sszhangban van a szervezetre vonatkoz\xF3\
        , hat\xE1lyos jogszab\xE1lyokkal, ir\xE1nyelvekkel. szab\xE1lyoz\xE1sokkal,\
        \ szabv\xE1nyokkal \xE9s aj\xE1nl\xE1sokkal.\n8.1.1.2. az azonos\xEDt\xE1\
        si \xE9s hiteles\xEDt\xE9si elj\xE1r\xE1srendet, amely az azonos\xEDt\xE1\
        si \xE9s hiteles\xEDt\xE9si szab\xE1lyzat \xE9s az ahhoz kapcsol\xF3d\xF3\
        \ ellen\u0151rz\xE9sek megval\xF3s\xEDt\xE1s\xE1t seg\xEDti el\u0151.\n8.1.2.\
        \ Kijel\xF6l egy, a szervezet \xE1ltal meghat\xE1rozott szem\xE9lyt, aki az\
