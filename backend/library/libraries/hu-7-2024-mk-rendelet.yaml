        sszhangban a szervezet konfigur\xE1ci\xF3kezel\xE9si szab\xE1lyaival.\n18.8.3.\
        \ A k\xE1rt\xE9kony k\xF3dok elleni v\xE9delmi mechanizmusokat \xFAgy konfigur\xE1\
        lja, hogy:\n18.8.3.1. Meghat\xE1rozott id\u0151k\xF6z\xF6nk\xE9nt \xE1tvizsg\xE1\
        lja a rendszert, \xE9s val\xF3s id\u0151ben ellen\u0151rzi a k\xFCls\u0151\
        \ forr\xE1sokb\xF3l sz\xE1rmaz\xF3 f\xE1jlokat a v\xE9gpontokon, a h\xE1l\xF3\
        zati bel\xE9p\xE9si vagy kil\xE9p\xE9si pontokon a biztons\xE1gi szab\xE1\
        lyzatnak megfelel\u0151en, amint a f\xE1jlokat let\xF6ltik, megnyitj\xE1k\
        \ vagy futtatj\xE1k.\n18.8.3.2. K\xE1rt\xE9kony k\xF3d \xE9szlel\xE9sekor\
        \ blokkolja vagy karant\xE9nba helyezi a k\xE1rt\xE9kony k\xF3dokat, vagy\
        \ a szervezet \xE1ltal meghat\xE1rozott egy\xE9b int\xE9zked\xE9seket hajt\
        \ v\xE9gre; tov\xE1bb\xE1 riaszt\xE1st k\xFCld a szervezet \xE1ltal meghat\xE1\
        rozott szem\xE9lyeknek vagy szerepk\xF6r\xF6knek.\n18.8.4. Ellen\u0151rzi\
        \ a t\xE9ves riaszt\xE1sokat a k\xE1rt\xE9kony k\xF3d \xE9szlel\xE9se \xE9\
        s megsemmis\xEDt\xE9se sor\xE1n, valamint figyelembe veszi ezek lehets\xE9\
