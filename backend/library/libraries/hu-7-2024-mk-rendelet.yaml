      description: "8.21. A szervezet a hiteles\xEDt\u0151 eszk\xF6z\xF6ket az al\xE1\
        bbiak szerint kezeli:\n8.21.1. A kezdeti hiteles\xEDt\u0151 eszk\xF6z kioszt\xE1\
