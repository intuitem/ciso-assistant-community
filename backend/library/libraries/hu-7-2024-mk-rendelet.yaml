        \ szerepk\xF6r\xF6ket, felel\u0151ss\xE9geket, a kapcsolattart\xF3 szem\xE9\
        lyeket \xE9s azok el\xE9rhet\u0151s\xE9geit;\n7.2.1.4. meghat\xE1rozza az\
        \ EIR \xF6sszeoml\xE1sa, kompromitt\xE1l\xF3d\xE1sa vagy hib\xE1ja ellen\xE9\
        re is biztos\xEDtand\xF3 szolg\xE1ltat\xE1sokat;\n7.2.1.5. tartalmazza az\
        \ EIR v\xE9gleges, teljesk\xF6r\u0171 helyre\xE1ll\xEDt\xE1s\xE1nak terv\xE9\
        t, mely garant\xE1lja, hogy az eredetileg tervezett \xE9s megval\xF3s\xED\
        tott v\xE9delmi int\xE9zked\xE9sek a helyre\xE1ll\xEDt\xE1s ut\xE1n ne s\xE9\
        r\xFCljenek;\n7.2.1.6. szab\xE1lyozza az \xFCzletmenet-folytonoss\xE1gi inform\xE1\
        ci\xF3k megoszt\xE1s\xE1t; \xE9s\n7.2.1.7. a szervezet \xE1ltal meghat\xE1\
        rozott szem\xE9lyek vagy szerepk\xF6r\xF6k \xE1ltal fel\xFClvizsg\xE1lt \xE9\
        s j\xF3v\xE1hagyott.\n7.2.2. Megfogalmazza, \xE9s a szervezetre \xE9rv\xE9\
        nyes k\xF6vetelm\xE9nyek szerint dokument\xE1lja, valamint A szervezeten bel\xFC\
        l kiz\xE1r\xF3lag a folyamatos m\u0171k\xF6d\xE9s szempontj\xE1b\xF3l kulcsfontoss\xE1\
        g\xFA, n\xE9vvel vagy szerepk\xF6rrel azonos\xEDtott szem\xE9lyek \xE9s szervezeti\
        \ egys\xE9gek sz\xE1m\xE1ra kihirdeti az EIR-ekre vonatkoz\xF3 \xFCzletmenet-folytonoss\xE1\
        gi tervet.\n7.2.3. \xD6sszehangolja a folyamatos m\u0171k\xF6d\xE9s tervez\xE9\
        s\xE9re vonatkoz\xF3 tev\xE9kenys\xE9geket a biztons\xE1gi esem\xE9nyek kezel\xE9\
        s\xE9vel;\n7.2.4. Meghat\xE1rozott gyakoris\xE1ggal fel\xFClvizsg\xE1lja az\
        \ EIR-hez kapcsol\xF3d\xF3 \xFCzletmenet-folytonoss\xE1gi tervet.\n7.2.5.\
        \ Az EIR vagy a m\u0171k\xF6d\xE9si k\xF6rnyezet v\xE1ltoz\xE1sainak, az \xFC\
