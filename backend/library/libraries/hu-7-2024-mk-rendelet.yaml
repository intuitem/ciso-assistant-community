      delmi int\xE9zked\xE9s (\xE9rt\xE9kelhet\u0151).\nMegval\xF3s\xEDt\xE1si csoportok:\
      \ a biztons\xE1gi oszt\xE1ly (A \u2013 Alap, J \u2013 Jelent\u0151s, M \u2013\
      \ Magas; az oszt\xE1lyok egym\xE1sra \xE9p\xFClnek) \xE9s a k\xF6vetelm\xE9\
      nycsoport 1/2025. (I. 31.) SZTFH rendelet 6. mell\xE9klete szerinti jellege\
      \ (SZ \u2013 szervezeti szint\u0171, EIR \u2013 EIR-szint\u0171) egy\xFCtt adja\
      \ a csoportot: A-SZ 82, A-EIR 82, J-SZ 108, J-EIR 194, M-SZ 132, M-EIR 253 k\xF6\
      vetelm\xE9nycsoport; KIEG \u2013 egyik oszt\xE1lyn\xE1l sem elv\xE1rt, kieg\xE9\
      sz\xEDt\u0151 v\xE9delmi int\xE9zked\xE9sek (529 k\xF6vetelm\xE9nycsoport, 2.\
      \ mell\xE9klet 20.4. pont, a 6. mell\xE9klet nem ad jelleget).\nHaszn\xE1lat\
      \ (az 1/2025. (I. 31.) SZTFH rendelet 5. mell\xE9klete szerint): szervezeti\
      \ audit \u2013 a szervezet legmagasabb biztons\xE1gi oszt\xE1ly\xFA EIR-je szerinti\
      \ SZ csoport, valamennyi EIR-re egys\xE9gesen (2.2.1.1., 2.2.3.1. \xE9s 2.2.3.2.\
      \ pont), pl. M-SZ; EIR-audit \u2013 az EIR biztons\xE1gi oszt\xE1ly\xE1nak EIR\
      \ csoportja (2.2.1.2. pont), pl. A-EIR, amely a legmagasabb oszt\xE1ly SZ csoportj\xE1\
      val eg\xE9sz\xEDthet\u0151 ki, ha a v\xE9delmi megfelel\xE9si indexbe (VMI)\
      \ a szervezeti szint\u0171 csoportokat is be kell sz\xE1m\xEDtani (2.2.5.7.\
      \ pont), pl. A-EIR + M-SZ; egyetlen EIR-rel rendelkez\u0151 szervezet \u2013\
      \ az oszt\xE1ly SZ \xE9s EIR csoportja egy\xFCtt, pl. J-SZ + J-EIR. A szervezeti\
      \ audit a CISO Assistant \u201Ebaseline\u201D funkci\xF3j\xE1val az EIR-auditok\
      \ alapjak\xE9nt haszn\xE1lhat\xF3: a k\xF6z\xF6s k\xF6vetelm\xE9nyek eredm\xE9\
      nyei \xE1tm\xE1sol\xF3dnak.\nMegjegyz\xE9sek (annotation): a 6. mell\xE9klet\
      \ szerinti audit-jellemz\u0151k (a k\xF6vetelm\xE9nycsoport jellege, a k\xF6\
      telez\u0151en alkalmazand\xF3 vizsg\xE1lati m\xF3dszerek, t\xEDpusa, kiz\xE1\
      rhat\xF3s\xE1ga), a kihirdetett sz\xF6veg el\xEDr\xE1sai (v\xE1ltozatlanul \xE1\
      tv\xE9ve, a helyes alakkal), valamint az SZTFH mell\xE9kletek elt\xE9r\u0151\
      \ n\xE9v\xEDr\xE1sa.\nA 2. mell\xE9klet 20.6. pontja szerint a k\xF6vetelm\xE9\
      nyek sz\xF6vege a k\xF6vetelm\xE9nycsoport megnevez\xE9s\xE9vel egy\xFCtt \xE9\
      rtelmezend\u0151. Az elemi k\xF6vetelm\xE9ny szint\u0171 \xE9rt\xE9kel\xE9shez\
      \ (SZTFH-audit) a hu-1-2025-sztfh-rendelet-elemi-kovetelmenyek k\xF6nyvt\xE1\
      r szolg\xE1l; a k\xE9t keretrendszer k\xF6vetelm\xE9nycsoportjainak ref_id-ja\
      \ azonos."
