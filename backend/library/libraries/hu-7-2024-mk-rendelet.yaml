name: "7/2024. (VI. 24.) MK rendelet \u2013 V\xE9delmi int\xE9zked\xE9sek katal\xF3\
  gusa (NIS2)"
description: "A 7/2024. (VI. 24.) MK rendelet 2. mell\xE9klete (V\xE9delmi int\xE9\
  zked\xE9sek katal\xF3gusa): 19 k\xF6vetelm\xE9nycsal\xE1d, 914 k\xF6vetelm\xE9nycsoport\
  \ (v\xE9delmi int\xE9zked\xE9s) az Alap, Jelent\u0151s \xE9s Magas biztons\xE1gi\
  \ oszt\xE1lyok jel\xF6l\xE9s\xE9vel; minden k\xF6vetelm\xE9nycsoport \xE9rt\xE9\
  kelhet\u0151. A megjegyz\xE9sek az 1/2025. (I. 31.) SZTFH rendelet 6. mell\xE9klete\
  \ szerinti audit-jellemz\u0151ket is tartalmazz\xE1k.\nMegval\xF3s\xEDt\xE1si csoportok\
  \ (implementation group): a biztons\xE1gi oszt\xE1ly \xE9s a k\xF6vetelm\xE9nycsoport\
  \ 1/2025. (I. 31.) SZTFH rendelet 6. mell\xE9klete szerinti jellege (szervezeti\
  \ szint\u0171 / EIR-szint\u0171) egy\xFCtt (A-SZ, A-EIR, J-SZ, J-EIR, M-SZ, M-EIR),\
  \ valamint a kieg\xE9sz\xEDt\u0151 int\xE9zked\xE9sek (KIEG).\nAz SZTFH rendelet\
  \ 7. mell\xE9klete szerinti elemi k\xF6vetelm\xE9nyek (az audit n\xE9zete) a hu-1-2025-sztfh-rendelet-elemi-kovetelmenyek\
  \ k\xF6nyvt\xE1rban, a 3. mell\xE9klet fenyeget\xE9skatal\xF3gusa (47 fenyeget\xE9\
  s) a hu-7-2024-mk-rendelet-fenyegetesek k\xF6nyvt\xE1rban tal\xE1lhat\xF3.\nSz\xF6\
  veg\xE1llapot: a 7/2024. MK rendelet njt.hu szerinti egys\xE9ges szerkezete (2025.\
  \ 01. 02., a 18/2024. (XII. 30.) MK rendelet m\xF3dos\xEDt\xE1s\xE1val), az 1/2025.\
  \ SZTFH rendelet Magyar K\xF6zl\xF6nyben kihirdetett sz\xF6vege (2025/8. sz\xE1\
  m). A kihirdetett sz\xF6veg el\xEDr\xE1sai v\xE1ltozatlanul szerepelnek, a megjegyz\xE9\
  sekben jel\xF6lve."
copyright: "A jogszab\xE1lyok sz\xF6vege a szerz\u0151i jogr\xF3l sz\xF3l\xF3 1999.\
  \ \xE9vi LXXVI. t\xF6rv\xE9ny 1. \xA7 (4) bekezd\xE9se alapj\xE1n nem \xE1ll szerz\u0151\
  i jogi v\xE9delem alatt. Forr\xE1sok: Magyar K\xF6zl\xF6ny 2024/68., 2024/137. \xE9\
  s 2025/8. sz\xE1m, Nemzeti Jogszab\xE1lyt\xE1r (njt.hu). Hungarian legal texts are\
  \ not subject to copyright (Act LXXVI of 1999, Section 1(4))."
