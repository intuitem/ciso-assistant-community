        \ egy\xE9n, csoport, szerepk\xF6r, szolg\xE1ltat\xE1s vagy eszk\xF6z identit\xE1\
        s\xE1t.\n8.21.2. Meghat\xE1rozza a szervezet \xE1ltal kiadott hiteles\xED\
        t\u0151 eszk\xF6z kezdeti tartalm\xE1t.\n8.21.3. Biztos\xEDtja, hogy a hiteles\xED\
        t\u0151 eszk\xF6z\xF6k a tervezett felhaszn\xE1l\xE1shoz megfelel\u0151 er\u0151\
        ss\xE9g\u0171 mechanizmussal rendelkezzenek.\n8.21.4. Adminisztrat\xEDv elj\xE1\
        r\xE1sokat alak\xEDt ki \xE9s hajt v\xE9gre a kezdeti hiteles\xEDt\u0151 eszk\xF6\
        z\xF6k kioszt\xE1s\xE1hoz, az elveszett, kompromitt\xE1lt vagy s\xE9r\xFC\
        lt hiteles\xEDt\u0151 eszk\xF6z\xF6kh\xF6z, valamint a hiteles\xEDt\u0151\
        \ eszk\xF6z\xF6k visszavon\xE1s\xE1hoz.\n8.21.5. Gondoskodik a hiteles\xED\
        t\u0151 eszk\xF6z\xF6k kezdeti tartalm\xE1nak megv\xE1ltoztat\xE1s\xE1r\xF3\
        l az els\u0151 haszn\xE1lat el\u0151tt.\n8.21.6. Gondoskodik a hiteles\xED\
        t\u0151 eszk\xF6z\xF6k tartalm\xE1nak megv\xE1ltoztat\xE1s\xE1r\xF3l vagy\
        \ friss\xEDt\xE9s\xE9r\u0151l meghat\xE1rozott gyakoris\xE1ggal, vagy amikor\
        \ meghat\xE1rozott esem\xE9nyek bek\xF6vetkeznek.\n8.21.7. Megv\xE9di a hiteles\xED\
        t\u0151 eszk\xF6z\xF6k tartalm\xE1t az illet\xE9ktelen nyilv\xE1noss\xE1gra\
        \ hozatal \xE9s m\xF3dos\xEDt\xE1s ellen.\n8.21.8. Megk\xF6veteli, hogy az\
        \ egy\xE9nek \xE9s eszk\xF6z\xF6k konkr\xE9t v\xE9delmi int\xE9zked\xE9seket\
