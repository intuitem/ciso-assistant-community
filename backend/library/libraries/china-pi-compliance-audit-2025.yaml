urn: urn:intuitem:risk:library:china-pi-compliance-audit-2025
locale: zh
ref_id: china-pi-compliance-audit-2025
name: 个人信息保护合规审计管理办法及指引
description: |-
  《个人信息保护合规审计管理办法》（国家互联网信息办公室令第18号，2025年2月12日公布，自2025年5月1日起施行）及其附件《个人信息保护合规审计指引》。

  个人信息处理者自行开展或者按照保护部门要求委托专业机构开展个人信息保护合规审计的，应当参照该指引。处理超过1000万人个人信息的个人信息处理者，应当每两年至少开展一次合规审计。

  来源：https://www.cac.gov.cn/2025-02/14/c_1741233507681519.htm
copyright: 国家互联网信息办公室 / Cyberspace Administration of China
version: 1
publication_date: '2026-10-09'
provider: CAC
packager: intuitem
translations:
  en:
    name: China PI Protection Compliance Audit Measures and Guideline
    description: |-
      Administrative Measures for Personal Information Protection Compliance Audits (CAC Order No. 18, issued February 12, 2025, in force since May 1, 2025) and their annex, the Personal Information Protection Compliance Audit Guideline.

      Personal information processors conducting a compliance audit themselves, or through a professional institution at the request of the authorities, must refer to the Guideline. Processors handling the personal information of more than 10 million people must be audited at least once every two years.

      The Chinese text is the only official one. The English text is an unofficial translation by intuitem.

      Source: https://www.cac.gov.cn/2025-02/14/c_1741233507681519.htm
