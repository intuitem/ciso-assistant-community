urn: urn:intuitem:risk:library:plumber-cicd-checks
locale: en
ref_id: plumber-cicd-checks
name: Plumber CI/CD Security Checks
description: |-
  CI/CD pipeline security checks performed by Plumber, the open-source CI/CD security scanner for GitLab CI and GitHub Actions (getplumber.io).
  Each requirement corresponds to a Plumber control (the .plumber.yaml key). Based on plumber v0.4.28 (commit 0637800).
  https://github.com/getplumber/plumber
copyright: Plumber contributors - Mozilla Public License 2.0
version: 1
publication_date: 2026-08-05
provider: Plumber
packager: intuitem
objects:
  framework:
    urn: urn:intuitem:risk:framework:plumber-cicd-checks
    ref_id: plumber-cicd-checks
    name: Plumber CI/CD Security Checks
    description: |-
      CI/CD pipeline security checks performed by Plumber, the open-source CI/CD security scanner for GitLab CI and GitHub Actions. Each assessable requirement is a Plumber control — the ref_id is the .plumber.yaml key that enables it. The annotation lists the ISSUE codes the control emits, with their severity, remediation and documentation URL.
      Implementation groups reflect what Plumber actually runs: controls whose rules are implemented but not yet enforced upstream (pending test coverage) are grouped under 'not-enforced' and can only be assessed manually.
    implementation_groups_definition:
      - ref_id: github
        name: GitHub Actions
        description:
          Controls Plumber enforces when scanning GitHub Actions workflows and repository
          settings.
      - ref_id: gitlab
        name: GitLab CI
        description:
          Controls Plumber enforces when scanning GitLab CI pipelines and project
          settings.
      - ref_id: common
        name: Cross-provider
        description:
          Controls Plumber enforces on both GitHub and GitLab — the provider-agnostic
          core.
      - ref_id: not-enforced
        name: Not yet enforced
        description:
          Controls implemented in Plumber but held back from enforcement pending
          test coverage. No scan reports on them; assess them manually or exclude them.
    requirement_nodes:
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        assessable: false
        depth: 1
        ref_id: "1"
        name: Supply chain
        description:
          "Integrity and provenance of the third-party building blocks a pipeline
          executes: container images, GitHub Actions references, ambiguous tag/branch refs,
          Dockerfile base images, build caches and released artefacts."
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionpincommentsmustmatchsha
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionPinCommentsMustMatchSha
        name: Action Pin Comments Must Match SHA
        description:
          A workflow pins an action by commit SHA and adds a trailing `# vX.Y.Z`
          comment to document the intended version, but the SHA does not correspond to the tag
          named in the comment. Reviewers scanning diffs trust that annotation and miss the
          discrepancy, so silent downgrades (or upgrades that claim to be a patch) slip through
          review unnoticed.
        annotation: |-
          Severity: ISSUE-708 medium.
          - ISSUE-708 (medium) `# vX.Y.Z` comment does not match the SHA
            Either update the SHA to the one the tag points at, or update the comment to the tag that actually corresponds to the SHA. `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` returns the SHA the tag resolves to.
            https://getplumber.io/docs/cli/issues/ISSUE-708
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionpinsmustnotbestale
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionPinsMustNotBeStale
        name: Action Pins Must Not Be Stale
        description:
          "A workflow pins an action to a commit SHA that predates the repository's
          most recent release. The SHA may still work today, but it is missing security fixes,
          dependency updates, and runtime compatibility changes shipped in later releases. Dependabot's
          `version-update-strategy: sha-and-version` handles the upgrade loop once configured."
        annotation: |-
          Severity: ISSUE-709 low.
          - ISSUE-709 (low) Action pin is behind the latest upstream release
            Update the pin to the SHA of the latest release, and refresh the trailing `# vX.Y.Z` comment. Enable Dependabot with `package-ecosystem: github-actions` and `version-update-strategy: sha-and-version` to keep the pins fresh automatically.
            https://getplumber.io/docs/cli/issues/ISSUE-709
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionrefsmustexistupstream
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionRefsMustExistUpstream
        name: Action Refs Must Exist Upstream
        description:
          A workflow pins an action to a commit SHA that does not resolve in the
          action's upstream repository. That means either the SHA was mistyped (the reference
          silently runs whatever tag/branch GitHub falls back to, typically the default branch)
          or — far worse — the author was tricked by a PR comment / stargazer dashboard showing
          a detached commit that was never merged upstream. The name-and-SHA combination is
          the precise form of the `impostor commit` attack documented in academic supply-chain
          literature.
        annotation: |-
          Severity: ISSUE-707 critical.
          - ISSUE-707 (critical) Pinned commit SHA does not belong to the action's repository
            Replace the reference with a SHA that actually belongs to the action's repository. Use `gh api repos/<owner>/<repo>/commits/<sha>` to verify before committing the change.
            https://getplumber.io/docs/cli/issues/ISSUE-707
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionsmustbepinnedbycommitsha
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionsMustBePinnedByCommitSha
        name: Actions Must Be Pinned By Commit SHA
        description:
          A GitHub Actions workflow references a third-party action with a mutable
          ref (tag or branch) instead of a 40-character commit SHA. Tag and branch refs can
          be reassigned by the action's maintainer — or by an attacker who compromises the action's
          repository — to point at arbitrary code, which then runs inside the caller workflow
          with its secrets. The March 2025 tj-actions/changed-files compromise (CVE-2025-30066)
          propagated this way to hundreds of repositories, including aquasecurity/trivy.
        annotation: |-
          Severity: ISSUE-701 high.
          - ISSUE-701 (high) Third-party action reference is not pinned by commit SHA
            Replace `uses: owner/action@v4` with `uses: owner/action@<40-char-sha>` and add a `# vX.Y.Z` comment to document the version. Tools like Dependabot's `version-update-strategy: sha-and-version` can automate the update flow. Official GitHub-owned actions (actions/*, github/*) can be excluded if they are in the workflow's trusted boundary.
            https://getplumber.io/docs/cli/issues/ISSUE-701
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionsmustnotbearchived
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionsMustNotBeArchived
        name: Actions Must Not Be Archived
        description:
          A GitHub Actions workflow references an action whose upstream repository
          is archived. Archived repos no longer receive maintenance — security fixes, dependency
          bumps, compatibility patches all stop — and any existing vulnerability stays open
          forever. A new SHA can still be pushed by the last maintainer, so even pinning by
          SHA does not make the reference safe against a future takeover.
        annotation: |-
          Severity: ISSUE-702 high.
          - ISSUE-702 (high) Action is hosted in an archived repository
            Replace the action with a maintained fork (audit the fork's owner first) or with an equivalent step implemented inline. If the behaviour is trivial, inlining the shell logic avoids the supply-chain dependency entirely.
            https://getplumber.io/docs/cli/issues/ISSUE-702
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionsmustnotcarryknowncves
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionsMustNotCarryKnownCVEs
        name: Actions Must Not Carry Known CVEs
        description:
          "The pinned version of this action appears in the GitHub Advisory Database
          under the `actions` ecosystem. Running a workflow on a known-vulnerable action version
          inherits the published vulnerability class (RCE, secret exfiltration, privilege escalation,
          depending on the advisory). Examples from history: tj-actions/changed-files (CVE-2025-30066),
          reviewdog/action-setup with the March 2025 compromise, unpatched releases of `actions/artifact`.
          This check reports every advisory whose affected-version range covers the pinned ref."
        annotation: |-
          Severity: ISSUE-703 critical.
          - ISSUE-703 (critical) Action version carries a published security advisory
            Upgrade the action to a version outside the advisory's affected range (the advisory page lists a fixed-in version). Pin by SHA once upgraded so future retags cannot silently revert the fix. Configure Dependabot with `package-ecosystem: github-actions` to receive PR alerts when new advisories land.
            https://getplumber.io/docs/cli/issues/ISSUE-703
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionsmustnotduplicaterunnerbuiltins
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionsMustNotDuplicateRunnerBuiltins
        name: Actions Must Not Duplicate Runner Builtins
        description:
          "A workflow uses a third-party action to do something the GitHub-hosted
          runner already provides out of the box: `gh` CLI operations wrapped by `peter-evans/create-pull-request`,
          basic cache operations that `actions/cache` already covers, `nick-invision/retry`
          for a one-line `bash` retry loop. Each extra action is an extra supply-chain dependency
          for zero capability gain — the sort of reference where an `impostor-commit`, a tag
          retag, or a compromise of the upstream account buys the attacker a foothold with no
          functional reason to have taken that risk."
        annotation: |-
          Severity: ISSUE-711 low.
          - ISSUE-711 (low) Third-party action duplicates functionality already on the runner
            Replace the action with the equivalent inline shell step using the runner's built-in tooling (`gh pr create`, `gh release`, simple `bash` retry loops). Keeps the workflow readable AND removes a supply-chain link. When the capability is non-trivial (artifact caching, matrix fan-out), prefer the official `actions/*` action over a third-party duplicate.
            https://getplumber.io/docs/cli/issues/ISSUE-711
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:actionsmustnotexecutemutableremotecode
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: actionsMustNotExecuteMutableRemoteCode
        name: Actions Must Not Execute Mutable Remote Code
        description: |-
          A third-party action's own source fetches and executes a script from a MOVING ref (a branch such as main/master, not a tag or SHA) of another repository at runtime, and does not verify the download against a checksum. Pinning the action by commit SHA does not reach this: the fetched code can change with nothing committed where the pin can see it, so a compromise or retag of that upstream branch runs arbitrary code in the job with its token and secrets. The canonical example is anchore/scan-action, which fetches `raw.githubusercontent.com/anchore/grype/main/install.sh` and runs it. This is a static, text-level match on the action's source: it catches the in-the-open shape, not an author who deliberately hides the fetch (see ISSUE-715), so a clean result asserts 'no known pattern seen', not 'safe'.
          The action's own source decodes and then executes code: `base64 -d | sh`, `eval "$(… | base64 -d)"`, `eval(atob(…))`, `new Function(atob(x))`, a hex/xxd decode piped to a shell, and similar. No legitimate action needs to hide what it runs at runtime, so obfuscation-then-execute is treated as the strongest signal regardless of the host, ref, or encoding used. This deliberately does NOT chase every possible encoding (an unbounded space); it flags the act of hiding itself, which is what makes a clean result meaningful here.
          Plumber could not fetch the action's own source (a network error, API rate limit, GitHub Enterprise Server host, private repo, or a Docker-image action) so it could not confirm whether the action fetches mutable remote code at runtime. This is surfaced as an explicit could-not-verify finding rather than a silent pass, because a silent pass would let the same repository score differently across CI environments and would over-claim safety on an unchecked dependency.
        annotation: |-
          Severity: ISSUE-714 high / ISSUE-715 critical / ISSUE-716 low.
          - ISSUE-714 (high) Action fetches and runs remote code from a mutable ref (in the open)
            Prefer an action that pins its downloads to an immutable ref AND verifies a checksum. Otherwise install the tool yourself from a pinned release, verify it against a checksum committed to your repo, and run it directly; or vendor the action and pin its internal fetch. A fetch that already verifies a pinned checksum is content-pinned and is not flagged here.
            https://getplumber.io/docs/cli/issues/ISSUE-714
          - ISSUE-715 (critical) Action obfuscates a remote code fetch/exec
            Remove the obfuscation. If the action is a dependency, drop or vendor it and replace the hidden fetch with an explicit, pinned, checksum-verified install. An action that must decode data at runtime should not feed that decoded value into a shell or eval.
            https://getplumber.io/docs/cli/issues/ISSUE-715
          - ISSUE-716 (low) Action source could not be verified
            Re-run where the action source is reachable (authenticated token, network access) to get a definitive result, or vendor the action so its source is local and auditable. This finding is informational: it flags an unchecked dependency, not a confirmed problem.
            https://getplumber.io/docs/cli/issues/ISSUE-716
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:containercredentialsmustcomefromsecrets
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: containerCredentialsMustComeFromSecrets
        name: Container Credentials Must Come From Secrets
        description:
          A GitHub Actions workflow sets `jobs.<name>.container.credentials.password`
          to a literal string instead of a `${{ secrets.X }}` reference. The password is committed
          to the repository's history in plain text; anyone with read access — including the
          entire public on a public repo — can retrieve it, and rotating it requires rewriting
          history to purge the leak.
        annotation: |-
          Severity: ISSUE-704 critical.
          - ISSUE-704 (critical) Container registry password is hard-coded in the workflow
            Store the password in a repository, environment, or organization secret and reference it via `${{ secrets.<NAME> }}`. If the password is already exposed in git history, rotate it immediately and purge the literal with `git filter-repo` or a BFG run before re-publishing.
            https://getplumber.io/docs/cli/issues/ISSUE-704
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:containerimagemustcomefromauthorizedsources
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: containerImageMustComeFromAuthorizedSources
        name: Container Image Must Come From Authorized Sources
        description:
          A container image is pulled from a registry that is not listed in the authorized
          sources. Using untrusted registries increases supply chain attack risk.
        annotation: |-
          Severity: ISSUE-101 high.
          - ISSUE-101 (high) Untrusted image source
            Use images from an authorized registry configured in .plumber.yaml under containerImageMustComeFromAuthorizedSources.authorizedSources, or add the registry to the authorized list.
            https://getplumber.io/docs/cli/issues/ISSUE-101
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:containerimagemustnotuseforbiddentags
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: containerImageMustNotUseForbiddenTags
        name: Container Image Must Not Use Forbidden Tags
        description: |-
          A container image in the pipeline uses a tag that is forbidden by the configuration (e.g., 'latest', 'dev'). Mutable tags make builds non-reproducible because the underlying image can change without notice.
          A container image in the pipeline is not pinned by its SHA256 digest. Without digest pinning, a tag can be reassigned to a different image, introducing supply chain risks.
        annotation: |-
          Severity: ISSUE-102 medium / ISSUE-103 high.
          - ISSUE-102 (medium) Forbidden container image tag
            Pin the image to a specific immutable version tag (e.g., 'python:3.12.1' instead of 'python:latest'). Configure forbidden tags in .plumber.yaml under containerImageMustNotUseForbiddenTags.forbiddenTags.
            https://getplumber.io/docs/cli/issues/ISSUE-102
          - ISSUE-103 (high) Container image is not pinned by digest
            Pin the image using its digest: 'image: registry.example.com/myimage@sha256:abc123...'. You can find the digest with 'docker inspect --format={{.RepoDigests}} <image>'.
            https://getplumber.io/docs/cli/issues/ISSUE-103
        implementation_groups:
          - github
          - gitlab
          - common
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:dockerfilesmustpinbaseimagebydigest
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: dockerfilesMustPinBaseImageByDigest
        name: Dockerfiles Must Pin Base Image By Digest
        description:
          "A Dockerfile at the root of the repository (or under a known build directory)
          uses `FROM image:tag` without a `@sha256:…` digest. Tags are mutable at the registry
          level: an attacker who compromises the registry — or the image maintainer — can re-push
          the same tag to point at a different layer, silently injecting code into every later
          build that pulls the reference. The supply chain of the downstream artefact then inherits
          that substitution. Pinning by digest is the single control that neutralises this vector."
        annotation: |-
          Severity: ISSUE-706 medium.
          - ISSUE-706 (medium) Dockerfile FROM reference is not pinned by digest
            Replace `FROM image:tag` with `FROM image:tag@sha256:…`. `docker inspect --format='{{index .RepoDigests 0}}' image:tag` prints the digest for the tag you just pulled. Automate refresh with Dependabot or Renovate (`package-ecosystem: docker`, `version-update-strategy: sha-and-version`) so the pin stays current.
            https://getplumber.io/docs/cli/issues/ISSUE-706
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:externalrefsmustnotcollide
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: externalRefsMustNotCollide
        name: External Refs Must Not Collide
        description:
          "An external CI reference is pinned to a name that exists upstream **as
          both a tag and a branch** (classic case: a tag `v1` kept in parallel with a branch
          `v1`). This covers GitHub Actions `uses:` refs and GitLab `include:` project `ref:`
          / component `@version` refs. The platform resolves the tag first, so today the pinned,
          tagged revision runs — but a maintainer rename, a typo, or a parameter that drops
          a character can switch the binding to the branch, which tracks every push. The ambiguity
          makes the reference fundamentally unreliable: the reviewer cannot tell from the YAML
          alone which of the two upstream revisions will execute, and the referenced code runs
          in the pipeline with its secrets and tokens."
        annotation: |-
          Severity: ISSUE-402 medium.
          - ISSUE-402 (medium) Reference collides with both a tag and a branch
            Pin the reference to a 40-character commit SHA (preferred), which is unambiguous. Alternatively, ask the upstream maintainer to remove one of the two colliding refs; keeping both is a supply-chain landmine for every caller.
            https://getplumber.io/docs/cli/issues/ISSUE-402
        implementation_groups:
          - github
          - gitlab
          - common
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:githubactionmustcomefromauthorizedsources
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: githubActionMustComeFromAuthorizedSources
        name: GitHub Action Must Come From Authorized Sources
        description:
          A GitHub Actions workflow references an action whose source is not authorized.
          Every third-party action runs with the caller workflow's token and secrets, so an
          unvetted owner is a direct supply-chain entry point — the vector behind the tj-actions/changed-files
          compromise (CVE-2025-30066), where an attacker also exploited repository rename/re-creation
          to squat a once-trusted name. Restricting actions to GitHub-official owners, an explicit
          org allowlist, and a minimum-popularity floor shrinks that attack surface to vetted
          sources.
        annotation: |-
          Severity: ISSUE-713 high.
          - ISSUE-713 (high) Action comes from an unauthorized source
            Use an action from an authorized source. Configure the allowlist in .plumber.yaml under githubActionMustComeFromAuthorizedSources: keep trustGithubOfficialActions on for actions/* and github/*, add trusted owners or actions to trustedGithubActions (exact `owner/repo` or `owner/*`), and optionally set minimumStars to require a popularity threshold. Vendoring the action into a local `./.github/actions/…` directory removes the external dependency entirely.
            https://getplumber.io/docs/cli/issues/ISSUE-713
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:releaseworkflowsmustnotrestoreuntrustedcache
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: releaseWorkflowsMustNotRestoreUntrustedCache
        name: Release Workflows Must Not Restore Untrusted Cache
        description:
          "A release, tag or publish workflow uses `actions/cache@*` (or an equivalent
          cache action) without scoping the cache key to the ref being released. Caches on GitHub
          Actions are shared across branches according to the fallback rules: a malicious PR
          run on a feature branch can populate the same cache key that the release job later
          restores, silently injecting compiled artefacts, dependencies, or build scripts into
          the published output. Past supply-chain incidents have abused exactly this fallback
          to publish compromised packages to PyPI and npm."
        annotation: |-
          Severity: ISSUE-705 high.
          - ISSUE-705 (high) Release/publish workflow may consume a poisoned build cache
            Either disable the cache entirely on release/publish jobs, or scope the `key:` to the ref being released (e.g. `key: release-${{ github.ref_name }}-${{ hashFiles('**/go.sum') }}`) without a `restore-keys:` fallback that reaches into PR-populated entries. Verify artefacts against a checksum after restoring.
            https://getplumber.io/docs/cli/issues/ISSUE-705
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:releaseworkflowsmustsignartefacts
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
        ref_id: releaseWorkflowsMustSignArtefacts
        name: Release Workflows Must Sign Artefacts
        description:
          A workflow runs a release or publish action (goreleaser, softprops/action-gh-release,
          pypa publish, npm-publish, docker build+push) without invoking any signing step. Consumers
          pulling the released artefact have no cryptographic handle to verify the artefact
          was built by the expected pipeline rather than tampered with along the way (cache
          poisoning, compromised runner, repository takeover). Signing (Sigstore cosign, GPG,
          SLSA provenance) turns 'I trust this came from that repo' into a falsifiable statement.
        annotation: |-
          Severity: ISSUE-712 medium.
          - ISSUE-712 (medium) Release / publish workflow produces unsigned artefacts
            Add a signing step to the release job: `sigstore/cosign-installer` followed by `cosign sign <artefact>` for container images, `sigstore/gh-action-sigstore-python` for Python wheels, `crazy-max/ghaction-import-gpg` + `gpg --detach-sign` for tarballs, or `--snapshot-github-actions` on goreleaser with the signing pipeline configured. Publish the `.sig` / `.asc` alongside the artefact in the release assets.
            https://getplumber.io/docs/cli/issues/ISSUE-712
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        assessable: false
        depth: 1
        ref_id: "2"
        name: Expressions and injections
        description:
          "Safe handling of CI/CD variables and template expressions: debug traces,
          unsafe expansion, template injection of user- or maintainer-controlled values into
          shell scripts, and deprecated workflow commands."
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustnotenabledebugtrace
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: pipelineMustNotEnableDebugTrace
        name: Pipeline Must Not Enable Debug Trace
        description:
          The pipeline has CI_DEBUG_TRACE or CI_DEBUG_SERVICES enabled, which exposes
          all secret variables in the job log output. This is a critical security risk in production
          pipelines.
        annotation: |-
          Severity: ISSUE-203 critical.
          - ISSUE-203 (critical) Pipeline enables CI debug trace
            Remove or set CI_DEBUG_TRACE and CI_DEBUG_SERVICES to 'false' in your .gitlab-ci.yml variables section. These should only be used temporarily for debugging and never committed.
            https://getplumber.io/docs/cli/issues/ISSUE-203
        implementation_groups:
          - github
          - gitlab
          - common
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustnotoverridejobvariables
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: pipelineMustNotOverrideJobVariables
        name: Pipeline Must Not Override Job Variables
        description:
          A CI/CD variable that should only be set in GitLab CI/CD Settings (as a
          protected or project-level variable) is redefined in the pipeline configuration. This
          can neutralize security scanners, disable protections, or alter intended behavior.
        annotation: |-
          Severity: ISSUE-205 high.
          - ISSUE-205 (high) Job variable overrides controlled variable
            Remove the variable from .gitlab-ci.yml and set it in GitLab CI/CD Settings > Variables instead. Configure the list of controlled variables in .plumber.yaml under pipelineMustNotOverrideJobVariables.variables.
            https://getplumber.io/docs/cli/issues/ISSUE-205
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustnotuseunsafevariableexpansion
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: pipelineMustNotUseUnsafeVariableExpansion
        name: Pipeline Must Not Use Unsafe Variable Expansion
        description:
          A dangerous CI variable is expanded in a shell re-interpretation context
          (eval, sh -c, bash -c, source, etc.). The expanded value is executed as code, enabling
          command injection if the variable is user-controlled.
        annotation: |-
          Severity: ISSUE-204 medium.
          - ISSUE-204 (medium) Unsafe variable expansion
            Avoid passing variables to commands that re-interpret input as shell code. Use the variable in a safe context (e.g. echo, env) or sanitize/allowlist values. Configure dangerousVariables and allowedPatterns in .plumber.yaml under pipelineMustNotUseUnsafeVariableExpansion.
            https://getplumber.io/docs/cli/issues/ISSUE-204
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowconditionsmustbesound
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowConditionsMustBeSound
        name: Workflow Conditions Must Be Sound
        description:
          'A GitHub Actions `if:` expression contains a pattern that cannot be evaluated
          as intended: a tautology (`always() || ...`, `true == true`), a contradiction (`false
          && anything`), or a bare boolean string that is not wrapped in `${{ }}` (GitHub parses
          it as the literal string "true" / "false", which is always truthy). The gate the author
          thought they installed is not actually there — the step/job runs unconditionally (or
          never), usually silently.'
        annotation: |-
          Severity: ISSUE-211 medium.
          - ISSUE-211 (medium) Unsound `if:` condition (tautology, contradiction, or missing ${{ }})
            Review the condition: remove dead branches (`always()` short-circuits OR), wrap every template expression in `${{ … }}`, and prefer simple comparisons over nested constructs. For debugging, `if: ${{ github.event_name == 'push' }}` is safer than `if: github.event_name == 'push'` which often parses as the literal string.
            https://getplumber.io/docs/cli/issues/ISSUE-211
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowcontainscallsmustbesound
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowContainsCallsMustBeSound
        name: Workflow Contains Calls Must Be Sound
        description:
          "A GitHub Actions expression calls `contains()` with arguments in the wrong
          order or of incompatible types. The signature is `contains(haystack, needle)`: passing
          a single string as the first argument and a whole expression as the second inverts
          the semantics and the gate never matches the intended case. A common failure mode
          is `contains('main', github.ref)` — the literal `'main'` does not contain the
          full ref `refs/heads/main`, so the check always fails even on the `main` branch."
        annotation: |-
          Severity: ISSUE-212 medium.
          - ISSUE-212 (medium) `contains()` built-in misused (argument order or type)
            Use `contains(github.ref, 'refs/heads/main')` — the ref is the haystack, the branch name is the needle. For filter lists, convert to a set: `contains(fromJSON('["main", "release"]'), github.ref_name)` makes the intent explicit.
            https://getplumber.io/docs/cli/issues/ISSUE-212
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotexportentiregithubcontext
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowMustNotExportEntireGitHubContext
        name: Workflow Must Not Export Entire GitHub Context
        description:
          "A `run:` step, env binding or action input serialises the whole `github`
          context (or `github.event`) with `toJson(...)`. The resulting JSON carries every user-controllable
          field GitHub exposes — PR title, issue body, fork branch name, commit message — bundled
          with metadata the workflow might otherwise believe is trusted. Any downstream consumer
          (log line, third-party action, HTTP header) then sees a payload that is trivially
          shell-injectable under a privileged trigger (`pull_request_target`, `workflow_run`).
          Same risk class as ISSUE-207 template-injection, but the dump form is worse: a single
          `echo $JSON` leaks the full attack surface rather than one field."
        annotation: |-
          Severity: ISSUE-213 high.
          - ISSUE-213 (high) Entire `github` context serialised with toJson(github)
            Never pass the `github` context whole. Extract the exact fields you need into named `env:` bindings first (`env: { PR_TITLE: ${{ github.event.pull_request.title }} }`), then reference the environment variable from the shell — expansion quotes the value automatically. If the downstream tool genuinely requires JSON, build it explicitly from the named fields with `jq -n --arg title "$PR_TITLE" '{title: $title}'`.
            https://getplumber.io/docs/cli/issues/ISSUE-213
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotinjectuserinputinscripts
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowMustNotInjectUserInputInScripts
        name: Workflow Must Not Inject User Input In Scripts
        description:
          A GitHub Actions workflow inlines user-controlled template expressions
          (github.event.*, github.head_ref, ...) directly into a `run:` shell script. Attacker-controlled
          values such as PR titles, issue bodies or fork branch names can break out of the intended
          string and execute arbitrary commands with the job's secrets.
        annotation: |-
          Severity: ISSUE-207 critical.
          - ISSUE-207 (critical) Template injection in workflow script
            Move the template expression into an `env:` binding first, then reference the environment variable from the shell (`"$TITLE"`). Shell expansion of a bound variable quotes the value and neutralises injection payloads.
            https://getplumber.io/docs/cli/issues/ISSUE-207
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotinjectvarsinscripts
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowMustNotInjectVarsInScripts
        name: Workflow Must Not Inject Vars In Scripts
        description:
          "A `run:` step inlines a `${{ vars.X }}` or `${{ inputs.X }}` expression
          directly into the shell command. `vars` values come from repository / organisation
          / environment variables set by maintainers; `inputs` values come from the caller of
          a reusable workflow. Neither is PR-author-controlled by default (ISSUE-207 covers
          that case), but both flip to attacker-controlled under specific conditions: a compromised
          maintainer account, a misconfigured org-level variable, or a caller workflow that
          proxies `github.event.*` into a reusable-workflow input. The canonical remediation
          is identical to ISSUE-207: bind the value through `env:` first, then reference the
          environment variable from the shell so expansion quotes it automatically."
        annotation: |-
          Severity: ISSUE-215 low.
          - ISSUE-215 (low) Maintainer-adjacent template (`vars.*` or `inputs.*`) expanded into a shell script
            Replace `${{ vars.X }}` / `${{ inputs.X }}` in the `run:` body with an `env:` binding plus `$X` dereference. Example: `env: { REGISTRY: ${{ vars.REGISTRY }} }` at the step, then `docker login "$REGISTRY"` in the script.
            https://getplumber.io/docs/cli/issues/ISSUE-215
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotreenableinsecurecommands
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowMustNotReEnableInsecureCommands
        name: Workflow Must Not Re-Enable Insecure Commands
        description:
          A GitHub Actions job re-enables the deprecated `::set-env::` / `::add-path::`
          workflow commands via ACTIONS_ALLOW_UNSECURE_COMMANDS. Those commands were disabled
          after CVE-2020-15228 because attacker-controlled log output can rewrite the running
          job's environment and PATH.
        annotation: |-
          Severity: ISSUE-208 high.
          - ISSUE-208 (high) Deprecated workflow commands re-enabled
            Remove the `ACTIONS_ALLOW_UNSECURE_COMMANDS` environment variable. Use the `$GITHUB_ENV` and `$GITHUB_PATH` files explicitly when you need to propagate values, and validate any untrusted content before writing to them.
            https://getplumber.io/docs/cli/issues/ISSUE-208
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnottrustspoofableactorchecks
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowMustNotTrustSpoofableActorChecks
        name: Workflow Must Not Trust Spoofable Actor Checks
        description:
          "A GitHub Actions workflow gates behaviour on `github.actor`, `github.triggering_actor`
          or equivalent identity strings (`dependabot[bot]`, `renovate[bot]`, a specific username)
          without cryptographic backing. Those values are filled from whoever opened or synchronised
          the PR — an attacker can open a fork PR using a crafted username, or in some trigger
          types the `actor` field reflects the fork author, not the verified bot. Any step that
          trusts such a check (`if: github.actor == 'dependabot[bot]'`) can be bypassed by
          a malicious contributor forging the right login."
        annotation: |-
          Severity: ISSUE-210 high.
          - ISSUE-210 (high) Workflow gates behaviour on a spoofable actor/bot check
            Never grant elevated behaviour based on `github.actor` / `github.triggering_actor` alone. For Dependabot-specific flows use the `pull_request` event with a separate privileged workflow triggered by `pull_request_target` only after a manual review, or rely on branch protections. For bots, verify the commit signature/author via git rather than the GitHub actor string.
            https://getplumber.io/docs/cli/issues/ISSUE-210
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotwriteuntrustedcontenttogithubenv
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowMustNotWriteUntrustedContentToGitHubEnv
        name: Workflow Must Not Write Untrusted Content To GitHub Env
        description:
          A GitHub Actions `run:` step appends a user-controlled value (PR title,
          issue body, fork branch name, ...) to `$GITHUB_ENV` or `$GITHUB_PATH`. The appended
          value becomes an environment variable or PATH entry for every subsequent step in the
          job. An attacker who controls the value can override existing variables (for example
          `NODE_OPTIONS=--require=./exfil.js`) or inject a malicious directory at the front
          of PATH, hijacking any later `npm`, `bash`, etc. invocation and exfiltrating secrets
          from privileged triggers.
        annotation: |-
          Severity: ISSUE-209 high.
          - ISSUE-209 (high) Untrusted content written to $GITHUB_ENV or $GITHUB_PATH
            Do not write user-controlled values into `$GITHUB_ENV` or `$GITHUB_PATH`. If you must propagate a value derived from user input, bind it through an `env:` block first (`env: { TITLE: ${{ github.event.issue.title }} }`) and validate/escape it before writing — or pass it as a step output instead. Restrict workflows touching these files to non-PR triggers when possible.
            https://getplumber.io/docs/cli/issues/ISSUE-209
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustpinpackageinstalls
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
        ref_id: workflowMustPinPackageInstalls
        name: Workflow Must Pin Package Installs
        description:
          A `run:` step invokes `pip install PKG` or `npm install PKG` without a
          pinned version (`pip install pkg==1.2.3`, `npm install pkg@1.2.3`) and without a lockfile
          install (`pip install -r requirements.txt`, `npm ci`). Every run then resolves whatever
          is latest on the registry at execution time — a window exploited repeatedly by typosquat
          and maintainer-account compromise attacks. Lockfiles (`package-lock.json`, `poetry.lock`,
          `pdm.lock`, …) combined with `npm ci` / `pip install -r requirements.txt --require-hashes`
          turn every run into a reproducible, verifiable install.
        annotation: |-
          Severity: ISSUE-214 medium.
          - ISSUE-214 (medium) Package installed without a pinned version or lockfile
            Replace `pip install pkg` with `pip install -r requirements.txt` (with hashes generated via `pip-compile --generate-hashes`) or pin every package explicitly: `pip install 'pkg==1.2.3'`. Replace `npm install pkg` with `npm ci` once the lockfile is committed. Enable Dependabot or Renovate on the locked manifest so upgrades still flow, reviewed, rather than silently.
            https://getplumber.io/docs/cli/issues/ISSUE-214
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        assessable: false
        depth: 1
        ref_id: "3"
        name: Secrets, credentials and permissions
        description:
          "Protection of secrets and tokens consumed by pipelines: hardcoded leaks,
          over-broad forwarding, redaction bypasses, token lifetime, environment gating and
          explicit workflow permissions."
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:checkoutmustnotpersistcredentials
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: checkoutMustNotPersistCredentials
        name: Checkout Must Not Persist Credentials
        description:
          A GitHub Actions job runs `actions/checkout` without disabling credential
          persistence. By default the action writes GITHUB_TOKEN into the cloned repository's
          .git/config. Any subsequent step that uploads `.git` as part of an artifact, or executes
          fork-controlled code, can exfiltrate the token.
        annotation: |-
          Severity: ISSUE-307 high.
          - ISSUE-307 (high) Checkout persists credentials in .git/config
            Add `with: { persist-credentials: false }` on every `uses: actions/checkout@*` step unless the job legitimately needs to push back. When push is required, scope the token with an explicit `permissions:` block.
            https://getplumber.io/docs/cli/issues/ISSUE-307
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:deployjobsmustuseenvironmentgate
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: deployJobsMustUseEnvironmentGate
        name: Deploy Jobs Must Use Environment Gate
        description:
          A GitHub Actions job that consumes production secrets (deploy, release,
          publish) does not declare an `environment:` field. Environments are the gatekeeper
          GitHub exposes for required reviewers, wait timers, and deployment branch rules —
          without one, any caller on the configured trigger goes straight to the secret-bearing
          step, no human-in-the-loop. Combined with a spoofable trigger (ISSUE-802) or an over-broad
          branch pattern, the secret can be exfiltrated without any review.
        annotation: |-
          Severity: ISSUE-305 medium.
          - ISSUE-305 (medium) Deploy / release job uses secrets without an `environment:` gate
            Put production secrets behind environments. Attach the environment to the deploy job (`environment: production`) and configure required reviewers / wait timers on the environment in the repository settings.
            https://getplumber.io/docs/cli/issues/ISSUE-305
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:githubapptokensmustberevokedonexit
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: githubAppTokensMustBeRevokedOnExit
        name: GitHub App Tokens Must Be Revoked On Exit
        description:
          "A workflow step that mints a GitHub App installation token (e.g. `actions/create-github-app-token`)
          sets `skip-token-revoke: true`. That keeps the minted token alive after the workflow
          finishes, which turns a scoped, short-lived credential into a long-lived one. Any
          later leak (log fragment, restored cache, exfiltrated artefact) hands the attacker
          a working token well after the run completes, instead of getting back a revoked one."
        annotation: |-
          Severity: ISSUE-306 high.
          - ISSUE-306 (high) GitHub App token issued with revocation disabled
            Remove the `skip-token-revoke: true` input (the default is to revoke). Only keep revocation disabled for workflows that legitimately need to hand the token to a downstream step launched after this workflow — and even then, prefer re-minting it fresh in the downstream workflow.
            https://getplumber.io/docs/cli/issues/ISSUE-306
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:reusableworkflowsmustnotinheritsecrets
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: reusableWorkflowsMustNotInheritSecrets
        name: Reusable Workflows Must Not Inherit Secrets
        description:
          "A GitHub Actions job calls a reusable workflow (`jobs.<name>.uses: owner/repo/.github/workflows/x.yml@ref`)
          with `secrets: inherit`. The call forwards every secret visible to the caller — repo,
          organisation, environment — to the reusable workflow, regardless of what the reusable
          workflow actually needs. A compromise of the reusable workflow (upstream maintainer
          account, malicious PR merged on the reusable side, tag retag) then sees the full secret
          surface of every caller."
        annotation: |-
          Severity: ISSUE-302 high.
          - ISSUE-302 (high) Reusable workflow called with `secrets: inherit`
            Replace `secrets: inherit` with an explicit mapping that names only the secrets the reusable workflow needs: `secrets: { NPM_TOKEN: ${{ secrets.NPM_TOKEN }} }`. For internal reusable workflows hosted in the same repository the risk is lower but the principle stands — narrow the scope so a future incident exposes a minimum.
            https://getplumber.io/docs/cli/issues/ISSUE-302
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotexportentiresecretscontext
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: workflowMustNotExportEntireSecretsContext
        name: Workflow Must Not Export Entire Secrets Context
        description:
          A GitHub Actions workflow serialises the whole `secrets` context with `toJson(secrets)`
          or `toJSON(secrets)` and pipes the result into a step's environment, run script, or
          `with:` input. The resulting string contains every secret the job has access to —
          repository, organisation and environment — and travels through whatever downstream
          consumer the step passes it to (a third-party action, a remote server, a log line).
          Even with GitHub's automatic log redaction, a single `echo` of the JSON payload has
          been enough to leak tokens in past supply-chain incidents; a compromised reusable
          action sees them directly regardless of logging.
        annotation: |-
          Severity: ISSUE-309 critical.
          - ISSUE-309 (critical) Entire secrets context exported via toJson(secrets)
            Pass only the specific secrets the step needs, by name: `env: { TOKEN: ${{ secrets.NPM_TOKEN }} }`. If the step forwards credentials to a reusable workflow, name each one in the `secrets:` block of the call rather than using `toJson(secrets)`.
            https://getplumber.io/docs/cli/issues/ISSUE-309
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotindexsecretsdynamically
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: workflowMustNotIndexSecretsDynamically
        name: Workflow Must Not Index Secrets Dynamically
        description:
          "A workflow reads `${{ secrets[expr] }}` where `expr` is not a quoted literal
          — typically an `env.VAR_NAME`, `inputs.NAME`, or a computed expression. The dynamic
          form lets the runtime resolve the secret name at execution, which effectively hands
          read access to every secret the job can see to whatever source controls `expr`. When
          `expr` comes from a maintainer-controlled env binding the risk is theoretical, but
          the pattern is brittle: a rename of the named secret, or a later refactor that introduces
          a template expression at the indexed position, silently promotes the weakness. Prefer
          naming each secret directly so the grant surface is explicit in the workflow source."
        annotation: |-
          Severity: ISSUE-308 low.
          - ISSUE-308 (low) Secret accessed via a dynamic index `secrets[expr]`
            Replace `${{ secrets[env.X] }}` with a direct reference `${{ secrets.EXPECTED_NAME }}`. When a matrix really needs to select among N secrets, split the job into N copies with static names rather than indexing; the verbosity is worth the reviewability.
            https://getplumber.io/docs/cli/issues/ISSUE-308
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotunredactsecretsviafromjson
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: workflowMustNotUnredactSecretsViaFromJSON
        name: Workflow Must Not Unredact Secrets Via fromJSON
        description:
          A GitHub Actions workflow dereferences a secret value with `fromJSON(secrets.X).y`
          — once fromJSON parses the secret, the inner fields are fresh strings GitHub does
          not recognise as masked values. Anything that echoes the sub-field (print, log, HTTP
          header, error message) leaks the plaintext to the job log.
        annotation: |-
          Severity: ISSUE-303 high.
          - ISSUE-303 (high) Secret dereferenced via fromJSON bypasses log redaction
            Pass structured secrets through `env:` bindings that reference each leaf individually (`env: { API_KEY: ${{ secrets.MY_API_KEY }} }`) so log redaction keeps working. If a JSON blob must be split, do it inside a step that never echoes the result and writes only the necessary parts back to the environment.
            https://getplumber.io/docs/cli/issues/ISSUE-303
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowsmustdeclarepermissions
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
        ref_id: workflowsMustDeclarePermissions
        name: Workflows Must Declare Permissions
        description:
          "A GitHub Actions workflow declares neither a workflow-level nor per-job
          `permissions:` block. The runner then falls back to the repository-wide default GITHUB_TOKEN
          permissions — often `contents: write` or `read-all` — giving every step more authority
          than it needs. Any compromise (unpinned action, template-injection, cache poisoning)
          inherits the full default scope."
        annotation: |-
          Severity: ISSUE-801 medium.
          - ISSUE-801 (medium) Workflow has no explicit `permissions:` block
            Declare the narrowest permissions explicitly: `permissions: { contents: read }` at the workflow level and widen per-job only when a step needs to push, comment on issues, etc. This enforces the principle of least privilege regardless of the repo default setting.
            https://getplumber.io/docs/cli/issues/ISSUE-801
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        assessable: false
        depth: 1
        ref_id: "4"
        name: Triggers and composition
        description:
          "Governance of what a pipeline is made of and what it executes: required
          templates and components, hardcoded jobs, weakened security jobs, unverified script
          execution, Docker-in-Docker and dangerous triggers."
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:includesmustbeuptodate
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: includesMustBeUpToDate
        name: Includes Must Be Up To Date
        description:
          An included CI/CD component or template is not using the latest available
          version. Outdated versions may miss security patches, bug fixes, or improvements.
        annotation: |-
          Severity: ISSUE-403 low.
          - ISSUE-403 (low) Outdated template
            Update the include to use the latest version. Check the component/template repository for the latest release and update the version reference in your .gitlab-ci.yml.
            https://getplumber.io/docs/cli/issues/ISSUE-403
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:includesmustnotuseforbiddenversions
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: includesMustNotUseForbiddenVersions
        name: Includes Must Not Use Forbidden Versions
        description:
          An included CI/CD component or template uses a version that is explicitly
          forbidden (e.g., a mutable branch reference like 'main' instead of a tagged version).
        annotation: |-
          Severity: ISSUE-404 medium.
          - ISSUE-404 (medium) Forbidden include version
            Replace the forbidden version with an authorized version format. Use semantic version tags (e.g., '1.2.3' or '~latest') instead of branch names or mutable references as configured in .plumber.yaml.
            https://getplumber.io/docs/cli/issues/ISSUE-404
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustincludecomponent
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: pipelineMustIncludeComponent
        name: Pipeline Must Include Component
        description: |-
          A CI/CD component required by the configuration is not included in the pipeline. This means a mandatory compliance check or security scan is missing.
          A required CI/CD component is included but some of its job keys are overridden locally, which may alter the intended behavior of the compliance check.
        annotation: |-
          Severity: ISSUE-408 high / ISSUE-409 medium.
          - ISSUE-408 (high) Missing required component
            Add the required component to your .gitlab-ci.yml using 'include:' with the component path specified in your .plumber.yaml under pipelineMustIncludeComponent.
            https://getplumber.io/docs/cli/issues/ISSUE-408
          - ISSUE-409 (medium) Forbidden override of required component
            Remove the local overrides on the component's jobs. If customization is needed, check if the component provides input variables for configuration instead of overriding job keys directly.
            https://getplumber.io/docs/cli/issues/ISSUE-409
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustincludetemplate
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: pipelineMustIncludeTemplate
        name: Pipeline Must Include Template
        description: |-
          A CI/CD template required by the configuration is not included in the pipeline. This means a mandatory workflow step is missing.
          A required CI/CD template is included but some of its job keys are overridden locally, which may alter the intended behavior.
        annotation: |-
          Severity: ISSUE-405 high / ISSUE-406 medium.
          - ISSUE-405 (high) Missing required template
            Add the required template to your .gitlab-ci.yml using 'include:' with the template path specified in your .plumber.yaml under pipelineMustIncludeTemplate.
            https://getplumber.io/docs/cli/issues/ISSUE-405
          - ISSUE-406 (medium) Forbidden override of required template
            Remove the local overrides on the template's jobs. If customization is needed, check if the template provides variables for configuration instead of overriding job keys directly.
            https://getplumber.io/docs/cli/issues/ISSUE-406
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustnotexecuteunverifiedscripts
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: pipelineMustNotExecuteUnverifiedScripts
        name: Pipeline Must Not Execute Unverified Scripts
        description:
          "A CI/CD job executes a script without integrity verification: pipe-to-shell
          (curl | bash), download-then-exec, redirect-then-exec, base64-decode-to-shell (Megalodon-style),
          or any command piped into bash/sh. An attacker can exfiltrate CI secrets via a compromised
          URL or obfuscated inline payload."
        annotation: |-
          Severity: ISSUE-411 high.
          - ISSUE-411 (high) Unverified script execution
            Download scripts to a file, verify checksum or signature on the same line, then execute. Avoid piping remote or encoded content directly into a shell. Vendor scripts in-repo or use trusted package managers.
            https://getplumber.io/docs/cli/issues/ISSUE-411
        implementation_groups:
          - github
          - gitlab
          - common
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustnotincludehardcodedjobs
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: pipelineMustNotIncludeHardcodedJobs
        name: Pipeline Must Not Include Hardcoded Jobs
        description:
          A job in the pipeline is defined directly in the CI configuration instead
          of being sourced from a CI/CD component or include. Hardcoded jobs bypass governance
          and standardization.
        annotation: |-
          Severity: ISSUE-401 medium.
          - ISSUE-401 (medium) Hardcoded job
            Replace the hardcoded job with a CI/CD component or an include from an approved catalog. Use 'include:' or 'component:' directives in your .gitlab-ci.yml.
            https://getplumber.io/docs/cli/issues/ISSUE-401
        implementation_groups:
          - gitlab
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pipelinemustnotusedockerindocker
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: pipelineMustNotUseDockerInDocker
        name: Pipeline Must Not Use Docker In Docker
        description: |-
          A CI/CD job uses a Docker-in-Docker (dind) service. On shared runners running in privileged mode, this enables container escape, lateral movement, and access to secrets from other jobs on the same runner.
          A CI/CD job uses Docker-in-Docker with an insecure daemon configuration. Setting DOCKER_TLS_CERTDIR to an empty string or using DOCKER_HOST with tcp://...:2375 disables TLS encryption between the CI job and the Docker daemon, allowing network-level eavesdropping and command injection.
        annotation: |-
          Severity: ISSUE-412 high / ISSUE-413 high.
          - ISSUE-412 (high) Docker-in-Docker service detected
            Replace Docker-in-Docker with a safer alternative such as Kaniko or Buildah for building container images. These tools do not require privileged mode and avoid the security risks of running a Docker daemon inside a CI container.
            https://getplumber.io/docs/cli/issues/ISSUE-412
          - ISSUE-413 (high) Docker-in-Docker with insecure daemon configuration
            If Docker-in-Docker is required, ensure TLS is enabled: do not set DOCKER_TLS_CERTDIR to an empty string, and use tcp://docker:2376 (TLS) instead of tcp://docker:2375 (plaintext). Prefer Kaniko or Buildah to avoid this pattern entirely.
            https://getplumber.io/docs/cli/issues/ISSUE-413
        implementation_groups:
          - github
          - gitlab
          - common
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:pullrequesttargetmustnotcheckouthead
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: pullRequestTargetMustNotCheckoutHead
        name: Pull Request Target Must Not Checkout Head
        description:
          "A workflow triggered by `pull_request_target` calls `actions/checkout`
          with an explicit `ref:` pointing at the pull request's head (e.g. `github.event.pull_request.head.sha`,
          `github.head_ref`). This is the exact pattern behind the March 2025 tj-actions/changed-files
          compromise (CVE-2025-30066): the workflow has access to the base repository's secrets
          AND it executes code controlled by the PR author. Any shell step that runs after the
          checkout is a direct path to secret exfiltration. Unlike the broader dangerous-triggers
          check (ISSUE-802) which flags the trigger itself, this rule flags the actual exploitable
          combination."
        annotation: |-
          Severity: ISSUE-804 critical.
          - ISSUE-804 (critical) pull_request_target workflow explicitly checks out the PR head
            Either switch to the standard `pull_request` event (runs in the fork's context, no base-repo secrets), or remove the explicit `ref:` input so `actions/checkout` falls back to the base repository's SHA. If cross-context code must be examined, split the job: a small pull_request_target job gathers metadata, then hands off to a separate pull_request workflow that executes the fork code.
            https://getplumber.io/docs/cli/issues/ISSUE-804
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:securityjobsmustnotbeweakened
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: securityJobsMustNotBeWeakened
        name: Security Jobs Must Not Be Weakened
        description:
          "A security job in the pipeline has been weakened by setting allow_failure
          to true, overriding rules with when: never or when: manual, or setting when to manual.
          This can cause critical security scans to be skipped or require manual intervention."
        annotation: |-
          Severity: ISSUE-410 critical.
          - ISSUE-410 (critical) Security job weakened
            Ensure security jobs run automatically and block the pipeline on failure. Remove allow_failure: true, do not override rules with when: never or when: manual, and do not set when: manual on security jobs.
            https://getplumber.io/docs/cli/issues/ISSUE-410
        implementation_groups:
          - github
          - gitlab
          - common
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustincluderequiredactions
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: workflowMustIncludeRequiredActions
        name: Workflow Must Include Required Actions
        description:
          A GitHub action or reusable workflow declared as required in `workflowMustIncludeRequiredActions.requiredGroups`
          is not referenced by any job or step in the project's `.github/workflows/` files.
          The missing reference means a mandatory security scan, compliance check, or organization-wide
          workflow is not actually running on this repository.
        annotation: |-
          Severity: ISSUE-417 high.
          - ISSUE-417 (high) Required action or reusable workflow is missing
            Add a `uses: <owner>/<repo>[@<ref>]` step that references the required action, or a `jobs.<name>.uses: <owner>/<repo>/.github/workflows/<file>.yml@<ref>` job that calls the required reusable workflow. The exact path declared in `.plumber.yaml` under `workflowMustIncludeRequiredActions` is matched ref-agnostically, so any pinned ref works.
            https://getplumber.io/docs/cli/issues/ISSUE-417
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotusedangeroustriggers
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
        ref_id: workflowMustNotUseDangerousTriggers
        name: Workflow Must Not Use Dangerous Triggers
        description:
          A GitHub Actions job is reachable via a trigger that runs with the base
          repository's secrets while being influenceable by an unprivileged caller (`workflow_run`,
          `issue_comment`, `pull_request_review`, `pull_request_review_comment`, `discussion`,
          `discussion_comment`, `gollum`, `fork`) AND it checks out fork-controlled code. The
          `pull_request_target` case is owned by ISSUE-804 (pull-request-target-with-head-checkout).
          This is the same exploit class as the March 2025 tj-actions/changed-files supply-chain
          compromise (CVE-2025-30066).
        annotation: |-
          Severity: ISSUE-802 critical.
          - ISSUE-802 (critical) Dangerous workflow trigger
            Prefer the standard `pull_request` trigger unless access to base-repo secrets is strictly required. If a secret-bearing trigger is necessary, never check out fork content and never render github.event.* / github.head_ref into shell commands. For `workflow_run`, keep the job restricted to non-secret-bearing steps.
            https://getplumber.io/docs/cli/issues/ISSUE-802
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:5
        assessable: false
        depth: 1
        ref_id: "5"
        name: Access and authorisation
        description:
          "Platform-side guardrails on who can change what: branch protection and
          overly broad workflow permission grants."
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:branchmustbeprotected
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:5
        ref_id: branchMustBeProtected
        name: Branch Must Be Protected
        description: |-
          A branch that should be protected according to the configuration has no protection rules. Unprotected branches allow direct pushes and force pushes, bypassing code review.
          A protected branch does not meet the required protection settings (e.g., force push allowed, access levels too permissive, code owner approval not required).
        annotation: |-
          Severity: ISSUE-501 critical / ISSUE-505 high.
          - ISSUE-501 (critical) Branch protection missing
            Enable branch protection in GitLab: Settings > Repository > Protected Branches. Add the branch with appropriate access levels for push and merge.
            https://getplumber.io/docs/cli/issues/ISSUE-501
          - ISSUE-505 (high) Branch protection configuration not compliant
            Update branch protection settings in GitLab: Settings > Repository > Protected Branches. Ensure force push is disabled, access levels meet the minimum, and code owner approval is required per your .plumber.yaml configuration.
            https://getplumber.io/docs/cli/issues/ISSUE-505
        implementation_groups:
          - github
          - gitlab
          - common
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotgrantpermissionswriteall
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:5
        ref_id: workflowMustNotGrantPermissionsWriteAll
        name: Workflow Must Not Grant Permissions Write All
        description:
          A GitHub Actions job's effective permissions block grants `write-all`,
          giving its GITHUB_TOKEN write access to every API scope regardless of what the job
          actually needs. Paired with a compromise through injection, dangerous triggers or
          a malicious action, this amplifies impact to full repository control.
        annotation: |-
          Severity: ISSUE-803 high.
          - ISSUE-803 (high) Excessive workflow permissions
            Declare the narrowest permissions block that lets the job do its work. Prefer `permissions: { contents: read }` at the workflow level and grant additional scopes only on the jobs that truly need them.
            https://getplumber.io/docs/cli/issues/ISSUE-803
        implementation_groups:
          - github
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        assessable: false
        depth: 1
        ref_id: "6"
        name: Workflow hygiene
        description:
          "Repository-level and workflow-level hygiene: concurrency, naming, obfuscation,
          trusted publishing, dependency update tooling, SAST coverage and security policy."
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:dependabotecosystemsmusthavecooldown
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: dependabotEcosystemsMustHaveCooldown
        name: Dependabot Ecosystems Must Have Cooldown
        description:
          An update ecosystem in `.github/dependabot.yml` declares no `cooldown:`
          block. Dependabot then opens a PR the instant a new upstream version is published
          — including when that version was uploaded minutes ago by a compromised maintainer
          account. A cooldown window (48–72 hours is common) gives the security-advisory pipeline
          time to flag a bad release before the automation merges it.
        annotation: |-
          Severity: ISSUE-902 low.
          - ISSUE-902 (low) Dependabot ecosystem has no cooldown window
            Add a `cooldown:` block to each update ecosystem: for example `cooldown: { default-days: 3, semver-major-days: 7, include: ["*"] }`. Adjust the window to fit the project's patching tolerance but never skip it for ecosystems that auto-merge.
            https://getplumber.io/docs/cli/issues/ISSUE-902
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:dependabotmustnotallowinsecureexternalcodeexecution
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: dependabotMustNotAllowInsecureExternalCodeExecution
        name: Dependabot Must Not Allow Insecure External Code Execution
        description:
          "The repository's `.github/dependabot.yml` sets `insecure-external-code-execution:
          allow` for one of its update ecosystems. Dependabot will then execute install / postinstall
          hooks from every candidate dependency version during its version-resolution passes,
          giving any compromised upstream package a path to run arbitrary code in the Dependabot
          runner — which holds privileged access to the repository via a non-auditable push
          token. This is the option Dependabot itself documents as dangerous and defaults to
          `deny`."
        annotation: |-
          Severity: ISSUE-901 critical.
          - ISSUE-901 (critical) Dependabot re-enables insecure external code execution
            Remove the `insecure-external-code-execution: allow` entry. If a specific ecosystem genuinely requires executing upstream scripts to resolve versions, scope the allowance narrowly with `enable-beta-ecosystems: false` and pair it with a dedicated runner isolation review — do not set it repository-wide.
            https://getplumber.io/docs/cli/issues/ISSUE-901
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:publishworkflowsmustuseoidctrustedpublishing
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: publishWorkflowsMustUseOidcTrustedPublishing
        name: Publish Workflows Must Use OIDC Trusted Publishing
        description:
          A GitHub Actions workflow publishes to PyPI, npm, or Maven Central using
          a long-lived `API_TOKEN` / `NPM_TOKEN` / `OSSRH_USERNAME` secret instead of OIDC-backed
          trusted publishing. Static publish tokens are reusable from anywhere they leak to
          — logs, build caches, malicious dependencies — whereas OIDC tokens are short-lived
          and bound to a specific repository / environment / workflow.
        annotation: |-
          Severity: ISSUE-421 high.
          - ISSUE-421 (high) Publish step relies on a static token instead of OIDC trusted publishing
            Migrate to trusted publishing: for PyPI set a publisher in the project settings and drop the token; for npm use the `--provenance` flag with OIDC; for Maven Central use the Sonatype portal's trusted publishing. Delete the static token once OIDC is live.
            https://getplumber.io/docs/cli/issues/ISSUE-421
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:repositoriesmustconfiguredependencyupdates
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: repositoriesMustConfigureDependencyUpdates
        name: Repositories Must Configure Dependency Updates
        description:
          The repository ships CI/CD workflows but neither `.github/dependabot.yml`
          nor `renovate.json` / `.renovaterc` is configured. Dependencies then drift as upstream
          security patches land — nothing opens the PRs that would pull them in. On a project
          with any third-party action pinning (which every sane workflow does), this means SHA
          pins go stale and every unpatched CVE for the pinned versions stays unreachable until
          a human remembers to refresh the locks.
        annotation: |-
          Severity: ISSUE-903 medium.
          - ISSUE-903 (medium) Repository has workflows but no dependency update tool
            Add `.github/dependabot.yml` with at minimum `package-ecosystem: github-actions` and your primary language ecosystem (npm, pip, gomod, etc.). For more configurable flows prefer Renovate: `npx -y renovate-config-validator` validates a `renovate.json` before commit.
            https://getplumber.io/docs/cli/issues/ISSUE-903
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:repositoriesmustpublishsecuritypolicy
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: repositoriesMustPublishSecurityPolicy
        name: Repositories Must Publish Security Policy
        description:
          "The repository has no `SECURITY.md` (nor `.github/SECURITY.md`, nor `docs/SECURITY.md`)
          documenting the vulnerability disclosure process. Researchers who find an issue have
          no public contact beyond opening a GitHub issue — which defeats coordinated disclosure
          and teaches them to dump vulnerabilities in the open. The file can be short: two lines
          naming the contact channel and the expected response window are enough to move reports
          off the public tracker."
        annotation: |-
          Severity: ISSUE-905 low.
          - ISSUE-905 (low) Repository has no SECURITY.md policy file
            Add a `SECURITY.md` at the repo root or under `.github/`. GitHub ships a template (New file → security policy). Include: the supported versions, the reporting channel (email / security@ / private advisory), the expected first-response SLA, and any bounty / safe-harbour terms the project honours.
            https://getplumber.io/docs/cli/issues/ISSUE-905
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:repositoriesmustrunsast
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: repositoriesMustRunSAST
        name: Repositories Must Run SAST
        description:
          None of the repository's workflows invokes a recognised SAST scanner (CodeQL,
          Semgrep, SonarQube, Trivy config scan, Snyk, FOSSA, etc.). Static analysis catches
          whole vulnerability classes — injection, unsafe deserialisation, crypto misuse — before
          they reach production; leaving it out of CI means the only gate is manual review,
          which misses regressions exactly when the diff is large.
        annotation: |-
          Severity: ISSUE-904 low.
          - ISSUE-904 (low) No static analysis scanner runs in CI
            Add a workflow that runs CodeQL (`github/codeql-action/init` + `analyze`, free for public repos), Semgrep, or an equivalent SAST scanner on pushes to the default branch and on pull requests. Enable GitHub's code-scanning alerts so findings open issues rather than sit in log output.
            https://getplumber.io/docs/cli/issues/ISSUE-904
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotcontainobfuscation
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: workflowMustNotContainObfuscation
        name: Workflow Must Not Contain Obfuscation
        description:
          A GitHub Actions `run:` script or an expression carries invisible characters
          — zero-width spaces, bidirectional override codepoints (Trojan Source, CVE-2021-42574),
          or homoglyph identifiers mixing Cyrillic / Greek letters with Latin. The rendered
          source reads harmless on GitHub while the runner executes a different instruction.
          This was seen in the wild in backdoored npm / PyPI packages and has been documented
          as a supply-chain attack primitive since 2021.
        annotation: |-
          Severity: ISSUE-420 high.
          - ISSUE-420 (high) Workflow script contains obfuscation (zero-width / bidi / non-ASCII homoglyphs)
            Strip non-ASCII characters from workflow scripts and expression references unless strictly necessary (localised strings, user-facing labels). Enable `.gitattributes` pre-commit checks that block zero-width and bidirectional Unicode in source files.
            https://getplumber.io/docs/cli/issues/ISSUE-420
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowmustnotuseknownmisfeatures
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: workflowMustNotUseKnownMisfeatures
        name: Workflow Must Not Use Known Misfeatures
        description:
          "A GitHub Actions workflow uses a pattern that is supported but widely
          considered harmful: `shell: cmd` / `shell: powershell` on Windows runners (legacy
          shells, weak quoting, historical CVEs), an inline pip/gem/bundler install against
          a network URL, or an `actions/upload-artifact` of the checkout directory (leaks `.git`
          including tokens if ISSUE-307 artipacked also fires)."
        annotation: |-
          Severity: ISSUE-419 medium.
          - ISSUE-419 (medium) Workflow uses a known misfeature pattern
            Switch Windows jobs to `shell: pwsh`. Vendor dependencies or use a pinned install step with checksums. Never upload the checkout directory as an artefact — upload the build output only.
            https://getplumber.io/docs/cli/issues/ISSUE-419
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowsmustdeclareconcurrency
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: workflowsMustDeclareConcurrency
        name: Workflows Must Declare Concurrency
        description:
          A GitHub Actions workflow declares no `concurrency:` block at either the
          workflow or the job level. Without it, concurrent pushes to the same branch (common
          during rebases and force-pushes) start parallel runs that race on caches, artifact
          uploads, and external state — and burn runner minutes. When the workflow deploys,
          it can also land stale state by overtaking a newer run.
        annotation: |-
          Severity: ISSUE-418 medium.
          - ISSUE-418 (medium) Workflow has no concurrency block
            Add a `concurrency` block that groups runs by ref: `concurrency: { group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true }`. For deploy workflows, keep `cancel-in-progress: false` so an in-flight deploy finishes cleanly.
            https://getplumber.io/docs/cli/issues/ISSUE-418
        implementation_groups:
          - not-enforced
      - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:workflowsmusthaveexplicitname
        assessable: true
        depth: 2
        parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
        ref_id: workflowsMustHaveExplicitName
        name: Workflows Must Have Explicit Name
        description:
          A GitHub Actions workflow file omits the top-level `name:` field, so GitHub
          falls back to the file path in the Actions UI, pull-request checks, required-status-check
          rules, and audit logs. In a repository with many workflows this makes dashboards harder
          to read and — more importantly — causes the required-status-check settings to bind
          to file paths that change with renames, silently disabling a compliance gate.
        annotation: |-
          Severity: ISSUE-601 low.
          - ISSUE-601 (low) Workflow has no explicit name
            Add a human-readable `name: <descriptive-name>` at the top of every workflow. Keep the name stable so branch protections and required status checks continue to match after renames.
            https://getplumber.io/docs/cli/issues/ISSUE-601
        implementation_groups:
          - not-enforced
