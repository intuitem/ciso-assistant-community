      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
      ref_id: ISSUE-411
      name: Unverified script execution
      description: 'A CI/CD job executes a script without integrity verification: pipe-to-shell
        (curl | bash), download-then-exec, redirect-then-exec, base64-decode-to-shell (Megalodon-style),
        or any command piped into bash/sh. An attacker can exfiltrate CI secrets via a compromised
        URL or obfuscated inline payload.'
      annotation: |-
        Severity: high. Plumber control: pipelineMustNotExecuteUnverifiedScripts.
        Remediation: Download scripts to a file, verify checksum or signature on the same line, then execute. Avoid piping remote or encoded content directly into a shell. Vendor scripts in-repo or use trusted package managers.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-411
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-412
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
      ref_id: ISSUE-412
      name: Docker-in-Docker service detected
      description: A CI/CD job uses a Docker-in-Docker (dind) service. On shared runners running
        in privileged mode, this enables container escape, lateral movement, and access to
        secrets from other jobs on the same runner.
      annotation: |-
        Severity: high. Plumber control: pipelineMustNotUseDockerInDocker.
        Remediation: Replace Docker-in-Docker with a safer alternative such as Kaniko or Buildah for building container images. These tools do not require privileged mode and avoid the security risks of running a Docker daemon inside a CI container.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-412
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-413
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
      ref_id: ISSUE-413
      name: Docker-in-Docker with insecure daemon configuration
      description: A CI/CD job uses Docker-in-Docker with an insecure daemon configuration.
        Setting DOCKER_TLS_CERTDIR to an empty string or using DOCKER_HOST with tcp://...:2375
        disables TLS encryption between the CI job and the Docker daemon, allowing network-level
        eavesdropping and command injection.
      annotation: |-
        Severity: high. Plumber control: pipelineMustNotUseDockerInDocker.
        Remediation: If Docker-in-Docker is required, ensure TLS is enabled: do not set DOCKER_TLS_CERTDIR to an empty string, and use tcp://docker:2376 (TLS) instead of tcp://docker:2375 (plaintext). Prefer Kaniko or Buildah to avoid this pattern entirely.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-413
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-417
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
      ref_id: ISSUE-417
      name: Required action or reusable workflow is missing
      description: A GitHub action or reusable workflow declared as required in `workflowMustIncludeRequiredActions.requiredGroups`
        is not referenced by any job or step in the project's `.github/workflows/` files.
        The missing reference means a mandatory security scan, compliance check, or organization-wide
        workflow is not actually running on this repository.
      annotation: |-
        Severity: high. Plumber control: workflowMustIncludeRequiredActions.
        Remediation: Add a `uses: <owner>/<repo>[@<ref>]` step that references the required action, or a `jobs.<name>.uses: <owner>/<repo>/.github/workflows/<file>.yml@<ref>` job that calls the required reusable workflow. The exact path declared in `.plumber.yaml` under `workflowMustIncludeRequiredActions` is matched ref-agnostically, so any pinned ref works.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-417
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-802
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
      ref_id: ISSUE-802
      name: Dangerous workflow trigger
      description: A GitHub Actions job is reachable via a trigger that runs with the base
        repository's secrets while being influenceable by an unprivileged caller (`workflow_run`,
        `issue_comment`, `pull_request_review`, `pull_request_review_comment`, `discussion`,
        `discussion_comment`, `gollum`, `fork`) AND it checks out fork-controlled code. The
        `pull_request_target` case is owned by ISSUE-804 (pull-request-target-with-head-checkout).
        This is the same exploit class as the March 2025 tj-actions/changed-files supply-chain
        compromise (CVE-2025-30066).
      annotation: |-
        Severity: critical. Plumber control: workflowMustNotUseDangerousTriggers.
        Remediation: Prefer the standard `pull_request` trigger unless access to base-repo secrets is strictly required. If a secret-bearing trigger is necessary, never check out fork content and never render github.event.* / github.head_ref into shell commands. For `workflow_run`, keep the job restricted to non-secret-bearing steps.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-802
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-804
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:4
      ref_id: ISSUE-804
      name: pull_request_target workflow explicitly checks out the PR head
      description: 'A workflow triggered by `pull_request_target` calls `actions/checkout`
        with an explicit `ref:` pointing at the pull request''s head (e.g. `github.event.pull_request.head.sha`,
        `github.head_ref`). This is the exact pattern behind the March 2025 tj-actions/changed-files
        compromise (CVE-2025-30066): the workflow has access to the base repository''s secrets
        AND it executes code controlled by the PR author. Any shell step that runs after the
        checkout is a direct path to secret exfiltration. Unlike the broader dangerous-triggers
        check (ISSUE-802) which flags the trigger itself, this rule flags the actual exploitable
        combination.'
      annotation: |-
        Severity: critical. Plumber control: pullRequestTargetMustNotCheckoutHead.
        Remediation: Either switch to the standard `pull_request` event (runs in the fork's context, no base-repo secrets), or remove the explicit `ref:` input so `actions/checkout` falls back to the base repository's SHA. If cross-context code must be examined, split the job: a small pull_request_target job gathers metadata, then hands off to a separate pull_request workflow that executes the fork code.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-804
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:5
      assessable: false
      depth: 1
      ref_id: '5'
      name: Access and authorisation
      description: 'Platform-side guardrails on who can change what: branch protection and
        overly broad workflow permission grants.'
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-501
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:5
      ref_id: ISSUE-501
      name: Branch protection missing
      description: A branch that should be protected according to the configuration has no
        protection rules. Unprotected branches allow direct pushes and force pushes, bypassing
        code review.
      annotation: |-
        Severity: critical. Plumber control: branchMustBeProtected.
        Remediation: Enable branch protection in GitLab: Settings > Repository > Protected Branches. Add the branch with appropriate access levels for push and merge.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-501
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-505
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:5
      ref_id: ISSUE-505
      name: Branch protection configuration not compliant
      description: A protected branch does not meet the required protection settings (e.g.,
        force push allowed, access levels too permissive, code owner approval not required).
      annotation: |-
        Severity: high. Plumber control: branchMustBeProtected.
        Remediation: Update branch protection settings in GitLab: Settings > Repository > Protected Branches. Ensure force push is disabled, access levels meet the minimum, and code owner approval is required per your .plumber.yaml configuration.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-505
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-803
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:5
      ref_id: ISSUE-803
      name: Excessive workflow permissions
      description: A GitHub Actions job's effective permissions block grants `write-all`,
        giving its GITHUB_TOKEN write access to every API scope regardless of what the job
        actually needs. Paired with a compromise through injection, dangerous triggers or
        a malicious action, this amplifies impact to full repository control.
      annotation: |-
        Severity: high. Plumber control: workflowMustNotGrantPermissionsWriteAll.
        Remediation: Declare the narrowest permissions block that lets the job do its work. Prefer `permissions: { contents: read }` at the workflow level and grant additional scopes only on the jobs that truly need them.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-803
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      assessable: false
      depth: 1
      ref_id: '6'
      name: Workflow hygiene
      description: 'Repository-level and workflow-level hygiene: concurrency, naming, obfuscation,
        trusted publishing, dependency update tooling, SAST coverage and security policy.'
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-418
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-418
      name: Workflow has no concurrency block
      description: A GitHub Actions workflow declares no `concurrency:` block at either the
        workflow or the job level. Without it, concurrent pushes to the same branch (common
        during rebases and force-pushes) start parallel runs that race on caches, artifact
        uploads, and external state — and burn runner minutes. When the workflow deploys,
        it can also land stale state by overtaking a newer run.
      annotation: |-
        Severity: medium. Plumber control: workflowsMustDeclareConcurrency.
        Remediation: Add a `concurrency` block that groups runs by ref: `concurrency: { group: ${{ github.workflow }}-${{ github.ref }}, cancel-in-progress: true }`. For deploy workflows, keep `cancel-in-progress: false` so an in-flight deploy finishes cleanly.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-418
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-419
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-419
      name: Workflow uses a known misfeature pattern
      description: 'A GitHub Actions workflow uses a pattern that is supported but widely
        considered harmful: `shell: cmd` / `shell: powershell` on Windows runners (legacy
        shells, weak quoting, historical CVEs), an inline pip/gem/bundler install against
        a network URL, or an `actions/upload-artifact` of the checkout directory (leaks `.git`
        including tokens if ISSUE-307 artipacked also fires).'
      annotation: |-
        Severity: medium. Plumber control: workflowMustNotUseKnownMisfeatures.
        Remediation: Switch Windows jobs to `shell: pwsh`. Vendor dependencies or use a pinned install step with checksums. Never upload the checkout directory as an artefact — upload the build output only.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-419
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-420
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-420
      name: Workflow script contains obfuscation (zero-width / bidi / non-ASCII homoglyphs)
      description: A GitHub Actions `run:` script or an expression carries invisible characters
        — zero-width spaces, bidirectional override codepoints (Trojan Source, CVE-2021-42574),
        or homoglyph identifiers mixing Cyrillic / Greek letters with Latin. The rendered
        source reads harmless on GitHub while the runner executes a different instruction.
        This was seen in the wild in backdoored npm / PyPI packages and has been documented
        as a supply-chain attack primitive since 2021.
      annotation: |-
        Severity: high. Plumber control: workflowMustNotContainObfuscation.
        Remediation: Strip non-ASCII characters from workflow scripts and expression references unless strictly necessary (localised strings, user-facing labels). Enable `.gitattributes` pre-commit checks that block zero-width and bidirectional Unicode in source files.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-420
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-421
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-421
      name: Publish step relies on a static token instead of OIDC trusted publishing
      description: A GitHub Actions workflow publishes to PyPI, npm, or Maven Central using
        a long-lived `API_TOKEN` / `NPM_TOKEN` / `OSSRH_USERNAME` secret instead of OIDC-backed
        trusted publishing. Static publish tokens are reusable from anywhere they leak to
        — logs, build caches, malicious dependencies — whereas OIDC tokens are short-lived
        and bound to a specific repository / environment / workflow.
      annotation: |-
        Severity: high. Plumber control: publishWorkflowsMustUseOidcTrustedPublishing.
        Remediation: Migrate to trusted publishing: for PyPI set a publisher in the project settings and drop the token; for npm use the `--provenance` flag with OIDC; for Maven Central use the Sonatype portal's trusted publishing. Delete the static token once OIDC is live.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-421
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-601
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-601
      name: Workflow has no explicit name
      description: A GitHub Actions workflow file omits the top-level `name:` field, so GitHub
        falls back to the file path in the Actions UI, pull-request checks, required-status-check
        rules, and audit logs. In a repository with many workflows this makes dashboards harder
        to read and — more importantly — causes the required-status-check settings to bind
        to file paths that change with renames, silently disabling a compliance gate.
      annotation: |-
        Severity: low. Plumber control: workflowsMustHaveExplicitName.
        Remediation: Add a human-readable `name: <descriptive-name>` at the top of every workflow. Keep the name stable so branch protections and required status checks continue to match after renames.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-601
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-901
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-901
      name: Dependabot re-enables insecure external code execution
      description: 'The repository''s `.github/dependabot.yml` sets `insecure-external-code-execution:
        allow` for one of its update ecosystems. Dependabot will then execute install / postinstall
        hooks from every candidate dependency version during its version-resolution passes,
        giving any compromised upstream package a path to run arbitrary code in the Dependabot
        runner — which holds privileged access to the repository via a non-auditable push
        token. This is the option Dependabot itself documents as dangerous and defaults to
        `deny`.'
      annotation: |-
        Severity: critical. Plumber control: dependabotMustNotAllowInsecureExternalCodeExecution.
        Remediation: Remove the `insecure-external-code-execution: allow` entry. If a specific ecosystem genuinely requires executing upstream scripts to resolve versions, scope the allowance narrowly with `enable-beta-ecosystems: false` and pair it with a dedicated runner isolation review — do not set it repository-wide.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-901
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-902
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-902
      name: Dependabot ecosystem has no cooldown window
      description: An update ecosystem in `.github/dependabot.yml` declares no `cooldown:`
        block. Dependabot then opens a PR the instant a new upstream version is published
        — including when that version was uploaded minutes ago by a compromised maintainer
        account. A cooldown window (48–72 hours is common) gives the security-advisory pipeline
        time to flag a bad release before the automation merges it.
      annotation: |-
        Severity: low. Plumber control: dependabotEcosystemsMustHaveCooldown.
        Remediation: Add a `cooldown:` block to each update ecosystem: for example `cooldown: { default-days: 3, semver-major-days: 7, include: ["*"] }`. Adjust the window to fit the project's patching tolerance but never skip it for ecosystems that auto-merge.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-902
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-903
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-903
      name: Repository has workflows but no dependency update tool
      description: The repository ships CI/CD workflows but neither `.github/dependabot.yml`
        nor `renovate.json` / `.renovaterc` is configured. Dependencies then drift as upstream
        security patches land — nothing opens the PRs that would pull them in. On a project
        with any third-party action pinning (which every sane workflow does), this means SHA
        pins go stale and every unpatched CVE for the pinned versions stays unreachable until
        a human remembers to refresh the locks.
      annotation: |-
        Severity: medium. Plumber control: repositoriesMustConfigureDependencyUpdates.
        Remediation: Add `.github/dependabot.yml` with at minimum `package-ecosystem: github-actions` and your primary language ecosystem (npm, pip, gomod, etc.). For more configurable flows prefer Renovate: `npx -y renovate-config-validator` validates a `renovate.json` before commit.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-903
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-904
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-904
      name: No static analysis scanner runs in CI
      description: None of the repository's workflows invokes a recognised SAST scanner (CodeQL,
        Semgrep, SonarQube, Trivy config scan, Snyk, FOSSA, etc.). Static analysis catches
        whole vulnerability classes — injection, unsafe deserialisation, crypto misuse — before
        they reach production; leaving it out of CI means the only gate is manual review,
        which misses regressions exactly when the diff is large.
      annotation: |-
        Severity: low. Plumber control: repositoriesMustRunSAST.
        Remediation: Add a workflow that runs CodeQL (`github/codeql-action/init` + `analyze`, free for public repos), Semgrep, or an equivalent SAST scanner on pushes to the default branch and on pull requests. Enable GitHub's code-scanning alerts so findings open issues rather than sit in log output.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-904
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-905
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:6
      ref_id: ISSUE-905
      name: Repository has no SECURITY.md policy file
      description: 'The repository has no `SECURITY.md` (nor `.github/SECURITY.md`, nor `docs/SECURITY.md`)
        documenting the vulnerability disclosure process. Researchers who find an issue have
        no public contact beyond opening a GitHub issue — which defeats coordinated disclosure
        and teaches them to dump vulnerabilities in the open. The file can be short: two lines
        naming the contact channel and the expected response window are enough to move reports
        off the public tracker.'
      annotation: |-
        Severity: low. Plumber control: repositoriesMustPublishSecurityPolicy.
        Remediation: Add a `SECURITY.md` at the repo root or under `.github/`. GitHub ships a template (New file → security policy). Include: the supported versions, the reporting channel (email / security@ / private advisory), the expected first-response SLA, and any bounty / safe-harbour terms the project honours.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-905
      implementation_groups:
      - GH
