urn: urn:intuitem:risk:library:plumber-cicd-checks
locale: en
ref_id: plumber-cicd-checks
name: Plumber CI/CD Security Checks
description: |-
  CI/CD pipeline security checks performed by Plumber, the open-source CI/CD security scanner for GitLab CI and GitHub Actions (getplumber.io).
  Each requirement corresponds to a Plumber issue code (ISSUE-XXX). Based on plumber v0.4.3.
  https://github.com/getplumber/plumber
copyright: Plumber contributors - Mozilla Public License 2.0
version: 1
publication_date: 2026-07-16
provider: Plumber
packager: intuitem
objects:
  framework:
    urn: urn:intuitem:risk:framework:plumber-cicd-checks
    ref_id: plumber-cicd-checks
    name: Plumber CI/CD Security Checks
    description: CI/CD pipeline security checks performed by Plumber, the open-source CI/CD
      security scanner for GitLab CI and GitHub Actions. Each assessable requirement is a
      Plumber issue code (the ref_id scan-output issues[] entries carry); the annotation carries
      the severity, the .plumber.yaml control key and the remediation guidance.
    implementation_groups_definition:
    - ref_id: GH
      name: GitHub Actions
      description: Checks applicable when scanning GitHub Actions workflows and repository
        settings.
    - ref_id: GL
      name: GitLab CI
      description: Checks applicable when scanning GitLab CI pipelines and project settings
        (cross-provider controls).
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      assessable: false
      depth: 1
      ref_id: '1'
      name: Supply chain
      description: 'Integrity and provenance of the third-party building blocks a pipeline
        executes: container images, GitHub Actions references, ambiguous tag/branch refs,
        Dockerfile base images, build caches and released artefacts.'
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-101
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-101
      name: Untrusted image source
      description: A container image is pulled from a registry that is not listed in the authorized
        sources. Using untrusted registries increases supply chain attack risk.
      annotation: |-
        Severity: high. Plumber control: containerImageMustComeFromAuthorizedSources.
        Remediation: Use images from an authorized registry configured in .plumber.yaml under containerImageMustComeFromAuthorizedSources.authorizedSources, or add the registry to the authorized list.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-101
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-102
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-102
      name: Forbidden container image tag
      description: A container image in the pipeline uses a tag that is forbidden by the configuration
        (e.g., 'latest', 'dev'). Mutable tags make builds non-reproducible because the underlying
        image can change without notice.
      annotation: |-
        Severity: medium. Plumber control: containerImageMustNotUseForbiddenTags.
        Remediation: Pin the image to a specific immutable version tag (e.g., 'python:3.12.1' instead of 'python:latest'). Configure forbidden tags in .plumber.yaml under containerImageMustNotUseForbiddenTags.forbiddenTags.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-102
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-103
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-103
      name: Container image is not pinned by digest
      description: A container image in the pipeline is not pinned by its SHA256 digest. Without
        digest pinning, a tag can be reassigned to a different image, introducing supply chain
        risks.
      annotation: |-
        Severity: high. Plumber control: containerImageMustNotUseForbiddenTags.
        Remediation: Pin the image using its digest: 'image: registry.example.com/myimage@sha256:abc123...'. You can find the digest with 'docker inspect --format={{.RepoDigests}} <image>'.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-103
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-402
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-402
      name: Reference collides with both a tag and a branch
      description: 'An external CI reference is pinned to a name that exists upstream **as
        both a tag and a branch** (classic case: a tag `v1` kept in parallel with a branch
        `v1`). This covers GitHub Actions `uses:` refs and GitLab `include:` project `ref:`
        / component `@version` refs. The platform resolves the tag first, so today the pinned,
        tagged revision runs — but a maintainer rename, a typo, or a parameter that drops
        a character can switch the binding to the branch, which tracks every push. The ambiguity
        makes the reference fundamentally unreliable: the reviewer cannot tell from the YAML
        alone which of the two upstream revisions will execute, and the referenced code runs
        in the pipeline with its secrets and tokens.'
      annotation: |-
        Severity: medium. Plumber control: externalRefsMustNotCollide.
        Remediation: Pin the reference to a 40-character commit SHA (preferred), which is unambiguous. Alternatively, ask the upstream maintainer to remove one of the two colliding refs; keeping both is a supply-chain landmine for every caller.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-402
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-701
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-701
      name: Third-party action reference is not pinned by commit SHA
      description: A GitHub Actions workflow references a third-party action with a mutable
        ref (tag or branch) instead of a 40-character commit SHA. Tag and branch refs can
        be reassigned by the action's maintainer — or by an attacker who compromises the action's
        repository — to point at arbitrary code, which then runs inside the caller workflow
        with its secrets. The March 2025 tj-actions/changed-files compromise (CVE-2025-30066)
        propagated this way to hundreds of repositories, including aquasecurity/trivy.
      annotation: |-
        Severity: high. Plumber control: actionsMustBePinnedByCommitSha.
        Remediation: Replace `uses: owner/action@v4` with `uses: owner/action@<40-char-sha>` and add a `# vX.Y.Z` comment to document the version. Tools like Dependabot's `version-update-strategy: sha-and-version` can automate the update flow. Official GitHub-owned actions (actions/*, github/*) can be excluded if they are in the workflow's trusted boundary.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-701
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-702
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-702
      name: Action is hosted in an archived repository
      description: A GitHub Actions workflow references an action whose upstream repository
        is archived. Archived repos no longer receive maintenance — security fixes, dependency
        bumps, compatibility patches all stop — and any existing vulnerability stays open
        forever. A new SHA can still be pushed by the last maintainer, so even pinning by
        SHA does not make the reference safe against a future takeover.
      annotation: |-
        Severity: high. Plumber control: actionsMustNotBeArchived.
        Remediation: Replace the action with a maintained fork (audit the fork's owner first) or with an equivalent step implemented inline. If the behaviour is trivial, inlining the shell logic avoids the supply-chain dependency entirely.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-702
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-703
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-703
      name: Action version carries a published security advisory
      description: 'The pinned version of this action appears in the GitHub Advisory Database
        under the `actions` ecosystem. Running a workflow on a known-vulnerable action version
        inherits the published vulnerability class (RCE, secret exfiltration, privilege escalation,
        depending on the advisory). Examples from history: tj-actions/changed-files (CVE-2025-30066),
        reviewdog/action-setup with the March 2025 compromise, unpatched releases of `actions/artifact`.
        This check reports every advisory whose affected-version range covers the pinned ref.'
      annotation: |-
        Severity: critical. Plumber control: actionsMustNotCarryKnownCVEs.
        Remediation: Upgrade the action to a version outside the advisory's affected range (the advisory page lists a fixed-in version). Pin by SHA once upgraded so future retags cannot silently revert the fix. Configure Dependabot with `package-ecosystem: github-actions` to receive PR alerts when new advisories land.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-703
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-704
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-704
      name: Container registry password is hard-coded in the workflow
      description: A GitHub Actions workflow sets `jobs.<name>.container.credentials.password`
        to a literal string instead of a `${{ secrets.X }}` reference. The password is committed
        to the repository's history in plain text; anyone with read access — including the
        entire public on a public repo — can retrieve it, and rotating it requires rewriting
        history to purge the leak.
      annotation: |-
        Severity: critical. Plumber control: containerCredentialsMustComeFromSecrets.
        Remediation: Store the password in a repository, environment, or organization secret and reference it via `${{ secrets.<NAME> }}`. If the password is already exposed in git history, rotate it immediately and purge the literal with `git filter-repo` or a BFG run before re-publishing.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-704
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-705
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-705
      name: Release/publish workflow may consume a poisoned build cache
      description: 'A release, tag or publish workflow uses `actions/cache@*` (or an equivalent
        cache action) without scoping the cache key to the ref being released. Caches on GitHub
        Actions are shared across branches according to the fallback rules: a malicious PR
        run on a feature branch can populate the same cache key that the release job later
        restores, silently injecting compiled artefacts, dependencies, or build scripts into
        the published output. Past supply-chain incidents have abused exactly this fallback
        to publish compromised packages to PyPI and npm.'
      annotation: |-
        Severity: high. Plumber control: releaseWorkflowsMustNotRestoreUntrustedCache.
        Remediation: Either disable the cache entirely on release/publish jobs, or scope the `key:` to the ref being released (e.g. `key: release-${{ github.ref_name }}-${{ hashFiles('**/go.sum') }}`) without a `restore-keys:` fallback that reaches into PR-populated entries. Verify artefacts against a checksum after restoring.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-705
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-706
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-706
      name: Dockerfile FROM reference is not pinned by digest
      description: 'A Dockerfile at the root of the repository (or under a known build directory)
        uses `FROM image:tag` without a `@sha256:…` digest. Tags are mutable at the registry
        level: an attacker who compromises the registry — or the image maintainer — can re-push
        the same tag to point at a different layer, silently injecting code into every later
        build that pulls the reference. The supply chain of the downstream artefact then inherits
        that substitution. Pinning by digest is the single control that neutralises this vector.'
      annotation: |-
        Severity: medium. Plumber control: dockerfilesMustPinBaseImageByDigest.
        Remediation: Replace `FROM image:tag` with `FROM image:tag@sha256:…`. `docker inspect --format='{{index .RepoDigests 0}}' image:tag` prints the digest for the tag you just pulled. Automate refresh with Dependabot or Renovate (`package-ecosystem: docker`, `version-update-strategy: sha-and-version`) so the pin stays current.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-706
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-707
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-707
      name: Pinned commit SHA does not belong to the action's repository
      description: A workflow pins an action to a commit SHA that does not resolve in the
        action's upstream repository. That means either the SHA was mistyped (the reference
        silently runs whatever tag/branch GitHub falls back to, typically the default branch)
        or — far worse — the author was tricked by a PR comment / stargazer dashboard showing
        a detached commit that was never merged upstream. The name-and-SHA combination is
        the precise form of the `impostor commit` attack documented in academic supply-chain
        literature.
      annotation: |-
        Severity: critical. Plumber control: actionRefsMustExistUpstream.
        Remediation: Replace the reference with a SHA that actually belongs to the action's repository. Use `gh api repos/<owner>/<repo>/commits/<sha>` to verify before committing the change.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-707
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-708
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-708
      name: '`# vX.Y.Z` comment does not match the SHA'
      description: A workflow pins an action by commit SHA and adds a trailing `# vX.Y.Z`
        comment to document the intended version, but the SHA does not correspond to the tag
        named in the comment. Reviewers scanning diffs trust that annotation and miss the
        discrepancy, so silent downgrades (or upgrades that claim to be a patch) slip through
        review unnoticed.
      annotation: |-
        Severity: medium. Plumber control: actionPinCommentsMustMatchSha.
        Remediation: Either update the SHA to the one the tag points at, or update the comment to the tag that actually corresponds to the SHA. `gh api repos/<owner>/<repo>/git/ref/tags/<tag>` returns the SHA the tag resolves to.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-708
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-709
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-709
      name: Action pin is behind the latest upstream release
      description: 'A workflow pins an action to a commit SHA that predates the repository''s
        most recent release. The SHA may still work today, but it is missing security fixes,
        dependency updates, and runtime compatibility changes shipped in later releases. Dependabot''s
        `version-update-strategy: sha-and-version` handles the upgrade loop once configured.'
      annotation: |-
        Severity: low. Plumber control: actionPinsMustNotBeStale.
        Remediation: Update the pin to the SHA of the latest release, and refresh the trailing `# vX.Y.Z` comment. Enable Dependabot with `package-ecosystem: github-actions` and `version-update-strategy: sha-and-version` to keep the pins fresh automatically.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-709
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-711
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-711
      name: Third-party action duplicates functionality already on the runner
      description: 'A workflow uses a third-party action to do something the GitHub-hosted
        runner already provides out of the box: `gh` CLI operations wrapped by `peter-evans/create-pull-request`,
        basic cache operations that `actions/cache` already covers, `nick-invision/retry`
        for a one-line `bash` retry loop. Each extra action is an extra supply-chain dependency
        for zero capability gain — the sort of reference where an `impostor-commit`, a tag
        retag, or a compromise of the upstream account buys the attacker a foothold with no
        functional reason to have taken that risk.'
      annotation: |-
        Severity: low. Plumber control: actionsMustNotDuplicateRunnerBuiltins.
        Remediation: Replace the action with the equivalent inline shell step using the runner's built-in tooling (`gh pr create`, `gh release`, simple `bash` retry loops). Keeps the workflow readable AND removes a supply-chain link. When the capability is non-trivial (artifact caching, matrix fan-out), prefer the official `actions/*` action over a third-party duplicate.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-711
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-712
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-712
      name: Release / publish workflow produces unsigned artefacts
      description: A workflow runs a release or publish action (goreleaser, softprops/action-gh-release,
        pypa publish, npm-publish, docker build+push) without invoking any signing step. Consumers
        pulling the released artefact have no cryptographic handle to verify the artefact
        was built by the expected pipeline rather than tampered with along the way (cache
        poisoning, compromised runner, repository takeover). Signing (Sigstore cosign, GPG,
        SLSA provenance) turns 'I trust this came from that repo' into a falsifiable statement.
      annotation: |-
        Severity: medium. Plumber control: releaseWorkflowsMustSignArtefacts.
        Remediation: Add a signing step to the release job: `sigstore/cosign-installer` followed by `cosign sign <artefact>` for container images, `sigstore/gh-action-sigstore-python` for Python wheels, `crazy-max/ghaction-import-gpg` + `gpg --detach-sign` for tarballs, or `--snapshot-github-actions` on goreleaser with the signing pipeline configured. Publish the `.sig` / `.asc` alongside the artefact in the release assets.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-712
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-713
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:1
      ref_id: ISSUE-713
      name: Action comes from an unauthorized source
      description: A GitHub Actions workflow references an action whose source is not authorized.
        Every third-party action runs with the caller workflow's token and secrets, so an
        unvetted owner is a direct supply-chain entry point — the vector behind the tj-actions/changed-files
        compromise (CVE-2025-30066), where an attacker also exploited repository rename/re-creation
        to squat a once-trusted name. Restricting actions to GitHub-official owners, an explicit
        org allowlist, and a minimum-popularity floor shrinks that attack surface to vetted
        sources.
      annotation: |-
        Severity: high. Plumber control: githubActionMustComeFromAuthorizedSources.
        Remediation: Use an action from an authorized source. Configure the allowlist in .plumber.yaml under githubActionMustComeFromAuthorizedSources: keep trustGithubOfficialActions on for actions/* and github/*, add trusted owners or actions to trustedGithubActions (exact `owner/repo` or `owner/*`), and optionally set minimumStars to require a popularity threshold. Vendoring the action into a local `./.github/actions/…` directory removes the external dependency entirely.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-713
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      assessable: false
      depth: 1
      ref_id: '2'
      name: Expressions and injections
      description: 'Safe handling of CI/CD variables and template expressions: debug traces,
        unsafe expansion, template injection of user- or maintainer-controlled values into
        shell scripts, and deprecated workflow commands.'
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-203
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-203
      name: Pipeline enables CI debug trace
      description: The pipeline has CI_DEBUG_TRACE or CI_DEBUG_SERVICES enabled, which exposes
        all secret variables in the job log output. This is a critical security risk in production
        pipelines.
      annotation: |-
        Severity: critical. Plumber control: pipelineMustNotEnableDebugTrace.
        Remediation: Remove or set CI_DEBUG_TRACE and CI_DEBUG_SERVICES to 'false' in your .gitlab-ci.yml variables section. These should only be used temporarily for debugging and never committed.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-203
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-204
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-204
      name: Unsafe variable expansion
      description: A dangerous CI variable is expanded in a shell re-interpretation context
        (eval, sh -c, bash -c, source, etc.). The expanded value is executed as code, enabling
        command injection if the variable is user-controlled.
      annotation: |-
        Severity: medium. Plumber control: pipelineMustNotUseUnsafeVariableExpansion.
        Remediation: Avoid passing variables to commands that re-interpret input as shell code. Use the variable in a safe context (e.g. echo, env) or sanitize/allowlist values. Configure dangerousVariables and allowedPatterns in .plumber.yaml under pipelineMustNotUseUnsafeVariableExpansion.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-204
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-205
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-205
      name: Job variable overrides controlled variable
      description: A CI/CD variable that should only be set in GitLab CI/CD Settings (as a
        protected or project-level variable) is redefined in the pipeline configuration. This
        can neutralize security scanners, disable protections, or alter intended behavior.
      annotation: |-
        Severity: high. Plumber control: pipelineMustNotOverrideJobVariables.
        Remediation: Remove the variable from .gitlab-ci.yml and set it in GitLab CI/CD Settings > Variables instead. Configure the list of controlled variables in .plumber.yaml under pipelineMustNotOverrideJobVariables.variables.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-205
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-207
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-207
      name: Template injection in workflow script
      description: A GitHub Actions workflow inlines user-controlled template expressions
        (github.event.*, github.head_ref, ...) directly into a `run:` shell script. Attacker-controlled
        values such as PR titles, issue bodies or fork branch names can break out of the intended
        string and execute arbitrary commands with the job's secrets.
      annotation: |-
        Severity: critical. Plumber control: workflowMustNotInjectUserInputInScripts.
        Remediation: Move the template expression into an `env:` binding first, then reference the environment variable from the shell (`"$TITLE"`). Shell expansion of a bound variable quotes the value and neutralises injection payloads.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-207
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-208
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-208
      name: Deprecated workflow commands re-enabled
      description: A GitHub Actions job re-enables the deprecated `::set-env::` / `::add-path::`
        workflow commands via ACTIONS_ALLOW_UNSECURE_COMMANDS. Those commands were disabled
        after CVE-2020-15228 because attacker-controlled log output can rewrite the running
        job's environment and PATH.
      annotation: |-
        Severity: high. Plumber control: workflowMustNotReEnableInsecureCommands.
        Remediation: Remove the `ACTIONS_ALLOW_UNSECURE_COMMANDS` environment variable. Use the `$GITHUB_ENV` and `$GITHUB_PATH` files explicitly when you need to propagate values, and validate any untrusted content before writing to them.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-208
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-209
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-209
      name: Untrusted content written to $GITHUB_ENV or $GITHUB_PATH
      description: A GitHub Actions `run:` step appends a user-controlled value (PR title,
        issue body, fork branch name, ...) to `$GITHUB_ENV` or `$GITHUB_PATH`. The appended
        value becomes an environment variable or PATH entry for every subsequent step in the
        job. An attacker who controls the value can override existing variables (for example
        `NODE_OPTIONS=--require=./exfil.js`) or inject a malicious directory at the front
        of PATH, hijacking any later `npm`, `bash`, etc. invocation and exfiltrating secrets
        from privileged triggers.
      annotation: |-
        Severity: high. Plumber control: workflowMustNotWriteUntrustedContentToGitHubEnv.
        Remediation: Do not write user-controlled values into `$GITHUB_ENV` or `$GITHUB_PATH`. If you must propagate a value derived from user input, bind it through an `env:` block first (`env: { TITLE: ${{ github.event.issue.title }} }`) and validate/escape it before writing — or pass it as a step output instead. Restrict workflows touching these files to non-PR triggers when possible.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-209
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-210
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-210
      name: Workflow gates behaviour on a spoofable actor/bot check
      description: 'A GitHub Actions workflow gates behaviour on `github.actor`, `github.triggering_actor`
        or equivalent identity strings (`dependabot[bot]`, `renovate[bot]`, a specific username)
        without cryptographic backing. Those values are filled from whoever opened or synchronised
        the PR — an attacker can open a fork PR using a crafted username, or in some trigger
        types the `actor` field reflects the fork author, not the verified bot. Any step that
        trusts such a check (`if: github.actor == ''dependabot[bot]''`) can be bypassed by
        a malicious contributor forging the right login.'
      annotation: |-
        Severity: high. Plumber control: workflowMustNotTrustSpoofableActorChecks.
        Remediation: Never grant elevated behaviour based on `github.actor` / `github.triggering_actor` alone. For Dependabot-specific flows use the `pull_request` event with a separate privileged workflow triggered by `pull_request_target` only after a manual review, or rely on branch protections. For bots, verify the commit signature/author via git rather than the GitHub actor string.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-210
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-211
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-211
      name: Unsound `if:` condition (tautology, contradiction, or missing ${{ }})
      description: 'A GitHub Actions `if:` expression contains a pattern that cannot be evaluated
        as intended: a tautology (`always() || ...`, `true == true`), a contradiction (`false
        && anything`), or a bare boolean string that is not wrapped in `${{ }}` (GitHub parses
        it as the literal string "true" / "false", which is always truthy). The gate the author
        thought they installed is not actually there — the step/job runs unconditionally (or
        never), usually silently.'
      annotation: |-
        Severity: medium. Plumber control: workflowConditionsMustBeSound.
        Remediation: Review the condition: remove dead branches (`always()` short-circuits OR), wrap every template expression in `${{ … }}`, and prefer simple comparisons over nested constructs. For debugging, `if: ${{ github.event_name == 'push' }}` is safer than `if: github.event_name == 'push'` which often parses as the literal string.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-211
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-212
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-212
      name: '`contains()` built-in misused (argument order or type)'
      description: 'A GitHub Actions expression calls `contains()` with arguments in the wrong
        order or of incompatible types. The signature is `contains(haystack, needle)`: passing
        a single string as the first argument and a whole expression as the second inverts
        the semantics and the gate never matches the intended case. A common failure mode
        is `contains(''main'', github.ref)` — the literal `''main''` does not contain the
        full ref `refs/heads/main`, so the check always fails even on the `main` branch.'
      annotation: |-
        Severity: medium. Plumber control: workflowContainsCallsMustBeSound.
        Remediation: Use `contains(github.ref, 'refs/heads/main')` — the ref is the haystack, the branch name is the needle. For filter lists, convert to a set: `contains(fromJSON('["main", "release"]'), github.ref_name)` makes the intent explicit.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-212
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-213
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-213
      name: Entire `github` context serialised with toJson(github)
      description: 'A `run:` step, env binding or action input serialises the whole `github`
        context (or `github.event`) with `toJson(...)`. The resulting JSON carries every user-controllable
        field GitHub exposes — PR title, issue body, fork branch name, commit message — bundled
        with metadata the workflow might otherwise believe is trusted. Any downstream consumer
        (log line, third-party action, HTTP header) then sees a payload that is trivially
        shell-injectable under a privileged trigger (`pull_request_target`, `workflow_run`).
        Same risk class as ISSUE-207 template-injection, but the dump form is worse: a single
        `echo $JSON` leaks the full attack surface rather than one field.'
      annotation: |-
        Severity: high. Plumber control: workflowMustNotExportEntireGitHubContext.
        Remediation: Never pass the `github` context whole. Extract the exact fields you need into named `env:` bindings first (`env: { PR_TITLE: ${{ github.event.pull_request.title }} }`), then reference the environment variable from the shell — expansion quotes the value automatically. If the downstream tool genuinely requires JSON, build it explicitly from the named fields with `jq -n --arg title "$PR_TITLE" '{title: $title}'`.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-213
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-214
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-214
      name: Package installed without a pinned version or lockfile
      description: A `run:` step invokes `pip install PKG` or `npm install PKG` without a
        pinned version (`pip install pkg==1.2.3`, `npm install pkg@1.2.3`) and without a lockfile
        install (`pip install -r requirements.txt`, `npm ci`). Every run then resolves whatever
        is latest on the registry at execution time — a window exploited repeatedly by typosquat
        and maintainer-account compromise attacks. Lockfiles (`package-lock.json`, `poetry.lock`,
        `pdm.lock`, …) combined with `npm ci` / `pip install -r requirements.txt --require-hashes`
        turn every run into a reproducible, verifiable install.
      annotation: |-
        Severity: medium. Plumber control: workflowMustPinPackageInstalls.
        Remediation: Replace `pip install pkg` with `pip install -r requirements.txt` (with hashes generated via `pip-compile --generate-hashes`) or pin every package explicitly: `pip install 'pkg==1.2.3'`. Replace `npm install pkg` with `npm ci` once the lockfile is committed. Enable Dependabot or Renovate on the locked manifest so upgrades still flow, reviewed, rather than silently.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-214
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-215
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:2
      ref_id: ISSUE-215
      name: Maintainer-adjacent template (`vars.*` or `inputs.*`) expanded into a shell script
      description: 'A `run:` step inlines a `${{ vars.X }}` or `${{ inputs.X }}` expression
        directly into the shell command. `vars` values come from repository / organisation
        / environment variables set by maintainers; `inputs` values come from the caller of
        a reusable workflow. Neither is PR-author-controlled by default (ISSUE-207 covers
        that case), but both flip to attacker-controlled under specific conditions: a compromised
        maintainer account, a misconfigured org-level variable, or a caller workflow that
        proxies `github.event.*` into a reusable-workflow input. The canonical remediation
        is identical to ISSUE-207: bind the value through `env:` first, then reference the
        environment variable from the shell so expansion quotes it automatically.'
      annotation: |-
        Severity: low. Plumber control: workflowMustNotInjectVarsInScripts.
        Remediation: Replace `${{ vars.X }}` / `${{ inputs.X }}` in the `run:` body with an `env:` binding plus `$X` dereference. Example: `env: { REGISTRY: ${{ vars.REGISTRY }} }` at the step, then `docker login "$REGISTRY"` in the script.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-215
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      assessable: false
      depth: 1
      ref_id: '3'
      name: Secrets, credentials and permissions
      description: 'Protection of secrets and tokens consumed by pipelines: hardcoded leaks,
        over-broad forwarding, redaction bypasses, token lifetime, environment gating and
        explicit workflow permissions.'
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-301
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-301
      name: Secret leak in pipeline configuration
      description: The resolved pipeline configuration contains a pattern that matches a hardcoded
        secret (API token, private key, password, or other credential) embedded directly in
        the YAML. Secrets committed to pipeline configuration are exposed to everyone with
        read access to the repository, appear in version history, and are forwarded to every
        runner that executes the pipeline.
      annotation: |-
        Severity: critical. Plumber control: pipelineMustNotLeakSecretsInConfig.
        Remediation: Remove the hardcoded value and store it as a masked, protected CI/CD variable. Reference it in the pipeline as `$MY_SECRET` rather than embedding the value directly.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-301
      implementation_groups:
      - GH
      - GL
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-302
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-302
      name: 'Reusable workflow called with `secrets: inherit`'
      description: 'A GitHub Actions job calls a reusable workflow (`jobs.<name>.uses: owner/repo/.github/workflows/x.yml@ref`)
        with `secrets: inherit`. The call forwards every secret visible to the caller — repo,
        organisation, environment — to the reusable workflow, regardless of what the reusable
        workflow actually needs. A compromise of the reusable workflow (upstream maintainer
        account, malicious PR merged on the reusable side, tag retag) then sees the full secret
        surface of every caller.'
      annotation: |-
        Severity: high. Plumber control: reusableWorkflowsMustNotInheritSecrets.
        Remediation: Replace `secrets: inherit` with an explicit mapping that names only the secrets the reusable workflow needs: `secrets: { NPM_TOKEN: ${{ secrets.NPM_TOKEN }} }`. For internal reusable workflows hosted in the same repository the risk is lower but the principle stands — narrow the scope so a future incident exposes a minimum.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-302
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-303
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-303
      name: Secret dereferenced via fromJSON bypasses log redaction
      description: A GitHub Actions workflow dereferences a secret value with `fromJSON(secrets.X).y`
        — once fromJSON parses the secret, the inner fields are fresh strings GitHub does
        not recognise as masked values. Anything that echoes the sub-field (print, log, HTTP
        header, error message) leaks the plaintext to the job log.
      annotation: |-
        Severity: high. Plumber control: workflowMustNotUnredactSecretsViaFromJSON.
        Remediation: Pass structured secrets through `env:` bindings that reference each leaf individually (`env: { API_KEY: ${{ secrets.MY_API_KEY }} }`) so log redaction keeps working. If a JSON blob must be split, do it inside a step that never echoes the result and writes only the necessary parts back to the environment.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-303
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-305
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-305
      name: Deploy / release job uses secrets without an `environment:` gate
      description: A GitHub Actions job that consumes production secrets (deploy, release,
        publish) does not declare an `environment:` field. Environments are the gatekeeper
        GitHub exposes for required reviewers, wait timers, and deployment branch rules —
        without one, any caller on the configured trigger goes straight to the secret-bearing
        step, no human-in-the-loop. Combined with a spoofable trigger (ISSUE-802) or an over-broad
        branch pattern, the secret can be exfiltrated without any review.
      annotation: |-
        Severity: medium. Plumber control: deployJobsMustUseEnvironmentGate.
        Remediation: Put production secrets behind environments. Attach the environment to the deploy job (`environment: production`) and configure required reviewers / wait timers on the environment in the repository settings.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-305
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-306
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-306
      name: GitHub App token issued with revocation disabled
      description: 'A workflow step that mints a GitHub App installation token (e.g. `actions/create-github-app-token`)
        sets `skip-token-revoke: true`. That keeps the minted token alive after the workflow
        finishes, which turns a scoped, short-lived credential into a long-lived one. Any
        later leak (log fragment, restored cache, exfiltrated artefact) hands the attacker
        a working token well after the run completes, instead of getting back a revoked one.'
      annotation: |-
        Severity: high. Plumber control: githubAppTokensMustBeRevokedOnExit.
        Remediation: Remove the `skip-token-revoke: true` input (the default is to revoke). Only keep revocation disabled for workflows that legitimately need to hand the token to a downstream step launched after this workflow — and even then, prefer re-minting it fresh in the downstream workflow.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-306
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-307
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-307
      name: Checkout persists credentials in .git/config
      description: A GitHub Actions job runs `actions/checkout` without disabling credential
        persistence. By default the action writes GITHUB_TOKEN into the cloned repository's
        .git/config. Any subsequent step that uploads `.git` as part of an artifact, or executes
        fork-controlled code, can exfiltrate the token.
      annotation: |-
        Severity: high. Plumber control: checkoutMustNotPersistCredentials.
        Remediation: Add `with: { persist-credentials: false }` on every `uses: actions/checkout@*` step unless the job legitimately needs to push back. When push is required, scope the token with an explicit `permissions:` block.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-307
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-308
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-308
      name: Secret accessed via a dynamic index `secrets[expr]`
      description: 'A workflow reads `${{ secrets[expr] }}` where `expr` is not a quoted literal
        — typically an `env.VAR_NAME`, `inputs.NAME`, or a computed expression. The dynamic
        form lets the runtime resolve the secret name at execution, which effectively hands
        read access to every secret the job can see to whatever source controls `expr`. When
        `expr` comes from a maintainer-controlled env binding the risk is theoretical, but
        the pattern is brittle: a rename of the named secret, or a later refactor that introduces
        a template expression at the indexed position, silently promotes the weakness. Prefer
        naming each secret directly so the grant surface is explicit in the workflow source.'
      annotation: |-
        Severity: low. Plumber control: workflowMustNotIndexSecretsDynamically.
        Remediation: Replace `${{ secrets[env.X] }}` with a direct reference `${{ secrets.EXPECTED_NAME }}`. When a matrix really needs to select among N secrets, split the job into N copies with static names rather than indexing; the verbosity is worth the reviewability.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-308
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-309
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-309
      name: Entire secrets context exported via toJson(secrets)
      description: A GitHub Actions workflow serialises the whole `secrets` context with `toJson(secrets)`
        or `toJSON(secrets)` and pipes the result into a step's environment, run script, or
        `with:` input. The resulting string contains every secret the job has access to —
        repository, organisation and environment — and travels through whatever downstream
        consumer the step passes it to (a third-party action, a remote server, a log line).
        Even with GitHub's automatic log redaction, a single `echo` of the JSON payload has
        been enough to leak tokens in past supply-chain incidents; a compromised reusable
        action sees them directly regardless of logging.
      annotation: |-
        Severity: critical. Plumber control: workflowMustNotExportEntireSecretsContext.
        Remediation: Pass only the specific secrets the step needs, by name: `env: { TOKEN: ${{ secrets.NPM_TOKEN }} }`. If the step forwards credentials to a reusable workflow, name each one in the `secrets:` block of the call rather than using `toJson(secrets)`.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-309
      implementation_groups:
      - GH
    - urn: urn:intuitem:risk:req_node:plumber-cicd-checks:issue-801
      assessable: true
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:plumber-cicd-checks:3
      ref_id: ISSUE-801
      name: Workflow has no explicit `permissions:` block
      description: 'A GitHub Actions workflow declares neither a workflow-level nor per-job
        `permissions:` block. The runner then falls back to the repository-wide default GITHUB_TOKEN
        permissions — often `contents: write` or `read-all` — giving every step more authority
        than it needs. Any compromise (unpinned action, template-injection, cache poisoning)
        inherits the full default scope.'
      annotation: |-
        Severity: medium. Plumber control: workflowsMustDeclarePermissions.
        Remediation: Declare the narrowest permissions explicitly: `permissions: { contents: read }` at the workflow level and widen per-job only when a step needs to push, comment on issues, etc. This enforces the principle of least privilege regardless of the repo default setting.
        Documentation: https://getplumber.io/docs/cli/issues/ISSUE-801
      implementation_groups:
      - GH
