          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:compliance_level:question:q3:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:compliance_level:question:q4:
          type: unique_choice
          text: Must the supplier meet stringent regulations like GDPR, CCPA, HIPAA, and undergo audits?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:compliance_level:question:q4:choice:yes
