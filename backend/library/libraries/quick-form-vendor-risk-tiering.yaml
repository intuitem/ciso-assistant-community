          text: Does the supplier follow ISO 27001 principles with a focus on internal controls?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:compliance_level:question:q2:choice:yes
            value: 'Yes'
            add_score: 2
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:compliance_level:question:q2:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:compliance_level:question:q3:
          type: unique_choice
          text: Is the supplier expected to adhere to industry standards like NIST, CIS, and undergo reviews?
          choices:
