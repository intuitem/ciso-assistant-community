urn: urn:intuitem:risk:library:vendor-risk-tiering
locale: en
ref_id: vendor-risk-tiering
name: Vendor risk tiering
description: 'Vendor risk tiering: five categories of Yes/No questions, each rung scored 1 (low) to 4
  (critical). A category scores its highest rung answered Yes, and the vendor''s tier follows from the
  average of the five. Publish it with the "Set the vendor''s tier" step to write the tier onto the vendor.'
copyright: © intuitem
version: 1
publication_date: 2026-10-03
provider: intuitem
packager: intuitem
objects:
  quick_forms:
  - urn: urn:intuitem:risk:quick_form:vendor-risk-tiering
    ref_id: vendor-risk-tiering
    name: Vendor risk tiering
    description: |-
      The Vendor Risk Tiering Tool evaluates the potential risks posed by vendors based on a series of categorized questions.

      Each question corresponds to a specific risk level, and a "Yes" response assigns a score based on that risk level:

      Low Risk: 1 point
      Medium Risk: 2 points
      High Risk: 3 points
      Critical Risk: 4 points

      If a vendor is assessed as "Critical Risk" for "Data Access", the overall vendor risk immediately defaults to "Critical", regardless of the scores in other areas.

      The max score is taken as part of the "Risk Score Per Category".

      The final vendor risk level is then determined by the average score of all answered questions. The following is the breakdown:

      Average Score ≤ 1.5: Low Risk
      Average Score ≤ 2.5: Medium Risk
      Average Score ≤ 3.5: High Risk
      Average Score > 3.5 or critical criteria met: Critical Risk

      It's essential to evaluate vendors accurately using this tool to ensure appropriate risk management and mitigation strategies.
    annotation: 'To set the vendor''s tier on accept, add "Set the vendor''s tier" to the publication:
      score bands on Average Score Per Category (Critical from 3.6, High from 2.6, Medium from 1.6, Low
      for the rest) and Critical data access mapped to Critical. The bands start at 1.6 / 2.6 / 3.6 because
      the workbook''s thresholds are "average ≤ 1.5 / 2.5 / 3.5" and an average of five whole numbers
      moves in steps of 0.2.'
    ref_id_prefix: VRT
    subject_question_urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:vendor:question:vendor
    scores_definition:
      min: 0
      max: 4
      aggregation: pages_mean
    outcomes_definition:
    - ref_id: data_access
      label: Data Access
      kind: number
      expression: pages["data_access"].score
    - ref_id: network_access
      label: Network Access
      kind: number
      expression: pages["network_access"].score
    - ref_id: compliance_level
      label: Compliance Level
      kind: number
      expression: pages["compliance_level"].score
    - ref_id: business_impact
      label: Business Impact
      kind: number
      expression: pages["business_impact"].score
    - ref_id: potential_equivalent_loss
      label: Potential Equivalent Loss
      kind: number
      expression: pages["potential_equivalent_loss"].score
    - ref_id: average
      label: Average Score Per Category
      kind: number
      expression: response.score
    - ref_id: critical_data
      label: Critical data access
      color: '#dc2626'
      expression: values.data_access == 4.0
    pages:
    - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:vendor
      ref_id: vendor
      name: Vendor
      questions:
        urn:intuitem:risk:qf_page:vendor-risk-tiering:vendor:question:vendor:
          type: object_reference
          text: Vendor
          config:
            model: entity
        urn:intuitem:risk:qf_page:vendor-risk-tiering:vendor:question:reviewers_name:
          type: text
          text: Reviewers Name
          required: false
    - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access
      ref_id: data_access
      name: Data Access
      aggregation: max
      questions:
        urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q1:
          type: unique_choice
          text: Does the supplier only access public or non-sensitive data?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q1:choice:yes
            value: 'Yes'
            add_score: 1
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q1:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q2:
          type: unique_choice
          text: Does the supplier access basic internal data or minimal PII?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q2:choice:yes
            value: 'Yes'
            add_score: 2
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q2:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q3:
          type: unique_choice
          text: Does the supplier access operational data or some PII?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q3:choice:yes
            value: 'Yes'
            add_score: 3
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q3:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q4:
          type: unique_choice
          text: Will the supplier access critical data like PII, PCI, PHI?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q4:choice:yes
            value: 'Yes'
            add_score: 4
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:data_access:question:q4:choice:no
            value: 'No'
            add_score: 0
    - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access
      ref_id: network_access
      name: Network Access
      aggregation: max
      questions:
        urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q1:
          type: unique_choice
          text: Is the supplier's network access minimal with strong boundary protection?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q1:choice:yes
            value: 'Yes'
            add_score: 1
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q1:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q2:
          type: unique_choice
          text: Does the supplier access primarily peripheral systems with monitoring?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q2:choice:yes
            value: 'Yes'
            add_score: 2
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q2:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q3:
          type: unique_choice
          text: Does the supplier occasionally access core systems with interconnection requirements?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q3:choice:yes
            value: 'Yes'
            add_score: 3
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q3:choice:no
            value: 'No'
            add_score: 0
        urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q4:
          type: unique_choice
          text: Does the supplier have direct unrestricted access to core systems?
          choices:
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q4:choice:yes
            value: 'Yes'
            add_score: 4
          - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:network_access:question:q4:choice:no
            value: 'No'
            add_score: 0
    - urn: urn:intuitem:risk:qf_page:vendor-risk-tiering:compliance_level
      ref_id: compliance_level
