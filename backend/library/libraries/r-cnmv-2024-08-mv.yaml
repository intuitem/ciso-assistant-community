ref_id: R-CNMV-2024-08-MV
name: R-CNMV-2024-08-MV – Reglamento de Seguridad Cibernética y de la Información del Mercado de Valores
description: 'Reglamento sobre Seguridad Cibernética y de la Información en el Mercado de Valores de la República Dominicana, aprobado por el Consejo Nacional del Mercado de Valores mediante la Resolución R-CNMV-2024-08-MV del 16 de julio de 2024. Aplica a intermediarios de valores, sociedades administradoras de mecanismos centralizados de negociación, depósitos centralizados de valores, entidades de contrapartida central, sociedades administradoras de fondos de inversión, sociedades fiduciarias de fideicomisos de oferta pública, sociedades titularizadoras y sociedades proveedoras de precios. Texto literal estructurado por artículo, párrafo, numeral y literal. Fuente oficial: https://simv.gob.do/download/96/cnv/19909/r-cnmv-2024-08-mv.pdf'
copyright: Texto oficial del Consejo Nacional del Mercado de Valores de la República Dominicana (Resolución R-CNMV-2024-08-MV). Transcripción estructurada por Soluciones GE, SRL.
version: 2
