      description: 'Plan de recuperación de desastre (DRP, por sus siglas en inglés): Se deben establecer y documentar planes de recuperación ante desastres para las operaciones tecnológicas que soportan los Procesos Críticos del negocio y garantizar la disponibilidad de los mismos cuando sea necesario.'
