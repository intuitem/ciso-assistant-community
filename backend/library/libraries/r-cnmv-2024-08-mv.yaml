      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:2
      ref_id: 2.P1
      name: Párr. I
      description: Este Reglamento comprende las disposiciones normativas relativas al régimen general para la administración integral de Riesgos Tecnológicos, de Seguridad Cibernética y de la Información, así como el establecimiento de disposiciones relativas al gobierno interno de los Participantes del Mercado de Valores. Las disposiciones contenidas en este Reglamento serán de carácter supletorio para los Participantes del Mercado de Valores que, en virtud de su participación en el sistema de pagos y liquidación de valores y el correspondiente intercambio de Información Esencial, se encuentren dentro del ámbito de aplicación de la normativa especializada emitida por la Junta Monetaria relacionada con estos Riesgos, por lo que, esta última será el régimen de aplicación principal para dichas entidades.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:2.p2
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:2
      ref_id: 2.P2
      name: Párr. II
      description: Los Participantes del Mercado de Valores que no se encuentren sujetos al sistema de pagos y liquidación de valores y a los cuales les sea otorgado el Acceso al Equipo de Respuesta a Incidentes de Seguridad Cibernética para el Sector Financiero (CSIRT, por sus siglas en inglés) por parte del Banco Central de la República Dominicana deben remitir los requerimientos relativos a Incidentes de conformidad a lo establecido en el Reglamento de Seguridad Cibernética y de la Información emitido por la Junta Monetaria.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:2.p3
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:2
      ref_id: 2.P3
      name: Párr. III
      description: El superintendente de la Superintendencia del Mercado de Valores (en lo adelante, el “superintendente”) podrá desarrollar mediante norma técnica u operativa los requerimientos mínimos aplicables a los Emisores. Las Entidades de Intermediación Financiera reguladas y fiscalizadas por las Administración Monetaria y Financiera estarán sujetas únicamente a las disposiciones sobre la materia emitidas por su regulador sectorial.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:2.p4
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:2
      ref_id: 2.P4
      name: Párr. IV
      description: El superintendente podrá dictar las disposiciones y lineamientos mínimos en materia de Seguridad Cibernética y de la Información a los fines de permitir la conexión de los Participantes del Mercado de Valores, incluyendo aquellos que no se encuentran sujetos al Alcance del presente Reglamento, a los sistemas de la Superintendencia del Mercado de Valores (en lo adelante, la "Superintendencia”).
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      assessable: false
      depth: 1
      ref_id: '3'
      name: Art. 3 – Definiciones
      description: 'En adición a los términos definidos por la Ley núm. 249-17 del Mercado de Valores de la República Dominicana del diecinueve (19) de diciembre de dos mil diecisiete (2017), que deroga y sustituye la Ley núm. 19-00 del ocho (8) de mayo del año dos mil (2000) (en lo adelante, la “Ley”) y sus reglamentos de aplicación, para los fines del presente Reglamento, los términos y conceptos que se detallan a continuación tienen el significado siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.1
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.1'
      name: núm. 1
      description: 'Acceso: Capacidad y medios para comunicarse o interactuar con un sistema, utilizar recursos de dicho sistema para manejar y adquirir conocimiento de la Información que contiene o controlar sus componentes y funciones.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.2
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.2'
      name: núm. 2
      description: 'Amenaza: Circunstancia desfavorable que puede ocurrir y que, de suceder, tendría consecuencias negativas sobre la Seguridad Cibernética y de la Información. Una Amenaza puede tener causas naturales, ser accidental o intencionada. Si esta circunstancia desfavorable acontece a la vez que existe una Vulnerabilidad o debilidad de los sistemas o aprovechando su existencia, puede derivar en un Incidente de seguridad.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.3
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.3'
      name: núm. 3
      description: 'Ataque: Intento de obtener acceso no autorizado a los sistemas, sus recursos, servicios o Información, o de comprometer la Integridad de los mismos. Comprender cualquier tipo de actividad maliciosa que pretenda recopilar, degradar o destruir los recursos de los sistemas de Información, la Información contenida en éstos, interrumpir o provocar negación de sus servicios, o el daño a la Infraestructura Tecnológica que los soporta.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.4
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.4'
      name: núm. 4
      description: 'Bases de Datos: Serie de datos organizados y relacionados entre sí, almacenados en los sistemas de Información del Participante del Mercado de Valores o de sus proveedores de servicios.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.5
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.5'
      name: núm. 5
      description: 'BSA: Corresponde a las siglas en inglés a Software Alliance (Alianza de Software).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.6
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.6'
      name: núm. 6
      description: 'CIS: Corresponde a las siglas en inglés a Center for Internet Security (Centro de Seguridad de Internet).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.7
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.7'
      name: núm. 7
      description: 'CMMI: Corresponde a las siglas en inglés de Capability Maturity Model Integration (modelos que contienen las mejores prácticas que ayudan a las organizaciones a mejorar sus procesos).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.8
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.8'
      name: núm. 8
      description: 'Confidencialidad: Preservación de la Información a fin de que la misma no sea divulgada en todo o en parte a personas físicas o jurídicas, o procesos, a menos que éstos hayan sido autorizados para acceder a dicha Información. Incluye los medios para proteger la privacidad personal y la Información Esencial.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.9
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.9'
      name: núm. 9
      description: 'Control de Acceso: Proceso de concesión o denegación de solicitudes específicas para obtener y utilizar Información y servicios de procesamiento de Información relacionados o entrar en instalaciones físicas específicas.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.10
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.10'
      name: núm. 10
      description: 'COSO: Corresponde las siglas en inglés al Committee of Sponsoring Organizations of the Treadway (Comité de Organizaciones Patrocinadoras de la Comisión Treadway).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.11
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.11'
      name: núm. 11
      description: 'COBIT: Corresponde a las siglas en inglés a Control Objectives for Information and related Technology (Objetivos de Control para Tecnología de Información y Tecnologías Relacionadas).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.12
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.12'
      name: núm. 12
      description: 'Dispositivos Móviles: Dispositivos informáticos portátiles que: (i) son de tamaño pequeño, de modo que pueden ser transportados fácilmente por un solo individuo; (ii) están diseñados para funcionar sin conexión física; (iii) poseen almacenamiento de datos local, no extraíble; y, (iv) operan durante largos períodos con una fuente de alimentación autónoma. Los Dispositivos Móviles también pueden incluir capacidades de comunicación de voz, sensores electrónicos que permitan capturar y procesar Información o características integradas para sincronizar datos locales con ubicaciones remotas.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.13
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.13'
      name: núm. 13
      description: 'Encriptación: Proceso mediante el cual la Información o archivos son alterados en forma matemática, utilizando una llave, con el objetivo de evitar que una persona no autorizada pueda interpretarlos.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.14
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.14'
      name: núm. 14
      description: 'Entidad Interconectada: Persona jurídica habilitada mediante una relación contractual para mantener una conexión electrónica o intercambio de Información con un Participante del Mercado de Valores.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.15
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.15'
      name: núm. 15
      description: 'Evento: Un suceso o serie de sucesos que pueden ser internos o externos a la entidad, originados por la misma causa, que ocurren durante el mismo período.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.16
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.16'
      name: núm. 16
      description: 'Firmware: Conjunto de datos e instrucciones para el funcionamiento de un dispositivo de computación, almacenado como Software de solo lectura en dicho dispositivo, debiendo permanecer inalterado durante su ejecución.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.17
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.17'
      name: núm. 17
      description: 'GDPR: Corresponde a las siglas en inglés de General Data Protection Regulation (Regulación General de Protección de Datos) de la Unión Europea.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.18
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.18'
      name: núm. 18
      description: 'Gestión de Parches: Proceso que consiste en mantener actualizados los sistemas y aplicaciones o Software para corregir Vulnerabilidades o errores que pueden ser explotados por atacantes.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.19
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.19'
      name: núm. 19
      description: 'Gestión de Riesgo Tecnológico: Método para determinar, analizar, valorar y clasificar el Riesgo con el objeto de implementar mecanismos que permitan gestionarlo.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.20
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.20'
      name: núm. 20
      description: 'Hardware: Conjunto de equipos físicos que componen una computadora.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.21
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.21'
      name: núm. 21
      description: 'Hipervisor: Tecnología que se compone por una capa de Software que permite utilizar, al mismo tiempo, diferentes sistemas operativos o máquinas virtuales en una misma computadora central.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.22
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.22'
      name: núm. 22
      description: 'IAPP: Corresponde a las siglas en inglés al International Association of Privacy Professionals (Asociación Internacional de Profesionales de la Privacidad).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.23
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.23'
      name: núm. 23
      description: 'IEC: Corresponde a las siglas en inglés al International Electrotechnical Commission (Comisión Electrotécnica Internacional).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.24
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.24'
      name: núm. 24
      description: 'Incidente: Evento que pone en peligro la Integridad, disponibilidad o Confidencialidad de la Infraestructura Tecnológica o la Información procesada, almacenada o transmitida por dicho sistema, o que constituye una violación o Amenaza inminente de violación de políticas o Procedimientos de seguridad o políticas de uso aceptable.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.25
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.25'
      name: núm. 25
      description: 'Incidentes Significativo: Incidente o conjunto de Incidentes relacionados que podrían resultar en la degradación o pérdida de funciones críticas de servicios financieros, resultando en un riesgo sistémico para el sector financiero o en pérdida de la confianza.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.26
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.26'
      name: núm. 26
      description: 'Información: Conjunto de datos o cualquier forma de registro electrónico, óptico, magnético u otros medios, susceptible de ser procesada, distribuida y almacenada.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.27
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.27'
      name: núm. 27
      description: 'Información Esencial: Es aquella que facilita el desarrollo de las actividades fundamentales de la entidad y que sustentan la operatividad de la Infraestructura Tecnológica.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.28
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.28'
      name: núm. 28
      description: 'Información Esencial de Tipo Maestro: Conjunto de datos básicos cuyos registros sufren poca o ninguna variación en el tiempo.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.29
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.29'
      name: núm. 29
      description: 'Información Esencial de Tipo Transaccional: Conjunto de datos cuyos registros contienen Información sobre las transacciones realizadas en un sistema de Información.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.30
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.30'
      name: núm. 30
      description: 'Infraestructura Tecnológica: Aquellos equipos y sistemas con que cuenta el Participante del Mercado de Valores para procesar la Información y las adecuaciones del espacio físico que los aloja.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.31
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.31'
      name: núm. 31
      description: 'Integridad: Propiedad que poseen los datos para asegurar que los mismos no han sido alterados de manera no autorizada o destruidos de manera inadecuada durante su creación, transmisión o almacenamiento.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.32
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.32'
      name: núm. 32
      description: 'IP: Corresponde a las siglas en inglés de Internet Protocol (Protocolo de Internet).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.33
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.33'
      name: núm. 33
      description: 'ISO: Corresponde a las siglas en inglés de Internacional Organization for Standardization (Organización Internacional de Normalización).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.34
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.34'
      name: núm. 34
      description: 'ISF: Corresponde a las siglas en inglés de Information Security Forum (Foro de la Seguridad de la Información).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.35
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.35'
      name: núm. 35
      description: 'ITIL: Corresponde a las siglas en inglés de Information Technology Infrastructure Library (Biblioteca de Infraestructura de Tecnologías de Información).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.36
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.36'
      name: núm. 36
      description: 'Mecanismos de Control de Acceso: Medidas de seguridad diseñadas para detectar, restringir y permitir el Acceso a un sistema de Información o a un entorno local físico.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.37
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.37'
      name: núm. 37
      description: 'Marco de Trabajo: Son los marcos de referencia de control, estándares internacionales u otros estudios que ayuden a monitorear y mejorar las actividades críticas en el ámbito de la Tecnología de la Información, aumentar el valor del negocio y reducir sus Riesgos. Tales como: BSA, CIS, CMMI, COBIT, COSO, GDPR, IAPP, ISF, ISO 9001, ISO 20000, ISO 27001, ISO 27002, ISO 31000, IEC, ITIL, NIST, OWASP, PMBOK, SWIFT, entre otros estándares reconocidos internacionalmente que puedan aplicar.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.38
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.38'
      name: núm. 38
      description: 'Monitoreo Continuo: Proceso implementado para mantener en estado de vigilancia, el funcionamiento de los controles de seguridad de los sistemas de Información y la Infraestructura Tecnológica de los que depende la operación del Participante del Mercado de Valores.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.39
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.39'
      name: núm. 39
      description: 'NIST: Corresponde a las siglas en inglés de National Institute of Standards and Technology (Instituto Nacional de Estándares y Tecnología).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.40
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.40'
      name: núm. 40
      description: 'OWASP: Corresponde a las siglas en inglés de Open Web Application Security Project (Proyecto Abierto de Seguridad de Aplicaciones Web).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.41
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.41'
      name: núm. 41
      description: 'PBX: Corresponde a las siglas en inglés de Private Branch Exchange (Central Privada Automática).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.42
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.42'
      name: núm. 42
      description: 'Plan de Contingencia: Conjunto de Procedimientos alternativos a la operatividad normal del Participante del Mercado de Valores, cuya finalidad es la de permitir su funcionamiento, buscando minimizar el impacto operativo y financiero que pueda ocasionar cualquier Evento inesperado.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.43
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.43'
      name: núm. 43
      description: 'Plan de Continuidad de Negocio: Conjunto formado por planes de actuación, emergencia, financiero, de comunicación y Plan de Contingencia, destinados a mitigar el impacto provocado por la concreción de determinado Riesgo sobre la Información y los procesos de negocio de un Participante del Mercado de Valores.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.44
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.44'
      name: núm. 44
      description: 'PMBOK: Corresponde a las siglas en inglés de Project Management Body of Knowledge (Guía de los Fundamentos para la Dirección de Proyectos).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.45
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.45'
      name: núm. 45
      description: 'Problema: Es la causa conocida o desconocida de un Incidente.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.46
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.46'
      name: núm. 46
      description: 'Procedimientos: Lista detallada de la secuencia lógica y consistente de actividades y cursos de acción por medio de los cuales se asegura el cumplimiento de una función operativa.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.47
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.47'
      name: núm. 47
      description: 'Procesos Críticos: Procesos indispensables para la continuidad del negocio y las operaciones del Participante del Mercado de Valores, y cuya falta de identificación o aplicación deficiente puede generar un impacto financiero negativo.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.48
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.48'
      name: núm. 48
      description: 'Riesgo: Es la posibilidad de ocurrencia de Eventos que impacten negativamente los objetivos del Participante del Mercado de Valores y su situación financiera.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.49
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.49'
      name: núm. 49
      description: 'Riesgos Tecnológicos: Posibilidad de sufrir un impacto adverso relacionado con la afectación de la Integridad, disponibilidad y Confidencialidad de la Información o de la Infraestructura Tecnológica.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.50
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.50'
      name: núm. 50
      description: 'Seguridad Cibernética y de la Información: La protección de los sistemas de Información y de la Información en todos sus formatos, durante su almacenamiento, procesamiento o transmisión, contra el Acceso, uso, divulgación, interrupción, modificación o destrucción no autorizados.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.51
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.51'
      name: núm. 51
      description: 'Software: Conjunto de programas, instrucciones y reglas informáticas para ejecutar ciertas tareas en una computadora.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.52
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.52'
      name: núm. 52
      description: 'SWIFT: Corresponde a las siglas en inglés de Society for Worlwide Interbank Financial Telecommunication (Sociedad para las Telecomunicaciones Financieras Interbancarias Mundiales).'
      annotation: «Worlwide» figura así en el texto oficial; se conserva literal.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.53
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.53'
      name: núm. 53
      description: 'Tecnología de Información: Conjunto de herramientas y métodos empleados para llevar a cabo la administración de la Información.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3.54
      assessable: false
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:3
      ref_id: '3.54'
      name: núm. 54
      description: 'Vulnerabilidad: Es una debilidad en el sistema de Información, sus Procedimientos de seguridad, implementación o controles internos que podrían permitir la materialización de una Amenaza.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:4
      assessable: true
      depth: 1
      ref_id: '4'
      name: Art. 4 – Marco de Trabajo
      description: Los Participantes del Mercado de Valores sujetos al presente Reglamento deben establecer acciones para el desarrollo, implementación y mantenimiento de un programa de Seguridad Cibernética y de la Información y, a la vez, optar por uno o varios Marcos de Trabajo conforme a sus requerimientos y necesidades que se encuentren acorde a los estándares reconocidos internacionalmente que puedan aplicar.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:4.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:4
      ref_id: 4.P1
      name: Párr. I
      description: El programa de Seguridad Cibernética y de la Información requerido en este Reglamento debe ser diseñado de acuerdo al Marco de Trabajo seleccionado y ser cónsono con la naturaleza, tamaño, complejidad y perfil de Riesgos del negocio de cada Participante del Mercado de Valores.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:4.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:4
      ref_id: 4.P2
      name: Párr. II
      description: El programa de Seguridad Cibernética y de la Información comprende las estrategias, actividades, procesos y políticas que los Participantes del Mercado de Valores deben documentar, desarrollar e implementar, a fin de cumplir las disposiciones y requerimientos establecidos en este Reglamento. Dicho programa se debe basar en la identificación de los Eventos que podrían tener un efecto adverso sobre la continuidad de las operaciones, así como el impacto financiero, humano y reputacional sobre el Participante del Mercado de Valores.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      assessable: true
      depth: 1
      ref_id: '5'
      name: Art. 5 – Criterios de Información
      description: 'Los Participantes del Mercado de Valores deben observar los siguientes criterios para el establecimiento de sus políticas y Procedimientos para el control y la gestión de Riesgos en materia de Seguridad Cibernética y de la Información:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.1'
      name: núm. 1
      description: 'Autenticación o autentificación: Es el acto de validar la identidad de un usuario para otorgarle Acceso a recursos tecnológicos;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.2'
      name: núm. 2
      description: 'Auditabilidad o trazabilidad: Es el proceso que facilita la reconstrucción, revisión y análisis de la secuencia de Eventos que, a la vez, permite el registro y Monitoreo Continuo de los distintos recursos por parte de los usuarios que han sido previamente autorizados a manipular la Información;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.3'
      name: núm. 3
      description: 'Confiabilidad: Los sistemas deben brindar la Información correcta, completa, oportuna y exacta que será utilizada en la operación del Participante del Mercado de Valores, en la toma de decisiones, en la preparación de estados financieros y demás Información para su remisión a los órganos reguladores competentes;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.4'
      name: núm. 4
      description: 'Confidencialidad: Se debe brindar protección a la Información contra la divulgación no autorizada o inadecuada en virtud de las disposiciones legales y normativas aplicables;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.5'
      name: núm. 5
      description: 'Disponibilidad: Los recursos y la Información deben estar disponibles a los usuarios y para las autoridades públicas competentes en el ejercicio de sus facultades legales en el tiempo y la forma requerida;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.6'
      name: núm. 6
      description: 'Efectividad: La Información y los Procedimientos para su manejo deben ser relevantes, pertinentes y eficientes en términos de tiempo, de forma que garanticen el proceso del negocio. De igual forma, deben presentarse en forma correcta, coherente, completa y que puedan utilizarse oportunamente;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.7'
      name: núm. 7
      description: 'Eficiencia: La gestión y manejo de la Información debe realizarse mediante una óptima utilización de los recursos;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5.8
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:5
      ref_id: '5.8'
      name: núm. 8
      description: 'Integridad: Propiedad que poseen los datos y que asegura que los mismos no han sido alterados de manera no autorizada o destruidos de forma inadecuada, durante su creación, transmisión o almacenamiento.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      assessable: true
      depth: 1
      ref_id: '6'
      name: Art. 6 – Responsabilidades en materia de seguridad
      description: 'A los efectos del presente Reglamento, es responsabilidad de los Participantes del Mercado de Valores:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.1'
      name: núm. 1
      description: Establecer y mantener actualizado un sistema de gestión que proporcione un enfoque estándar, formal y continuo para la Seguridad Cibernética y de la Información y procesos del negocio, que permita garantizar la Integridad, Confidencialidad y Disponibilidad de la Información, así como gestionar efectivamente los Riesgos, incluyendo los de Ciberseguridad, mediante la adecuada combinación de políticas, Procedimientos, controles, estructura organizacional y herramientas informáticas especializadas;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.2'
      name: núm. 2
      description: Definir políticas y Procedimientos para la Seguridad Cibernética y de la Información conforme a al Marco de Trabajo adoptado. Dichas políticas y Procedimientos deben procurar que la ejecución de los criterios de control interno relativos a eficacia, eficiencia y cumplimiento se encuentren alineados a los objetivos y las actividades del Participante del Mercado de Valores. Las políticas y Procedimientos en la materia deben ser aprobadas por el consejo de administración;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.3'
      name: núm. 3
      description: Asegurar la Integridad, Confidencialidad y disponibilidad de la Información en sus sistemas y de la Información en tránsito, almacenada y procesada;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.4'
      name: núm. 4
      description: Preservar la Información privilegiada, reservada y confidencial;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.5'
      name: núm. 5
      description: Gestionar la privacidad de los datos en la forma contemplada en las leyes, normativa vigente aplicable y los Marcos de Trabajo reconocidos internacionalmente sobre la materia y adoptado por la entidad. De igual forma, guiar y coordinar la implementación de políticas, Procedimientos y actividades para asegurar que se cumplan las directivas sobre privacidad de los datos;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.6'
      name: núm. 6
      description: Formular, mantener y ejecutar un plan de tratamiento de Riesgos de Seguridad Cibernética y de la Información alineado con los objetivos estratégicos y operativos del Participante del Mercado de Valores. Dicho plan debe de identificar las prácticas de gestión y las soluciones de seguridad apropiadas y óptimas, con los recursos, las responsabilidades y las prioridades asociadas para gestionar los Riegos identificados en la materia;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.7'
      name: núm. 7
      description: Revisar y monitorear de forma regular, la efectividad y cumplimiento de las disposiciones contenidas en este Reglamento y sus políticas y Procedimientos de control. Además, deben incluir las excepciones y resultados de las autoevaluaciones y mantener evidencia del Monitoreo Continuo realizado, conforme a lo establecido en sus políticas;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.8
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.8'
      name: núm. 8
      description: Identificar Amenazas y Vulnerabilidades de manera periódica;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.9
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.9'
      name: núm. 9
      description: Definir y evaluar las responsabilidades y competencias de sus empleados y de los proveedores de servicios en lo concerniente a la Seguridad Cibernética y de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.10
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.10'
      name: núm. 10
      description: Entrenar a los empleados que cuenten con Acceso sobre la forma de interconectar con la Superintendencia; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6.11
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:6
      ref_id: '6.11'
      name: núm. 11
      description: Establecer, implementar, mantener y monitorear los controles, procesos y Procedimientos de continuidad de negocio o de recuperación que aseguren un nivel aceptable de Seguridad Cibernética y de la Información ante desastres o situaciones adversas.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:7
      assessable: true
      depth: 1
      ref_id: '7'
      name: Art. 7 – Gestión de Riesgos Tecnológicos
      description: Los Participantes del Mercado de Valores deben monitorear diariamente los Riesgos que implica el uso actual y futuro de la Tecnología de la Información desde su concepción, desarrollo e implementación. Al efecto, dicho monitoreo incluye los entornos y procesos internos, en función del análisis de las Amenazas, Vulnerabilidades, controles, impacto y política de Riesgos establecidos por su consejo de administración y el alcance de dichas evaluaciones.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:8
      assessable: true
      depth: 1
      ref_id: '8'
      name: Art. 8 – Metodología para la Gestión de Riesgos
      description: La Gestión de Riesgos Tecnológicos debe llevarse a cabo a través de metodologías que contemplen un análisis del Riesgo inherente al Participante del Mercado de Valores y que, de forma cuantitativa y/o cualitativa, recopile el surgimiento e identificación de nuevos Riesgos, Amenazas y Vulnerabilidades, así como la probabilidad de ocurrencia, posible impacto en la operatividad del negocio y los controles necesarios para su mitigación.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:8.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:8
      ref_id: 8.P
      name: Párr.
      description: Las evaluaciones de Riesgo deben contemplar, como mínimo, la divulgación no autorizada de la Información, su corrupción accidental o deliberada, manipulación y la disponibilidad de los entornos en cualquier período.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:9
      assessable: true
      depth: 1
      ref_id: '9'
      name: Art. 9 – Gestión de Riesgos Tecnológicos de terceros
      description: Los Participantes del Mercado de Valores deben verificar que las disposiciones de este Reglamento son cumplidas por cualquier Entidad Interconectada mediante el mantenimiento de una conexión electrónica o por el intercambio de Información Esencial, a través de cualquier medio digital, en la medida en que dicha vinculación pueda comprometer la estabilidad del Mercado de Valores y la salvaguarda de la Información que manejan.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:10
      assessable: true
      depth: 1
      ref_id: '10'
      name: Art. 10 – Políticas y Procedimientos de seguridad
      description: En el marco del programa de Seguridad Cibernética y de la Información, los Participantes del Mercado de Valores deben diseñar, implementar y mantener políticas que contemplen los Procedimientos para la gestión de la Seguridad Cibernética y de la Información bajo el Marco de Trabajo. Dichas políticas y Procedimientos deben aplicar criterios de control interno relativos a la protección de activos de la organización, datos, Información y servicios de Tecnología de la Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:10.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:10
      ref_id: 10.P1
      name: Párr. I
      description: Las políticas y Procedimientos citadas anteriormente deben ser aprobadas por el consejo de administración y posteriormente comunicadas a los empleados, proveedores de servicios, Entidades Interconectadas y a las demás partes externas relevantes, en tanto sea pertinente en virtud de las funciones ejercidas o servicios contratados.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:10.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:10
      ref_id: 10.P2
      name: Párr. II
      description: Los Participantes del Mercado de Valores deben elaborar y aplicar las políticas y Procedimientos citados en este Reglamento. Asimismo, deben documentar todos los procesos implementados para la gestión de la Seguridad Cibernética y de la Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:11
      assessable: true
      depth: 1
      ref_id: '11'
      name: Art. 11 – Educación y concientización
      description: Los empleados del Participante del Mercado de Valores y, cuando sea pertinente, los proveedores de servicios, afiliados o usuarios, deben recibir entrenamiento y orientación apropiado y periódico sobre las políticas y Procedimientos de Seguridad Cibernética y de la Información. Esto incluye los requerimientos de seguridad, las responsabilidades legales y los controles del negocio. De igual forma, deben recibir entrenamiento en el uso correcto de las facilidades de procesamiento de Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      assessable: true
      depth: 1
      ref_id: '12'
      name: Art. 12 – Gestión del ciclo de vida de los activos de Tecnología de la Información
      description: 'Los Participantes del Mercado de Valores deben desarrollar un esquema de gestión de activos de Tecnología de la Información a través de su ciclo de vida que contemple, al menos, lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.1'
      name: núm. 1
      description: Adquisición de todos los activos de Tecnología de la Información conforme a lo dispuesto en el artículo 41 (Gestión de proveedores externos) de este Reglamento y sus políticas y prácticas de adquisición;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.2'
      name: núm. 2
      description: Desplegar los activos de Tecnología de la Información siguiendo el ciclo de vida de implementación, incluyendo la gestión de cambios y pruebas de aceptación dispuestos en este Reglamento;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.3'
      name: núm. 3
      description: Procedimientos para identificar y clasificar los activos de Tecnología de la Información críticos y sensibles;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.4'
      name: núm. 4
      description: 'Registro actualizado y exacto de los activos de Tecnología de la Información necesarios para proveer los servicios, incluyendo:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4
      ref_id: 12.4.a
      name: núm. 4, lit. a)
      description: Identificación específica del activo de Tecnología de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4
      ref_id: 12.4.b
      name: núm. 4, lit. b)
      description: Prioridad de recuperación;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4.c
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4
      ref_id: 12.4.c
      name: núm. 4, lit. c)
      description: Locación;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4.d
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4
      ref_id: 12.4.d
      name: núm. 4, lit. d)
      description: Propietario o custodio designado;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4.e
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.4
      ref_id: 12.4.e
      name: núm. 4, lit. e)
      description: Clasificación según el Riesgo asociado o criticidad definida.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.5'
      name: núm. 5
      description: Procedimientos de control para la devolución y asignación de los activos de Tecnología de la Información a los usuarios, con aceptación y firma de responsabilidades, según corresponda;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.6'
      name: núm. 6
      description: Definir responsabilidades de los empleados, proveedores de servicios y otras partes externas sobre la protección física de cada activo;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.7'
      name: núm. 7
      description: Establecer un plan de mantenimiento preventivo para todo el Hardware, considerando las recomendaciones del proveedor del servicio, el Riesgo en caso de interrupción del servicio, falla o la necesidad del reemplazo del activo;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.8
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.8'
      name: núm. 8
      description: Definir Procedimientos para el manejo adecuado cuando el activo de Tecnología de la Información es eliminado o destruido;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.9
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.9'
      name: núm. 9
      description: Definir Procedimientos para la seguridad de los activos de Tecnología de la Información fuera de las instalaciones del Participante del Mercado de Valores, teniendo en cuenta los diferentes Riesgos asociados;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.10
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.10'
      name: núm. 10
      description: Procedimientos para advertir a los usuarios las responsabilidades y Procedimientos de seguridad para proteger los activos de Tecnología de la Información desatendidos; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12.11
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:12
      ref_id: '12.11'
      name: núm. 11
      description: Revisar los activos de Tecnología de la Información que contengan medios de almacenamiento para asegurar que los datos sensibles y Software licenciado se hayan removido o se hayan sobrescrito con seguridad antes de su disposición, eliminación o reutilización.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:13
      assessable: true
      depth: 1
      ref_id: '13'
      name: Art. 13 – Aplicaciones de estaciones de trabajo
      description: 'Los Participantes del Mercado de Valores deben establecer procesos para la gestión adecuada de la Seguridad Cibernética y de la Información de las aplicaciones instaladas en las estaciones de trabajo, contemplando los aspectos siguientes:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:13.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:13
      ref_id: '13.1'
      name: núm. 1
      description: 'Inventario de las aplicaciones de estaciones de trabajo: Las aplicaciones de estaciones de trabajo deben estar registradas en un inventario o su equivalente;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:13.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:13
      ref_id: '13.2'
      name: núm. 2
      description: 'Protección de los archivos con Información Confidencial: Los archivos creados en aplicaciones de estaciones de trabajo cuyo contenido sea Información Confidencial deben ser protegidos mediante la validación de la entrada, aplicando Mecanismos de Control de Acceso;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:13.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:13
      ref_id: '13.3'
      name: núm. 3
      description: 'Desarrollo de aplicaciones de estaciones de trabajo: Debe ser llevado a cabo según la metodología de desarrollo seguro adoptada por la entidad.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:14
      assessable: true
      depth: 1
      ref_id: '14'
      name: Art. 14 – Aplicaciones del negocio
      description: 'Los Participantes del Mercado de Valores deben implementar controles de seguridad conforme al Marco de Trabajo adoptado para las aplicaciones del negocio. Dichos controles deben contemplar, al menos, lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:14.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:14
      ref_id: '14.1'
      name: núm. 1
      description: 'Protección de las aplicaciones: Deben utilizar funcionalidades de Seguridad Cibernética y de la Información, alineadas a la infraestructura técnica de seguridad, que permitan el cumplimiento de los requerimientos de Confidencialidad e Integridad de la Información;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:14.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:14
      ref_id: '14.2'
      name: núm. 2
      description: 'Protección de las aplicaciones basadas en navegación: Deben establecer controles específicos de Seguridad Cibernética y de la Información sobre las aplicaciones web y servicios transaccionales, tanto internos como externos, que apoyen los servicios hacia internet, basados en el navegador y en los servidores donde se ejecutan; y,'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:14.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:14
      ref_id: '14.3'
      name: núm. 3
      description: 'Validación de la Información en las aplicaciones de negocio: Deben incorporar los controles de Seguridad Cibernética y de la Información que protejan la Confidencialidad e Integridad de la Información al ser ingresada, procesada o extraída de la aplicación.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:15
      assessable: true
      depth: 1
      ref_id: '15'
      name: Art. 15 – Clasificación y etiquetado de la Información
      description: Los Participantes del Mercado de Valores deben desarrollar las políticas y Procedimientos que aseguren que la Información recibe la protección adecuada de acuerdo a su importancia en términos de valor, requisitos legales, criticidad y sensibilidad a la divulgación o modificación no autorizada. Por lo que, solo las personas autorizadas pueden acceder a la Información almacenada.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:15.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:15
      ref_id: 15.P
      name: Párr.
      description: Los Procedimientos de gestión de documentos físicos y digitales deben incluir las etapas de creación, clasificación, almacenamiento, adquisición, modificación y destrucción de documentos, así como los mecanismos de control para la protección de la Información acorde a su nivel de sensibilidad, Confidencialidad y períodos de conservación.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      assessable: true
      depth: 1
      ref_id: '16'
      name: Art. 16 – Privacidad de la Información
      description: 'Los Participantes del Mercado de Valores deben desarrollar políticas y Procedimientos de protección de datos personales y de privacidad de Información según las leyes y normativas vigentes y el Marco de Trabajo seleccionado. Dichas políticas y Procedimientos deben establecer, como mínimo, lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.1'
      name: núm. 1
      description: Mecanismos para la identificación, gestión y destrucción de Información Confidencial identificable de los clientes y de los empleados;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.2'
      name: núm. 2
      description: Evaluaciones de Riesgo sobre la privacidad de la Información personal gestionada por procesos y aplicaciones del negocio;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.3'
      name: núm. 3
      description: Documentación del uso dado a la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.4'
      name: núm. 4
      description: Mecanismos para la obtención de la aprobación por parte de los titulares de la Información antes de recopilar, procesar, almacenar o divulgarla a terceros;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.5'
      name: núm. 5
      description: Cifrado de la Información y gestión eficiente de las llaves de cifrado;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.6'
      name: núm. 6
      description: Uso de técnicas de enmascaramiento de datos para ocultar partes de la Información al momento de ser almacenada o transmitida;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.7'
      name: núm. 7
      description: Protección de los metadatos relacionados con la privacidad (atributos de archivos o Información descriptiva que pudiera contener Información personal); y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16.8
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:16
      ref_id: '16.8'
      name: núm. 8
      description: Protocolos de notificación al órgano interno aplicable y a los titulares de la Información cuando se produce una violación de la privacidad.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:17
      assessable: true
      depth: 1
      ref_id: '17'
      name: Art. 17 – Obligaciones contractuales
      description: Los contratos suscritos entre los Participantes del Mercado de Valores y sus empleados, proveedores de servicios, Entidades Interconectadas y demás partes externas a los cuales se les concede Acceso a la Información, deben establecer las responsabilidades generales de las partes, disposiciones sobre la Confidencialidad y no divulgación de la Información, protección de datos y especificaciones sobre Seguridad Cibernética y de la Información. De igual forma, las disposiciones sobre las citadas materias deben prolongarse luego de la finalización de la relación contractual por el tiempo que se defina en el acuerdo en virtud de la naturaleza del Acceso a la Información concedido.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:17.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:17
      ref_id: 17.P
      name: Párr.
      description: Asimismo, el Participante del Mercado de Valores debe conservar el derecho de revisar periódicamente los procesos y controles de dichos proveedores de servicios o Entidad Interconectada.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:18
      assessable: true
      depth: 1
      ref_id: '18'
      name: Art. 18 – Protección contra la fuga de Información
      description: Los Participantes del Mercado de Valores deben mantener políticas, Procedimientos y mecanismos de protección contra la fuga de Información (Data Loss Prevention -DLP) a los sistemas, Infraestructura Tecnológica y entornos locales que procesan, almacenan o transmiten Información sensible.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:19
      assessable: true
      depth: 1
      ref_id: '19'
      name: Art. 19 – Registros de usuarios
      description: Los Participantes del Mercado de Valores deben mantener políticas y Procedimientos formales de altas y bajas de usuarios con objeto de garantizar y cancelar el Acceso a todos los sistemas y servicios de Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      assessable: true
      depth: 1
      ref_id: '20'
      name: Art. 20 – Gestión de identidades y Mecanismo de Control de Acceso
      description: 'Los Participantes del Mercado de Valores deben mantener las políticas y Procedimientos de gestión de identidades y de Mecanismos de Control de Acceso que apliquen a los empleados, proveedores de servicios y demás partes externas y personas autorizadas que tengan Acceso a los sistemas de Información e Infraestructura Tecnológica, incluyendo:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      ref_id: '20.1'
      name: núm. 1
      description: Procedimientos documentados para la administración y autenticación de identidades a nivel institucional, incluyendo la doble autenticación;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      ref_id: '20.2'
      name: núm. 2
      description: Procedimiento documentado de asignación de roles y privilegios por tipo de usuario y componente de la Infraestructura Tecnológica;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      ref_id: '20.3'
      name: núm. 3
      description: Procedimiento para establecer los Mecanismos de Control de Acceso de los usuarios a los distintos componentes de la Infraestructura Tecnológica basado en los principios del menor privilegio;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      ref_id: '20.4'
      name: núm. 4
      description: Establecimiento de directrices generales para la asignación y utilización de cuentas privilegiadas en los sistemas de Información y aplicaciones del negocio, que regulan la asignación y el uso aceptable de las referidas cuentas a los casos que estrictamente lo ameriten tras obtener la autorización escrita por parte del órgano interno aplicable; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      ref_id: '20.5'
      name: núm. 5
      description: Procedimientos para la gestión de las autorizaciones de Acceso de los usuarios.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      ref_id: 20.P1
      name: Párr. I
      description: 'Los Mecanismos de Control de Acceso deben considerar, al menos, algunos de los siguientes:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p1.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p1
      ref_id: 20.P1.a
      name: Párr. I, lit. a)
      description: Algo que el usuario sabe, por ejemplo, contraseña o PIN;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p1.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p1
      ref_id: 20.P1.b
      name: Párr. I, lit. b)
      description: Algo que el usuario tiene, por ejemplo, token físico o digital, tarjeta inteligente o certificado digital;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p1.c
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p1
      ref_id: 20.P1.c
      name: Párr. I, lit. c)
      description: Algo que el usuario es o hace, por ejemplo, elementos biométricos como huella dactilar, patrón de iris, reconocimiento de voz, estilo de escritura o similares.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:20
      ref_id: 20.P2
      name: Párr. II
      description: Los Participantes del Mercado de Valores pueden decidir establecer uno o más Mecanismos de Control de Acceso, según el análisis de Riesgo realizado por la entidad y el grado de criticidad de los sistemas de Información y otros componentes de la Infraestructura Tecnológica a los que cada usuario debe acceder conforme a los roles asignados y en virtud de los resultados de las evaluaciones de Riesgos Tecnológicos o de la funcionalidad de los Mecanismos de Control de Acceso.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21
      assessable: true
      depth: 1
      ref_id: '21'
      name: Art. 21 – Gestión de contraseñas
      description: 'Los Participantes del Mercado de Valores, de conformidad a su análisis de Riesgo, deben mantener políticas y Procedimientos para la gestión segura de contraseñas de los sistemas de Información y los componentes de la Infraestructura Tecnológica, los cuales deben considerar, al menos, lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21
      ref_id: '21.1'
      name: núm. 1
      description: Formato de contraseñas y reglas relativas a la longitud;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21
      ref_id: '21.2'
      name: núm. 2
      description: Cambio de contraseñas temporales en su primera conexión y de manera periódica; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21
      ref_id: '21.3'
      name: núm. 3
      description: Registro de contraseñas utilizadas y reglas para su reutilización.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:21
      ref_id: 21.P
      name: Párr.
      description: Los empleados de los Participantes del Mercado de Valores deben suscribir un compromiso donde reconozcan la responsabilidad de mantener confidenciales las contraseñas y credenciales personales para el Acceso a los sistemas de Información y los componentes de la Infraestructura Tecnológica.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22
      assessable: true
      depth: 1
      ref_id: '22'
      name: Art. 22 – Seguridad física y del entorno
      description: Los Participantes del Mercado de Valores deben implementar políticas, Procedimientos y mecanismos para la protección de la seguridad física y el entorno de las instalaciones del negocio, según el Marco de Trabajo adoptado y la naturaleza de su actividad.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22
      ref_id: 22.P1
      name: Párr. I
      description: 'Dichas políticas, Procedimientos y mecanismos deben contemplar, al menos, lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1.1
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1
      ref_id: 22.P1.1
      name: Párr. I, núm. 1
      description: Procedimientos para la protección física de entornos críticos del Participante del Mercado de Valores que contemplen la gestión del personal autorizado, uso de identificación en lugares visibles, documentación de entrada y salida autorizada de activos de Tecnología de la Información y control de visitas al entorno;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1.2
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1
      ref_id: 22.P1.2
      name: Párr. I, núm. 2
      description: Mecanismos de control de visitas, incluyendo el registro de entrada y salida, uso obligatorio de identificación, Acceso limitado y bajo supervisión a las áreas autorizadas y el retorno obligatorio de los mecanismos de Acceso físico entregados;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1.3
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1
      ref_id: 22.P1.3
      name: Párr. I, núm. 3
      description: Mecanismos para la protección de la Infraestructura Tecnológica y equipos especializados contra el daño causado por alguna Amenaza ambiental; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1.4
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p1
      ref_id: 22.P1.4
      name: Párr. I, núm. 4
      description: Monitoreo y control de la temperatura y humedad de los entornos conforme a los requerimientos definidos por los fabricantes.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22
      ref_id: 22.P2
      name: Párr. II
      description: 'Los mecanismos para la protección de la seguridad física y el entorno de las instalaciones del negocio deben asegurar:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2.1
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2
      ref_id: 22.P2.1
      name: Párr. II, núm. 1
      description: El ocultamiento de la ubicación de los entornos críticos para prevenir el Acceso no autorizado y el mantenimiento de la Confidencialidad de la misma, por ejemplo, el uso señalizaciones discretas y la exclusión de directorios telefónicos y de portales informativos;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2.2
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2
      ref_id: 22.P2.2
      name: Párr. II, núm. 2
      description: El fortalecimiento de la seguridad perimetral y mecanismos contra robos de equipos informáticos críticos y documentación sensible en formato físico, por ejemplo, el uso de paredes sólidas, ventanas y puertas blindadas;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2.3
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2
      ref_id: 22.P2.3
      name: Párr. II, núm. 3
      description: La instalación de controles físicos, por ejemplo, cerrojos digitales, dispositivos de Acceso biométrico, cámaras de vigilancia en puntos vulnerables, sistemas de detección de intrusos, así como el despliegue de guardianes de seguridad en los entornos que sea necesario;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2.4
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2
      ref_id: 22.P2.4
      name: Párr. II, núm. 4
      description: Los mecanismos para la protección de los cables de alimentación energética que cubran aspectos como la segregación de los cables de comunicaciones, instalación oculta y distinta de las rutas públicas, puntos de inspección y terminación cerrados y fuentes alternas; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2.5
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p2
      ref_id: 22.P2.5
      name: Párr. II, núm. 5
      description: Los mecanismos para el aseguramiento de la disponibilidad energética, tales como, instalación de equipos contra fluctuación de cargas, uso de generadores eléctricos de emergencia, instalación de luces de emergencia o la ubicación de interruptores cerca de las puertas de emergencia para facilitar el apagado rápido en caso de que sea necesario.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22
      ref_id: 22.P3
      name: Párr. III
      description: Los entornos críticos, incluyendo lugares que albergan los sistemas informáticos, tales como, los centros de datos, redes, equipos de telecomunicaciones, material físico sensible y otros activos importantes, deben ser protegidos contra accidentes, Ataques y el acceso físico no autorizado; contra los cortes o fluctuaciones de energía, así como estar protegidos contra incendios, inundaciones y otras Amenazas naturales.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22.p4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:22
      ref_id: 22.P4
      name: Párr. IV
      description: Los Participantes del Mercado de Valores deben capacitar a sus empleados sobre los protocolos para emergencias causadas por desastres naturales, incendios o situaciones de fuerza mayor.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23
      assessable: true
      depth: 1
      ref_id: '23'
      name: Art. 23 – Sistemas informáticos e Infraestructura Tecnológica
      description: 'Los Participantes del Mercado de Valores deben procurar que los sistemas informáticos y la Infraestructura Tecnológica puedan ser protegidos contra Amenazas. Por lo que, deben configurar adecuadamente los controles de Seguridad Cibernética y de la Información integrados por defecto, incluyendo:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23
      ref_id: '23.1'
      name: núm. 1
      description: Compatibilidad con otros sistemas de Información, redes e instalaciones de telecomunicaciones utilizados, a fin de asegurar el establecimiento de controles de seguridad integrados;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23
      ref_id: '23.2'
      name: núm. 2
      description: Administración centralizada de sistemas;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23
      ref_id: '23.3'
      name: núm. 3
      description: Gestión adecuada de las actualizaciones de seguridad, listas de Control de Acceso, firmas y reglas de firewalls (cortafuegos); y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:23
      ref_id: '23.4'
      name: núm. 4
      description: Diseño adecuado de la red, contemplando segregación de sistemas de Información mediante el uso de dominios de seguridad, aislamiento de tipos particulares de tráfico de red, la restricción de puntos de entrada a la red y la denegación de Acceso a dispositivos no registrados. Al efecto, deben establecer la incorporación de mecanismos de autenticación, el diseño de esquemas de firewalls (cortafuegos) para evitar su omisión y la priorización del tráfico de red para reducir la latencia en el uso de servicios críticos.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      assessable: true
      depth: 1
      ref_id: '24'
      name: Art. 24 – Gestión de cambio
      description: 'Los Participantes del Mercado de Valores deben contar con una política de gestión de cambios, incluyendo cambios estándar y de mantenimiento, en los sistemas de Información e Infraestructura Tecnológica. Dicha política debe considerar, al menos, lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: '24.1'
      name: núm. 1
      description: Procedimientos documentados de gestión de cambios de forma controlada que contemplen las etapas de solicitud, análisis de impacto, autorización, pruebas y aceptación final, para asegurar la aplicación adecuada de los cambios, con el fin de no comprometer la seguridad de la Infraestructura Tecnológica;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: '24.2'
      name: núm. 2
      description: Creación de un registro de control de versiones, especificando cambios realizados, empleados involucrados, persona que autoriza los cambios, fechas de solicitud, realización, aprobación y componentes afectados;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: '24.3'
      name: núm. 3
      description: Evaluaciones periódicas a la Infraestructura Tecnológica para identificar cambios no autorizados;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: '24.4'
      name: núm. 4
      description: Gestión de los cambios de emergencia para minimizar futuras incidencias y asegurar que el cambio está controlado y se realiza de forma segura; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: '24.5'
      name: núm. 5
      description: Procedimiento de vuelta atrás (Rollback), incluyendo Procedimientos y responsabilidades para abortar y recuperar los cambios sin éxito y de acontecimientos imprevistos.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: 24.P1
      name: Párr. I
      description: 'La gestión del cambio incluye los siguientes componentes: Hardware, equipo de comunicaciones y Software sistemas y de aplicación, así como toda la documentación y los Procedimientos asociados con la Infraestructura Tecnológica.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: 24.P2
      name: Párr. II
      description: Sobre las aplicaciones de alta relevancia de la entidad, los Participantes del Mercado de Valores deben realizar una evaluación de Riesgo de los cambios propuestos que contemple un análisis del impacto en el negocio y en otros componentes de la Infraestructura Tecnológica.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24.p3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:24
      ref_id: 24.P3
      name: Párr. III
      description: Los Participantes del Mercado de Valores deben aplicar pruebas de seguridad en entornos apropiados para verificar que los cambios realizados no provocan Vulnerabilidades ni fallos de rendimiento que pudieran comprometer la seguridad de la Infraestructura Tecnológica y que los mismos no comprometan los controles de Seguridad Cibernética y de la Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:25
      assessable: true
      depth: 1
      ref_id: '25'
      name: Art. 25 – Separación de ambientes
      description: Los Participantes del Mercado de Valores deben contar con entornos aislados para ejecutar las fases de desarrollo, pruebas y puesta en producción de sistemas de Información, aplicaciones del negocio y comunicaciones para reducir Riesgos de Acceso no autorizados o cambios en el ambiente de producción.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:26
      assessable: true
      depth: 1
      ref_id: '26'
      name: Art. 26 – Instalación de Software
      description: Los Participantes del Mercado de Valores deben definir e implementar Procedimientos, reglas y mecanismos para controlar que la instalación y actualización de Software y aplicaciones, en los sistemas operativos, sea realizada por el personal autorizado para tales fines.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:26.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:26
      ref_id: 26.P
      name: Párr.
      description: 'La instalación y actualización de Software y aplicaciones en los sistemas operativos solo podrán ser implementados luego de realizar pruebas adecuadas en un ambiente separado de producción. Las pruebas realizadas deben contemplar, según corresponda, los aspectos siguientes:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:26.p.1
      assessable: true
      depth: 3
