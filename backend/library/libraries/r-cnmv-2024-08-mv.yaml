      name: núm. 7, lit. e)
      description: Documentación de cambios realizados a las configuraciones de los servicios de telefonía y conferencia como, por ejemplo, cambios de extensiones, restablecimiento de contraseñas de buzones y redireccionamiento de llamadas; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.7.f
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.7
      ref_id: 38.7.f
      name: núm. 7, lit. f)
      description: Despliegue de sistemas de telecomunicaciones alternos para asegurar la continuidad de las operaciones del negocio del Participante del Mercado de Valores dentro de un período razonable de tiempo de acuerdo al Plan de Contingencia.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39
      assessable: true
      depth: 1
      ref_id: '39'
      name: Art. 39 – Dispositivos Móviles
      description: 'Los Participantes del Mercado de Valores deben establecer mecanismos de seguridad para proteger la Información intercambiada a través de los Dispositivos Móviles utilizados por los empleados en el ejercicio de sus funciones laborales, incluyendo:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39
      ref_id: '39.1'
      name: núm. 1
      description: Gestión y autorización de los Accesos desde entornos remotos;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39
      ref_id: '39.2'
      name: núm. 2
      description: Gestión centralizada de los Dispositivos Móviles;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39
      ref_id: '39.3'
      name: núm. 3
      description: 'Protección de la Información: Los Dispositivos Móviles deben ser protegidos contra la divulgación no autorizada de Información, pérdida o hurto, mediante Control de Acceso y cifrado;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39
      ref_id: '39.4'
      name: núm. 4
      description: Conectividad segura de los Dispositivos Móviles;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:39
      ref_id: '39.5'
      name: núm. 5
      description: 'Dispositivos portátiles de almacenamiento: El uso de dispositivos portátiles de almacenamiento debe ser objeto de aprobación con Acceso restringido. El almacenamiento de Información en este tipo de dispositivos debe ser cifrada.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40
      assessable: true
      depth: 1
      ref_id: '40'
      name: Art. 40 – Comunicaciones electrónicas
      description: 'Los Participantes del Mercado de Valores deben asegurar las comunicaciones electrónicas, mediante controles y políticas de Seguridad Cibernética y de la Información, incluyendo:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40
      ref_id: '40.1'
      name: núm. 1
      description: 'Correos electrónicos: Los sistemas de correos electrónicos de los Participantes del Mercado de Valores deben estar protegidos por una combinación de procesos, concienciación y controles técnicos de Seguridad Cibernética y de la Información que contemplen lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.1.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.1
      ref_id: 40.1.a
      name: núm. 1, lit. a)
      description: Definición de política interna de correo electrónico, la cual debe contemplar Procedimientos para la configuración de buzones, escaneo de mensajes de correo para la detección y bloqueo de cualquier Amenaza de seguridad, términos y condiciones de uso y Monitoreo Continuo de actividad, así como la revisión de capacidades y requerimientos para su continuo funcionamiento;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.1.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.1
      ref_id: 40.1.b
      name: núm. 1, lit. b)
      description: Establecimiento de controles de seguridad para la prevención de la divulgación accidental de mensajes a través del cifrado, inhabilitación de funcionalidades de autoenvío, prohibición del uso de grandes listas de distribución y la presentación de advertencias a los usuarios previo al envío de correo a grandes grupos de destinatarios;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.1.c
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.1
      ref_id: 40.1.c
      name: núm. 1, lit. c)
      description: Establecimiento de controles de seguridad para el bloqueo de mensajes no deseados, mecanismos de no repudiación del origen y recepción de mensajes, así como de validación de direcciones IP.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40
      ref_id: '40.2'
      name: núm. 2
      description: 'Mensajería instantánea: Los servicios de mensajería instantánea deben ser protegidos mediante el establecimiento de un proceso de gestión que contemple las etapas de solicitud, autorización, implementación de los controles y la configuración de los elementos de Seguridad Cibernética y de la Información; y,'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:40
      ref_id: '40.3'
      name: núm. 3
      description: 'Servicios de comunicación de voz: Los servicios de comunicación de voz deben ser aprobados y protegidos por una combinación de controles tecnológicos, los cuales deben monitorearse regularmente y estar respaldados por restricciones en el Acceso.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:41
      assessable: true
      depth: 1
      ref_id: '41'
      name: Art. 41 – Gestión de proveedores externos
      description: 'Los Participantes del Mercado de Valores que contraigan obligaciones contractuales con proveedores externos de productos o servicios tecnológicos, deben asegurar la integración de los requerimientos de Seguridad Cibernética y de la Información, conforme a los aspectos siguientes:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:41.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:41
      ref_id: '41.1'
      name: núm. 1
      description: 'Tercerización: Establecer un proceso para regir la selección y gestión de los proveedores externos, apoyado en contratos que especifiquen los requisitos de Seguridad Cibernética y de la Información;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:41.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:41
      ref_id: '41.2'
      name: núm. 2
      description: 'Requisitos de seguridad a los proveedores externos: El cumplimiento de los requisitos de Seguridad Cibernética y de la Información debe revisarse de manera periódica durante la relación con los proveedores externos, contemplando el análisis y la gestión adecuada de los Riesgos.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:41.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:41
      ref_id: 41.P
      name: Párr.
      description: 'En los casos que los servicios provistos consideren Información financiera u otro tipo de Información sensible, los Participantes del Mercado de Valores deben solicitar a la entidad proveedora una evaluación enfocada en los Riesgos de Integridad, disponibilidad y Confidencialidad. Dicha evaluación debe ser realizada por un tercero independiente utilizando modelos de reportes de Riesgo y controles en la provisión de servicio (Por ejemplo: SOC 2, etc., u otras conforme a la naturaleza del servicio contratado).'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:42
      assessable: true
      depth: 1
      ref_id: '42'
      name: Art. 42 – Contratación de servicios de computación en la nube
      description: Los Participantes del Mercado de Valores deben documentar una política para el uso y contratación de servicios de computación en la nube, incluyendo el hospedaje de servicios web, que contemple el desarrollo de un análisis de los Riesgos de Seguridad Cibernética y de la Información de los servicios contratados para determinar el uso de los mismos por parte de los empleados, la Integridad de la Información almacenada y sus mecanismos de protección. Esta política debe ser comunicada a todos los empleados que puedan hacer uso de los mismos.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:43
      assessable: true
      depth: 1
      ref_id: '43'
      name: Art. 43 – Desarrollo de sistemas
      description: 'Los Participantes de Mercado de Valores que mantengan en su estructura orgánica un área de desarrollo de sistemas, deben establecer un proceso de gestión de desarrollo de sistemas que contemple:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:43.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:43
      ref_id: '43.1'
      name: núm. 1
      description: 'Metodología de Desarrollo de Sistemas: Las actividades de desarrollo de sistemas deben llevarse a cabo de acuerdo con una metodología de desarrollo documentada y apegada al Marco de Trabajo;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:43.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:43
      ref_id: '43.2'
      name: núm. 2
      description: 'Entorno de Desarrollo de Sistemas: Las actividades de desarrollo de sistemas se deben realizar en los entornos de desarrollo especializados, los cuales deben estar separados de los ambientes de desarrollo, preproducción y producción, así como protegidos contra Accesos no autorizados. Los datos de entornos productivos no deben ser utilizada o almacenada en los entornos de desarrollo. Deben establecerse mecanismos para asegurar la privacidad y protección de los datos de carácter personal en los ambientes de preproducción (aseguramiento de la calidad) y producción;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:43.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:43
      ref_id: '43.3'
      name: núm. 3
      description: 'Aseguramiento de la Calidad: El desarrollo de los sistemas debe realizarse siguiendo normas y pruebas de calidad que procuren que los controles y requisitos de Seguridad Cibernética y de la Información acordados sean implementados durante el ciclo de desarrollo del mismo.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:44
      assessable: true
      depth: 1
      ref_id: '44'
      name: Art. 44 – Interfaces programables de aplicaciones (API)
      description: Los sistemas y aplicaciones, que permitan la extensibilidad de funciones a través de interfaces de aplicaciones programables, deben contar con controles de Seguridad Cibernética y de la Información que regulen la interacción con otros sistemas y aplicaciones, tanto internos como de terceros. Del mismo modo, las aplicaciones desarrolladas que interactúen con estas interfaces de aplicaciones programables deben cumplir con los requerimientos de seguridad establecidos por los Participantes del Mercado de Valores.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45
      assessable: true
      depth: 1
      ref_id: '45'
      name: Art. 45 – Información a la Superintendencia
      description: 'Los Participantes del Mercado de Valores deben notificar mediante comunicación confidencial a la Superintendencia, a más tardar el día hábil siguiente, sobre la ocurrencia y las acciones tomadas para corregir los siguientes Eventos:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45
      ref_id: '45.1'
      name: núm. 1
      description: La activación del Plan de Contingencia o estrategias de recuperación de las operaciones del negocio;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45
      ref_id: '45.2'
      name: núm. 2
      description: La interrupción en el funcionamiento normal de los sistemas operativos y Software aplicativos principales que afecten la prestación de servicios a los clientes;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45
      ref_id: '45.3'
      name: núm. 3
      description: La decisión de realizar cambios en la plataforma central de operaciones y sistemas computarizados que afecten o podrían afectar la operatividad de la entidad;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45
      ref_id: '45.4'
      name: núm. 4
      description: La ocurrencia de Incidentes de seguridad relacionados con la realización exitosa de Ataques externos o penetración a los sistemas de la entidad a través de los servicios de red y comunicaciones, debidamente reportados previamente al CSIRT para aquellos que cuenten con acceso para realizar dichas notificaciones conforme al Párrafo II del artículo 2 de este Reglamento;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45
      ref_id: '45.5'
      name: núm. 5
      description: La decisión de implementar o cambiar la plataforma tecnológica utilizada para proporcionar servicios financieros por medios electrónicos; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:45
      ref_id: '45.6'
      name: núm. 6
      description: Cualquier Evento que provoque cambios no programados en la Infraestructura Tecnológica de la Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      assessable: true
      depth: 1
      ref_id: '46'
      name: Art. 46 – Criptografía
      description: 'Los Participantes del Mercado de Valores deben establecer políticas y Procedimientos sobre la gestión y empleo de controles criptográficos para asegurar la Integridad, disponibilidad, Confidencialidad, autenticidad y no repudio de la Información, los cuales deben incluir:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      ref_id: '46.1'
      name: núm. 1
      description: La administración de las soluciones criptográficas, contemplando la selección de herramientas y soluciones de cifrado, la gestión de solicitudes, aprobaciones y gestión de actualizaciones de soluciones y algoritmos de cifrado;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      ref_id: '46.2'
      name: núm. 2
      description: 'Mantenimiento de un registro de soluciones criptográficas aprobadas, contemplando lo siguiente:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2
      ref_id: 46.2.a
      name: núm. 2, lit. a)
      description: Especificación de la intención del uso de cifrado;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2
      ref_id: 46.2.b
      name: núm. 2, lit. b)
      description: Información sobre los usuarios autorizados a utilizar las mismas;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2.c
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2
      ref_id: 46.2.c
      name: núm. 2, lit. c)
      description: Detalles de los entornos locales donde se aplica la solución; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2.d
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.2
      ref_id: 46.2.d
      name: núm. 2, lit. d)
      description: Requerimientos de licenciamiento de la solución.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      ref_id: '46.3'
      name: núm. 3
      description: Análisis de Riesgos asociados al uso de soluciones criptográficas, incluyendo los algoritmos de Encriptación, cuando sean aplicados;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      ref_id: '46.4'
      name: núm. 4
      description: Uso, protección y duración de las claves criptográficas en todo su ciclo de vida;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      ref_id: '46.5'
      name: núm. 5
      description: Mecanismos para la distribución segura, almacenamiento, respaldo, recuperación, reemplazo y actualización de llaves criptográficas;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      ref_id: '46.6'
      name: núm. 6
      description: La forma de designación de los custodios de llaves criptográficas, incluyendo la sensibilización a usuarios sobre sus deberes y responsabilidades; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:46
      ref_id: '46.7'
      name: núm. 7
      description: Forma de revocación de llaves criptográficas en caso de que alguna llave haya sido comprometida o por modificación del custodio de llave criptográfica.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:47
      assessable: true
      depth: 1
      ref_id: '47'
      name: Art. 47 – Gestión de las Vulnerabilidades
      description: Los Participantes del Mercado de Valores deben contar con políticas, Procedimientos y mecanismos para identificar y evaluar de forma continua las Vulnerabilidades en la infraestructura, aplicaciones, páginas web y Bases de Datos que permitan determinar el tipo de Amenaza, impacto potencial y mejor curso de acción para hacer frente a cada Vulnerabilidad.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:47.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:47
      ref_id: 47.P
      name: Párr.
      description: Sobre las pruebas de penetración, las mismas deben llevarse a cabo con regularidad cada vez que sea necesario y en todo caso, por lo menos, una (1) vez al año con el objetivo de identificar nuevas Vulnerabilidades utilizando técnicas avanzadas y garantizando que las identificadas previamente han sido corregidas correctamente.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:48
      assessable: true
      depth: 1
      ref_id: '48'
      name: Art. 48 – Sincronización de reloj de sistemas e Infraestructura Tecnológica
      description: Los sistemas de procesamiento de Información relevantes o de dominio de seguridad de los Participantes del Mercado de Valores debe estar sincronizados para asegurar la exactitud de los registros de auditoría, los cuales podrán requerirse para investigaciones o como pruebas en acciones legales o disciplinarias. Al efecto, se deben establecer las políticas y Procedimientos internos.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:49
      assessable: true
      depth: 1
      ref_id: '49'
      name: Art. 49 – Registros y monitoreo de los usuarios administradores
      description: Los Participantes del Mercado de Valores deben contar con políticas, Procedimientos y mecanismos para proteger, revisar y registrar las actividades realizadas por los usuarios privilegiados de los sistemas e Infraestructura Tecnológica. Las revisiones deben realizarse, por lo menos, semestralmente o en un período inferior definido por la entidad en función de los hallazgos detectados en evaluaciones anteriores y de la necesidad del negocio.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      assessable: true
      depth: 1
      ref_id: '50'
      name: Art. 50 – Ciclo de vida del desarrollo de sistemas y aplicaciones
      description: 'Los Participantes del Mercado de Valores que mantengan en su estructura orgánica un área de desarrollo de sistemas, deben adoptar un ciclo de vida para el desarrollo seguro de sus sistemas y aplicaciones, tanto internas como tercerizadas, de acuerdo a las disposiciones siguientes:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      ref_id: '50.1'
      name: núm. 1
      description: 'Especificaciones de los requerimientos: Los requerimientos del negocio, incluidos los de Seguridad Cibernética y de la Información, deben ser contemplados durante la fase de especificación de requerimientos;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      ref_id: '50.2'
      name: núm. 2
      description: 'Diseño de sistemas y aplicaciones: Los requisitos de Seguridad Cibernética y de la Información para los sistemas que se encuentran en el ciclo de desarrollo deben ser considerados en el diseño de dichos sistemas y aplicaciones, a fin de minimizar las Vulnerabilidades;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      ref_id: '50.3'
      name: núm. 3
      description: 'Compilación de sistemas y aplicaciones: Las actividades de compilación de los sistemas y aplicaciones, incluyendo la codificación y personalización de paquetes, deben llevarse a cabo de conformidad con el Marco de Trabajo de la industria, realizadas por el personal especializado en el desarrollo de sistemas y aplicaciones. Las actividades de compilación deben ser inspeccionadas para identificar modificaciones o cambios no autorizados;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      ref_id: '50.4'
      name: núm. 4
      description: 'Prueba de sistemas y aplicaciones: Los sistemas y aplicaciones en desarrollo deben ser probados en una zona dedicada de pruebas que simule el entorno de producción, con la debida atención a los datos de carácter personal utilizada, antes de que el sistema o aplicación sea colocado en el ambiente de producción;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      ref_id: '50.5'
      name: núm. 5
      description: 'Pruebas de seguridad: Los sistemas y aplicaciones en desarrollo deben ser sometidos a pruebas de Seguridad Cibernética y de la Información en las fases requeridas dentro del ciclo de desarrollo, utilizando herramientas para la detección de Vulnerabilidades, pruebas de penetración y pruebas de Control de Acceso, previo a su colocación en los ambientes de producción;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      ref_id: '50.6'
      name: núm. 6
      description: 'Proceso de instalación: Los nuevos sistemas y aplicaciones se deben instalar en el entorno de producción, de acuerdo con un proceso documentado que contemple los requerimientos de Seguridad Cibernética y de la Información; y,'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:50
      ref_id: '50.7'
      name: núm. 7
      description: 'Revisiones luego de las implementaciones: Luego de la implementación, se deben realizar revisiones periódicas de acuerdo con procesos documentados, incluyendo la cobertura de la Seguridad Cibernética y de la Información.'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:51
      assessable: true
      depth: 1
      ref_id: '51'
      name: Art. 51 – Gobierno de Seguridad Cibernética y de la Información
      description: Los Participantes del Mercado de Valores deben contar con un Gobierno de Seguridad Cibernética y de la Información, el cual se constituye como parte integral del programa de gobierno empresarial-corporativo que brinda dirección estratégica para garantizar que se logren los objetivos del negocio y determina que el Riesgo tecnológico se administre de forma apropiada y que los recursos se utilicen con responsabilidad.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:51.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:51
      ref_id: 51.P
      name: Párr.
      description: 'Los Participantes del Mercado de Valores deben contar con una estructura organizacional y funcional de control de Seguridad Cibernética y de la Información acordes a su naturaleza, tamaño, complejidad, perfil de riesgo e importancia sistémica, la cual estará conformada por:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:51.p.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:51.p
      ref_id: 51.P.a
      name: Párr., lit. a)
      description: El comité funcional de Seguridad Cibernética y de la Información especializado o cuyas funciones sean asumidas por el comité de Riesgos de la entidad;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:51.p.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:51.p
      ref_id: 51.P.b
      name: Párr., lit. b)
      description: La estructura gerencial quien dirigirá el Programa de Seguridad Cibernética y de la Información, en el marco de las responsabilidades definidas en este Reglamento.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      assessable: true
      depth: 1
      ref_id: '52'
      name: Art. 52 – Responsabilidad del consejo de administración
      description: 'El consejo de administración será responsable del cumplimiento de los principios y lineamientos básicos en materia de Seguridad Cibernética y de la Información. En tal virtud, el consejo debe cumplir con las responsabilidades que se detallan a continuación:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.1'
      name: núm. 1
      description: Establecer y velar por la existencia de un Gobierno de Seguridad Cibernética y de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.2'
      name: núm. 2
      description: Evaluar y aprobar un sistema de gestión de la Seguridad Cibernética y de la Información que proporcione la estrategia y enfoque estándar, formal y continuo a la gestión de seguridad para la Información y procesos de negocios que estén alineados con los requerimientos de negocio y la gestión de seguridad del Participante del Mercado de Valores;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.3'
      name: núm. 3
      description: Aprobar el programa de Seguridad Cibernética y de la Información, incluyendo los objetivos, lineamientos y políticas en dicha materia y sus Riesgos, así como velar por su cumplimiento;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.4'
      name: núm. 4
      description: Proveer los recursos necesarios para lograr el cumplimiento de las políticas y lineamientos en materia de Seguridad Cibernética y de la Información y de las disposiciones contenidas en este Reglamento;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.5'
      name: núm. 5
      description: Velar para que los Riesgos relacionados con la Seguridad Cibernética y de la Información no excedan la tolerancia de Riesgo de la entidad;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.6'
      name: núm. 6
      description: Dar seguimiento al cumplimiento de la implementación de sistemas de Información propios, adquiridos o subcontratados, con la normativa vigente aplicable;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.7'
      name: núm. 7
      description: Adoptar las políticas que contemplen las estrategias de índole técnica, organizativa y de seguridad necesarias para salvaguardar los datos de carácter personal y eviten su alteración, pérdida, tratamiento, consulta o Acceso no autorizado;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.8
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.8'
      name: núm. 8
      description: Aprobar y dar seguimiento al Plan de Continuidad de Negocios, Plan de Contingencia y programas de pruebas de estrés, como parte de su proceso de gestión integral de Riesgo;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52.9
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:52
      ref_id: '52.9'
      name: núm. 9
      description: Asegurar que exista un sistema adecuado de delegación de responsabilidades y segregación de funciones en la entidad.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      assessable: true
      depth: 1
      ref_id: '53'
      name: Art. 53 – Comité funcional de Seguridad Cibernética y de la Información
      description: 'Los Participantes del Mercado de Valores deben establecer un comité funcional de Seguridad Cibernética y de la Información, cuyas responsabilidades se detallan a continuación:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: '53.1'
      name: núm. 1
      description: Diseñar los lineamientos para la Seguridad Cibernética y de la Información y el mantenimiento del programa de Seguridad Cibernética y de la Información, en consonancia con los objetivos estratégicos de la entidad, evaluados y aprobados por el consejo de administración;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: '53.2'
      name: núm. 2
      description: Someter al consejo de administración, para su aprobación, las políticas del programa de Seguridad Cibernética y de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: '53.3'
      name: núm. 3
      description: Evaluar la efectividad del programa de Seguridad Cibernética y de la Información en consonancia con los objetivos estratégicos de la entidad;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: '53.4'
      name: núm. 4
      description: Aprobar las conexiones de redes externas a los sistemas y redes informáticas identificadas por el área a cargo de la Seguridad Cibernética y de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: '53.5'
      name: núm. 5
      description: Asignar y verificar el cumplimiento de las funciones y responsabilidades de Seguridad Cibernética y de la Información para los roles definidos en el área correspondiente;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: '53.6'
      name: núm. 6
      description: Ratificar las decisiones de tratamiento de Riesgo en coordinación con las áreas pertinentes de negocios, previamente presentados por el oficial de Seguridad Cibernética y de la Información; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: '53.7'
      name: núm. 7
      description: Comunicar al consejo de administración los resultados de las valoraciones sobre los aspectos de Seguridad Cibernética y de la Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: 53.P1
      name: Párr. I
      description: 'El comité funcional de Seguridad Cibernética y de la Información estará integrado por un número impar, como mínimo, de tres (3) miembros con voz y voto:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p1.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p1
      ref_id: 53.P1.a
      name: Párr. I, lit. a)
      description: Un miembro del consejo de administración que no ocupe cargos ejecutivos en el Participante del Mercado de Valores, quien lo presidirá;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p1.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p1
      ref_id: 53.P1.b
      name: Párr. I, lit. b)
      description: El Ejecutivo Principal del Participante del Mercado de Valores;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p1.c
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p1
      ref_id: 53.P1.c
      name: Párr. I, lit. c)
      description: Un miembro de la Alta Gerencia designado por el consejo de administración cuyas funciones guarden relevancia en la materia.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: 53.P2
      name: Párr. II
      description: El oficial de Seguridad Cibernética y la Información fungirá como secretario del comité funcional de Seguridad Cibernética y de la Información y participará con voz, pero sin voto.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: 53.P3
      name: Párr. III
      description: En las reuniones del comité deberán asistir en calidad de invitados permanentes el Ejecutivo Principal en materia de tecnología y el gerente de Riesgos. De igual forma, podrán asistir a las reuniones del comité en calidad de invitados con voz, pero sin voto, el personal u otros ejecutivos de la entidad que los miembros del comité consideren necesarios para la presentación y sustentación de los temas que se deban tratar en la respectiva sesión, lo cual se hará constar en el acta levantada de la reunión.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: 53.P4
      name: Párr. IV
      description: Las entidades deben remitir la integración del comité a la Superintendencia en un plazo de quince (15) días hábiles, contados a partir de su designación. De igual forma, cualquier modificación en la composición del comité debe ser comunicada a la Superintendencia, a más tardar, cinco (5) días hábiles luego del hecho.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: 53.P5
      name: Párr. V
      description: Las labores del comité funcional de Seguridad Cibernética y de la Información podrán ser asumidas por el comité de Riesgos de los Participantes del Mercado de Valores (el cual no alterará su composición en este caso) que, por su naturaleza, complejidad, perfil de Riesgo e importancia sistémica así lo requieran. En estas entidades, el proceso de gestión integral de Riesgos debe tomar en consideración el programa de Seguridad Cibernética y de la Información en lo que respecta a los Riesgos asociados a dicha materia. Cuando el comité de Riesgos sesione en calidad de comité funcional de Seguridad Cibernética y de la Información deben participar, con voz y sin voto, el oficial de Seguridad Cibernética y la Información y el Ejecutivo Principal en materia de tecnología.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53.p6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:53
      ref_id: 53.P6
      name: Párr. VI
      description: La Superintendencia vía norma técnica u operativa establecerá las disposiciones relativas al comité funcional de Seguridad Cibernética y de la Información
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:54
      assessable: true
      depth: 1
      ref_id: '54'
      name: Art. 54 – Estructura gerencial y funciones de control de Seguridad Cibernética y de la Información
      description: Los Participantes del Mercado de Valores deben contar con una estructura gerencial para el control de Seguridad Cibernética y de la Información acordes a su naturaleza, tamaño, y complejidad. El programa establecido en el marco de las responsabilidades definidas en este Reglamento será dirigido por la unidad funcional de Seguridad Cibernética y de la Información, la cual estará a cargo del oficial de Seguridad Cibernética y la Información y reportará directamente al Ejecutivo Principal y al consejo de administración.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:55
      assessable: true
      depth: 1
      ref_id: '55'
      name: Art. 55 – Oficial de Seguridad Cibernética y de la Información
      description: El oficial de Seguridad Cibernética y de la Información debe contar con la competencia y capacidad requerida para sus funciones. Según la estructura de cada Participante del Mercado de Valores, el oficial de Seguridad Cibernética y la Información, debe tener suficiente autoridad e independencia para cumplir con sus responsabilidades.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      assessable: true
      depth: 1
      ref_id: '56'
      name: Art. 56 – Responsabilidades del oficial de Seguridad Cibernética y de la Información
      description: 'El oficial de Seguridad Cibernética y de la Información debe cumplir, al menos, con las responsabilidades siguientes:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.1'
      name: núm. 1
      description: Desarrollar, implementar y mantener actualizado el programa de Seguridad Cibernética y de la Información, el cual debe ser revisado y actualizado una vez al año;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.2'
      name: núm. 2
      description: Presentar informes periódicos o, al menos, un informe anual al consejo de administración sobre el contenido, aplicabilidad y actualización de las políticas establecidas en materia de Seguridad Cibernética y de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.3'
      name: núm. 3
      description: Implementar políticas, estándares y Procedimientos apropiados para apoyar el programa de Seguridad Cibernética y de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.4'
      name: núm. 4
      description: Asignar las responsabilidades de los miembros que conforman las áreas especializadas;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.5'
      name: núm. 5
      description: Gestionar las acciones para el tratamiento del Riesgo tecnológico en coordinación con las áreas pertinentes del negocio;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.6'
      name: núm. 6
      description: Cumplir con los límites de los niveles de Riesgos relevantes establecidos por el consejo de administración, relacionados con Amenazas o Incidentes Significativos;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.7
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.7'
      name: núm. 7
      description: Monitorear permanentemente el estado de la Seguridad Cibernética y de la Información y rendir informes periódicos según la necesidad sobre los hallazgos y Riesgos identificados al comité funcional de Seguridad Cibernética y de la Información;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.8
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.8'
      name: núm. 8
      description: Cumplir con las atribuciones asignadas y decisiones tomadas por el consejo de administración; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56.9
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:56
      ref_id: '56.9'
      name: núm. 9
      description: Definir y evaluar las responsabilidades de los proveedores de servicios en lo concerniente a la Seguridad Cibernética y de la Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:57
      assessable: true
      depth: 1
      ref_id: '57'
      name: Art. 57 – Autoevaluación
      description: Los Participantes del Mercado de Valores deben autoevaluar su cumplimiento normativo en materia de Seguridad Cibernética y de la Información con periodicidad anual. Los resultados de dicha evaluación, así como los de la evaluación del nivel de exposición en materia de Seguridad Cibernética y de la Información deben presentarse anualmente al consejo de administración.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:57.p
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:57
      ref_id: 57.P
      name: Párr.
      description: Las evaluaciones deben contemplar los Eventos que involucren la divulgación no autorizada de Información, la corrupción accidental o deliberada, la manipulación de la Información y la disponibilidad de los entornos en cualquier período.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:58
      assessable: true
      depth: 1
      ref_id: '58'
      name: Art. 58 – Auditoría interna
      description: Los Participantes del Mercado de Valores deben establecer procesos de auditorías internas para garantizar la supervisión efectiva del programa de Seguridad Cibernética y de la Información y del estado de la Seguridad Cibernética y de la Información en sus sistemas de Información y de la Infraestructura Tecnológica. El resultado de las auditorías internas debe contener la documentación y notificación a las partes interesadas de sus conclusiones y recomendaciones.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:59
      assessable: true
      depth: 1
      ref_id: '59'
      name: Art. 59 – Evaluación de un tercero independiente
      description: Los Participantes del Mercado de Valores deben realizar evaluaciones independientes sobre el cumplimiento normativo en materia de Seguridad Cibernética y de la Información, con una periodicidad no mayor de tres (3) años.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:59.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:59
      ref_id: 59.P1
      name: Párr. I
      description: La evaluación inicial se llevará a cabo dentro de los tres (3) años contados a partir de la entrada en vigencia de este Reglamento.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:59.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:59
      ref_id: 59.P2
      name: Párr. II
      description: La entidad debe contar por lo menos con cinco (5) años de experiencia y con las calificaciones e independencia necesaria para realizar la evaluación.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:59.p3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:59
      ref_id: 59.P3
      name: Párr. III
      description: Los Participantes del Mercado de Valores deben presentar las auditorías realizadas por auditores externos inscritos en el Registro del Mercado de Valores al consejo de administración posterior a la evaluación por parte del comité de auditoría.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:60
      assessable: false
      depth: 1
      ref_id: '60'
      name: Art. 60 – Normativa complementaria
      description: El superintendente, mediante normas técnicas u operativas, emitirá el contenido y otros requisitos aplicables para la elaboración, implementación y manejo del programa de Seguridad Cibernética y de la Información de los Participantes del Mercado de Valores.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:61
      assessable: false
      depth: 1
      ref_id: '61'
      name: Art. 61 – Obligatoriedad
      description: Las disposiciones establecidas en este Reglamento son de cumplimiento obligatorio y, en caso de incumplimiento, se aplicarán las sanciones previstas en la Ley y el Reglamento del Procedimiento Administrativo Sancionador.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:62
      assessable: false
      depth: 1
      ref_id: '62'
      name: Art. 62 – Entrada en vigencia
      description: Las disposiciones de este Reglamento entran en vigencia en el plazo de seis (6) meses, contados a partir del día hábil siguiente a su publicación.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:63
      assessable: true
      depth: 1
      ref_id: '63'
      name: Art. 63 – Plazo de adecuación
      description: Los Participantes del Mercado de Valores deben adecuarse a las disposiciones del presente Reglamento en el plazo máximo de doce (12) meses contados a partir de su entrada en vigencia.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:63.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:63
      ref_id: 63.P1
      name: Párr. I
      description: 'Para el fin anterior, los Participantes del Mercado de Valores deben remitir a la Superintendencia un cronograma de adecuación gradual que, al menos, se ajuste a la siguiente distribución en su implementación: Trimestre 1 % Trimestre 2 % Trimestre 3 % Trimestre 4 %'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:63.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:63
      ref_id: 63.P2
      name: Párr. II
      description: El cronograma de adecuación indicado en párrafo anterior debe remitirse a la Superintendencia dentro de noventa (90) días hábiles, contados a partir del día hábil siguiente a la publicación de este Reglamento.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:63.p3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:63
      ref_id: 63.P3
      name: Párr. III
      description: Los Participantes del Mercado de Valores deberán remitir un informe trimestral a la Superintendencia sobre su nivel de avance o ejecución de la adecuación reglamentaria conforme al cronograma notificado. No obstante, los Participantes del Mercado de Valores que, por su nivel de sofisticación y estrategias de mitigación de Riesgos, estén avanzados en el cumplimiento de los estándares de este Reglamento, deben notificarlo a la Superintendencia.
