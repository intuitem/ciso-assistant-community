      ref_id: 38.4.c
      name: núm. 4, lit. c)
      description: Bloqueo de paquetes maliciosos;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.4.d
      assessable: true
