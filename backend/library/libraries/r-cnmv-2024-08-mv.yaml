      description: Controles especializados para la infraestructura de telefonía como, por ejemplo, la separación del tráfico de voz, aplicación de configuraciones de seguridad a teléfonos, enrutadores, centrales PBX, cifrado de dispositivos, conexiones, escaneo de Vulnerabilidades y el registro y Monitoreo Continuo de Eventos;
