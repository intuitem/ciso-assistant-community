      ref_id: 36.3.a
      name: núm. 3, lit. a)
      description: Determinación de ocurrencia de Ataque para descartar los falsos positivos;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:36.3.b
      assessable: true
