      ref_id: '29'
      name: Art. 29 – Protección de Bases de Datos
      description: Los Participantes del Mercado de Valores deben definir e implementar Procedimientos para asegurar la Integridad y consistencia de toda la Información almacenada en formato electrónico, tales como, Bases de Datos, almacenes de datos (data warehouses) y archivos de datos.
