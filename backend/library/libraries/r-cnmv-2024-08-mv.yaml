      name: núm. 4, lit. e)
      description: Pruebas de funcionamiento y efectividad de reglas, previo a su aplicación.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38
      ref_id: '38.5'
      name: núm. 5
      description: 'Acceso y mantenimiento remoto:'
