    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      assessable: true
      depth: 1
      ref_id: '27'
      name: Art. 27 – Respaldos
      description: 'Los Participantes del Mercado de Valores deben contar con una política de gestión de copias de respaldos de seguridad de sistemas, aplicaciones, datos y documentación. Dicha política debe contemplar:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: '27.1'
      name: núm. 1
      description: Ejecución de respaldos de Información y de Software exactas y completas, las cuales deben probarse regularmente acorde con la política de respaldo;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: '27.2'
      name: núm. 2
      description: Procedimientos documentados para el resguardo y recuperación de la Información, cubriendo los requerimientos del negocio, métodos, herramientas y frecuencia de realización;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: '27.3'
      name: núm. 3
      description: Registros o equivalentes que detallen la Información resguardada, la fecha y la hora, así como la fecha de expiración, el tipo de medio utilizado y su ubicación física;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: '27.4'
      name: núm. 4
      description: Esquemas de etiquetado de copias de seguridad de los datos para su correcta identificación, para sistemas que realicen copias en cinta;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: '27.5'
      name: núm. 5
      description: Controles para la prevención de la escritura accidental.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: 27.P1
      name: Párr. I
      description: Los Participantes del Mercado de Valores deben contar con entornos locales seguros de Acceso restringido, procurando el almacenamiento de las copias de resguardo en formato físico con el nivel apropiado de protección ambiental y conforme a los métodos indicados por los fabricantes y, en caso de las copias de resguardo en formato digital, en la nube o en un ambiento con diferentes niveles de Acceso y de localización.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: 27.P2
      name: Párr. II
      description: Los respaldos de seguridad de sistemas, aplicaciones, datos y documentación deben probarse regularmente para asegurar que pueden ser confiables para el uso cuando sean necesarios. La prueba debe contemplar la capacidad para restaurar los datos de respaldo en medios dedicados a ensayos.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.p3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: 27.P3
      name: Párr. III
      description: Los Participantes del Mercado de Valores deben contar con almacenamiento apartado, con la suficiente distancia definida por la entidad, para la salvaguarda de cualquier daño de un desastre en el sitio principal.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.p4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: 27.P4
      name: Párr. IV
      description: Los Participantes del Mercado de Valores, cuya Infraestructura Tecnológica sea administrada por un proveedor de servicios, deben asegurarse que los sistemas, aplicaciones, datos y documentación se encuentran adecuadamente respaldados según los lineamientos citados en este Reglamento y acorde a sus políticas y procedimientos.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.p5
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: 27.P5
      name: Párr. V
      description: El resguardo de la Información Esencial deberá ser conservado de conformidad con el grado de utilidad de la misma para los fines de restauración. Dicha Información deberá ser cifrada. El tiempo de retención para la Información Esencial de Tipo Transaccional será de, por lo menos, un (1) año. Para la Información Esencial de Tipo Maestro, la entidad deberá resguardar en todo momento la más actualizada de las versiones disponibles de dicha Información.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27.p6
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:27
      ref_id: 27.P6
      name: Párr. VI
      description: Para las copias de resguardo de pistas de auditoría, el tiempo de retención será de, por lo menos, ciento ochenta (180) días.
