      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.5
      ref_id: 38.5.a
      name: núm. 5, lit. a)
      description: Establecer responsabilidades y Procedimientos para la gestión de los activos de Tecnologías y de Información remotos;
