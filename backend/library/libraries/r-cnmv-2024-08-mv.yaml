      name: Art. 1 – Objeto
      description: Establecer los criterios y lineamientos generales que deben adoptar los Participantes del Mercado de Valores para procurar la Integridad, disponibilidad y Confidencialidad de la Información y el funcionamiento óptimo de los sistemas de Información y de la Infraestructura Tecnológica. Asimismo, establecer la adopción e implementación de prácticas para la gestión de Riesgos de la Seguridad Cibernética y de la Información.
