      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.5
      ref_id: 38.5.e
      name: núm. 5, lit. e)
      description: Establecer Procedimientos para la gestión de mantenimiento remoto de sistemas críticos por terceros autorizados, contemplando la definición de objetivos y alcance del mantenimiento planificado, controles para el registro de Acceso individualizado por cada tercero, mecanismos de autorización de Acceso a los sistemas mediante credenciales únicas especializadas y su revocación tras la finalización del mantenimiento;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.5.f
      assessable: true
