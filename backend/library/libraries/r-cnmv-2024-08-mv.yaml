      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.6
      ref_id: 38.6.g
      name: núm. 6, lit. g)
      description: Aplicación de múltiples capas de protección para la red, tales como, listas de Control de Acceso, autenticación de dispositivos y de usuarios;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.6.h
