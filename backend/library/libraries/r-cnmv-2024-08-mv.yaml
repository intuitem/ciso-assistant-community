      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.5
      ref_id: 38.5.h
      name: núm. 5, lit. h)
      description: Definir los controles para aplicaciones de gestión de mantenimiento remoto, contemplando aspectos de gestión de Acceso, análisis de origen y destino de conexiones, así como el Monitoreo Continuo de las actividades realizadas en cada sesión y la inhabilitación de la conexión tras la conclusión del mantenimiento.
