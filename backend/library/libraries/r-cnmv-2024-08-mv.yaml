      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:36.3
      ref_id: 36.3.b
      name: núm. 3, lit. b)
      description: Determinación de tipo de Ataque y trazabilidad del mismo;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:36.3.c
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:36.3
      ref_id: 36.3.c
      name: núm. 3, lit. c)
      description: Identificación de vectores de Ataque; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:36.3.d
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:36.3
      ref_id: 36.3.d
      name: núm. 3, lit. d)
      description: Cuantificación estimada del posible impacto del Ataque.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:37
      assessable: true
      depth: 1
      ref_id: '37'
      name: Art. 37 – Protección de Software malicioso
      description: Los Participantes del Mercado de Valores deben contar con políticas, Procedimientos y mecanismos para la detección, prevención y recuperación para proteger de Software malicioso a los sistemas e Infraestructura Tecnológica, así como Procedimientos y capacitación continua y adecuada para concientizar a sus empleados sobre el Software malicioso. De igual manera, los Participantes del Mercado de Valores deberán informar y hacer recomendaciones a los usuarios a los fines de concientizarlos sobre el Software malicioso.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:37.p1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:37
      ref_id: 37.P1
      name: Párr. I
      description: Al efecto, los Participantes del Mercado de Valores deben instalar y desplegar sistemas para la protección contra Software malicioso en todos los dispositivos que formen parte de la Infraestructura Tecnológica de la entidad.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:37.p2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:37
      ref_id: 37.P2
      name: Párr. II
      description: De igual forma, los Participantes del Mercado de Valores deben mantener configuraciones adecuadas para los sistemas de protección contra Software malicioso que contemple políticas para la protección en tiempo real, la programación de escaneos en escalas de tiempo definidas, la notificación de potenciales infecciones, la inhabilitación y cuarentena de archivos infectados, la remoción de cualquier Software malicioso y archivos infectados asociados al mismo.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:37.p3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:37
      ref_id: 37.P3
      name: Párr. III
      description: los Participantes del Mercado de Valores deben realizar análisis y escaneos periódicos a los componentes de la Infraestructura Tecnológica.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38
      assessable: true
      depth: 1
      ref_id: '38'
      name: Art. 38 – Gestión de la red
      description: 'Los Participantes del Mercado de Valores deben implementar los controles para garantizar la seguridad y protección de la Información en los componentes de redes y la protección de los servicios conectados e Información en tránsito. Por lo cual, deben establecer:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.1
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38
      ref_id: '38.1'
      name: núm. 1
      description: 'Configuración de dispositivos de la red: Los dispositivos de red deben ser configurados para funcionar de acuerdo con su rol y con los controles de seguridad que eviten cambios no autorizados o incorrectos;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.2
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38
      ref_id: '38.2'
      name: núm. 2
      description: 'Gestión de la red física: Las redes deben ser protegidas por controles físicos de seguridad, con el apoyo de documentación actualizada y el etiquetado de los componentes esenciales, los puntos de Acceso a la red deben estar protegidos por Mecanismos de Control de Acceso;'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.3
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38
      ref_id: '38.3'
      name: núm. 3
      description: 'Conexiones de redes externas: Las conexiones de redes externas a los sistemas y redes informáticas deben ser identificadas, verificadas, registradas y aprobadas individualmente por el personal designado o comité funcional de Seguridad Cibernética y de la Información, para lo cual deben establecer:'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.3.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.3
      ref_id: 38.3.a
      name: núm. 3, lit. a)
      description: Procedimientos para la gestión de las conexiones con redes externas que contemplen la identificación individual de cada conexión externa a otros sistemas y redes, mecanismos de Acceso a dispositivos autorizados, documentación de conexiones externas y remoción de conexiones innecesarias;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.3.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.3
      ref_id: 38.3.b
      name: núm. 3, lit. b)
      description: Mecanismos de protección que contemplen la restricción de las conexiones a los puntos de entrada definidos, verificación de la fuente de las conexiones externas y registro de las mismas, así como registro de potenciales violaciones a la política de seguridad interna; y,
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.3.c
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.3
      ref_id: 38.3.c
      name: núm. 3, lit. c)
      description: Aislamiento de dispositivos desconocidos o inseguros en un segmento de cuarentena para los fines de configuración y actualización de los mismos.
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.4
      assessable: true
      depth: 2
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38
      ref_id: '38.4'
      name: núm. 4
      description: 'Tráfico de datos a través de los firewalls (cortafuegos):'
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.4.a
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.4
      ref_id: 38.4.a
      name: núm. 4, lit. a)
      description: La configuración del filtrado de tráfico debe utilizar reglas predefinidas tomando en cuenta los principios del menor privilegio, por defecto, y revisada periódicamente;
    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.4.b
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.4
      ref_id: 38.4.b
      name: núm. 4, lit. b)
      description: Los firewalls (cortafuegos) deben contar con reglas de protección y protocolos de comunicación propensos a abusos por Ataques;
