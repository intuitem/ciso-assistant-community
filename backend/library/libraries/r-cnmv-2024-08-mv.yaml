      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.6
      ref_id: 38.6.h
      name: núm. 6, lit. h)
      description: Uso de mecanismos para el filtrado de seguridad para prevenir el Acceso no autorizado a la red;
