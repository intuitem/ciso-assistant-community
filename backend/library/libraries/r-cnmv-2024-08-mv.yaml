    - urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.6.f
      assessable: true
      depth: 3
      parent_urn: urn:soluciones-ge:risk:req_node:r-cnmv-2024-08-mv:38.6
      ref_id: 38.6.f
      name: núm. 6, lit. f)
      description: Uso de identificadores de servicios (SSID, por sus siglas en inglés) ocultos en redes privadas para evitar revelar Información importante de la red inalámbrica;
