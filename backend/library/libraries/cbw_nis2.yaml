    - urn: urn:intuitem:risk:req_node:cbw_nis2_control_framework:17.1
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:cbw_nis2_control_framework:meldplicht-(art.-25):3
      ref_id: '17.1'
      description: De entiteit brengt, in het geval van een significant incident,
        de ontvangers van haar diensten zo snel mogelijk op de hoogte wanneer het
        incident een nadelige invloed kan hebben op de dienstverlening. Daarnaast
        deelt de entiteit mee welke maatregelen deze ontvangers kunnen nemen in reactie
        op de dreiging.
      translations:
        en:
          description: In the event of a significant incident, the entity will notify
            the recipients of its services as soon as possible if the incident could
            adversely affect service provision. The entity will also communicate the
            measures these recipients can take in response to the threat.
