urn: urn:intuitem:risk:library:cbw_nis2_control_framework
locale: nl
ref_id: Cbw_NIS2_Control_Framework
name: Cbw (NIS2) Control Framework (v1.2)
description: '## Introductie


  De evaluatietool is opgesteld als praktisch hulpmiddel om organisaties te ondersteunen
  bij het op een effectieve wijze verkrijgen van inzicht in de mate waarin zij voldoen
  aan de Cyberbeveiligingswet (Cbw) en het onderliggende Cyberbeveiligingsbesluit
  (Cbb).


  De evaluatietool is ontwikkeld om inzicht te geven in de huidige staat van cyberweerbaarheid
  en om verbeterpotentieel te identificeren, gebaseerd op de eisen zoals vastgelegd
  in de Cbw en Cbb. Het Cbw (NIS2) Control Framework vervangt de geldende wet- en
  regelgeving niet, maar maakt deze inzichtelijk en hanteerbaar - zie ook het studierapport
  vanaf p. 16. De Cbw en de Cbb dagen organisaties uit om middels risicoanalyse en
  inzicht in de eigen organisatie de Cbw en de Cbb te implementeren. Medewerkers van
  organisaties zijn zelf verantwoordelijk voor het kennen en naleven van de relevante
  wet- en regelgeving. Bovendien dient bij het gebruik ervan altijd rekening te worden
  gehouden met de specifieke context en kenmerken van de organisatie en haar omgeving.'
copyright: 'Unless otherwise noted, everything in this work is licensed under a Creative
  Commons Attribution 4.0 License.

  If you wish to use this work, please use the following attribution method: ADR &
  NOREA, Cbw (NIS2) Control Framework (2025), CC-BY 4.0 licensed

  The full license text can be read at: https://creativecommons.org/licenses/by/4.0/.'
version: 1
publication_date: 2026-08-07
provider: ADR (Auditdienst Rijk) & NOREA
packager: intuitem
translations:
  en:
    name: Cbw (NIS2) Control Framework (v1.2)
    description: "## Introduction\n\nThe evaluation tool has been developed as a practical\
      \ tool to support organizations in effectively gaining insight into their compliance\
      \ with the Cybersecurity Act (Cbw) and the underlying Cybersecurity Decree (Cbb).\n\
      \nThe evaluation tool was developed to provide insight into the current state\
      \ of cyber resilience and to identify potential for improvement, based on the\
      \ requirements laid out in the Cbw and Cbb. The Cbw (NIS2) Control Framework\
      \ does not replace current laws and regulations, but rather makes them transparent\
      \ and manageable \u2013 see also the study report from p. 16 onwards. The Cbw\
      \ and Cbb challenge organizations to implement the Cbw and Cbb through risk\
      \ analysis and insight into their own organization. Employees of organizations\
      \ are responsible for knowing and complying with the relevant laws and regulations.\
      \ Furthermore, the specific context and characteristics of the organization\
      \ and its environment should always be taken into account when using the tool."
