urn: urn:intuitem:risk:library:workflow-compliance-audit-ai-review
locale: en
ref_id: workflow-compliance-audit-ai-review
name: Audit — AI evidence challenge
description: 'Walks the requirements an audit calls compliant or partially compliant, asks the configured
  AI provider whether what is attached actually supports that claim, and files the answers as a managed
  document of type Record. Run it with audit_id set to the audit you want reviewed. The model never
  changes a result or a score — those are not writable by any workflow — so the review lands as a
  document a person reads, next to the audit it questions. Reviews up to 25 requirements per run.

  The platform''s own quality checks run first, and anything they flag costs no AI call: the finding is
  already written, already translated, and carries a rule id. Only the requirements the rules pass are
  put to the model, and only for what a rule cannot decide — whether the attached evidence is about what
  the requirement asks for, and whether it is recent enough to describe the present. Three more calls
  write the three sections, so a run stays well inside WORKFLOW_AI_MAX_CALLS_PER_RUN (50 by default). Needs an AI provider configured in Global settings — without
  one the AI steps fail and the run stops rather than guessing.'
copyright: © intuitem
version: 1
publication_date: 2026-09-20
provider: intuitem
packager: intuitem
objects:
  workflows:
  - urn: urn:intuitem:risk:library:workflow-compliance-audit-ai-review:workflow:audit-ai-review
    schema_version: 1
    ref_id: audit-ai-review
    name: Audit — AI evidence challenge
    description: 'A second opinion on an audit''s own conclusions: for each requirement claimed compliant,
      the model weighs the expectation against the controls and evidence attached to it and says whether
      the claim is supported, thin or unsupported. The verdicts become a Record document linking back to
      the audit. Results and scores stay untouched — a workflow cannot write them.'
    graph:
      variables:
      - key: audit_id
        type: string
        default_value: ''
      - key: audit_name
        type: string
        default_value: ''
      # The quality check's own findings, lifted into variables so a branch can
      # ask the only question that matters: has a rule already spoken? Compared
      # against '[]' because that is what an empty list renders as, and a
      # condition reads a declared variable rather than a path.
      - key: qc_errors
        type: string
        default_value: '[]'
      - key: qc_warnings
        type: string
        default_value: '[]'
      - key: ai_verdict
        type: string
        default_value: ''
      - key: ai_note
        type: string
        default_value: ''
      - key: record
        type: json
        default_value: {}
      - key: write_concerns
        type: string
        default_value: ''
      - key: write_look
        type: string
        default_value: ''
      - key: write_backed
        type: string
        default_value: ''
      nodes:
      - ref: start
        type: trigger
        label: Run the review
        trigger_config:
          type: manual
      - ref: check_id
        type: condition
        label: Was an audit given?
        branches:
        - name: given
          condition_groups:
          - operator: and
            conditions:
            - variable: audit_id
              op: neq
              value: ''
        - name: missing
          is_default: true
      - ref: no_audit
        type: action
        label: Nothing to review
        action_config:
          type: log
          message: 'No audit_id was given. Run this workflow with "Run with variables" and set audit_id
            to the audit you want reviewed.'
      - ref: read_audit
        type: action
        label: Find the audit
        action_config:
          type: read_objects
          model: compliance_assessment
          mode: first
          filters:
            operator: and
            conditions:
            - field: id
              op: eq
              value: '{{audit_id}}'
        output_mapping:
          audit_name: object.name
      - ref: check_found
        type: condition
        label: Is it in this workflow's scope?
        branches:
        - name: found
          condition_groups:
          - operator: and
            conditions:
            - variable: audit_name
              op: neq
              value: ''
        - name: not_found
          is_default: true
      - ref: out_of_scope
        type: action
        label: Out of scope
        action_config:
          type: log
          message: 'No audit with that id is readable from this workflow''s domain. A workflow reads its
            own domain and the domains below it, never the ones above — publish the workflow where the
            audit lives, or higher.'
      - ref: fetch
        type: action
        label: List what the audit claims is satisfied
        action_config:
          type: read_objects
          model: requirement_assessment
          mode: list
          # Opt-in: the quality check walks the requirement with its controls and
          # evidences, so only a read that intends to use it pays for it.
          include:
          - quality_check
          order_by: created_at
          # One call per requirement plus one for the write-up, so this stays
          # inside WORKFLOW_AI_MAX_CALLS_PER_RUN (50 by default). Raising it
          # costs calls and widens the read, which the node-output cap bounds.
          limit: 25
          filters:
            operator: and
            conditions:
            - field: compliance_assessment
              op: eq
              value: '{{audit_id}}'
            - field: result
              op: in
              value: compliant,partially_compliant
      - ref: per_requirement
        type: loop
        label: One requirement at a time
        loop_config:
          collection: '{{nodes.fetch.results}}'
          # A single {{path}} keeps the value's type, so the loop collects real
          # records rather than sentences. Which section each one lands in is
          # then a fact in the data, not something the write-up has to infer.
          collect: '{{record}}'
          on_item_error: continue
      - ref: facts
        type: action
        label: What did the rules find?
        action_config:
          type: set_variables
          variables:
            qc_errors: '{{item.quality_check.errors}}'
            qc_warnings: '{{item.quality_check.warnings}}'
      - ref: route
        type: condition
        label: Has a rule already spoken?
        branches:
        # A tripped rule is a fact the product already checked, phrased as an
        # action and carrying a rule id. There is nothing to ask a model about.
        - name: flagged
          condition_groups:
          - operator: or
            conditions:
            - variable: qc_errors
              op: neq
              value: '[]'
            - variable: qc_warnings
              op: neq
              value: '[]'
        # Clean by the rules. Only now is there a question worth a call.
        - name: judge
          is_default: true
      - ref: pack_flagged
        type: action
        label: Keep the findings
        action_config:
          type: set_variables
          variables:
            record:
              ref_id: '{{item.requirement.ref_id}}'
              name: '{{item.requirement.name}}'
              claimed: '{{item.result}}'
              bucket: concern
              errors: '{{item.quality_check.errors}}'
              warnings: '{{item.quality_check.warnings}}'
              note: ''
      - ref: challenge
        type: action
        label: Does the evidence match the expectation?
        action_config:
          type: ai_extract
          prompt: 'The product''s own quality checks found nothing wrong with this requirement: it has a
            control, its evidence is attached, current, and out of draft. Those questions are settled and
            are not yours to reopen.

            Yours is the one a rule cannot answer: does what is attached actually show what THIS
            requirement asks for, and is it recent enough to describe how things are now?

            Read the requirement''s description first — that is the expectation. Then read the names and
            descriptions of the evidence and the controls it hangs off.

            Answer "backed" when at least one attached evidence plausibly shows what the description asks
            for, and nothing about it suggests it has been overtaken.

            Answer "needs_look" when none of them do. The usual reasons: the document is about a
            different subject than the requirement; it describes a plan, a design or a draft rather than
            something performed; or it is old enough that it no longer describes the present. Today''s
            date is given below — expiry dates were already checked, but most documents carry none, and a
            report whose own name or description places it a year or more before today does not show what
            is happening now.

            You are raising a question for a human, not overruling the auditor: never say the result is
            wrong, say what a reviewer should ask for.

            Work it out in the "reasoning" field — that is what it is for, and nobody reads it. Then put
            in "note" only the finished sentence a reviewer will read: under 30 words, naming the specific
            document you would ask for, or the one that was found. Never let working-out, self-talk or
            formatting markers into "note". An ellipsis or a placeholder is not an answer.'
          input: 'Today is {{today}}. Judge currency against that date, not against whatever period the
            documents mention.

            Requirement {{item.requirement.ref_id}} — {{item.requirement.name}}

            The expectation, in the standard''s own words: {{item.requirement.description}}

            Auditor''s result: {{item.result}}

            Auditor''s note: {{item.observation}}

            Controls claimed, each with the evidence attached to it: {{item.applied_controls}}

            Evidence attached to the requirement itself: {{item.evidences}}'
          schema:
            type: object
            properties:
              reasoning:
                type: string
                maxLength: 800
              verdict:
                type: string
                enum:
                - backed
                - needs_look
              note:
                type: string
                minLength: 40
                maxLength: 200
            required:
            - reasoning
            - verdict
            - note
          max_attempts: 2
        output_mapping:
          ai_verdict: verdict
          ai_note: note
      - ref: pack_judged
        type: action
        label: Keep the answer
        action_config:
          type: set_variables
          variables:
            record:
              ref_id: '{{item.requirement.ref_id}}'
              name: '{{item.requirement.name}}'
              claimed: '{{item.result}}'
              bucket: '{{ai_verdict}}'
              errors: '[]'
              warnings: '[]'
              note: '{{ai_note}}'
      - ref: write_concerns_section
        type: action
        label: Write "Concerns"
        action_config:
          type: ai_generate
          prompt: 'Below is one record per requirement an audit claims is satisfied. Write bullets for
            ONLY the records whose bucket is exactly "concern". Ignore every other record completely —
            they belong to sections you are not writing.

            Each of these tripped one or more of the product''s quality rules. The "errors" and
            "warnings" lists hold those findings, already written out in the "msg" field.

            Open with one sentence saying these were flagged by the platform''s own checks rather than by
            a model. Then one bullet per record: the reference, the name, and the finding text. Quote the
            "msg" as it stands — shorten it if it is long, but never reword what it claims, and never add
            a reason of your own. Where a record has entries under "errors", put those first and say they
            are errors.

            Write one bullet for every record with that bucket, including records whose findings read the
            same as each other. Never merge two records into a bullet, never summarise a group of them,
            and never leave one out. If no record has that bucket, write one sentence saying there are
            none, and no bullets.

            Markdown bullets, no heading — the document supplies it. Do not count anything.'
          input: '{{nodes.per_requirement.results}}'
          max_words: 400
        output_mapping:
          write_concerns: text
      - ref: write_look_section
        type: action
        label: Write "Needs a look"
        action_config:
          type: ai_generate
          prompt: 'Below is one record per requirement an audit claims is satisfied. Write bullets for
            ONLY the records whose bucket is exactly "needs_look". Ignore every other record completely —
            they belong to sections you are not writing.

            The quality rules found nothing wrong with these; a reviewer read them anyway and was not
            convinced. Open with one sentence saying exactly that. Then one bullet per record: the
            reference, the name, and the doubt, taken from its note.

            Write one bullet for every record with that bucket, including records whose notes read the
            same as each other. Never merge two records into a bullet, never summarise a group of them,
            and never leave one out. If no record has that bucket, write one sentence saying there are
            none, and no bullets.

            Markdown bullets, no heading — the document supplies it. Do not count anything.'
          input: '{{nodes.per_requirement.results}}'
          max_words: 320
        output_mapping:
          write_look: text
      - ref: write_backed_section
        type: action
        label: Write "Backed by evidence"
        action_config:
          type: ai_generate
          prompt: 'Below is one record per requirement an audit claims is satisfied. Write bullets for
            ONLY the records whose bucket is exactly "backed". Ignore every other record completely —
            they belong to sections you are not writing.

            These passed the quality rules and a reviewer then confirmed the evidence matches the
            expectation. Open with one sentence saying both of those things happened. Then one bullet per
            record: the reference, the name, and what was found, taken from its note. Name what was
            found, never what is missing — a bullet here that asks for something is a bullet in the wrong
            section.

            Write one bullet for every record with that bucket, including records whose notes read the
            same as each other. Never merge two records into a bullet, never summarise a group of them,
            and never leave one out. If no record has that bucket, write one sentence saying there are
            none, and no bullets.

            Markdown bullets, no heading — the document supplies it. Do not count anything.'
          input: '{{nodes.per_requirement.results}}'
          max_words: 320
        output_mapping:
          write_backed: text
      - ref: open_record
        type: action
        label: Open the record
        action_config:
          type: create_object
          model: document_container
          fields:
            # {{now}}, not {{today}}: a container's name is unique within its
            # folder, so a second review of the same audit on the same day used
            # to fail here — after every AI call had been paid for. A review is
            # per run, and its own timestamp is what says which run.
            name: 'Audit evidence review — {{audit_name}} — {{now}}'
            document_type: record
            description: 'Automated evidence review of the audit "{{audit_name}}", produced on {{today}}.'
      - ref: write_record
        type: action
        label: File the review
        action_config:
          type: create_object
          model: managed_document
          fields:
            name: 'Audit evidence review — {{audit_name}} — {{now}}'
            container: '{{nodes.open_record.created_object_id}}'
            content: '# Audit evidence review — {{audit_name}}


              Produced automatically on {{today}} over every requirement this audit records as compliant
              or partially compliant.


              Each one was put to the platform''s own quality checks first — the same rules the X-rays
              page runs. Anything they flagged is under Concerns, in their words, with nothing added. The
              rest were read by the configured AI provider, which was asked the one question a rule
              cannot answer: does the attached evidence actually show what the requirement asks for, and
              is it recent enough to describe the present. What follows is what the records show — not a
              judgement on whether the work is being done.


              ## Concerns


              {{write_concerns}}


              ## Needs a look


              {{write_look}}


              ## Backed by evidence


              {{write_backed}}


              ---


              Source audit: [{{audit_name}}](/compliance-assessments/{{audit_id}})


              Run record, counted by the engine rather than written by the model:
              {{nodes.per_requirement.count}} requirement(s) entered the review. If the summary above
              states a different number, take this one — and read the list twice, because something was
              dropped or miscounted. Steps that failed, and are therefore absent from the list above:
              {{nodes.per_requirement.errors}}


              This document is a draft. Nothing in the audit was changed: a workflow cannot write a
              requirement''s result or score.'
      - ref: done
        type: end
      edges:
      - source: start
        target: check_id
      - source: check_id
        target: read_audit
        source_branch: given
      - source: check_id
        target: no_audit
        source_branch: missing
      - source: no_audit
        target: done
      - source: read_audit
        target: check_found
      - source: check_found
        target: fetch
        source_branch: found
      - source: check_found
        target: out_of_scope
        source_branch: not_found
      - source: out_of_scope
        target: done
      - source: fetch
        target: per_requirement
      - source: per_requirement
        target: facts
        source_port: each
      - source: facts
        target: route
      - source: route
        target: pack_flagged
        source_branch: flagged
      - source: route
        target: challenge
        source_branch: judge
      - source: challenge
        target: pack_judged
      - source: pack_flagged
        target: per_requirement
      - source: pack_judged
        target: per_requirement
      - source: per_requirement
        target: write_concerns_section
        source_port: done
      - source: write_concerns_section
        target: write_look_section
      - source: write_look_section
        target: write_backed_section
      - source: write_backed_section
        target: open_record
      - source: open_record
        target: write_record
      - source: write_record
        target: done
