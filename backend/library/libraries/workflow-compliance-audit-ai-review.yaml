urn: urn:intuitem:risk:library:workflow-compliance-audit-ai-review
locale: en
ref_id: workflow-compliance-audit-ai-review
name: Audit — AI evidence challenge
description: 'Walks the requirements an audit calls compliant or partially compliant, asks the configured
  AI provider whether what is attached actually supports that claim, and files the answers as a managed
  document of type Record. Run it with audit_id set to the audit you want reviewed. The model never
  changes a result or a score — those are not writable by any workflow — so the review lands as a
  document a person reads, next to the audit it questions. Reviews 12 requirements per run by default,
  which keeps it inside the AI call budget (WORKFLOW_AI_MAX_CALLS_PER_RUN, 50 by default: one call per
  requirement plus one for the write-up). Needs an AI provider configured in Global settings — without
  one the AI steps fail and the run stops rather than guessing.'
copyright: © intuitem
version: 1
publication_date: 2026-09-20
provider: intuitem
packager: intuitem
objects:
  workflows:
  - urn: urn:intuitem:risk:library:workflow-compliance-audit-ai-review:workflow:audit-ai-review
    schema_version: 1
    ref_id: audit-ai-review
    name: Audit — AI evidence challenge
    description: 'A second opinion on an audit''s own conclusions: for each requirement claimed compliant,
      the model weighs the expectation against the controls and evidence attached to it and says whether
      the claim is supported, thin or unsupported. The verdicts become a Record document linking back to
      the audit. Results and scores stay untouched — a workflow cannot write them.'
    graph:
      variables:
      - key: audit_id
        type: string
        default_value: ''
      - key: audit_name
        type: string
        default_value: ''
      - key: ai_verdict
        type: string
        default_value: ''
      - key: ai_note
        type: string
        default_value: ''
      - key: write_up
        type: string
        default_value: ''
      nodes:
      - ref: start
        type: trigger
        label: Run the review
        trigger_config:
          type: manual
      - ref: check_id
        type: condition
        label: Was an audit given?
        branches:
        - name: given
          condition_groups:
          - operator: and
            conditions:
            - variable: audit_id
              op: neq
              value: ''
        - name: missing
          is_default: true
      - ref: no_audit
        type: action
        label: Nothing to review
        action_config:
          type: log
          message: 'No audit_id was given. Run this workflow with "Run with variables" and set audit_id
            to the audit you want reviewed.'
      - ref: read_audit
        type: action
        label: Find the audit
        action_config:
          type: read_objects
          model: compliance_assessment
          mode: first
          filters:
            operator: and
            conditions:
            - field: id
              op: eq
              value: '{{audit_id}}'
        output_mapping:
          audit_name: object.name
      - ref: check_found
        type: condition
        label: Is it in this workflow's scope?
        branches:
        - name: found
          condition_groups:
          - operator: and
            conditions:
            - variable: audit_name
              op: neq
              value: ''
        - name: not_found
          is_default: true
      - ref: out_of_scope
        type: action
        label: Out of scope
        action_config:
          type: log
          message: 'No audit with that id is readable from this workflow''s domain. A workflow reads its
            own domain and the domains below it, never the ones above — publish the workflow where the
            audit lives, or higher.'
      - ref: fetch
        type: action
        label: List what the audit claims is satisfied
        action_config:
          type: read_objects
          model: requirement_assessment
          mode: list
          order_by: created_at
          limit: 12
          filters:
            operator: and
            conditions:
            - field: compliance_assessment
              op: eq
              value: '{{audit_id}}'
            - field: result
              op: in
              value: compliant,partially_compliant
      - ref: per_requirement
        type: loop
        label: One requirement at a time
        loop_config:
          collection: '{{nodes.fetch.results}}'
          collect: '{{item.requirement.ref_id}} {{item.requirement.name}} — claimed {{item.result}} —
            {{ai_verdict}} — {{ai_note}}'
          on_item_error: continue
      - ref: challenge
        type: action
        label: Does the evidence hold it up?
        action_config:
          type: ai_extract
          prompt: 'An auditor has recorded that this requirement is met. Weigh that claim against what
            is actually attached to it, and answer with one of three verdicts:

            supported — a control is in place AND at least one piece of evidence is attached, unexpired,
            and plausibly shows what the requirement asks for.

            thin — controls are named but the evidence is missing, has nothing attached ("attached": false),
            has expired, or does not show what this particular requirement asks for. Also use this when a
            single generic document is the only support for a specific technical expectation.

            unsupported — nothing is attached at all, or what is attached addresses a different subject
            than the requirement.

            Evidence reaches a requirement two ways and both count: attached to the requirement itself,
            and attached to one of its controls. An evidence record whose "attached" field is false is a
            title with no document behind it — treat it as absent.

            You are raising a question for a human, not overruling the auditor: never say the result is
            wrong, say what a reviewer should ask for. Keep the note under 30 words and name the specific
            thing that is missing rather than describing the requirement back.'
          input: 'Requirement {{item.requirement.ref_id}} — {{item.requirement.name}}

            What it asks for: {{item.requirement.description}}

            Auditor''s result: {{item.result}} (score {{item.score}}, documentation score {{item.documentation_score}})

            Auditor''s note: {{item.observation}}

            Controls claimed, each with the evidence attached to it: {{item.applied_controls}}

            Evidence attached to the requirement itself: {{item.evidences}}'
          schema:
            type: object
            properties:
              verdict:
                type: string
                enum:
                - supported
                - thin
                - unsupported
              note:
                type: string
            required:
            - verdict
            - note
          max_attempts: 2
        output_mapping:
          ai_verdict: verdict
          ai_note: note
      - ref: compose
        type: action
        label: Write the review
        action_config:
          type: ai_generate
          prompt: 'You are writing the body of a short review record for the person who owns this audit.
            Each line below is one requirement the audit claims is satisfied, followed by a reviewer''s
            verdict and note.

            Open with one sentence saying how many requirements are in the list below and how many came
            back as anything other than supported. Count the lines you were given and nothing else. Then, under a "## Questions to answer" heading, list only the
            thin and unsupported ones as bullets, each naming the requirement and what a reviewer should
            ask for. If every requirement came back supported, say so plainly in one sentence and write
            no bullet list. Close with one sentence stating that this was produced automatically and that
            no result or score was changed.

            Markdown, no title — the document already has one. Do not invent requirements that are not
            in the list.'
          input: '{{nodes.per_requirement.results}}'
          max_words: 400
        output_mapping:
          write_up: text
      - ref: open_record
        type: action
        label: Open the record
        action_config:
          type: create_object
          model: document_container
          fields:
            name: 'Audit review — {{audit_name}} — {{today}}'
            document_type: record
            description: 'Automated evidence review of the audit "{{audit_name}}", produced on {{today}}.'
      - ref: write_record
        type: action
        label: File the review
        action_config:
          type: create_object
          model: managed_document
          fields:
            name: 'Audit review — {{audit_name}} — {{today}}'
            container: '{{nodes.open_record.created_object_id}}'
            content: '# Audit review — {{audit_name}}


              Produced automatically on {{today}} over the requirements this audit records as compliant
              or partially compliant.


              {{write_up}}


              ---


              Source audit: [{{audit_name}}](/compliance-assessments/{{audit_id}})


              Run record: {{nodes.per_requirement.count}} requirement(s) entered the review. Steps that
              failed, and are therefore absent from the list above: {{nodes.per_requirement.errors}}


              This document is a draft. Nothing in the audit was changed: a workflow cannot write a
              requirement''s result or score.'
      - ref: done
        type: end
      edges:
      - source: start
        target: check_id
      - source: check_id
        target: read_audit
        source_branch: given
      - source: check_id
        target: no_audit
        source_branch: missing
      - source: no_audit
        target: done
      - source: read_audit
        target: check_found
      - source: check_found
        target: fetch
        source_branch: found
      - source: check_found
        target: out_of_scope
        source_branch: not_found
      - source: out_of_scope
        target: done
      - source: fetch
        target: per_requirement
      - source: per_requirement
        target: challenge
        source_port: each
      - source: challenge
        target: per_requirement
      - source: per_requirement
        target: compose
        source_port: done
      - source: compose
        target: open_record
      - source: open_record
        target: write_record
      - source: write_record
        target: done
