urn: urn:intuitem:risk:library:workflow-compliance-audit-ai-review
locale: en
ref_id: workflow-compliance-audit-ai-review
name: Audit — AI evidence challenge
description: 'Walks every requirement an audit says is compliant, partially compliant or not applicable —
  the three answers that assert something a reviewer can check — reports what the platform''s own quality
  rules find, and asks the configured AI provider only the questions a rule cannot answer. The answers are
  filed as a managed document of type Record, next to the audit they question.

  Two ways in: run it by hand with "Run with variables" and audit_id set to the audit you want reviewed,
  or enable the "An audit moved to in review" trigger and let it run itself when someone moves an audit to
  that status. Internal-event triggers arrive disabled, so the automatic path is one switch in the
  workflow''s triggers, deliberately.

  The rules run first and cost nothing: anything they flag is already written, already translated, and
  carries a rule id, so it goes straight to Concerns in their own words. Only requirements the rules pass
  are put to the model, and each claim gets its own question, because "does the evidence show this" and
  "does this exclusion hold" are not the same question. Non-compliant and unassessed requirements are
  counted in the breakdown table and read no further: one is already an admission, the other has not been
  answered, and neither has a claim to check.

  The model is never asked to be confident: it chooses between "this holds" and "a reviewer should look",
  and it cannot raise a concern. Everything under Concerns has a rule id behind it. The model never
  changes a result or a score either — those are not writable by any workflow.

  The document is assembled, not written: each requirement adds its own line to its section as the loop
  runs, so the model is asked to judge and never to compose. One call per requirement and none for the
  write-up, which is also why a section cannot quietly lose a record.

  The loop pages its own read, so the number of requirements is bounded by WORKFLOW_LOOP_MAX_ITEMS (500)
  rather than by what fits in one node''s output, and WORKFLOW_AI_MAX_CALLS_PER_RUN (50 by default) is
  what limits how many reach the model. Past that the calls fail, the run continues, and the failures are
  listed at the foot of the document — the rule findings still land. Needs an AI provider configured in
  Global settings.'
copyright: © intuitem
version: 2
publication_date: 2026-09-24
provider: intuitem
packager: intuitem
objects:
  workflows:
  - urn: urn:intuitem:risk:library:workflow-compliance-audit-ai-review:workflow:audit-ai-review
    schema_version: 1
    ref_id: audit-ai-review
    name: Audit — AI evidence challenge
    description: 'A second opinion on an audit''s own conclusions. The platform''s quality rules judge
      every requirement deterministically; the model is then asked, about the requirements they passed,
      the one thing a rule cannot decide — whether what is written and attached actually answers what the
      requirement asks for. The answers become a Record document linking back to the audit. Results and
      scores stay untouched: a workflow cannot write them.'
    graph:
      variables:
      - key: audit_id
        type: string
        default_value: ''
      - key: found
        type: boolean
        default_value: false
      - key: audit_name
        type: string
        default_value: ''
      - key: reviewers
        type: json
        default_value: []
      - key: read_by
        type: string
        default_value: ''
      - key: breakdown
        type: json
        default_value: {}
      # A condition reads a declared variable, never a path.
      - key: flagged
        type: boolean
        default_value: false
      - key: claimed
        type: string
        default_value: ''
      # `ai_missing` being non-empty decides the section on its own.
      - key: ai_shows
        type: string
        default_value: ''
      - key: ai_missing
        type: string
        default_value: ''
      - key: record
        type: json
        default_value: {}
      # Built a line at a time: set_variables renders against the live context,
      # so '{{sec_x}}…' appends, and variables have no node-output cap.
      - key: sec_concerns
        type: string
        default_value: ''
      - key: sec_look
        type: string
        default_value: ''
      - key: sec_gaps
        type: string
        default_value: ''
      - key: sec_backed
        type: string
        default_value: ''
      nodes:
      - ref: start
        type: trigger
        label: Run the review
        trigger_config:
          type: manual
      # Arrives disabled; enabling it is deliberate. `changed` makes this a
      # transition, so editing an audit already in review does not re-run it.
      - ref: on_review
        type: trigger
        label: An audit moved to in review
        trigger_config:
          type: internal_event
          event_key: complianceassessment.updated
          filters:
            operator: and
            conditions:
            - field: status
              changed: true
              op: eq
              value: in_review
        input_mapping:
          audit_id: object_id
      - ref: read_audit
        type: action
        label: Find the audit
        action_config:
          type: read_objects
          model: compliance_assessment
          mode: first
          filters:
            operator: and
            conditions:
            - field: id
              op: eq
              value: '{{audit_id}}'
        output_mapping:
          found: found
          audit_name: object.name
          breakdown: object.requirements
          reviewers: object.reviewers
      # A read that matches nothing is not a failure: it returns found=false and
      # the run carries on, which without this would file a document with empty
      # sections and call it done.
      - ref: check_found
        type: condition
        label: Is it in this workflow's scope?
        branches:
        - name: found
          condition_groups:
          - operator: and
            conditions:
            - variable: found
              op: eq
              value: true
        - name: not_found
          is_default: true
      - ref: out_of_scope
        type: action
        label: Out of scope
        action_config:
          type: log
          message: 'No audit with that id is readable from this workflow''s domain. A workflow reads its
            own domain and the domains below it, never the ones above — publish the workflow where the
            audit lives, or higher.'
      - ref: per_requirement
        type: loop
        label: One requirement at a time
        loop_config:
          # Paging, not another node's output: these rows hit the node-output
          # ceiling. `limit` is the page size, WORKFLOW_LOOP_MAX_ITEMS the total.
          read:
            model: requirement_assessment
            # Opt-in: it walks the controls and evidences, so only a read that
            # uses it pays for it.
            include:
            - quality_check
            order_by: created_at
            limit: 25
            # The three results that assert something; the rest are counted in
            # the breakdown table instead.
            filters:
              operator: and
              conditions:
              - field: compliance_assessment
                op: eq
                value: '{{audit_id}}'
              - field: result
                op: in
                value: compliant,partially_compliant,not_applicable
          # A single {{path}} keeps the value's type, so this collects records
          # rather than sentences.
          collect: '{{record}}'
          on_item_error: continue
      - ref: facts
        type: action
        label: What did the rules find?
        action_config:
          type: set_variables
          variables:
            flagged: '{{item.quality_check.flagged}}'
            claimed: '{{item.result}}'
      - ref: route
        type: condition
        label: Has a rule already spoken?
        branches:
        - name: flagged
          condition_groups:
          - operator: and
            conditions:
            - variable: flagged
              op: eq
              value: true
        - name: clean
          is_default: true
      - ref: pack_flagged
        type: action
        label: Keep the findings
        action_config:
          type: set_variables
          variables:
            # One heading per requirement: several rules can trip on one, and
            # the rules already wrote the sentences.
            sec_concerns: '{{sec_concerns}}- **{{item.requirement.ref_id}} — {{item.requirement.name}}**

{{item.quality_check.text}}

'
            record:
              ref_id: '{{item.requirement.ref_id}}'
              name: '{{item.requirement.name}}'
              claimed: '{{item.result}}'
              bucket: concern
              errors: '{{item.quality_check.errors}}'
              warnings: '{{item.quality_check.warnings}}'
              note: ''
      # Each claim is wrong in its own way, so each gets its own question.
      - ref: which_claim
        type: condition
        label: What is being claimed?
        branches:
        - name: compliant
          condition_groups:
          - operator: and
            conditions:
            - variable: claimed
              op: eq
              value: compliant
        - name: partial
          condition_groups:
          - operator: and
            conditions:
            - variable: claimed
              op: eq
              value: partially_compliant
        # The read returns these three results only, so not applicable is what
        # is left. A condition node needs a default anyway.
        - name: not_applicable
          is_default: true
      - ref: challenge_compliant
        type: action
        label: Does the evidence match the expectation?
        action_config:
          type: ai_extract
          prompt: |-
            The product's own quality checks found nothing wrong with this requirement: it has a control,
            its evidence is attached, current, out of draft, and recently touched. Those questions are
            settled and are not yours to reopen.

            Yours is the one a rule cannot answer: does what is attached actually show what THIS
            requirement asks for, and is it recent enough to describe how things are now?

            Read the requirement's description first — that is the expectation. Then read the names and
            descriptions of the evidence and the controls it hangs off.

            Leave "missing" empty when at least one attached evidence plausibly shows what the
            description asks for, and nothing about it suggests it has been overtaken.

            Fill "missing" when none of them do. The usual reasons: the document is about a
            different subject than the requirement; it describes a plan, a design or a draft rather than
            something performed; or it is old enough that it no longer describes the present. Today's
            date is given below — expiry dates were already checked, but most documents carry none, and a
            report whose own name or description places it a year or more before today does not show what
            is happening now.

            You are raising a question for a human, not overruling the auditor: never say the result is
            wrong, say what a reviewer should ask for. If you would ask for anything at all, it belongs in
            "missing" — leaving that empty is a statement that you would not.

            Work it out in "reasoning" first — that field is there for it and nobody reads it.

            Then two fields, both read by a person:

            "shows" — one finished sentence naming what the attached material actually shows, naming the document.

            "missing" — what it fails to show that the requirement asks for, naming the document you would ask for, in one sentence. Leave it as an empty string when
            nothing is: that empty string is how you say you are satisfied, and it is what files this
            requirement under Backed by the record. Never write "nothing", "none" or "N/A" — write nothing at all.

            Do not put a request into "shows" and do not put a finding into "missing". No working-out, no
            self-talk, no formatting markers, no ellipsis, no placeholder.
          input: |-
            Today is {{today}}. Judge currency against that date, not against whatever period the
            documents mention.

            Requirement {{item.requirement.ref_id}} — {{item.requirement.name}}

            The expectation, in the standard's own words: {{item.requirement.description}}

            Auditor's result: {{item.result}}

            Auditor's note: {{item.observation}}

            Controls claimed, each with the evidence attached to it: {{item.applied_controls}}

            Evidence attached to the requirement itself: {{item.evidences}}
          schema:
            type: object
            properties:
              # Never read. Unbounded: a cap here collapsed the sampler.
              reasoning:
                type: string
              # Which of the two is filled says what a note would have to be
              # read to know. Unbounded: a cap severs the sentence, a floor is
              # met with padding.
              shows:
                type: string
              missing:
                type: string
            required:
            - reasoning
            - shows
            - missing
          max_attempts: 2
        output_mapping:
          ai_shows: shows
          ai_missing: missing
      - ref: challenge_partial
        type: action
        label: Does the partial claim stand?
        action_config:
          type: ai_extract
          prompt: |-
            "Partially compliant" is a deliberate statement: part of this requirement is met and part is
            not. The product's quality checks already confirmed there is a control, there is evidence,
            there is an observation, and there is a date for closing the gap. Those are settled.

            Yours is the question they cannot reach: reading the observation against the requirement's
            description, is "partially compliant" actually the right answer?

            Leave "missing" empty when the observation names what is missing, and what it names is a
            genuine part of what the description asks for. That is an honest partial: the gap is
            understood and recorded, and nothing here needs a reviewer's time.

            Fill "missing" when the observation does not survive that reading. The usual reasons:
            it describes the requirement as fully met, so "compliant" was meant; it describes nothing in
            place at all, so "non-compliant" was meant; it is about something the description does not
            ask for; or it is too vague to say what is missing — "in progress", "being rolled out",
            "partially implemented" name no gap.

            Do not weigh whether the gap is big or small, and do not judge whether the plan is good
            enough. The only question is whether the stated gap is a truthful reading of what is there.

            You are raising a question for a human, not overruling the auditor: never say the result is
            wrong, say what a reviewer should ask.

            Work it out in "reasoning" first — that field is there for it and nobody reads it.

            Then two fields, both read by a person:

            "shows" — one finished sentence naming what the attached material actually records, naming the gap as the observation states it.

            "missing" — what it fails to settle about the partial claim, in one sentence, in one sentence. Leave it as an empty string when
            nothing is: that empty string is how you say you are satisfied, and it is what files this
            requirement under Known gaps. Never write "nothing", "none" or "N/A" — write nothing at all.

            Do not put a request into "shows" and do not put a finding into "missing". No working-out, no
            self-talk, no formatting markers, no ellipsis, no placeholder.
          input: |-
            Today is {{today}}. Judge currency against that date, not against whatever period the
            documents mention.

            Requirement {{item.requirement.ref_id}} — {{item.requirement.name}}

            The expectation, in the standard's own words: {{item.requirement.description}}

            Auditor's result: {{item.result}}

            The observation, which is where the gap should be described: {{item.observation}}

            Controls claimed, each with the evidence attached to it: {{item.applied_controls}}

            Evidence attached to the requirement itself: {{item.evidences}}
          schema:
            type: object
            properties:
              # Never read. Unbounded: a cap here collapsed the sampler.
              reasoning:
                type: string
              # Which of the two is filled says what a note would have to be
              # read to know. Unbounded: a cap severs the sentence, a floor is
              # met with padding.
              shows:
                type: string
              missing:
                type: string
            required:
            - reasoning
            - shows
            - missing
          max_attempts: 2
        output_mapping:
          ai_shows: shows
          ai_missing: missing
      - ref: challenge_not_applicable
        type: action
        label: Does the exclusion hold?
        action_config:
          type: ai_extract
          prompt: |-
            This requirement has been declared not applicable, and the product's quality checks already
            confirmed a justification was written. That it exists is settled.

            Yours is whether it holds. An exclusion is the one answer an external auditor challenges
            every time, and there is no evidence to fall back on: the justification is the whole case.

            Read the requirement's description first, to see what is being excluded. Then read the
            justification against it.

            Leave "missing" empty when the justification names a fact about this organisation that puts
            the requirement out of reach — an activity it does not carry out, a technology it does not
            operate, a party it does not deal with — and that fact genuinely covers everything the
            description asks for.

            Fill "missing" otherwise. The usual reasons: the justification restates the exclusion
            without giving a reason ("not applicable to us", "out of scope"); it gives a reason that is
            about difficulty, cost, timing or priority, none of which make a requirement inapplicable;
            it describes a control instead, which would mean the requirement applies and is met; or the
            reason covers only part of what the description asks for, leaving the rest excluded without
            a case.

            You are raising a question for a human, not overruling the auditor: never say the result is
            wrong, say what a reviewer should ask.

            Work it out in "reasoning" first — that field is there for it and nobody reads it.

            Then two fields, both read by a person:

            "shows" — one finished sentence naming what the attached material actually establishes, naming the fact the exclusion rests on.

            "missing" — what it fails to cover of what the requirement asks for, in one sentence. Leave it as an empty string when
            nothing is: that empty string is how you say you are satisfied, and it is what files this
            requirement under Backed by the record. Never write "nothing", "none" or "N/A" — write nothing at all.

            Do not put a request into "shows" and do not put a finding into "missing". No working-out, no
            self-talk, no formatting markers, no ellipsis, no placeholder.
          input: |-
            Today is {{today}}.

            Requirement {{item.requirement.ref_id}} — {{item.requirement.name}}

            What is being excluded, in the standard's own words: {{item.requirement.description}}

            Auditor's result: {{item.result}}

            The justification, which is the entire case for the exclusion: {{item.observation}}
          schema:
            type: object
            properties:
              # Never read. Unbounded: a cap here collapsed the sampler.
              reasoning:
                type: string
              # Which of the two is filled says what a note would have to be
              # read to know. Unbounded: a cap severs the sentence, a floor is
              # met with padding.
              shows:
                type: string
              missing:
                type: string
            required:
            - reasoning
            - shows
            - missing
          max_attempts: 2
        output_mapping:
          ai_shows: shows
          ai_missing: missing
      # One packer for all three: they differ in what is asked, not in what
      # comes back.
      # One signal: `missing` empty means the model would ask for nothing, and
      # each branch knows which positive section that is. A verdict enum beside
      # it could disagree with it, and did.
      - ref: settle_claim
        type: condition
        label: Backed, or needs a look?
        branches:
        - name: satisfied
          condition_groups:
          - operator: and
            conditions:
            - variable: ai_missing
              op: eq
              value: ''
        - name: not_satisfied
          is_default: true
      - ref: settle_partial
        type: condition
        label: A known gap, or needs a look?
        branches:
        - name: satisfied
          condition_groups:
          - operator: and
            conditions:
            - variable: ai_missing
              op: eq
              value: ''
        - name: not_satisfied
          is_default: true
      - ref: append_backed
        type: action
        label: Add to "Backed by the record"
        action_config:
          type: set_variables
          variables:
            sec_backed: '{{sec_backed}}- {{item.requirement.ref_id}} — {{item.requirement.name}} ({{item.result}}): {{ai_shows}}

'
            record:
              ref_id: '{{item.requirement.ref_id}}'
              name: '{{item.requirement.name}}'
              claimed: '{{item.result}}'
              bucket: backed
              errors: '[]'
              warnings: '[]'
              note: '{{ai_shows}}'
      - ref: append_gaps
        type: action
        label: Add to "Known gaps"
        action_config:
          type: set_variables
          variables:
            sec_gaps: '{{sec_gaps}}- {{item.requirement.ref_id}} — {{item.requirement.name}}: {{ai_shows}}

'
            record:
              ref_id: '{{item.requirement.ref_id}}'
              name: '{{item.requirement.name}}'
              claimed: '{{item.result}}'
              bucket: known_gap
              errors: '[]'
              warnings: '[]'
              note: '{{ai_shows}}'
      - ref: append_look
        type: action
        label: Add to "Needs a look"
        action_config:
          type: set_variables
          variables:
            sec_look: '{{sec_look}}- {{item.requirement.ref_id}} — {{item.requirement.name}} ({{item.result}}): {{ai_missing}}

'
            record:
              ref_id: '{{item.requirement.ref_id}}'
              name: '{{item.requirement.name}}'
              claimed: '{{item.result}}'
              bucket: needs_look
              errors: '[]'
              warnings: '[]'
              note: '{{ai_missing}}'
      - ref: open_record
        type: action
        label: Open the record
        action_config:
          type: create_object
          model: document_container
          fields:
            # {{now}}, not {{today}}: a container name is unique per folder, so
            # two reviews of one audit on one day would collide.
            name: 'Audit evidence review — {{audit_name}} — {{now}}'
            document_type: record
            description: 'Automated evidence review of the audit "{{audit_name}}", produced on {{today}}.'
      - ref: write_record
        type: action
        label: File the review
        action_config:
          type: create_object
          model: managed_document
          fields:
            name: 'Audit evidence review — {{audit_name}} — {{now}}'
            container: '{{nodes.open_record.created_object_id}}'
            content: |-
              # Audit evidence review — {{audit_name}}

              Produced automatically on {{today}} over every requirement this audit records as compliant,
              partially compliant or not applicable — the three answers that assert something a reviewer
              can check. The table below counts the whole audit, including the requirements no section
              mentions.

              Each reviewed requirement was put to the platform's own quality checks first — the same
              rules the X-rays page runs. Anything they flagged is under Concerns, in their words, with
              nothing added. The ones they passed were then read by the configured AI provider and asked
              the one thing a rule cannot decide: whether what is written and attached actually answers
              what the requirement asks for. What follows is what the records show — not a judgement on
              whether the work is being done.

              Every requirement writes its own line into its own section, so nothing here is a summary
              and no section can be short of a requirement the run reviewed. A section with no lines
              under it had none.

              ## What the audit records

              Counted from the audit itself, not written by a model.

              | Result | Requirements |
              |---|---|
              | Compliant | {{breakdown.compliant}} |
              | Partially compliant | {{breakdown.partially_compliant}} |
              | Non-compliant | {{breakdown.non_compliant}} |
              | Not applicable | {{breakdown.not_applicable}} |
              | Not assessed | {{breakdown.not_assessed}} |
              | **Total assessable** | **{{breakdown.total}}** |

              ## Concerns

              {{sec_concerns}}

              ## Needs a look

              {{sec_look}}

              ## Known gaps

              {{sec_gaps}}

              ## Backed by the record

              {{sec_backed}}

              ---

              Source audit: [{{audit_name}}](/compliance-assessments/{{audit_id}})

              Run record, counted by the engine rather than written by the model:
              {{nodes.per_requirement.count}} requirement(s) entered the review — the claims only, not the
              audit's whole total, which the table above gives. If a section states a number that
              disagrees with this one, take this one — and read the list twice, because something was
              dropped or miscounted. Steps that failed, and are therefore
              absent from the lists above: {{nodes.per_requirement.errors}}

              This document is a draft. Nothing in the audit was changed: a workflow cannot write a
              requirement's result or score.
      - ref: due
        type: action
        label: When it should be read by
        action_config:
          type: date_offset
          days: 14
          output: read_by
      - ref: hand_over
        type: action
        label: Ask the audit's reviewers to read it
        action_config:
          type: create_object
          model: task_template
          fields:
            name: 'Read the evidence review — {{audit_name}}'
            description: 'An automated review of this audit was filed on {{today}}. Read it and decide
              what to do about anything under Concerns or Needs a look.'
            assigned_to: '{{reviewers}}'
            task_date: '{{read_by}}'
            compliance_assessments: '{{audit_id}}'
            documents: '{{nodes.open_record.created_object_id}}'
      - ref: done
        type: end
      edges:
      - source: start
        target: read_audit
      - source: on_review
        target: read_audit
      - source: read_audit
        target: check_found
      - source: check_found
        target: per_requirement
        source_branch: found
      - source: check_found
        target: out_of_scope
        source_branch: not_found
      - source: out_of_scope
        target: done
      - source: per_requirement
        target: facts
        source_port: each
      - source: facts
        target: route
      - source: route
        target: pack_flagged
        source_branch: flagged
      - source: route
        target: which_claim
        source_branch: clean
      - source: which_claim
        target: challenge_compliant
        source_branch: compliant
      - source: which_claim
        target: challenge_partial
        source_branch: partial
      - source: which_claim
        target: challenge_not_applicable
        source_branch: not_applicable
      - source: challenge_compliant
        target: settle_claim
      - source: challenge_not_applicable
        target: settle_claim
      - source: challenge_partial
        target: settle_partial
      - source: pack_flagged
        target: per_requirement
      - source: settle_claim
        target: append_backed
        source_branch: satisfied
      - source: settle_claim
        target: append_look
        source_branch: not_satisfied
      - source: settle_partial
        target: append_gaps
        source_branch: satisfied
      - source: settle_partial
        target: append_look
        source_branch: not_satisfied
      - source: append_backed
        target: per_requirement
      - source: append_gaps
        target: per_requirement
      - source: append_look
        target: per_requirement
      - source: per_requirement
        target: open_record
        source_port: done
      - source: open_record
        target: write_record
      - source: write_record
        target: due
      - source: due
        target: hand_over
      - source: hand_over
        target: done
