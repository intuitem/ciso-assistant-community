ref_id: ANSSI-PA-108
name: "ANSSI - Cybers\xE9curit\xE9 des syst\xE8mes industriels - Mesures d\xE9taill\xE9\
  es"
description: "La cybers\xE9curit\xE9 des syst\xE8mes industriels \u2013 Mesures d\xE9\
  taill\xE9es (ANSSI-PA-108, v2.0 du 27/11/2025).\nCe guide d\xE9cline les mesures\
  \ organisationnelles et techniques de cybers\xE9curit\xE9 \xE0 appliquer aux syst\xE8\
  mes\nindustriels (OT) en fonction de la classe du syst\xE8me, d\xE9termin\xE9e selon\
  \ le guide \xAB M\xE9thode de classification\nd\u2019un syst\xE8me industriel \xBB\
  \ de l\u2019ANSSI. Une correspondance avec les exigences de la norme IEC 62443 est\n\
  indiqu\xE9e lorsqu\u2019elle existe.\nSource : https://cyber.gouv.fr/publications/la-cybersecurite-des-systemes-industriels"
copyright: Licence Ouverte v2.0 - Etalab
version: 1
publication_date: 2026-08-04
provider: ANSSI
packager: intuitem
