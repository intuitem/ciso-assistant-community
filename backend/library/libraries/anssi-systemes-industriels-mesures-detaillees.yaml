      ref_id: R213
      name: "Disposer d\u2019un syst\xE8me de d\xE9tection certifi\xE9"
      description: "Il est recommand\xE9 de s\u2019assurer que le syst\xE8me de d\xE9\
        tection disposent d\u2019un certificat de s\xE9curit\xE9 de premier niveau\
        \ de l\u2019ANSSI (CSPN) ou \xE9quivalent (par exemple Crit\xE8re Commun int\xE9\
        grant AVA_VAN.3)."
      implementation_groups:
      - C3
      - C4
