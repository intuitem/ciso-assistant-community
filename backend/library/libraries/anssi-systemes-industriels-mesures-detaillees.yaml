      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.5.2
      ref_id: R78
      name: "Int\xE9grer un mode d\u2019urgence dans les proc\xE9dures"
      description: "Il est recommand\xE9 d\u2019int\xE9grer un mode d\u2019urgence\
        \ (par exemple avec la mise en place d\u2019un compte \xAB\_bris de glace\_\
        \xBB) dans les proc\xE9dures. Il s\u2019agit typiquement des secrets d\u2019\
        authentification relatifs \xE0 des comptes de s\xE9questre sensibles, qui\
        \ visent notamment \xE0 permettre la reconstruction de syst\xE8mes en cas\
        \ d\u2019incident majeur, comme par exemple les mots de passe DSRM (voir le\
        \ guide [9]) pour pouvoir intervenir rapidement en cas de besoin sans d\xE9\
        grader significativement le niveau de cybers\xE9curit\xE9 du syst\xE8me industriel.\
        \ En particulier, cette proc\xE9dure d\u2019urgence doit \xEAtre document\xE9\
        e."
      annotation: '**Exigences IEC 62443**


        SR 1.1, CR 1.1, NDR 1.6, USER 1.8'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.5.3
      assessable: false
