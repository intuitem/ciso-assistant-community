      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r106
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.2
      ref_id: R106
      name: "Privil\xE9gier un cloisonnement physique entre les zones fonctionnelles"
      description: "Il est recommand\xE9 de privil\xE9gier un cloisonnement physique\
        \ entre les zones fonctionnelles du syst\xE8me industriel. Ind\xE9pendamment\
        \ de la cybers\xE9curit\xE9, le cloisonnement physique participe \xE0 renforcer\
