      description: "Il est recommand\xE9 d\u2019inclure les incidents de cybers\xE9\
        curit\xE9 au sein des plans de reprise et de continuit\xE9 d\u2019activit\xE9\
        ."
      annotation: '**Exigences IEC 62443**


        AVAIL 1.1, SP12.09'
      implementation_groups:
