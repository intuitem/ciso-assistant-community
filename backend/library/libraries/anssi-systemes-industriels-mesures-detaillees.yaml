      description: "Il est recommand\xE9 de mettre en \u0153uvre un plan de sauvegarde\
        \ et de restauration afin de pouvoir reconstruire le syst\xE8me apr\xE8s un\
        \ incident de cybers\xE9curit\xE9 (voir le chapitre 3.1.4). Pour plus d\u2019\
        informations, se reporter aux Fondamentaux relatifs \xE0 la sauvegarde des\
        \ syst\xE8mes d\u2019information [16]."
      annotation: '**Exigences IEC 62443**


        SR 7.3 RE2, SR 7.4, CR 7.4, AVAIL 2.1, AVAIL 2.5, SP12.01BR, SP12.02BR, SP12.05BR,
        SP12.06BR, SP12.08BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
