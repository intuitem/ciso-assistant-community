    description: "La cybers\xE9curit\xE9 des syst\xE8mes industriels \u2013 Mesures\
      \ d\xE9taill\xE9es (ANSSI-PA-108, v2.0 du 27/11/2025).\nCe guide d\xE9cline\
      \ les mesures organisationnelles et techniques de cybers\xE9curit\xE9 \xE0 appliquer\
      \ aux syst\xE8mes\nindustriels (OT) en fonction de la classe du syst\xE8me,\
      \ d\xE9termin\xE9e selon le guide \xAB M\xE9thode de classification\nd\u2019\
      un syst\xE8me industriel \xBB de l\u2019ANSSI. Une correspondance avec les exigences\
      \ de la norme IEC 62443 est\nindiqu\xE9e lorsqu\u2019elle existe.\nSource :\
      \ https://cyber.gouv.fr/publications/la-cybersecurite-des-systemes-industriels"
    implementation_groups_definition:
    - ref_id: C1
      name: "C1 - Syst\xE8mes de classe 1"
      description: "Mesures \xE0 appliquer pour un syst\xE8me industriel de classe\
        \ 1."
    - ref_id: C2
      name: "C2 - Syst\xE8mes de classe 2"
      description: "Mesures \xE0 appliquer pour un syst\xE8me industriel de classe\
        \ 2 : les recommandations de classe 2 et celles de classe 1."
    - ref_id: C3
      name: "C3 - Syst\xE8mes de classe 3"
      description: "Mesures \xE0 appliquer pour un syst\xE8me industriel de classe\
        \ 3 : les recommandations de classe 3 et celles des classes 1 et 2."
    - ref_id: C4
      name: "C4 - Syst\xE8mes de classe 4"
      description: "Mesures \xE0 appliquer pour un syst\xE8me industriel de classe\
        \ 4 : les recommandations de classe 4 et celles des classes 1, 2 et 3."
    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3
      assessable: false
      depth: 1
      ref_id: '3'
      name: "Mesures organisationnelles de s\xE9curit\xE9"
      description: "Les mesures organisationnelles pr\xE9sent\xE9es dans ce chapitre\
        \ s\u2019adressent \xE0 l\u2019ensemble des acteurs impliqu\xE9s dans les\
        \ syst\xE8mes industriels (par exemple\_: chefs de projet, acheteurs, automaticiens,\
        \ int\xE9grateurs, d\xE9veloppeurs, \xE9quipes de maintenance, RSSI).\n\n\
        **Attention**\n\nIl revient \xE0 l\u2019entit\xE9 responsable de d\xE9finir\
        \ la personne ou les personnes qui seront en charge de l\u2019application\
        \ des mesures de cybers\xE9curit\xE9 sur les syst\xE8mes.\n\nLes mesures font\
        \ r\xE9f\xE9rence aux chapitres de l\u2019ISO 27002 [55] ainsi qu\u2019aux\
        \ recommandations du guide d\u2019hygi\xE8ne informatique [17] publi\xE9 par\
        \ l\u2019ANSSI.\n\nCes r\xE9f\xE9rences sont indiqu\xE9es dans un encadr\xE9\
        \ comme celui pr\xE9sent\xE9 ci-dessous\_:\n\n**Attention**\n\nLes mesures\
        \ sont cumulatives. Ainsi, un syst\xE8me de classe 2 doit appliquer les mesures\
        \ de classe 1 et de classe 2, et un syst\xE8me de classe 4 doit appliquer\
        \ les mesures de classe 1, de classe 2, de classe 3 et de classe 4."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : fait r\xE9f\xE9rence aux tactiques,\
        \ techniques et proc\xE9dures indiqu\xE9es dans la section 2.2.\n- **Guide\
        \ d\u2019hygi\xE8ne** : fait r\xE9f\xE9rence au guide d\u2019hygi\xE8ne informatique\
        \ [17].\n- **ISO 27002** : fait r\xE9f\xE9rence aux chapitres de l\u2019ISO\
        \ 27002 [55] abordant le sujet."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3
      ref_id: '3.1'
      name: "Connaissance du syst\xE8me industriel"
      description: "Cette section regroupe l\u2019ensemble des mesures qui permettent\
        \ d\u2019accro\xEEtre la connaissance du syst\xE8me industriel et de son environnement.\
        \ Afin d\u2019assurer une d\xE9fense permettant de r\xE9pondre aux menaces,\
        \ il est n\xE9cessaire d\u2019avoir une connaissance tr\xE8s approfondie de\
        \ son syst\xE8me, des risques encourus, des \xE9v\xE9nements m\xE9tier redout\xE9\
        s et des menaces \xE0 son encontre."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.1
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1
      ref_id: 3.1.1
      name: "R\xF4les et responsabilit\xE9s"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.22\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 39\n- **ISO 27002** : 5.2"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r1
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.1
      ref_id: R1
      name: Mettre en place un cadre de gouvernance
      description: "Il est recommand\xE9 de mettre en place un cadre de gouvernance\
        \ de la cybers\xE9curit\xE9 des syst\xE8mes industriels, en coh\xE9rence avec\
        \ celui de l\u2019informatique de gestion, par exemple au travers d\u2019\
        une PSSI."
      annotation: '**Exigences IEC 62443**


        ORG 1.1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r2
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.1
      ref_id: R2
      name: "Identifier les r\xF4les et responsabilit\xE9s"
      description: "Il est recommand\xE9 d\u2019identifier les r\xF4les et responsabilit\xE9\
        s de cybers\xE9curit\xE9 pour chaque partie prenante pour l\u2019ensemble\
        \ du cycle de vie du syst\xE8me (par exemple\_: d\xE9veloppement, int\xE9\
        gration, exploitation, maintenance, d\xE9sengagement)."
      annotation: '**Exigences IEC 62443**


        ORG 1.3, SM-2, SP01.05, SP01.06BR, SP01.07BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r3
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.1
      ref_id: R3
      name: "Revoir p\xE9riodiquement les limites de responsabilit\xE9"
      description: "Il est recommand\xE9 de revoir p\xE9riodiquement la bonne mise\
        \ en \u0153uvre de la recommandation R2."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.2
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1
      ref_id: 3.1.2
      name: Cartographie
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.5\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 4\n- **ISO 27002** : 5.9"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r4
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.2
      ref_id: R4
      name: "Etablir et maintenir \xE0 jour une cartographie de l\u2019\xE9cosyst\xE8\
        me"
      description: "Il est recommand\xE9 de d\xE9finir et de maintenir \xE0 jour une\
        \ cartographie de l\u2019\xE9cosyst\xE8me dans lequel les syst\xE8mes industriels\
        \ sont mis en \u0153uvre et contenant, au minimum, les informations suivantes\_\
        :\n\n- la liste des prestataires et fournisseurs (de mat\xE9riels et/ou de\
        \ logiciels) contribuant \xE0 la r\xE9alisation des activit\xE9s ou des services\
        \ de l\u2019entit\xE9;\n- la liste des interconnexions avec les syst\xE8mes\
        \ d\u2019information des prestataires et fournisseurs."
      annotation: '**Exigences IEC 62443**


        CM 1.1, SR 7.8, CR 7.8, SP01.02RE1, SP06.02BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r5
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.2
      ref_id: R5
      name: "\xC9tablir une cartographie du syst\xE8me"
      description: "Il est recommand\xE9 d\u2019\xE9tablir une cartographie du syst\xE8\
        me industriel, contenant les vues\_:\n\n- physique du syst\xE8me industriel;\n\
        - logique du syst\xE8me industriel;\n- des applications;\n- de l\u2019administration\
        \ et de la maintenance du syst\xE8me."
      annotation: "**Exigences IEC 62443**\n\nCM 1.2, SR 7.8, CR 7.8, SP01.02RE1,\
        \ SP06.02BR\n\n**Information**\n\nLes outils industriels comme les logiciels\
        \ de gestion de maintenance assist\xE9e par ordinateur (GMAO) peuvent g\xE9\
        rer les inventaires. Ces outils disposent de l\u2019ensemble des informations\
        \ dans une m\xEAme base et sont utilis\xE9s pour les partager avec les \xE9\
        quipes m\xE9tier.\n\nDe plus, la GMAO contient d\xE9j\xE0 bien souvent un\
        \ inventaire des composants mat\xE9riels comme les automates, les interfaces\
        \ homme-machine (IHM), capteurs et actionneurs intelligents par exemple."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r6
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.2
      ref_id: R6
      name: "Maintenir \xE0 jour une cartographie"
      description: "Il est recommand\xE9 de maintenir \xE0 jour une cartographie du\
        \ syst\xE8me industriel en s\u2019appuyant sur le guide de cartographie d\u2019\
        un syst\xE8me d\u2019information [22]."
      annotation: '**Exigences IEC 62443**


        CM 1.2, SR 7.8, CR 7.8, SP01.02RE1, SP06.02BR'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.3
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1
      ref_id: 3.1.3
      name: Analyse de risque
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : n\xE9ant\n- **Guide d\u2019\
        hygi\xE8ne** : r\xE8gle n\xB0 41\n- **ISO 27002** : se r\xE9f\xE9rer \xE0\
        \ la norme ISO 27005"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r7
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.3
      ref_id: R7
      name: "R\xE9aliser une analyse de risque"
      description: "Il est recommand\xE9 de r\xE9aliser une analyse de risque de cybers\xE9\
        curit\xE9 sur le syst\xE8me industriel concern\xE9 en suivant une m\xE9thode\
        \ choisie par l\u2019entit\xE9 responsable (pour une analyse selon la m\xE9\
        thode EBIOS Risk Manager, il est possible de se r\xE9f\xE9rer au guide [41]\
        \ de l\u2019ANSSI).\n\nLe niveau de profondeur de l\u2019analyse de risque\
        \ est \xE0 adapter selon la classe du syst\xE8me. Par exemple, \xE0 partir\
        \ des niveaux pr\xE9cis\xE9s dans EBIOS RM [44], la classe 2 correspond \xE0\
        \ la d\xE9marche d\u2019homologation simplifi\xE9e selon le guide de l\u2019\
        homologation de s\xE9curit\xE9 des syst\xE8mes d\u2019information [20]."
      annotation: "**Exigences IEC 62443**\n\nORG 2.1, SP03.01, SP02.01BR\n\n**Attention**\n\
        \nIl est recommand\xE9 que l\u2019analyse de risque pour la cybers\xE9curit\xE9\
        \ du syst\xE8me industriel soit int\xE9gr\xE9e \xE0 l\u2019analyse de risque\
        \ globale du syst\xE8me pouvant traiter par exemple des aspects de s\xFBret\xE9\
        \ de fonctionnement."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.4
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1
      ref_id: 3.1.4
      name: Gestion des sauvegardes
      description: "Les donn\xE9es \xE0 sauvegarder sont celles n\xE9cessaires \xE0\
        \ la reconstruction du syst\xE8me apr\xE8s un sinistre\_: par exemple, les\
        \ programmes, les fichiers de configuration, les micrologiciels, les param\xE8\
        tres de proc\xE9d\xE9 (r\xE9glages d\u2019asservissement par exemple). Cela\
        \ peut \xE9galement concerner des donn\xE9es ayant un aspect r\xE9glementaire\
        \ comme des preuves de tra\xE7abilit\xE9."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.6\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 37\n- **ISO 27002** : 8.13"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r8
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.4
      ref_id: R8
      name: "Sauvegarder les donn\xE9es"
      description: "Il est recommand\xE9 de d\xE9finir et de mettre en \u0153uvre\
        \ un plan de sauvegarde des donn\xE9es afin de restaurer le syst\xE8me en\
        \ cas d\u2019incident. Il est n\xE9cessaire de prendre compte des besoins\
        \ des m\xE9tiers (d\xE9lai d\u2019indisponibilit\xE9 maximal admissible et\
        \ perte de donn\xE9es maximale admissible).\n\nIl est recommand\xE9 de s\u2019\
        appuyer sur les r\xE9f\xE9rentiels [16] et [37] afin de r\xE9aliser une sauvegarde\
        \ \xE0 l\u2019\xE9tat de l\u2019art.\n\nLa sauvegarde doit inclure notamment\
        \ les micrologiciels des automates, les logiciels applicatifs SCADA, les fichiers\
        \ de configuration des automates, etc."
      annotation: '**Exigences IEC 62443**


        AVAIL 2.1, SP12.01BR, SP12.05BR, SP12.06BR, SP12.08BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r9
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.4
      ref_id: R9
      name: Sauvegarder les configurations
      description: "Il est recommand\xE9 de sauvegarder les configurations avant et\
        \ apr\xE8s toute modification, y compris lorsque celles-ci ont \xE9t\xE9 apport\xE9\
        es \xAB\_\xE0 chaud\_\xBB."
      annotation: '**Exigences IEC 62443**


        SR 7.3, CR 7.3, SP12.07BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r10
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.4
      ref_id: R10
      name: Tester le processus de restauration des sauvegardes
      description: "Il est recommand\xE9 de tester r\xE9guli\xE8rement le processus\
        \ de restauration des sauvegardes. Ce processus peut \xEAtre test\xE9 sur\
        \ un \xE9chantillon repr\xE9sentatif du syst\xE8me industriel ou dans son\
        \ ensemble."
      annotation: '**Exigences IEC 62443**


        SR 7.3 RE1, CR 7.3 RE1, AVAIL 2.3, SP12.04BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r11
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.4
      ref_id: R11
      name: "Mettre hors de port\xE9e d\u2019un attaquant les donn\xE9es sauvegard\xE9\
        es"
      description: "Conform\xE9ment au fondamentaux relatifs \xE0 la sauvegarde des\
        \ syst\xE8mes d\u2019information [16], il est recommand\xE9 d\u2019appliquer\
        \ la r\xE8gle \xAB\_3 \u2013 2 \u2013 1\_\xBB\_: 3 copies distinctes des donn\xE9\
        es, c\u2019est-\xE0-dire, les donn\xE9es en production et 2 sauvegardes stock\xE9\
        es sur des supports diff\xE9rents, dont 1 hors ligne."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.5
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1
      ref_id: 3.1.5
      name: Gestion de la documentation
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.6.2\n- **Guide d\u2019\
        hygi\xE8ne** : n\xE9ant\n- **ISO 27002** : 5.12"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r12
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.5
      ref_id: R12
      name: "D\xE9finir le niveau de sensibilit\xE9 de la documentation"
      description: "Il est recommand\xE9 de d\xE9finir le niveau de sensibilit\xE9\
        \ de la documentation et de le marquer clairement sur les documents, en s\u2019\
        appuyant \xE9ventuellement sur le r\xE9f\xE9rentiel [40]."
      annotation: '**Exigences IEC 62443**


        ZCR 5.13'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r13
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.5
      ref_id: R13
      name: Adapter le stockage et la diffusion des documents
      description: "Il est recommand\xE9 d\u2019adapter le stockage et la diffusion\
        \ des documents relatifs \xE0 la conception, \xE0 la configuration ou au fonctionnement\
        \ du syst\xE8me industriel, par exemple en adoptant la politique de partage\
        \ et d\u2019utilisation des informations de l\u2019ANSSI (reposant sur le\
        \ Traffic Light Protocol et le Permissible Actions Protocol)."
      annotation: "**Exigences IEC 62443**\n\nCR 3.9, DATA 1.1\n\n**Attention**\n\n\
        La documentation des syst\xE8mes industriels (par exemple\_: analyses fonctionnelles,\
        \ analyses organiques, plan d\u2019adressage, cartographie) est souvent stock\xE9\
        e sur le syst\xE8me de gestion (bureautique), qui est plus expos\xE9 que le\
        \ syst\xE8me industriel. Les syst\xE8mes de gestion sont souvent la premi\xE8\
        re cible des attaquants car ils permettent de collecter de nombreuses informations\
        \ en vue de pr\xE9parer, par exemple, une attaque cibl\xE9e sur les syst\xE8\
        mes industriels."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r14
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.1.5
      ref_id: R14
      name: "Revoir la documentation \xE0 intervalles r\xE9guliers"
      description: "Il est recommand\xE9 d\u2019effectuer une revue de la documentation\
        \ au moins une fois par an, pour s\u2019assurer que les documents n\xE9cessaires\
        \ existent bien et correspondent \xE0 la derni\xE8re version du syst\xE8me,\
        \ et pour supprimer ceux qui ne sont plus utilis\xE9s ou obsol\xE8te."
      annotation: '**Exigences IEC 62443**


        SR-5, SG-7'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3
      ref_id: '3.2'
      name: "Ma\xEEtrise des intervenants"
      description: "Cette section regroupe les mesures de s\xE9curit\xE9 n\xE9cessaires\
        \ \xE0 la gestion du personnel ayant un acc\xE8s physique ou logique au syst\xE8\
        me industriel. Afin de limiter les risques d\u2019erreurs de manipulation\
        \ ou de configuration, il est n\xE9cessaire d\u2019appliquer des r\xE8gles\
        \ permettant de garantir la ma\xEEtrise des interventions sur le syst\xE8\
        me industriel."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.1
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2
      ref_id: 3.2.1
      name: Gestion des intervenants
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.3\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 3\n- **ISO 27002** : 5.19"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r15
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.1
      ref_id: R15
      name: "Mettre en \u0153uvre un processus de gestion des comp\xE9tences"
      description: "Il est recommand\xE9 de mettre en \u0153uvre un processus de gestion\
        \ des comp\xE9tences afin de s\u2019assurer que les intervenants disposent\
        \ des comp\xE9tences n\xE9cessaires pour leurs missions Ce processus doit\
        \ en particulier int\xE9grer le transfert de comp\xE9tences, en cas de d\xE9\
        part ou de changement de poste, des personnes en charge des syst\xE8mes industriels."
      annotation: '**Exigences IEC 62443**


        ORG 1.5, SM-4, SP01.01, SP01.02, SP01.03'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r16
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.1
      ref_id: R16
      name: "Mettre en place des proc\xE9dures de gestion des intervenants"
      description: "Il est recommand\xE9 de mettre en place des proc\xE9dures de gestion\
        \ des intervenants, en particulier lors d\u2019une arriv\xE9e ou d\u2019un\
        \ d\xE9part. Ces proc\xE9dures doivent notamment contenir les \xE9l\xE9ments\
        \ suivants\_:\n\n- la cr\xE9ation et la suppression de comptes (voir la section\
        \ 4.1);\n- la gestion des acc\xE8s aux locaux;\n- la gestion des \xE9quipements\
        \ mobiles (par exemple\_: t\xE9l\xE9phones, tablettes, PC portables);\n- la\
        \ gestion des documents sensibles;\n- la mise en place d\u2019une proc\xE9\
        dure pour la gestion des intervenants de courte dur\xE9e tels que les intervenants\
        \ ponctuels et les int\xE9rimaires."
      annotation: '**Exigences IEC 62443**


        ORG 1.3, SP01.05, SP01.06, SP01.07'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r17
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.1
      ref_id: R17
      name: "Effectuer une revue r\xE9guli\xE8re des intervenants et de leurs comptes"
      description: "Il est recommand\xE9 d\u2019effectuer une revue r\xE9guli\xE8\
        re (au minimum une fois par an) des intervenants et de leurs comptes."
      annotation: "**Information**\n\nSuivant les r\xE9glementations applicables aux\
        \ syst\xE8mes industriels, une enqu\xEAte de s\xE9curit\xE9 sur les intervenants\
        \ pourra \xEAtre demand\xE9e."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.2
