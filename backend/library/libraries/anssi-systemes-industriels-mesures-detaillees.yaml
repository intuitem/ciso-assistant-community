      ref_id: R18
      name: "Sensibiliser les intervenants \xE0 la cybers\xE9curit\xE9"
      description: "Il est recommand\xE9 de sensibiliser les intervenants \xE0 la\
        \ cybers\xE9curit\xE9."
      annotation: '**Exigences IEC 62443**


        ORG 1.5, SP01.01, SP01.02, SP01.03'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r19
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.2
      ref_id: R19
      name: "Habiliter et former les intervenants \xE0 la cybers\xE9curit\xE9"
      description: "Il est recommand\xE9 d\u2019habiliter (habilitation interne ou\
        \ au secret de la d\xE9fense nationale selon le niveau de sensibilit\xE9,\
        \ se r\xE9f\xE9rer au document [51]) tout intervenant \xE0 l\u2019utilisation\
        \ s\xE9curis\xE9e du syst\xE8me d\u2019information de l\u2019usine et de veiller\
        \ \xE0 ce que chacun re\xE7oive une formation adapt\xE9e \xE0 la cybers\xE9\
        curit\xE9."
      annotation: '**Exigences IEC 62443**


        ORG 1.5, SP01.01, SP01.02, SP01.03'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r20
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.2
      ref_id: R20
      name: "Former obligatoirement les intervenants avant toute intervention sur\
        \ le syst\xE8me industriel"
      description: "Il est recommand\xE9 de former obligatoirement les intervenants\
        \ avant toute intervention sur le syst\xE8me industriel."
      annotation: '**Exigences IEC 62443**


        ORG 1.5, SP01.01, SP01.02, SP01.03'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r21
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.2
      ref_id: R21
      name: "Choisir des prestataires labellis\xE9s"
      description: "Il est recommand\xE9 de choisir des prestataires labellis\xE9\
        s pour dispenser les formations de cybers\xE9curit\xE9 (par exemple une entreprise\
        \ disposant du label \xABExpertCyber\xBB)."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r22
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.2
      ref_id: R22
      name: "Dispenser des s\xE9ances de formation de cybers\xE9curit\xE9 en plus\
        \ des formations de s\xFBret\xE9"
      description: "Il est recommand\xE9 de dispenser les s\xE9ances de formation\
        \ \xE0 la cybers\xE9curit\xE9 des syst\xE8mes industriels en plus des formations\
        \ de s\xFBret\xE9 et de s\xE9curit\xE9 du site."
      annotation: '**Exigences IEC 62443**


        ORG 1.4'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.3
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2
      ref_id: 3.2.3
      name: Gestion des interventions
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : n\xE9ant\n- **Guide d\u2019\
        hygi\xE8ne** : n\xE9ant\n- **ISO 27002** : 8.3.2"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r23
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.3
      ref_id: R23
      name: "D\xE9finir une proc\xE9dure de gestion des interventions"
      description: "Afin de valider les interventions, il est recommand\xE9 de mettre\
        \ en place une proc\xE9dure de gestion des interventions pr\xE9voyant, \xE0\
        \ chaque intervention, les \xE9l\xE9ments suivants\_:\n\n- la personne qui\
        \ ex\xE9cute le travail et son donneur d\u2019ordre;\n- la date et l\u2019\
        heure de l\u2019intervention;\n- le p\xE9rim\xE8tre sur lequel le travail\
        \ est ex\xE9cut\xE9;\n- les actions r\xE9alis\xE9es;\n- la liste des \xE9\
        quipements d\xE9pos\xE9s ou remplac\xE9s (y compris, le cas \xE9ch\xE9ant,\
        \ les num\xE9ros d\u2019identification);\n- les modifications apport\xE9es\
        \ et leur impact."
      annotation: '**Exigences IEC 62443**


        SR 2.8, SR 2.12, CR 2.8, CR 2.12'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r24
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.3
      ref_id: R24
      name: "Int\xE9grer le processus d\u2019intervention dans la d\xE9marche d\u2019\
        am\xE9lioration continue"
      description: "Il est recommand\xE9 d\u2019int\xE9grer le processus d\u2019intervention\
        \ dans la d\xE9marche d\u2019am\xE9lioration continue de l\u2019entreprise\
        \ (en tenant compte des diff\xE9rents retours d\u2019exp\xE9rience) afin de\
        \ s\u2019assurer du respect de la proc\xE9dure et \xE9ventuellement de la\
        \ faire \xE9voluer."
      annotation: '**Exigences IEC 62443**


        SM-13'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r25
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.3
      ref_id: R25
      name: "Mettre en place une proc\xE9dure d\u2019encadrement lorsqu\u2019un intervenant\
        \ utilise ses propres outils"
      description: "Il est recommand\xE9 de mettre en place une proc\xE9dure d\u2019\
        encadrement (signature d\u2019une charte informatique, encadrement par un\
        \ employ\xE9, transmission des r\xE9f\xE9rences du poste de l\u2019intervenant\
        \ en amont de l\u2019intervention, etc.) pour les cas exceptionnels o\xF9\
        \ l\u2019intervenant apporte ses propres outils (des outils de diagnostic\
        \ propres \xE0 l\u2019\xE9quipementier par exemple). Dans la phase op\xE9\
        rationnelle, il est recommand\xE9 de limiter ces interventions \xE0 des situations\
        \ exceptionnelles (par exemple, avarie du syst\xE8me)."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r26
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.2.3
      ref_id: R26
      name: "Recenser l\u2019ensemble des mat\xE9riels et logiciels utilis\xE9s pour\
        \ les interventions"
      description: "Il est recommand\xE9 de recenser, dans la gestion du parc, l\u2019\
        ensemble des \xE9quipements mat\xE9riels et logiciels utilis\xE9s pour les\
        \ interventions sur les syst\xE8mes industriels afin qu\u2019ils soient bien\
        \ identifi\xE9s (conform\xE9ment \xE0 la recommandation R6) et maintenus \xE0\
        \ jour."
      annotation: '**Exigences IEC 62443**


        SR 7.8, CR 7.8, CM 1.1, SP01.02RE1, SP06.02BR'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3
      ref_id: '3.3'
      name: "Int\xE9gration de la cybers\xE9curit\xE9 dans le cycle de vie du syst\xE8\
        me industriel"
      description: "L\u2019int\xE9gration de la cybers\xE9curit\xE9 dans le cycle\
        \ de vie des syst\xE8mes industriels est important pour parvenir aux exigences\
        \ attendues. Une attention particuli\xE8re doit \xEAtre port\xE9e \xE0 la\
        \ cybers\xE9curit\xE9 lors de la phase de conception du syst\xE8me industriel.\n\
        \nIl est conseill\xE9 de ne pas traiter la cybers\xE9curit\xE9 de mani\xE8\
        re isol\xE9e. Elle doit \xEAtre int\xE9gr\xE9e dans le projet comme un m\xE9\
        tier, au m\xEAme titre que l\u2019\xE9lectricit\xE9, la m\xE9canique, etc."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      ref_id: 3.3.1
      name: Exigences dans les contrats et les cahiers des charges
      description: "Les projets d\u2019installation de syst\xE8mes industriels peuvent\
        \ \xEAtre r\xE9alis\xE9s en interne ou en externe. Dans ce cas, il convient\
        \ de pr\xE9ciser les exigences de cybers\xE9curit\xE9 dans le cahier des charges.\
        \ Ces exigences doivent \xEAtre explicites, mesurables (contr\xF4le de leur\
        \ mise en place par exemple) et contractualis\xE9es.\n\nLe r\xE9f\xE9rentiel\
        \ [48] propose des exigences relatives aux prestataires d\u2019int\xE9gration\
        \ et de maintenance de syst\xE8mes industriels. Ces \xE9l\xE9ments peuvent\
        \ \xEAtre int\xE9gr\xE9s, par exemple, dans un cahier des charges."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.18\n- **Guide d\u2019hygi\xE8\
        ne** : n\xE9ant\n- **ISO 27002** : 5.20"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r27
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R27
      name: "Int\xE9grer au cahier des charges les exigences de cybers\xE9curit\xE9\
        \ identifi\xE9es lors de la phase de sp\xE9cification"
      description: "Il est recommand\xE9 d\u2019int\xE9grer au cahier des charges\
        \ les exigences de cybers\xE9curit\xE9 identifi\xE9es lors de la phase de\
        \ sp\xE9cification, en particulier les exigences r\xE9glementaires (par exemple\
        \ celles relatives au Cyber Resilience Act \u2013 CRA)."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r28
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R28
      name: "Exiger la d\xE9finition d\u2019un point de contact pour la cybers\xE9\
        curit\xE9"
      description: "Il est recommand\xE9 d\u2019int\xE9grer au cahier des charges\
        \ une clause exigeant l\u2019identification d\u2019un point de contact pour\
        \ la cybers\xE9curit\xE9 du projet. Celui-ci devrait \xEAtre charg\xE9 de\_\
        :\n\n- la liaison avec la cha\xEEne de responsabilit\xE9 de l\u2019entit\xE9\
        \ responsable (voir la section 3.1.1);\n- la garantie du respect de la politique\
        \ de cybers\xE9curit\xE9;\n- la communication sur les \xE9carts par rapport\
        \ aux exigences et les autres non-conformit\xE9s."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r29
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R29
      name: "Int\xE9grer dans le cahier des charges la liste des documents \xE0 fournir"
      description: "Il est recommand\xE9 d\u2019inclure, dans le cahier des charges,\
        \ la liste des documents \xE0 fournir par le prestataire concernant le syst\xE8\
        me industriel, dont\_:\n\n- une analyse de risque (voir la section 3.1.3);\n\
        - une analyse fonctionnelle;\n- une analyse organique\_;\n- un dossier d\u2019\
        exploitation et de maintenance;\n- une cartographie (voir la section 3.1.2)."
      annotation: '**Exigences IEC 62443**


        ORG 2.1, SP02.01BR, SP03.01'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r30
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R30
      name: "Exiger du prestataire un plan d\u2019assurance s\xE9curit\xE9"
      description: "Il est recommand\xE9 d\u2019exiger un plan d\u2019assurance s\xE9\
        curit\xE9 d\xE9crivant toutes les mesures r\xE9pondant aux exigences de cybers\xE9\
        curit\xE9 demand\xE9es (voir le guide relatif \xE0 la ma\xEEtrise de l\u2019\
        externalisation [18])."
      annotation: '**Exigences IEC 62443**


        SR-3'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r31
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R31
      name: "Faire figurer des tests de cybers\xE9curit\xE9 dans le cahier des charges"
      description: "Il est recommand\xE9 de pr\xE9ciser, dans le cahier des charges,\
        \ des clauses exigeant des tests de cybers\xE9curit\xE9, notamment lors des\
        \ FAT et SAT. La liste des essais demand\xE9s doit suivre la recommandation\
        \ R45."
      annotation: '**Exigences IEC 62443**


        SVV-1, SVV-3'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r32
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R32
      name: "Pr\xE9voir une r\xE9vision de l\u2019analyse de risque pour chaque \xE9\
        tape du projet"
      description: "Il est recommand\xE9 d\u2019effectuer une r\xE9vision de l\u2019\
        analyse de risque \xE0 chaque jalon de phases du projet (par exemple\_: sp\xE9\
        cification, conception, int\xE9gration, validation), mais aussi lors de chaque\
        \ modification jug\xE9e majeure."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r33
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R33
      name: "S\u2019assurer de l\u2019utilisation d\u2019un environnement de d\xE9\
        veloppement s\xE9curis\xE9"
      description: "Il est recommand\xE9 d\u2019utiliser un environnement de d\xE9\
        veloppement s\xE9curis\xE9 conform\xE9ment \xE0 la section 4.3.6."
      annotation: '**Exigences IEC 62443**


        ORG 2.3, SD-1'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r34
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R34
      name: "Pr\xE9ciser une liste des \xE9quipements mat\xE9riels et logiciels exigeant\
        \ un Visa de s\xE9curit\xE9"
      description: "Il est recommande de pr\xE9ciser, dans le cahier des charges,\
        \ une liste des \xE9quipements mat\xE9riels et logiciels exigeant un Visa\
        \ de s\xE9curit\xE9. Cette liste a pour but de mettre en \xE9vidence les \xE9\
        quipements jug\xE9s sensibles et n\xE9cessitant une \xE9valuation de s\xE9\
        curit\xE9."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r35
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.1
      ref_id: R35
      name: "Exiger la visibilit\xE9 du processus de contr\xF4le qualit\xE9"
      description: "Il est recommand\xE9 d\u2019exiger, dans le cahier des charges,\
        \ la visibilit\xE9 du processus de contr\xF4le qualit\xE9 afin de r\xE9duire\
        \ les d\xE9faillances logicielles et les vuln\xE9rabilit\xE9s. Ces \xE9l\xE9\
        ments doivent \xEAtre pr\xE9sents dans le plan d\u2019assurance s\xE9curit\xE9\
        \ (PAS) pour assurer la s\xE9curit\xE9 de l\u2019information durant les phases\
        \ projet."
      annotation: '**Exigences IEC 62443**


        SM-1'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.2
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      ref_id: 3.3.2
      name: "Int\xE9gration de la cybers\xE9curit\xE9 dans les phases de sp\xE9cification"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.16\n- **Guide d\u2019hygi\xE8\
        ne** : n\xE9ant\n- **ISO 27002** : 5.8"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r36
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.2
      ref_id: R36
      name: "Int\xE9grer les mesures correspondant \xE0 la classe de cybers\xE9curit\xE9"
      description: "Il est recommand\xE9 d\u2019int\xE9grer les mesures correspondant\
        \ \xE0 la classe de cybers\xE9curit\xE9 pr\xE9sent\xE9es dans le chapitre\
        \ 4. \xC0 titre d\u2019exemple\_:\n\n- authentifier les intervenants (voir\
        \ la section 4.1);\n- d\xE9finir une architecture s\xE9curis\xE9e (voir la\
        \ section 4.2);\n- s\xE9curiser les \xE9quipements (voir la section 4.3);\n\
        - g\xE9rer les vuln\xE9rabilit\xE9s (voir la section 4.3.2)."
      annotation: '**Exigences IEC 62443**


        SUM-1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r37
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.2
      ref_id: R37
      name: "Prendre en compte la s\xE9curit\xE9 physique"
      description: "Il est recommand\xE9 de prendre en compte la s\xE9curit\xE9 physique\
        \ lors de la d\xE9finition de la localisation des \xE9quipements (par exemple\
        \ le positionnement d\u2019un automate dans un coffret s\xE9curis\xE9 ou un\
        \ local ferm\xE9 prot\xE9g\xE9 par un contr\xF4le d\u2019acc\xE8s) selon le\
        \ guide de s\xE9curisation des syst\xE8mes de contr\xF4le d\u2019acc\xE8s\
        \ physique et vid\xE9oprotection [35]."
      annotation: '**Exigences IEC 62443**


        ORG 3.1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r38
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.2
      ref_id: R38
      name: "Int\xE9grer uniquement des outils n\xE9cessaires \xE0 la conduite et\
        \ la gestion de l\u2019installation"
      description: "Il est recommand\xE9 d\u2019int\xE9grer uniquement des outils\
        \ n\xE9cessaires \xE0 la conduite et la gestion de l\u2019installation industrielle.\
        \ \xC0 titre d\u2019exemple, des postes bureautiques non connect\xE9s au syst\xE8\
        me industriel doivent \xEAtre pr\xE9vus pour permettre la consultation de\
        \ la documentation et le remplissage de feuilles de suivi."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r39
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.2
      ref_id: R39
      name: "Exiger du prestataire des proc\xE9dures et des moyens techniques pour\
        \ le maintien en condition de s\xE9curit\xE9"
      description: "Il est recommand\xE9 d\u2019exiger du prestataire des proc\xE9\
        dures et des moyens techniques pour le maintien en condition de s\xE9curit\xE9\
        \ (MCS) des composants du syst\xE8me industriel et faciliter les exigences\
        \ telles que\_:\n\n- la ma\xEEtrise de la configuration (voir la section 3.3.6);\n\
        - le durcissement des configurations (voir la section 4.3.1);\n- la gestion\
        \ des vuln\xE9rabilit\xE9s (voir la section 4.3.2).\n\nPr\xE9voir des \xE9\
        tats de variable(s) lors des modes d\xE9grad\xE9s. Par exemple, le positionnement\
        \ \xE0 un \xE9tat s\xFBr des variables \xE0 chaque red\xE9marrage d\u2019\
        un automate."
      annotation: '**Exigences IEC 62443**


        SR 3.6, SR 7.6, CR 3.6, CR 7.6, CM 1.3, CM 1.4, DATA 1.4, DM-5, SP06.03'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.3
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      ref_id: 3.3.3
      name: "Int\xE9gration de la cybers\xE9curit\xE9 dans les phases de conception"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.16\n- **Guide d\u2019hygi\xE8\
        ne** : n\xE9ant\n- **ISO 27002** : 5.8"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r40
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.3
      ref_id: R40
      name: "Limiter au maximum les interfaces et la complexit\xE9 du syst\xE8me"
      description: "Il est recommand\xE9, lors de la conception, de limiter au maximum\
        \ les interfaces et la complexit\xE9 du syst\xE8me afin d\u2019en r\xE9duire\
        \ la surface d\u2019attaque."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r41
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.3
      ref_id: R41
      name: "S\xE9lectionner les \xE9quipements selon leurs caract\xE9ristiques de\
        \ cybers\xE9curit\xE9"
      description: "Il est recommand\xE9, \xE0 fonctionnalit\xE9s \xE9quivalentes,\
        \ de s\xE9lectionner les \xE9quipements selon leurs caract\xE9ristiques de\
        \ cybers\xE9curit\xE9 (par exemple\_: m\xE9canismes d\u2019authentification,\
        \ s\xE9gr\xE9gation des droits, chiffrement)."
      annotation: '**Exigences IEC 62443**


        SR 1.1, SR 1.2, SR 1.3, SR 1.4, SR 1.5, SR 1.6 RE1, CR 1.1, CR 1.2, CR 1.3,
        CR 1.4, CR 1.5, NDR1.6RE1, SP03.08RE1, SP09.01BR, SP09.02'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r42
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.3
      ref_id: R42
      name: "D\xE9finir des r\xF4les pour les intervenants"
      description: "Il est recommand\xE9 de d\xE9finir des r\xF4les pour les intervenants\
        \ (internes et externes) et de les int\xE9grer dans la gestion des droits\
        \ des comptes informatiques. Ces r\xF4les correspondent aux missions de chacun\
        \ (principe du moindre privil\xE8ge) en distinguant, en particulier, les utilisateurs\
        \ et les administrateurs (comme pr\xE9cis\xE9 \xE0 la section 4.1.1)."
      annotation: '**Exigences IEC 62443**


        CR 2.1 RE2, USER 1.5, SP03.08BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.4
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      ref_id: 3.3.4
      name: "Audits et tests de cybers\xE9curit\xE9"
      description: "Afin de s\u2019assurer que le niveau de s\xE9curit\xE9 ne se d\xE9\
        grade pas au cours du temps, il est n\xE9cessaire d\u2019effectuer r\xE9guli\xE8\
        rement des tests ou des audits de cybers\xE9curit\xE9 qui doivent \xEAtre\
        \ encadr\xE9s par des proc\xE9dures sp\xE9cifiques. Ces audits peuvent \xEA\
        tre int\xE9gr\xE9s aux phases de maintenance et de tests fonctionnels.\n\n\
        La s\xE9curit\xE9 d\u2019une installation industrielle est d\xE9pendante de\
        \ tous les syst\xE8mes qui la composent. Il est donc n\xE9cessaire d\u2019\
        auditer l\u2019installation dans son ensemble. Dans la pratique, un s\xE9\
        quencement des audits pourra \xEAtre mis en \u0153uvre de sorte \xE0 auditer\
        \ d\u2019abord les syst\xE8mes identifi\xE9s comme les plus critiques, conform\xE9\
        ment \xE0 l\u2019analyse de risque r\xE9alis\xE9e au pr\xE9alable."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.17\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 38 et n\xB0 42\n- **ISO 27002** : 8.34"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r43
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.4
      ref_id: R43
      name: Conduire des audits triennaux
      description: "Il est recommand\xE9 de r\xE9aliser des audits triennaux et lors\
        \ de modifications substantielles de l\u2019installation. Ces audits peuvent\
        \ \xEAtre r\xE9alis\xE9s par du personnel interne ou externe \xE0 l\u2019\
        entit\xE9."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r44
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.4
      ref_id: R44
      name: "Poursuivre les audits par un plan d\u2019actions"
      description: "Il est recommand\xE9 de mettre en place un plan d\u2019actions\
        \ et de suivi de l\u2019audit valid\xE9 et contr\xF4l\xE9 par l\u2019entit\xE9\
        \ responsable."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r45
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.4
      ref_id: R45
      name: "Concevoir un programme d\u2019audit"
      description: "Il est recommand\xE9 de r\xE9aliser un programme d\u2019audit\
        \ int\xE9grant les \xE9l\xE9ments suivants\_:\n\n- un audit d\u2019architecture;\n\
        - un audit de configuration;\n- un audit organisationnel et physique;\n- des\
        \ tests d\u2019intrusion physique et logique."
      annotation: "**Exigences IEC 62443**\n\nSVV-4\n\n**Attention**\n\nLes tests\
        \ d\u2019intrusion logique pouvant entra\xEEner des d\xE9faillances\_: ils\
        \ doivent \xEAtre ex\xE9cut\xE9s dans le cadre d\u2019une maintenance, avant\
        \ la mise en production des syst\xE8mes ou sur une plateforme repr\xE9sentative\
        \ de ce qui est d\xE9ploy\xE9 (dans ce cas, le syst\xE8me doit \xEAtre remis\
        \ dans sa configuration initiale apr\xE8s l\u2019audit)."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r46
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.4
      ref_id: R46
      name: "Confier les audits \xE0 un prestataire qualifi\xE9"
      description: "Il est recommand\xE9 de confier l\u2019audit \xE0 un prestataire\
        \ qualifi\xE9 d\u2019audit de la s\xE9curit\xE9 des syst\xE8mes d\u2019information\
        \ (PASSI) conform\xE9ment au r\xE9f\xE9rentiel PASSI [47]."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r47
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.4
      ref_id: R47
      name: Effectuer les audits au moins une fois par an
      description: "Il est recommand\xE9 d\u2019effectuer les audits au moins une\
        \ fois par an."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.5
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      ref_id: 3.3.5
      name: Mise en exploitation
      description: "L\u2019entit\xE9 en charge de l\u2019exploitation peut ne pas\
        \ \xEAtre le propri\xE9taire du syst\xE8me industriel, et donc ne pas avoir\
        \ \xE9t\xE9 impliqu\xE9e dans son projet de r\xE9alisation. Cela peut concerner\
        \ les cas de d\xE9l\xE9gation de service public, de concession d\u2019exploitation\
        \ ou de contrat d\u2019exploitation avec obligation de r\xE9sultat par exemple."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r48
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.5
      ref_id: R48
      name: "\xC9tablir un \xE9tat des lieux avant la mise en exploitation"
      description: "Il est recommand\xE9 d\u2019\xE9tablir un \xE9tat des lieux du\
        \ niveau de cybers\xE9curit\xE9 du syst\xE8me avant sa mise en exploitation\
        \ (par exemple au moyen d\u2019audits internes ou externes)."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r49
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.5
      ref_id: R49
      name: "Faire homologuer les syst\xE8mes industriels par l\u2019entit\xE9 responsable"
      description: "Il est recommand\xE9 de faire homologuer (c\u2019est-\xE0-dire\
        \ de faire accepter formellement les risques r\xE9siduels) les syst\xE8mes\
        \ industriels par l\u2019entit\xE9 responsable de l\u2019installation."
      annotation: '**Exigences IEC 62443**


        ZCR 7.1'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.6
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      ref_id: 3.3.6
      name: "Gestion des modifications et des \xE9volutions"
      description: "La gestion des modifications concerne les programmes des automates,\
        \ les applications SCADA, les fichiers de configurations des diff\xE9rents\
        \ \xE9quipements (par exemple\_: \xE9quipements r\xE9seaux, capteurs et actionneurs\
        \ intelligents)."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : n\xE9ant\n- **Guide d\u2019\
        hygi\xE8ne** : n\xE9ant\n- **ISO 27002** : 8.32"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r50
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.6
      ref_id: R50
      name: "Tracer les mises \xE0 jour et les modifications apport\xE9es aux syst\xE8\
        mes"
      description: "Il est recommand\xE9 de tracer les mises \xE0 jour et les modifications\
        \ apport\xE9es aux syst\xE8mes industriels."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r51
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.6
      ref_id: R51
      name: "V\xE9rifier que seules les modifications n\xE9cessaires ont \xE9t\xE9\
        \ appliqu\xE9es"
      description: "Il est recommand\xE9 de v\xE9rifier que seules les modifications\
        \ n\xE9cessaires et demand\xE9es ont \xE9t\xE9 appliqu\xE9es aux configurations\
        \ entre la version courante et la version \xE0 installer."
      annotation: '**Exigences IEC 62443**


        SR 3.4, CR 3.4, CM 1.4, SP03.05BR'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r52
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.6
      ref_id: R52
      name: "\xC9valuer les modifications dans un environnement de test"
      description: "Il est recommand\xE9 d\u2019\xE9valuer les modifications pr\xE9\
        vues dans un environnement de test avant leurs mises en production."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r53
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.6
      ref_id: R53
      name: "Faire valider les impacts des modifications par l\u2019entit\xE9 responsable"
      description: "Il est recommand\xE9 de faire valider les impacts des modifications\
        \ par l\u2019entit\xE9 responsable avant la mise en production."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r54
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.6
      ref_id: R54
      name: "Mettre en place un processus de v\xE9rification des versions de programme\
        \ en cours d\u2019ex\xE9cution"
      description: "Il est recommand\xE9 de mettre en place un processus de v\xE9\
        rification des versions de programme en cours d\u2019ex\xE9cution par rapport\
        \ \xE0 une version de r\xE9f\xE9rence. Cela permet de s\u2019assurer que les\
        \ processus ex\xE9cut\xE9s par le syst\xE8me industriel (par exemple les automates,\
        \ les logiciels SCADA) sont ceux qui doivent \xEAtre utilis\xE9s."
      annotation: '**Exigences IEC 62443**


        CR 3.4'
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.7
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3
      ref_id: 3.3.7
      name: Processus de veille
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.2\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 34\n- **ISO 27002** : 8.8"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r55
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.3.7
      ref_id: R55
      name: "Se tenir inform\xE9 des vuln\xE9rabilit\xE9s critiques et des correctifs\
        \ associ\xE9s"
      description: "Il est recommand\xE9 de se tenir inform\xE9 des vuln\xE9rabilit\xE9\
        s critiques et des correctifs relatifs aux \xE9quipements mat\xE9riels et\
        \ logiciels utilis\xE9s dans le syst\xE8me industriel."
      annotation: "**Exigences IEC 62443**\n\nCOMP 3.3, EVENT 1.9, DM-1, SP03.03BR,\
        \ SP11.06RE3\n\n**Information**\n\nCe processus devrait notamment reposer\
        \ sur les sources ouvertes disponibles telles que les CSIRT nationaux (par\
        \ exemple CERT-FR, ICS-CERT), les PSIRT des \xE9quipementiers et des \xE9\
        diteurs de logiciels."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r56
      assessable: true
      depth: 4
