    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.1
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2
      ref_id: 4.2.1
      name: "Principe d\u2019interconnexion entre classes"
      description: "Dans certains cas de figure et selon le d\xE9coupage des zones,\
        \ il peut \xEAtre n\xE9cessaire de transmettre des informations vers des zones\
        \ de classe inf\xE9rieure (par exemple depuis un sous syst\xE8me vers son\
        \ DCS). Pour cela, il est recommand\xE9 de mettre en \u0153uvre une passerelle\
        \ d\u2019interconnexion s\xE9curis\xE9e industrielle conform\xE9ment \xE0\
        \ la section 4.2.2.\n\nLes fonctions de s\xE9curit\xE9 port\xE9es par une\
        \ telle passerelle ont pour but\_:\n\n- de prot\xE9ger en int\xE9grit\xE9\
        \ les classes hautes;\n- de prot\xE9ger en confidentialit\xE9 des donn\xE9\
        es export\xE9es depuis ces m\xEAmes classes;\n- de limiter la capacit\xE9\
        \ de lat\xE9ralisation d\u2019un attaquant entre les zones, ind\xE9pendemment\
        \ de leur casse.\n\nLes fonctions de s\xE9curit\xE9 associ\xE9es \xE0 la passerelle\
        \ sont list\xE9es dans le tableau 3 et d\xE9crites ci-dessous\_:\n\n- Uni\_\
        : fonction d\u2019unidirectionnalit\xE9 du transfert de donn\xE9es entre deux\
        \ zones qui permet\_:\n    - d\u2019assurer que les donn\xE9es soient exclusivement\
        \ ou \xE9crites ou lues depuis une seule des deux zones, garantissant que\
        \ le flux d\u2019information est strictement \xE0 sens unique entre ces zones.\n\
        \    - de limiter la capacit\xE9 de lat\xE9ralisation entre les deux zones.\n\
        \n**Information**\n\nCette fonction est pr\xE9f\xE9rablement positionn\xE9\
        e au plus proche de la classe de moindre s\xE9curit\xE9 pour les propri\xE9\
        t\xE9s d\u2019isolation qu\u2019elle conf\xE8re \xE0 l\u2019interconnexion,\
        \ de pr\xE9f\xE9rence avec un pare-feu. Les solutions techniques compatibles\
        \ pour mettre en \u0153uvre cette fonction sont, notamment, un pare-feu \xE0\
        \ \xE9tats, une passerelle d\u2019interconnexion ou une diode (selon la classe,\
        \ d\xE9finie dans le tableau 3).\n\n- Aut (IT)\_: fonction de contr\xF4le\
        \ de la source de la donn\xE9e \xE0 partir d\u2019une liste de sources de\
        \ donn\xE9es autoris\xE9es (type liste d\u2019autorisations) afin de s\u2019\
        assurer de la provenance l\xE9gitime des donn\xE9es \xE9mises. Cette fonction\
        \ de contr\xF4le peut \xEAtre mise en \u0153uvre, par exemple, avec un pare-feu\
        \ \xE0 \xE9tats autorisant une adresse IP source qui peut \xEAtre compl\xE9\
        t\xE9e par une authentification.\n- Rup\_: fonction de rupture protocolaire\
        \ et de transformation de la donn\xE9e, par exemple avec une passerelle protocolaire\
        \ Modbus/BACnet.\n- Aut (OT)\_: fonction de contr\xF4le de la destination\
        \ des donn\xE9es \xE0 partir d\u2019une liste de tuples autoris\xE9s (type\
        \ liste d\u2019autorisations) afin d\u2019assurer que la donn\xE9e transmise\
        \ peut \xEAtre \xE9crite dans la classe de destination. Ceci peut \xEAtre\
        \ mis en \u0153uvre, par exemple, avec un pare-feu disposant de la fonctionnalit\xE9\
        \ Deep Packet Inspection sur la base des r\xE8gles suivantes\_:\n    - IP\
        \ Source, IP Destination, Protocole: Modbus, IPS\_: write single register\
        \ (code 6)\_: adresse du registre;\n    - IP Source, IP Destination, Protocole:\
        \ OPC UA, IPS\_: write (Id 673 et 676);\n    - IP Source, IP Destination,\
        \ Protocole: IEC 60870-5-104, IPS\_: type P_ME_NA_1 (Id 110)\_: valeur \xE0\
        \ transmettre.\n- Inno (IT)\_: fonction de v\xE9rification antivirale des\
        \ donn\xE9es transmises pour s\u2019assurer qu\u2019elles ne sont pas vectrices\
        \ de code malveillant. Ce contr\xF4le d\u2019innocuit\xE9 b\xE9n\xE9ficie\
        \ id\xE9alement des m\xEAmes politiques antivirales et de supervision de s\xE9\
        curit\xE9 que l\u2019OT.\n\nLe tableau 3 synth\xE9tise les diff\xE9rentes\
        \ fonctions de s\xE9curit\xE9 n\xE9cessaires \xE0 l\u2019interconnexion entre\
        \ syst\xE8mes de classes diff\xE9rentes conform\xE9ment \xE0 la section 4.2.2.\n\
        \nLes fonctions de s\xE9curit\xE9 de la passerelle peuvent \xEAtre mises en\
        \ \u0153uvre au sein de multiples architectures compos\xE9es d\u2019un ou\
        \ plusieurs produits. Le choix de mise en \u0153uvre de ces fonctions est\
        \ d\xE9pendant du contexte de l\u2019interconnexion. De plus, les fonctions\
        \ doivent \xEAtre mises en \u0153uvre avec un niveau de s\xE9curit\xE9 adapt\xE9\
        \ au regard du risque.\n\n**Information**\n\nLe choix de d\xE9crire les passerelles\
        \ d\u2019interconnexion d\u2019un point de vue fonctionnel, par opposition\
        \ \xE0 une description orient\xE9e solutions (par exemple\_: pare-feu, diode,\
        \ ACL dans un \xE9quipement de t\xE9l\xE9communication), vise \xE0 permettre\
        \ une plus grande libert\xE9 de mise en \u0153uvre de ces fonctions afin de\
        \ les adapter \xE0 une grande vari\xE9t\xE9 de syst\xE8mes industriels et,\
        \ en particulier, pour les interconnexions non IP.\n\nLes fonctions d\xE9\
        crites s\u2019appuient sur celles d\xE9finies dans les recommandations pour\
        \ les architectures des interconnexions multiniveaux [39]. Elles sont adapt\xE9\
        es \xE0 la protection en int\xE9grit\xE9 des classes hautes et en confidentialit\xE9\
        \ des donn\xE9es export\xE9es. L\u2019iconographie a \xE9t\xE9 choisie en\
        \ coh\xE9rence avec ce guide. En particulier, le symbole de la diode fait\
        \ r\xE9f\xE9rence \xE0 la fonction d\u2019unidirectionnalit\xE9 des donn\xE9\
        es.\n\nPour des \xE9l\xE9ments suppl\xE9mentaires relatifs aux passerelles\
        \ d\u2019interconnexions IT/OT, il est possible de se r\xE9f\xE9rer \xE0 l\u2019\
        article Approche SSI pour l\u2019Internet des objets industriels [52].\n\n\
        Le tableau 3 (fonctions de s\xE9curit\xE9 \xE0 mettre en \u0153uvre entre\
        \ classes) ainsi que les figures 1 et 2 (propositions de passerelles IT vers\
        \ OT et OT vers IT) ne sont pas reproduits ici; se r\xE9f\xE9rer au guide\
        \ source."
