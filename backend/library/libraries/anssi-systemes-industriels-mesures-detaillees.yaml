    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r102
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.2
      ref_id: R102
      name: "Mettre en \u0153uvre une politique de filtrage entre les zones"
      description: "Il est recommand\xE9 de mettre en \u0153uvre une politique de\
        \ filtrage entre les zones. Pour d\xE9finir cette politique de filtrage, il\
        \ est notamment possible de se reporter au guide relatif \xE0 la d\xE9finition\
        \ d\u2019une politique de pare-feu [19].\n\nPour les flux utilisant le protocole\
        \ IP, quelques grands principes sont rappel\xE9s ici\_:\n\n- un flux est identifi\xE9\
        \ par l\u2019adresse IP source, l\u2019adresse IP destination, le protocole\
        \ (par exemple UDP ou TCP) et, le cas \xE9ch\xE9ant, les num\xE9ros de port\
        \ source et destination;\n- les flux sont refus\xE9s par d\xE9faut;\n- seuls\
        \ les flux n\xE9cessaires au fonctionnement du syst\xE8me industriel sont\
        \ autoris\xE9s;\n- les flux refus\xE9s peuvent \xEAtre journalis\xE9s et analys\xE9\
        s conform\xE9ment \xE0 la strat\xE9gie de s\xE9curit\xE9 \xE9tablie en R203\
        \ (une liste minimale des \xE9v\xE9nements \xE0 journaliser est pr\xE9sent\xE9\
        e \xE0 l\u2019annexe C du pr\xE9sent guide)."
      annotation: '**Exigences IEC 62443**


        SR 5.2, CR 5.2, NET 1.1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
