      ref_id: 3.5.1
      name: "Plan de reprise ou de continuit\xE9 d\u2019activit\xE9"
      description: "Les plans de reprise ou de continuit\xE9 d\u2019activit\xE9 (PRA\
        \ et PCA) permettent de garantir la reprise ou la continuit\xE9 du service\
        \ suite \xE0 un sinistre, quelle qu\u2019en soit l\u2019origine. Le plan de\
        \ continuit\xE9 d\u2019activit\xE9, parfois d\xE9j\xE0 existant pour r\xE9\
        pondre \xE0 des sinistres d\u2019origine autre que la cybers\xE9curit\xE9\
        , doit r\xE9pondre \xE0 l\u2019ensemble des \xE9v\xE9nements redout\xE9s entra\xEE\
        nant un arr\xEAt du service rendu, tels qu\u2019ils ont \xE9t\xE9 identifi\xE9\
        s dans l\u2019analyse de risque pour la cybers\xE9curit\xE9. Pour plus de\
        \ d\xE9tails, se reporter au guide \xE9dit\xE9 par le SGDSN [57]."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.15\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 37\n- **ISO 27002** : 5.29 et 5.30"
