        s du syst\xE8me, en particulier ceux permettant de garantir la s\xE9curit\xE9\
        \ des biens et personnes."
      annotation: '**Exigences IEC 62443**


        COMP 3.4, SP11.06RE1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
