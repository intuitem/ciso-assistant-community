      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.4
      ref_id: R127
      name: "D\xE9ployer un pare-feu distinct du concentrateur VPN pour les interconnexions"
      description: "Il est recommand\xE9 de d\xE9ployer un pare-feu distinct du concentrateur\
        \ VPN au niveau des passerelles d\u2019interconnexion, conform\xE9ment au\
        \ guide de l\u2019ANSSI [27]."
      annotation: '**Exigences IEC 62443**


        ZCR 3.2, SR 5.1, SR 5.2, CR 5.1, CR 5.2, CM 1.2, NET 1.1, SP03.02, SP03.03RE1,
        SP03.07BR'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r128
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.4
      ref_id: R128
      name: "Disposer d\u2019\xE9quipements qualifi\xE9s pour l\u2019interconnexion"
      description: "Il est recommand\xE9 de s\u2019assurer que les \xE9quipements\
        \ utilis\xE9s pour l\u2019interconnexion disposent d\u2019une qualification\
        \ de l\u2019ANSSI."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2
      ref_id: 4.2.5
      name: "Acc\xE8s distants"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.10\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 18, n\xB0 32 et n\xB0 42\n- **ISO 27002** : 8.16 et\
        \ 8.22"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5.1
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5
      ref_id: 4.2.5.1
      name: "T\xE9l\xE9diagnostic, t\xE9l\xE9maintenance et t\xE9l\xE9gestion"
      description: "Le t\xE9l\xE9diagnostic est l\u2019action d\u2019effectuer, \xE0\
        \ distance (c\u2019est-\xE0-dire depuis l\u2019ext\xE9rieur des b\xE2timents\
        \ dans lesquels se trouve le syst\xE8me industriel), un diagnostic de l\u2019\
        installation technique en passant potentiellement par des r\xE9seaux non-ma\xEE\
        tris\xE9s. Cela n\u2019inclut pas de modification de param\xE9trage. La t\xE9\
        l\xE9maintenance est l\u2019action d\u2019effectuer, \xE0 distance (c\u2019\
        est-\xE0-dire depuis l\u2019ext\xE9rieur des b\xE2timents dans lesquels se\
        \ trouve le syst\xE8me industriel), des t\xE2ches de maintenance sur une installation\
        \ technique en passant potentiellement par des r\xE9seaux non ma\xEEtris\xE9\
        s. Cela implique de pouvoir faire des modifications de param\xE8tres, voire\
        \ de programmes.\n\nLa t\xE9l\xE9gestion consiste \xE0 prendre le contr\xF4\
        le \xE0 distance du syst\xE8me industriel (supervision et modification de\
        \ param\xE9trage). Si la t\xE9l\xE9gestion est utilis\xE9e, les \xE9quipements\
        \ utilis\xE9s pour cet usage doivent \xEAtre int\xE9gr\xE9s au p\xE9rim\xE8\
        tre du syst\xE8me industriel. L\u2019ensemble des mesures de s\xE9curit\xE9\
        \ doivent donc \xE9galement s\u2019appliquer \xE0 l\u2019ensemble du syst\xE8\
        me."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r129
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5.1
      ref_id: R129
      name: "S\xE9curiser les op\xE9rations de t\xE9l\xE9diagnostic et de t\xE9l\xE9\
        maintenance"
      description: "Il est recommand\xE9 d\u2019appliquer les r\xE8gles suivantes\
        \ lorsque des op\xE9rations de t\xE9l\xE9diagnostic, de t\xE9l\xE9maintenance\
        \ ou de t\xE9l\xE9gestion sont n\xE9cessaires\_:\n\n- \xE9tablir les connexions\
        \ \xE0 la demande pour une dur\xE9e d\xE9finie (par exemple 4h);\n- authentifier\
        \ l\u2019\xE9quipement de connexion distant;\n- disposer d\u2019un mot de\
        \ passe robuste (conform\xE9ment au chapitre 4.1.2);\n- activer la journalisation\
        \ des authentifications;\n- fermer la connexion apr\xE8s un d\xE9lai d\u2019\
        inactivit\xE9 fix\xE9 en respectant les contraintes op\xE9rationnelles;\n\
        - cloisonner l\u2019\xE9quipement acc\xE9d\xE9 et autoriser uniquement les\
        \ flux requis entre l\u2019\xE9quipement et le reste du syst\xE8me industriel;\n\
        - r\xE9aliser les op\xE9rations de t\xE9l\xE9maintenance \xE0 partir de protocoles\
        \ s\xE9curis\xE9s assurant notamment l\u2019int\xE9grit\xE9 et l\u2019authenticit\xE9\
        \ des \xE9changes (conform\xE9ment au guide d\u2019administration s\xE9curis\xE9\
        e [33])."
      annotation: '**Exigences IEC 62443**


        SR 3.1, CR 3.1, NET 3.2, SP07.02BR, SP07.03BR, SP07.04'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r130
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5.1
      ref_id: R130
      name: "Appliquer des r\xE8gles de s\xE9curisation pour la solution de t\xE9\
        l\xE9maintenance"
      description: "Il est recommand\xE9 de suivre les r\xE8gles suivantes pour la\
        \ solution de t\xE9l\xE9maintenance\_:\n\n- la solution doit assurer la confidentialit\xE9\
        , l\u2019int\xE9grit\xE9 et l\u2019authenticit\xE9 des communications (par\
        \ exemple avec un tunnel VPN IPsec) avec des protocoles configur\xE9s \xE0\
        \ l\u2019\xE9tat de l\u2019art;\n- mettre en \u0153uvre une authentification\
        \ multifacteur;\n- cloisonner les \xE9quipements de connexion du reste du\
        \ syst\xE8me industriel et autoriser uniquement les flux indispensables \xE0\
        \ la t\xE9l\xE9maintenance;\n- activer la journalisation des \xE9v\xE9nements\
        \ de s\xE9curit\xE9."
      annotation: '**Exigences IEC 62443**


        SR 1.1, SR 1.5, SR 3.1, CR 1.1, CR 1.5, CR 3.1, USER 1.9, NET 3.2, SP07.02BR,
        SP07.03BR, SP07.04, SP03.07RE1'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r131
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5.1
      ref_id: R131
      name: "D\xE9ployer une sonde de d\xE9tection au niveau de la passerelle de connexion"
      description: "Il est recommand\xE9 de d\xE9ployer une sonde de d\xE9tection\
        \ au niveau de la passerelle de connexion pour pouvoir analyser l\u2019ensemble\
        \ du trafic entrant et sortant (conform\xE9ment \xE0 la recommandation R211)."
      annotation: '**Exigences IEC 62443**


        SR 6.2, CR 6.2, EVENT 1.1, SP08.01BR, SP08.03BR'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r132
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5.1
      ref_id: R132
      name: "Mettre en \u0153uvre si besoin une solution de t\xE9l\xE9diagnostic"
      description: "Il est recommand\xE9 de mettre en \u0153uvre (si besoin) uniquement\
        \ des solutions de t\xE9l\xE9diagnostic. Dans ce cas, la solution doit int\xE9\
        grer les mesures suivantes (conform\xE9ment au chapitre 4.2.1)\_:\n\n- la\
        \ connexion distante est r\xE9alis\xE9e sur un serveur cloisonn\xE9;\n- les\
        \ donn\xE9es n\xE9cessaires au t\xE9l\xE9diagnostic sont transf\xE9r\xE9es\
        \ sur ce serveur au travers d\u2019une diode. Cette diode doit \xEAtre qualifi\xE9\
        e par l\u2019ANSSI."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r133
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.5.1
      ref_id: R133
      name: "Proscrire la t\xE9l\xE9maintenance"
      description: "La t\xE9l\xE9maintenance n\u2019est pas recommand\xE9e. Si des\
        \ op\xE9rations de t\xE9l\xE9maintenance sont imp\xE9rativement n\xE9cessaires,\
        \ les \xE9quipements distants et la liaison doivent \xEAtre int\xE9gr\xE9\
        s au p\xE9rim\xE8tre du syst\xE8me de classe 4. L\u2019ensemble des mesures\
        \ de classe 4 doivent leur \xEAtre appliqu\xE9es, et en particulier celles\
        \ de la section 4.2.6 et celles du guide d\u2019administration s\xE9curis\xE9\
        e [33]."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2
      ref_id: 4.2.6
      name: "Syst\xE8mes industriels distribu\xE9s"
      description: "Un syst\xE8me industriel distribu\xE9 d\xE9signe un ensemble d\u2019\
        actifs mat\xE9riels et logiciels interconnect\xE9s qui agissent comme une\
        \ entit\xE9 unifi\xE9e pour ex\xE9cuter des fonctions d\u2019automatisation\
        \ ou de contr\xF4le industriel tout en \xE9tant g\xE9ographiquement r\xE9\
        partis."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r134
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R134
      name: "Utiliser des protocoles s\xE9curis\xE9s pour les flux transitant par\
        \ des r\xE9seaux non prot\xE9g\xE9s physiquement"
      description: "Il est recommand\xE9 d\u2019utiliser des protocoles s\xE9curis\xE9\
        s sur l\u2019ensemble des flux transitant par des r\xE9seaux non prot\xE9\
        g\xE9s physiquement (accessibles dans un lieu public) ou non ma\xEEtris\xE9\
        s. Ils doivent \xEAtre au minimum prot\xE9g\xE9s en int\xE9grit\xE9 et authentifi\xE9\
        s."
      annotation: '**Exigences IEC 62443**


        SR 3.1, SR 4.1, CR 3.1, CR 4.1, DATA 1.2'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r135
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R135
      name: "D\xE9ployer des concentrateurs VPN aux extr\xE9mit\xE9s des liaisons"
      description: "Il est recommand\xE9 de d\xE9ployer des concentrateurs VPN aux\
        \ extr\xE9mit\xE9s des liaisons pour prot\xE9ger l\u2019int\xE9gralit\xE9\
        \ du trafic entre les deux extr\xE9mit\xE9s."
      annotation: '**Exigences IEC 62443**


        NET 3.2, SP07.02BR, SP07.03BR, SP07.04'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r136
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R136
      name: "Privil\xE9gier des liaisons ma\xEEtris\xE9es"
      description: "Pour la communication entre sites distants, il est recommand\xE9\
        \ de privil\xE9gier des liaisons ma\xEEtris\xE9es, par opposition \xE0 un\
        \ raccordement au travers d\u2019Internet ou d\u2019un r\xE9seau op\xE9rateur.\
        \ Cela a pour but de limiter l\u2019exposition des syst\xE8mes aux acteurs\
        \ malveillants."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r137
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R137
      name: "Disposer de concentrateurs VPN certifi\xE9es"
      description: "Il est recommand\xE9 de s\u2019assurer que les \xE9quipements\
        \ utilis\xE9s dans la recommandation R138 disposent d\u2019un certificat de\
        \ s\xE9curit\xE9 de premier niveau (CSPN) de l\u2019ANSSI ou \xE9quivalent\
        \ (par exemple Crit\xE8re Commun int\xE9grant AVA_VAN.3)."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r138
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R138
      name: "D\xE9ployer des concentrateurs VPN et un pare-feu aux extr\xE9mit\xE9\
        s des liaisons"
      description: "Il est recommand\xE9 de d\xE9ployer des concentrateurs VPN aux\
        \ extr\xE9mit\xE9s des liaisons pour prot\xE9ger l\u2019int\xE9gralit\xE9\
        \ du trafic. L\u2019\xE9quipement doit alors \xEAtre positionn\xE9 derri\xE8\
        re un pare-feu ne laissant passer que les flux strictement indispensables."
      annotation: '**Exigences IEC 62443**


        NET 3.2, SP07.02BR, SP07.03BR, SP07.04'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r139
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R139
      name: "D\xE9ployer des sondes de d\xE9tection au niveau des passerelles d\u2019\
        interconnexion"
      description: "Il est recommand\xE9 de d\xE9ployer des sondes de d\xE9tection\
        \ au niveau des passerelles d\u2019interconnexion pour pouvoir analyser l\u2019\
        ensemble du trafic circulant entre les sites (conform\xE9ment \xE0 la recommandation\
        \ R211)."
      annotation: '**Exigences IEC 62443**


        SR 6.2, CR 6.2, EVENT 1.1, SP08.01BR, SP08.03BR'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r140
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R140
      name: "Proscrire l\u2019utilisation de liaisons inter-sites sur des r\xE9seaux\
        \ publics"
      description: "L\u2019utilisation de r\xE9seau public pour r\xE9aliser des communications\
        \ inter-sites est proscrite."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r141
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.6
      ref_id: R141
      name: "Disposer de concentrateurs VPN qualifi\xE9s"
      description: "Il est recommand\xE9 de s\u2019assurer que les \xE9quipements\
        \ utilis\xE9s dans la recommandation R138 disposent d\u2019une qualification\
        \ de l\u2019ANSSI."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2
      ref_id: 4.2.7
      name: Communications sans-fil
      description: "Dans certains cas, l\u2019utilisation de r\xE9seaux sans-fil (par\
        \ exemple, Wi-Fi, 4G/5G et LoRaWAN) peut \xEAtre une solution de secours \xE0\
        \ l\u2019utilisation des r\xE9seaux publics ou priv\xE9s filaires.\n\nL\u2019\
        utilisation d\u2019un r\xE9seau sans fil implique la perte de protection physique\
        \ et facilite l\u2019intrusion d\u2019un tiers sur le r\xE9seau. La s\xE9\
        curit\xE9 repose ainsi sur la qualit\xE9 cryptographique du protocole sous-jacent.\
        \ D\u2019autre part, la disponibilit\xE9 du r\xE9seau-sans fil peut \xEAtre\
        \ d\xE9grad\xE9e par l\u2019emploi d\u2019\xE9quipements de brouillage radio."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.8\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 7 et n\xB0 20\n- **ISO 27002** : 8.1 et 8.22"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r142
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R142
      name: "Limiter l\u2019usage de technologies sans-fil au strict n\xE9cessaire"
      description: "Il est recommand\xE9 de limiter l\u2019usage de technologies sans-fil\
        \ au strict n\xE9cessaire."
      annotation: '**Exigences IEC 62443**


        SR 2.2 RE1, CR 2.2, NET 2.2, SP04.02'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r143
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R143
      name: "Consulterr\xE9guli\xE8rementles\xE9v\xE9nementsg\xE9n\xE9r\xE9sparles\xE9\
        quipements sans-fil"
      description: "Il est recommand\xE9 de consulter r\xE9guli\xE8rement les \xE9\
        v\xE9nements g\xE9n\xE9r\xE9s par les \xE9quipements sans-fil lorsque les\
        \ \xE9v\xE9nements de s\xE9curit\xE9 ne sont pas supervis\xE9s par un dispositif\
        \ centralis\xE9. Les \xE9v\xE9nements peuvent \xEAtre par exemple des connexions\
        \ d\u2019\xE9quipements, le brouillage radio (par exemple, des d\xE9connexions\
        \ d\u2019\xE9quipements et une variation de la qualit\xE9 du signal)."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r144
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R144
      name: "\xC9viter d\u2019utiliser des technologies sans-fil"
      description: "Il est recommand\xE9 de ne pas utiliser des technologies sans-fil,\
        \ et d\u2019en limiter l\u2019usage aux situations o\xF9 il n\u2019existe\
        \ pas d\u2019autre solution de communication."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r145
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R145
      name: "S\xE9lectionner une technologie permettant de s\xE9curiser les donn\xE9\
        es sur le r\xE9seau sans-fil"
      description: "Dans le cas d\u2019utilisation de r\xE9seau sans-fil, il est recommand\xE9\
        \ de s\xE9lectionner une technologie permettant la protection en int\xE9grit\xE9\
        \ et en authenticit\xE9 des donn\xE9es, conform\xE9ment aux recommandations\
        \ de l\u2019ANSSI [30]."
      annotation: "**Exigences IEC 62443**\n\nSR 3.1, SR 4.1, CR 3.1, CR 4.1, DATA\
        \ 1.2, SP03.08RE2, SP03.10\n\n**Information**\n\nDans le cas d\u2019utilisation\
        \ de r\xE9seaux sans-fil, les recommandations R146 \xE0 R149 doivent \xEA\
        tre appliqu\xE9es."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r146
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R146
      name: "Activer des fonctions de s\xE9curit\xE9 pour les points d\u2019acc\xE8\
        s sans-fil"
      description: "Il est recommand\xE9 de mettre en \u0153uvre les m\xE9canismes\
        \ suivants pour les points d\u2019acc\xE8s sans-fil\_:\n\n- l\u2019authentification\
        \ du point d\u2019acc\xE8s et du dispositif qui se connecte \xE0 l\u2019infrastructure;\n\
        - les fonctionnalit\xE9s de contr\xF4le d\u2019acc\xE8s au r\xE9seau (par\
        \ exemple EAP-TLS), conform\xE9ment au guide relatif au d\xE9ploiement du\
        \ protocole 802.1X pour le contr\xF4le d\u2019acc\xE8s \xE0 des r\xE9seaux\
        \ locaux [12];\n- la journalisation des connexions."
      annotation: '**Exigences IEC 62443**


        SR 1.13, SR 1.6, SR 2.2 RE1, CR 1.6, CR 2.2, NDR 1.6, NDR 1.13'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r147
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R147
      name: "Cloisonner les p\xE9riph\xE9riques sans-fil dans un r\xE9seau s\xE9par\xE9"
      description: "Il est recommand\xE9 de cloisonner au maximum les communications\
        \ sans fil en isolant les p\xE9riph\xE9riques sans fil dans un r\xE9seau physique\
        \ ou logique s\xE9par\xE9."
      annotation: '**Exigences IEC 62443**


        SR 1.6, SR 2.2 RE1, CR 1.13, CR 2.2, CR 5.1, NDR 1.13, NET 2.2, SP04.02BR'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r148
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R148
      name: "R\xE9duire autant que possible la puissance des \xE9missions"
      description: "Il est recommand\xE9 de r\xE9duire autant que possible la port\xE9\
        e des communications en diminuant la puissance d\u2019\xE9mission."
      annotation: "**Exigences IEC 62443**\n\nCR 2.2, CR 3.1\n\n**Attention**\n\n\
        M\xEAme avec une puissance r\xE9duite, il est possible de capter des \xE9\
        missions d\u2019un r\xE9seau sans-fil \xE0 grande distance en utilisant des\
        \ dispositifs adapt\xE9s."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r149
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R149
      name: "D\xE9ployer une sonde de d\xE9tection entre le r\xE9seau sans-fil et\
        \ les autres r\xE9seaux"
      description: "Il est recommand\xE9 de d\xE9ployer une sonde de d\xE9tection\
        \ d\u2019intrusion au niveau de l\u2019interconnexion entre le r\xE9seau sans-fil\
        \ et les autres r\xE9seaux du syst\xE8me industriel afin de d\xE9tecter un\
        \ acc\xE8s non autoris\xE9 depuis le r\xE9seau sans-fil."
      annotation: '**Exigences IEC 62443**


        SR 6.2, CR 6.2, EVENT 1.1, SP08.01BR, SP08.03BR'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r150
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R150
      name: "Proscrire l\u2019utilisation de technologie sans-fil pour les liaisons\
        \ ayant des besoins critiques de disponibilit\xE9"
      description: "Il est recommand\xE9 de proscrire l\u2019utilisation de technologie\
        \ sans-fil pour toutes les liaisons ayant des besoins critiques de disponibilit\xE9\
        ."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r151
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R151
      name: "Superviser les \xE9v\xE9nements de s\xE9curit\xE9 g\xE9n\xE9r\xE9s par\
        \ les \xE9quipements sans-fil"
      description: "Il est recommand\xE9 de centraliser et de superviser en temps\
        \ r\xE9el les \xE9v\xE9nements de s\xE9curit\xE9 g\xE9n\xE9r\xE9s par les\
        \ \xE9quipements sans-fil."
      annotation: '**Exigences IEC 62443**


        SR 2.8 RE1, CR 2.8, EVENT 1.6, SP08.02RE1'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r152
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.7
      ref_id: R152
      name: "S\xE9curiser les protocoles applicatifs transitant par un r\xE9seau sans-fil"
      description: "Si le protocole radio ne permet pas de garantir un niveau de s\xE9\
        curit\xE9 satisfaisant, il est recommand\xE9 d\u2019utiliser un protocole\
        \ applicatif s\xE9curis\xE9 suppl\xE9mentaire, conform\xE9ment \xE0 la section\
        \ 4.2.8."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.8
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2
      ref_id: 4.2.8
      name: "S\xE9curit\xE9 des protocoles"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.7\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 21\n- **ISO 27002** : 8.7"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r153
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.8
      ref_id: R153
      name: "D\xE9sactiver les protocoles non s\xE9curis\xE9s"
      description: "Il est recommand\xE9 de d\xE9sactiver les protocoles IT non s\xE9\
        curis\xE9s (http, telnet, ftp, SNMPv1 et v2, etc.) au profit de protocoles\
        \ plus s\xE9curis\xE9s (https, ssh, sftp, SNMPv3 etc.) pour assurer l\u2019\
        int\xE9grit\xE9, la confidentialit\xE9, l\u2019authenticit\xE9 et l\u2019\
        absence de rejeu des flux."
      annotation: "**Exigences IEC 62443**\n\nSR 7.7, CR 7.7, COMP 1.1, SP02.03, SP03.05\n\
        \n**Attention**\n\nCertains protocoles disposent de m\xE9canismes de v\xE9\
        rification d\u2019int\xE9grit\xE9 des donn\xE9es reposant sur des CRC (contr\xF4\
        le de redondance cyclique ou cyclic redundancy check). Cette mesure, efficace\
        \ en s\xFBret\xE9 de fonctionnement, ne constitue pas une protection face\
        \ \xE0 des attaques dans le domaine de la cybers\xE9curit\xE9."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r154
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.8
      ref_id: R154
      name: "Mettre en \u0153uvre des mesures compensatoires pour les protocoles ne\
        \ pouvant \xEAtre s\xE9curis\xE9s"
      description: "Pour les protocoles ne disposant pas de s\xE9curit\xE9 intrins\xE8\
        que (protocoles d\u2019administration propri\xE9taires, protocoles de s\xE9\
        curit\xE9 fonctionnelle ou protocoles d\u2019exploitation tels que Modbus,\
        \ S7comm, BACnet, EIP/CIP, etc.), il est recommand\xE9 de\_:\n\n- mettre en\
        \ \u0153uvre une s\xE9curisation au moyen d\u2019un tunnel VPN (se reporter\
        \ aux guides de l\u2019ANSSI [26], [21] et [32]) pour en assurer l\u2019int\xE9\
        grit\xE9 et l\u2019authenticit\xE9;\n- mettre en place des mesures de filtrage\
        \ applicatif. Ce filtrage doit permettre de limiter l\u2019usage de commandes\
        \ non souhait\xE9es support\xE9es par des protocoles non s\xE9curis\xE9s.\
        \ Seules les fonctions strictement utiles doivent \xEAtre accept\xE9es."
      annotation: "**Exigences IEC 62443**\n\nSR 5.2, CR 5.2, NET 1.1, NET 3.2, SP07.02BR,\
        \ SP07.03BR, SP07.04\n\n**Information**\n\nSi les flux transitent par des\
        \ r\xE9seaux non ma\xEEtris\xE9s, le chiffrement est n\xE9cessaire (se r\xE9\
        f\xE9rer \xE0 la recommandation R134). En revanche, sur un r\xE9seau ma\xEE\
        tris\xE9, le chiffrement n\u2019est pas toujours souhaitable car incompatible\
        \ avec l\u2019utilisation de syst\xE8me de d\xE9tection. L\u2019int\xE9grit\xE9\
        \ et l\u2019authenticit\xE9 des donn\xE9es sont suffisantes.\n\nL\u2019absence\
        \ de chiffrement ne doit pas \xEAtre incompatible avec la recommandation R95."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r155
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.8
      ref_id: R155
      name: "Privil\xE9gier l\u2019usage de protocoles s\xE9curis\xE9s et interop\xE9\
        rables"
      description: "Il est recommand\xE9 de privil\xE9gier l\u2019usage de technologies\
        \ standardis\xE9es, s\xE9curis\xE9es et interop\xE9rables (par exemple OPC\
        \ UA)."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4
      ref_id: '4.3'
      name: "S\xE9curisation des \xE9quipements"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3
      ref_id: 4.3.1
      name: Durcissement des configurations
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.7\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 42\n- **ISO 27002** : 8.7 et 8.19"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.1
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1
      ref_id: 4.3.1.1
      name: "R\xE9duction de la surface d\u2019attaque"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r156
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.1
      ref_id: R156
      name: "D\xE9sactiver certains composants sur les \xE9quipements"
      description: "Il est recommand\xE9 de d\xE9sactiver sur les \xE9quipements\_\
        :\n\n- les comptes par d\xE9faut;\n- les ports physiques inutilis\xE9s (ports\
        \ USB, r\xE9seau, etc.);\n- les acc\xE8s aux supports amovibles, s\u2019ils\
        \ ne sont pas utilis\xE9s;\n- les services non indispensables (serveur WEB\
        \ par exemple)."
      annotation: '**Exigences IEC 62443**


        SR 7.7, CR 7.7, COMP 1.1, SD-4, SP02.03, SP03.05'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r157
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.1
      ref_id: R157
      name: "Supprimer ou d\xE9sactiver les fonctions de d\xE9veloppement"
      description: "Il est recommand\xE9 de supprimer ou, au minimum, d\xE9sactiver\
        \ sur les postes de travail, ordinateurs portables et serveurs\_:\n\n- les\
        \ outils de d\xE9bogage et de d\xE9veloppement des syst\xE8mes en production;\n\
        - les donn\xE9es et fonctions de test, ainsi que les comptes associ\xE9s;\n\
        - l\u2019ensemble des programmes non indispensables."
      annotation: "**Exigences IEC 62443**\n\nSR 7.7, CR 7.7\n\n**Information**\n\n\
        Des lecteurs PDF et des logiciels de bureautique sont parfois install\xE9\
        s sur des stations de supervision SCADA afin de pouvoir consulter des documents\
        \ (proc\xE9dure ou manuel de maintenance par exemple). Il est pr\xE9f\xE9\
        rable de mettre \xE0 disposition des utilisateurs d\u2019autres postes que\
        \ les stations de supervision SCADA pour utiliser les applications de bureautique,\
        \ dont les lecteurs PDF (cf. R38)."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r158
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.1
      ref_id: R158
      name: "D\xE9sactiver les fonctions de d\xE9bogage"
      description: "Il est recommand\xE9 de d\xE9sactiver, sur les applications de\
        \ supervision SCADA, les fonctions de d\xE9bogage (des int\xE9grateurs et\
        \ des \xE9quipementiers) et de ne pas charger les mn\xE9moniques et commentaires\
        \ dans les \xE9quipements."
      annotation: '**Exigences IEC 62443**


        SR 7.7, CR 7.7, EDR 2.13, SD-4'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.2
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1
      ref_id: 4.3.1.2
      name: Renforcement des protections
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r159
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.2
      ref_id: R159
      name: "Durcir les syst\xE8mes d\u2019exploitation et les \xE9quipements r\xE9\
        seau"
      description: "Il est recommand\xE9 d\u2019appliquer des mesures de durcissement\
        \ des syst\xE8mes d\u2019exploitation et des \xE9quipements r\xE9seau suivantes\_\
        :\n\n- Pour les routeurs et les commutateurs, il est possible de s\u2019appuyer\
        \ sur les recommandations donn\xE9es dans les guides ANSSI [10], [13] et [14].\
        \ Il est important d\u2019appliquer ces recommandations, notamment la mise\
        \ en \u0153uvre de durcissement comme les r\xE8gles d\u2019administration\
        \ s\xE9curis\xE9es des commutateurs et pare-feux (par exemple, restriction\
        \ d\u2019adresses IP).\n- Le guide ANSSI [15] fournit des recommandations\
        \ concernant la configuration mat\xE9rielle et logicielle d\u2019un environnement\
        \ Linux afin d\u2019obtenir un syst\xE8me d\u2019exploitation s\xFBr.\n- Une\
        \ note technique concernant la mise en \u0153uvre de restrictions logicielles\
        \ sous Windows [11] ainsi que des Essentiels relatifs \xE0 la mise en \u0153\
        uvre s\xE9curis\xE9e de serveurs Windows [42] sont disponibles sur le site\
        \ de l\u2019ANSSI."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r160
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.2
      ref_id: R160
      name: "Limiter les privil\xE8ges d\u2019ex\xE9cution des applications"
      description: "Il est recommand\xE9 d\u2019ex\xE9cuter les applications avec\
        \ les privil\xE8ges strictement n\xE9cessaires \xE0 leur fonctionnement."
      annotation: '**Exigences IEC 62443**


        SR 1.1, SR 1.2, SR 2.1 RE1, USER 1.5, SP03.08BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r161
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.2
      ref_id: R161
      name: "Concevoir une liste des applications autoris\xE9es"
      description: "Il est recommand\xE9 de mettre en \u0153uvre une liste des applications\
        \ autoris\xE9es ayant le droit de s\u2019ex\xE9cuter sur les \xE9quipements."
      annotation: '**Exigences IEC 62443**


        SR 3.2, SR 5.2, COMP 2.2, SD-4, SG-3, SP10.03, SP10.04'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r162
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.2
      ref_id: R162
      name: "Activer les m\xE9canismes de s\xE9curit\xE9 de l\u2019automate"
      description: "En plus de la r\xE9duction de la surface d\u2019attaque (comme\
        \ pr\xE9sent\xE9e au travers des recommandations R156 et R153) et lorsque\
        \ les \xE9quipements le permettent, il est recommand\xE9 d\u2019utiliser les\
        \ m\xE9canismes suivants pour les automates\_:\n\n- la protection (par authentification)\
        \ d\u2019acc\xE8s \xE0 la CPU et aux blocs de programme;\n- la protection\
        \ (par authentification) de la mise \xE0 jour de l\u2019\xE9quipement;\n-\
        \ la restriction des adresses IP pouvant se connecter;\n- la fermeture des\
        \ ports r\xE9seau non utilis\xE9s;\n- la d\xE9sactivation du mode de programmation\
        \ \xE0 distance."
      annotation: '**Exigences IEC 62443**


        NDR 1.13'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r163
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.2
      ref_id: R163
      name: "Disposer d\u2019un automate certifi\xE9"
      description: "Il est recommand\xE9 de s\u2019assurer que les automates utilis\xE9\
        s disposent d\u2019une certification de s\xE9curit\xE9 de premier niveau (CSPN)\
        \ ou \xE9quivalent (par exemple Crit\xE8re Commun int\xE9grant AVA_VAN.3)."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r164
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.2
      ref_id: R164
      name: "Disposer d\u2019un automate qualifi\xE9"
      description: "Il est recommand\xE9 de s\u2019assurer que les automates utilis\xE9\
        s disposent d\u2019une qualification de s\xE9curit\xE9 d\xE9livr\xE9e par\
        \ l\u2019ANSSI."
      annotation: "**Attention**\n\nUn dispositif de protection antivirale peut ne\
        \ pas \xEAtre adapt\xE9 \xE0 certains syst\xE8mes industriels pour les raisons\
        \ suivantes\_:\n\n- les m\xE9canismes de mise \xE0 jour des signatures peuvent\
        \ apporter des vuln\xE9rabilit\xE9s et n\xE9cessiter des connexions vers des\
        \ syst\xE8mes d\u2019information externes qui n\u2019existaient pas jusqu\u2019\
        alors;\n- un dispositif de protection antivirale peut \xEAtre incompatible\
        \ avec les principes et exigences de s\xFBret\xE9 de fonctionnement.\n\nL\u2019\
        installation d\u2019un antivirus ou d\u2019un EDR doit \xEAtre r\xE9alis\xE9\
        e sur un poste ou un serveur d\xE9di\xE9, comme indiqu\xE9 dans les recommandations\
        \ R176 et R179, mais elle n\u2019est pas recommand\xE9e pour les autres composants\
        \ du syst\xE8me industriel. Le durcissement des configurations, comme indiqu\xE9\
        \ dans les recommandations R153, R156, R161 et R162, doit \xEAtre privil\xE9\
        gi\xE9."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.3
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1
      ref_id: 4.3.1.3
      name: "Int\xE9grit\xE9 et authenticit\xE9"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r165
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.3
      ref_id: R165
      name: "Int\xE9grer au processus de livraison logicielle un m\xE9canisme de v\xE9\
        rification de l\u2019int\xE9grit\xE9 et de l\u2019authenticit\xE9"
      description: "Il est recommand\xE9 d\u2019int\xE9grer au processus de livraison\
        \ de l\u2019ensemble des logiciels, programmes et \xE9l\xE9ments de configuration\
        \ (ainsi que de leurs mises \xE0 jour) un m\xE9canisme de v\xE9rification\
        \ de l\u2019int\xE9grit\xE9 et de l\u2019authenticit\xE9 (par exemple, une\
        \ signature). Les \xE9l\xE9ments concern\xE9s sont\_:\n\n- les micrologiciels\
        \ (firmware);\n- les syst\xE8mes d\u2019exploitation et logiciels standards;\n\
        - les logiciels et applications de supervision SCADA;\n- les logiciels de\
        \ programmation des diff\xE9rents constituants;\n- les programmes d\u2019\
        automates;\n- les fichiers de configuration des \xE9quipements r\xE9seau."
      annotation: '**Exigences IEC 62443**


        SR 3.4, CR 3.4, EDR 3.10, HDR 3.10, NDR 3.10, SM-6, SUM-1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r166
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.3
      ref_id: R166
      name: "V\xE9rifier r\xE9guli\xE8rement l\u2019int\xE9grit\xE9 des logiciels\
        \ et programmes"
      description: "Il est recommand\xE9 de v\xE9rifier r\xE9guli\xE8rement l\u2019\
        int\xE9grit\xE9 des micrologiciels (firmware), logiciels et programmes applicatifs\
        \ (par exemple\_: logiciel d\u2019ing\xE9nierie, programme automate, SCADA).\
        \ Cette t\xE2che doit \xEAtre automatis\xE9e et journalis\xE9e. Par exemple,\
        \ pour v\xE9rifier l\u2019int\xE9grit\xE9 d\u2019un automate, il est recommand\xE9\
        \ de\_:\n\n- int\xE9grer un compteur permettant de d\xE9finir la dur\xE9e\
        \ d\u2019un cycle du proc\xE9d\xE9 industriel et de v\xE9rifier s\u2019il\
        \ n\u2019y a pas une d\xE9viation du temps de r\xE9alisation;\n- ajouter un\
        \ bloc de programme permettant de surveiller le temps de cycle de l\u2019\
        automate;\n- v\xE9rifier l\u2019espace m\xE9moire utilis\xE9 par l\u2019automate."
      annotation: '**Exigences IEC 62443**


        SR 3.6, CR 3.6, SI-2'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r167
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.1.3
      ref_id: R167
      name: "V\xE9rifier le condensat et la signature du logiciel de l\u2019\xE9quipement"
      description: "Il est recommand\xE9 de v\xE9rifier l\u2019int\xE9grit\xE9 et\
        \ l\u2019authenticit\xE9 d\u2019un logiciel (voir la recommandation R166)\_\
        :\n\n- le condensat doit \xEAtre v\xE9rifi\xE9 par l\u2019entit\xE9 responsable\
        \ lors de la r\xE9ception du logiciel (comparaison du condensat r\xE9el avec\
        \ celui transmis par le fournisseur);\n- la signature du logiciel doit \xEA\
        tre v\xE9rifi\xE9e par l\u2019\xE9quipement avant son ex\xE9cution."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.2
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3
      ref_id: 4.3.2
      name: "Gestion des vuln\xE9rabilit\xE9s"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.1\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gle n\xB0 34\n- **ISO 27002** : 8.8"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r168
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.2
      ref_id: R168
      name: "Disposer d\u2019un processus de gestion des vuln\xE9rabilit\xE9s"
      description: "Il est recommand\xE9 de disposer d\u2019un processus de gestion\
        \ des vuln\xE9rabilit\xE9s afin de\_:\n\n- rechercher les correctifs de s\xE9\
        curit\xE9 disponibles correspondant aux mat\xE9riels et logiciels utilis\xE9\
        s;\n- identifier les vuln\xE9rabilit\xE9s connues et mesurer leurs impacts\
        \ sur les syst\xE8mes;\n- d\xE9ployer les correctifs en commen\xE7ant par\
        \ les plus critiques (selon l\u2019analyse de risque associ\xE9e);\n- recenser\
        \ les vuln\xE9rabilit\xE9s qui n\u2019ont pas pu \xEAtre corrig\xE9es (soit\
        \ par manque de correctifs, soit parce que le correctif n\u2019a pas pu \xEA\
        tre appliqu\xE9 en raison de contraintes op\xE9rationnelles) pour acceptation\
        \ du risque et traitement si un correctif est publi\xE9."
      annotation: "**Exigences IEC 62443**\n\nCOMP 3.3, EVENT 1.9, ORG 2.2, SVV-3,\
        \ SP02.02, SP03.03BR, SP11.06\n\n**Information**\n\nIl est important de s\u2019\
        assurer de la compatibilit\xE9 des correctifs avec le fonctionnement des applications\
        \ (en effectuant des essais sur une installation repr\xE9sentative de ce qui\
        \ est install\xE9 sur site par exemple). Le d\xE9ploiement des correctifs\
        \ doit \xEAtre int\xE9gr\xE9 dans les plans de maintenance des syst\xE8mes.\
        \ Les correctifs peuvent \xEAtre appliqu\xE9s lors de maintenances programm\xE9\
        es ou lorsque le syst\xE8me est \xE0 l\u2019arr\xEAt. Les correctifs concernent\
        \ \xE9galement les automates et les \xE9quipements de terrain comme les capteurs\
        \ et actionneurs intelligents."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r169
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.2
      ref_id: R169
      name: "Appliquer les correctifs de s\xE9curit\xE9 en priorit\xE9 sur les \xE9\
        quipements les plus expos\xE9s"
      description: "Il est recommand\xE9 d\u2019appliquer les correctifs de s\xE9\
        curit\xE9 en priorit\xE9 sur les \xE9quipements les plus expos\xE9s \xE0 des\
        \ menaces (par exemple, un attaquant depuis le r\xE9seau de gestion, un utilisateur\
        \ malveillant acc\xE9dant \xE0 un poste de travail)."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r170
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.2
      ref_id: R170
      name: "Identifier les vuln\xE9rabilit\xE9s non corrig\xE9es"
      description: "Il est recommand\xE9 d\u2019identifier de fa\xE7on exhaustive\
        \ les vuln\xE9rabilit\xE9s non corrig\xE9es (soit par manque de correctifs,\
        \ soit parce que le correctif n\u2019a pas pu \xEAtre appliqu\xE9 en raison\
        \ de contraintes op\xE9rationnelles). Dans le cas de vuln\xE9rabilit\xE9 ne\
        \ disposant d\u2019aucun correctif applicable, cet \xE9l\xE9ment doit appara\xEE\
        tre dans l\u2019analyse de risque afin de mettre en \u0153uvre des mesures\
        \ compensatoires ad\xE9quates ou de l\u2019accepter au regard des risques\
        \ r\xE9siduels."
      annotation: '**Exigences IEC 62443**


        COMP 3.5, ORG 2.2, DM-4, SP11.02RE2'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r171
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.2
      ref_id: R171
      name: "Faire valider les correctifs de s\xE9curit\xE9"
      description: "Il est recommand\xE9 de faire valider les correctifs de s\xE9\
        curit\xE9 par les fournisseurs d\u2019application industrielle avant leur\
        \ d\xE9ploiement afin d\u2019\xE9viter les r\xE9gressions fonctionnelles."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r172
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.2
      ref_id: R172
      name: "V\xE9rifier l\u2019application effective des correctifs de s\xE9curit\xE9"
      description: "Il est recommand\xE9 de v\xE9rifier l\u2019application effective\
        \ des correctifs de s\xE9curit\xE9 (s\u2019assurer par exemple de la prise\
        \ en compte de la version dans les logiciels ou \xE9quipements comme les automates).\
        \ Cette v\xE9rification peut constituer un indicateur de suivi de la cybers\xE9\
        curit\xE9 du syst\xE8me industriel."
      annotation: '**Exigences IEC 62443**


        COMP 3.3, SP11.01RE1, SP11.06RE3'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r173
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.2
      ref_id: R173
      name: "Mettre en \u0153uvre un environnement de test repr\xE9sentatif"
      description: "Il est recommand\xE9 de mettre en \u0153uvre un environnement\
        \ de test repr\xE9sentatif des syst\xE8mes en production afin de s\u2019assurer\
        \ de l\u2019absence de r\xE9gression de ceux-ci apr\xE8s l\u2019application\
        \ des correctifs ou de mises \xE0 jour avant leur d\xE9ploiement g\xE9n\xE9\
        ralis\xE9."
      annotation: "**Exigences IEC 62443**\n\nSUM-1\n\n**Information**\n\nL\u2019\
        application de correctif de s\xE9curit\xE9, comme tout autre modification\
        \ de l\u2019installation, peut n\xE9cessiter une nouvelle qualification de\
        \ l\u2019installation industrielle d\u2019un point de vue s\xFBret\xE9 de\
        \ fonctionnement."
      implementation_groups:
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3
      ref_id: 4.3.3
      name: Interfaces de connexion
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.4\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 15 et n\xB0 26\n- **ISO 27002** : 7.10 et 8.20"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3
      ref_id: 4.3.3.1
      name: "Gestion des m\xE9dias amovibles"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r174
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      ref_id: R174
      name: "Limiter l\u2019usage des m\xE9dias amovibles"
      description: "Il est recommand\xE9 de d\xE9finir une politique d\u2019utilisation\
        \ des m\xE9dias amovibles et d\u2019en limiter l\u2019usage au strict minimum."
      annotation: '**Exigences IEC 62443**


        SR 2.1, COMP 1.2, SP10.05RE1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r175
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      ref_id: R175
      name: "Mettre \xE0 disposition des intervenants des m\xE9dias amovibles d\xE9\
        di\xE9s"
      description: "Il est recommand\xE9 de mettre \xE0 disposition des intervenants\
        \ des m\xE9dias amovibles d\xE9di\xE9s aux syst\xE8mes industriels et dont\
        \ l\u2019utilisation pour tout autre usage est proscrite. R\xE9ciproquement,\
        \ l\u2019utilisation de tout autre m\xE9dia amovible non identifi\xE9 comme\
        \ sp\xE9cifique aux syst\xE8mes industriels est fortement d\xE9conseill\xE9\
        e."
      annotation: '**Exigences IEC 62443**


        ZCR 3.4, COMP 1.2, SP10.05RE1'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r176
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      ref_id: R176
      name: "Utiliser une station de d\xE9contamination"
      description: "Il est recommand\xE9 d\u2019utiliser une station de d\xE9contamination\
        \ afin de rechercher les codes malveillants, et d\xE9contaminer le cas \xE9\
        ch\xE9ant, tous les p\xE9riph\xE9riques amovibles avant de les connecter sur\
        \ les \xE9quipements du syst\xE8me industriel."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r177
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      ref_id: R177
      name: "Interdire la connexion des p\xE9riph\xE9riques amovibles non v\xE9rifi\xE9\
        s"
      description: "Il est recommand\xE9 d\u2019interdire aux intervenants la connexion\
        \ des p\xE9riph\xE9riques amovibles non v\xE9rifi\xE9s par la station de d\xE9\
        contamination."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r178
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      ref_id: R178
      name: "D\xE9sactiver les ports de m\xE9dias amovibles"
      description: "Il est recommand\xE9 de d\xE9sactiver les ports de m\xE9dias amovibles\
        \ lorsque leur utilisation n\u2019est pas n\xE9cessaire. Si le blocage physique\
        \ n\u2019est pas possible, il est recommand\xE9 de d\xE9sactiver logiquement\
        \ le port.\n\nPar exemple, les mesures suivantes sont envisageables\_:\n\n\
        - le blocage des ports USB \xE0 l\u2019aide de m\xE9canismes de s\xE9curit\xE9\
        \ physiques ou logiques, comme les verrous USB physiques (avec cl\xE9s), via\
        \ un logiciel de s\xE9curit\xE9 capable de bloquer l\u2019utilisation de cl\xE9\
        s USB et autres p\xE9riph\xE9riques, ou \xE0 travers la configuration UEFI\
        \ au d\xE9marrage du poste;\n- le retrait ou la d\xE9connexion physique des\
        \ lecteurs de m\xE9dias amovibles."
      annotation: '**Exigences IEC 62443**


        SR 7.7, CR 7.7, COMP 1.1, SD-4, SP02.03, SP03.05'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r179
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      ref_id: R179
      name: "Utiliser un sas ou une station blanche pour \xE9changer des donn\xE9\
        es avec un m\xE9dia amovible"
      description: "Il est recommand\xE9 d\u2019utiliser un sas ou une station blanche\
        \ pour \xE9changer des donn\xE9es entre un m\xE9dia amovible et certains composants\
        \ du syst\xE8me industriel. Ce sas ou cette station blanche doit respecter\
        \ les exigences d\xE9crites dans le profil de fonctionnalit\xE9s et de s\xE9\
        curit\xE9 de l\u2019ANSSI [49]. Cet \xE9change de donn\xE9es est une action\
        \ ponctuelle qui doit \xEAtre encadr\xE9e par une proc\xE9dure."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r180
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.1
      ref_id: R180
      name: "Disposer d\u2019un Visa de s\xE9curit\xE9 pour le sas ou la station blanche"
      description: "Il est recommand\xE9 de s\u2019assurer que les \xE9quipements\
        \ de type sas ou station blanche disposent d\u2019un Visa de s\xE9curit\xE9\
        \ de l\u2019ANSSI (certification ou qualification)."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.2
      assessable: false
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3
      ref_id: 4.3.3.2
      name: "Gestion des points d\u2019acc\xE8s r\xE9seau"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r181
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.2
      ref_id: R181
      name: "Identifier et recenser les points d\u2019acc\xE8s r\xE9seau"
      description: "Il est recommand\xE9 d\u2019identifier et de recenser les points\
        \ d\u2019acc\xE8s r\xE9seau conform\xE9ment \xE0 la recommandation R6."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r182
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.2
      ref_id: R182
      name: "D\xE9sactiver les ports des points d\u2019acc\xE8s r\xE9seau non utilis\xE9\
        s"
      description: "Il est recommand\xE9 de d\xE9sactiver les ports des points d\u2019\
        acc\xE8s r\xE9seau non utilis\xE9s (par exemple, commutateurs, routeurs, automates,\
        \ prises de maintenance sur les bus de terrain) conform\xE9ment aux guides\
        \ ANSSI [10], [13] et [14]."
      annotation: '**Exigences IEC 62443**


        COMP 1.1, SP02.03, SP03.05, SP03.10RE4'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r183
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.2
      ref_id: R183
      name: "Int\xE9grer les alertes de connexion/d\xE9connexion au r\xE9seau"
      description: "Il est recommand\xE9 de remonter et de traiter les alertes en\
        \ cas de tentatives de connexion et de d\xE9connexion sur des ports r\xE9\
        seau."
      annotation: '**Exigences IEC 62443**


        SR 6.2, CR 6.2, EVENT 1.3, SP08.01RE1, SP08.02RE1, SP08.03RE1'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r184
      assessable: true
      depth: 5
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.3.2
      ref_id: R184
      name: "Rendre accessibles les points d\u2019acc\xE8s r\xE9seau uniquement dans\
        \ des locaux ma\xEEtris\xE9s"
      description: "Il est recommand\xE9 de rendre accessibles les points d\u2019\
        acc\xE8s r\xE9seau uniquement dans des locaux ma\xEEtris\xE9s (sous contr\xF4\
        le d\u2019acc\xE8s)."
      annotation: '**Exigences IEC 62443**


        ZCR 1.1, ORG 3.1'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.4
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3
      ref_id: 4.3.4
      name: "\xC9quipements mobiles"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.11\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 31\n- **ISO 27002** : 7.9"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r185
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.4
      ref_id: R185
      name: Durcir le poste nomade
      description: "Conform\xE9ment au guide sur le nomadisme num\xE9rique [36], il\
        \ est recommand\xE9 de mettre en \u0153uvre, pour les postes nomades, les\
        \ \xE9l\xE9ments de durcissement suivants\_:\n\n- les mesures de la recommandation\
        \ R159;\n- l\u2019utilisation d\u2019une solution de chiffrement de disque;\n\
        - la mise en place d\u2019une politique des supports amovibles, en refusant\
        \ par exemple l\u2019ex\xE9cution de code directement depuis le support;\n\
        - l\u2019emploi d\u2019un filtre de confidentialit\xE9."
      annotation: "**Exigences IEC 62443**\n\nSR 3.1, SR 4.1, CR 3.1, CR 4.1, EDR\
        \ 3.14, HDR 3.14, NDR 3.14, DATA 1.1, DATA 1.2, SP03.08RE2, SP03.10\n\n**Information**\n\
        \nConform\xE9ment au guide sur le nomadisme num\xE9rique [36], il est recommand\xE9\
        \ de chiffrer le disque dur du poste nomade avec des m\xE9canismes cryptographiques\
        \ robustes, et donc conforme au r\xE9f\xE9rentiel g\xE9n\xE9ral de s\xE9curit\xE9\
        \ (RGS) annexes B1 [46] et B2 [45]."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r186
