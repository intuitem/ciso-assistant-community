      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.2.2
      ref_id: R105
      name: "R\xE9server les postes d\u2019administration \xE0 ce seul usage"
      description: "Il est recommand\xE9 de r\xE9server les postes d\u2019administration\
        \ \xE0 ce seul usage. Ils ne doivent pas \xEAtre connect\xE9s \xE0 Internet,\
        \ ni \xE0 un autre r\xE9seau informatique que celui utilis\xE9 pour l\u2019\
        administration (conform\xE9ment au guide d\u2019administration s\xE9curis\xE9\
        e [33])."
      annotation: '**Exigences IEC 62443**


        ZCR 3.6'
      implementation_groups:
