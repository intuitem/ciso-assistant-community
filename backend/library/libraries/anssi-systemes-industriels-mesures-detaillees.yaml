      ref_id: 3.2.2
      name: Sensibilisation et formation
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.13\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 1 et n\xB0 2\n- **ISO 27002** : 6.3"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r18
      assessable: true
