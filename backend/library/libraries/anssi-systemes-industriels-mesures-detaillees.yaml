      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.4
      ref_id: R188
      name: "Identifier et valider les \xE9quipements autoris\xE9s \xE0 se connecter\
        \ aux installations"
      description: "Il est recommand\xE9 d\u2019identifier et de valider (au travers\
        \ par exemple d\u2019une proc\xE9dure de tests) les \xE9quipements autoris\xE9\
        s \xE0 se connecter aux installations."
      annotation: '**Exigences IEC 62443**


        CR 1.2, NET 1.7'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r189
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.4
      ref_id: R189
      name: "D\xE9dier les \xE9quipements mobiles au syst\xE8me industriel"
      description: "Les \xE9quipements mobiles connect\xE9s au syst\xE8me industriel\
        \ doivent \xEAtre d\xE9di\xE9s \xE0 cet usage (et ne pas \xEAtre d\xE9plac\xE9\
        s hors du site), y compris ceux utilis\xE9s par des prestataires ext\xE9rieurs."
      annotation: '**Exigences IEC 62443**


        ZCR 3.2, COMP 1.2, SP10.05RE1'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.5
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3
      ref_id: 4.3.5
      name: "S\xE9curit\xE9 des stations d\u2019ing\xE9nierie et des postes d\u2019\
        administration"
      description: "Les stations d\u2019ing\xE9nierie regroupent au moins deux fonctionnalit\xE9\
        s\_:\n\n- la programmation du proc\xE9d\xE9 industriel;\n- la maintenance\
        \ des \xE9quipements industriels (par exemple, automates, SCADA, RTU).\n\n\
        Lorsque la station d\u2019ing\xE9nierie est utilis\xE9e en tant que console\
        \ de programmation, il s\u2019agit g\xE9n\xE9ralement de postes de travail\
        \ fixes. Les stations d\u2019ing\xE9nierie utilis\xE9es en tant que poste\
        \ de maintenance sont g\xE9n\xE9ralement des \xE9quipements mobiles. Dans\
        \ les deux cas, il s\u2019agit de postes d\xE9di\xE9s \xE0 l\u2019ing\xE9\
        nierie des processus du syst\xE8me industriel.\n\nPour les mesures techniques\
        \ sur le cloisonnement des fonctions d\u2019administration, on pourra se reporter\
        \ \xE0 la section 4.2.2."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.20\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 27, n\xB0 28 et n\xB0 29\n- **ISO 27002** : 7.9"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r190
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.5
      ref_id: R190
      name: "Respecter les r\xE8gles relatives \xE0 la fonction de console de programmation"
      description: "Il est recommand\xE9 de respecter les r\xE8gles suivantes relatives\
        \ \xE0 la fonction de console de programmation\_:\n\n- d\xE9dier le poste\
        \ aux activit\xE9s de d\xE9veloppement;\n- ne pas connecter le poste \xE0\
        \ Internet (les mises \xE0 jour doivent \xEAtre effectu\xE9es hors ligne);\n\
        - ne pas connecter le poste \xE0 d\u2019autres syst\xE8mes que le syst\xE8\
        me industriel;\n- installer le poste dans des locaux ma\xEEtris\xE9s (sous\
        \ contr\xF4le d\u2019acc\xE8s);\n- appliquer les r\xE8gles de durcissement\
        \ de configuration et de renforcement des protections (voir la section 4.3.1);\n\
        - \xE9teindre le poste lorsqu\u2019il n\u2019est pas utilis\xE9;\n- identifier\
        \ toutes les consoles de programmation pouvant \xEAtre raccord\xE9es au r\xE9\
        seau industriel et appliquer sur le r\xE9seau les r\xE8gles de filtrage associ\xE9\
        es (voir la recommandation R102);\n- identifier physiquement le poste (marquage\
        \ visuel par exemple)."
      annotation: '**Exigences IEC 62443**


        ZCR 3.2'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r191
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.5
      ref_id: R191
      name: "Respecter les exigences relatives \xE0 la fonction de poste de maintenance"
      description: "Il est recommand\xE9 de respecter les r\xE8gles relatives \xE0\
        \ la fonction de poste de maintenance suivantes\_:\n\n- d\xE9dier le poste\
        \ aux activit\xE9s de maintenance;\n- ne pas connecter le poste \xE0 Internet\
        \ (les mises \xE0 jour doivent \xEAtre effectu\xE9es hors ligne);\n- appliquer\
        \ les r\xE8gles pour les \xE9quipements mobiles du guide (voir la section\
        \ 4.3.4);\n- stocker le poste dans un local s\xE9curis\xE9;\n- ne pas utiliser\
        \ le poste d\u2019un prestataire et lui fournir un poste d\xE9di\xE9;\n- appliquer\
        \ les r\xE8gles de durcissement de configuration et de renforcement des protections\
        \ (voir la section 4.3.1);\n- identifier tous les postes de maintenance pouvant\
        \ \xEAtre raccord\xE9s au r\xE9seau industriel et appliquer sur le r\xE9seau\
        \ les r\xE8gles de filtrage associ\xE9es (voir la recommandation R102);\n\
        - identifier physiquement le poste (marquage visuel par exemple)."
      annotation: '**Exigences IEC 62443**


        ZCR 3.2'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r192
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.5
      ref_id: R192
      name: "Ne pas installer d\u2019outils de d\xE9veloppement sur les postes et\
        \ serveurs de production"
      description: "Il est recommand\xE9 de ne pas installer ou de supprimer les outils\
        \ de d\xE9veloppement sur les postes et serveurs de production. Seuls les\
        \ environnements d\u2019ex\xE9cution (run-time) doivent \xEAtre install\xE9\
        s sur les serveurs et stations SCADA par exemple."
      annotation: "**Exigences IEC 62443**\n\nSR 7.7, SP03.05\n\n**Information**\n\
        \nLa recommandation R192 peut \xEAtre difficile \xE0 appliquer dans le cas\
        \ de l\u2019utilisation de SNCC. Il conviendra alors d\u2019\xE9tudier des\
        \ solutions compensatoires pour isoler le syst\xE8me et r\xE9duire sa surface\
        \ d\u2019attaque."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r193
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.5
      ref_id: R193
      name: "Respecter les exigences relatives au poste d\u2019administration"
      description: "Les stations d\u2019ing\xE9nierie \xE9tant consid\xE9r\xE9es comme\
        \ des postes d\u2019administration, il est recommand\xE9 d\u2019appliquer\
        \ les recommandations aff\xE9rentes issues du guide relatif \xE0 l\u2019administration\
        \ s\xE9curis\xE9e des SI [33]."
      annotation: '**Exigences IEC 62443**


        SR 7.7, CR 7.7, COMP 1.1, USER 2.2, SP02.03, SP03.05, SP03.08BR, SP09.01'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      assessable: false
      depth: 3
