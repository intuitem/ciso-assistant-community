      ref_id: R187
      name: "Concevoir une charte d\u2019utilisation des postes nomades"
      description: "Il est recommand\xE9 de mettre en \u0153uvre une charte d\u2019\
        utilisation des postes nomades."
      annotation: '**Exigences IEC 62443**


        COMP 1.2, SP10.05RE1'
      implementation_groups:
      - C1
      - C2
      - C3
