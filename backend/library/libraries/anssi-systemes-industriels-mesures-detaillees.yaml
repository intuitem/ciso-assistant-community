      ref_id: 3.5.3
      name: Gestion de crise
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.15\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 40\n- **ISO 27002** : 5.29 et 5.30"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r79
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.5.3
      ref_id: R79
      name: "Mettre en place une proc\xE9dure de gestion de crise"
      description: "Il est recommand\xE9 de mettre en place une proc\xE9dure de gestion\
        \ de crise conform\xE9ment aux publications de l\u2019ANSSI [31]."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r80
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.5.3
      ref_id: R80
      name: "Inclure une proc\xE9dure d\u2019escalade"
      description: "Il est recommand\xE9 d\u2019inclure une proc\xE9dure d\u2019escalade\
        \ dans le processus de gestion de crise pour g\xE9rer les incidents au bon\
        \ niveau de responsabilit\xE9 et d\xE9cider en cons\xE9quence (conform\xE9\
        ment au guide [31])\_:\n\n- s\u2019il faut d\xE9clencher un plan de reprise\
        \ d\u2019activit\xE9;\n- si une action judiciaire est n\xE9cessaire."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r81
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.5.3
      ref_id: R81
      name: "D\xE9finir une phase d\u2019analyse post incident"
      description: "Il est recommand\xE9 de d\xE9finir une phase d\u2019analyse post\
        \ incident dans le but de d\xE9terminer l\u2019origine de l\u2019incident\
        \ et d\u2019am\xE9liorer la cybers\xE9curit\xE9 du syst\xE8me industriel (conform\xE9\
        ment au guide [31])."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r82
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.5.3
      ref_id: R82
      name: "R\xE9aliser des exercices de gestion de crise"
      description: "Il est recommand\xE9 de r\xE9aliser des exercices de gestion de\
        \ crise, et au moins une fois par an (se reporter au guide [25] pour plus\
        \ de d\xE9tail)."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4
      assessable: false
      depth: 1
      ref_id: '4'
      name: "Mesures techniques de s\xE9curit\xE9"
      description: "Ce chapitre regroupe l\u2019ensemble des mesures techniques s\u2019\
        adressant \xE0 l\u2019ensemble des acteurs impliqu\xE9s dans les syst\xE8\
        mes industriels (par exemple\_: chefs de projet, acheteurs, automaticiens,\
        \ int\xE9grateurs, d\xE9veloppeurs, \xE9quipementiers, mainteneurs, RSSI).\n\
        \n**Information**\n\nIl revient \xE0 l\u2019entit\xE9 responsable de d\xE9\
        finir quelle personne sera en charge de l\u2019application des mesures sur\
        \ les syst\xE8mes.\n\nLes mesures font r\xE9f\xE9rence aux chapitres de l\u2019\
        ISO 27002 [55] ainsi qu\u2019aux recommandations du guide d\u2019hygi\xE8\
        ne informatique [17] publi\xE9 par l\u2019ANSSI.\n\nCes r\xE9f\xE9rences sont\
        \ indiqu\xE9es dans un encadr\xE9 comme celui pr\xE9sent\xE9 ci-dessous\_\
        :\n\n**Attention**\n\nLes mesures sont cumulatives. Ainsi, un syst\xE8me de\
        \ classe 2 doit appliquer les mesures de classe 1 et de classe 2 et un syst\xE8\
        me de classe 4 doit appliquer les mesures de classe 1, de classe 2, de classe\
        \ 3 et de classe 4.\n\nLe p\xE9rim\xE8tre d\u2019application est pr\xE9cis\xE9\
        \ pour chaque famille de mesures, voire chaque mesure. Sans pr\xE9cision compl\xE9\
        mentaire, il est le m\xEAme pour toutes les mesures d\u2019une famille.\n\n\
        Les \xE9quipements sur lesquels peuvent porter les mesures sont\_:\n\n- les\
        \ serveurs, stations et postes de travail;\n- les stations d\u2019ing\xE9\
        nierie (console de programmation et poste de maintenance);\n- les \xE9quipements\
        \ mobiles (ordinateurs portables, tablettes, smartphones);\n- les logiciels\
        \ et applications de supervision (SCADA);\n- les logiciels et applications\
        \ MES, EMS, WMS, etc., si existants;\n- les interfaces homme-machine tactiles;\n\
        - les automates et unit\xE9s d\xE9port\xE9es (RTU - Remote Terminal Unit);\n\
        - les modules d\u2019entr\xE9es/sorties d\xE9port\xE9s des automates;\n- les\
        \ \xE9quipements r\xE9seau (commutateurs, routeurs, pare-feux, bornes d\u2019\
        acc\xE8s sans fil);\n- les capteurs et actionneurs intelligents;\n- les passerelles\
        \ protocolaires.\n\nCette liste est un exemple et doit \xEAtre adapt\xE9e\
        \ \xE0 l\u2019environnement de chaque syst\xE8me."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : fait r\xE9f\xE9rence aux TTP\
        \ indiqu\xE9s dans la section 2.2.\n- **Guide d\u2019hygi\xE8ne** : fait r\xE9\
        f\xE9rence au guide d\u2019hygi\xE8ne [17].\n- **ISO 27002** : fait r\xE9\
        f\xE9rence aux chapitres de l\u2019ISO 27002 [55] abordant le sujet."
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4
      ref_id: '4.1'
      name: "Authentification et contr\xF4le d\u2019acc\xE8s logique"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1
      ref_id: 4.1.1
      name: Gestion des comptes
      description: "Les comptes peuvent \xEAtre de diff\xE9rents types\_:\n\n- les\
        \ comptes \xAB\_de session\_\xBB permettant l\u2019acc\xE8s aux stations,\
        \ postes de travail (bureautique, d\u2019exploitation, de maintenance, etc.)\
        \ et serveurs;\n- les comptes \xABapplicatifs\xBB permettant \xE0 un intervenant\
        \ de se connecter \xE0 une application SCADA par exemple; ces comptes peuvent\
        \ \xEAtre g\xE9r\xE9s par l\u2019application elle-m\xEAme;\n- les comptes\
        \ \xAB\_syst\xE8mes\_\xBB sont utilis\xE9s pour qu\u2019une application puisse\
        \ s\u2019ex\xE9cuter et communiquer avec d\u2019autres applications (ex.\_\
        : compte de service); ces comptes ne sont normalement pas utilis\xE9s par\
        \ un op\xE9rateur.\n\nLes comptes peuvent disposer de diff\xE9rents niveaux\
        \ de privil\xE8ges. En particulier, les comptes avec un niveau de privil\xE8\
        ges \xE9lev\xE9 se d\xE9coupent en deux cat\xE9gories\_:\n\n- les comptes\
        \ \xE0 privil\xE8ges \xE9lev\xE9s \xAB\_administrateur syst\xE8me\_\xBB permettant\
        \ l\u2019administration informatique des \xE9quipements (serveurs, stations\
        \ et \xE9quipements r\xE9seau par exemple) et des syst\xE8mes d\u2019exploitation;\n\
        - les comptes \xE0 privil\xE8ges \xE9lev\xE9s \xAB\_ing\xE9nieur de proc\xE9\
        d\xE9\_\xBB permettant d\u2019acc\xE9der \xE0 des fonctions de configuration\
        \ ou de programmation des applications SCADA et automates par exemple.\n\n\
        **Information**\n\nLes comptes avec un niveau de privil\xE8ges \xE9lev\xE9\
        \ cit\xE9s pr\xE9c\xE9demment doivent appartenir \xE0 des groupes d\u2019\
        utilisateurs distincts."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.3\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 5, n\xB0 6, n\xB0 8 et n\xB0 12\n- **ISO 27002** :\
        \ 5.15"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r83
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R83
      name: "Identifier chaque utilisateur \xE0 privil\xE8ges de mani\xE8re individuelle"
      description: "Il est recommand\xE9 d\u2019identifier chaque utilisateur \xE0\
        \ privil\xE8ges de mani\xE8re nominative."
      annotation: '**Exigences IEC 62443**


        SR 1.1 RE1, SR 1.3, SR 1.4, CR 1.1, CR 1.3, CR 1.4, NDR 1.6, USER 1.8, USER
        2.2'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r83-plus
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R83+
      name: "Identifier chaque utilisateur de mani\xE8re individuelle"
      description: "Il est recommand\xE9 d\u2019identifier chaque utilisateur de mani\xE8\
        re nominative, y compris les utilisateurs non privil\xE9gi\xE9s."
      annotation: "**Exigences IEC 62443**\n\nSR 1.1 RE1, SR 1.3, SR 1.4, CR 1.1,\
        \ CR 1.3, CR 1.4, NDR 1.6, USER 1.8\n\n**Information**\n\nDes cas particuliers\
        \ peuvent imposer la cr\xE9ation de comptes partag\xE9s, emp\xEAchant ainsi\
        \ la stricte imputabilit\xE9 de chaque op\xE9ration effectu\xE9e. Il peut\
        \ s\u2019agir d\u2019\xE9quipements qui n\u2019int\xE8grent pas de m\xE9canisme\
        \ de gestion de comptes ou de syst\xE8mes qui doivent maintenir dans la dur\xE9\
        e une m\xEAme session active. Dans ce cas, les utilisateurs ne peuvent pas\
        \ recourir \xE0 des sessions diff\xE9rentes, ouvertes avec leurs comptes individuels\
        \ respectifs. C\u2019est le cas, par exemple, des postes de conduite d\u2019\
        une installation industrielle. L\u2019entit\xE9 responsable doit ainsi mettre\
        \ en place des mesures permettant d\u2019atteindre un niveau d\u2019imputabilit\xE9\
        \ \xE9quivalent \xE0 celui assur\xE9 par l\u2019utilisation d\u2019un compte\
        \ individuel (par exemple\_: un cahier d\u2019enregistrement, un syst\xE8\
        me de contr\xF4le d\u2019acc\xE8s et de vid\xE9oprotection des locaux)."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r83-moins
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R83-
      name: "Appliquer des mesures palliatives d\u2019imputabilit\xE9"
      description: "Lorsque l\u2019utilisation de comptes individuels n\u2019est pas\
        \ possible, il est recommand\xE9 de mettre en \u0153uvre des mesures permettant\
        \ d\u2019atteindre un niveau d\u2019imputabilit\xE9 \xE9quivalent (par exemple\
        \ dans un cahier \xE0 l\u2019entr\xE9e de la salle)."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r84
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R84
      name: "\xC9viter d\u2019utiliser des comptes g\xE9n\xE9riques"
      description: "Il est recommand\xE9 de ne pas utiliser de comptes g\xE9n\xE9\
        riques, en particulier ceux disposant de privil\xE8ges. Lorsqu\u2019ils sont\
        \ indispensables, leur utilisation doit \xEAtre limit\xE9e \xE0 des usages\
        \ tr\xE8s pr\xE9cis, \xEAtre document\xE9e et un propri\xE9taire du compte\
        \ g\xE9n\xE9rique doit \xEAtre d\xE9sign\xE9."
      annotation: "**Exigences IEC 62443**\n\nSR 1.1 RE1, SR 1.3, SR 1.4, CR 1.1,\
        \ CR 1.3, CR 1.4, NDR 1.6, USER 1.8\n\n**Attention**\n\nLorsque des comptes\
        \ g\xE9n\xE9riques sont utilis\xE9s pour des raisons d\u2019exploitation de\
        \ l\u2019installation, il est n\xE9cessaire d\u2019appliquer la recommandation\
        \ R83-."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r85
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R85
      name: "D\xE9finir et documenter l\u2019ensemble des droits attribu\xE9s"
      description: "Il est recommand\xE9 de d\xE9finir et documenter, pour chacun\
        \ des profils utilisateurs, l\u2019ensemble des droits attribu\xE9s. Leur\
        \ mise en \u0153uvre peut s\u2019appuyer sur des m\xE9canismes de type RBAC\
        \ (Role-Based Access Control)."
      annotation: '**Exigences IEC 62443**


        SR 2.1, CR 2.1, USER 2.1, SP03.07BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r86
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R86
      name: "Supprimer les comptes appartenant \xE0 des personnels n\u2019intervenant\
        \ plus sur le syst\xE8me industriel"
      description: "Il est recommand\xE9 de supprimer ou, au minimum, d\xE9sactiver\
        \ les comptes appartenant \xE0 des personnes n\u2019intervenant plus sur le\
        \ syst\xE8me industriel (conform\xE9ment \xE0 la recommandation R16)."
      annotation: '**Exigences IEC 62443**


        ORG 1.3, SM-2, SP01.05BR, SP01.06BR, SP01.07BR'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r87
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R87
      name: "Modifier tous les authentifiants par d\xE9faut"
      description: "Il est recommand\xE9 de modifier tous les authentifiants (par\
        \ exemple, certificat, mot de passe) par d\xE9faut (par exemple, impl\xE9\
        ment\xE9s par le constructeur, l\u2019int\xE9grateur)."
      annotation: '**Exigences IEC 62443**


        SR 1.3, SR 1.5, CR 1.3, CR 1.5'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r88
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R88
      name: "Auditer les \xE9v\xE9nements li\xE9s \xE0 l\u2019utilisation des comptes"
      description: "Il est recommand\xE9 de mettre en place un audit des \xE9v\xE9\
        nements li\xE9s \xE0 l\u2019utilisation des comptes (une liste minimale des\
        \ \xE9v\xE9nements \xE0 journaliser est pr\xE9sent\xE9e \xE0 l\u2019annexe\
        \ C du guide)."
      annotation: '**Exigences IEC 62443**


        SR 2.8, CR 2.8, EVENT 1.1, SP08.01BR, SP08.03BR'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r89
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R89
      name: "Faire valider les comptes \xE0 privil\xE8ges par un responsable"
      description: "Il est recommand\xE9 de faire valider les comptes \xE0 privil\xE8\
        ges par un responsable de l\u2019utilisateur."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r90
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R90
      name: Conduire une revue annuelle des comptes
      description: "Il est recommand\xE9 de revoir annuellement les comptes des utilisateurs\
        \ internes et externes \xE0 l\u2019organisation afin de v\xE9rifier la bonne\
        \ application des recommandations R86 et R89. Cette revue doit porter une\
        \ attention particuli\xE8re aux comptes \xE0 privil\xE8ges. Afin de faciliter\
        \ sa mise en \u0153uvre p\xE9riodique, il est recommand\xE9 de l\u2019automatiser.\
        \ Par exemple, pour un serveur Active Directory Domain Services, il est possible\
        \ de lister les comptes actifs avec une date de derni\xE8re connexion pouvant\
        \ pr\xE9sumer que l\u2019utilisateur ne fait plus partie de l\u2019organisation.\
        \ Le script liste et d\xE9sactive les comptes concern\xE9s et transf\xE8re\
        \ les \xE9tats par mail. Le gestionnaire peut ensuite d\xE9cider dans un second\
        \ temps, apr\xE8s v\xE9rification, de supprimer ces comptes."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r91
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R91
      name: "Configurer un acc\xE8s par d\xE9faut en lecture seule aux \xE9quipements"
      description: "Lorsque les \xE9quipements le permettent, un acc\xE8s en lecture\
        \ seule doit \xEAtre configur\xE9 par d\xE9faut."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r92
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.1
      ref_id: R92
      name: "Auditer la configuration de l\u2019annuaire"
      description: "Il est recommand\xE9 d\u2019auditer r\xE9guli\xE8rement, et au\
        \ moins une fois par an, la configuration de l\u2019annuaire (par exemple,\
        \ OpenLDAP, Active Directory) si la gestion des comptes est centralis\xE9\
        e (pour les entit\xE9s r\xE9glement\xE9es, on pourra se reporter au service\
        \ ADS [56])."
      annotation: "**Attention**\n\nUne solution centralis\xE9e (comme par exemple\
        \ OpenLDAP, Active Directory) peut faciliter la gestion des comptes et droits\
        \ des intervenants. Dans ce cas, il faut favoriser une solution centralis\xE9\
        e d\xE9di\xE9e aux environnements industriels (s\xE9paration IT/OT)."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.2
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1
      ref_id: 4.1.2
      name: "Gestion de l\u2019authentification"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.3\n- **Guide d\u2019hygi\xE8\
        ne** : r\xE8gles n\xB0 9, n\xB0 10, n\xB0 11, n\xB0 12 et n\xB0 13\n- **ISO\
        \ 27002** : 5.15"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r93
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.1.2
      ref_id: R93
      name: Authentifier les utilisateurs avec identifiant et mot de passe
      description: "Les utilisateurs doivent s\u2019authentifier avec au moins un\
        \ identifiant et un mot de passe. Lorsque cela est possible, la politique\
        \ de mots de passe doit r\xE9pondre aux exigences suivantes\_:\n\n- les mots\
        \ de passe doivent \xEAtre robustes (conform\xE9ment au guide relatif \xE0\
        \ l\u2019authentification multifacteur et aux mots de passe [50]);\n- les\
        \ mots de passe d\xE9finis initialement par le service informatique doivent\
        \ \xEAtre modifi\xE9s par l\u2019utilisateur \xE0 la premi\xE8re connexion."
      annotation: '**Exigences IEC 62443**


        SR 1.1, SR 1.5, SR 1.7, CR 1.1, CR 1.5, CR 1.7, USER 1.11, SP09.05, SP09.06,
        SP09.07, SP09.08'
      implementation_groups:
      - C1
