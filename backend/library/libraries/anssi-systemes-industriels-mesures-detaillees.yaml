      ref_id: R186
      name: "Proscrire le raccordement de p\xE9riph\xE9riques personnels"
      description: "Conform\xE9ment au guide sur le nomadisme num\xE9rique [36], il\
        \ est recommand\xE9 de proscrire le raccordement au syst\xE8me industriel\
        \ de p\xE9riph\xE9riques personnels quels qu\u2019ils soient (par exemple,\
        \ smartphones, tablettes, cl\xE9s USB, appareils photos)."
      annotation: '**Exigences IEC 62443**


        SR 2.3, SR 5.3'
      implementation_groups:
