      ref_id: R104
      name: "Cloisonner le r\xE9seau d\u2019administration"
      description: "Il est recommand\xE9 d\u2019utiliser un r\xE9seau d\u2019administration\
        \ d\xE9di\xE9. Ce r\xE9seau doit \xEAtre cloisonn\xE9 des \xE9quipements des\
