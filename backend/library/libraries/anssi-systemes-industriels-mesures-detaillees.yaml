      ref_id: 4.3.6
      name: "D\xE9veloppement s\xE9curis\xE9"
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.19\n- **Guide d\u2019hygi\xE8\
        ne** : n\xE9ant\n- **ISO 27002** : 8.25, 8.27, 8.28 et 8.29"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r194
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R194
      name: "Appliquer des r\xE8gles de d\xE9veloppement s\xE9curis\xE9"
      description: "Il est recommand\xE9 d\u2019appliquer des r\xE8gles de d\xE9veloppement\
        \ s\xE9curis\xE9 comme pr\xE9cis\xE9 dans les Essentiels de l\u2019ANSSI sur\
        \ le DevSecOps [38]."
      annotation: '**Exigences IEC 62443**


        SR 3.6, CR 3.6, SI-2, SVV-3.5, SVV-3.6'
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r195
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R195
      name: "D\xE9dier un environnement de d\xE9veloppement au syst\xE8me industriel"
      description: "Il est recommand\xE9 de d\xE9dier un environnement de d\xE9veloppement\
        \ (configuration et programmation des automates par exemple) au syst\xE8me\
        \ industriel."
      annotation: "**Exigences IEC 62443**\n\nSM-7\n\n**Information**\n\nL\u2019environnement\
        \ de d\xE9veloppement peut \xEAtre interne ou chez des \xE9diteurs, \xE9quipementiers\
        \ ou int\xE9grateurs. Dans ce cas, il convient d\u2019indiquer les exigences\
        \ attendues dans le cahier des charges (conform\xE9ment \xE0 la recommandation\
        \ R33)."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r196
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R196
      name: "Ajouter des contr\xF4les au niveau de la logique fonctionnelle de l\u2019\
        automate"
      description: "Il est recommand\xE9 d\u2019ajouter, au niveau de la logique fonctionnelle\
        \ de l\u2019automate, les \xE9l\xE9ments suivants\_:\n\n- un contr\xF4le des\
        \ compteurs et des horloges (timer);\n- une v\xE9rification de la coh\xE9\
        rence des variables du proc\xE9d\xE9 industriel, par exemple le mode de fonctionnement\
        \ de l\u2019automate (Start <> Stop) ou la position d\u2019une vanne (ne peut\
        \ pas \xEAtre ouverte et ferm\xE9e en m\xEAme temps);\n- la limitation d\u2019\
        une plage de fonctionnement ou l\u2019ajout d\u2019un contr\xF4le crois\xE9\
        \ avec diff\xE9rents points de mesures install\xE9s sur site."
      annotation: '**Exigences IEC 62443**


        SR 3.5, SR 3.6, CR 3.5, CR 3.6, SI-1, SI-2'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r197
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R197
      name: "Programmer la logique de l\u2019automate de fa\xE7on modulaire"
      description: "Il est recommand\xE9 de programmer la logique de l\u2019automate\
        \ de fa\xE7on modulaire et non en un unique bloc de programmation. Cela facilite\
        \ la d\xE9tection des nouvelles portions de code non l\xE9gitimes et potentiellement\
        \ malveillantes."
      annotation: '**Exigences IEC 62443**


        SR 3.4, CR 3.4, SI-2'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r198
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R198
      name: "Privil\xE9gier la mise en \u0153uvre de la logique fonctionnelle dans\
        \ l\u2019automate"
      description: "Il est recommand\xE9 de privil\xE9gier l\u2019impl\xE9mentation\
        \ de la logique fonctionnelle dans l\u2019automate plut\xF4t que dans un composant\
        \ tiers. Par exemple, la v\xE9rification qu\u2019une consigne rentre dans\
        \ des limites autoris\xE9es doit \xEAtre r\xE9alis\xE9e au niveau de l\u2019\
        automate et non par une IHM. En effet, la programmation d\u2019une IHM dispose\
        \ d\u2019un contr\xF4le des modifications moins rigoureux que celui d\u2019\
        un automate. D\u2019une part, les modifications au niveau de l\u2019IHM sont\
        \ plus difficiles \xE0 d\xE9tecter. D\u2019autre part, il est plus facile\
        \ pour un attaquant de manipuler des \xE9l\xE9ments calcul\xE9s au niveau\
        \ de l\u2019IHM que s\u2019ils sont r\xE9partis sur plusieurs automates."
      annotation: '**Exigences IEC 62443**


        SR 3.6, CR 3.6, SI-2, SVV-1'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r199
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R199
      name: Effectuer un audit de code
      description: "Il est recommand\xE9 d\u2019effectuer un audit de code par une\
        \ entit\xE9 ind\xE9pendante (interne ou externe \xE0 l\u2019entreprise). Cet\
        \ audit peut \xEAtre r\xE9alis\xE9 en priorit\xE9 sur les fonctions critiques\
        \ de l\u2019installation."
      annotation: '**Exigences IEC 62443**


        SVV-5'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r200
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R200
      name: "Appliqueretv\xE9rifier lesr\xE8glesdebonnespratiquesdeprogrammation"
      description: "Il est recommand\xE9 d\u2019appliquer et de v\xE9rifier les r\xE8\
        gles de bonnes pratiques de programmation. Pour cela, on pourra par exemple\
        \ utiliser les options avanc\xE9es de certains compilateurs ou des outils\
        \ d\xE9di\xE9s \xE0 la v\xE9rification des bonnes pratiques de programmation\
        \ comme pr\xE9cis\xE9 dans les guides de l\u2019ANSSI [28] et [29]."
      annotation: "**Exigences IEC 62443**\n\nSI-2, SI-3.5, SI-3.6\n\n**Information**\n\
        \nCertains compilateurs, ateliers de d\xE9veloppement de SCADA et d\u2019\
        automates disposent de nombreuses options pour remonter des avertissements\
        \ suppl\xE9mentaires \xE0 l\u2019utilisateur. Ces options ne sont souvent\
        \ pas activ\xE9es par d\xE9faut. Elles permettent pourtant d\u2019\xE9viter\
        \ de nombreuses erreurs de programmation et bogues pouvant induire des vuln\xE9\
        rabilit\xE9s.\n\n**Attention**\n\nL\u2019application et la v\xE9rification\
        \ des bonnes pratiques de programmation ne permettent pas d\u2019\xE9viter\
        \ tous les bogues pouvant mener \xE0 des vuln\xE9rabilit\xE9s."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r201
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R201
      name: "Utiliser de mani\xE8re syst\xE9matique des outils d\u2019analyse statique"
      description: "Il est recommand\xE9 d\u2019utiliser de mani\xE8re syst\xE9matique\
        \ des outils d\u2019analyse statique et d\u2019effectuer des tests de robustesse."
      annotation: '**Exigences IEC 62443**


        SI-2, SVV-1, SVV-3.5, SVV-3.6'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r202
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.3.6
      ref_id: R202
      name: "V\xE9rifier le niveau de s\xE9curit\xE9 de l\u2019environnement de d\xE9\
        veloppement"
      description: "Il est recommand\xE9 de v\xE9rifier, par le biais d\u2019un audit,\
        \ le niveau de s\xE9curit\xE9 de l\u2019environnement de d\xE9veloppement."
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4
      ref_id: '4.4'
      name: "Supervision de s\xE9curit\xE9 du syst\xE8me industriel"
      description: "Une collection de guides de l\u2019ANSSI sur la supervision de\
        \ s\xE9curit\xE9 d\xE9crit les cl\xE9s de d\xE9cision n\xE9cessaires pour\
        \ fixer des objectifs de supervision et passer \xE0 l\u2019action [7].\n\n\
        Au coeur de la r\xE9flexion sur la strat\xE9gie de supervision se trouve le\
        \ lien entre des familles de donn\xE9es de supervision (par exemple, des journaux\
        \ syst\xE8me, de l\u2019activit\xE9 r\xE9seau) et des points de collecte pertinents\
        \ (par exemple, en bordure du SI, au sein d\u2019une zone sp\xE9cifique)."
      annotation: "**R\xE9f\xE9rences**\n\n- **TTP** : 2.2.14\n- **Guide d\u2019hygi\xE8\
        ne** : R\xE8gles n\xB0 36 et n\xB0 42\n- **ISO 27002** : 8.15 et 8.16"
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r203
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R203
      name: "D\xE9finir une strat\xE9gie de supervision de s\xE9curit\xE9"
      description: "Il est recommand\xE9 de d\xE9finir une strat\xE9gie de supervision\
        \ de s\xE9curit\xE9 en s\u2019appuyant sur la strat\xE9gie de supervision\
        \ de l\u2019entit\xE9 et sur la collection de guides de l\u2019ANSSI [7]."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r204
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R204
      name: Activer les fonctions de journalisation locale
      description: "Il est recommand\xE9 d\u2019activer les fonctions de journalisation\
        \ locale, conform\xE9ment \xE0 la strat\xE9gie de s\xE9curit\xE9 \xE9tablie\
        \ en R203, si les \xE9quipements et logiciels le permettent (se r\xE9f\xE9\
        rer aux guides [34] et [43])."
      annotation: '**Exigences IEC 62443**


        SR 6.1 RE1, CR 6.1 RE1, EVENT 1.6, SP08.02RE1'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r205
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R205
      name: "D\xE9finir une politique de gestion des \xE9v\xE9nements"
      description: "Il est recommand\xE9 de d\xE9finir une politique de gestion des\
        \ \xE9v\xE9nements (se r\xE9f\xE9rer aux guides [34] et [43]), conform\xE9\
        ment \xE0 la strat\xE9gie de s\xE9curit\xE9 \xE9tablie en R203. Elle doit\
        \ permettre\_:\n\n- de d\xE9terminer quels sont les \xE9v\xE9nements pertinents\
        \ \xE0 prendre en compte;\n- d\u2019organiser leur stockage (par exemple,\
        \ volum\xE9trie, dur\xE9e de conservation);\n- de d\xE9finir les conditions\
        \ d\u2019analyse (en pr\xE9ventif, post-incident);\n- de d\xE9finir quels\
        \ sont les \xE9v\xE9nements qui doivent g\xE9n\xE9rer des alertes. L\u2019\
        annexe C fournit une liste d\u2019\xE9v\xE9nements en exemple."
      annotation: "**Exigences IEC 62443**\n\nSR 2.8, SR 2.9, CR 2.8, CR 2.9, EVENT\
        \ 1.4, EVENT 1.5\n\n**Information**\n\nLes analystes de supervision, majoritairement\
        \ form\xE9s dans des environnements IT, n\u2019ont a priori pas la capacit\xE9\
        \ de qualifier un \xE9v\xE9nement de s\xE9curit\xE9 en environnement OT. Cette\
        \ capacit\xE9 est port\xE9e par le personnel en charge du syst\xE8me industriel.\
        \ Il est donc important de mettre en place un processus de qualification des\
        \ incidents de s\xE9curit\xE9 OT qui implique ces deux profils."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r206
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R206
      name: "Journaliser les modifications de param\xE8tres"
      description: "Il est recommand\xE9, conform\xE9ment \xE0 la strat\xE9gie de\
        \ s\xE9curit\xE9 \xE9tablie en R203, de journaliser les \xE9l\xE9ments suivants\_\
        :\n\n- les modifications du mode de fonctionnement de l\u2019automate (Start/Stop);\n\
        - la dur\xE9e de fonctionnement de l\u2019automate;\n- les modifications des\
        \ param\xE8tres de capteurs et actionneurs, des fonctions d\u2019asservissement\
        \ et de r\xE9gulation."
      annotation: '**Exigences IEC 62443**


        SR 2.8 RE1, SP08.03BR'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r207
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R207
      name: "S\u2019assurer de la conservation des \xE9v\xE9nements de s\xE9curit\xE9"
      description: "Il est recommand\xE9 de s\u2019assurer que les \xE9v\xE9nements\
        \ de s\xE9curit\xE9 et les journaux sont conserv\xE9s pour une dur\xE9e d\u2019\
        au moins trois mois, conform\xE9ment \xE0 la strat\xE9gie de s\xE9curit\xE9\
        \ \xE9tablie en R203."
      annotation: '**Exigences IEC 62443**


        EVENT 1.4'
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r208
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R208
      name: "Mettre en \u0153uvre un syst\xE8me de gestion centralis\xE9e"
      description: "Il est recommand\xE9 de mettre en \u0153uvre un syst\xE8me de\
        \ gestion centralis\xE9e et s\xE9curis\xE9e des journaux d\u2019\xE9v\xE9\
        nements, conform\xE9ment \xE0 la strat\xE9gie de s\xE9curit\xE9 \xE9tablie\
        \ en R203. Pour cela, il est recommand\xE9 d\u2019appliquer les recommandations\
        \ de s\xE9curit\xE9 pour l\u2019architecture d\u2019un syst\xE8me de journalisation\
        \ [34]."
      annotation: '**Exigences IEC 62443**


        SR 2.8 RE1, SR 6.2, CR 6.2'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r209
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R209
      name: Activer les fonctions de journalisation distante
      description: "Il est recommand\xE9 d\u2019activer les fonctions de journalisation\
        \ distante (Syslog TLS, SNMPv3, Windows Event, etc.), conform\xE9ment \xE0\
        \ la strat\xE9gie de s\xE9curit\xE9 \xE9tablie en R203, si les \xE9quipements\
        \ et logiciels le permettent (se r\xE9f\xE9rer aux guides [34] et [43])."
      annotation: '**Exigences IEC 62443**


        SR 6.1 RE1, CR 6.1 RE1, EVENT 1.6, SP08.02RE1'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r210
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R210
      name: "Mettre en \u0153uvre une solution de corr\xE9lation des journaux"
      description: "Il est recommand\xE9 de mettre en \u0153uvre une solution de type\
        \ SIEM (Security Information and Event Management) centralisant l\u2019ensemble\
        \ des journaux d\u2019\xE9v\xE9nements de s\xE9curit\xE9, conform\xE9ment\
        \ \xE0 la strat\xE9gie de s\xE9curit\xE9 \xE9tablie en R203. Elle doit permettre\
        \ de corr\xE9ler les journaux en vue de d\xE9tecter des incidents de s\xE9\
        curit\xE9. La solution de SIEM connect\xE9e \xE0 un syst\xE8me de classe 4,\
        \ pour ne pas \xEAtre consid\xE9r\xE9e de classe 4, doit \xEAtre plac\xE9\
        e derri\xE8re une diode comme indiqu\xE9 \xE0 la recommandation R115 et dans\
        \ le tableau 3."
      annotation: '**Exigences IEC 62443**


        SR 2.8 RE1, SR 6.2, CR 6.2'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r211
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R211
      name: "Mettre en \u0153uvre des moyens de d\xE9tection d\u2019intrusion"
      description: "Conform\xE9ment \xE0 la doctrine de d\xE9tection des syst\xE8\
        mes industriels [24], il est recommand\xE9 de mettre en \u0153uvre des moyens\
        \ d\xE9tection d\u2019intrusion en p\xE9riph\xE9rie des syst\xE8mes ET sur\
        \ les points identifi\xE9s comme critiques, qui comprennent notamment\_:\n\
        \n- les interconnexions entre des syst\xE8mes distants;\n- les interconnexions\
        \ des syst\xE8mes de t\xE9l\xE9gestion;\n- les interconnexions entre le SI\
        \ de gestion et le SI industriel;\n- les points de connexion sp\xE9cifiques\
        \ vers l\u2019ext\xE9rieur (Wi-Fi industriel par exemple);\n- les sas ou stations\
        \ blanches;\n- le r\xE9seau f\xE9d\xE9rateur de postes de supervision industriel\
        \ (SCADA);\n- les r\xE9seaux d\u2019automates jug\xE9s sensibles (en se servant\
        \ de l\u2019analyse de risque)."
      annotation: '**Exigences IEC 62443**


        ZCR 3.2, SR 6.2'
      implementation_groups:
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r212
      assessable: true
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:4.4
      ref_id: R212
      name: "Centraliser les \xE9l\xE9ments collect\xE9s par les syst\xE8mes de d\xE9\
        tection d\u2019intrusion"
      description: "Il est recommand\xE9 de centraliser les journaux et \xE9v\xE9\
        nements collect\xE9s par le syst\xE8me de d\xE9tection d\u2019intrusion, conform\xE9\
        ment \xE0 la strat\xE9gie de s\xE9curit\xE9 \xE9tablie en R203."
      annotation: '**Exigences IEC 62443**


        SR 2.8 RE1'
      implementation_groups:
      - C3
      - C4
