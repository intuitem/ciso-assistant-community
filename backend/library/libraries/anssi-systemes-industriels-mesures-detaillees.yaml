      description: "Il est recommand\xE9 de tester r\xE9guli\xE8rement les plans de\
        \ reprise et de continuit\xE9 d\u2019activit\xE9, et au moins une fois par\
        \ an sur les applications critiques pour les processus m\xE9tier."
      implementation_groups:
      - C2
      - C3
      - C4
    - urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:r76
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:anssi-systemes-industriels-mesures-detaillees:3.5.1
      ref_id: R76
      name: "D\xE9finir un ordre de reconstruction des sites industriels avec la direction"
      description: "Il est recommand\xE9 de d\xE9finir un ordre de reconstruction\
        \ des syst\xE8mes industriels avec la direction. Plusieurs sites peuvent \xEA\
        tre simultan\xE9ment impact\xE9s par une cyberattaque. Certains sites peuvent\
        \ pr\xE9senter un niveau de criticit\xE9 plus \xE9lev\xE9 que d\u2019autres,\
        \ il est essentiel de d\xE9finir et valider en amont, avec les m\xE9tiers,\
        \ un ordre de priorit\xE9 pour la remise en service des installations industrielles.\
        \ Cette priorisation doit \xE9galement inclure les applications les plus critiques\
        \ pour les processus m\xE9tier."
      implementation_groups:
      - C1
      - C2
      - C3
      - C4
