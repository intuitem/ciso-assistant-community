translations:
  de:
    name: Verordnung 7/2024. (VI. 24.) MK – Bedrohungskatalog
    description: |-
      Anhang 3 der Verordnung 7/2024. (VI. 24.) MK (Bedrohungskatalog): 47 Bedrohungen mit den potenziell betroffenen Schutzzielen der Informationssicherheit (Vertraulichkeit, Integrität, Verfügbarkeit) in der Beschreibung. Die Verordnung ordnet den Bedrohungen keine Schutzmaßnahmen zu. Dieser Bedrohungskatalog gehört zu den Referenzwerken hu-1-2025-sztfh-rendelet-elemi-kovetelmenyek und hu-7-2024-mk-rendelet.
      Textstand: konsolidierte Fassung der Verordnung 7/2024. MK laut njt.hu vom 02.01.2025. Maßgeblich ist der ungarische Rechtstext.

      Hinweis zur Übersetzung: KI-gestützte maschinelle Übersetzung mit anschließender sprachlicher und fachlicher Prüfung durch den KI-Assistenten. Keine offizielle Übersetzung der Herausgeber; keine unabhängige menschliche Prüfung. Die deutschen Ergänzungen umfassen die Bibliotheksmetadaten und Bedrohungstexte.
    copyright: 'Rechtstexte sind gemäß § 1 Absatz 4 des ungarischen Gesetzes LXXVI von 1999 über das Urheberrecht
      nicht urheberrechtlich geschützt. Quellen: Magyar Közlöny, Ausgabe 2024/68, Nemzeti Jogszabálytár
      (njt.hu).'
