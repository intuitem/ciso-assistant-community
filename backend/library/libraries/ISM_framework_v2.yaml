      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-information-technology-equipment:4:2
      ref_id: ISM-1217
      description: Labels and markings indicating the owner, sensitivity, classification
        or any other marking that can associate IT equipment with its prior use are
        removed prior to its disposal.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0321
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-information-technology-equipment:4:2
      ref_id: ISM-0321
      description: When disposing of IT equipment that has been designed or modified
        to meet emanation security standards, ASD is contacted for requirements relating
        to its disposal.
      implementation_groups:
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0316
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-information-technology-equipment:4:2
      ref_id: ISM-0316
      description: Following sanitisation, destruction or declassification, a formal
        administrative decision is made to release IT equipment, or its waste, into
        the public domain.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
