    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1299
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:2
      ref_id: ISM-1299
      description: "Personnel are advised to take the following precautions when using\
        \ mobile devices:\n\n- never leave mobile devices or removable media unattended,\
        \ including by placing them in checked-in luggage or leaving them in hotel\
        \ safes\n- never store credentials with mobile devices that they grant access\
        \ to, such as in laptop computer bags\n- never lend mobile devices or removable\
        \ media to untrusted people, even if briefly\n- never allow untrusted people\
        \ to connect their mobile devices or removable media to your mobile devices,\
        \ including for charging\n- never connect mobile devices to designated charging\
        \ stations or wall outlet charging ports\n- never use gifted or unauthorised\
        \ peripherals, chargers or removable media with mobile devices\n- never use\
        \ removable media for data transfers or backups that have not been checked\
        \ for malicious code beforehand\n- avoid reuse of removable media once used\
        \ with other parties\u2019 systems or mobile devices\n- avoid connecting mobile\
        \ devices to open or untrusted Wi-Fi networks\n- consider disabling any communications\
        \ capabilities of mobile devices when not in use, such as Wi-Fi, Bluetooth,\
        \ Near Field Communication and ultra-wideband\n- consider periodically rebooting\
        \ mobile devices\n- consider using a VPN connection to encrypt all cellular\
        \ and wireless communications\n- consider using encrypted email or messaging\
        \ apps for all communications."
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
