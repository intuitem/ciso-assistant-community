    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1298
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:10
      ref_id: ISM-1298
      description: Personnel are advised of privacy and security risks when travelling
        overseas with mobile devices.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1554
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:10
      ref_id: ISM-1554
      description: 'If travelling overseas with mobile devices to high or extreme
        risk countries, personnel are:


        - issued with newly provisioned user accounts, mobile devices and removable
        media from a pool of dedicated travel devices which are used solely for work-related
        activities

        - advised on how to apply and inspect tamper seals to key areas of mobile
        devices

        - advised to avoid taking any personal mobile devices, especially if rooted
        or jailbroken.'
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1555
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:10
      ref_id: ISM-1555
      description: 'Before travelling overseas with mobile devices, personnel take
        the following actions:


        - record all details of the mobile devices being taken, such as product types,
        serial numbers and International Mobile Equipment Identity numbers

        - update all operating systems and applications

        - remove all non-essential data, applications and user accounts

        - backup all remaining data, applications and settings.'
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:11
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3
      name: While travelling overseas with mobile devices
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1088
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:11
      ref_id: ISM-1088
      description: 'Personnel report the potential compromise of mobile devices, removable
        media or credentials to their organisation as soon as possible, especially
        if they:


        - provide credentials to foreign government officials

        - decrypt mobile devices for foreign government officials

        - have mobile devices taken out of sight by foreign government officials

        - have mobile devices or removable media stolen, including if later returned

        - lose mobile devices or removable media, including if later found

        - observe unusual behaviour of mobile devices.'
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:12
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3
      name: After travelling overseas with mobile devices
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1300
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:12
      ref_id: ISM-1300
      description: 'Upon returning from travelling overseas with mobile devices, personnel
        take the following actions:


        - sanitise and reset mobile devices, including all removable media

        - decommission any credentials that left their possession during their travel

        - report if significant doubt exists as to the integrity of any mobile devices
        or removable media.'
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1556
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-enterprise-mobility:3:12
      ref_id: ISM-1556
      description: "If returning from travelling overseas with mobile devices to high\
        \ or extreme risk countries, personnel take the following additional actions:\n\
        \n- reset credentials used with mobile devices, including those used for remote\
        \ access to their organisation\u2019s systems\n- monitor user accounts for\
        \ any indicators of compromise, such as failed logon attempts."
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
