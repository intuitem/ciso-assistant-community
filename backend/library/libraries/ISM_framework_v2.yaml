      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:3:2
      ref_id: ISM-0350
      description: 'The following media types are destroyed prior to their disposal:


        - microfiche and microfilm

        - optical discs

        - programmable read-only memory

        - read-only memory

        - other types of media that cannot be sanitised.'
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
