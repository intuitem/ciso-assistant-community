      ref_id: ISM-1549
      description: A media management policy is developed, implemented and maintained.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:2
