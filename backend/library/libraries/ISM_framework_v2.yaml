    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1713
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:3
      ref_id: ISM-1713
      description: A removable media register is developed, implemented, maintained
        and regularly verified.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:4
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1
      name: Labelling media
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0332
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:4
      ref_id: ISM-0332
      description: Media, except for internally mounted fixed media within information
        technology equipment, is labelled with protective markings reflecting its
        sensitivity or classification.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:5
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1
      name: Classifying media
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0323
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:5
      ref_id: ISM-0323
      description: Media is classified to the highest sensitivity or classification
        of data it stores, unless the media has been classified to a higher sensitivity
        or classification.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0337
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:5
      ref_id: ISM-0337
      description: Media is only used with systems that are authorised to process,
        store or communicate its sensitivity or classification.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:6
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1
      name: Reclassifying media
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0325
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:6
      ref_id: ISM-0325
      description: Any media connected to a system with a higher sensitivity or classification
        than the media is reclassified to the higher sensitivity or classification,
        unless the media is read-only or the system has a mechanism through which
        read-only access can be ensured.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0330
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:6
      ref_id: ISM-0330
      description: Before reclassifying media to a lower sensitivity or classification,
        the media is sanitised or destroyed, and a formal administrative decision
        is made to reclassify it.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:7
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1
      name: Encrypting media
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1059
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:7
      ref_id: ISM-1059
      description: All data stored on media is encrypted using ASD-approved cryptography.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0459
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:7
      ref_id: ISM-0459
      description: Full disk encryption, or partial encryption where access controls
        only allow writing to encrypted partitions or volumes, is implemented when
        encrypting media.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-2109
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:7
      ref_id: ISM-2109
      description: Pre-boot authentication using passwords, or managed network-based
        key release, is implemented for media containing encrypted system volumes.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:8
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1
      name: Handling media
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0831
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:8
      ref_id: ISM-0831
      description: Media is handled in a manner suitable for its sensitivity or classification.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:9
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1
      name: Sanitising media before first use
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1600
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:9
      ref_id: ISM-1600
      description: Media is sanitised before it is used for the first time.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1642
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:9
      ref_id: ISM-1642
      description: Media is sanitised before it is reused in a different security
        domain.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:10
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1
      name: Using media for data transfers
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0347
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:10
      ref_id: ISM-0347
      description: When transferring data manually between two systems belonging to
        different security domains, write-once media is used unless the destination
        system has a mechanism through which read-only access can be ensured.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0947
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:10
      ref_id: ISM-0947
      description: When transferring data manually between two systems belonging to
        different security domains, rewritable media is sanitised after each data
        transfer.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      assessable: false
      depth: 2
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media
      name: Media sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:1
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Media sanitisation processes and procedures
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0348
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:1
      ref_id: ISM-0348
      description: Media sanitisation processes, and supporting media sanitisation
        procedures, are developed, implemented and maintained.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:2
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Volatile media sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0351
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:2
      ref_id: ISM-0351
      description: Volatile media is sanitised by removing its power for at least
        10 minutes.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0352
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:2
      ref_id: ISM-0352
      description: SECRET and TOP SECRET volatile media is sanitised by overwriting
        it at least once in its entirety with a random pattern followed by a read
        back for verification.
      implementation_groups:
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:3
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Treatment of volatile media following sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0835
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:3
      ref_id: ISM-0835
      description: Following sanitisation, TOP SECRET volatile media retains its classification
        if it stored static data for an extended period, or had data repeatedly stored
        on or written to the same memory location for an extended period.
      implementation_groups:
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:4
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Non-volatile magnetic media sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0354
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:4
      ref_id: ISM-0354
      description: Non-volatile magnetic media is sanitised by overwriting it at least
        once (or three times if pre-2001 or under 15 GB) in its entirety with a random
        pattern followed by a read back for verification.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1065
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:4
      ref_id: ISM-1065
      description: The host-protected area and device configuration overlay table
        are reset prior to the sanitisation of non-volatile magnetic hard drives.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1067
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:4
      ref_id: ISM-1067
      description: The ATA secure erase command is used, in addition to block overwriting
        software, to ensure the growth defects table of non-volatile magnetic hard
        drives is overwritten.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:5
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Treatment of non-volatile magnetic media following sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0356
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:5
      ref_id: ISM-0356
      description: Following sanitisation, SECRET and TOP SECRET non-volatile magnetic
        media retains its classification.
      implementation_groups:
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:6
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Non-volatile erasable programmable read-only memory media sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0357
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:6
      ref_id: ISM-0357
      description: "Non-volatile EPROM media is sanitised by applying three times\
        \ the manufacturer\u2019s specified ultraviolet erasure time and then overwriting\
        \ it at least once in its entirety with a random pattern followed by a read\
        \ back for verification."
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:7
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Non-volatile electrically erasable programmable read-only memory media
        sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0836
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:7
      ref_id: ISM-0836
      description: Non-volatile EEPROM media is sanitised by overwriting it at least
        once in its entirety with a random pattern followed by a read back for verification.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:8
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Treatment of non-volatile erasable and electrically erasable programmable
        read-only memory media following sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0358
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:8
      ref_id: ISM-0358
      description: Following sanitisation, SECRET and TOP SECRET non-volatile EPROM
        and EEPROM media retains its classification.
      implementation_groups:
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:9
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Non-volatile flash memory media sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0359
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:9
      ref_id: ISM-0359
      description: Non-volatile flash memory media is sanitised by overwriting it
        at least twice in its entirety with a random pattern followed by a read back
        for verification.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:10
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Treatment of non-volatile flash memory media following sanitisation
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0360
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:10
      ref_id: ISM-0360
      description: Following sanitisation, SECRET and TOP SECRET non-volatile flash
        memory media retains its classification.
      implementation_groups:
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:11
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2
      name: Media that cannot be successfully sanitised
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1735
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:2:11
      ref_id: ISM-1735
      description: Media that cannot be successfully sanitised is destroyed prior
        to its disposal.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:3
      assessable: false
      depth: 2
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media
      name: Media destruction
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:3:1
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:3
      name: Media destruction processes and procedures
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0363
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:3:1
      ref_id: ISM-0363
      description: Media destruction processes, and supporting media destruction procedures,
        are developed, implemented and maintained.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:3:2
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:3
      name: Media that cannot be sanitised
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0350
      assessable: true
