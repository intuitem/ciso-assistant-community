      name: Removable media usage policy
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1359
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-media:1:2
      ref_id: ISM-1359
      description: A removable media usage policy is developed, implemented and maintained.
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
