      name: System security plan
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0041
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2:1
      ref_id: ISM-0041
      description: "Systems have a system security plan that includes an overview\
        \ of the system (covering the system\u2019s purpose, the system boundary and\
        \ how the system is managed) as well as an annex that covers applicable controls\
        \ from this document and any additional controls that have been identified\
        \ and implemented."
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2:2
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2
      name: Cyber security incident response plan
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0043
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2:2
      ref_id: ISM-0043
      description: 'Systems have a cyber security incident response plan that covers
        the following:


        - guidelines on what constitutes a cyber security incident

        - the types of cyber security incidents likely to be encountered and the expected
        response to each type

        - how to report cyber security incidents, internally to an organisation and
        externally to relevant authorities

        - other parties that need to be informed in the event of a cyber security
        incident

        - the authority, or authorities, responsible for investigating and responding
        to cyber security incidents

        - the criteria by which an investigation of a cyber security incident would
        be requested from a law enforcement agency, the Australian Signals Directorate
        or other relevant authority

        - the steps necessary to ensure the integrity of evidence relating to a cyber
        security incident

        - system contingency measures or a reference to such details if they are in
        a separate document.'
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2:3
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2
      name: Change and configuration management plan
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-0912
      assessable: true
      depth: 4
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2:3
      ref_id: ISM-0912
      description: 'Systems have a change and configuration management plan that includes:


        - the establishment and maintenance of authorised baseline configurations
        for systems

        - what constitutes routine and urgent changes to the configuration of systems

        - how changes to the configuration of systems will be requested, tracked and
        documented

        - who needs to be consulted prior to routine and urgent changes to the configuration
        of systems

        - who needs to approve routine and urgent changes to the configuration of
        systems

        - who needs to be notified of routine and urgent changes to the configuration
        of systems

        - what additional change management and configuration management processes
        and procedures need to be followed before, during and after routine and urgent
        changes to the configuration of systems.'
      implementation_groups:
      - NC
      - OS
      - P
      - S
      - TS
    - urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2:4
      assessable: false
      depth: 3
      parent_urn: urn:techcompass:risk:req_node:ism.2026.06:guidelines-for-cyber-security-documentation:2
      name: Continuous monitoring plan
    - urn: urn:techcompass:risk:req_node:ism.2026.06:ism-1163
