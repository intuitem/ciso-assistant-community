  and techniques based on real-world observations.

  The ATT&CK knowledge base is used as a foundation for the development of specific
  threat models and methodologies in the private sector, in government, and in the
  cybersecurity product and service community.


  https://attack.mitre.org


  Source: https://github.com/mitre/cti'
