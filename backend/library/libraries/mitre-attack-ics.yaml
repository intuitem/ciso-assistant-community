  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0843
    ref_id: T0843
    name: Program Download
    description: "Adversaries may perform a program download to transfer a user program\
      \ to a controller. \n\nVariations of program download, such as online edit and\
      \ program append, allow a controller to continue running during the transfer\
      \ and reconfiguration process without interruption to process control. However,\
      \ before starting a full program download (i.e., download all) a controller\
      \ may need to go into a stop state. This can have negative consequences on the\
      \ physical process, especially if the controller is not able to fulfill a time-sensitive\
      \ action. Adversaries may choose to avoid a download all in favor of an online\
      \ edit or program append to avoid disrupting the physical process. An adversary\
      \ may need to use the technique Detect Operating Mode or Change Operating Mode\
      \ to make sure the controller is in the proper mode to accept a program download.\n\
      \nThe granularity of control to transfer a user program in whole or parts is\
      \ dictated by the management protocol (e.g., S7CommPlus, TriStation) and underlying\
      \ controller API. Thus, program download is a high-level term for the suite\
      \ of vendor-specific API calls used to configure a controllers user program\
      \ memory space.  \n\n[Modify Controller Tasking](https://attack.mitre.org/techniques/T0821)\
      \ and [Modify Program](https://attack.mitre.org/techniques/T0889) represent\
      \ the configuration changes that are transferred to a controller via a program\
      \ download.\nhttps://attack.mitre.org/techniques/T0843"
