  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0821
    ref_id: T0821
    name: Modify Controller Tasking
    description: "Adversaries may modify the tasking of a controller to allow for\
      \ the execution of their own programs. This can allow an adversary to manipulate\
      \ the execution flow and behavior of a controller. \n\nAccording to 61131-3,\
      \ the association of a Task with a Program Organization Unit (POU) defines a\
      \ task association. (Citation: IEC February 2013) An adversary may modify these\
      \ associations or create new ones to manipulate the execution flow of a controller.\
      \ Modification of controller tasking can be accomplished using a Program Download\
      \ in addition to other types of program modification such as online edit and\
      \ program append.\n\nTasks have properties, such as interval, frequency and\
      \ priority to meet the requirements of program execution. Some controller vendors\
      \ implement tasks with implicit, pre-defined properties whereas others allow\
      \ for these properties to be formulated explicitly. An adversary may associate\
      \ their program with tasks that have a higher priority or execute associated\
      \ programs more frequently. For instance, to ensure cyclic execution of their\
      \ program on a Siemens controller, an adversary may add their program to the\
      \ task, Organization Block 1 (OB1).\nhttps://attack.mitre.org/techniques/T0821"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-ics:ta0104
