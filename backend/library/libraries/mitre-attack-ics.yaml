  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0836
    ref_id: T0836
    name: Modify Parameter
    description: "Adversaries may modify parameters used to instruct industrial control\
      \ system devices. These devices operate via programs that dictate how and when\
      \ to perform actions based on such parameters. Such parameters can determine\
      \ the extent to which an action is performed and may specify additional options.\
      \ For example, a program on a control system device dictating motor processes\
      \ may take a parameter defining the total number of seconds to run that motor.\
      \      \n\nAn adversary can potentially modify these parameters to produce an\
      \ outcome outside of what was intended by the operators. By modifying system\
      \ and process critical parameters, the adversary may cause [Impact](https://attack.mitre.org/tactics/TA0105)\
      \ to equipment and/or control processes. Modified parameters may be turned into\
      \ dangerous, out-of-bounds, or unexpected values from typical operations. For\
      \ example, specifying that a process run for more or less time than it should,\
      \ or dictating an unusually high, low, or invalid value as a parameter.\nhttps://attack.mitre.org/techniques/T0836"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-ics:ta0106
