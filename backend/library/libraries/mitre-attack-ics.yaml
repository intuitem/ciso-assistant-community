  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0843.002
    ref_id: T0843.002
    name: Online Edit
    description: "Adversaries may execute an online edit of a PLC to update parts\
      \ of an existing program. It does not require stopping the PLC which allows\
      \ it to continue running during transfer and reconfiguration without interruption\
      \ to process control. Adversaries may leverage this approach to minimize downtime\
      \ and evade detection. \n\nThe ability to perform an online edit to the PLC\
      \ typically relies on access to a workstation with the vendor-specific PLC programming\
      \ software installed.\nhttps://attack.mitre.org/techniques/T0843/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
