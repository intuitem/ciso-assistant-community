  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1692
    ref_id: T1692
    name: Unauthorized Message
    description: "Adversaries may send unauthorized messages to ICS systems and devices\
      \ to evade defenses or manipulate processes. Unauthorized messages can be categorized\
      \ as either reporting messages that contain telemetry data about the current\
      \ state of systems, devices, and processes or as command messages which instruct\
      \ systems and devices on how to operate. By injecting unauthorized messages,\
      \ adversaries can make it appear as if everything is working correctly when\
      \ it isn\u2019t, trigger alarms to misdirect personnel or impact processes,\
      \ and manipulate controls to disrupt processes.(Citation: Bonnie Zhu, Anthony\
      \ Joseph, Shankar Sastry 2011)\n\nAdversaries may send unauthorized messages\
      \ in an ICS environment using software found within the environment (living-off-the-land,\
      \ vendor-specific interfaces, etc.), custom tooling leveraging OT protocols\
      \ and libraries, or by positioning themselves between systems and devices and\
      \ injecting messages into the communications such as the case with an [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T0830)\
      \ attack.\nhttps://attack.mitre.org/techniques/T1692"
