  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0837
    ref_id: T0837
    name: Loss of Protection
    description: "Adversaries may compromise protective system functions designed\
      \ to prevent the effects of faults and abnormal conditions. This can result\
      \ in equipment damage, prolonged process disruptions and hazards to personnel.\
      \ \n\nMany faults and abnormal conditions in process control happen too quickly\
      \ for a human operator to react to. Speed is critical in correcting these conditions\
      \ to limit serious impacts such as Loss of Control and Property Damage. \n\n\
      Adversaries may target and disable protective system functions as a prerequisite\
      \ to subsequent attack execution or to allow for future faults and abnormal\
      \ conditions to go unchecked. Detection of a Loss of Protection by operators\
      \ can result in the shutdown of a process due to strict policies regarding protection\
      \ systems. This can cause a Loss of Productivity and Revenue and may meet the\
      \ technical goals of adversaries seeking to cause process disruptions.\nhttps://attack.mitre.org/techniques/T0837"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-ics:ta0105
  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0838
    ref_id: T0838
    name: Modify Alarm Settings
    description: "Adversaries may modify alarm settings to prevent alerts that may\
      \ inform operators of their presence or to prevent responses to dangerous and\
      \ unintended scenarios. Reporting messages are a standard part of data acquisition\
      \ in control systems. Reporting messages are used as a way to transmit system\
      \ state information and acknowledgements that specific actions have occurred.\
      \ These messages provide vital information for the management of a physical\
      \ process, and keep operators, engineers, and administrators aware of the state\
      \ of system devices and physical processes. \n\nIf an adversary is able to change\
      \ the reporting settings, certain events could be prevented from being reported.\
      \ This type of modification can also prevent operators or devices from performing\
      \ actions to keep the system in a safe state. If critical reporting messages\
      \ cannot trigger these actions then a [Impact](https://attack.mitre.org/tactics/TA0105)\
      \ could occur. \n\nIn ICS environments, the adversary may have to use [Alarm\
      \ Suppression](https://attack.mitre.org/techniques/T0878) or contend with multiple\
      \ alarms and/or alarm propagation to achieve a specific goal to evade detection\
      \ or prevent intended responses from occurring. (Citation: Jos Wetzels, Marina\
      \ Krotofil 2019)  Methods of suppression often rely on modification of alarm\
      \ settings, such as modifying in memory code to fixed values or tampering with\
      \ assembly level instruction code.\nhttps://attack.mitre.org/techniques/T0838"
