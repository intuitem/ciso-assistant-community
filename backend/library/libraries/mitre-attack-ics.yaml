  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1694.001
    ref_id: T1694.001
    name: Default Credentials
    description: 'Adversaries may leverage manufacturer or supplier set default credentials
      on control system devices. These default credentials may have administrative
      permissions and may be necessary for initial configuration of the device. It
      is general best practice to change the passwords for these accounts as soon
      as possible, but some manufacturers may have devices that have passwords or
      usernames that cannot be changed.(Citation: Keith Stouffer May 2015)


      Default credentials are normally documented in an instruction manual that is
      either packaged with the device, published online through official means, or
      published online through unofficial means. Adversaries may leverage default
      credentials that have not been properly modified or disabled.

      https://attack.mitre.org/techniques/T1694/001'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
