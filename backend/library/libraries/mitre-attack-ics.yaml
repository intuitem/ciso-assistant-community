  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1691.001
    ref_id: T1691.001
    name: Command Message
    description: 'Adversaries may block a command message from reaching its intended
      target to prevent command execution. In OT networks, command messages are sent
      to provide instructions to control system devices. A blocked command message
      can inhibit response functions from correcting a disruption or unsafe condition.(Citation:
      Bonnie Zhu, Anthony Joseph, Shankar Sastry 2011)(Citation: Electricity Information
      Sharing and Analysis Center; SANS Industrial Control Systems March 2016)

      https://attack.mitre.org/techniques/T1691/001'
