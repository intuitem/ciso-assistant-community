  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0894
    ref_id: T0894
    name: System Binary Proxy Execution
    description: "Adversaries may bypass process and/or signature-based defenses by\
      \ proxying execution of malicious content with signed, or otherwise trusted,\
      \ binaries. Binaries used in this technique are often Microsoft-signed files,\
      \ indicating that they have been either downloaded from Microsoft or are already\
      \ native in the operating system. (Citation: LOLBAS Project) Binaries signed\
      \ with trusted digital certificates can typically execute on Windows systems\
      \ protected by digital signature validation. Several Microsoft signed binaries\
      \ that are default on Windows installations can be used to proxy execution of\
      \ other files or commands. Similarly, on Linux systems adversaries may abuse\
      \ trusted binaries such as split to proxy execution of malicious commands. (Citation:\
      \ split man page)(Citation: GTFO split)\n\nAdversaries may abuse application\
      \ binaries installed on a system for proxy execution of malicious code or domain-specific\
      \ commands. These commands could be used to target local resources on the device\
      \ or networked devices within the environment through defined APIs ([Execution\
      \ through API](https://attack.mitre.org/techniques/T0871)) or application-specific\
      \ programming languages (e.g., MicroSCADA SCIL). Application binaries may be\
      \ signed by the developer or generally trusted by the operators, analysts, and\
      \ monitoring tools accustomed to the environment. These applications may be\
      \ developed and/or directly provided by the device vendor to enable configuration,\
      \ management, and operation of their devices without many alternatives. \n\n\
      Adversaries may seek to target these trusted application binaries to execute\
      \ or send commands without the development of custom malware. For example, adversaries\
      \ may target a SCADA server binary which has the existing ability to send commands\
      \ to substation devices, such as through IEC 104 command messages. Proxy execution\
      \ may still require the development of custom tools to hook into the application\
      \ binary\u2019s execution.\nhttps://attack.mitre.org/techniques/T0894"
