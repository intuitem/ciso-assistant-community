  tactics:
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0108
    ref_id: TA0108
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Initial Access
    description: 'The adversary is trying to get into your ICS environment.


      Initial Access consists of techniques that adversaries may use as entry vectors
      to gain an initial foothold within an ICS environment. These techniques include
      compromising operational technology assets, IT resources in the OT network,
      and external remote services and websites. They may also target third party
      entities and users with privileged access. In particular, these initial access
      footholds may include devices and communication mechanisms with access to and
      privileges in both the IT and OT environments. IT resources in the OT environment
      are also potentially vulnerable to the same attacks as enterprise IT systems.
      Trusted third parties of concern may include vendors, maintenance personnel,
      engineers, external integrators, and other outside entities involved in expected
      ICS operations. Vendor maintained assets may include physical devices, software,
      and operational equipment. Initial access techniques may also leverage outside
      devices, such as radios, controllers, or removable media, to remotely interfere
      with and possibly infect OT operations.

      https://attack.mitre.org/tactics/TA0108'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0104
    ref_id: TA0104
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Execution
    description: 'The adversary is trying to run code or manipulate system functions,
      parameters, and data in an unauthorized way.


      Execution consists of techniques that result in adversary-controlled code running
      on a local or remote system, device, or other asset. This execution may also
      rely on unknowing end users or the manipulation of device operating modes to
      run. Adversaries may infect remote targets with programmed executables or malicious
      project files that operate according to specified behavior and may alter expected
      device behavior in subtle ways. Commands for execution may also be issued from
      command-line interfaces, APIs, GUIs, or other available interfaces. Techniques
      that run malicious code may also be paired with techniques from other tactics,
      particularly to aid network [Discovery](https://attack.mitre.org/tactics/TA0102)
      and [Collection](https://attack.mitre.org/tactics/TA0100), impact operations,
      and inhibit response functions.

      https://attack.mitre.org/tactics/TA0104'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0110
    ref_id: TA0110
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Persistence
    description: 'The adversary is trying to maintain their foothold in your ICS environment.


      Persistence consists of techniques that adversaries use to maintain access to
      ICS systems and devices across restarts, changed credentials, and other interruptions
      that could cut off their access. Techniques used for persistence include any
      access, action, or configuration changes that allow them to secure their ongoing
      activity and keep their foothold on systems. This may include replacing or hijacking
      legitimate code, firmware, and other project files, or adding startup code and
      downloading programs onto devices.

      https://attack.mitre.org/tactics/TA0110'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0111
    ref_id: TA0111
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Privilege Escalation
    description: 'The adversary is trying to gain higher-level permissions.


      Privilege Escalation consists of techniques that adversaries use to gain higher-level
      permissions on a system or network. Adversaries can often enter and explore
      a network with unprivileged access but require elevated permissions to follow
      through on their objectives. Common approaches are to take advantage of system
      weaknesses, misconfigurations, and vulnerabilities.

      https://attack.mitre.org/tactics/TA0111'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0103
    ref_id: TA0103
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Evasion
    description: 'The adversary is trying to avoid security defenses.


      Evasion consists of techniques that adversaries use to avoid technical defenses
      throughout their campaign. Techniques used for evasion include removal of indicators
      of compromise, spoofing communications, and exploiting software vulnerabilities.
      Adversaries may also leverage and abuse trusted devices and processes to hide
      their activity, possibly by masquerading as master devices or native software.
      Methods of defense evasion for this purpose are often more passive in nature.

      https://attack.mitre.org/tactics/TA0103'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0102
    ref_id: TA0102
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Discovery
    description: 'The adversary is locating information to assess and identify their
      targets in your environment.


      Discovery consists of techniques that adversaries use to survey your ICS environment
      and gain knowledge about the internal network, control system devices, and how
      their processes interact. These techniques help adversaries observe the environment
      and determine next steps for target selection and Lateral Movement. They also
      allow adversaries to explore what they can control and gain insight on interactions
      between various control system processes. Discovery techniques are often an
      act of progression into the environment which enable the adversary to orient
      themselves before deciding how to act. Adversaries may use Discovery techniques
      that result in Collection, to help determine how available resources benefit
      their current objective. A combination of native device communications and functions,
      and custom tools are often used toward this post-compromise information-gathering
      objective.

      https://attack.mitre.org/tactics/TA0102'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0109
    ref_id: TA0109
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Lateral Movement
    description: 'The adversary is trying to move through your ICS environment.


      Lateral Movement consists of techniques that adversaries use to enter and control
      remote systems on a network. These techniques abuse default credentials, known
      accounts, and vulnerable services, and may also leverage dual-homed devices
      and systems that reside on both the IT and OT networks. The adversary uses these
      techniques to pivot to their next point in the environment, positioning themselves
      to where they want to be or think they should be. Following through on their
      primary objective often requires [Discovery](https://attack.mitre.org/tactics/TA0102)
      of the network and [Collection](https://attack.mitre.org/tactics/TA0100) to
      develop awareness of unique ICS devices and processes, in order to find their
      target and subsequently gain access to it. Reaching this objective often involves
      pivoting through multiple systems, devices, and accounts. Adversaries may install
      their own remote tools to accomplish Lateral Movement or leverage default tools,
      programs, and manufacturer set or other legitimate credentials native to the
      network, which may be stealthier.

      https://attack.mitre.org/tactics/TA0109'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0100
    ref_id: TA0100
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Collection
    description: "The adversary is trying to gather data of interest and domain knowledge\
      \ on your ICS environment to inform their goal.\n\nCollection consists of techniques\
      \ adversaries use to gather domain knowledge and obtain contextual feedback\
      \ in an ICS environment. This tactic is often performed as part of [Discovery](https://attack.mitre.org/tactics/TA0102),\
      \ to compile data on control systems and targets of interest that may be used\
      \ to follow through on the adversary\u2019s objective. Examples of these techniques\
      \ include observing operation states, capturing screenshots, identifying unique\
      \ device roles, and gathering system and diagram schematics. Collection of this\
      \ data can play a key role in planning, executing, and even revising an ICS-targeted\
      \ attack. Methods of collection depend on the categories of data being targeted,\
      \ which can include protocol specific, device specific, and process specific\
      \ configurations and functionality. Information collected may pertain to a combination\
      \ of system, supervisory, device, and network related data, which conceptually\
      \ fall under high, medium, and low levels of plan operations. For example, information\
      \ repositories on plant data at a high level or device specific programs at\
      \ a low level. Sensitive floor plans, vendor device manuals, and other references\
      \ may also be at risk and exposed on the internet or otherwise publicly accessible.\n\
      https://attack.mitre.org/tactics/TA0100"
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0101
    ref_id: TA0101
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Command and Control
    description: "The adversary is trying to communicate with and control compromised\
      \ systems, controllers, and platforms with access to your ICS environment.\n\
      \nCommand and Control consists of techniques that adversaries use to communicate\
      \ with and send commands to compromised systems, devices, controllers, and platforms\
      \ with specialized applications used in ICS environments. Examples of these\
      \ specialized communication devices include human machine interfaces (HMIs),\
      \ data historians, SCADA servers, and engineering workstations (EWS). Adversaries\
      \ often seek to use commonly available resources and mimic expected network\
      \ traffic to avoid detection and suspicion. For instance, commonly used ports\
      \ and protocols in ICS environments, and even expected IT resources, depending\
      \ on the target network. Command and Control may be established to varying degrees\
      \ of stealth, often depending on the victim\u2019s network structure and defenses.\n\
      https://attack.mitre.org/tactics/TA0101"
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0107
    ref_id: TA0107
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Inhibit Response Function
    description: 'The adversary is trying to prevent your safety, protection, quality
      assurance, and operator intervention functions from responding to a failure,
      hazard, or unsafe state.


      Inhibit Response Function consists of techniques that adversaries use to hinder
      the safeguards put in place for processes and products. This may involve the
      inhibition of safety, protection, quality assurance, or operator intervention
      functions to disrupt safeguards that aim to prevent the loss of life, destruction
      of equipment, and disruption of production. These techniques aim to actively
      deter and prevent expected alarms and responses that arise due to statuses in
      the ICS environment. Adversaries may modify or update system logic, or even
      outright prevent responses with a denial-of-service. They may result in the
      prevention, destruction, manipulation, or modification of programs, logic, devices,
      and communications. As prevention functions are generally dormant, reporting
      and processing functions can appear fine, but may have been altered to prevent
      failure responses in dangerous scenarios. Unlike [Evasion](https://attack.mitre.org/tactics/TA0103),
      Inhibit Response Function techniques may be more intrusive, such as actively
      preventing responses to a known dangerous scenario. Adversaries may use these
      techniques to follow through with or provide cover for [Impact](https://attack.mitre.org/tactics/TA0105)
      techniques.

      https://attack.mitre.org/tactics/TA0107'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0106
    ref_id: TA0106
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Impair Process Control
    description: 'The adversary is trying to manipulate, disable, or damage physical
      control processes.


      Impair Process Control consists of techniques that adversaries use to disrupt
      control logic and cause determinantal effects to processes being controlled
      in the target environment. Targets of interest may include active procedures
      or parameters that manipulate the physical environment. These techniques can
      also include prevention or manipulation of reporting elements and control logic.
      If an adversary has modified process functionality, then they may also obfuscate
      the results, which are often self-revealing in their impact on the outcome of
      a product or the environment. The direct physical control these techniques exert
      may also threaten the safety of operators and downstream users, which can prompt
      response mechanisms. Adversaries may follow up with or use [Inhibit Response
      Function](https://attack.mitre.org/tactics/TA0107) techniques in tandem, to
      assist with the successful abuse of control processes to result in [Impact](https://attack.mitre.org/tactics/TA0105).

      https://attack.mitre.org/tactics/TA0106'
  - urn: urn:intuitem:risk:tactic:mitre-attack-ics:ta0105
    ref_id: TA0105
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    name: Impact
    description: "The adversary is trying to manipulate, interrupt, or destroy your\
      \ ICS systems, data, and their surrounding environment.\n\nImpact consists of\
      \ techniques that adversaries use to disrupt, compromise, destroy, and manipulate\
      \ the integrity and availability of control system operations, processes, devices,\
      \ and data. These techniques encompass the influence and effects resulting from\
      \ adversarial efforts to attack the ICS environment or that tangentially impact\
      \ it. Impact techniques can result in more instantaneous disruption to control\
      \ processes and the operator, or may result in more long term damage or loss\
      \ to the ICS environment and related operations. The adversary may leverage\
      \ [Impair Process Control](https://attack.mitre.org/tactics/TA0106) techniques,\
      \ which often manifest in more self-revealing impacts on operations, or [Impair\
      \ Process Control](https://attack.mitre.org/tactics/TA0106) techniques to hinder\
      \ safeguards and alarms in order to follow through with and provide cover for\
      \ Impact. In some scenarios, control system processes can appear to function\
      \ as expected, but may have been altered to benefit the adversary\u2019s goal\
      \ over the course of a longer duration. These techniques might be used by adversaries\
      \ to follow through on their end goal or to provide cover for a confidentiality\
      \ breach.\n\n[Loss of Productivity and Revenue](https://attack.mitre.org/techniques/T0828),\
      \ [Theft of Operational Information](https://attack.mitre.org/techniques/T0882),\
      \ and [Damage to Property](https://attack.mitre.org/techniques/T0879) are meant\
      \ to encompass some of the more granular goals of adversaries in targeted and\
      \ untargeted attacks. These techniques in and of themselves are not necessarily\
      \ detectable, but the associated adversary behavior can potentially be mitigated\
      \ and/or detected.\nhttps://attack.mitre.org/tactics/TA0105"
  reference_controls:
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0800
    ref_id: M0800
    name: Authorization Enforcement
    category: technical
    csf_function: protect
    description: 'The device or system should restrict read, manipulate, or execute
      privileges to only authenticated users who require access based on approved
      security policies.  Role-based Access Control (RBAC) schemes can help reduce
      the overhead of assigning permissions to the large number of devices within
      an ICS. For example, IEC 62351 provides examples of roles used to support common
      system operations within the electric power sector  (Citation: International
      Electrotechnical Commission July 2020), while IEEE 1686 defines standard permissions
      for users of IEDs. (Citation: Institute of Electrical and Electronics Engineers
      January 2014)

      https://attack.mitre.org/mitigations/M0800'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0801
    ref_id: M0801
    name: Access Management
    category: technical
    csf_function: protect
    description: 'Access Management technologies can be used to enforce authorization
      polices and decisions, especially when existing field devices do not provide
      sufficient capabilities to support user identification and authentication. (Citation:
      McCarthy, J et al. July 2018) These technologies typically utilize an in-line
      network device or gateway system to prevent access to unauthenticated users,
      while also integrating with an authentication service to first verify user credentials.
      (Citation: Centre for the Protection of National Infrastructure November 2010)

      https://attack.mitre.org/mitigations/M0801'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0802
    ref_id: M0802
    name: Communication Authenticity
    category: technical
    csf_function: protect
    description: 'When communicating over an untrusted network, utilize secure network
      protocols that both authenticate the message sender and can verify its integrity.
      This can be done either through message authentication codes (MACs) or digital
      signatures, to detect spoofed network messages and unauthorized connections.

      https://attack.mitre.org/mitigations/M0802'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0803
    ref_id: M0803
    name: Data Loss Prevention
    category: technical
    csf_function: detect
    description: 'Data Loss Prevention (DLP) technologies can be used to help identify
      adversarial attempts to exfiltrate operational information, such as engineering
      plans, trade secrets, recipes, intellectual property, or process telemetry.
      DLP functionality may be built into other security products such as firewalls
      or standalone suites running on the network and host-based agents. DLP may be
      configured to prevent the transfer of information through corporate resources
      such as email, web, and physical media such as USB for host-based solutions.

      https://attack.mitre.org/mitigations/M0803'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0804
    ref_id: M0804
    name: Human User Authentication
    category: technical
    csf_function: protect
    description: 'Require user authentication before allowing access to data or accepting
      commands to a device. While strong multi-factor authentication is preferable,
      it is not always feasible within ICS environments. Performing strong user authentication
      also requires additional security controls and processes which are often the
      target of related adversarial techniques (e.g., Valid Accounts, Default Credentials).
      Therefore, associated ATT&CK mitigations should be considered in addition to
      this, including [Multi-factor Authentication](https://attack.mitre.org/mitigations/M0932),
      [Account Use Policies](https://attack.mitre.org/mitigations/M0936), [Password
      Policies](https://attack.mitre.org/mitigations/M0927), [User Account Management](https://attack.mitre.org/mitigations/M0918),
      [Privileged Account Management](https://attack.mitre.org/mitigations/M0926),
      and [User Account Control](https://attack.mitre.org/mitigations/M1052).

      https://attack.mitre.org/mitigations/M0804'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0805
    ref_id: M0805
    name: Mechanical Protection Layers
    category: technical
    csf_function: protect
    description: 'Utilize a layered protection design based on physical or mechanical
      protection systems to prevent damage to property, equipment, human safety, or
      the environment. Examples include interlocks, rupture disk, release values,
      etc. (Citation: A G Foord, W G Gulland, C R Howard, T Kellacher, W H Smith 2004)

      https://attack.mitre.org/mitigations/M0805'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0806
    ref_id: M0806
    name: Minimize Wireless Signal Propagation
    category: technical
    csf_function: protect
    description: 'Wireless signals frequently propagate outside of organizational
      boundaries, which provide opportunities for adversaries to monitor or gain unauthorized
      access to the wireless network. (Citation: CISA March 2010) To minimize this
      threat, organizations should implement measures to detect, understand, and reduce
      unnecessary RF propagation. (Citation: DHS  National Urban Security Technology
      Laboratory April 2019)

      https://attack.mitre.org/mitigations/M0806'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0807
    ref_id: M0807
    name: Network Allowlists
    category: technical
    csf_function: protect
    description: 'Network allowlists can be implemented through either host-based
      files or system hosts files to specify what connections (e.g., IP address, MAC
      address, port, protocol) can be made from a device. Allowlist techniques that
      operate at the  application layer (e.g., DNP3, Modbus, HTTP) are addressed in
      [Filter Network Traffic](https://attack.mitre.org/mitigations/M0937) mitigation.

      https://attack.mitre.org/mitigations/M0807'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0808
    ref_id: M0808
    name: Encrypt Network Traffic
    category: technical
    csf_function: protect
    description: 'Utilize strong cryptographic techniques and protocols to prevent
      eavesdropping on network communications.

      https://attack.mitre.org/mitigations/M0808'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0809
    ref_id: M0809
    name: Operational Information Confidentiality
    category: technical
    csf_function: protect
    description: 'Deploy mechanisms to protect the confidentiality of information
      related to operational processes, facility locations, device configurations,
      programs, or databases that may have information that can be used to infer organizational
      trade-secrets, recipes, and other intellectual property (IP).

      https://attack.mitre.org/mitigations/M0809'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0810
    ref_id: M0810
    name: Out-of-Band Communications Channel
    category: technical
    csf_function: recover
    description: 'Have alternative methods to support communication requirements during
      communication failures and data integrity attacks. (Citation: National Institute
      of Standards and Technology April 2013) (Citation: Defense Advanced Research
      Projects Agency)

      https://attack.mitre.org/mitigations/M0810'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0811
    ref_id: M0811
    name: Redundancy of Service
    category: technical
    csf_function: recover
    description: 'Redundancy could be provided for both critical ICS devices and services,
      such as back-up devices or hot-standbys.

      https://attack.mitre.org/mitigations/M0811'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0812
    ref_id: M0812
    name: Safety Instrumented Systems
    category: technical
    csf_function: protect
    description: 'Utilize Safety Instrumented Systems (SIS) to provide an additional
      layer of protection to hazard scenarios that may cause property damage. A SIS
      will typically include sensors, logic solvers, and a final control element that
      can be used to automatically respond to an hazardous condition  (Citation: A
      G Foord, W G Gulland, C R Howard, T Kellacher, W H Smith 2004) . Ensure that
      all SISs are segmented from operational networks to prevent them from being
      targeted by additional adversarial behavior.

      https://attack.mitre.org/mitigations/M0812'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0813
    ref_id: M0813
    name: Software Process and Device Authentication
    category: technical
    csf_function: protect
    description: 'Require the authentication of devices and software processes where
      appropriate. Devices that connect remotely to other systems should require strong
      authentication to prevent spoofing of communications. Furthermore, software
      processes should also require authentication when accessing APIs.

      https://attack.mitre.org/mitigations/M0813'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0814
    ref_id: M0814
    name: Static Network Configuration
    category: technical
    csf_function: protect
    description: 'Configure hosts and devices to use static network configurations
      when possible, protocols that require dynamic discovery/addressing (e.g., ARP,
      DHCP, DNS) can be used to manipulate network message forwarding and enable various
      AiTM attacks. This mitigation may not always be usable due to limited device
      features or challenges introduced with different network configurations.

      https://attack.mitre.org/mitigations/M0814'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0815
    ref_id: M0815
    name: Watchdog Timers
    category: technical
    csf_function: detect
    description: 'Utilize watchdog timers to ensure devices can quickly detect whether
      a system is unresponsive.

      https://attack.mitre.org/mitigations/M0815'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0817
    ref_id: M0817
    name: Supply Chain Management
    category: technical
    csf_function: govern
    description: 'Implement a supply chain management program, including policies
      and procedures to ensure all devices and components originate from a trusted
      supplier and are tested to verify their integrity.

      https://attack.mitre.org/mitigations/M0817'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0818
    ref_id: M0818
    name: Validate Program Inputs
    category: technical
    csf_function: protect
    description: 'Devices and programs designed to interact with control system parameters
      should validate the format and content of all user inputs and actions to ensure
      the values are within intended operational ranges. These values should be evaluated
      and further enforced through the program logic running on the field controller.
      If a problematic or invalid input is identified, the programs should either
      utilize a predetermined safe value or enter a known safe state, while also logging
      or alerting on the event.(Citation: PLCTop20 Mar 2023)

      https://attack.mitre.org/mitigations/M0818'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0913
    ref_id: M0913
    name: Application Developer Guidance
    category: technical
    csf_function: govern
    description: 'This mitigation describes any guidance or training given to developers
      of applications to avoid introducing security weaknesses that an adversary may
      be able to take advantage of.

      https://attack.mitre.org/mitigations/M0913'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0915
    ref_id: M0915
    name: Active Directory Configuration
    category: technical
    csf_function: protect
    description: 'Configure Active Directory to prevent use of certain techniques;
      use security identifier (SID) Filtering, etc.

      https://attack.mitre.org/mitigations/M0915'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0916
    ref_id: M0916
    name: Vulnerability Scanning
    category: technical
    csf_function: detect
    description: 'Vulnerability scanning is used to find potentially exploitable software
      vulnerabilities to remediate them.

      https://attack.mitre.org/mitigations/M0916'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0917
    ref_id: M0917
    name: User Training
    category: technical
    csf_function: govern
    description: 'Train users to be aware of access or manipulation attempts by an
      adversary to reduce the risk of successful spearphishing, social engineering,
      and other techniques that involve user interaction.

      https://attack.mitre.org/mitigations/M0917'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0918
    ref_id: M0918
    name: User Account Management
    category: technical
    csf_function: protect
    description: 'Manage the creation, modification, use, and permissions associated
      to user accounts.

      https://attack.mitre.org/mitigations/M0918'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0919
    ref_id: M0919
    name: Threat Intelligence Program
    category: technical
    csf_function: protect
    description: 'A threat intelligence program helps an organization generate their
      own threat intelligence information and track trends to inform defensive priorities
      to mitigate risk.

      https://attack.mitre.org/mitigations/M0919'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0920
    ref_id: M0920
    name: SSL/TLS Inspection
    category: technical
    csf_function: protect
    description: 'Break and inspect SSL/TLS sessions to look at encrypted web traffic
      for adversary activity.

      https://attack.mitre.org/mitigations/M0920'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0921
    ref_id: M0921
    name: Restrict Web-Based Content
    category: technical
    csf_function: protect
    description: 'Restrict use of certain websites, block downloads/attachments, block
      Javascript, restrict browser extensions, etc.

      https://attack.mitre.org/mitigations/M0921'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0922
    ref_id: M0922
    name: Restrict File and Directory Permissions
    category: technical
    csf_function: protect
    description: 'Restrict access by setting directory and file permissions that are
      not specific to users or privileged accounts.

      https://attack.mitre.org/mitigations/M0922'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0924
    ref_id: M0924
    name: Restrict Registry Permissions
    category: technical
    csf_function: protect
    description: 'Restrict the ability to modify certain hives or keys in the Windows
      Registry.

      https://attack.mitre.org/mitigations/M0924'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0926
    ref_id: M0926
    name: Privileged Account Management
    category: technical
    csf_function: protect
    description: 'Manage the creation, modification, use, and permissions associated
      to privileged accounts, including SYSTEM and root.

      https://attack.mitre.org/mitigations/M0926'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0927
    ref_id: M0927
    name: Password Policies
    category: technical
    csf_function: protect
    description: 'Set and enforce secure password policies for accounts.

      https://attack.mitre.org/mitigations/M0927'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0928
    ref_id: M0928
    name: Operating System Configuration
    category: technical
    csf_function: protect
    description: 'Make configuration changes related to the operating system or a
      common feature of the operating system that result in system hardening against
      techniques.

      https://attack.mitre.org/mitigations/M0928'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0930
    ref_id: M0930
    name: Network Segmentation
    category: technical
    csf_function: protect
    description: 'Architect sections of the network to isolate critical systems, functions,
      or resources. Use physical and logical segmentation to prevent access to potentially
      sensitive systems and information. Use a DMZ to contain any internet-facing
      services that should not be exposed from the internal network.  Restrict network
      access to only required systems and services. In addition, prevent systems from
      other networks or business functions (e.g., enterprise) from accessing critical
      process control systems. For example, in IEC 62443, systems within the same
      secure level should be grouped into a zone, and access to that zone is restricted
      by a conduit, or mechanism to restrict data flows between zones by segmenting
      the network. (Citation: IEC February 2019) (Citation: IEC August 2013)

      https://attack.mitre.org/mitigations/M0930'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0931
    ref_id: M0931
    name: Network Intrusion Prevention
    category: technical
    csf_function: detect
    description: 'Use intrusion detection signatures to block traffic at network boundaries.  In
      industrial control environments, network intrusion prevention should be configured
      so it will not disrupt protocols and communications responsible for real-time
      functions related to control or safety.

      https://attack.mitre.org/mitigations/M0931'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0932
    ref_id: M0932
    name: Multi-factor Authentication
    category: technical
    csf_function: protect
    description: 'Use two or more pieces of evidence to authenticate to a system;
      such as username and password in addition to a token from a physical smart card
      or token generator.  Within industrial control environments assets such as low-level
      controllers, workstations, and HMIs have real-time operational control and safety
      requirements which may restrict the use of multi-factor.

      https://attack.mitre.org/mitigations/M0932'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0934
    ref_id: M0934
    name: Limit Hardware Installation
    category: technical
    csf_function: protect
    description: 'Block users or groups from installing or using unapproved hardware
      on systems, including USB devices.

      https://attack.mitre.org/mitigations/M0934'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0935
    ref_id: M0935
    name: Limit Access to Resource Over Network
    category: technical
    csf_function: protect
    description: 'Prevent access to file shares, remote access to systems, unnecessary
      services. Mechanisms to limit access may include use of network concentrators,
      RDP gateways, etc.

      https://attack.mitre.org/mitigations/M0935'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0936
    ref_id: M0936
    name: Account Use Policies
    category: technical
    csf_function: protect
    description: 'Configure features related to account use like login attempt lockouts,
      specific login times, etc.

      https://attack.mitre.org/mitigations/M0936'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0937
    ref_id: M0937
    name: Filter Network Traffic
    category: technical
    csf_function: protect
    description: 'Use network appliances to filter ingress or egress traffic and perform
      protocol-based filtering. Configure software on endpoints to filter network
      traffic.   Perform inline allow/denylisting of network messages based on the
      application layer (OSI Layer 7) protocol, especially for automation protocols.
      Application allowlists are beneficial when there are well-defined communication
      sequences, types, rates, or patterns needed during expected system operations.
      Application denylists may be needed if all acceptable communication sequences
      cannot be defined, but instead a set of known malicious uses can be denied (e.g.,
      excessive communication  attempts, shutdown messages, invalid commands).  Devices
      performing these functions are often referred to as deep-packet inspection (DPI)
      firewalls, context-aware firewalls, or firewalls blocking specific automation/SCADA
      protocol aware firewalls. (Citation: Centre for the Protection of National Infrastructure
      February 2005)

      https://attack.mitre.org/mitigations/M0937'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0938
    ref_id: M0938
    name: Execution Prevention
    category: technical
    csf_function: protect
    description: 'Block execution of code on a system through application control,
      and/or script blocking.

      https://attack.mitre.org/mitigations/M0938'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0941
    ref_id: M0941
    name: Encrypt Sensitive Information
    category: technical
    csf_function: protect
    description: 'Protect sensitive data-at-rest with strong encryption.

      https://attack.mitre.org/mitigations/M0941'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0942
    ref_id: M0942
    name: Disable or Remove Feature or Program
    category: technical
    csf_function: protect
    description: 'Remove or deny access to unnecessary and potentially vulnerable
      software to prevent abuse by adversaries.

      https://attack.mitre.org/mitigations/M0942'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0944
    ref_id: M0944
    name: Restrict Library Loading
    category: technical
    csf_function: protect
    description: 'Prevent abuse of library loading mechanisms in the operating system
      and software to load untrusted code by configuring appropriate library loading
      mechanisms and investigating potential vulnerable software.

      https://attack.mitre.org/mitigations/M0944'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0945
    ref_id: M0945
    name: Code Signing
    category: technical
    csf_function: protect
    description: 'Enforce binary and application integrity with digital signature
      verification to prevent untrusted code from executing.

      https://attack.mitre.org/mitigations/M0945'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0946
    ref_id: M0946
    name: Boot Integrity
    category: technical
    csf_function: protect
    description: 'Use secure methods to boot a system and verify the integrity of
      the operating system and loading mechanisms.

      https://attack.mitre.org/mitigations/M0946'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0947
    ref_id: M0947
    name: Audit
    category: technical
    csf_function: protect
    description: 'Perform audits or scans of systems, permissions, insecure software,
      insecure configurations, etc. to identify potential weaknesses. Perform periodic
      integrity checks of the device to validate the correctness of the firmware,
      software, programs, and configurations. Integrity checks, which typically include
      cryptographic hashes or digital signatures, should be compared to those obtained
      at known valid states, especially after events like device reboots, program
      downloads, or program restarts.

      https://attack.mitre.org/mitigations/M0947'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0948
    ref_id: M0948
    name: Application Isolation and Sandboxing
    category: technical
    csf_function: protect
    description: 'Restrict the execution of code to a virtual environment on or in-transit
      to an endpoint system.

      https://attack.mitre.org/mitigations/M0948'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0949
    ref_id: M0949
    name: Antivirus/Antimalware
    category: technical
    csf_function: detect
    description: 'Use signatures or heuristics to detect malicious software.  Within
      industrial control environments, antivirus/antimalware installations should
      be limited to assets that are not involved in critical or real-time operations.
      To minimize the impact to system availability, all products should first be
      validated within a representative test environment before deployment to production
      systems. (Citation: NCCIC August 2018)

      https://attack.mitre.org/mitigations/M0949'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0950
    ref_id: M0950
    name: Exploit Protection
    category: technical
    csf_function: detect
    description: 'Use capabilities to detect and block conditions that may lead to
      or be indicative of a software exploit occurring.

      https://attack.mitre.org/mitigations/M0950'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0951
    ref_id: M0951
    name: Update Software
    category: technical
    csf_function: protect
    description: 'Perform regular software updates to mitigate exploitation risk.
      Software updates may need to be scheduled around operational down times.

      https://attack.mitre.org/mitigations/M0951'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0953
    ref_id: M0953
    name: Data Backup
    category: technical
    csf_function: recover
    description: 'Take and store data backups from end user systems and critical servers.
      Ensure backup and storage systems are hardened and kept separate from the corporate
      network to prevent compromise.   Maintain and exercise incident response plans  (Citation:
      Department of Homeland Security October 2009), including the management of  ''gold-copy''
      back-up images and configurations for key systems to enable quick recovery and
      response from adversarial activities that impact control, view, or availability.

      https://attack.mitre.org/mitigations/M0953'
  - urn: urn:intuitem:risk:function:mitre-attack-ics:m0954
    ref_id: M0954
    name: Software Configuration
    category: technical
    csf_function: protect
    description: 'Implement configuration changes to software (other than the operating
      system) to mitigate security risks associated with how the software operates.

      https://attack.mitre.org/mitigations/M0954'
  techniques:
  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0800
    ref_id: T0800
    name: Activate Firmware Update Mode
    description: 'Adversaries may activate firmware update mode on devices to prevent
      expected response functions from engaging in reaction to an emergency or process
      malfunction. For example, devices such as protection relays may have an operation
      mode designed for firmware installation. This mode may halt process monitoring
      and related functions to allow new firmware to be loaded. A device left in update
      mode may be placed in an inactive holding state if no firmware is provided to
      it. By entering and leaving a device in this mode, the adversary may deny its
      usual functionalities.

      https://attack.mitre.org/techniques/T0800'
