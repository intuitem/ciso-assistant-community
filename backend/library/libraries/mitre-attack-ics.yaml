  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0843.001
    ref_id: T0843.001
    name: Download All
    description: 'Adversaries may execute a full program download to a PLC to overwrite
      the entire PLC program and configuration to deploy a new project or make major
      changes. This typically requires stopping the PLC and adversely impacting control
      processes.


      The ability to perform a full program download to the PLC typically relies on
      access to a workstation with the vendor-specific PLC programming software installed.

      https://attack.mitre.org/techniques/T0843/001'
