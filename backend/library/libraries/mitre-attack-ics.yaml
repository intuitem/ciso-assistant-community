  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0827
    ref_id: T0827
    name: Loss of Control
    description: 'Adversaries may seek to achieve a sustained loss of control or a
      runaway condition in which operators cannot issue any commands even if the malicious
      interference has subsided. (Citation: Corero) (Citation: Michael J. Assante
      and Robert M. Lee) (Citation: Tyson Macaulay)


      The German Federal Office for Information Security (BSI) reported a targeted
      attack on a steel mill in its 2014 IT Security Report.(Citation: BSI State of
      IT Security 2014) These targeted attacks affected industrial operations and
      resulted in breakdowns of control system components and even entire installations.
      As a result of these breakdowns, massive impact resulted in damage and unsafe
      conditions from the uncontrolled shutdown of a blast furnace.

      https://attack.mitre.org/techniques/T0827'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
