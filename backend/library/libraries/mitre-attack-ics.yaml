  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0887
    ref_id: T0887
    name: Wireless Sniffing
    description: "Adversaries may seek to capture radio frequency (RF) communication\
      \ used for remote control and reporting in distributed environments. RF communication\
      \ frequencies vary between 3 kHz to 300 GHz, although are commonly between 300\
      \ MHz to 6 GHz. (Citation: Candell, R., Hany, M., Lee, K. B., Liu,Y., Quimby,\
      \ J., Remley, K. April 2018)  The wavelength and frequency of the signal affect\
      \ how the signal propagates through open air, obstacles (e.g. walls and trees)\
      \ and the type of radio required to capture them. These characteristics are\
      \ often standardized in the protocol and hardware and may have an effect on\
      \ how the signal is captured. Some examples of wireless protocols that may be\
      \ found in cyber-physical environments are: WirelessHART, Zigbee, WIA-FA, and\
      \ 700 MHz Public Safety Spectrum. \n\nAdversaries may capture RF communications\
      \ by using specialized hardware, such as software defined radio (SDR), handheld\
      \ radio, or a computer with radio demodulator tuned to the communication frequency.\
      \ (Citation: Bastille April 2017) Information transmitted over a wireless medium\
      \ may be captured in-transit whether the sniffing device is the intended destination\
      \ or not. This technique may be particularly useful to an adversary when the\
      \ communications are not encrypted. (Citation: Gallagher, S. April 2017) \n\n\
      In the 2017 Dallas Siren incident, it is suspected that adversaries likely captured\
      \ wireless command message broadcasts on a 700 MHz frequency during a regular\
      \ test of the system. These messages were later replayed to trigger the alarm\
      \ systems. (Citation: Gallagher, S. April 2017)\nhttps://attack.mitre.org/techniques/T0887"
