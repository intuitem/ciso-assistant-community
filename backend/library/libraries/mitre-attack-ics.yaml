  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0883
    ref_id: T0883
    name: Internet Accessible Device
    description: "Adversaries may gain access into industrial environments through\
      \ systems exposed directly to the internet for remote access rather than through\
      \ [External Remote Services](https://attack.mitre.org/techniques/T0822). Internet\
      \ Accessible Devices are exposed to the internet unintentionally or intentionally\
      \ without adequate protections. This may allow for adversaries to move directly\
      \ into the control system network. Access onto these devices is accomplished\
      \ without the use of exploits, these would be represented within the [Exploit\
      \ Public-Facing Application](https://attack.mitre.org/techniques/T0819) technique.\n\
      \nAdversaries may leverage built in functions for remote access which may not\
      \ be protected or utilize minimal legacy protections that may be targeted. (Citation:\
      \ NCCIC January 2014) These services may be discoverable through the use of\
      \ online scanning tools. \n\nIn the case of the Bowman dam incident, adversaries\
      \ leveraged access to the dam control network through a cellular modem. Access\
      \ to the device was protected by password authentication, although the application\
      \ was vulnerable to brute forcing. (Citation: NCCIC January 2014) (Citation:\
      \ Danny Yadron December 2015) (Citation: Mark Thompson March 2016)\n\nIn Trend\
      \ Micros manufacturing deception operations adversaries were detected leveraging\
      \ direct internet access to an ICS environment through the exposure of operational\
      \ protocols such as Siemens S7, Omron FINS, and EtherNet/IP, in addition to\
      \ misconfigured VNC access. (Citation: Stephen Hilt, Federico Maggi, Charles\
      \ Perine, Lord Remorin, Martin Rsler, and Rainer Vosseler)\nhttps://attack.mitre.org/techniques/T0883"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
