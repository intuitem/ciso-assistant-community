  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0869
    ref_id: T0869
    name: Standard Application Layer Protocol
    description: 'Adversaries may establish command and control capabilities over
      commonly used application layer protocols such as HTTP(S), OPC, RDP, telnet,
      DNP3, and modbus. These protocols may be used to disguise adversary actions
      as benign network traffic. Standard protocols may be seen on their associated
      port or in some cases over a non-standard port.  Adversaries may use these protocols
      to reach out of the network for command and control, or in some cases to other
      infected devices within the network.

      https://attack.mitre.org/techniques/T0869'
