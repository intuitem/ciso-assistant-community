  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0822
    ref_id: T0822
    name: External Remote Services
    description: "Adversaries may leverage external remote services as a point of\
      \ initial access into your network. These services allow users to connect to\
      \ internal network resources from external locations. Examples are VPNs, Citrix,\
      \ and other access mechanisms. Remote service gateways often manage connections\
      \ and credential authentication for these services. (Citation: Daniel Oakley,\
      \ Travis Smith, Tripwire)\n\nExternal remote services allow administration of\
      \ a control system from outside the system. Often, vendors and internal engineering\
      \ groups have access to external remote services to control system networks\
      \ via the corporate network. In some cases, this access is enabled directly\
      \ from the internet. While remote access enables ease of maintenance when a\
      \ control system is in a remote area, compromise of remote access solutions\
      \ is a liability. The adversary may use these services to gain access to and\
      \ execute attacks against a control system network. Access to valid accounts\
      \ is often a requirement. \n\nAs they look for an entry point into the control\
      \ system network, adversaries may begin searching for existing point-to-point\
      \ VPN implementations at trusted third party networks or through remote support\
      \ employee connections where split tunneling is enabled. (Citation: Electricity\
      \ Information Sharing and Analysis Center; SANS Industrial Control Systems March\
      \ 2016)\nhttps://attack.mitre.org/techniques/T0822"
