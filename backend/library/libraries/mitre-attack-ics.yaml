  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0819
    ref_id: T0819
    name: Exploit Public-Facing Application
    description: 'Adversaries may leverage weaknesses to exploit internet-facing software
      for initial access into an industrial network. Internet-facing software may
      be user applications, underlying networking implementations, an assets operating
      system, weak defenses, etc. Targets of this technique may be intentionally exposed
      for the purpose of remote management and visibility.


      An adversary may seek to target public-facing applications as they may provide
      direct access into an ICS environment or the ability to move into the ICS network.
      Publicly exposed applications may be found through online tools that scan the
      internet for open ports and services. Version numbers for the exposed application
      may provide adversaries an ability to target specific known vulnerabilities.
      Exposed control protocol or remote access ports found in Commonly Used Port
      may be of interest by adversaries.

      https://attack.mitre.org/techniques/T0819'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
