  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1695.002
    ref_id: T1695.002
    name: Ethernet
    description: 'Adversaries may block access to Ethernet communications to prevent
      instructions or configurations messages from reaching target systems and devices.
      Ethernet connections allow for communications between IT and OT systems and
      devices. Blocking Ethernet communications may also block command and reporting
      messages.(Citation: Bonnie Zhu, Anthony Joseph, Shankar Sastry 2011)


      An adversary may block Ethernet communications by disabling network interfaces,
      [Service Stop](https://attack.mitre.org/techniques/T0881), or conducting an
      [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T0830) attack
      and dropping the network traffic.

      https://attack.mitre.org/techniques/T1695/002'
