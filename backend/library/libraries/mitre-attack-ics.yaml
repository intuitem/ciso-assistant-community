  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0861
    ref_id: T0861
    name: Point & Tag Identification
    description: "Adversaries may collect point and tag values to gain a more comprehensive\
      \ understanding of the process environment. Points may be values such as inputs,\
      \ memory locations, outputs or other process specific variables. (Citation:\
      \ Dennis L. Sloatman September 2016) Tags are the identifiers given to points\
      \ for operator convenience. \n\nCollecting such tags provides valuable context\
      \ to environmental points and enables an adversary to map inputs, outputs, and\
      \ other values to their control processes. Understanding the points being collected\
      \ may inform an adversary on which processes and values to keep track of over\
      \ the course of an operation.\nhttps://attack.mitre.org/techniques/T0861"
