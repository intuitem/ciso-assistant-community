  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0888
    ref_id: T0888
    name: Remote System Information Discovery
    description: "An adversary may attempt to get detailed information about remote\
      \ systems and their peripherals, such as make/model, role, and configuration.\
      \ Adversaries may use information from Remote System Information Discovery to\
      \ aid in targeting and shaping follow-on behaviors. For example, the system's\
      \ operational role and model information can dictate whether it is a relevant\
      \ target for the adversary's operational objectives. In addition, the system's\
      \ configuration may be used to scope subsequent technique usage. \n\nRequests\
      \ for system information are typically implemented using automation and management\
      \ protocols and are often automatically requested by vendor software during\
      \ normal operation. This information may be used to tailor management actions,\
      \ such as program download and system or module firmware. An adversary may leverage\
      \ this same information by issuing calls directly to the system's API.\nhttps://attack.mitre.org/techniques/T0888"
