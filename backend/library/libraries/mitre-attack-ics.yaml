  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0828
    ref_id: T0828
    name: Loss of Productivity and Revenue
    description: "Adversaries may cause loss of productivity and revenue through disruption\
      \ and even damage to the availability and integrity of control system operations,\
      \ devices, and related processes. This technique may manifest as a direct effect\
      \ of an ICS-targeting attack or tangentially, due to an IT-targeting attack\
      \ against non-segregated environments. \n\nIn cases where these operations or\
      \ services are brought to a halt, the loss of productivity may eventually present\
      \ an impact for the end-users or consumers of products and services. The disrupted\
      \ supply-chain may result in supply shortages and increased prices, among other\
      \ consequences. \n\nA ransomware attack on an Australian beverage company resulted\
      \ in the shutdown of some manufacturing sites, including precautionary halts\
      \ to protect key systems. (Citation: Paganini, Pierluigi June 2020) The company\
      \ announced the potential for temporary shortages of their products following\
      \ the attack. (Citation: Paganini, Pierluigi June 2020) (Citation: Lion Corporation\
      \ June 2020) \n\nIn the 2021 Colonial Pipeline ransomware incident, the pipeline\
      \ was unable to transport approximately 2.5 million barrels of fuel per day\
      \ to the East Coast.  (Citation: Colonial Pipeline Company May 2021)\nhttps://attack.mitre.org/techniques/T0828"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-ics:ta0105
    reference_controls:
    - urn:intuitem:risk:function:mitre-attack-ics:m0953
  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0829
    ref_id: T0829
    name: Loss of View
    description: 'Adversaries may cause a sustained or permanent loss of view where
      the ICS equipment will require local, hands-on operator intervention; for instance,
      a restart or manual operation. By causing a sustained reporting or visibility
      loss, the adversary can effectively hide the present state of operations. This
      loss of view can occur without affecting the physical processes themselves.
      (Citation: Corero) (Citation: Michael J. Assante and Robert M. Lee) (Citation:
      Tyson Macaulay)

      https://attack.mitre.org/techniques/T0829'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-ics:ta0105
