    - urn:intuitem:risk:function:mitre-attack-ics:m0942
  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0809
    ref_id: T0809
    name: Data Destruction
    description: 'Adversaries may perform data destruction over the course of an operation.
      The adversary may drop or create malware, tools, or other non-native files on
      a target system to accomplish this, potentially leaving behind traces of malicious
      activities. Such non-native files and other data may be removed over the course
      of an intrusion to maintain a small footprint or as a standard part of the post-intrusion
      cleanup process. (Citation: Enterprise ATT&CK January 2018)


      Data destruction may also be used to render operator interfaces unable to respond
      and to disrupt response functions from occurring as expected. An adversary may
      also destroy data backups that are vital to recovery after an incident.


      Standard file deletion commands are available on most operating system and device
      interfaces to perform cleanup, but adversaries may use other tools as well.
      Two examples are Windows Sysinternals SDelete and Active@ Killdisk.

      https://attack.mitre.org/techniques/T0809'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
