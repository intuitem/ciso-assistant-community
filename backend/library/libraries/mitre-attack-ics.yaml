    - urn:intuitem:risk:function:mitre-attack-ics:m0930
  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0806
    ref_id: T0806
    name: Brute Force I/O
    description: "Adversaries may repetitively or successively change I/O point values\
      \ to perform an action. Brute Force I/O may be achieved by changing either a\
      \ range of I/O point values or a single point value repeatedly to manipulate\
      \ a process function. The adversary's goal and the information they have about\
      \ the target environment will influence which of the options they choose. In\
      \ the case of brute forcing a range of point values, the adversary may be able\
      \ to achieve an impact without targeting a specific point. In the case where\
      \ a single point is targeted, the adversary may be able to generate instability\
      \ on the process function associated with that particular point. \n\nAdversaries\
      \ may use Brute Force I/O to cause failures within various industrial processes.\
      \ These failures could be the result of wear on equipment or damage to downstream\
      \ equipment.\nhttps://attack.mitre.org/techniques/T0806"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
