  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0834
    ref_id: T0834
    name: Native API
    description: "Adversaries may directly interact with the native OS application\
      \ programming interface (API) to access system functions. Native APIs provide\
      \ a controlled means of calling low-level OS services within the kernel, such\
      \ as those involving hardware/devices, memory, and processes. (Citation: The\
      \ MITRE Corporation May 2017) These native APIs are leveraged by the OS during\
      \ system boot (when other system components are not yet initialized) as well\
      \ as carrying out tasks and requests during routine operations. \n\nFunctionality\
      \ provided by native APIs are often also exposed to user-mode applications via\
      \ interfaces and libraries. For example, functions such as memcpy and direct\
      \ operations on memory registers can be used to modify user and system memory\
      \ space.\nhttps://attack.mitre.org/techniques/T0834"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
