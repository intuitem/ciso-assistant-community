    name: Wi-Fi
    description: 'Adversaries may block access to Wi-Fi communications to prevent
      messages from reaching target systems and devices. Wi-Fi connections allow for
      communications between IT and OT systems and devices. Blocking Wi-Fi communications
      may also block command and reporting messages.(Citation: Bonnie Zhu, Anthony
      Joseph, Shankar Sastry 2011)


      An adversary may block Wi-Fi communications by disabling network interfaces,
      [Service Stop](https://attack.mitre.org/techniques/T0881), conducting an [Adversary-in-the-Middle](https://attack.mitre.org/techniques/T0830)
      attack and dropping the network traffic, or by jamming the Wi-Fi signal.

      https://attack.mitre.org/techniques/T1695/003'
