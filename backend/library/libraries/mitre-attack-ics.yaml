  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0890
    ref_id: T0890
    name: Exploitation for Privilege Escalation
    description: "Adversaries may exploit software vulnerabilities in an attempt to\
      \ elevate privileges. Exploitation of a software vulnerability occurs when an\
      \ adversary takes advantage of a programming error in a program, service, or\
      \ within the operating system software or kernel itself to execute adversary-controlled\
      \ code. Security constructs such as permission levels will often hinder access\
      \ to information and use of certain techniques, so adversaries will likely need\
      \ to perform privilege escalation to include use of software exploitation to\
      \ circumvent those restrictions. (Citation: The MITRE Corporation) \n\nWhen\
      \ initially gaining access to a system, an adversary may be operating within\
      \ a lower privileged process which will prevent them from accessing certain\
      \ resources on the system. Vulnerabilities may exist, usually in operating system\
      \ components and software commonly running at higher permissions, that can be\
      \ exploited to gain higher levels of access on the system. This could enable\
      \ someone to move from unprivileged or user level permissions to SYSTEM or root\
      \ permissions depending on the component that is vulnerable. This may be a necessary\
      \ step for an adversary compromising an endpoint system that has been properly\
      \ configured and limits other privilege escalation methods. (Citation: The MITRE\
      \ Corporation)\nhttps://attack.mitre.org/techniques/T0890"
