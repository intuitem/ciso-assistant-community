  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0874
    ref_id: T0874
    name: Hooking
    description: 'Adversaries may hook into application programming interface (API)
      functions used by processes to redirect calls for execution and privilege escalation
      means. Windows processes often leverage these API functions to perform tasks
      that require reusable system resources. Windows API functions are typically
      stored in dynamic-link libraries (DLLs) as exported functions. (Citation: Enterprise
      ATT&CK)


      One type of hooking seen in ICS involves redirecting calls to these functions
      via import address table (IAT) hooking. IAT hooking uses modifications to a
      process IAT, where pointers to imported API functions are stored. (Citation:
      Nicolas Falliere, Liam O Murchu, Eric Chien February 2011)

      https://attack.mitre.org/techniques/T0874'
