  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0815
    ref_id: T0815
    name: Denial of View
    description: "Adversaries may cause a denial of view in attempt to disrupt and\
      \ prevent operator oversight on the status of an ICS environment. This may manifest\
      \ itself as a temporary communication failure between a device and its control\
      \ source, where the interface recovers and becomes available once the interference\
      \ ceases. (Citation: Corero) (Citation: Michael J. Assante and Robert M. Lee)\
      \ (Citation: Tyson Macaulay) \n\nAn adversary may attempt to deny operator visibility\
      \ by preventing them from receiving status and reporting messages. Denying this\
      \ view may temporarily block and prevent operators from noticing a change in\
      \ state or anomalous behavior. The environment's data and processes may still\
      \ be operational, but functioning in an unintended or adversarial manner.\n\
      https://attack.mitre.org/techniques/T0815"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
