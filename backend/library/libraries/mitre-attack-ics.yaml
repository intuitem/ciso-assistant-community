  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0848
    ref_id: T0848
    name: Rogue Master
    description: "Adversaries may setup a rogue master to leverage control server\
      \ functions to communicate with outstations. A rogue master can be used to send\
      \ legitimate control messages to other control system devices, affecting processes\
      \ in unintended ways. It may also be used to disrupt network communications\
      \ by capturing and receiving the network traffic meant for the actual master.\
      \ Impersonating a master may also allow an adversary to avoid detection. \n\n\
      In the case of the 2017 Dallas Siren incident, adversaries used a rogue master\
      \ to send command messages to the 156 distributed sirens across the city, either\
      \ through a single rogue transmitter with a strong signal, or using many distributed\
      \ repeaters. (Citation: Bastille April 2017) (Citation: Zack Whittaker April\
      \ 2017)\nhttps://attack.mitre.org/techniques/T0848"
