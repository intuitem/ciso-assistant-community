  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0846.003
    ref_id: T0846.003
    name: Multicast Discovery
    description: "Adversaries may perform multicast discovery requests which is when\
      \ one system or device sends messages to all systems and devices in a pre-defined\
      \ group on a network (or subnet) and then waits for a response. If a response\
      \ is received that means the system or device that responded is live and can\
      \ communicate over that protocol.  Multicast discovery tends to be stealthier\
      \ than broadcast discovery because every system or device on the network (or\
      \ subnet) is not being messaged. \n\nOne common OT protocol that has a multicast\
      \ discovery mechanism is the Process Field Network (PROFINET) Discovery and\
      \ Configuration Protocol (DCP) with its Identify All requests.(Citation: Cisco\
      \ Active Discovery)\nhttps://attack.mitre.org/techniques/T0846/003"
