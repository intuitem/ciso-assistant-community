  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0846.002
    ref_id: T0846.002
    name: Broadcast Discovery
    description: "Adversaries may perform broadcast discovery requests to enumerate\
      \ systems and devices on a network. Broadcast discovery works by one system\
      \ or device sending messages to all systems and devices on a network (or subnet)\
      \ and then waiting for a response. If a response is received that means the\
      \ system or device that responded is live and can communicate over that protocol.\
      \ Adversaries may leverage different protocols supported on the network for\
      \ sending broadcast messages. \n\nSome common OT protocols that have broadcast\
      \ discovery mechanisms are Building Automation and Control Network (BACNet)\
      \ Who-Is requests, Common Industrial Protocol (CIP) List Identity User Datagram\
      \ Protocol (UDP) broadcast requests, and Siemens S7 broadcast identification\
      \ requests.(Citation: Broadcasting BACnet)(Citation: Cisco Active Discovery)\n\
      https://attack.mitre.org/techniques/T0846/002"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
