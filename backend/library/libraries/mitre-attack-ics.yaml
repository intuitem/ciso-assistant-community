  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1694.002
    ref_id: T1694.002
    name: Hardcoded Credentials
    description: 'Adversaries may leverage credentials that are hardcoded in software
      or firmware to gain an unauthorized interactive user session to an asset. Examples
      credentials that may be hardcoded in an asset include:


      * Username/Passwords

      * Cryptographic keys/Certificates

      * API tokens


      Unlike [Default Credentials](https://attack.mitre.org/techniques/T0812), these
      credentials are built into the system in a way that they either cannot be changed
      by the asset owner, or may be infeasible to change because of the impact it
      would cause to the control system operation. These credentials may be reused
      across whole product lines or device models and are often not published or known
      to the owner and operators of the asset.(Citation: ICS-ALERT-13-164-01)(Citation:
      OT IceFall)


      Adversaries may utilize these hardcoded credentials to move throughout the control
      system environment or provide reliable access for their tools to interact with
      industrial assets.

      https://attack.mitre.org/techniques/T1694/002'
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
