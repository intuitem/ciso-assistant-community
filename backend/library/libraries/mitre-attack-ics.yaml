    - urn:intuitem:risk:function:mitre-attack-ics:m0953
  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0830
    ref_id: T0830
    name: Adversary-in-the-Middle
    description: "Adversaries with privileged network access may seek to modify network\
      \ traffic in real time using adversary-in-the-middle (AiTM) attacks. (Citation:\
      \ Gabriel Sanchez October 2017) This type of attack allows the adversary to\
      \ intercept traffic to and/or from a particular device on the network. If a\
      \ AiTM attack is established, then the adversary has the ability to block, log,\
      \ modify, or inject traffic into the communication stream. There are several\
      \ ways to accomplish this attack, but some of the most-common are Address Resolution\
      \ Protocol (ARP) poisoning and the use of a proxy. (Citation: Bonnie Zhu, Anthony\
      \ Joseph, Shankar Sastry 2011)  \n\nAn AiTM attack may allow an adversary to\
      \ perform the following attacks:  \n[Block Reporting Message](https://attack.mitre.org/techniques/T0804),\
      \ [Spoof Reporting Message](https://attack.mitre.org/techniques/T0856), [Modify\
      \ Parameter](https://attack.mitre.org/techniques/T0836), [Unauthorized Command\
      \ Message](https://attack.mitre.org/techniques/T0855)\nhttps://attack.mitre.org/techniques/T0830"
