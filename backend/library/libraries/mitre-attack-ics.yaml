  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0877
    ref_id: T0877
    name: I/O Image
    description: "Adversaries may seek to capture process values related to the inputs\
      \ and outputs of a PLC. During the scan cycle, a PLC reads the status of all\
      \ inputs and stores them in an image table. (Citation: Nanjundaiah, Vaidyanath)\
      \ The image table is the PLCs internal storage location where values of inputs/outputs\
      \ for one scan are stored while it executes the user program. After the PLC\
      \ has solved the entire logic program, it updates the output image table. The\
      \ contents of this output image table are written to the corresponding output\
      \ points in I/O Modules.\n\nThe Input and Output Image tables described above\
      \ make up the I/O Image on a PLC. This image is used by the user program instead\
      \ of directly interacting with physical I/O. (Citation: Spenneberg, Ralf 2016)\
      \ \n\nAdversaries may collect the I/O Image state of a PLC by utilizing a devices\
      \ [Native API](https://attack.mitre.org/techniques/T0834) to access the memory\
      \ regions directly. The collection of the PLCs I/O state could be used to replace\
      \ values or inform future stages of an attack.\nhttps://attack.mitre.org/techniques/T0877"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
    - urn:intuitem:risk:tactic:mitre-attack-ics:ta0100
