  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1694
    ref_id: T1694
    name: Insecure Credentials
    description: "Adversaries may target insecure credentials as a means to persist\
      \ on a system or device or move laterally from one system or device to another.\
      \ Insecure credentials may appear as default credentials which are pre-configured\
      \ credentials on a system, device, or software that are well-known in documentation\
      \ or hard-coded credentials which are built into the system, device, or software\
      \ that cannot be changed or not easily changed because of the impact on control\
      \ processes.(Citation: NIST SP 800-82r3)(Citation: ICS-ALERT-13-164-01)(Citation:\
      \ OT IceFall)\n Adversaries often times use insecure credentials to evade detection\
      \ as they are typically forgotten about by system and device owners.\nhttps://attack.mitre.org/techniques/T1694"
