  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0826
    ref_id: T0826
    name: Loss of Availability
    description: "Adversaries may attempt to disrupt essential components or systems\
      \ to prevent owner and operator from delivering products or services. (Citation:\
      \ Corero) (Citation: Michael J. Assante and Robert M. Lee) (Citation: Tyson\
      \ Macaulay) \n\nAdversaries may leverage malware to delete or encrypt critical\
      \ data on HMIs, workstations, or databases.\n\nIn the 2021 Colonial Pipeline\
      \ ransomware incident, pipeline operations were temporally halted on May 7th\
      \ and were not fully restarted until May 12th. (Citation: Colonial Pipeline\
      \ Company May 2021)\nhttps://attack.mitre.org/techniques/T0826"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
