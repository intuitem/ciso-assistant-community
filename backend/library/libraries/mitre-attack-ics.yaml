  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1691.002
    ref_id: T1691.002
    name: Reporting Message
    description: 'Adversaries may block or prevent a reporting message from reaching
      its intended target. In control systems, reporting messages contain telemetry
      data (e.g., I/O values) pertaining to the current state of equipment and the
      industrial process. By blocking these reporting messages, an adversary can potentially
      hide their actions from an operator.


      Blocking reporting messages in control systems that manage physical processes
      may contribute to system impact, causing inhibition of a response function.
      A control system may not be able to respond in a proper or timely manner to
      an event, such as a dangerous fault, if its corresponding reporting message
      is blocked.(Citation: Bonnie Zhu, Anthony Joseph, Shankar Sastry 2011)(Citation:
      Electricity Information Sharing and Analysis Center; SANS Industrial Control
      Systems March 2016)

      https://attack.mitre.org/techniques/T1691/002'
