  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1693.002
    ref_id: T1693.002
    name: Module Firmware
    description: 'Adversaries may install malicious or vulnerable firmware onto modular
      hardware devices. Control system devices often contain modular hardware devices.
      These devices may have their own set of firmware that is separate from the firmware
      of the main control system equipment.


      This technique is similar to System Firmware, but is conducted on other system
      components that may not have the same capabilities or level of integrity checking.
      Although it results in a device re-image, malicious device firmware may provide
      persistent access to remaining devices.(Citation: Daniel Peck,  Dale Peterson
      January 2009)


      An easy point of access for an adversary is the Ethernet card, which may have
      its own CPU, RAM, and operating system. The adversary may attack and likely
      exploit the computer on an Ethernet card. Exploitation of the Ethernet card
      computer may enable the adversary to accomplish additional attacks, such as
      the following:(Citation: Daniel Peck,  Dale Peterson January 2009)


      * Delayed Attack - The adversary may stage an attack in advance and choose when
      to launch it, such as at a particularly damaging time.

      * Brick the Ethernet Card - Malicious firmware may be programmed to result in
      an Ethernet card failure, requiring a factory return.

      * Random Attack or Failure - The adversary may load malicious firmware onto
      multiple field devices. Execution of an attack and the time it occurs is generated
      by a pseudo-random number generator.

      * A Field Device Worm - The adversary may choose to identify all field devices
      of the same model, with the end goal of performing a device-wide compromise.

      * Attack Other Cards on the Field Device - Although it is not the most important
      module in a field device, the Ethernet card is most accessible to the adversary
      and malware. Compromise of the Ethernet card may provide a more direct route
      to compromising other modules, such as the CPU module.

      https://attack.mitre.org/techniques/T1693/002'
