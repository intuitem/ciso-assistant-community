  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0893
    ref_id: T0893
    name: Data from Local System
    description: 'Adversaries may target and collect data from local system sources,
      such as file systems, configuration files, or local databases. This can include
      sensitive data such as specifications, schematics, or diagrams of control system
      layouts, devices, and processes.


      Adversaries may do this using [Command-Line Interface](https://attack.mitre.org/techniques/T0807)
      or [Scripting](https://attack.mitre.org/techniques/T0853) techniques to interact
      with the file system to gather information. Adversaries may also use [Automated
      Collection](https://attack.mitre.org/techniques/T0802) on the local system.

      https://attack.mitre.org/techniques/T0893'
