  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0862
    ref_id: T0862
    name: Supply Chain Compromise
    description: "Adversaries may perform supply chain compromise to gain control\
      \ systems environment access by means of infected products, software, and workflows.\
      \ Supply chain compromise is the manipulation of products, such as devices or\
      \ software, or their delivery mechanisms before receipt by the end consumer.\
      \ Adversary compromise of these products and mechanisms is done for the goal\
      \ of data or system compromise, once infected products are introduced to the\
      \ target environment. \n\nSupply chain compromise can occur at all stages of\
      \ the supply chain, from manipulation of development tools and environments\
      \ to manipulation of developed products and tools distribution mechanisms. This\
      \ may involve the compromise and replacement of legitimate software and patches,\
      \ such as on third party or vendor websites. Targeting of supply chain compromise\
      \ can be done in attempts to infiltrate the environments of a specific audience.\
      \ In control systems environments with assets in both the IT and OT networks,\
      \ it is possible a supply chain compromise affecting the IT environment could\
      \ enable further access to the OT environment.   \n\nCounterfeit devices may\
      \ be introduced to the global supply chain posing safety and cyber risks to\
      \ asset owners and operators. These devices may not meet the safety, engineering\
      \ and manufacturing requirements of regulatory bodies but may feature tagging\
      \ indicating conformance with industry standards. Due to the lack of adherence\
      \ to standards and overall lesser quality, the counterfeit products may pose\
      \ a serious safety and operational risk. (Citation: Control Global May 2019)\
      \ \n\nYokogawa identified instances in which their customers received counterfeit\
      \ differential pressure transmitters using the Yokogawa logo. The counterfeit\
      \ transmitters were nearly indistinguishable with a semblance of functionality\
      \ and interface that mimics the genuine product. (Citation: Control Global May\
      \ 2019) \n\nF-Secure Labs analyzed the approach the adversary used to compromise\
      \ victim systems with Havex. (Citation: Daavid Hentunen, Antti Tikkanen June\
      \ 2014) The adversary planted trojanized software installers available on legitimate\
      \ ICS/SCADA vendor websites. After being downloaded, this software infected\
      \ the host computer with a Remote Access Trojan (RAT).\nhttps://attack.mitre.org/techniques/T0862"
