  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0832
    ref_id: T0832
    name: Manipulation of View
    description: "Adversaries may attempt to manipulate the information reported back\
      \ to operators or controllers. This manipulation may be short term or sustained.\
      \ During this time the process itself could be in a much different state than\
      \ what is reported. (Citation: Corero) (Citation: Michael J. Assante and Robert\
      \ M. Lee) (Citation: Tyson Macaulay) \n\nOperators may be fooled into doing\
      \ something that is harmful to the system in a loss of view situation. With\
      \ a manipulated view into the systems, operators may issue inappropriate control\
      \ sequences that introduce faults or catastrophic failures into the system.\
      \ Business analysis systems can also be provided with inaccurate data leading\
      \ to bad management decisions.\nhttps://attack.mitre.org/techniques/T0832"
    catalog_urn: urn:intuitem:risk:ttp_catalog:mitre-attack-ics
    tactics:
