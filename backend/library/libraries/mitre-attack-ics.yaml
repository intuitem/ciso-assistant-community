  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t1693.001
    ref_id: T1693.001
    name: System Firmware
    description: 'System firmware on modern assets is often designed with an update
      feature. Older device firmware may be factory installed and require special
      reprograming equipment. When available, the firmware update feature enables
      vendors to remotely patch bugs and perform upgrades. Device firmware updates
      are often delegated to the user and may be done using a software update package.
      It may also be possible to perform this task over the network.


      An adversary may exploit the firmware update feature on accessible devices to
      upload malicious or out-of-date firmware. Malicious modification of device firmware
      may provide an adversary with root access to a device, given firmware is one
      of the lowest programming abstraction layers.(Citation: Basnight, Zachry, et
      al.)

      https://attack.mitre.org/techniques/T1693/001'
