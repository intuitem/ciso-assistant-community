  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0823
    ref_id: T0823
    name: Graphical User Interface
    description: 'Adversaries may attempt to gain access to a machine via a Graphical
      User Interface (GUI) to enhance execution capabilities. Access to a GUI allows
      a user to interact with a computer in a more visual manner than a CLI. A GUI
      allows users to move a cursor and click on interface objects, with a mouse and
      keyboard as the main input devices, as opposed to just using the keyboard.


      If physical access is not an option, then access might be possible via protocols
      such as VNC on Linux-based and Unix-based operating systems, and RDP on Windows
      operating systems. An adversary can use this access to execute programs and
      applications on the target machine.

      https://attack.mitre.org/techniques/T0823'
