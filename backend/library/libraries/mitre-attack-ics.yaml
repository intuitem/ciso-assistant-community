  - urn: urn:intuitem:risk:technique:mitre-attack-ics:t0879
    ref_id: T0879
    name: Damage to Property
    description: "Adversaries may cause damage and destruction of property to infrastructure,\
      \ equipment, and the surrounding environment when attacking control systems.\
      \ This technique may result in device and operational equipment breakdown, or\
      \ represent tangential damage from other techniques used in an attack. Depending\
      \ on the severity of physical damage and disruption caused to control processes\
      \ and systems, this technique may result in [Loss of Safety](https://attack.mitre.org/techniques/T0880).\
      \ Operations that result in [Loss of Control](https://attack.mitre.org/techniques/T0827)\
      \ may also cause damage to property, which may be directly or indirectly motivated\
      \ by an adversary seeking to cause impact in the form of [Loss of Productivity\
      \ and Revenue](https://attack.mitre.org/techniques/T0828). \n\n\nThe German\
      \ Federal Office for Information Security (BSI) reported a targeted attack on\
      \ a steel mill under an incidents affecting business section of its 2014 IT\
      \ Security Report. (Citation: BSI State of IT Security 2014)  These targeted\
      \ attacks affected industrial operations and resulted in breakdowns of control\
      \ system components and even entire installations. As a result of these breakdowns,\
      \ massive impact and damage resulted from the uncontrolled shutdown of a blast\
      \ furnace. \n\nA Polish student used a remote controller device to interface\
      \ with the Lodz city tram system in Poland. (Citation: John Bill May 2017) (Citation:\
      \ Shelley Smith February 2008) (Citation: Bruce Schneier January 2008) Using\
      \ this remote, the student was able to capture and replay legitimate tram signals.\
      \ This resulted in damage to impacted trams, people, and the surrounding property.\
      \ Reportedly, four trams were derailed and were forced to make emergency stops.\
      \ (Citation: Shelley Smith February 2008) Commands issued by the student may\
      \ have also resulted in tram collisions, causing harm to those on board and\
      \ the environment outside. (Citation: Bruce Schneier January 2008)\nhttps://attack.mitre.org/techniques/T0879"
