              p3: "Politiques qui citent encore les numéros ou intitulés de mesures de 2013 après la transition vers la version 2022"
            a.5.2:
              q1: "Montrez-moi où sont définis les rôles et responsabilités en matière de sécurité, y compris les propriétaires d'actifs et de risques."
              q2: "Choisissez un propriétaire d'actif dans votre inventaire. Peut-il me dire ce dont il est responsable en matière de sécurité ?"
              q3: "Comment vous assurez-vous que les personnes occupant des rôles de sécurité ont, et conservent, les compétences requises ?"
