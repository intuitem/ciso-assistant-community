              p1: "Les développeurs peuvent pousser directement en production sans second approbateur dans la chaîne de déploiement"
              p2: "Les administrateurs approuvent leurs propres demandes d'accès ou leurs propres changements"
              p3: "Exception « petite équipe » invoquée sans aucune revue compensatoire des journaux"
            a.5.4:
              q1: "Où exprimez-vous ce que vous attendez des managers en matière de sécurité, et comment cela se retrouve-t-il dans leurs objectifs ou leurs entretiens annuels ?"
              q2: "Comment la direction s'assure-t-elle que les managers et le personnel appliquent réellement les politiques de sécurité au quotidien ?"
              q3: "Donnez-moi un exemple où un manager a fait appliquer ou remonté une règle de sécurité au sein de son équipe."
