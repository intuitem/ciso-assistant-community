            a.5.1:
              q1: "Montrez-moi la politique de sécurité de haut niveau et les politiques thématiques qui en découlent. Qui a approuvé chacune d'elles, et quand ?"
              q2: "Comment le personnel et les parties externes concernées sont-ils informés d'une politique nouvelle ou modifiée, et comment savez-vous qu'ils en ont pris connaissance ?"
              q3: "Choisissez une politique thématique et décrivez-moi sa dernière revue : qu'est-ce qui l'a déclenchée et qu'est-ce qui a changé ?"
              r1: "Politique de sécurité de l'information avec signature ou trace d'approbation et historique des versions"
              r2: "Liste des politiques thématiques avec propriétaire, version, date de dernière revue et date de prochaine revue"
              r3: "Enregistrements de prise de connaissance des politiques par les salariés et les prestataires"
              r4: "Comptes rendus ou tickets attestant la dernière revue des politiques"
