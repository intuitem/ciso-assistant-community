urn: urn:intuitem:risk:library:audit-guide-iso27001-2022
locale: en
ref_id: audit-guide-iso27001-2022
name: ISO/IEC 27001:2022 auditor guide
description: What a certification auditor will ask for each requirement of ISO/IEC 27001:2022 (questions, records, sampling, pitfalls, who answers) and the sessions a Stage 2 audit runs. Written in our own words; copy and adapt it to make your own.
copyright: intuitem
version: 1
publication_date: 2026-11-19
provider: intuitem
packager: intuitem
autoload: true
translations:
  fr:
    name: Guide de l'auditeur ISO/IEC 27001:2022
    description: Ce que demandera un auditeur de certification pour chaque exigence d'ISO/IEC 27001:2022 (questions, enregistrements, échantillonnage, écarts fréquents, interlocuteurs) et les séances d'un audit d'étape 2. Rédigé avec nos propres mots ; copiez-le et adaptez-le pour créer le vôtre.
objects:
  audit_guides:
    - urn: urn:intuitem:risk:audit_guide:iso27001-2022
      ref_id: iso27001-2022
      name: ISO/IEC 27001:2022 auditor guide
      framework: urn:intuitem:risk:framework:iso27001-2022
      entries:
        "4.1":
          questions:
            - {id: q1, stage: 1, who: [ciso, top], text: "Show me where you recorded the internal and external issues that shape your ISMS, and when that list was last revisited."}
            - {id: q2, stage: 1, who: [top], text: "Did you decide whether climate change matters for your information security? Walk me through how you reached that answer."}
            - {id: q3, stage: 2, who: [ciso], text: "Pick one issue on this list and show me where it turned into a risk, an objective or a control."}
          requests:
            - {id: r1, label: "Context analysis (internal and external issues, e.g. PESTLE/SWOT) with date and owner", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.context}
            - {id: r2, label: "Record of the decision on climate change relevance (auditors expect the reasoning, the standard does not mandate it)", kind: document}
            - {id: r3, label: "Management review minutes showing the issues list was revisited", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "issues", population: "issues listed in the context analysis", method: "trace each issue to a risk register entry, objective or control"}
          interviewees: [top, ciso]
          pitfalls:
            - {id: p1, text: "No decision at all on whether climate change is relevant (required by 4.1 since Amendment 1:2024, so a likely nonconformity); a bare one-line dismissal usually draws a question or an improvement point, as 4.1 asks for no written reasoning"}
            - {id: p2, text: "Context analysis written once for certification and never updated after a reorganisation, acquisition or move to cloud"}
            - {id: p3, text: "Issues listed but disconnected from the risk assessment, so the auditor cannot see how they influenced anything"}
        "4.2":
          questions:
            - {id: q1, stage: 1, who: [ciso, legal, dpo], text: "Who are the interested parties that matter to your ISMS, and what does each of them expect from you on security?"}
            - {id: q2, stage: 1, who: [ciso], text: "Which of those expectations have you chosen to address through the ISMS, and which have you left out?"}
            - {id: q3, stage: 2, who: [legal, ciso], text: "Take a customer contract or a regulation from this list and show me the controls that satisfy it."}
            - {id: q4, stage: 2, who: [legal], text: "Do any of your interested parties have climate-related expectations, such as resilience commitments from customers or regulators?"}
          requests:
            - {id: r1, label: "Interested parties register with requirements and which ones the ISMS addresses", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.context}
            - {id: r2, label: "Legal, regulatory and contractual requirements register (links to A.5.31)", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.legal}
            - {id: r3, label: "Sample customer contract or DPA with security clauses", kind: record}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "requirements", population: "legal, regulatory and contractual obligations in the register", method: "trace each to an implemented control and its evidence"}
          interviewees: [ciso, legal, dpo]
          pitfalls:
            - {id: p1, text: "Register lists parties but not their actual requirements, or does not say which requirements the ISMS will address (an explicit 2022 expectation)"}
            - {id: p2, text: "Major customer contract with specific security clauses (breach notification hours, audit rights) missing from the register"}
            - {id: p3, text: "No review of interested parties after a new regulation (NIS2, DORA) came into force"}
        "4.3":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Read me your scope statement. Which locations, teams, products and systems are in, and what is excluded?"}
            - {id: q2, stage: 1, who: [ciso, it_lead], text: "Where something is left out, how do you handle the connections and hand-offs with it?"}
            - {id: q4, stage: 1, who: [ciso, top], text: "Which of your context issues and stakeholder requirements shaped where you drew the scope boundary?"}
            - {id: q3, stage: 2, who: [ciso], text: "This team or site I saw on your org chart: is it in scope? Show me how the scope document says so."}
          requests:
            - {id: r1, label: "ISMS scope statement (documented, approved, versioned)", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.scope}
            - {id: r2, label: "List of links and hand-offs with what sits outside scope, including outsourced and cloud services", kind: document}
            - {id: r3, label: "Network or architecture diagram matching the scope boundary", kind: technical, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.is_map}
          sampling: []
          interviewees: [ciso, top, it_lead]
          pitfalls:
            - {id: p1, text: "Scope wording on the certificate draft does not match the scope statement or the website marketing claims"}
            - {id: p2, text: "Excluded areas share networks, admins or data with in-scope systems and those interfaces are not addressed (certification bodies also expect each exclusion to be explained)"}
            - {id: p3, text: "Cloud providers and remote workers ignored when drawing the boundary"}
        "4.4":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me how your ISMS processes connect: which outputs feed which inputs?"}
            - {id: q2, stage: 2, who: [ciso], text: "How do you know the ISMS is maintained and improved, not just documented? Give me an example of something that changed this year."}
          requests:
            - {id: r1, label: "ISMS manual or process map showing processes, owners and interactions", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.overview}
            - {id: r2, label: "Change log or version history of ISMS documents over the last 12 months", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [ciso]
          pitfalls:
            - {id: p1, text: "Documents exist for each clause but nobody can explain how outputs of one process feed the next (e.g. audit results into management review)"}
            - {id: p2, text: "No evidence of any improvement since the last audit, suggesting the ISMS is static"}
        "5.1":
          questions:
            - {id: q1, stage: 2, who: [top], text: "What is your personal role in the ISMS? Tell me in your own words what the security objectives are."}
            - {id: q2, stage: 2, who: [top], text: "Give me an example where you allocated budget or people to information security in the last year."}
            - {id: q3, stage: 2, who: [top], text: "How does security show up in the way the business already runs, such as budgeting, projects or purchasing?"}
          requests:
            - {id: r1, label: "Evidence of resources approved for the ISMS (budget line, headcount, tool purchase)", kind: record, fresh_days: 400}
            - {id: r2, label: "Top management communications on information security (all-hands slide, memo, intranet post)", kind: record, fresh_days: 400}
            - {id: r3, label: "Management review attendance list showing top management presence", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review}
          sampling: []
          interviewees: [top]
          pitfalls:
            - {id: p1, text: "CEO or managing director delegates the whole interview to the CISO and cannot name the policy or objectives"}
            - {id: p2, text: "Security spend requests repeatedly deferred, visible in risk treatment plan delays"}
            - {id: p3, text: "Top management does not attend management review, only signs the minutes afterwards"}
        "5.2":
          questions:
            - {id: q1, stage: 1, who: [top, ciso], text: "Show me your information security policy. Who approved it and when?"}
            - {id: q2, stage: 1, who: [top], text: "Read me the lines that set the policy's intent. Does it say how objectives are set, commit you to meeting the security requirements that apply to you, and promise to keep getting better?"}
            - {id: q3, stage: 2, who: [ciso, staff], text: "How did staff and relevant external parties get this policy? Show me."}
          requests:
            - {id: r1, label: "Information security policy, signed or approved by top management, with version and date", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.main}
            - {id: r2, label: "Evidence the policy was communicated internally and made available to relevant interested parties (acknowledgements also serve A.5.1)", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "staff", population: "in-scope employees and contractors", method: "ask whether they know where the policy is and what it means for their role"}
          interviewees: [top, ciso, staff]
          pitfalls:
            - {id: p1, text: "Policy approved by the CISO only, not by top management"}
            - {id: p2, text: "Policy misses a required element: objectives or a way to set them, a commitment to meet applicable requirements, or a commitment to keep improving"}
            - {id: p3, text: "Policy text no longer matches the current ISMS, for example it still cites the 2013 Annex A"}
        "5.3":
          questions:
            - {id: q1, stage: 1, who: [top], text: "Who answers for the ISMS meeting the standard, and who briefs top management on how it is doing?"}
            - {id: q2, stage: 2, who: [hr], text: "Show me where security responsibilities are written into job descriptions or a RACI."}
            - {id: q3, stage: 2, who: [ciso], text: "You are listed as owner of this process. Tell me what you do as owner."}
          requests:
            - {id: r1, label: "ISMS roles and responsibilities document or RACI", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.raci}
            - {id: r2, label: "Appointment letter or org chart naming the ISMS manager / CISO", kind: document}
            - {id: r3, label: "Job descriptions for key security roles", kind: document}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "role holders", population: "named owners in the RACI (risk owners, control owners)", method: "interview to confirm they know and perform the role"}
          interviewees: [top, ciso, hr]
          pitfalls:
            - {id: p1, text: "Named risk or control owners who have left the company or do not know they hold the role"}
            - {id: p2, text: "Nobody formally assigned to report ISMS performance to top management"}
        "6.1.1":
          questions:
            - {id: q1, stage: 1, who: [ciso, risk], text: "Take your context issues and stakeholder expectations: which risks and opportunities for the ISMS itself did they produce?"}
            - {id: q2, stage: 2, who: [ciso], text: "Show me one opportunity you identified and what you did with it."}
          requests:
            - {id: r1, label: "Register of ISMS-level risks and opportunities (distinct from or part of the information security risk register)", kind: document}
            - {id: r2, label: "Plan of actions on ISMS risks and opportunities, showing which ISMS process carries each and how you will know it worked", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [ciso, risk]
          pitfalls:
            - {id: p1, text: "Only information security risks considered; risks to the ISMS achieving its outcomes (loss of key staff, budget cuts) ignored"}
            - {id: p2, text: "Opportunities never identified or recorded"}
        "6.1.2":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Walk me through your risk assessment methodology: criteria for acceptance, how you score likelihood and consequence."}
            - {id: q2, stage: 1, who: [ciso], text: "If two people scored the same risk a year apart, why would they land on the same answer?"}
            - {id: q3, stage: 2, who: [risk, ciso], text: "Show me the latest risk assessment. When was it done and what triggered it?"}
            - {id: q4, stage: 2, who: [risk], text: "For this risk, who is the owner? Let me ask them about it."}
          requests:
            - {id: r1, label: "Risk assessment methodology with acceptance criteria and scales", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.risk}
            - {id: r2, label: "Risk register / latest risk assessment results with owners", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.risk_register}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "risks", population: "risk register entries, weighted to high risks", method: "check scoring against methodology, interview owner, follow to treatment"}
          interviewees: [risk, ciso]
          pitfalls:
            - {id: p1, text: "Risk criteria or the assessment method not defined, so results cannot be repeated or compared"}
            - {id: p2, text: "Risks without named owners, or owners are the CISO for everything"}
            - {id: p3, text: "Scores do not match the documented scales, or acceptance criteria are not defined"}
        "6.1.3":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me your Statement of Applicability. For each excluded Annex A control, why is it excluded?"}
            - {id: q2, stage: 1, who: [ciso], text: "You picked your controls from your risks. How did you then check Annex A for anything you overlooked?"}
            - {id: q3, stage: 2, who: [risk, top], text: "Who approved the risk treatment plan and accepted the residual risks?"}
            - {id: q4, stage: 2, who: [ciso], text: "This control says implemented in the SoA. Show me it working."}
          requests:
            - {id: r1, label: "Statement of Applicability: every necessary control (the 93 Annex A ones plus any you added), why each is included or excluded, and whether it is implemented", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.soa}
            - {id: r2, label: "Risk treatment plan with actions, owners, deadlines and status", kind: record, fresh_days: 200}
            - {id: r3, label: "Risk owner approval of the plan and acceptance of residual risk", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "controls", population: "SoA entries marked applicable and implemented", method: "request evidence of operation for each"}
          interviewees: [risk, ciso, top]
          pitfalls:
            - {id: p1, text: "SoA still on the 2013 structure (114 controls) or missing the 11 new 2022 controls such as threat intelligence and data masking"}
            - {id: p2, text: "Exclusions justified with 'not applicable' only, or excluded controls that are clearly needed by the risks"}
            - {id: p3, text: "Treatment plan overdue items with no rescheduling or residual risk acceptance by the owner"}
        "6.2":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me your information security objectives. How are they measured and who owns each?"}
            - {id: q2, stage: 2, who: [ciso], text: "Where are you against these objectives today? Show me the data."}
            - {id: q3, stage: 2, who: [top, ciso], text: "What happens when an objective is missed?"}
            - {id: q4, stage: 2, who: [ciso, top], text: "Which risks or requirements drove these objectives, and when did you last revise them?"}
          requests:
            - {id: r1, label: "Objectives list: target, owner, budget or people, due date and how progress is measured", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.so_register}
            - {id: r2, label: "Progress tracking against objectives (dashboard or report)", kind: record, fresh_days: 100}
          sampling: []
          interviewees: [ciso, top]
          pitfalls:
            - {id: p1, text: "Objectives are vague ('improve security') with no measurable target or date"}
            - {id: p2, text: "Objectives set but never monitored; no data at the audit"}
            - {id: p3, text: "Objectives not consistent with the policy or not communicated to those who must deliver them"}
            - {id: p4, text: "Objectives and indicators exist, but no plan for each: what will be done, with which resources, by whom, by when and how the result is judged"}
        "6.3":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "How do you decide that a change to the ISMS needs formal planning?"}
            - {id: q2, stage: 2, who: [ciso], text: "Tell me about a significant ISMS change this year, such as scope, structure or a key outsourcing. Show me how it was planned."}
          requests:
            - {id: r1, label: "Criteria for when an ISMS change needs planning (good practice, not required by 6.3)", kind: document}
            - {id: r2, label: "Evidence a recent ISMS change was planned before it was made (auditors commonly look for purpose, impact, resources and owner)", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 1, max: 2, unit: "changes", population: "ISMS-level changes in the last 12 months", method: "check planning was done before the change, not after"}
          interviewees: [ciso]
          pitfalls:
            - {id: p1, text: "Confused with operational change management (A.8.32); no evidence of planning for changes to the ISMS itself"}
            - {id: p2, text: "Reorganisation or scope extension carried out with no sign it was planned beforehand"}
        "7.1":
          questions:
            - {id: q1, stage: 1, who: [top, ciso], text: "How did you decide what the ISMS needs in people, budget and tools, and where is that recorded?"}
            - {id: q2, stage: 2, who: [ciso], text: "Is any resource you asked for still missing, and what does that hold back?"}
            - {id: q3, stage: 2, who: [ciso], text: "How much of your working time actually goes to the ISMS?"}
          requests:
            - {id: r1, label: "ISMS budget or resource plan", kind: record, fresh_days: 400}
            - {id: r2, label: "Staffing of security roles (org chart, FTE allocation)", kind: document}
          sampling: []
          interviewees: [top, ciso]
          pitfalls:
            - {id: p1, text: "CISO role held part-time by an IT manager with no protected time, and treatment plan slips confirm under-resourcing"}
            - {id: p2, text: "Resource needs never formally assessed or discussed in management review"}
        "7.2":
          questions:
            - {id: q1, stage: 1, who: [ciso, hr], text: "For admins, developers and the ISMS team, what skills did you decide each role needs?"}
            - {id: q2, stage: 2, who: [hr], text: "Show me the competence evidence for your ISMS manager and internal auditor."}
            - {id: q3, stage: 2, who: [hr], text: "Tell me about someone who lacked a skill their role needs. What did you do, and how do you know it helped?"}
          requests:
            - {id: r1, label: "Competence matrix or requirements per security role", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.competency}
            - {id: r2, label: "Training certificates, CVs or qualifications for key ISMS roles", kind: record}
            - {id: r3, label: "Evaluation of training effectiveness", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "people", population: "holders of security-relevant roles (admins, developers, auditors)", method: "compare required competence to retained evidence"}
          interviewees: [hr, ciso]
          pitfalls:
            - {id: p1, text: "No retained evidence (training, qualification or experience) that the internal auditor is competent"}
            - {id: p2, text: "Training attended but no evaluation of whether it was effective"}
            - {id: p3, text: "Competence requirements not defined for admins or developers"}
        "7.3":
          questions:
            - {id: q1, stage: 1, who: [hr], text: "What must every person in scope know about security, and where is that set out?"}
            - {id: q2, stage: 2, who: [staff], text: "What does the information security policy mean for your daily work?"}
            - {id: q3, stage: 2, who: [staff], text: "What would you do if you clicked a suspicious link or lost your laptop?"}
            - {id: q4, stage: 2, who: [staff], text: "What happens here if someone does not follow the security rules?"}
          requests:
            - {id: r1, label: "Awareness programme plan and content", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_plan}
            - {id: r2, label: "Awareness completion records for in-scope staff", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_register}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "staff", population: "staff met during the site tour and interviews, including new joiners", method: "short conversational questions on policy, reporting and their role"}
          interviewees: [staff, hr]
          pitfalls:
            - {id: p1, text: "Staff cannot say how their own role contributes to security"}
            - {id: p2, text: "Contractors and new joiners missing from completion records"}
        "7.4":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which security topics do you communicate inside and outside the company, when, to whom and through which channel?"}
            - {id: q2, stage: 2, who: [legal, ciso], text: "Give me an example of a security communication to an external party, such as a customer or authority."}
          requests:
            - {id: r1, label: "Communication plan or matrix (topic, audience, timing, channel; owner optional)", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.com}
            - {id: r2, label: "Examples of internal and external security communications", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [ciso, legal]
          pitfalls:
            - {id: p1, text: "No defined communication with regulators or customers for incidents, despite contractual obligations"}
            - {id: p2, text: "Plan exists but none of the communications listed can be evidenced"}
        "7.5.1":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me the documented information the standard requires and what you added yourselves."}
            - {id: q2, stage: 1, who: [ciso], text: "How did you decide how much documentation your organisation needs?"}
          requests:
            - {id: r1, label: "Master list of ISMS documents and records", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.doc_register}
            - {id: r2, label: "Documented information the standard requires: scope, policy, objectives, risk assessment and treatment process, SoA, plus the records asked for by 7.2, 8.1 to 8.3, 9.1, 9.2, 9.3 and 10.2", kind: document}
          sampling: []
          interviewees: [ciso]
          pitfalls:
            - {id: p1, text: "A required item missing, most often evidence of competence, monitoring results or internal audit programme"}
            - {id: p2, text: "Procedures listed in the master list that do not exist or are drafts"}
        "7.5.2":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "How does a document get its name, version and owner, and who signs it off before it is published? Show me the history of one."}
            - {id: q2, stage: 2, who: [ciso], text: "Who approved this policy revision and where is that recorded?"}
          requests:
            - {id: r1, label: "How documents are identified, formatted and approved (a written procedure is optional)", kind: document}
            - {id: r2, label: "Approval records for recent document revisions", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "documents", population: "ISMS policies and procedures", method: "check version, owner, approval and review date"}
          interviewees: [ciso]
          pitfalls:
            - {id: p1, text: "Documents with no version, owner or approval record"}
            - {id: p2, text: "Different versions of the same policy in circulation (intranet vs shared drive)"}
        "7.5.3":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "How are ISMS documents approved, versioned, distributed and retired, and how long do you keep records?"}
            - {id: q2, stage: 2, who: [ciso], text: "How do you make sure people use the current version and obsolete versions are withdrawn?"}
            - {id: q3, stage: 2, who: [it_lead], text: "Where do records live, who can alter them, and when do you delete them?"}
            - {id: q4, stage: 2, who: [ciso], text: "How do you keep track of documents you did not write, such as standards or supplier manuals?"}
          requests:
            - {id: r1, label: "Record retention schedule", kind: document}
            - {id: r2, label: "Access rights on the ISMS document repository", kind: technical, fresh_days: 400}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "documents", population: "documents found at point of use during the tour", method: "compare against the current master list version"}
          interviewees: [ciso, it_lead]
          pitfalls:
            - {id: p1, text: "Printed or locally saved outdated procedures in use"}
            - {id: p2, text: "Everyone has edit rights on the ISMS repository"}
        "8.1":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which processes, including outsourced ones, did you identify as needing planning and control for security?"}
            - {id: q2, stage: 2, who: [it_lead], text: "Pick a process that delivers a risk treatment action: what does done right look like, and how do you check it?"}
            - {id: q3, stage: 2, who: [proc], text: "Which processes are outsourced, and how do you control them?"}
            - {id: q4, stage: 2, who: [it_lead], text: "Tell me about a change that did not go to plan. What did you do about the side effects?"}
          requests:
            - {id: r1, label: "List of outsourced processes and bought-in services the ISMS depends on, with how each is controlled", kind: document}
            - {id: r2, label: "Operational records showing processes carried out as planned (e.g. backup logs, patch reports)", kind: record, fresh_days: 100}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "processes", population: "operational security processes and outsourced services", method: "check criteria exist and records prove execution"}
          interviewees: [it_lead, ciso, proc]
          pitfalls:
            - {id: p1, text: "Outsourced IT or cloud services not listed as outsourced processes, so nothing controls them"}
            - {id: p2, text: "Processes run, but nothing kept to prove they ran when and how they should"}
        "8.2":
          questions:
            - {id: q1, stage: 1, who: [risk], text: "Are the results of each risk assessment cycle kept, or only today's register?"}
            - {id: q2, stage: 2, who: [risk], text: "How often do you reassess risks, and what triggers an unscheduled reassessment?"}
            - {id: q3, stage: 2, who: [risk], text: "Show me the assessment you did after your last significant change."}
          requests:
            - {id: r1, label: "Risk assessment results from each scheduled cycle (last two)", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.risk_register}
            - {id: r2, label: "Ad-hoc risk assessment following a significant change or incident", kind: record}
          sampling:
            - {id: s1, min: 1, max: 2, unit: "changes", population: "significant changes in the last 12 months", method: "check a risk assessment was triggered and recorded"}
          interviewees: [risk]
          pitfalls:
            - {id: p1, text: "Reassessment done annually but never triggered by changes such as a new SaaS platform or acquisition"}
            - {id: p2, text: "Results not retained, only the current snapshot of the register"}
            - {id: p3, text: "Reassessments not done at the intervals the organisation planned itself, or not triggered by significant changes"}
        "8.3":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which treatment actions are due before Stage 2, and which are already done?"}
            - {id: q2, stage: 2, who: [risk], text: "Show me progress on the risk treatment plan. Which actions are complete and how do you know they work?"}
            - {id: q3, stage: 2, who: [ciso, risk], text: "What happens to treatment actions that miss their deadline?"}
          requests:
            - {id: r1, label: "Risk treatment plan status report", kind: record, fresh_days: 100}
            - {id: r2, label: "Evidence of completed treatment actions", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "treatment actions", population: "actions due in the last 12 months", method: "verify completion evidence and update of residual risk"}
          interviewees: [risk, ciso]
          pitfalls:
            - {id: p1, text: "Actions marked done without evidence or without updating the residual risk score"}
            - {id: p2, text: "Large backlog of overdue actions with no escalation"}
        "9.1":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which numbers tell you the ISMS is working, where do they come from, and who looks at them?"}
            - {id: q2, stage: 2, who: [ciso], text: "Show me the latest measurement results and what decision they led to."}
            - {id: q3, stage: 2, who: [sec_ops], text: "Which of these numbers would move if a control stopped working?"}
            - {id: q4, stage: 2, who: [ciso], text: "If someone else measured this KPI next quarter, would they get a comparable number? And how do you conclude the ISMS is effective overall?"}
          requests:
            - {id: r1, label: "KPI catalogue: each metric with its source, cadence, who collects it and who interprets it", kind: document}
            - {id: r2, label: "Latest KPI / metrics report with analysis", kind: record, fresh_days: 100}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "metrics", population: "KPIs in the measurement plan", method: "check data source, frequency met and results used"}
          interviewees: [ciso, sec_ops]
          pitfalls:
            - {id: p1, text: "Metrics count activity (number of trainings) without saying anything about effectiveness"}
            - {id: p2, text: "Results collected but never analysed or reported to management"}
            - {id: p3, text: "Nobody named for collecting or interpreting the metrics"}
        "9.2.1":
          questions:
            - {id: q1, stage: 1, who: [auditor], text: "Has a full internal audit been carried out yet, and which parts of the ISMS did it cover?"}
            - {id: q2, stage: 2, who: [auditor], text: "Over its cycle, does your audit programme cover all ISMS clauses and the applicable Annex A controls? Show me where."}
            - {id: q3, stage: 2, who: [auditor], text: "Did the audit test your own procedures as well as the standard? Where does the report show it?"}
            - {id: q4, stage: 2, who: [ciso, auditor], text: "Who ran the internal audit, how do you know they are competent on the current edition of the standard, and that they did not audit their own work?"}
          requests:
            - {id: r1, label: "Internal audit report(s) with findings (certification bodies expect at least one internal audit cycle covering the ISMS before Stage 2)", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:pol.audit}
            - {id: r2, label: "Internal audit checklists and evidence notes", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "audit findings", population: "findings from the last internal audit", method: "trace to corrective action and closure"}
          interviewees: [auditor, ciso]
          pitfalls:
            - {id: p1, text: "No internal audit cycle completed before Stage 2; certification bodies expect one and often raise its absence as a major finding"}
            - {id: p2, text: "Internal audit is a checklist tick-off with no evidence recorded"}
            - {id: p3, text: "Applicable Annex A controls skipped across the whole programme, with only policies ever audited"}
        "9.2.2":
          questions:
            - {id: q1, stage: 1, who: [auditor], text: "Show me your audit programme. How did you decide frequency and coverage?"}
            - {id: q2, stage: 2, who: [ciso], text: "Who are your internal auditors, and how do you ensure they don't audit their own work?"}
            - {id: q3, stage: 2, who: [ciso], text: "Who received the audit report, and what did they do with it?"}
          requests:
            - {id: r1, label: "Internal audit programme (frequency, methods, responsibilities, planning, reporting), often aligned to the 3-year certification cycle", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.audit_plan}
            - {id: r2, label: "Plan of each internal audit: what was checked and against which requirements", kind: record, fresh_days: 400}
            - {id: r3, label: "Auditor independence and competence evidence", kind: record}
          sampling: []
          interviewees: [auditor, ciso]
          pitfalls:
            - {id: p1, text: "ISMS manager audits the processes they run, breaking objectivity"}
            - {id: p2, text: "Every area audited at the same pace, ignoring which processes matter most and where the last audit found problems"}
            - {id: p3, text: "Sites or departments in scope never audited"}
        "9.3.1":
          questions:
            - {id: q1, stage: 1, who: [top, ciso], text: "When was the last management review, and who attended?"}
            - {id: q2, stage: 2, who: [ciso], text: "How often do you hold the review, and was one skipped or postponed this cycle?"}
            - {id: q3, stage: 2, who: [ciso], text: "Was the management review done before this certification audit?"}
          requests:
            - {id: r1, label: "Management review minutes with date and attendance", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review}
            - {id: r2, label: "Management review schedule", kind: document}
          sampling: []
          interviewees: [top, ciso]
          pitfalls:
            - {id: p1, text: "No management review held before Stage 2"}
            - {id: p2, text: "Top management absent, review done by the CISO alone"}
        "9.3.2":
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me the agenda of the last management review. Where is each expected input covered?"}
            - {id: q2, stage: 2, who: [ciso], text: "Show me where the minutes discuss what customers, regulators and other stakeholders now expect."}
            - {id: q3, stage: 2, who: [ciso, top], text: "How did audit results, nonconformities, metrics and risk status feed the discussion? Show me the trends, not just current figures."}
          requests:
            - {id: r1, label: "Management review input pack (follow-up of last actions, what changed inside and outside, performance and audit results, risks, improvement ideas)", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review}
            - {id: r2, label: "Mapping of review agenda items to each required input", kind: document}
          sampling: []
          interviewees: [ciso, top]
          pitfalls:
            - {id: p1, text: "One or more required inputs missing, typically what stakeholders now expect (added in 2022) or the feedback they gave"}
            - {id: p2, text: "Status of actions from the previous review not tracked"}
            - {id: p3, text: "Risk assessment results and progress on the treatment plan left out of the review pack"}
        "9.3.3":
          questions:
            - {id: q1, stage: 1, who: [top, ciso], text: "What decisions came out of the last management review, and where are they tracked?"}
            - {id: q2, stage: 2, who: [top], text: "Which review decisions changed the ISMS scope, resources or objectives?"}
            - {id: q3, stage: 2, who: [ciso], text: "Show me one decision from the review that has been implemented."}
          requests:
            - {id: r1, label: "Management review outputs: what was decided, who owns each action, and by when", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.mgmt_review}
            - {id: r2, label: "Action tracker showing follow-up of review decisions", kind: record, fresh_days: 200}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "actions", population: "decisions from the last management review", method: "verify implementation evidence"}
          interviewees: [top, ciso]
          pitfalls:
            - {id: p1, text: "Minutes record discussion only, with no decisions, owners or deadlines"}
            - {id: p2, text: "Review decisions never followed up before the next review"}
            - {id: p3, text: "No recorded conclusion on whether the ISMS still fits, is sufficient and works, and no decision on resource needs"}
        "10.1":
          questions:
            - {id: q1, stage: 2, who: [ciso], text: "Give me examples of improvements to the ISMS in the last year. Where did they come from?"}
            - {id: q2, stage: 2, who: [ciso], text: "How do you capture improvement ideas from staff and incidents?"}
          requests:
            - {id: r1, label: "Improvement register or log", kind: record, fresh_days: 400}
            - {id: r2, label: "Before/after evidence for one completed improvement (e.g. revised procedure, KPI trend)", kind: record}
          sampling: []
          interviewees: [ciso]
          pitfalls:
            - {id: p1, text: "No improvement evident beyond fixing nonconformities (often raised as an improvement point)"}
            - {id: p2, text: "Nothing in the ISMS measurably better than at the last audit"}
        "10.2":
          questions:
            - {id: q1, stage: 2, who: [ciso], text: "Walk me through a nonconformity from discovery to closure. What did you do about its consequences, how did you decide whether the cause needed removing, and did it change the ISMS?"}
            - {id: q2, stage: 2, who: [auditor], text: "How did you check the corrective action actually worked?"}
            - {id: q3, stage: 2, who: [ciso], text: "Could the same problem be happening in another team or system? How did you check?"}
          requests:
            - {id: r1, label: "Nonconformity and corrective action register", kind: record, fresh_days: 200, reference_control: urn:intuitem:risk:function:doc-pol:doc.nc_log}
            - {id: r2, label: "Root cause analysis records for closed nonconformities", kind: record}
            - {id: r3, label: "Effectiveness review records for corrective actions", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "nonconformities", population: "nonconformities from internal audit, incidents and complaints in the last 12 months", method: "check correction, root cause, action, effectiveness review"}
          interviewees: [ciso, auditor]
          pitfalls:
            - {id: p1, text: "Correction only, with no evaluation of whether the cause needed removing, or no root cause work on significant or repeated nonconformities"}
            - {id: p2, text: "Corrective actions closed without checking they were effective"}
            - {id: p3, text: "Internal audit findings never logged as nonconformities, so no corrective action was started"}
        a.5.1:
          questions:
            - {id: q1, stage: 1, who: [ciso, top], text: "Show me the top-level security policy and the topic-specific policies that sit under it. Who approved each one and when?"}
            - {id: q2, stage: 2, who: [ciso, staff], text: "How do staff and relevant external parties learn about a new or changed policy, and how do you know they acknowledged it?"}
            - {id: q3, stage: 2, who: [ciso], text: "Pick one topic-specific policy and walk me through its last review: what triggered it and what changed."}
          requests:
            - {id: r1, label: "Information security policy with approval signature or record and version history", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.main}
            - {id: r2, label: "List of topic-specific policies with owner, version, last review date and next review date", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.doc_register}
            - {id: r3, label: "Policy acknowledgement records for staff and contractors", kind: record, fresh_days: 400}
            - {id: r4, label: "Minutes or tickets showing the most recent policy review", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "staff", population: "current workforce in scope", method: "check acknowledgement of the current policy versions", note: "including contractors and recent joiners"}
          interviewees: [top, ciso, staff]
          pitfalls:
            - {id: p1, text: "Policies reviewed on paper but the review date is older than the interval the policy itself sets"}
            - {id: p2, text: "Acknowledgement collected at onboarding only, never after a policy change, and never from contractors or other interested parties"}
            - {id: p3, text: "Policies still cite 2013 control numbers or titles after the 2022 transition"}
        a.5.2:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me where security roles and responsibilities are defined, including asset and risk owners."}
            - {id: q2, stage: 2, who: [it_lead], text: "Pick an asset owner from your inventory. Can they tell me what they are accountable for in security terms?"}
            - {id: q3, stage: 2, who: [ciso, top], text: "How do you make sure the people in security roles have, and keep, the competence those roles need?"}
          requests:
            - {id: r1, label: "RACI or responsibility matrix for the ISMS and security processes", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.raci}
            - {id: r2, label: "Job descriptions or role definitions for the CISO and other named security roles", kind: document}
            - {id: r3, label: "Appointment letters or minutes formally assigning ISMS roles", kind: record}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "named role holders", population: "asset owners, risk owners and ISMS roles", method: "interview and compare stated duties to the documented role"}
          interviewees: [top, ciso, it_lead]
          pitfalls:
            - {id: p1, text: "Asset and risk owners named in registers have never been told they hold that role"}
            - {id: p2, text: "Roles assigned to people who have since left or changed job"}
        a.5.3:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which duties have you identified as conflicting, and where is that analysis recorded?"}
            - {id: q2, stage: 2, who: [iam, dev], text: "Show me how you stop one person from both requesting and approving their own access or change, in a real system."}
            - {id: q3, stage: 2, who: [ciso], text: "Where segregation is not possible because the team is small, what compensating control do you run and where is the evidence?"}
          requests:
            - {id: r1, label: "Segregation of duties matrix or list of incompatible role combinations", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.seg_duty}
            - {id: r2, label: "Workflow configuration showing requester and approver must differ (change, access, payments)", kind: technical, fresh_days: 400}
            - {id: r3, label: "Records of compensating reviews where segregation is not technically enforced", kind: record, fresh_days: 100}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "changes or access approvals", population: "last 6 months", method: "check requester and approver are different people"}
          interviewees: [ciso, iam, dev]
          pitfalls:
            - {id: p1, text: "Developers can push straight to production with no second approver on the pipeline"}
            - {id: p2, text: "Admins approve their own access tickets or changes"}
            - {id: p3, text: "Small-team exception claimed but no compensating log review exists"}
        a.5.4:
          questions:
            - {id: q1, stage: 1, who: [top, hr], text: "Where do you say what you expect from managers on security, and how does that reach their objectives or appraisals?"}
            - {id: q2, stage: 2, who: [top], text: "How does management make sure managers and staff actually apply the security policies day to day?"}
            - {id: q3, stage: 2, who: [top, staff], text: "Give me an example where a manager enforced or escalated a security rule within their team."}
          requests:
            - {id: r1, label: "Management communications on security expectations (memos, town hall slides, objectives)", kind: record, fresh_days: 400}
            - {id: r2, label: "If used, manager objectives or appraisal criteria that include security duties", kind: document}
            - {id: r3, label: "Training completion report broken down by team or manager", kind: record, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_register}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "line managers", population: "managers of in-scope teams", method: "interview on how they brief and supervise security behaviour"}
          interviewees: [top, hr, staff]
          pitfalls:
            - {id: p1, text: "Leadership commitment shown only in the policy signature, with no visible follow-through"}
            - {id: p2, text: "Managers unaware of overdue training or open findings in their own team"}
        a.5.5:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me the list of authorities you would contact and in which situations."}
            - {id: q2, stage: 2, who: [dpo, ciso], text: "Who decides to notify the data protection authority or a national CSIRT, and within what deadline? Walk me through the last time it happened or was rehearsed."}
          requests:
            - {id: r1, label: "Authority contact register (regulators, CSIRT, police, supervisory authority) with owner and trigger", kind: document}
            - {id: r2, label: "Evidence the contact list was checked recently (review date, test call or email)", kind: record, fresh_days: 400}
            - {id: r3, label: "Past notifications to authorities or exercise records", kind: record}
          sampling: []
          interviewees: [ciso, legal, dpo]
          pitfalls:
            - {id: p1, text: "Contact list has outdated numbers or names and no review date"}
            - {id: p2, text: "Notification deadlines (for example 72 hours for personal data breaches, NIS2 timelines) not reflected in the incident procedure"}
        a.5.6:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which security communities, ISACs, forums or professional associations do you belong to, and who maintains each contact?"}
            - {id: q2, stage: 2, who: [ciso, sec_ops], text: "Which professional groups, forums or information-sharing communities are you part of?"}
            - {id: q3, stage: 2, who: [sec_ops], text: "Give me one example where something learned from one of those groups changed what you do."}
          requests:
            - {id: r1, label: "List of memberships and subscriptions (ISAC, CERT mailing lists, associations)", kind: document}
            - {id: r2, label: "Evidence of participation (event attendance, shared advisories, forum posts)", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [ciso, sec_ops]
          pitfalls:
            - {id: p1, text: "Memberships listed but no one can show anything received or acted upon in the past year"}
        a.5.7:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "Show me which threat intelligence sources you use, who reads them, and how often."}
            - {id: q2, stage: 2, who: [sec_ops], text: "Pick a threat advisory from the last quarter and show me what decision or action it led to."}
            - {id: q3, stage: 2, who: [ciso, risk, sec_ops], text: "How does threat intelligence feed into your risk assessment, your detection rules and the scope of your security testing?"}
          requests:
            - {id: r1, label: "Threat intelligence procedure or section defining sources, cadence, analysis and distribution", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.threat_intel}
            - {id: r2, label: "Recent threat intelligence summaries or bulletins issued internally", kind: record, fresh_days: 100}
            - {id: r3, label: "Tickets, risk register updates or detection rule changes triggered by intelligence", kind: record, fresh_days: 200}
            - {id: r4, label: "Configuration of feeds or platform integrations (SIEM, EDR, vulnerability scanner)", kind: technical, fresh_days: 400}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "advisories", population: "intelligence received in the last 6 months", method: "trace each from receipt to assessment to action or documented no-action"}
          interviewees: [ciso, sec_ops, risk]
          pitfalls:
            - {id: p1, text: "Feeds subscribed to and landing in a mailbox nobody triages, with no record of analysis"}
            - {id: p2, text: "No link between intelligence and the risk assessment: the threat catalogue has not changed since the last cycle"}
            - {id: p3, text: "Only strategic news collected; tactical and operational intelligence never considered or fed into detection or preventive controls"}
        a.5.8:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me where your project methodology requires a security assessment, and at which stage gates."}
            - {id: q2, stage: 2, who: [dev, it_lead], text: "Pick a project delivered this year and show me its security requirements, risk assessment and sign-off."}
          requests:
            - {id: r1, label: "Project management methodology or gate checklist with security steps", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.project}
            - {id: r2, label: "Project portfolio list for the last 12 months", kind: record, fresh_days: 400}
            - {id: r3, label: "Security requirement or risk assessment records for sampled projects", kind: record}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "projects", population: "projects started or closed in the last 12 months, including non-IT ones", method: "check security step at initiation and before go-live"}
          interviewees: [ciso, dev, it_lead]
          pitfalls:
            - {id: p1, text: "Security checklist exists in the template but is left blank or ticked without content"}
            - {id: p2, text: "Only product or IT development goes through the security step; infrastructure moves, new suppliers, office or process changes never do"}
        a.5.9:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me your asset inventory. How does it cover information, not just hardware?"}
            - {id: q2, stage: 2, who: [service_desk], text: "I will pick a laptop, a server and a SaaS application from what I see today. Show me each one in the inventory with its owner."}
            - {id: q3, stage: 2, who: [service_desk], text: "How do new assets get into the inventory, and how is it kept accurate?"}
          requests:
            - {id: r1, label: "Asset inventory export with owner, classification and location", kind: record, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:doc.asset_register}
            - {id: r2, label: "Reconciliation evidence against discovery tools (MDM, EDR, cloud console, CMDB)", kind: technical, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:tech.asset_discovery}
            - {id: r3, label: "Procedure describing how the inventory is maintained", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.asset}
          sampling:
            - {id: s1, min: 10, max: 15, unit: "assets", population: "assets observed on site, in the cloud console and in discovery tools", method: "floor-to-list and list-to-floor tracing"}
          interviewees: [service_desk, ciso]
          pitfalls:
            - {id: p1, text: "Inventory lists hardware only; information assets and SaaS tools are missing"}
            - {id: p2, text: "Devices seen in the EDR console are absent from the inventory, or the inventory still lists disposed devices"}
            - {id: p3, text: "Owner column names people who have left, or a group with no accountable contact who can explain what ownership involves"}
        a.5.10:
          questions:
            - {id: q1, stage: 1, who: [hr], text: "Show me your acceptable use rules for information and devices."}
            - {id: q2, stage: 2, who: [staff], text: "Ask any staff member: can they use personal cloud storage or AI chat tools for work data? Does their answer match the policy?"}
          requests:
            - {id: r1, label: "Acceptable use policy covering devices, email, internet, cloud and generative AI tools", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.accept}
            - {id: r2, label: "Signed acceptable use acknowledgements", kind: record}
            - {id: r3, label: "Technical controls enforcing the rules (web filtering, DLP, app allow-list)", kind: technical, fresh_days: 400}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "staff", population: "staff across departments", method: "short interview on key rules plus acknowledgement check"}
          interviewees: [staff, hr, endpoint]
          pitfalls:
            - {id: p1, text: "Policy silent on generative AI tools while staff use them with client data"}
            - {id: p2, text: "Acknowledgement missing for contractors or temporary staff"}
        a.5.11:
          questions:
            - {id: q1, stage: 1, who: [hr], text: "Which assets must come back when someone leaves, and where is that list kept for each person?"}
            - {id: q2, stage: 2, who: [hr, endpoint], text: "Walk me through what happens to a leaver's laptop, badge and tokens on their last day."}
            - {id: q3, stage: 2, who: [endpoint], text: "How do you make sure company data on personal devices is removed when someone leaves?"}
          requests:
            - {id: r1, label: "Leaver checklist including asset return steps", kind: document}
            - {id: r2, label: "Completed leaver checklists or asset return receipts", kind: record, fresh_days: 400}
            - {id: r3, label: "MDM records of device wipe or retirement for leavers", kind: technical}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "leavers", population: "leavers in the last 12 months", method: "compare HR leaver list to asset return records and inventory status"}
          interviewees: [hr, endpoint]
          pitfalls:
            - {id: p1, text: "Leaver checklist completed for employees but not for contractors or interns"}
            - {id: p2, text: "Laptops still assigned to leavers in the inventory months after departure"}
        a.5.12:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me your classification scheme and the handling rules for each level."}
            - {id: q3, stage: 1, who: [ciso, dpo], text: "How does your scheme reflect integrity and availability needs and client or contractual requirements, and when is a classification revisited?"}
            - {id: q2, stage: 2, who: [staff], text: "Pick three documents from a shared drive. Who classified them and does the classification match the content?"}
          requests:
            - {id: r1, label: "Classification policy with levels, criteria and handling rules", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.classif}
            - {id: r2, label: "Asset or information inventory showing assigned classification", kind: record, fresh_days: 400}
            - {id: r3, label: "Classification tool configuration (for example sensitivity labels)", kind: technical, fresh_days: 400}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "documents or data sets", population: "shared drives, document management and email", method: "check assigned label against content and scheme"}
          interviewees: [ciso, staff, dpo]
          pitfalls:
            - {id: p1, text: "Scheme defined but staff cannot name the levels or apply them"}
            - {id: p2, text: "Everything marked internal by default, including clearly confidential HR and client data"}
            - {id: p3, text: "Scheme covers confidentiality only, so data whose integrity or availability is critical gets no distinct handling"}
        a.5.13:
          questions:
            - {id: q1, stage: 1, who: [endpoint], text: "Show me your labelling rules. Which classification levels get a visible label, and on which media?"}
            - {id: q2, stage: 2, who: [staff], text: "Show me how a confidential document is labelled, both electronically and on paper."}
            - {id: q3, stage: 2, who: [staff, endpoint], text: "What happens with labelling when information is exported, printed or emailed outside?"}
          requests:
            - {id: r1, label: "Labelling procedure covering electronic, physical and exported formats", kind: document}
            - {id: r2, label: "Screenshot of labelling tool or document templates with labels", kind: technical, fresh_days: 400}
            - {id: r3, label: "Sample labelled documents and reports", kind: observation}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "documents", population: "documents classified above internal", method: "check presence and correctness of label"}
          interviewees: [staff, endpoint]
          pitfalls:
            - {id: p1, text: "Labels exist in templates but are stripped from exports, reports and printed copies"}
            - {id: p2, text: "Labelling silently skipped for some outputs, such as system exports, with no written rule saying when that is acceptable"}
        a.5.14:
          questions:
            - {id: q1, stage: 1, who: [network, legal], text: "Show me the rules for sending information outside the organisation, by channel and classification level."}
            - {id: q2, stage: 2, who: [staff], text: "Show me how a staff member would send a confidential file to a client today. Which tool, which protection?"}
          requests:
            - {id: r1, label: "Information transfer policy or procedure (email, file transfer, removable media, verbal)", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.transfer}
            - {id: r2, label: "Agreements covering information exchange with key partners (NDA, data exchange clauses)", kind: document}
            - {id: r3, label: "Configuration of secure transfer tools (email encryption, TLS enforcement, secure file share expiry)", kind: technical, fresh_days: 400}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "transfers", population: "recent external transfers of sensitive data", method: "check channel used against policy for that classification"}
          interviewees: [network, staff, legal]
          pitfalls:
            - {id: p1, text: "Public file-sharing links with no expiry or password used for confidential data"}
            - {id: p2, text: "Policy covers email but not messaging apps, phone calls or courier transfers"}
        a.5.15:
          questions:
            - {id: q1, stage: 1, who: [ciso, facilities], text: "Show me your access control policy. How does it cover physical access as well as logical access?"}
            - {id: q2, stage: 2, who: [iam], text: "How do you apply need-to-know and least privilege in practice? Show me the role model for one key application."}
          requests:
            - {id: r1, label: "Access control policy covering logical and physical access, need-to-know and least privilege", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.access}
            - {id: r2, label: "Role or profile definitions for key applications", kind: document}
            - {id: r3, label: "Access control rules for one key application, showing need-to-know and need-to-use applied", kind: document}
          sampling: []
          interviewees: [ciso, iam, facilities]
          pitfalls:
            - {id: p1, text: "Policy only covers logical access; physical access rules are not aligned with data sensitivity"}
            - {id: p2, text: "Role model documented but most users hold an admin or broad default profile"}
        a.5.16:
          questions:
            - {id: q1, stage: 1, who: [iam], text: "Where is the identity lifecycle described, including shared, service and non-human accounts?"}
            - {id: q2, stage: 2, who: [iam, hr], text: "Show me how an identity is created and who approves it. How do you link each personal account to one individual, and each non-human account to an accountable owner?"}
            - {id: q3, stage: 2, who: [iam], text: "How do you handle shared, service and generic accounts? Show me the list and their owners."}
          requests:
            - {id: r1, label: "Identity lifecycle procedure (create, change, disable, delete)", kind: document}
            - {id: r2, label: "Export of active accounts from the identity provider", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.iam}
            - {id: r3, label: "Register of shared, service and non-personal accounts with owner and justification", kind: record, fresh_days: 200}
          sampling:
            - {id: s1, min: 10, max: 10, unit: "accounts", population: "active accounts in the identity provider", method: "match each account to an HR record or a documented owner"}
          interviewees: [iam, hr]
          pitfalls:
            - {id: p1, text: "Generic and service accounts without an owner or justification"}
            - {id: p2, text: "Accounts in the directory that do not match any current employee or contractor"}
        a.5.17:
          questions:
            - {id: q1, stage: 1, who: [iam], text: "What are your rules for passwords, MFA and secrets, and how is a reset done without a phishing risk?"}
            - {id: q5, stage: 1, who: [iam, staff], text: "How are staff told how to handle their passwords and tokens, and where is that written (policy, onboarding, terms of employment)?"}
            - {id: q2, stage: 2, who: [iam], text: "Show me your password and MFA configuration in the identity provider."}
            - {id: q3, stage: 2, who: [iam], text: "How are initial passwords and reset credentials delivered, and how do you verify the person asking for a reset?"}
            - {id: q4, stage: 2, who: [dev, iam], text: "Where are shared secrets, API keys and service passwords stored?"}
            - {id: q6, stage: 2, who: [iam], text: "How do new users receive their first credentials, and are vendor default passwords changed before a system goes live?"}
          requests:
            - {id: r1, label: "Password and MFA policy settings from the identity provider (see also A.8.5)", kind: technical, fresh_days: 40}
            - {id: r2, label: "MFA coverage report listing users without MFA (see also A.8.5)", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.mfa}
            - {id: r3, label: "Help desk reset procedure with identity verification steps", kind: document}
            - {id: r4, label: "Evidence of a password manager or secrets vault in use", kind: technical, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:tech.password_manager}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "password reset tickets", population: "help desk tickets in the last 6 months", method: "check identity verification was performed and recorded"}
          interviewees: [iam, dev, staff]
          pitfalls:
            - {id: p1, text: "MFA enforced for most users but exempted for admins, service accounts or legacy protocols"}
            - {id: p2, text: "Secrets hard-coded in repositories or shared in chat"}
            - {id: p3, text: "Help desk resets passwords on a phone call without verification"}
            - {id: p4, text: "Users share credentials or reuse work passwords elsewhere, and nobody was ever briefed against it"}
        a.5.18:
          questions:
            - {id: q1, stage: 1, who: [iam, ciso], text: "Show me how access rights are requested, approved and reviewed on paper: who approves, and how often you review."}
            - {id: q2, stage: 2, who: [hr, iam], text: "Walk me through a joiner, a mover and a leaver, from the HR trigger to the account change."}
            - {id: q3, stage: 2, who: [iam], text: "Show me your last two access review cycles for a critical system. What was removed as a result?"}
          requests:
            - {id: r1, label: "Access request and approval records for sampled joiners and movers", kind: record}
            - {id: r2, label: "Access review records for critical systems, last 2 cycles, with sign-off and actions", kind: record, fresh_days: 200, reference_control: urn:intuitem:risk:function:doc-pol:proc.recertification}
            - {id: r3, label: "HR leaver list and account disable dates for the same period", kind: record, fresh_days: 400}
            - {id: r4, label: "Privileged access review evidence", kind: record, fresh_days: 200, reference_control: urn:intuitem:risk:function:doc-pol:proc.pam}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "joiners", population: "last 12 months", method: "compare HR dates to account creation, change and disable dates; check approvals"}
            - {id: s2, min: 5, max: 5, unit: "movers", population: "last 12 months", method: "compare HR dates to account creation, change and disable dates; check approvals"}
            - {id: s3, min: 5, max: 5, unit: "leavers", population: "last 12 months", method: "compare HR dates to account creation, change and disable dates; check approvals"}
          interviewees: [iam, hr, ciso]
          pitfalls:
            - {id: p1, text: "Access reviews signed off but no record that the revocations were actually carried out"}
            - {id: p2, text: "Movers keep their previous rights because only joiners and leavers are processed"}
            - {id: p3, text: "Leaver accounts disabled days or weeks after the exit date, or SaaS accounts outside SSO never disabled"}
        a.5.19:
          questions:
            - {id: q1, stage: 1, who: [proc, ciso], text: "Show me how you classify suppliers by security risk and what you require from each tier."}
            - {id: q2, stage: 2, who: [proc], text: "Pick a supplier onboarded this year and show me the security assessment done before signing."}
          requests:
            - {id: r1, label: "Supplier security policy or procedure with tiering criteria", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.supplier}
            - {id: r2, label: "Supplier register with criticality, data accessed and assessment status", kind: record, fresh_days: 200, reference_control: urn:intuitem:risk:function:doc-pol:doc.supplier_register}
            - {id: r3, label: "Completed pre-contract security assessments for new suppliers", kind: record, reference_control: urn:intuitem:risk:function:doc-pol:proc.tprm_assessment}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "suppliers", population: "suppliers onboarded or renewed in the last 12 months", method: "check assessment happened before contract and matches tier", note: "weighted to critical tiers"}
          interviewees: [proc, ciso, legal]
          pitfalls:
            - {id: p1, text: "Supplier register is a procurement list with no security tiering"}
            - {id: p2, text: "Assessments done after the supplier was already in production"}
            - {id: p3, text: "Exit provisions (return or destruction of data, removal of access) not defined for supplier relationships"}
        a.5.20:
          questions:
            - {id: q1, stage: 1, who: [legal], text: "Which security clauses must appear in a supplier contract, and how do they change with the supplier's risk?"}
            - {id: q2, stage: 2, who: [legal], text: "Pick a critical supplier contract. Show me the security clauses: confidentiality, incident notification, audit rights, sub-processing, data return."}
            - {id: q3, stage: 2, who: [legal, proc], text: "How do you make sure older contracts are brought up to your current requirements?"}
          requests:
            - {id: r1, label: "Standard security clauses or schedule used in supplier contracts", kind: document}
            - {id: r2, label: "Signed contracts or DPAs for sampled critical suppliers", kind: document}
            - {id: r3, label: "Gap tracking for legacy contracts lacking required clauses", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "contracts", population: "critical and high-tier suppliers", method: "check each required clause is present"}
          interviewees: [legal, proc]
          pitfalls:
            - {id: p1, text: "Contracts signed on supplier paper with no incident notification timeframe"}
            - {id: p2, text: "Audit or assessment rights missing, so the organisation relies on whatever the supplier chooses to share"}
        a.5.21:
          questions:
            - {id: q1, stage: 1, who: [ciso, proc], text: "Which ICT supply chain risks did you identify, and what do you ask of suppliers about their own subcontractors?"}
            - {id: q2, stage: 2, who: [proc], text: "How do you get assurance on the subcontractors of your critical ICT providers?"}
            - {id: q3, stage: 2, who: [dev, proc], text: "For software or hardware you buy, how do you check where components come from and that they are supported?"}
          requests:
            - {id: r1, label: "Requirements imposed on suppliers to flow down security to their subcontractors", kind: document}
            - {id: r2, label: "Sub-processor or subcontractor lists for critical providers", kind: record, fresh_days: 400}
            - {id: r3, label: "Software bill of materials or component inventory for key products, if applicable", kind: technical, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.sbom}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "critical ICT suppliers", population: "ICT product and service providers", method: "review subcontractor list and flow-down evidence"}
          interviewees: [proc, ciso, dev]
          pitfalls:
            - {id: p1, text: "No visibility of fourth parties even for providers hosting sensitive data"}
            - {id: p2, text: "Sub-processor change notifications received but never reviewed"}
        a.5.22:
          questions:
            - {id: q1, stage: 1, who: [proc], text: "How do you decide how often a supplier is reviewed, and what counts as a change worth reassessing?"}
            - {id: q2, stage: 2, who: [proc], text: "Pick a critical supplier. Show me the last performance or security review you held with them."}
            - {id: q3, stage: 2, who: [proc, ciso], text: "How did you assess the impact the last time a supplier changed their service, location or subcontractor?"}
          requests:
            - {id: r1, label: "Supplier review schedule by tier", kind: document}
            - {id: r2, label: "Minutes or reports of supplier security reviews", kind: record, fresh_days: 400}
            - {id: r3, label: "Current third-party assurance reports for critical suppliers (ISO 27001 certificate, SOC 2 report)", kind: record, fresh_days: 400}
            - {id: r4, label: "Records of supplier incidents and changes and how they were assessed", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "suppliers", population: "critical and high-tier suppliers", method: "check review is within the tier interval and findings are followed up"}
          interviewees: [proc, ciso]
          pitfalls:
            - {id: p1, text: "Certificates on file expired or scope of the supplier certificate does not cover the service used"}
            - {id: p2, text: "SOC 2 reports collected but complementary user entity controls never reviewed or implemented"}
            - {id: p3, text: "Reviews scheduled annually but last one is two years old"}
        a.5.23:
          questions:
            - {id: q1, stage: 1, who: [ciso, proc], text: "Show me how you decide to adopt a new cloud service and what security checks happen before use."}
            - {id: q2, stage: 2, who: [infra], text: "For your main cloud provider, show me which controls are yours and which are the provider's."}
            - {id: q3, stage: 2, who: [infra, ciso], text: "If you had to leave this provider next quarter, what is the exit plan and has any part of it been tried?"}
          requests:
            - {id: r1, label: "Cloud services policy or procedure: how you choose, run and leave a cloud provider", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.cloud}
            - {id: r2, label: "Cloud service register including SaaS, with owner and data classification", kind: record, fresh_days: 200}
            - {id: r3, label: "Shared responsibility matrix for key cloud providers", kind: document}
            - {id: r4, label: "Exit plan, with any data export or portability check performed", kind: record}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "cloud services", population: "IaaS, PaaS and SaaS in use", method: "check selection assessment, responsibility split and exit provisions"}
          interviewees: [ciso, infra, proc]
          pitfalls:
            - {id: p1, text: "SaaS tools bought by business teams on a card never enter the cloud register"}
            - {id: p2, text: "Organisation relies on the provider certificate and has not configured its own side of the shared responsibility"}
            - {id: p3, text: "No exit strategy, or one that cannot be carried out because export formats or contract terms were never checked"}
        a.5.24:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Show me your incident management procedure, roles and escalation paths."}
            - {id: q2, stage: 2, who: [ciso, sec_ops], text: "When did you last exercise the incident process, and what did you change after it?"}
            - {id: q3, stage: 2, who: [ciso], text: "Who is allowed to handle incidents, and how do you know they are trained for it?"}
          requests:
            - {id: r1, label: "Incident management policy and procedure with roles, severity scale and escalation", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.incident}
            - {id: r2, label: "Incident response team contact list including external parties", kind: document}
            - {id: r3, label: "Tabletop or simulation exercise report", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.ir_exercise}
            - {id: r4, label: "Training records for incident response staff", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [ciso, sec_ops, service_desk]
          pitfalls:
            - {id: p1, text: "Plan never exercised and no real incident handled yet, so nothing shows it works (auditors commonly ask for one or the other)"}
            - {id: p2, text: "Severity criteria do not tie to regulatory notification thresholds"}
        a.5.25:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "What turns an event into an incident here? Show me the criteria and who makes the call."}
            - {id: q2, stage: 2, who: [sec_ops, service_desk], text: "Show me how an event becomes an incident: who decides, using which criteria?"}
            - {id: q3, stage: 2, who: [sec_ops], text: "Pick three events from the log that were not escalated. Why not?"}
          requests:
            - {id: r1, label: "Event triage criteria or classification matrix", kind: document}
            - {id: r2, label: "Event and incident log or ticket queue for the last 12 months", kind: record, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:doc.incident_register}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "events", population: "events and alerts in the last 12 months", method: "check triage decision is recorded and consistent with criteria"}
          interviewees: [sec_ops, service_desk]
          pitfalls:
            - {id: p1, text: "Zero incidents recorded in a year, which suggests events are closed in the service desk without security triage"}
            - {id: p2, text: "Triage decisions not recorded, so nobody can explain why an event was dismissed"}
        a.5.26:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which incident scenarios have a written response, and who has the authority to act on them?"}
            - {id: q2, stage: 2, who: [sec_ops], text: "Pick your most serious incident of the year. Walk me through detection, containment, communication and closure."}
            - {id: q3, stage: 2, who: [ciso, legal], text: "Who was notified, including customers or authorities, and when?"}
          requests:
            - {id: r1, label: "Incident records with timeline, actions and closure", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.incident_register}
            - {id: r2, label: "Communication records for notified parties", kind: record}
            - {id: r3, label: "Playbooks for common incident types (phishing, ransomware, data leak)", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.incident}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "incidents", population: "incidents in the last 12 months", method: "trace from detection to closure against the procedure", note: "including the most severe"}
          interviewees: [sec_ops, ciso, legal]
          pitfalls:
            - {id: p1, text: "Timeline missing, so notification deadlines cannot be shown to have been met"}
            - {id: p2, text: "Incidents closed without root cause or with open containment actions"}
        a.5.27:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "How is an incident closed, and where does the post-incident review get recorded?"}
            - {id: q2, stage: 2, who: [ciso, sec_ops], text: "Show me a lessons-learned review from a past incident and the actions it produced."}
            - {id: q3, stage: 2, who: [ciso, risk], text: "How do incident trends feed into your risk assessment and awareness programme?"}
          requests:
            - {id: r1, label: "Post-incident review reports", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.post_incident}
            - {id: r2, label: "Corrective action tracking linked to incidents", kind: record, fresh_days: 400}
            - {id: r3, label: "Incident trend summary presented to management review", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "significant incidents", population: "incidents of medium severity or above", method: "check review held and actions closed"}
          interviewees: [ciso, sec_ops, risk]
          pitfalls:
            - {id: p1, text: "Lessons learned written but actions never assigned or closed"}
            - {id: p2, text: "Repeated incidents of the same type with no change to controls or risk register"}
        a.5.28:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "Show me your procedure for collecting and preserving digital evidence."}
            - {id: q2, stage: 2, who: [sec_ops, legal], text: "If you needed to support legal action after an incident, how would you show the evidence was not altered?"}
          requests:
            - {id: r1, label: "Evidence handling procedure with chain of custody form", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.forensics}
            - {id: r2, label: "Completed chain of custody records, if any", kind: record}
            - {id: r3, label: "Log retention settings for key systems (see also A.8.15)", kind: technical, fresh_days: 400}
          sampling: []
          interviewees: [sec_ops, legal]
          pitfalls:
            - {id: p1, text: "No chain of custody form; responders reimage machines before preserving evidence"}
            - {id: p2, text: "No guidance on legal admissibility or jurisdiction; legal counsel or law enforcement only involved after the evidence was already handled"}
        a.5.29:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "Which security controls must keep running during a disruption, and where is that written down?"}
            - {id: q2, stage: 2, who: [ciso, risk], text: "During a disruption, which security controls must stay in place and how is that written into your continuity plans?"}
            - {id: q3, stage: 2, who: [infra], text: "In your last continuity test, did access control and logging keep working? How do you know?"}
          requests:
            - {id: r1, label: "Business continuity plans with security requirements during disruption", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.bcp}
            - {id: r2, label: "Continuity test reports covering security aspects", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.bcp_exercise}
          sampling: []
          interviewees: [ciso, infra, risk]
          pitfalls:
            - {id: p1, text: "Continuity plans focus on availability and allow bypassing security (shared admin accounts, disabled MFA) without controls"}
            - {id: p2, text: "Recovery site not covered by the same security monitoring as production"}
        a.5.30:
          questions:
            - {id: q1, stage: 1, who: [risk, infra], text: "Show me how your ICT recovery objectives were derived from the business impact analysis."}
            - {id: q2, stage: 2, who: [infra], text: "Show me the last disaster recovery or restore test for a critical service. Did you meet the RTO and RPO?"}
            - {id: q3, stage: 2, who: [infra], text: "When a test failed or overran, what did you do about it?"}
          requests:
            - {id: r1, label: "Business impact analysis listing critical processes, supporting ICT services, RTO and RPO", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.bia}
            - {id: r2, label: "ICT continuity or disaster recovery plans for critical services", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.drp}
            - {id: r3, label: "DR and restore test reports with measured recovery times", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.bcp_exercise}
            - {id: r4, label: "Corrective actions raised from failed or partial tests", kind: record}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "critical ICT services", population: "services supporting critical processes in the BIA", method: "compare BIA objectives to plan and to measured test results"}
          interviewees: [infra, ciso, risk]
          pitfalls:
            - {id: p1, text: "RTO and RPO set by IT without a BIA, or BIA objectives that the architecture cannot meet"}
            - {id: p2, text: "Backups tested by checking job success, never by an actual restore within the RTO"}
            - {id: p3, text: "Test results not compared to objectives, so misses never become corrective actions"}
        a.5.31:
          questions:
            - {id: q1, stage: 1, who: [legal], text: "Show me your register of legal, regulatory and contractual requirements relevant to security."}
            - {id: q2, stage: 2, who: [legal], text: "How do you find out about a new or changed law that affects you? Show me the last update you made."}
          requests:
            - {id: r1, label: "Legal and regulatory requirements register with owner and applicability", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.legal}
            - {id: r2, label: "Evidence of periodic review of the register", kind: record, fresh_days: 400}
            - {id: r3, label: "Analysis of cryptography export or use restrictions where relevant", kind: document}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "requirements", population: "entries in the register", method: "check how each is met by a control or process"}
          interviewees: [legal, ciso, dpo]
          pitfalls:
            - {id: p1, text: "Register not updated for recent regulations such as NIS2, DORA or sector rules"}
            - {id: p2, text: "Contractual security commitments to customers not captured, so nobody tracks them"}
        a.5.32:
          questions:
            - {id: q1, stage: 1, who: [service_desk, dev], text: "How do you track software licences and the reuse of third-party or open source content?"}
            - {id: q2, stage: 2, who: [service_desk, dev], text: "How do you make sure software in use is licensed and that open source licences are respected?"}
            - {id: q3, stage: 2, who: [service_desk], text: "Show me the licence count against installations for one commercial product."}
          requests:
            - {id: r1, label: "Software licence register or software asset management report", kind: record, fresh_days: 200}
            - {id: r2, label: "Software installation restrictions (no local admin, approved software list)", kind: technical, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:tech.app_control}
            - {id: r3, label: "Open source licence policy or scan results for developed software", kind: technical, fresh_days: 400}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "products", population: "commercial software and SaaS in use", method: "compare entitlements to installations or users"}
          interviewees: [service_desk, legal, dev]
          pitfalls:
            - {id: p1, text: "No reconciliation of licences to installations"}
            - {id: p2, text: "Copyleft components shipped in products without licence review"}
        a.5.33:
          questions:
            - {id: q1, stage: 1, who: [legal, dpo], text: "Show me your retention schedule for records, including legal basis."}
            - {id: q2, stage: 2, who: [infra], text: "Pick a record type and show me that it is kept for the right period and then destroyed."}
            - {id: q3, stage: 2, who: [infra], text: "How do you stop records being altered or read by the wrong people, and how will you still read archived or encrypted records at the end of their retention period?"}
          requests:
            - {id: r1, label: "Records retention schedule by record type", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.retention}
            - {id: r2, label: "Evidence of retention settings in systems (mail, document management, backups)", kind: technical, fresh_days: 400}
            - {id: r3, label: "Destruction or deletion logs", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 3, max: 3, unit: "record types", population: "record types in the retention schedule", method: "check system configuration and existence of records at expected age"}
          interviewees: [legal, dpo, infra]
          pitfalls:
            - {id: p1, text: "Retention schedule exists but systems keep everything forever"}
            - {id: p2, text: "Records needed for ISMS evidence (logs, review records) deleted before the audit cycle"}
            - {id: p3, text: "Archived records encrypted with keys, or stored in formats, that are no longer kept or supported"}
            - {id: p4, text: "Records needed for audit or legal purposes can be edited by the people they describe"}
        a.5.34:
          questions:
            - {id: q1, stage: 1, who: [dpo, legal], text: "Which laws on personal data apply to you, and where do you show how your controls cover them?"}
            - {id: q2, stage: 2, who: [dpo], text: "Show me your record of processing activities and how it links to your security controls."}
            - {id: q3, stage: 2, who: [dpo, ciso], text: "Who is your DPO or privacy lead, and how do privacy and security work together on a breach?"}
          requests:
            - {id: r1, label: "Record of processing activities", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.ropa}
            - {id: r2, label: "Privacy policy and internal data protection policy", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.privacy}
            - {id: r3, label: "DPIAs for high-risk processing", kind: record, reference_control: urn:intuitem:risk:function:doc-pol:proc.dpia}
            - {id: r4, label: "Personal data breach register", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.breach_notif}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "processing activities", population: "entries in the record of processing", method: "check legal basis, retention and security measures are documented"}
          interviewees: [dpo, legal, ciso]
          pitfalls:
            - {id: p1, text: "Record of processing incomplete or not updated after new systems went live"}
            - {id: p2, text: "Breach register kept separately from the incident log, with inconsistencies between them"}
        a.5.35:
          questions:
            - {id: q1, stage: 1, who: [auditor], text: "How is the ISMS reviewed independently, and who does it? Show me the plan for this cycle."}
            - {id: q2, stage: 2, who: [auditor], text: "When was your security approach last reviewed by someone independent of the people running it? Show me the report."}
            - {id: q3, stage: 2, who: [ciso], text: "Show me how the findings of that review were tracked to closure."}
            - {id: q4, stage: 2, who: [top, ciso], text: "After your last significant change (reorganisation, new hosting, merger), was an independent review considered?"}
          requests:
            - {id: r1, label: "Independent review plan or reports (internal audit, external assessment or an independent manager) covering people, processes and technology", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.audit_plan}
            - {id: r2, label: "Independent review or internal audit reports", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:pol.audit}
            - {id: r3, label: "Evidence of auditor independence and competence", kind: record}
            - {id: r4, label: "Findings tracker with status and closure evidence", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.nc_log}
          sampling: []
          interviewees: [auditor, ciso, top]
          pitfalls:
            - {id: p1, text: "Internal auditor audits their own work"}
            - {id: p2, text: "Nobody can show which parts of the ISMS were independently reviewed, or over what period"}
            - {id: p3, text: "Findings from the last review still open with no target date"}
        a.5.36:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "How do managers check that their teams follow the policies, and how often?"}
            - {id: q2, stage: 2, who: [it_lead], text: "How do managers check compliance with security policies in their area? Show me the last check."}
            - {id: q3, stage: 2, who: [it_lead], text: "Show me a technical compliance review, such as a configuration scan against your hardening standard."}
          requests:
            - {id: r1, label: "Compliance check schedule or self-assessment programme", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.compliance_monitoring}
            - {id: r2, label: "Results of compliance checks and technical scans", kind: record, fresh_days: 200}
            - {id: r3, label: "Non-compliance log with corrective actions", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:doc.nc_log}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "non-compliances", population: "issues raised in the last 12 months", method: "check root cause and corrective action recorded"}
          interviewees: [ciso, it_lead, auditor]
          pitfalls:
            - {id: p1, text: "Compliance checks only happen through the annual internal audit"}
            - {id: p2, text: "Scans run but deviations from baseline never triaged"}
        a.5.37:
          questions:
            - {id: q1, stage: 1, who: [service_desk], text: "Show me the list of documented operating procedures for your IT operations."}
            - {id: q2, stage: 2, who: [service_desk], text: "Pick a routine task such as backup or user creation. Show me the procedure and have the operator walk me through it."}
            - {id: q3, stage: 2, who: [service_desk], text: "Where does an on-call operator find the procedure at 3am, including when the main wiki or single sign-on is down?"}
          requests:
            - {id: r1, label: "Index of operating procedures with owner and review date", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.proc_register}
            - {id: r2, label: "Sample procedures (backup, restore, patching, account provisioning, monitoring)", kind: document}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "procedures", population: "documented operating procedures", method: "compare procedure to what the operator actually does"}
          interviewees: [service_desk, dev]
          pitfalls:
            - {id: p1, text: "Procedures out of date with the current tooling"}
            - {id: p2, text: "Key knowledge held by one person with no written procedure"}
        a.6.1:
          questions:
            - {id: q1, stage: 1, who: [hr], text: "Which checks do you run for which roles, and who decided that privileged roles need more?"}
            - {id: q2, stage: 2, who: [hr], text: "Show me the screening file for this engineer, and tell me whether the checks were finished before their first day."}
            - {id: q3, stage: 2, who: [proc, hr], text: "How do you make sure contractors and agency staff are screened to the level their role requires, and where is that written in the supplier contract?"}
            - {id: q4, stage: 2, who: [hr], text: "For critical or privileged roles, how and how often do you re-check that people are still suitable after they start?"}
          requests:
            - {id: r1, label: "Screening procedure with checks per role or risk level", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.bg_screening}
            - {id: r2, label: "Screening evidence for sampled hires (ID, right to work, references, criminal check where lawful)", kind: record}
            - {id: r3, label: "Contract clauses or attestations requiring suppliers to screen their staff", kind: document}
            - {id: r4, label: "HR starter list for the audit period with start dates", kind: record, fresh_days: 40}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "starters", population: "starters in the last 12 months", method: "compare screening completion date to start date and to the checks required for the role", note: "at least 2 in privileged or IT roles, plus 2 contractors"}
          interviewees: [hr, proc]
          pitfalls:
            - {id: p1, text: "Checks completed weeks after the start date with no documented interim restriction on access"}
            - {id: p2, text: "Contractors and staff from agencies excluded from screening because HR only covers payroll employees"}
            - {id: p3, text: "The same intrusive checks, such as criminal records, run for every role with no role-based rationale or confirmed legal basis in the local jurisdiction"}
            - {id: p4, text: "Screening happens only at hiring, with no re-check for people promoted into or holding critical roles"}
        a.6.2:
          questions:
            - {id: q1, stage: 1, who: [hr], text: "Where in the employment contract do staff accept their information security responsibilities?"}
            - {id: q2, stage: 2, who: [hr], text: "Pick a recent hire: show me what they signed and which policies it points to."}
          requests:
            - {id: r1, label: "Employment contract and contractor agreement templates with security clauses highlighted", kind: document}
            - {id: r2, label: "Signed contracts or acknowledgements for sampled starters", kind: record}
            - {id: r3, label: "Staff handbook or code of conduct referenced by the contract", kind: document}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "starters", population: "starters in the last 12 months", method: "check the signed contract or a signed addendum states security responsibilities and was in place before access was granted", note: "including 1 contractor"}
          interviewees: [hr, legal]
          pitfalls:
            - {id: p1, text: "Long-serving staff on contracts that say nothing about information security, with no addendum or signed acknowledgement filling the gap"}
            - {id: p2, text: "Contractor agreements managed by procurement with no security clauses at all"}
        a.6.3:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "How did you decide what goes into the awareness programme, and how does it change for developers or admins?"}
            - {id: q2, stage: 2, who: [hr, ciso], text: "What percentage of staff completed training this year, and what happens to those who did not?"}
            - {id: q3, stage: 2, who: [staff], text: "Tell me, without looking it up, how you would report a suspicious email here."}
            - {id: q4, stage: 2, who: [ciso], text: "When a policy or procedure changed this year, how did the people it affects find out? Show me."}
            - {id: q5, stage: 2, who: [ciso], text: "How do you check that awareness actually landed (quiz, test, observed behaviour)? Show me the latest results."}
          requests:
            - {id: r1, label: "Awareness and training plan with topics per audience", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_plan}
            - {id: r2, label: "Training completion report from the LMS for all staff", kind: record, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_register}
            - {id: r3, label: "Phishing simulation results and follow-up actions, if simulations are run", kind: record, fresh_days: 200}
            - {id: r4, label: "Role-based training records for the ISMS team and privileged users", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "staff from different departments", population: "current headcount plus contractors and supplier staff with access", method: "trace each name to a completion record and ask each a short awareness question during interviews", note: "include 1-2 external personnel"}
          interviewees: [staff, ciso, hr]
          pitfalls:
            - {id: p1, text: "Completion below target with no chasing or escalation recorded"}
            - {id: p2, text: "New starters not trained until the next annual campaign"}
            - {id: p3, text: "Training content generic and never updated after incidents or risk changes"}
        a.6.4:
          questions:
            - {id: q1, stage: 1, who: [hr], text: "Where is it written what happens when someone breaches a security policy, and do staff know about it?"}
            - {id: q2, stage: 2, who: [hr, legal], text: "Has the process been used since the last audit? Walk me through one case, anonymised if needed."}
          requests:
            - {id: r1, label: "Disciplinary procedure that explicitly covers security breaches", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.disciplinary}
            - {id: r2, label: "Anonymised log of security-related disciplinary cases", kind: record}
            - {id: r3, label: "Communication showing staff were made aware of the process", kind: record}
          sampling: []
          interviewees: [hr, legal]
          pitfalls:
            - {id: p1, text: "Generic HR disciplinary policy with no mention of information security, so incidents are handled informally"}
            - {id: p2, text: "Policy violations confirmed during incident review show no sign the disciplinary process was considered, nor a recorded reason for not using it"}
            - {id: p3, text: "Disciplinary process covers employees only; there is no contractual route to act on a contractor or supplier employee who breaks policy"}
        a.6.5:
          questions:
            - {id: q1, stage: 1, who: [hr], text: "Which obligations continue after someone leaves or changes role, and how are they told?"}
            - {id: q4, stage: 1, who: [hr], text: "In which contract or agreement are the duties that continue after leaving written down, and for how long do they apply?"}
            - {id: q2, stage: 2, who: [hr], text: "When someone leaves, how are they reminded of what still binds them, such as confidentiality?"}
            - {id: q3, stage: 2, who: [hr], text: "Show me the exit record for this leaver: which ongoing obligations were restated, and who took over their security duties?"}
          requests:
            - {id: r1, label: "Leaver procedure or exit checklist covering continuing obligations", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.hr_security}
            - {id: r2, label: "Completed exit checklists or exit letters for sampled leavers", kind: record}
            - {id: r3, label: "HR leaver list for the audit period with last working days", kind: record, fresh_days: 40}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "leavers", population: "leavers and role changes in the last 12 months", method: "check continuing obligations were stated in the contract and restated at exit, and any security role held was handed to a named person (asset return and access removal are checked under A.5.11 and A.5.18)", note: "including 1 mover and 1 contractor"}
          interviewees: [hr, iam]
          pitfalls:
            - {id: p1, text: "Exit checklist exists but is blank or missing for contractors and short-notice departures"}
            - {id: p2, text: "A mover or leaver held a security duty (owner of a risk or an asset, an on-call role) and nobody was formally named to take it over"}
        a.6.6:
          questions:
            - {id: q1, stage: 1, who: [legal], text: "Who has to sign an NDA, and when were the templates last reviewed by legal?"}
            - {id: q3, stage: 1, who: [legal], text: "What do your agreements say about how long confidentiality lasts and what happens to information when the relationship ends?"}
            - {id: q2, stage: 2, who: [proc, hr], text: "Show me signed agreements for these suppliers and staff who handle confidential data."}
          requests:
            - {id: r1, label: "NDA templates for staff, contractors and third parties", kind: document}
            - {id: r2, label: "Register of signed NDAs or signed copies for the sample", kind: record}
            - {id: r3, label: "Record of the last NDA template review", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "staff or contractors and 3 suppliers with data access", population: "people and suppliers with access to confidential information", method: "confirm a signed agreement exists and predates access"}
          interviewees: [legal, hr, proc]
          pitfalls:
            - {id: p1, text: "Supplier NDAs signed during sales talks expired or never covered the later service"}
            - {id: p2, text: "Templates never reviewed since adoption, so the review requirement is not met"}
        a.6.7:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "What rules apply when people work from home, a café or abroad, and where are they written?"}
            - {id: q2, stage: 2, who: [endpoint], text: "Show me how you enforce those rules technically on a laptop that is never in the office."}
            - {id: q3, stage: 2, who: [ciso], text: "Can staff work from another country, and who approves that?"}
            - {id: q4, stage: 2, who: [endpoint], text: "How do remote users authenticate to internal systems, and is any remote path still single-factor?"}
          requests:
            - {id: r1, label: "Remote working policy or section of the acceptable use policy", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.work}
            - {id: r2, label: "Endpoint compliance report showing encryption, screen lock and VPN or ZTNA posture", kind: technical, fresh_days: 40}
            - {id: r3, label: "Approvals for working from abroad", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "remote workers", population: "staff working partly or fully remotely", method: "check device compliance in the management console and ask each how they handle calls and printing at home"}
          interviewees: [staff, endpoint, ciso]
          pitfalls:
            - {id: p1, text: "Policy forbids public wifi or printing at home but nothing enforces or checks it"}
            - {id: p2, text: "Personal devices used for remote work with no MDM or conditional access"}
            - {id: p3, text: "Staff work from other countries for weeks without approval or a check of local legal constraints"}
        a.6.8:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "How should staff report a security event, and how did you tell them about those channels?"}
            - {id: q2, stage: 2, who: [staff], text: "If I saw something suspicious right now, how would I report it, and how fast would someone respond?"}
            - {id: q3, stage: 2, who: [sec_ops], text: "Show me reports from staff in the last few months and what was done with them."}
          requests:
            - {id: r1, label: "Event reporting procedure and the channels advertised to staff", kind: document}
            - {id: r2, label: "Ticket or mailbox log of staff-reported events with triage outcome", kind: record, fresh_days: 100}
            - {id: r3, label: "Phishing report button statistics", kind: technical, fresh_days: 100}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "reported events", population: "events reported by staff in the last 6 months", method: "check each report reached the defined channel promptly and was logged (triage quality is assessed under A.5.25)"}
          interviewees: [staff, sec_ops]
          pitfalls:
            - {id: p1, text: "Staff interviewed give different answers on how to report, or name a person who has left"}
            - {id: p2, text: "Very few reports logged, which an auditor may probe as a possible awareness or channel problem"}
            - {id: p3, text: "Reports handled in chat or by email with no record of triage"}
            - {id: p4, text: "Staff encouraged to confirm a suspected weakness themselves before reporting it, risking damage and lost evidence"}
        a.7.1:
          questions:
            - {id: q1, stage: 1, who: [ciso, facilities], text: "Which sites are in scope, and how did you define the boundary of each secure area?"}
            - {id: q2, stage: 2, who: [facilities], text: "Walk me around the perimeter. Where could someone get in without passing a control?"}
            - {id: q3, stage: 2, who: [ciso], text: "Where provider data centres are in scope, how do you know their perimeter controls are adequate? (Otherwise this is covered under A.5.19 to A.5.23.)"}
          requests:
            - {id: r1, label: "Site list and floor plans marking secure zones and entry points", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:phys.secure_area}
            - {id: r2, label: "Site tour: doors, windows, fire exits and loading areas on the perimeter", kind: observation}
            - {id: r3, label: "Current ISO 27001 certificate or SOC 2 report for hosting or colocation providers, with scope covering the used regions", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [facilities, ciso]
          pitfalls:
            - {id: p1, text: "Fire exits propped open or without alarms, giving an unmonitored way in"}
            - {id: p2, text: "Control marked not applicable for a remote-first company even though a small office or comms cupboard is in scope"}
            - {id: p3, text: "Provider SOC 2 report collected but its scope does not cover the region or service actually used (where provider sites are in scope)"}
        a.7.2:
          questions:
            - {id: q1, stage: 1, who: [facilities], text: "Which entry points to your sites are controlled, and how are badges, keys and visitors handled on paper?"}
            - {id: q2, stage: 2, who: [facilities], text: "How do visitors get in, who escorts them, and how long do you keep the visitor log?"}
            - {id: q3, stage: 2, who: [facilities], text: "When were badge rights to the server room last reviewed, and who removed the ones no longer needed?"}
            - {id: q4, stage: 2, who: [facilities], text: "Who holds keys or door codes for restricted rooms, when were codes last changed, and how are delivery areas kept apart from secure zones?"}
          requests:
            - {id: r1, label: "Visitor log for a recent period", kind: record, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:phys.visitor_mgmt}
            - {id: r2, label: "Badge system export of people with access to restricted zones", kind: technical, fresh_days: 40}
            - {id: r3, label: "Records of the last physical access rights review", kind: record, fresh_days: 200}
            - {id: r4, label: "Site tour: reception, badge readers, tailgating behaviour at entry points", kind: observation}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "leavers and 5 badge holders for restricted zones", population: "badge database and leavers in the last 12 months", method: "check leaver badges were disabled on the last day and that each restricted-zone holder has a role justification"}
          interviewees: [facilities, hr]
          pitfalls:
            - {id: p1, text: "Badges of leavers still active because HR does not notify facilities or the building manager"}
            - {id: p2, text: "Auditor follows staff through a door without being challenged"}
            - {id: p3, text: "Visitor log incomplete, with no exit times or host names"}
            - {id: p4, text: "Server room door code unchanged for years and known to former staff or contractors"}
        a.7.3:
          questions:
            - {id: q1, stage: 1, who: [facilities], text: "Which rooms did you mark as needing extra protection, and how did you choose them?"}
            - {id: q2, stage: 2, who: [facilities], text: "Which rooms hold sensitive information or equipment, and how are they protected from casual view and entry?"}
            - {id: q3, stage: 2, who: [facilities], text: "Is there anything in public building directories or signage that tells outsiders where the sensitive rooms are?"}
          requests:
            - {id: r1, label: "List of sensitive rooms such as server rooms, HR and finance offices, with their protections", kind: document}
            - {id: r2, label: "Site tour: locks, window coverings and signage of sensitive rooms", kind: observation}
          sampling: []
          interviewees: [facilities]
          pitfalls:
            - {id: p1, text: "Server room labelled on the door and visible from a public corridor"}
            - {id: p2, text: "Meeting rooms with screens or whiteboards visible through glass from the street"}
        a.7.4:
          questions:
            - {id: q1, stage: 1, who: [facilities], text: "What do you monitor physically, why those areas, and how long do you keep footage?"}
            - {id: q2, stage: 2, who: [facilities], text: "Show me the last alarm test and what happened when an alarm went off out of hours."}
            - {id: q3, stage: 2, who: [facilities], text: "If you record video, can you retrieve footage from last Tuesday morning for this door right now?"}
          requests:
            - {id: r1, label: "Coverage map of cameras, alarm zones and sensors against secure areas", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:phys.cctv}
            - {id: r2, label: "Alarm and intrusion test log with dates and results", kind: record, fresh_days: 100}
            - {id: r3, label: "CCTV retention and access rules, with the privacy notice and signage required by local law", kind: document}
            - {id: r4, label: "Live retrieval of a recorded clip from a chosen date, if video recording is used", kind: observation}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "alarm events", population: "alarms and out-of-hours events in the last 6 months", method: "trace each event to a response record and check response time against the defined target"}
          interviewees: [facilities, sec_ops]
          pitfalls:
            - {id: p1, text: "Cameras installed but recording failed or the retention is shorter than stated, discovered when footage is requested"}
            - {id: p2, text: "Alarms with no defined out-of-hours responder or an outdated call list"}
            - {id: p3, text: "Monitoring delegated to the landlord with no agreement or report showing what they actually do"}
            - {id: p4, text: "CCTV recorder or alarm panel reachable on the office network or the internet with default credentials"}
            - {id: p5, text: "SoA carried over from the 2013 version with no line or justification for this control, which is new in 2022"}
        a.7.5:
          questions:
            - {id: q1, stage: 1, who: [risk, facilities], text: "Which physical and environmental threats did you consider for each site, such as flood, fire or heat?"}
            - {id: q2, stage: 2, who: [facilities], text: "Show me the fire suppression and detection inspection records for the server room."}
          requests:
            - {id: r1, label: "Risk assessment entries for natural and environmental threats per site", kind: record}
            - {id: r2, label: "Fire detection and suppression inspection certificates", kind: record, fresh_days: 400}
            - {id: r3, label: "Site tour: water pipes, flood exposure and combustible storage near equipment", kind: observation}
          sampling: []
          interviewees: [facilities, risk]
          pitfalls:
            - {id: p1, text: "Server room below ground or under water pipes with no leak detection and no risk entry"}
            - {id: p2, text: "Cardboard and spare equipment stored in the server room, adding fire load"}
        a.7.6:
          questions:
            - {id: q1, stage: 1, who: [facilities], text: "What rules apply inside your secure areas, and who are they shown to?"}
            - {id: q2, stage: 2, who: [facilities], text: "What rules apply inside secure areas, for example on phones, photography and lone working?"}
            - {id: q3, stage: 2, who: [infra], text: "How is a third-party engineer supervised when they work in the server room?"}
          requests:
            - {id: r1, label: "Rules for working in secure areas, posted and documented", kind: document}
            - {id: r2, label: "Server room access log or sign-in sheet for third parties", kind: record, fresh_days: 100}
            - {id: r3, label: "Site tour: posted rules and state of the secure area", kind: observation}
          sampling:
            - {id: s1, min: 3, max: 3, unit: "third-party visits", population: "secure area visits in the last 6 months", method: "check each was authorised in advance and escorted"}
          interviewees: [facilities, infra]
          pitfalls:
            - {id: p1, text: "Contractors given a code or badge for the server room and left to work alone"}
            - {id: p2, text: "Server room used as storage, so many people have a reason to enter"}
        a.7.7:
          questions:
            - {id: q1, stage: 1, who: [facilities], text: "Show me your clear desk and clear screen rule. Does it cover home and shared workspaces?"}
            - {id: q2, stage: 2, who: [staff], text: "What is the rule for desks and screens when people step away, and how do you check it is followed?"}
            - {id: q3, stage: 2, who: [staff], text: "What happens to documents left on the printer?"}
          requests:
            - {id: r1, label: "Clear desk and clear screen policy", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:phys.clear_desk}
            - {id: r2, label: "Screen lock timeout setting from the device management console", kind: technical, fresh_days: 40}
            - {id: r3, label: "Records of clear desk walk-arounds and follow-up", kind: record, fresh_days: 200}
            - {id: r4, label: "Site tour: unattended desks, printers, whiteboards and unlocked screens", kind: observation}
          sampling:
            - {id: s1, min: 10, max: 15, unit: "desks and the shared printers", population: "open-plan areas visited during the tour", method: "observe at random times, ideally at lunch or end of day"}
          interviewees: [staff, facilities]
          pitfalls:
            - {id: p1, text: "Sensitive printouts left on printers and whiteboards not wiped after meetings"}
            - {id: p2, text: "Screen lock enforced on laptops but not on shared or meeting room devices"}
            - {id: p3, text: "No lockable storage provided, so the policy cannot be followed"}
        a.7.8:
          questions:
            - {id: q1, stage: 1, who: [infra, facilities], text: "How did you decide where critical equipment sits and what protects it from damage and overlooking?"}
            - {id: q2, stage: 2, who: [infra], text: "Why is this equipment placed where it is, and what protects it from damage and unauthorised viewing?"}
          requests:
            - {id: r1, label: "Site tour: rack layout, cooling, equipment positioning and screens facing windows", kind: observation}
            - {id: r2, label: "Environmental monitoring readings for temperature and humidity in equipment rooms", kind: technical, fresh_days: 40}
          sampling: []
          interviewees: [facilities, infra]
          pitfalls:
            - {id: p1, text: "Network equipment in an open office cupboard or under a desk, reachable by anyone"}
            - {id: p2, text: "Equipment room with no temperature monitoring or alerting"}
        a.7.9:
          questions:
            - {id: q1, stage: 1, who: [endpoint], text: "What are the rules for laptops, phones and media used outside your premises?"}
            - {id: q2, stage: 2, who: [endpoint], text: "How do you protect laptops and other assets that leave the office, and what happens when one is lost?"}
            - {id: q3, stage: 2, who: [endpoint], text: "Show me the last lost or stolen device report and the actions taken."}
            - {id: q4, stage: 2, who: [endpoint], text: "Which of your equipment sits permanently outside your premises (kiosks, antennas, branch or remote-site network kit), and how is it protected against tampering and theft?"}
          requests:
            - {id: r1, label: "Rules for assets used off site, in the acceptable use or remote working policy", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.work}
            - {id: r2, label: "Device encryption and remote wipe compliance report", kind: technical, fresh_days: 40}
            - {id: r3, label: "Lost or stolen device incident records", kind: record}
            - {id: r4, label: "Record of approved equipment removals or custody hand-overs, where you require them", kind: record}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "devices from the asset register", population: "laptops and mobiles issued to staff", method: "check encryption status and remote wipe enrollment in the management console"}
          interviewees: [endpoint, staff]
          pitfalls:
            - {id: p1, text: "Devices taken off site left unattended in vehicles or public places, and nobody reports or investigates it"}
            - {id: p2, text: "Lost device reported but no evidence it was wiped or that data exposure was assessed"}
        a.7.10:
          questions:
            - {id: q1, stage: 1, who: [endpoint], text: "Do you allow removable media at all? If yes, how is it controlled through its lifecycle?"}
            - {id: q3, stage: 1, who: [endpoint], text: "How do your media handling rules change with the classification level, from purchase through transport to disposal, and do they include paper?"}
            - {id: q2, stage: 2, who: [endpoint], text: "What stops sensitive data leaving on USB storage: a technical block, enforced encryption or something else? Show me."}
          requests:
            - {id: r1, label: "Removable media and storage media handling rules", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.removable_media}
            - {id: r2, label: "Endpoint policy blocking or encrypting removable storage, with exceptions list", kind: technical, fresh_days: 40}
            - {id: r3, label: "Register or transfer log for media carrying sensitive data, such as backup tapes", kind: record}
          sampling:
            - {id: s1, min: 3, max: 3, unit: "exceptions or media transfers", population: "approved USB exceptions and physical media transfers in the last 12 months", method: "check approval, encryption and return or destruction"}
          interviewees: [endpoint, sec_ops]
          pitfalls:
            - {id: p1, text: "USB storage technically allowed despite a policy that forbids it"}
            - {id: p2, text: "Exception list grows over time with no expiry or review"}
            - {id: p3, text: "Media rules make no reference to the classification scheme, so a confidential disk is handled like a public one"}
        a.7.11:
          questions:
            - {id: q1, stage: 1, who: [infra, facilities], text: "Which utilities do your critical systems depend on, and what backs each one up?"}
            - {id: q2, stage: 2, who: [infra], text: "What happens to the server room and network if mains power fails for two hours?"}
            - {id: q3, stage: 2, who: [facilities], text: "When was the UPS or generator last tested under load?"}
            - {id: q4, stage: 2, who: [infra], text: "Are UPS, HVAC or building management controllers on a separate network, and can any of them be reached from the internet?"}
          requests:
            - {id: r1, label: "UPS and generator maintenance and load test records", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:phys.power_env}
            - {id: r2, label: "Utility dependency list covering power, cooling, network and telecoms", kind: document}
            - {id: r3, label: "Site tour: UPS status panel and battery age", kind: observation}
          sampling: []
          interviewees: [facilities, infra]
          pitfalls:
            - {id: p1, text: "UPS batteries past their replacement date and never tested"}
            - {id: p2, text: "Single internet line or cooling unit with no risk entry or fallback"}
        a.7.12:
          questions:
            - {id: q1, stage: 1, who: [network, facilities], text: "Where are your power and network cables documented, and which runs did you decide to protect?"}
            - {id: q2, stage: 2, who: [network, facilities], text: "Where do your power and network cables run, and could someone tap or damage them without being noticed?"}
          requests:
            - {id: r1, label: "Site tour: patch panels, cable trunking and comms cupboards", kind: observation}
            - {id: r2, label: "Cabling plan or labelled patch panel documentation", kind: document}
          sampling: []
          interviewees: [facilities, network]
          pitfalls:
            - {id: p1, text: "Comms cupboards in shared corridors left unlocked"}
            - {id: p2, text: "Unlabelled patching, so nobody can say what an active port in a meeting room connects to"}
        a.7.13:
          questions:
            - {id: q1, stage: 1, who: [facilities, infra], text: "Which equipment has scheduled maintenance, and who is allowed to carry it out?"}
            - {id: q2, stage: 2, who: [infra], text: "Who maintains your critical equipment, how often, and how do you control their access to it?"}
            - {id: q3, stage: 2, who: [infra], text: "What happens to data on equipment that goes away for repair?"}
          requests:
            - {id: r1, label: "Maintenance schedule for critical equipment, aligned with supplier recommendations", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.maintenance}
            - {id: r2, label: "Maintenance and service records for sampled equipment", kind: record, fresh_days: 400}
            - {id: r3, label: "Maintenance contracts or SLAs for UPS, air conditioning and fire systems", kind: document}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "critical items", population: "critical equipment in the asset register", method: "compare last service date to the planned interval"}
          interviewees: [facilities, infra]
          pitfalls:
            - {id: p1, text: "Maintenance contracts lapsed and nobody noticed because invoices go to another department"}
            - {id: p2, text: "Disks returned under warranty with no wipe, no destruction and no keep-your-drive or vendor sanitisation arrangement"}
        a.7.14:
          questions:
            - {id: q1, stage: 1, who: [endpoint], text: "What is your procedure before equipment holding data is reused, returned or thrown away?"}
            - {id: q2, stage: 2, who: [endpoint], text: "Take me through what happens to a laptop from the moment it is retired to its disposal."}
            - {id: q3, stage: 2, who: [proc], text: "How do you know your disposal provider actually destroyed what you gave them?"}
            - {id: q4, stage: 2, who: [endpoint], text: "Who checks that a wipe actually succeeded, and are licensed software and organisation labels removed before reuse or resale?"}
          requests:
            - {id: r1, label: "Disposal and reuse procedure covering wiping or destruction methods", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.disposal}
            - {id: r2, label: "Certificates of destruction from the disposal provider", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:phys.equipment_disposal}
            - {id: r3, label: "Wipe logs for reissued devices", kind: record}
            - {id: r4, label: "Site tour: storage of retired equipment awaiting disposal", kind: observation}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "disposed or reissued devices", population: "assets marked retired in the last 12 months", method: "trace serial numbers from the asset register to a wipe log or destruction certificate"}
          interviewees: [endpoint, proc]
          pitfalls:
            - {id: p1, text: "Destruction certificates list weights or counts, not serial numbers, so nothing traces back to the register"}
            - {id: p2, text: "Pile of retired laptops in an unlocked store room with data still on them"}
            - {id: p3, text: "Printers and copiers with internal disks returned to the leasing company without wiping"}
        a.8.1:
          questions:
            - {id: q1, stage: 1, who: [endpoint], text: "Which rules apply to laptops and phones that hold company data, and where are they written down?"}
            - {id: q2, stage: 2, who: [endpoint, staff], text: "Pick any laptop in this room. Show me it is encrypted, managed and patched."}
            - {id: q3, stage: 2, who: [endpoint], text: "What happens when a device is lost or stolen? Walk me through the last case."}
          requests:
            - {id: r1, label: "Endpoint or acceptable use policy covering company and personal devices", kind: document}
            - {id: r2, label: "MDM or endpoint management export: device list with encryption, OS version and last check-in", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.mdm}
            - {id: r3, label: "Lost or stolen device records showing the procedure followed (for example lock or remote wipe)", kind: record}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "devices", population: "managed endpoint inventory", method: "pick devices from the MDM list and from people met on site, compare compliance status with the policy"}
          interviewees: [endpoint, staff]
          pitfalls:
            - {id: p1, text: "Device inventory does not match HR headcount: some staff use unmanaged laptops"}
            - {id: p2, text: "Personal phones read company email with no MDM or app protection policy, even though BYOD is said to be banned"}
            - {id: p3, text: "Devices that stopped checking in months ago are still counted as compliant"}
        a.8.2:
          questions:
            - {id: q1, stage: 1, who: [ciso], text: "How do you define a privileged account, and who approves granting one?"}
            - {id: q2, stage: 2, who: [iam], text: "Show me the list of admin accounts on your identity provider, cloud console and production servers today."}
            - {id: q3, stage: 2, who: [iam], text: "Do administrators use a separate account for admin work, or their everyday account?"}
            - {id: q4, stage: 2, who: [iam], text: "How do you limit privileged access in time, including break-glass accounts, and where is privileged activity logged?"}
          requests:
            - {id: r1, label: "Inventory of privileged accounts, including service and break-glass accounts, with named owners", kind: record, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:doc.pam_register}
            - {id: r2, label: "Approval tickets for privileged access granted in the audit period", kind: record}
            - {id: r3, label: "Last privileged access review with reviewer, decisions and removals applied", kind: record, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:proc.pam}
            - {id: r4, label: "Live export of admin role members from the IdP and main cloud tenant", kind: technical, fresh_days: 40}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "privileged accounts", population: "current admin role members across IdP, cloud and production", method: "trace each to an approval and a review entry; check for leavers and shared logins"}
          interviewees: [iam, ciso]
          pitfalls:
            - {id: p1, text: "No single list of privileged accounts exists; it is rebuilt for the audit"}
            - {id: p2, text: "Global admin role held by more people than needed, including former contractors"}
            - {id: p3, text: "Service accounts with admin rights have no owner, and their credentials are not managed or changed when an administrator leaves"}
            - {id: p4, text: "Administrators never acknowledged the rules that apply to their privileged accounts"}
        a.8.3:
          questions:
            - {id: q1, stage: 1, who: [iam], text: "How do you decide who can see what inside your main business applications?"}
            - {id: q2, stage: 2, who: [iam, staff], text: "Log in with a standard user and show me you cannot open records outside that user's role."}
            - {id: q3, stage: 2, who: [iam], text: "How do you control access to shared drives and SharePoint sites holding confidential data?"}
          requests:
            - {id: r1, label: "Role or permission matrix for key applications", kind: document}
            - {id: r2, label: "Export of permissions on a confidential share or site", kind: technical, fresh_days: 40}
            - {id: r3, label: "Configuration showing how access is enforced per role in one business application (periodic reviews are checked under A.5.18)", kind: technical, fresh_days: 400}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "users", population: "users of one critical application", method: "compare actual permissions with role matrix and job title"}
          interviewees: [iam, staff]
          pitfalls:
            - {id: p1, text: "Confidential folders shared with 'Everyone' or via anonymous links"}
            - {id: p2, text: "Role matrix exists on paper but application permissions were granted ad hoc"}
        a.8.4:
          questions:
            - {id: q1, stage: 1, who: [dev], text: "Who may read or change source code, and where is that rule written for each repository?"}
            - {id: q2, stage: 2, who: [dev], text: "Who has write access to your source code repositories, and how is that reviewed?"}
            - {id: q3, stage: 2, who: [dev], text: "Can a developer push directly to the main branch? Show me the branch protection settings."}
            - {id: q4, stage: 2, who: [dev], text: "Who can change CI/CD pipelines, build tools and internal package registries?"}
          requests:
            - {id: r1, label: "Repository access list with roles per repo or group", kind: technical, fresh_days: 40}
            - {id: r2, label: "Branch protection or merge rule screenshots for production repositories", kind: technical, fresh_days: 40}
            - {id: r3, label: "Offboarding evidence removing a leaver from the code platform", kind: record}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "repositories", population: "production code repos and recent leavers with dev access", method: "check protection settings and confirm leaver accounts removed"}
            - {id: s2, min: 3, max: 3, unit: "leavers", population: "production code repos and recent leavers with dev access", method: "check protection settings and confirm leaver accounts removed"}
          interviewees: [dev]
          pitfalls:
            - {id: p1, text: "Ex-employees or external contractors still members of the GitHub or GitLab organisation"}
            - {id: p2, text: "Admins can bypass branch protection and do so without trace of review"}
            - {id: p3, text: "Write access to production repositories or build pipelines broader than the designated owners"}
        a.8.5:
          questions:
            - {id: q1, stage: 1, who: [iam], text: "What is your password and MFA rule, and which systems does it cover?"}
            - {id: q4, stage: 1, who: [iam], text: "How did you decide which systems and accounts need MFA or other stronger authentication?"}
            - {id: q2, stage: 2, who: [iam], text: "Show me the MFA enforcement settings and the list of users or apps excluded from it."}
            - {id: q3, stage: 2, who: [iam], text: "How do you handle legacy protocols and apps that cannot do MFA?"}
          requests:
            - {id: r1, label: "Authentication standard: password rules, MFA scope, lockout", kind: document}
            - {id: r2, label: "IdP conditional access or MFA policy configuration export", kind: technical, fresh_days: 40}
            - {id: r3, label: "Report of accounts without MFA registered", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.mfa}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "systems", population: "internet-facing and critical apps", method: "test login flow and confirm SSO or MFA is enforced"}
          interviewees: [iam]
          pitfalls:
            - {id: p1, text: "Where policy requires MFA, it is enforced for staff but excluded for admin, service or 'VIP' accounts"}
            - {id: p2, text: "Legacy authentication still allowed, bypassing MFA"}
            - {id: p3, text: "Some SaaS tools use local logins outside SSO with weak passwords"}
        a.8.6:
          questions:
            - {id: q1, stage: 1, who: [infra], text: "Which resources do you track for capacity, and what thresholds trigger action?"}
            - {id: q2, stage: 2, who: [infra], text: "How do you know when a critical system is running out of storage, CPU or licences before it fails?"}
            - {id: q3, stage: 2, who: [infra], text: "Show me a capacity alert and what was done about it."}
            - {id: q4, stage: 2, who: [infra], text: "How do you project future capacity needs for new business or projects, especially resources with long lead times?"}
          requests:
            - {id: r1, label: "Monitoring dashboard or thresholds for critical systems", kind: technical, fresh_days: 40}
            - {id: r2, label: "Capacity review or planning minutes, or ticket resulting from a capacity alert", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.capacity_mgmt}
          sampling: []
          interviewees: [infra]
          pitfalls:
            - {id: p1, text: "Thresholds configured but alerts go to an unmonitored mailbox"}
            - {id: p2, text: "Past incident caused by full disk or quota with no follow-up capacity action"}
        a.8.7:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "What is your malware protection approach across endpoints, servers, email and cloud?"}
            - {id: q2, stage: 2, who: [sec_ops, endpoint], text: "What anti-malware or EDR covers your endpoints and servers, and how do you know none are missing it?"}
            - {id: q3, stage: 2, who: [sec_ops], text: "Show me the last malware detection and how it was handled."}
            - {id: q4, stage: 2, who: [staff, sec_ops], text: "How do staff learn to spot phishing, and what happens when they report one?"}
          requests:
            - {id: r1, label: "Anti-malware or EDR console export: coverage, agent health, outdated agents", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.endpoint_protection}
            - {id: r2, label: "Detection or quarantine events with handling tickets", kind: record, fresh_days: 100}
            - {id: r3, label: "Email filtering configuration and phishing awareness records", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:tech.mail_gateway}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "devices", population: "asset inventory and malware detections", method: "reconcile the inventory against protected devices; trace detections to closure"}
            - {id: s2, min: 2, max: 2, unit: "detections", population: "asset inventory and malware detections", method: "reconcile the inventory against protected devices; trace detections to closure"}
          interviewees: [sec_ops, endpoint, staff]
          pitfalls:
            - {id: p1, text: "Asset inventory and EDR agent count differ, servers or Linux hosts left uncovered"}
            - {id: p2, text: "Local admins can disable the agent and some have"}
        a.8.8:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "What are your remediation deadlines per severity, and what is in scope of scanning?"}
            - {id: q4, stage: 1, who: [sec_ops], text: "How do you learn about new vulnerabilities in software and devices you cannot scan (vendor advisories, CVE feeds, supplier notices), and who triages them against your asset inventory?"}
            - {id: q2, stage: 2, who: [sec_ops], text: "Show me your latest scan and how many criticals are past their deadline."}
            - {id: q3, stage: 2, who: [sec_ops, infra], text: "Take this critical from three months ago: when was it found, when fixed, and how did you verify the fix?"}
          requests:
            - {id: r1, label: "Vulnerability management procedure with severity based SLAs", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.vulnerability}
            - {id: r2, label: "Latest internal and external vulnerability scan reports", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.vuln_scanner}
            - {id: r3, label: "Latest penetration test or vulnerability assessment report, if performed, and its remediation tracker", kind: record, reference_control: urn:intuitem:risk:function:doc-pol:proc.pentest}
            - {id: r4, label: "Patch compliance report for servers and endpoints", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:proc.update}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "high or critical findings", population: "scan and pentest findings in the audit period", method: "check detection date, ticket, fix date versus SLA, rescan evidence; exceptions need risk acceptance"}
          interviewees: [sec_ops, infra]
          pitfalls:
            - {id: p1, text: "Scans run but critical findings sit open for months with no risk acceptance"}
            - {id: p2, text: "Scan scope misses cloud workloads, containers or newly added subnets"}
            - {id: p3, text: "Pentest findings not tracked to closure; same issues reappear in next report"}
        a.8.9:
          questions:
            - {id: q1, stage: 1, who: [infra], text: "Which secure configuration baselines do you use for servers, endpoints, network gear and cloud, and who owns them?"}
            - {id: q2, stage: 2, who: [infra], text: "Show me how you detect a system that has drifted from its baseline."}
            - {id: q3, stage: 2, who: [infra], text: "Here is a production server: show me its current settings against the baseline."}
          requests:
            - {id: r1, label: "Hardening baselines or templates (for example CIS based) per platform, with version and review date", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.hardening}
            - {id: r2, label: "Configuration compliance or drift report from a tool (Intune, GPO, CSPM, Ansible, Terraform state)", kind: technical, fresh_days: 40}
            - {id: r3, label: "Records of deviations from baseline with approval", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "systems", population: "critical servers, network devices and cloud accounts", method: "compare live configuration to the documented baseline"}
          interviewees: [infra, sec_ops]
          pitfalls:
            - {id: p1, text: "Baseline referenced in policy but never tailored, versioned or reviewed"}
            - {id: p2, text: "Network devices and cloud services left out; only Windows covered by GPO"}
            - {id: p3, text: "Default passwords or services still active on appliances"}
        a.8.10:
          questions:
            - {id: q1, stage: 1, who: [dpo, legal], text: "How do you decide when information must be deleted, and is that tied to your retention schedule?"}
            - {id: q2, stage: 2, who: [infra], text: "Show me that data past its retention date was deleted in an application, and how backup retention makes old copies expire."}
            - {id: q3, stage: 2, who: [infra], text: "How are disks and devices wiped or destroyed when retired, and by whom?"}
          requests:
            - {id: r1, label: "Retention and deletion schedule per data category", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.retention}
            - {id: r2, label: "Deletion logs or purge job outputs from a key system", kind: record, fresh_days: 400}
            - {id: r3, label: "Certificates of destruction or wipe reports for retired media", kind: record, reference_control: urn:intuitem:risk:function:doc-pol:phys.equipment_disposal}
            - {id: r4, label: "Contract clauses or attestations of deletion from SaaS and cloud providers", kind: document}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "retired devices", population: "assets disposed in audit period", method: "trace asset tag to wipe or destruction certificate; check records older than retention period are gone"}
            - {id: s2, min: 1, max: 1, unit: "data category", population: "assets disposed in audit period", method: "trace asset tag to wipe or destruction certificate; check records older than retention period are gone"}
          interviewees: [infra, dpo, legal]
          pitfalls:
            - {id: p1, text: "Retention periods defined but no deletion mechanism exists; data is kept forever"}
            - {id: p2, text: "Disposed laptops have no wipe or destruction certificate linked to serial numbers"}
            - {id: p3, text: "Deletion of former customers' data in SaaS tools never requested or confirmed"}
        a.8.11:
          questions:
            - {id: q1, stage: 1, who: [dpo], text: "Where do you use masking, pseudonymisation or anonymisation, and what drove that decision?"}
            - {id: q2, stage: 2, who: [dev], text: "Show me how personal data looks in your test or analytics environment."}
            - {id: q3, stage: 2, who: [dev], text: "Which users see full card numbers or IDs in the application, and why?"}
            - {id: q4, stage: 2, who: [dpo, dev], text: "How did you check that pseudonymised or anonymised data cannot be re-identified by combining fields?"}
          requests:
            - {id: r1, label: "Data masking or pseudonymisation rules mapped to data classification", kind: document}
            - {id: r2, label: "Screenshot of masked fields in application or non-production database", kind: technical, fresh_days: 100}
            - {id: r3, label: "Role configuration showing who can unmask data", kind: technical, fresh_days: 100}
          sampling:
            - {id: s1, min: 1, max: 2, unit: "datasets", population: "non-production copies and reporting extracts", method: "inspect records for unmasked personal or sensitive data"}
          interviewees: [dev, dpo]
          pitfalls:
            - {id: p1, text: "Production database cloned to test with real personal data and no masking"}
            - {id: p2, text: "Control marked applicable with no defined approach; or excluded without justification while personal data is processed"}
            - {id: p3, text: "Data called anonymised can still be re-identified by combining fields, and nobody checked"}
            - {id: p4, text: "Least privilege offered as the masking measure; the auditor wants which data is masked, by which technique and with which tool"}
        a.8.12:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "Which channels could sensitive data leak through, and which ones do you control?"}
            - {id: q2, stage: 2, who: [endpoint], text: "Show me what happens if I email a file labelled confidential to a personal address or copy it to USB."}
            - {id: q3, stage: 2, who: [sec_ops], text: "If a DLP tool is used, who reviews its alerts and what did the last ones lead to?"}
          requests:
            - {id: r1, label: "Leakage channel analysis: sensitive information types, channels, and the measure chosen for each channel", kind: document}
            - {id: r2, label: "DLP tool configuration export, if a DLP tool is used (M365 Purview, CASB, endpoint)", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.dlp}
            - {id: r3, label: "DLP alert log and triage records, if a DLP tool is used", kind: record, fresh_days: 100}
          sampling:
            - {id: s1, min: 5, max: 5, unit: "alerts", population: "DLP events in the last quarter, if a DLP tool is used", method: "check each was reviewed and closed with a decision"}
          interviewees: [sec_ops, endpoint]
          pitfalls:
            - {id: p1, text: "DLP in audit-only mode since rollout, alerts never reviewed"}
            - {id: p2, text: "Rules do not match the classification scheme so labelled data is not detected"}
            - {id: p3, text: "Personal cloud storage, USB and unmanaged browsers not covered"}
            - {id: p4, text: "Monitoring of staff communications deployed without checking privacy law or works council obligations"}
        a.8.13:
          questions:
            - {id: q1, stage: 1, who: [infra], text: "What is backed up, how often, how long is it kept, and where are copies held?"}
            - {id: q2, stage: 2, who: [infra], text: "When did you last restore from backup as a test, and what was the result?"}
            - {id: q3, stage: 2, who: [infra], text: "Could ransomware with admin rights delete or encrypt your backups?"}
          requests:
            - {id: r1, label: "Backup policy or schedule per system with RPO and retention", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.backup}
            - {id: r2, label: "Backup job reports showing success and failures", kind: technical, fresh_days: 40}
            - {id: r3, label: "Restore test records with date, scope, outcome and duration", kind: record, fresh_days: 400}
            - {id: r4, label: "Evidence of how backup copies are kept apart from, and protected against a compromise of, production (offsite, offline or immutable, as the risk assessment requires)", kind: technical, fresh_days: 100}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "systems", population: "critical systems in the asset register", method: "check each appears in backup jobs, verify recent success and at least one restore test"}
          interviewees: [infra]
          pitfalls:
            - {id: p1, text: "No restore test ever performed, or only single file restores"}
            - {id: p2, text: "SaaS data (M365, CRM) assumed backed up by the provider"}
            - {id: p3, text: "Failed jobs recurring for weeks with no ticket"}
        a.8.14:
          questions:
            - {id: q1, stage: 1, who: [infra], text: "Which services need redundancy, and how did you derive that from their availability requirements?"}
            - {id: q2, stage: 2, who: [infra], text: "Which systems must stay available, and what redundancy do they have?"}
            - {id: q3, stage: 2, who: [infra], text: "Have you tested a failover? Show me the result."}
          requests:
            - {id: r1, label: "Availability requirements per critical service (from BIA or risk assessment)", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.bia}
            - {id: r2, label: "Architecture diagram showing redundant components, zones or sites", kind: document}
            - {id: r3, label: "Failover test report", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [infra]
          pitfalls:
            - {id: p1, text: "Single points of failure (one firewall, one internet link, one region) not covered by risk treatment"}
            - {id: p2, text: "Redundancy designed but never tested"}
        a.8.15:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "What events do you log, on which systems, and how long do you keep logs?"}
            - {id: q2, stage: 2, who: [infra], text: "Show me the admin login events for this server from last month."}
            - {id: q3, stage: 2, who: [sec_ops], text: "Who can delete or alter logs, and how would you know?"}
            - {id: q4, stage: 2, who: [sec_ops], text: "Who analyses these logs, how often? Show me a recent review and what came of it."}
          requests:
            - {id: r1, label: "Logging standard: sources, event types, retention", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.logging}
            - {id: r2, label: "List of log sources onboarded to the SIEM or log platform", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.siem}
            - {id: r3, label: "Log retention settings and access rights to the log store", kind: technical, fresh_days: 100}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "systems", population: "critical assets", method: "confirm each sends logs, retrieve a specific historic event within retention"}
          interviewees: [sec_ops, infra]
          pitfalls:
            - {id: p1, text: "Critical apps or cloud services not sending logs centrally"}
            - {id: p2, text: "Retention shorter than policy, e.g. 30 day default in a SaaS tier"}
            - {id: p3, text: "Admins can clear the logs of their own activity"}
        a.8.16:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "What counts as abnormal behaviour on your network and systems, and who is responsible for watching for it?"}
            - {id: q2, stage: 2, who: [sec_ops], text: "Show me your monitoring console and walk me through an alert from detection to closure."}
            - {id: q3, stage: 2, who: [sec_ops], text: "Is monitoring coverage outside working hours defined, and does it match how critical the systems are?"}
          requests:
            - {id: r1, label: "Monitoring procedure: use cases, alert severities, response times, on-call", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.monitor}
            - {id: r2, label: "Monitoring rules or use cases (SIEM, MDR, IDS or equivalent) and the sources they cover", kind: technical, fresh_days: 40}
            - {id: r3, label: "Alert triage tickets or MDR monthly reports", kind: record, fresh_days: 100}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "alerts", population: "alerts raised in last 3 months", method: "check each was triaged within target time and outcome recorded"}
          interviewees: [sec_ops]
          pitfalls:
            - {id: p1, text: "SIEM collects logs but nobody reviews alerts; queue of thousands untouched"}
            - {id: p2, text: "Monitoring outsourced to an MSSP with no reports reviewed internally"}
            - {id: p3, text: "No baseline of normal activity, so 'anomalous' is undefined"}
        a.8.17:
          questions:
            - {id: q1, stage: 1, who: [infra], text: "Which time source do your systems use, and where is that standard documented?"}
            - {id: q2, stage: 2, who: [infra], text: "Which time source do your systems use, and how do you know they agree?"}
          requests:
            - {id: r1, label: "NTP configuration on domain controllers, network devices and cloud", kind: technical, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:proc.ntp}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "systems", population: "servers and network devices", method: "compare system time and NTP source settings"}
          interviewees: [infra]
          pitfalls:
            - {id: p1, text: "Network appliances or OT devices with their own drifting clock"}
            - {id: p2, text: "Mixed time zones in logs without UTC normalisation, making correlation hard"}
        a.8.18:
          questions:
            - {id: q1, stage: 1, who: [iam], text: "Which tools let an admin bypass normal security controls, and who may use them?"}
            - {id: q2, stage: 2, who: [iam], text: "Which tools can override system or security controls here, and who can run them?"}
            - {id: q3, stage: 2, who: [sec_ops], text: "How do you stop a normal user from running admin tools or scripting engines?"}
          requests:
            - {id: r1, label: "List of restricted utility programs and who is authorised", kind: document}
            - {id: r2, label: "Application control or local admin restriction configuration", kind: technical, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:tech.app_control}
          sampling: []
          interviewees: [iam, sec_ops]
          pitfalls:
            - {id: p1, text: "All users are local administrators on their laptops"}
            - {id: p2, text: "No list of what is considered a privileged utility"}
        a.8.19:
          questions:
            - {id: q1, stage: 1, who: [endpoint], text: "Who may install software on production systems, and from which approved sources?"}
            - {id: q2, stage: 2, who: [staff, endpoint], text: "Can a user install software on their laptop? Show me."}
            - {id: q3, stage: 2, who: [endpoint], text: "How is software installed on production servers approved and tracked?"}
          requests:
            - {id: r1, label: "Approved software list or catalogue", kind: document}
            - {id: r2, label: "Installed software inventory report from endpoint management", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.sw_inventory}
            - {id: r3, label: "Change tickets for software installed on production", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "endpoints", population: "managed endpoints", method: "compare installed software with the approved list"}
          interviewees: [endpoint, staff]
          pitfalls:
            - {id: p1, text: "Unapproved or end-of-life software found on endpoints during spot checks"}
            - {id: p2, text: "Browser extensions not controlled"}
        a.8.20:
          questions:
            - {id: q1, stage: 1, who: [network], text: "Show me your current network diagram. Where are the trust boundaries and remote access paths?"}
            - {id: q2, stage: 2, who: [network], text: "Show me your current network diagram and tell me when it was last updated."}
            - {id: q3, stage: 2, who: [network], text: "How are firewall rules reviewed, and when was the last review?"}
            - {id: q4, stage: 2, who: [network], text: "How is admin access to network devices controlled?"}
          requests:
            - {id: r1, label: "Up-to-date network diagram including cloud and remote access", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.is_map}
            - {id: r2, label: "Firewall rule review record with removals", kind: record, fresh_days: 400}
            - {id: r3, label: "Firewall or security group rule export", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.network_firewall}
          sampling:
            - {id: s1, min: 5, max: 10, unit: "rules", population: "firewall and security group rules", method: "check each has a business justification and owner; look for any-any rules"}
          interviewees: [network]
          pitfalls:
            - {id: p1, text: "Network diagram outdated, missing cloud or new sites"}
            - {id: p2, text: "Any-to-any or temporary rules never removed"}
            - {id: p3, text: "Management interfaces reachable from the internet"}
        a.8.21:
          questions:
            - {id: q1, stage: 1, who: [network, proc], text: "Which network services do you buy or run, and what security terms did you set for each?"}
            - {id: q2, stage: 2, who: [proc], text: "Which network services do you buy (internet, SD-WAN, VPN, DNS), and what security terms are in those contracts?"}
            - {id: q3, stage: 2, who: [network], text: "How do you check the provider is meeting the agreed service levels?"}
          requests:
            - {id: r1, label: "Network service contracts or SLAs with security clauses", kind: document}
            - {id: r2, label: "Provider service reports or review minutes", kind: record, fresh_days: 400}
          sampling: []
          interviewees: [network, proc]
          pitfalls:
            - {id: p1, text: "No security requirements in ISP or managed network contracts"}
            - {id: p2, text: "Provider reports received but never reviewed"}
        a.8.22:
          questions:
            - {id: q1, stage: 1, who: [network], text: "How is your network split into zones, and what decides which zone a system lands in?"}
            - {id: q2, stage: 2, who: [network], text: "How are guest, user, server, and management networks separated?"}
            - {id: q3, stage: 2, who: [network], text: "Connect me to guest Wi-Fi: can I reach any internal system?"}
          requests:
            - {id: r1, label: "Network segmentation diagram with VLANs, zones and trust levels", kind: document}
            - {id: r2, label: "Inter-zone firewall rules or ACLs", kind: technical, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:doc.flow_matrix}
          sampling:
            - {id: s1, min: 1, max: 2, unit: "tests", population: "network zones", method: "observe a connection attempt from guest or user zone to a restricted zone"}
          interviewees: [network]
          pitfalls:
            - {id: p1, text: "Flat network: user VLAN can reach servers and management interfaces directly"}
            - {id: p2, text: "Guest Wi-Fi shares a VLAN with printers or IoT devices"}
        a.8.23:
          questions:
            - {id: q1, stage: 1, who: [network], text: "Which website categories do you block and how did you decide?"}
            - {id: q2, stage: 2, who: [network], text: "Try to open a known malicious or blocked test site from this laptop: what happens?"}
            - {id: q3, stage: 2, who: [network], text: "Does filtering still apply when staff work from home off VPN?"}
            - {id: q4, stage: 2, who: [staff, network], text: "How do staff request access to a blocked site for business reasons, and where are the rules for safe web use?"}
          requests:
            - {id: r1, label: "Web filtering policy with blocked categories", kind: document}
            - {id: r2, label: "Filtering tool configuration (secure web gateway, DNS filter, firewall)", kind: technical, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:tech.web_proxy}
            - {id: r3, label: "Block event logs or reports", kind: record, fresh_days: 100}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "devices", population: "office and remote devices", method: "live test of a blocked category or test URL"}
          interviewees: [network, staff]
          pitfalls:
            - {id: p1, text: "Filtering only at the office firewall; remote workers unprotected"}
            - {id: p2, text: "Sites flagged as malicious by threat intelligence or the filtering provider are not blocked"}
        a.8.24:
          questions:
            - {id: q1, stage: 1, who: [sec_ops], text: "What are your rules on encryption algorithms, key lengths and where encryption is mandatory?"}
            - {id: q2, stage: 2, who: [infra], text: "Who manages keys and certificates, and how would you know one is about to expire?"}
            - {id: q3, stage: 2, who: [infra, dev], text: "Show me encryption at rest for this database and in transit for this web app."}
          requests:
            - {id: r1, label: "Cryptography policy including key management", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.crypto}
            - {id: r2, label: "Key and certificate inventory with owners and expiry", kind: record, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:tech.pki}
            - {id: r3, label: "Encryption settings screenshots (KMS, disk, TLS scan result)", kind: technical, fresh_days: 100}
          sampling:
            - {id: s1, min: 3, max: 3, unit: "systems", population: "systems storing or transmitting confidential data", method: "verify encryption setting and protocol versions"}
          interviewees: [infra, sec_ops, dev]
          pitfalls:
            - {id: p1, text: "Certificates expired causing outages; no inventory"}
            - {id: p2, text: "Deprecated TLS versions or weak ciphers still enabled"}
            - {id: p3, text: "Keys stored alongside data or in source code"}
        a.8.25:
          questions:
            - {id: q1, stage: 1, who: [dev], text: "Describe your development life cycle and where security activities sit in it."}
            - {id: q2, stage: 2, who: [dev], text: "Take this recent release: show me the security steps it went through."}
          requests:
            - {id: r1, label: "Secure development policy or SDLC description", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.secdev}
            - {id: r2, label: "Evidence trail for one release: requirements, review, tests, approval", kind: record, fresh_days: 200}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "releases", population: "releases in audit period", method: "trace release from ticket to deployment and check security gates"}
          interviewees: [dev, ciso]
          pitfalls:
            - {id: p1, text: "SDLC document describes gates that the CI pipeline does not enforce"}
            - {id: p2, text: "Low-code or scripts outside the official SDLC"}
        a.8.26:
          questions:
            - {id: q1, stage: 1, who: [dev], text: "How are security requirements captured for a new application or a major change?"}
            - {id: q2, stage: 2, who: [dev, proc], text: "How do security requirements get into a new application or feature you build or buy?"}
            - {id: q3, stage: 2, who: [dev], text: "Show me the security requirements captured for your last new system."}
          requests:
            - {id: r1, label: "Security requirements template or checklist for projects and acquisitions", kind: document}
            - {id: r2, label: "Completed and approved security requirements, with the approver, for one recent project or SaaS acquisition", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 2, max: 2, unit: "projects", population: "new systems or major changes in audit period", method: "check security requirements were defined and verified"}
          interviewees: [dev, proc]
          pitfalls:
            - {id: p1, text: "SaaS tools bought by business units without any security requirements"}
            - {id: p2, text: "Requirements defined but never tested before go-live"}
            - {id: p3, text: "Requirements drafted but never formally approved before build or purchase"}
        a.8.27:
          questions:
            - {id: q1, stage: 1, who: [dev], text: "Which secure engineering principles do your architects follow, and where are they written?"}
            - {id: q2, stage: 2, who: [dev], text: "Show me how a recent design was reviewed against them."}
          requests:
            - {id: r1, label: "Secure architecture principles or reference architecture", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.arc_principles}
            - {id: r2, label: "Architecture or threat model review for a recent system", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:proc.threat_modeling}
          sampling: []
          interviewees: [dev]
          pitfalls:
            - {id: p1, text: "Principles are generic copies not applied in design reviews"}
            - {id: p2, text: "Designs of internet-facing systems not reviewed against known attack patterns (for example through threat modelling)"}
            - {id: p3, text: "Principles never reviewed since they were written, and never passed on to external developers"}
        a.8.28:
          questions:
            - {id: q1, stage: 1, who: [dev], text: "What secure coding standard do your developers follow, and how are they trained on it?"}
            - {id: q2, stage: 2, who: [dev], text: "Show me a recent pull request: who reviewed it and what security checks ran automatically?"}
            - {id: q3, stage: 2, who: [dev], text: "How do you track and update vulnerable third-party libraries?"}
          requests:
            - {id: r1, label: "Secure coding guideline (for example OWASP based) per language", kind: document}
            - {id: r2, label: "SAST and dependency scan results from the pipeline", kind: technical, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:tech.sast_dast}
            - {id: r3, label: "Developer secure coding training records", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:train.secdev}
            - {id: r4, label: "Exceptions to blocking findings with risk acceptance", kind: record}
          sampling:
            - {id: s1, min: 3, max: 5, unit: "merged pull requests", population: "merges to main branch in last 3 months", method: "check peer review, scan result and handling of findings"}
          interviewees: [dev]
          pitfalls:
            - {id: p1, text: "Scanners run but results ignored; criticals merged without justification"}
            - {id: p2, text: "Self-approved merges or reviews that are a rubber stamp"}
            - {id: p3, text: "Third-party libraries not inventoried or kept up to date; hard-coded credentials found in code"}
        a.8.29:
          questions:
            - {id: q1, stage: 1, who: [dev], text: "Which security tests must pass before a release, and who signs off?"}
            - {id: q2, stage: 2, who: [dev], text: "What security testing happens before a release goes live, and who signs off?"}
            - {id: q3, stage: 2, who: [dev], text: "Show me the acceptance test evidence for the last significant release."}
            - {id: q4, stage: 2, who: [dev], text: "Who other than the developers performs acceptance testing, and how close is the test environment to production?"}
          requests:
            - {id: r1, label: "Test plan or criteria including security tests", kind: document}
            - {id: r2, label: "Security test results (DAST, pentest, functional security tests) for a recent release", kind: record, fresh_days: 400}
          sampling:
            - {id: s1, min: 2, max: 3, unit: "releases", population: "major releases in audit period", method: "check security tests ran and acceptance was signed before deployment"}
          interviewees: [dev]
          pitfalls:
            - {id: p1, text: "Security testing only once a year via pentest, not per significant release"}
            - {id: p2, text: "No acceptance criteria, so failed tests do not block go-live"}
        a.8.30:
          questions:
            - {id: q1, stage: 1, who: [proc], text: "Which development do you outsource, and what security terms apply to it?"}
            - {id: q2, stage: 2, who: [proc], text: "Do you use external developers? What security terms are in their contracts?"}
            - {id: q3, stage: 2, who: [dev], text: "How do you check the code they deliver?"}
          requests:
            - {id: r1, label: "Contracts or SOWs with secure development, IP and access clauses", kind: document}
            - {id: r2, label: "Acceptance or code review records for outsourced deliverables", kind: record}
            - {id: r3, label: "Supplier evidence of security testing on delivery, and the contract's right-to-audit clause", kind: record}
          sampling:
            - {id: s1, min: 1, max: 2, unit: "suppliers", population: "outsourced development suppliers", method: "check contract clauses and acceptance evidence"}
          interviewees: [dev, proc]
          pitfalls:
            - {id: p1, text: "No ongoing review of the supplier's development practices, only the final deliverable checked"}
            - {id: p2, text: "No review of delivered code; contract silent on security"}
        a.8.31:
          questions:
            - {id: q1, stage: 1, who: [infra], text: "How are development, test and production kept apart, and who may access each?"}
            - {id: q2, stage: 2, who: [infra], text: "How are development, test and production separated, and who can access production?"}
            - {id: q3, stage: 2, who: [dev], text: "Can a developer change production directly? Show me."}
            - {id: q4, stage: 2, who: [infra], text: "How are development and test environments themselves protected (access, patching, secure configuration, monitoring)?"}
          requests:
            - {id: r1, label: "Environment diagram showing separate accounts, subscriptions or networks", kind: document}
            - {id: r2, label: "Production access list", kind: technical, fresh_days: 40}
          sampling: []
          interviewees: [dev, infra]
          pitfalls:
            - {id: p1, text: "Developers have standing admin rights in production"}
            - {id: p2, text: "Test and production share credentials or databases"}
        a.8.32:
          questions:
            - {id: q1, stage: 1, who: [service_desk], text: "What is your change process, including emergency changes?"}
            - {id: q2, stage: 2, who: [service_desk], text: "Take this change from your list: show me the request, risk assessment, approval, test and rollback plan."}
            - {id: q3, stage: 2, who: [service_desk, dev], text: "How do you detect a change that bypassed the process?"}
          requests:
            - {id: r1, label: "Change management procedure", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.change_mgmt}
            - {id: r2, label: "Change log or ticket export for audit period", kind: record, fresh_days: 40}
            - {id: r3, label: "Emergency change records with retrospective approval", kind: record}
          sampling:
            - {id: s1, min: 10, max: 25, unit: "changes", population: "changes in audit period, including emergency ones", method: "auditor picks from the full list or from system logs, then checks approval, testing and separation of approver and implementer"}
          interviewees: [service_desk, dev]
          pitfalls:
            - {id: p1, text: "Changes seen in deployment or audit logs with no ticket"}
            - {id: p2, text: "Implementer approves own change"}
            - {id: p3, text: "Emergency changes never reviewed after the fact"}
        a.8.33:
          questions:
            - {id: q1, stage: 1, who: [dev], text: "What are your rules for using production data in test, and who approves exceptions?"}
            - {id: q2, stage: 2, who: [dev], text: "Where does your test data come from, and is any of it real production data?"}
            - {id: q3, stage: 2, who: [dev, dpo], text: "If production data is copied to test, who approves it and when is it removed?"}
          requests:
            - {id: r1, label: "Test data rules or procedure", kind: document}
            - {id: r2, label: "Approval and deletion records for production data copies", kind: record}
          sampling:
            - {id: s1, min: 1, max: 1, unit: "test environment", population: "non-production environments", method: "inspect sample records for real personal or confidential data"}
          interviewees: [dev, dpo]
          pitfalls:
            - {id: p1, text: "Full production dumps in test with weaker access control"}
            - {id: p2, text: "Copies never deleted after testing"}
        a.8.34:
          questions:
            - {id: q1, stage: 1, who: [sec_ops, auditor], text: "How do you plan and approve audits or tests that touch live systems?"}
            - {id: q2, stage: 2, who: [sec_ops], text: "When auditors or pentesters test live systems, how do you plan and control that access?"}
          requests:
            - {id: r1, label: "Rules of engagement or authorisation for the last penetration test or technical audit", kind: record, fresh_days: 400}
            - {id: r2, label: "Evidence that temporary auditor or tester accounts were removed", kind: record}
          sampling: []
          interviewees: [sec_ops, auditor]
          pitfalls:
            - {id: p1, text: "Pentest run without written scope or timing agreed with operations"}
            - {id: p2, text: "Tester accounts still active months later"}
            - {id: p3, text: "Testers given write or admin access to live systems when read-only would do, or disruptive tests run during business hours"}
      sessions:
      # Stage 2 runs by topic, not in standard order: each session walks related
      # clauses and controls with the same people. Every entry belongs to exactly one.
      # Annex A sessions follow the ISO/IEC 27002:2022 "operational capabilities"
      # attribute: each control sits in a session named after one of its values.
        - id: opening
          label: "Opening meeting"
          members: []
          requests:
            - {id: r1, label: "What changed since Stage 1: scope, organisation, sites, systems, key suppliers", kind: document}
            - {id: r2, label: "Each Stage 1 finding with the action taken and its evidence", kind: record}
            - {id: r3, label: "Current Statement of Applicability, dated, with the reason for each exclusion", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.soa}
            - {id: r4, label: "A named contact reachable for the whole audit, sent with the documents ahead of day 1", kind: document}
            - {id: r5, label: "Complaints about the certified scope and how they were handled; use of the certification mark once certified", kind: record}
            - {id: r6, label: "Progress on the controls the Statement of Applicability showed as planned or in progress at Stage 1", kind: record}
          pitfalls:
            - {id: p1, text: "Documents not ready at the opening meeting, or shared over an unprotected channel"}
            - {id: p2, text: "An in-scope system not in its production state on the day can be taken out of scope"}
            - {id: p3, text: "What was only stated at Stage 1 is now expected as a record: signatures, test results, logs"}
        - {id: context, label: "Context and scope", members: ["4.1", "4.2", "4.3", "4.4"]}
        - id: leadership
          label: "Leadership and governance"
          members: ["5.1", "5.2", "5.3", a.5.1, a.5.2, a.5.3, a.5.4, a.5.5, a.5.6, a.5.8]
        - id: risk
          label: "Risk, objectives and planning"
          members: ["6.1.1", "6.1.2", "6.1.3", "6.2", "6.3", "8.1", "8.2", "8.3"]
        - {id: support, label: "Support", members: ["7.1", "7.2", "7.3", "7.4", "7.5.1", "7.5.2", "7.5.3"]}
        - {id: people, label: "Human resource security", members: [a.6.1, a.6.2, a.6.3, a.6.4, a.6.5, a.6.6]}
        - {id: assets, label: "Asset management", members: [a.5.9, a.5.11, a.7.8, a.7.9, a.7.10, a.7.14]}
        - id: information
          label: "Information protection"
          members: [a.5.10, a.5.12, a.5.13, a.5.14, a.8.1, a.8.10, a.8.11, a.8.12, a.8.33, a.8.34]
        - {id: threats, label: "Threat and vulnerability management", members: [a.5.7, a.8.8]}
        - id: incidents
          label: "Information security event management"
          members: [a.5.24, a.5.25, a.5.26, a.5.27, a.5.28, a.6.8, a.8.15, a.8.16, a.8.17]
        - id: continuity
          label: "Continuity"
          members: [a.5.37, a.8.6, a.8.13, a.8.14, a.5.29, a.5.30]
        - {id: access, label: "Identity and access management", members: [a.5.15, a.5.16, a.5.17, a.5.18, a.8.2, a.8.3, a.8.5]}
        - {id: configuration, label: "Secure configuration", members: [a.8.9, a.8.19, a.8.24]}
        - id: network
          label: "System and network security"
          members: [a.8.20, a.8.21, a.8.22, a.8.23, a.8.7, a.6.7, a.8.18]
        - id: development
          label: "Application security"
          members: [a.8.4, a.8.25, a.8.26, a.8.27, a.8.28, a.8.29, a.8.30, a.8.31, a.8.32]
        - id: physical
          label: "Physical security (site tour)"
          members: [a.7.1, a.7.2, a.7.3, a.7.4, a.7.5, a.7.6, a.7.7, a.7.11, a.7.12, a.7.13]
        - {id: suppliers, label: "Supplier relationships security", members: [a.5.19, a.5.20, a.5.21, a.5.22, a.5.23]}
        - {id: compliance, label: "Legal, compliance and assurance", members: [a.5.31, a.5.32, a.5.33, a.5.34, a.5.35, a.5.36]}
        - id: performance
          label: "Performance evaluation"
          members: ["9.1", "9.2.1", "9.2.2", "9.3.1", "9.3.2", "9.3.3"]
        - {id: improvement, label: "Improvement: nonconformities and corrective action", members: ["10.1", "10.2"]}
        - id: closing
          label: "Closing meeting"
          members: []
          requests:
            - {id: r1, label: "Top management in the room, or someone with authority to accept the findings and commit resources", kind: record}
            - {id: r2, label: "Your own running list of the points raised during the audit, with what was shown or promised for each", kind: record}
            - {id: r3, label: "Evidence of anything corrected while the audit was running, so the auditor can take it into account", kind: record}
            - {id: r4, label: "An owner and a date for each corrective action plan to send to the certification body", kind: document}
          pitfalls:
            - {id: p1, text: "Disputing a finding for the first time at the closing meeting: raise disagreements as soon as they come up"}
            - {id: p2, text: "Leaving without knowing the grade of each finding (major, minor, observation) and the deadline to answer it"}
            - {id: p3, text: "A major nonconformity holds up certification until its correction is verified, sometimes through a follow-up visit"}
      translations:
        fr:
          name: Guide de l'auditeur ISO/IEC 27001:2022
          entries:
            "4.1":
              q1: "Montrez-moi où vous avez consigné les enjeux internes et externes qui influencent votre SMSI, et quand cette liste a été revue pour la dernière fois."
              q2: "Avez-vous déterminé si le changement climatique est un enjeu pertinent pour votre sécurité de l'information ? Expliquez-moi comment vous êtes arrivés à cette conclusion."
              q3: "Choisissez un enjeu de cette liste et montrez-moi où il s'est traduit par un risque, un objectif ou une mesure."
              r1: "Analyse du contexte (enjeux internes et externes, par exemple PESTEL ou SWOT) avec date et responsable"
              r2: "Trace de la décision sur la pertinence du changement climatique (les auditeurs attendent le raisonnement, la norme ne l'impose pas)"
              r3: "Compte rendu de revue de direction montrant que la liste des enjeux a été revue"
              s1: {unit: "enjeux", population: "enjeux recensés dans l'analyse du contexte", method: "relier chaque enjeu à une entrée du registre des risques, à un objectif ou à une mesure"}
              p1: "Aucune décision sur la pertinence du changement climatique (exigée par le 4.1 depuis l'amendement 1:2024, donc probable non-conformité) ; une simple ligne d'exclusion vaut en général une question ou une piste d'amélioration, le 4.1 n'exigeant pas de justification écrite"
              p2: "Analyse du contexte rédigée une fois pour la certification et jamais mise à jour après une réorganisation, une acquisition ou un passage au cloud"
              p3: "Enjeux recensés mais sans lien avec l'appréciation des risques, si bien que l'auditeur ne voit pas ce qu'ils ont changé"
            "4.2":
              q1: "Quelles sont les parties intéressées qui comptent pour votre SMSI, et qu'attend chacune de vous en matière de sécurité ?"
              q2: "Parmi ces attentes, lesquelles avez-vous choisi de traiter dans le SMSI, et lesquelles avez-vous écartées ?"
              q3: "Prenez un contrat client ou une réglementation de cette liste et montrez-moi les mesures qui y répondent."
              q4: "Certaines de vos parties intéressées ont-elles des attentes liées au climat, par exemple des engagements de résilience demandés par des clients ou des autorités ?"
              r1: "Registre des parties intéressées avec leurs exigences et celles que le SMSI prend en charge"
              r2: "Registre des exigences légales, réglementaires et contractuelles (lien avec A.5.31)"
              r3: "Exemple de contrat client ou d'accord de sous-traitance (DPA) comportant des clauses de sécurité"
              s1: {unit: "exigences", population: "obligations légales, réglementaires et contractuelles du registre", method: "relier chacune à une mesure mise en œuvre et à sa preuve"}
              p1: "Le registre liste les parties mais pas leurs exigences réelles, ou n'indique pas lesquelles le SMSI prend en charge (attente explicite de la version 2022)"
              p2: "Contrat d'un client majeur comportant des clauses de sécurité précises (délai de notification des violations, droit d'audit) absent du registre"
              p3: "Aucune revue des parties intéressées après l'entrée en vigueur d'une nouvelle réglementation (NIS 2, DORA)"
            "4.3":
              q1: "Lisez-moi votre énoncé du domaine d'application. Quels sites, équipes, produits et systèmes sont inclus, et qu'est-ce qui est exclu ?"
              q2: "Pour ce qui est exclu, comment gérez-vous les interfaces et les échanges avec le reste ?"
              q4: "Quels enjeux de contexte et quelles exigences des parties intéressées ont déterminé la limite du domaine d'application ?"
              q3: "Cette équipe ou ce site que j'ai vu sur votre organigramme : est-il dans le périmètre ? Montrez-moi où le document de domaine d'application l'indique."
              r1: "Énoncé du domaine d'application du SMSI (documenté, approuvé, versionné)"
              r2: "Liste des interfaces et échanges avec ce qui est hors périmètre, y compris les services externalisés et cloud"
              r3: "Schéma réseau ou d'architecture cohérent avec la limite du périmètre"
              p1: "Le libellé du périmètre sur le projet de certificat ne correspond pas à l'énoncé du domaine d'application ni aux affirmations commerciales du site web"
              p2: "Des zones exclues partagent réseaux, administrateurs ou données avec des systèmes du périmètre sans que ces interfaces soient traitées (les organismes de certification attendent aussi une justification de chaque exclusion)"
              p3: "Fournisseurs cloud et télétravailleurs oubliés au moment de tracer la limite"
            "4.4":
              q1: "Montrez-moi comment s'articulent les processus de votre SMSI : quelles sorties alimentent quelles entrées ?"
              q2: "Comment savez-vous que le SMSI est tenu à jour et amélioré, et pas seulement documenté ? Donnez-moi un exemple de ce qui a changé cette année."
              r1: "Manuel du SMSI ou cartographie des processus montrant processus, responsables et interactions"
              r2: "Historique des modifications ou des versions des documents du SMSI sur les 12 derniers mois"
              p1: "Un document existe pour chaque chapitre, mais personne ne sait expliquer comment les sorties d'un processus alimentent le suivant (par exemple les résultats d'audit vers la revue de direction)"
              p2: "Aucune trace d'amélioration depuis le dernier audit, signe d'un SMSI figé"
            "5.1":
              q1: "Quel est votre rôle personnel dans le SMSI ? Dites-moi avec vos mots quels sont les objectifs de sécurité."
              q2: "Donnez-moi un exemple où vous avez alloué du budget ou des personnes à la sécurité de l'information au cours de l'année écoulée."
              q3: "Comment la sécurité est-elle prise en compte dans le fonctionnement existant de l'entreprise, par exemple le budget, les projets ou les achats ?"
              r1: "Preuves des ressources accordées au SMSI (ligne budgétaire, effectifs, achat d'outil)"
              r2: "Communications de la direction sur la sécurité de l'information (support de réunion plénière, note, article intranet)"
              r3: "Feuille de présence de la revue de direction attestant la participation de la direction"
              p1: "Le dirigeant délègue tout l'entretien au RSSI et ne sait citer ni la politique ni les objectifs"
              p2: "Demandes de budget sécurité reportées à répétition, ce qui se voit dans les retards du plan de traitement des risques"
              p3: "La direction n'assiste pas à la revue de direction et se contente d'en signer le compte rendu"
            "5.2":
              q1: "Montrez-moi votre politique de sécurité de l'information. Qui l'a approuvée, et quand ?"
              q2: "Lisez-moi les passages qui fixent l'intention de la politique. Indique-t-elle comment les objectifs sont fixés, vous engage-t-elle à satisfaire les exigences de sécurité qui vous sont applicables et à vous améliorer en continu ?"
              q3: "Comment le personnel et les parties externes concernées ont-ils reçu cette politique ? Montrez-moi."
              r1: "Politique de sécurité de l'information signée ou approuvée par la direction, avec version et date"
              r2: "Preuves que la politique a été communiquée en interne et mise à disposition des parties intéressées concernées (les accusés de lecture servent aussi pour A.5.1)"
              s1: {unit: "collaborateurs", population: "salariés et intervenants externes du périmètre", method: "leur demander s'ils savent où trouver la politique et ce qu'elle implique pour leur poste"}
              p1: "Politique approuvée par le seul RSSI, et non par la direction"
              p2: "Il manque à la politique un élément exigé : des objectifs ou la manière de les fixer, l'engagement à satisfaire les exigences applicables, ou l'engagement d'amélioration continue"
              p3: "Le texte de la politique ne correspond plus au SMSI actuel, par exemple il cite encore l'annexe A de 2013"
            "5.3":
              q1: "Qui répond de la conformité du SMSI à la norme, et qui rend compte de sa performance à la direction ?"
              q2: "Montrez-moi où les responsabilités de sécurité figurent dans les fiches de poste ou une matrice RACI."
              q3: "Vous êtes indiqué comme responsable de ce processus. Dites-moi ce que vous faites à ce titre."
              r1: "Document des rôles et responsabilités du SMSI ou matrice RACI"
              r2: "Lettre de nomination ou organigramme désignant le responsable du SMSI / RSSI"
              r3: "Fiches de poste des principaux rôles de sécurité"
              s1: {unit: "titulaires de rôles", population: "responsables nommés dans le RACI (propriétaires de risques, responsables de mesures)", method: "entretien pour confirmer qu'ils connaissent et exercent leur rôle"}
              p1: "Propriétaires de risques ou responsables de mesures nommés qui ont quitté l'entreprise ou ignorent qu'ils occupent ce rôle"
              p2: "Personne n'est formellement chargé de rendre compte de la performance du SMSI à la direction"
            "6.1.1":
              q1: "Partez de vos enjeux de contexte et des attentes des parties intéressées : quels risques et opportunités pour le SMSI lui-même en avez-vous tirés ?"
              q2: "Montrez-moi une opportunité que vous avez identifiée et ce que vous en avez fait."
              r1: "Registre des risques et opportunités propres au SMSI (distinct du registre des risques de sécurité de l'information ou intégré à celui-ci)"
              r2: "Plan d'actions sur les risques et opportunités du SMSI, indiquant quel processus du SMSI porte chaque action et comment vous en mesurerez l'efficacité"
              p1: "Seuls les risques de sécurité de l'information sont pris en compte ; les risques qui empêcheraient le SMSI d'atteindre ses résultats (départ de personnes clés, coupes budgétaires) sont ignorés"
              p2: "Opportunités jamais identifiées ni consignées"
            "6.1.2":
              q1: "Présentez-moi votre méthode d'appréciation des risques : critères d'acceptation, façon d'évaluer la vraisemblance et les conséquences."
              q2: "Si deux personnes évaluaient le même risque à un an d'intervalle, pourquoi arriveraient-elles au même résultat ?"
              q3: "Montrez-moi la dernière appréciation des risques. Quand a-t-elle été réalisée, et qu'est-ce qui l'a déclenchée ?"
              q4: "Qui est le propriétaire de ce risque ? Je vais lui poser la question."
              r1: "Méthode d'appréciation des risques avec critères d'acceptation et échelles"
              r2: "Registre des risques / résultats de la dernière appréciation des risques, avec les propriétaires"
              s1: {unit: "risques", population: "entrées du registre des risques, en privilégiant les risques élevés", method: "vérifier la cotation au regard de la méthode, interroger le propriétaire, suivre jusqu'au traitement"}
              p1: "Critères de risque ou méthode d'appréciation non définis, si bien que les résultats ne peuvent être ni reproduits ni comparés"
              p2: "Risques sans propriétaire nommé, ou le RSSI propriétaire de tout"
              p3: "Cotations non conformes aux échelles documentées, ou critères d'acceptation non définis"
            "6.1.3":
              q1: "Montrez-moi votre Déclaration d'applicabilité. Pour chaque mesure de l'annexe A exclue, pourquoi l'est-elle ?"
              q2: "Vous avez choisi vos mesures à partir de vos risques. Comment avez-vous ensuite vérifié dans l'annexe A que rien n'avait été oublié ?"
              q3: "Qui a approuvé le plan de traitement des risques et accepté les risques résiduels ?"
              q4: "Cette mesure figure comme mise en œuvre dans la Déclaration d'applicabilité. Montrez-moi qu'elle fonctionne."
              r1: "Déclaration d'applicabilité : toutes les mesures nécessaires (les 93 de l'annexe A plus celles que vous avez ajoutées), la justification de chaque inclusion ou exclusion, et leur état de mise en œuvre"
              r2: "Plan de traitement des risques avec actions, responsables, échéances et état d'avancement"
              r3: "Approbation du plan par les propriétaires des risques et acceptation des risques résiduels"
              s1: {unit: "mesures", population: "entrées de la Déclaration d'applicabilité indiquées comme applicables et mises en œuvre", method: "demander une preuve de fonctionnement pour chacune"}
              p1: "Déclaration d'applicabilité encore structurée selon la version 2013 (114 mesures) ou sans les 11 nouvelles mesures de 2022, comme le renseignement sur les menaces ou le masquage des données"
              p2: "Exclusions justifiées par un simple « non applicable », ou exclusion de mesures manifestement nécessaires au vu des risques"
              p3: "Actions du plan de traitement en retard, sans nouvelle échéance ni acceptation du risque résiduel par le propriétaire"
            "6.2":
              q1: "Montrez-moi vos objectifs de sécurité de l'information. Comment sont-ils mesurés et qui est responsable de chacun ?"
              q2: "Où en êtes-vous aujourd'hui par rapport à ces objectifs ? Montrez-moi les données."
              q3: "Que se passe-t-il lorsqu'un objectif n'est pas atteint ?"
              q4: "Quels risques ou quelles exigences ont conduit à ces objectifs, et quand les avez-vous révisés pour la dernière fois ?"
              r1: "Liste des objectifs : cible, responsable, budget ou personnes, échéance et manière de mesurer l'avancement"
              r2: "Suivi de l'avancement des objectifs (tableau de bord ou rapport)"
              p1: "Objectifs flous (« améliorer la sécurité ») sans cible mesurable ni échéance"
              p2: "Objectifs fixés mais jamais suivis ; aucune donnée le jour de l'audit"
              p3: "Objectifs incohérents avec la politique ou non communiqués à ceux qui doivent les atteindre"
              p4: "Objectifs et indicateurs définis, mais sans plan pour chacun : ce qui sera fait, avec quelles ressources, par qui, pour quand et comment le résultat sera évalué"
            "6.3":
              q1: "Comment décidez-vous qu'une modification du SMSI doit faire l'objet d'une planification formelle ?"
              q2: "Parlez-moi d'une modification importante du SMSI cette année, par exemple de périmètre, d'organisation ou une externalisation clé. Montrez-moi comment elle a été planifiée."
              r1: "Critères déterminant quand une modification du SMSI doit être planifiée (bonne pratique, non exigée par le 6.3)"
