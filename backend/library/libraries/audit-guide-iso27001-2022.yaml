              p2: "Rôles attribués à des personnes parties depuis ou ayant changé de poste"
            a.5.3:
              q1: "Quelles tâches avez-vous identifiées comme incompatibles, et où cette analyse est-elle consignée ?"
              q2: "Montrez-moi, sur un système réel, comment vous empêchez une même personne de demander et d'approuver elle-même son propre accès ou sa propre modification."
              q3: "Lorsque la séparation est impossible faute d'effectif suffisant, quelle mesure compensatoire appliquez-vous et où en est la preuve ?"
