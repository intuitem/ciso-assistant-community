              r2: "Preuve d'une vérification récente de la liste de contacts (date de revue, appel ou courriel de test)"
              r3: "Notifications passées aux autorités ou comptes rendus d'exercices"
              p1: "Liste de contacts avec des numéros ou des noms périmés et sans date de revue"
              p2: "Délais de notification (par exemple 72 heures pour les violations de données à caractère personnel, délais NIS2) non repris dans la procédure de gestion des incidents"
            a.5.6:
              q1: "À quelles communautés de sécurité, ISAC, forums ou associations professionnelles appartenez-vous, et qui entretient chaque contact ?"
              q2: "De quels groupes professionnels, forums ou communautés de partage d'information faites-vous partie ?"
              q3: "Donnez-moi un exemple où un enseignement tiré de l'un de ces groupes a changé vos pratiques."
              r1: "Liste des adhésions et abonnements (ISAC, listes de diffusion de CERT, associations)"
              r2: "Preuves de participation (présence à des événements, bulletins partagés, contributions sur des forums)"
              p1: "Adhésions listées, mais personne ne peut montrer quoi que ce soit de reçu ou d'exploité au cours de l'année écoulée"
            a.5.7:
              q1: "Montrez-moi quelles sources de renseignement sur les menaces vous utilisez, qui les lit et à quelle fréquence."
              q2: "Choisissez un bulletin de menace du dernier trimestre et montrez-moi à quelle décision ou action il a conduit."
              q3: "Comment le renseignement sur les menaces alimente-t-il votre appréciation des risques, vos règles de détection et le périmètre de vos tests de sécurité ?"
              r1: "Procédure de renseignement sur les menaces, ou section dédiée, définissant les sources, la fréquence, l'analyse et la diffusion"
              r2: "Synthèses ou bulletins internes récents de renseignement sur les menaces"
              r3: "Tickets, mises à jour du registre des risques ou modifications de règles de détection déclenchés par le renseignement"
              r4: "Configuration des flux ou des intégrations aux outils (SIEM, EDR, scanner de vulnérabilités)"
              s1: {unit: "bulletins", population: "renseignement reçu au cours des 6 derniers mois", method: "suivre chacun de la réception à l'analyse puis à l'action, ou à l'absence d'action documentée"}
              p1: "Flux auxquels on est abonné, qui arrivent dans une boîte aux lettres que personne ne trie, sans trace d'analyse"
              p2: "Aucun lien entre le renseignement et l'appréciation des risques : le catalogue des menaces n'a pas évolué depuis le dernier cycle"
              p3: "Seule l'actualité stratégique est collectée ; le renseignement tactique et opérationnel n'est jamais pris en compte ni exploité dans la détection ou les mesures préventives"
            a.5.8:
              q1: "Montrez-moi où votre méthodologie de gestion de projet impose une évaluation de la sécurité, et à quels jalons."
              q2: "Choisissez un projet livré cette année et montrez-moi ses exigences de sécurité, son appréciation des risques et sa validation."
              r1: "Méthodologie de gestion de projet ou liste de contrôle des jalons intégrant des étapes de sécurité"
              r2: "Liste du portefeuille de projets des 12 derniers mois"
              r3: "Exigences de sécurité ou appréciations des risques pour les projets échantillonnés"
              s1: {unit: "projets", population: "projets lancés ou clôturés au cours des 12 derniers mois, y compris hors informatique", method: "vérifier l'étape sécurité au lancement et avant la mise en production"}
              p1: "La liste de contrôle sécurité existe dans le modèle, mais elle est laissée vide ou cochée sans contenu"
              p2: "Seuls les développements produit ou informatiques passent par l'étape sécurité ; les déménagements d'infrastructure, nouveaux fournisseurs, changements de locaux ou de processus jamais"
            a.5.9:
              q1: "Montrez-moi votre inventaire des actifs. Comment couvre-t-il l'information, et pas seulement le matériel ?"
              q2: "Je vais choisir un ordinateur portable, un serveur et une application SaaS parmi ce que je vois aujourd'hui. Montrez-moi chacun d'eux dans l'inventaire, avec son propriétaire."
              q3: "Comment les nouveaux actifs entrent-ils dans l'inventaire, et comment celui-ci est-il tenu à jour ?"
              r1: "Export de l'inventaire des actifs avec propriétaire, classification et localisation"
              r2: "Preuves de rapprochement avec les outils de découverte (MDM, EDR, console cloud, CMDB)"
              r3: "Procédure décrivant la tenue de l'inventaire"
              s1: {unit: "actifs", population: "actifs observés sur site, dans la console cloud et dans les outils de découverte", method: "traçage du terrain vers l'inventaire et de l'inventaire vers le terrain"}
              p1: "L'inventaire ne recense que le matériel ; les actifs informationnels et les outils SaaS en sont absents"
              p2: "Des postes visibles dans la console EDR sont absents de l'inventaire, ou l'inventaire liste encore des équipements mis au rebut"
              p3: "La colonne propriétaire cite des personnes parties, ou un groupe sans interlocuteur responsable capable d'expliquer ce qu'implique ce rôle"
            a.5.10:
              q1: "Montrez-moi vos règles d'utilisation acceptable de l'information et des équipements."
              q2: "Interrogez n'importe quel collaborateur : peut-il utiliser un stockage en nuage personnel ou un outil de discussion IA pour des données professionnelles ? Sa réponse correspond-elle à la politique ?"
              r1: "Politique d'utilisation acceptable couvrant les équipements, la messagerie, internet, les services en nuage et les outils d'IA générative"
              r2: "Engagements signés d'utilisation acceptable"
              r3: "Mesures techniques faisant appliquer les règles (filtrage web, DLP, liste blanche d'applications)"
              s1: {unit: "collaborateurs", population: "personnel de différents services", method: "court entretien sur les règles clés et vérification de l'engagement signé"}
              p1: "La politique ne dit rien des outils d'IA générative alors que le personnel les utilise avec des données clients"
              p2: "Engagement absent pour les prestataires ou le personnel intérimaire"
            a.5.11:
              q1: "Quels actifs doivent être restitués lors d'un départ, et où cette liste est-elle tenue pour chaque personne ?"
              q2: "Décrivez-moi ce que deviennent l'ordinateur portable, le badge et les jetons d'une personne qui part, le jour de son départ."
              q3: "Comment vous assurez-vous que les données de l'entreprise présentes sur des équipements personnels sont supprimées lors d'un départ ?"
              r1: "Liste de contrôle de départ incluant les étapes de restitution des actifs"
              r2: "Listes de contrôle de départ remplies ou bons de restitution des actifs"
              r3: "Enregistrements MDM d'effacement ou de retrait des équipements des partants"
              s1: {unit: "départs", population: "départs des 12 derniers mois", method: "comparer la liste des départs RH aux enregistrements de restitution et au statut dans l'inventaire"}
              p1: "Liste de contrôle de départ remplie pour les salariés mais pas pour les prestataires ni les stagiaires"
              p2: "Ordinateurs portables encore affectés dans l'inventaire à des personnes parties depuis plusieurs mois"
            a.5.12:
              q1: "Montrez-moi votre schéma de classification et les règles de manipulation associées à chaque niveau."
              q3: "Comment votre schéma tient-il compte des besoins d'intégrité et de disponibilité ainsi que des exigences clients ou contractuelles, et quand une classification est-elle réexaminée ?"
              q2: "Choisissez trois documents sur un partage de fichiers. Qui les a classifiés, et la classification correspond-elle au contenu ?"
              r1: "Politique de classification avec niveaux, critères et règles de manipulation"
              r2: "Inventaire des actifs ou de l'information indiquant la classification attribuée"
              r3: "Configuration de l'outil de classification (par exemple étiquettes de confidentialité)"
              s1: {unit: "documents ou jeux de données", population: "partages de fichiers, gestion documentaire et messagerie", method: "vérifier l'étiquette attribuée au regard du contenu et du schéma"}
              p1: "Schéma défini, mais le personnel ne sait ni citer les niveaux ni les appliquer"
              p2: "Tout est marqué « interne » par défaut, y compris des données RH et clients manifestement confidentielles"
              p3: "Le schéma ne couvre que la confidentialité ; les données dont l'intégrité ou la disponibilité est critique ne font l'objet d'aucun traitement spécifique"
            a.5.13:
              q1: "Montrez-moi vos règles de marquage. Quels niveaux de classification portent un marquage visible, et sur quels supports ?"
              q2: "Montrez-moi comment un document confidentiel est marqué, au format électronique comme sur papier."
              q3: "Que devient le marquage lorsque l'information est exportée, imprimée ou envoyée par courriel à l'extérieur ?"
              r1: "Procédure de marquage couvrant les formats électroniques, physiques et exportés"
              r2: "Capture d'écran de l'outil de marquage ou modèles de documents comportant le marquage"
              r3: "Exemples de documents et de rapports marqués"
              s1: {unit: "documents", population: "documents classifiés au-dessus du niveau interne", method: "vérifier la présence et l'exactitude du marquage"}
              p1: "Marquage présent dans les modèles mais perdu dans les exports, les rapports et les copies imprimées"
              p2: "Marquage omis sans le dire pour certaines productions, comme les exports système, sans règle écrite précisant quand c'est acceptable"
            a.5.14:
              q1: "Montrez-moi les règles d'envoi d'information hors de l'organisation, par canal et par niveau de classification."
              q2: "Montrez-moi comment un collaborateur enverrait aujourd'hui un fichier confidentiel à un client. Avec quel outil, quelle protection ?"
              r1: "Politique ou procédure de transfert d'information (messagerie, transfert de fichiers, supports amovibles, échanges oraux)"
              r2: "Accords encadrant l'échange d'information avec les partenaires clés (accords de confidentialité, clauses d'échange de données)"
              r3: "Configuration des outils de transfert sécurisé (chiffrement de la messagerie, TLS imposé, expiration des partages de fichiers)"
              s1: {unit: "transferts", population: "transferts externes récents de données sensibles", method: "vérifier le canal utilisé au regard de la politique applicable à cette classification"}
              p1: "Liens de partage publics sans expiration ni mot de passe utilisés pour des données confidentielles"
              p2: "La politique couvre la messagerie mais pas les applications de messagerie instantanée, les appels téléphoniques ni les envois par coursier"
            a.5.15:
              q1: "Montrez-moi votre politique de contrôle d'accès. Comment couvre-t-elle l'accès physique autant que l'accès logique ?"
              q2: "Comment appliquez-vous en pratique le besoin d'en connaître et le moindre privilège ? Montrez-moi le modèle de rôles d'une application clé."
              r1: "Politique de contrôle d'accès couvrant l'accès logique et physique, le besoin d'en connaître et le moindre privilège"
              r2: "Définitions des rôles ou profils pour les applications clés"
              r3: "Règles de contrôle d'accès d'une application clé, montrant l'application du besoin d'en connaître et du besoin d'utiliser"
              p1: "La politique ne couvre que l'accès logique ; les règles d'accès physique ne sont pas alignées sur la sensibilité des données"
              p2: "Modèle de rôles documenté, mais la plupart des utilisateurs disposent d'un profil administrateur ou d'un profil par défaut très large"
            a.5.16:
              q1: "Où le cycle de vie des identités est-il décrit, y compris pour les comptes partagés, les comptes de service et les comptes non nominatifs ?"
              q2: "Montrez-moi comment une identité est créée et qui l'approuve. Comment rattachez-vous chaque compte personnel à une seule personne, et chaque compte non humain à un propriétaire responsable ?"
              q3: "Comment gérez-vous les comptes partagés, de service et génériques ? Montrez-moi leur liste et leurs propriétaires."
              r1: "Procédure de cycle de vie des identités (création, modification, désactivation, suppression)"
              r2: "Export des comptes actifs depuis le fournisseur d'identité"
              r3: "Registre des comptes partagés, de service et non nominatifs avec propriétaire et justification"
              s1: {unit: "comptes", population: "comptes actifs dans le fournisseur d'identité", method: "rapprocher chaque compte d'un dossier RH ou d'un propriétaire documenté"}
              p1: "Comptes génériques et de service sans propriétaire ni justification"
              p2: "Comptes de l'annuaire ne correspondant à aucun salarié ni prestataire actuel"
            a.5.17:
              q1: "Quelles sont vos règles en matière de mots de passe, de MFA et de secrets, et comment une réinitialisation se fait-elle sans risque d'hameçonnage ?"
              q5: "Comment le personnel est-il informé de la manière de gérer ses mots de passe et ses jetons, et où est-ce écrit (politique, accueil des arrivants, contrat de travail) ?"
              q2: "Montrez-moi la configuration des mots de passe et de la MFA dans le fournisseur d'identité."
              q3: "Comment les mots de passe initiaux et les identifiants de réinitialisation sont-ils remis, et comment vérifiez-vous l'identité de la personne qui demande une réinitialisation ?"
              q4: "Où sont stockés les secrets partagés, les clés d'API et les mots de passe des comptes de service ?"
              q6: "Comment les nouveaux utilisateurs reçoivent-ils leurs premiers identifiants, et les mots de passe par défaut des éditeurs sont-ils changés avant la mise en service d'un système ?"
              r1: "Paramètres de la politique de mots de passe et de MFA du fournisseur d'identité (voir aussi A.8.5)"
              r2: "Rapport de couverture MFA listant les utilisateurs sans MFA (voir aussi A.8.5)"
              r3: "Procédure de réinitialisation du support avec étapes de vérification d'identité"
              r4: "Preuve de l'utilisation d'un gestionnaire de mots de passe ou d'un coffre-fort de secrets"
              s1: {unit: "tickets de réinitialisation de mot de passe", population: "tickets du support des 6 derniers mois", method: "vérifier que l'identité a été vérifiée et que cette vérification est tracée"}
              p1: "MFA imposée à la plupart des utilisateurs, mais avec des exemptions pour les administrateurs, les comptes de service ou les protocoles anciens"
              p2: "Secrets codés en dur dans les dépôts de code ou partagés par messagerie instantanée"
              p3: "Le support réinitialise des mots de passe sur simple appel téléphonique, sans vérification"
              p4: "Des utilisateurs partagent leurs identifiants ou réutilisent ailleurs leurs mots de passe professionnels, sans avoir jamais été sensibilisés à ce sujet"
            a.5.18:
              q1: "Montrez-moi comment les droits d'accès sont demandés, approuvés et revus selon vos documents : qui approuve, et à quelle fréquence vous les revoyez."
              q2: "Décrivez-moi une arrivée, une mobilité et un départ, du déclenchement par les RH jusqu'à la modification du compte."
              q3: "Montrez-moi vos deux derniers cycles de revue des droits pour un système critique. Qu'est-ce qui a été retiré à l'issue ?"
              r1: "Demandes et approbations d'accès pour les arrivées et mobilités échantillonnées"
              r2: "Revues des droits des systèmes critiques, deux derniers cycles, avec validation et actions"
              r3: "Liste RH des départs et dates de désactivation des comptes sur la même période"
              r4: "Preuves de revue des accès à privilèges"
              s1: {unit: "arrivées", population: "12 derniers mois", method: "comparer les dates RH aux dates de création, de modification et de désactivation des comptes ; vérifier les approbations"}
              s2: {unit: "mobilités", population: "12 derniers mois", method: "comparer les dates RH aux dates de création, de modification et de désactivation des comptes ; vérifier les approbations"}
              s3: {unit: "départs", population: "12 derniers mois", method: "comparer les dates RH aux dates de création, de modification et de désactivation des comptes ; vérifier les approbations"}
              p1: "Revues des droits validées, sans trace que les retraits ont réellement été effectués"
              p2: "Les personnes en mobilité conservent leurs anciens droits, car seules les arrivées et les départs sont traités"
              p3: "Comptes des partants désactivés plusieurs jours ou semaines après la date de sortie, ou comptes SaaS hors SSO jamais désactivés"
            a.5.19:
              q1: "Montrez-moi comment vous classez les fournisseurs selon leur risque de sécurité et ce que vous exigez à chaque niveau."
              q2: "Choisissez un fournisseur référencé cette année et montrez-moi l'évaluation de sécurité réalisée avant la signature."
              r1: "Politique ou procédure de sécurité fournisseurs avec critères de catégorisation"
              r2: "Registre des fournisseurs avec criticité, données accessibles et état d'évaluation"
              r3: "Évaluations de sécurité précontractuelles réalisées pour les nouveaux fournisseurs"
              s1: {unit: "fournisseurs", population: "fournisseurs référencés ou renouvelés au cours des 12 derniers mois", method: "vérifier que l'évaluation a précédé le contrat et correspond au niveau de criticité", note: "en privilégiant les niveaux critiques"}
              p1: "Le registre des fournisseurs est une liste d'achats sans catégorisation sécurité"
              p2: "Évaluations réalisées alors que le fournisseur était déjà en production"
              p3: "Dispositions de sortie (restitution ou destruction des données, retrait des accès) non définies dans les relations fournisseurs"
            a.5.20:
              q1: "Quelles clauses de sécurité doivent figurer dans un contrat fournisseur, et comment varient-elles selon le risque du fournisseur ?"
              q2: "Choisissez le contrat d'un fournisseur critique. Montrez-moi les clauses de sécurité : confidentialité, notification des incidents, droit d'audit, sous-traitance ultérieure, restitution des données."
              q3: "Comment vous assurez-vous que les contrats plus anciens sont mis à niveau selon vos exigences actuelles ?"
              r1: "Clauses de sécurité types ou annexe sécurité utilisées dans les contrats fournisseurs"
              r2: "Contrats ou accords de sous-traitance de données signés pour les fournisseurs critiques échantillonnés"
              r3: "Suivi des écarts pour les contrats anciens dépourvus des clauses requises"
              s1: {unit: "contrats", population: "fournisseurs critiques et de niveau élevé", method: "vérifier la présence de chaque clause requise"}
              p1: "Contrats signés sur le modèle du fournisseur, sans délai de notification des incidents"
              p2: "Droit d'audit ou d'évaluation absent : l'organisation dépend de ce que le fournisseur veut bien communiquer"
            a.5.21:
              q1: "Quels risques liés à la chaîne d'approvisionnement TIC avez-vous identifiés, et qu'exigez-vous des fournisseurs concernant leurs propres sous-traitants ?"
              q2: "Comment obtenez-vous une assurance sur les sous-traitants de vos fournisseurs TIC critiques ?"
              q3: "Pour les logiciels ou le matériel que vous achetez, comment vérifiez-vous la provenance des composants et le fait qu'ils sont maintenus ?"
              r1: "Exigences imposées aux fournisseurs pour répercuter la sécurité sur leurs sous-traitants"
              r2: "Listes des sous-traitants ultérieurs ou sous-traitants des fournisseurs critiques"
              r3: "Nomenclature logicielle (SBOM) ou inventaire des composants des produits clés, le cas échéant"
              s1: {unit: "fournisseurs TIC critiques", population: "fournisseurs de produits et services TIC", method: "examiner la liste des sous-traitants et les preuves de répercussion des exigences"}
              p1: "Aucune visibilité sur les sous-traitants de rang 2, même pour les prestataires hébergeant des données sensibles"
              p2: "Notifications de changement de sous-traitant ultérieur reçues mais jamais examinées"
            a.5.22:
              q1: "Comment déterminez-vous la fréquence de revue d'un fournisseur, et quels changements justifient une réévaluation ?"
              q2: "Choisissez un fournisseur critique. Montrez-moi la dernière revue de performance ou de sécurité menée avec lui."
              q3: "La dernière fois qu'un fournisseur a modifié son service, sa localisation ou un sous-traitant, comment en avez-vous évalué l'impact ?"
              r1: "Calendrier de revue des fournisseurs par niveau de criticité"
              r2: "Comptes rendus ou rapports des revues de sécurité fournisseurs"
              r3: "Rapports d'assurance tiers en cours de validité pour les fournisseurs critiques (certificat ISO 27001, rapport SOC 2)"
              r4: "Enregistrements des incidents et changements chez les fournisseurs et de leur évaluation"
              s1: {unit: "fournisseurs", population: "fournisseurs critiques et de niveau élevé", method: "vérifier que la revue respecte la périodicité du niveau et que les constats sont suivis"}
              p1: "Certificats au dossier expirés, ou périmètre de certification du fournisseur ne couvrant pas le service utilisé"
              p2: "Rapports SOC 2 collectés, mais les contrôles complémentaires à la charge du client jamais examinés ni mis en œuvre"
              p3: "Revues prévues chaque année, mais la dernière date de deux ans"
            a.5.23:
              q1: "Montrez-moi comment vous décidez d'adopter un nouveau service en nuage et quelles vérifications de sécurité ont lieu avant son utilisation."
              q2: "Pour votre principal fournisseur de services en nuage, montrez-moi quelles mesures relèvent de vous et lesquelles relèvent du fournisseur."
              q3: "Si vous deviez quitter ce fournisseur au prochain trimestre, quel est le plan de sortie, et une partie en a-t-elle été testée ?"
              r1: "Politique ou procédure relative aux services en nuage : choix, exploitation et sortie d'un fournisseur"
              r2: "Registre des services en nuage, SaaS compris, avec propriétaire et classification des données"
              r3: "Matrice de responsabilité partagée pour les principaux fournisseurs de services en nuage"
              r4: "Plan de sortie, avec les éventuels tests d'export ou de portabilité des données réalisés"
              s1: {unit: "services en nuage", population: "IaaS, PaaS et SaaS utilisés", method: "vérifier l'évaluation préalable au choix, le partage des responsabilités et les dispositions de sortie"}
              p1: "Des outils SaaS achetés par carte bancaire par les métiers n'entrent jamais dans le registre des services en nuage"
              p2: "L'organisation s'appuie sur le certificat du fournisseur sans avoir configuré sa propre part de la responsabilité partagée"
              p3: "Pas de stratégie de sortie, ou une stratégie inapplicable faute d'avoir vérifié les formats d'export ou les clauses contractuelles"
            a.5.24:
              q1: "Montrez-moi votre procédure de gestion des incidents, les rôles et les circuits d'escalade."
              q2: "Quand avez-vous exercé pour la dernière fois le processus de gestion des incidents, et qu'avez-vous changé ensuite ?"
              q3: "Qui est habilité à traiter les incidents, et comment savez-vous que ces personnes y sont formées ?"
              r1: "Politique et procédure de gestion des incidents avec rôles, échelle de gravité et escalade"
              r2: "Liste de contacts de l'équipe de réponse aux incidents, y compris les parties externes"
              r3: "Compte rendu d'exercice sur table ou de simulation"
              r4: "Enregistrements de formation du personnel de réponse aux incidents"
              p1: "Plan jamais exercé et aucun incident réel encore traité : rien ne démontre qu'il fonctionne (les auditeurs demandent généralement l'un ou l'autre)"
              p2: "Les critères de gravité ne sont pas reliés aux seuils de notification réglementaire"
            a.5.25:
              q1: "Qu'est-ce qui fait d'un événement un incident chez vous ? Montrez-moi les critères et qui tranche."
              q2: "Montrez-moi comment un événement devient un incident : qui décide, et selon quels critères ?"
              q3: "Choisissez dans le journal trois événements qui n'ont pas été escaladés. Pourquoi ?"
              r1: "Critères de qualification des événements ou matrice de classification"
              r2: "Journal des événements et incidents ou file de tickets des 12 derniers mois"
              s1: {unit: "événements", population: "événements et alertes des 12 derniers mois", method: "vérifier que la décision de qualification est enregistrée et cohérente avec les critères"}
              p1: "Aucun incident enregistré en un an, ce qui laisse penser que les événements sont clos au support sans qualification sécurité"
              p2: "Décisions de qualification non enregistrées : personne ne peut expliquer pourquoi un événement a été écarté"
            a.5.26:
              q1: "Quels scénarios d'incident disposent d'une réponse écrite, et qui a autorité pour la mettre en œuvre ?"
              q2: "Choisissez votre incident le plus grave de l'année. Décrivez-moi la détection, le confinement, la communication et la clôture."
              q3: "Qui a été notifié, y compris les clients ou les autorités, et quand ?"
              r1: "Fiches d'incident avec chronologie, actions et clôture"
              r2: "Traces des communications aux parties notifiées"
              r3: "Fiches réflexes pour les types d'incident courants (hameçonnage, rançongiciel, fuite de données)"
              s1: {unit: "incidents", population: "incidents des 12 derniers mois", method: "suivre de la détection à la clôture au regard de la procédure", note: "y compris le plus grave"}
              p1: "Chronologie absente : impossible de démontrer que les délais de notification ont été respectés"
              p2: "Incidents clos sans cause racine ou avec des actions de confinement encore ouvertes"
            a.5.27:
              q1: "Comment un incident est-il clos, et où le retour d'expérience est-il consigné ?"
              q2: "Montrez-moi le retour d'expérience d'un incident passé et les actions qui en ont découlé."
              q3: "Comment les tendances des incidents alimentent-elles votre appréciation des risques et votre programme de sensibilisation ?"
              r1: "Rapports de retour d'expérience post-incident"
              r2: "Suivi des actions correctives liées aux incidents"
              r3: "Synthèse des tendances des incidents présentée en revue de direction"
              s1: {unit: "incidents significatifs", population: "incidents de gravité moyenne ou supérieure", method: "vérifier que le retour d'expérience a eu lieu et que les actions sont closes"}
              p1: "Retour d'expérience rédigé, mais actions jamais attribuées ni closes"
              p2: "Incidents répétés du même type sans modification des mesures ni du registre des risques"
            a.5.28:
              q1: "Montrez-moi votre procédure de collecte et de conservation des preuves numériques."
              q2: "Si vous deviez appuyer une action en justice après un incident, comment démontreriez-vous que les preuves n'ont pas été altérées ?"
              r1: "Procédure de traitement des preuves avec formulaire de chaîne de traçabilité"
              r2: "Formulaires de chaîne de traçabilité remplis, le cas échéant"
              r3: "Paramètres de conservation des journaux des systèmes clés (voir aussi A.8.15)"
              p1: "Pas de formulaire de chaîne de traçabilité ; les intervenants réinstallent les machines avant d'avoir préservé les preuves"
              p2: "Aucune consigne sur la recevabilité juridique ni la juridiction compétente ; le conseil juridique ou les forces de l'ordre ne sont sollicités qu'une fois les preuves déjà manipulées"
            a.5.29:
              q1: "Quelles mesures de sécurité doivent continuer à fonctionner pendant une perturbation, et où est-ce écrit ?"
              q2: "Pendant une perturbation, quelles mesures de sécurité doivent rester en place, et comment est-ce intégré à vos plans de continuité ?"
              q3: "Lors de votre dernier test de continuité, le contrôle d'accès et la journalisation ont-ils continué à fonctionner ? Comment le savez-vous ?"
              r1: "Plans de continuité d'activité intégrant les exigences de sécurité en situation de perturbation"
              r2: "Comptes rendus de tests de continuité couvrant les aspects sécurité"
              p1: "Les plans de continuité privilégient la disponibilité et autorisent à contourner la sécurité (comptes administrateurs partagés, MFA désactivée) sans encadrement"
              p2: "Site de secours non couvert par la même surveillance de sécurité que la production"
            a.5.30:
              q1: "Montrez-moi comment vos objectifs de reprise TIC ont été déduits du bilan d'impact sur l'activité (BIA)."
              q2: "Montrez-moi le dernier test de PRA ou de restauration d'un service critique. Avez-vous tenu le RTO et le RPO ?"
              q3: "Lorsqu'un test a échoué ou dépassé le temps prévu, qu'avez-vous fait ?"
              r1: "Bilan d'impact sur l'activité listant les processus critiques, les services TIC qui les supportent, les RTO et RPO"
              r2: "Plans de continuité TIC ou PRA des services critiques"
              r3: "Comptes rendus de tests de PRA et de restauration avec les temps de reprise mesurés"
              r4: "Actions correctives ouvertes à la suite de tests échoués ou partiels"
              s1: {unit: "services TIC critiques", population: "services supportant les processus critiques identifiés dans le BIA", method: "comparer les objectifs du BIA au plan et aux résultats de test mesurés"}
              p1: "RTO et RPO fixés par l'informatique sans BIA, ou objectifs du BIA que l'architecture ne permet pas d'atteindre"
              p2: "Sauvegardes testées en vérifiant la réussite des tâches, jamais par une restauration réelle dans le RTO"
              p3: "Résultats de test non comparés aux objectifs : les écarts ne donnent jamais lieu à des actions correctives"
            a.5.31:
              q1: "Montrez-moi votre registre des exigences légales, réglementaires et contractuelles applicables à la sécurité."
              q2: "Comment apprenez-vous l'existence d'une loi nouvelle ou modifiée qui vous concerne ? Montrez-moi la dernière mise à jour que vous avez faite."
              r1: "Registre des exigences légales et réglementaires avec responsable et applicabilité"
              r2: "Preuve de revue périodique du registre"
              r3: "Analyse des restrictions d'exportation ou d'usage de la cryptographie, le cas échéant"
              s1: {unit: "exigences", population: "entrées du registre", method: "vérifier comment chacune est satisfaite par une mesure ou un processus"}
              p1: "Registre non mis à jour pour des réglementations récentes comme NIS2, DORA ou des règles sectorielles"
              p2: "Engagements contractuels de sécurité envers les clients non recensés, donc suivis par personne"
            a.5.32:
              q1: "Comment suivez-vous les licences logicielles et la réutilisation de contenus tiers ou open source ?"
              q2: "Comment vous assurez-vous que les logiciels utilisés sont sous licence et que les licences open source sont respectées ?"
              q3: "Montrez-moi, pour un produit commercial, le nombre de licences au regard du nombre d'installations."
              r1: "Registre des licences logicielles ou rapport de gestion des actifs logiciels"
              r2: "Restrictions d'installation de logiciels (pas de droits d'administration locale, liste de logiciels autorisés)"
              r3: "Politique relative aux licences open source ou résultats d'analyse des logiciels développés"
              s1: {unit: "produits", population: "logiciels commerciaux et SaaS utilisés", method: "comparer les droits acquis aux installations ou aux utilisateurs"}
              p1: "Aucun rapprochement entre licences et installations"
              p2: "Composants sous licence copyleft livrés dans des produits sans revue de licence"
            a.5.33:
              q1: "Montrez-moi votre tableau de conservation des enregistrements, avec leur fondement juridique."
              q2: "Choisissez un type d'enregistrement et montrez-moi qu'il est conservé pendant la bonne durée, puis détruit."
              q3: "Comment empêchez-vous que des enregistrements soient modifiés ou consultés par des personnes non autorisées, et comment pourrez-vous encore lire des enregistrements archivés ou chiffrés à la fin de leur durée de conservation ?"
              r1: "Tableau de conservation des enregistrements par type"
              r2: "Preuves des paramètres de conservation dans les systèmes (messagerie, gestion documentaire, sauvegardes)"
              r3: "Journaux de destruction ou de suppression"
              s1: {unit: "types d'enregistrement", population: "types d'enregistrement figurant dans le tableau de conservation", method: "vérifier la configuration des systèmes et l'existence d'enregistrements de l'ancienneté attendue"}
              p1: "Le tableau de conservation existe, mais les systèmes conservent tout indéfiniment"
              p2: "Enregistrements nécessaires comme preuves du SMSI (journaux, comptes rendus de revue) supprimés avant le cycle d'audit"
              p3: "Enregistrements archivés chiffrés avec des clés qui ne sont plus conservées, ou stockés dans des formats qui ne sont plus pris en charge"
              p4: "Des enregistrements nécessaires à l'audit ou à des fins juridiques peuvent être modifiés par les personnes qu'ils concernent"
            a.5.34:
              q1: "Quelles lois relatives aux données à caractère personnel vous sont applicables, et où montrez-vous comment vos mesures les couvrent ?"
              q2: "Montrez-moi votre registre des activités de traitement et son lien avec vos mesures de sécurité."
              q3: "Qui est votre DPO ou référent vie privée, et comment la protection des données et la sécurité travaillent-elles ensemble en cas de violation ?"
              r1: "Registre des activités de traitement"
              r2: "Politique de confidentialité et politique interne de protection des données"
              r3: "AIPD pour les traitements à risque élevé"
              r4: "Registre des violations de données à caractère personnel"
              s1: {unit: "activités de traitement", population: "entrées du registre des traitements", method: "vérifier que la base légale, la durée de conservation et les mesures de sécurité sont documentées"}
              p1: "Registre des traitements incomplet ou non mis à jour après la mise en service de nouveaux systèmes"
              p2: "Registre des violations tenu séparément du journal des incidents, avec des incohérences entre les deux"
            a.5.35:
              q1: "Comment le SMSI fait-il l'objet d'une revue indépendante, et par qui ? Montrez-moi le programme de ce cycle."
              q2: "À quand remonte la dernière revue de votre dispositif de sécurité par une personne indépendante de ceux qui le pilotent ? Montrez-moi le rapport."
              q3: "Montrez-moi comment les constats de cette revue ont été suivis jusqu'à leur clôture."
              q4: "Après votre dernier changement important (réorganisation, nouvel hébergement, fusion), une revue indépendante a-t-elle été envisagée ?"
              r1: "Programme ou rapports de revue indépendante (audit interne, évaluation externe ou manager indépendant) couvrant les personnes, les processus et la technologie"
              r2: "Rapports de revue indépendante ou d'audit interne"
              r3: "Preuves de l'indépendance et de la compétence des auditeurs"
              r4: "Tableau de suivi des constats avec statut et preuves de clôture"
              p1: "L'auditeur interne audite son propre travail"
              p2: "Personne ne peut montrer quelles parties du SMSI ont fait l'objet d'une revue indépendante, ni sur quelle période"
              p3: "Constats de la dernière revue toujours ouverts, sans date cible"
            a.5.36:
              q1: "Comment les managers vérifient-ils que leurs équipes respectent les politiques, et à quelle fréquence ?"
              q2: "Comment les managers vérifient-ils la conformité aux politiques de sécurité dans leur périmètre ? Montrez-moi la dernière vérification."
              q3: "Montrez-moi une revue de conformité technique, par exemple une analyse de configuration au regard de votre référentiel de durcissement."
              r1: "Calendrier des contrôles de conformité ou programme d'autoévaluation"
              r2: "Résultats des contrôles de conformité et des analyses techniques"
              r3: "Registre des non-conformités avec actions correctives"
              s1: {unit: "non-conformités", population: "non-conformités relevées au cours des 12 derniers mois", method: "vérifier que la cause racine et l'action corrective sont enregistrées"}
              p1: "Les contrôles de conformité n'ont lieu qu'à travers l'audit interne annuel"
              p2: "Analyses réalisées, mais les écarts par rapport à la configuration de référence ne sont jamais traités"
            a.5.37:
              q1: "Montrez-moi la liste des procédures d'exploitation documentées de votre informatique."
              q2: "Choisissez une tâche courante, comme une sauvegarde ou une création d'utilisateur. Montrez-moi la procédure et demandez à l'opérateur de me la dérouler."
              q3: "Où un opérateur d'astreinte trouve-t-il la procédure à 3 h du matin, y compris lorsque le wiki principal ou l'authentification unique est indisponible ?"
              r1: "Index des procédures d'exploitation avec propriétaire et date de revue"
              r2: "Exemples de procédures (sauvegarde, restauration, correctifs, création de comptes, supervision)"
              s1: {unit: "procédures", population: "procédures d'exploitation documentées", method: "comparer la procédure à ce que fait réellement l'opérateur"}
              p1: "Procédures non mises à jour au regard des outils actuels"
              p2: "Connaissances clés détenues par une seule personne, sans procédure écrite"
            a.6.1:
              q1: "Quelles vérifications menez-vous pour quels postes, et qui a décidé que les postes à privilèges en exigeaient davantage ?"
              q2: "Montrez-moi le dossier de vérification des antécédents de cet ingénieur, et dites-moi si les vérifications étaient terminées avant son premier jour."
              q3: "Comment vous assurez-vous que les prestataires et les intérimaires sont vérifiés au niveau qu'exige leur poste, et où est-ce écrit dans le contrat fournisseur ?"
              q4: "Pour les postes critiques ou à privilèges, comment et à quelle fréquence revérifiez-vous, après la prise de poste, que les personnes conviennent toujours ?"
              r1: "Procédure de vérification des antécédents précisant les contrôles par poste ou par niveau de risque"
              r2: "Preuves de vérification pour les recrues échantillonnées (identité, droit au travail, références, extrait de casier judiciaire lorsque la loi le permet)"
              r3: "Clauses contractuelles ou attestations obligeant les fournisseurs à vérifier les antécédents de leur personnel"
              r4: "Liste RH des arrivées sur la période d'audit, avec les dates d'entrée"
              s1: {unit: "arrivées", population: "arrivées des 12 derniers mois", method: "comparer la date de fin des vérifications à la date d'entrée et aux contrôles exigés pour le poste", note: "dont au moins 2 postes à privilèges ou informatiques, plus 2 prestataires"}
              p1: "Vérifications terminées plusieurs semaines après l'entrée, sans restriction d'accès provisoire documentée"
              p2: "Prestataires et intérimaires exclus des vérifications parce que les RH ne couvrent que les salariés"
              p3: "Les mêmes vérifications intrusives, comme le casier judiciaire, appliquées à tous les postes sans justification liée au poste ni base légale confirmée dans le pays concerné"
              p4: "Vérifications faites uniquement à l'embauche, sans nouveau contrôle pour les personnes promues à un poste critique ou qui en occupent un"
            a.6.2:
              q1: "À quel endroit du contrat de travail le personnel accepte-t-il ses responsabilités en matière de sécurité de l'information ?"
              q2: "Prenons une recrue récente : montrez-moi ce qu'elle a signé et à quelles politiques le document renvoie."
              r1: "Modèles de contrat de travail et de contrat de prestation, clauses de sécurité mises en évidence"
              r2: "Contrats signés ou accusés de réception pour les arrivées échantillonnées"
              r3: "Manuel du personnel ou code de conduite auquel renvoie le contrat"
              s1: {unit: "arrivées", population: "arrivées des 12 derniers mois", method: "vérifier que le contrat signé ou un avenant signé énonce les responsabilités de sécurité et était en place avant l'ouverture des accès", note: "dont 1 prestataire"}
              p1: "Salariés de longue date sous des contrats muets sur la sécurité de l'information, sans avenant ni accusé de réception signé pour combler ce manque"
              p2: "Contrats de prestation gérés par les achats sans aucune clause de sécurité"
            a.6.3:
              q1: "Comment avez-vous choisi le contenu du programme de sensibilisation, et en quoi diffère-t-il pour les développeurs ou les administrateurs ?"
              q2: "Quel pourcentage du personnel a suivi la formation cette année, et que se passe-t-il pour ceux qui ne l'ont pas suivie ?"
              q3: "Dites-moi, sans chercher, comment vous signaleriez ici un e-mail suspect."
              q4: "Quand une politique ou une procédure a changé cette année, comment les personnes concernées en ont-elles été informées ? Montrez-moi."
              q5: "Comment vérifiez-vous que la sensibilisation a réellement porté (quiz, test, comportement observé) ? Montrez-moi les derniers résultats."
              r1: "Plan de sensibilisation et de formation avec les thèmes par public"
              r2: "Rapport de suivi des formations extrait de la plateforme e-learning pour l'ensemble du personnel"
              r3: "Résultats des campagnes de simulation d'hameçonnage et actions de suivi, si de telles campagnes sont menées"
              r4: "Enregistrements des formations spécifiques pour l'équipe SMSI et les utilisateurs à privilèges"
              s1: {unit: "personnes de différents services", population: "effectif actuel, plus les prestataires et le personnel des fournisseurs disposant d'accès", method: "rapprocher chaque nom d'un enregistrement de formation et poser à chacun une courte question de sensibilisation pendant les entretiens", note: "inclure 1 ou 2 personnes externes"}
              p1: "Taux de suivi inférieur à l'objectif, sans relance ni escalade enregistrée"
              p2: "Nouveaux arrivants non formés avant la campagne annuelle suivante"
              p3: "Contenu de formation générique, jamais mis à jour après des incidents ou une évolution des risques"
            a.6.4:
              q1: "Où est-il écrit ce qui se passe lorsqu'une personne enfreint une politique de sécurité, et le personnel le sait-il ?"
              q2: "Le processus a-t-il été appliqué depuis le dernier audit ? Décrivez-moi un cas, anonymisé si nécessaire."
              r1: "Procédure disciplinaire couvrant explicitement les manquements à la sécurité"
              r2: "Registre anonymisé des procédures disciplinaires liées à la sécurité"
              r3: "Communication montrant que le personnel a été informé du processus"
              p1: "Règlement disciplinaire RH générique qui ne mentionne pas la sécurité de l'information, si bien que les incidents sont traités de manière informelle"
              p2: "Violations de politique confirmées lors de l'analyse d'incidents, sans trace que le processus disciplinaire ait été envisagé ni motif consigné pour ne pas l'avoir appliqué"
              p3: "Processus disciplinaire limité aux salariés ; aucun levier contractuel pour agir contre un prestataire ou un salarié de fournisseur qui enfreint une politique"
            a.6.5:
              q1: "Quelles obligations perdurent après un départ ou un changement de poste, et comment les personnes en sont-elles informées ?"
              q4: "Dans quel contrat ou accord figurent les obligations qui perdurent après le départ, et pendant combien de temps s'appliquent-elles ?"
              q2: "Lors d'un départ, comment rappelez-vous à la personne ce qui l'engage encore, comme la confidentialité ?"
              q3: "Montrez-moi le dossier de sortie de cette personne : quelles obligations persistantes lui ont été rappelées, et qui a repris ses responsabilités de sécurité ?"
              r1: "Procédure de départ ou check-list de sortie couvrant les obligations qui perdurent"
              r2: "Check-lists de sortie remplies ou courriers de fin de contrat pour les départs échantillonnés"
              r3: "Liste RH des départs sur la période d'audit, avec les derniers jours travaillés"
              s1: {unit: "départs", population: "départs et changements de poste des 12 derniers mois", method: "vérifier que les obligations persistantes figuraient au contrat et ont été rappelées au départ, et que toute responsabilité de sécurité a été transmise à une personne nommément désignée (la restitution des actifs et la suppression des accès sont vérifiées en A.5.11 et A.5.18)", note: "dont 1 mobilité interne et 1 prestataire"}
              p1: "La check-list de sortie existe mais reste vide ou absente pour les prestataires et les départs précipités"
              p2: "Une personne mutée ou partie assurait une responsabilité de sécurité (propriétaire d'un risque ou d'un actif, astreinte) et personne n'a été formellement désigné pour la reprendre"
            a.6.6:
              q1: "Qui doit signer un engagement de confidentialité, et quand les modèles ont-ils été revus pour la dernière fois par le service juridique ?"
              q3: "Que prévoient vos accords sur la durée de la confidentialité et sur le sort des informations à la fin de la relation ?"
              q2: "Montrez-moi les accords signés pour ces fournisseurs et ces personnes qui traitent des données confidentielles."
              r1: "Modèles d'engagement de confidentialité pour le personnel, les prestataires et les tiers"
              r2: "Registre des engagements de confidentialité signés ou copies signées pour l'échantillon"
              r3: "Trace de la dernière revue des modèles d'engagement de confidentialité"
              s1: {unit: "membres du personnel ou prestataires et 3 fournisseurs ayant accès aux données", population: "personnes et fournisseurs ayant accès à des informations confidentielles", method: "confirmer qu'un accord signé existe et qu'il est antérieur à l'ouverture des accès"}
              p1: "Accords de confidentialité fournisseurs signés pendant la phase commerciale, expirés ou ne couvrant jamais la prestation qui a suivi"
              p2: "Modèles jamais revus depuis leur adoption, si bien que l'exigence de revue n'est pas satisfaite"
            a.6.7:
              q1: "Quelles règles s'appliquent quand on travaille depuis chez soi, un café ou l'étranger, et où sont-elles écrites ?"
              q2: "Montrez-moi comment vous faites appliquer ces règles techniquement sur un portable qui ne passe jamais au bureau."
              q3: "Le personnel peut-il travailler depuis un autre pays, et qui l'autorise ?"
              q4: "Comment les utilisateurs distants s'authentifient-ils sur les systèmes internes, et reste-t-il un accès distant à facteur unique ?"
              r1: "Politique de télétravail ou section de la charte d'utilisation correspondante"
              r2: "Rapport de conformité des postes montrant le chiffrement, le verrouillage d'écran et l'état VPN ou ZTNA"
              r3: "Autorisations de travail depuis l'étranger"
              s1: {unit: "télétravailleurs", population: "personnel en télétravail partiel ou total", method: "vérifier la conformité du poste dans la console de gestion et demander à chacun comment il gère les appels et l'impression à domicile"}
              p1: "La politique interdit le wifi public ou l'impression à domicile, mais rien ne le fait appliquer ni ne le contrôle"
              p2: "Équipements personnels utilisés en télétravail sans MDM ni accès conditionnel"
              p3: "Personnel travaillant depuis d'autres pays pendant des semaines sans autorisation ni examen des contraintes juridiques locales"
            a.6.8:
              q1: "Comment le personnel doit-il signaler un événement de sécurité, et comment lui avez-vous fait connaître ces canaux ?"
              q2: "Si je voyais quelque chose de suspect maintenant, comment le signalerais-je, et en combien de temps quelqu'un réagirait-il ?"
              q3: "Montrez-moi les signalements du personnel de ces derniers mois et la suite qui leur a été donnée."
              r1: "Procédure de signalement des événements et canaux communiqués au personnel"
              r2: "Historique des tickets ou de la boîte de réception des signalements du personnel, avec le résultat du tri"
              r3: "Statistiques du bouton de signalement d'hameçonnage"
              s1: {unit: "événements signalés", population: "événements signalés par le personnel au cours des 6 derniers mois", method: "vérifier que chaque signalement est parvenu rapidement au canal prévu et a été enregistré (la qualité du tri est évaluée en A.5.25)"}
              p1: "Les personnes interrogées donnent des réponses différentes sur la manière de signaler, ou citent quelqu'un qui a quitté l'entreprise"
              p2: "Très peu de signalements enregistrés, ce que l'auditeur peut creuser comme signe possible d'un problème de sensibilisation ou de canal"
              p3: "Signalements traités par messagerie instantanée ou par e-mail, sans trace du tri"
              p4: "Personnel incité à confirmer lui-même une faiblesse supposée avant de la signaler, au risque de causer des dommages et de perdre des preuves"
            a.7.1:
              q1: "Quels sites sont dans le périmètre, et comment avez-vous délimité chaque zone sécurisée ?"
              q2: "Faisons le tour du périmètre. Par où quelqu'un pourrait-il entrer sans passer par un contrôle ?"
              q3: "Lorsque des centres de données de prestataires sont dans le périmètre, comment savez-vous que leurs protections périmétriques sont suffisantes ? (Sinon, le sujet relève de A.5.19 à A.5.23.)"
              r1: "Liste des sites et plans des locaux indiquant les zones sécurisées et les points d'accès"
              r2: "Visite du site : portes, fenêtres, issues de secours et zones de livraison sur le périmètre"
              r3: "Certificat ISO 27001 ou rapport SOC 2 en cours de validité des hébergeurs ou prestataires de colocation, dont le périmètre couvre les régions utilisées"
              p1: "Issues de secours maintenues ouvertes ou sans alarme, offrant une entrée non surveillée"
              p2: "Mesure déclarée non applicable pour une entreprise en télétravail généralisé, alors qu'un petit bureau ou un local technique est dans le périmètre"
              p3: "Rapport SOC 2 du prestataire collecté, mais son périmètre ne couvre pas la région ou le service réellement utilisé (lorsque les sites du prestataire sont dans le périmètre)"
            a.7.2:
              q1: "Quels accès à vos sites sont contrôlés, et que prévoient vos documents pour les badges, les clés et les visiteurs ?"
              q2: "Comment les visiteurs entrent-ils, qui les accompagne, et combien de temps conservez-vous le registre des visiteurs ?"
              q3: "Quand les droits de badge à la salle serveurs ont-ils été revus pour la dernière fois, et qui a supprimé ceux qui n'étaient plus nécessaires ?"
              q4: "Qui détient les clés ou les codes des locaux à accès restreint, quand les codes ont-ils été changés pour la dernière fois, et comment les zones de livraison sont-elles séparées des zones sécurisées ?"
              r1: "Registre des visiteurs sur une période récente"
              r2: "Export du système de badges listant les personnes ayant accès aux zones restreintes"
              r3: "Traces de la dernière revue des droits d'accès physiques"
              r4: "Visite du site : accueil, lecteurs de badge, talonnage aux points d'accès"
              s1: {unit: "départs et 5 détenteurs de badge pour les zones restreintes", population: "base des badges et départs des 12 derniers mois", method: "vérifier que les badges des partants ont été désactivés le dernier jour et que chaque détenteur d'un accès en zone restreinte a une justification liée à son poste"}
              p1: "Badges de personnes parties toujours actifs, faute de notification des RH aux services généraux ou au gestionnaire de l'immeuble"
              p2: "L'auditeur franchit une porte derrière un salarié sans être interpellé"
              p3: "Registre des visiteurs incomplet, sans heure de sortie ni nom de la personne qui reçoit"
              p4: "Code de la salle serveurs inchangé depuis des années et connu d'anciens salariés ou prestataires"
            a.7.3:
              q1: "Quels locaux avez-vous identifiés comme nécessitant une protection renforcée, et sur quels critères ?"
              q2: "Quels locaux abritent des informations ou des équipements sensibles, et comment sont-ils protégés des regards et des entrées non prévues ?"
              q3: "Les annuaires ou la signalétique de l'immeuble indiquent-ils à des personnes extérieures où se trouvent les locaux sensibles ?"
              r1: "Liste des locaux sensibles, comme les salles serveurs et les bureaux RH et finance, avec leurs protections"
              r2: "Visite du site : serrures, occultation des fenêtres et signalétique des locaux sensibles"
              p1: "Salle serveurs identifiée sur la porte et visible depuis un couloir ouvert au public"
              p2: "Salles de réunion dont les écrans ou tableaux blancs sont visibles de la rue à travers les vitres"
            a.7.4:
              q1: "Que surveillez-vous physiquement, pourquoi ces zones-là, et combien de temps conservez-vous les enregistrements ?"
              q2: "Montrez-moi le dernier test d'alarme et ce qui s'est passé lorsqu'une alarme s'est déclenchée en dehors des heures ouvrées."
              q3: "Si vous enregistrez la vidéo, pouvez-vous retrouver tout de suite les images de mardi dernier au matin pour cette porte ?"
              r1: "Plan de couverture des caméras, zones d'alarme et capteurs au regard des zones sécurisées"
              r2: "Registre des tests d'alarme et d'intrusion, avec dates et résultats"
              r3: "Règles de conservation et d'accès à la vidéosurveillance, avec l'information des personnes et la signalétique exigées par la loi locale"
              r4: "Extraction en direct d'une séquence enregistrée à une date choisie, si la vidéo est enregistrée"
              s1: {unit: "déclenchements d'alarme", population: "alarmes et événements hors heures ouvrées des 6 derniers mois", method: "rapprocher chaque événement d'une trace d'intervention et comparer le délai d'intervention à l'objectif fixé"}
              p1: "Caméras installées, mais enregistrement en panne ou durée de conservation plus courte qu'annoncé, découvert au moment où l'on demande les images"
              p2: "Alarmes sans intervenant désigné hors heures ouvrées, ou liste d'appel obsolète"
              p3: "Surveillance confiée au bailleur sans contrat ni compte rendu montrant ce qu'il fait réellement"
              p4: "Enregistreur vidéo ou centrale d'alarme accessible depuis le réseau bureautique ou Internet avec les identifiants par défaut"
              p5: "Déclaration d'applicabilité reprise de la version 2013, sans ligne ni justification pour cette mesure, nouvelle en 2022"
            a.7.5:
              q1: "Quelles menaces physiques et environnementales avez-vous prises en compte pour chaque site, comme l'inondation, l'incendie ou la chaleur ?"
              q2: "Montrez-moi les rapports de vérification de la détection et de l'extinction incendie de la salle serveurs."
              r1: "Entrées de l'appréciation des risques couvrant les menaces naturelles et environnementales, par site"
              r2: "Certificats de vérification des systèmes de détection et d'extinction incendie"
              r3: "Visite du site : canalisations, exposition aux inondations et stockage de matières combustibles près des équipements"
              p1: "Salle serveurs en sous-sol ou sous des canalisations, sans détection de fuite ni risque enregistré"
              p2: "Cartons et matériel de rechange stockés dans la salle serveurs, ce qui augmente la charge calorifique"
            a.7.6:
              q1: "Quelles règles s'appliquent dans vos zones sécurisées, et à qui sont-elles communiquées ?"
              q2: "Quelles règles s'appliquent dans les zones sécurisées, par exemple pour les téléphones, les photos et le travail isolé ?"
              q3: "Comment un technicien externe est-il encadré lorsqu'il intervient dans la salle serveurs ?"
              r1: "Règles de travail en zone sécurisée, affichées et documentées"
              r2: "Journal d'accès ou registre d'émargement de la salle serveurs pour les tiers"
              r3: "Visite du site : règles affichées et état de la zone sécurisée"
              s1: {unit: "interventions de tiers", population: "accès aux zones sécurisées au cours des 6 derniers mois", method: "vérifier que chaque intervention a été autorisée à l'avance et accompagnée"}
              p1: "Prestataires munis d'un code ou d'un badge pour la salle serveurs et laissés seuls pendant l'intervention"
              p2: "Salle serveurs utilisée comme local de stockage, si bien que beaucoup de monde a une raison d'y entrer"
            a.7.7:
              q1: "Montrez-moi votre règle bureau propre et écran verrouillé. Couvre-t-elle le domicile et les espaces partagés ?"
              q2: "Quelle est la règle pour les bureaux et les écrans quand on s'absente, et comment vérifiez-vous qu'elle est respectée ?"
              q3: "Que deviennent les documents oubliés sur l'imprimante ?"
              r1: "Politique bureau propre et écran verrouillé"
              r2: "Paramètre de délai de verrouillage d'écran dans la console de gestion des postes"
              r3: "Comptes rendus des tournées de contrôle bureau propre et suites données"
              r4: "Visite du site : bureaux inoccupés, imprimantes, tableaux blancs et écrans non verrouillés"
              s1: {unit: "bureaux et les imprimantes partagées", population: "espaces ouverts parcourus pendant la visite", method: "observer à des moments aléatoires, idéalement à la pause déjeuner ou en fin de journée"}
              p1: "Impressions sensibles oubliées sur les imprimantes et tableaux blancs non effacés après les réunions"
              p2: "Verrouillage d'écran imposé sur les portables, mais pas sur les postes partagés ni sur les équipements des salles de réunion"
              p3: "Aucun rangement fermant à clé n'est fourni, si bien que la politique ne peut pas être appliquée"
            a.7.8:
              q1: "Comment avez-vous décidé de l'emplacement du matériel critique et de ce qui le protège des dommages et des regards ?"
              q2: "Pourquoi ce matériel est-il placé à cet endroit, et qu'est-ce qui le protège des dommages et des regards non autorisés ?"
              r1: "Visite du site : disposition des baies, refroidissement, emplacement du matériel et écrans tournés vers les fenêtres"
              r2: "Relevés de surveillance de la température et de l'humidité dans les locaux techniques"
              p1: "Équipements réseau dans un placard ouvert du bureau ou sous un bureau, accessibles à tous"
              p2: "Local technique sans surveillance de la température ni alerte"
            a.7.9:
              q1: "Quelles sont les règles pour les portables, téléphones et supports utilisés hors de vos locaux ?"
              q2: "Comment protégez-vous les portables et autres actifs qui sortent des locaux, et que se passe-t-il en cas de perte ?"
              q3: "Montrez-moi la dernière déclaration de perte ou de vol d'un équipement et les actions menées."
              q4: "Quel matériel se trouve en permanence hors de vos locaux (bornes, antennes, équipements réseau d'agences ou de sites distants), et comment est-il protégé contre la manipulation et le vol ?"
              r1: "Règles applicables aux actifs utilisés hors site, dans la charte d'utilisation ou la politique de télétravail"
              r2: "Rapport de conformité du chiffrement des équipements et de l'effacement à distance"
              r3: "Enregistrements des incidents de perte ou de vol d'équipements"
              r4: "Traces des sorties de matériel autorisées ou des remises en garde, lorsque vous les exigez"
              s1: {unit: "équipements tirés du registre des actifs", population: "portables et mobiles remis au personnel", method: "vérifier l'état du chiffrement et l'inscription à l'effacement à distance dans la console de gestion"}
              p1: "Équipements emportés hors site laissés sans surveillance dans des véhicules ou des lieux publics, sans que personne ne le signale ni n'enquête"
              p2: "Perte d'équipement déclarée, mais aucune preuve d'effacement ni d'analyse de l'exposition des données"
            a.7.10:
              q1: "Autorisez-vous les supports amovibles ? Si oui, comment sont-ils maîtrisés tout au long de leur cycle de vie ?"
              q3: "Comment vos règles de gestion des supports varient-elles selon le niveau de classification, de l'achat à la mise au rebut en passant par le transport, et couvrent-elles le papier ?"
              q2: "Qu'est-ce qui empêche des données sensibles de sortir sur une clé USB : un blocage technique, un chiffrement imposé ou autre chose ? Montrez-moi."
              r1: "Règles de gestion des supports amovibles et des supports de stockage"
              r2: "Politique de poste bloquant ou chiffrant les supports amovibles, avec la liste des dérogations"
              r3: "Registre ou journal de transfert des supports contenant des données sensibles, comme les bandes de sauvegarde"
              s1: {unit: "dérogations ou transferts de supports", population: "dérogations USB accordées et transferts physiques de supports des 12 derniers mois", method: "vérifier l'autorisation, le chiffrement et la restitution ou la destruction"}
              p1: "Supports USB techniquement autorisés alors que la politique les interdit"
              p2: "Liste des dérogations qui s'allonge avec le temps, sans date d'expiration ni revue"
              p3: "Les règles sur les supports ne renvoient pas au schéma de classification, si bien qu'un disque confidentiel est traité comme un disque public"
            a.7.11:
              q1: "De quels services généraux dépendent vos systèmes critiques, et quel secours existe pour chacun ?"
              q2: "Que deviennent la salle serveurs et le réseau en cas de coupure secteur de deux heures ?"
              q3: "Quand l'onduleur ou le groupe électrogène a-t-il été testé en charge pour la dernière fois ?"
              q4: "Les automates des onduleurs, de la climatisation ou de la gestion technique du bâtiment sont-ils sur un réseau séparé, et l'un d'eux est-il joignable depuis Internet ?"
              r1: "Rapports de maintenance et de tests en charge des onduleurs et du groupe électrogène"
              r2: "Liste des dépendances aux services généraux : électricité, refroidissement, réseau et télécoms"
              r3: "Visite du site : tableau d'état de l'onduleur et âge des batteries"
              p1: "Batteries d'onduleur au-delà de leur date de remplacement et jamais testées"
              p2: "Lien Internet ou groupe de climatisation unique, sans risque enregistré ni solution de repli"
            a.7.12:
              q1: "Où votre câblage électrique et réseau est-il documenté, et quels parcours avez-vous décidé de protéger ?"
              q2: "Par où passent vos câbles électriques et réseau, et pourrait-on les écouter ou les endommager sans que personne ne s'en aperçoive ?"
              r1: "Visite du site : baies de brassage, goulottes et locaux techniques"
              r2: "Plan de câblage ou documentation des baies de brassage étiquetées"
              p1: "Locaux techniques donnant sur des couloirs partagés et laissés ouverts"
              p2: "Brassage non étiqueté, si bien que personne ne sait à quoi est relié un port actif d'une salle de réunion"
            a.7.13:
              q1: "Quel matériel fait l'objet d'une maintenance planifiée, et qui est autorisé à la réaliser ?"
              q2: "Qui assure la maintenance de votre matériel critique, à quelle fréquence, et comment encadrez-vous son accès au matériel ?"
              q3: "Que deviennent les données d'un matériel envoyé en réparation ?"
              r1: "Planning de maintenance du matériel critique, conforme aux recommandations des fournisseurs"
              r2: "Rapports de maintenance et d'intervention pour le matériel échantillonné"
              r3: "Contrats de maintenance ou SLA pour les onduleurs, la climatisation et les systèmes incendie"
              s1: {unit: "équipements critiques", population: "matériel critique inscrit au registre des actifs", method: "comparer la date de la dernière intervention à la périodicité prévue"}
              p1: "Contrats de maintenance échus sans que personne ne s'en aperçoive, les factures arrivant dans un autre service"
              p2: "Disques renvoyés sous garantie sans effacement, sans destruction et sans option de conservation du disque ni engagement d'effacement par le fournisseur"
            a.7.14:
              q1: "Quelle est votre procédure avant la réutilisation, la restitution ou la mise au rebut d'un matériel contenant des données ?"
              q2: "Décrivez-moi le parcours d'un portable depuis son retrait du service jusqu'à sa mise au rebut."
              q3: "Comment savez-vous que votre prestataire de destruction a réellement détruit ce que vous lui avez remis ?"
              q4: "Qui vérifie qu'un effacement a réellement abouti, et les logiciels sous licence et les étiquettes de l'organisation sont-ils retirés avant réutilisation ou revente ?"
              r1: "Procédure de mise au rebut et de réutilisation précisant les méthodes d'effacement ou de destruction"
              r2: "Certificats de destruction du prestataire"
              r3: "Journaux d'effacement des équipements réattribués"
              r4: "Visite du site : stockage du matériel retiré en attente de mise au rebut"
              s1: {unit: "équipements mis au rebut ou réattribués", population: "actifs retirés du service au cours des 12 derniers mois", method: "rapprocher les numéros de série du registre des actifs d'un journal d'effacement ou d'un certificat de destruction"}
              p1: "Certificats de destruction indiquant des poids ou des quantités, pas des numéros de série, si bien que rien ne permet de remonter au registre"
              p2: "Pile de portables retirés du service dans un local non fermé à clé, données encore présentes"
              p3: "Imprimantes et copieurs à disque interne rendus au loueur sans effacement"
            a.8.1:
              q1: "Quelles règles s'appliquent aux ordinateurs portables et aux téléphones qui contiennent des données de l'entreprise, et où sont-elles écrites ?"
              q2: "Prenez n'importe quel portable dans cette salle. Montrez-moi qu'il est chiffré, géré et à jour de ses correctifs."
              q3: "Que se passe-t-il quand un terminal est perdu ou volé ? Racontez-moi le dernier cas."
              r1: "Politique relative aux terminaux ou charte d'utilisation couvrant les appareils de l'entreprise et les appareils personnels"
              r2: "Export de l'outil MDM ou de gestion des terminaux : liste des appareils avec chiffrement, version du système et dernière remontée"
              r3: "Enregistrements de pertes ou de vols de terminaux montrant la procédure suivie (par exemple verrouillage ou effacement à distance)"
              s1: {unit: "terminaux", population: "inventaire des terminaux gérés", method: "choisir des terminaux dans la liste MDM et auprès des personnes rencontrées sur site, comparer leur état de conformité avec la politique"}
              p1: "L'inventaire des terminaux ne correspond pas à l'effectif RH : certains salariés utilisent des portables non gérés"
              p2: "Des téléphones personnels consultent la messagerie de l'entreprise sans MDM ni politique de protection des applications, alors que le BYOD est censé être interdit"
              p3: "Des terminaux qui ne remontent plus depuis des mois sont toujours comptés comme conformes"
            a.8.2:
              q1: "Comment définissez-vous un compte à privilèges, et qui approuve son attribution ?"
              q2: "Montrez-moi la liste actuelle des comptes administrateurs sur votre fournisseur d'identité, votre console cloud et vos serveurs de production."
              q3: "Les administrateurs utilisent-ils un compte distinct pour l'administration, ou leur compte de tous les jours ?"
              q4: "Comment limitez-vous dans le temps les accès à privilèges, y compris les comptes de secours, et où l'activité à privilèges est-elle journalisée ?"
              r1: "Inventaire des comptes à privilèges, y compris les comptes de service et de secours, avec un responsable nommé"
              r2: "Tickets d'approbation des accès à privilèges accordés sur la période d'audit"
              r3: "Dernière revue des accès à privilèges avec le réviseur, les décisions et les retraits effectués"
              r4: "Export en direct des membres des rôles d'administration de l'IdP et du principal tenant cloud"
              s1: {unit: "comptes à privilèges", population: "membres actuels des rôles d'administration sur l'IdP, le cloud et la production", method: "rattacher chacun à une approbation et à une entrée de revue ; rechercher les comptes de partants et les identifiants partagés"}
              p1: "Il n'existe aucune liste unique des comptes à privilèges ; elle est reconstituée pour l'audit"
              p2: "Le rôle d'administrateur global est détenu par plus de personnes que nécessaire, dont d'anciens prestataires"
              p3: "Des comptes de service ayant des droits d'administration n'ont pas de responsable, et leurs secrets ne sont ni gérés ni changés au départ d'un administrateur"
              p4: "Les administrateurs n'ont jamais pris acte des règles applicables à leurs comptes à privilèges"
            a.8.3:
              q1: "Comment décidez-vous qui peut voir quoi dans vos principales applications métier ?"
              q2: "Connectez-vous avec un utilisateur standard et montrez-moi que vous ne pouvez pas ouvrir d'enregistrements hors du rôle de cet utilisateur."
              q3: "Comment contrôlez-vous l'accès aux partages réseau et aux sites SharePoint contenant des données confidentielles ?"
              r1: "Matrice des rôles ou des droits pour les applications clés"
              r2: "Export des droits sur un partage ou un site confidentiel"
              r3: "Configuration montrant comment l'accès est appliqué par rôle dans une application métier (les revues périodiques sont vérifiées au titre de A.5.18)"
              s1: {unit: "utilisateurs", population: "utilisateurs d'une application critique", method: "comparer les droits réels avec la matrice des rôles et l'intitulé de poste"}
              p1: "Dossiers confidentiels partagés avec « Tout le monde » ou par des liens anonymes"
              p2: "La matrice des rôles existe sur le papier, mais les droits applicatifs ont été accordés au cas par cas"
            a.8.4:
              q1: "Qui peut lire ou modifier le code source, et où cette règle est-elle écrite pour chaque dépôt ?"
              q2: "Qui a un accès en écriture à vos dépôts de code source, et comment est-ce revu ?"
              q3: "Un développeur peut-il pousser directement sur la branche principale ? Montrez-moi les paramètres de protection des branches."
              q4: "Qui peut modifier les pipelines CI/CD, les outils de build et les registres de paquets internes ?"
              r1: "Liste des accès aux dépôts avec les rôles par dépôt ou par groupe"
              r2: "Captures d'écran des règles de protection de branche ou de fusion pour les dépôts de production"
              r3: "Preuve du retrait d'un partant de la plateforme de code"
              s1: {unit: "dépôts", population: "dépôts de code de production et partants récents ayant eu un accès développeur", method: "vérifier les paramètres de protection et confirmer la suppression des comptes des partants"}
              s2: {unit: "partants", population: "dépôts de code de production et partants récents ayant eu un accès développeur", method: "vérifier les paramètres de protection et confirmer la suppression des comptes des partants"}
              p1: "D'anciens salariés ou des prestataires externes sont toujours membres de l'organisation GitHub ou GitLab"
              p2: "Les administrateurs peuvent contourner la protection des branches et le font sans trace de revue"
              p3: "L'accès en écriture aux dépôts de production ou aux pipelines de build dépasse les responsables désignés"
            a.8.5:
              q1: "Quelle est votre règle en matière de mots de passe et de MFA, et quels systèmes couvre-t-elle ?"
              q4: "Comment avez-vous décidé quels systèmes et quels comptes exigent la MFA ou une authentification plus forte ?"
              q2: "Montrez-moi les paramètres d'application de la MFA et la liste des utilisateurs ou applications qui en sont exclus."
              q3: "Comment traitez-vous les protocoles et applications anciens qui ne gèrent pas la MFA ?"
              r1: "Standard d'authentification : règles de mot de passe, périmètre de la MFA, verrouillage de compte"
              r2: "Export de la configuration de l'accès conditionnel ou de la politique MFA de l'IdP"
              r3: "Rapport des comptes sans MFA enregistrée"
              s1: {unit: "systèmes", population: "applications exposées sur Internet et applications critiques", method: "tester la connexion et confirmer que le SSO ou la MFA est imposé"}
              p1: "Là où la politique exige la MFA, elle est imposée aux salariés mais les comptes d'administration, de service ou « VIP » en sont exclus"
              p2: "Les protocoles d'authentification anciens restent autorisés et permettent de contourner la MFA"
              p3: "Certains outils SaaS utilisent des comptes locaux hors SSO avec des mots de passe faibles"
            a.8.6:
              q1: "Quelles ressources suivez-vous en termes de capacité, et quels seuils déclenchent une action ?"
              q2: "Comment savez-vous qu'un système critique va manquer de stockage, de CPU ou de licences avant la panne ?"
              q3: "Montrez-moi une alerte de capacité et ce qui a été fait ensuite."
              q4: "Comment anticipez-vous les besoins de capacité liés à de nouvelles activités ou à de nouveaux projets, en particulier pour les ressources à long délai d'approvisionnement ?"
              r1: "Tableau de bord de supervision ou seuils pour les systèmes critiques"
              r2: "Compte rendu de revue ou de planification de la capacité, ou ticket issu d'une alerte de capacité"
              p1: "Les seuils sont configurés mais les alertes partent vers une boîte aux lettres que personne ne surveille"
              p2: "Un incident passé dû à un disque ou un quota plein n'a donné lieu à aucune action sur la capacité"
            a.8.7:
              q1: "Quelle est votre approche de protection contre les logiciels malveillants sur les postes, les serveurs, la messagerie et le cloud ?"
              q2: "Quel antivirus ou EDR couvre vos postes et vos serveurs, et comment savez-vous qu'aucun n'en est dépourvu ?"
              q3: "Montrez-moi la dernière détection de logiciel malveillant et la façon dont elle a été traitée."
              q4: "Comment les salariés apprennent-ils à repérer l'hameçonnage, et que se passe-t-il quand ils en signalent un ?"
              r1: "Export de la console antivirus ou EDR : couverture, état des agents, agents obsolètes"
              r2: "Événements de détection ou de mise en quarantaine avec les tickets de traitement"
              r3: "Configuration du filtrage de la messagerie et enregistrements de sensibilisation à l'hameçonnage"
              s1: {unit: "terminaux", population: "inventaire des actifs et détections de logiciels malveillants", method: "rapprocher l'inventaire des terminaux protégés ; suivre les détections jusqu'à leur clôture"}
              s2: {unit: "détections", population: "inventaire des actifs et détections de logiciels malveillants", method: "rapprocher l'inventaire des terminaux protégés ; suivre les détections jusqu'à leur clôture"}
              p1: "L'inventaire des actifs et le nombre d'agents EDR ne concordent pas, des serveurs ou des hôtes Linux ne sont pas couverts"
              p2: "Les administrateurs locaux peuvent désactiver l'agent et certains l'ont fait"
            a.8.8:
              q1: "Quels sont vos délais de correction par niveau de gravité, et quel est le périmètre des scans ?"
              q4: "Comment êtes-vous informés des nouvelles vulnérabilités touchant les logiciels et équipements que vous ne pouvez pas scanner (avis des éditeurs, flux CVE, notifications des fournisseurs), et qui les analyse au regard de votre inventaire des actifs ?"
              q2: "Montrez-moi votre dernier scan et combien de vulnérabilités critiques ont dépassé leur échéance."
              q3: "Prenons cette vulnérabilité critique d'il y a trois mois : quand a-t-elle été détectée, quand a-t-elle été corrigée, et comment avez-vous vérifié la correction ?"
              r1: "Procédure de gestion des vulnérabilités avec des délais de correction selon la gravité"
              r2: "Derniers rapports de scan de vulnérabilités internes et externes"
              r3: "Dernier rapport de test d'intrusion ou d'évaluation des vulnérabilités, s'il y en a eu un, et son suivi des corrections"
              r4: "Rapport de conformité des correctifs pour les serveurs et les postes de travail"
              s1: {unit: "vulnérabilités élevées ou critiques", population: "résultats de scans et de tests d'intrusion sur la période d'audit", method: "vérifier la date de détection, le ticket, la date de correction par rapport au délai cible, la preuve de nouveau scan ; les exceptions exigent une acceptation du risque"}
              p1: "Les scans tournent, mais des vulnérabilités critiques restent ouvertes pendant des mois sans acceptation du risque"
              p2: "Le périmètre des scans oublie des charges de travail cloud, des conteneurs ou des sous-réseaux récemment ajoutés"
              p3: "Les constats des tests d'intrusion ne sont pas suivis jusqu'à leur clôture ; les mêmes problèmes réapparaissent dans le rapport suivant"
            a.8.9:
              q1: "Quels référentiels de configuration sécurisée utilisez-vous pour les serveurs, les postes, les équipements réseau et le cloud, et qui en est responsable ?"
              q2: "Montrez-moi comment vous détectez un système qui s'est écarté de son référentiel."
              q3: "Voici un serveur de production : montrez-moi ses paramètres actuels par rapport au référentiel."
              r1: "Référentiels ou modèles de durcissement (par exemple fondés sur le CIS) par plateforme, avec version et date de revue"
              r2: "Rapport de conformité ou de dérive de configuration issu d'un outil (Intune, GPO, CSPM, Ansible, état Terraform)"
              r3: "Enregistrements des écarts au référentiel avec leur approbation"
              s1: {unit: "systèmes", population: "serveurs critiques, équipements réseau et comptes cloud", method: "comparer la configuration réelle au référentiel documenté"}
              p1: "Le référentiel est cité dans la politique mais n'a jamais été adapté, versionné ni revu"
              p2: "Les équipements réseau et les services cloud sont laissés de côté ; seul Windows est couvert par les GPO"
              p3: "Des mots de passe ou services par défaut sont toujours actifs sur des appliances"
            a.8.10:
              q1: "Comment décidez-vous qu'une information doit être supprimée, et est-ce lié à votre calendrier de conservation ?"
              q2: "Montrez-moi que des données ayant dépassé leur durée de conservation ont été supprimées dans une application, et comment la durée de conservation des sauvegardes fait expirer les anciennes copies."
              q3: "Comment les disques et les équipements sont-ils effacés ou détruits en fin de vie, et par qui ?"
              r1: "Calendrier de conservation et de suppression par catégorie de données"
              r2: "Journaux de suppression ou résultats des tâches de purge d'un système clé"
              r3: "Certificats de destruction ou rapports d'effacement pour les supports mis au rebut"
              r4: "Clauses contractuelles ou attestations de suppression des fournisseurs SaaS et cloud"
              s1: {unit: "équipements mis au rebut", population: "actifs sortis sur la période d'audit", method: "rattacher le numéro d'inventaire à un certificat d'effacement ou de destruction ; vérifier que les enregistrements plus anciens que la durée de conservation ont disparu"}
              s2: {unit: "catégorie de données", population: "actifs sortis sur la période d'audit", method: "rattacher le numéro d'inventaire à un certificat d'effacement ou de destruction ; vérifier que les enregistrements plus anciens que la durée de conservation ont disparu"}
              p1: "Des durées de conservation sont définies mais aucun mécanisme de suppression n'existe ; les données sont gardées indéfiniment"
              p2: "Les portables mis au rebut n'ont pas de certificat d'effacement ou de destruction rattaché à leur numéro de série"
              p3: "La suppression des données des anciens clients dans les outils SaaS n'a jamais été demandée ni confirmée"
            a.8.11:
              q1: "Où utilisez-vous le masquage, la pseudonymisation ou l'anonymisation, et qu'est-ce qui a motivé ce choix ?"
              q2: "Montrez-moi à quoi ressemblent les données personnelles dans votre environnement de test ou d'analyse."
              q3: "Quels utilisateurs voient les numéros de carte ou les identifiants en entier dans l'application, et pourquoi ?"
              q4: "Comment avez-vous vérifié que des données pseudonymisées ou anonymisées ne peuvent pas être réidentifiées en croisant des champs ?"
              r1: "Règles de masquage ou de pseudonymisation rattachées à la classification des données"
              r2: "Capture d'écran de champs masqués dans l'application ou dans une base hors production"
              r3: "Configuration des rôles montrant qui peut démasquer les données"
              s1: {unit: "jeux de données", population: "copies hors production et extractions de reporting", method: "examiner les enregistrements à la recherche de données personnelles ou sensibles non masquées"}
              p1: "Base de production clonée en test avec de vraies données personnelles et sans masquage"
              p2: "Mesure déclarée applicable sans approche définie ; ou exclue sans justification alors que des données personnelles sont traitées"
              p3: "Des données dites anonymisées peuvent encore être réidentifiées en croisant des champs, et personne ne l'a vérifié"
              p4: "Le moindre privilège est présenté comme mesure de masquage ; l'auditeur veut savoir quelles données sont masquées, par quelle technique et avec quel outil"
            a.8.12:
              q1: "Par quels canaux des données sensibles pourraient fuir, et lesquels maîtrisez-vous ?"
              q2: "Montrez-moi ce qui se passe si j'envoie un fichier marqué confidentiel vers une adresse personnelle ou si je le copie sur une clé USB."
              q3: "Si un outil de DLP est utilisé, qui examine ses alertes et à quoi les dernières ont-elles abouti ?"
              r1: "Analyse des canaux de fuite : types d'informations sensibles, canaux, et mesure retenue pour chaque canal"
              r2: "Export de la configuration de l'outil de DLP, si un tel outil est utilisé (M365 Purview, CASB, poste de travail)"
              r3: "Journal des alertes DLP et enregistrements de leur analyse, si un outil de DLP est utilisé"
              s1: {unit: "alertes", population: "événements DLP du dernier trimestre, si un outil de DLP est utilisé", method: "vérifier que chacune a été examinée et clôturée avec une décision"}
              p1: "DLP en mode audit seul depuis son déploiement, alertes jamais examinées"
              p2: "Les règles ne correspondent pas au schéma de classification, si bien que les données marquées ne sont pas détectées"
              p3: "Stockage cloud personnel, USB et navigateurs non gérés non couverts"
              p4: "Surveillance des communications des salariés déployée sans vérifier le droit de la vie privée ni les obligations envers les représentants du personnel"
            a.8.13:
              q1: "Qu'est-ce qui est sauvegardé, à quelle fréquence, combien de temps est-ce conservé, et où se trouvent les copies ?"
              q2: "Quand avez-vous fait pour la dernière fois un test de restauration, et avec quel résultat ?"
              q3: "Un rançongiciel disposant de droits d'administration pourrait-il supprimer ou chiffrer vos sauvegardes ?"
              r1: "Politique ou planning de sauvegarde par système avec RPO et durée de conservation"
              r2: "Rapports des tâches de sauvegarde montrant les réussites et les échecs"
              r3: "Enregistrements des tests de restauration avec date, périmètre, résultat et durée"
              r4: "Preuve de la façon dont les copies de sauvegarde sont séparées de la production et protégées contre sa compromission (hors site, hors ligne ou immuables, selon ce qu'exige l'appréciation des risques)"
              s1: {unit: "systèmes", population: "systèmes critiques du registre des actifs", method: "vérifier que chacun figure dans les tâches de sauvegarde, qu'une sauvegarde récente a réussi et qu'au moins un test de restauration a été fait"}
              p1: "Aucun test de restauration jamais réalisé, ou seulement des restaurations de fichiers isolés"
              p2: "Les données SaaS (M365, CRM) sont supposées sauvegardées par le fournisseur"
              p3: "Des tâches en échec depuis des semaines sans ticket"
            a.8.14:
              q1: "Quels services ont besoin de redondance, et comment l'avez-vous déduit de leurs exigences de disponibilité ?"
              q2: "Quels systèmes doivent rester disponibles, et de quelle redondance disposent-ils ?"
              q3: "Avez-vous testé une bascule ? Montrez-moi le résultat."
              r1: "Exigences de disponibilité par service critique (issues du BIA ou de l'appréciation des risques)"
              r2: "Schéma d'architecture montrant les composants, zones ou sites redondants"
              r3: "Rapport de test de bascule"
              p1: "Des points de défaillance uniques (un seul pare-feu, un seul lien Internet, une seule région) ne sont pas couverts par le traitement des risques"
              p2: "Redondance conçue mais jamais testée"
            a.8.15:
              q1: "Quels événements journalisez-vous, sur quels systèmes, et combien de temps conservez-vous les journaux ?"
              q2: "Montrez-moi les connexions administrateur sur ce serveur le mois dernier."
              q3: "Qui peut supprimer ou modifier les journaux, et comment le sauriez-vous ?"
              q4: "Qui analyse ces journaux, et à quelle fréquence ? Montrez-moi une analyse récente et ce qui en est ressorti."
              r1: "Standard de journalisation : sources, types d'événements, durée de conservation"
              r2: "Liste des sources de journaux raccordées au SIEM ou à la plateforme de journaux"
              r3: "Paramètres de conservation des journaux et droits d'accès à leur stockage"
              s1: {unit: "systèmes", population: "actifs critiques", method: "confirmer que chacun envoie ses journaux, retrouver un événement passé précis dans la durée de conservation"}
              p1: "Des applications critiques ou des services cloud n'envoient pas leurs journaux de façon centralisée"
              p2: "Conservation plus courte que la politique, par exemple 30 jours par défaut dans une offre SaaS"
              p3: "Les administrateurs peuvent effacer les journaux de leur propre activité"
            a.8.16:
              q1: "Qu'est-ce qu'un comportement anormal sur vos réseaux et vos systèmes, et qui est chargé de le surveiller ?"
              q2: "Montrez-moi votre console de supervision et déroulez une alerte de la détection à la clôture."
              q3: "La couverture de la surveillance en dehors des heures ouvrées est-elle définie, et correspond-elle à la criticité des systèmes ?"
              r1: "Procédure de surveillance : cas d'usage, niveaux de gravité des alertes, délais de réponse, astreinte"
              r2: "Règles ou cas d'usage de détection (SIEM, MDR, IDS ou équivalent) et sources qu'ils couvrent"
              r3: "Tickets d'analyse des alertes ou rapports mensuels du MDR"
              s1: {unit: "alertes", population: "alertes levées sur les 3 derniers mois", method: "vérifier que chacune a été analysée dans le délai cible et que l'issue est consignée"}
              p1: "Le SIEM collecte les journaux mais personne n'examine les alertes ; des milliers restent en file sans traitement"
              p2: "Surveillance externalisée à un MSSP sans examen interne de ses rapports"
              p3: "Aucune référence d'activité normale, si bien que « anormal » n'est pas défini"
            a.8.17:
              q1: "Quelle source de temps vos systèmes utilisent-ils, et où ce standard est-il documenté ?"
              q2: "Quelle source de temps vos systèmes utilisent-ils, et comment savez-vous qu'ils sont à la même heure ?"
              r1: "Configuration NTP des contrôleurs de domaine, des équipements réseau et du cloud"
              s1: {unit: "systèmes", population: "serveurs et équipements réseau", method: "comparer l'heure système et les paramètres de source NTP"}
              p1: "Des appliances réseau ou des équipements OT ont leur propre horloge qui dérive"
              p2: "Fuseaux horaires mélangés dans les journaux sans normalisation en UTC, ce qui complique la corrélation"
            a.8.18:
              q1: "Quels outils permettent à un administrateur de contourner les mesures de sécurité habituelles, et qui a le droit de les utiliser ?"
              q2: "Quels outils peuvent passer outre les mesures système ou de sécurité ici, et qui peut les lancer ?"
              q3: "Comment empêchez-vous un utilisateur standard de lancer des outils d'administration ou des moteurs de script ?"
              r1: "Liste des utilitaires à usage restreint et des personnes autorisées"
              r2: "Configuration du contrôle des applications ou de la restriction des droits d'administrateur local"
              p1: "Tous les utilisateurs sont administrateurs locaux de leur portable"
              p2: "Aucune liste de ce qui est considéré comme un utilitaire à privilèges"
            a.8.19:
              q1: "Qui peut installer des logiciels sur les systèmes de production, et à partir de quelles sources approuvées ?"
              q2: "Un utilisateur peut-il installer un logiciel sur son portable ? Montrez-moi."
              q3: "Comment l'installation de logiciels sur les serveurs de production est-elle approuvée et tracée ?"
              r1: "Liste ou catalogue des logiciels approuvés"
              r2: "Rapport d'inventaire des logiciels installés issu de l'outil de gestion des terminaux"
              r3: "Tickets de changement pour les logiciels installés en production"
              s1: {unit: "postes de travail", population: "terminaux gérés", method: "comparer les logiciels installés avec la liste approuvée"}
              p1: "Logiciels non approuvés ou en fin de vie trouvés sur des postes lors de contrôles ponctuels"
              p2: "Extensions de navigateur non contrôlées"
            a.8.20:
              q1: "Montrez-moi votre schéma réseau actuel. Où se situent les frontières de confiance et les chemins d'accès à distance ?"
              q2: "Montrez-moi votre schéma réseau actuel et dites-moi quand il a été mis à jour pour la dernière fois."
              q3: "Comment les règles de pare-feu sont-elles revues, et quand a eu lieu la dernière revue ?"
              q4: "Comment l'accès d'administration aux équipements réseau est-il contrôlé ?"
              r1: "Schéma réseau à jour incluant le cloud et l'accès à distance"
              r2: "Compte rendu de revue des règles de pare-feu avec les suppressions"
              r3: "Export des règles de pare-feu ou des groupes de sécurité"
              s1: {unit: "règles", population: "règles de pare-feu et de groupes de sécurité", method: "vérifier que chacune a une justification métier et un responsable ; rechercher les règles any-any"}
              p1: "Schéma réseau obsolète, sans le cloud ni les nouveaux sites"
              p2: "Règles any-any ou temporaires jamais supprimées"
              p3: "Interfaces d'administration accessibles depuis Internet"
            a.8.21:
              q1: "Quels services réseau achetez-vous ou exploitez-vous, et quelles exigences de sécurité avez-vous fixées pour chacun ?"
              q2: "Quels services réseau achetez-vous (accès Internet, SD-WAN, VPN, DNS), et quelles clauses de sécurité figurent dans ces contrats ?"
              q3: "Comment vérifiez-vous que le fournisseur respecte les niveaux de service convenus ?"
              r1: "Contrats ou SLA de services réseau comportant des clauses de sécurité"
              r2: "Rapports de service du fournisseur ou comptes rendus de revue"
              p1: "Aucune exigence de sécurité dans les contrats avec le FAI ou le prestataire réseau"
              p2: "Rapports du fournisseur reçus mais jamais examinés"
            a.8.22:
              q1: "Comment votre réseau est-il découpé en zones, et qu'est-ce qui détermine la zone d'un système ?"
              q2: "Comment les réseaux invités, utilisateurs, serveurs et d'administration sont-ils séparés ?"
              q3: "Connectez-moi au Wi-Fi invités : puis-je joindre un système interne ?"
              r1: "Schéma de cloisonnement réseau avec VLAN, zones et niveaux de confiance"
              r2: "Règles de pare-feu ou ACL entre zones"
              s1: {unit: "tests", population: "zones réseau", method: "observer une tentative de connexion depuis la zone invités ou utilisateurs vers une zone restreinte"}
              p1: "Réseau à plat : le VLAN utilisateurs atteint directement les serveurs et les interfaces d'administration"
              p2: "Le Wi-Fi invités partage un VLAN avec des imprimantes ou des objets connectés"
            a.8.23:
              q1: "Quelles catégories de sites bloquez-vous, et comment en avez-vous décidé ?"
              q2: "Essayez d'ouvrir depuis ce portable un site malveillant connu ou un site de test bloqué : que se passe-t-il ?"
              q3: "Le filtrage s'applique-t-il encore quand les salariés travaillent de chez eux hors VPN ?"
              q4: "Comment les salariés demandent-ils l'accès à un site bloqué pour un besoin métier, et où sont les règles d'usage sûr du web ?"
              r1: "Politique de filtrage web avec les catégories bloquées"
              r2: "Configuration de l'outil de filtrage (passerelle web sécurisée, filtrage DNS, pare-feu)"
              r3: "Journaux ou rapports des blocages"
              s1: {unit: "terminaux", population: "terminaux au bureau et à distance", method: "test en direct d'une catégorie bloquée ou d'une URL de test"}
              p1: "Filtrage uniquement sur le pare-feu du bureau ; les salariés à distance ne sont pas protégés"
              p2: "Les sites signalés comme malveillants par le renseignement sur les menaces ou par le fournisseur de filtrage ne sont pas bloqués"
            a.8.24:
              q1: "Quelles sont vos règles sur les algorithmes de chiffrement, les longueurs de clé et les cas où le chiffrement est obligatoire ?"
              q2: "Qui gère les clés et les certificats, et comment sauriez-vous que l'un d'eux va expirer ?"
              q3: "Montrez-moi le chiffrement au repos de cette base de données et le chiffrement en transit de cette application web."
              r1: "Politique de cryptographie incluant la gestion des clés"
              r2: "Inventaire des clés et des certificats avec responsables et dates d'expiration"
              r3: "Captures d'écran des paramètres de chiffrement (KMS, disque, résultat d'un scan TLS)"
              s1: {unit: "systèmes", population: "systèmes qui stockent ou transmettent des données confidentielles", method: "vérifier le paramétrage du chiffrement et les versions de protocole"}
              p1: "Des certificats expirés ont provoqué des interruptions ; aucun inventaire"
              p2: "Des versions de TLS obsolètes ou des suites de chiffrement faibles sont encore activées"
              p3: "Clés stockées avec les données ou dans le code source"
            a.8.25:
              q1: "Décrivez votre cycle de développement et la place qu'y occupent les activités de sécurité."
              q2: "Prenons cette version récente : montrez-moi les étapes de sécurité par lesquelles elle est passée."
              r1: "Politique de développement sécurisé ou description du cycle de développement"
              r2: "Traçabilité d'une version : exigences, revue, tests, approbation"
              s1: {unit: "versions", population: "versions livrées sur la période d'audit", method: "suivre une version du ticket au déploiement et vérifier les points de contrôle de sécurité"}
              p1: "Le document de cycle de développement décrit des points de contrôle que le pipeline CI n'impose pas"
              p2: "Du low-code ou des scripts en dehors du cycle de développement officiel"
            a.8.26:
              q1: "Comment les exigences de sécurité sont-elles recueillies pour une nouvelle application ou une évolution majeure ?"
              q2: "Comment les exigences de sécurité sont-elles intégrées à une nouvelle application ou fonctionnalité que vous développez ou achetez ?"
              q3: "Montrez-moi les exigences de sécurité recueillies pour votre dernier nouveau système."
              r1: "Modèle ou liste de contrôle des exigences de sécurité pour les projets et les acquisitions"
              r2: "Exigences de sécurité complétées et approuvées, avec leur approbateur, pour un projet ou une acquisition SaaS récente"
              s1: {unit: "projets", population: "nouveaux systèmes ou évolutions majeures sur la période d'audit", method: "vérifier que des exigences de sécurité ont été définies et vérifiées"}
              p1: "Des outils SaaS achetés par les métiers sans aucune exigence de sécurité"
              p2: "Exigences définies mais jamais testées avant la mise en production"
              p3: "Exigences rédigées mais jamais formellement approuvées avant le développement ou l'achat"
            a.8.27:
              q1: "Quels principes d'ingénierie sécurisée vos architectes suivent-ils, et où sont-ils écrits ?"
              q2: "Montrez-moi comment une conception récente a été revue au regard de ces principes."
              r1: "Principes d'architecture sécurisée ou architecture de référence"
              r2: "Revue d'architecture ou modèle de menaces d'un système récent"
              p1: "Les principes sont des copies génériques non appliquées lors des revues de conception"
              p2: "Les conceptions des systèmes exposés sur Internet ne sont pas revues au regard des schémas d'attaque connus (par exemple au moyen d'une modélisation des menaces)"
              p3: "Principes jamais revus depuis leur rédaction, et jamais transmis aux développeurs externes"
            a.8.28:
              q1: "Quel standard de développement sécurisé vos développeurs suivent-ils, et comment y sont-ils formés ?"
              q2: "Montrez-moi une pull request récente : qui l'a relue et quels contrôles de sécurité se sont exécutés automatiquement ?"
              q3: "Comment suivez-vous et mettez-vous à jour les bibliothèques tierces vulnérables ?"
              r1: "Guide de développement sécurisé (par exemple fondé sur l'OWASP) par langage"
              r2: "Résultats SAST et d'analyse des dépendances issus du pipeline"
              r3: "Enregistrements de formation des développeurs au développement sécurisé"
              r4: "Exceptions aux constats bloquants avec acceptation du risque"
              s1: {unit: "pull requests fusionnées", population: "fusions sur la branche principale au cours des 3 derniers mois", method: "vérifier la revue par un pair, le résultat des analyses et le traitement des constats"}
              p1: "Les outils d'analyse tournent mais les résultats sont ignorés ; des constats critiques sont fusionnés sans justification"
              p2: "Fusions auto-approuvées ou revues de pure forme"
              p3: "Bibliothèques tierces non inventoriées ni tenues à jour ; secrets codés en dur trouvés dans le code"
            a.8.29:
              q1: "Quels tests de sécurité doivent être réussis avant une mise en production, et qui donne le feu vert ?"
              q2: "Quels tests de sécurité ont lieu avant la mise en production d'une version, et qui donne le feu vert ?"
              q3: "Montrez-moi les preuves de recette de la dernière version significative."
              q4: "Qui, en dehors des développeurs, réalise la recette, et à quel point l'environnement de test est-il proche de la production ?"
              r1: "Plan ou critères de test incluant les tests de sécurité"
              r2: "Résultats des tests de sécurité (DAST, test d'intrusion, tests fonctionnels de sécurité) pour une version récente"
              s1: {unit: "versions", population: "versions majeures sur la période d'audit", method: "vérifier que les tests de sécurité ont été exécutés et que la recette a été signée avant le déploiement"}
              p1: "Tests de sécurité limités à un test d'intrusion annuel, pas à chaque version significative"
              p2: "Aucun critère d'acceptation, si bien que des tests en échec ne bloquent pas la mise en production"
            a.8.30:
              q1: "Quels développements externalisez-vous, et quelles exigences de sécurité s'y appliquent ?"
              q2: "Faites-vous appel à des développeurs externes ? Quelles clauses de sécurité figurent dans leurs contrats ?"
              q3: "Comment contrôlez-vous le code qu'ils livrent ?"
              r1: "Contrats ou cahiers des charges comportant des clauses de développement sécurisé, de propriété intellectuelle et d'accès"
              r2: "Enregistrements de recette ou de revue de code des livrables externalisés"
              r3: "Preuves du fournisseur de tests de sécurité à la livraison, et clause d'audit du contrat"
              s1: {unit: "fournisseurs", population: "fournisseurs de développement externalisé", method: "vérifier les clauses contractuelles et les preuves de recette"}
              p1: "Aucune revue continue des pratiques de développement du fournisseur, seul le livrable final est contrôlé"
              p2: "Aucune revue du code livré ; le contrat ne dit rien de la sécurité"
            a.8.31:
              q1: "Comment le développement, le test et la production sont-ils séparés, et qui peut accéder à chacun ?"
              q2: "Comment le développement, le test et la production sont-ils séparés, et qui peut accéder à la production ?"
              q3: "Un développeur peut-il modifier directement la production ? Montrez-moi."
              q4: "Comment les environnements de développement et de test sont-ils eux-mêmes protégés (accès, correctifs, configuration sécurisée, surveillance) ?"
              r1: "Schéma des environnements montrant des comptes, abonnements ou réseaux distincts"
              r2: "Liste des accès à la production"
              p1: "Les développeurs ont des droits d'administration permanents en production"
              p2: "Le test et la production partagent des identifiants ou des bases de données"
            a.8.32:
              q1: "Quel est votre processus de gestion des changements, y compris pour les changements urgents ?"
              q2: "Prenons ce changement dans votre liste : montrez-moi la demande, l'analyse de risque, l'approbation, le test et le plan de retour arrière."
              q3: "Comment détectez-vous un changement qui a contourné le processus ?"
              r1: "Procédure de gestion des changements"
              r2: "Journal des changements ou export des tickets sur la période d'audit"
              r3: "Enregistrements des changements urgents avec approbation a posteriori"
              s1: {unit: "changements", population: "changements sur la période d'audit, y compris les changements urgents", method: "l'auditeur choisit dans la liste complète ou dans les journaux système, puis vérifie l'approbation, les tests et la séparation entre approbateur et exécutant"}
              p1: "Des changements visibles dans les journaux de déploiement ou d'audit sans ticket"
              p2: "L'exécutant approuve son propre changement"
              p3: "Changements urgents jamais revus après coup"
            a.8.33:
              q1: "Quelles sont vos règles d'utilisation des données de production en test, et qui approuve les exceptions ?"
              q2: "D'où viennent vos données de test, et certaines sont-elles de vraies données de production ?"
              q3: "Si des données de production sont copiées en test, qui l'approuve et quand sont-elles supprimées ?"
              r1: "Règles ou procédure relatives aux données de test"
              r2: "Enregistrements d'approbation et de suppression des copies de données de production"
              s1: {unit: "environnement de test", population: "environnements hors production", method: "examiner un échantillon d'enregistrements à la recherche de vraies données personnelles ou confidentielles"}
              p1: "Exports complets de la production en test avec un contrôle d'accès plus faible"
              p2: "Copies jamais supprimées après les tests"
            a.8.34:
              q1: "Comment planifiez-vous et approuvez-vous les audits ou tests qui touchent les systèmes en production ?"
              q2: "Quand des auditeurs ou des pentesteurs testent des systèmes en production, comment planifiez-vous et contrôlez-vous cet accès ?"
              r1: "Règles d'engagement ou autorisation du dernier test d'intrusion ou audit technique"
              r2: "Preuve de la suppression des comptes temporaires des auditeurs ou testeurs"
              p1: "Test d'intrusion mené sans périmètre écrit ni calendrier convenu avec l'exploitation"
              p2: "Comptes des testeurs encore actifs des mois plus tard"
              p3: "Testeurs dotés d'accès en écriture ou d'administration aux systèmes en production alors qu'une lecture seule suffisait, ou tests perturbants menés pendant les heures ouvrées"
          sessions:
            opening:
              label: "Réunion d'ouverture"
              r1: "Ce qui a changé depuis l'étape 1 : domaine d'application, organisation, sites, systèmes, fournisseurs clés"
              r2: "Chaque constat de l'étape 1, avec l'action menée et sa preuve"
              r3: "Déclaration d'applicabilité en vigueur, datée, avec la justification de chaque exclusion"
              r4: "Un interlocuteur désigné, joignable pendant tout l'audit, communiqué avec les documents avant le premier jour"
              r5: "Réclamations portant sur le périmètre certifié et leur traitement ; usage de la marque de certification une fois certifié"
              r6: "Avancement des mesures que la Déclaration d'applicabilité présentait comme prévues ou en cours à l'étape 1"
              p1: "Documents pas prêts à la réunion d'ouverture, ou transmis par un canal non sécurisé"
              p2: "Un système du périmètre qui n'est pas dans son état de production le jour de l'audit peut être sorti du périmètre"
              p3: "Ce qui n'était que déclaré à l'étape 1 doit désormais être prouvé par un enregistrement : signatures, résultats de tests, journaux"
