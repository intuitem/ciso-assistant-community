    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p11
      name: § 11 - Řízení změn
      depth: 2
      ref_id: ZOKB-P11
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba při řízení změn u aktiv \na) stanoví pravidla,\
        \ postupy a kritéria pro určení významných změn,\nb) určí změny, které mají\
        \ nebo mohou mít vliv na kybernetickou bezpečnost, \nc) určuje u změn určených\
        \ podle písmene b) významné změny v souladu se stanovenými pravidly, postupy\
        \ a kritérii pro určení významných změn podle písmene a).\n(2) Povinná osoba\
        \ u významných změn\na) dokumentuje jejich řízení,\nb) řídí rizika spojená\
        \ s významnými změnami,\nc) přijímá bezpečnostní opatření za účelem snížení\
        \ všech nepříznivých dopadů spojených s významnými změnami,\nd) aktualizuje\
        \ bezpečnostní a provozní dokumentaci,\ne) zajistí jejich testování před uvedením\
        \ do provozu a\nf) zajistí možnost navrácení do původního stavu.\n(3) Povinná\
        \ osoba na základě výsledků řízení rizik podle odstavce 2 písm. b) rozhoduje\
        \ o provedení penetračního testování; pokud rozhodne o provedení penetračního\
        \ testování, postupuje podle § 24 odst. 5 k této vyhlášce."
