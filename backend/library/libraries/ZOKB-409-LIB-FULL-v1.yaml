    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16
      name: § 16 - Provádění auditu kybernetické bezpečnosti
      depth: 2
      ref_id: ZOKB-P16
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba stanoví plán provádění auditu kybernetické bezpečnosti.\n\
        (2) Povinná osoba při auditu kybernetické bezpečnosti\na) posuzuje, zda byla\
        \ zavedena bezpečnostní opatření požadovaná zákonem a touto vyhláškou,\nb)\
        \ posuzuje soulad zavedených bezpečnostních opatření s právními předpisy,\
        \ vnitřními předpisy, smluvními závazky a nejlepší praxí a\nc) provádí a dokumentuje\
        \ audit dodržování pravidel a postupů stanovených v bezpečnostní politice,\
        \ včetně přezkoumání technické shody a dříve stanovených nápravných opatření\
        \ podle odstavce 3 písm. c).\n(3) Povinná osoba \na) zohlední výsledky auditu\
        \ kybernetické bezpečnosti podle odstavce 2\n1. v plánu rozvoje bezpečnostního\
        \ povědomí,\n2. v rámci řízení rizik a\nb) stanoví na základě výsledku auditu\
        \ kybernetické bezpečnosti podle odstavce 2 případná nápravná opatření.\n\
        (4) Audit kybernetické bezpečnosti podle odstavce 2 je prováděn\na) při významných\
        \ změnách, a to v rámci jejich rozsahu,\nb) v pravidelných intervalech alespoň\
        \ jednou za 2 roky a\nc) v souladu s plánem auditu kybernetické bezpečnosti.\n\
        (5) Není-li v odůvodněných případech možné provést audit v intervalu podle\
        \ odstavce 5 písm. b) v celém rozsahu podle odstavce 2, je možné audit kybernetické\
        \ bezpečnosti provádět průběžně po systematických celcích. V takovém případě\
        \ je nutno audit v celém rozsahu podle odstavce 2 provést nejpozději do 5\
        \ let.\n(6) Audit kybernetické bezpečnosti musí být prováděn osobou vyhovující\
        \ podmínkám stanoveným v § 5 odst. 4, která nezávisle hodnotí správnost a\
        \ účinnost zavedených bezpečnostních opatření."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16-q1
      name: Je prováděn audit KB v pravidelných intervalech dle Vyhlášky 409/2025
        Sb.?
      depth: 3
      ref_id: ZOKB-P16-Q1
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16
      description: 'Audit dodržování pravidel KB se provádí v pravidelných intervalech
        alespoň jednou za 2 roky a při významných změnách. Co doložit při kontrole:
        Zprávy z interních nebo nezávislých externích auditů kybernetické bezpečnosti.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16-q2
