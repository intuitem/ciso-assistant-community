    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p22
      name: § 22 - Zaznamenávání událostí
      depth: 2
      ref_id: ZOKB-P22
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba na základě hodnocení aktiv a svých bezpečnostních\
        \ potřeb \na) určí technická aktiva, u kterých je zaznamenávání bezpečnostních\
        \ a relevantních provozních událostí prováděno a\nb) aktualizuje rozsah technických\
        \ aktiv podle odstavce 1 písm. a) v pravidelných intervalech a při významných\
        \ změnách.\n(2) Povinná osoba zaznamenává bezpečnostní a relevantní provozní\
        \ události \na) detekované podle § 21,\nb) v rámci komunikační sítě,\nc) na\
        \ síťovém perimetru a\nd) technických aktiv určených podle odstavce 1 písm.\
        \ a).\n(3) Povinná osoba v rámci zaznamenávání událostí podle odstavce 2,\
        \ zaznamenává \na) přihlašování a odhlašování ke všem účtům, a to včetně neúspěšných\
        \ pokusů,\nb) provedení a neúspěšné pokusy o provedení privilegované činnosti,\n\
        c) manipulace a neúspěšné pokusy o manipulaci s účty, oprávněními a právy,\n\
        d) neprovedení činností v důsledku nedostatku přístupových práv nebo oprávnění,\n\
        e) zahájení a ukončení činností technických aktiv,\nf) kritická a chybová\
        \ hlášení technických aktiv,\ng) přístupy a neúspěšné pokusy o přístupy k\
        \ záznamům událostí,\nh) manipulace a neúspěšné pokusy o manipulaci se záznamy\
        \ událostí,\ni) změny a neúspěšné pokusy o změny nastavení nástrojů pro zaznamenávání\
        \ událostí a\nj) další činnosti uživatelů, které mohou mít vliv na bezpečnost\
        \ regulované služby.\n(4) Povinná osoba v rámci zaznamenávání událostí podle\
        \ odstavce 2 zaznamenává následující informace o události\na) datum a čas\
        \ včetně specifikace časového pásma,\nb) typ činnosti,\nc) jednoznačnou identifikaci\
        \ technického aktiva, které činnost zaznamenalo, a to i v případě, kdy v komunikační\
        \ síti dochází ke změně této síťové identifikace,\nd) jednoznačnou identifikaci\
        \ účtu, pod kterým byla činnost provedena, a to i v případě, kdy v komunikační\
        \ síti dochází ke změně této síťové identifikace,\ne) jednoznačnou identifikaci\
        \ zařízení původce, a to i v případě, kdy v komunikační síti dochází ke změně\
        \ této síťové identifikace a\nf) úspěšnost nebo neúspěšnost činnosti.\n(5)\
        \ Povinná osoba dále s ohledem na události zaznamenané podle odstavce 2\n\
        a) zajistí důvěrnost a integritu získaných informací, včetně ochrany před\
        \ neoprávněným čtením a jakoukoliv změnou,\nb) používá s ohledem na vazby\
        \ mezi aktivy centralizovaný nástroj pro sběr a uchovávání záznamů těchto\
        \ událostí a\nc) uchovává záznamy těchto událostí alespoň po dobu 18 měsíců.\n\
        (6) Povinná osoba zajišťuje nepřetržitou synchronizaci jednotného času technických\
        \ aktiv."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p22-q1
