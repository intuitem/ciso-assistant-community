      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p5
      name: § 5 - Stanovení bezpečnostních rolí
      depth: 2
      ref_id: ZOKB-P5
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: '(1) Manažer kybernetické bezpečnosti

        a) je bezpečnostní role odpovědná za systém řízení bezpečnosti informací,
        přičemž výkonem této role může být pověřena osoba, která je pro tuto činnost
        vyškolena a prokáže odbornou způsobilost praxí s řízením kybernetické bezpečnosti
        nebo s řízením bezpečnosti informací

        1. po dobu alespoň tří let, nebo

        2. po dobu jednoho roku, pokud absolvovala studium na vysoké škole,

        b) odpovídá za pravidelné informování vrcholného vedení o

        1. činnostech vyplývajících z rozsahu jeho odpovědnosti a

        2. stavu systému řízení bezpečnosti informací,

        c) nesmí být pověřen výkonem rolí odpovědných za provoz technických aktiv
        regulované služby.

        (2) Architekt kybernetické bezpečnosti je bezpečnostní role odpovědná za zajištění
        návrhu implementace bezpečnostních opatření tak, aby byla zajištěna bezpečná
        architektura regulované služby, přičemž výkonem této role může být pověřena
        osoba, která je pro tuto činnost vyškolena a prokáže odbornou způsobilost
        praxí s navrhováním implementace bezpečnostních opatření a zajišťováním bezpečné
        architektury v délce

        a) alespoň tří let nebo

        b) jednoho roku, pokud absolvovala studium na vysoké škole.

        (3) Garant aktiva je bezpečnostní role odpovědná za zajištění rozvoje, použití
        a bezpečnost aktiva.

        (4) Auditor kybernetické bezpečnosti

        a) je bezpečnostní role odpovědná za provádění auditu kybernetické bezpečnosti,
        přičemž výkonem této role může být pověřena osoba, která je pro tuto činnost
        vyškolena a prokáže odbornou způsobilost praxí s prováděním auditů kybernetické
        bezpečnosti nebo auditů systému řízení bezpečnosti informací v délce

        1. alespoň tří let nebo

        2. jednoho roku, pokud absolvovala studium na vysoké škole,

        b) zaručuje, že provedení auditu kybernetické bezpečnosti je nestranné a

        c) nesmí být pověřen výkonem jiných bezpečnostních rolí.

        (5) Povinná osoba při určování osob zastávajících bezpečnostní role přihlédne
        k doporučením uvedeným v příloze č. 5 k této vyhlášce.'
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p5-q1
