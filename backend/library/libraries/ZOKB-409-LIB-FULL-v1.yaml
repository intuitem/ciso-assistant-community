        silnou autentizaci a šifrování pro externí přístup.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p18-q5
      name: Dochází k aktivní blokaci nežádoucí komunikace? (např. zakázané adresní
        rozsahy, filtrace URL, IPS)
      depth: 3
