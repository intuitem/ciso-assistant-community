    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p23
      name: § 23 - Vyhodnocování kybernetických bezpečnostních událostí
      depth: 2
      ref_id: ZOKB-P23
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: '(1) Povinná osoba používá nástroj pro nepřetržité vyhodnocování
        kybernetických bezpečnostních událostí detekovaných podle § 21, který zajišťuje

        a) sběr, vyhledávání a seskupování souvisejících záznamů za účelem detekce
        kybernetických bezpečnostních událostí,

        b) nepřetržité poskytování informací o detekovaných kybernetických bezpečnostních
        událostech, včasné varování vybraných bezpečnostních rolí a dalších relevantních
        osob a

        c) vyhodnocování kybernetických bezpečnostních událostí s cílem identifikace
        kybernetických bezpečnostních incidentů.

        (2) Povinná osoba při používání nástroje pro nepřetržité vyhodnocování kybernetických
        bezpečnostních událostí v souladu s odstavcem 1 zajistí

        a) omezení případů nesprávného nebo nežádoucího vyhodnocování kybernetických
        bezpečnostních událostí,

        b) pravidelnou aktualizaci nastavení nástroje včetně jeho pravidel pro detekci
        a vyhodnocování kybernetických bezpečnostních událostí a

        c) pravidelnou aktualizaci pravidel pro nepřetržité poskytování informací
        o detekovaných kybernetických bezpečnostních událostech včetně včasného varování
        vybraných bezpečnostních rolí a dalších relevantních osob.

        (3) Povinná osoba zajistí využívání informací získaných nástrojem pro vyhodnocení
        kybernetických bezpečnostních událostí pro optimální nastavení systému řízení
        bezpečnosti informací regulované služby.'
