    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19
      name: § 19 - Správa a ověřování identit
      depth: 2
      ref_id: ZOKB-P19
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba používá nástroj pro správu a ověření identity\
        \ administrátorů, uživatelů a technických aktiv, který zajišťuje\na) ověření\
        \ identity před zahájením jejich aktivit,\nb) řízení počtu možných neúspěšných\
        \ pokusů o přihlášení,\nc) odolnost uložených a přenášených autentizačních\
        \ údajů vůči hrozbám a zranitelnostem, které by mohly narušit jejich důvěrnost\
        \ nebo integritu,\nd) opětovné ověření identity po stanovené době nečinnosti,\n\
        e) dodržení důvěrnosti při vytváření výchozích autentizačních údajů a při\
        \ obnově přístupu a\nf) centralizovanou správu identit s ohledem na vazby\
        \ mezi aktivy.\n(2) Povinná osoba při ověření identity administrátorů, uživatelů\
        \ a technických aktiv\na) využívá autentizační mechanismus, který je založený\
        \ na vícefaktorové autentizaci s alespoň dvěma různými typy faktorů, nebo\
        \ využívá autentizační mechanismus, který je založený na aktuálně odolné kontinuální\
        \ autentizaci založené na modelu nulové důvěry a\nb) do doby splnění požadavků\
        \ podle odstavce 2 písm. a), využívá autentizaci pomocí kryptografických klíčů\
        \ nebo certifikátů.\n(3) Povinná osoba do doby splnění požadavků podle odstavce\
        \ 2 písm. a) vede evidenci technických aktiv, účtů a autentizačních mechanismů,\
        \ které tyto požadavky nesplňují, a to včetně odůvodnění.\n(4) Povinná osoba\
        \ do doby splnění požadavku podle odstavce 2 využívá nástroj založený na autentizaci\
        \ pomocí identifikátoru účtu a hesla, kdy tento nástroj musí vynucovat pravidlo\n\
        a) délky hesla alespoň\n1. 12 znaků pro účty uživatelů,\n2. 17 znaků pro účty\
        \ administrátorů,\n3. 22 znaků pro účty technických aktiv, \nb) umožňující\
        \ zadat heslo o délce alespoň 64 znaků,\nc) neomezující použití malých a velkých\
        \ písmen, číslic a speciálních znaků,\nd) umožňující uživatelům a administrátorům\
        \ změnu hesla, přičemž období mezi dvěma změnami hesla nesmí být kratší než\
        \ 30 minut,\ne) povinné změny hesla v intervalu alespoň jednou za 18 měsíců\
        \ a\nf) neumožňující uživatelům a administrátorům\n1. zvolit si jednoduchá\
        \ a často používaná hesla,\n2. tvořit hesla na základě mnohonásobně opakujících\
        \ se znaků, přihlašovacího jména, adresy elektronické pošty, názvu systému\
        \ nebo obdobným způsobem a\n3. opětovné použití dříve používaných hesel s\
        \ pamětí alespoň 12 předchozích hesel.\n(5) Povinná osoba v souladu s odstavcem\
        \ 4 zajistí\na) bezodkladné vynucení změny výchozího hesla uživatelů a administrátorů\
        \ po prvním přihlášení,\nb) bezodkladné vynucení změny výchozího hesla technického\
        \ aktiva,\nc) vytváření hesla účtu technického aktiva složeného z náhodného\
        \ řetězce malých a velkých písmen, číslic a speciálních znaků,\nd) bezodkladné\
        \ vynucení změny přístupového hesla v případě důvodného podezření na jeho\
        \ kompromitaci,\ne) vytvoření náhodného výchozího hesla nebo identifikátoru\
        \ sloužícího k vytvoření nebo k obnovení přístupu a zajistí jeho důvěrnost\
        \ a\nf) bezodkladné zneplatnění hesla nebo identifikátoru sloužícího k vytvoření\
        \ nebo k obnovení přístupu po jeho prvním použití nebo uplynutí nejvýše 24\
        \ hodin od jeho vytvoření.\n(6) Povinná osoba u administrátorského účtu zejména\
        \ určeného pro případ obnovy po kybernetickém bezpečnostním incidentu, musí\
        \ vynucovat následující pravidla\na) musí být vynucena bezodkladná změna výchozího\
        \ hesla,\nb) heslo musí být vytvořeno náhodným řetězcem složeným z malých\
        \ a velkých písmen, číslic a speciálních znaků,\nc) délka hesla musí být alespoň\
        \ 22 znaků,\nd) heslo musí být bezpečně uloženo,\ne) s účtem a jeho heslem\
        \ mohou manipulovat pouze pověřené osoby, a to v nezbytně nutných případech,\n\
        f) musí být vynucena změna hesla po jeho použití, při jakékoli změně odpovědných\
        \ osob, v případě důvodného podezření na jeho kompromitaci nebo v intervalu\
        \ alespoň jednou za 18 měsíců a\ng) musí být evidovány manipulace a pokusy\
        \ o manipulaci s tímto účtem a jeho heslem."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19-q1
      name: Je implementován nástroj pro ověření identity uživatele, který současně
        zajišťuje ověření identity, řízení počtu neúspěšných pokusů o přihlášení,
        centralizovanou správu identit ...
      depth: 3
