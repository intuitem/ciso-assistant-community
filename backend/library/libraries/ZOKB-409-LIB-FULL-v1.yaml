    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p10
      name: § 10 - Bezpečnost lidských zdrojů
      depth: 2
      ref_id: ZOKB-P10
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba v rámci bezpečnosti lidských zdrojů s ohledem\
        \ na stav a potřeby systému řízení bezpečnosti informací stanoví plán rozvoje\
        \ bezpečnostního povědomí, jehož cílem je zajistit odpovídající vzdělávání\
        \ a zlepšování bezpečnostního povědomí včetně formy, obsahu a rozsahu poučení\
        \ a školení podle odstavce 2.\n(2) Povinná osoba zahrne do plánu rozvoje bezpečnostního\
        \ povědomí\na) poučení vrcholného vedení o jeho povinnostech a bezpečnostní\
        \ politice, zejména v oblastech systému řízení bezpečnosti informací a řízení\
        \ rizik,\nb) poučení uživatelů, administrátorů a osob zastávajících bezpečnostní\
        \ role o jejich povinnostech a o bezpečnostní politice,\nc) potřebná teoretická\
        \ i praktická školení uživatelů, administrátorů a osob zastávajících bezpečnostní\
        \ role,\nd) pravidla tvorby bezpečných hesel v souladu s § 19 a\ne) relevantní\
        \ témata uvedená v příloze č. 7 k této vyhlášce.\n(3) Povinná osoba v rámci\
        \ bezpečnosti lidských zdrojů \na) v souladu s plánem rozvoje bezpečnostního\
        \ povědomí zajistí\n1. poučení vrcholného vedení o jeho povinnostech, o bezpečnostní\
        \ politice zejména v oblasti systému řízení bezpečnosti informací, řízení\
        \ rizik a řízení kontinuity činností formou vstupních a pravidelných školení\
        \ k získání znalostí a dovedností vedoucích k určování rizik a posouzení vhodnosti\
        \ zvolených postupů při řízení rizik a jejich dopadů na regulovanou službu.\
        \ \n2. poučení uživatelů, administrátorů a osob zastávajících bezpečnostní\
        \ role o jejich povinnostech a o bezpečnostní politice formou vstupních a\
        \ pravidelných školení,\n3. pravidelná odborná školení osobám zastávajícím\
        \ bezpečnostní role, přičemž vychází z aktuálních potřeb povinné osoby v oblasti\
        \ kybernetické bezpečnosti,\n4. pravidelná školení a ověřování bezpečnostního\
        \ povědomí zaměstnanců v souladu s jejich pracovní náplní,\nb) určí osoby\
        \ odpovědné za realizaci jednotlivých činností, které jsou v plánu rozvoje\
        \ bezpečnostního povědomí uvedeny,\nc) hodnotí účinnost plánu rozvoje bezpečnostního\
        \ povědomí, provedených poučení, školení a dalších činností spojených se zlepšováním\
        \ bezpečnostního povědomí,\nd) zajistí kontrolu dodržování bezpečnostní politiky\
        \ ze strany uživatelů, administrátorů a osob zastávajících bezpečnostní role,\n\
        e) určí pravidla a postupy pro řešení případů porušení stanovených bezpečnostních\
        \ pravidel ze strany uživatelů, administrátorů a osob zastávajících bezpečnostní\
        \ role a\nf) zajistí plynulost výkonu činností v případě ukončení nebo změny\
        \ smluvního vztahu s administrátory a osobami zastávajícími bezpečnostní role.\n\
        (4) Povinná osoba vede o poučení a školení podle odstavce 3 přehledy, které\
        \ obsahují předmět poučení a školení včetně seznamu osob, které poučení a\
        \ školení absolvovaly."
