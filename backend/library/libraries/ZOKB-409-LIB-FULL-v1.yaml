    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p8
      name: § 8 - Řízení rizik
      depth: 2
      ref_id: ZOKB-P8
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba při řízení rizik v návaznosti na § 7\na) stanoví\
        \ metodiku pro určování a hodnocení rizik, včetně stanovení kritérií pro akceptovatelnost\
        \ rizik,\nb) při určování rizik s ohledem na aktiva určuje relevantní hrozby\
        \ a zranitelnosti; přitom zvažuje zejména kategorie hrozeb a zranitelností\
        \ uvedených v příloze č. 4 k této vyhlášce,\nc) provádí hodnocení rizik v\
        \ pravidelných intervalech alespoň jednou ročně a při významných změnách určených\
        \ podle § 11 odst. 1 písm. c), zohlední při hodnocení rizik \n1. relevantní\
        \ hrozby a zranitelnosti podle písmene b) a posoudí možné dopady na aktiva,\
        \ přičemž vychází z hodnocení aktiv podle § 7,\n2. významné změny,\n3. změny\
        \ stanoveného rozsahu podle § 11 zákona,\n4. protiopatření podle § 19 zákona,\n\
        5. kybernetické bezpečnostní incidenty, včetně dříve řešených,\n6. výsledky\
        \ auditů kybernetické bezpečnosti a kontrol v oblasti kybernetické bezpečnosti,\n\
        7. výsledky penetračního testování a skenování zranitelností a\n8. výsledky\
        \ vyhodnocení účinnosti systému řízení bezpečnosti informací,\nd) při hodnocení\
        \ rizik postupuje alespoň v rozsahu přílohy č. 2 k této vyhlášce,\ne) na základě\
        \ provedeného hodnocení rizik podle písmene c) zpracuje zprávu o hodnocení\
        \ rizik,\nf) zpracuje na základě bezpečnostních potřeb a výsledků hodnocení\
        \ rizik prohlášení o aplikovatelnosti, které obsahuje přehled všech bezpečnostních\
        \ opatření požadovaných touto vyhláškou, která\n1. nebyla aplikována, včetně\
        \ odůvodnění a uvedení případných přijatých náhradních bezpečnostních opatření\
        \ a\n2. byla aplikována, včetně způsobu plnění,\ng) na základě provedeného\
        \ hodnocení rizik podle písmene c) a v souladu se stanovenými kritérii pro\
        \ akceptovatelnost rizik zpracuje plán zvládání rizik, který obsahuje \n1.\
        \ popis bezpečnostních opatření pro zvládání rizik,\n2. cíle a přínosy bezpečnostních\
        \ opatření pro zvládání rizik, \n3. určení osoby zajišťující zavedení bezpečnostních\
        \ opatření pro zvládání rizik,\n4. předpokládané lidské, finanční a technické\
        \ zdroje pro zavedení bezpečnostních opatření,\n5. požadovaný termín zavedení\
        \ bezpečnostních opatření, \n6. popis vazeb mezi riziky a příslušnými bezpečnostními\
        \ opatřeními a \n7. konkrétní způsob realizace bezpečnostních opatření.\n\
        (2) Povinná osoba v souladu s plánem zvládání rizik zavádí bezpečnostní opatření.\n\
        (3) Hodnocení rizik může být zajištěno i jinými způsoby, než jak je stanoveno\
        \ v odstavci 1 písm. c), pokud povinná osoba zajistí stejnou nebo vyšší úroveň\
        \ procesu hodnocení rizik a postupuje v souladu s odst. 5 přílohy č. 2 k této\
        \ vyhlášce.\n(4) Povinná osoba může vyloučit zavádění a provádění bezpečnostních\
        \ opatření stanovených touto vyhláškou pouze na základě řízení rizik."
