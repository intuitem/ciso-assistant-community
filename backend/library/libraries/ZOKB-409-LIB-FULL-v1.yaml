    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p25
      name: § 25 - Kryptografické algoritmy
      depth: 2
      ref_id: ZOKB-P25
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba při zajištění bezpečnosti technických aktiv\
        \ a jejich komunikace \na) používá pouze aktuálně odolné kryptografické algoritmy,\n\
        b) prosazuje bezpečné nakládání s kryptografickými algoritmy a\nc) zohledňuje\
        \ doporučení a metodiky v oblasti kryptografických algoritmů vydané Národním\
        \ úřadem pro kybernetickou a informační bezpečnost.\n(2) Povinná osoba zajišťuje\
        \ bezpečnou\na) hlasovou, audiovizuální a textovou komunikaci, a to včetně\
        \ elektronické komunikace, a\nb) nouzovou komunikaci v rámci organizace.\n\
        (3) Povinná osoba v případě využívání kryptografických klíčů a certifikátů\
        \ pro ochranu technických aktiv a komunikační sítě používá \na) pouze aktuálně\
        \ odolné kryptografické klíče a certifikáty a \nb) nástroj pro správu kryptografických\
        \ klíčů a certifikátů, který\n1. zajistí generování, distribuci, ukládání,\
        \ změny, omezení platnosti, zneplatnění certifikátů a řádnou likvidaci kryptografických\
        \ klíčů,\n2. umožní kontrolu a audit a\n3. zajistí důvěrnost a integritu kryptografických\
        \ klíčů."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p25-q1
      name: Je vytvořena politika bezpečného používání kryptografické ochrany?
      depth: 3
      ref_id: ZOKB-P25-Q1
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p25
      description: 'Používají se nástroje k zajištění bezpečnosti pomocí šifer a zohledňují
        se doporučení NÚKIB v oblasti algoritmů. Co doložit při kontrole: Směrnice
        pro používání kryptografie (Cryptography Policy).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p25-q2
      name: Jsou požívány aktuálně odolné kryptografické algoritmy i s ohledem na
        doporučení NÚKIB? Je prosazováno bezpečné nakládání s kryptografickými prostředky?
      depth: 3
      ref_id: ZOKB-P25-Q2
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p25
      description: 'Algoritmy (komunikační kanály a uložení dat) odpovídají aktuální
        odolnosti, prolamované či slabé šifry jsou zakázány. Co doložit při kontrole:
        Audit konfigurace TLS (pouze v1.2/1.3), skeny síťových služeb vykazující odstranění
        slabých šifer (např. DES/RC4).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p25-q3
      name: Máte pravidla pro bezpečné nakládání s kryptografickými klíči pokrývající
        celý jejich životní cyklus (od generování po likvidaci)?
      depth: 3
      ref_id: ZOKB-P25-Q3
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p25
      description: 'Nástroj pro správu klíčů zabezpečuje jejich generování, rotace
        a zneplatnění. Jsou udržovány v důvěrnosti a integritě. Co doložit při kontrole:
        PKI infrastruktura (certifikační autorita / Key Vault), pravidla rotace certifikátů,
        plány pro případ úniku privátního klíče.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      name: § 26 - Zajišťování dostupnosti regulované služby
      depth: 2
      ref_id: ZOKB-P26
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba zavede bezpečnostní opatření pro zajišťování\
        \ dostupnosti regulované služby, kterými zajistí\na) dostupnost regulované\
        \ služby podle cílů stanovených podle § 15,\nb) odolnost regulované služby\
        \ vůči hrozbám a zranitelnostem, které by mohly snížit její dostupnost a\n\
        c) redundanci aktiv nezbytných pro zajišťování dostupnosti regulované služby.\n\
        (2) Povinná osoba pro zajišťování dostupnosti regulované služby v souladu\
        \ s odstavcem 1 vytváří pravidelné zálohy konfigurací a nastavení technických\
        \ aktiv, informací a dat nezbytných zejména pro účely obnovy regulované služby\
        \ v případě kybernetického bezpečnostního incidentu.\n(3) Povinná osoba u\
        \ záloh vytvářených podle odstavce 2 zajistí\na) pravidelné testování jejich\
        \ integrity, dostupnosti a obnovitelnosti,\nb) dokumentování výsledků testů\
        \ provedených podle odstavce 3 písm. a),\nc) ochranu ukládaných záloh a dat\
        \ v nich obsažených před narušením jejich integrity a důvěrnosti, a to zejména\
        \ šifrováním těchto záloh v souladu s § 25 a\nd) ochranu ukládaných záloh\
        \ a dat v nich obsažených před narušením jejich dostupnosti.\n(4) Povinná\
        \ osoba pro zajišťování dostupnosti regulované služby zajistí bezpečnou správu\
        \ konfigurací a nastavení technických aktiv s ohledem na hodnocení těchto\
        \ aktiv a hodnocení rizik. \n(5) Povinná osoba za účelem omezení šíření kybernetického\
        \ bezpečnostního incidentu a snížení jeho dopadu odděluje zálohovací prostředí\
        \ od jiných prostředí podle § 18 písm. a)."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26-q1
      name: Je nasazena ochrana proti DDoS útokům?
      depth: 3
      ref_id: ZOKB-P26-Q1
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      description: 'Zajišťuje se dostupnost služby před hrozbami typu odepření služby
        (Distributed Denial of Service). Co doložit při kontrole: Smluvní ujednání
        s ISP s definovanou scrubbing službou (Anti-DDoS zóna), nebo řešení typu WAF
        na perimetru.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26-q2
      name: Je konektivita do internetu zajištěna od 2 různých poskytovatelů?
      depth: 3
      ref_id: ZOKB-P26-Q2
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      description: 'Součástí redundance aktiv nezbytných pro zajišťování dostupnosti
        služby (High Availability). Co doložit při kontrole: Uzavřené nezávislé smlouvy
        a implementace BGP / Failover routingu pro diverzitu spojení.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26-q3
      name: Jsou k dispozici 2 nezávislé přívody elektrické energie?
      depth: 3
      ref_id: ZOKB-P26-Q3
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      description: 'Redundance fyzické vrstvy (napájení) klíčových uzlů serveroven.
        Co doložit při kontrole: Architektura zapojení racků v Datacentru (A-feed,
        B-feed rozvody).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26-q4
      name: Je k dispozici alternativní zdroj napájení?
      depth: 3
      ref_id: ZOKB-P26-Q4
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      description: 'Bezpečnostní opatření pro zmírnění dopadů rozsáhlých výpadků infrastruktury
        napájení. Co doložit při kontrole: UPS moduly překrývající čas nutný k nastartování
        motorgenerátoru, platné revize agregátu.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26-q5
      name: Je nainstalována přepěťová ochrana?
      depth: 3
      ref_id: ZOKB-P26-Q5
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      description: 'Součást odolnosti zařízení zajišťujících dostupnost regulované
        služby proti vnějším poškozením přepětím sítě. Co doložit při kontrole: Revize
        elektrických prvků včetně bleskojistek a lokálních přepěťových ochran.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26-q6
      name: Je zajištěna redundance důležitých aktiv?
      depth: 3
      ref_id: ZOKB-P26-Q6
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      description: 'Stěžejní infrastruktura je zrcadlena za účelem dosažení cílových
        RTO/RPO bezprostředním failoverem při poruše aktiva. Co doložit při kontrole:
        Architektonický plán prokazující existenci vysoké dostupnosti (např. Hypervisor
        clustery, load balancery, zrcadlená datová pole).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26-q7
      name: Je zálohovací prostředí striktně logicky či fyzicky odděleno od primární
        infrastruktury pro ochranu před kompromitací (ransomware)?
      depth: 3
      ref_id: ZOKB-P26-Q7
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p26
      description: 'Odolnost záloh proti narušení je podmíněna silnou izolací a případným
        šifrováním dat. Co doložit při kontrole: Topologie zálohovací sítě (oddělené
        segmenty) nebo immutable (neměnné) úložiště či pravidlo Air-Gap/3-2-1.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27
      name: § 27 - Zabezpečení průmyslových, řídicích a obdobných specifických technických
        aktiv
      depth: 2
      ref_id: ZOKB-P27
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "Povinná osoba včetně požadavků uvedených v § 1 až 27 pro zajištění\
        \ kybernetické bezpečnosti průmyslových, řídicích a obdobných specifických\
        \ technických aktiv dále využívá nástroje a zavádí bezpečnostní opatření,\
        \ která zajistí\na) omezení fyzického přístupu k průmyslovým, řídicím a obdobným\
        \ specifickým technickým aktivům, \nb) omezení oprávnění k přístupu k průmyslovým,\
        \ řídicím a obdobným specifickým technickým aktivům,\nc) segmentaci komunikačních\
        \ sítí průmyslových, řídicích a obdobných specifických technických aktiv od\
        \ jiných prostředí a segmentaci těchto komunikačních sítí podle § 18,\nd)\
        \ omezení vzdálených přístupů a vzdálené správy průmyslových, řídicích a obdobných\
        \ specifických technických aktiv,\ne) ochranu jednotlivých průmyslových, řídicích\
        \ a obdobných specifických technických aktiv před využitím známých zranitelností\
        \ a hrozeb a\nf) dostupnost a obnovu průmyslových, řídicích a obdobných specifických\
        \ technických aktiv pro zajištění dostupnosti regulované služby."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27-q1
      name: Jsou bezpečnostní pravidla a opatření aplikována i na průmyslová a specifická
        zařízení pokud je v organizaci máte? (např. SCADA)
      depth: 3
      ref_id: ZOKB-P27-Q1
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27
      description: 'Omezení vzdálené správy, řízení práv, fyzického přístupu a segmentace
        průmyslových, řídicích a OT aktiv od běžného IT. Co doložit při kontrole:
        Oddělená struktura OT sítě (např. přes firewally v Purdue modelu), přehled
        ICS/SCADA aktiv podléhajících ochraně.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27-q2
      name: Je zajištěna fyzická ochrana průmyslových a řídicích zařízení (např. uzamčení
        rozvaděčů, monitorování přístupu)?
      depth: 3
      ref_id: ZOKB-P27-Q2
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27
      description: 'Podle § 27 písm. a) vyhlášky č. 409/2025 Sb. povinná osoba zajistí
        omezení fyzického přístupu k průmyslovým a řídicím aktivům. OT prostředí vyžaduje
        dodatečnou úroveň fyzické ochrany s ohledem na bezpečnost provozu (Safety)
        a riziko neoprávněné manipulace na místě. Co doložit při kontrole: Směrnice
        fyzické bezpečnosti specifikující ochranné zóny pro OT infrastrukturu, revize
        přístupových systémů (ACS) k výrobním/technologickým halám a důkazy o uzamykání
        technologických rozvaděčů (např. dedikovaný klíčový režim pro obsluhu).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27-q3
      name: Je zaveden a dodržován proces správy záplat a aktualizací pro průmyslové
        a řídicí systémy, s ohledem na jejich specifické provozní požadavky a rizika?
      depth: 3
      ref_id: ZOKB-P27-Q3
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27
      description: 'Podle § 27 písm. e) vyhlášky č. 409/2025 Sb. zajistí povinná osoba
        ochranu OT aktiv před využitím známých zranitelností a hrozeb. Vzhledem ke
        specifikům ICS/SCADA (riziko výpadku výroby, nepodporované OS u starších strojů)
        musí být zaveden řízený proces patch managementu nebo doložena kompenzační
        opatření. Co doložit při kontrole: Plán údržby a aktualizací OT systémů schválený
        garanty aktiv, záznamy z instalace záplat v definovaných servisních oknech
        nebo formální zdůvodnění a dokumentace kompenzačních opatření (např. Virtual
        Patching nasazený na IPS) pro starší systémy (např. Windows XP/7).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27-q4
      name: Je zajištěna síťová segmentace mezi IT a OT prostředími a jsou aplikována
        specifická bezpečnostní pravidla pro komunikaci mezi nimi?
      depth: 3
      ref_id: ZOKB-P27-Q4
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p27
      description: 'Podle § 27 písm. c) a d) vyhlášky č. 409/2025 Sb. povinná osoba
        zajistí segmentaci komunikačních sítí OT od jiných prostředí (běžného IT)
        a striktně omezí vzdálenou správu. Propojení „napřímo“ do produkční OT sítě
        z kancelářské sítě nebo internetu je auditním selháním. Co doložit při kontrole:
        Detailní mapy topologie sítě prokazující oddělení IT a OT (architektura dle
        tzv. Purdue modelu, existence OT DMZ), pravidla firewallů (ACL) povolující
        pouze striktně nutný provoz a logy z řešení pro bezpečný přístup privilegovaných
        uživatelů (PAM/Jump servery) při vzdáleném servisu dodavateli.'
      implementation_groups:
      - ALL
    implementation_groups_definition:
    - name: Všechny sys
      ref_id: ALL
      description: Požadavek se vztahuje na systémy v rozsahu.
