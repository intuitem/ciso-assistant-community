      ref_id: ZOKB-P19-Q2
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19
      description: 'Uživatelé, a obzvláště administrátoři, se ověřují nástrojem založeným
        na vícefaktorové autentizaci (MFA / 2FA). Co doložit při kontrole: Screenshot
        nastavení vynucení MFA (např. aplikátory autentizátoru / HW tokeny) pro vybrané/všechny
        účty.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19-q3
      name: V případě, že není zavedena dvoufaktorová autentizace, používá nástroj
        pro ověření identity autentizaci pomocí kryptografických klíčů? Nebo jsou
        dodrženy minimální požadavky na ...
      depth: 3
      ref_id: ZOKB-P19-Q3
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19
      description: 'Pokud chybí 2FA/MFA, vynucují se přísná hesla (min. 12 znaků uživatelé,
        17 admin, 22 služby), nebo kryptografické klíče. Co doložit při kontrole:
        Export Password Policy GPO dokazující komplexitu, délku hesel a historii (min.
        12 posledních hesel zakázáno).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19-q4
      name: Jsou autentizační údaje přenášeny se zachováním důvěrnosti a ukládány
        ve formě odolné proti offline útokům? (šifrovaná komunikace, hash)
      depth: 3
      ref_id: ZOKB-P19-Q4
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19
      description: 'Autentizační údaje (hesla) musí být zašifrována pro přenos (TLS)
        a na uložení se musí využít aktuálně odolných jednocestných funkcí. Co doložit
        při kontrole: Analýza protokolů v síti (zakázání clear text protokolů jako
        Telnet/HTTP pro login), algoritmy hashování AD.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19-q5
      name: Je vynucena bezodkladná změna u prvotních, výchozích a obnovovacích hesel?
      depth: 3
      ref_id: ZOKB-P19-Q5
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19
      description: 'Nástroj vynucuje zneplatnění hesel vygenerovaných pro obnovu do
        24h a vynutí okamžitou změnu hesla při prvním přihlášení. Co doložit při kontrole:
        Důkazní ukázka testovacího založení uživatele s aktivní vlajkou ''Vyžadovat
        změnu hesla při prvním přihlášení''.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p20
      name: § 20 - Řízení přístupových práv a oprávnění
      depth: 2
      ref_id: ZOKB-P20
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: 'Zaveden proces centralizované kontroly přístupových práv subjektů
        k aktivům, omezující třetí strany jen na potřebný čas/rozsah. Co doložit při
        kontrole: Nastavení časově omezených VPN účtů nebo Privileged Access Management
        (PAM) logů z připojení dodavatele.'
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p20-q1
      name: Je nastaven proces bezpečného přístupu dodavatelů do vnitřní sítě? (VPN,
        segmentace, oprávnění apod.)
      depth: 3
      ref_id: ZOKB-P20-Q1
      assessable: true
