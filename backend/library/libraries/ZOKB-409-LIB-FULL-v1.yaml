      description: 'Vedení musí být prokazatelně seznámeno a aktivně podepisovat klíčové
        výstupy analýzy rizik (SoA, Plán zvládání rizik, BIA). Co doložit při kontrole:
        Podepsané verze analýzy rizik a plánu zvládání rizik statutárem, Zápisy z
        jednání Výboru KB.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p4-q5
