    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p9
      name: § 9 - Řízení dodavatelů
      depth: 2
      ref_id: ZOKB-P9
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: '(1) Povinná osoba při řízení dodavatelů

        a) stanoví pravidla pro dodavatele, která zohledňují požadavky systému řízení
        bezpečnosti informací,

        b) prokazatelně seznamuje své dodavatele s pravidly podle písmene a) a vyžaduje
        plnění těchto pravidel,

        c) řídí rizika spojená s dodavateli,

        d) identifikuje a eviduje své významné dodavatele ve smyslu § 2 písm. i),

        e) prokazatelně písemně informuje své významné dodavatele o jejich evidenci
        podle písmene d),

        f) zajistí v souvislosti s řízením rizik spojených s významnými dodavateli,
        aby smlouvy uzavírané s významnými dodavateli obsahovaly relevantní ustanovení
        uvedená v příloze č. 6 k této vyhlášce a

        g) pravidelně přezkoumává plnění smluv s významnými dodavateli z hlediska
        systému řízení bezpečnosti informací.

        (2) Povinná osoba u významných dodavatelů dále

        a) provádí v rámci výběrového řízení a před uzavřením smlouvy hodnocení rizik
        souvisejících s plněním přiměřeně podle přílohy č. 2 k této vyhlášce,

        b) stanoví v rámci uzavíraných smluvních vztahů způsoby a úrovně realizace
        bezpečnostních opatření a určí obsah vzájemné smluvní odpovědnosti za zavedení
        a kontrolu bezpečnostních opatření,

        c) provádí pravidelné hodnocení rizik a pravidelnou kontrolu zavedených bezpečnostních
        opatření u poskytovaných plnění pomocí vlastních zdrojů nebo pomocí třetí
        strany a

        d) zajistí v reakci na rizika a zjištěné nedostatky jejich řešení.

        (3) Náležitosti prokazatelného informování podle odstavce 1 písm. e) jsou

        a) identifikace povinné osoby, včetně uvedení, že povinná osoba je poskytovatelem
        regulované služby v režimu vyšších povinností,

        b) identifikace regulované služby,

        c) identifikace významného dodavatele a

        d) vyrozumění o skutečnosti, že dodavatel je pro povinnou osobu významným
        dodavatelem.'
