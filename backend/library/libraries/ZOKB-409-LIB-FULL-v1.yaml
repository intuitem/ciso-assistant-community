        4. pravidla pro označování aktiv,\n5. pravidla správy výměnných médií,\n6.\
        \ pravidla pro bezpečné elektronické sdílení a fyzické přenášení aktiv a\n\
        7. pravidla pro určení způsobu likvidace informací a dat a jejich kopií a\
        \ likvidace technických aktiv, která jsou nosiči informací a dat s ohledem\
        \ na úroveň aktiv v souladu s přílohou č. 3 k této vyhlášce."
