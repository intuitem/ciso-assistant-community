        \ pravidla a postupy stanovené v bezpečnostní politice a bezpečnostní dokumentaci\
        \ podle odstavce 1.\n(3) Povinná osoba pravidelně přezkoumává bezpečnostní\
        \ politiku a bezpečnostní dokumentaci, zajistí jejich aktuálnost a zohlednění\
        \ jejich relevantních oblastí v provozních pravidlech a postupech a další\
