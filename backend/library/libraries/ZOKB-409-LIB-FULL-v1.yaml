    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p24
      name: § 24 - Aplikační bezpečnost
      depth: 2
      ref_id: ZOKB-P24
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba pro zajištění bezpečnosti regulované služby\
        \ užívá technická aktiva, která jsou jejich výrobcem, dodavatelem nebo jinou\
        \ osobou podporována a zajistí aplikování schválených bezpečnostních aktualizací\
        \ vydaných pro tato aktiva.\n(2) Povinná osoba do doby plnění odstavce 1 zavede\
        \ bezpečnostní opatření, která zaručí obdobnou nebo vyšší úroveň bezpečnosti\
        \ těchto technických aktiv a eviduje technická aktiva\na) která již nejsou\
        \ výrobcem, dodavatelem nebo jinou osobou podporována a\nb) na která není\
        \ možné aplikovat poslední schválenou bezpečnostní aktualizaci.\n(3) Povinná\
        \ osoba v rámci aplikační bezpečnosti zajistí trvalou ochranu aplikací, informací,\
        \ transakcí a přenášených identifikátorů relací před\na) neoprávněnou činností\
        \ a\nb) popřením provedených činností.\n(4) Povinná osoba v rámci skenování\
        \ zranitelností technických aktiv\na) provádí pravidelné skenování zranitelností\
        \ technických aktiv regulované služby\n1. z vnitřní a vnější komunikační sítě\
        \ a\n2. alespoň jednou ročně.\nb) zohlední výsledky skenování zranitelností\
        \ technických aktiv v rámci řízení rizik podle § 8 a zavádí bezpečnostní opatření\
        \ na základě zjištěných výsledků.\n(5) Povinná osoba v rámci penetračního\
        \ testování\na) provádí penetrační testování technických aktiv s ohledem na\
        \ hodnocení těchto aktiv a hodnocení rizik\n1. z vnitřní a vnější komunikační\
        \ sítě,\n2. před jejich uvedením do provozu a\n3. v souvislosti s významnou\
        \ změnou podle § 11 odst. 3.\nb) zohlední výsledky penetračního testování\
        \ při řízení rizik podle § 8 a zavádí bezpečnostní opatření na základě zjištěných\
        \ výsledků. \nc) provádí v souladu s odstavcem 5 písm. a) bodem 1 pravidelně\
        \ penetrační testování, a to alespoň jednou za dva roky.\nd) v odůvodněných\
        \ případech, pokud nemůže provést penetrační testování v rozsahu nebo intervalu\
        \ stanoveném v odstavci 5 písm. c), může rozdělit toto penetrační testování\
        \ do systematických celků. V takovém případě je nutno provést penetrační testování\
        \ v rozsahu stanoveném v odstavci 5 písm. a) nejpozději do 5 let.\ne) u penetračních\
        \ testů v souladu s odstavcem 5 písm. a) eviduje termín provedení a konkrétní\
        \ fyzické osoby provádějící toto penetrační testování.\n(6) Povinná osoba\
        \ provede opětovné otestování nálezu zjištěného na základě provedeného skenování\
        \ zranitelností nebo penetračního testování za účelem ověření funkčnosti zavedených\
        \ bezpečnostních opatření."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p24-q1
      name: Jsou prováděny penetrační testy v pravidelných intervalech a před uvedením
