      description: 'Ověřování identity využívá centralizovaný nástroj řešící lock-out
        politiky, expiraci nečinnosti a centrální správu. Co doložit při kontrole:
        Konfigurace Active Directory (AD), Identity Management (IdM), logy o lock-out
        účtu (Brute Force ochrana).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p19-q2
