      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p18
      description: 'Nástroj, který zajistí ochranu integrity sítě a zablokuje detekovanou
        škodlivou komunikaci (aktivní zásah do provozu). Co doložit při kontrole:
        Nasazení Intrusion Prevention System (IPS) na firewallech nebo řešení Next-Gen
