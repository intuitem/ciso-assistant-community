    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3
      name: § 3 - Systém řízení bezpečnosti informací
      depth: 2
      ref_id: ZOKB-P3
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "Povinná osoba v rámci systému řízení bezpečnosti informací\na)\
        \ stanoví cíle systému řízení bezpečnosti informací směřující k zajištění\
        \ kybernetické bezpečnosti regulované služby,\nb) řídí rizika podle § 8,\n\
        c) zavede a provádí přiměřená bezpečnostní opatření směřující k zajištění\
        \ kybernetické bezpečnosti regulované služby na základě cílů systému řízení\
        \ bezpečnosti informací, bezpečnostních potřeb a řízení rizik,\nd) stanoví\
        \ a schválí bezpečnostní politiku a bezpečnostní dokumentaci ve vztahu k řízení\
        \ kybernetické bezpečnosti, která obsahuje hlavní zásady, cíle systému řízení\
        \ bezpečnosti informací, bezpečnostní potřeby, práva a povinnosti ve vztahu\
        \ k řízení bezpečnosti informací, a na základě bezpečnostních potřeb a výsledků\
        \ hodnocení rizik stanoví bezpečnostní politiku a bezpečnostní dokumentaci\
        \ v dalších oblastech podle § 6,\ne) zajistí provedení auditu kybernetické\
        \ bezpečnosti podle § 16,\nf) zajistí alespoň jednou ročně vyhodnocení účinnosti\
        \ systému řízení bezpečnosti informací, které obsahuje \n1. vyhodnocení cílů\
        \ systému řízení bezpečnosti informací směřujících k zajištění kybernetické\
        \ bezpečnosti regulované služby,\n2. posouzení naplňování plánu zvládání rizik\
        \ zpracovaného podle § 8 odst. 1 písm. h),\n3. hodnocení stavu systému řízení\
        \ bezpečnosti informací včetně revize hodnocení rizik,\n4. posouzení výsledků\
        \ provedených auditů kybernetické bezpečnosti a kontrol v oblasti kybernetické\
        \ bezpečnosti,\n5. výsledky předchozího hodnocení účinnosti systému řízení\
        \ bezpečnosti informací provedených podle tohoto písmene,\n6. posouzení dopadů\
        \ kybernetických bezpečnostních incidentů na oblast kybernetické bezpečnosti\
        \ a na poskytované služby podle § 15 a \n7. posouzení významných změn podle\
        \ § 11,\ng) zpracuje zprávu o přezkoumání systému řízení bezpečnosti informací\
        \ na základě vyhodnocení účinnosti systému řízení bezpečnosti informací podle\
        \ písmene f),\nh) aktualizuje systém řízení bezpečnosti informací a relevantní\
        \ dokumentaci na základě \n1. zjištění z auditů kybernetické bezpečnosti a\
        \ kontrol v oblasti kybernetické bezpečnosti,\n2. výsledků vyhodnocení účinnosti\
        \ systému řízení bezpečnosti informací,\n3. dopadů kybernetických bezpečnostních\
        \ incidentů na poskytované služby a\n4. prováděných významných změn,\ni) řídí\
        \ provoz a zdroje systému řízení bezpečnosti informací a zaznamenává činnosti\
        \ spojené se systémem řízení bezpečnosti informací a řízením rizik a \nj)\
        \ stanoví proces řízení výjimek z pravidel stanovených v bezpečnostní politice\
        \ podle písmene d)."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3-q1
      name: Je vytvořena politika systému řízení bezpečnosti informací včetně stanovených
        cílů ISMS?
      depth: 3
      ref_id: ZOKB-P3-Q1
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3
      description: 'Organizace musí mít vrcholový strategický dokument schválený statutárním
        orgánem, který jasně deklaruje, že kybernetická bezpečnost je pro organizaci
        prioritou. Určuje rozsah chráněného prostředí a stanovuje hlavní bezpečnostní
        cíle. Co doložit při kontrole: Politika kybernetické bezpečnosti (dokument
        podepsaný vedením), Stanovení rozsahu ISMS (dokumentace vymezení aktiv).'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3-q2
      name: Je stanoven rozsah ISMS?
      depth: 3
      ref_id: ZOKB-P3-Q2
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3
      description: 'Minimálně jednou ročně se musí sejít vedení a vyhodnotit, zda
        zavedená opatření fungují, zda máme dostatek zdrojů a zda reagujeme na nové
        hrozby. Nejedná se o IT poradu, ale o formální manažerský přezkum. Co doložit
        při kontrole: Zpráva o přezkoumání ISMS vrcholovým vedením, Zápis z porady
        vedení s prokazatelným schválením zprávy.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3-q3
      name: Je prováděno pravidelné vyhodnocování a přezkoumávání ISMS a je ISMS na
        základě těchto výstupů aktualizován?
      depth: 3
      ref_id: ZOKB-P3-Q3
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3
      description: 'Povinná osoba zajistí alespoň jednou ročně vyhodnocení účinnosti
        systému řízení bezpečnosti informací. Na základě zjištění z auditů, vyhodnocení
        účinnosti, dopadů incidentů a významných změn aktualizuje systém řízení bezpečnosti
        informací a relevantní dokumentaci. Co doložit při kontrole: Zpráva o vyhodnocení
        účinnosti ISMS, důkazy o následné aktualizaci dokumentace.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3-q4
      name: Je kybernetická bezpečnost součástí ostatních procesů organizace?
      depth: 3
      ref_id: ZOKB-P3-Q4
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p3
      description: 'Kybernetická bezpečnost nesmí být izolované IT téma. Musí být
        zapracována do nákupu, HR, obchodu i vývoje produktů. Co doložit při kontrole:
        Organizační směrnice (např. směrnice pro nákup, offboarding) a procesní diagramy
        ukazující integraci KB.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p4
      name: § 4 - Požadavky na vrcholné vedení
      depth: 2
      ref_id: ZOKB-P4
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Statutární orgán nebo jiná osoba nebo skupina osob v obdobném\
        \ postavení (dále jen „vrcholné vedení“) s ohledem na systém řízení bezpečnosti\
        \ informací\na) zajistí, aby všichni jeho členové prokazatelně absolvovali\
        \ školení podle § 10 odst. 3 písm. a),\nb) zajistí stanovení bezpečnostní\
        \ politiky a cílů systému řízení bezpečnosti informací podle § 3, slučitelných\
        \ se strategickým směřováním povinné osoby,\nc) zajistí integraci systému\
        \ řízení bezpečnosti informací do procesů povinné osoby,\nd) zajistí dostupnost\
        \ zdrojů potřebných pro systém řízení bezpečnosti informací,\ne) informuje\
        \ zaměstnance o významu systému řízení bezpečnosti informací a významu dosažení\
        \ shody s jeho požadavky se všemi dotčenými osobami,\nf) zajistí podporu k\
        \ dosažení cílů systému řízení bezpečnosti informací,\ng) vede a podporuje\
        \ zaměstnance k rozvíjení efektivity systému řízení bezpečnosti informací,\n\
        h) se podílí na vypracování analýzy dopadů podle § 15,\ni) zajistí testování\
        \ plánů kontinuity činností, plánů obnovy a procesů spojených se zvládáním\
        \ kybernetických bezpečnostních incidentů,\nj) prosazuje neustálé zlepšování\
        \ systému řízení bezpečnosti informací,\nk) podporuje osoby zastávající bezpečnostní\
        \ role při prosazování kybernetické bezpečnosti v oblastech jejich odpovědnosti,\n\
        l) zajistí stanovení pravidel pro určení administrátorů a osob, které budou\
        \ zastávat bezpečnostní role,\nm) zajistí, aby byla zachována mlčenlivost\
        \ všech relevantních osob zejména administrátorů, osob zastávajících bezpečnostní\
        \ role a dodavatelů a\nn) zajistí pro osoby zastávající bezpečnostní role\
        \ pravomoci potřebné pro naplňování jejich rolí a zdroje, včetně rozpočtových\
        \ prostředků k naplňování jejich rolí a plnění souvisejících úkolů.\n(2) Vrcholné\
        \ vedení se prokazatelně seznamuje se \na) zprávou o přezkoumání systému řízení\
        \ bezpečnosti informací,\nb) zprávou o hodnocení rizik,\nc) výsledky analýzy\
        \ dopadů a\nd) výsledky auditů kybernetické bezpečnosti a kontrol v oblasti\
        \ kybernetické bezpečnosti.\n(3) Vrcholné vedení zřídí výbor pro řízení kybernetické\
        \ bezpečnosti a určí jeho členy, přičemž\na) zajistí, že členem výboru pro\
        \ řízení kybernetické bezpečnosti bude alespoň jeden člen vrcholného vedení\
        \ nebo jím pověřená osoba a manažer kybernetické bezpečnosti,\nb) určí práva\
        \ a povinnosti výboru pro řízení kybernetické bezpečnosti a jeho členů, související\
        \ se systémem řízení bezpečnosti informací,\nc) přihlédne při určování složení\
        \ výboru podle písmene a) a určování práv a povinností jeho členů podle písmene\
        \ b) k příloze č. 5 k této vyhlášce,\nd) zajistí konání pravidelných jednání\
        \ výboru pro řízení kybernetické bezpečnosti alespoň jednou ročně,\ne) zajistí\
        \ vyhotovení záznamu o průběhu jednání výboru pro řízení kybernetické bezpečnosti\
        \ a \nf) zajistí, že výbor pro řízení kybernetické bezpečnosti je složen z\
        \ osob s pravomocemi a odbornou způsobilostí pro celkové řízení a rozvoj systému\
        \ řízení bezpečnosti informací a osob významně se podílejících na řízení a\
        \ koordinaci činností spojených s kybernetickou bezpečností. \n(4) Vrcholné\
        \ vedení určí osoby, včetně vymezení jejich práv a povinností souvisejících\
        \ se systémem řízení bezpečnosti informací, které budou zastávat bezpečnostní\
        \ role\na) manažera kybernetické bezpečnosti,\nb) architekta kybernetické\
        \ bezpečnosti,\nc) garanta aktiva a\nd) auditora kybernetické bezpečnosti.\n\
        (5) Vrcholné vedení zajistí zastupitelnost bezpečnostních rolí uvedených v\
        \ odstavci 4 písm. a) a b)."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p4-q1
