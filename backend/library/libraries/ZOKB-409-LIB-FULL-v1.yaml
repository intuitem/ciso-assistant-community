    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p13
      name: § 13 - Řízení přístupu
      depth: 2
      ref_id: ZOKB-P13
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: "(1) Povinná osoba na základě bezpečnostních a provozních potřeb\
        \ řídí přístup k aktivům a přijímá bezpečnostní opatření, která slouží k zajištění\
        \ ochrany přístupových a autentizačních údajů, které jsou používány pro ověření\
        \ identity podle § 19 a 21.\n(2) Povinná osoba dále při řízení přístupu k\
        \ aktivům \na) řídí přístup na základě skupin a rolí,\nb) přidělí každému\
        \ uživateli a administrátorovi přistupujícímu k aktivům přístupová práva a\
        \ oprávnění na úroveň nezbytně nutnou k výkonu práce a jedinečný identifikátor\
        \ daného typu účtu, přičemž odděluje uživatelské a administrátorské účty jedné\
        \ osoby,\nc) řídí identifikátory, přístupová práva a oprávnění účtů technických\
        \ aktiv,\nd) zavádí v souladu s písmenem c) bezpečnostní opatření pro řízení\
        \ přístupu technických aktiv,\ne) zavádí bezpečnostní opatření potřebná pro\
        \ bezpečné používání mobilních zařízení a jiných obdobných technických aktiv,\
        \ popřípadě i bezpečnostní opatření spojená s využitím technických aktiv,\
        \ která povinná osoba nemá ve své správě,\nf) omezí a kontroluje používání\
        \ programových prostředků a vybavení, které mohou být schopné překonat systémové\
        \ nebo aplikační kontroly,\ng) přiděluje a odebírá přístupová práva a oprávnění\
        \ v souladu s politikou řízení přístupu,\nh) provádí pravidelné přezkoumání\
        \ veškerých přístupových práv a oprávnění včetně rozdělení do skupin a rolí,\n\
        i) zajistí bezodkladné odebrání nebo změnu přístupových práv a oprávnění při\
        \ změně pozice nebo zařazení na základě skupin a rolí,\nj) zajistí deaktivaci\
        \ účtů a bezodkladné odebrání nebo změnu přístupových práv a oprávnění při\
        \ ukončení nebo změně smluvního vztahu, na základě kterého došlo ke zřízení\
        \ přístupu k aktivům, \nk) dokumentuje přidělování a odebírání přístupových\
        \ práv a oprávnění, a\nl) využívá nástroj pro správu a ověřování identity\
        \ podle § 19 a nástroj pro řízení přístupových práv a oprávnění podle § 20."
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p13-q1
