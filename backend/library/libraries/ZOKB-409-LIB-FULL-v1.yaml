      description: 'K minimalizaci rizika kompromitace nesmí správci číst poštu či
        běžně pracovat pod účtem s admin právy. Co doložit při kontrole: Oddělené
        personální admin účty (''a-jmeno''), architektura Jump serverů pro vstup k
        aktivům.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p20-q2
      name: Je zavedeno oddělení administrátorských oprávnění pro správu systému od
        uživatelských oprávnění? (např. oddělené účty, PIM/PAM, jump server)
      depth: 3
      ref_id: ZOKB-P20-Q2
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p20
      description: 'Povinná osoba řídí oprávnění pro čtení/zápis informací pomocí
        centralizovaných nástrojů a skupinových oprávnění. Co doložit při kontrole:
        Role a skupiny (Group policy) v AD, reporty mapování členství uživatelů.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p20-q3
      name: Je zavedeno centralizované řízení přístupových oprávnění? (např. ACL,
        nastavení skupin v AD)
      depth: 3
      ref_id: ZOKB-P20-Q3
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p20
      description: Je zavedeno centralizované řízení přístupových oprávnění? (např.
        ACL, nastavení skupin v AD)
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p21
      name: § 21 - Detekce kybernetických bezpečnostních událostí
      depth: 2
      ref_id: ZOKB-P21
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: '(1) Povinná osoba používá nástroj pro detekci kybernetických bezpečnostních
        událostí, který zajišťuje

        a) ověření a kontrolu přenášených dat v rámci komunikační sítě a mezi komunikačními
        sítěmi,

        b) ověření a kontrolu přenášených dat na síťovém perimetru komunikační sítě
        a

        c) aktivní blokování nežádoucí komunikace v rámci komunikační sítě.

        (2) Povinná osoba používá s ohledem na vazby mezi aktivy pro detekci kybernetických
        bezpečnostních událostí centrálně spravovaný nástroj, který u jednotlivých
        relevantních technických aktiv zajišťuje

        a) nepřetržitou a automatickou ochranu před škodlivým kódem,

        b) řízení a sledování používání vyměnitelných zařízení a datových nosičů,

        c) řízení automatického spouštění obsahu, zejména u vyměnitelných zařízení
        a datových nosičů,

        d) řízení oprávnění ke spouštění kódu,

        e) řízení a sledování komunikace aplikací, jejich služeb a procesů,

        f) detekci kybernetických bezpečnostních událostí technických aktiv a

        g) detekci kybernetických bezpečnostních událostí na základě chování technických
        aktiv, administrátorů a uživatelů.

        (3) Povinná osoba provádí pravidelnou a bezodkladnou aktualizaci nástroje
        používaného podle odstavce 1 a 2, a to včetně jeho nastavení a detekčních
        pravidel.'
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p21-q1
      name: Je vytvořena politika ochrany před škodlivým kódem?
      depth: 3
      ref_id: ZOKB-P21-Q1
