    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16-q3
      name: Jsou zpracovávány zprávy z auditu KB?
      depth: 3
      ref_id: ZOKB-P16-Q3
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16
      description: 'Audit se řádně provádí, posuzuje shodu s vyhláškou a nejlepší
        praxí a z jeho výkonu se dokumentují výsledky. Co doložit při kontrole: Formální
        auditní zprávy zahrnující shrnutí zjištění a manažerské vyhodnocení.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16-q4
      name: Jsou výsledky přezkoumání ISMS a auditů KB zohledněny v plánování na další
        období?
      depth: 3
      ref_id: ZOKB-P16-Q4
      assessable: true
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p16
      description: 'Zjištění z auditů vedou ke stanovení nápravných opatření (CAPA)
        a zohledňují se v plánu rozvoje a řízení rizik. Co doložit při kontrole: Plán
        nápravných a preventivních opatření (CAPA), důkazy o jejich plnění a zavedení
        do praxe.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p17
      name: § 17 - Fyzická bezpečnost
      depth: 2
      ref_id: ZOKB-P17
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: 'Povinná osoba v rámci fyzické bezpečnosti

        a) předchází poškození, odcizení, zneužití aktiv, neoprávněným zásahům do
        nich a narušení bezpečnosti poskytování regulované služby,

        b) stanoví fyzický bezpečnostní perimetr ohraničující oblast, ve které jsou
        uchovávány nebo zpracovávány informace a data, nebo ve které jsou umístěna
        technická aktiva regulované služby,

        c) rozdělí fyzické bezpečnostní perimetry stanovené podle písmene b) s ohledem
        na hodnocení umístěných technických aktiv do jednotlivých úrovní fyzické ochrany
        a tyto stanovené fyzické bezpečnostní perimetry a jejich úrovně fyzické ochrany
        dokumentuje a

        d) přijme u každého fyzického bezpečnostního perimetru s ohledem na jeho úroveň
        fyzické ochrany stanovenou podle písmene c) relevantní bezpečnostní opatření
        fyzické ochrany

        1. k zamezení neoprávněnému vstupu,

        2. k zamezení poškození, odcizení, zneužití aktiv, neoprávněným zásahům do
        nich a narušení bezpečnosti poskytování regulované služby,

        3. k zajištění fyzické ochrany budov a jiných ohraničených prostor,

        4. pro zajištění detekce narušení fyzického bezpečnostního perimetru a

        5. k evidenci vstupů a přístupů do fyzického bezpečnostního perimetru.'
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p17-q1
