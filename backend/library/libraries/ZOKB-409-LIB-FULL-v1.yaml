        \ v rozsahu uvedeném v příloze č. 1 k této vyhlášce,\nc) eviduje garanty aktiv\
        \ podle § 4 odst. 6 písm. c),\nd) hodnotí primární aktiva z hlediska důvěrnosti,\
        \ integrity a dostupnosti a zařadí je do jednotlivých úrovní podle písmene\
        \ b),\ne) posuzuje při hodnocení primárních aktiv alespoň oblasti uvedené\
        \ v příloze č. 1 k této vyhlášce,\nf) určuje a eviduje relevantní vazby mezi\
        \ aktivy,\ng) hodnotí podpůrná aktiva a zohledňuje přitom zejména vazby na\
        \ primární aktiva a\nh) pro jednotlivé úrovně aktiv podle písmene b) stanovuje\
        \ a zavádí pravidla ochrany nutná pro zabezpečení jejich důvěrnosti, integrity\
        \ a dostupnosti, která obsahují zejména \n1. přípustné způsoby používání aktiv,\n\
