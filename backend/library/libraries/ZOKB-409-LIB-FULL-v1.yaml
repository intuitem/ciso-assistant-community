      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p17
      description: 'U kritických prostor (při absenci čipů, nebo jako záloha) je striktně
        řízeno vydávání fyzických klíčů. Co doložit při kontrole: Režimová kniha výdeje
        a uložení klíčů včetně podpisů přebírajících osob.'
      implementation_groups:
      - ALL
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p18
      name: § 18 - Bezpečnost komunikačních sítí
      depth: 2
      ref_id: ZOKB-P18
      assessable: false
      parent_urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-409
      description: 'Povinná osoba pro ochranu bezpečnosti komunikační sítě, a to včetně
        jejího síťového perimetru

        a) zajistí a dokumentuje segmentaci komunikační sítě, včetně oddělení provozního,
        zálohovacího, vývojového, testovacího, administrátorského a jiného specifického
        prostředí,

        b) zajistí řízení komunikace v rámci komunikační sítě,

        c) zajistí řízení vzdáleného přístupu ke komunikační síti,

        d) zajistí řízení vzdálené správy technických aktiv,

        e) povoluje v souladu s písmeny b), c) a d) pouze takovou komunikaci, která
        je nezbytná pro řádné zajištění regulované služby,

        f) zajistí v souladu s písmeny c) a d) časové omezení komunikace a opětovné
        ověření identity administrátorů a uživatelů po stanovené době,

        g) zajistí pomocí aktuálně odolných kryptografických algoritmů upravených
        v § 25 a síťových protokolů důvěrnost a integritu při přenosu informací a
        dat,

        h) využívá nástroj, který zajistí ochranu integrity komunikační sítě a

        i) dokumentuje topologii komunikační sítě a infrastruktury.'
    - urn: urn:intuitem:risk:req_node:zokb-409-full-base:zokb-p18-q1
