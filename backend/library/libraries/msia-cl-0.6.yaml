        \ modelo sean l\xEDcitos, adecuados y trazables.\nPerfil m\xEDnimo: Est\xE1\
        ndar\n\xC1mbito: sistema (se eval\xFAa por sistema de IA)\nAplicabilidad por\
        \ tipo de IA: desarrollada: plena; comprada: parcial; uso del personal: no;\
        \ agentes: parcial\nLey chilena: L21.719 principios y art. 14 quinquies; Circular\
        \ 711 [Estado]\nEst\xE1ndares internacionales: AI RMF MAP 4; ISO 42001 A.7;\
        \ EU AI Act art. 10; OWASP LLM04; ATLAS AML.T0020 [POR VERIFICAR]"
