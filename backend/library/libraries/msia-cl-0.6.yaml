        \ uso del personal: plena; agentes: plena\nLey chilena: L21.663 art. 7 [art.\
        \ 4]; RAN 20-10 [CMF] (informaci\xF3n al directorio); L21.719 art. 49 (voluntario)\n\
        Est\xE1ndares internacionales: AI RMF MANAGE 4; ISO 42001 9.1, 9.3"
      typical_evidence: 'Tablero

        informes presentados

        actas'
      implementation_groups:
      - estandar
      - reforzado
      translations:
        en:
          name: Indicators and management reporting
    - urn: urn:athanor:risk:req_node:msia-cl-0.6:trz-05
      assessable: true
      depth: 2
      parent_urn: urn:athanor:risk:req_node:msia-cl-0.6:trz
      ref_id: TRZ-05
