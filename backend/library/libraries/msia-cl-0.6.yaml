        \ internacionales: AI RMF GOVERN 6, MAP 4; ISO 42001 A.10.2; OWASP LLM03;\
        \ ATLAS AML.T0010"
      typical_evidence: "Evaluaciones\naprobaci\xF3n registrada"
      implementation_groups:
