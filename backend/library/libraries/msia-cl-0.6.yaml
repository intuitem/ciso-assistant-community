        \ L21.663 art. 7 [art. 4]; RAN 20-10 [CMF] (monitoreo continuo, SOC 24 h)\n\
        Est\xE1ndares internacionales: AI RMF MANAGE 4.1; ISO 42001 A.6.2.6; OWASP\
        \ LLM10, ASI10; ATLAS"
      typical_evidence: "Casos de uso de detecci\xF3n\nalertas gestionadas\ntiempo\
        \ de detecci\xF3n"
      implementation_groups:
      - estandar
      - reforzado
      translations:
        en:
          name: Monitoring and detection
    - urn: urn:athanor:risk:req_node:msia-cl-0.6:trz-04
      assessable: true
