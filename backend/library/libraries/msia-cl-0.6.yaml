        \ del personal: registros de acceso del proxy o de la consola de la herramienta\
        \ aprobada. Por defecto se registran metadatos (qui\xE9n, qu\xE9 sistema,\
        \ qu\xE9 acci\xF3n, cu\xE1ndo y con qu\xE9 resultado); el contenido (prompts,\
        \ archivos y respuestas) se guarda solo cuando el perfil o una investigaci\xF3\
        n lo justifican, con retenci\xF3n y acceso definidos, porque tambi\xE9n es\
        \ un tratamiento de datos (DAT-01)."
      annotation: "Riesgo que reduce: Poder reconstruir qu\xE9 hizo la IA y qui\xE9\
        n la us\xF3.\nPerfil m\xEDnimo: Base\n\xC1mbito: sistema (se eval\xFAa por\
        \ sistema de IA)\nAplicabilidad por tipo de IA: desarrollada: plena; comprada:\
        \ plena; uso del personal: parcial; agentes: plena\nLey chilena: L21.663 art.\
        \ 7 [art. 4]; art. 8 b) [OIV] (registro de las acciones del SGSI; relaci\xF3\
        n indirecta)\nEst\xE1ndares internacionales: AI RMF MANAGE 4.1; ISO 42001\
