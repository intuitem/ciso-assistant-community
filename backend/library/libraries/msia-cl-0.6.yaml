        \ de IA)\nAplicabilidad por tipo de IA: desarrollada: plena; comprada: parcial;\
        \ uso del personal: no; agentes: plena\nLey chilena: L21.663 art. 8 d) [OIV];\
        \ RAN 20-10 [CMF] (resultados al directorio al menos semestralmente)\nEst\xE1\
        ndares internacionales: AI RMF MEASURE 2.7; ISO 27001 8.29; OWASP LLM01, ASI01;\
        \ ATLAS v2026.10"
      typical_evidence: 'Plan y resultados

        hallazgos corregidos

