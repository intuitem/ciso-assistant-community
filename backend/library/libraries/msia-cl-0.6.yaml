        nto tiempo y para qu\xE9.\nPerfil m\xEDnimo: Est\xE1ndar\n\xC1mbito: sistema\
        \ (se eval\xFAa por sistema de IA)\nAplicabilidad por tipo de IA: desarrollada:\
        \ parcial; comprada: plena; uso del personal: plena; agentes: plena\nLey chilena:\
        \ L21.719 arts. 15 bis y 27\u201328; Circular 711 [Estado]\nEst\xE1ndares\
        \ internacionales: AI RMF GOVERN 6; ISO 42001 A.7, A.10; OWASP LLM02"
      typical_evidence: "Contratos\nconfiguraci\xF3n de retenci\xF3n\nregistro de\
