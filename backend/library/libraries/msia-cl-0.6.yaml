          name: Secure development with AI
    - urn: urn:athanor:risk:req_node:msia-cl-0.6:cad-06
      assessable: true
      depth: 2
      parent_urn: urn:athanor:risk:req_node:msia-cl-0.6:cad
      ref_id: CAD-06
      name: "Evaluaci\xF3n de validez, desempe\xF1o y equidad"
      description: "Antes de producci\xF3n y ante cambios relevantes (CAD-04): definir\
        \ los criterios de aceptaci\xF3n del sistema seg\xFAn su prop\xF3sito (por\
