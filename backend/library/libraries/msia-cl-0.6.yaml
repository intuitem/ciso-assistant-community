        \ eval\xFAa por sistema de IA)\nAplicabilidad por tipo de IA: desarrollada:\
        \ plena; comprada: parcial; uso del personal: no; agentes: plena\nLey chilena:\
        \ \u2014\nEst\xE1ndares internacionales: AI RMF MEASURE 2.4, MANAGE 4.1; ISO\
        \ 42001 A.6.2.6; EU AI Act art. 72 [POR VERIFICAR]"
      typical_evidence: "Indicadores y umbrales\nmediciones peri\xF3dicas\nalertas\
        \ y acciones tomadas"
      implementation_groups:
