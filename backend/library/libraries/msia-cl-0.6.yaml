        \ por sistema de IA)\nAplicabilidad por tipo de IA: desarrollada: plena; comprada:\
        \ parcial; uso del personal: no; agentes: plena\nLey chilena: \u2014\nEst\xE1\
        ndares internacionales: AI RMF MAP 4; ISO 42001 A.4.4; OWASP LLM03; ATLAS\
