      annotation: "Riesgo que reduce: Que los registros sirvan como evidencia.\nPerfil\
        \ m\xEDnimo: Est\xE1ndar\n\xC1mbito: sistema (se eval\xFAa por sistema de\
        \ IA)\nAplicabilidad por tipo de IA: desarrollada: plena; comprada: plena;\
        \ uso del personal: parcial; agentes: plena\nLey chilena: L21.663 art. 7 [art.\
        \ 4]\nEst\xE1ndares internacionales: AI RMF MANAGE 4.1; ISO 42001 A.6.2.8;\
        \ ISO 27001 8.15, 8.17"
      typical_evidence: "Configuraci\xF3n del repositorio\npol\xEDtica de retenci\xF3\
        n"
      implementation_groups:
      - estandar
      - reforzado
      translations:
