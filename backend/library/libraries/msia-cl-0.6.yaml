          name: Operational performance and drift
    - urn: urn:athanor:risk:req_node:msia-cl-0.6:res
      assessable: false
      depth: 1
      ref_id: RES
      name: "Respuesta, notificaci\xF3n y resiliencia"
      translations:
        en:
