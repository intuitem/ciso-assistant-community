      name: "Notificaci\xF3n regulatoria"
      description: "Identificar qu\xE9 obligaciones de notificaci\xF3n aplican a la\
        \ organizaci\xF3n y a cada sistema, con un responsable para cada una. Instituciones\
        \ del art. 4 de la Ley 21.663, ante un incidente con efecto significativo:\
        \ alerta temprana al CSIRT Nacional dentro de 3 horas desde que se tiene conocimiento,\
        \ actualizaci\xF3n dentro de 72 horas (24 horas para un OIV cuyo servicio\
        \ esencial se vea afectado) e informe final dentro de 15 d\xEDas corridos\
        \ desde la alerta. Los OIV presentan adem\xE1s su plan de acci\xF3n en un\
        \ m\xE1ximo de 7 d\xEDas corridos (art. 9; D.295 art. 11). El reporte omite\
        \ datos personales (D.295 art. 6). Datos personales: informar a la Agencia\
        \ de Protecci\xF3n de Datos Personales \"sin dilaciones indebidas\" (Ley 21.719\
        \ art. 14 sexies; sin plazo en horas). Fiscalizados CMF: Cap\xEDtulo 20-8\
        \ RAN (30 minutos para comunicar el incidente, seg\xFAn una copia no oficial;\
        \ plazo [POR VERIFICAR] en el texto vigente). Exigir a los proveedores de\
        \ IA avisos compatibles con estos plazos (INV-04)."
