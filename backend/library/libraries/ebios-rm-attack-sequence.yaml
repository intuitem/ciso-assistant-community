  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:intrusion-physique
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 15
    name: Physical intrusion or trap
    description: 'Used to physically access information system resources in order to compromise it. It
      can be carried out by an outsider, or eased by recruiting a source inside the targeted organisation.
      It is especially useful to reach a system isolated from the Internet, which requires crossing one
      or more air gaps. Example: theft and use of an employee''s professional mobile phone.'
    annotation: '- Control of providers'' interventions: access to premises, supervision, logging. Interventions
      outside business hours or without human presence ease illegitimate activity, as does a badge giving
      free access to all areas.

      - Security clearance process or preliminary check for providers working on site.

      - Use of equipment managed by the organisation for providers'' interventions (maintenance kit, firmware
      USB key).

      - Number and ease of access of physical and logical connection points to the networks.

      - Remote-maintenance links or connections with third-party networks.

      - A security policy for the industrial supply chain (contractual requirements, supplier audits).

      - Security measures for the maintenance of supporting assets (removing non-volatile storage, physical
      sealing).

      - Physical security measures and access-control technology (gate, badge, keypad, biometrics, video
      surveillance).

      - Supervision of physical security and responsiveness of response teams (on site, remote, 24/7,
      business hours only).

      - Number of barriers to cross to physically reach critical supporting assets (at least three are
      recommended).

      - Security staff trained to the risk of physically planted eavesdropping equipment.

      - Users aware of, or trained against, physical intrusions; people with legitimate access know each
      other.

      - A security policy for business travel and staff awareness of risks during missions.'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:rentrer
    translations:
      fr:
        name: Intrusion ou piège physique
        description: 'Cette méthode d''intrusion est utilisée pour accéder physiquement à des ressources
          du système d''information afin de le compromettre. Elle peut être réalisée par une personne
          externe ou simplifiée par le recrutement d''une source interne à l''organisation ciblée. L''intrusion
          physique est notamment utile à l''attaquant qui souhaite accéder à un système isolé d''Internet,
          ce qui nécessite de franchir un ou plusieurs air gaps. Exemple : vol et utilisation du téléphone
          portable professionnel d''un personnel.'
        annotation: '- Maîtrise des interventions des prestataires : gestion des accès aux locaux, supervision,
          journalisation. Des interventions réalisées en dehors des heures ouvrées ou en l''absence de
          toute présence humaine facilitent une activité frauduleuse, de même qu''un badge permettant
          de circuler librement dans toutes les zones.

          - Processus d''habilitation de sécurité ou enquête préliminaire réalisés pour les prestataires
          qui interviennent sur site.

          - Utilisation de matériels informatiques gérés par l''organisation pour les interventions des
          prestataires (valise de maintenance, clé USB de firmware).

          - Nombre et facilité d''accès des points de connexion physique et logique aux réseaux informatiques
          de l''entité.

          - Existence de liens de télémaintenance ou de connexions avec des réseaux tiers.

          - Existence d''une politique de sécurité pour la chaîne d''approvisionnement industrielle (exigences
          contractuelles, audits de sécurité des fournisseurs).

          - Existence de mesures de sécurité pour la maintenance des biens supports (retrait des supports
          de stockage à mémoire non volatile, scellement physique).

          - Existence de mesures de sécurité physique et type de technologie utilisée pour le contrôle
          d''accès (portique, badge, digicode, biométrie, vidéo protection).

          - Supervision de la sécurité physique et réactivité des équipes d''intervention en cas de détection
          d''intrusion (sur place, à distance, 24/7, seulement heures ouvrées).

          - Nombre de barrières à franchir pour accéder physiquement aux biens supports critiques (au
          moins trois recommandées).

          - Personnels de sécurité formés au risque d''introduction physique de matériels d''écoute.

          - Utilisateurs sensibilisés, voire entraînés, à la vigilance vis-à-vis des intrusions physiques
          ; connaissance mutuelle des personnes pouvant avoir un accès légitime.

          - Existence d''une politique de sécurité pour les déplacements professionnels, sensibilisation
          des salariés aux risques lors de leurs missions.'
