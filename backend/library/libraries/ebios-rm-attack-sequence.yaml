urn: urn:intuitem:risk:library:ebios-rm-attack-sequence
locale: en
ref_id: ebios-rm-attack-sequence
name: EBIOS RM typical attack sequence and elementary actions
description: 'Default base of elementary actions for EBIOS RM workshop 4: the four phases of the typical
  attack sequence, the categories of elementary actions and the techniques commonly observed (fiche méthode
  7, « Élaborer des graphes d''attaque »), with the elements that determine each category''s success probability
  and technical difficulty (fiche méthode 8, « Évaluer la vraisemblance des scénarios opérationnels »).'
copyright: ANSSI — EBIOS Risk Manager, Le Supplément (fiches méthode 7 et 8). Licence Ouverte / Open Licence
  (Etalab).
version: 1
publication_date: '2026-10-02'
provider: ANSSI
packager: intuitem
autoload: true
translations:
  fr:
    name: Séquence d'attaque type et actions élémentaires EBIOS RM
    description: 'Base par défaut d''actions élémentaires pour l''atelier 4 d''EBIOS RM : les quatre phases
      de la séquence d''attaque type, les catégories d''actions élémentaires et les moyens et techniques
      couramment observés (fiche méthode 7, « Élaborer des graphes d''attaque »), avec les éléments qui
      déterminent la probabilité de succès et la difficulté technique de chaque catégorie (fiche méthode
      8, « Évaluer la vraisemblance des scénarios opérationnels »).'
objects:
  ttp_catalogs:
  - urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    name: EBIOS RM typical attack sequence
    description: 'Typical attack sequence of EBIOS RM (fiche méthode 7): phases as tactics, categories
      of elementary actions as techniques, observed means and techniques as sub-techniques. Each category''s
      annotation holds its rating factors from fiche méthode 8.'
    translations:
      fr:
        name: Séquence d'attaque type EBIOS RM
        description: 'Séquence d''attaque type d''EBIOS RM (fiche méthode 7) : phases en tactiques, catégories
          d''actions élémentaires en techniques, moyens et techniques observés en sous-techniques. L''annotation
          de chaque catégorie reprend ses éléments d''aide à la cotation (fiche méthode 8).'
  tactics:
  - urn: urn:intuitem:risk:tactic:ebios-rm-attack-sequence:connaitre
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 0
    name: Know
    description: 'Targeting, reconnaissance and external discovery activities carried out by the attacker
      to prepare the attack and raise its chances of success (mapping the ecosystem, searching for information
      on key people and systems, finding and assessing vulnerabilities, etc.). The information is collected
      by any means available to the attacker''s determination and resources: intelligence, competitive
      intelligence, professional social networks, direct approaches, cyber-mercenaries for information
      that is not openly available, etc.'
    translations:
      fr:
        name: Connaître
        description: 'Ensemble des activités de ciblage, de reconnaissance et de découverte externes menées
          par l''attaquant pour préparer son attaque et accroître ses chances de succès (cartographie
          de l''écosystème, recherche d''information sur les personnes et les systèmes clés, recherche
          et évaluation de vulnérabilités, etc.). Ces informations sont collectées par tous les moyens
          possibles selon la détermination et les ressources de l''attaquant : renseignement, intelligence
          économique, exploitation des réseaux socioprofessionnels, approches directes, cybermercenaires
          pour obtenir de l''information inaccessible en source ouverte, etc.'
  - urn: urn:intuitem:risk:tactic:ebios-rm-attack-sequence:rentrer
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 1
    name: Enter
    description: 'Activities through which the attacker gets in, digitally or physically, either directly
      into the target''s information system or into one of its ecosystem''s for a bounce attack. The intrusion
      usually goes through perimeter supporting assets that serve as entry points because they are exposed.
      Example: a user workstation connected to the Internet, a provider''s maintenance tablet, a remotely
      maintained printer.'
    translations:
      fr:
        name: Rentrer
        description: 'Ensemble des activités menées par l''attaquant pour s''introduire numériquement
          ou physiquement, soit directement et frontalement dans le système d''information de la cible,
          soit dans celui de son écosystème en vue d''une attaque par rebond. L''intrusion se fait généralement
          via des biens supports périmétriques qui servent de points d''entrée du fait de leur exposition.
          Exemple : poste utilisateur connecté à Internet, tablette de maintenance d''un prestataire,
          imprimante télé-maintenue, etc.'
  - urn: urn:intuitem:risk:tactic:ebios-rm-attack-sequence:trouver
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 2
    name: Find
    description: Internal reconnaissance of networks and systems, lateral movement, privilege escalation
      and persistence that let the attacker locate the data and supporting assets it is after. The attacker
      usually tries to stay discreet and leave no trace.
    translations:
      fr:
        name: Trouver
        description: Ensemble des activités de reconnaissance interne des réseaux et systèmes, de latéralisation,
          d'élévation de privilèges et de persistance qui permettent à l'attaquant de localiser les données
          et biens supports recherchés. L'attaquant cherche généralement à rester discret et à ne pas
          laisser de traces.
  - urn: urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 3
    name: Exploit
    description: 'Exploitation of the data and supporting assets found in the previous phase. For a sabotage
      operation, this includes triggering the payload; for an espionage operation aimed at exfiltrating
      e-mails, it may mean setting up and maintaining a discreet collection and exfiltration capability.
      Example: ransomware.'
    translations:
      fr:
        name: Exploiter
        description: 'Ensemble des activités d''exploitation des données et biens supports trouvés dans
          l''étape précédente. Par exemple, dans le cas d''une opération de sabotage, cette phase inclut
          le déclenchement de la charge active, dans le cas d''une opération d''espionnage visant à exfiltrer
          des mails, il peut s''agir de mettre en place et maintenir la capacité discrète de recueil et
          d''exfiltration des données. Exemple : rançongiciel.'
  techniques:
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:recrutement
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 0
    name: Recruiting a source, corrupting staff
    description: Recruiting a source inside the organisation, or with access to it, can be long and complex,
      but is very useful to plant a hardware trap or obtain information on the targeted system. The reasons
      that lead a target to betray its organisation, possibly unknowingly, fall into four broad categories
      known as MICE (Money, Ideology, Compromise, Ego). Specialised agencies exist for recruiting sources.
    annotation: '- Number of potential targets with access to the information sought, the critical supporting
      assets or their physical environment. The more targets, the easier it is for the attacker to find
      one that can be corrupted.

      - Staff, providers or suppliers likely to be driven by revenge. Example: a disgruntled employee
      recently dismissed.

      - Staff who went through a security clearance process and/or a background check, which gives some
      assurance on their integrity.

      - Targets'' satisfaction with their pay or with how they are regarded in the organisation.

      - Potential targets'' adherence to the company''s values. Poorly regarded, poorly paid people are
      naturally easier to corrupt.'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:connaitre
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:rentrer
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:trouver
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    translations:
      fr:
        name: Recrutement d'une source, corruption de personnel
        description: Une opération de « recrutement » d'une source à l'intérieur de l'organisation ou
          y ayant accès peut être longue et complexe, mais très utile pour mettre en place un piège matériel
          ou obtenir des informations sur le système ciblé. Les raisons poussant une cible à trahir son
          entité d'origine – potentiellement à son insu – sont couvertes par quatre grandes catégories,
          dites « MICE » (Money, Ideology, Compromission, Ego). Des officines spécialisées en matière
          de recrutement de sources existent.
        annotation: '- Nombre de cibles potentielles ayant accès aux informations visées, aux biens supports
          critiques ou à leur environnement physique. Plus les cibles potentielles sont nombreuses, plus
          il sera facile pour l''attaquant de trouver une cible corruptible.

          - Personnels, prestataires, fournisseurs susceptibles d''être animés par un esprit de vengeance.
          Exemple : salarié mécontent licencié récemment.

          - Personnels ayant fait l''objet d''un processus d''habilitation de sécurité et/ou d''une enquête,
          qui apporte un certain niveau d''assurance sur leur intégrité.

          - Satisfaction des cibles à l''égard de leur salaire ou de leur considération au sein de l''organisation.

          - Adhésion des cibles potentielles aux valeurs de l''entreprise. Des personnes mal considérées
          et mal payées seront naturellement plus faciles à corrompre.'
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:reconnaissance-externe
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 1
    name: External reconnaissance of the target
    description: During reconnaissance, the risk origin searches all its available sources for the information
      needed to plan its attack. The data collected may be technical or concern the organisation of the
      target and its ecosystem.
    annotation: '- Information on the organisation and its ecosystem easily available on the Internet
      (websites, online forums, professional social networks, etc.).

      - Regular participation of the organisation, its partners or former employees in trade shows or
      online forums. Much information is easily obtained through informal approaches; sensitive information
      is often exchanged during sales approaches. Example: fake customer, answer to a call for tenders.

      - Use of encryption in the organisation''s external relations and in the services it offers externally,
      which limits the impact of data leaks, in particular against interception or traffic diversion.

      - Specific skills needed to search for information given the organisation''s field. Attacks requiring
      strong expertise in fields linked to the target''s activity (air traffic control, CBRN, railway
      signalling) are costlier and harder than essentially technical ones.'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:connaitre
    translations:
      fr:
        name: Reconnaissance externe de la cible
        description: Lors de la phase de reconnaissance, la source de risque va rechercher dans l'ensemble
          de ses bases disponibles les informations nécessaires à la planification de son attaque. Les
          données collectées peuvent être de nature technique ou concerner l'organisation de la cible
          et de son écosystème.
        annotation: '- Informations sur l''entité et son écosystème facilement accessibles sur Internet
          (sites web, forums de discussions en ligne, réseaux socioprofessionnels, etc.).

          - Participation régulière de l''entité, de ses partenaires (fournisseurs, sous-traitants, clients)
          ou d''anciens salariés à des salons professionnels ou forums en ligne. Beaucoup d''informations
          sont aisément obtenues au travers d''approches informelles ; lors de démarches commerciales
          notamment, de nombreuses informations sensibles sont souvent échangées. Exemple : faux client,
          réponse à un appel d''offres.

          - Usage du chiffrement dans les relations de l''entité avec l''extérieur, dans les services
          offerts par l''entité à l''extérieur. Les protocoles de chiffrement permettent de limiter l''impact
          des fuites de données, en particulier vis-à-vis des interceptions ou détournements de trafic.

          - Compétences particulières nécessaires pour la recherche des informations, compte tenu du domaine
          d''activité de l''entité. Des attaques nécessitant de fortes compétences en lien avec l''activité
          de la cible (contrôle aérien, risque NRBC, signalisation ferroviaire) sont plus coûteuses et
          difficiles que des attaques essentiellement techniques.'
