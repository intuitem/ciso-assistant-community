  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:lateralisation
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 30
    name: Lateral movement and privilege escalation
    description: From its initial access point, the attacker uses lateral movement and privilege escalation
      to progress and persist in the information system, generally exploiting the system's internal structural
      weaknesses (poor segmentation, insufficient access control, weak authentication policy, careless
      administration and maintenance, lack of supervision). Internal reconnaissance and lateral movement
      are iterative in practice.
    annotation: '- Users with administrator rights on their workstation, which greatly eases internal
      reconnaissance, lateral movement and privilege escalation.

      - A policy for managing user profiles and access rights, applying the least-privilege principle.

      - Remote connections to systems restricted to dedicated administration machines without Internet
      access.

      - A security operations centre (SOC).

      - An authentication policy on networks. From most to least secure: strong authentication, password
      with a strict policy, password without policy, no authentication, smart card.

      - Segmentation of the information system by trust or data-sensitivity domains (for example following
      ANSSI guides).

      - Secure administration of networks and services (for example following ANSSI guides).

      - Heterogeneity of the IT estate: the more heterogeneous, the larger the attack surface and the
      easier it is to find an exploitable vulnerability.

      - Number and specificity of the services offered by the information system: the more numerous and
      specific, the larger the attack surface.

      - Ease of access to critical data. In increasing order of difficulty: data stored in clear in a
      central, easily identified location; data stored in many places; encrypted data.'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:trouver
    translations:
      fr:
        name: Latéralisation et élévation de privilèges
        description: À partir de son point d'accès initial, l'attaquant va mettre en œuvre des techniques
          de latéralisation et d'élévation de privilèges afin de progresser et de se maintenir dans le
          système d'information. Il s'agit généralement pour lui d'exploiter les vulnérabilités structurelles
          internes du système (manque de cloisonnement des réseaux, contrôle d'accès insuffisant, politique
          d'authentification peu robuste, négligences relatives à l'administration et à la maintenance
          du système d'information, absence de supervision, etc.). Les phases de reconnaissance interne
          et de latéralisation / élévation de privilèges sont en pratique itératives.
        annotation: '- Utilisateurs ayant des droits d''administrateur sur leur poste, car cela facilite
          grandement les opérations de reconnaissance interne, latéralisation et élévation de privilèges.

          - Existence d''une politique de gestion des profils d''utilisateurs et de leurs droits d''accès,
          application du principe du moindre privilège.

          - Connexions à distance sur les systèmes limitées à des machines dédiées à l''administration,
          sans accès à Internet.

          - Existence d''un centre de supervision de la sécurité (SOC).

          - Existence d''une politique d''authentification sur les réseaux. Exemple de moyens d''authentification
          du plus sécurisé au moins sécurisé : authentification forte, mot de passe avec politique contraignante,
          mot de passe sans politique, pas d''authentification, carte à puce.

          - Cloisonnement des réseaux informatiques de l''entité par domaines de confiance ou de sensibilité
          des données (par exemple selon les guides de recommandations de l''ANSSI).

          - Administration sécurisée des réseaux et services (par exemple selon les guides de recommandations
          de l''ANSSI).

          - Niveau d''hétérogénéité du parc informatique. Plus le niveau d''hétérogénéité est élevé, plus
          la surface d''attaque est importante et plus il est facile de trouver une vulnérabilité exploitable.

          - Nombre et spécificité des services offerts par le système d''information : plus ils sont nombreux
          et spécifiques, plus la surface d''attaque est importante.

          - Facilité d''accès des données critiques. Par ordre croissant de difficulté : données stockées
          en clair dans une zone centralisée et facilement identifiable, données stockées à de multiples
          endroits, données chiffrées.'
