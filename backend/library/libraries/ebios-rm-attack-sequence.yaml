  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:intrusion-internet
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 10
    name: Intrusion from the Internet or third-party networks
    description: The initial intrusion aims to plant a malicious tool in the targeted information system
      or in one belonging to its ecosystem (for example the supply chain), usually on a particularly exposed
      supporting asset. Ideally for the attacker, it is done from the Internet.
    annotation: '- Frontal attack on services: number of services and/or applications exposed on the Internet;
      exposed services that went through accreditation or a secure development process; filtering technology
      in place (reverse proxy, WAF); certified or qualified border supporting assets.

      - Phishing / watering hole: number of users likely to be targeted; users regularly trained to react
      to phishing and watering-hole attacks; effective anti-spam filter; filtering of users'' web browsing
      (proxy, IPS); browsing restricted to an allow-list.

      - Wireless network: presence of Wi-Fi networks in the office or industrial environment; Wi-Fi access
      secured, for example following ANSSI''s technical guide.

      - Legitimate software or patch: a security policy for software, business application and firmware
      updates (antivirus airlock, patch integrity checks); trusted, certified or qualified sources and
      channels, with verification of the signers'' identity.'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:rentrer
    translations:
      fr:
        name: Intrusion depuis Internet ou des réseaux informatiques tiers
        description: L'intrusion initiale a pour objectif d'introduire un outil malveillant dans le système
          d'information ciblé ou dans un autre appartenant à l'écosystème (par exemple la chaîne d'approvisionnement
          – supply chain), en général au niveau d'un bien support plus particulièrement exposé. Idéalement
          pour l'attaquant, l'intrusion initiale de l'outil malveillant est réalisée depuis Internet.
        annotation: '- Attaque frontale de services : nombre de services et/ou d''applicatifs exposés
          sur Internet ; services exposés ayant fait l''objet d''une homologation ou d''un processus de
          développement intégrant la sécurité ; technologie de filtrage mise en place (reverse proxy,
          WAF) ; utilisation de biens supports « de frontière » certifiés ou qualifiés.

          - Hameçonnage / point d''eau : nombre d''utilisateurs susceptibles d''être visés ; utilisateurs
          régulièrement sensibilisés et formés à réagir aux attaques par hameçonnage et point d''eau ;
          filtre anti-spam performant ; capacité de filtrage de la navigation Internet des utilisateurs
          (proxy, IPS) ; filtrage des sites Internet reposant sur une liste blanche.

          - Réseau sans fil : existence de réseaux sans fil (Wi-Fi) dans l''environnement bureautique
          ou industriel de l''entité ; accès Wi-Fi sécurisés, par exemple selon le guide technique de
          l''ANSSI.

          - Logiciel ou correctif légitime : existence d''une politique de sécurité relative aux mises
          à jour des logiciels, applications métier et firmware (sas antivirus, contrôle d''intégrité
          des correctifs) ; sources et canaux de confiance, voire certifiés ou qualifiés, vérification
          de l''identité des signataires pour les mises à jour.'
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:intrusion-internet.attaque-frontale
