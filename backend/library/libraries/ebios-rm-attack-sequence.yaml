  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 34
    name: Steering and exploitation of the attack
    description: 'This final step achieves the risk origin''s target objective: triggering a destructive
      payload, exfiltrating or modifying information, etc. The attack may be one-off (sabotage) or lasting
      and discreet (espionage). If it lasts and must be steered, the attacker sets up a control channel,
      synchronous or asynchronous, or even physical across an air gap.'
    annotation: '- Nature of the channel needed to steer or exploit the attack: pre-existing channel (backdoor),
      synchronous channel set up for the attack (direct, reverse TCP/HTTP), asynchronous channel (mail,
      social networks), physical channel (removable media across an air gap).

      - A security operations centre (SOC).

      - An anti-DDoS capability.

      - Consideration of the TEMPEST threat (compromising emanations), especially in dense urban areas.

      - Presumed time constraints for exploiting the attack. In increasing order of difficulty: no constraint;
      precise timing with long notice; precise timing with little notice; coordination across several
      machines without Internet connection.'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    translations:
      fr:
        name: Pilotage et exploitation de l'attaque
        description: 'Cette ultime étape correspond à la réalisation de l''objectif visé par la source
          de risque : déclencher la charge malveillante destructrice, exfiltrer ou modifier de l''information,
          etc. L''attaque peut être ponctuelle (opération de sabotage) ou durable et se réaliser en toute
          discrétion (opération d''espionnage). Dans le cas où celle-ci perdure dans le temps et nécessite
          d''être orientée, l''attaquant devra mettre en place un canal de pilotage, qu''il soit synchrone
          ou asynchrone, voire même physique dans le cas d''un air gap.'
        annotation: '- Nature du canal qu''il faudrait mettre en place pour piloter ou exploiter une attaque
          : canal préexistant (backdoor), canal synchrone mis en place pour l''attaque (direct, reverse
          TCP/HTTP), canal asynchrone (mail, réseaux sociaux), canal physique (supports de stockage amovibles
          via un air gap).

          - Existence d''un centre de supervision de la sécurité (SOC).

          - Existence d''un dispositif anti-DDoS.

          - Prise en compte de la menace TEMPEST, liée à l''interception de signaux parasites compromettants,
          notamment en zone urbaine de forte densité.

          - Contraintes de temps présumées pour l''exploitation de l''attaque. Par ordre croissant de
          difficulté : aucune contrainte ; timing précis mais préavis important ; timing précis et peu
          de préavis ; attaque coordonnée sur plusieurs machines, sans connexion à Internet.'
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation.espionnage
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    parent_urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation
    order_id: 35
    name: 'Espionage: data exfiltration; remote observation or passive listening; interception of compromising
      emanations (TEMPEST)'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    translations:
      fr:
        name: 'Espionnage : exfiltration de données ; observation ou écoute passive à distance ; interception
          et exploitation de signaux parasites compromettants (TEMPEST)'
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation.entrave
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    parent_urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation
    order_id: 36
    name: 'Operational disruption: DDoS; integrity attack on an asset or data (erasure, encryption, alteration);
      jamming; decoy; risky commands on industrial systems; intentional electromagnetic attack'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    translations:
      fr:
        name: 'Entrave au fonctionnement : déni de service distribué (DDoS) ; atteinte à l''intégrité
          d''un bien support ou d''une donnée (effacement, chiffrement, altération) ; brouillage ; leurre
          ; envoi de commandes à risque sur des systèmes industriels ; agression électromagnétique intentionnelle
          (AGREMI)'
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation.lucratif
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    parent_urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation
    order_id: 37
    name: 'Lucrative: database modification; misuse of a business or support application; identity theft
      for abuse of rights; diverting or extorting money (e.g. ransomware, crypto-miner)'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    translations:
      fr:
        name: 'Lucratif : modification d''une base de données ; altération ou détournement d''usage d''une
          application métier ou support ; usurpation d''identité (abus de droits) ; détournement ou extorsion
          d''argent (exemple : rançongiciel, mineur de crypto monnaie)'
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation.influence
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    parent_urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:pilotage-exploitation
    order_id: 38
    name: 'Influence: website defacement; spreading ideological messages by taking over an information
      channel; identity theft to damage reputation'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    translations:
      fr:
        name: 'Influence : défiguration de sites Internet ; diffusion de messages idéologiques via la
          prise de contrôle d''un canal d''information ; usurpation d''identité (atteinte à la réputation)'
  - urn: urn:intuitem:risk:technique:ebios-rm-attack-sequence:outils-malveillants
    catalog_urn: urn:intuitem:risk:ttp_catalog:ebios-rm-attack-sequence
    order_id: 39
    name: Malicious tools
    description: Most attacks require installing malware in the targeted systems, sometimes in several
      stages. These factors complement the categories above for any elementary action that needs malware.
    annotation: '- Type of technology of the targeted supporting assets.

      - Delay in applying security patches after their release, and application of ANSSI''s recommendations
      on security maintenance. An up-to-date asset forces the attacker to develop a 0-day exploit; otherwise
      a public vulnerability is enough (no difficulty, near-certain success).

      - Age of the technology of the targeted supporting assets. Very specific technology (avionics computer,
      PLC) may force the attacker to adapt or rewrite malware, or even acquire the asset, which strongly
      raises technical difficulty.'
    tactics:
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:connaitre
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:rentrer
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:trouver
    - urn:intuitem:risk:tactic:ebios-rm-attack-sequence:exploiter
    translations:
      fr:
        name: Outils malveillants
        description: La plupart des attaques demande l'installation de logiciels malveillants dans les
          systèmes ciblés, parfois en plusieurs étapes. Ces éléments complètent les catégories précédentes
          pour affiner l'estimation d'une action élémentaire qui nécessiterait l'installation d'un logiciel
          malveillant.
        annotation: '- Type de technologie des biens supports ciblés par l''outil malveillant.

          - Délai d''application des correctifs de sécurité après leur publication, mise en œuvre des
          recommandations de l''ANSSI relatives au MCS. Un bien support à jour oblige l''attaquant à développer
          un exploit « 0-day » ; dans le cas contraire, il n''a qu''à exploiter une vulnérabilité publique
          (difficulté nulle et probabilité de succès quasi certaine).

          - Degré d''ancienneté de la technologie des biens supports ciblés. Une technologie très spécifique
          (calculateur aéronautique, automate programmable industriel) peut obliger l''attaquant à adapter
          ou redévelopper un logiciel malveillant, voire à acquérir le bien support, ce qui influe énormément
          sur la difficulté technique.'
