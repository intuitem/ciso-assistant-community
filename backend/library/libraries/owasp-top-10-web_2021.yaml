      de:
        name: Sicherheitsrelevante Fehlkonfiguration
        description: "Die Anwendung besitzt m\xF6glicherweise Schwachstellen, wenn\
          \ folgendes zutrifft:\n\n- Mangelhafte Sicherheitsh\xE4rtung des Anwendungsstacks\
          \ oder ungeeignet konfigurierte Berechtigungen auf Cloud-Diensten.\n\n-\
          \ Nicht ben\xF6tigte Features sind aktiviert oder installiert (z. B. unn\xF6\
          tige Ports, Dienste, Seiten, Accounts oder Rechte).\n\n- Standardkonten\
          \ und -passw\xF6rter sind aktiviert bzw. unver\xE4ndert.\n\n- Die Fehlerbehandlung\
          \ gibt Stack-Traces oder andere interne technische Fehlermeldungen an Anwendende\
          \ preis.\n\n- F\xFCr aktualisierte Systeme sind die neuesten Sicherheitsfeatures\
          \ deaktiviert oder nicht sicher konfiguriert.\n\n- Die Sicherheitseinstellungen\
          \ in den Anwendungsservern und -frameworks (z. B. Struts, Spring, ASP.NET),\
          \ Bibliotheken, Datenbanken etc. sind nicht auf sichere Werte gesetzt.\n\
          \n- Der Server sendet keine Sicherheits-Header oder -Direktiven, bzw. diese\
          \ sind nicht sicher konfiguriert.\n\n- Die Software ist veraltet oder verwundbar\
          \ (siehe [A06:2021-Unsichere oder veraltete Komponenten](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\
          \nOhne einen abgestimmten und reproduzierbaren Prozess zur sicheren Konfiguration\
          \ sind Systeme einem h\xF6heren Risiko ausgesetzt!"
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 20          | 19.84 %             | 4.51 %              | 8.12       \
          \          | 6.56                | 89.58 %       | 44.84 %       | 208,387\
          \           | 789        |\n\n\n## How to prevent\n\nEs sollten sichere\
          \ Installationsprozesse implementiert werden, darunter:\n\n- Ein wiederholbarer\
          \ H\xE4rtungsprozess erm\xF6glicht die schnelle und einfache Bereitstellung\
          \ zus\xE4tzlicher Umgebungen, die entsprechend abgesichert sind. Entwicklungs-,\
          \ Qualit\xE4tssicherungs- und Produktionsumgebungen sollten alle identisch\
          \ konfiguriert sein, wobei in jeder Umgebung unterschiedliche Anmeldeinformationen\
          \ verwendet werden sollten. Dieser Prozess sollte automatisiert werden,\
          \ um den Aufwand f\xFCr die Einrichtung einer neuen sicheren Umgebung zu\
          \ minimieren.\n\n- Eine minimale Plattform ohne unn\xF6tige Funktionen,\
          \ Komponenten, Dokumentation und Beispiele: Entfernen Sie Funktionen und\
          \ Frameworks die Sie nicht verwenden oder installieren Sie diese erst gar\
          \ nicht.\n\n- \xDCberpr\xFCfen und Aktualisieren der Konfigurationen, die\
          \ f\xFCr alle Sicherheitshinweise, Updates und Patches im Rahmen des Patch-Verwaltungsprozesses\
          \ geeignet sind (siehe [A06:2021-Unsichere oder veraltete Komponenten](A06_2021-Vulnerable_and_Outdated_Components.md)).\
          \ \xDCberpr\xFCfen Sie die Cloud-Speicherberechtigungen (z. B. S3-Bucket-Berechtigungen).\n\
          \n- Eine segmentierte Anwendungsarchitektur sorgt durch Segmentierung, Containerisierung\
          \ oder Cloud-Sicherheitsgruppen (ACLs) f\xFCr eine effektive und sichere\
          \ Trennung zwischen Komponenten oder Mandanten.\n\n- Senden von Sicherheitsanweisungen\
          \ an Clients, z. B. Sicherheits-Header.\n\n- Ein automatisierter Prozess\
          \ zur \xDCberpr\xFCfung der Wirksamkeit der Konfigurationen und Einstellungen\
          \ in allen Umgebungen.\n\n\n## Example attack scenarios\n\n**Szenario Nr.\
          \ 1:** Der Anwendungsserver wird mit Beispielanwendungen geliefert, die\
          \ nicht vom Produktionsserver entfernt wurden. Diese Beispielanwendungen\
          \ weisen bekannte Sicherheitsl\xFCcken auf, die Angreifende nutzen, um den\
          \ Server zu gef\xE4hrden. Angenommen, eine dieser Anwendungen ist die Admin-Konsole\
          \ und die Standardkonten wurden nicht ge\xE4ndert. In diesem Fall meldet\
          \ sich die angreifende Person mit Standardkennw\xF6rtern an und \xFCbernimmt\
          \ die Kontrolle.\n\n**Szenario Nr. 2:** Die Directory Listings wurden auf\
          \ dem Server nicht deaktiviert. Angreifende entdecken, dass Verzeichnisse\
          \ einfach aufgelistet werden k\xF6nnen. Die angreifende Person findet die\
          \ kompilierten Java-Klassen und l\xE4dt sie herunter, dekompiliert sie und\
          \ betreibt Reverse Engineering, um den Code anzuzeigen. Dies erm\xF6glicht\
          \ das Findet eines schwerwiegenden Fehlers in der Zugriffskontrolle in der\
          \ Anwendung.\n\n**Szenario Nr. 3:** Die Konfiguration des Anwendungsservers\
          \ erm\xF6glicht die R\xFCckgabe detaillierter Fehlermeldungen an Anwendende,\
          \ z. B. Stack-Traces. Dadurch werden m\xF6glicherweise vertrauliche Informationen\
          \ oder zugrunde liegende Fehler wie Komponentenversionen offengelegt, die\
          \ bekannterma\xDFen anf\xE4llig sind.\n\n**Szenario Nr. 4:** Ein Cloud-Dienstanbieter\
          \ (CSP) enth\xE4lt Standardfreigaben, die aus dem Internet f\xFCr andere\
          \ Cloud-Nutzende erreichbar sind und erm\xF6glicht dadurch Zugriff auf sensitive\
          \ Daten in der Cloud.\n\n\nWeitere Informationen zu den Referenzen und zur\
          \ Liste der zugeordneten CWEs: https://top10.owasp.org/2021/de/A05_2021-Security_Misconfiguration/"
      es:
        name: "Configuraci\xF3n de Seguridad Incorrecta"
        description: "La aplicaci\xF3n puede ser vulnerable si:\n\n-   Le falta el\
          \ *hardening* de seguridad adecuado en cualquier parte del *stack tecnol\xF3\
          gico* o permisos configurados incorrectamente en los servicios en la nube.\n\
          \n-   Tiene funciones innecesarias habilitadas o instaladas (puertos, servicios,\
          \ p\xE1ginas, cuentas o privilegios innecesarios, por ejemplo).\n\n-   Las\
          \ cuentas predeterminadas y sus contrase\xF1as a\xFAn est\xE1n habilitadas\
          \ y sin cambios.\n\n-   El manejo de errores revela a los usuarios rastros\
          \ de pila u otros mensajes de error demasiado informativos.\n\n-   Para\
          \ sistemas actualizados, las \xFAltimas funciones de seguridad est\xE1n\
          \ deshabilitadas o no configuradas de forma segura.\n\n-   Las configuraciones\
          \ de seguridad en los servidores de aplicaciones, frameworks de aplicaciones\
          \ (Struts, Spring o ASP.NET por ejemplo), bibliotecas, bases de datos, etc.,\
          \ no poseen configurados valores seguros.\n\n-   El servidor no env\xED\
          a encabezados o directivas de seguridad, o no poseen configurados valores\
          \ seguros.\n\n-   El software est\xE1 desactualizado o es vulnerable (consulte\
          \ [A06:2021-Componentes Vulnerables y Desactualizados](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\
          \nSin un proceso de configuraci\xF3n de seguridad de aplicaciones coordinado\
          \ y repetible, los sistemas corren un mayor riesgo."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom| Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 20          | 19.84%             | 4.51%              | 8.12         \
          \        | 6.56                | 89.58%       | 44.84%       | 208,387 \
          \          | 789        |\n\n\n## How to prevent\n\nDeben implementarse\
          \ procesos de instalaci\xF3n seguros, incluyendo:\n\n-   Un proceso de *hardening*\
          \ repetible agiliza y facilita la implementaci\xF3n de otro entorno que\
          \ est\xE9 debidamente inaccesible. Los entornos de desarrollo, control de\
          \ calidad y producci\xF3n deben configurarse de forma id\xE9ntica, con diferentes\
          \ credenciales utilizadas en cada uno.\n    Este proceso debe automatizarse\
          \ para minimizar el esfuerzo necesario para configurar un nuevo entorno\
          \ seguro.\n\n-   Una plataforma m\xEDnima sin funciones, componentes, documentaci\xF3\
          n ni ejemplos innecesarios. Elimine o no instale caracter\xEDsticas y frameworks\
          \ no utilizados.\n\n-   Una tarea para revisar y actualizar las configuraciones\
          \ apropiadas para todas las notas de seguridad, actualizaciones y parches\
          \ como parte del proceso de administraci\xF3n de parches (consulte [A06:\
          \ 2021-Componentes Vulnerables y Desactualizados](A06_2021-Vulnerable_and_Outdated_Components.md)).\
          \ Revise los permisos de almacenamiento en la nube (por ejemplo, Permisos\
          \ de bucket de S3).\n\n-   Una arquitectura de aplicaci\xF3n segmentada\
          \ proporciona una separaci\xF3n efectiva y segura entre componentes o instancias,\
          \ con segmentaci\xF3n, organizaci\xF3n en contenedores o grupos de seguridad\
          \ en la nube (ACLs).\n\n-   Env\xEDo de directivas de seguridad a los clientes,\
          \ por ejemplo, encabezados de seguridad.\n\n-   Un proceso automatizado\
          \ para verificar la efectividad de las configuraciones y ajustes en todos\
          \ los entornos.\n\n\n## Example attack scenarios\n\n**Escenario #1:** El\
          \ servidor de aplicaciones contiene aplicaciones de ejemplo que no se eliminan\
          \ del servidor de producci\xF3n. Estas aplicaciones de ejemplo poseen fallas\
          \ de seguridad conocidas que los atacantes utilizan para comprometer el\
          \ servidor. Supongamos que una de estas aplicaciones es la consola de administraci\xF3\
          n y no se modificaron las cuentas predeterminadas. En ese caso, el atacante\
          \ inicia sesi\xF3n con las contrase\xF1as predeterminadas y toma el control.\n\
          \n**Escenario #2:** El listado de directorios no se encuentra deshabilitado\
          \ en el servidor. Un atacante descubre que simplemente puede enumerar directorios.\
          \ El atacante detecta y descarga las clases Java compiladas, que decompila\
          \ y aplica ingenier\xEDa inversa para ver el c\xF3digo. El atacante luego\
          \ encuentra una falla severa de control de acceso en la aplicaci\xF3n.\n\
          \n**Escenario #3:** La configuraci\xF3n del servidor de aplicaciones permite\
          \ que se retornen a los usuarios mensajes de error detallados, por ejemplo,\
          \ trazas de pila(stack traces). Esto potencialmente expone informaci\xF3\
          n confidencial o fallas subyacentes, como versiones de componentes que se\
          \ sabe son vulnerables.\n\n**Escenario #4:** Un proveedor de servicios en\
          \ la nube (CSP) posee permisos de uso compartido predeterminados abiertos\
          \ a Internet a otros usuarios. Esto permite acceder a los datos confidenciales\
          \ almacenados en el almacenamiento en la nube.\n\n\nPara obtener m\xE1s\
          \ informaci\xF3n sobre las referencias y la lista de CWE asociadas: https://top10.owasp.org/2021/es/A05_2021-Security_Misconfiguration/"
      fr:
        name: "Mauvaise configuration de s\xE9curit\xE9"
        description: "L'application peut \xEAtre vuln\xE9rable si :\n\n-   elle n'a\
          \ pas fait l'objet d'un durcissement de la s\xE9curit\xE9 appropri\xE9 sur\
          \ l'ensemble des couches protocolaires applicatives, ou si les permissions\
          \ sont mal configur\xE9es sur les services cloud ;\n-   des fonctionnalit\xE9\
          s inutiles sont activ\xE9es ou install\xE9es (ex : des ports, des services,\
          \ des pages, des comptes ou des privil\xE8ges inutiles) ;\n-   les comptes\
          \ par d\xE9faut et leurs mots de passe sont toujours activ\xE9s et inchang\xE9\
          s ;\n-   le traitement des erreurs r\xE9v\xE8le aux utilisateurs des traces\
          \ des piles protocolaires ou d'autres messages d'erreur laissant transpirer\
          \ trop d'informations ;\n-   pour les syst\xE8mes \xE0 jour ou mis \xE0\
          \ niveau, les derni\xE8res fonctionnalit\xE9s de s\xE9curit\xE9 sont d\xE9\
          sactiv\xE9es ou ne sont pas configur\xE9es de mani\xE8re s\xE9curis\xE9\
          e ;\n-   les param\xE8tres de s\xE9curit\xE9 dans les serveurs d'application,\
          \ les frameworks applicatifs (ex : Struts, Spring, ASP.NET), les biblioth\xE8\
          ques, les bases de donn\xE9es, etc. ne sont pas param\xE9tr\xE9s avec des\
          \ valeurs correctes du point de vue de la s\xE9curit\xE9 ;\n-   le serveur\
          \ n'envoie pas d'en-t\xEAtes ou de directives de s\xE9curit\xE9, ou s'ils\
          \ ne sont pas param\xE9tr\xE9s avec des valeurs correctes du point de vue\
          \ de la s\xE9curit\xE9 ;\n-   La version du logiciel est obsol\xE8te ou\
          \ vuln\xE9rable (voir [A06:2021-Composants vuln\xE9rables et obsol\xE8tes](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\
          \nSans un processus concert\xE9 et r\xE9p\xE9table de configuration de la\
          \ s\xE9curit\xE9 des applications, les syst\xE8mes courent un risque plus\
          \ \xE9lev\xE9."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       20       |       19,84 %        |         4,51 %         |     \
          \        8,12              |         6,56         |    89,58 %     |   \
          \   44,84 %       |          208 387           |         789          |\n\
          \n\n## How to prevent\n\nDes processus d'installation s\xE9curis\xE9s doivent\
          \ \xEAtre mis en \u0153uvre, avec notamment :\n\n- un processus de durcissement\
          \ r\xE9p\xE9table qui permette de d\xE9ployer rapidement et facilement un\
          \ autre environnement correctement s\xE9curis\xE9 avec une configuration\
          \ verrouill\xE9e. Les environnements de d\xE9veloppement, d'assurance qualit\xE9\
          \ et de production doivent tous \xEAtre configur\xE9s de mani\xE8re identique,\
          \ avec des droits diff\xE9rents pour chaque environnement. Ce processus\
          \ devrait \xEAtre automatis\xE9 afin de r\xE9duire au minimum les efforts\
          \ requis pour mettre en place un nouvel environnement s\xE9curis\xE9 ;\n\
          - une plate-forme minimale sans fonctionnalit\xE9, composant, documentation\
          \ et \xE9chantillon inutile. Supprimer ou ne pas installer des fonctionnalit\xE9\
          s et frameworks inutilis\xE9s ;\n- une t\xE2che pour revoir et mettre \xE0\
          \ jour les configurations appropri\xE9es \xE0 tous les avis de s\xE9curit\xE9\
          , toutes les mises \xE0 jour et tous les correctifs dans le cadre du processus\
          \ de gestion des correctifs (voir [A06:2021-Composants vuln\xE9rables et\
          \ obsol\xE8tes](A06_2021-Vulnerable_and_Outdated_Components.md)). En particulier,\
          \ examiner les permissions de stockage dans le Cloud (ex. les permissions\
          \ des buckets AWS S3) ;\n- une architecture d'application segment\xE9e qui\
          \ fournit une s\xE9paration efficace et s\xE9curis\xE9e entre les composants\
          \ ou les environnements h\xE9berg\xE9s, avec de la segmentation, de la mise\
          \ en conteneurs ou l'utilisation de groupes de s\xE9curit\xE9 dans le Cloud\
          \ (ACL) ;\n- l'envoi de directives de s\xE9curit\xE9 aux clients, par exemple\
          \ [En-t\xEAtes de s\xE9curit\xE9](https://wiki.owasp.org/index.php/OWASP_Secure_Headers_Project)\
          \ ;\n- un processus automatis\xE9 pour v\xE9rifier l'efficacit\xE9 des configurations\
          \ et des r\xE9glages dans tous les environnements.\n\n\n## Example attack\
          \ scenarios\n\n**Sc\xE9nario 1** : Le serveur d'application est livr\xE9\
          \ avec des applications classiques qui ne sont pas supprim\xE9es du serveur\
          \ mis en production. Ces m\xEAmes applications ont des failles de s\xE9\
          curit\xE9 connues que les attaquants utilisent afin de compromettre le serveur.\
          \ Si l'une de ces applications est la console d'administration, et que les\
          \ comptes par d\xE9faut n'ont pas \xE9t\xE9 modifi\xE9s, l'attaquant se\
          \ connecte avec les mots de passe par d\xE9faut et prend la main sur la\
          \ cible.\n\n**Sc\xE9nario 2** : La fonctionnalit\xE9 de listage des r\xE9\
          pertoires n'est pas d\xE9sactiv\xE9e sur le serveur. Un attaquant d\xE9\
          couvre qu'il peut simplement lister les r\xE9pertoires. L'attaquant trouve\
          \ et t\xE9l\xE9charge les classes Java compil\xE9es, qu'il d\xE9compose\
          \ et fait de l'ing\xE9nierie invers\xE9e pour visualiser le code. L'attaquant\
          \ trouve alors un grave d\xE9faut dans le contr\xF4le d'acc\xE8s de l'application.\n\
          \n**Sc\xE9nario 3** : La configuration du serveur d'application permet de\
          \ renvoyer aux utilisateurs des messages d'erreur d\xE9taill\xE9s, par exemple\
          \ avec des traces des couches protocolaires applicatives. Cela peut ainsi\
          \ exposer des informations sensibles ou des vuln\xE9rabilit\xE9s sous-jacentes\
          \ telles que les versions de composants dont on sait qu'elles sont vuln\xE9\
          rables.\n\n**Sc\xE9nario 4** : Un fournisseur de services Cloud (CSP) a\
          \ positionn\xE9 des droits de partage par d\xE9faut qui sont ouverts sur\
          \ Internet par d'autres utilisateurs du CSP. Cela permet d'acc\xE9der \xE0\
          \ des donn\xE9es sensibles stock\xE9es dans le stockage Cloud.\n\n\nPour\
          \ plus d\u2019informations sur les r\xE9f\xE9rences et la liste des CWE\
          \ mapp\xE9es : https://top10.owasp.org/2021/fr/A05_2021-Security_Misconfiguration/"
      id:
        name: Kesalahan Konfigurasi Keamanan
        description: 'Aplikasi dapat dikatakan rentan apabila aplikasi tersebut :


          - Tidak memiliki pertahanan yang sesuai atau security hardening yang diperlukan
          diseluruh bagian dari stack aplikasi atau tidak benar dalam melakukan konfigurasi
          untuk permission pada cloud services.


          - Fitur - fitur yang tidak digunakan masih di enable atau diinstall (contoh
          seperti port, services, pages, accounts, atau privileges yang tidak dipakai)


          - Akun default dan passwordnya masih di bolehkan dan tidak pernah diubah.


          - Cara menghandle error memperlihatkan stack traces atau pesan lainnya yang
          terlalu informatif kepada user


          - Untuk sistem yang telah diupdate, fitur security terbaru tidak digunakan
          atau belum dikonfigurasi.


          - Pengaturan security pada server aplikasi, framework aplikasi (contoh Struts,
          Spring, ASP.NET), libraries, databases, dll, tidak diatur dengan secure
          values.


          - Server tidak mengirim security header atau directives, atau tidak diatur
          dengan secure values.


          - Software bersifat lama atau rentan (lihat A06:2021-Vulnerable and Outdated
          Components).


          Tanpa proses konfigurasi keamanan aplikasi yang berulang dan terpadu, sistem
          berada dalam resiko yang tinggi.'
        annotation: '## Score table


          | Klasifikasi CWE | Tingkat Kejadian Maksimum | Rata-rata Tingkat Kejadian
          | Cakupan Maksimum | Rata-rata Cakupan | Rata-rata Bobot Exploitasi | Rata-rata
          Bobot Dampak | Total Kejadian| Total CVEs |

          | :---------: | :----------------: | :----------------------: | :----------:
          | :----------------: | :------------------------: | :-----------------------:
          | :------------: | :--------: |

          |     20      |       19.84%       |          4.51%           |    89.58%    |       44.84%       |            8.12            |           6.56            |    208,387     |    789     |



          ## How to prevent


          Proses instalasi yang aman harus diimplementasikan, termasuk :


          - Proses hardening yang dapat diulang akan mempercepat dan memudahkan untuk
          membuat untuk melakukan deploy ke environment lainnya yang dikunci dengan
          tepat. Development, QA, dan production environment harus dikonfigurasi secara
          identik, dengan credentials yang berbeda digunakan pada setiap environment.
          Proses ini harus di automasi untuk meminimalisir usaha yang diperlukan untuk
          mengatur environment baru yang aman.


          - Platform minimal tanpa fitur, komponen, dokumentasi, dan sampel yang tidak
          diperlukan. Hapus atau jangan install fitur dan framework yang tidak digunakan.


          - Sebuah tugas (task) untuk meninjau dan memperbarui konfigurasi yang sesuai
          untuk ke semua security notes, updates, dan patches sebagai bagian dari
          proses patch management (lihat A06:2021-Vulnerable and Outdated Components).
          Review cloud storage permissions (contoh, S3 bucket permissions).


          - Sebuah arsitektur aplikasi yang tersegmentasi yang memberikan efektif
          dan pemisahan yang aman diantara komponen atau tenant, dengan segmentasi,
          containerization, atau cloud security groups (ACLs).


          - Mengirim security directives ke clients, contoh Security Headers.


          - Sebuah proses automasi untuk memverifikasi keefektifan dari konfigurasi
          dan setting di semua environments.



          ## Example attack scenarios


          **Skenario #1:** Server Aplikasi datang dengan sampel aplikasi yang tidak
          dihapus dari server production. Sampel Aplikasi tersebut memiliki kelemahan
          keamanan yang dapat mengkompromi servernya. Misal salah satu aplikasi merupakan
          admin console dan default dari akun belum diganti. Maka penyerang dapat
          login dengan default password dan masuk.


          **Skenario #2:** Direktori listing tidak di nonaktifkan di server. Sebuah
          penyerang menemukan bahwa mereka dapat melihat list direktori. Penyerang
          menemukan dan mendownload compiled Java classes, yang dimana mereka akan
          lakukan decompile dan reverse engineer untuk melihat kodenya. Setelah itu
          penyerang menemukan kelemahan fatal untuk akses kontrol pada aplikasi.


          **Skenario #3:** Konfigurasi server aplikasi membolehkan error message yang
          detail, seperti stack traces, untuk ditampilkan kepada user. Hal tersebut
          dapat berpotensi untuk memberikan informasi yang bersifat sensitif atau
          kelemahan mendasar seperti versi komponen yang diketahui kelemahannya.


          **Skenario #4:** Sebuah cloud service provider memiliki permission default
          open untuk sharing ke internet pada pengguna CSP lainnya. Ini memungkinkan
          untuk data sensitif yang disimpan pada cloud storage untuk diakses



          Untuk informasi lebih lanjut tentang referensi dan daftar CWE yang dipetakan:
          https://top10.owasp.org/2021/id/A05_2021-Security_Misconfiguration/'
      it:
        name: Security Misconfiguration
        description: "L'applicazione potrebbe risultare vulnerabile se:\n\n-   Manca\
          \ l'hardening di sicurezza appropriato in qualsiasi parte dello\n    stack\
          \ applicativo o permessi configurati in modo improprio sui servizi\n   \
          \ cloud.\n\n-   Sono abilitate o installate funzioni non necessarie (ad\
          \ es.\n    porte, servizi, pagine, account o privilegi non necessari).\n\
          \n-   Gli account di default sono ancora abilitati e presentano password\
          \ predefinite.\n\n-   A seguito di condizioni di errore, vengono rivelate\
          \ agli utenti stack traces o altri messaggi  di errore troppo verbosi.\n\
          \n-   Per i sistemi aggiornati, le ultime funzionalit\xE0 di sicurezza sono\
          \ disabilitate o\n    non configurate in modo adeguato.\n\n-   Le impostazioni\
          \ di sicurezza negli application server, nei framework\n    (ad esempio,\
          \ Struts, Spring, ASP.NET), nelle librerie, database, ecc. non sono configurate\
          \ su valori sicuri.\n\n-   Il server non invia header o direttive di sicurezza\
          \ o non sono impostati su valori sicuri.\n\n-   Il software non \xE8 aggiornato\
          \ o \xE8 vulnerabile (vedere [A06:2021-Vulnerable\n    and Outdated Components](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\
          \nSenza un processo coordinato e ripetibile per la configurazione della\
          \ sicurezza delle applicazioni, \ni sistemi presentano un rischio maggiore."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 20          | 19.84%             | 4.51%              | 8.12         \
          \        | 6.56                | 89.58%       | 44.84%       | 208,387 \
          \          | 789        |\n\n\n## How to prevent\n\nDovrebbero essere implementati\
          \ processi di installazione sicuri, tra cui:\n\n-   Un processo di hardening\
          \ ripetibile rende veloce e facile il deploy di\n    un altro ambiente preconfigurato\
          \ in modo sicuro. Gli ambienti di sviluppo,\n    QA e di produzione dovrebbero\
          \ essere tutti configurati in modo speculare, con credenziali diverse per\
          \ ogni ambiente.\n    Questo processo dovrebbe essere automatizzato per\
          \ minimizzare lo sforzo richiesto per\n    impostare un nuovo ambiente configurato\
          \ in modo sicuro.\n\n-   Una piattaforma minimale senza funzionalit\xE0\
          ,componenti,\n    documentazione ed esempi inutili. Rimuovere o non installare\
          \ funzionalit\xE0 e\n    framework inutilizzati.\n\n-   Un task per rivedere\
          \ e aggiornare le configurazioni appropriate a tutte le\n    security notes,\
          \ aggiornamenti e patch come parte del processo di gestione delle patch\n\
          \    (vedere [A06:2021-Vulnerable\n    and Outdated Components](A06_2021-Vulnerable_and_Outdated_Components.md)).\
          \ Revisionare\n    i permessi del cloud storage (ad esempio, i permessi\
          \ dei bucket S3).\n\n-   Un'architettura applicativa segmentata fornisce\
          \ un'efficace e sicura\n    separazione tra componenti o tenant, con segmentazione,\n\
          \    containerizzazione, o cloud security groups (ACL).\n\n-   L'invio di\
          \ direttive di sicurezza ai client, ad esempio, i Security Headers.\n\n\
          -   Un processo automatizzato per verificare l'efficacia delle\n    configurazioni\
          \ e impostazioni in tutti gli ambienti.\n\n\n## Example attack scenarios\n\
          \n**Scenario #1:** L'application server viene fornito con applicazioni di\
          \ esempio\nnon rimosse dal server di produzione. Queste applicazioni di\
          \ esempio hanno\nfalle di sicurezza note che gli attaccanti usano per compromettere\
          \ il server. Supponiamo che una\ndi queste applicazioni sia la console di\
          \ amministrazione e che gli account predefiniti non siano stati cambiati.\
          \ In questo caso, l'attaccante accede con le password predefinite e\nprende\
          \ il controllo.\n\n**Scenario #2:** La funzionalit\xE0 di directory listing\
          \ non \xE8 disabilitata sul server. Un\nattaccante scopre che si possono\
          \ elencare tutte le directory. L'attaccante trova\ne scarica le classi Java\
          \ compilate, su cui esegue la decompilazione e il reverse engineering per\
          \ visualizzare il codice sorgente. L'attaccante trova poi una grave\ndifetto\
          \ di controllo degli accessi nell'applicazione.\n\n**Scenario #3:** La configurazione\
          \ dell'application server permette di restituire agli utenti\nmessaggi di\
          \ errore dettagliati, ad esempio la stack trace. Questa problematica\npotenzialmente\
          \ espone informazioni sensibili o problematiche come\nversioni dei componenti\
          \ che sono note per essere vulnerabili.\n\n**Scenario #4:** Un cloud service\
          \ provider ha dei permessi di condivisione predefiniti\naperti a Internet\
          \ da altri utenti nell'header Content Security Policy (CSP). Questo permette\n\
          l'accesso ai dati sensibili memorizzati nel cloud storage.\n\n\nPer maggiori\
          \ informazioni sui riferimenti e sull'elenco delle CWE mappate: https://top10.owasp.org/2021/it/A05_2021-Security_Misconfiguration/"
