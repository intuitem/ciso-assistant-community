          \u307E\u3059\u3002\n\n-   \u30B3\u30F3\u30DD\u30FC\u30CD\u30F3\u30C8\u304C\
          \u65E2\u77E5\u306E\u8106\u5F31\u6027\u3092\u542B\u307E\u306A\u3044\u3053\
          \u3068\u3092\u691C\u8A3C\u3059\u308B\u305F\u3081\u306B\u3001OWASP Dependency\
          \ Check\u3084OWASP CycloneDX\u3068\u3044\u3063\u305F\u30BD\u30D5\u30C8\u30A6\
          \u30A7\u30A2\u30B5\u30D7\u30E9\u30A4\u30C1\u30A7\u30FC\u30F3\u30BB\u30AD\
          \u30E5\u30EA\u30C6\u30A3\u30C4\u30FC\u30EB\u304C\u4F7F\u7528\u3055\u308C\
          \u3066\u3044\u308B\u3053\u3068\u3092\u78BA\u8A8D\u3057\u307E\u3059\u3002\
          \n\n-   \u60AA\u610F\u306E\u3042\u308B\u30B3\u30FC\u30C9\u3084\u8A2D\u5B9A\
          \u304C\u30BD\u30D5\u30C8\u30A6\u30A7\u30A2\u30D1\u30A4\u30D7\u30E9\u30A4\
