          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 10          | 16.67 %             | 2.05 %              | 6.94       \
          \          | 7.94                | 75.04 %       | 45.35 %       | 47,972\
          \            | 1,152      |\n\n\n## How to prevent\n\n- Verwenden Sie digitale\
          \ Signaturen oder \xE4hnliche Mechanismen, um sicherzustellen, dass die\
          \ Software oder Daten aus der erwarteten Quelle stammen und nicht ver\xE4\
          ndert wurden.\n\n- Stellen Sie sicher, dass Bibliotheken und Abh\xE4ngigkeiten,\
          \ wie z. B. npm oder Maven, vertrauensw\xFCrdige Repositories nutzen. Wenn\
          \ Sie ein h\xF6heres Risikoprofil haben, sollten Sie in Erw\xE4gung ziehen,\
          \ ein internes Repository zu hosten, das als vertrauensw\xFCrdig gilt und\
          \ \xFCberpr\xFCft wurde.\n\n- Stellen Sie sicher, dass ein Software-Supply-Chain-Sicherheitstool\
          \ wie OWASP Dependency Check oder OWASP CycloneDX verwendet wird, um zu\
          \ \xFCberpr\xFCfen, dass Komponenten keine bekannten Schwachstellen enthalten.\n\
          \n- Stellen Sie sicher, dass es einen \xDCberpr\xFCfungsprozess f\xFCr Code-\
          \ und Konfigurations\xE4nderungen gibt, um das Risiko zu minimieren, dass\
          \ b\xF6sartiger Code oder b\xF6sartige Konfigurationen in Ihre Software-Pipeline\
          \ eingeschleust werden.\n\n- Stelle Sie sicher, dass Ihre CI/CD-Pipeline\
          \ \xFCber eine angemessene Trennung, Konfiguration und Zugriffskontrolle\
          \ verf\xFCgt, um die Integrit\xE4t des Codes zu gew\xE4hrleisten, der den\
          \ Build- und Bereitstellungsprozess durchl\xE4uft.\n\n- Stellen Sie sicher,\
          \ dass unsignierte oder unverschl\xFCsselte serialisierte Daten nicht an\
          \ nicht vertrauensw\xFCrdige Clients ohne eine Form der Integrit\xE4tspr\xFC\
          fung oder digitalen Signatur gesendet werden, um dadurch eine Manipulation\
          \ oder ein erneutes Versenden der serialisierten Daten zu erkennen.\n\n\n\
          ## Example attack scenarios\n\n**Szenario Nr. 1: Update ohne Signierung:**\
          \ Viele Heimrouter, Set-Top-Boxen, Ger\xE4te-Firmware und Andere verifizieren\
          \ Updates nicht \xFCber signierte Firmware. Unsignierte Firmware ist ein\
          \ wachsendes Ziel f\xFCr Angreifende, und es wird erwartet, dass es in Zukunft\
          \ noch schlimmer werden wird. Dies ist besonders besorgniserregend, da es\
          \ in vielen F\xE4llen keinen anderen Mechanismus zur Behebung gibt, als\
          \ die Fehler in einer zuk\xFCnftigen Version zu beheben und zu warten, bis\
          \ die vorherigen Versionen veraltet sind.\n\n**Szenario #2 SolarWinds b\xF6\
          sartiges Update**: Nationalstaaten sind daf\xFCr bekannt, dass sie Update-Mechanismen\
          \ angreifen. Ein bemerkenswerter Angriff war vor kurzem der SolarWinds-Orion-Angriff.\
          \ Das Unternehmen, das die Software entwickelt, verf\xFCgte \xFCber sichere\
          \ Build- und Update-Integrit\xE4tsprozesse. Dennoch konnten diese unterwandert\
          \ werden, und das Unternehmen verteilte \xFCber mehrere Monate hinweg ein\
          \ sehr gezieltes b\xF6sartiges Update an mehr als 18.000 Organisationen,\
          \ von denen etwa 100 betroffen waren. Dies ist eine der weitreichendsten\
          \ und bedeutendsten Sicherheitsverletzungen dieser Art in der Geschichte.\n\
          \n**Szenario #3 Unsichere Deserialisierung:** Eine React-Anwendung ruft\
          \ eine Reihe von Spring Boot Microservices auf. Als funktionale Programmierer\
          \ versuchten sie sicherzustellen, dass ihr Code unver\xE4nderlich ist. Die\
          \ L\xF6sung, die sie gefunden haben, besteht darin, den Sitzungszustand\
          \ zu serialisieren und ihn mit jeder Anfrage hin und her zu schicken. Eine\
          \ angreifende Person bemerkt die \"`rO0\" Java-Objektsignatur (in base64)\
          \ und verwendet das Java Serial Killer-Tool, um Remote-Code-Ausf\xFChrung\
          \ auf dem Anwendungsserver zu erlangen.\n\n\nWeitere Informationen zu den\
          \ Referenzen und zur Liste der zugeordneten CWEs: https://top10.owasp.org/2021/de/A08_2021-Software_and_Data_Integrity_Failures/"
      es:
        name: Fallas en el Software y en la Integridad de los Datos
        description: "Los fallos de integridad del software y de los datos est\xE1\
          n relacionados con c\xF3digo e infraestructura no protegidos contra alteraciones\
          \ (integridad). Ejemplos de esto son cuando una aplicaci\xF3n depende de\
          \ plugins, bibliotecas o m\xF3dulos de fuentes, repositorios o redes de\
          \ entrega de contenidos (CDN) no confiables.\nUn pipeline CI/CD inseguro\
          \ puede conducir a accesos no autorizados, la inclusi\xF3n de c\xF3digo\
          \ malicioso o el compromiso del sistema en general.\nAdem\xE1s, es com\xFA\
          n en la actualidad que las aplicaciones implementen funcionalidades de actualizaci\xF3\
          n, a trav\xE9s de las cuales se descargan nuevas versiones de la misma sin\
          \ las debidas verificaciones integridad que fueron realizadas previamente\
          \ al instalar la aplicaci\xF3n. Los atacantes potencialmente pueden cargar\
          \ sus propias actualizaciones para que sean distribuidas y ejecutadas en\
          \ todas las instalaciones. Otro ejemplo es cuando objetos o datos son codificados\
          \ o serializados en estructuras que un atacante puede ver y modificar, produci\xE9\
          ndose una deserializaci\xF3n insegura."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom | Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 10          | 16.67%             | 2.05%              | 6.94         \
          \        | 7.94                | 75.04%       | 45.35%       | 47,972  \
          \          | 1,152      |\n\n\n## How to prevent\n\n-   Utilice firmas digitales\
          \ o mecanismos similares para verificar que el software o datos provienen\
          \ efectivamente de la fuente esperada y no fueron alterados.\n\n-   Aseg\xFA\
          rese que las bibliotecas y dependencias, tales como npm o maven son utilizadas\
          \ desde repositorios confiables. Si su perfil de riesgo es alto, considere\
          \ alojarlas en un repositorio interno cuyo contenido ha sido previamente\
          \ analizado.\n\n-   Aseg\xFArese que se utilice una herramienta de an\xE1\
          lisis de componentes de terceros, c\xF3mo OWASP Dependency Check u OWASP\
          \ CycloneDX, con el fin de verificar la ausencia de vulnerabilidades conocidas.\n\
          \n-   Aseg\xFArese que se utilice un proceso de revisi\xF3n de cambios de\
          \ c\xF3digo y configuraciones para minimizar las posibilidades de que c\xF3\
          digo o configuraciones maliciosas sean introducidos en su pipeline.\n\n\
          -   Aseg\xFArese que su pipeline CI/CD posee adecuados controles de acceso,\
          \ segregaci\xF3n y configuraciones que permitan asegurar la integridad del\
          \ c\xF3digo a trav\xE9s del proceso de build y despliegue.\n\n-   Aseg\xFA\
          rese que datos sin cifrar o firmar no son enviados a clientes no confiables\
          \ sin alguna forma de verificaci\xF3n de integridad o firma electr\xF3nica\
          \ con el fin de detectar modificaciones o la reutilizaci\xF3n de datos previamente\
          \ serializados. \n\n\n## Example attack scenarios\n\n**Escenario #1 Actualizaciones\
          \ no firmadas:** Muchos routers dom\xE9sticos, decodificadores de televisi\xF3\
          n, firmware de dispositivos, entre otros, no verifican las firmas de sus\
          \ actualizaciones de firmware. El firmware sin firmar es un objetivo creciente\
          \ para los atacantes y se espera que empeore. Esto es una gran preocupaci\xF3\
          n, ya que muchas veces no existe otro mecanismo para remediarlo que corregirlo\
          \ en una versi\xF3n futura y esperar a que las versiones anteriores caduquen.\n\
          \n**Escenario #2 Actualizaci\xF3n maliciosa de SolarWinds:** Se sabe que\
          \ los Estados-Naciones utilizan como vector de ataque los mecanismos de\
          \ actualizaci\xF3n, siendo un caso reciente de p\xFAblica notoriedad el\
          \ sufrido por SolarWinds Orion. La compa\xF1\xEDa que desarrolla el software\
          \ pose\xEDa procesos seguros de construcci\xF3n y mecanismos de integridad\
          \ en sus actualizaciones. Sin embargo, estos fueron comprometidos y, durante\
          \ varios meses, la firma distribuy\xF3 una actualizaci\xF3n maliciosa a\
          \ m\xE1s de 18.000 organizaciones, de las cuales alrededor de un centenar\
          \ se vieron afectadas. Se trata de una de las brechas de este tipo de mayor\
          \ alcance y m\xE1s importantes de la historia.\n\n**Escenario #3 Deserializaci\xF3\
          n insegura:** Una aplicaci\xF3n *React* utiliza un conjunto de microservicios\
          \ implementados en Spring Boot. Trat\xE1ndose de programadores funcionales,\
          \ intentaron asegurarse de que su c\xF3digo fuera inmutable. La soluci\xF3\
          n implementada consisti\xF3 en serializar el estado de la sesi\xF3n para\
          \ el usuario y enviarlo entre los componentes con cada solicitud. Un atacante\
          \ advierte el uso de un objeto Java serializado y codificado en base64 (identifica\
          \ un string que comienza con \"rO0\") y utiliza la herramienta *Java Serial\
          \ Killer* para obtener una ejecuci\xF3n remota de c\xF3digo en el servidor\
          \ de aplicaci\xF3n.\n\n\nPara obtener m\xE1s informaci\xF3n sobre las referencias\
          \ y la lista de CWE asociadas: https://top10.owasp.org/2021/es/A08_2021-Software_and_Data_Integrity_Failures/"
      fr:
        name: "Manque d'int\xE9grit\xE9 des donn\xE9es et du logiciel"
        description: "Les d\xE9faillances de l'int\xE9grit\xE9 des logiciels et des\
          \ donn\xE9es sont li\xE9es au code et \xE0 l'infrastructure qui ne sont\
          \ pas prot\xE9g\xE9s contre les violations de l'int\xE9grit\xE9. C'est le\
          \ cas, par exemple, lorsqu'une application s'appuie sur des plugins, des\
          \ biblioth\xE8ques ou des modules provenant de sources, de d\xE9p\xF4ts\
          \ et de r\xE9seaux de diffusion de contenu (CDN) non fiables. Un pipeline\
          \ CI/CD non s\xE9curis\xE9 peut introduire un risque d'acc\xE8s non autoris\xE9\
          , de code malveillant ou de compromission du syst\xE8me. Enfin, de nombreuses\
          \ applications int\xE8grent d\xE9sormais une fonctionnalit\xE9 de mise \xE0\
          \ jour automatique, o\xF9 les mises \xE0 jour sont t\xE9l\xE9charg\xE9es\
          \ sans v\xE9rification d'int\xE9grit\xE9 suffisante et appliqu\xE9es \xE0\
          \ l'application pr\xE9c\xE9demment fiable. Les attaquants pourraient potentiellement\
          \ t\xE9l\xE9charger leurs propres mises \xE0 jour pour les distribuer et\
          \ les ex\xE9cuter sur toutes les installations. Un autre exemple est celui\
          \ des objets ou des donn\xE9es qui sont cod\xE9s ou s\xE9rialis\xE9s dans\
          \ une structure qu'un attaquant peut voir et modifier et qui sont vuln\xE9\
          rables \xE0 une d\xE9s\xE9rialisation non s\xE9curis\xE9e."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       10       |       16,67 %        |         2,05 %         |     \
          \        6,94              |         7,94         |    75,04 %     |   \
          \   45,35 %       |           47 972           |        1 152         |\n\
          \n\n## How to prevent\n\n-   utilisez des signatures num\xE9riques ou des\
          \ m\xE9canismes similaires pour v\xE9rifier que le logiciel ou les donn\xE9\
          es proviennent de la source pr\xE9vue et n'ont pas \xE9t\xE9 modifi\xE9\
          s ;\n-   assurez-vous que les biblioth\xE8ques et les d\xE9pendances, telles\
          \ que npm ou Maven, consomment des d\xE9p\xF4ts de confiance. Si vous avez\
          \ un profil de risque plus \xE9lev\xE9, envisagez d'h\xE9berger un d\xE9\
          p\xF4t interne connu et approuv\xE9 ;\n-   assurez-vous qu'un outil de s\xE9\
          curit\xE9 de la cha\xEEne logistique logicielle, tel que OWASP Dependency\
          \ Check ou OWASP CycloneDX, est utilis\xE9 pour v\xE9rifier que les composants\
          \ ne contiennent pas de vuln\xE9rabilit\xE9s connues ;\n-   veillez \xE0\
          \ ce qu'il existe un processus de r\xE9vision des changements de code et\
          \ de configuration afin de minimiser les risques d'introduction de code\
          \ ou de configuration malveillants dans votre pipeline logiciel ;\n-   assurez-vous\
          \ que votre pipeline CI/CD dispose d'une s\xE9gr\xE9gation, d'une configuration\
          \ et d'un contr\xF4le d'acc\xE8s appropri\xE9s pour garantir l'int\xE9grit\xE9\
          \ du code passant par les processus de construction et de d\xE9ploiement\
          \ ;\n-   veillez \xE0 ce que les donn\xE9es s\xE9rialis\xE9es non sign\xE9\
          es ou non chiffr\xE9es ne soient pas envoy\xE9es \xE0 des clients non fiables\
          \ sans une forme de contr\xF4le d'int\xE9grit\xE9 ou de signature num\xE9\
          rique permettant de d\xE9tecter la falsification ou le rejeu des donn\xE9\
          es s\xE9rialis\xE9es.\n\n\n## Example attack scenarios\n\n**Sc\xE9nario\
          \ n\xB01 mise \xE0 jour sans signature :** de nombreux routeurs domestiques,\
          \ d\xE9codeurs, firmwares de p\xE9riph\xE9riques et autres ne v\xE9rifient\
          \ pas les mises \xE0 jour via un firmware sign\xE9. Les microprogrammes\
          \ non sign\xE9s constituent une cible de plus en plus importante pour les\
          \ attaquants et leur nombre ne devrait cesser d'augmenter. Il s'agit d'une\
          \ pr\xE9occupation majeure car, bien souvent, il n'y a pas de m\xE9canisme\
          \ pour y rem\xE9dier, si ce n'est de corriger dans une version future et\
          \ d'attendre que les versions pr\xE9c\xE9dentes soient p\xE9rim\xE9es.\n\
          \n**Sc\xE9nario n\xB02 mise \xE0 jour malveillante de SolarWinds :** les\
          \ \xC9tats-nations sont connus pour attaquer les m\xE9canismes de mise \xE0\
          \ jour, avec une attaque r\xE9cente notable, l'attaque SolarWinds Orion.\
          \ La soci\xE9t\xE9 qui d\xE9veloppe le logiciel a mis en place des processus\
          \ s\xE9curis\xE9s de construction et d'int\xE9grit\xE9 des mises \xE0 jour.\
          \ N\xE9anmoins, ces processus ont pu \xEAtre contourn\xE9s et, pendant plusieurs\
          \ mois, la soci\xE9t\xE9 a distribu\xE9 une mise \xE0 jour malveillante\
          \ tr\xE8s cibl\xE9e \xE0 plus de 18 000 organisations, dont une centaine\
          \ ont \xE9t\xE9 touch\xE9es. Il s'agit de l'une des violations de cette\
          \ nature les plus \xE9tendues et les plus importantes de l'histoire.\n\n\
          **Sc\xE9nario n\xB03 d\xE9s\xE9rialisation non s\xE9curis\xE9e :** une application\
          \ React appelle un ensemble de microservices Spring Boot. \xC9tant des programmeurs\
          \ fonctionnels, ils ont essay\xE9 de s'assurer que leur code est immuable.\
          \ La solution qu'ils ont trouv\xE9e consiste \xE0 s\xE9rialiser l'\xE9tat\
          \ de l'utilisateur et \xE0 le transmettre dans les deux sens \xE0 chaque\
          \ requ\xEAte. Un attaquant remarque la signature d'objet Java \"rO0\" (en\
          \ base64) et utilise l'outil Java Serial Killer pour obtenir l'ex\xE9cution\
          \ de code \xE0 distance sur le serveur d'application.\n\n\nPour plus d\u2019\
          informations sur les r\xE9f\xE9rences et la liste des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A08_2021-Software_and_Data_Integrity_Failures/"
      id:
        name: Kegagalan Integritas Data dan Perangkat Lunak
        description: '_Software and data integrity failures relate to code and infrastructure
          that does not protect against integrity violations. An example of this is
          where an application relies upon plugins, libraries, or modules from untrusted
          sources, repositories, and content delivery networks (CDNs). An insecure
          CI/CD pipeline can introduce the potential for unauthorized access, malicious
          code, or system compromise. Lastly, many applications now include auto-update
          functionality, where updates are downloaded without sufficient integrity
          verification and applied to the previously trusted application. Attackers
          could potentially upload their own updates to be distributed and run on
          all installations. Another example is where objects or data are encoded
          or serialized into a structure that an attacker can see and modify is vulnerable
          to insecure deserialization._


          Gagalnya Menjaga Integritas Data dan Perangkat Lunak disebabkan oleh kode
          dan infrastruktur yang tidak mencegah terjadinya pelanggaran integritas.

          Contohnya sebuah objek/data yang telah di enkoding/diserialisasi di dalam
          struktur yang dapat dilihat dan dimodifikasi oleh penyerang rentan terhadap
          deserialisasi yang tidak aman.


          Contoh lainnya adalah aplikasi yang bergantung pada *plugins*, *libraries*,
          atau *modules* yang asalnya dari sumber yang tidak dipercaya, repositori
          - repositori, *Content Delivery Network (CDNs)*.

          *CI/CD Pipeline* yang tidak aman dapat menyebabkan munculnya akses illegal/tidak
          sah, kode yang berbahaya, atau kerusakan sistem.


          Terakhir, aplikasi sekarang banyak yang memiliki fitur pembaharuan otomatis,
          yang dimana pembaharuan - pembaharuan yang ada diunduh tanpa adanya verifikasi
          integritas dan diterapkan/digunakan terhadap aplikasi yang sebelumnya terpercaya.

          Penyerang memiliki kemungkinan besar untuk mengunggah pembaharuan milik
          mereka sendiri untuk di distribusikan dan dijalankan/diterapkan pada semua
          instalasi/pembaharuan.'
        annotation: '## Score table


          | Klasifikasi CWE | Tingkat Kejadian Maksimum | Rata-rata Tingkat Kejadian
          | Cakupan Maksimum | Rata-rata Cakupan | Rata-rata Bobot Exploitasi | Rata-rata
          Bobot Dampak | Total Kejadian | Total CVEs |

          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|

          | 10          | 16.67%             | 2.05%              | 75.04%       |
          45.35%       | 6.94                 | 7.94                | 47,972            |
          1,152      |



          ## How to prevent


          - Gunakan tanda tangan digital atau mekanisme yang sama untuk memverifikasi
          bahwa perangkat lunak atau data berasal dari sumber yang diharapkan dan
          tidak di manipulasi.


          - Pastikan *libaries* dan dependensi seperti npm atau Maven menggunakan
          repositori yang terpercaya. Apabila anda merupakan target berisiko tinggi,
          pertimbangkan untuk hos repositori yang dikenal baik dan sudah di periksa
          kepercayaannya.


          - Pastikan alat keamanan rantai pasokan perangkat lunak, seperti OWASP Dependency
          Check atau OWASP CycloneDX digunakan untuk memverifikasi bahwa komponen
          komponen tersebut tidak memiliki kerentanan yang sudah diketahui.


          - Pastikan adanya proses review ketika mengubah kode dan konfigurasi untuk
          meminimalisir kemungkinan kode atau konfigurasi berbahaya masuk ke dalam
          *pipeline* perangkat lunak anda.


          - Pastikan *CI/CD pipeline* anda memiliki metode pemisahan, konfigurasi
          dan akses kontrol yang tepat untuk memastikan integritas kode yang masuk
          mulai dari proses *build* / pembangunan hinga proses *deployment* / penyebaran
          perangkat lunak.


          - Pastikan data yang belum di tanda tangani atau tidak terenkripsi ini tidak
          terkirim ke klien yang tidak dipercaya tanpa adanya pengecekan integritas
          atau tanda tangan digital untuk mendeteksi apakah data telah di manipulasi
          atau pemutaran ulang data yang telah di serialisasi.



          ## Example attack scenarios


          **Skenario #1 Pembaharuan tanpa tanda tangan**: Mayoritas dari router rumahan,
          decoder, firmware perangkat, dan perangkat lainnya tidak memverifikasi pembaharuan
          lewat firmware yang telah di tandatangani/sudah valid.

          Firmware yang tidak ditandatangani / tidak valid merupakan target yang menarik
          bagi penyerang dan diperkirakan daya tariknya semakin lama akan semakin
          tinggi

          Hal ini merupakan persoalan/ancaman yang cukup besar karena seringkali tidak
          ada mekanisme untuk memulihkan/memperbaiki selain memperbaikinya menggunakan
          versi firmware yang baru dan menunggu versi firmware sebelumnya kadaluarsa.



          **Skenario #2 Pembaharuan berbahaya SolarWinds**: Serangan siber bertingkat
          nasional atau serangan yang melibatkan suatu negara / bangsa terkenal dengan
          serangannya terhadap mekanisme pembaharuan, **SolarWinds Orion attack**
          merupakan salah satu serangan bertingkat nasional yang patut diperhatikan.
          Perlu diketahui perusahaan yang mengembangkan SolarWinds memiliki proses
          pembaharuan yang berintegritas atau aman dan proses pembuatan perangkat
          lunak yang aman. Meskipun demikian proses yang aman ini masih dapat di tumbangkan
          atau diganggu, dan selama beberapa bulan perusahaan ini mendistribusikan
          pembaharuan berbahaya yang ditargetkan ke lebih dari 18.000 organisasi,
          sekitar 100 atau lebih organisasi terkena dampak dari pembaharuan ini.

          Insiden ini termasuk salah satu insiden yang konsekuensi nya dapat berpengaruh
          besar, mempengaruhi banyak hal dan salah satu insiden yang paling signifikan
          dalam sejarah **Gagalnya Menjaga Integritas Data dan Perangkat Lunak**.


          **Skenario #3 Deserialisasi Yang Tidak Aman**: Aplikasi React memanggil
          satu set layanan mikro Spring Boot. Sebagai programmer fungsional, mereka
          mencoba memastikan bahwa kode mereka tidak dapat diubah. Solusi yang mereka
          hasilkan adalah membuat serial status pengguna dan meneruskannya bolak-balik
          dengan setiap permintaan. Seorang penyerang memperhatikan tanda tangan objek
          Java "R00", dan menggunakan alat Pembunuh Serial Java untuk mendapatkan
          eksekusi kode jarak jauh pada server aplikasi.



          Untuk informasi lebih lanjut tentang referensi dan daftar CWE yang dipetakan:
          https://top10.owasp.org/2021/id/A08_2021-Software_and_Data_Integrity_Failures/'
      it:
        name: Software and Data Integrity Failures
        description: "Le problematiche dell'integrit\xE0 del software e dei dati riguardano\
          \ il codice e l'infrastruttura\nche non ne verificano adeguatamente l'integrit\xE0\
          . Un esempio \xE8 quando un'applicazione si affida a plugin, librerie o\
          \ moduli da fonti, repository e content delivery network (CDN) non attendibili.\n\
          Una pipeline CI/CD insicura pu\xF2 aprire la porta ad accessi non autorizzati,\
          \ codice dannoso o compromissione completa del sistema.\nInfine, molte applicazioni\
          \ ora includono funzionalit\xE0 di auto-aggiornamento, dove gli\naggiornamenti\
          \ vengono scaricati senza una sufficiente verifica dell'integrit\xE0 e\n\
          applicati all'applicazione. Gli attaccanti potrebbero\npotenzialmente caricare\
          \ i propri aggiornamenti malevoli da distribuire e da eseguire su tutte\
          \ le\ninstallazioni. Un altro esempio \xE8 la deserializzazione insicura,\
          \ quando gli\noggetti o i dati sono codificati o serializzati in una struttura\
          \ che un\nattaccante pu\xF2 ispezionare e modificare liberamente."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 10          | 16.67%             | 2.05%              | 6.94         \
          \        | 7.94                | 75.04%       | 45.35%       | 47,972  \
          \          | 1,152      |\n\n\n## How to prevent\n\n-   Usare firme digitali\
          \ o meccanismi equivalenti per verificare che il software o i dati provengano\
          \ dalla fonte prevista e non siano stati alterati.\n\n-   Assicurarsi che\
          \ le librerie e le dipendenze, come npm o Maven, siano collegati a repository\
          \ affidabili. Se avete un profilo di rischio pi\xF9 alto, considerate l'hosting\
          \ di un repository interno ben conosciuto e controllato.\n\n-   Assicuratevi\
          \ che venga usato uno strumento di sicurezza della supply chain del software,\
          \ come OWASP\n    Dependency Check o OWASP CycloneDX, per verificare che\
          \ i componenti non contengano vulnerabilit\xE0 note\n\n-   Assicurarsi che\
          \ ci sia un processo di revisione per le modifiche al codice e alla configurazione\
          \ per ridurre al minimo la possibilit\xE0 che codice o configurazione dannosi\
          \ vengano introdotti nella pipeline del software.\n\n-   Assicurarsi che\
          \ la pipeline CI/CD sia adeguatamente segregata, configurata adeguatamente\
          \ e sia presente un meccanismo di controllo degli accessi per assicurare\
          \ l'integrit\xE0 del codice che passa attraverso i processi di compilazione\
          \ e distribuzione.\n\n-   Assicuratevi che i dati serializzati non firmati\
          \ o non crittografati non vengano inviati a\n    client non fidati senza\
          \ qualche forma di controllo dell'integrit\xE0 o firma digitale\n    per\
          \ rilevare la manomissione o il replay dei dati serializzati.\n\n\n## Example\
          \ attack scenarios\n\n**Scenario #1 Aggiornamenti senza firma:** Molti router\
          \ domestici, set-top box, \ne altri dispositivi non verificano gli aggiornamenti\
          \ attraverso una\nfirma. Il firmware non firmato \xE8 sempre pi\xF9 spesso\
          \ un obiettivo per gli attaccanti e \nquesto \xE8 un trend che sembra non\
          \ essere destinato a cessare. Questa \xE8 una problematica rilevante in\
          \ quanto molte volte \nnon \xE8 presente alcun meccanismo per rimediare\
          \ se non quello di correggere in una versione futura e\naspettare che le\
          \ versioni precedenti invecchino.\n\n**Scenario #2 Aggiornamento malevolo\
          \ di SolarWinds**: Gli stati-nazione sono sempre stati noti \nper perpetrare\
          \ attacchi verso i meccanismi di aggiornamento, con un recente e degno di\
          \ nota attacco\na SolarWinds Orion. L'azienda che sviluppa il software aveva\
          \ \nprocessi per svolgere le build in modo sicuro e controlli sull'integrit\xE0\
          \ degli aggiornamenti. \nTuttavia, questi controlli sono violati e per parecchi\
          \ mesi l'azienda distribu\xEC un aggiornamento malevolo altamente mirato\n\
          a pi\xF9 di 18,000 organizzazioni, delle quali, circa 100 sono state infettate.\
          \ Questo \xE8 uno dei breach di questa natura di pi\xF9 ampia portata e\
          \ pi\xF9 significativo nella storia.\n\n**Scenario #3 Deserializzazione\
          \ insicura:** Un'applicazione React chiama un\ninsieme di microservizi Spring\
          \ Boot. Essendo stata scritta nel paradigma funzionale, \ngli sviluppatori\
          \ hanno cercato di garantire l'immutabilit\xE0 del codice. La soluzione\
          \ che hanno trovato\n\xE8 serializzare lo stato dell'utente e passarlo avanti\
          \ e indietro ad\nogni richiesta. Un attaccante nota la firma dell'oggetto\
          \ Java \"rO0\" (in base64) e\nusa lo strumento Java Serial Killer per ottenere\
          \ esecuzione di codice remoto sul\nserver dell'applicazione.\n\n\nPer maggiori\
          \ informazioni sui riferimenti e sull'elenco delle CWE mappate: https://top10.owasp.org/2021/it/A08_2021-Software_and_Data_Integrity_Failures/"
