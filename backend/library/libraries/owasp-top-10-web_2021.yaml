          \u30FC\u30B7\u30E7\u30F3\u4E0A\u304B\u3089\u30EA\u30E2\u30FC\u30C8\u306E\
          \u30EA\u30BD\u30FC\u30B9\u3092\u53D6\u5F97\u3059\u308B\u969B\u306B\u3001\
          \u30E6\u30FC\u30B6\u30FC\u304B\u3089\u63D0\u4F9B\u3055\u308C\u305FURL\u3092\
          \u691C\u8A3C\u305B\u305A\u306B\u4F7F\u7528\u3059\u308B\u3053\u3068\u3067\
