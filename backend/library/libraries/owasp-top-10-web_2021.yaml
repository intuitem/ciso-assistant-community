          ## How to prevent\n\n- \u5EFA\u7ACB\u4E0E\u4F7F\u7528\u5B89\u5168\u5F00\u53D1\
          \u751F\u547D\u5468\u671F\u5E76\u4E14\u534F\u540C\u5E94\u7528\u7A0B\u5F0F\
          \u5B89\u5168\u7684\u4E13\u4E1A\u4EBA\u58EB\u6765\u8BC4\u4F30\u4E0E\u8BBE\
          \u8BA1\u5B89\u5168\u4E0E\u9690\u79C1\u76F8\u5173\u7684\u63A7\u5236\u63AA\
          \u65BD\u3002\n\n- \u5EFA\u7ACB\u4E0E\u4F7F\u7528\u5B89\u5168\u8BBE\u8BA1\
          \u6A21\u5F0F\u7684\u51FD\u5F0F\u5E93\u6216\u662F\u5DF2\u5B8C\u6210\u53EF\
          \u4F7F\u7528\u7684\u5143\u4EF6\u3002\n\n- \u4F7F\u7528\u5A01\u80C1\u5EFA\
          \u6A21\u5728\u5173\u952E\u7684\u8BA4\u8BC1\u3001\u5B58\u53D6\u63A7\u5236\
          \u3001\u5546\u4E1A\u903B\u8F91\u4E0E\u5173\u952E\u7F3A\u9677\u4E0A\u3002\
          \n\n- \u64B0\u5199\u5355\u5143\u6D4B\u8BD5\u4E0E\u6574\u5408\u6D4B\u8BD5\
          \u6765\u9A8C\u8BC1\u6240\u6709\u7684\u5173\u952E\u6D41\u7A0B\u5BF9\u5A01\
          \u80C1\u5EFA\u6A21\u90FD\u6709\u62B5\u6297\u3002\n\n\n## Example attack\
          \ scenarios\n\n**\u60C5\u5883 #1** \u51ED\u8BC1\u6062\u590D\u7684\u6D41\u7A0B\
          \u6216\u8BB8\u4F1A\u5305\u542B\u201C\u95EE\u9898\u4E0E\u7B54\u6848\u201D\
          \uFF0C\u8BE5\u65B9\u5F0F\u662F\u88AB NIST 800-63b\u3001OWASP ASVS \u4E0E\
          \ WASP Top 10 \u4E2D\u7981\u6B62\u3002 \u201C\u95EE\u9898\u4E0E\u7B54\u6848\
          \u201D\u65E0\u6CD5\u88AB\u4F5C\u4E3A\u4FE1\u4EFB\u8EAB\u4EFD\u7684\u8BC1\
          \u636E\u56E0\u4E3A\u4E0D\u6B62\u4E00\u4E2A\u4EBA\u53EF\u80FD\u4F1A\u77E5\
          \u9053\u7B54\u6848\uFF0C\u56E0\u6B64\u8FD9\u4E2A\u65B9\u6CD5\u4F1A\u88AB\
          \u7981\u6B62\u7684\u539F\u56E0\u3002\u56E0\u6B64\u6B64\u7C7B\u7684\u7A0B\
          \u5F0F\u7801\u5E94\u8BE5\u88AB\u79FB\u9664\u6216\u662F\u7528\u66F4\u5B89\
          \u5168\u7684\u8BBE\u8BA1\u6765\u66FF\u4EE3\u3002\n\n**\u60C5\u5883 #2:**\
          \ \u7535\u5F71\u9662\u5728\u8981\u6C42\u62BC\u91D1\u524D\u5141\u8BB8\u56E2\
          \u4F53\u9884\u8BA2\u6298\u6263\u5E76\u4E14\u6700\u591A\u6709 15 \u540D\u89C2\
          \u4F17\u3002\u653B\u51FB\u8005\u53EF\u4EE5\u5A01\u80C1\u6A21\u578B\u6B64\
          \u6D41\u7A0B\u5E76\u6D4B\u8BD5\u4ED6\u4EEC\u5728\u4E00\u6B21\u8BF7\u6C42\
          \u4E2D\u662F\u5426\u53EF\u4EE5\u9884\u8BA2 600 \u4E2A\u5EA7\u4F4D\u548C\u7684\
          \u6240\u6709\u7535\u5F71\u9662\uFF0C\u5BFC\u81F4\u7535\u5F71\u9662\u5DE8\
          \u5927\u7684\u6536\u5165\u635F\u5931\u3002\n\n**\u60C5\u5883 #3:** \u8FDE\
          \u9501\u96F6\u552E\u7684\u7535\u5B50\u5546\u52A1\u7F51\u7AD9\u6CA1\u6709\
          \u4FDD\u62A4\u673A\u5236\u6765\u5BF9\u6297\u9EC4\u725B\u7684\u673A\u5668\
          \u4EBA\u8D2D\u4E70\u9AD8\u7AEF\u7684\u663E\u793A\u5361\u518D\u8F6C\u552E\
          \u5230\u62CD\u5356\u7F51\u7AD9\u3002\u5BF9\u4E8E\u96F6\u552E\u5546\u4E0E\
          \u663E\u793A\u5361\u5236\u9020\u5546\u4EA7\u751F\u4E86\u53EF\u6015\u7684\
          \u5BA3\u4F20\u6548\u5E94\u5E76\u4E14\u5BFC\u81F4\u4E0E\u90A3\u4E9B\u65E0\
          \u6CD5\u8D2D\u4E70\u5230\u663E\u5361\u7684\u7231\u597D\u8005\u95F4\u4EA7\
          \u751F\u4E86\u4E0D\u6109\u5FEB\u3002\u5DE7\u5999\u7684\u9632\u673A\u5668\
          \u4EBA\u8BBE\u8BA1\u4E0E\u9886\u57DF\u903B\u8F91\u89C4\u5219\uFF0C\u4F8B\
          \u5982\u77ED\u6682\u51E0\u79D2\u7684\u8D2D\u4E70\u65F6\u95F4\u6216\u8BB8\
          \u53EF\u4EE5\u8FA8\u8BC6\u51FA\u4E0D\u53EF\u4FE1\u8D56\u7684\u8D2D\u4E70\
          \u5E76\u4E14\u62D2\u7EDD\u8BE5\u4EA4\u6613\u3002\n\n\n\u6709\u95DC\u53C3\
          \u8003\u8CC7\u6599\u53CA\u5DF2\u5C0D\u61C9 CWE \u6E05\u55AE\u7684\u66F4\u591A\
          \u8CC7\u8A0A\uFF1A https://top10.owasp.org/2021/zh-Hant/A04_2021-Insecure_Design/"
  - urn: urn:intuitem:risk:threat:a05
    ref_id: A05:2021
    name: Security Misconfiguration
    description: "The application might be vulnerable if the application is:\n\n-\
      \   Missing appropriate security hardening across any part of the\n    application\
      \ stack or improperly configured permissions on cloud\n    services.\n\n-  \
      \ Unnecessary features are enabled or installed (e.g., unnecessary\n    ports,\
      \ services, pages, accounts, or privileges).\n\n-   Default accounts and their\
      \ passwords are still enabled and\n    unchanged.\n\n-   Error handling reveals\
      \ stack traces or other overly informative\n    error messages to users.\n\n\
      -   For upgraded systems, the latest security features are disabled or\n   \
      \ not configured securely.\n\n-   The security settings in the application servers,\
      \ application\n    frameworks (e.g., Struts, Spring, ASP.NET), libraries, databases,\n\
      \    etc., are not set to secure values.\n\n-   The server does not send security\
      \ headers or directives, or they are\n    not set to secure values.\n\n-   The\
      \ software is out of date or vulnerable (see [A06:2021-Vulnerable\n    and Outdated\
      \ Components](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\nWithout a\
      \ concerted, repeatable application security configuration\nprocess, systems\
      \ are at a higher risk."
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 20          | 19.84%             | 4.51%              | 8.12             \
      \    | 6.56                | 89.58%       | 44.84%       | 208,387         \
      \  | 789        |\n\n\n## How to prevent\n\nSecure installation processes should\
      \ be implemented, including:\n\n-   A repeatable hardening process makes it\
      \ fast and easy to deploy\n    another environment that is appropriately locked\
      \ down. Development,\n    QA, and production environments should all be configured\n\
      \    identically, with different credentials used in each environment.\n   \
      \ This process should be automated to minimize the effort required to\n    set\
      \ up a new secure environment.\n\n-   A minimal platform without any unnecessary\
      \ features, components,\n    documentation, and samples. Remove or do not install\
      \ unused features\n    and frameworks.\n\n-   A task to review and update the\
      \ configurations appropriate to all\n    security notes, updates, and patches\
      \ as part of the patch management\n    process (see [A06:2021-Vulnerable\n \
      \   and Outdated Components](A06_2021-Vulnerable_and_Outdated_Components.md)).\
      \ Review\n    cloud storage permissions (e.g., S3 bucket permissions).\n\n-\
      \   A segmented application architecture provides effective and secure\n   \
      \ separation between components or tenants, with segmentation,\n    containerization,\
      \ or cloud security groups (ACLs).\n\n-   Sending security directives to clients,\
      \ e.g., Security Headers.\n\n-   An automated process to verify the effectiveness\
      \ of the\n    configurations and settings in all environments.\n\n\n## Example\
      \ attack scenarios\n\n**Scenario #1:** The application server comes with sample\
      \ applications\nnot removed from the production server. These sample applications\
      \ have\nknown security flaws attackers use to compromise the server. Suppose\
      \ one\nof these applications is the admin console, and default accounts weren't\n\
      changed. In that case, the attacker logs in with default passwords and\ntakes\
      \ over.\n\n**Scenario #2:** Directory listing is not disabled on the server.\
      \ An\nattacker discovers they can simply list directories. The attacker finds\n\
      and downloads the compiled Java classes, which they decompile and\nreverse engineer\
      \ to view the code. The attacker then finds a severe\naccess control flaw in\
      \ the application.\n\n**Scenario #3:** The application server's configuration\
      \ allows detailed\nerror messages, e.g., stack traces, to be returned to users.\
      \ This\npotentially exposes sensitive information or underlying flaws such as\n\
      component versions that are known to be vulnerable.\n\n**Scenario #4:** A cloud\
      \ service provider (CSP) has default sharing\npermissions open to the Internet\
      \ by other CSP users. This allows\nsensitive data stored within cloud storage\
      \ to be accessed.\n\n\nFor more information about the references and the list\
      \ of mapped CWEs: https://top10.owasp.org/2021/A05_2021-Security_Misconfiguration/"
    translations:
      ar:
        name: "\u0627\u0644\u0625\u0639\u062F\u0627\u062F\u0627\u062A \u0627\u0644\
          \u0623\u0645\u0646\u064A\u0629 \u0627\u0644\u062E\u0627\u0637\u0626\u0629"
        description: "\u0645\u0646 \u0627\u0644\u0645\u062D\u062A\u0645\u0644 \u0627\
          \u0646 \u064A\u0643\u0648\u0646 \u0627\u0644\u062A\u0637\u0628\u064A\u0642\
          \ \u0636\u0639\u064A\u0641 \u0627\u0645\u0646\u064A\u0627\u064B \u0625\u0630\
          \u0627 \u0627\u062D\u062A\u0648\u0649 \u0639\u0644\u0649 \u0627\u0644\u0646\
          \u0642\u0627\u0637 \u0627\u0644\u062A\u0627\u0644\u064A\u0629:\n\n-   \u0639\
          \u062F\u0645 \u0645\u0631\u0627\u062C\u0639\u0629 \u0627\u0644\u062A\u0643\
          \u0648\u064A\u0646 \u0648\u0627\u0644\u0636\u0628\u0637 \u0627\u0644\u0622\
          \u0645\u0646 \u0644\u0625\u0639\u062F\u0627\u062F\u0627\u062A \u0627\u0644\
          \u062A\u0637\u0628\u064A\u0642 \u0623\u0648 \u0641\u064A \u0623\u064A \u062C\
          \u0632\u0621 \u0645\u0646 \u0623\u062C\u0632\u0627\u0621 \u0627\u0644\u062A\
          \u0637\u0628\u064A\u0642 \u0623\u0648 \u062A\u0643\u0648\u064A\u0646 \u0623\
          \u0630\u0648\u0646\u0627\u062A \u062E\u0627\u0637\u0626\u0629 \u0641\u064A\
          \ \u0627\u0644\u062E\u062F\u0645\u0627\u062A \u0627\u0644\u0633\u062D\u0627\
          \u0628\u064A\u0651\u0629.\n\n-   \u062A\u062B\u0628\u064A\u062A \u0648\u0625\
          \u062A\u0627\u062D\u0629 \u062E\u062F\u0645\u0627\u062A \u0648\u0645\u0650\
          \u064A\u0632\u0627\u062A \u063A\u064A\u0631 \u0636\u0631\u0648\u0631\u064A\
          \u0629 (\u0645\u0646\u0627\u0641\u0630 \u063A\u064A\u0631 \u0636\u0631\u0648\
          \u0631\u064A\u0629\u060C \u0627\u0644\u062E\u062F\u0645\u0627\u062A\u060C\
          \ \u0627\u0644\u0635\u0641\u062D\u0627\u062A\u060C \u0627\u0644\u062D\u0633\
          \u0627\u0628\u0627\u062A\u060C \u0648\u0627\u0644\u0635\u0644\u0627\u062D\
          \u064A\u0627\u062A).\n\n-   \u062A\u0641\u0639\u064A\u0644 \u0627\u0644\u062D\
          \u0633\u0627\u0628\u0627\u062A \u0627\u0644\u0627\u0641\u062A\u0631\u0627\
          \u0636\u064A\u0629 \u0623\u0648 \u0639\u062F\u0645 \u062A\u063A\u064A\u064A\
          \u0631\u0647\u0627 \u0623\u0648 \u0639\u062F\u0645 \u062A\u063A\u064A\u064A\
          \u0631 \u0643\u0644\u0645\u0627\u062A \u0627\u0644\u0645\u0631\u0648\u0631\
          \ \u0627\u0644\u062E\u0627\u0635\u0629 \u0628\u0647\u0627.\n\n-   \u0643\
          \u0634\u0641 \u0631\u0633\u0627\u0626\u0644 \u0645\u0639\u0627\u0644\u062C\
          \u0629 \u0627\u0644\u0623\u062E\u0637\u0627\u0621 (Error Handling) \u0639\
          \u0646 \u0645\u0639\u0644\u0648\u0645\u0627\u062A \u0642\u0627\u0628\u0644\
          \u0629 \u0644\u0644\u062A\u062A\u0628\u0651\u0639 (Stack Traces) \u0623\u0648\
          \ \u0639\u0631\u0636 \u0631\u0633\u0627\u0626\u0644 \u0627\u0644\u062E\u0637\
          \u0623 \u0627\u0644\u062A\u064A \u062A\u062D\u062A\u0648\u064A \u0639\u0644\
          \u0649 \u0645\u0639\u0644\u0648\u0645\u0627\u062A \u062A\u0641\u0635\u064A\
          \u0644\u064A\u0629 \u064A\u0645\u0643\u0646 \u0623\u0646 \u062A\u064F\u0633\
          \u062A\u063A\u0644 \u0645\u0646 \u0642\u0650\u0628\u0644 \u0627\u0644\u0645\
