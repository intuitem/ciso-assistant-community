  - urn: urn:intuitem:risk:threat:a02
    ref_id: A02:2021
    name: Cryptographic Failures
    description: "The first thing is to determine the protection needs of data in\
      \ transit\nand at rest. For example, passwords, credit card numbers, health\n\
      records, personal information, and business secrets require extra\nprotection,\
      \ mainly if that data falls under privacy laws, e.g., EU's\nGeneral Data Protection\
      \ Regulation (GDPR), or regulations, e.g.,\nfinancial data protection such as\
      \ PCI Data Security Standard (PCI DSS).\nFor all such data:\n\n-   Is any data\
      \ transmitted in clear text? This concerns protocols such\n    as HTTP, SMTP,\
      \ FTP also using TLS upgrades like STARTTLS. External \n    internet traffic\
      \ is hazardous. Verify all internal traffic, e.g., \n    between load balancers,\
      \ web servers, or back-end systems.\n\n-   Are any old or weak cryptographic\
      \ algorithms or protocols used either \n    by default or in older code?\n\n\
      -   Are default crypto keys in use, weak crypto keys generated or\n    re-used,\
      \ or is proper key management or rotation missing?\n    Are crypto keys checked\
      \ into source code repositories?\n\n-   Is encryption not enforced, e.g., are\
      \ any HTTP headers (browser)\n    security directives or headers missing?\n\n\
      -   Is the received server certificate and the trust chain properly validated?\
      \ \n\n-   Are initialization vectors ignored, reused, or not generated\n   \
      \ sufficiently secure for the cryptographic mode of operation?\n    Is an insecure\
      \ mode of operation such as ECB in use? Is encryption\n    used when authenticated\
      \ encryption is more appropriate?\n\n-   Are passwords being used as cryptographic\
      \ keys in absence of a\n    password base key derivation function?\n\n-   Is\
      \ randomness used for cryptographic purposes that was not designed\n    to meet\
      \ cryptographic requirements? Even if the correct function is\n    chosen, does\
      \ it need to be seeded by the developer, and if not, has\n    the developer\
      \ over-written the strong seeding functionality built into\n    it with a seed\
      \ that lacks sufficient entropy/unpredictability?\n\n-   Are deprecated hash\
      \ functions such as MD5 or SHA1 in use, or are\n    non-cryptographic hash functions\
      \ used when cryptographic hash functions\n    are needed?\n\n-   Are deprecated\
      \ cryptographic padding methods such as PKCS number 1 v1.5\n    in use?\n\n\
      -   Are cryptographic error messages or side channel information\n    exploitable,\
      \ for example in the form of padding oracle attacks?\n\nSee ASVS Crypto (V7),\
      \ Data Protection (V9), and SSL/TLS (V10)"
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 29          | 46.44%             | 4.49%              |7.29              \
      \   | 6.81                |  79.33%       | 34.85%       | 233,788         \
      \  | 3,075      |\n\n\n## How to prevent\n\nDo the following, at a minimum,\
      \ and consult the references:\n\n-   Classify data processed, stored, or transmitted\
      \ by an application.\n    Identify which data is sensitive according to privacy\
      \ laws,\n    regulatory requirements, or business needs.\n\n-   Don't store\
      \ sensitive data unnecessarily. Discard it as soon as\n    possible or use PCI\
      \ DSS compliant tokenization or even truncation.\n    Data that is not retained\
      \ cannot be stolen.\n\n-   Make sure to encrypt all sensitive data at rest.\n\
      \n-   Ensure up-to-date and strong standard algorithms, protocols, and\n   \
      \ keys are in place; use proper key management.\n\n-   Encrypt all data in transit\
      \ with secure protocols such as TLS with\n    forward secrecy (FS) ciphers,\
      \ cipher prioritization by the\n    server, and secure parameters. Enforce encryption\
      \ using directives\n    like HTTP Strict Transport Security (HSTS).\n\n-   Disable\
      \ caching for response that contain sensitive data.\n\n-   Apply required security\
      \ controls as per the data classification.\n\n-   Do not use legacy protocols\
      \ such as FTP and SMTP for transporting\n    sensitive data.\n\n-   Store passwords\
      \ using strong adaptive and salted hashing functions\n    with a work factor\
      \ (delay factor), such as Argon2, scrypt, bcrypt or\n    PBKDF2.\n\n-   Initialization\
      \ vectors must be chosen appropriate for the mode of\n    operation.  For many\
      \ modes, this means using a CSPRNG (cryptographically\n    secure pseudo random\
      \ number generator).  For modes that require a\n    nonce, then the initialization\
      \ vector (IV) does not need a CSPRNG.  In all cases, the IV\n    should never\
      \ be used twice for a fixed key.\n\n-   Always use authenticated encryption\
      \ instead of just encryption.\n\n-   Keys should be generated cryptographically\
      \ randomly and stored in\n    memory as byte arrays. If a password is used,\
      \ then it must be converted\n    to a key via an appropriate password base key\
      \ derivation function.\n\n-   Ensure that cryptographic randomness is used where\
      \ appropriate, and\n    that it has not been seeded in a predictable way or\
      \ with low entropy.\n    Most modern APIs do not require the developer to seed\
      \ the CSPRNG to\n    get security.\n\n-   Avoid deprecated cryptographic functions\
      \ and padding schemes, such as\n    MD5, SHA1, PKCS number 1 v1.5.\n\n-   Verify\
      \ independently the effectiveness of configuration and\n    settings.\n\n\n\
      ## Example attack scenarios\n\n**Scenario #1**: An application encrypts credit\
      \ card numbers in a\ndatabase using automatic database encryption. However,\
      \ this data is\nautomatically decrypted when retrieved, allowing a SQL injection\
      \ flaw to\nretrieve credit card numbers in clear text.\n\n**Scenario #2**: A\
      \ site doesn't use or enforce TLS for all pages or\nsupports weak encryption.\
      \ An attacker monitors network traffic (e.g., at\nan insecure wireless network),\
      \ downgrades connections from HTTPS to\nHTTP, intercepts requests, and steals\
      \ the user's session cookie. The\nattacker then replays this cookie and hijacks\
      \ the user's (authenticated)\nsession, accessing or modifying the user's private\
      \ data. Instead of the\nabove they could alter all transported data, e.g., the\
      \ recipient of a\nmoney transfer.\n\n**Scenario #3**: The password database\
      \ uses unsalted or simple hashes to\nstore everyone's passwords. A file upload\
      \ flaw allows an attacker to\nretrieve the password database. All the unsalted\
      \ hashes can be exposed\nwith a rainbow table of pre-calculated hashes. Hashes\
      \ generated by\nsimple or fast hash functions may be cracked by GPUs, even if\
      \ they were\nsalted.\n\n\nFor more information about the references and the\
      \ list of mapped CWEs: https://top10.owasp.org/2021/A02_2021-Cryptographic_Failures/"
