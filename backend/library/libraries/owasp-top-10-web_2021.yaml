          | 22            | 14.84%             | 2.55%             | 79.51%      \
          \   | 45.72%             | 7.40                  | 6.50          | 132,195\
          \        | 3,897                  |\n\n\n## How to prevent\n\n-   \u062D\
          \u064A\u062B\u0645\u0627 \u0623\u0645\u0643\u0646 \u0630\u0644\u0643\u060C\
          \ \u0642\u0645 \u0628\u062A\u0641\u0639\u064A\u0644 \u0627\u0644\u062A\u062D\
          \u0642\u0651\u0642 \u0627\u0644\u062B\u0646\u0627\u0626\u064A \u0644\u0645\
          \u0646\u0639 \u0627\u0644\u0647\u062C\u0645\u0627\u062A \u0627\u0644\u0622\
          \u0644\u064A\u0629 \u0644\u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\
          \u0627\u0639\u062A\u0645\u0627\u062F(Credential Stuffing)\u060C \u0648\u0647\
          \u062C\u0648\u0645 \u0643\u0633\u0631 \u0643\u0644\u0645\u0627\u062A \u0627\
          \u0644\u0645\u0631\u0648\u0631 (Brute Force) \u0648\u0647\u062C\u0645\u0627\
          \u062A \u0625\u0639\u0627\u062F\u0629 \u0627\u0633\u062A\u062E\u062F\u0627\
          \u0645 \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u0627\u0639\u062A\
          \u0645\u0627\u062F \u0627\u0644\u0645\u0633\u0631\u0648\u0642\u0629.\n\n\
          -   \u0644\u0627 \u062A\u0631\u0633\u0644 \u0623\u0648 \u062A\u0636\u0639\
          \ \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0639\u062A\u0645\u0627\u062F\
          \ \u0627\u0641\u062A\u0631\u0627\u0636\u064A\u0629\u060C \u062E\u0627\u0635\
          \u0629 \u0628\u0627\u0644\u0646\u0633\u0628\u0629 \u0644\u0645\u062F\u0631\
          \u0627\u0621 \u0627\u0644\u0646\u0638\u0627\u0645 (\u0627\u0644\u0645\u0633\
          \u0624\u0648\u0644\u064A\u0646)\n\n-   \u0646\u0641\u0650\u0651\u0630 \u0639\
