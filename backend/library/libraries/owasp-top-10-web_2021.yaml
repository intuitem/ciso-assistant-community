          1\uFF0C\u4F8B\u5982\uFF1A\n\nhttp://example.com/app/accountView?id=' UNION\
          \ SELECT SLEEP(10);--\n\n\u8FD9\u4E24\u4E2A\u67E5\u8BE2\u7684\u542B\u4E49\
          \u5C06\u4EA7\u751F\u6539\u53D8\uFF0C\u800C\u56DE\u5E94\u6240\u6709\u5E10\
