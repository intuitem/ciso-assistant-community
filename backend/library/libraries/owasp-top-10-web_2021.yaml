  - urn: urn:intuitem:risk:threat:a09
    ref_id: A09:2021
    name: Security Logging and Monitoring Failures
    description: "Returning to the OWASP Top 10 2021, this category is to help detect,\n\
      escalate, and respond to active breaches. Without logging and\nmonitoring, breaches\
      \ cannot be detected. Insufficient logging,\ndetection, monitoring, and active\
      \ response occurs any time:\n\n-   Auditable events, such as logins, failed\
      \ logins, and high-value\n    transactions, are not logged.\n\n-   Warnings\
      \ and errors generate no, inadequate, or unclear log\n    messages.\n\n-   Logs\
      \ of applications and APIs are not monitored for suspicious\n    activity.\n\
      \n-   Logs are only stored locally.\n\n-   Appropriate alerting thresholds and\
      \ response escalation processes\n    are not in place or effective.\n\n-   Penetration\
      \ testing and scans by dynamic application security testing (DAST) tools (such\
      \ as OWASP ZAP) do\n    not trigger alerts.\n\n-   The application cannot detect,\
      \ escalate, or alert for active attacks\n    in real-time or near real-time.\n\
      \n-   You are vulnerable to information leakage by making logging and alerting\n\
      events visible to a user or an attacker (see [A01:2021-Broken Access Control](A01_2021-Broken_Access_Control.md)).\n\
      \n-   You are vulnerable to injections or\n    attacks on the logging or monitoring\
      \ systems if log data is not correctly encoded."
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 4           | 19.23%             | 6.51%              | 6.87             \
      \    | 4.99                | 53.67%       | 39.97%       | 53,615          \
      \  | 242        |\n\n\n## How to prevent\n\nDevelopers should implement some\
      \ or all the following controls, \ndepending on the risk of the application:\n\
      \n-   Ensure all login, access control, and server-side input validation\n \
      \   failures can be logged with sufficient user context to identify\n    suspicious\
      \ or malicious accounts and held for enough time to allow\n    delayed forensic\
      \ analysis.\n\n-   Ensure that logs are generated in a format that log management\n\
      \    solutions can easily consume.\n\n-   Ensure log data is encoded correctly\
      \ to prevent injections or\n    attacks on the logging or monitoring systems.\n\
      \n-   Ensure high-value transactions have an audit trail with integrity\n  \
      \  controls to prevent tampering or deletion, such as append-only\n    database\
      \ tables or similar.\n\n-   DevSecOps teams should establish effective monitoring\
      \ and alerting\n    such that suspicious activities are detected and responded\
      \ to\n    quickly.\n\n-   Establish or adopt an incident response and recovery\
      \ plan, such as\n    National Institute of Standards and Technology (NIST) 800-61r2\
      \ or later.\n\nThere are commercial and open-source application protection frameworks\n\
      such as the OWASP ModSecurity Core Rule Set, and open-source log\ncorrelation\
      \ software, such as the Elasticsearch, Logstash, Kibana (ELK)\nstack, that feature\
      \ custom dashboards and alerting.\n\n\n## Example attack scenarios\n\n**Scenario\
      \ #1:** A children's health plan provider's website operator\ncouldn't detect\
      \ a breach due to a lack of monitoring and logging. An\nexternal party informed\
      \ the health plan provider that an attacker had\naccessed and modified thousands\
      \ of sensitive health records of more than\n3.5 million children. A post-incident\
      \ review found that the website\ndevelopers had not addressed significant vulnerabilities.\
      \ As there was\nno logging or monitoring of the system, the data breach could\
      \ have been\nin progress since 2013, a period of more than seven years.\n\n\
      **Scenario #2:** A major Indian airline had a data breach involving more\nthan\
      \ ten years' worth of personal data of millions of passengers,\nincluding passport\
      \ and credit card data. The data breach occurred at a\nthird-party cloud hosting\
      \ provider, who notified the airline of the\nbreach after some time.\n\n**Scenario\
      \ #3:** A major European airline suffered a GDPR reportable\nbreach. The breach\
      \ was reportedly caused by payment application security\nvulnerabilities exploited\
      \ by attackers, who harvested more than 400,000\ncustomer payment records. The\
      \ airline was fined 20 million pounds as a\nresult by the privacy regulator.\n\
      \n\nFor more information about the references and the list of mapped CWEs: https://top10.owasp.org/2021/A09_2021-Security_Logging_and_Monitoring_Failures/"
