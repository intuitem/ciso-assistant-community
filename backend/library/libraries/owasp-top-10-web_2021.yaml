  - urn: urn:intuitem:risk:threat:a04
    ref_id: A04:2021
    name: Insecure Design
    description: "Insecure design is a broad category representing different weaknesses,\
      \ expressed as \u201Cmissing or ineffective control design.\u201D Insecure design\
      \ is not the source for all other Top 10 risk categories. There is a difference\
      \ between insecure design and insecure implementation. We differentiate between\
      \ design flaws and implementation defects for a reason, they have different\
      \ root causes and remediation. A secure design can still have implementation\
      \ defects leading to vulnerabilities that may be exploited. An insecure design\
      \ cannot be fixed by a perfect implementation as by definition, needed security\
      \ controls were never created to defend against specific attacks. One of the\
      \ factors that contribute to insecure design is the lack of business risk profiling\
      \ inherent in the software or system being developed, and thus the failure to\
      \ determine what level of security design is required.\n\n### Requirements and\
      \ Resource Management\n\nCollect and negotiate the business requirements for\
      \ an application with the business, including the protection requirements concerning\
      \ confidentiality, integrity, availability, and authenticity of all data assets\
      \ and the expected business logic. Take into account how exposed your application\
      \ will be and if you need segregation of tenants (additionally to access control).\
      \ Compile the technical requirements, including functional and non-functional\
      \ security requirements. Plan and negotiate the budget covering all design,\
      \ build, testing, and operation, including security activities.\n\n### Secure\
      \ Design\n\nSecure design is a culture and methodology that constantly evaluates\
      \ threats and ensures that code is robustly designed and tested to prevent known\
      \ attack methods. Threat modeling should be integrated into refinement sessions\
      \ (or similar activities); look for changes in data flows and access control\
      \ or other security controls. In the user story development determine the correct\
      \ flow and failure states, ensure they are well understood and agreed upon by\
      \ responsible and impacted parties. Analyze assumptions and conditions for expected\
      \ and failure flows, ensure they are still accurate and desirable. Determine\
      \ how to validate the assumptions and enforce conditions needed for proper behaviors.\
      \ Ensure the results are documented in the user story. Learn from mistakes and\
      \ offer positive incentives to promote improvements. Secure design is neither\
      \ an add-on nor a tool that you can add to software.\n\n### Secure Development\
      \ Lifecycle\n\nSecure software requires a secure development lifecycle, some\
      \ form of secure design pattern, paved road methodology, secured component library,\
      \ tooling, and threat modeling. Reach out for your security specialists at the\
      \ beginning of a software project throughout the whole project and maintenance\
      \ of your software. Consider leveraging the [OWASP Software Assurance Maturity\
      \ Model (SAMM)](https://owaspsamm.org) to help structure your secure software\
      \ development efforts."
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 40          | 24.19%             | 3.00%              | 6.46             \
      \    | 6.78                | 77.25%       | 42.51%       | 262,407         \
      \  | 2,691      |\n\n\n## How to prevent\n\n-   Establish and use a secure development\
      \ lifecycle with AppSec\n    professionals to help evaluate and design security\
      \ and\n    privacy-related controls\n\n-   Establish and use a library of secure\
      \ design patterns or paved road\n    ready to use components\n\n-   Use threat\
      \ modeling for critical authentication, access control,\n    business logic,\
      \ and key flows\n\n-   Integrate security language and controls into user stories\n\
      \n-   Integrate plausibility checks at each tier of your application\n    (from\
      \ frontend to backend)\n\n-   Write unit and integration tests to validate that\
      \ all critical flows \n    are resistant to the threat model. Compile use-cases\
      \ *and* misuse-cases\n    for each tier of your application.\n\n-   Segregate\
      \ tier layers on the system and network layers depending on the\n    exposure\
      \ and protection needs\n\n-   Segregate tenants robustly by design throughout\
      \ all tiers\n\n-   Limit resource consumption by user or service\n\n\n## Example\
      \ attack scenarios\n\n**Scenario #1:** A credential recovery workflow might\
      \ include \u201Cquestions\nand answers,\u201D which is prohibited by NIST 800-63b,\
      \ the OWASP ASVS, and\nthe OWASP Top 10. Questions and answers cannot be trusted\
      \ as evidence of\nidentity as more than one person can know the answers, which\
      \ is why they\nare prohibited. Such code should be removed and replaced with\
      \ a more\nsecure design.\n\n**Scenario #2:** A cinema chain allows group booking\
      \ discounts and has a\nmaximum of fifteen attendees before requiring a deposit.\
      \ Attackers could\nthreat model this flow and test if they could book six hundred\
      \ seats and\nall cinemas at once in a few requests, causing a massive loss of\
      \ income.\n\n**Scenario #3:** A retail chain\u2019s e-commerce website does\
      \ not have\nprotection against bots run by scalpers buying high-end video cards\
      \ to\nresell auction websites. This creates terrible publicity for the video\n\
      card makers and retail chain owners and enduring bad blood with\nenthusiasts\
      \ who cannot obtain these cards at any price. Careful anti-bot\ndesign and domain\
      \ logic rules, such as purchases made within a few\nseconds of availability,\
      \ might identify inauthentic purchases and\nrejected such transactions.\n\n\n\
      For more information about the references and the list of mapped CWEs: https://top10.owasp.org/2021/A04_2021-Insecure_Design/"
