      de:
        name: Injection
        description: "Eine Anwendung ist f\xFCr diesen Angriff anf\xE4llig, wenn:\n\
          \n- Daten, die von Nutzenden stammen, von der Anwendung nicht ausreichend\
          \ validiert, gefiltert oder bereinigt werden.\n\n- Dynamische Anfragen oder\
          \ nicht-parametrisierte Aufrufe ohne ein, dem Kontext entsprechendes Escaping\
          \ direkt einem Interpreter \xFCbergeben werden.\n\n- B\xF6sartige Daten\
          \ innerhalb von ORM (\u201EObject-Relational Mapping\u201C)-Suchparametern\
          \ genutzt werden k\xF6nnen, um vertrauliche Datens\xE4tze von Dritten zu\
          \ extrahieren.\n\n- B\xF6sartige Daten direkt oder als Teil zusammengesetzter,\
          \ dynamischer Querys verwendet werden. Die SQL-Abfragen oder Befehle beinhalten\
          \ die Struktur und die sch\xE4dlichen Daten in den dynamischen Querys, Befehlen\
          \ oder Stored Procedures.\n\nZu den h\xE4ufigeren Injection Arten geh\xF6\
          ren SQL, NoSQL, OS-Befehle, Object Relational Mapping (ORM), LDAP und Expression\
          \ Language (EL) oder Object Graph Navigation Library (OGNL). Das Grundkonzept\
          \ eines Injection-Angriffs ist f\xFCr alle Interpreter gleich. Ein Quellcode-Review\
          \ ist die beste Methode, um Injection-Schwachstellen in Anwendungen zu finden.\
          \ Ausf\xFChrliches (ggf. automatisiertes) Testen aller Parameter und Variablen,\
          \ Header-, URL-, Cookies-, JSON-, SOAP- und XML-Eingaben wird dringend empfohlen.\
          \ Statische (SAST, Quellcode-Ebene), dynamische (DAST, laufende Anwendung)\
          \ und interaktive (IAST, Mischform aus statisch und dynamisch) Test-Werkzeuge\
          \ k\xF6nnen von Organisationen f\xFCr ihre CI/CD-Pipeline genutzt werden,\
          \ um neue Schwachstellen noch vor einer m\xF6glichen Auslieferung in Produktivsysteme\
          \ zu identifizieren."
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 33          | 19.09 %             | 3.37 %              | 7.25       \
          \          | 7.15                | 94.04 %       | 47.90 %       | 274,228\
          \           | 32,078     |\n\n\n## How to prevent\n\nEine konsequente Trennung\
          \ von Daten, Suchanfragen und Befehlen ist f\xFCr die Vermeidung von Injection-Angriffen\
          \ unerl\xE4sslich:\n\n- Die bevorzugte Methode ist die Verwendung einer\
          \ sicheren API, die die Verwendung des Interpreters vollst\xE4ndig vermeidet,\
          \ eine parametrisierte Schnittstelle bereitstellt oder in objektrelationale\
          \ Mapping-Tools (ORMs) umwandelt. \n<br/> **Anmerkung:** Stored Procedures\
          \ k\xF6nnen - auch parametrisiert - immer noch SQL-Injections erm\xF6glichen,\
          \ wenn PL/SQL oder T-SQL Anfragen und Eingabedaten konkateniert oder mit\
          \ EXECUTE IMMEDIATE oder exec() ausgef\xFChrt werden.\n\n- F\xFCr die serverseitige\
          \ Eingabe-Validierung empfiehlt sich die Nutzung eines Positivlisten(\u201C\
          Whitelist\u201D)-Ansatzes. Dies ist i. A. kein vollst\xE4ndiger Schutz,\
          \ da viele Anwendungen Sonderzeichen z. B. in Textfelder oder APIs f\xFC\
          r mobile Anwendungen ben\xF6tigen.\n\n- F\xFCr jede noch verbliebene dynamische\
          \ Query m\xFCssen Sonderzeichen f\xFCr den jeweiligen Interpreter mit der\
          \ richtigen Escape-Syntax entsch\xE4rft werden. <br/> **Anmerkung:** Ein\
          \ Escaping von SQL-Bezeichnern, wie z. B. die Namen von Tabellen oder Spalten\
          \ usw. ist nicht m\xF6glich.\nFalls Nutzende solche Bezeichner selbst eingeben\
          \ k\xF6nnen, so ist dies durchaus gef\xE4hrlich. Dies ist eine \xFCbliche\
          \ Schwachstelle bei Software, die Reports aus einer Datenbank erstellt.\n\
          \n- SQL-Querys sollten LIMIT oder andere SQL-Controls verwenden, um den\
          \ m\xF6glichen Massen-Abfluss von Daten zu verhindern.\n\n\n## Example attack\
          \ scenarios\n\n**Szenario Nr. 1:** Eine Anwendung nutzt ungepr\xFCfte Eingabedaten\
          \ f\xFCr den Zusammenbau der folgenden **<u>verwundbaren</u>** SQL-Abfrage:\n\
          ```\nString query = \"SELECT \\* FROM Accounts WHERE custID='\" + request.getParameter(\"\
          id\") + \"'\";\n```\n\n**Szenario Nr. 2:** Auch das blinde Vertrauen in\
          \ Frameworks kann zu Querys f\xFChren, die ganz analog zu obigem Beispiel\
          \ **<u>verwundbar</u>** sind (z. B. Hibernate Query Language (HQL)):\n```\n\
          Abfrage HQLQuery = session.createQuery(\"FROM Accounts WHERE custID='\"\
          \ + request.getParameter(\"id\") + \"'\");\n```\n\nIn beiden F\xE4llen k\xF6\
          nnen Angreifende den \u2018id\u2019-Parameter im Browser \xE4ndern und sendet:\
          \ \u201EUNION SLEEP(10);--\u201C. Zum Beispiel:\n```\nhttp://example.com/app/accountView?id='\
          \ UNION SELECT SLEEP(10);--\n```\n\nHierdurch wird die Logik der Anfrage\
          \ ver\xE4ndert, so dass alle Datens\xE4tze der Tabelle \u201Eaccounts\u201C\
          \ ohne Einschr\xE4nkung auf einen Kunden zur\xFCckgegeben werden.\nGef\xE4\
          hrlichere Attacken w\xE4ren z. B. das \xC4ndern oder L\xF6schen von Daten\
          \ oder das Aufrufen von Stored Procedures.\n\n\nWeitere Informationen zu\
          \ den Referenzen und zur Liste der zugeordneten CWEs: https://top10.owasp.org/2021/de/A03_2021-Injection/"
      es:
        name: "Inyecci\xF3n"
        description: "Una aplicaci\xF3n es vulnerable a estos tipos de ataque cuando:\n\
          \n-   Los datos proporcionados por el usuario no son validados, filtrados\
          \ ni sanitizados por la aplicaci\xF3n.\n\n-   Se invocan consultas din\xE1\
          micas o no parametrizadas, sin codificar los par\xE1metros de forma acorde\
          \ al contexto.\n\n-   Se utilizan datos da\xF1inos dentro de los par\xE1\
          metros de b\xFAsqueda en consultas Object-Relational Mapping (ORM), para\
          \ extraer registros adicionales sensibles.\n\n-   Se utilizan datos da\xF1\
          inos directamente o se concatenan, de modo que el SQL o comando resultante\
          \ contiene datos y estructuras con consultas din\xE1micas, comandos o procedimientos\
          \ almacenados.\n\nAlgunas de las inyecciones m\xE1s comunes son SQL, NoSQL,\
          \ comandos de sistema operativo, Object-Relational Mapping (ORM), LDAP,\
          \ expresiones de lenguaje u Object Graph Navigation Library (OGNL). El concepto\
          \ es id\xE9ntico para todos los int\xE9rpretes. La revisi\xF3n del c\xF3\
          digo fuente es el mejor m\xE9todo para detectar si las aplicaciones son\
          \ vulnerables a inyecciones. Las pruebas automatizadas en todos los par\xE1\
          metros, encabezados, URL, cookies, JSON, SOAP y XML son fuertemente recomendados.\
          \ Las organizaciones pueden incluir herramientas de an\xE1lisis est\xE1\
          tico (SAST), din\xE1mico (DAST) o interactivo (IAST) en sus pipelines de\
          \ CI/CD con el fin de identificar fallas recientemente introducidas, antes\
          \ de ser desplegadas en producci\xF3n.."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom| Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 33          | 19.09%             | 3.37%              | 7.25         \
          \        | 7.15                | 94.04%       | 47.90%       | 274,228 \
          \          | 32,078     |\n\n\n## How to prevent\n\nPrevenir inyecciones\
          \ requiere separar los datos de los comandos y las consultas.\n\n-   La\
          \ opci\xF3n preferida es utilizar una API segura, que evite el uso de un\
          \ int\xE9rprete por completo y proporcione una interfaz parametrizada o\
          \ utilizar una herramienta de ORM.<br/>\n    **Nota:**: Incluso cuando se\
          \ parametrizan, los procedimientos almacenados pueden introducir una inyecci\xF3\
          n SQL si el procedimiento PL/SQL o T-SQL concatena consultas y datos, o\
          \ se ejecutan par\xE1metros utilizando EXECUTE IMMEDIATE o exec().\n\n-\
          \   Implemente validaciones de entradas de datos en el servidor, utilizando\
          \ \"listas blancas\". De todos modos, esto no es una defensa completa, ya\
          \ que muchas aplicaciones requieren el uso de caracteres especiales, como\
          \ en campos de texto o APIs para aplicaciones m\xF3viles.\n\n-   Para cualquier\
          \ consulta din\xE1mica restante, escape caracteres especiales utilizando\
          \ la sintaxis de caracteres espec\xEDfica para el int\xE9rprete que se trate.<br/>\n\
          \    **Nota:** La estructura de SQL como nombres de tabla, nombres de columna,\
          \ etc. no se pueden escapar y, por lo tanto, los nombres de estructura suministrados\
          \ por el usuario son peligrosos. Este es un problema com\xFAn en el software\
          \ de redacci\xF3n de informes.\n\n-   Utilice LIMIT y otros controles SQL\
          \ dentro de las consultas para evitar la fuga masiva de registros en caso\
          \ de inyecci\xF3n SQL.\n\n\n## Example attack scenarios\n\n**Escenario #1:**\
          \ Una aplicaci\xF3n usa datos no confiables en la construcci\xF3n de la\
          \ siguiente sentencia SQL vulnerable:\n```\nString query = \"SELECT \\*\
          \ FROM accounts WHERE custID='\" + request.getParameter(\"id\") + \"'\"\
          ;\n```\n\n**Escenario #2:** Del mismo modo, la confianza total de una aplicaci\xF3\
          n en frameworks\npuede resultar en consultas que siguen siendo vulnerables\
          \ a inyecciones, (por ejemplo: Hibernate Query\nLanguage (HQL)):\n```\n\
          \ Query HQLQuery = session.createQuery(\"FROM accounts WHERE custID='\"\
          \ + request.getParameter(\"id\") + \"'\");\n```\n\nEn ambos casos, el atacante\
          \ modifica el valor del par\xE1metro \"id\" en su navegador y enviar por\
          \ ejemplo: ' UNION SLEEP(10);--.\n```\n http://example.com/app/accountView?id='\
          \ UNION SELECT SLEEP(10);--\n```\n\nEsto modifica el significado de ambas\
          \ consultas, retornando todos los registros de la tabla \u201Caccounts.\
          \ Ataques m\xE1s peligrosos podr\xEDan modificar datos o incluso invocar\
          \ procedimientos almacenados.\n\n\nPara obtener m\xE1s informaci\xF3n sobre\
          \ las referencias y la lista de CWE asociadas: https://top10.owasp.org/2021/es/A03_2021-Injection/"
      fr:
        name: Injection
        description: "Une application est vuln\xE9rable quand :\n\n- les donn\xE9\
          es venant de l'utilisateur ne sont pas valid\xE9es, filtr\xE9es ou nettoy\xE9\
          es par l'application&nbsp;;\n- des requ\xEAtes dynamiques ou des appels\
          \ non param\xE9tr\xE9s sans \xE9chappement par rapport au contexte sont\
          \ envoy\xE9s \xE0 l'interpr\xE9teur&nbsp;;\n- des donn\xE9es hostiles sont\
          \ utilis\xE9es au sein de param\xE8tres de recherche de mapping objet -\
          \ relationnel (ORM) pour extraire des donn\xE9es suppl\xE9mentaires sensibles&nbsp;;\n\
          - des donn\xE9es hostiles sont utilis\xE9es directement ou concat\xE9n\xE9\
          es, par exemple lors de la construction de requ\xEAtes dynamiques, de commandes\
          \ ou de proc\xE9dures stock\xE9es pour des requ\xEAtes SQL ou des commandes\
          \ OS.\n\nLes injections les plus courantes se font dans le SQL, le NoSQL,\
          \ les commandes OS, le mapping objet - relationnel, le LDAP, l'Expression\
          \ Language et le Object Graph Navigation Library (OGNL). La fa\xE7on de\
          \ faire est la m\xEAme pour tous les interpr\xE9teurs. La revue de code\
          \ source est la meilleure mani\xE8re de d\xE9tecter si une application est\
          \ vuln\xE9rable \xE0 l'injection. Le test automatique de toutes les donn\xE9\
          es d'entr\xE9e via les param\xE8tres, en-t\xEAtes, URL, cookies, JSON, SOAP\
          \ et XML est fortement encourag\xE9. Les organisations peuvent tirer profit\
          \ de la puissance des outils d'analyse statique de code (SAST) ou d'analyse\
          \ dynamique de l'application (DAST) en les int\xE9grant dans leur chaine\
          \ d'int\xE9gration continue (CI / CD) pour identifier avant d\xE9ploiement\
          \ en production les vuln\xE9rabilit\xE9s li\xE9es aux injections."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       33       |       19,09 %        |         3,37 %         |     \
          \        7,25              |         7,15         |    94,04 %     |   \
          \   47,90 %       |          274 228           |        32 078        |\n\
          \n\n## How to prevent\n\nPr\xE9venir l\u2019injection exige de s\xE9parer\
          \ les donn\xE9es non fiables des commandes et requ\xEAtes :\n\n- la meilleure\
          \ option est d\u2019utiliser une API saine qui \xE9vite compl\xE8tement\
          \ l\u2019utilisation de l\u2019interpr\xE9teur ou fournit une interface\
          \ param\xE9trable, ou bien de migrer pour utiliser les outils d'Object Relational\
          \ Mapping Tools (ORMs).<br/>**Note** : Attention aux API, telles les proc\xE9\
          dures stock\xE9es, qui sont param\xE9trables, mais qui pourraient introduire\
          \ une Injection SQL si PL/SQL ou T-SQL concat\xE8ne requ\xEAtes et donn\xE9\
          es ou ex\xE9cute des donn\xE9es non saines avec EXECUTE IMMEDIATE ou exec()\
          \ ;\n- pour les donn\xE9es en entr\xE9e, une liste autoris\xE9e avec normalisation\
          \ est recommand\xE9e, mais n\u2019est pas une d\xE9fense compl\xE8te dans\
          \ la mesure o\xF9 de nombreuses applications requi\xE8rent des caract\xE8\
          res sp\xE9ciaux, par exemple les zones de texte ou les API pour les applications\
          \ mobiles ;\n- pour les requ\xEAtes dynamiques restantes, vous devriez soigneusement\
          \ \xE9chapper les caract\xE8res sp\xE9ciaux en utilisant la syntaxe d\u2019\
          \xE9chappement sp\xE9cifique \xE0 l\u2019interpr\xE9teur.<br/>**Note** :\
          \ Les structures SQL telles que les noms de table, les noms de colonne,\
          \ et d'autres ne peuvent pas \xEAtre \xE9chapp\xE9es et les noms de structures\
          \ venant de l'utilisateur doivent donc \xEAtre consid\xE9r\xE9s comme dangereuses.\
          \ Ceci est un probl\xE8me courant dans les logiciels d'aide \xE0 l'\xE9\
          criture de rapports ;\n- il est conseill\xE9 d'utiliser LIMIT et autres\
          \ contr\xF4les SQL \xE0 l'int\xE9rieur des requ\xEAtes pour emp\xEAcher\
          \ les divulgations massives de donn\xE9es dans le cas d'injection SQL.\n\
          \n\n## Example attack scenarios\n\n**Scenario #1** : L\u2019application\
          \ utilise des donn\xE9es non fiables dans la construction de l\u2019appel\
          \ SQL vuln\xE9rable suivant :\n```\nString query = \"SELECT \\* FROM accounts\
          \ WHERE custID='\" + request.getParameter(\"id\") + \"'\";\n```\n\n**Scenario\
          \ #2** : De m\xEAme, la confiance aveugle d'une application dans les frameworks\
          \ qu'elle utilise peut faire que ses requ\xEAtes sont toujours vuln\xE9\
          rables (par exemple Hibernate Query Language (HQL)) :\n```\n Query HQLQuery\
          \ = session.createQuery(\"FROM accounts WHERE custID='\" + request.getParameter(\"\
          id\") + \"'\");\n```\n\nDans les deux cas, l'attaquant modifie le param\xE8\
          tre \u2018id\u2019 dans son navigateur en : ' UNION SELECT SLEEP(10);--.\
          \ Par exemple :\n```\n http://example.com/app/accountView?id=' UNION SELECT\
          \ SLEEP(10);--\n```\n\nCeci change le sens de chacune des requ\xEAtes pour\
          \ r\xE9cup\xE9rer tous les enregistrements de la table des comptes. Dans\
          \ le pire des cas, l\u2019attaquant exploite cette faiblesse pour modifier\
          \ ou d\xE9truire des donn\xE9es, ou appeler des proc\xE9dures stock\xE9\
          es de la base de donn\xE9es.\n\n\nPour plus d\u2019informations sur les\
          \ r\xE9f\xE9rences et la liste des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A03_2021-Injection/"
      id:
        name: Injeksi
        description: "Sebuah aplikasi rentan untuk diserang ketika:\n\n-   Pengguna\
          \ memasukkan data yang tidak divalidasi, disaring, atau disanitasi\n   \
          \ oleh aplikasi.\n\n-   Kueri secara dinamis atau pemanggilan yang tidak\
          \ diparameterkan tanpa \n    escape peka konteks dipakai secara langsung\
          \ pada interpreter.\n\n-   Data jahat digunakan di dalam parameter pencarian\
          \ object-relational mapping\n    (ORM) untuk mengekstraksi rekaman sensitif\
          \ tambahan.\n\n-   Data jahat langsung digunakan atau digabungkan. SQL atau\
          \ perintah \n    mengandung struktur dan data jahat dalam kueri dinamis,\
          \ perintah, atau \n    stored procedure.\n\nBeberapa injeksi yang biasa\
          \ terjadi adalah SQL, NoSQL, perintah OS, pemetaan \nrelasi objek (ORM),\
          \ LDAP, dan bahasa ekspresi (EL), atau injeksi Object\nGraph Navigation\
          \ Library (OGNL). Konsepnya identik di antara semua interpreter. \nPeninjauan\
          \ kode sumber adalah metode terbaik dalam mendeteksi apakah aplikasi \n\
          tersebut rentan injeksi. Testing otomatis terhadap semua parameter, header,\
          \ \nURL, cookies, JSON, SOAP, and masukan data XML sangat disarankan. \n\
          Organisasi dapat menyertakan alat uji keamanan aplikasi statik (SAST), dinamis\
          \ \n(DAST), dan interaktif (IAST) ke dalam CI/CD pipeline untuk mengidentifikasi\n\
          cacat injeksi yang ditambahkan sebelum penggelaran produksi."
        annotation: "## Score table\n\n| CWE Dipetakan | Tingkat Kejadian Maksimum\
          \ | Rata-rata Tingkat Kejadian | Rata-rata Exploitasi Terbobot | Rata-rata\
          \ Dampak Terbobot | Cakupan Maksimum | Rata-rata Cakupan | Total Kejadian|\
          \ Total CVE |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 33          | 19,09%             | 3,37%              | 7,25         \
          \        | 7,15                | 94,04%       | 47,90%       | 274.228 \
          \          | 32.078     |\n\n\n## How to prevent\n\nPencegahan injeksi membutuhkan\
          \ pemisahan data dari perintah dan kueri:\n\n-   Pilihan yang disukai adalah\
          \ menggunakan API yang aman, yang mencegah \n    penggunaan interpreter\
          \ secara keseluruhan, menyediakan sebuah antar muka \n    terparameterisasi,\
          \ atau migrasi ke Object Relational Mapping Tools (ORMs).<br/>\n    **Catatan:**\
          \ Bahkan ketika diparameterkan, stored procedure masih dapat \n    memperkenalkan\
          \ injeksi SQL jika PL/SQL atau T-SQL menggabungkan kueri dan \n    data\
          \ atau mengeksekusi data jahat dengan EXECUTE IMMEDIATE atau exec().\n\n\
          -   Menggunakan validasi masukan positif di sisi server. Ini bukan pertahanan\
          \ \n    komplit karena banyak aplikasi membutuhkan karakter spesial, seperti\
          \ area \n    teks atau API untuk aplikasi mobile.\n\n-   Untuk sisa apapun\
          \ dari kueri dinamis, escape-kan karakter khusus\n    menggunakan sintaks\
          \ escape spesifik untuk interpreter tersebut.<br/>\n    **Catatan:** Struktur\
          \ SQL seperti nama tabel, nama kolom, dan lain \n    sebagainya tidak bisa\
          \ di-escape, sehingga nama struktur yang diberikan \n    pengguna itu berbahaya.\
          \ Ini adalah masalah umum dalam perangkat lunak\n    penyusun laporan.\n\
          \n-   Gunakan LIMIT dan kontrol SQL lainnya di dalam kueri untuk mencegah\
          \ \n    penyingkapan rekaman data secara masal dalam kasus injeksi SQL.\n\
          \n\n## Example attack scenarios\n\n**Skenario #1:** Sebuah aplikasi menggunakan\
          \ data yang tidak terpercaya dalam \nkonstruksi dari panggilan SQL yang\
          \ rawan berikut ini:\n```\nString query = \"SELECT \\* FROM accounts WHERE\
          \ custID='\" + request.getParameter(\"id\") + \"'\";\n```\n**Skenario #2:**\
          \ Serupa itu, sebuah aplikasi dengan kepercayaan buta ke \nframework akan\
          \ menghasilkan kueri yang masih rawan, (contoh, Hibernate Query \nLanguage\
          \ (HQL)):\n```\n Query HQLQuery = session.createQuery(\"FROM accounts WHERE\
          \ custID='\" + request.getParameter(\"id\") + \"'\");\n```\n\nPada kedua\
          \ kasus, penyerang akan memodifikasi nilai parameter \u2018id\u2019 pada\
          \ \nperamban web untuk mengirim: \u2018 or \u20181\u2019=\u20191. Sebagai\
          \ contoh:\n```\nhttp://example.com/app/accountView?id=' or '1'='1\n```\n\
          Ini akan mengubah arti dari kedua kueri untuk mengembalikan semua rekaman\
          \ \ndata dari akun tabel. Serangan yang lebih berbahaya dapat mengubah atau\
          \ \nmenghapus data atau bahkan memanggil stored procedure.\n\n\nUntuk informasi\
          \ lebih lanjut tentang referensi dan daftar CWE yang dipetakan: https://top10.owasp.org/2021/id/A03_2021-Injection/"
      it:
        name: Injection
        description: "Un'applicazione \xE8 vulnerabile alle injection quando:\n\n\
          - I dati forniti dall'utente non sono validati, filtrati o sanificati dall'applicazione.\n\
          \n- Le query dinamiche o le chiamate non parametrizzate senza escaping contestuale\
          \ vengono passate direttamente    all'interprete.\n\n- Input malevolo viene\
          \ usato all'interno di parametri di ricerca di un ORM (object-relational\
          \ mapping)\n    per estrarre ulteriori record sensibili.\n\n- Input malevolo\
          \ viene usato in modo diretto o concatenato. Le query SQL o i comandi\n\
          \    includono i dati ostili nelle query dinamiche, nei comandi o nelle\
          \ stored procedure.\n\n\nAlcune delle forme di injection pi\xF9 comuni sono\
          \ SQL, NoSQL, OS command, Object\nRelational Mapping (ORM), LDAP, e Expression\
          \ Language (EL) o Object\nGraph Navigation Library (OGNL). Il concetto \xE8\
          \ identico\ntra tutti gli interpreti. La revisione del codice sorgente \xE8\
          \ il metodo migliore per\nrilevare se le applicazioni sono vulnerabili alle\
          \ injection. \xC8 fortemente consigliato il testing\nautomatico di tutti\
          \ i parametri, headers, URL, cookie, e sui formati di dato come JSON, SOAP\
          \ e XML. \nLe organizzazioni possono includere strumenti statici (SAST),\
          \ dinamici (DAST) e interattivi (IAST) per i test di sicurezza delle applicazioni\
          \ nella pipeline CI/CD\nper identificare prima della messa in produzione\
          \ le problematiche di injection eventualmente presenti."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 33          | 19.09%             | 3.37%              | 7.25         \
          \        | 7.15                | 94.04%       | 47.90%       | 274,228 \
          \          | 32,078     |\n\n\n## How to prevent\n\nPrevenire le forme di\
          \ injection richiede di mantenere i dati separati dai comandi e dalle query:\n\
          \n- L'opzione preferita \xE8 quella di usare un'API sicura, che eviti di\
          \ usare l'interprete\n    interamente, che fornisce un'interfaccia parametrizzata\
          \ o\n    migra verso strumenti di Object Relational Mapping (ORM).<br/>\n\
          \    **Nota:** Anche quando sono parametrizzate, le stored procedure possono\
          \ ancora introdurre\n    SQL injection se PL/SQL o T-SQL concatena query\
          \ e dati o\n    esegue input ostili con EXECUTE IMMEDIATE o exec().\n\n\
          - Usare una validazione degli input lato server positiva. Questa\n    non\
          \ \xE8 una difesa completa, poich\xE9 molte applicazioni richiedono caratteri\
          \ speciali, \n    come aree di testo o API per applicazioni mobili.\n\n\
          - Per qualsiasi query dinamica residua, svolgera l'escaping dei caratteri\
          \ speciali usando\n    la sintassi di escape specifica per quell'interprete.<br/>\n\
          \    **Nota:** Le strutture SQL come i nomi delle tabelle, i nomi delle\
          \ colonne e cos\xEC via\n    non possono essere oggetto di escape, e quindi\
          \ i nomi di queste strutture fornite dall'utente sono\n    e rimangono pericolose.\
          \ Questo \xE8 un problema comune nel software di reportistica.\n\n- Usare\
          \ LIMIT e altri controlli SQL all'interno delle query per prevenire la\n\
          \    divulgazione di massa dei record in caso di SQL injection.\n\n\n##\
          \ Example attack scenarios\n\n**Scenario #1:** Un'applicazione usa dati\
          \ non fidati nella costruzione\ndella seguente chiamata SQL vulnerabile:\n\
          ```\nString query = \"SELECT \\* FROM accounts WHERE custID='\" + request.getParameter(\"\
          id\") + \"'\";\n```\n\n**Scenario #2:** Allo stesso modo, la fiducia cieca\
          \ di un'applicazione nei framework\npu\xF2 risultare in query che sono ancora\
          \ vulnerabili, (ad esempio, Hibernate Query\nLanguage (HQL)):\n```\n Query\
          \ HQLQuery = session.createQuery(\"FROM accounts WHERE custID='\" + request.getParameter(\"\
          id\") + \"'\");\n```\n\nIn entrambi i casi, l'attaccante modifica il valore\
          \ del parametro 'id' nel suo\nbrowser per inviare: ' UNION SELECT SLEEP(10);--.\
          \ Per esempio:\n```\n http://example.com/app/accountView?id=' UNION SELECT\
          \ SLEEP(10);--\n```\n\nQuesto cambia il significato di entrambe le query\
          \ per restituire tutti i record dalla\ndella tabella degli account. Attacchi\
          \ pi\xF9 pericolosi potrebbero modificare o cancellare i dati\no anche invocare\
          \ stored procedures.\n\n\nPer maggiori informazioni sui riferimenti e sull'elenco\
          \ delle CWE mappate: https://top10.owasp.org/2021/it/A03_2021-Injection/"
