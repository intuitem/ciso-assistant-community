          n innecesarios.\n\n-   Realice un inventario continuo de las versiones de\
          \ los componentes en el cliente y en el servidor (por ejemplo, frameworks,\
          \ bibliotecas) y sus dependencias utilizando herramientas como: versions,\
          \ OWASP Dependency Check, retire.js, etc. Supervise continuamente fuentes\
          \ como Common Vulnerability and Exposures (CVE) y National Vulnerability\
          \ Database (NVD) para detectar vulnerabilidades en los componentes. Utilice\
          \ herramientas de an\xE1lisis de composici\xF3n de software para automatizar\
          \ el proceso. Suscr\xEDbase para recibir alertas por correo electr\xF3nico\
          \ sobre vulnerabilidades de seguridad relacionadas con los componentes que\
          \ utiliza.\n\n-   Solo obtenga componentes de fuentes oficiales a trav\xE9\
          s de enlaces seguros.\n    Prefiera los paquetes firmados para reducir la\
          \ posibilidad de incluir un componente malicioso modificado (consulte [A08:2021\
          \ \u2013 Fallas en el Software y en la Integridad de los Datos](A08_2021-Software_and_Data_Integrity_Failures.md)).\n\
          \n-   Supervise las bibliotecas y los componentes que no sea mantenidos\
          \ o no generen parches de seguridad para versiones anteriores. Si la aplicaci\xF3\
          n de parches no es posible, considere implementar un parche virtual para\
          \ monitorear, detectar o protegerse contra el problema descubierto.\n\n\
          Toda organizaci\xF3n debe garantizar un plan continuo para monitorear, clasificar\
          \ y aplicar actualizaciones o cambios de configuraci\xF3n durante la vida\
          \ \xFAtil de la aplicaci\xF3n o portafolio de aplicaciones.\n\n\n## Example\
          \ attack scenarios\n\n**Escenario #1:** Los componentes normalmente se ejecutan\
          \ con los mismos privilegios que la propia aplicaci\xF3n, por lo que las\
          \ fallas en cualquier componente pueden tener un impacto grave. Tales fallas\
          \ pueden ser accidentales (por ejemplo, error de codificaci\xF3n) o intencionales\
          \ (por ejemplo, una puerta trasera en un componente). Algunos ejemplos de\
          \ vulnerabilidades de componentes explotables descubiertos son:\n\n-   CVE-2017-5638,\
          \ una vulnerabilidad de ejecuci\xF3n remota de c\xF3digo de Struts 2 que\
          \ permite la ejecuci\xF3n arbitraria de c\xF3digo en el servidor, ha sido\
          \ culpada de brechas importantes.\n\n-   Si bien el Internet de las Cosas\
          \ (IoT) es con frecuencia dif\xEDcil o imposible de parchear, la importancia\
          \ de parchearlo puede ser grande (por ejemplo, dispositivos biom\xE9dicos).\n\
          \nExisten herramientas automatizadas para ayudar a los atacantes a encontrar\
          \ sistemas sin parches o mal configurados. Por ejemplo, el motor de b\xFA\
          squeda Shodan IoT puede ayudarlo a encontrar dispositivos que a\xFAn sufren\
          \ la vulnerabilidad Heartbleed parchada en abril de 2014.\n\n\nPara obtener\
          \ m\xE1s informaci\xF3n sobre las referencias y la lista de CWE asociadas:\
          \ https://top10.owasp.org/2021/es/A06_2021-Vulnerable_and_Outdated_Components/"
      fr:
        name: "Composants vuln\xE9rables et obsol\xE8tes"
        description: "Vous \xEAtes probablement vuln\xE9rable :\n\n-   si vous ne\
          \ savez pas quels sont tous les composants que vous utilisez (\xE0 la fois\
          \ c\xF4t\xE9 client et c\xF4t\xE9 serveur). Cela comprend les composants\
          \ que vous utilisez directement ou par l'interm\xE9diaire des d\xE9pendances\
          \ imbriqu\xE9es ;\n-   si le logiciel est vuln\xE9rable, sans support ou\
          \ obsol\xE8te. Cela concerne le syst\xE8me d'exploitation, le serveur web/application,\
          \ le syst\xE8me de gestion de base de donn\xE9es (SGBD), les applications,\
          \ API et autres composants, les environnements d'ex\xE9cution et les biblioth\xE8\
          ques ;\n-   si vous ne faites pas de recherche r\xE9guli\xE8re de vuln\xE9\
          rabilit\xE9s et de souscription aux bulletins de s\xE9curit\xE9 des composants\
          \ que vous utilisez ;\n-   si vous ne corrigez pas ni mettez \xE0 jour vos\
          \ plateformes sous-jacentes, vos frameworks et leurs d\xE9pendances sur\
          \ la base d'une analyse de risque, dans un d\xE9lai convenable. Cela appara\xEE\
          t fr\xE9quemment dans les environnements o\xF9 les mises \xE0 jour sont\
          \ faites sur une base mensuelle ou trimestrielle au rythme des \xE9volutions\
          \ logicielles, ce qui laisse les organisations expos\xE9es inutilement,\
          \ des jours et des mois, \xE0 des failles avant de corriger les vuln\xE9\
          rabilit\xE9s ;\n-   si les d\xE9veloppeurs de logiciels ne testent pas la\
          \ compatibilit\xE9 des \xE9volutions, des mises \xE0 jour et des correctifs\
          \ des biblioth\xE8ques ;\n-   si vous ne s\xE9curisez pas les configurations\
          \ des composants (voir **A05:2021-Mauvaise configuration de s\xE9curit\xE9\
          **)."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Couverture max | Couverture moyenne | Exploitation\
          \ pond\xE9r\xE9e moyenne | Impact pond\xE9r\xE9 moyen | Nombre total d'occurrences\
          \ | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:--------------:|:------------------:|:-----------------------------:|:--------------------:|:--------------------------:|:--------------------:|\n\
          |       3        |       27,96 %        |         8,77 %         |    51,78\
          \ %     |      22,47 %       |             5,00              |         5,00\
          \         |           30 457           |          0           |\n\n\n##\
          \ How to prevent\n\nVous devez mettre en place une gestion des mises \xE0\
          \ jour pour :\n\n- supprimer les d\xE9pendances inutiles et les fonctionnalit\xE9\
          s, composants, fichiers et documentation non n\xE9cessaires ;\n- faire un\
          \ inventaire en continu des versions de composants \xE0 la fois client et\
          \ serveur (ex : frameworks, biblioth\xE8ques) et de leurs d\xE9pendances\
          \ avec des outils tels que versions, OWASP Dependency Check, retire.js,\
          \ etc. Surveiller en permanence les sources comme *Common Vulnerability\
          \ and Exposures* (CVE) et *National Vulnerability Database* (NVD) pour suivre\
          \ les vuln\xE9rabilit\xE9s des composants. Utiliser des outils d'analyse\
          \ de composants logiciels pour automatiser le processus. Souscrire aux alertes\
          \ par courriel concernant les vuln\xE9rabilit\xE9s sur les composants que\
          \ vous utilisez ;\n- ne r\xE9cup\xE9rer des composants qu'aupr\xE8s de sources\
          \ officielles via des liens s\xE9curis\xE9s. Pr\xE9f\xE9rer des paquets\
          \ sign\xE9s pour minimiser les risques d'insertion de composants modifi\xE9\
          s malveillants (voir A08:2021-Manque d'int\xE9grit\xE9 des donn\xE9es et\
          \ du logiciel) ;\n- surveiller les biblioth\xE8ques et les composants qui\
          \ ne sont plus maintenus ou pour lesquels il n'y a plus de correctifs de\
          \ s\xE9curit\xE9. Si les mises \xE0 jour ne sont pas possibles, penser \xE0\
          \ d\xE9ployer des mises \xE0 jour virtuelles pour surveiller, d\xE9tecter\
          \ et se prot\xE9ger d'\xE9ventuelles d\xE9couvertes de failles.\n\nChaque\
          \ organisation doit s'assurer d'avoir un projet continu de surveillance,\
          \ de tri, d'application des mises \xE0 jour et de modification de configuration\
          \ pour la dur\xE9e de vie d'une application ou de sa gamme.\n\n\n## Example\
          \ attack scenarios\n\n**Sc\xE9nario 1** : Les composants s'ex\xE9cutent\
          \ g\xE9n\xE9ralement avec le m\xEAme niveau de privil\xE8ges que l'application,\
          \ et donc les failles d'un quelconque composant peuvent aboutir \xE0 un\
          \ impact s\xE9v\xE8re. Les failles peuvent \xEAtre accidentelles (ex : erreur\
          \ de d\xE9veloppement) ou intentionnelles (ex : porte d\xE9rob\xE9e dans\
          \ un composant). Voici quelques exemples de d\xE9couvertes de vuln\xE9rabilit\xE9\
          s de composants exploitables :\n\n- CVE-2017-5638, une vuln\xE9rabilit\xE9\
          \ d'ex\xE9cution \xE0 distance de Struts 2, qui permet l'ex\xE9cution de\
          \ code arbitraire sur le serveur, a \xE9t\xE9 responsable d'importantes\
          \ violations ;\n- bien que l'internet des objets (IoT) soit souvent difficile,\
          \ voire impossible \xE0 mettre \xE0 jour, l'importance de ces mises \xE0\
          \ jour peut \xEAtre \xE9norme (ex : objets biom\xE9dicaux).\n\nIl existe\
          \ des outils automatiques qui aident les attaquants \xE0 trouver des syst\xE8\
          mes mal configur\xE9s ou non mis \xE0 jour. Par exemple, le moteur de recherche\
          \ IoT de Shodan peut vous aider \xE0 trouver des objets qui sont encore\
          \ vuln\xE9rables \xE0 la faille Heartbleed corrig\xE9e en avril 2014.\n\n\
          \nPour plus d\u2019informations sur les r\xE9f\xE9rences et la liste des\
          \ CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A06_2021-Vulnerable_and_Outdated_Components/"
      id:
        name: Komponen yang Rentan dan Kedaluwarsa
        description: 'Anda kemungkinan besar rentan:


          -   Jika Anda tidak mengetahui versi semua komponen yang Anda gunakan (sisi
          klien dan sisi server). Ini termasuk komponen yang secara langsung Anda
          gunakan serta dependensi bersarang.

          -   Jika perangkat lunak rentan, tidak didukung, atau ketinggalan zaman.
          Ini termasuk OS, server web/aplikasi, sistem manajemen basis data (DBMS),
          aplikasi, API dan semua komponen, lingkungan runtime, dan pustaka.

          -   Jika Anda tidak memindai kerentanan secara teratur dan berlangganan
          buletin keamanan yang terkait dengan komponen yang Anda gunakan.

          -   Jika Anda tidak memperbaiki atau meningkatkan platform, kerangka kerja,
          dan dependensi yang mendasarinya secara tepat waktu dan berbasis risiko.
          Ini biasanya terjadi di lingkungan ketika patch adalah tugas bulanan atau
          triwulanan dibawah kendali perubahan, membiarkan organisasi terbuka selama
          berhari-hari atau berbulan-bulan terpapar secara tidak perlu atas kerentanan-kerentangan
          yang telah diperbaiki.

          -   Jika pengembang perangkat lunak tidak menguji kompatibilitas pustaka-pustaka
          yang diperbarui, ditingkatkan, atau di-patch.

          -   Jika Anda tidak mengamankan konfigurasi komponen (lihat A05:2021-Security
          Misconfiguration).'
        annotation: "## Score table\n\n| Klasifikasi CWE | Tingkat Kejadian Maksimum\
          \ | Rata-rata Tingkat kejadian | Cakupan Maksimum | Rata-rata Cakupan |\
          \ Rata-rata Bobot Eksploitasi | Rata-rata Bobot Dampak | Total Kejadian\
          \ | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 3           | 27.96%             | 8.77%              | 51.78%       |\
          \ 22.47%       | 5.00                 | 5.00                | 30,457   \
          \         | 0          |\n\n\n## How to prevent\n\nHarus ada proses manajemen\
          \ patch untuk: \n\n-   Menghapus dependensi, fitur, komponen, file, dan\
          \ dokumentasi yang tidak digunakan.\n-   Inventarisasi versi komponen sisi\
          \ klien dan sisi server secara terus menerus (mis., kerangka kerja, pustaka)\
          \ dan dependensinya menggunakan alat seperti versi, OWASP Dependency Check,\
          \ retire.js, dll. Memantau secara terus menerus sumber-sumber seperti Common\
          \ Vulnerability and Exposures (CVE) dan National Vulnerability Database\
          \ (NVD) untuk  kerentanan dalam komponen. Gunakan alat analisis komposisi\
          \ perangkat lunak untuk mengotomatisasi proses. Berlangganan email peringatan\
          \ untuk kerentanan keamanan yang terkait dengan komponen yang Anda gunakan.\n\
          -   Hanya dapatkan komponen dari sumber resmi melalui tautan yang aman.\
          \ Pilih paket yang ditandatangani untuk mengurangi kemungkinan menyertakan\
          \ komponen berbahaya yang dimodifikasi (Lihat A08:2021-Software and Data\
          \ Integrity Failures).\n-   Memantau pustaka dan komponen yang tidak dirawat\
          \ atau tidak membuat patch keamanan untuk versi yang lebih lama. Jika tambalan\
          \ tidak memungkinkan, pertimbangkan untuk menggunakan tambalan virtual untuk\
          \ memantau, mendeteksi, atau melindungi dari masalah yang ditemukan.\n\n\
          Setiap organisasi harus memastikan rencana berkelanjutan untuk memantau,\
          \ melakukan triase, dan menerapkan pembaruan atau perubahan konfigurasi\
          \ selama masa pakai aplikasi atau portofolio.\n\n\n## Example attack scenarios\n\
          \n**Skenario #1:** Komponen biasanya berjalan dengan hak istimewa yang sama\
          \ seperti aplikasi itu sendiri, sehingga cacat pada komponen apa pun dapat\
          \ mengakibatkan dampak yang serius. Jadi cacat tersebut dapat terjadi secara\
          \ tidak sengaja (mis., kesalahan pengkodean) atau disengaja (mis., pintu\
          \ belakang dalam suatu komponen). Beberapa contoh kerentanan komponen yang\
          \ dapat dieksploitasi yang ditemukan adalah:\n\n-   CVE-2017-5638, kerentanan\
          \ eksekusi kode jarak jauh Struts 2 yang memungkinkan eksekusi kode sembarang\
          \ di server, telah disalahkan atas pembobolan-pembobolan yang signifikan.\n\
          -   Sementara internet of things (IoT) seringkali sangat sulit untuk ditambal,\
          \ pentingnya menambal bisa sangat besar (mis., perangkat biomedis).\n\n\
          Ada alat otomatis untuk membantu penyerang menemukan sesuatu yang belum\
          \ ditambal atau sistem yang salah konfigurasi. Misalnya, mesin pencari Shodan\
          \ IoT dapat membantu Anda menemukan perangkat yang masih mengalami kerentanan\
          \ Heartbleed yang ditambal pada April 2014.\n\n\nUntuk informasi lebih lanjut\
          \ tentang referensi dan daftar CWE yang dipetakan: https://top10.owasp.org/2021/id/A06_2021-Vulnerable_and_Outdated_Components/"
      it:
        name: Vulnerable and Outdated Components
        description: "La vulnerabilit\xE0 si presenta se:\n\n-   Non conosci le versioni\
          \ di tutti i componenti utilizzati (sia\n    lato client che lato server).\
          \ Questo include i componenti utilizzati direttamente\n    cos\xEC come\
          \ le dipendenze annidate.\n\n-   Se il software \xE8 vulnerabile, non supportato\
          \ o non aggiornato. Questo\n    include il sistema operativo, il server\
          \ web/applicazione, il database management system\n    (DBMS), applicazioni,\
          \ API e tutti i componenti, ambienti di esecuzione,\n    e librerie.\n\n\
          -   Se non si fa la scansione delle vulnerabilit\xE0 regolarmente e non\
          \ si consultano i\n    bollettini di sicurezza relativi ai componenti utilizzati.\n\
          \n-   Se non si corregge o non si aggiorna la piattaforma sottostante, i\
          \ framework,\n    e le dipendenze in modo tempestivo e basato sul rischio.\
          \ Questo comunemente\n    accade in ambienti in cui le patch vengono applicate\
          \ mensilmente o trimestralmente\n    sotto change control, lasciando le\
          \ organizzazioni scoperte per giorni o mesi\n    verso vulnerabilit\xE0\
          \ gi\xE0 risolte.\n\n-   Se gli sviluppatori non testano la compatibilit\xE0\
          \ delle librerie aggiornate,\n    nuove o patchate.\n\n-   Se i componenti\
          \ non vengono configurati in modo sicuro (vedere\n    A05:2021-Security\
          \ Misconfiguration)."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Copertura Max | Copertura Media | Sfruttabilit\xE0\
          \ media pesata | Impatto medio pesato | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 3           | 27.96%             | 8.77%              | 51.78%       |\
          \ 22.47%       | 5.00                 | 5.00                | 30,457   \
          \         | 0          |\n\n\n## How to prevent\n\nCi dovrebbe essere un\
          \ processo di gestione delle patch in atto per:\n\n-   Rimuovere le dipendenze,\
          \ le funzionalit\xE0, i componenti, i file,\n    e la documentazione non\
          \ utilizzate.\n\n-   Inventariare in modo continuo le versioni dei componenti\
          \ lato client e\n    lato server (ad esempio, framework, librerie) e le\
          \ loro\n    dipendenze usando strumenti come OWASP Dependency Check,\n \
          \   retire.js, ecc. Monitorare continuamente fonti come Common Vulnerability\
          \ and \n    Exposures (CVE) e il National Vulnerability Database (NVD) per\n\
          \    vulnerabilit\xE0 nei componenti. Usare strumenti di software composition\
          \ per automatizzare il processo. \n    Sottoscrivere avvisi e-mail per le\
          \ vulnerabilit\xE0 di sicurezza relative ai componenti utilizzati.\n\n-\
          \   Ottenere i componenti solo da fonti ufficiali tramite link sicuri.\n\
          \    Preferire pacchetti firmati per ridurre la possibilit\xE0 di includere\
          \ un componente modificato o dannoso (vedere A08:2021-Software and Data\
          \ Integrity Failures).\n\n-   Controllare le librerie e i componenti che\
          \ non sono pi\xF9 mantenuti o che non\n    sviluppano pi\xF9 patch di sicurezza\
          \ per le vecchie versioni. Se il patching non \xE8\n    possibile, considerare\
          \ l'implementazione di una patch virtuale per monitorare, rilevare o\n \
          \   proteggere dal problema individuato.\n\nOgni organizzazione deve garantire\
          \ un piano continuo per il monitoraggio, il triage,\ne l'applicazione di\
          \ aggiornamenti o modifiche di configurazione per tutta la durata dell'applicazione\n\
          o del portafoglio.\n\n\n## Example attack scenarios\n\n**Scenario #1:**\
          \ I componenti solitamente vengono eseguiti con gli stessi privilegi dell'applicazione\
          \ stessa, \nquindi le falle in qualsiasi componente possono avere un serio\n\
          impatto. Tali difetti possono essere accidentali (ad esempio, un errore\
          \ nel codice) o intenzionali\n(ad esempio, una backdoor in un componente).\
          \ Alcuni esempi di vulnerabilit\xE0 sfruttabili\nscoperte nei componenti\
          \ sono:\n\n-   CVE-2017-5638, una vulnerabilit\xE0 di esecuzione di codice\
          \ remoto di Struts 2 che\n    permette l'esecuzione di codice arbitrario\
          \ sul server, \xE8 stata\n    causa di breach importanti.\n\n-   Mentre\
          \ l'internet delle cose (IoT) \xE8 spesso difficile o\n    impossibile da\
          \ patchare, l'importanza nel riuscirci \xE8 elevata\n    (ad esempio, i\
          \ dispositivi biomedici).\n\nCi sono strumenti automatici per aiutare gli\
          \ attaccanti a trovare sistemi non patchati o\nsistemi mal configurati.\
          \ Per esempio, il motore di ricerca Shodan IoT pu\xF2\naiutare a trovare\
          \ i dispositivi che soffrono ancora della vulnerabilit\xE0 Heartbleed\n\
          patchata nell'aprile 2014.\n\n\nPer maggiori informazioni sui riferimenti\
          \ e sull'elenco delle CWE mappate: https://top10.owasp.org/2021/it/A06_2021-Vulnerable_and_Outdated_Components/"
