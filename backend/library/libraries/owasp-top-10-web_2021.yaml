  - urn: urn:intuitem:risk:threat:a10
    ref_id: A10:2021
    name: Server-Side Request Forgery (SSRF)
    description: 'SSRF flaws occur whenever a web application is fetching a remote

      resource without validating the user-supplied URL. It allows an attacker

      to coerce the application to send a crafted request to an unexpected

      destination, even when protected by a firewall, VPN, or another type of

      network access control list (ACL).


      As modern web applications provide end-users with convenient features,

      fetching a URL becomes a common scenario. As a result, the incidence of

      SSRF is increasing. Also, the severity of SSRF is becoming higher due to

      cloud services and the complexity of architectures.'
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 1           | 2.72%              | 2.72%              | 8.28             \
      \    | 6.72                | 67.72%       | 67.72%       | 9,503           \
      \  | 385        |\n\n\n## How to prevent\n\nDevelopers can prevent SSRF by implementing\
      \ some or all the following\ndefense in depth controls:\n\n### **From Network\
      \ layer**\n\n-   Segment remote resource access functionality in separate networks\
      \ to\n    reduce the impact of SSRF\n\n-   Enforce \u201Cdeny by default\u201D\
      \ firewall policies or network access\n    control rules to block all but essential\
      \ intranet traffic.<br/> \n    *Hints:*<br> \n    ~ Establish an ownership and\
      \ a lifecycle for firewall rules based on applications.<br/>\n    ~ Log all\
      \ accepted *and* blocked network flows on firewalls\n    (see [A09:2021-Security\
      \ Logging and Monitoring Failures](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
      \    \n### **From Application layer:**\n\n-   Sanitize and validate all client-supplied\
      \ input data\n\n-   Enforce the URL schema, port, and destination with a positive\
      \ allow\n    list\n\n-   Do not send raw responses to clients\n\n-   Disable\
      \ HTTP redirections\n\n-   Be aware of the URL consistency to avoid attacks\
      \ such as DNS\n    rebinding and \u201Ctime of check, time of use\u201D (TOCTOU)\
      \ race conditions\n\nDo not mitigate SSRF via the use of a deny list or regular\
      \ expression.\nAttackers have payload lists, tools, and skills to bypass deny\
      \ lists.\n\n### **Additional Measures to consider:**\n    \n-   Don't deploy\
      \ other security relevant services on front systems (e.g. OpenID). \n    Control\
      \ local traffic on these systems (e.g. localhost)\n    \n-   For frontends with\
      \ dedicated and manageable user groups use network encryption (e.g. VPNs)\n\
      \    on independent systems to consider very high protection needs  \n\n\n##\
      \ Example attack scenarios\n\nAttackers can use SSRF to attack systems protected\
      \ behind web\napplication firewalls, firewalls, or network ACLs, using scenarios\
      \ such\nas:\n\n**Scenario #1:** Port scan internal servers \u2013 If the network\
      \ architecture\nis unsegmented, attackers can map out internal networks and\
      \ determine if\nports are open or closed on internal servers from connection\
      \ results or\nelapsed time to connect or reject SSRF payload connections.\n\n\
      **Scenario #2:** Sensitive data exposure \u2013 Attackers can access local \n\
      files or internal services to gain sensitive information such\nas `file:///etc/passwd`\
      \ and `http://localhost:28017/`.\n\n**Scenario #3:** Access metadata storage\
      \ of cloud services \u2013 Most cloud\nproviders have metadata storage such\
      \ as `http://169.254.169.254/`. An\nattacker can read the metadata to gain sensitive\
      \ information.\n\n**Scenario #4:** Compromise internal services \u2013 The attacker\
      \ can abuse\ninternal services to conduct further attacks such as Remote Code\n\
      Execution (RCE) or Denial of Service (DoS).\n\n\nFor more information about\
      \ the references and the list of mapped CWEs: https://top10.owasp.org/2021/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
