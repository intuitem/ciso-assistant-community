        annotation: "## Score table\n\n\u8FD9\u662F 2021 \u5E74\u7684\u65B0\u7C7B\u578B\
          \uFF0C\u7740\u91CD\u5728\u8F6F\u4F53\u66F4\u65B0\uFF0C\u5173\u952E\u8D44\
          \u6599\u53CA\u6301\u7EED\u6027\u6574\u5408/\u90E8\u7F72(CI/CD)\u6D41\u7A0B\
          \u672A\u7ECF\u5B8C\u6574\u6027\u9A8C\u8BC1\u4E4B\u5047\u8BBE\u3002\u540C\
          \u65F6\u5728 CVE/CVSS \u8D44\u6599\u52A0\u6743\u540E\u4E4B\u6700\u9AD8\u5F71\
          \u54CD\u4E4B\u4E00\u3002\u503C\u5F97\u6CE8\u610F\u7684 CWE \u5305\u542B\
          \ CWE-502\uFF1A\u4E0D\u53D7\u4FE1\u4EFB\u8D44\u6599\u4E4B\u53CD\u5E8F\u5217\
          \u5316\uFF0CCWE-829\uFF1A\u5305\u542B\u6765\u81EA\u4E0D\u53D7\u4FE1\u4EFB\
