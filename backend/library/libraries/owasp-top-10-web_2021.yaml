      pt:
        name: "Falhas Criptogr\xE1ficas"
        description: "A primeira coisa \xE9 determinar as necessidades de prote\xE7\
          \xE3o dos dados\nem tr\xE2nsito e armazenados. Por exemplo, senhas, n\xFA\
          mero de cart\xE3o de cr\xE9dito,\nregistros de sa\xFAde, informa\xE7\xF5\
          es pessoas e segredos de neg\xF3cios que requerem\nprote\xE7\xE3o extra,\
          \ principalmente se esses dados se enquadrarem nas leis de\nprivacidade,\
          \ alguns exemplos s\xE3o a da Europa General Data Protection Regulation\n\
          (GDPR) ou regulamentos de prote\xE7\xE3o de dados financeiros, como PCI\
          \ Data Security\nStandard (PCI DSS). Para todos esses dados:\n\n- Todos\
          \ os dados s\xE3o transmitidos em texto n\xE3o criptografado? Isso diz respeito\
          \ a\n    protocolos como HTTP, SMTP, FTP tamb\xE9m usando atualiza\xE7\xF5\
          es TLS como STARTTLS.\n    O tr\xE1fego externo da Internet \xE9 perigoso.\
          \ Verifique todo o tr\xE1fego interno,\n    por exemplo, entre balanceadores\
          \ de carga, servidores da web ou sistemas _back-end_.\n\n- Algum algoritmo\
          \ ou protocolo criptogr\xE1fico antigo ou fraco \xE9 usado por padr\xE3\
          o ou\n    em c\xF3digo mais antigo?\n\n- As chaves criptogr\xE1ficas padr\xE3\
          o em uso, s\xE3o chaves criptogr\xE1ficas geradas fracas\n    ou reutilizadas,\
          \ faltando o gerenciamento ou rota\xE7\xE3o de chaves adequado?\n    As\
          \ chaves criptogr\xE1ficas s\xE3o verificadas nos reposit\xF3rios de c\xF3\
          digo-fonte?\n\n- A criptografia n\xE3o \xE9 aplicada, por exemplo, h\xE1\
          \ alguma diretiva de seguran\xE7a\n    de cabe\xE7alhos HTTP (navegador)\
          \ ou cabe\xE7alhos ausentes?\n\n- O certificado do servidor recebido e a\
          \ cadeia de confian\xE7a est\xE3o devidamente validados? \n\n- Os vetores\
          \ de inicializa\xE7\xE3o s\xE3o ignorados, reutilizados ou n\xE3o gerados\n\
          \    suficientemente seguros para o modo criptogr\xE1fico de opera\xE7\xE3\
          o? Est\xE1 em uso um modo\n    de opera\xE7\xE3o inseguro, como o ECB? A\
          \ criptografia \xE9 usada quando a criptografia\n    autenticada \xE9 a\
          \ mais apropriada?\n\n- As senhas est\xE3o sendo usadas como chaves criptogr\xE1\
          ficas na aus\xEAncia de uma fun\xE7\xE3o\n    de deriva\xE7\xE3o de chave\
          \ de base de senha?\n\n- A aleatoriedade \xE9 usada para fins criptogr\xE1\
          ficos que n\xE3o foram projetados para atender\n    aos requisitos criptogr\xE1\
          ficos? Mesmo se a fun\xE7\xE3o correta for escolhida, ela precisa\n    ser\
          \ propagada pelo desenvolvedor e, se n\xE3o, o desenvolvedor sobrescreveu\
          \ a forte\n    funcionalidade de propaga\xE7\xE3o incorporada a ela com\
          \ uma semente que carece de\n    entropia/imprevisibilidade suficiente?\n\
          \n- Est\xE3o em uso fun\xE7\xF5es hash obsoletas, como MD5 ou SHA1, ou fun\xE7\
          \xF5es hash n\xE3o criptogr\xE1ficas\n    usadas quando fun\xE7\xF5es hash\
          \ criptogr\xE1ficas s\xE3o necess\xE1rias?\n\n- Est\xE3o em uso m\xE9todos\
          \ de preenchimento criptogr\xE1fico obsoletos, como PKCS n\xFAmero 1 v1.5?\n\
          \n- As mensagens de erro criptogr\xE1ficas ou as informa\xE7\xF5es do canal\
          \ lateral podem ser exploradas,\n    por exemplo, na forma de ataques oracle\
          \ de preenchimento?\n\nConsulte ASVS Crypto (V7), Data Protection (V9) e\
          \ SSL/TLS (V10)"
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:-------------------------:|:------------------------:|:--------------------------:|:-----------------------:|:----------------:|:---------------:|:--------------------:|:-------------:|\n\
          | 29            | 46.44%                    | 4.49%                    |7.29\
          \                        | 6.81                    |  79.33%          |\
          \ 34.85%          | 233,788              | 3,075         |\n\n\n## How to\
          \ prevent\n\nFa\xE7a o seguinte, no m\xEDnimo, e consulte as refer\xEAncias:\n\
          \n- Classifique os dados processados, armazenados ou transmitidos por um\
          \ aplicativo.\n    Identifique quais dados s\xE3o confidenciais de acordo\
          \ com as leis de privacidade, requisitos\n    regulamentares ou necessidades\
          \ de neg\xF3cios.\n\n- N\xE3o armazene dados confidenciais desnecessariamente.\
          \ Descarte-o o mais r\xE1pido poss\xEDvel ou use\n    tokeniza\xE7\xE3o\
          \ compat\xEDvel com PCI DSS ou mesmo truncamento. Os dados n\xE3o retidos\
          \ n\xE3o podem ser roubados.\n\n- Certifique-se de criptografar todos os\
          \ dados confidenciais armazenados.\n\n- Certifique-se de que algoritmos,\
          \ protocolos e senhas de padr\xE3o forte e atualizados estejam\n    em vigor;\
          \ use o gerenciamento de senhas adequado.\n\n- Criptografe todos os dados\
          \ em tr\xE2nsito com protocolos seguros, como TLS com cifras de sigilo\n\
          \    de encaminhamento (FS), prioriza\xE7\xE3o de cifras pelo servidor e\
          \ par\xE2metros seguros. Aplique\n    a criptografia usando diretivas como\
          \ HTTP Strict Transport Security (HSTS).\n\n- Desative o armazenamento em\
          \ cache para respostas que contenham dados confidenciais.\n\n- Aplique os\
          \ controles de seguran\xE7a necess\xE1rios de acordo com a classifica\xE7\
          \xE3o de dados.\n\n- N\xE3o use protocolos legados, como FTP e SMTP, para\
          \ transportar dados confidenciais.\n\n- Armazene senhas usando fortes fun\xE7\
          \xF5es de hash adapt\xE1veis e saltadas com um fator de\n    trabalho (fator\
          \ de atraso), como Argon2, scrypt, bcrypt ou PBKDF2.\n\n- Os vetores de\
          \ inicializa\xE7\xE3o devem ser escolhidos de acordo com o modo de\n   \
          \ opera\xE7\xE3o. Para muitos modos, isso significa usar um CSPRNG (gerador\
          \ de\n    n\xFAmeros pseudo-aleat\xF3rios criptograficamente seguro). Para\
          \ modos que requerem\n    um nonce, o vetor de inicializa\xE7\xE3o (IV)\
          \ n\xE3o precisa de um CSPRNG. Em todos os\n    casos, o IV nunca deve ser\
          \ usado duas vezes para uma chave fixa.\n\n- Sempre use criptografia autenticada\
          \ em vez de apenas criptografia.\n\n- As chaves devem ser geradas de forma\
          \ criptograficamente aleat\xF3ria e armazenadas\n    na mem\xF3ria como\
          \ um _array_ de _bytes_. Se uma senha for usada, ela deve ser\n    convertida\
          \ em uma chave por meio de uma fun\xE7\xE3o de deriva\xE7\xE3o de chave\
          \ de\n    base de senha apropriada.\n\n- Certifique-se de que a aleatoriedade\
          \ criptogr\xE1fica seja usada quando apropriado\n    e que n\xE3o tenha\
          \ sido usada uma semente de uma forma previs\xEDvel ou com baixa entropia.\n\
          \    A maioria das APIs modernas n\xE3o exige que o desenvolvedor propague\
          \ o CSPRNG para obter seguran\xE7a.\n\n- Evite fun\xE7\xF5es criptogr\xE1\
          ficas e esquemas de preenchimento obsoletos, como MD5, SHA1, PKCS n\xFA\
          mero 1 v1.5.\n\n- Verifique de forma independente a efic\xE1cia das configura\xE7\
          \xF5es.\n\n\n## Example attack scenarios\n\n**Cen\xE1rio #1**: Um aplicativo\
          \ criptografa n\xFAmeros de cart\xE3o de cr\xE9dito\nem um banco de dados\
          \ usando criptografia autom\xE1tica de banco de dados.\nNo entanto, esses\
          \ dados s\xE3o automaticamente descriptografados quando\nrecuperados, permitindo\
          \ que uma falha de inje\xE7\xE3o de SQL recupere\nn\xFAmeros de cart\xE3\
          o de cr\xE9dito em texto n\xE3o criptografado.\n\n**Cen\xE1rio #2**: Um\
          \ site n\xE3o usa ou imp\xF5e TLS para todas as p\xE1ginas\nou oferece suporte\
          \ a criptografia fraca. Um invasor monitora o tr\xE1fego\nde rede (por exemplo,\
          \ em uma rede sem fio insegura), faz o downgrade\nde conex\xF5es de HTTPS\
          \ para HTTP, intercepta solicita\xE7\xF5es e rouba o cookie\nde sess\xE3\
          o do usu\xE1rio. O invasor ent\xE3o reproduz esse cookie e sequestra\na\
          \ sess\xE3o (autenticada) do usu\xE1rio, acessando ou modificando os dados\n\
          privados do usu\xE1rio. Em vez do acima, eles podem alterar todos os dados\n\
          transportados, por exemplo, o destinat\xE1rio de uma transfer\xEAncia de\
          \ dinheiro.\n\n**Cen\xE1rio #3**: O banco de dados de senha usa hashes sem\
          \ saltos ou simples\npara armazenar as senhas de todos. Uma falha de _upload_\
          \ de arquivo permite\nque um invasor recupere o banco de dados de senhas.\
          \ Todos os hashes sem saltos\npodem ser expostos com uma _rainbow table_\
          \ de hashes pr\xE9-calculados. Hashes\ngeradas por fun\xE7\xF5es de hash\
          \ simples ou r\xE1pidas podem ser quebrados por GPUs,\nmesmo se forem saltadas.\n\
          \n\nPara mais informa\xE7\xF5es sobre as refer\xEAncias e a lista de CWEs\
          \ mapeadas: https://top10.owasp.org/2021/pt-BR/A02_2021-Cryptographic_Failures/"
      tr:
        name: Cryptographic Failures
        description: "\u0130lk yap\u0131lacak \u015Fey, hem transit halinde hem de\
          \ at rest durumundaki verilerin korunma ihtiyac\u0131n\u0131 belirlemektir.\
          \ \xD6rne\u011Fin parolalar, kredi kart\u0131 numaralar\u0131, sa\u011F\
          l\u0131k kay\u0131tlar\u0131, ki\u015Fisel bilgiler ve ticari s\u0131rlar;\
          \ \xF6zellikle bu veriler gizlilik yasalar\u0131na (\xF6r. AB\u2019nin GDPR\u2019\
          \u0131) veya d\xFCzenlemelere (\xF6r. finansal veriler i\xE7in PCI DSS)\
          \ tabi ise, ekstra koruma gerektirir. B\xF6yle veriler i\xE7in:\n\n* Herhangi\
          \ bir veri clear text olarak m\u0131 iletiliyor? Bu, HTTP, SMTP, FTP gibi\
          \ protokolleri ve STARTTLS gibi TLS upgrade\u2019lerini de kapsar. Harici\
          \ internet trafi\u011Fi tehlikelidir. Load balancer\u2019lar, web server\u2019\
          lar veya back-end sistemler aras\u0131ndaki t\xFCm internal trafi\u011F\
          i do\u011Frulay\u0131n.\n\n* Varsay\u0131lan olarak veya eski kodlarda herhangi\
          \ bir eski/zay\u0131f kriptografik algoritma ya da protokol kullan\u0131\
          l\u0131yor mu?\n\n* Varsay\u0131lan crypto key\u2019ler mi kullan\u0131\
          l\u0131yor, zay\u0131f key\u2019ler mi \xFCretiliyor veya do\u011Fru key\
          \ management/rotation eksik mi? Crypto key\u2019ler source code repository\u2019\
          lere commitlenmi\u015F mi?\n\n* Encryption zorunlu k\u0131l\u0131nm\u0131\
          yor mu; \xF6rne\u011Fin (browser) security directive\u2019leri veya HTTP\
          \ header\u2019lar\u0131 eksik mi?\n\n* Al\u0131nan server certificate ve\
          \ trust chain d\xFCzg\xFCn bi\xE7imde do\u011Frulan\u0131yor mu?\n\n* Initialization\
          \ vector\u2019lar (IV) yok say\u0131l\u0131yor, yeniden kullan\u0131l\u0131\
          yor veya ilgili mode of operation i\xE7in yeterince g\xFCvenli \xFCretilmiyor\
          \ mu? ECB gibi g\xFCvenli olmayan bir mode kullan\u0131l\u0131yor mu? Sadece\
          \ encryption yerine authenticated encryption daha uygunken yanl\u0131\u015F\
          \ kullan\u0131m var m\u0131?\n\n* Password-based key derivation function\
          \ olmaks\u0131z\u0131n parolalar crypto key olarak m\u0131 kullan\u0131\
          l\u0131yor?\n\n* Kriptografik ama\xE7lar i\xE7in tasarlanmam\u0131\u015F\
          \ randomness mi kullan\u0131l\u0131yor? Do\u011Fru fonksiyon se\xE7ilmi\u015F\
          \ olsa bile developer taraf\u0131ndan seed edilmesi gerekiyor mu ve e\u011F\
          er gerekmiyorsa, developer g\xFC\xE7l\xFC seeding\u2019i d\xFC\u015F\xFC\
          k entropy/tahmin edilebilir bir seed ile ezmi\u015F olabilir mi?\n\n* MD5\
          \ veya SHA1 gibi deprecated hash fonksiyonlar\u0131 kullan\u0131l\u0131\
          yor mu ya da kriptografik hash gereken yerlerde non-cryptographic hash fonksiyonlar\u0131\
          \ m\u0131 kullan\u0131l\u0131yor?\n\n* PKCS number 1 v1.5 gibi deprecated\
          \ cryptographic padding y\xF6ntemleri kullan\u0131l\u0131yor mu?\n\n* Cryptographic\
          \ error message\u2019lar veya side-channel bilgiler exploitable m\u0131\
          ; \xF6rne\u011Fin padding oracle sald\u0131r\u0131lar\u0131yla?\n\nASVS\
          \ Crypto (V7), Data Protection (V9) ve SSL/TLS (V10)\u2019a bak\u0131n."
        annotation: "## Score table\n\n| CWEs E\u015Fle\u015Ftirildi | Maks G\xF6\
          r\xFClme Oran\u0131 | Ort. G\xF6r\xFClme Oran\u0131 | Ort. A\u011F\u0131\
          rl\u0131kl\u0131 Exploit | Ort. A\u011F\u0131rl\u0131kl\u0131 Impact | Maks\
          \ Coverage | Ort. Coverage | Toplam Olay | Toplam CVE |\n| :---------------:\
          \ | :----------------: | :----------------: | :--------------------: | :-------------------:\
          \ | :-----------: | :-----------: | :---------: | :--------: |\n|      \
          \   29        |       46.44%       |        4.49%       |          7.29\
          \          |          6.81         |     79.33%    |     34.85%    |   233,788\
          \   |    3,075   |\n\n\n## How to prevent\n\nMinimum olarak \u015Funlar\u0131\
          \ yap\u0131n ve referanslar\u0131 dan\u0131\u015F\u0131n:\n\n* Uygulaman\u0131\
          n i\u015Fledi\u011Fi, depolad\u0131\u011F\u0131 veya iletti\u011Fi verileri\
          \ s\u0131n\u0131fland\u0131r\u0131n. Hangi verilerin gizlilik yasalar\u0131\
          , d\xFCzenleyici gereklilikler veya i\u015F ihtiya\xE7lar\u0131 a\xE7\u0131\
          s\u0131ndan hassas oldu\u011Funu belirleyin.\n\n* Gereksiz yere hassas veri\
          \ depolamay\u0131n. M\xFCmk\xFCn olan en k\u0131sa s\xFCrede at\u0131n veya\
          \ PCI DSS uyumlu tokenization ya da truncation kullan\u0131n. Saklanmayan\
          \ veri \xE7al\u0131namaz.\n\n* T\xFCm hassas verileri at rest durumda encrypt\
          \ edin.\n\n* G\xFCncel ve g\xFC\xE7l\xFC standart algoritma, protokol ve\
          \ key\u2019leri kullan\u0131n; do\u011Fru key management uygulay\u0131n.\n\
          \n* T\xFCm verileri in transit durumda TLS gibi secure protocol\u2019lerle\
          \ encrypt edin; forward secrecy (FS) cipher\u2019lar\u0131, server taraf\u0131\
          nda cipher \xF6nceliklendirmesi ve secure parametreler kullan\u0131n. HTTP\
          \ Strict Transport Security (HSTS) gibi directive\u2019lerle encryption\u2019\
          \u0131 zorunlu k\u0131l\u0131n.\n\n* Hassas veri i\xE7eren response\u2019\
          lar i\xE7in caching\u2019i devre d\u0131\u015F\u0131 b\u0131rak\u0131n.\n\
          \n* Veri s\u0131n\u0131fland\u0131rmas\u0131na g\xF6re gerekli security\
          \ control\u2019lerini uygulay\u0131n.\n\n* Hassas veri ta\u015F\u0131mak\
          \ i\xE7in FTP ve SMTP gibi legacy protokolleri kullanmay\u0131n.\n\n* Parolalar\u0131\
          \ Argon2, scrypt, bcrypt veya PBKDF2 gibi g\xFC\xE7l\xFC, adaptive ve salted\
          \ hashing function\u2019lar\u0131yla, uygun work factor (delay factor) kullanarak\
          \ saklay\u0131n.\n\n* Initialization vector (IV) se\xE7imi mode of operation\u2019\
          a uygun olmal\u0131d\u0131r. Bir\xE7ok mode i\xE7in CSPRNG (cryptographically\
          \ secure pseudo random number generator) uygundur. Nonce gerektiren mode\u2019\
          larda IV i\xE7in CSPRNG gerekmez. T\xFCm durumlarda, sabit bir key i\xE7\
          in ayn\u0131 IV asla iki kez kullan\u0131lmamal\u0131d\u0131r.\n\n* Sadece\
          \ encryption yerine her zaman authenticated encryption kullan\u0131n.\n\n\
          * Key\u2019ler kriptografik olarak rastgele \xFCretilmeli ve memory\u2019\
          de byte array olarak saklanmal\u0131d\u0131r. E\u011Fer password kullan\u0131\
          lacaksa, uygun bir password-based key derivation function ile key\u2019\
          e d\xF6n\xFC\u015Ft\xFCr\xFClmelidir.\n\n* Gereken yerlerde kriptografik\
          \ randomness kullan\u0131ld\u0131\u011F\u0131ndan ve tahmin edilebilir/d\xFC\
          \u015F\xFCk entropy ile seed edilmedi\u011Finden emin olun. Modern API\u2019\
          lerin \xE7o\u011Fu g\xFCvenlik i\xE7in developer\u2019\u0131n CSPRNG\u2019\
          yi seed etmesini gerektirmez.\n\n* MD5, SHA1, PKCS number 1 v1.5 gibi deprecated\
          \ kriptografik fonksiyon ve padding \u015Femalar\u0131ndan ka\xE7\u0131\
          n\u0131n.\n\n* Konfig\xFCrasyon ve ayarlar\u0131n etkinli\u011Fini ba\u011F\
          \u0131ms\u0131z \u015Fekilde do\u011Frulay\u0131n.\n\n\n## Example attack\
          \ scenarios\n\n**Senaryo #1**: Bir uygulama, veritaban\u0131ndaki kredi\
          \ kart\u0131 numaralar\u0131n\u0131 otomatik veritaban\u0131 encryption\u2019\
          \u0131 ile \u015Fifreliyor. Ancak bu veriler geri \xE7ekildi\u011Finde otomatik\
          \ olarak decrypt ediliyor; bu da bir SQL injection a\xE7\u0131\u011F\u0131\
          n\u0131n kredi kart\u0131 numaralar\u0131n\u0131 clear text olarak almas\u0131\
          na izin veriyor.\n\n**Senaryo #2**: Bir site t\xFCm sayfalar i\xE7in TLS\
          \ kullanm\u0131yor/enforce etmiyor veya zay\u0131f encryption destekliyor.\
          \ Bir sald\u0131rgan (\xF6r. g\xFCvensiz bir kablosuz a\u011Fda) a\u011F\
          \ trafi\u011Fini izliyor, ba\u011Flant\u0131lar\u0131 HTTPS\u2019ten HTTP\u2019\
          ye downgrade ediyor, istekleri kesiyor ve kullan\u0131c\u0131n\u0131n session\
          \ cookie\u2019sini \xE7al\u0131yor. Sald\u0131rgan daha sonra bu cookie\u2019\
          yi yeniden oynat\u0131p kullan\u0131c\u0131n\u0131n (authenticated) oturumunu\
          \ ele ge\xE7iriyor ve \xF6zel verilere eri\u015Fiyor veya bunlar\u0131 de\u011F\
          i\u015Ftiriyor. Alternatif olarak ta\u015F\u0131nan t\xFCm verileri de manip\xFC\
          le edebilir (\xF6r. bir para transferinin al\u0131c\u0131s\u0131n\u0131\
          ).\n\n**Senaryo #3**: Parola veritaban\u0131, herkesin parolas\u0131n\u0131\
          \ unsalted veya basit hash\u2019lerle sakl\u0131yor. Bir file upload a\xE7\
          \u0131\u011F\u0131, sald\u0131rgan\u0131n parola veritaban\u0131n\u0131\
          \ almas\u0131na izin veriyor. T\xFCm unsalted hash\u2019ler, \xF6nceden\
          \ hesaplanm\u0131\u015F hash\u2019lerin bulundu\u011Fu rainbow table ile\
          \ a\xE7\u0131\u011Fa \xE7\u0131kar\u0131labiliyor. Basit veya h\u0131zl\u0131\
          \ hash fonksiyonlar\u0131yla \xFCretilen hash\u2019ler, salted olsalar bile\
          \ GPU\u2019larla k\u0131r\u0131labilir.\n\n\nReferanslar ve e\u015Flenen\
          \ CWE listesi hakk\u0131nda daha fazla bilgi: https://top10.owasp.org/2021/tr/A02_2021-Cryptographic_Failures/"
      zh:
        name: "\u52A0\u5BC6\u6A5F\u5236\u5931\u6548"
        description: "\u9996\u5148\u786E\u5B9A\u975C\u6001\u8D44\u6599\u53CA\u8D44\
          \u6599\u4F20\u8F93\u7684\u9632\u62A4\u9700\u6C42\uFF0C\u4E3E\u4F8B\u4F86\
          \u8BF4\uFF0C\u5BC6\u7801\u3001\u4FE1\u7528\u5361\u5361\u53F7\u3001\u5065\
          \u5EB7\u8BB0\u5F55\u3001\u4E2A\u8D44\u3001\u4EE5\u53CA\u9700\u8981\u989D\
          \u5916\u4FDD\u62A4\u7684\u8425\u4E1A\u7955\u5BC6...\u7B49\u7B49\u4E3B\u8981\
          \u88AB\u9690\u79C1\u6CD5\u6240\u4FDD\u62A4\u7684\u8D44\u6599\uFF0C\u5982\
          \u6B27\u76DF GDPR \u6216 PCIDSS \u7B49\u7B49\u91D1\u878D\u4E1A\u76F8\u5173\
          \u7684\u8D44\u6599\u4FDD\u62A4\u6CD5\u6216\u6807\u51C6\u3002\u5BF9\u4E8E\
          \u8FD9\u4E9B\u8D44\u6599\u9700\u8003\u91CF:\n\n- \u662F\u5426\u4EE5\u660E\
          \u6587\u5F62\u5F0F\u4F20\u8F93\u4EFB\u4F55\u6570\u636E? \u50CF\u662F HTTP,\
          \ SMTP, FTP \u7B49\u7B49\u534F\u5B9A\uFF0C\u4F7F\u7528\u4E8E\u5BF9\u5916\
          \u7F51\u9645\u7F51\u7EDC\u7684\u6D41\u91CF\u662F\u5371\u9669\u7684\u3002\
          \u5FC5\u987B\u9A8C\u8BC1\u6240\u6709\u7684\u5167\u90E8\u6D41\u91CF\uFF0C\
          \u5982\u5728\u8D1F\u8F7D\u5E73\u8861\u5668\u3001\u7F51\u7AD9\u670D\u52A1\
          \u5668\u3001\u6216\u540E\u7AEF\u7CFB\u7EDF\u4E4B\u95F4 \u3002\n\n- \u662F\
          \u5426\u6709\u4EFB\u4F55\u8001\u65E7\u6216\u8106\u5F31\u7684\u52A0\u5BC6\
          \u6F14\u7B97\u6CD5\u88AB\u9884\u8BBE\u4F7F\u7528\u6216\u5B58\u5728\u4E8E\
          \u8F83\u65E7\u7684\u7A0B\u5F0F\u7801?\n\n- \u662F\u5426\u6B63\u5728\u4F7F\
          \u7528\u9ED8\u8BA4\u7684\u52A0\u5BC6\u5BC6\u94A5\u3001\u662F\u5426\u751F\
          \u6210\u4E86\u5F31\u52A0\u5BC6\u5BC6\u94A5\u5E76\u91CD\u590D\u4F7F\u7528\
          \uFF0C\u662F\u5426\u6709\u9002\u5F53\u7684\u5BC6\u94A5\u7BA1\u7406\u6216\
          \u8F6E\u6362?\u52A0\u5BC6\u5BC6\u94A5\u662F\u5426\u88AB\u5199\u5165\u6E90\
          \u4EE3\u7801\u4E2D\uFF1F\n\n- \u662F\u5426\u672A\u5F3A\u5236\u6267\u884C\
          \u52A0\u5BC6? \u4E3E\u4F8B: HTTP headers(\u6D4F\u89C8\u5668)\u662F\u5426\
          \u6709\u9057\u5931\u5B89\u5168\u76F8\u5173\u7684\u6307\u4EE4\u6216\u5934\
          \u4FE1\u606F?\n\n- \u6536\u5230\u7684\u670D\u52A1\u5668\u8BC1\u4E66\u548C\
          \u4FE1\u4EFB\u94FE\u662F\u5426\u6B63\u786E\u9A8C\u8BC1\uFF1F\n\n\u8BF7\u53C3\
          \u8003 ASVS \u52A0\u5BC6(V7), \u8D44\u6599\u4FDD\u62A4(V9), \u53CA SSL/TLS(V10)\u3002"
        annotation: "## Score table\n\n| \u53EF\u5BF9\u7167 CWEs \u6570\u91CF | \u6700\
          \u5927\u53D1\u751F\u7387 | \u5E73\u5747\u53D1\u751F\u7387 | \u6700\u5927\
          \u8986\u76D6\u8303\u56F4 | \u5E73\u5747\u8986\u76D6\u8303\u56F4 | \u5E73\
          \u5747\u52A0\u6743\u6F0F\u6D1E | \u5E73\u5747\u52A0\u6743\u5F71\u54CD |\
          \ \u51FA\u73B0\u6B21\u6570 | \u6240\u6709\u76F8\u5173 CVEs \u6570\u91CF\
          \ |\n| :--------------: | :--------: | :--------: | :----------: | :----------:\
          \ | :----------: | :----------: | :------: | :----------------: |\n|   \
          \     29        |   46.44%   |   4.49%    |    79.33%    |    34.85%   \
          \ |     7.29     |     6.81     | 233,788  |       3,075        |\n\n\n\
          ## How to prevent\n\n\u81F3\u5C11\u6267\u884C\u4EE5\u4E0B\u63AA\u65BD\uFF0C\
          \u5E76\u53C2\u8003\u76F8\u5173\u8D44\u6599:\n\n- \u5BF9\u5E94\u7528\u7A0B\
          \u5F0F\u5904\u7406\u3001\u5B58\u50A8\u3001\u4F20\u8F93\u7684\u8D44\u6599\
          \u8FDB\u884C\u5206\u7C7B\uFF0C\u6839\u636E\u9690\u79C1\u6CD5\u3001\u6CD5\
          \u4EE4\u6CD5\u89C4\u3001\u6216\u5546\u4E1A\u9700\u6C42\u8FA8\u8BA4\u54EA\
          \u4E9B\u4E3A\u654F\u611F\u6027\u8D44\u6599\u3002\n\n- \u4F9D\u7167\u5206\
          \u7C7B\u6267\u884C\u5BF9\u5E94\u7684\u63A7\u5236\u63AA\u65BD\u3002\n\n-\
          \ \u975E\u5FC5\u8981\u4E0D\u50A8\u5B58\u654F\u611F\u6027\u8D44\u6599\uFF0C\
          \u5C3D\u5FEB\u820D\u5F03\u6216\u4F7F\u7528\u7B26\u5408 PCIDSS \u7684\u8D44\
          \u6599\u8BB0\u53F7\u5316(tokenization)\u751A\u81F3\u622A\u65AD(truncation)\u3002\
          \ \u6C92\u6709\u88AB\u4FDD\u5B58\u7684\u6570\u636E\u662F\u4E0D\u4F1A\u88AB\
          \u7A83\u53D6\u7684\u3002\n\n- \u786E\u4FDD\u5C06\u6240\u6709\u975C\u6001\
          \u7684\u654F\u611F\u6027\u8D44\u6599\u52A0\u5BC6\u3002\n\n- \u786E\u8BA4\
          \u4F7F\u7528\u6700\u65B0\u7248\u4E14\u6807\u51C6\u7684\u5F37\u6F14\u7B97\
          \u6CD5\u3001\u534F\u5B9A\u53CA\u5BC6\u94A5; \u4F7F\u7528\u9002\u5F53\u7684\
          \u5BC6\u94A5\u7BA1\u7406\u3002\n\n- \u4F7F\u7528\u5B89\u5168\u7684\u534F\
          \u5B9A\u52A0\u5BC6\u4F20\u8F93\u4E2D\u7684\u8D44\u6599\uFF0C\u50CF\u662F\
          \u6709\u5B8C\u5168\u524D\u5411\u4FDD\u5BC6(PFS)\u3001\u670D\u52A1\u5668\u52A0\
          \u5BC6\u4F18\u5148\u987A\u5E8F(cipher prioritization by the server)\u53CA\
          \u5B89\u5168\u53C3\u6570\u7684 TLS\u3002 \u4F7F\u7528\u5982 HTTP \u5F37\u5236\
          \u5B89\u5168\u4F20\u8F93\u6280\u672F(HSTS)\u7684\u6307\u4EE4\u5F37\u5316\
          \u52A0\u5BC6\u3002\n\n- \u9488\u5BF9\u5305\u542B\u654F\u611F\u8D44\u6599\
          \u7684\u56DE\u5E94\u505C\u7528\u7F13\u5B58\u3002\n\n- \u4F7F\u7528\u5177\
          \u6709\u6563\u5217/\u5EF6\u8FDF\u56E0\u7D20(work factor/delay factor)\uFF0C\
          \u5982 Argon2, scrypt, bcrypt \u6216 PBKDF2 \u7684\u5F37\u81EA\u9002\u5E94\
          \u6027\u52A0\u76D0\u6563\u5217\u51FD\u6570\u4F86\u50A8\u5B58\u5BC6\u7801\
          \u3002\n\n- \u72EC\u7ACB\u9A8C\u8BC1\u8BBE\u5B9A\u7684\u6709\u6548\u6027\
          \u3002\n\n\n## Example attack scenarios\n\n**\u60C5\u5883 #1**: \u6709\u4E00\
          \u4E2A\u5E94\u7528\u7A0B\u5F0F\u4F7F\u7528\u81EA\u52A8\u5316\u8D44\u6599\
          \u5E93\u52A0\u5BC6\u4F86\u52A0\u5BC6\u8D44\u6599\u5E93\u4E2D\u7684\u4FE1\
          \u7528\u5361\u5361\u53F7\uFF0C\u4F46\u662F\u8D44\u6599\u88AB\u68C0\u7D22\
          \u65F6\u662F\u88AB\u81EA\u52A8\u89E3\u5BC6\u7684\uFF0C\u8FDB\u800C\u5141\
          \u8BB8\u900F\u8FC7 SQL \u6CE8\u5165\u7F3A\u9677\u4F86\u68C0\u7D22\u4FE1\u7528\
          \u5361\u5361\u53F7\u660E\u6587\u3002\n\n**\u60C5\u5883 #2**: \u6709\u4E00\
          \u4E2A\u7AD9\u53F0\u6C92\u6709\u5BF9\u6240\u6709\u9875\u9762\u5F37\u5236\
          \u4F7F\u7528 TLS \u6216\u652F\u63F4\u8106\u5F31\u7684\u52A0\u5BC6\uFF0C\u653B\
          \u51FB\u8005\u76D1\u63A7\u7F51\u7EDC\u6D41\u91CF(\u5982\u5728\u4E0D\u5B89\
          \u5168\u7684\u65E0\u7EBF\u7F51\u7EDC), \u5C06\u8FDE\u7EBF\u4ECE HTTPS \u964D\
          \u7EA7\u6210 HTTP\uFF0C\u5E76\u62E6\u622A\u8BF7\u6C42\u7A83\u53D6\u4F7F\u7528\
          \u8005\u7684\u4F1A\u8BDD(session) cookies\uFF0C\u4E4B\u540E\u653B\u51FB\u8005\
          \u91CD\u9001\u7A83\u53D6\u5230\u7684\u4F1A\u8BDD(session) cookies \u5E76\
          \u52AB\u6301\u7528\u6237(\u8BA4\u8BC1\u8FC7\u7684)\u7684\u4F1A\u8BDD\uFF0C\
          \u8FDB\u800C\u68C0\u7D22\u6216\u4FEE\u6539\u4F7F\u7528\u8005\u7684\u9690\
          \u79C1\u8D44\u6599\u3002 \u9664\u4E86\u4E0A\u8FF0\u4EE5\u5916\uFF0C\u653B\
          \u51FB\u8005\u4E5F\u80FD\u4FEE\u6539\u4F20\u8F93\u7684\u8D44\u6599\uFF0C\
          \u5982\u6C47\u6B3E\u6536\u6B3E\u4EBA\u3002\n\n**\u60C5\u5883 #3**: \u5BC6\
          \u7801\u8D44\u6599\u5E93\u4F7F\u7528\u672A\u88AB\u52A0\u76D0\u6216\u7B80\
          \u5355\u7684\u6563\u5217\u51FD\u6570\u4F86\u50A8\u5B58\u6BCF\u4E2A\u4EBA\
          \u7684\u5BC6\u7801\uFF0C\u4E00\u4E2A\u6863\u6848\u4E0A\u4F20\u7684\u7F3A\
          \u9677\u53EF\u4EE5\u8BA9\u653B\u51FB\u8005\u5B58\u53D6\u5BC6\u7801\u8D44\
          \u6599\u5E93\uFF0C\u6240\u6709\u672A\u88AB\u52A0\u76D0\u7684\u54C8\u5E0C\
          \u53EF\u4EE5\u88AB\u9884\u5148\u8BA1\u7B97\u597D\u7684\u5F69\u8679\u8868\
          \u89E3\u5BC6\u3002\u5373\u4F7F\u52A0\u76D0\uFF0C\u7531\u7B80\u5355\u6216\
          \u5FEB\u901F\u7684\u54C8\u5E0C\u4ECD\u80FD\u88AB GPU \u7834\u89E3\u3002\n\
          \n\n\u6709\u95DC\u53C3\u8003\u8CC7\u6599\u53CA\u5DF2\u5C0D\u61C9 CWE \u6E05\
          \u55AE\u7684\u66F4\u591A\u8CC7\u8A0A\uFF1A https://top10.owasp.org/2021/zh-Hant/A02_2021-Cryptographic_Failures/"
  - urn: urn:intuitem:risk:threat:a03
    ref_id: A03:2021
    name: Injection
    description: "An application is vulnerable to attack when:\n\n-   User-supplied\
      \ data is not validated, filtered, or sanitized by the\n    application.\n\n\
      -   Dynamic queries or non-parameterized calls without context-aware\n    escaping\
      \ are used directly in the interpreter.\n\n-   Hostile data is used within object-relational\
      \ mapping (ORM) search\n    parameters to extract additional, sensitive records.\n\
      \n-   Hostile data is directly used or concatenated. The SQL or command\n  \
      \  contains the structure and malicious data in dynamic queries,\n    commands,\
      \ or stored procedures.\n\nSome of the more common injections are SQL, NoSQL,\
      \ OS command, Object\nRelational Mapping (ORM), LDAP, and Expression Language\
      \ (EL) or Object\nGraph Navigation Library (OGNL) injection. The concept is\
      \ identical\namong all interpreters. Source code review is the best method of\n\
      detecting if applications are vulnerable to injections. Automated\ntesting of\
      \ all parameters, headers, URL, cookies, JSON, SOAP, and XML\ndata inputs is\
      \ strongly encouraged. Organizations can include\nstatic (SAST), dynamic (DAST),\
      \ and interactive (IAST) application security testing tools into the CI/CD\n\
      pipeline to identify introduced injection flaws before production\ndeployment."
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 33          | 19.09%             | 3.37%              | 7.25             \
      \    | 7.15                | 94.04%       | 47.90%       | 274,228         \
      \  | 32,078     |\n\n\n## How to prevent\n\nPreventing injection requires keeping\
      \ data separate from commands and queries:\n\n-   The preferred option is to\
      \ use a safe API, which avoids using the\n    interpreter entirely, provides\
      \ a parameterized interface, or\n    migrates to Object Relational Mapping Tools\
      \ (ORMs).<br/>\n    **Note:** Even when parameterized, stored procedures can\
      \ still introduce\n    SQL injection if PL/SQL or T-SQL concatenates queries\
      \ and data or\n    executes hostile data with EXECUTE IMMEDIATE or exec().\n\
      \n-   Use positive server-side input validation. This is\n    not a complete\
      \ defense as many applications require special\n    characters, such as text\
      \ areas or APIs for mobile applications.\n\n-   For any residual dynamic queries,\
      \ escape special characters using\n    the specific escape syntax for that interpreter.<br/>\n\
      \    **Note:** SQL structures such as table names, column names, and so on\n\
      \    cannot be escaped, and thus user-supplied structure names are\n    dangerous.\
      \ This is a common issue in report-writing software.\n\n\n## Example attack\
      \ scenarios\n\n**Scenario #1:** An application uses untrusted data in the construction\n\
      of the following vulnerable SQL call:\n```\nString query = \"SELECT \\* FROM\
      \ accounts WHERE custID='\" + request.getParameter(\"id\") + \"'\";\n```\n\n\
      **Scenario #2:** Similarly, an application\u2019s blind trust in frameworks\n\
      may result in queries that are still vulnerable, (e.g., Hibernate Query\nLanguage\
      \ (HQL)):\n```\n Query HQLQuery = session.createQuery(\"FROM accounts WHERE\
      \ custID='\" + request.getParameter(\"id\") + \"'\");\n```\n\nIn both cases,\
      \ the attacker modifies the \u2018id\u2019 parameter value in their\nbrowser\
      \ to send: ' UNION SLEEP(10);--. For example:\n```\n http://example.com/app/accountView?id='\
      \ UNION SELECT SLEEP(10);--\n```\n\nThis changes the meaning of both queries\
      \ to return all the records from\nthe accounts table. More dangerous attacks\
      \ could modify or delete data\nor even invoke stored procedures.\n\n\nFor more\
      \ information about the references and the list of mapped CWEs: https://top10.owasp.org/2021/A03_2021-Injection/"
