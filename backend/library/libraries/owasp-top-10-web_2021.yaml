  - urn: urn:intuitem:risk:threat:a08
    ref_id: A08:2021
    name: Software and Data Integrity Failures
    description: 'Software and data integrity failures relate to code and infrastructure

      that does not protect against integrity violations. An example of this is where
      an application relies upon plugins, libraries, or modules from untrusted sources,
      repositories, and content

      delivery networks (CDNs). An insecure CI/CD pipeline can introduce the

      potential for unauthorized access, malicious code, or system compromise.

      Lastly, many applications now include auto-update functionality, where

      updates are downloaded without sufficient integrity verification and

      applied to the previously trusted application. Attackers could

      potentially upload their own updates to be distributed and run on all

      installations. Another example is where

      objects or data are encoded or serialized into a structure that an

      attacker can see and modify is vulnerable to insecure deserialization.'
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 10          | 16.67%             | 2.05%              | 6.94             \
      \    | 7.94                | 75.04%       | 45.35%       | 47,972          \
      \  | 1,152      |\n\n\n## How to prevent\n\n-   Use digital signatures or similar\
      \ mechanisms to verify the software or data is from the expected source and\
      \ has not been altered.\n\n-   Ensure libraries and dependencies, such as npm\
      \ or Maven, are\n    consuming trusted repositories. If you have a higher risk\
      \ profile, consider hosting an internal known-good repository that's vetted.\n\
      \n-   Ensure that a software supply chain security tool, such as OWASP\n   \
      \ Dependency Check or OWASP CycloneDX, is used to verify that\n    components\
      \ do not contain known vulnerabilities\n\n-   Ensure that there is a review\
      \ process for code and configuration changes to minimize the chance that malicious\
      \ code or configuration could be introduced into your software pipeline.\n\n\
      -   Ensure that your CI/CD pipeline has proper segregation, configuration, and\
      \ access\n    control to ensure the integrity of the code flowing through the\n\
      \    build and deploy processes.\n\n-   Ensure that unsigned or unencrypted\
      \ serialized data is not sent to\n    untrusted clients without some form of\
      \ integrity check or digital\n    signature to detect tampering or replay of\
      \ the serialized data\n\n\n## Example attack scenarios\n\n**Scenario #1 Update\
      \ without signing:** Many home routers, set-top\nboxes, device firmware, and\
      \ others do not verify updates via signed\nfirmware. Unsigned firmware is a\
      \ growing target for attackers and is\nexpected to only get worse. This is a\
      \ major concern as many times there\nis no mechanism to remediate other than\
      \ to fix in a future version and\nwait for previous versions to age out.\n\n\
      **Scenario #2 SolarWinds malicious update**: Nation-states have been\nknown\
      \ to attack update mechanisms, with a recent notable attack being\nthe SolarWinds\
      \ Orion attack. The company that develops the software had\nsecure build and\
      \ update integrity processes. Still, these were able to\nbe subverted, and for\
      \ several months, the firm distributed a highly\ntargeted malicious update to\
      \ more than 18,000 organizations, of which\naround 100 or so were affected.\
      \ This is one of the most far-reaching and\nmost significant breaches of this\
      \ nature in history.\n\n**Scenario #3 Insecure Deserialization:** A React application\
      \ calls a\nset of Spring Boot microservices. Being functional programmers, they\n\
      tried to ensure that their code is immutable. The solution they came up\nwith\
      \ is serializing the user state and passing it back and forth with\neach request.\
      \ An attacker notices the \"rO0\" Java object signature (in base64) and\nuses\
      \ the Java Serial Killer tool to gain remote code execution on the\napplication\
      \ server.\n\n\nFor more information about the references and the list of mapped\
      \ CWEs: https://top10.owasp.org/2021/A08_2021-Software_and_Data_Integrity_Failures/"
