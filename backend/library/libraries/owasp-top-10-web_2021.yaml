          \ \u0623\u062D\u062F \u0627\u0644\u0623\u062C\u0647\u0632\u0629 \u0627\u0644\
          \u0645\u0648\u062C\u0648\u062F\u0629 \u0641\u064A \u0627\u0644\u0623\u0645\
          \u0627\u0643\u0646 \u0627\u0644\u0639\u0627\u0645\u0629 \u0644\u0644\u0648\
          \u0635\u0648\u0644 \u0625\u0644\u0649 \u0623\u062D\u062F \u0627\u0644\u062A\
          \u0637\u0628\u064A\u0642\u0627\u062A \u0628\u062F\u0644\u064B\u0627 \u0645\
          \u0646 \u0627\u062E\u062A\u064A\u0627\u0631 \"\u062A\u0633\u062C\u064A\u0644\
          \ \u0627\u0644\u062E\u0631\u0648\u062C\"\u060C \u064A\u0642\u0648\u0645\
