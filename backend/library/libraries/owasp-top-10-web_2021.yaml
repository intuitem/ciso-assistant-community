      pt:
        name: "Configura\xE7\xE3o Incorreta de Seguran\xE7a"
        description: "A aplica\xE7\xE3o pode ser vulner\xE1vel se for:\n\n- Falta\
          \ de prote\xE7\xE3o de seguran\xE7a apropriada em qualquer parte\n    da\
          \ _stack_ das aplica\xE7\xF5es ou permiss\xF5es configuradas incorretamente\n\
          \    em servi\xE7os em nuvem.\n\n- Recursos desnecess\xE1rios s\xE3o ativados\
          \ ou instalados (por exemplo,\n    portas, servi\xE7os, p\xE1ginas, contas\
          \ ou privil\xE9gios desnecess\xE1rios).\n\n- As contas padr\xE3o e suas\
          \ senhas ainda est\xE3o ativadas e inalteradas.\n\n- O tratamento de erros\
          \ revela _stack traces_ ou outras\n    mensagens de erro excessivamente\
          \ informativas aos usu\xE1rios.\n\n- Para sistemas atualizados, os recursos\
          \ de seguran\xE7a mais recentes\n    est\xE3o desabilitados ou n\xE3o est\xE3\
          o configurados com seguran\xE7a.\n\n- As configura\xE7\xF5es de seguran\xE7\
          a nos servidores das aplica\xE7\xF5es, nos\n    _frameworks_ (por exemplo,\
          \ Struts, Spring, ASP.NET), bibliotecas,\n    bancos de dados, etc., n\xE3\
          o est\xE3o definidas para proteger os valores.\n\n- O servidor n\xE3o envia\
          \ cabe\xE7alhos ou diretivas de seguran\xE7a, ou eles\n    n\xE3o est\xE3\
          o configurados para proteger os valores.\n\n- O software est\xE1 desatualizado\
          \ ou vulner\xE1vel (consulte\n  [A06: 2021-Componentes Vulner\xE1veis e\
          \ Desatualizados](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\n\
          Sem um processo de configura\xE7\xE3o de seguran\xE7a de aplica\xE7\xF5\
          es que seja integrado e\nrepet\xEDvel, os sistemas correm um risco maior."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:-------------------------:|:------------------------:|:--------------------------:|:-----------------------:|:----------------:|:---------------:|:--------------------:|:-------------:|\n\
          | 20            | 19.84%                    | 4.51%                    |\
          \ 8.12                       | 6.56                    | 89.58%        \
          \   | 44.84%          | 208,387              | 789           |\n\n\n## How\
          \ to prevent\n\nDevem ser implementados processos de instala\xE7\xE3o segura,\
          \ incluindo:\n\n- Um processo de prote\xE7\xE3o repet\xEDvel torna mais\
          \ r\xE1pido e f\xE1cil implantar\n    outro ambiente que esteja devidamente\
          \ bloqueado. Os ambientes de\n    desenvolvimento, controle de qualidade\
          \ e produ\xE7\xE3o devem ser todos\n    configurados de forma id\xEAntica,\
          \ com credenciais diferentes usadas\n    em cada ambiente. Este processo\
          \ deve ser automatizado para minimizar\n    o esfor\xE7o necess\xE1rio para\
          \ configurar um novo ambiente seguro.\n\n- Uma plataforma m\xEDnima sem\
          \ recursos, componentes, documenta\xE7\xE3o e outros\n    desnecess\xE1\
          rios. Remova ou n\xE3o instale recursos e estruturas n\xE3o utilizados.\n\
          \n- Uma tarefa para revisar e atualizar as configura\xE7\xF5es apropriadas\
          \ para todas\n    as notas de seguran\xE7a, atualiza\xE7\xF5es e patches\
          \ como parte do processo de\n    gerenciamento de patch (consulte\n    [A06:\
          \ 2021-Componentes Vulner\xE1veis e Desatualizados](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\
          \    Revise as permiss\xF5es de armazenamento em nuvem (por exemplo, _S3\
          \ bucket permissions_).\n\n- Uma arquitetura de aplica\xE7\xE3o segmentada\
          \ fornece separa\xE7\xE3o eficaz e\n    segura entre componentes ou _tenants_,\
          \ com segmenta\xE7\xE3o,\n    conteineriza\xE7\xE3o ou grupos de seguran\xE7\
          a em nuvem (ACLs).\n\n- Envio de diretivas de seguran\xE7a para clientes,\
          \ por exemplo, _Security Headers_.\n\n- Um processo automatizado para verificar\
          \ a efic\xE1cia das configura\xE7\xF5es\n    em todos os ambientes.\n\n\n\
          ## Example attack scenarios\n\n**Cen\xE1rio #1:** O servidor da aplica\xE7\
          \xE3o \xE9 fornecido com os sistemas de amostra\nn\xE3o removidos do servidor\
          \ de produ\xE7\xE3o. Esses aplicativos de amostra t\xEAm\nfalhas de seguran\xE7\
          a conhecidas que os invasores usam para comprometer o\nservidor. Suponha\
          \ que um desses aplicativos seja o console de administra\xE7\xE3o\ne as\
          \ contas padr\xE3o n\xE3o tenham sido alteradas. Nesse caso, o invasor\n\
          efetua login com as senhas padr\xE3o e assume o controle.\n\n**Cen\xE1rio\
          \ #2:** A listagem do diret\xF3rio n\xE3o est\xE1 desabilitada no servidor.\n\
          Um invasor descobre que pode simplesmente listar diret\xF3rios. O invasor\n\
          encontra e baixa as classes Java compiladas, que ele descompila e\nfaz engenharia\
          \ reversa para visualizar o c\xF3digo. O invasor ent\xE3o\nencontra uma\
          \ falha grave de controle de acesso no aplicativo.\n\n**Cen\xE1rio #3:**\
          \ A configura\xE7\xE3o do servidor de aplica\xE7\xF5es permite que os\n\
          detalhes das mensagens de erro, por exemplo, _stack trace_, sejam retornadas\n\
          aos usu\xE1rios. Isso potencialmente exp\xF5e informa\xE7\xF5es confidenciais\
          \ ou falhas\nsubjacentes, como vers\xF5es de componentes que s\xE3o conhecidas\
          \ por serem vulner\xE1veis.\n\n**Cen\xE1rio #4:** Um provedor de servi\xE7\
          os de nuvem tem permiss\xF5es de\ncompartilhamento padr\xE3o abertas para\
          \ a Internet por outros usu\xE1rios de\n_Content Security Policy header\
          \ (CSP)_. Isso permite que dados confidenciais\narmazenados no armazenamento\
          \ em nuvem sejam acessados.\n\n\nPara mais informa\xE7\xF5es sobre as refer\xEA\
          ncias e a lista de CWEs mapeadas: https://top10.owasp.org/2021/pt-BR/A05_2021-Security_Misconfiguration/"
      tr:
        name: Security Misconfiguration
        description: "Uygulama a\u015Fa\u011F\u0131daki durumlarda zafiyete a\xE7\u0131\
          k olabilir:\n\n* Application stack\u2019in herhangi bir b\xF6l\xFCm\xFC\
          nde uygun security hardening eksikse veya cloud servislerinde izinler yanl\u0131\
          \u015F konfig\xFCre edildiyse.\n\n* Gereksiz \xF6zellikler etkinle\u015F\
          tirilmi\u015F ya da kurulmu\u015Fsa (\xF6r. gereksiz port\u2019lar, servisler,\
          \ sayfalar, hesaplar veya ayr\u0131cal\u0131klar).\n\n* Varsay\u0131lan\
          \ hesaplar ve bunlar\u0131n parolalar\u0131 h\xE2l\xE2 etkin ve de\u011F\
          i\u015Fmemi\u015Fse.\n\n* Error handling, kullan\u0131c\u0131ya stack trace\u2019\
          ler veya a\u015F\u0131r\u0131 bilgi i\xE7eren hata mesajlar\u0131 g\xF6\
          steriyorsa.\n\n* Y\xFCkseltilmi\u015F sistemlerde, en yeni security \xF6\
          zellikleri devre d\u0131\u015F\u0131ysa veya g\xFCvenli \u015Fekilde konfig\xFC\
          re edilmemi\u015Fse.\n\n* Application server\u2019lar\u0131, application\
          \ framework\u2019leri (\xF6r. Struts, Spring, ASP.NET), k\xFCt\xFCphaneler,\
          \ veritabanlar\u0131 vb. i\xE7indeki security ayarlar\u0131 g\xFCvenli de\u011F\
          erlere set edilmemi\u015Fse.\n\n* Server, security header\u2019lar\u0131\
          \ veya directive\u2019leri g\xF6ndermiyorsa ya da bunlar g\xFCvenli de\u011F\
          erlere set edilmemi\u015Fse.\n\n* Yaz\u0131l\u0131m g\xFCncel de\u011Filse\
          \ veya zafiyetliyse (bkz. [A06:2021 \u2013 Vulnerable and Outdated Components](A06_2021-Vulnerable_and_Outdated_Components.md)).\n\
          \nPlanl\u0131 ve tekrarlanabilir bir application security configuration\
          \ s\xFCreci olmadan sistemler daha y\xFCksek risk alt\u0131ndad\u0131r."
        annotation: "## Score table\n\n| CWEs E\u015Fle\u015Ftirildi | Maks G\xF6\
          r\xFClme Oran\u0131 | Ort. G\xF6r\xFClme Oran\u0131 | Ort. A\u011F\u0131\
          rl\u0131kl\u0131 Exploit | Ort. A\u011F\u0131rl\u0131kl\u0131 Impact | Maks\
          \ Coverage | Ort. Coverage | Toplam Olay | Toplam CVE |\n| :---------------:\
          \ | :----------------: | :----------------: | :--------------------: | :-------------------:\
          \ | :-----------: | :-----------: | :---------: | :--------: |\n|      \
          \   20        |       19.84%       |        4.51%       |          8.12\
          \          |          6.56         |     89.58%    |     44.84%    |   208,387\
          \   |     789    |\n\n\n## How to prevent\n\nG\xFCvenli kurulum s\xFCre\xE7\
          leri uygulanmal\u0131d\u0131r; bunlar \u015Funlar\u0131 i\xE7erir:\n\n*\
          \ Tekrarlanabilir bir hardening s\xFCreci, uygun \u015Fekilde kilitlenmi\u015F\
          \ ba\u015Fka bir ortam\u0131n h\u0131zl\u0131 ve kolay \u015Fekilde deploy\
          \ edilmesini sa\u011Flar. Development, QA ve production ortamlar\u0131 ayn\u0131\
          \ \u015Fekilde konfig\xFCre edilmeli; her ortamda farkl\u0131 credential\u2019\
          lar kullan\u0131lmal\u0131d\u0131r. Yeni g\xFCvenli bir ortam kurulumunda\
          \ eforu minimize etmek i\xE7in bu s\xFCre\xE7 otomatikle\u015Ftirilmelidir.\n\
          \n* Gereksiz \xF6zellikler, bile\u015Fenler, dok\xFCmantasyon ve \xF6rnekler\
          \ olmadan minimal bir platform. Kullan\u0131lmayan feature ve framework\u2019\
          leri kald\u0131r\u0131n ya da hi\xE7 kurmay\u0131n.\n\n* Patch management\
          \ s\xFCrecinin bir par\xE7as\u0131 olarak, t\xFCm security notlar\u0131\
          na, update ve patch\u2019lere uygun konfig\xFCrasyonlar\u0131 g\xF6zden\
          \ ge\xE7irip g\xFCncelleme g\xF6revi (bkz. [A06:2021 \u2013 Vulnerable and\
          \ Outdated Components](A06_2021-Vulnerable_and_Outdated_Components.md)).\
          \ Cloud storage izinlerini (\xF6r. S3 bucket permission\u2019lar\u0131)\
          \ g\xF6zden ge\xE7irin.\n\n* Segmentasyon, containerization veya cloud security\
          \ group\u2019lar\u0131 (ACL\u2019ler) ile bile\u015Fenler veya tenant\u2019\
          lar aras\u0131nda etkili ve g\xFCvenli ayr\u0131m sa\u011Flayan segmented\
          \ bir application architecture.\n\n* Client\u2019lara security directive\u2019\
          leri g\xF6ndermek; \xF6r. Security Headers.\n\n* T\xFCm ortamlarda konfig\xFC\
          rasyon ve ayarlar\u0131n etkinli\u011Fini do\u011Frulayan otomatik bir s\xFC\
          re\xE7.\n\n\n## Example attack scenarios\n\n**Senaryo #1:** Application\
          \ server, production\u2019da kald\u0131r\u0131lmam\u0131\u015F sample application\u2019\
          larla birlikte geliyor. Bu sample\u2019lar\u0131n bilinen security a\xE7\
          \u0131klar\u0131 vard\u0131r ve sald\u0131rganlar server\u2019\u0131 ele\
          \ ge\xE7irmek i\xE7in bunlar\u0131 kullan\u0131r. Bu uygulamalardan biri\
          \ admin console ise ve varsay\u0131lan hesaplar de\u011Fi\u015Ftirilmemi\u015F\
          se, sald\u0131rgan default password\u2019lerle giri\u015F yapar ve kontrol\xFC\
          \ ele ge\xE7irir.\n\n**Senaryo #2:** Server\u2019da directory listing devre\
          \ d\u0131\u015F\u0131 de\u011Fildir. Bir sald\u0131rgan, dizinleri basit\xE7\
          e listeyebildi\u011Fini ke\u015Ffeder. Derlenmi\u015F Java class\u2019lar\u0131\
          n\u0131 bulur ve indirir; bunlar\u0131 decompile ederek kodu inceler. Ard\u0131\
          ndan uygulamada ciddi bir access control a\xE7\u0131\u011F\u0131 bulur.\n\
          \n**Senaryo #3:** Application server konfig\xFCrasyonu, detayl\u0131 hata\
          \ mesajlar\u0131n\u0131n (\xF6r. stack trace\u2019ler) kullan\u0131c\u0131\
          lara d\xF6nd\xFCr\xFClmesine izin verir. Bu, potansiyel olarak hassas bilgileri\
          \ veya bilinen zafiyetlere sahip bile\u015Fen versiyonlar\u0131 gibi temel\
          \ a\xE7\u0131klar\u0131 ortaya \xE7\u0131karabilir.\n\n**Senaryo #4:** Bir\
          \ cloud service provider (CSP), di\u011Fer CSP kullan\u0131c\u0131lar\u0131\
          \ taraf\u0131ndan Internet\u2019e a\xE7\u0131k varsay\u0131lan payla\u015F\
          \u0131m izinlerine sahiptir. Bu durum, cloud storage i\xE7inde saklanan\
          \ hassas verilere eri\u015Filmesine olanak tan\u0131r.\n\n\nReferanslar\
          \ ve e\u015Flenen CWE listesi hakk\u0131nda daha fazla bilgi: https://top10.owasp.org/2021/tr/A05_2021-Security_Misconfiguration/"
      zh:
        name: "\u5B89\u5168\u8BBE\u5B9A\u7F3A\u9677"
        description: "\u5982\u679C\u7A0B\u5F0F\u5305\u542B\u4E86\u4EE5\u4E0B\u51E0\
          \u4E2A\u56E0\u7D20\uFF0C\u5219\u53EF\u80FD\u6709\u6613\u53D7\u653B\u51FB\
          \u7684\u8106\u5F31\u6027\u3002\n\n- \u5728\u7A0B\u5F0F\u5404\u5806\u53E0\
          \u5C42\u9762\uFF0C\u7F3A\u5C11\u9002\u5207\u7684\u5B89\u5168\u5F3A\u5316\
          \uFF0C\u6216\u662F\u4E8E\u4E91\u7AEF\u670D\u52A1\u4E0A\u6709\u7740\u4E0D\
          \u5F53\u7684\u6743\u9650\u8BBE\u5B9A\u3002\n\n- \u4E0D\u5FC5\u8981\u7684\
          \u529F\u80FD\u542F\u7528\u6216\u662F\u5B89\u88C5 (\u4F8B\u5982\uFF0C\u4E0D\
          \u5FC5\u8981\u7684\u7AEF\u53E3\uFF0C\u670D\u52A1\uFF0C\u9875\u9762\uFF0C\
          \u5E10\u53F7\uFF0C\u6216\u662F\u7279\u6743)\u3002\n\n- \u9884\u8BBE\u5E10\
          \u53F7\u4E0E\u5BC6\u7801\u8FD8\u53EF\u4F7F\u7528\uFF0C\u5E76\u4E14\u672A\
          \u66F4\u6539\u3002\n\n- \u56E0\u9519\u8BEF\u5904\u7406\u800C\u66B4\u9732\
          \u51FA\u7684\u5806\u53E0\u8FFD\u8E2A\uFF0C\u6216\u662F\u5411\u4F7F\u7528\
          \u8005\uFF0C\u66B4\u9732\u51FA\u8FC7\u591A\u7684\u9519\u8BEF\u8B66\u544A\
          \u8D44\u8BAF\n\n- \u56E0\u4E3A\u7CFB\u7EDF\u5347\u7EA7\uFF0C\u5BFC\u81F4\
          \u6700\u65B0\u7684\u5B89\u5168\u529F\u80FD\u88AB\u5173\u95ED\uFF0C\u6216\
          \u662F\u9020\u6210\u4E0D\u5B89\u5168\u7684\u8BBE\u5B9A\n\n- \u5728\u5E03\
          \u7F72\u7A0B\u5F0F\u7684\u4F3A\u670D\u5668\uFF0C\u7A0B\u5F0F\u6846\u67B6\
          (\u4F8B\u5982 Struts, Spring, ASP net\uFF0C\u5404\u79CD\u51FD\u793A\u5E93\
          \uFF0C\u8D44\u6599\u5E93\u7B49\u3002\u5E76\u672A\u8BBE\u5B9A\u8BE5\u6709\
          \u7684\u5B89\u5168\u53C2\u6570\u3002\n\n- \u670D\u52A1\u5668\u5E76\u672A\
          \u4F20\u9001\u5B89\u5168\u7684 header \u6216\u662F\u6307\u4EE4\uFF0C\u6216\
          \u672A\u88AB\u8BBE\u5B9A\u5B89\u5168\u53C2\u6570\u3002\n\n- \u8F6F\u4EF6\
          \u5DF2\u7ECF\u8FC7\u65F6\u5DF2\u6DD8\u6C70\uFF0C\u6216\u8005\u5E26\u6709\
          \u8106\u5F31\u6027 (\u8BF7\u53C2\u7167 A06:2021-\u6613\u53D7\u653B\u51FB\
          \u548C\u5DF2\u6DD8\u6C70\u7684\u7EC4\u4EF6 )\n\n\u5F53\u6CA1\u6709\u4E00\
          \u81F4\u6027\uFF0C\u53EF\u91CD\u590D\u7684\u7A0B\u5F0F\u5B89\u5168\u8BBE\
          \u5B9A\u6D41\u7A0B\u65F6\uFF0C\u7CFB\u7EDF\u5C06\u4F1A\u9762\u5BF9\u9AD8\
          \u98CE\u9669\u3002"
        annotation: "## Score table\n\n| \u53EF\u5BF9\u7167 CWEs \u6570\u91CF | \u6700\
          \u5927\u53D1\u751F\u7387 | \u5E73\u5747\u53D1\u751F\u7387 | \u6700\u5927\
          \u8986\u76D6\u8303\u56F4 | \u5E73\u5747\u8986\u76D6\u8303\u56F4 | \u5E73\
          \u5747\u52A0\u6743\u6F0F\u6D1E | \u5E73\u5747\u52A0\u6743\u5F15\u54CD |\
          \ \u51FA\u73B0\u6B21\u6570 | \u6240\u6709\u76F8\u5173 CVEs |\n| :--------------:\
          \ | :--------: | :--------: | :----------: | :----------: | :----------:\
          \ | :----------: | :------: | :-----------: |\n|        20        |   19.84%\
          \   |   4.51%    |    89.58%    |    44.84%    |     8.12     |     6.56\
          \     | 208,387  |      789      |\n\n\n## How to prevent\n\n\u5B89\u5168\
          \u7684\u5B89\u88C5\u6B65\u9AA4\u6D41\u7A0B\uFF0C\u5E94\u8BE5\u88AB\u5B9E\
          \u9645\u5E03\u7F72\uFF0C\u5305\u542B\u4EE5\u4E0B\n\n- \u4E00\u4E2A\u53EF\
          \u91CD\u590D\u7684\u5B89\u5168\u5F3A\u5316\u6D41\u7A0B\uFF0C\u5FC5\u9700\
          \u53EF\u8FBE\u5230\u5FEB\u901F\u4E14\u7B80\u5355\u7684\u5E03\u7F72\uFF0C\
          \u800C\u4E14\u80FD\u5728\u5206\u9694\u4E14\u5C01\u9501\u7684\u73AF\u5883\
          \u4E0B\u6267\u884C\u3002\u5F00\u53D1\uFF0C\u54C1\u8D28\u7BA1\u7406\uFF0C\
          \u4EE5\u53CA\u5B9E\u9645\u8425\u8FD0\u7684\u73AF\u5883\uFF0C\u90FD\u987B\
          \u6709\u4E00\u81F4\u76F8\u540C\u7684\u8BBE\u5B9A\uFF0C\u5E76\u4E14\u4F7F\
          \u7528\u4E0D\u540C\u7684\u8BA4\u8BC1\u8D44\u8BAF\u3002\u8FD9\u79CD\u6B65\
          \u9AA4\u9700\u8981\u5C3D\u53EF\u80FD\u7684\u81EA\u52A8\u5316\uFF0C\u964D\
          \u4F4E\u9700\u8981\u5EFA\u7ACB\u5B89\u5168\u73AF\u5883\u65F6\uFF0C\u6240\
          \u9700\u8981\u7684\u6295\u5165\u3002\n\n- \u4E00\u4E2A\u6700\u7CBE\u7B80\
          \u7684\u5E73\u53F0\uFF0C\u4E0A\u9762\u4E0D\u4F1A\u642D\u914D\u4EFB\u4F55\
          \u4E0D\u9700\u8981\u7684\u529F\u80FD\uFF0C\u5957\u4EF6\uFF0C\u6863\u6848\
          \uFF0C\u4EE5\u53CA\u8303\u672C\u3002\u79FB\u9664\u6216\u4E0D\u5B89\u88C5\
          \u4EFB\u4F55\uFF0C\u4E0D\u987B\u4F7F\u7528\u7684\u529F\u80FD\u6216\u6846\
          \u67B6\u3002\n\n- \u5728\u53D8\u66F4\u7BA1\u7406\u4E0B\uFF0C\u9700\u6709\
          \u7279\u5B9A\u7684\u4EFB\u52A1\uFF0C\u4F9D\u636E\u5B89\u5168\u544A\u77E5\
          \uFF0C\u76F8\u5173\u66F4\u65B0\uFF0C\u6765\u6267\u884C\u5B89\u5168\u5BA1\
          \u89C6\u53CA\u66F4\u52A8(\u53EF\u53C2\u7167 A06:2021-\u6613\u53D7\u653B\u51FB\
          \u548C\u5DF2\u6DD8\u6C70\u7684\u7EC4\u4EF6)\u3002\u5BA1\u89C6\u4E91\u7AEF\
          \u50A8\u5B58\u7684\u6743\u9650(\u4F8B\u5982 S3 bucket \u7684\u6743\u9650\
          )\n\n- \u4E00\u4E2A\u53EF\u5206\u5272\u7684\u7A0B\u5F0F\u67B6\u6784\uFF0C\
          \u5BF9\u4E8E\u5404\u5143\u4EF6\uFF0C\u7528\u6237\uFF0C\u53EF\u900F\u8FC7\
          \u5206\u79BB\uFF0C\u5BB9\u5668\u5316\uFF0C\u4E91\u7AEF\u5B89\u5168\u7FA4\
          \u7EC4\u8BBE\u5B9A(ACLs)\uFF0C\u6765\u8FBE\u5230\u5206\u5272\u7684\u6548\
          \u679C\u3002\u63D0\u4F9B\u6709\u6548\u4E14\u5B89\u5168\u7684\u5206\u79BB\
          \u3002\n\n- \u5BC4\u9001\u5B89\u5168\u6307\u4EE4\u7ED9\u7528\u6237\u7AEF\
          \uFF0C\u4F8B\u5982 \u5B89\u5168\u6807\u5934\u3002\n\n- \u4E00\u4E2A\u81EA\
          \u52A8\u5316\u7684\u6D41\u7A0B\uFF0C\u53EF\u4EE5\u786E\u8BA4\u73AF\u5883\
          \u4E2D\u5404\u7C7B\u7684\u5B89\u5168\u8BBE\u5B9A\u3002\n\n\n## Example attack\
          \ scenarios\n\n**\u60C5\u5883 #1:** \u8425\u8FD0\u7528\u7684\u7A0B\u5F0F\
          \u670D\u52A1\u5668\uFF0C\u5E26\u6709\u9884\u8BBE\u7684\u6837\u672C\u7A0B\
          \u5F0F\uFF0C\u5E76\u672A\u79FB\u9664\u3002\u8FD9\u4E2A\u6837\u672C\u7A0B\
          \u5F0F\u5E26\u6709\u5DF2\u77E5\u7684\u5B89\u5168\u7F3A\u9677\uFF0C\u53EF\
          \u88AB\u653B\u51FB\u8005\u5229\u7528\u5165\u4FB5\u670D\u52A1\u5668\u3002\
          \u4F8B\u5982\uFF0C\u9884\u8BBE\u7684\u7A0B\u5F0F\u5E26\u6709\u7BA1\u7406\
          \u8005\u754C\u9762\uFF0C\u5E76\u4E14\u6709\u672A\u53D8\u66F4\u7684\u5E10\
          \u53F7\uFF0C\u653B\u51FB\u8005\u53EF\u4EE5\u900F\u8FC7\u9884\u8BBE\u7684\
          \u5BC6\u7801\u767B\u5165\uFF0C\u5E76\u53D6\u5F97\u63A7\u5236\u6743\u3002\
          \n\n**\u60C5\u5883 #2:** \u8D44\u6599\u76EE\u5F55\u6307\u4EE4\u5E76\u672A\
          \u5728\u670D\u52A1\u5668\u4E0A\u5173\u95ED\u3002\u653B\u51FB\u8005\u53EF\
          \u4EE5\u627E\u51FA\u5E76\u4E14\u4E0B\u8F7D\uFF0C\u5DF2\u7F16\u8BD1\u8FC7\
          \ Java \u6863\u6848\uFF0C\u5E76\u4E14\u900F\u8FC7\u53CD\u7F16\u8BD1\u4E0E\
          \u9006\u5411\u5DE5\u7A0B\u7B49\u624B\u6CD5\uFF0C\u67E5\u770B\u539F\u59CB\
          \u7801\u3002\u518D\u56E0\u6B64\u627E\u51FA\u7A0B\u5F0F\u4E2D\uFF0C\u4E25\
          \u91CD\u7684\u5B58\u53D6\u63A7\u5236\u7F3A\u9677\u3002\n\n**\u60C5\u5883\
          \ #3:** \u7A0B\u5F0F\u670D\u52A1\u5668\u7684\u8BBE\u5B9A\uFF0C\u5141\u8BB8\
          \u8F93\u51FA\u5E26\u6709\u8BE6\u7EC6\u5185\u5BB9\u7684\u9519\u8BEF\u8BAF\
          \u606F\uFF0C\u4F8B\u5982\u5806\u53E0\u8FFD\u8E2A\uFF0C\u4F9B\u7528\u6237\
          \u67E5\u770B\u3002\u8FD9\u6709\u53EF\u80FD\u5BFC\u81F4\u654F\u611F\u8BAF\
          \u606F\u7684\u5916\u6CC4\uFF0C\u6216\u95F4\u63A5\u900F\u9732\u51FA\uFF0C\
          \u4F7F\u7528\u4E2D\uFF0C\u5E76\u5E26\u6709\u8106\u5F31\u6027\u7684\u5143\
          \u4EF6\u7248\u672C\u3002\n\n**\u60C5\u5883 #4:** \u4E00\u4E2A\u4E91\u7AEF\
          \u670D\u52A1\u5668\uFF0C\u63D0\u4F9B\u4E86\u9884\u8BBE\u6743\u9650\u5206\
          \u4EAB\uFF0C\u7ED9\u5176\u4ED6\u5728\u7F51\u9645\u7F51\u8DEF\u7684 CSP \u7528\
          \u6237\u3002\u8FD9\u5C06\u5BFC\u81F4\u4E91\u7AEF\u50A8\u5B58\u7684\u654F\
          \u611F\u8D44\u6599\u53EF\u4EE5\u88AB\u5B58\u53D6\u3002\n\n\n\u6709\u95DC\
          \u53C3\u8003\u8CC7\u6599\u53CA\u5DF2\u5C0D\u61C9 CWE \u6E05\u55AE\u7684\u66F4\
          \u591A\u8CC7\u8A0A\uFF1A https://top10.owasp.org/2021/zh-Hant/A05_2021-Security_Misconfiguration/"
  - urn: urn:intuitem:risk:threat:a06
    ref_id: A06:2021
    name: Vulnerable and Outdated Components
    description: "You are likely vulnerable:\n\n-   If you do not know the versions\
      \ of all components you use (both\n    client-side and server-side). This includes\
      \ components you directly\n    use as well as nested dependencies.\n\n-   If\
      \ the software is vulnerable, unsupported, or out of date. This\n    includes\
      \ the OS, web/application server, database management system\n    (DBMS), applications,\
      \ APIs and all components, runtime environments,\n    and libraries.\n\n-  \
      \ If you do not scan for vulnerabilities regularly and subscribe to\n    security\
      \ bulletins related to the components you use.\n\n-   If you do not fix or upgrade\
      \ the underlying platform, frameworks,\n    and dependencies in a risk-based,\
      \ timely fashion. This commonly\n    happens in environments when patching is\
      \ a monthly or quarterly task\n    under change control, leaving organizations\
      \ open to days or months\n    of unnecessary exposure to fixed vulnerabilities.\n\
      \n-   If software developers do not test the compatibility of updated,\n   \
      \ upgraded, or patched libraries.\n\n-   If you do not secure the components\u2019\
      \ configurations (see\n    [A05:2021-Security Misconfiguration](A05_2021-Security_Misconfiguration.md))."
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Max Coverage | Avg Coverage | Avg Weighted Exploit | Avg Weighted Impact\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 3           | 27.96%             | 8.77%              | 51.78%       | 22.47%\
      \       | 5.00                 | 5.00                | 30,457            | 0\
      \          |\n\n\n## How to prevent\n\nThere should be a patch management process\
      \ in place to:\n\n-   Remove unused dependencies, unnecessary features, components,\
      \ files,\n    and documentation.\n\n-   Continuously inventory the versions\
      \ of both client-side and\n    server-side components (e.g., frameworks, libraries)\
      \ and their\n    dependencies using tools like versions, OWASP Dependency Check,\n\
      \    retire.js, etc. Continuously monitor sources like Common Vulnerability\
      \ and \n    Exposures (CVE) and National Vulnerability Database (NVD) for\n\
      \    vulnerabilities in the components. Use software composition analysis\n\
      \    tools to automate the process. Subscribe to email alerts for\n    security\
      \ vulnerabilities related to components you use.\n\n-   Only obtain components\
      \ from official sources over secure links.\n    Prefer signed packages to reduce\
      \ the chance of including a modified,\n    malicious component (see [A08:2021-Software\
      \ and Data Integrity\n    Failures](A08_2021-Software_and_Data_Integrity_Failures.md)).\n\
      \n-   Monitor for libraries and components that are unmaintained or do not\n\
      \    create security patches for older versions. If patching is not\n    possible,\
      \ consider deploying a virtual patch to monitor, detect, or\n    protect against\
      \ the discovered issue.\n\nEvery organization must ensure an ongoing plan for\
      \ monitoring, triaging,\nand applying updates or configuration changes for the\
      \ lifetime of the\napplication or portfolio.\n\n\n## Example attack scenarios\n\
      \n**Scenario #1:** Components typically run with the same privileges as\nthe\
      \ application itself, so flaws in any component can result in serious\nimpact.\
      \ Such flaws can be accidental (e.g., coding error) or intentional\n(e.g., a\
      \ backdoor in a component). Some example exploitable component\nvulnerabilities\
      \ discovered are:\n\n-   CVE-2017-5638, a Struts 2 remote code execution vulnerability\
      \ that\n    enables the execution of arbitrary code on the server, has been\n\
      \    blamed for significant breaches.\n\n-   While the internet of things (IoT)\
      \ is frequently difficult or\n    impossible to patch, the importance of patching\
      \ them can be great\n    (e.g., biomedical devices).\n\nThere are automated\
      \ tools to help attackers find unpatched or\nmisconfigured systems. For example,\
      \ the Shodan IoT search engine can\nhelp you find devices that still suffer\
      \ from Heartbleed vulnerability\npatched in April 2014.\n\n\nFor more information\
      \ about the references and the list of mapped CWEs: https://top10.owasp.org/2021/A06_2021-Vulnerable_and_Outdated_Components/"
