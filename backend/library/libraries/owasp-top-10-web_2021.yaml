      de:
        name: Server-Side Request Forgery (SSRF)
        description: "SSRF-Schwachstellen treten immer dann auf, wenn eine Webanwendung\
          \ eine Remote-Ressource abruft, ohne die, vom Nutzenden angegebene URL zu\
          \ \xFCberpr\xFCfen. Dadurch kann ein Angreifender die Anwendung dazu zwingen,\
          \ eine manipulierte Anfrage an ein unerwartetes Ziel zu senden, selbst wenn\
          \ sie durch eine Firewall, ein VPN oder eine andere Art von Netzwerkzugriffskontrollliste\
          \ (ACL) gesch\xFCtzt ist.\n\nDa moderne Webanwendungen Nutzenden komfortable\
          \ Funktionen bieten, wird das Abrufen einer URL zu einem g\xE4ngigen Szenario.\
          \ \nInfolgedessen nimmt die H\xE4ufigkeit von SSRF zu. \nAu\xDFerdem nimmt\
          \ der Schweregrad von SSRF aufgrund von der Verbreitung von Cloud-Diensten\
          \ und der Komplexit\xE4t der Architekturen zu."
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 1           | 2.72 %              | 2.72 %              | 8.28       \
          \          | 6.72                | 67.72 %       | 67.72 %       | 9,503\
          \             | 385        |\n\n\n## How to prevent\n\nEntwickler k\xF6\
          nnen SSRF verhindern, indem sie folgende Defense-in-Depth-Controls implementieren:\n\
          \n### **Auf der Netzwerk-Ebene**\n\n- Segmentieren Sie die Remote-Ressourcenzugriffsfunktionalit\xE4\
          t in separate Netzwerke, um die Auswirkungen von SSRF zu reduzieren.\n\n\
          - Setzen Sie standardm\xE4\xDFig blockierende Firewall-Richtlinien oder\
          \ Netzwerkzugriffskontrollregeln ein, um den gesamten Intranet-Verkehr zu\
          \ blockieren, der nicht unbedingt erforderlich ist.\n<br/> *Hinweise:*<br>\
          \ \n~ Legen Sie eine Zust\xE4ndigkeit und einen Lebenszyklus f\xFCr Firewall-Regeln\
          \ auf der Grundlage von Anwendungen fest.<br/>\n~ Protokollieren aller akzeptierten\
          \ *und* blockierten Netzstr\xF6me auf Firewalls (siehe [A09:2021 \u2013\
          \ Fehler beim Logging und Monitoring](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
          \n### **Auf der Anwendungsebene:**\n\n* Bereinigung und Validierung aller\
          \ vom Client gelieferten Eingabedaten\n* Erzwingen Sie das URL-Schema, den\
          \ Port und das Ziel mit einer Positivliste\n* Senden Sie keine ungepr\xFC\
          ften Antworten an Clients.\n* Deaktivieren Sie HTTP-Umleitungen.\n* Achten\
          \ Sie auf die URL-Konsistenz, um Angriffe wie DNS-Rebinding und \u201Etime\
          \ of check, time of use\u201C (TOCTOU) Race Conditions zu vermeiden\n\n\n\
          Verhindern Sie SSRF nicht durch die Verwendung einer Negativliste oder eines\
          \ regul\xE4ren Ausdrucks. Angreifer verf\xFCgen \xFCber Payload-Listen,\
          \ Tools und F\xE4higkeiten zum Umgehen von Negativlisten.\n\n### **Zus\xE4\
          tzliche zu ber\xFCcksichtigende Ma\xDFnahmen:**\n\n- Setzen Sie keine anderen\
          \ sicherheitsrelevanten Dienste auf Frontsystemen ein (z. B. OpenID). Kontrollieren\
          \ Sie den lokalen Verkehr auf diesen Systemen (z. B. localhost).\n\n- F\xFC\
          r Frontends mit dedizierten und verwaltbaren Gruppen f\xFCr Anwendende nutzen\
          \ Sie Netzwerkverschl\xFCsselung (z. B. VPNs) auf unabh\xE4ngigen Systemen\
          \ um sehr hohen Schutzbedarf zu ber\xFCcksichtigen.\n\n\n## Example attack\
          \ scenarios\n\nAngreifende k\xF6nnen SSRF nutzen, um Systeme anzugreifen,\
          \ die durch Web Application Firewalls, Firewalls oder Netzwerk-ACLs gesch\xFC\
          tzt sind, und dabei Szenarien wie folgende verwenden:\n\n**Szenario Nr.\
          \ 1:** Port-Scan interner Server \u2013 Wenn die Netzwerkarchitektur nicht\
          \ segmentiert ist, k\xF6nnen Angreifende interne Netzwerke abbilden und\
          \ anhand der Verbindungsergebnisse oder der verstrichenen Zeit f\xFCr die\
          \ Verbindung oder Ablehnung von SSRF-Nutzlast-Verbindungen feststellen,\
          \ ob Ports auf internen Servern offen oder geschlossen sind.\n\n**Szenario\
          \ Nr. 2:** Preisgabe sensibler Daten \u2013 Angreifende k\xF6nnen auf lokale\
          \ Dateien oder interne Dienste zugreifen, um vertrauliche Informationen\
          \ wie \u201Efile:///etc/passwd\u201C und \u201Ehttp://localhost:28017/\u201C\
          \ zu erhalten.\n\n**Szenario Nr. 3:** Zugriff auf Metadatenspeicher von\
          \ Cloud-Diensten \u2013 Die meisten Cloud-Anbieter verf\xFCgen \xFCber Metadatenspeicher\
          \ wie \u201Ehttp://169.254.169.254/\u201C. Eine angreifende Person kann\
          \ die Metadaten lesen, um an vertrauliche Informationen zu gelangen.\n\n\
          **Szenario Nr. 4:** Kompromittierung interner Dienste \u2013 Die angreifende\
          \ Person kann interne Dienste missbrauchen, um weitere Angriffe wie beispielsweise\
          \ Remote Code Execution (RCE) oder Denial of Service (DoS) durchzuf\xFC\
          hren.\n\n\nWeitere Informationen zu den Referenzen und zur Liste der zugeordneten\
          \ CWEs: https://top10.owasp.org/2021/de/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      es:
        name: "Falsificaci\xF3n de Solicitudes del Lado del Servidor (SSRF)"
        description: "Las fallas de SSRF ocurren cuando una aplicaci\xF3n web est\xE1\
          \ obteniendo un recurso remoto sin validar la URL proporcionada por el usuario.\
          \ Permite que un atacante coaccione a la aplicaci\xF3n para que env\xED\
          e una solicitud falsificada a un destino inesperado, incluso cuando est\xE1\
          \ protegido por un firewall, VPN u otro tipo de lista de control de acceso\
          \ a la red (ACL).\n\nDado que las aplicaciones web modernas brindan a los\
          \ usuarios finales funciones convenientes, la b\xFAsqueda de una URL se\
          \ convierte en un escenario com\xFAn. Como resultado, la incidencia de SSRF\
          \ est\xE1 aumentando. Adem\xE1s, la gravedad de SSRF es cada vez mayor debido\
          \ a los servicios en la nube y la complejidad de las arquitecturas."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom| Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 1           | 2.72%              | 2.72%              | 8.28         \
          \        | 6.72                | 67.72%       | 67.72%       | 9,503   \
          \          | 385        |\n\n\n## How to prevent\n\nLos desarrolladores\
          \ pueden prevenir SSRF implementando algunos o todos los siguientes controles\
          \ de defensa en profundidad:\n\n### **Desde la capa de red**\n\n-   Segmente\
          \ la funcionalidad de acceso a recursos remotos en redes separadas para\
          \ reducir el impacto de SSRF\n\n-   Haga cumplir las pol\xEDticas de firewall\
          \ \"denegar por defecto\" o las reglas de control de acceso a la red para\
          \ bloquear todo el tr\xE1fico de la intranet excepto el esencial.<br/> \n\
          \    *Consejos:*<br> \n    ~ Establezca la propiedad y un ciclo de vida\
          \ para las reglas de firewall basadas en aplicaciones.<br/>\n    ~ Registre\
          \ en logs todos los flujos de red aceptados y bloqueados en firewalls (consulte\
          \ [A09: 2021-Fallas en el Registro y Monitoreo](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
          \    \n### **Desde la capa de aplicaci\xF3n:**\n\n-   Sanitice y valide\
          \ todos los datos de entrada proporcionados por el cliente\n\n-   Haga cumplir\
          \ el esquema de URL, el puerto y destino a trav\xE9s de una lista positiva\
          \ de items permitidos \n\n-   No env\xEDe respuestas en formato \"crudo\"\
          \ a los clientes\n\n-   Deshabilite las redirecciones HTTP\n\n-   Tenga\
          \ en cuenta la coherencia de la URL para evitar ataques como el enlace de\
          \ DNS y las condiciones de carrera de \"tiempo de verificaci\xF3n, tiempo\
          \ de uso\" (TOCTOU por sus siglas en ingl\xE9s)\n\nNo mitigue SSRF mediante\
          \ el uso de una lista de denegaci\xF3n o una expresi\xF3n regular. Los atacantes\
          \ poseen listas de payloads, herramientas y habilidades para eludir las\
          \ listas de denegaci\xF3n.\n\n### **Medidas adicionales a considerar:**\n\
          \    \n-   No implemente otros servicios relevantes para la seguridad en\
          \ los sistemas frontales (por ejemplo, OpenID). Controle el tr\xE1fico local\
          \ en estos sistemas (por ejemplo, localhost)\n    \n-   Para frontends con\
          \ grupos de usuarios dedicados y manejables, use el cifrado de red (por\
          \ ejemplo, VPN) en sistemas independientes para considerar necesidades de\
          \ protecci\xF3n muy altas  \n\n\n## Example attack scenarios\n\nLos atacantes\
          \ pueden usar SSRF para atacar sistemas protegidos detr\xE1s de firewalls\
          \ de aplicaciones web, firewalls o ACLs de red, utilizando escenarios tales\
          \ como:\n\n**Escenario #1:** Escaneo de puertos de servidores internos \u2013\
          \ Si la arquitectura de red no se encuentra segmentada, los atacantes pueden\
          \ trazar un mapa de las redes internas y determinar si los puertos est\xE1\
          n abiertos o cerrados en los servidores internos a partir de los resultados\
          \ de la conexi\xF3n o del tiempo transcurrido para conectar o rechazar las\
          \ conexiones de payload SSRF.\n\n**Escenario #2:** Exposici\xF3n de datos\
          \ sensibles: los atacantes pueden acceder a archivos locales como servicios\
          \ internos para obtener informaci\xF3n confidencial como `file:///etc/passwd</span>`\
          \ y `http://localhost:28017/`.\n\n**Escenario #3:** Acceso al almacenamiento\
          \ de metadatos de los servicios en la nube: la mayor\xEDa de los proveedores\
          \ de la nube tienen almacenamiento de metadatos como `http://169.254.169.254/`.\
          \ Un atacante puede leer los metadatos para obtener informaci\xF3n confidencial.\n\
          \n**Escenario #4:** Exposici\xF3n de los servicios internos: el atacante\
          \ puede abusar de los servicios internos para realizar m\xE1s ataques, como\
          \ la ejecuci\xF3n remota de c\xF3digo (RCE) o la denegaci\xF3n de servicio\
          \ (DoS).\n\n\nPara obtener m\xE1s informaci\xF3n sobre las referencias y\
          \ la lista de CWE asociadas: https://top10.owasp.org/2021/es/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      fr:
        name: "A10 Falsification de requ\xEAte c\xF4t\xE9 serveur (SSRF)"
        description: "Une faille SSRF se produit lorsqu'une application web r\xE9\
          cup\xE8re une ressource distante sans valider l'URL fournie par l'utilisateur.\
          \ Elle permet \xE0 un attaquant de contraindre l'application \xE0 envoyer\
          \ une requ\xEAte \xE9labor\xE9e \xE0 une destination inattendue, m\xEAme\
          \ si elle est prot\xE9g\xE9e par un pare-feu, un VPN ou un autre type de\
          \ liste de contr\xF4le d'acc\xE8s au r\xE9seau (ACL).\n\nComme les applications\
          \ Web modernes offrent aux utilisateurs finaux des fonctions pratiques,\
          \ la r\xE9cup\xE9ration d'une URL devient un sc\xE9nario courant. Par cons\xE9\
          quent, l'incidence d'une SSRF augmente. De m\xEAme, la gravit\xE9 de ce\
          \ ph\xE9nom\xE8ne augmente en raison des services en nuage et de la complexit\xE9\
          \ des architectures."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       1        |        2,72 %        |         2,72 %         |     \
          \        8,28              |         6,72         |    67,72 %     |   \
          \   67,72 %       |           9 503            |         385          |\n\
          \n\n## How to prevent\n\nLes d\xE9veloppeurs peuvent pr\xE9venir ce type\
          \ de vuln\xE9rabilit\xE9 en mettant en \u0153uvre tout ou partie des contr\xF4\
          les de d\xE9fense en profondeur suivants :\n\n### **Couche r\xE9seau :**\n\
          \n- segmenter la fonctionnalit\xE9 d'acc\xE8s aux ressources \xE0 distance\
          \ dans des r\xE9seaux distincts pour r\xE9duire l'impact d'une SSRF ;\n\
          - appliquer des politiques de pare-feu ou des r\xE8gles de contr\xF4le d'acc\xE8\
          s au r\xE9seau \"refusant par d\xE9faut\" afin de bloquer tout le trafic\
          \ intranet sauf celui qui est essentiel.<br/> \n    *Conseils:*<br> \n \
          \   - \xC9tablir une propri\xE9t\xE9 et un cycle de vie pour les r\xE8gles\
          \ du pare-feu en fonction des applications.<br/>\n    - Consigner tous les\
          \ flux r\xE9seau accept\xE9s *et* bloqu\xE9s sur les pare-feu (voir [A09:2021-Carence\
          \ des syst\xE8mes de contr\xF4le et de journalisation](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
          \n### **Couche applicative :**\n\n- assainir et valider toutes les donn\xE9\
          es d'entr\xE9e fournies par le client ;\n- imposer le sch\xE9ma d'URL, le\
          \ port et la destination avec une liste positive d'autorisation ;\n- ne\
          \ pas envoyer de r\xE9ponses brutes aux clients ;\n- d\xE9sactiver les redirections\
          \ HTTP ;\n- veiller \xE0 la coh\xE9rence des URL pour \xE9viter les attaques\
          \ telles que le rebinding DNS et les situations de concurrence de type \"\
          time of check, time of use\" (TOCTOU).\n\nN'att\xE9nuez pas les SSRF par\
          \ l'utilisation d'une liste de refus ou d'une expression r\xE9guli\xE8re.\
          \ Les attaquants disposent de dictionnaires, d'outils et de comp\xE9tences\
          \ pour contourner les listes de refus.\n\n### **Mesures compl\xE9mentaires\
          \ :**\n\n- ne pas d\xE9ployer d'autres services li\xE9s \xE0 la s\xE9curit\xE9\
          \ sur les syst\xE8mes frontaux (par exemple, OpenID). Contr\xF4lez le trafic\
          \ local sur ces syst\xE8mes (par exemple, localhost) ;\n- pour les frontaux\
          \ avec des groupes d'utilisateurs d\xE9di\xE9s et g\xE9rables, utilisez\
          \ le chiffrement du r\xE9seau (par exemple, les VPN) sur des syst\xE8mes\
          \ ind\xE9pendants pour prendre en compte les besoins de protection tr\xE8\
          s \xE9lev\xE9s.\n\n\n## Example attack scenarios\n\nLes attaquants peuvent\
          \ utiliser SSRF pour attaquer des syst\xE8mes prot\xE9g\xE9s derri\xE8re\
          \ des pare-feu d'applications web, des pare-feu ou des ACL de r\xE9seau,\
          \ en utilisant des sc\xE9narios tels que :\n\n**Sc\xE9nario n\xB01 :** Analyse\
          \ des ports des serveurs internes - Si l'architecture du r\xE9seau n'est\
          \ pas segment\xE9e, les attaquants peuvent cartographier les r\xE9seaux\
          \ internes et d\xE9terminer si les ports sont ouverts ou ferm\xE9s sur les\
          \ serveurs internes \xE0 partir des r\xE9sultats de connexion ou du temps\
          \ \xE9coul\xE9 pour connecter ou les connexions rejet\xE9es avec une charge\
          \ utile de type SSRF.\n\n**Sc\xE9nario n\xB02 :** Exposition de donn\xE9\
          es sensibles - Les attaquants peuvent acc\xE9der aux fichiers locaux ou\
          \ aux services internes pour obtenir des informations sensibles telles que\
          \ `file:///etc/passwd` et `http://localhost:28017/`.\n\n**Sc\xE9nario n\xB0\
          3 :** Acc\xE9der au stockage des m\xE9tadonn\xE9es des services en nuage\
          \ - La plupart des fournisseurs d'informatique en nuage ont un stockage\
          \ de m\xE9tadonn\xE9es tel que `http://169.254.169.254/`. Un attaquant peut\
          \ lire les m\xE9tadonn\xE9es pour obtenir des informations sensibles.\n\n\
          **Sc\xE9nario n\xB04 :** Compromettre les services internes - L'attaquant\
          \ peut abuser des services internes pour mener d'autres attaques telles\
          \ que l'ex\xE9cution de code \xE0 distance (RCE) ou le d\xE9ni de service\
          \ (DoS).\n\n\nPour plus d\u2019informations sur les r\xE9f\xE9rences et\
          \ la liste des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      id:
        name: Server-Side Request Forgery (SSRF)
        description: 'Kecacatan _SSRF_ muncul saat sebuah aplikasi web meminta _remote
          resource_ tanpa melakukan validasi URL yang di berikan oleh pengguna. Ini
          memperbolehkan penyerang untuk memaksa aplikasi untuk mengirim _crafted
          request_ ke destinasi yang tidak diharapkan, meskipun sudah dilindungi oleh
          _firewall_, VPN, atau tipe lain dari daftar aturan akses jaringan - _Access
          Control List_ (ACL).


          Aplikasi web saat ini menyediakan fitur yang nyaman bagi pengguna akhir,
          sehingga proses meminta URL menjadi hal yang lumrah. Oleh karena itu, insiden
          _SSRF_ semakin meningkat. Selain itu, tingkat keparahan _SSRF_ semakin meningkat
          karena layanan-layanan _cloud_ dan tingkat komplexitas arsitektur _cloud_.'
        annotation: "## Score table\n\n| Klasifikasi CWE | Tingkat Kejadian Maksimum\
          \ | Rata - Rata Tingkat Kejadian  | Cakupan Maximum | Rata - Rata Cakupan\
          \ | Rata - Rata Bobot Exploitasi | Rata - Rata Bobot Dampak | Total Kejadian\
          \ | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 1           | 2.72%              | 2.72%              | 67.72%       |\
          \ 67.72%       | 8.28                 | 6.72                | 9,503    \
          \         | 385        |\n\n\n## How to prevent\n\nPengembang dapat mencegah\
          \ terjadinya _SSRF_ dengan mengimplementasikan beberapa atau semua tindakan\
          \ kontrol pertahanan berikut:\n\n### Dari Network Layer\n\n- Segmentasi\
          \ fitur/fungsi _remote resource access_ di jaringan yang berbeda untuk mengurangi\
          \ dampak dari _SSRF_.\n- Terapkan kebijakan firewall _deny by default_ atau\
          \ aturan kontrol akses jaringan untuk memblokir semua lalu lintas eksternal\
          \ kecuali lalu lintas intranet yang penting.  \n  _Petunjuk:_  \n  ~ Buat\
          \ / Bangunlah siklus hidup dan hak kepemilikan untuk peraturan firewall\
          \ berdasarkan aplikasinya.  \n  ~ Catat semua akses jaringan yang melewati\
          \ firewall baik akses jaringan yang diterima ataupun yang diblokir/tolak\
          \ (lihat [A09:2021-Security Logging and Monitoring Failures](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
          \n### Dari Application Layer\n\n- Bersihkan dan validasi semua data inputan\
          \ yang dimasukkan oleh klien\n\n- Terapkan skema URL, port, dan destinasi\
          \ dengan daftar izin positif\n\n- Jangan mengirim respon mentah ke klien\n\
          \n- Nonaktifkan pengalihan HTTP\n\n- Perhatikan konsistensi URL untuk menghindari\
          \ serangan _DNS rebinding_ dan serangan _(TOCTOU) time of check, time of\
          \ use_\n\nJangan gunakan daftar penolakan atau ekspresi reguler untuk mitigasi\
          \ _SSRF_. Penyerang mempunyai daftar muatan, alat, dan kemampuan untuk membobol/melewati\
          \ daftar penolakan.\n\n### Tindakan Lainnya Yang Dapat Dipertimbangkan\n\
          \n- Jangan _deploy_ layanan yang berhubungan dengan keamanan pada sistem\
          \ yang berada di barisan depan, contohnya _OpenId_. Kontrol lalu lintas\
          \ lokal pada sistem ini (Localhost).\n\n- Khusus untuk _frontends_ dengan\
          \ pengguna/grup pengguna yang loyal atau berdedikasi serta dapat dikelola\
          \ gunakanlah enkripsi jaringan (VPN) pada sistem independen mengingat adanya\
          \ kebutuhan proteksi yang sangat tinggi.\n\n\n## Example attack scenarios\n\
          \nPenyerang dapat menggunakan _SSRF_ untuk menyerang sitem yang telah dilindungi\
          \ dibalik firewall aplikasi web, firewall,atau jaringan ACL dengan skenario-skenario\
          \ penyerangan sebagai berikut:\n\n**Skenario #1:** Memindai port server\
          \ internal. Apabila arsitektur jaringan tidak tersegmentasi, penyerang dapat\
          \ mendapatkan gambaran bagaimana jaringan internal terbentuk\ndan dapat\
          \ menentukan port-port mana yang terbuka atau tertutup pada server internal\
          \ berdasarkan hasil koneksi, waktu yang dibutuhkan untuk melakukan koneksi\
          \ atau waktu yang dibutuhkan untuk menolak koneksi yang bermuatan _SSRF_.\n\
          \n**Skenario #2:** Kebocoran data sensitif. Penyerang dapat mengakses file\
          \ lokal seperti `file:///etc/passwd</span>` dan `http://localhost:28017/`.\n\
          \n**Skenario #3:** Akses penyimpanan metadata dari layanan cloud - Mayoritas\
          \ penyedia layanan cloud memiliki penyimpanan metadata seperti `http://169/254.169.254/`.\n\
          Seorang penyerang dapat membaca metada tersebut untuk mendapatkan informasi\
          \ sensitif.\n\n**Skenario #4:** Penyusupan layanan internal - Penyerang\
          \ dapat menyalahgunakan layanan internal untuk melakukan serangan lebih\
          \ lanjut seperti _Remote Code Execution (RCE)_ atau _Denial Of Service (DOS)_.\n\
          \n\nUntuk informasi lebih lanjut tentang referensi dan daftar CWE yang dipetakan:\
          \ https://top10.owasp.org/2021/id/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      it:
        name: Server-Side Request Forgery (SSRF)
        description: "Le falle SSRF si verificano ogni volta che un'applicazione web\
          \ recupera una risorsa remota\nsenza validare l'URL fornito dall'utente.\
          \ Questo permette ad un attaccante\ndi forzare l'applicazione ad inviare\
          \ una richiesta preparata ad hoc ad una destinazione inattesa, \nanche quando\
          \ \xE8 protetta da un firewall, una VPN o un altro tipo di\nnetwork access\
          \ control list (ACL).\n\nDato che le moderne applicazioni web forniscono\
          \ agli utenti finali parecchie funzionalit\xE0,\nscaricare dati da un URL\
          \ \xE8 uno scenario comune. Di conseguenza, l'incidenza di\nSSRF \xE8 in\
          \ crescita. Inoltre, la gravit\xE0 di SSRF sta diventando pi\xF9 alta a\
          \ causa dei\nservizi cloud e alla complessit\xE0 crescente delle architetture."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 1           | 2.72%              | 2.72%              | 8.28         \
          \        | 6.72                | 67.72%       | 67.72%       | 9,503   \
          \          | 385        |\n\n\n## How to prevent\n\nGli sviluppatori possono\
          \ prevenire le SSRF implementando alcuni o tutti i seguenti\ncontrolli di\
          \ defense in depth:\n\n### **Dal layer di rete:**\n\n-   Segmentare in reti\
          \ separate le funzionalit\xE0 che richiedono un accesso alle risorse remote\
          \ per\n    ridurre l'impatto di SSRF\n\n-   Applicare politiche di firewall\
          \ \"deny by default\" o regole di controllo\n    per bloccare tutto il traffico\
          \ intranet tranne quello essenziale.<br/> \n    *Suggerimenti:*<br> \n \
          \   ~ Stabilire una ownership e un ciclo di vita per le regole del firewall\
          \ basate sulle applicazioni.<br/>\n    ~ Registrare tutti i flussi di rete\
          \ accettati *e* bloccati sui firewall\n    (vedi [A09:2021-Security Logging\
          \ and Monitoring Failures](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
          \    \n### **Dal layer applicativo:**\n\n-   Sanitizzare e convalidare tutti\
          \ i dati di input forniti dal cliente\n\n-   Far rispettare lo URL schema,\
          \ la porta e la destinazione con una allow list\n\n-   Non inviare risposte\
          \ raw ai client\n\n-   Disabilitare i redirect HTTP \n\n-   Essere consapevoli\
          \ della URL consistency per evitare attacchi come il DNS\n    rebinding\
          \ e race conditions come \"time of check, time of use\" (TOCTOU)\n\nNon\
          \ mitigare la SSRF attraverso l'uso di una deny list o di un'espressione\
          \ regolare.\nGli attaccanti hanno a disposizione liste di payload, strumenti\
          \ e abilit\xE0 per bypassare le deny list.\n\n### **Contromisure addizionali\
          \ da considerare:**\n    \n-   Non svolgere il deploy di altri servizi rilevanti\
          \ per la sicurezza sui sistemi di frontend (es. OpenID). \n    Controllare\
          \ il traffico locale su questi sistemi (es. localhost)\n    \n-   Per i\
          \ frontend con gruppi di utenti dedicati e gestibili, usare la crittografia\
          \ di rete (es. VPN)\n    su sistemi indipendenti che hanno esigenze di protezione\
          \ molto elevate \n\n\n## Example attack scenarios\n\nGli attaccanti possono\
          \ sfruttare SSRF per attaccare sistemi protetti dietro web\napplication\
          \ firewall, firewall o ACL di rete, utilizzando scenari come:\n\n**Scenario\
          \ #1:** Port scan dei server interni - Se l'architettura di rete\nnon \xE8\
          \ segmentata, gli attaccanti possono mappare le reti interne e determinare\
          \ se\nsono presenti porte aperte o chiuse in base ai risultati della connessione\
          \ o\nil tempo trascorso per accettare o rifiutare le connessioni del payload\
          \ SSRF.\n\n**Scenario #2:** Sensitive data exposure \u2013 Gli attaccanti\
          \ possono accedere a file locali \no servizi interni per ottenere informazioni\
          \ sensibili \ncome `file:///etc/passwd</span>` e `http://localhost:28017/`.\n\
          \n**Scenario #3:** Accedere allo storage dei metadati dei servizi cloud\
          \ - La maggior parte dei\nprovider hanno un metadata storage come `http://169.254.169.254/`.\
          \ Un\nattaccante pu\xF2 leggere i metadati per ottenere informazioni sensibili.\n\
          \n**Scenario #4:** Compromettere i servizi interni - L'attaccante pu\xF2\
          \ abusare dei\nservizi interni per condurre ulteriori attacchi come Remote\
          \ Code\nExecution (RCE) o Denial of Service (DoS).\n\n\nPer maggiori informazioni\
          \ sui riferimenti e sull'elenco delle CWE mappate: https://top10.owasp.org/2021/it/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
