          \u629E\u80A2\u306F\u5B89\u5168\u306AAPI\u3092\u4F7F\u7528\u3059\u308B\u3053\
          \u3068\u3002\u30A4\u30F3\u30BF\u30FC\u30D7\u30EA\u30BF\u306E\u4F7F\u7528\
          \u3092\u5B8C\u5168\u306B\u907F\u3051\u308B\u3001\u30D1\u30E9\u30E1\u30FC\
          \u30BF\u5316\u3055\u308C\u305F\u30A4\u30F3\u30BF\u30FC\u30D5\u30A7\u30FC\
          \u30B9\u3092\u5229\u7528\u3059\u308B\u3001\u307E\u305F\u306F\u3001\u30AA\
          \u30D6\u30B8\u30A7\u30AF\u30C8\u30FB\u30EA\u30EC\u30FC\u30B7\u30E7\u30CA\
          \u30EB\u30FB\u30DE\u30C3\u30D4\u30F3\u30B0\u30FB\u30C4\u30FC\u30EB\uFF08\
          ORM\uFF09\u3092\u4F7F\u7528\u3059\u308B\u3088\u3046\u306B\u79FB\u884C\u3059\
          \u308B\u3053\u3068\u3002<br/>\n    **\u6CE8\u610F:** \u30D1\u30E9\u30E1\u30FC\
          \u30BF\u5316\u3055\u308C\u3066\u3044\u305F\u3068\u3057\u3066\u3082\u3001\
          \u30B9\u30C8\u30A2\u30C9\u30D7\u30ED\u30B7\u30FC\u30B8\u30E3\u3067\u306F\
          \u3001PL/SQL\u307E\u305F\u306FT-SQL\u306B\u3088\u3063\u3066\u30AF\u30A8\u30EA\
          \u3068\u30C7\u30FC\u30BF\u3092\u9023\u7D50\u3057\u305F\u308A\u3001EXECUTE\
          \ IMMEDIATE\u3084exec()\u3092\u5229\u7528\u3057\u3066\u60AA\u610F\u306E\u3042\
          \u308B\u30C7\u30FC\u30BF\u3092\u5B9F\u884C\u3059\u308B\u3053\u3068\u306B\
          \u3088\u3063\u3066\u3001SQL\u30A4\u30F3\u30B8\u30A7\u30AF\u30B7\u30E7\u30F3\
          \u3092\u767A\u751F\u3055\u305B\u308B\u3053\u3068\u304C\u3067\u304D\u308B\
          \u3002\n\n-   \u30DD\u30B8\u30C6\u30A3\u30D6\u306A\u3001\u8A00\u3044\u63DB\
          \u3048\u308B\u3068\u300C\u30DB\u30EF\u30A4\u30C8\u30EA\u30B9\u30C8\u300D\
          \u306B\u3088\u308B\u30B5\u30FC\u30D0\u30FC\u30B5\u30A4\u30C9\u306E\u5165\
          \u529B\u691C\u8A3C\u3092\u7528\u3044\u308B\u3002\u7279\u6B8A\u6587\u5B57\
          \u3092\u5FC5\u8981\u3068\u3059\u308B\u591A\u304F\u306E\u30A2\u30D7\u30EA\
          \u30B1\u30FC\u30B7\u30E7\u30F3\u3001\u305F\u3068\u3048\u3070\u30E2\u30D0\
          \u30A4\u30EB\u30A2\u30D7\u30EA\u30B1\u30FC\u30B7\u30E7\u30F3\u7528\u306E\
          \u30C6\u30AD\u30B9\u30C8\u9818\u57DF\u3084API\u306A\u3069\u306B\u304A\u3044\
          \u3066\u306F\u5B8C\u5168\u306A\u9632\u5FA1\u65B9\u6CD5\u3068\u306F\u306A\
          \u3089\u306A\u3044\u3002\n\n-   \u4E0A\u8A18\u306E\u5BFE\u5FDC\u304C\u56F0\
          \u96E3\u306A\u52D5\u7684\u30AF\u30A8\u30EA\u3067\u306F\u3001\u305D\u306E\
          \u30A4\u30F3\u30BF\u30FC\u30D7\u30EA\u30BF\u56FA\u6709\u306E\u30A8\u30B9\
          \u30B1\u30FC\u30D7\u69CB\u6587\u3092\u4F7F\u7528\u3057\u3066\u7279\u6B8A\
          \u6587\u5B57\u3092\u30A8\u30B9\u30B1\u30FC\u30D7\u3059\u308B\u3002</br>\n\
          \    **\u6CE8\u610F:** \u30C6\u30FC\u30D6\u30EB\u540D\u3084\u30AB\u30E9\u30E0\
          \u540D\u306A\u3069\u306ESQL\u30B9\u30C8\u30E9\u30AF\u30C1\u30E3\u306B\u5BFE\
          \u3057\u3066\u306F\u30A8\u30B9\u30B1\u30FC\u30D7\u304C\u3067\u304D\u306A\
          \u3044\u3002\u305D\u306E\u305F\u3081\u3001\u30E6\u30FC\u30B6\u6307\u5B9A\
          \u306E\u30B9\u30C8\u30E9\u30AF\u30C1\u30E3\u540D\u306F\u5371\u967A\u3067\
          \u3042\u308B\u3002\u3053\u308C\u306F\u30EC\u30DD\u30FC\u30C8\u4F5C\u6210\
          \u30BD\u30D5\u30C8\u30A6\u30A7\u30A2\u306B\u5B58\u5728\u3059\u308B\u4E00\
          \u822C\u7684\u306A\u554F\u984C\u3067\u3042\u308B\u3002\n\n-   \u30AF\u30A8\
          \u30EA\u5185\u3067LIMIT\u53E5\u3084\u305D\u306E\u4ED6\u306ESQL\u5236\u5FA1\
          \u3092\u4F7F\u7528\u3059\u308B\u3053\u3068\u3067\u3001SQL\u30A4\u30F3\u30B8\
          \u30A7\u30AF\u30B7\u30E7\u30F3\u653B\u6483\u304C\u767A\u751F\u3057\u305F\
          \u5834\u5408\u306E\u30EC\u30B3\u30FC\u30C9\u306E\u5927\u91CF\u6F0F\u6D29\
          \u3092\u9632\u3050\u3002\n\n\n## Example attack scenarios\n\n**\u30B7\u30CA\
          \u30EA\u30AA #1**: \u3042\u308B\u30A2\u30D7\u30EA\u30B1\u30FC\u30B7\u30E7\
          \u30F3\u306F\u4FE1\u983C\u3067\u304D\u306A\u3044\u30C7\u30FC\u30BF\u3092\
          \u7528\u3044\u308B\u3053\u3068\u3067\u4EE5\u4E0B\u306E\u3088\u3046\u306A\
          \u8106\u5F31\u306ASQL\u547C\u3073\u51FA\u3057\u3092\u4F5C\u3063\u3066\u3057\
          \u307E\u3044\u307E\u3059\u3002\n```\n Query HQLQuery = session.createQuery(\"\
          FROM accounts WHERE custID='\" + request.getParameter(\"id\") + \"'\");\n\
          ```\n\n**\u30B7\u30CA\u30EA\u30AA #2**: \u540C\u69D8\u306B\u3001\u30A2\u30D7\
          \u30EA\u30B1\u30FC\u30B7\u30E7\u30F3\u304C\u30D5\u30EC\u30FC\u30E0\u30EF\
          \u30FC\u30AF\u3092\u76F2\u4FE1\u3059\u308B\u3068\u3001\u8106\u5F31\u6027\
          \u306E\u3042\u308B\u30AF\u30A8\u30EA\u306B\u306A\u308A\u3048\u307E\u3059\
          \ (\u4F8B\u3048\u3070\u3001Hibernate\u30AF\u30A8\u30EA\u8A00\u8A9E(HQL)):\n\
          ```\n Query HQLQuery = session.createQuery(\"FROM accounts WHERE custID='\"\
          \ + request.getParameter(\"id\") + \"'\");\n```\n\n\u3053\u308C\u3089\u4E21\
          \u65B9\u306E\u30B1\u30FC\u30B9\u306B\u304A\u3044\u3066\u3001\u653B\u6483\
          \u8005\u306F\u30D6\u30E9\u30A6\u30B6\u3067\u30D1\u30E9\u30E1\u30FC\u30BF\
          'id'\u306E\u5024\u3092' UNION SELECT SLEEP(10);--\u306B\u5909\u66F4\u3057\
          \u307E\u3059\u3002\u4F8B\u3048\u3070:\n\n```\n http://example.com/app/accountView?id='\
          \ UNION SELECT SLEEP(10);--\n```\n\n\u3053\u308C\u3067\u3001\u4E21\u65B9\
          \u306E\u30AF\u30A8\u30EA\u306E\u610F\u5473\u304C\u5909\u3048\u3089\u308C\
          \u3001accounts\u30C6\u30FC\u30D6\u30EB\u306B\u3042\u308B\u30EC\u30B3\u30FC\
          \u30C9\u304C\u5168\u3066\u8FD4\u3055\u308C\u308B\u3053\u3068\u306B\u306A\
          \u308A\u307E\u3059\u3002\u3055\u3089\u306A\u308B\u653B\u6483\u306B\u3088\
          \u308A\u3001\u30C7\u30FC\u30BF\u306E\u6539\u3056\u3093\u3084\u524A\u9664\
          \u3001\u30B9\u30C8\u30A2\u30C9\u30D7\u30ED\u30B7\u30FC\u30B8\u30E3\u306E\
          \u547C\u3073\u51FA\u3057\u304C\u53EF\u80FD\u3067\u3059\u3002\n\n\n\u53C2\
          \u8003\u8CC7\u6599\u304A\u3088\u3073\u30DE\u30C3\u30D4\u30F3\u30B0\u3055\
          \u308C\u305FCWE\u306E\u4E00\u89A7\u306B\u3064\u3044\u3066\u3001\u8A73\u3057\
          \u304F\u306F\u3053\u3061\u3089\uFF1A https://top10.owasp.org/2021/ja/A03_2021-Injection/"
      pt:
        name: "Inje\xE7\xE3o"
        description: "Uma aplica\xE7\xE3o \xE9 vulner\xE1vel a ataques quando:\n\n\
          - Os dados fornecidos pelo usu\xE1rio n\xE3o s\xE3o validados, filtrados\n\
          \    ou higienizados pelo aplicativo.\n\n- Consultas din\xE2micas ou chamadas\
          \ n\xE3o parametrizadas sem escape\n    ciente do contexto s\xE3o usadas\
          \ diretamente no interpretador.\n\n- Dados hostis s\xE3o usados nos par\xE2\
          metros de pesquisa de mapeamento\n    relacional de objeto (ORM) para extrair\
          \ registros confidenciais\n    adicionais.\n\n- Dados hostis s\xE3o usados\
          \ diretamente ou concatenados. O SQL ou comando\n    cont\xE9m a estrutura\
          \ e os dados maliciosos em consultas din\xE2micas, comandos\n    ou procedimentos\
          \ armazenados.\n\nAlgumas das inje\xE7\xF5es mais comuns s\xE3o SQL, NoSQL,\
          \ comando OS, Mapeamento\nRelacional de Objeto (ORM), LDAP e Linguagem de\
          \ Express\xE3o (EL) ou inje\xE7\xE3o\nde Biblioteca de Navega\xE7\xE3o de\
          \ Gr\xE1fico de Objeto (OGNL). O conceito \xE9 id\xEAntico\nentre todos\
          \ os int\xE9rpretes. A revis\xE3o do c\xF3digo-fonte \xE9 o melhor m\xE9\
          todo para\ndetectar se os aplicativos s\xE3o vulner\xE1veis a inje\xE7\xF5\
          es. O teste automatizado\nde todos os par\xE2metros, cabe\xE7alhos, URL,\
          \ cookies, JSON, SOAP e entradas\nde dados XML s\xE3o fortemente encorajados.\
          \ As organiza\xE7\xF5es podem incluir\nferramentas de teste de seguran\xE7\
          a de aplica\xE7\xF5es est\xE1ticos (SAST), din\xE2micos (DAST)\ne interativos\
          \ (IAST) no pipeline de CI/CD para identificar as falhas de inje\xE7\xE3\
          o\nintroduzidas antes da implanta\xE7\xE3o da produ\xE7\xE3o."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:-------------------------:|:------------------------:|:--------------------------:|:-----------------------:|:----------------:|:---------------:|:--------------------:|:-------------:|\n\
          | 33            | 19.09%                    | 3.37%                    |\
          \ 7.25                       | 7.15                    | 94.04%        \
          \   | 47.90%          | 274,228              | 32,078        |\n\n\n## How\
          \ to prevent\n\nPrevenir a inje\xE7\xE3o requer manter os dados separados\
          \ dos comandos e consultas:\n\n- A op\xE7\xE3o preferida \xE9 usar uma API\
          \ segura, que evita usar o interpretador\n    inteiramente, fornece uma\
          \ interface parametrizada ou migra para uma\n    ferramenta de Mapeamento\
          \ Relacional de Objeto (ORMs).<br/>\n    **Nota:** Mesmo quando parametrizados,\
          \ os procedimentos armazenados\n    ainda podem introduzir inje\xE7\xE3\
          o de SQL se PL/SQL ou T-SQL concatenar\n    consultas e dados ou executar\
          \ dados hostis com EXECUTE IMMEDIATE ou exec().\n\n- Use valida\xE7\xE3\
          o de entrada positiva ou \"_safelist_\" do lado do servidor. Esta n\xE3\
          o\n    \xE9 uma defesa completa, pois muitos aplicativos requerem caracteres\
          \ especiais,\n    como \xE1reas de texto ou APIs para aplicativos m\xF3\
          veis.\n\n- Para quaisquer consultas din\xE2micas residuais, escape os caracteres\
          \ especiais\n    usando a sintaxe de escape espec\xEDfica para esse interpretador..<br/>\n\
          \    **Nota:** Estruturas SQL, como nomes de tabelas, nomes de colunas e\
          \ assim\n    por diante, n\xE3o podem ter escape e, portanto, nomes de estruturas\
          \ fornecidos\n    pelo usu\xE1rio s\xE3o perigosos. Este \xE9 um problema\
          \ comum em software de\n    elabora\xE7\xE3o de relat\xF3rios.\n\n- Use\
          \ LIMIT e outros SQL de controle em consultas para evitar a divulga\xE7\xE3\
          o em\n    massa de registros no caso de inje\xE7\xE3o de SQL.\n\n\n## Example\
          \ attack scenarios\n\n**Cen\xE1rio #1:** Um aplicativo usa dados n\xE3o\
          \ confi\xE1veis na constru\xE7\xE3o\nda seguinte chamada SQL vulner\xE1\
          vel:\n```\nString query = \"SELECT \\* FROM accounts WHERE custID='\" +\
          \ request.getParameter(\"id\") + \"'\";\n```\n\n**Cen\xE1rio #2:** Da mesma\
          \ forma, a confian\xE7a cega em _frameworks_ de aplica\xE7\xE3os\npode resultar\
          \ em consultas que ainda s\xE3o vulner\xE1veis\n(por exemplo, Hibernate\
          \ Query Language (HQL)):\n```\n Query HQLQuery = session.createQuery(\"\
          FROM accounts WHERE custID='\" + request.getParameter(\"id\") + \"'\");\n\
          ```\n\nEm ambos os casos, o invasor modifica o valor do par\xE2metro \u2018\
          _id_\u2019 em seu\nnavegador para enviar: ' UNION SLEEP(10);--. Por exemplo:\n\
          ```\n http://example.com/app/accountView?id=' UNION SELECT SLEEP(10);--\n\
          ```\n\nIsso muda o significado de ambas as consultas para retornar todos\
          \ os registros da\ntabela de contas. Ataques mais perigosos podem modificar\
          \ ou excluir dados ou at\xE9\nmesmo invocar procedimentos armazenados.\n\
          \n\nPara mais informa\xE7\xF5es sobre as refer\xEAncias e a lista de CWEs\
          \ mapeadas: https://top10.owasp.org/2021/pt-BR/A03_2021-Injection/"
      tr:
        name: Injection
        description: "Bir uygulama \u015Fu durumlarda sald\u0131r\u0131ya a\xE7\u0131\
          k hale gelir:\n\n* Kullan\u0131c\u0131dan gelen veri uygulama taraf\u0131\
          ndan validate, filter veya sanitize edilmiyorsa.\n\n* Dynamic query\u2019\
          ler veya context-aware escaping olmadan non-parameterized \xE7a\u011Fr\u0131\
          lar do\u011Frudan interpreter\u2019da kullan\u0131l\u0131yorsa.\n\n* Hostile\
          \ data, ek hassas kay\u0131tlar\u0131 \xE7\u0131karmak i\xE7in object-relational\
          \ mapping (ORM) search parametrelerinde kullan\u0131l\u0131yorsa.\n\n* Hostile\
          \ data do\u011Frudan kullan\u0131l\u0131yor veya concat ediliyorsa. SQL\
          \ ya da komut, dynamic query, command veya stored procedure\u2019lerde hem\
          \ yap\u0131 hem de malicious data\u2019y\u0131 i\xE7eriyorsa.\n\nEn yayg\u0131\
          n injection t\xFCrleri aras\u0131nda SQL, NoSQL, OS command, ORM, LDAP ve\
          \ Expression Language (EL) ya da Object Graph Navigation Library (OGNL)\
          \ injection yer al\u0131r. Kavram t\xFCm interpreter\u2019larda ayn\u0131\
          d\u0131r. Source code review, uygulamalar\u0131n injection\u2019a a\xE7\u0131\
          k olup olmad\u0131\u011F\u0131n\u0131 tespit etmenin en iyi y\xF6ntemidir.\
          \ T\xFCm parametrelerin, header\u2019lar\u0131n, URL, cookie\u2019lerin,\
          \ JSON, SOAP ve XML data input\u2019lar\u0131n\u0131n otomatik test edilmesi\
          \ \u015Fiddetle tavsiye edilir. Kurulu\u015Flar, production\u2019a da\u011F\
          \u0131t\u0131mdan \xF6nce eklenen injection kusurlar\u0131n\u0131 belirlemek\
          \ i\xE7in CI/CD pipeline\u2019\u0131na static (SAST), dynamic (DAST) ve\
          \ interactive (IAST) application security testing tool\u2019lar\u0131n\u0131\
          \ dahil edebilir."
        annotation: "## Score table\n\n| CWEs E\u015Fle\u015Ftirildi | Maks G\xF6\
          r\xFClme Oran\u0131 | Ort. G\xF6r\xFClme Oran\u0131 | Ort. A\u011F\u0131\
          rl\u0131kl\u0131 Exploit | Ort. A\u011F\u0131rl\u0131kl\u0131 Impact | Maks\
          \ Coverage | Ort. Coverage | Toplam Olay | Toplam CVE |\n| :---------------:\
          \ | :----------------: | :----------------: | :--------------------: | :-------------------:\
          \ | :-----------: | :-----------: | :---------: | :--------: |\n|      \
          \   33        |       19.09%       |        3.37%       |          7.25\
          \          |          7.15         |     94.04%    |     47.90%    |   274,228\
          \   |   32,078   |\n\n\n## How to prevent\n\nInjection\u2019\u0131 \xF6\
          nlemek, veriyi komut ve query\u2019lerden ayr\u0131 tutmay\u0131 gerektirir:\n\
          \n* Tercih edilen se\xE7enek, interpreter kullan\u0131m\u0131n\u0131 tamamen\
          \ \xF6nleyen, parameterized aray\xFCz sa\u011Flayan veya ORM\u2019lere migrate\
          \ eden g\xFCvenli bir API kullanmakt\u0131r.<br/>\n  **Not:** Parameterized\
          \ olsalar bile stored procedure\u2019ler, e\u011Fer PL/SQL veya T-SQL query\
          \ ve data\u2019y\u0131 concat ediyorsa ya da hostile data\u2019y\u0131 `EXECUTE\
          \ IMMEDIATE` veya `exec()` ile \xE7al\u0131\u015Ft\u0131r\u0131yorsa, yine\
          \ SQL injection\u2019a yol a\xE7abilir.\n\n* Pozitif (allow-list tabanl\u0131\
          ) server-side input validation kullan\u0131n. Bu, tek ba\u015F\u0131na tam\
          \ bir savunma de\u011Fildir; bir\xE7ok uygulama text area gibi \xF6zel karakterler\
          \ veya mobil uygulamalar i\xE7in API\u2019ler gerektirir.\n\n* Kalan dynamic\
          \ query\u2019ler i\xE7in, ilgili interpreter\u2019\u0131n \xF6zel escape\
          \ syntax\u2019\u0131n\u0131 kullanarak special character\u2019lar\u0131\
          \ escape edin.<br/>\n  **Not:** Tablo adlar\u0131, kolon adlar\u0131 gibi\
          \ SQL yap\u0131lar\u0131 escape edilemez; bu nedenle user-supplied yap\u0131\
          \ adlar\u0131 tehlikelidir. Bu, raporlama yaz\u0131l\u0131mlar\u0131nda\
          \ yayg\u0131n bir sorundur.\n\n\n## Example attack scenarios\n\n**Senaryo\
          \ #1:** Bir uygulama, g\xFCvensiz veriyi a\u015Fa\u011F\u0131daki zafiyetli\
          \ SQL \xE7a\u011Fr\u0131s\u0131n\u0131n olu\u015Fturulmas\u0131nda kullan\u0131\
          yor:\n\n```\nString query = \"SELECT * FROM accounts WHERE custID='\" +\
          \ request.getParameter(\"id\") + \"'\";\n```\n\n**Senaryo #2:** Benzer \u015F\
          ekilde, bir uygulaman\u0131n framework\u2019lere k\xF6r\xFC k\xF6r\xFCne\
          \ g\xFCvenmesi, sorgular\u0131n yine zafiyetli olmas\u0131na yol a\xE7abilir\
          \ (\xF6r. Hibernate Query Language - HQL):\n\n```\nQuery HQLQuery = session.createQuery(\"\
          FROM accounts WHERE custID='\" + request.getParameter(\"id\") + \"'\");\n\
          ```\n\nHer iki durumda da sald\u0131rgan, taray\u0131c\u0131s\u0131nda \u2018\
          id\u2019 parametre de\u011Ferini \u015Fu \u015Fekilde de\u011Fi\u015Ftirir:\
          \ `' UNION SELECT SLEEP(10);--`. \xD6rne\u011Fin:\n\n```\nhttp://example.com/app/accountView?id='\
          \ UNION SELECT SLEEP(10);--\n```\n\nBu, her iki sorgunun da anlam\u0131\
          n\u0131 de\u011Fi\u015Ftirerek accounts tablosundaki t\xFCm kay\u0131tlar\u0131\
          n d\xF6nd\xFCr\xFClmesine neden olur. Daha tehlikeli sald\u0131r\u0131lar\
          \ veriyi de\u011Fi\u015Ftirebilir veya silebilir, hatta stored procedure\u2019\
