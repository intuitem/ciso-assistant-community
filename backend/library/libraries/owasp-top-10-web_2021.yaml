      pt:
        name: "Componentes Vulner\xE1veis e Desatualizados"
        description: "Voc\xEA provavelmente est\xE1 vulner\xE1vel:\n\n- Se voc\xEA\
          \ n\xE3o souber as vers\xF5es de todos os componentes que usa\n    (tanto\
          \ do lado do cliente quanto do lado do servidor). Isso\n    inclui componentes\
          \ que voc\xEA usa diretamente, bem como\n    depend\xEAncias aninhadas.\n\
          \n- Se o software for vulner\xE1vel, sem suporte ou desatualizado.\n   \
          \ Isso inclui o sistema operacional, servidor _web/application_,\n    sistema\
          \ de gerenciamento de banco de dados (DBMS), aplica\xE7\xF5es,\n    APIs\
          \ e todos os componentes, ambientes de tempo de execu\xE7\xE3o e bibliotecas.\n\
          \n- Se voc\xEA n\xE3o faz a varredura de vulnerabilidades regularmente e\n\
          \    n\xE3o assina os boletins de seguran\xE7a relacionados aos componentes\
          \ que voc\xEA usa.\n\n- Se voc\xEA n\xE3o corrigir ou atualizar a plataforma,\
          \ as estruturas e as depend\xEAncias\n    subjacentes de maneira oportuna\
          \ e baseada em riscos. Isso geralmente acontece\n    em ambientes em que\
          \ a corre\xE7\xE3o \xE9 uma tarefa mensal ou trimestral sob controle\n \
          \   de altera\xE7\xF5es, deixando as organiza\xE7\xF5es abertas a dias ou\
          \ meses de exposi\xE7\xE3o\n    desnecess\xE1ria a vulnerabilidades corrigidas.\n\
          \n- Se os desenvolvedores de software n\xE3o testarem a compatibilidade\
          \ de\n   bibliotecas atualizadas, atualiza\xE7\xF5es ou com patches.\n\n\
          - Se voc\xEA n\xE3o proteger as configura\xE7\xF5es dos componentes\n  \
          \  (consulte [A05: 2021-Configura\xE7\xE3o Incorreta de Seguran\xE7a](A05_2021-Security_Misconfiguration.md))."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:-------------------------:|:------------------------:|:--------------------------:|:-----------------------:|:----------------:|:---------------:|:--------------------:|:-------------:|\n\
          | 3             | 27.96%                    | 8.77%                    |\
          \ 51.78%                     | 22.47%                  | 5.00          \
          \   | 5.00            | 30,457               | 0             |\n\n\n## How\
          \ to prevent\n\nDeve haver um processo de gerenciamento de depend\xEAncias\
          \ para:\n\n- Remova depend\xEAncias n\xE3o utilizadas, recursos, componentes,\
          \ arquivos\n    e documenta\xE7\xE3o desnecess\xE1rios.\n\n- Atualizar continuamente\
          \ um invent\xE1rio com as vers\xF5es dos componentes\n    do lado do cliente\
          \ e do lado do servidor (por exemplo, estruturas,\n    bibliotecas) e suas\
          \ depend\xEAncias usando ferramentas como _versions_,\n    _OWASP Dependency\
          \ Check_, _retire.js_, etc. Monitore continuamente fontes\n    como _Common\
          \ Vulnerability and Exposures_ (CVE) e _National Vulnerability\n    Database_\
          \ (NVD) para vulnerabilidades nos componentes. Use ferramentas\n    de an\xE1\
          lise de composi\xE7\xE3o de software para automatizar o processo.\n    Inscreva-se\
          \ para receber alertas de e-mail sobre vulnerabilidades de\n    seguran\xE7\
          a relacionadas aos componentes que voc\xEA usa.\n\n- Obtenha componentes\
          \ apenas de fontes oficiais por meio de links seguros.\n    Prefira pacotes\
          \ assinados para reduzir a chance de incluir um componente\n    malicioso\
          \ modificado (consulte\n    [A08: 2021-Software e Falhas de Integridade\
          \ de Dados](A08_2021-Software_and_Data_Integrity_Failures.md)).\n\n- Monitore\
          \ bibliotecas e componentes sem manuten\xE7\xE3o ou que n\xE3o criem patches\n\
          \    de seguran\xE7a para vers\xF5es anteriores. Se o patch n\xE3o for poss\xED\
          vel,\n    considere implantar um patch virtual para monitorar, detectar\
          \ ou proteger\n    contra o problema descoberto.\n\nCada organiza\xE7\xE3\
          o deve garantir um plano cont\xEDnuo de monitoramento, triagem e\naplica\xE7\
          \xE3o de atualiza\xE7\xF5es ou altera\xE7\xF5es de configura\xE7\xE3o durante\
          \ a vida\n\xFAtil da aplica\xE7\xE3o ou portf\xF3lio.\n\n\n## Example attack\
          \ scenarios\n\n**Cen\xE1rio #1:** Os componentes normalmente s\xE3o executados\
          \ com os mesmos\nprivil\xE9gios da pr\xF3pria aplica\xE7\xE3o, portanto,\
          \ as falhas em qualquer componente\npodem resultar em s\xE9rio impacto.\
          \ Essas falhas podem ser acidentais\n(por exemplo, erro de codifica\xE7\xE3\
          o) ou intencionais (por exemplo, uma\n_backdoor_ em um componente). Alguns\
          \ exemplos de vulnerabilidades\nde componentes explor\xE1veis descobertos\
          \ s\xE3o:\n\n- CVE-2017-5638, uma vulnerabilidade de execu\xE7\xE3o remota\
          \ de c\xF3digo\n    do Struts 2 que permite a execu\xE7\xE3o de c\xF3digo\
          \ arbitr\xE1rio no servidor,\n    foi responsabilizada por viola\xE7\xF5\
          es significativas.\n\n- Embora a Internet das Coisas (IoT) seja frequentemente\
          \ dif\xEDcil ou\n    imposs\xEDvel de corrigir, a import\xE2ncia de corrigi-los\
          \ pode ser\n    grande (por exemplo, dispositivos biom\xE9dicos).\n\nExistem\
          \ ferramentas automatizadas para ajudar os invasores a encontrar\nsistemas\
          \ n\xE3o corrigidos ou configurados incorretamente. Por exemplo,\no mecanismo\
          \ de pesquisa Shodan IoT pode ajud\xE1-lo a encontrar\ndispositivos que\
          \ ainda sofrem com a vulnerabilidade Heartbleed\ncorrigida em abril de 2014.\n\
          \n\nPara mais informa\xE7\xF5es sobre as refer\xEAncias e a lista de CWEs\
          \ mapeadas: https://top10.owasp.org/2021/pt-BR/A06_2021-Vulnerable_and_Outdated_Components/"
      tr:
        name: Vulnerable and Outdated Components
        description: "A\u015Fa\u011F\u0131daki durumlarda muhtemelen savunmas\u0131\
          zs\u0131n\u0131z:\n\n* Kulland\u0131\u011F\u0131n\u0131z t\xFCm bile\u015F\
          enlerin (hem client-side hem de server-side) versiyonlar\u0131n\u0131 bilmiyorsan\u0131\
          z. Buna do\u011Frudan kulland\u0131klar\u0131n\u0131z\u0131n yan\u0131 s\u0131\
          ra nested dependency\u2019ler de dahildir.\n* Yaz\u0131l\u0131m (OS, web/application\
          \ server, database management system (DBMS), uygulamalar, APIs ve t\xFC\
          m bile\u015Fenler, runtime environment\u2019lar ve k\xFCt\xFCphaneler d\xE2\
          hil) savunmas\u0131z, desteklenmiyor veya g\xFCncel de\u011Filse.\n* D\xFC\
          zenli olarak zafiyet taramas\u0131 yapm\u0131yor ve kulland\u0131\u011F\u0131\
          n\u0131z bile\u015Fenlerle ilgili security bulletin\u2019lere abone olmuyorsan\u0131\
          z.\n* Temel platformu, framework\u2019leri ve dependency\u2019leri risk\
          \ temelli ve zaman\u0131nda d\xFCzeltmiyor veya upgrade etmiyorsan\u0131\
          z. Bu genellikle patching\u2019in ayl\u0131k veya \xFC\xE7 ayl\u0131k bir\
          \ change control g\xF6revi oldu\u011Fu ortamlarda ya\u015Fan\u0131r ve kurulu\u015F\
          lar\u0131 d\xFCzeltilmi\u015F zafiyetlere kar\u015F\u0131 g\xFCnlerce veya\
          \ aylarca gereksiz a\xE7\u0131kta b\u0131rak\u0131r.\n* Yaz\u0131l\u0131\
          m geli\u015Ftiriciler, g\xFCncellenmi\u015F, upgrade edilmi\u015F veya patch\
          \ uygulanm\u0131\u015F k\xFCt\xFCphanelerin uyumlulu\u011Funu test etmiyorsa.\n\
          * Bile\u015Fenlerin configuration\u2019lar\u0131n\u0131 g\xFCvence alt\u0131\
          na alm\u0131yorsan\u0131z (bkz. [A05:2021-Security Misconfiguration](A05_2021-Security_Misconfiguration.md))."
        annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
          \ Rate | Max Coverage | Avg Coverage | Avg Weighted Exploit | Avg Weighted\
          \ Impact | Total Occurrences | Total CVEs |\n| :---------: | :----------------:\
          \ | :----------------: | :----------: | :----------: | :------------------:\
          \ | :-----------------: | :---------------: | :--------: |\n|      3   \
          \   |       27.96%       |        8.77%       |    51.78%    |    22.47%\
          \    |         5.00         |         5.00        |       30,457      |\
          \      0     |\n\n\n## How to prevent\n\nA\u015Fa\u011F\u0131dakileri kapsayan\
          \ bir patch management s\xFCreci olmal\u0131d\u0131r:\n\n* Kullan\u0131\
          lmayan dependency\u2019leri, gereksiz \xF6zellikleri, bile\u015Fenleri,\
          \ dosyalar\u0131 ve dok\xFCmantasyonu kald\u0131r\u0131n.\n* Hem client-side\
          \ hem de server-side bile\u015Fenlerin (\xF6rn. framework\u2019ler, k\xFC\
          t\xFCphaneler) ve dependency\u2019lerinin versiyonlar\u0131n\u0131 s\xFC\
          rekli olarak envanterleyin; versions, OWASP Dependency Check, retire.js\
          \ vb. ara\xE7lar\u0131 kullan\u0131n. Common Vulnerabilities and Exposures\
          \ (CVE) ve National Vulnerability Database (NVD) gibi kaynaklar\u0131 bile\u015F\
          enlerdeki zafiyetler i\xE7in s\xFCrekli izleyin. Bu s\xFCreci otomatikle\u015F\
          tirmek i\xE7in software composition analysis ara\xE7lar\u0131n\u0131 kullan\u0131\
          n. Kulland\u0131\u011F\u0131n\u0131z bile\u015Fenlerle ilgili security vulnerability\
          \ e-posta uyar\u0131lar\u0131na abone olun.\n* Bile\u015Fenleri yaln\u0131\
          zca resmi kaynaklardan ve g\xFCvenli ba\u011Flant\u0131lar \xFCzerinden\
          \ edinin. De\u011Fi\u015Ftirilmi\u015F, k\xF6t\xFC ama\xE7l\u0131 bir bile\u015F\
          en ekleme olas\u0131l\u0131\u011F\u0131n\u0131 azaltmak i\xE7in imzal\u0131\
          \ paketleri tercih edin (bkz. [A08:2021-Software and Data Integrity Failures](A08_2021-Software_and_Data_Integrity_Failures.md)).\n\
          * Bak\u0131m\u0131 yap\u0131lmayan veya eski versiyonlar i\xE7in security\
          \ patch \xFCretmeyen k\xFCt\xFCphane ve bile\u015Fenleri izleyin. Patching\
          \ m\xFCmk\xFCn de\u011Filse, ke\u015Ffedilen soruna kar\u015F\u0131 izleme,\
          \ tespit veya koruma sa\u011Flayacak bir virtual patch uygulamay\u0131 de\u011F\
          erlendirin.\n\nHer kurulu\u015F, uygulaman\u0131n veya portf\xF6y\xFCn ya\u015F\
          am d\xF6ng\xFCs\xFC boyunca izleme, \xF6nceliklendirme (triage) ve update/konfig\xFC\
          rasyon de\u011Fi\u015Fikliklerini uygulamaya y\xF6nelik s\xFCrekli bir plan\
          \ sa\u011Flamal\u0131d\u0131r.\n\n\n## Example attack scenarios\n\n**Senaryo\
          \ #1:** Bile\u015Fenler genellikle uygulaman\u0131n kendisiyle ayn\u0131\
          \ ayr\u0131cal\u0131klarla \xE7al\u0131\u015Ft\u0131\u011F\u0131ndan, herhangi\
          \ bir bile\u015Fendeki kusurlar ciddi etkilere yol a\xE7abilir. Bu kusurlar\
          \ kazara (\xF6rn. coding error) veya kas\u0131tl\u0131 (\xF6rn. bir bile\u015F\
          ende backdoor) olabilir. Ke\u015Ffedilmi\u015F baz\u0131 istismar edilebilir\
          \ bile\u015Fen zafiyetleri \u015Funlard\u0131r:\n\n* CVE-2017-5638, server\
          \ \xFCzerinde arbitrary code execution\u2019a imk\xE2n veren bir Struts\
          \ 2 remote code execution zafiyeti, b\xFCy\xFCk ihlallerden sorumlu tutulmu\u015F\
          tur.\n* Internet of Things (IoT) genellikle patch\u2019lenmesi zor veya\
          \ imk\xE2ns\u0131z olsa da, bunlar\u0131n patch\u2019lenmesinin \xF6nemi\
          \ b\xFCy\xFCk olabilir (\xF6rn. biyomedikal cihazlar).\n\nSald\u0131rganlar\u0131\
          n patch uygulanmam\u0131\u015F veya misconfigured sistemleri bulmas\u0131\
          na yard\u0131mc\u0131 olan otomatik ara\xE7lar vard\u0131r. \xD6rne\u011F\
          in, Shodan IoT arama motoru, Nisan 2014\u2019te patch\u2019lenen Heartbleed\
          \ zafiyetinden h\xE2l\xE2 etkilenen cihazlar\u0131 bulman\u0131za yard\u0131\
          mc\u0131 olabilir.\n\n\nReferanslar ve e\u015Flenen CWE listesi hakk\u0131\
          nda daha fazla bilgi: https://top10.owasp.org/2021/tr/A06_2021-Vulnerable_and_Outdated_Components/"
      zh:
