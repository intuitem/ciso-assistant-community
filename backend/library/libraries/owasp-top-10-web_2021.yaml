          \u3089\u53D6\u5F97\u3055\u308C\u305F\u3082\u306E\u3067\u3042\u308B\u3053\
          \u3068\u3092\u691C\u8A3C\u3057\u307E\u3059\u3002\n\n-   npm\u3084Maven\u306A\
          \u3069\u3001\u30E9\u30A4\u30D6\u30E9\u30EA\u3084\u4F9D\u5B58\u95A2\u4FC2\
          \u304C\u4FE1\u983C\u3055\u308C\u305F\u30EA\u30DD\u30B8\u30C8\u30EA\u3092\
