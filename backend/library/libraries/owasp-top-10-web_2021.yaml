        annotation: "## Score table\n\n| \u5BFE\u5FDC\u3059\u308B CWE \u6570 | \u6700\
          \u5927\u767A\u751F\u7387 | \u5E73\u5747\u767A\u751F\u7387 |  \u52A0\u91CD\
          \u5E73\u5747\uFF08\u653B\u6483\u306E\u96E3\u6613\u5EA6\uFF09 | \u52A0\u91CD\
