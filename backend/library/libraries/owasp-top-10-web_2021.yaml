      pt:
        name: Design Inseguro
        description: "O design inseguro \xE9 uma categoria ampla que representa diferentes\
          \ pontos fracos, expressos como\n\"design de controle ausente ou ineficaz\"\
          . O design inseguro n\xE3o \xE9 a fonte de todas as outras 10\ncategorias\
          \ principais de risco de seguran\xE7a. H\xE1 uma diferen\xE7a entre design\
          \ inseguro e implementa\xE7\xE3o insegura.\nN\xF3s diferenciamos entre falhas\
          \ de design e defeitos de implementa\xE7\xE3o por um motivo, eles t\xEA\
          m diferentes\ncausas ra\xEDzes e remedia\xE7\xE3o. Um design seguro ainda\
          \ pode ter defeitos de implementa\xE7\xE3o que levam a\nvulnerabilidades\
          \ que podem ser exploradas. Um design inseguro n\xE3o pode ser corrigido\
          \ por uma implementa\xE7\xE3o\nperfeita, pois, por defini\xE7\xE3o, os controles\
          \ de seguran\xE7a necess\xE1rios nunca foram criados para a defesa\ncontra\
          \ ataques espec\xEDficos. Um dos fatores que contribuem para um design inseguro\
          \ \xE9 a falta de perfis\nde risco de neg\xF3cios inerentes ao software\
          \ ou sistema que est\xE1 sendo desenvolvido e, portanto,\na falha em determinar\
          \ o n\xEDvel de design de seguran\xE7a necess\xE1rio.\n\n### Gerenciamento\
          \ de Requisitos e Recursos\n\nColete e negocie os requisitos de neg\xF3\
          cios para uma aplica\xE7\xE3o com a empresa, incluindo os requisitos de\
          \ prote\xE7\xE3o relativos \xE0 confidencialidade, integridade, disponibilidade\
          \ e autenticidade de todos os ativos de dados e a l\xF3gica de neg\xF3cios\
          \ esperada. Leve em considera\xE7\xE3o a exposi\xE7\xE3o da sua aplica\xE7\
          \xE3o e se voc\xEA precisa de segrega\xE7\xE3o de tenants (al\xE9m do controle\
          \ de acesso). Compile os requisitos t\xE9cnicos, incluindo requisitos de\
          \ seguran\xE7a funcionais e n\xE3o funcionais. Planeje e negocie o or\xE7\
          amento cobrindo todo o projeto, constru\xE7\xE3o, teste e opera\xE7\xE3\
          o, incluindo atividades de seguran\xE7a.\n\n### Design Seguro\n\nO design\
          \ seguro \xE9 uma cultura e metodologia que avalia constantemente as amea\xE7\
          as e garante que o\nc\xF3digo seja desenvolvido e testado de forma robusta\
          \ para evitar m\xE9todos de ataque conhecidos.\nA Modelagem de Amea\xE7\
          as deve ser integrada \xE0s sess\xF5es de refinamento (ou atividades semelhantes);\n\
          procure por mudan\xE7as nos fluxos de dados e controle de acesso ou outros\
          \ controles\nde seguran\xE7a. No desenvolvimento da hist\xF3ria do usu\xE1\
          rio, determine o fluxo correto e os\nestados de falha, certifique-se de\
          \ que sejam bem compreendidos e aceitos pelas partes respons\xE1veis e\n\
          afetadas. Analise suposi\xE7\xF5es e condi\xE7\xF5es para fluxos esperados\
          \ e de falha, assegure-se de que eles\nainda sejam precisos e desej\xE1\
          veis. Determine como validar as suposi\xE7\xF5es e fazer cumprir as condi\xE7\
          \xF5es\nnecess\xE1rias para comportamentos adequados. Certifique-se de que\
          \ os resultados sejam documentados na\nhist\xF3ria do usu\xE1rio. Aprenda\
          \ com os erros e ofere\xE7a incentivos positivos para promover melhorias.\
          \ O\ndesign seguro n\xE3o \xE9 um _add-on_ nem uma ferramenta que voc\xEA\
          \ pode adicionar ao software.\n\n### Ciclo de Vida de Desenvolvimento Seguro\n\
          O software seguro requer um ciclo de vida de desenvolvimento seguro, alguma\
          \ forma de padr\xE3o\nde projeto seguro, metodologia de _paved road_, bibliotecas\
          \ de componentes protegidos, ferramentas\ne modelagem de amea\xE7as. Procure\
          \ seus especialistas em seguran\xE7a no in\xEDcio de um projeto de software,\n\
          durante todo o projeto e durante a manuten\xE7\xE3o de seu software. Considere\
          \ aproveitar o\n[OWASP Software Assurance Maturity Model (SAMM)](https://owaspsamm.org)\
          \ para ajudar a estruturar\nseus esfor\xE7os de desenvolvimento de software\
          \ seguro."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:-------------------------:|:------------------------:|:--------------------------:|:-----------------------:|:----------------:|:---------------:|:--------------------:|:-------------:|\n\
          | 40            | 24.19%                    | 3.00%                    |\
          \ 6.46                       | 6.78                    | 77.25%        \
          \   | 42.51%          | 262,407              | 2,691         |\n\n\n## How\
          \ to prevent\n\n- Estabele\xE7a e use um ciclo de vida de desenvolvimento\
          \ seguro\n    com profissionais de AppSec para ajudar a avaliar e projetar\n\
          \    controles relacionados \xE0 seguran\xE7a e privacidade.\n\n- Estabele\xE7\
          a e use bibliotecas de padr\xF5es de projeto seguros ou\n    componentes\
          \ de _paved road_ prontos para usar.\n\n- Use Modelagem de Amea\xE7as para\
          \ autentica\xE7\xE3o cr\xEDtica, controle de acesso,\n    l\xF3gica de neg\xF3\
          cios e fluxos de chaves.\n\n- Integre a linguagem e os controles de seguran\xE7\
          a \xE0s hist\xF3rias de usu\xE1rios.\n\n- Integre verifica\xE7\xF5es de\
          \ plausibilidade em cada camada da sua\n    aplica\xE7\xE3o (do front-end\
          \ ao back-end).\n\n- Escreva testes de unidade e integra\xE7\xE3o para validar\
          \ se todos os fluxos cr\xEDticos\n    s\xE3o resistentes ao modelo de amea\xE7\
          a. Compile casos de uso de sucesso e casos de uso\n    indevido para cada\
          \ camada da sua aplica\xE7\xE3o.\n\n- Separe as camadas de n\xEDvel no sistema\
          \ e nas camadas de rede, dependendo\n    das necessidades de exposi\xE7\xE3\
          o e prote\xE7\xE3o.\n\n- Separe os _tenants_ de maneira robusta por design\
          \ em todas as camadas.\n\n- Limite o consumo de recursos por usu\xE1rio\
          \ ou servi\xE7o.\n\n\n## Example attack scenarios\n\n**Cen\xE1rio #1:**\
          \ Um fluxo de trabalho de recupera\xE7\xE3o de credencial pode incluir\n\
          \"perguntas e respostas\" (confirma\xE7\xE3o positiva), o que \xE9 proibido\
          \ pelo NIST 800-63b,\no OWASP ASVS e o OWASP Top 10. Perguntas e respostas\
          \ n\xE3o podem ser consideradas\nevid\xEAncias de identidade, pois mais\
          \ de uma pessoa pode saber as respostas,\n\xE9 por isso que eles s\xE3o\
          \ proibidos. Esse c\xF3digo deve ser removido e\nsubstitu\xEDdo por um design\
          \ mais seguro.\n\n**Cen\xE1rio #2:** Uma rede de cinemas permite descontos\
          \ para reservas de grupos\ne tem um m\xE1ximo de quinze participantes antes\
          \ de exigir um dep\xF3sito.\nOs invasores podem modelar esse fluxo e testar\
          \ se conseguem reservar\nseiscentos lugares e todos os cinemas de uma s\xF3\
          \ vez em algumas solicita\xE7\xF5es,\ncausando uma enorme perda de receita.\n\
          \n**Cen\xE1rio #3:** O site de com\xE9rcio eletr\xF4nico de uma rede de\
          \ varejo n\xE3o\ntem prote\xE7\xE3o contra bots executados por cambistas\
          \ que compram placas\nde v\xEDdeo de \xFAltima gera\xE7\xE3o para revender\
          \ sites de leil\xE3o. Isso cria\numa publicidade terr\xEDvel para os fabricantes\
          \ de placas de v\xEDdeo\ne propriet\xE1rios de redes de varejo, al\xE9m\
          \ de sofrer com os\nentusiastas que n\xE3o podem obter essas placas a qualquer\
          \ pre\xE7o.\nO design anti-bot cuidadoso e as regras de l\xF3gica de dom\xED\
          nio,\ncomo compras feitas dentro de alguns segundos de disponibilidade,\n\
          podem identificar compras n\xE3o aut\xEAnticas e rejeitar tais transa\xE7\
          \xF5es.\n\n\nPara mais informa\xE7\xF5es sobre as refer\xEAncias e a lista\
          \ de CWEs mapeadas: https://top10.owasp.org/2021/pt-BR/A04_2021-Insecure_Design/"
      tr:
        name: Insecure Design
        description: "Insecure design, \u201Ceksik veya etkisiz control design\u201D\
          \ olarak ifade edilen farkl\u0131 zay\u0131fl\u0131klar\u0131 kapsayan geni\u015F\
          \ bir kategoridir. Insecure design, di\u011Fer Top 10 risk kategorilerinin\
          \ kayna\u011F\u0131 de\u011Fildir. Insecure design ile insecure implementation\
          \ aras\u0131nda fark vard\u0131r; farkl\u0131 root cause\u2019lara ve remediation\u2019\
          lara sahiptirler. G\xFCvenli bir design, yine de exploit edilebilecek implementation\
          \ defect\u2019leri i\xE7erebilir. Tan\u0131m gere\u011Fi belirli sald\u0131\
          r\u0131lara kar\u015F\u0131 gerekli security control\u2019leri hi\xE7 olu\u015F\
          turulmad\u0131\u011F\u0131ndan, insecure design m\xFCkemmel bir implementation\
          \ ile d\xFCzeltilemez. Insecure design\u2019a katk\u0131da bulunan fakt\xF6\
          rlerden biri, geli\u015Ftirilen yaz\u0131l\u0131m veya sistemin do\u011F\
          as\u0131nda bulunan business risk profiling eksikli\u011Fi ve buna ba\u011F\
          l\u0131 olarak hangi seviyede security design gerekti\u011Finin belirlenememesidir.\n\
          \n### Requirements and Resource Management\n\nBir uygulama i\xE7in business\
          \ gereksinimlerini, t\xFCm data asset\u2019lerinin gizlilik, b\xFCt\xFC\
          nl\xFCk, s\xFCreklilik (availability) ve do\u011Frulanabilirlik (authenticity)\
          \ koruma gereksinimleri ve beklenen business logic d\xE2hil olacak \u015F\
          ekilde business taraf\u0131yla toplay\u0131n ve m\xFCzakere edin. Uygulaman\u0131\
          z\u0131n ne kadar exposed olaca\u011F\u0131n\u0131 ve tenant ayr\u0131m\u0131\
          \ (access control\u2019a ek olarak) gerekip gerekmedi\u011Fini hesaba kat\u0131\
          n. Functional ve non-functional security requirement\u2019lar\u0131 d\xE2\
          hil teknik gereksinimleri derleyin. Design, build, testing ve operation\
          \ a\u015Famalar\u0131n\u0131n tamam\u0131n\u0131, security aktiviteleriyle\
          \ birlikte kapsayacak b\xFCt\xE7eyi planlay\u0131n ve m\xFCzakere edin.\n\
          \n### Secure Design\n\nSecure design; tehditleri s\xFCrekli de\u011Ferlendiren\
          \ ve kodu bilinen attack method\u2019lar\u0131na kar\u015F\u0131 sa\u011F\
          lam olacak \u015Fekilde tasarlay\u0131p test eden bir k\xFClt\xFCr ve metodolojidir.\
          \ Threat modeling, refinement session\u2019lar\u0131na (veya benzer aktivitelere)\
          \ entegre edilmelidir; data flow\u2019lar ve access control veya di\u011F\
          er security control\u2019lerdeki de\u011Fi\u015Fikliklere bak\u0131n. User\
          \ story geli\u015Ftirme s\u0131ras\u0131nda do\u011Fru ak\u0131\u015F\u0131\
          \ ve failure state\u2019lerini belirleyin; sorumlu ve etkilenen taraflarca\
          \ iyi anla\u015F\u0131ld\u0131\u011F\u0131ndan ve \xFCzerinde mutab\u0131\
          k kal\u0131nd\u0131\u011F\u0131ndan emin olun. Varsay\u0131mlar\u0131 ve\
          \ ko\u015Fullar\u0131 hem beklenen hem de failure flow\u2019lar\u0131 i\xE7\
          in analiz edin; h\xE2l\xE2 do\u011Fru ve arzu edilir olduklar\u0131n\u0131\
          \ do\u011Frulay\u0131n. Varsay\u0131mlar\u0131n nas\u0131l validate edilece\u011F\
          ini ve do\u011Fru davran\u0131\u015Flar i\xE7in gerekli ko\u015Fullar\u0131\
          n nas\u0131l enforce edilece\u011Fini belirleyin. Sonu\xE7lar\u0131n user\
          \ story i\xE7inde dok\xFCmante edilmesini sa\u011Flay\u0131n. Hatalardan\
          \ \xF6\u011Frenin ve iyile\u015Ftirmeleri te\u015Fvik etmek i\xE7in pozitif\
          \ te\u015Fvikler sunun. Secure design, yaz\u0131l\u0131ma sonradan eklenebilecek\
          \ bir eklenti ya da bir tool de\u011Fildir.\n\n### Secure Development Lifecycle\n\
          \nG\xFCvenli yaz\u0131l\u0131m, bir Secure Development Lifecycle, bir t\xFC\
          r secure design pattern, paved road methodology, secured component library,\
          \ tooling ve threat modeling gerektirir. Yaz\u0131l\u0131m projesinin en\
          \ ba\u015F\u0131ndan t\xFCm proje ve bak\u0131m s\xFCreci boyunca security\
          \ specialist\u2019lerinize ula\u015F\u0131n. G\xFCvenli yaz\u0131l\u0131\
          m geli\u015Ftirme \xE7abalar\u0131n\u0131z\u0131 yap\u0131land\u0131rmaya\
          \ yard\u0131mc\u0131 olmas\u0131 i\xE7in [OWASP Software Assurance Maturity\
          \ Model (SAMM)](https://owaspsamm.org) kullan\u0131lmas\u0131n\u0131 d\xFC\
          \u015F\xFCn\xFCn."
        annotation: "## Score table\n\n| CWEs E\u015Fle\u015Ftirildi | Maks G\xF6\
          r\xFClme Oran\u0131 | Ort. G\xF6r\xFClme Oran\u0131 | Ort. A\u011F\u0131\
          rl\u0131kl\u0131 Exploit | Ort. A\u011F\u0131rl\u0131kl\u0131 Impact | Maks\
          \ Coverage | Ort. Coverage | Toplam Olay | Toplam CVE |\n| :---------------:\
          \ | :----------------: | :----------------: | :--------------------: | :-------------------:\
          \ | :-----------: | :-----------: | :---------: | :--------: |\n|      \
          \   40        |       24.19%       |        3.00%       |          6.46\
          \          |          6.78         |     77.25%    |     42.51%    |   262,407\
          \   |    2,691   |\n\n\n## How to prevent\n\n* AppSec profesyonelleriyle\
          \ birlikte security ve privacy-related control\u2019lerin de\u011Ferlendirilip\
          \ tasarlanaca\u011F\u0131 bir Secure Development Lifecycle kurun ve kullan\u0131\
          n.\n\n* Kullan\u0131ma haz\u0131r secure design patterns veya paved road\
          \ component\u2019lar\u0131ndan olu\u015Fan bir k\xFCt\xFCphane olu\u015F\
          turun ve kullan\u0131n.\n\n* Kritik authentication, access control, business\
          \ logic ve ana ak\u0131\u015Flar i\xE7in threat modeling uygulay\u0131n.\n\
          \n* Security dilini ve control\u2019lerini user story\u2019lere entegre\
          \ edin.\n\n* Uygulaman\u0131z\u0131n her katman\u0131nda (frontend\u2019\
          den backend\u2019e) plausibility check\u2019leri entegre edin.\n\n* T\xFC\
          m kritik ak\u0131\u015Flar\u0131n threat model\u2019e kar\u015F\u0131 diren\xE7\
          li oldu\u011Funu validate edecek unit ve integration test\u2019leri yaz\u0131\
          n. Her katman i\xE7in use-case *ve* misuse-case\u2019leri derleyin.\n\n\
          * Maruziyete ve korunma ihtiya\xE7lar\u0131na ba\u011Fl\u0131 olarak system\
          \ ve network katmanlar\u0131nda tier\u2019lar\u0131 ay\u0131r\u0131n (segregate).\n\
          \n* T\xFCm katmanlarda tenant\u2019lar\u0131 tasar\u0131m gere\u011Fi g\xFC\
          \xE7l\xFC \u015Fekilde ay\u0131r\u0131n.\n\n* Kullan\u0131c\u0131 veya servis\
          \ ba\u015F\u0131na resource consumption\u2019\u0131 s\u0131n\u0131rlay\u0131\
          n.\n\n\n## Example attack scenarios\n\n**Senaryo #1:** Bir credential recovery\
          \ workflow\u2019u \u201Cg\xFCvenlik sorular\u0131 ve cevaplar\u0131\u201D\
          \ i\xE7eriyor; bu y\xF6ntem NIST 800-63b, OWASP ASVS ve OWASP Top 10 taraf\u0131\
          ndan yasakt\u0131r. Birden fazla ki\u015Fi cevaplar\u0131 bilebilece\u011F\
          i i\xE7in kimlik kan\u0131t\u0131 olarak g\xFCvenilemezler. Bu kod kald\u0131\
          r\u0131lmal\u0131 ve daha g\xFCvenli bir design ile de\u011Fi\u015Ftirilmelidir.\n\
          \n**Senaryo #2:** Bir sinema zinciri, grup rezervasyonlar\u0131nda indirim\
          \ sunuyor ve depozito gerektirmeden \xF6nce maksimum on be\u015F kat\u0131\
          l\u0131mc\u0131 limiti var. Sald\u0131rganlar bu ak\u0131\u015F\u0131 threat\
          \ model ile analiz ederek az say\u0131da istekle alt\u0131 y\xFCz koltuk\
          \ ve t\xFCm sinemalar\u0131 ayn\u0131 anda rezerve etmeyi test edebilir;\
          \ bu da b\xFCy\xFCk gelir kayb\u0131na yol a\xE7ar.\n\n**Senaryo #3:** Bir\
          \ perakende zincirinin e-ticaret sitesi, scalper\u2019lar\u0131n y\xFCksek\
          \ seviye ekran kartlar\u0131n\u0131 sat\u0131n almak i\xE7in \xE7al\u0131\
          \u015Ft\u0131rd\u0131\u011F\u0131 bot\u2019lara kar\u015F\u0131 korumaya\
          \ sahip de\u011Fil. Bu durum, ekran kart\u0131 \xFCreticileri ve perakende\
          \ zinciri i\xE7in k\xF6t\xFC bir PR yarat\u0131r ve bu kartlara hi\xE7bir\
          \ fiyata ula\u015Famayan merakl\u0131larla kal\u0131c\u0131 bir husumete\
          \ neden olur. Dikkatli anti-bot design ve domain logic kurallar\u0131 (\xF6\
          rne\u011Fin, stok a\xE7\u0131ld\u0131ktan saniyeler i\xE7inde yap\u0131\
          lan sat\u0131n al\u0131mlar) sahte sat\u0131n al\u0131mlar\u0131 tespit\
          \ edip bu i\u015Flemleri reddedebilir.\n\n\nReferanslar ve e\u015Flenen\
          \ CWE listesi hakk\u0131nda daha fazla bilgi: https://top10.owasp.org/2021/tr/A04_2021-Insecure_Design/"
      zh:
        name: "\u4E0D\u5B89\u5168\u8BBE\u8BA1"
        description: "\u4E0D\u5B89\u5168\u8BBE\u8BA1\u662F\u4E00\u4E2A\u5E7F\u6CDB\
          \u7684\u7C7B\u522B\u5448\u73B0\u8BB8\u591A\u4E0D\u540C\u7684\u5F31\u70B9\
          \uFF0C\u4EE3\u8868\u4E3A\"\u7F3A\u4E4F\u6216\u65E0\u6548\u7684\u63A7\u5236\
          \u8BBE\u8BA1\"\u3002\u7F3A\u4E4F\u4E0D\u5B89\u5168\u8BBE\u8BA1\u662F\u6307\
          \u6CA1\u6709\u63A7\u5236\u63AA\u65BD\u3002\u4E3E\u4F8B\u6765\u8BF4\uFF0C\
          \u60F3\u50CF\u4E00\u6BB5\u7A0B\u5F0F\u7801\u5E94\u8BE5\u52A0\u5BC6\u654F\
          \u611F\u8D44\u6599\u4F46\u662F\u6CA1\u6709\u5BF9\u5E94\u7684\u5B9E\u4F5C\
          \u65B9\u6CD5\u3002\u65E0\u6548\u7684\u4E0D\u5B89\u5168\u8BBE\u8BA1\u662F\
          \u53EF\u4EE5\u5B9E\u73B0\u5A01\u80C1\u7684\u5730\u65B9\uFF0C\u4F46\u4E0D\
          \u8DB3\u7684\u9886\u57DF\uFF08\u5546\u4E1A\uFF09\u903B\u8F91\u9A8C\u8BC1\
          \u4F1A\u963B\u6B62\u8BE5\u52A8\u4F5C\u3002\u4EE5\u4E0B\u4E2A\u4F8B\u5B50\
          \u8BF4\uFF0C\u60F3\u50CF\u9886\u57DF\u903B\u8F91\u662F\u7528\u6765\u5904\
          \u7406\u57FA\u4E8E\u6536\u5165\u7B49\u7EA7\u7684\u75AB\u60C5\u51CF\u7A0E\
          \u4F46\u662F\u5E76\u672A\u786E\u8BA4\u6240\u6709\u7684\u8F93\u5165\u90FD\
          \u662F\u6709\u6B63\u786E\u7684\u7B7E\u540D\uFF0C\u56E0\u6B64\u63D0\u4F9B\
          \u8D85\u8FC7\u539F\u672C\u53EF\u4EE5\u83B7\u5F97\u800C\u4E14\u66F4\u663E\
          \u8457\u7684\u51CF\u7A0E\u5229\u76CA\u3002\n\n\u5B89\u5168\u8BBE\u8BA1\u4E00\
          \u4E2A\u6587\u5316\u4E0E\u65B9\u6CD5\u6301\u7EED\u4E0D\u65AD\u7684\u6765\
          \u8BC4\u4F30\u5A01\u80C1\u5E76\u4FDD\u8BC1\u7A0B\u5F0F\u7801\u6709\u88AB\
          \u7A33\u5065\u7684\u8BBE\u8BA1\u4E0E\u6D4B\u8BD5\u6765\u9884\u9632\u5DF2\
          \u77E5\u7684\u653B\u51FB\u65B9\u6CD5\u3002\u5B89\u5168\u8BBE\u8BA1\u9700\
          \u8981\u5B89\u5168\u7684\u5F00\u53D1\u751F\u547D\u5468\u671F\u3001\u67D0\
          \u79CD\u5F62\u5F0F\u4E0A\u7684\u5B89\u5168\u8BBE\u8BA1\u6A21\u5F0F\u6216\
          \u662F\u5DF2\u5B8C\u6210\u7684\u5143\u4EF6\u5E93\u6216\u5DE5\u5177\u4EE5\
          \u53CA\u5A01\u80C1\u5EFA\u6A21\u3002"
        annotation: "## Score table\n\n| \u53EF\u5BF9\u7167 CWEs \u6570\u91CF | \u6700\
          \u5927\u53D1\u751F\u7387 | \u5E73\u5747\u53D1\u751F\u7387 | \u6700\u5927\
          \u8986\u76D6\u8303\u56F4 | \u5E73\u5747\u8986\u76D6\u8303\u56F4 | \u5E73\
          \u5747\u52A0\u6743\u6F0F\u6D1E | \u5E73\u5747\u52A0\u6743\u5F71\u54CD |\
          \ \u51FA\u73B0\u6B21\u6570 | \u6240\u6709\u76F8\u5173 CVEs \u6570\u91CF\
