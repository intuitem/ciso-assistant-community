          \ \u0627\u0644\u0645\u0631\u0648\u0631 \u0643\u0639\u0627\u0645\u0644 \u0648\
          \u062D\u064A\u062F \u0644\u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\
