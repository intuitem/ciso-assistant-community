      de:
        name: Fehlerhafter Einsatz von Kryptographie
        description: "Zun\xE4chst gilt es, den Schutzbedarf der Daten w\xE4hrend der\
          \ \xDCbermittlung und der Speicherung zu ermitteln. Beispielsweise erfordern\
          \ Passw\xF6rter, Kreditkartennummern, Gesundheitsakten, pers\xF6nliche Informationen\
          \ und Gesch\xE4ftsgeheimnisse zus\xE4tzlichen Schutz, vor allem dann, wenn\
          \ diese Daten unter Datenschutzgesetze, z. B. die Datenschutz-Grundverordnung\
          \ (DSGVO) der EU, oder andere Vorschriften fallen, beispielsweise dem Payment\
          \ Card Industry Data Security Standard (PCI-DSS).\n\nFolgendes ist zu kl\xE4\
          ren:\n\n- Werden Daten im Klartext \xFCbermittelt? Das betrifft Protokolle\
          \ wie HTTP, SMTP, und FTP unter Umst\xE4nden auch bei Verwendung von TLS-Upgrades\
          \ wie STARTTLS. Das Internet ist hier besonders gef\xE4hrlich. \xDCberpr\xFC\
          fen Sie auch internen Datenverkehr, z. B. zwischen Load Balancer, Webservern\
          \ oder Back-End-Systemen.\n\n- Werden alte oder schwache kryptografische\
          \ Algorithmen oder Protokolle verwendet, z. B. per Default-Einstellung oder\
          \ in \xE4lterem Code?\n\n- Werden vordefinierte kryptografische Schl\xFC\
          ssel verwendet, schwache Schl\xFCssel generiert oder Schl\xFCssel wiederverwendet?\
          \ Fehlt eine Schl\xFCsselverwaltung oder Schl\xFCsselrotation? Werden kryptografische\
          \ Schl\xFCssel in Quellcode-Repositories eingecheckt?\n\n- Wird Verschl\xFC\
          sselung nicht verbindlich erzwungen, z. B. fehlen bei Web Anwendungen Vorgaben\
          \ f\xFCr den Browser in den entsprechenden HTTP-Headern?\n\n- Werden empfangene\
          \ Serverzertifikate und die Zertifikatskette korrekt validiert?\n\n- Werden\
          \ Initialisierungsvektoren ignoriert, wiederverwendet oder nicht ausreichend\
          \ sicher f\xFCr den kryptografischen Betriebsmodus generiert? Ist ein unsicherer\
          \ Betriebsmodus wie ECB im Einsatz? Wird ein Betriebsmodus verwendet, der\
          \ nur verschl\xFCsselt, obwohl ein AEAD Betriebsmodus angebracht w\xE4re,\
          \ der auch die Integrit\xE4t sch\xFCtzt?\n\n- Werden Passw\xF6rter direkt\
          \ als kryptografische Schl\xFCssel verwendet ohne eine Schl\xFCsselableitung\
          \ mittels Key Derivation Function?\n\n- Werden Zufallszahlen f\xFCr kryptografische\
          \ Zwecke genutzt, die nicht auf kryptografische Anforderungen ausgelegt\
          \ sind? Selbst wenn die richtige Funktion genutzt wird, muss diese eventuell\
          \ vom Entwickler korrekt initialisiert werden. Wurde eine integrierte starke\
          \ Initialisierung eventuell durch einen Entwickler mit einem schwachen Wert\
          \ \xFCberschrieben, dem es an ausreichender Entropie und Nichtvorhersehbarkeit\
          \ mangelt?\n\n- Werden Hash-Funktionen mit bekannten Schw\xE4chen wie MD5\
          \ oder SHA1 verwendet oder werden nicht-kryptografische Hash-Funktionen\
          \ verwendet, wenn kryptografische Hash-Funktionen ben\xF6tigt werden?\n\n\
          - Werden veraltete kryptografische Padding Methoden verwendet, z. B. PKCS#1\
          \ v1.5?\n\n- Sind kryptografische Fehlermeldungen oder Seitenkan\xE4le ausnutzbar,\
          \ beispielsweise in Form von Padding-Oracle-Angriffen?\n\nSiehe {{ osib_link(link=\"\
          osib.owasp.asvs.4-0.6\", prefix=\"ASVS \", doc=\"\", osib=osib) }}, {{ osib_link(link=\
          \ \"osib.owasp.asvs.4-0.8\", doc=\"\", osib=osib) }}, {{ osib_link(link=\
          \ \"osib.owasp.asvs.4-0.9\", doc=\"\", osib=osib) }}<!-- ASVS Crypto (V7),\
          \ Datenschutz (V9) und SSL/TLS (V10)-->"
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 29          | 46.44 %             | 4.49 %              |7.29        \
          \         | 6.81                |  79.33 %       | 34.85 %       | 233,788\
          \           | 3,075      |\n\n\n## How to prevent\n\nGehen Sie als Minimum\
          \ wie folgt vor und konsultieren Sie die Referenzen:\n\n- Klassifizieren\
          \ Sie die Daten, die von einer Anwendung verarbeitet, gespeichert oder \xFC\
          bermittelt werden\nnach ihrem Schutzbedarf. Ber\xFCcksichtigen Sie dabei\
          \ auch Datenschutzgesetze, regulatorische und Gesch\xE4fts-Anforderungen.\n\
          \n- Speichern Sie sensible Daten nicht unn\xF6tig. L\xF6schen Sie sensible\
          \ Daten auf sichere Weise sobald wie m\xF6glich oder verwenden Sie Techniken\
          \ wie PCI-DSS-konformes Speichern von Ersatzwerten (tokenization) oder gar\
          \ gek\xFCrzten (truncation) Werten.\nDaten, die es nicht mehr gibt, k\xF6\
          nnen auch nicht gestohlen werden.\n\n- Stellen Sie sicher, dass alle vertraulichen\
          \ Daten bei Speicherung verschl\xFCsselt werden.\n\n- Stellen Sie sicher,\
          \ dass aktuelle, starke, standardisierte Algorithmen, Protokolle und Schl\xFC\
          ssel, z. B. gem\xE4\xDF BSI TR-02102, verwendet werden. Etablieren Sie wirksames\
          \ \nSchl\xFCsselmanagement f\xFCr kryptografische Schl\xFCssel.\n\n- Verschl\xFC\
          sseln Sie alle Daten w\xE4hrend der \xDCbertragung mit sicheren Protokollen\
          \ wie TLS. Priorisieren Sie dabei durch serverseitig Cipher-Suiten, die\
          \ Forward Secrecy (FS) bieten, und sichere Parameter.\nErzwingen Sie die\
          \ Verschl\xFCsselung wenn m\xF6glich, z. B. durch Einf\xFChrung von HTTP\
          \ Strict Transport Security (HSTS).\n\n- Deaktivieren Sie das Caching f\xFC\
          r den Empfang vertraulicher Daten.\n\n- Wenden Sie die Sicherheitsma\xDF\
          nahmen gem\xE4\xDF dem Schutzbedarf der Datenklassifizierung an.\n\n- Verwenden\
          \ Sie keine veralteten Protokolle wie FTP und SMTP f\xFCr den Transport\
          \ sensibler Daten.\n\n- Verwenden Sie spezielle Hash-Funktionen f\xFCr das\
          \ Hashen von Passw\xF6rtern, bei denen f\xFCr jedes Passwort ein Salt-Wert\
          \ (salted hash) zum Einsatz kommt und durch Parametrisierung der Rechenaufwand\
          \ adaptiv gesteuert werden kann (work-factor). Beispiele sind: Argon2, scrypt,\
          \ bcrypt oder PBKDF2.\n\n- Initialisierungsvektoren m\xFCssen passend zum\
          \ kryptografischen Betriebsmodus gew\xE4hlt werden. In vielen F\xE4llen\
          \ bedeutet dies, dass ein CSPRNG (kryptografisch sicherer Pseudozufallszahlengenerator)\
          \ f\xFCr die Generierung des Initialisierungsvektors verwendet wird. F\xFC\
          r Modi, die eine Nonce erfordern, ben\xF6tigt der Initialisierungsvektor\
          \ nicht notwendigerweise einen CSPRNG. In allen F\xE4llen darf der gleiche\
          \ Initialisierungsvektor niemals zweimal f\xFCr den gleichen Schl\xFCssel\
          \ verwendet werden.\n\n- Verwenden Sie immer eine authentifizierte Verschl\xFC\
          sselung statt nur einer Verschl\xFCsselung.\n\n- Schl\xFCssel sollten kryptografisch\
          \ zuf\xE4llig generiert und als Byte-Arrays im Speicher gehalten werden.\
          \ Wenn ein Passwort zur Verschl\xFCsselung verwendet werden soll, muss \xFC\
          ber eine Funktion zur Schl\xFCsselableitung ein Schl\xFCssel generiert werden.\n\
          \n- Stellen Sie sicher, dass an den notwendigen Stellen kryptografisch sichere,\
          \ unvorhersagbare Zufallszahlen verwendet werden, und dass der Pseudozufallszahlengenerator\
          \ nicht auf vorhersehbare Weise oder nur mit geringer Entropie initialisiert\
          \ wurde. Bei den meisten modernen APIs muss der Entwickler die Initialisierung\
          \ des Pseudozufallszahlengenerators (CSPRNG) nicht manuell durchf\xFChren.\n\
          \n- Vermeiden Sie veraltete kryptografische Funktionen und Padding-Verfahren\
          \ wie MD5, SHA1, PKCS Nummer 1 v1.5.\n\n- Lassen Sie die Wirksamkeit der\
          \ Einstellungen unabh\xE4ngig \xFCberpr\xFCfen.\n\n\n## Example attack scenarios\n\
          \n**Szenario Nr. 1:**: Eine Anwendung verschl\xFCsselt Kreditkartendaten\
          \ automatisch bei der Speicherung in einer Datenbank. Das bedeutet aber\
          \ auch, dass durch SQL-Injection erlangte Kreditkartendaten in diesem Fall\
          \ automatisch entschl\xFCsselt werden.\n\n**Szenario Nr. 2:**: Eine Webseite\
          \ benutzt kein TLS,\nerzwingt dies nicht auf allen Seiten oder l\xE4sst\
          \ schwache Verschl\xFCsselung zu.\nDie angreifende Person liest die Kommunikation\
          \ mit (z. B. in einem offenen WLAN), ersetzt HTTPS- durch HTTP-Verbindungen,\
          \ h\xF6rt diese ab und stiehlt das Sitzungscookie.\nDurch Wiedereinspielen\
          \ dieses Cookies \xFCbernimmt die angreifende Person die (authentifizierte)\
          \ Sitzung des Nutzers und erlangt Zugriff auf dessen private Daten.\nAnstatt\
          \ dessen kann die angreifende Person auch die \xFCbertragenen Daten \xE4\
          ndern, z. B. den Empf\xE4nger einer \xDCberweisung.\n\n**Szenario Nr. 3:**:\
          \ Die Passwortdatenbank benutzt einfache Hashwerte oder Hashes ohne Salt\
          \ zur Speicherung der Passw\xF6rter. Eine Schwachstelle in der Downloadfunktion\
          \ erlaubt Angreifenden den Zugriff auf die Passwortdatei. Zu Hashes ohne\
          \ Salt kann \xFCber vorausberechnete Rainbow-Tabellen der Klartext gefunden\
          \ werden. Hashes, die \xFCber einfache oder schnelle Funktionen berechnet\
          \ wurden, k\xF6nnen effizient mit Grafikkarten gebrochen werden.\n\n\nWeitere\
          \ Informationen zu den Referenzen und zur Liste der zugeordneten CWEs: https://top10.owasp.org/2021/de/A02_2021-Cryptographic_Failures/"
      es:
        name: "Fallas Criptogr\xE1ficas"
        description: "Lo primero es determinar las necesidades de protecci\xF3n de\
          \ los datos en tr\xE1nsito y en reposo. Por ejemplo, contrase\xF1as, n\xFA\
          meros de tarjetas de cr\xE9dito, registros m\xE9dicos, informaci\xF3n personal\
          \ y secretos comerciales requieren protecci\xF3n adicional, principalmente\
          \ si est\xE1n sujetos a leyes de privacidad (por ejemplo, el Reglamento\
          \ General de Protecci\xF3n de Datos -GDPR- de la UE), o regulaciones, (por\
          \ ejemplo, protecci\xF3n de datos financieros como el Est\xE1ndar de Seguridad\
          \ de Datos de PCI -PCI DSS-).\nPara todos esos datos:\n\n-   \xBFSe transmiten\
          \ datos en texto claro? Esto se refiere a protocolos como HTTP, SMTP, FTP\
          \ que tambi\xE9n utilizan actualizaciones de TLS como STARTTLS. El tr\xE1\
          fico externo de Internet es peligroso. Verifique todo el tr\xE1fico interno,\
          \ por ejemplo, entre balanceadores de carga, servidores web o sistemas de\
          \ back-end.\n\n-   \xBFSe utilizan algoritmos o protocolos criptogr\xE1\
          ficos antiguos o d\xE9biles de forma predeterminada o en c\xF3digo antiguo?\n\
          \n-   \xBFSe utilizan claves criptogr\xE1ficas predeterminadas, se generan\
          \ o reutilizan claves criptogr\xE1ficas d\xE9biles, o es inexistente la\
          \ gesti\xF3n o rotaci\xF3n de claves adecuadas?\n    \xBFSe incluyen las\
          \ claves criptogr\xE1ficas en los repositorios de c\xF3digo fuente?\n\n\
          -   \xBFNo es forzado el cifrado, por ejemplo, faltan las directivas de\
          \ seguridad de los encabezados HTTP (navegador) o los encabezados?\n\n-\
          \   \xBFEl certificado de servidor recibido y la cadena de confianza se\
          \ encuentran debidamente validados?\n\n-   \xBFLos vectores de inicializaci\xF3\
          n se ignoran, se reutilizan o no se generan de forma suficientemente seguros\
          \ para el modo de operaci\xF3n criptogr\xE1fico?\n    \xBFSe utiliza un\
          \ modo de funcionamiento inseguro como el ECB? \xBFSe utiliza un cifrado\
          \ cuando el cifrado autenticado es m\xE1s apropiada?\n\n-   \xBFLas contrase\xF1\
          as se utilizan como claves criptogr\xE1ficas en ausencia de una funci\xF3\
          n de derivaci\xF3n de claves a partir de contrase\xF1as?\n\n-   \xBFSe utiliza\
          \ con fines criptogr\xE1ficos generadores de aleatoriedad que no fueron\
          \ dise\xF1aron para dicho fin? Incluso si se elige la funci\xF3n correcta,\
          \ debe ser inicializada (seed) por el desarrollador y, de no ser as\xED\
          , \xBFel desarrollador ha sobrescrito la funcionalidad de semilla fuerte\
          \ incorporada con una semilla que carece de suficiente entrop\xEDa/imprevisibilidad?\n\
          \n-   \xBFSe utilizan funciones hash en obsoletas, como MD5 o SHA1, o se\
          \ utilizan funciones hash no criptogr\xE1ficas cuando se necesitan funciones\
          \ hash criptogr\xE1ficas?\n\n-   \xBFSe utilizan m\xE9todos criptogr\xE1\
          ficos de relleno(padding) obsoletos, como PKCS n\xFAmero 1 v1.5?\n\n-  \
          \ \xBFSe pueden explotar los mensajes de errores criptogr\xE1ficos como\
          \ un canal lateral, por ejemplo, en forma de ataques de  criptoan\xE1lisis\
          \ por modificaci\xF3n relleno (Oracle Padding)?\n\nConsulte ASVS Crypto\
          \ (V7), Data Protection (V9) y SSL/TLS (V10)"
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom| Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 29          | 46.44%             | 4.49%              |7.29          \
          \       | 6.81                |  79.33%       | 34.85%       | 233,788 \
          \          | 3,075      |\n\n\n## How to prevent\n\nHaga lo siguiente como\
          \ m\xEDnimo, y consulte las referencias:\n\n-   Clasifique los datos procesados,\
          \ almacenados o transmitidos por una aplicaci\xF3n.\n    Identifique qu\xE9\
          \ datos son confidenciales de acuerdo con las leyes de privacidad, los requisitos\
          \ reglamentarios o las necesidades comerciales.\n\n-   No almacene datos\
          \ sensibles innecesariamente. Desc\xE1rtelos lo antes posible o utilice\
          \ una utilizaci\xF3n de tokens compatible con PCI DSS o incluso el truncamiento.\n\
          \    Los datos que no se conservan no se pueden robar.\n\n-   Aseg\xFArese\
          \ de cifrar todos los datos sensibles en reposo (almacenamiento).\n\n- \
          \  Garantice la implementaci\xF3n de algoritmos, protocolos y claves que\
          \ utilicen est\xE1ndares s\xF3lidos y actualizados; utilice una gesti\xF3\
          n de claves adecuada.\n\n-   Cifre todos los datos en tr\xE1nsito con protocolos\
          \ seguros como TLS con cifradores de confidencialidad adelantada (forward\
          \ secrecy, o FS), priorizaci\xF3n de cifradores por parte del servidor y\
          \ par\xE1metros seguros. Aplique el cifrado mediante directivas como HTTP\
          \ Strict Transport Security (HSTS).\n\n-   Deshabilite el almacenamiento\
          \ en cach\xE9 para respuestas que contengan datos sensibles.\n\n-   Aplique\
          \ los controles de seguridad requeridos seg\xFAn la clasificaci\xF3n de\
          \ los datos.\n\n-   No utilice protocolos antiguos como FTP y SMTP para\
          \ transportar datos sensibles.\n\n-   Almacene las contrase\xF1as utilizando\
          \ funciones robustas, flexibles, que utilicen sal en los hashes y use un\
          \ factor de retraso (factor de trabajo), como Argon2, scrypt, bcrypt o PBKDF2.\n\
          \n-   Elija vectores de inicializaci\xF3n apropiados para el modo de operaci\xF3\
          n. Para muchos modos, esto significa usar un CSPRNG (generador de n\xFA\
          meros pseudoaleatorios criptogr\xE1ficamente seguro).  Para los modos que\
          \ requieren un nonce, el vector de inicializaci\xF3n (IV) no necesita un\
          \ CSPRNG.  En todos los casos, el IV nunca debe usarse dos veces para una\
          \ clave fija.\n\n-   Utilice siempre cifrado autenticado en lugar de solo\
          \ cifrado.\n\n-   Las claves deben generarse criptogr\xE1ficamente al azar\
          \ y almacenarse en la memoria como arrays de bytes. Si se utiliza una contrase\xF1\
          a, debe convertirse en una clave mediante una funci\xF3n adecuada de derivaci\xF3\
          n de claves basada en contrase\xF1a.\n\n-   Aseg\xFArese de que se utilice\
          \ la aleatoriedad criptogr\xE1fica cuando sea apropiado y que no se utilice\
          \ una semilla de una manera predecible o con baja entrop\xEDa.\n    La mayor\xED\
          a de las API modernas no requieren que el desarrollador genere el CSPRNG\
          \ para obtener seguridad.\n\n-   Evite las funciones criptogr\xE1ficas y\
          \ los esquemas de relleno(padding) en desuso, como MD5, SHA1, PKCS n\xFA\
          mero 1 v1.5.\n\n-   Verifique de forma independiente la efectividad de la\
          \ configuraci\xF3n y los ajustes.\n\n\n## Example attack scenarios\n\n**Escenario\
          \ #1**: Una aplicaci\xF3n cifra los n\xFAmeros de tarjetas de cr\xE9dito\
          \ en una base de datos mediante el cifrado autom\xE1tico de la base de datos.\
          \ Sin embargo, estos datos se descifran autom\xE1ticamente cuando se recuperan,\
          \ lo que permite que por una falla de inyecci\xF3n SQL se recuperen n\xFA\
          meros de tarjetas de cr\xE9dito en texto sin cifrar.\n\n**Escenario #2**:\
          \ Un sitio no utiliza ni aplica TLS para todas sus p\xE1ginas o admite un\
          \ cifrado d\xE9bil. Un atacante monitorea el tr\xE1fico de la red (por ejemplo,\
          \ en una red inal\xE1mbrica insegura), degrada las conexiones de HTTPS a\
          \ HTTP, intercepta solicitudes y roba la cookie de sesi\xF3n del usuario.\
          \ El atacante luego reutiliza esta cookie y secuestra la sesi\xF3n (autenticada)\
          \ del usuario, accediendo o modificando los datos privados del usuario.\
          \ En lugar de lo anterior, podr\xEDan alterar todos los datos transportados,\
          \ por ejemplo, el destinatario de una transferencia de dinero.\n\n**Escenario\
          \ #3**: La base de datos de contrase\xF1as utiliza hashes simples o sin\
          \ un valor inicial aleatorio \xFAnico(salt) para almacenar todas las contrase\xF1\
          as. Una falla en la carga de archivos permite a un atacante recuperar la\
          \ base de datos de contrase\xF1as. Todos los hashes sin salt se pueden calcular\
          \ a partir de una rainbow table de hashes pre calculados. Los hash generados\
          \ por funciones hash simples o r\xE1pidas pueden ser descifrados a trav\xE9\
          s de c\xE1lculos intensivos provistos por una o mas GPUs, incluso si utilizan\
          \ un salt.\n\n\nPara obtener m\xE1s informaci\xF3n sobre las referencias\
          \ y la lista de CWE asociadas: https://top10.owasp.org/2021/es/A02_2021-Cryptographic_Failures/"
      fr:
        name: "D\xE9faillances cryptographiques"
        description: "D\xE9terminer d\u2019abord quelles donn\xE9es doivent b\xE9\
          n\xE9ficier d\u2019une protection chiffr\xE9e (mots de passe, donn\xE9es\
          \ patients, num\xE9ros de cartes, donn\xE9es personnelles, etc.), lors de\
          \ leur transfert ou leur stockage. Pour chacune de ces donn\xE9es :\n\n\
          - Les donn\xE9es circulent-elles en clair ? Ceci concerne les protocoles\
          \ tels que HTTP, SMTP et FTP. Le trafic externe sur internet est particuli\xE8\
          rement dangereux. V\xE9rifiez tout le r\xE9seau interne, par exemple entre\
          \ les \xE9quilibreurs de charge, les serveurs Web ou les syst\xE8mes backend.\n\
          - Des algorithmes faibles ou d\xE9suets sont-ils utilis\xE9s, soit par d\xE9\
          faut, soit dans le code source existant ?\n- Est-ce que des clefs de chiffrement\
          \ par d\xE9faut sont utilis\xE9es ? Des clefs de chiffrement faibles sont-elles\
          \ g\xE9n\xE9r\xE9es ou r\xE9utilis\xE9es ? Leur gestion et rotation sont-elles\
          \ prises en charge ? Est-ce que des cl\xE9s sont pr\xE9sentes dans l'outil\
          \ de versionnement de code source ?\n- Les r\xE9ponses transmises au navigateur\
          \ incluent-elles les directives/en-t\xEAtes de s\xE9curit\xE9 ad\xE9quats\
          \ ?\n- Est-ce que le certificat serveur re\xE7u et la cha\xEEne de confiance\
          \ sont correctement valid\xE9s ?\n- Est-ce que les vecteurs d'initialisation\
          \ sont ignor\xE9s, r\xE9utilis\xE9s ou g\xE9n\xE9r\xE9s avec une s\xE9curit\xE9\
          \ insuffisante pour le mode d'op\xE9ration cryptographique ?\n- Est-ce que\
          \ les mots de passe sont utilis\xE9s sans fonction de d\xE9rivation de cl\xE9\
          \ ?\n- Est-ce que la fonction de g\xE9n\xE9ration al\xE9atoire utilis\xE9\
          e a \xE9t\xE9 con\xE7ue pour r\xE9pondre aux exigences cryptographiques\
          \ ? M\xEAme si la bonne fonction est utilis\xE9e, est-ce que la graine al\xE9\
          atoire doit \xEAtre fournie par le d\xE9veloppeur, et sinon, le d\xE9veloppeur\
          \ a-t-il r\xE9\xE9crit la fonction robuste embarqu\xE9e de g\xE9n\xE9ration\
          \ de graine par une graine al\xE9atoire qui manque d'entropie ou d'impr\xE9\
          visibilit\xE9 ?\n- Est-ce que des fonctions de hachage d\xE9pr\xE9ci\xE9\
          es telles que MD5 ou SHA1 sont utilis\xE9es ou est-ce que des fonctions\
          \ de hachage non cryptographiques sont utilis\xE9es l\xE0 o\xF9 des fonctions\
          \ de hachage cryptographiques sont n\xE9cessaires ?\n- Est-ce que des m\xE9\
          thodes cryptographiques de remplissage d\xE9pr\xE9ci\xE9es, comme PKCS 1\
          \ v1.5 sont utilis\xE9es ?\n- Est-ce que des messages d'erreurs cryptographiques\
          \ ou des informations par canal auxiliaire sont exploitables, par exemple\
          \ sous la forme d'attaque par oracle de remplissage ?\n\nSe r\xE9f\xE9rer\
          \ \xE0 l'*ASVS* *Crypto* (V7), *Data Protection* (V9), et *SSL/TLS* (V10)."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       29       |       46,44 %        |         4,49 %         |     \
          \        7,29              |         6,81         |    79,33 %     |   \
          \   34,85 %       |          233 788           |        3 075         |\n\
          \n\n## How to prevent\n\nOn veillera au minimum \xE0 suivre les recommandations\
          \ suivantes, mais il reste n\xE9cessaire de consulter les r\xE9f\xE9rences.\n\
          \n- Classifier les donn\xE9es trait\xE9es, stock\xE9es ou transmises par\
          \ l'application. Identifier quelles donn\xE9es sont sensibles selon les\
          \ lois concernant la protection de la vie priv\xE9e, les exigences r\xE9\
          glementaires ou les besoins m\xE9tier.\n- Ne pas stocker de donn\xE9es sensibles\
          \ sans que cela ne soit n\xE9cessaire. Les rejeter ou utiliser une tokenisation\
          \ conforme \xE0 la norme de s\xE9curit\xE9 de l\u2019industrie des cartes\
          \ de paiement (PCI DSS) ou m\xEAme une troncature. Les donn\xE9es que l\u2019\
          on ne poss\xE8de pas ne peuvent \xEAtre vol\xE9es.\n- S'assurer de chiffrer\
          \ toutes les donn\xE9es sensibles au repos.\n- Choisir des algorithmes \xE9\
          prouv\xE9s et g\xE9n\xE9rer des cl\xE9s robustes. S'assurer qu'une gestion\
          \ des cl\xE9s est en place.\n- Chiffrer toutes les donn\xE9es transmises\
          \ avec des protocoles s\xE9curis\xE9s tels que TLS avec des chiffres \xE0\
          \ confidentialit\xE9 persistante (forward secrecy - FS). Chiffrer en priorit\xE9\
          \ sur le serveur. Utiliser des param\xE8tres s\xE9curis\xE9s. Forcer le\
          \ chiffrement en utilisant des directives comme HTTP Strict Transport Security\
          \ (HSTS).\n- D\xE9sactiver le cache pour les r\xE9ponses contenant des donn\xE9\
          es sensibles.\n- Appliquer les contr\xF4les de s\xE9curit\xE9 requis selon\
          \ la classification de la donn\xE9e.\n- Ne pas utiliser de vieux protocoles\
          \ tels que FTP et SMTP pour \xE9changer des donn\xE9es sensibles.\n- Stocker\
          \ les mots de passe en utilisant des fonctions de hachage avec salage et\
          \ facteur de travail (facteur de d\xE9lai), telles que Argon2, scrypt, bcrypt\
          \ ou PBKDF2.\n- Les vecteurs d'initialisation doivent \xEAtre choisis de\
          \ fa\xE7on appropri\xE9e au mode d'op\xE9ration. Pour la plupart des modes,\
          \ cela signifie utiliser un g\xE9n\xE9rateur de nombres pseudo-al\xE9atoires\
          \ cryptographiquement s\xE9curis\xE9 (CSPRNG en anglais). Pour les modes\
          \ requ\xE9rant un nonce, alors le vecteur d'initialisation (VI) ne n\xE9\
          cessite pas un CSPRNG. Dans tous les cas, un vecteur d'initialisation ne\
          \ devrait pas \xEAtre utilis\xE9 deux fois pour une cl\xE9 fixe.\n- Utiliser\
          \ toujours un chiffrement authentifi\xE9 plut\xF4t qu'un chiffrement simple\n\
          - Les cl\xE9s devraient toujours \xEAtre g\xE9n\xE9r\xE9es de fa\xE7on cryptographiquement\
          \ al\xE9atoire et stock\xE9es en m\xE9moire sous la forme de tableau d'octets.\
          \ Si un mot de passe est utilis\xE9e, alors il faut obligatoirement le transformer\
          \ en cl\xE9 via une fonction de d\xE9rivation de cl\xE9 appropri\xE9e.\n\
          - S'assurer qu'une g\xE9n\xE9ration cryptographiquement al\xE9atoire est\
          \ utilis\xE9e l\xE0 o\xF9 c'est appropri\xE9, et qu'elle n'a pas une graine\
          \ al\xE9atoire pr\xE9visible ou avec une faible entropie. La plupart des\
          \ APIs modernes ne demandent pas au d\xE9veloppeur de fournir une graine\
          \ au CSPRNG pour \xEAtre s\xE9curis\xE9.\n- Ne pas utiliser de fonctions\
          \ cryptographiques et de m\xE9thodes de remplissage d\xE9pr\xE9ci\xE9es\
          \ telles que MD5, SHA1, PKCS 1 v1.5.\n- V\xE9rifier ind\xE9pendamment l'efficacit\xE9\
          \ de la configuration et des param\xE8tres.\n\n\n## Example attack scenarios\n\
          \n**Sc\xE9nario 1** : Une application chiffre des num\xE9ros de cartes de\
          \ cr\xE9dit dans une base de donn\xE9es utilisant un chiffrement en base\
          \ automatique. Cependant, ces donn\xE9es sont automatiquement d\xE9chiffr\xE9\
          es lorsqu'elles sont r\xE9cup\xE9r\xE9es, permettant, \xE0 une injection\
          \ SQL de r\xE9cup\xE9rer des num\xE9ros de carte de cr\xE9dit en clair.\n\
          \n**Sc\xE9nario 2** : Un site n'utilise pas ou ne force pas l'utilisation\
          \ de TLS sur toutes les pages ou supporte des protocoles de chiffrement\
          \ faibles. Un attaquant surveille le trafic r\xE9seau (par exemple sur un\
          \ r\xE9seau sans fil non s\xE9curis\xE9), d\xE9grade les connexions de HTTPS\
          \ \xE0 HTTP, intercepte les requ\xEAtes et vole le cookie de session d'un\
          \ utilisateur. L'attaquant r\xE9utilise alors ce cookie et d\xE9tourne la\
          \ session de l'utilisateur (authentifi\xE9), pouvant ainsi acc\xE9der aux\
          \ donn\xE9es priv\xE9es de l'utilisateur ou les modifier. Un attaquant pourrait\
          \ \xE9galement modifier toutes les donn\xE9es en transit, par exemple le\
          \ destinataire d'un virement d'argent.\n\n**Sc\xE9nario 3** : La base de\
          \ donn\xE9es contenant les mots de passe n'utilise pas de sel, ou alors\
          \ de simples hach\xE9s pour stocker les mots de passe de chacun. Une faille\
          \ d'upload de fichier permet \xE0 un attaquant de r\xE9cup\xE9rer la base\
          \ de donn\xE9es de mots de passe. Tous les hach\xE9s non sal\xE9s peuvent\
          \ alors \xEAtre r\xE9v\xE9l\xE9s avec une rainbow table de hach\xE9s pr\xE9\
          -calcul\xE9s. Des hach\xE9s g\xE9n\xE9r\xE9s par des fonctions de hachage\
          \ simples ou rapides peuvent \xEAtre d\xE9chiffr\xE9s par des GPUs, m\xEA\
          me sal\xE9s.\n\n\nPour plus d\u2019informations sur les r\xE9f\xE9rences\
          \ et la liste des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A02_2021-Cryptographic_Failures/"
      id:
        name: Kegagalan Kriptografi
        description: "Hal pertama adalah menentukan kebutuhan perlindungan data dalam\
          \ perjalanan\ndan pada saat istirahat. Misalnya, kata sandi, nomor kartu\
          \ kredit, catatan \nkesehatan, informasi pribadi, dan rahasia bisnis yang\
          \ memerlukan ekstra\nperlindungan, terutama jika data tersebut termasuk\
          \ dalam undang-undang privasi, \nmisalnya, General Data Protection Regulation\
          \ (GDPR) Uni Eropa, atau peraturan, \nmisalnya, perlindungan data keuangan\
          \ seperti PCI Data Security Standard (PCI DSS).\nUntuk semua data tersebut:\n\
          \n-   Apakah ada data yang dikirimkan dalam bentuk teks yang jelas? \n \
          \   ini menyangkut protokol seperti  HTTP, SMTP, and FTP. Lalu lintas internet\
          \ \n    luar yang berbahaya. Verifikasi semua lalu lintas yang ada di internal,\n\
          \    misalnya antara penyeimbang beban, server web, atau sistem back-end.\n\
          \n-   Apakah ada algoritma kriptografi lama atau lemah yang digunakan baik\
          \ secara\n    default atau dalam kode yang lebih lama?\n\n-   Apakah kunci\
          \ kripto bawaan sedang digunakan, \n    kunci kripto yang lemah dihasilkan\
          \ atau digunakan kembali, \n    atau apakah kurangnya manajemen atau rotasi\
          \ kunci yang tepat?\n\n-   Apakah enkripsi tidak diterapkan, misalnya, apakah\
          \ ada agen pengguna (browser) \n    yang arahan atau header keamanan hilang?\n\
          \n-   Apakah agen pengguna (misalnya, aplikasi, klien email) tidak memverifikasi\
          \ jika\n    sertifikat yang diterima server valid?\n\nLihat ASVS Crypto\
          \ (V7), Data Protection (V9), dan SSL/TLS (V10)"
        annotation: "## Score table\n\n| Klasifikasi CWE | Tingkat Kejadian Maksimum\
          \ | Rata-rata Tingkat kejadian | Cakupan Maksimum | Rata-rata Cakupan |\
          \ Rata-rata Bobot Eksploitasi | Rata-rata Bobot Dampak | Total Kejadian\
          \ | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 29          | 46.44%             | 4.49%              | 79.33%       |\
          \ 34.85%       | 7.29                 | 6.81                | 233,788  \
          \         | 3,075      |\n\n\n## How to prevent\n\nLakukan minimal hal berikut,\
          \ dan lihat referensi: \n\n-   Mengklasifikasikan data yang diproses, disimpan,\
          \ atau dikirim oleh aplikasi.\n    Identifikasi data mana yang sensitif\
          \ menurut undang-undang privasi,\n    persyaratan peraturan, atau kebutuhan\
          \ bisnis.\n\n-   Tetapkan kontrol sesuai klasifikasi.\n\n-   Jangan menyimpan\
          \ data sensitif yang tidak perlu. Buang sesegera\n    mungkin atau gunakan\
          \ tokenisasi yang sesuai dengan PCI DSS atau bahkan pemotongan.\n    Data\
          \ yang tidak disimpan tidak dapat dicuri.\n\n-   Pastikan untuk mengenkripsi\
          \ semua data sensitif saat istirahat.\n\n-   Pastikan gunakan standar algoritma,\
          \ protokol yang mutakhir dan kuat, serta \n    kunci berada pada tempatnya;\
          \ menggunakan manajemen kunci yang tepat.\n\n-   Enkripsi semua data dalam\
          \ perjalanan dengan protokol aman seperti TLS dengan\n    cipher perfect\
          \ forward secrecy (PFS), prioritas cipher oleh\n    server, dan parameter\
          \ yang aman. Terapkan enkripsi menggunakan arahan\n    seperti HTTP Strict\
          \ Transport Security (HSTS).\n\n-   Menonaktifkan caching untuk respons\
          \ yang berisi data sensitif.\n\n-   Simpan kata sandi menggunakan fungsi\
          \ hashing adaptif dan salted yang kuat\n    dengan faktor kerja (faktor\
          \ penundaan), seperti Argon2, scrypt, bcrypt, atau\n    PBKDF2.\n\n-   Verifikasi\
          \ secara independen efektivitas konfigurasi dan pengaturan.\n\n\n## Example\
          \ attack scenarios\n\n**Skenario #1**: Aplikasi mengenkripsi nomor kartu\
          \ kredit dalam\ndatabase menggunakan enkripsi database otomatis. Namun,\
          \ data ini\nsecara otomatis didekripsi ketika diambil, memungkinkan cacat\
          \ injeksi SQL untuk\nmengambil nomor kartu kredit dalam teks polos.\n\n\
          **Skenario #2**: Situs tidak menggunakan atau menerapkan TLS untuk semua\
          \ halaman atau\nmendukung enkripsi yang lemah. Penyerang memantau lalu lintas\
          \ jaringan (misalnya, di\njaringan nirkabel yang tidak aman), menurunkan\
          \ versi koneksi dari HTTPS ke\nHTTP, memotong permintaan, dan mencuri cookie\
          \ sesi pengguna.\nPenyerang kemudian replay cookie ini dan membajak pengguna\
          \ sesi (dikonfirmasi), mengakses \natau memodifikasi data pribadi pengguna.\
          \ Alih-alih di atas, \nmereka dapat mengubah semua data yang diangkut, misalnya,\
          \ penerima\nmentransfer uang.\n\n**Skenario #3**: Kata sandi pada database\
          \ menggunakan hash tanpa salt atau sederhana untuk\nmenyimpan kata sandi\
          \ semua orang. Cacat unggah file memungkinkan penyerang untuk\nmengambil\
          \ basis data kata sandi. Semua unsalted hashes dapat diekspos\ndengan tabel\
          \ pelangi dari hash yang telah dihitung sebelumnya. Hash yang dihasilkan\
          \ oleh\nfungsi hash sederhana atau cepat dapat dipecahkan oleh GPU, meskipun\
          \ telah\ndi-salt.\n\n\nUntuk informasi lebih lanjut tentang referensi dan\
          \ daftar CWE yang dipetakan: https://top10.owasp.org/2021/id/A02_2021-Cryptographic_Failures/"
      it:
        name: Cryptographic Failures
        description: "Il primo passo \xE8 determinare le esigenze di protezione dei\
          \ dati in transito\ne a riposo. Per esempio, password, numeri di carte di\
          \ credito, documenti\nsanitari, informazioni personali e segreti aziendali\
          \ richiedono una\nprotezione adeguata, soprattutto se quei dati ricadono\
          \ sotto le leggi sulla privacy, ad es.\nGeneral Data Protection Regulation\
          \ (GDPR), o regolamenti, ad es,\nprotezione dei dati finanziari come il\
          \ PCI Data Security Standard (PCI DSS).\nPer tutti questi dati:\n\n-   I\
          \ dati sono trasmessi in chiaro? Questo riguarda protocolli come\n    come\
          \ HTTP, SMTP, FTP che utilizzano anche aggiornamenti TLS come STARTTLS.\
          \ \n    Il traffico internet esterno \xE8 pericoloso. Verificare tutto il\
          \ traffico interno, ad es, \n    tra load balancer, server web o sistemi\
          \ back-end.\n\n-   Ci sono algoritmi o protocolli crittografici vecchi o\
          \ deboli utilizzati \n    di default o nel codice pi\xF9 vecchio?\n\n- \
          \  Sono utilizzate chiavi crittografiche predefinite, chiavi crittografiche\
          \ deboli generate o\n    riutilizzate, o manca un'adeguata gestione o rotazione\
          \ delle chiavi?\n    Le chiavi crittografiche sono nei repository del codice\
          \ sorgente?\n\n-   La crittografia non \xE8 applicata, ad esempio, ci sono\
          \ header HTTP (browser)\n    direttive di sicurezza o altri header mancanti?\n\
          \n-   Il certificato ricevuto dal server e la chain of trust sono validati\
          \ correttamente? \n\n-   I vettori di inizializzazione sono ignorati, riutilizzati\
          \ o non generati in modo\n    sufficientemente sicuro per il funzionamento\
          \ di una certa modalit\xE0 crittografica?\n    \xC8 in uso una modalit\xE0\
          \ crittografica insicura come l'ECB? Viene utilizzata la semplice crittografia\n\
          \    quando \xE8 invece necessario abbinarla anche ad un meccanismo di autenticazione?\n\
          \n-   Le password vengono usate come chiavi crittografiche senza l'utilizzo\
          \ di una\n    funzione di derivazione della chiave basata sulla password?\n\
          \n-   Viene utilizzata una funzione di randomness che non \xE8 stata progettata\n\
          \    per soddisfare i requisiti crittografici? Anche se viene utilizzata\
          \ la funzione appropriata, \n    il seed deve essere inizializzato dallo\
          \ sviluppatore, e se no,\n    lo sviluppatore ha sovrascritto la funzionalit\xE0\
          \ di seed forte incorporata\n    con una che manca di sufficiente entropia/imprevedibilit\xE0\
          ?\n\n-   Vengono utilizzate funzioni hash deprecate come MD5 o SHA1, o vengono\
          \ utilizzate\n    funzioni hash non crittografiche quando sono necessarie\
          \ funzioni hash crittografiche?\n\n-   Sono utilizzati metodi deprecati\
          \ di padding crittografico come PKCS#1 v1.5?\n\n-   I messaggi di errore\
          \ crittografici o le informazioni ottenute da un side channel sono\n   \
          \ sfruttabili, per esempio per svolgere attacchi padding oracle?\n\nVedi\
          \ ASVS Crypto (V7), Data Protection (V9), e SSL/TLS (V10)"
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 29          | 46.44%             | 4.49%              |7.29          \
          \       | 6.81                |  79.33%       | 34.85%       | 233,788 \
          \          | 3,075      |\n\n\n## How to prevent\n\nFare quanto segue, come\
          \ minimo, e consultare i riferimenti in calce:\n\n-   Classificare i dati\
          \ elaborati, memorizzati o trasmessi da un'applicazione.\n    Identificare\
          \ quali dati sono sensibili secondo le leggi sulla privacy,\n    requisiti\
          \ normativi o esigenze aziendali.\n\n-   Non conservare inutilmente i dati\
          \ sensibili. Eliminarli il prima possibile\n    o utilizzare un meccanismo\
          \ di tokenizzazione conforme a PCI DSS o anche il troncamento.\n    I dati\
          \ che non vengono conservati non possono essere rubati.\n\n-   Assicurarsi\
          \ di cifrare tutti i dati sensibili a riposo.\n\n-   Utilizzare algoritmi,\
          \ protocolli e chiavi standard forti e aggiornati.\n    Avere un adeguato\
          \ processo di key management.\n\n-   Crittografare tutti i dati in transito\
          \ con protocolli sicuri come TLS con\n    cifrari che garantiscano la FS\
          \ (forward secrecy), prioritizzazione dei cifrari da parte del\n    server\
          \ e parametri sicuri. Applicare la crittografia usando direttive\n    come\
          \ HTTP Strict Transport Security (HSTS).\n\n-   Disabilitare il caching\
          \ per le risposte che contengono dati sensibili.\n\n-   Applicare i controlli\
          \ di sicurezza adeguati secondo la classificazione dei dati.\n\n-   Non\
          \ usare protocolli legacy come FTP e SMTP per il trasporto di\n    dati\
          \ sensibili.\n\n-   Memorizzare le password usando forti funzioni di hashing\
          \ adattive con salt\n    con un work factor (delay factor), come Argon2,\
          \ scrypt, bcrypt o\n    PBKDF2.\n\n-   I vettori di inizializzazione devono\
          \ essere scelti in modo appropriato per il modo di\n    funzionamento. \
          \ Per molti modi di funzionamento, questo significa usare un CSPRNG (cryptographically\n\
          \    secure pseudo random number generator).  Per quelli che richiedono\
          \ un\n    nonce, allora il vettore di inizializzazione (IV) non ha bisogno\
          \ di un CSPRNG.  In tutti i casi, l'IV\n    non dovrebbe mai essere usato\
          \ due volte per una stessa chiave.\n\n-   Usare sempre un meccanismo di\
          \ crittografia autenticata invece della semplice crittografia.\n\n-   Le\
          \ chiavi dovrebbero essere generate crittograficamente in modo casuale e\
          \ memorizzate in\n    memoria come array di byte. Se viene usata una password,\
          \ questa deve essere convertita\n    in una chiave tramite un'appropriata\
          \ funzione di derivazione della chiave basata sulla password.\n\n-   Assicuratevi\
          \ che la randomness crittografica venga utilizzata laddove appropriato,\
          \ e\n    che non sia stato utilizzato un seed prevedibile o con bassa entropia.\n\
          \    La maggior parte delle API moderne non richiedono allo sviluppatore\
          \ di inizializzare il seed della CSPRNG.\n\n-   Evitare funzioni crittografiche\
          \ e schemi di padding deprecati, come\n    MD5, SHA1, PKCS#1 v1.5 \n\n-\
          \   Verificare in modo indipendente l'efficacia della configurazione e delle\n\
          \    impostazioni.\n\n\n## Example attack scenarios\n\n**Scenario #1**:\
          \ Un'applicazione cifra i numeri delle carte di credito in un\ndatabase\
          \ usando la crittografia automatica del database. Tuttavia, questi dati\
          \ sono\nautomaticamente decriptati quando vengono recuperati, permettendo\
          \ ad una falla di SQL injection di\nrecuperare i numeri delle carte di credito\
          \ in chiaro.\n\n**Scenario #2**: Un sito non usa o applica TLS per tutte\
          \ le pagine o\nsupporta una crittografia debole. Un aggressore monitora\
          \ il traffico di rete (ad es.\nuna rete wireless insicura), svolge il downgrade\
          \ della connessione da HTTPS a\nHTTP, intercetta le richieste e ruba il\
          \ cookie di sessione dell'utente. \nL'attaccante riproduce questo cookie\
          \ e dirotta la sessione dell'utente (autenticato)\naccedendo o modificando\
          \ i dati privati dell'utente. \nOppure potrebbe alterare tutti i dati in\
          \ transito, ad esempio, modificando il destinatario di un\ntrasferimento\
          \ di denaro.\n\n**Scenario #3**: Il database delle password usa hash semplici\
          \ o senza salt per\nmemorizzare le password di tutti gli utenti. Una falla\
          \ nel caricamento dei file permette ad un attaccante di\nrecuperare il database\
          \ delle password. Tutti gli hash senza salt possono essere violati\ncon\
          \ una rainbow table di hash precalcolati. Gli hash generati da\nfunzioni\
          \ hash semplici o veloci possono essere decifrati dalle GPU, anche se in\
          \ presenza di salt.\n\n\nPer maggiori informazioni sui riferimenti e sull'elenco\
          \ delle CWE mappate: https://top10.owasp.org/2021/it/A02_2021-Cryptographic_Failures/"
