        description: "\u064A\u064F\u0639\u062F \u062A\u0623\u0643\u064A\u062F \u0647\
          \u0648\u064A\u0629 \u0627\u0644\u0645\u0633\u062A\u062E\u062F\u0645 \u0648\
          \u0627\u0644\u0645\u0635\u0627\u062F\u0642\u0629 \u0648\u0625\u062F\u0627\
          \u0631\u0629 \u0627\u0644\u062C\u0644\u0633\u0629 \u0623\u0645\u0631\u064B\
          \u0627 \u0628\u0627\u0644\u063A \u0627\u0644\u0623\u0647\u0645\u064A\u0629\
          \ \u0648\u0630\u0644\u0643 \u0644\u0644\u062D\u0645\u0627\u064A\u0629 \u0645\
          \u0646 \u0627\u0644\u0647\u062C\u0645\u0627\u062A \u0627\u0644\u0645\u062A\
          \u0639\u0644\u0642\u0629 \u0628\u0627\u0644\u0645\u0635\u0627\u062F\u0642\
          \u0629. \u0642\u062F \u064A\u0643\u0648\u0646 \u0647\u0646\u0627\u0643 \u0636\
          \u0639\u0641 \u0641\u064A \u0627\u0644\u0645\u0635\u0627\u062F\u0642\u0629\
          \ \u0625\u0630\u0627 \u0643\u0627\u0646 \u0627\u0644\u062A\u0637\u0628\u064A\
          \u0642:\n\n-   \u064A\u0633\u0645\u062D \u0628\u0627\u0644\u0647\u062C\u0645\
          \u0627\u062A \u0627\u0644\u0622\u0644\u064A\u0629 \u0645\u062B\u0644 \u0647\
          \u062C\u0645\u0627\u062A \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\
          \u0627\u0639\u062A\u0645\u0627\u062F (Credential Stuffing)\u060C \u062D\u064A\
          \u062B \u064A\u0643\u0648\u0646 \u0644\u062F\u0649 \u0627\u0644\u0645\u0647\
          \u0627\u062C\u0645 \u0642\u0627\u0626\u0645\u0629 \u0628\u0623\u0633\u0645\
          \u0627\u0621 \u0627\u0644\u0645\u0633\u062A\u062E\u062F\u0645\u064A\u0646\
          \ \u0648\u0643\u0644\u0645\u0627\u062A \u0627\u0644\u0645\u0631\u0648\u0631\
          .\n\n-   \u064A\u0633\u0645\u062D \u0628\u0627\u0633\u062A\u063A\u0644\u0627\
          \u0644 \u0647\u062C\u0648\u0645 \u0643\u0633\u0631 \u0643\u0644\u0645\u0627\
          \u062A \u0627\u0644\u0645\u0631\u0648\u0631 (Brute Force) \u0623\u0648 \u0627\
          \u0644\u0647\u062C\u0645\u0627\u062A \u0627\u0644\u0622\u0644\u064A\u0629\
          \ \u0627\u0644\u0623\u062E\u0631\u0649.  \n\n-   \u064A\u0633\u0645\u062D\
          \ \u0628\u0647\u062C\u0645\u0627\u062A \u0643\u0644\u0645\u0627\u062A \u0627\
          \u0644\u0645\u0631\u0648\u0631 \u0627\u0644\u0627\u0641\u062A\u0631\u0627\
          \u0636\u064A\u0629 \u0623\u0648 \u0627\u0644\u0636\u0639\u064A\u0641\u0629\
          \ \u0623\u0648 \u0627\u0644\u0645\u0639\u0631\u0648\u0641\u0629 \u060C \u0645\
          \u062B\u0644 \"Password1\" \u0623\u0648 \" Admin / Admin\".\n\n-   \u064A\
          \u0633\u062A\u062E\u062F\u0645 \u0639\u0648\u0627\u0645\u0644 \u0636\u0639\
          \u064A\u0641\u0629 \u0648\u063A\u064A\u0631 \u0641\u0639\u0651\u0627\u0644\
          \u0629 \u0644\u0627\u0633\u062A\u0639\u0627\u062F\u0629 \u0643\u0644\u0645\
          \u0627\u062A \u0627\u0644\u0645\u0631\u0648\u0631 \u0648\u0627\u0633\u062A\
          \u0631\u062C\u0627\u0639 \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\
          \u0627\u0639\u062A\u0645\u0627\u062F \u0648\u0627\u0644\u062A\u064A \u064A\
          \u062C\u0639\u0644\u0647\u0627 \u0622\u0645\u0646\u0629\u060C \u0645\u062B\
          \u0644 \"\u0627\u0644\u0623\u062C\u0648\u0628\u0629 \u0627\u0644\u0645\u0633\
          \u062A\u0646\u062F\u0650\u0629 \u0639\u0644\u0649 \u0627\u0644\u0645\u0639\
          \u0631\u0641\u0629\".\n\n-   \u064A\u0633\u062A\u062E\u062F\u0645 \u0643\
          \u0644\u0645\u0627\u062A \u0645\u0631\u0648\u0631 \u063A\u064A\u0631 \u0645\
          \u0634\u0641\u0651\u0631\u0629\u060C \u0623\u0648 \u0645\u0634\u0641\u0651\
          \u0631\u0629 \u0628\u0634\u0643\u0644 \u0645\u064F\u062C\u0632\u0651\u0623\
          \ \u0623\u0648 \u0628\u0634\u0643\u0644 \u0636\u0639\u064A\u0641 (\u0631\
          \u0627\u062C\u0639 A3:2017- \u0627\u0644\u0628\u064A\u0627\u0646\u0627\u062A\
          \ \u0627\u0644\u062D\u0633\u0627\u0633\u0629 \u0627\u0644\u063A\u064A\u0631\
          \ \u0645\u062D\u0645\u064A\u0651\u0629 \u0623\u0648 \u0627\u0644\u0645\u0643\
          \u0634\u0648\u0641\u0629).\n\n-   \u0639\u062F\u0645 \u062A\u0641\u0639\u064A\
          \u0644 \u0627\u0644\u062A\u062D\u0642\u0651\u0642 \u0627\u0644\u062B\u0646\
          \u0627\u0626\u064A \u0623\u0648 \u062A\u0643\u0648\u0646 \u063A\u064A\u0631\
          \ \u0641\u0639\u0651\u0627\u0644\u0629.\n\n-   \u064A\u0639\u0631\u0636\
          \ \u0645\u0639\u0631\u0651\u0641\u0627\u062A \u0627\u0644\u062C\u0644\u0633\
          \u0629 (Session IDs) \u0641\u064A \u0639\u0646\u0648\u0627\u0646 URL\n\n\
          -   \u0644\u0627 \u064A\u0642\u0648\u0645 \u0628\u0625\u0639\u0627\u062F\
          \u0629 \u0625\u0646\u0634\u0627\u0621 \u0645\u0639\u0631\u0651\u0641\u0627\
          \u062A \u0627\u0644\u062C\u0644\u0633\u0629 \u0628\u0639\u062F \u062A\u0633\
          \u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\u0644 \u0628\u0646\u062C\
          \u0627\u062D.\n\n-   \u0644\u0627 \u064A\u0646\u0647\u064A \u0645\u0639\u0631\
          \u0651\u0641\u0627\u062A \u0627\u0644\u062C\u0644\u0633\u0629 \u0628\u0634\
          \u0643\u0644 \u0635\u062D\u064A\u062D. \u0644\u0627 \u064A\u062A\u0645 \u0625\
          \u0646\u0647\u0627\u0621 \u062C\u0644\u0633\u0627\u062A \u0627\u0644\u0645\
          \u0633\u062A\u062E\u062F\u0645 \u0623\u0648 \u0631\u0645\u0648\u0632 \u0627\
          \u0644\u0645\u0635\u0627\u062F\u0642\u0629 (Authentication Tokens) \u0648\
          \u062E\u0627\u0635\u0629 \u0631\u0645\u0648\u0632 \u0627\u0644\u062F\u062E\
          \u0648\u0644 \u0627\u0644\u0645\u0648\u062D\u0651\u062F (SSO) \u0628\u0634\
          \u0643\u0644 \u0635\u062D\u064A\u062D \u062E\u0644\u0627\u0644 \u062A\u0633\
          \u062C\u064A\u0644 \u0627\u0644\u062E\u0631\u0648\u062C \u0623\u0648 \u0641\
          \u064A \u0641\u062A\u0631\u0629 \u0627\u0644\u062E\u0645\u0648\u0644."
        annotation: "## Score table\n\n| \u0631\u0628\u0637\u0647\u0627 \u0645\u0639\
