          \ \u0628\u0625\u0646\u0634\u0627\u0621 \u0645\u0639\u0631\u0651\u0641 \u062C\
          \u0644\u0633\u0629 \u0639\u0634\u0648\u0627\u0626\u064A\u0629 \u062C\u062F\
          \u064A\u062F\u0629 \u0645\u0639 (Entropy) \u0639\u0627\u0644\u064A\u0629\
          \ \u0628\u0639\u062F \u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\u062E\
          \u0648\u0644\u060C \u0645\u0639\u0631\u0651\u0641\u0627\u062A \u0627\u0644\
