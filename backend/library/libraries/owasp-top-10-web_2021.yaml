          \u751F\u6570 | CVE \u5408\u8A08\u4EF6\u6570 |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 1           | 2.72%              | 2.72%              | 8.28         \
          \        | 6.72                | 67.72%       | 67.72%       | 9,503   \
          \          | 385        |\n\n\n## How to prevent\n\n\u958B\u767A\u8005\u306F\
          \u4EE5\u4E0B\u306E\u591A\u5C64\u9632\u5FA1\u306E\u5236\u5FA1\u306E\u4E00\
          \u90E8\u306A\u3044\u3057\u5168\u3066\u3092\u5B9F\u88C5\u3059\u308B\u3053\
          \u3068\u306B\u3088\u308A\u3001SSRF\u3092\u9632\u3050\u3053\u3068\u304C\u3067\
          \u304D\u307E\u3059\u3002\n\n### **\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u5C64\
          \u304B\u3089**\n\n-   SSRF\u306E\u5F71\u97FF\u3092\u6E1B\u3089\u3059\u305F\
          \u3081\u306B\u3001\u30EA\u30E2\u30FC\u30C8\u306E\u30EA\u30BD\u30FC\u30B9\
          \u3078\u30A2\u30AF\u30BB\u30B9\u3059\u308B\u6A5F\u80FD\u3092\u5206\u96E2\
          \u3055\u308C\u305F\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u306B\u5207\u308A\
          \u51FA\u3057\u307E\u3059\u3002\n\n-   \u5FC5\u9808\u306E\u30A4\u30F3\u30C8\
          \u30E9\u30CD\u30C3\u30C8\u901A\u4FE1\u3092\u9664\u304D\u5168\u3066\u306E\
          \u901A\u4FE1\u3092\u30D6\u30ED\u30C3\u30AF\u3059\u308B\u3088\u3046\u3001\
          \u300C\u30C7\u30D5\u30A9\u30EB\u30C8\u62D2\u5426\u300D\u306E\u30D5\u30A1\
          \u30A4\u30A2\u30A6\u30A9\u30FC\u30EB\u30DD\u30EA\u30B7\u30FC\u307E\u305F\
          \u306F\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u30A2\u30AF\u30BB\u30B9\u5236\
          \u5FA1\u3092\u5F37\u5236\u3057\u307E\u3059\u3002<br/>\n    *\u30D2\u30F3\
          \u30C8:*<br>\n    ~ \u30A2\u30D7\u30EA\u30B1\u30FC\u30B7\u30E7\u30F3\u306B\
          \u5FDC\u3058\u3066\u3001\u30D5\u30A1\u30A4\u30A2\u30A6\u30A9\u30FC\u30EB\
          \u30EB\u30FC\u30EB\u306E\u6240\u6709\u6A29\u3068\u30E9\u30A4\u30D5\u30B5\
          \u30A4\u30AF\u30EB\u3092\u660E\u78BA\u5316\u3057\u307E\u3059\u3002<br/>\n\
          \    ~ \u30D5\u30A1\u30A4\u30A2\u30A6\u30A9\u30FC\u30EB\u306B\u304A\u3044\
          \u3066\u8A31\u53EF\u3055\u308C\u305F\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\
          \u30D5\u30ED\u30FC\u3001*\u305D\u3057\u3066*\u30D6\u30ED\u30C3\u30AF\u3055\
          \u308C\u305F\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u30D5\u30ED\u30FC\u3092\
          \u5168\u3066\u30ED\u30B0\u3068\u3057\u3066\u8A18\u9332\u3057\u307E\u3059\
          \n    ([A09:2021-\u30BB\u30AD\u30E5\u30EA\u30C6\u30A3\u30ED\u30B0\u3068\u30E2\
          \u30CB\u30BF\u30EA\u30F3\u30B0\u306E\u5931\u6557](A09_2021-Security_Logging_and_Monitoring_Failures.md)\u3092\
          \u53C2\u7167)\u3002\n\n### **\u30A2\u30D7\u30EA\u30B1\u30FC\u30B7\u30E7\u30F3\
          \u5C64\u304B\u3089:**\n\n-   \u30AF\u30E9\u30A4\u30A2\u30F3\u30C8\u304C\u63D0\
          \u4F9B\u3057\u305F\u5168\u3066\u306E\u5165\u529B\u30C7\u30FC\u30BF\u3092\
          \u30B5\u30CB\u30BF\u30A4\u30BA\u3057\u3001\u691C\u8A3C\u3057\u307E\u3059\
          \u3002\n\n-   \u660E\u78BA\u306A\u8A31\u53EF\u30EA\u30B9\u30C8\u7528\u3044\
          \u3066URL\u30B9\u30AD\u30FC\u30E0\u3001\u30DD\u30FC\u30C8\u3001\u5B9B\u5148\
          \u3092\u5F37\u5236\u3057\u307E\u3059\u3002\n\n-   \u751F\u306E\u30EC\u30B9\
          \u30DD\u30F3\u30B9\u3092\u30AF\u30E9\u30A4\u30A2\u30F3\u30C8\u306B\u9001\
          \u4FE1\u3057\u306A\u3044\u3088\u3046\u306B\u3057\u307E\u3059\u3002\n\n-\
          \   HTTP\u306E\u30EA\u30C0\u30A4\u30EC\u30AF\u30C8\u3092\u7121\u52B9\u5316\
          \u3057\u307E\u3059\u3002\n\n-   DNS\u30EA\u30D0\u30A4\u30F3\u30C7\u30A3\u30F3\
          \u30B0\u3084\"time of check, time of use\" (TOCTOU) \u7AF6\u5408\u72B6\u614B\
          \u3068\u3044\u3063\u305F\u653B\u6483\u3092\u9632\u3050\u305F\u3081\u306B\
          \u3001URL\u306E\u6574\u5408\u6027\u306B\u6CE8\u610F\u3057\u307E\u3059\u3002\
          \n\n\u62D2\u5426\u30EA\u30B9\u30C8\u3084\u6B63\u898F\u8868\u73FE\u3092\u7528\
          \u3044\u3066\u306ESSRF\u5BFE\u7B56\u3092\u5B9F\u88C5\u3057\u306A\u3044\u3067\
          \u304F\u3060\u3055\u3044\u3002\u653B\u6483\u8005\u306F\u62D2\u5426\u30EA\
          \u30B9\u30C8\u3092\u56DE\u907F\u3059\u308B\u305F\u3081\u306E\u30DA\u30A4\
          \u30ED\u30FC\u30C9\u306E\u30EA\u30B9\u30C8\u3001\u30C4\u30FC\u30EB\u3001\
          \u305D\u3057\u3066\u6280\u8853\u3092\u5099\u3048\u3066\u3044\u307E\u3059\
          \u3002\n\n### **\u691C\u8A0E\u3059\u3079\u304D\u8FFD\u52A0\u306E\u5BFE\u7B56\
          :**\n\n-   \u30D5\u30ED\u30F3\u30C8\u30B7\u30B9\u30C6\u30E0\u306B\u306F\u3001\
          \u4ED6\u306E\u30BB\u30AD\u30E5\u30EA\u30C6\u30A3\u95A2\u9023\u30B5\u30FC\
          \u30D3\u30B9\uFF08\u4F8B\uFF1AOpenID\uFF09\u3092\u30C7\u30D7\u30ED\u30A4\
          \uFF08\u914D\u5099\uFF09\u3057\u306A\u3044\u3067\u304F\u3060\u3055\u3044\
          \u3002\u307E\u305F\u3001\u3053\u308C\u3089\u306E\u30B7\u30B9\u30C6\u30E0\
          \u4E0A\u306E\u30ED\u30FC\u30AB\u30EB\u30C8\u30E9\u30D5\u30A3\u30C3\u30AF\
          \uFF08\u4F8B\uFF1Alocalhost\uFF09\u3082\u5236\u5FA1\u3057\u3066\u304F\u3060\
          \u3055\u3044\u3002\n\n-   \u30E6\u30FC\u30B6\u30FC\u30B0\u30EB\u30FC\u30D7\
          \u304C\u9650\u5B9A\u7684\u304B\u3064\u7BA1\u7406\u53EF\u80FD\u3067\u3042\
          \u308B\u30D5\u30ED\u30F3\u30C8\u30A8\u30F3\u30C9\u3067\u3001\u7279\u306B\
          \u9AD8\u3044\u30EC\u30D9\u30EB\u306E\u4FDD\u8B77\u304C\u6C42\u3081\u3089\
          \u308C\u308B\u5834\u5408\u306F\u3001\u72EC\u7ACB\u3057\u305F\u30B7\u30B9\
          \u30C6\u30E0\u4E0A\u3067\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u6697\u53F7\
          \u5316\uFF08\u4F8B\uFF1AVPN\uFF09\u3092\u4F7F\u7528\u3057\u3066\u304F\u3060\
          \u3055\u3044\u3002\n\n\n## Example attack scenarios\n\n\u653B\u6483\u8005\
          \u306F\u4EE5\u4E0B\u306E\u3088\u3046\u306A\u30B7\u30CA\u30EA\u30AA\u3067\
          \u3001Web\u30A2\u30D7\u30EA\u30B1\u30FC\u30B7\u30E7\u30F3\u30D5\u30A1\u30A4\
          \u30A2\u30A6\u30A9\u30FC\u30EB\u3084\u30D5\u30A1\u30A4\u30A2\u30A6\u30A9\
          \u30FC\u30EB\u3001\u3082\u3057\u304F\u306F\u30CD\u30C3\u30C8\u30EF\u30FC\
          \u30AFACL\u306B\u3088\u3063\u3066\u4FDD\u8B77\u3055\u308C\u305F\u30A2\u30D7\
          \u30EA\u30B1\u30FC\u30B7\u30E7\u30F3\u3092\u653B\u6483\u3059\u308B\u3053\
          \u3068\u304C\u3067\u304D\u307E\u3059:\n\n**\u30B7\u30CA\u30EA\u30AA #1:**\
          \ \u5185\u90E8\u30B5\u30FC\u30D0\u30FC\u3078\u306E\u30DD\u30FC\u30C8\u30B9\
          \u30AD\u30E3\u30F3 - \u30BB\u30B0\u30E1\u30F3\u30C8\u5316\u3055\u308C\u3066\
          \u3044\u306A\u3044\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u30A2\u30FC\u30AD\
          \u30C6\u30AF\u30C1\u30E3\u306E\u5834\u5408\u3001\u653B\u6483\u8005\u306F\
          \u5185\u90E8\u30CD\u30C3\u30C8\u30EF\u30FC\u30AF\u3092\u6A19\u7684\u3068\
          \u3057\u3066\u3001SSRF\u30DA\u30A4\u30ED\u30FC\u30C9\u306E\u63A5\u7D9A\u7D50\
          \u679C\u3082\u3057\u304F\u306F\u63A5\u7D9A\u3084\u62D2\u5426\u3055\u308C\
          \u308B\u307E\u3067\u306B\u304B\u304B\u3063\u305F\u6642\u9593\u3092\u3082\
          \u3068\u306B\u5185\u90E8\u30B5\u30FC\u30D0\u30FC\u306E\u30DD\u30FC\u30C8\
          \u304C\u30AA\u30FC\u30D7\u30F3\u304B\u30AF\u30ED\u30FC\u30BA\u304B\u3092\
          \u8ABF\u3079\u307E\u3059\u3002\n\n**\u30B7\u30CA\u30EA\u30AA #2:** \u6A5F\
          \u5FAE\u306A\u60C5\u5831\u306E\u9732\u51FA - \u653B\u6483\u8005\u306F\u6A5F\
          \u5FAE\u306A\u60C5\u5831\u3092\u53D6\u5F97\u3059\u308B\u305F\u3081\u306B\
          \u3001`file:///etc/passwd</span>` \u3084 `http://localhost:28017/` \u306E\
          \u3088\u3046\u306A\u30ED\u30FC\u30AB\u30EB\u30D5\u30A1\u30A4\u30EB\u307E\
          \u305F\u306F\u5185\u90E8\u30B5\u30FC\u30D0\u30FC\u306B\u30A2\u30AF\u30BB\
          \u30B9\u3057\u307E\u3059\u3002\n\n**\u30B7\u30CA\u30EA\u30AA #3:** \u30AF\
          \u30E9\u30A6\u30C9\u30B5\u30FC\u30D3\u30B9\u306E\u30E1\u30BF\u30C7\u30FC\
          \u30BF\u30B9\u30C8\u30EC\u30FC\u30B8\u3078\u306E\u30A2\u30AF\u30BB\u30B9\
          \ - \u591A\u304F\u306E\u30AF\u30E9\u30A6\u30C9\u30D7\u30ED\u30D0\u30A4\u30C0\
          \u306F `http://169.254.169.254/` \u306E\u3088\u3046\u306A\u30E1\u30BF\u30C7\
          \u30FC\u30BF\u30B9\u30C8\u30EC\u30FC\u30B8\u3092\u63D0\u4F9B\u3057\u3066\
          \u3044\u307E\u3059\u3002\u653B\u6483\u8005\u306F\u6A5F\u5FAE\u306A\u60C5\
          \u5831\u3092\u53D6\u5F97\u3059\u308B\u305F\u3081\u306B\u30E1\u30BF\u30C7\
          \u30FC\u30BF\u3092\u8AAD\u307F\u53D6\u308A\u307E\u3059\u3002\n\n**\u30B7\
          \u30CA\u30EA\u30AA #4:** \u5185\u90E8\u30B5\u30FC\u30D3\u30B9\u306E\u4E57\
          \u3063\u53D6\u308A - \u653B\u6483\u8005\u306F\u30EA\u30E2\u30FC\u30C8\u30B3\
          \u30FC\u30C9\u5B9F\u884C (RCE) \u3084\u30B5\u30FC\u30D3\u30B9\u62D2\u5426\
          \ (DoS) \u306E\u3088\u3046\u306A\u3055\u3089\u306A\u308B\u653B\u6483\u3092\
          \u884C\u3046\u305F\u3081\u306B\u5185\u90E8\u30B5\u30FC\u30D3\u30B9\u3092\
          \u60AA\u7528\u3057\u307E\u3059\u3002\n\n\n\u53C2\u8003\u8CC7\u6599\u304A\
          \u3088\u3073\u30DE\u30C3\u30D4\u30F3\u30B0\u3055\u308C\u305FCWE\u306E\u4E00\
          \u89A7\u306B\u3064\u3044\u3066\u3001\u8A73\u3057\u304F\u306F\u3053\u3061\
          \u3089\uFF1A https://top10.owasp.org/2021/ja/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      pt:
        name: "Falsifica\xE7\xE3o de Solicita\xE7\xE3o do Lado do Servidor (SSRF)"
        description: "As falhas de SSRF ocorrem sempre que um aplicativo da web busca\
          \ um recurso remoto sem validar a URL fornecida pelo usu\xE1rio. Ele permite\
          \ que um invasor force o aplicativo a enviar uma solicita\xE7\xE3o criada\
          \ para um destino inesperado, mesmo quando protegido por um firewall, VPN\
          \ ou outro tipo de lista de controle de acesso \xE0 rede (ACL).\n\nComo\
          \ os aplicativos da web modernos fornecem aos usu\xE1rios finais recursos\
          \ convenientes, buscar uma URL se torna um cen\xE1rio comum. Como resultado,\
          \ a incid\xEAncia de SSRF est\xE1 aumentando. Al\xE9m disso, a gravidade\
          \ do SSRF est\xE1 se tornando mais alta devido aos servi\xE7os em nuvem\
          \ e \xE0 complexidade crescente das arquiteturas."
        annotation: "## Score table\n\n| CWEs Mapeadas | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa M\xE9dia de Incid\xEAncia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | M\xE9dia de Cobertura\
          \ | Total de Ocorr\xEAncias | Total de CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 1           | 2.72%              | 2.72%              | 8.28         \
          \        | 6.72                | 67.72%       | 67.72%       | 9,503   \
          \          | 385        |\n\n\n## How to prevent\n\nOs desenvolvedores podem\
          \ evitar o SSRF implementando alguns ou todos os seguintes controles de\
          \ defesa em profundidade:\n\n### **Para a Camada de Rede**\n\n- Segmente\
          \ a funcionalidade de acesso a recursos remotos em redes separadas para\
          \ reduzir o impacto de SSRF;\n- Imponha pol\xEDticas de firewall para \u201C\
          negar por padr\xE3o\u201D ou regras de controle de acesso \xE0 rede para\
          \ bloquear todo o tr\xE1fego da intranet, exceto o essencial.\n- *Dicas:*\n\
          ~ Estabele\xE7a uma propriedade e um ciclo de vida para regras de firewall\
          \ baseadas em aplicativos.\n~ Registrar todos os fluxos de rede aceitos\
          \ *e* bloqueados em firewalls.\n(veja [A09:2021-Monitoramento de Falhas\
          \ e Registros de Seguran\xE7a](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
          \    \n### **Para a Camada de Aplica\xE7\xE3o:**\n\n- Higienize e valide\
          \ todos os dados de entrada fornecidos pelo cliente;\n- Aplique o esquema\
          \ de URL, porta e destino com uma lista de permiss\xF5es positiva;\n- N\xE3\
          o envie a resposta crua ao cliente\n- Desabilite redirecionamentos de HTTP;\n\
          - Tenha cuidado com a consist\xEAncia URL contra ataques que mirem a resolu\xE7\
          \xE3o de nomes atrav\xE9s do DNS e CWE-367.\n\nN\xE3o reduza o SSRF por\
          \ meio do uso de uma lista de nega\xE7\xE3o ou express\xE3o regular. Os\
          \ invasores t\xEAm listas gigantes de poss\xEDveis entradas, ferramentas\
          \ e habilidades para contornar as listas de nega\xE7\xE3o.\n\n### **Medidas\
          \ Adicionais a Considerar:**\n    \n- N\xE3o implemente outros servi\xE7\
          os de seguran\xE7a relevantes em sistemas frontais (por exemplo, OpenID).\
          \ Controle o tr\xE1fego local nesses sistemas (por exemplo, localhost)\n\
          - Para *frontends* com grupos de usu\xE1rios dedicados e gerenci\xE1veis,\
          \ use criptografia de rede (por exemplo, VPNs) em sistemas independentes\
          \ para as necessidades de prote\xE7\xE3o muito altas.\n\n\n## Example attack\
          \ scenarios\n\nOs invasores podem usar SSRF para atacar sistemas protegidos\
          \ por firewalls de aplicativos da web, firewalls ou ACLs de rede, usando\
          \ cen\xE1rios como:\n\n**Cen\xE1rio #1:** Varredura de portas em servidores\
          \ internos - se a arquitetura de rede n\xE3o for segmentada, os invasores\
          \ podem mapear as redes internas e determinar se as portas est\xE3o abertas\
          \ ou fechadas em servidores internos a partir dos resultados da conex\xE3\
          o ou do tempo decorrido para conectar ou rejeitar as conex\xF5es de carga\
          \ SSRF.\n\n**Cen\xE1rio #2:** Exposi\xE7\xE3o de dados confidenciais - os\
          \ invasores podem acessar arquivos locais, como ou servi\xE7os internos,\
          \ para obter informa\xE7\xF5es confidenciais, como `file:///etc/passwd`\
          \ e `http://localhost:28017/`.\n\n**Cen\xE1rio #3:** Acesse o armazenamento\
          \ de metadados de servi\xE7os em nuvem - a maioria dos provedores de nuvem\
          \ possui armazenamento de metadados, como `http://169.254.169.254/`. Um\
          \ invasor pode ler os metadados para obter informa\xE7\xF5es confidenciais.\n\
          \n**Cen\xE1rio #4:** Comprometimento dos servi\xE7os internos - O invasor\
          \ pode abusar dos servi\xE7os internos para conduzir outros ataques, como\
          \ Execu\xE7\xE3o Remota de C\xF3digo/Remote Code Execution (RCE) ou Nega\xE7\
          \xE3o de Servi\xE7o/Denial of Service (DoS). \n\n\nPara mais informa\xE7\
          \xF5es sobre as refer\xEAncias e a lista de CWEs mapeadas: https://top10.owasp.org/2021/pt-BR/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      tr:
        name: Server-Side Request Forgery (SSRF)
        description: "SSRF hatalar\u0131, bir web uygulamas\u0131 kullan\u0131c\u0131\
          \ taraf\u0131ndan sa\u011Flanan URL\u2019yi do\u011Frulamadan uzak bir kayna\u011F\
          \u0131 fetch etti\u011Finde ortaya \xE7\u0131kar. Bu, sald\u0131rgan\u0131\
          n uygulamay\u0131, firewall, VPN veya ba\u015Fka bir network access control\
          \ list (ACL) ile korunuyor olsa bile beklenmeyen bir hedefe crafted bir\
          \ istek g\xF6ndermeye zorlamas\u0131na imk\xE2n tan\u0131r.\n\nModern web\
          \ uygulamalar\u0131 son kullan\u0131c\u0131lara kullan\u0131\u015Fl\u0131\
          \ \xF6zellikler sunduk\xE7a, bir URL\u2019i fetch etmek yayg\u0131n bir\
          \ senaryo h\xE2line gelir. Sonu\xE7 olarak, SSRF\u2019nin g\xF6r\xFClme\
          \ s\u0131kl\u0131\u011F\u0131 art\u0131yor. Ayr\u0131ca cloud servisleri\
          \ ve mimarilerin karma\u015F\u0131kl\u0131\u011F\u0131 nedeniyle SSRF\u2019\
          nin ciddiyeti de y\xFCkseliyor."
        annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
          \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg\
          \ Coverage | Total Occurrences | Total CVEs |\n| :---------: | :----------------:\
          \ | :----------------: | :------------------: | :-----------------: | :----------:\
          \ | :----------: | :---------------: | :--------: |\n|      1      |   \
          \     2.72%       |        2.72%       |         8.28         |        \
          \ 6.72        |    67.72%    |    67.72%    |       9,503       |     385\
          \    |\n\n\n## How to prevent\n\nGeli\u015Ftiriciler, a\u015Fa\u011F\u0131\
          daki defense-in-depth kontrollerinin bir k\u0131sm\u0131n\u0131 veya tamam\u0131\
          n\u0131 uygulayarak SSRF\u2019yi \xF6nleyebilir:\n\n### **Network katman\u0131\
          ndan**\n\n* Uzak kaynak eri\u015Fimi fonksiyonelli\u011Fini ayr\u0131 network\u2019\
          lere ay\u0131r\u0131n; SSRF\u2019nin etkisini azalt\u0131n.\n* \u201CVarsay\u0131\
          lan olarak reddet (deny by default)\u201D firewall policy\u2019leri veya\
          \ network access control kurallar\u0131 uygulay\u0131n; temel intranet trafi\u011F\
          i d\u0131\u015F\u0131ndaki her \u015Feyi engelleyin.<br/>\n  *\u0130pu\xE7\
          lar\u0131:*<br/>\n  \\~ Firewall kurallar\u0131 i\xE7in uygulama bazl\u0131\
          \ sahiplik ve lifecycle olu\u015Fturun.<br/>\n  \\~ Firewall\u2019larda\
          \ kabul edilen *ve* engellenen t\xFCm network ak\u0131\u015Flar\u0131n\u0131\
          \ log\u2019lay\u0131n (bkz. [A09:2021-Security Logging and Monitoring Failures](A09_2021-Security_Logging_and_Monitoring_Failures.md)).\n\
          \n### **Application katman\u0131ndan**\n\n* T\xFCm client taraf\u0131ndan\
          \ sa\u011Flanan input verisini sanitize ve validate edin.\n* URL schema,\
          \ port ve destination\u2019\u0131 pozitif bir allow list ile zorunlu k\u0131\
          l\u0131n.\n* Ham (raw) response\u2019lar\u0131 client\u2019a g\xF6ndermeyin.\n\
          * HTTP redirection\u2019lar\u0131 devre d\u0131\u015F\u0131 b\u0131rak\u0131\
          n.\n* DNS rebinding ve \u201Ctime of check, time of use\u201D (TOCTOU) race\
          \ condition gibi sald\u0131r\u0131lardan ka\xE7\u0131nmak i\xE7in URL tutarl\u0131\
          l\u0131\u011F\u0131n\u0131n fark\u0131nda olun.\n\nSSRF\u2019yi bir deny\
          \ list veya regular expression kullanarak azaltmay\u0131n. Sald\u0131rganlar\u0131\
          n deny list\u2019leri atlamak i\xE7in payload listeleri, ara\xE7lar\u0131\
          \ ve yetenekleri vard\u0131r.\n\n### **D\xFC\u015F\xFCn\xFClebilecek Ek\
          \ \xD6nlemler:**\n\n* \xD6ny\xFCz (front) sistemlerinde ba\u015Fka security-relevant\
          \ servisleri (\xF6rn. OpenID) deploy etmeyin. Bu sistemlerde local trafi\u011F\
          i (\xF6rn. localhost) kontrol edin.\n* Y\xF6netilebilir, dedike kullan\u0131\
          c\u0131 gruplar\u0131na sahip frontend\u2019ler i\xE7in, \xE7ok y\xFCksek\
          \ koruma ihtiyac\u0131 d\xFC\u015F\xFCn\xFCl\xFCyorsa ba\u011F\u0131ms\u0131\
          z sistemlerde network encryption (\xF6rn. VPN) kullan\u0131n.\n\n\n## Example\
          \ attack scenarios\n\nSald\u0131rganlar, a\u015Fa\u011F\u0131daki senaryolar\
          \ gibi web application firewall\u2019lar\u0131, firewall\u2019lar veya network\
          \ ACL\u2019leri ile korunan sistemlere SSRF kullanarak sald\u0131rabilir:\n\
          \n**Senaryo #1: \u0130\xE7 sunucular\u0131n port taramas\u0131** \u2013\
          \ Network mimarisi segmentlenmemi\u015Fse, sald\u0131rganlar ba\u011Flant\u0131\
          \ sonu\xE7lar\u0131ndan veya SSRF payload ba\u011Flant\u0131lar\u0131n\u0131\
          \ kurma/ret etme s\xFCresinden i\xE7 a\u011Flar\u0131 haritalayabilir ve\
          \ i\xE7 sunucularda portlar\u0131n a\xE7\u0131k m\u0131 kapal\u0131 m\u0131\
          \ oldu\u011Funu belirleyebilir.\n\n**Senaryo #2: Hassas veri s\u0131z\u0131\
          nt\u0131s\u0131** \u2013 Sald\u0131rganlar yerel dosyalara veya i\xE7 servislere\
          \ eri\u015Ferek `file:///etc/passwd` ve `http://localhost:28017/` gibi hassas\
          \ bilgileri elde edebilir.\n\n**Senaryo #3: Cloud servislerinin metadata\
          \ storage\u2019\u0131na eri\u015Fim** \u2013 \xC7o\u011Fu cloud sa\u011F\
          lay\u0131c\u0131s\u0131nda `http://169.254.169.254/` gibi metadata storage\
          \ bulunur. Bir sald\u0131rgan, metadata\u2019y\u0131 okuyarak hassas bilgiler\
          \ elde edebilir.\n\n**Senaryo #4: \u0130\xE7 servislerin ele ge\xE7irilmesi**\
          \ \u2013 Sald\u0131rgan, i\xE7 servisleri k\xF6t\xFCye kullanarak Remote\
          \ Code Execution (RCE) veya Denial of Service (DoS) gibi sonraki sald\u0131\
          r\u0131lar\u0131 ger\xE7ekle\u015Ftirebilir.\n\n\nReferanslar ve e\u015F\
          lenen CWE listesi hakk\u0131nda daha fazla bilgi: https://top10.owasp.org/2021/tr/A10_2021-Server-Side_Request_Forgery_%28SSRF%29/"
      zh:
        name: Server-Side Request Forgery (SSRF)
        description: "\u5F53\u7F51\u9875\u5E94\u7528\u7A0B\u5F0F\u6B63\u5728\u53D6\
          \u5F97\u8FDC\u7AEF\u8D44\u6E90\uFF0C\u5374\u672A\u9A8C\u8BC1\u7531\u4F7F\
          \u7528\u8005\u63D0\u4F9B\u7684\u7F51\u5740\uFF0C\u6B64\u65F6\u5C31\u4F1A\
          \u53D1\u751F\u4F2A\u9020\u670D\u52A1\u7AEF\u8BF7\u6C42\u3002\u5373\u4FBF\
          \u6709\u9632\u706B\u5899\u3001VPN \u6216\u5176\u4ED6\u7F51\u8DEF ACL \u4FDD\
          \u62A4\u7684\u60C5\u51B5\u4E0B\uFF0C\u653B\u51FB\u8005\u4ECD\u5F97\u4EE5\
          \u5F3A\u8FEB\u7F51\u9875\u5E94\u7528\u7A0B\u5F0F\u53D1\u9001\u4E00\u4E2A\
