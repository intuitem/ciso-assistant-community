  threats:
  - urn: urn:intuitem:risk:threat:a01
    ref_id: A01:2021
    name: Broken Access Control
    description: "Access control enforces policy such that users cannot act outside\
      \ of\ntheir intended permissions. Failures typically lead to unauthorized\n\
      information disclosure, modification, or destruction of all data or\nperforming\
      \ a business function outside the user's limits. Common access\ncontrol vulnerabilities\
      \ include:\n\n-   Violation of the principle of least privilege or deny by default,\n\
      \    where access should only be granted for particular capabilities,\n    roles,\
      \ or users, but is available to anyone.\n\n-   Bypassing access control checks\
      \ by modifying the URL (parameter\n    tampering or force browsing), internal\
      \ application state, or the\n    HTML page, or by using an attack tool modifying\
      \ API requests.\n\n-   Permitting viewing or editing someone else's account,\
      \ by providing\n    its unique identifier (insecure direct object references)\n\
      \n-   Accessing API with missing access controls for POST, PUT and DELETE.\n\
      \n-   Elevation of privilege. Acting as a user without being logged in or\n\
      \    acting as an admin when logged in as a user.\n\n-   Metadata manipulation,\
      \ such as replaying or tampering with a JSON\n    Web Token (JWT) access control\
      \ token, or a cookie or hidden field\n    manipulated to elevate privileges\
      \ or abusing JWT invalidation.\n\n-   CORS misconfiguration allows API access\
      \ from unauthorized/untrusted\n    origins.\n\n-   Force browsing to authenticated\
      \ pages as an unauthenticated user or\n    to privileged pages as a standard\
      \ user."
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 34          | 55.97%             | 3.81%              | 6.92             \
      \    | 5.93                | 94.55%       | 47.72%       | 318,487         \
      \  | 19,013     |\n\n\n## How to prevent\n\nAccess control is only effective\
      \ in trusted server-side code or\nserver-less API, where the attacker cannot\
      \ modify the access control\ncheck or metadata.\n\n-   Except for public resources,\
      \ deny by default.\n\n-   Implement access control mechanisms once and re-use\
      \ them throughout\n    the application, including minimizing Cross-Origin Resource\
      \ Sharing (CORS) usage.\n\n-   Model access controls should enforce record ownership\
      \ rather than\n    accepting that the user can create, read, update, or delete\
      \ any\n    record.\n\n-   Unique application business limit requirements should\
      \ be enforced by\n    domain models.\n\n-   Disable web server directory listing\
      \ and ensure file metadata (e.g.,\n    .git) and backup files are not present\
      \ within web roots.\n\n-   Log access control failures, alert admins when appropriate\
      \ (e.g.,\n    repeated failures).\n\n-   Rate limit API and controller access\
      \ to minimize the harm from\n    automated attack tooling.\n\n-   Stateful session\
      \ identifiers should be invalidated on the server after logout.\n    Stateless\
      \ JWT tokens should rather be short-lived so that the window of \n    opportunity\
      \ for an attacker is minimized. For longer lived JWTs it's highly recommended\
      \ to\n    follow the OAuth standards to revoke access.\n\nDevelopers and QA\
      \ staff should include functional access control unit\nand integration tests.\n\
      \n\n## Example attack scenarios\n\n**Scenario #1:** The application uses unverified\
      \ data in a SQL call that\nis accessing account information:\n\n```\n pstmt.setString(1,\
      \ request.getParameter(\"acct\"));\n ResultSet results = pstmt.executeQuery(\
      \ );\n```\n\nAn attacker simply modifies the browser's 'acct' parameter to send\n\
      whatever account number they want. If not correctly verified, the\nattacker\
      \ can access any user's account.\n\n```\n https://example.com/app/accountInfo?acct=notmyacct\n\
      ```\n\n**Scenario #2:** An attacker simply force browses to target URLs. Admin\n\
      rights are required for access to the admin page.\n\n```\n https://example.com/app/getappInfo\n\
      \ https://example.com/app/admin_getappInfo\n```\nIf an unauthenticated user\
      \ can access either page, it's a flaw. If a\nnon-admin can access the admin\
      \ page, this is a flaw.\n\n\nFor more information about the references and the\
      \ list of mapped CWEs: https://top10.owasp.org/2021/A01_2021-Broken_Access_Control/"
