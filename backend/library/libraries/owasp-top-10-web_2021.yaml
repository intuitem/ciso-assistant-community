      de:
        name: Unsichere oder veraltete Komponenten
        description: "Die Anwendung besitzt m\xF6glicherweise Schwachstellen, wenn\
          \ folgendes zutrifft:\n\n- Fehlende Kenntnis \xFCber die Versionen aller\
          \ verwendeten Komponenten der in der Anwendung (sowohl client- als auch\
          \ serverseitig). Dies beinhaltet sowohl direkte als auch indirekte, verschachtelte\
          \ Abh\xE4ngigkeiten.\n\n- Die verwendete Software besitzt Schwachstellen,\
          \ wird nicht mehr unterst\xFCtzt oder ist veraltet. Dies beinhaltet das\
          \ Betriebssystem, den Web-/Applikationsserver, das Datenbankmanagementsystem\
          \ (DBMS), Anwendungen, APIs und alle verwendeten Komponenten, Laufzeitumgebungen\
          \ sowie Bibliotheken.\n\n- Schwachstellenscans werden nicht regelm\xE4\xDF\
          ig durchgef\xFChrt und die sicherheitsrelevanten Bulletins der verwendeten\
          \ Komponenten sind nicht abonniert.\n\n- Die zugrundeliegende Plattform,\
          \ die Frameworks und die Abh\xE4ngigkeiten werden nicht risikobasiert und\
          \ rechtzeitig repariert oder aktualisiert. Dies geschiet in der Regel in\
          \ Umgebungen, in denen Patchen eine monatliche oder quartalsweise T\xE4\
          tigkeit ist und einer \xC4nderungskontrolle unterliegt. Dies setzt die Organisation\
          \ unn\xF6tigerweise \xFCber Tage oder Monate dem Risiko von Schwachstellen\
          \ aus, f\xFCr die schon Patches existieren.\n\n- Softwareentwickler f\xFC\
          hren keine Kompatibilit\xE4ts-Tests der aktualisierten oder gepatchten Bibliotheken\
          \ durch.\n\n- Die Komponenten sind nicht sicher konfiguriert (siehe [A05:2021-Sicherheitsrelevante\
          \ Fehlkonfiguration](A05_2021-Security_Misconfiguration.md)).\n<!-- TODO\
          \ OSIB Link -->"
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 3          | 27.96 %             | 8.77 %              | 5.00        \
          \         | 5.00                | 51.78 %       | 22.47 %       | 30,457\
          \           | 0        |\n\n\n## How to prevent\n\nEs sollte ein Patch-Management-Prozess\
          \ vorhanden sein:\n\n- Entfernen Sie ungenutzte Abh\xE4ngigkeiten, unn\xF6\
          tige Funktionen, Komponenten, Dateien und Dokumentation.\n\n- Kontinuierliche\
          \ Bestandsaufnahme der Versionen sowohl der clientseitigen als auch der\
          \ serverseitigen Komponenten (z. B. Frameworks, Bibliotheken) und ihrer\
          \ Abh\xE4ngigkeiten mithilfe von Tools wie \"versions\", \"OWASP Dependency\
          \ Check\", \"retire.js\" usw. \xDCberwachen Sie kontinuierlich Quellen wie\
          \ Common Vulnerability and Exposures (CVE) und die National Vulnerability\
          \ Database (NVD) f\xFCr Schwachstellen in den Komponenten. Verwenden Sie\
          \ Software-Tools zur Analyse der Softwarebestandteile, um den Prozess zu\
          \ automatisieren. Abonnieren Sie E-Mail-Benachrichtigungen zu Sicherheitsl\xFC\
          cken im Zusammenhang mit den verwendeten Komponenten.\n\n- Beziehen Sie\
          \ Komponenten nur von offiziellen Quellen \xFCber sichere Links. Bevorzugen\
          \ Sie signierte Pakete, um die Wahrscheinlichkeit zu verringern, dass eine\
          \ modifizierte, b\xF6sartige Komponente enthalten ist (siehe [A08:2021-Fehlerhafte\
          \ Pr\xFCfung der Software- und Datenintegrit\xE4t](A08_2021-Software_and_Data_Integrity_Failures.md)).\n\
          \n- \xDCberwachen Sie Bibliotheken und Komponenten, die nicht gewartet werden\
          \ oder keine Sicherheitspatches f\xFCr \xE4ltere Versionen erstellen. Wenn\
          \ das Patchen nicht m\xF6glich ist, erw\xE4gen Sie die Bereitstellung eines\
          \ virtuellen Patches zur \xDCberwachung, Erkennung oder zum Schutz vor dem\
          \ entdeckten Problem.\n\nJede Organisation muss einen fortlaufenden Plan\
          \ f\xFCr die \xDCberwachung, Triage und Anwendung von Updates oder Konfigurations\xE4\
          nderungen w\xE4hrend der gesamten Lebensdauer der Anwendung oder des Portfolios\
          \ sicherstellen.\n\n\n## Example attack scenarios\n\n**Szenario Nr. 1:**\
          \ Komponenten werden normalerweise mit denselben Berechtigungen wie die\
          \ Anwendung selbst ausgef\xFChrt, sodass Fehler in einer Komponente schwerwiegende\
          \ Auswirkungen haben k\xF6nnen. Solche Fehler k\xF6nnen zuf\xE4llig (z.\
          \ B. ein Programmierfehler) oder absichtlich (z. B. eine Backdoor in einer\
          \ Komponente) sein. Einige Beispiele f\xFCr entdeckte ausnutzbare Komponentenschwachstellen\
          \ sind:\n\n- CVE-2017-5638, eine Remote Code Execution Schwachstelle in\
          \ Struts 2, die Angreifende erm\xE4chtigt, beliebigen Code auf dem Server\
          \ auszuf\xFChren, wurde f\xFCr einige erhebliche Sicherheitsvorf\xE4lle\
          \ verantwortlich gemacht.\n\n- Obwohl das Patchen von Internet of Things\
          \ (IoT) Ger\xE4ten oft nur sehr schwierig oder unm\xF6glich ist,\nkann dies\
          \ sehr wichtig sein (z. B. f\xFCr biomedizinische Ger\xE4te).\n\nEs existieren\
          \ automatisierte Tools, die Angreifenden helfen, nicht gepatchte oder falsch\
          \ konfigurierte Systeme zu finden. Die Shodan IoT-Suchmaschine kann Ihnen\
          \ beispielsweise dabei helfen, Ger\xE4te zu finden, die immer noch f\xFC\
          r die im April 2014 gepatchte Heartbleed-Sicherheitsl\xFCcke verwundbar\
          \ sind.\n\n\nWeitere Informationen zu den Referenzen und zur Liste der zugeordneten\
          \ CWEs: https://top10.owasp.org/2021/de/A06_2021-Vulnerable_and_Outdated_Components/"
      es:
        name: Componentes Vulnerables y Desactualizados
        description: "Usted probablemente sea vulnerable:\n\n-   Si no conoce las\
          \ versiones de todos los componentes que utiliza (tanto en el cliente como\
          \ en el servidor). Esto incluye los componentes que usa directamente, as\xED\
          \ como las dependencias anidadas.\n\n-   Si el software es vulnerable, carece\
          \ de soporte o no est\xE1 actualizado. Esto incluye el sistema operativo,\
          \ el servidor web/de aplicaciones, el sistema de administraci\xF3n de bases\
          \ de datos (DBMS), las aplicaciones, las API y todos los componentes, los\
          \ entornos de ejecuci\xF3n y las bibliotecas.\n\n-   Si no analiza en b\xFA\
          squeda de vulnerabilidades de forma regular y no se suscribe a los boletines\
          \ de seguridad relacionados con los componentes que utiliza.\n\n-   Si no\
          \ repara o actualiza la plataforma subyacente, frameworks y dependencias\
          \ de manera oportuna y basada en el riesgo. Esto suele ocurrir en entornos\
          \ en los que la aplicaci\xF3n de parches de seguridad es una tarea mensual\
          \ o trimestral bajo control de cambios, lo que deja a las organizaciones\
          \ abiertas a d\xEDas o meses de exposici\xF3n innecesaria a vulnerabilidades\
          \ con soluciones disponibles.\n\n-   Si los desarrolladores de software\
          \ no testean la compatibilidad de las bibliotecas actualizadas, actualizadas\
          \ o parcheadas.\n\n-   Si no asegura las configuraciones de los componentes\
          \ (consulte [A05:2021 \u2013 Configuraci\xF3n de Seguridad Incorrecta](A05_2021-Security_Misconfiguration.md))."
