      de:
        name: Fehlerhafte Authentifizierung
        description: "Die \xDCberpr\xFCfung der Identit\xE4t des Nutzenden, die Authentifizierung\
          \ und die Sitzungsverwaltung sind entscheidend f\xFCr den Schutz vor authentifizierungsbezogenen\
          \ Angriffen. Schwachstellen bei der Authentifizierung k\xF6nnen auftreten,\
          \ falls die Anwendung:\n\n- automatisierte Angriffe wie Credential Stuffing\
          \ zul\xE4sst, bei dem Angreifende \xFCber eine Liste g\xFCltiger Usernamen\
          \ und Passw\xF6rter verf\xFCgen.\n\n- Brute-Force- oder andere automatisierte\
          \ Angriffe erm\xF6glicht.\n\n- Standard-, schwache oder g\xE4ngige Passw\xF6\
          rter zul\xE4sst, wie z. B. \"Passwort1\" oder \"admin/admin\".\n\n- schwache\
          \ oder ineffektive Verfahren zur Wiederherstellung von Anmeldeinformationen\
          \  und   Verfahren f\xFCr vergessene Passw\xF6rtern, wie z. B. \u201Ewissensbasierte\
          \ Antworten\u201C, die nicht sicher gemacht werden k\xF6nnen, \nverwendet\
          \ werden.\n\n-  Klartext-, verschl\xFCsselte oder schwach gehashte Kennwortdatenspeicher\
          \ (siehe\n    [A02:2021-Cryptographic Failures](A02_2021-Cryptographic_Failures.md))\
          \ verwendet.\n\n- Fehlende oder unwirksame Multi-Faktor-Authentifizierung.\n\
          \n- Die Session-ID wird in der URL angezeigt.\n\n- Session-IDs nach erfolgreichem\
          \ Login wieder verwendet werden.\n\n- Session-IDs werden nicht korrekt ung\xFC\
          ltig gemacht. Sitzungen von Benutzenden (user sessions) oder Authentifizierungs-Tokens\
          \ (haupts\xE4chlich Single Sign-On (SSO) Tokens) werden beim Abmelden oder\
          \ bei Inaktivit\xE4t nicht ordnungsgem\xE4\xDF invalidiert."
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 22          | 14.84 %             | 2.55 %              | 7.40       \
          \          | 6.50                | 79.51 %       | 45.72 %       | 132,195\
          \           | 3,897      |\n\n\n## How to prevent\n\n- Wenn m\xF6glich,\
          \ sollte eine Multi-Faktor-Authentifizierung implementiert werden, um automatisiertes\
          \ Credential Stuffing, Brute Force-Angriffe und die Wiederverwendung gestohlener\
          \ Zugangsdaten zu verhindern.\n\n- Liefern Sie die Anwendung nicht mit Standard\
          \ Login-Daten aus, insbesondere nicht f\xFCr Administrator-Konten.\n\n-\
          \ Implementieren Sie Pr\xFCfungen auf schwache Passw\xF6rter, wie z. B.\
          \ durch den Vergleich von neuen oder ge\xE4nderten Passw\xF6rtern mit der\
          \ Liste der 10.000 schlechtesten Passw\xF6rter.\n\n- Angleichung der Passwortl\xE4\
          nge, -komplexit\xE4t und -rotation an die Richtlinien des National Institute\
          \ of Standards and Technology (NIST) 800-63b in Abschnitt 5.1.1 \"Memorized\
          \ Secrets\" oder andere modernen, bew\xE4hrten Passwortrichtlinien.\n\n\
          - Sicherstellen, dass die Registrierung, die Wiederherstellung von Zugangsdaten\
          \ und die API-Pfade gegen Angriffe zur Ermittlung von Konten geh\xE4rtet\
          \ sind, indem f\xFCr alle Resultate die gleiche Nachricht ausgegeben wird.\n\
          \n- Begrenzen oder bremsen Sie fehlgeschlagene Anmeldeversuche immer weiter\
          \ aus, aber achten Sie darauf, dass hierbei kein Denial-of-Service-Szenario\
          \ entsteht. Loggen Sie alle Fehlversuche und alarmieren Sie die Administratoren,\
          \ wenn Credential Stuffing, Brute Force oder andere Angriffe erkannt werden.\n\
          \n- Verwenden Sie einen serverseitigen, sicheren, integrierten Sitzungsmanager,\
          \ der f\xFCr jede Sitzung eine neue zuf\xE4llige Sitzungs-ID mit hoher Entropie\
          \ erzeugt. Die Sitzungs-ID sollte nicht in der URL enthalten sein, sicher\
          \ gespeichert werden und nach Abmeldung, Inaktivit\xE4t und Absoluten Timeouts\
          \ entwertet werden.\n\n\n## Example attack scenarios\n\n**Szenario Nr. 1:**\
          \ Credential Stuffing, die Verwendung von Listen mit bekannten Kennw\xF6\
          rtern, ist ein g\xE4ngiger Angriff. Angenommen, eine Anwendung verf\xFC\
          gt keinen automatischen Schutz vor Bedrohungen oder Credential Stuffing.\
          \ In diesem Fall kann die Anwendung als Passwort-Orakel verwendet werden,\
          \ um festzustellen, ob die Anmeldeinformationen g\xFCltig sind.\n\n**Szenario\
          \ #2:** Die meisten Authentifizierungsangriffe erfolgen aufgrund der andauernden\
          \ Verwendung von Kennw\xF6rtern als einzigem Zugangsmerkmal. Die fr\xFC\
          her als Best Practices geltenden Anforderungen an den Wechsel und die Komplexit\xE4\
          t von Passw\xF6rtern verleiten die Nutzende zur Verwendung und Wiederverwendung\
          \ schwacher Passw\xF6rter. Organisationen wird empfohlen, diese Praktiken\
          \ gem\xE4\xDF NIST 800-63 einzustellen und eine Mehrfaktor-Authentifizierung\
          \ zu verwenden.\n\n**Szenario #3:** Die Session-Timeouts von Anwendungen\
          \ sind nicht korrekt gesetzt. Eine Nutzerin/Nutzer verwendet einen \xF6\
          ffentlichen Computer, um auf eine Anwendung zuzugreifen. Anstatt sich abzumelden,\
          \ schlie\xDFt die nutzende Person einfach die Browser-Registerkarte und\
          \ geht weg. Angreifende verwenden denselben Browser eine Stunde sp\xE4ter,\
          \ und die Nutzerin/Nutzer ist noch immer authentifiziert.\n\n\nWeitere Informationen\
          \ zu den Referenzen und zur Liste der zugeordneten CWEs: https://top10.owasp.org/2021/de/A07_2021-Identification_and_Authentication_Failures/"
      es:
        name: "Fallas de Identificaci\xF3n y Autenticaci\xF3n"
        description: "La confirmaci\xF3n de la identidad, la autenticaci\xF3n y la\
          \ gesti\xF3n de sesiones del usuario son fundamentales para protegerse contra\
          \ ataques relacionados con la autenticaci\xF3n. Puede haber debilidades\
          \ de autenticaci\xF3n si la aplicaci\xF3n:\n\n-   Permite ataques automatizados\
          \ como la reutilizaci\xF3n de credenciales conocidas, donde el atacante\
          \ posee una lista de pares de usuario y contrase\xF1a v\xE1lidos.\n\n- \
          \  Permite ataques de fuerza bruta u otros ataques automatizados.\n\n- \
          \  Permite contrase\xF1as por defecto, d\xE9biles o bien conocidas, como\
          \ \"Password1\" o \"admin/admin\".\n\n-   Posee procesos d\xE9biles o no\
          \ efectivos para las funcionalidades de olvido de contrase\xF1a o recuperaci\xF3\
          n de credenciales, como \"respuestas basadas en el conocimiento\", las cuales\
          \ no se pueden implementar de forma segura.\n\n-   Almacena las contrase\xF1\
          as en texto claro, cifradas o utilizando funciones de hash d\xE9biles (consulte\
          \ [A02: 2021-Fallas Criptogr\xE1ficas](A02_2021-Cryptographic_Failures.md)).\n\
          \n-   No posee una autenticaci\xF3n multi-factor o la implementada es ineficaz.\n\
          \n-   Expone el identificador de sesi\xF3n en la URL.\n\n-   Reutiliza el\
          \ identificador de sesi\xF3n despu\xE9s de iniciar sesi\xF3n.\n\n-   No\
          \ inv\xE1lida correctamente los identificadores de sesi\xF3n. Las sesiones\
          \ de usuario o los tokens de autenticaci\xF3n (principalmente tokens de\
          \ inicio de sesi\xF3n \xFAnico (SSO)) no son correctamente invalidados durante\
          \ el cierre de sesi\xF3n o luego de un per\xEDodo de inactividad."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom | Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 22          | 14.84%             | 2.55%              | 7.40         \
          \        | 6.50                | 79.51%       | 45.72%       | 132,195 \
          \          | 3,897      |\n\n\n## How to prevent\n\n-   Cuando sea posible,\
          \ implemente la autenticaci\xF3n multi-factor para evitar ataques automatizados\
          \ de reutilizaci\xF3n de credenciales conocidas, fuerza bruta y re\xFAso\
          \ de credenciales robadas.\n\n-   No incluya o implemente en su software\
          \ credenciales por defecto, particularmente para usuarios administradores.\n\
          \n-   Implemente un control contra contrase\xF1as d\xE9biles, tal como verificar\
          \ que una nueva contrase\xF1a o la utilizada en el cambio de contrase\xF1\
          a no est\xE9 incluida en la lista de las 10,000 peores contrase\xF1as.\n\
          \n-   Alinear las pol\xEDticas de largo, complejidad y rotaci\xF3n de las\
          \ contrase\xF1as con las pautas de la secci\xF3n 5.1.1 para Secretos Memorizados\
          \ de la gu\xEDa del NIST 800-63b u otras pol\xEDticas de contrase\xF1as\
          \ modernas, basadas en evidencias.\n\n-   Aseg\xFArese que el registro,\
          \ la recuperaci\xF3n de las credenciales y el uso de APIs, no permiten los\
          \ ataques de enumeraci\xF3n de usuarios, mediante la utilizaci\xF3n de los\
          \ mismos mensajes gen\xE9ricos en todas las salidas.\n\n-   Limite o incremente\
          \ el tiempo de espera entre intentos fallidos de inicio de sesi\xF3n, pero\
          \ tenga cuidado de no crear un escenario de denegaci\xF3n de servicio. Registre\
          \ todos los fallos y avise a los administradores cuando se detecten ataques\
          \ de rellenos automatizados de credenciales, fuerza bruta u otros.\n\n-\
          \   Utilice un gestor de sesi\xF3n en el servidor, integrado, seguro y que\
          \ genere un nuevo ID de sesi\xF3n aleatorio con alta entrop\xEDa despu\xE9\
          s de iniciar sesi\xF3n. Los identificadores de sesi\xF3n no deben incluirse\
          \ en la URL, deben almacenarse de forma segura y deben ser invalidados despu\xE9\
          s del cierre de sesi\xF3n, luego de un tiempo de inactividad o por un tiempo\
          \ de espera absoluto.\n\n\n## Example attack scenarios\n\n**Escenario #1:**\
          \ Relleno de credenciales, el uso de listas de contrase\xF1as conocidas,\
          \ es un ataque com\xFAn. Supongamos que una aplicaci\xF3n no se implementa\
          \ protecci\xF3n automatizada de relleno de credenciales. En ese caso, la\
          \ aplicaci\xF3n puede usarse como or\xE1culo de contrase\xF1as para determinar\
          \ si las credenciales son v\xE1lidas.\n\n**Escenario #2:** La mayor\xED\
          a de los ataques de autenticaci\xF3n ocurren debido al uso de contrase\xF1\
          as como \xFAnico factor. Las consideradas mejores pr\xE1cticas de requerir\
          \ de una rotaci\xF3n y complejidad de las contrase\xF1as, son vistos como\
          \ alentadoras del uso y re\xFAso de contrase\xF1as d\xE9biles por parte\
          \ de los usuarios. Se le recomienda a las organizaciones que detengan dichas\
          \ pr\xE1cticas y utilicen\nlas pr\xE1cticas recomendadas en la gu\xEDa NIST\
          \ 800-63 y utilicen autenticaci\xF3n multi-factor.\n\n**Escenario #3:**\
          \ Los tiempos de espera (timeouts) de las sesiones de aplicaci\xF3n no est\xE1\
          n configurados correctamente. Un usuario utiliza una computadora p\xFAblica\
          \ para acceder a una aplicaci\xF3n. En lugar de seleccionar \"cerrar sesi\xF3\
          n\", el usuario simplemente cierra la pesta\xF1a del navegador y se aleja.\
          \ Un atacante usa el mismo navegador una hora m\xE1s tarde, y el usuario\
          \ contin\xFAa autenticado.\n\n\nPara obtener m\xE1s informaci\xF3n sobre\
          \ las referencias y la lista de CWE asociadas: https://top10.owasp.org/2021/es/A07_2021-Identification_and_Authentication_Failures/"
      fr:
        name: "Identification et authentification de mauvaise qualit\xE9"
        description: "La confirmation de l'identit\xE9, de l'authentification et de\
          \ la session de l'utilisateur sont essentielles pour se prot\xE9ger des\
          \ attaques li\xE9es \xE0 l'authentification. Il peut y avoir des faiblesses\
          \ d'authentification si l'application :\n\n- autorise les attaques automatis\xE9\
          es telles que le bourrage des informations d'identification, o\xF9 l'attaquant\
          \ dispose d'une liste de noms d'utilisateurs valides et mots de passe ;\n\
          - permet la force brute ou d'autres attaques automatis\xE9es ;\n- autorise\
          \ les mots de passe par d\xE9faut, faibles ou bien connus, tels que \"Password1\"\
          \ ou \"admin / admin\" ;\n- utilise des processus de r\xE9cup\xE9ration\
          \ des informations d'identification faibles ou inefficaces et des processus\
          \ de mot de passe oubli\xE9, tels que \xAB&nbsp;Questions secr\xE8tes&nbsp;\xBB\
          , qui ne peuvent \xEAtre s\xE9curis\xE9es ;\n- utilise des mots de passe\
          \ en texte brut, chiffr\xE9s ou faiblement hach\xE9s (voir [A02:2021 \u2013\
          \ D\xE9faillances cryptographiques](A02_2021-Cryptographic_Failures.md))\
          \ ;\n- absence ou utilisation inefficace de l\u2019authentification multifacteur\
          \ ;\n- exposition des identifiants de session dans l'URL ;\n- r\xE9utilisation\
          \ de l'identifiant de session apr\xE8s une connexion r\xE9ussie ;\n- n'invalide\
          \ pas correctement les identifiants de session. Les sessions utilisateurs\
          \ ou les jetons d'authentification (en particulier les jetons SSO) ne sont\
          \ pas correctement invalid\xE9s lors de la d\xE9connexion ou apr\xE8s une\
          \ p\xE9riode d'inactivit\xE9."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       22       |       14,84 %        |         2,55 %         |     \
          \        7,40              |         6,50         |    79,51 %     |   \
          \   45,72 %       |          132,195           |        3 897         |\n\
          \n\n## How to prevent\n\n- lorsque cela est possible, impl\xE9mentez l'authentification\
          \ multifacteur pour \xE9viter les attaques automatis\xE9es, le bourrage\
          \ des informations d'identification, la force brute et la r\xE9utilisation\
          \ des informations d'identification vol\xE9es ;\n- ne pas livrer ou d\xE9\
          ployer avec des informations d'identification par d\xE9faut, en particulier\
          \ pour les utilisateurs avec privil\xE8ges ;\n- int\xE9grer des tests de\
          \ mots de passes faibles, \xE0 la cr\xE9ation ou au changement. Comparer\
          \ ce mot de passe avec la liste des 10000 mots de passe les plus faibles\
          \ ;\n- respecter la longueur, la complexit\xE9 et la rotation des mots de\
          \ passe par rapport aux directives du *National Institute of Standards and\
          \ Technology* (NIST) 800-63 B \xE0 la section 5.1.1 ou autres directives\
          \ modernes ;\n- assurez-vous que l'inscription, la r\xE9cup\xE9ration des\
          \ informations d'identification et les chemins d'acc\xE8s aux API sont durcis\
          \ contre les attaques d'\xE9num\xE9ration de compte en utilisant le m\xEA\
          me message pour tous les r\xE9sultats ;\n- limitez ou retardez de plus en\
          \ plus les tentatives de connexion \xE9chou\xE9es, mais veillez \xE0 ne\
          \ pas cr\xE9er un sc\xE9nario de d\xE9ni de service. Enregistrer tous les\
          \ \xE9checs et alerter les administrateurs lors du bourrage des informations\
          \ d'identification, de brute force ou d'autres attaques d\xE9tect\xE9es\
          \ ;\n- utilisez un gestionnaire de session int\xE9gr\xE9 et s\xE9curis\xE9\
          \ c\xF4t\xE9 serveur qui g\xE9n\xE8re un nouvel identifiant de session al\xE9\
          atoire avec une entropie \xE9lev\xE9e apr\xE8s la connexion. Les identifiants\
          \ de session ne doivent pas se trouver dans l'URL, ils doivent \xEAtre stock\xE9\
          s de mani\xE8re s\xE9curis\xE9e et \xEAtre invalid\xE9s apr\xE8s la d\xE9\
          connexion, une inactivit\xE9 et une certaine dur\xE9e.\n\n\n## Example attack\
          \ scenarios\n\n**Sc\xE9nario 1** : La r\xE9utilisation de mots de passe,\
          \ l\u2019utilisation de mots de passe connus, est une attaque classique.\
          \ Supposons une application qui n\u2019impl\xE9mente pas une protection\
          \ automatis\xE9e contre le bourrage d'informations ou l'utilisation des\
          \ mots de passe connus. Dans ce cas, l'application peut \xEAtre utilis\xE9\
          e comme un oracle pour d\xE9terminer si les mots de passe sont valides.\n\
          \n**Sc\xE9nario 2** : La plupart des attaques d\u2019authentification se\
          \ produisent en raison de l\u2019utilisation de mots de passe comme facteur\
          \ unique. Un temps consid\xE9r\xE9es comme de bonnes pratiques, les exigences\
          \ de rotation et de complexit\xE9 des mots de passe sont consid\xE9r\xE9\
          es comme encourageant les utilisateurs \xE0 utiliser et r\xE9utiliser des\
          \ mots de passe faibles. Il est maintenant recommand\xE9 d\u2019arr\xEA\
          ter ces pratiques selon les directives NIST 800-63 et d\u2019utiliser du\
          \ multifacteur.\n\n**Sc\xE9nario 3** : Les timeouts de session d\u2019application\
          \ ne sont pas param\xE9tr\xE9s correctement. Un utilisateur utilise un ordinateur\
          \ public pour acc\xE9der \xE0 une application. \xC0 la place de se d\xE9\
          connecter correctement, l\u2019utilisateur ferme le navigateur et quitte\
          \ l\u2019ordinateur. Un attaquant utilise ensuite le m\xEAme navigateur\
          \ quelque temps apr\xE8s et l\u2019utilisateur est toujours authentifi\xE9\
          .\n\n\nPour plus d\u2019informations sur les r\xE9f\xE9rences et la liste\
          \ des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A07_2021-Identification_and_Authentication_Failures/"
      id:
        name: Kegagalan Identifikasi dan Otentikasi
        description: "Konfirmasi identitas pengguna, otentikasi, dan sesi manajemen\
          \ sangat penting untuk melindungi dari serangan terkait otentikasi. \nMungkin\
          \ ada kelemahan otentikasi jika aplikasi:\n\n-   Mengizinkan serangan otomatis\
          \ seperti isian kredensial, di mana\n    penyerang memiliki daftar nama\
          \ pengguna dan kata sandi yang valid.\n\n-   Mengizinkan brute force atau\
          \ serangan otomatis lainnya.\n\n-   Mengizinkan kata sandi bawaan, lemah,\
          \ atau kata sandi yang terkenal, seperti \"Password1\" atau \"admin/admin.\"\
          \n\n-   Menggunakan pemulihan kredensial yang lemah atau tidak efektif dan\
          \ proses lupa kata sandi, seperti \"jawaban berbasis pengetahuan\", yang\
          \ tidak dapat dibuat\n    aman.\n\n-   Menggunakan kata sandi teks biasa,\
          \ terenkripsi, atau dengan hash yang lemah (lihat\n    A3:2017-Sensitive\
          \ Data Exposure).\n\n-   Memiliki otentikasi multi-faktor yang hilang atau\
          \ tidak efektif.\n\n-   Mengekspos ID Sesi di URL (misalnya, penulisan ulang\
          \ URL).\n\n-   Jangan memutar ID Sesi setelah login berhasil.\n\n-   Tidak\
          \ membatalkan ID Sesi dengan benar. Sesi pengguna atau\n    token autentikasi\
          \ (terutama token single sign-on (SSO)) tidak\n    divalidasi dengan benar\
          \ selama logout atau periode tidak aktif."
        annotation: "## Score table\n\n| Klasifikasi CWE | Tingkat Kejadian Maksimum\
          \ | Rata - Rata Tingkat kejadian | Cakupan Maksimum | Rata - Rata Cakupan\
          \ | Rata-rata Bobot Eksploitasi | Rata - Rata Bobot Dampak | Total Kejadian\
          \ | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 22          | 14.84%             | 2.55%              | 79.51%       |\
          \ 45.72%       | 7.40                 | 6.50                | 132,195  \
          \         | 3,897      |\n\n\n## How to prevent\n\n-   Jika memungkinkan,\
          \ terapkan otentikasi multi-faktor untuk mencegah\n    pengisian kredensial\
          \ otomatis, brute force, dan dan serangan penggunaan kembali kredensial\
          \ yang dicuri.\n\n-   Jangan mengirim atau menyebarkan dengan kredensial\
          \ bawaan apa pun, terutama untuk\n    pengguna admin.\n\n-   Menerapkan\
          \ pemeriksaan kata sandi yang lemah, seperti menguji kata sandi baru atau\
          \ yang diubah terhadap 10.000 daftar kata sandi terburuk\n\n-   Sejajarkan\
          \ panjang sandi, kompleksitas, dan kebijakan rotasi dengan pedoman NIST\n\
          \    800-63b di bagian 5.1.1 untuk Rahasia yang Dihafal atau kebijakan kata\
          \ sandi modern berbasis bukti lainnya.\n\n-   Pastikan pendaftaran, pemulihan\
          \ kredensial, dan jalur API\n    diperkuat terhadap serangan enumerasi akun\
          \ dengan menggunakan pesan yang sama\n    untuk semua hasil.\n\n-   Batasi\
          \ atau semakin tunda upaya login yang gagal. Catat semua kegagalan\n   \
          \ dan peringatkan administrator ketika pengisian kredensial, brute force,\
          \ atau\n    serangan lainnya terdeteksi.\n\n-   Gunakan pengelola sesi built-in\
          \ sisi server, aman, yang menghasilkan\n    ID sesi acak baru dengan entropi\
          \ tinggi setelah login. ID sesi\n    tidak boleh ada di URL, disimpan dengan\
          \ aman, dan tidak valid setelah\n    keluar, idle, dan waktu tunggu absolut.\n\
          \n\n## Example attack scenarios\n\n**Skenario #1:** Pengisian Kredensial,\
          \ penggunaan daftar kata sandi yang diketahui\nadalah serangan yang umum.\
          \ Misalkan aplikasi tidak menerapkan\nperlindungan terhadap ancaman atau\
          \ pengisian kredensial otomatis. Dalam hal ini,\naplikasi dapat digunakan\
          \ sebagai kata sandi oracle untuk menentukan apakah\nkredensial itu valid.\n\
          \n**Skenario #2:** Sebagian besar serangan autentikasi terjadi karena terus\n\
          menggunakan sandi sebagai satu-satunya faktor. Setelah dipertimbangkan,\
          \ praktik terbaik, rotasi kata sandi, dan persyaratan kompleksitas mendorong\
          \ pengguna untuk menggunakan kembali kata sandi yang lemah. Organisasi disarankan\
          \ untuk menghentikan praktik ini per NIST 800-63 dan menggunakan otentikasi\
          \ multi-faktor.\n\n**Skenario #3:** Waktu tunggu sesi aplikasi tidak disetel\
          \ dengan benar. Seorang\npengguna menggunakan komputer publik untuk mengakses\
          \ aplikasi. Alih-alih\nmemilih \"logout\", pengguna cukup menutup tab browser\
          \ dan pergi. Penyerang menggunakan browser yang sama satu jam kemudian,\
          \ dan pengguna masih diautentikasi.\n\n\nUntuk informasi lebih lanjut tentang\
          \ referensi dan daftar CWE yang dipetakan: https://top10.owasp.org/2021/id/A07_2021-Identification_and_Authentication_Failures/"
      it:
        name: Identification and Authentication Failures
        description: "La verifica dell'identit\xE0 dell'utente, l'autenticazione e\
          \ la gestione della sessione\nsono fondamentali per proteggersi dagli attacchi\
          \ legati all'autenticazione. \nCi possono essere debolezze sui meccanismi\
          \ di autenticazione se l'applicazione:\n\n-   Permette attacchi automatici\
          \ come il credential stuffing, dove l'attaccante\n    ha una lista di coppie\
          \ nome utente e password validi.\n\n-   Permette attacchi di brute force\
          \ o altri attacchi automatizzati.\n\n-   Permette password di default, deboli\
          \ o ben note, come \"Password1\"\n    o \"admin/admin\".\n\n-   Utilizza\
          \ un recupero delle credenziali e delle password dimenticate debole o inefficace\n\
          \    come le \"risposte basate sulla conoscenza\", che non possono essere\
          \ rese\n    sicure.\n\n-   Memorizza le password in chiaro, in modo cifrato\
          \ o con funzioni di hash deboli (vedi\n    **A02:2021-Cryptographic Failures**).\n\
          \n-   Non ha un sistema di autenticazione a pi\xF9 fattori o \xE8 inefficace.\n\
          \n-   Espone l'identificatore di sessione del URL.\n\n-   Riutilizza l'identificatore\
          \ di sessione dopo un login avvenuto con successo.\n\n-   Non invalida correttamente\
          \ l'identificatore di sessione. La sessione dell'utente o i token di autenticazione\n\
          \    (principalmente token di single sign-on (SSO)) non vengono invalidati\
          \ in modo opportuno durante il logout o dopo un periodo di inattivit\xE0"
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 22          | 14.84%             | 2.55%              | 7.40         \
          \        | 6.50                | 79.51%       | 45.72%       | 132,195 \
          \          | 3,897      |\n\n\n## How to prevent\n\n-   Dove possibile,\
          \ implementare l'autenticazione a pi\xF9 fattori per prevenire\n    attacchi\
          \ di credential stuffing, brute force e riutilizzo delle credenziali rubate.\n\
          \n-   Non mettere in produzione sistemi con credenziali di default, in particolare\
          \ per gli utenti admin.\n\n-   Implementare controlli sulla debolezza delle\
          \ password, come verificare le password nuove o modificate \ncon la lista\
          \ delle 10,000 password peggiori.\n\n-   Allineare i requisiti di lunghezza\
          \ delle password, complessit\xE0 e politiche di rotazione con le linee guida\
          \ della sezione 5.1.1 del documento  800-63b pubblicato dal National Institute\
          \ of Standards and Technology (NIST)\n   riguardante la memorizzazione dei\
          \ secret o altre policy relative alle password moderne e basate sui fatti\
          \ .\n\n-   Assicurarsi che la registrazione, il recupero delle credenziali\
          \ e le API siano\n    robusti contro gli attacchi di enumerazione degli\
          \ account utilizzando gli stessi\n    messaggi generici per tutti i risultati.\n\
          \n-   Limitare o ritardare sempre pi\xF9 i tentativi di login falliti, ma\
          \ fare attenzione a non creare uno scenario di denial of service. Loggare\
          \ tutti i tentativi falliti e avvertire gli amministratori quando vengono\
          \ rilevati attacchi di credential stuffing, brute force o\n    altri.\n\n\
          -   Usare un gestore di sessione integrato lato server, che sia sicuro,\
          \ che generi un\n    nuovo ID di sessione casuale con alta entropia dopo\
          \ il login. L'identificatore di sessione\n    non dovrebbe essere nell'URL,\
          \ deve essere memorizzato in modo sicuro e invalidato dopo il\n    logout,\
          \ un periodo di inattivit\xE0 e avere timeout assoluto.\n\n\n## Example\
          \ attack scenarios\n\n**Scenario #1:** Il credential stuffing, l'uso di\
          \ liste di password conosciute, \n\xE8 un attacco comune. Supponiamo che\
          \ un'applicazione non implementi\nla protezione automatica contro le minacce\
          \ o il credential stuffing. In questo caso, \nl'applicazione pu\xF2 essere\
          \ usata come un oracolo di password per determinare se le\ncredenziali sono\
          \ valide.\n\n**Scenario #2:** La maggior parte degli attacchi relativi all'autenticazione\
          \ si verifica a causa del continuo\nuso delle password come singolo fattore.\
          \ Le best practice,\nla rotazione delle password e i requisiti di complessit\xE0\
          \ incoraggiano gli utenti a usare\ne riutilizzare password deboli. Si raccomanda\
          \ alle organizzazioni di interrompere queste\npratiche secondo NIST 800-63\
          \ e utilizzare l'autenticazione a pi\xF9 fattori.\n\n**Scenario #3:** I\
          \ timeout della sessione dell'applicazione non sono gestiti correttamente.\
          \ Un\nutente usa un computer pubblico per accedere a un'applicazione. Invece\
          \ di\nselezionare \"logout\", l'utente chiude semplicemente la scheda del\
          \ browser e se ne va\nvia. Un attaccante usa lo stesso browser un'ora dopo,\
          \ e l'utente risulta\nancora autenticato.\n\n\nPer maggiori informazioni\
          \ sui riferimenti e sull'elenco delle CWE mappate: https://top10.owasp.org/2021/it/A07_2021-Identification_and_Authentication_Failures/"
