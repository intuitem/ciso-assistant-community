          | 20          | 19.84%             | 4.51%              | 89.58%       |\
          \ 44.84%       | 8.12                 | 6.56                | 208,387  \
          \         | 789        |\n\n\n## How to prevent\n\n\u5B89\u5168\u306B\u30A4\
          \u30F3\u30B9\u30C8\u30FC\u30EB\u3059\u308B\u30D7\u30ED\u30BB\u30B9\u306B\
