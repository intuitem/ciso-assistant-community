        name: "Fehlerhafte Pr\xFCfung der Software- und Datenintegrit\xE4t"
        description: "Software- und Datenintegrit\xE4tsfehler beziehen sich auf Code\
          \ und Infrastruktur, die keine Schutzma\xDFnahmen gegen Integrit\xE4tsverletzungen\
          \ bieten. Ein Beispiel hierf\xFCr ist, wenn eine Anwendung auf Plugins,\
          \ Bibliotheken oder Module aus nicht vertrauensw\xFCrdigen Quellen, Repositories\
          \ und Content Delivery Networks (CDNs) angewiesen ist. Eine unsichere CI/CD-Pipeline\
          \ kann das Potenzial f\xFCr unbefugten Zugriff, b\xF6sartigen Code oder\
          \ Systemkompromittierung bieten. Schlie\xDFlich enthalten viele Anwendungen\
          \ heute eine automatische Update-Funktion, bei der Updates ohne ausreichende\
          \ Integrit\xE4tspr\xFCfung heruntergeladen und auf die zuvor vertrauensw\xFC\
          rdige Anwendung angewendet werden. Angreifende k\xF6nnten ihre eigenen Updates\
          \ hochladen, die dann auf alle Installationen verbreitet und ausgef\xFC\
          hrt werden. Ein weiteres Beispiel besteht darin, dass Objekte oder Daten\
          \ in eine Struktur kodiert oder serialisiert werden, die Angreifende sehen\
          \ und \xE4ndern k\xF6nnen, und die durch eine unsichere Deserialisierung\
          \ verwundbar sind."
