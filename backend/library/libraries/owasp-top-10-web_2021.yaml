          \ der URL (Parametermanipulation oder erzwungenes Durchsuchen), des internen\
          \ Anwendungsstatus oder der HTML-Seite oder durch Verwendung eines Angriffstools\
          \ zur \xC4nderung von API-Anfragen.\n\n- Erm\xF6glichen, das Konto einer\
          \ anderen Person anzuzeigen oder zu bearbeiten, indem dessen eindeutige\
          \ Kennung angegeben wird (unsichere direkte Objektreferenzen).\n\n- Zugriff\
          \ auf die API mit fehlenden Zugriffskontrollen f\xFCr POST, PUT und DELETE.\n\
          \n- Erh\xF6hung der Privilegien. Als Nutzerin/Nutzer fungieren, ohne angemeldet\
          \ zu sein oder als Administrator fungieren, wenn man als Standard-Nutzerin/Nutzer\
          \ angemeldet ist.\n\n- Manipulation von Metadaten, wie z. B. das Abfangen\
          \ oder Manipulieren eines JSON Web Token (JWT)-Zugriffskontrolltokens oder\
          \ die Manipulation eines Cookies oder eines versteckten Felds, um Berechtigungen\
          \ zu erh\xF6hen oder die Ung\xFCltigerkl\xE4rung von JWTs zu missbrauchen.\n\
          \n- CORS-Fehlkonfiguration erm\xF6glicht API-Zugriff von nicht autorisierten/nicht\
          \ vertrauensw\xFCrdigen Quellen.\n\n- Erzwingen des Zugriffs auf authentifizierte\
          \ Seiten als nicht authentifizierte Person oder zu privilegierten Seiten\
          \ als Standard-Nutzerin/Nutzer."
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 34          | 55.97 %             | 3.81 %              | 6.92       \
          \          | 5.93                | 94.55 %       | 47.72 %       | 318,487\
          \           | 19,013     |\n\n\n## How to prevent\n\nDie Zugriffskontrolle\
          \ ist nur wirksam bei vertrauensw\xFCrdigem serverseitigem Code oder serverlosen\
          \ APIs, bei denen Angreifende die Zugriffskontrollpr\xFCfung oder Metadaten\
          \ nicht \xE4ndern k\xF6nnen.\n\n- Verweigern Sie standardm\xE4\xDFig den\
          \ Zugriff, mit Ausnahme \xF6ffentlicher Ressourcen.\n\n- Implementieren\
          \ Sie Zugriffskontrollmechanismen einmalig und verwenden Sie diese in der\
          \ gesamten Anwendung wieder, einschlie\xDFlich der Minimierung der Nutzung\
          \ von Cross-Origin Resource Sharing (CORS).\n\n- Modellzugriffskontrollen\
          \ sollten die Datensatzeigent\xFCmerschaft erzwingen, anstatt zu akzeptieren,\
          \ dass Nutzerinnen/Nutzer Datens\xE4tze erstellen, lesen, aktualisieren\
          \ oder l\xF6schen k\xF6nnen.\n\n- Durch Dom\xE4nenmodelle sollten eindeutige\
          \ Gesch\xE4ftslimitanforderungen f\xFCr Anwendungen durchgesetzt werden.\n\
          \n- Deaktivieren Sie die Verzeichnisliste des Webservers und stellen Sie\
          \ sicher, dass Dateimetadaten (z. B. .git) und Sicherungsdateien nicht in\
          \ Web-Roots vorhanden sind.\n\n- Protokollieren Sie Fehler bei der Zugriffskontrolle\
          \ und benachrichtigen Sie Administratoren bei Bedarf (z. B. wiederholte\
          \ Fehler).\n\n- Setzen Sie Ratenbegrenzung f\xFCr API- und Controller-Zugriff,\
          \ um den Schaden durch automatisierte Angriffstools zu minimieren.\n\n-\
          \ Statusbehaftete Sitzungskennungen sollten nach dem Abmelden auf dem Server\
          \ ung\xFCltig gemacht werden. Zustandslose JWT-Token sollten eher kurzlebig\
          \ sein, damit das Zeitfenster f\xFCr Angreifende minimiert wird. F\xFCr\
          \ langlebigere JWTs wird dringend empfohlen, die OAuth-Standards zu befolgen,\
          \ um den Zugriff zu widerrufen.\n\nEntwickler und QA-Mitarbeiter sollten\
          \ funktionale Zugriffskontrolleinheiten und Integrationstests durchf\xFC\
          hren.\n\n\n## Example attack scenarios\n\n**Szenario Nr. 1:** Die Anwendung\
          \ verwendet nicht \xFCberpr\xFCfte Daten in einem SQL-Aufruf, der auf Kontoinformationen\
          \ zugreift:\n\n```\npstmt.setString(1, request.getParameter(\"acct\"));\n\
          ResultSet results = pstmt.executeQuery( );\n```\n\nAngreifende \xE4ndern\
          \ einfach den \u201Eacct\u201C-Parameter des Browsers, um die gew\xFCnschte\
          \ Kontonummer zu senden. Bei nicht korrekter \xDCberpr\xFCfung kann die\
          \ angreifende Person auf das Konto einer beliebigen Nutzerin/Nutzers zugreifen.\n\
          \n```\nhttps://example.com/app/accountInfo?acct=notmyacct\n```\n\n**Szenario\
          \ Nr. 2:** Eine angreifende Person erzwingt einfach die Suche nach Ziel-URLs.\
          \ F\xFCr den Zugriff auf die Admin-Seite sind Admin-Rechte erforderlich.\n\
          \n```\nhttps://example.com/app/getappInfo\nhttps://example.com/app/admin_getappInfo\n\
          ```\nWenn eine nicht authentifizierte Benutzerin/Benutzer auf eine der Seiten\
          \ zugreifen kann, liegt ein Fehler vor. Wenn ein Benutzerin/Benutzer ohne\
          \ Administrationsrechte auf die Admin-Seite zugreifen kann, handelt es sich\
          \ um einen Fehler.\n\n\nWeitere Informationen zu den Referenzen und zur\
          \ Liste der zugeordneten CWEs: https://top10.owasp.org/2021/de/A01_2021-Broken_Access_Control/"
      es:
        name: "P\xE9rdida de Control de Acceso"
        description: "El control de acceso implementa el cumplimiento de pol\xEDtica\
          \ de modo que los usuarios no pueden actuar fuera de los permisos que le\
          \ fueron asignados. Las fallas generalmente conducen a la divulgaci\xF3\
          n de informaci\xF3n no autorizada, la modificaci\xF3n o la destrucci\xF3\
          n de todos los datos o la ejecuci\xF3n de una funci\xF3n de negocio fuera\
          \ de los l\xEDmites del usuario. Las vulnerabilidades comunes de control\
          \ de acceso incluyen:\n\n-   Violaci\xF3n del principio de m\xEDnimo privilegio\
          \ o denegaci\xF3n por defecto, seg\xFAn el cual el acceso s\xF3lo debe ser\
          \ permitido para capacidades, roles o usuarios particulares, y no disponible\
          \ para cualquier persona.\n\n-   Eludir las comprobaciones de control de\
          \ acceso modificando la URL (alteraci\xF3n de par\xE1metros o navegaci\xF3\
          n forzada), el estado interno de la aplicaci\xF3n o la p\xE1gina HTML, o\
          \ mediante el uso de una herramienta que modifique los pedidos a APIs.\n\
          \n-   Permitir ver o editar la cuenta de otra persona, con tan solo conocer\
          \ su identificador \xFAnico (referencia directa insegura a objetos)\n\n\
          -   Acceder a APIs con controles de acceso inexistentes para los m\xE9todos\
          \ POST, PUT y DELETE.\n\n-   Elevaci\xF3n de privilegios. Actuar como usuario\
          \ sin haber iniciado sesi\xF3n o actuar como administrador cuando se inici\xF3\
          \ sesi\xF3n como usuario regular.\n\n-   Manipulaci\xF3n de metadatos, como\
          \ reutilizar o modificar un token de control de acceso JSON Web Token (JWT),\
          \ una cookie o un campo oculto, manipul\xE1ndolos para elevar privilegios\
          \ o abusar de la invalidaci\xF3n de tokens JWT.\n\n-   Configuraciones incorrectas\
          \ de CORS (uso compartido de recursos de origen cruzado) que permiten el\
          \ acceso a APIs desde or\xEDgenes no autorizados o confiables.\n\n-   Forzar\
          \ la navegaci\xF3n a p\xE1ginas autenticadas siendo usuario no autenticado\
          \ o a p\xE1ginas privilegiadas siendo usuario regular."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom| Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 34          | 55.97%             | 3.81%              | 6.92         \
          \        | 5.93                | 94.55%       | 47.72%       | 318,487 \
          \          | 19,013     |\n\n\n## How to prevent\n\nEl control de acceso\
          \ solo es efectivo si es implementado en el servidor (server-side) o en\
          \ la API (caso serverless), donde el atacante no puede modificarlo ni manipular\
          \ metadatos.\n\n-   A excepci\xF3n de los recursos p\xFAblicos, denegar\
          \ por defecto.\n\n-   Implemente mecanismos de control de acceso una \xFA\
          nica vez y reutil\xEDcelos en toda la aplicaci\xF3n, incluyendo la minimizaci\xF3\
          n del uso de CORS.\n\n-   El control de acceso debe implementar su cumplimiento\
          \ a nivel de dato y no permitir que el usuario pueda crear, leer, actulizar\
          \ o borrar cualquier dato.\n\n-   Los modelos de dominio deben hacer cumplir\
          \ los requisitos \xFAnicos de l\xEDmite de negocio de aplicaciones.\n\n\
          -   Deshabilite el listado de directorios del servidor web y aseg\xFArese\
          \ de que los archivos de metadatos (por ejemplo una carpeta .git) y archivos\
          \ de respaldo no puedan ser accedidos a partir de la ra\xEDz del sitio web.\n\
          \n-   Registre las fallas de control de acceso (loggin), alertando a los\
          \ administradores cuando sea apropiado (por ejemplo, fallas repetidas).\n\
          \n-   Establezca l\xEDmites a la tasa de accesos permitidos a APIs y controladores\
          \ de forma de poder minimizar el da\xF1o provocado por herramientas automatizadas\
          \ de ataque.\n\n-   Los identificadores de sesiones deben invalidarse en\
          \ el servidor luego de cerrar la sesi\xF3n.\n    Los tokens JWT deber\xED\
          an ser preferiblemente de corta duraci\xF3n para minimizar la ventana de\
          \ oportunidad de ataque. Para tokens JWT de mayor duraci\xF3n, es sumamente\
          \ recomendable seguir los est\xE1ndares de OAuth de revocaci\xF3n de acceso.\n\
          \nTanto desarrolladores como personal de control de calidad deben incluir\
          \ pruebas funcionales de control de acceso tanto a nivel unitario como de\
          \ integraci\xF3n.\n\n\n## Example attack scenarios\n\n**Escenario #1:**\
          \ La aplicaci\xF3n utiliza datos no verificados en una llamada SQL que accede\
          \ a informaci\xF3n de una cuenta:\n\n```\n pstmt.setString(1, request.getParameter(\"\
          acct\"));\n ResultSet results = pstmt.executeQuery( );\n```\n\nUn atacante\
          \ simplemente modifica el par\xE1metro 'acct' en el navegador para enviar\
          \ el n\xFAmero de cuenta que desee. Si no es verificado correctamente, el\
          \ atacante puede acceder a la cuenta de cualquier usuario.\n\n```\n https://example.com/app/accountInfo?acct=notmyacct\n\
          ```\n\n**Escenario #2:** Un atacante simplemente navega a una URL espec\xED\
          fica. Se deber\xEDan requerir derechos de administrador para acceder a la\
          \ p\xE1gina de administraci\xF3n.\n\n```\n https://example.com/app/getappInfo\n\
          \ https://example.com/app/admin_getappInfo\n```\nSi un usuario no autenticado\
          \ puede acceder a cualquiera de las p\xE1ginas, es una falla. Si una persona\
          \ que no es administrador puede acceder a la p\xE1gina de administraci\xF3\
          n, esto es tambi\xE9n una falla.\n\n\nPara obtener m\xE1s informaci\xF3\
          n sobre las referencias y la lista de CWE asociadas: https://top10.owasp.org/2021/es/A01_2021-Broken_Access_Control/"
      fr:
        name: "Contr\xF4les d'acc\xE8s d\xE9faillants"
        description: "Le contr\xF4le d'acc\xE8s applique une strat\xE9gie telle que\
          \ les utilisateurs ne peuvent pas agir en dehors de leurs autorisations\
          \ pr\xE9vues. Les d\xE9faillances entra\xEEnent g\xE9n\xE9ralement la divulgation,\
          \ la modification ou la destruction d'informations non autoris\xE9es de\
          \ toutes les donn\xE9es ou l'ex\xE9cution d'une fonctionnalit\xE9 m\xE9\
          tier en dehors des limites de l'utilisateur. Les vuln\xE9rabilit\xE9s courantes\
          \ du contr\xF4le d'acc\xE8s incluent :\n\n-   Violation du principe du moindre\
          \ privil\xE8ge ou de refus par d\xE9faut, o\xF9 l'acc\xE8s ne doit \xEA\
          tre accord\xE9 que pour des capacit\xE9s, des r\xF4les ou des utilisateurs\
          \ particuliers, mais est accessible \xE0 tous.\n-   Contourner les contr\xF4\
          les d'acc\xE8s en modifiant l'URL (falsification de param\xE8tres ou navigation\
          \ forc\xE9e), l'\xE9tat interne de l'application ou la page HTML, ou en\
          \ utilisant un outil d'attaque modifiant les requ\xEAtes API.\n-   Autoriser\
          \ l'affichage ou la modification du compte de quelqu'un d'autre, en fournissant\
          \ son identifiant unique (r\xE9f\xE9rences directes d'objet non s\xE9curis\xE9\
          es).\n-   Acc\xE8s \xE0 l'API avec des contr\xF4les d'acc\xE8s manquants\
          \ pour POST, PUT et DELETE.\n-   \xC9l\xE9vation de privil\xE8ge. Agir en\
          \ tant qu'utilisateur sans \xEAtre connect\xE9 ou agir en tant qu'administrateur\
          \ lorsqu'il est connect\xE9 en tant qu'utilisateur.\n-   Manipulation de\
          \ m\xE9tadonn\xE9es, comme le rejeu ou la falsification de JSON Web Token\
          \ (JWT), de cookies ou de champs cach\xE9s, afin d'\xE9lever les privil\xE8\
          ges ou abuser de l'invalidation JWT.\n-   La mauvaise configuration de CORS\
          \ permettant l'acc\xE8s \xE0 l'API \xE0 partir d'origines non autoris\xE9\
          es/non approuv\xE9es.\n-   Forcer la navigation vers des pages authentifi\xE9\
          es en tant qu'utilisateur non authentifi\xE9 ou vers des pages privil\xE9\
          gi\xE9es en tant qu'utilisateur standard."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 34          | 55,97 %             | 3,81 %              | 6,92       \
          \          | 5,93                | 94,55 %       | 47,72 %       | 318 487\
          \           | 19 013     |\n\n\n## How to prevent\n\nLe contr\xF4le d'acc\xE8\
          s n'est efficace que dans le code de confiance c\xF4t\xE9 serveur ou des\
          \ API serverless, o\xF9 l'attaquant ne peut pas modifier la v\xE9rification\
          \ du contr\xF4le d'acc\xE8s ou les m\xE9tadonn\xE9es.\n\n- \xC0 l'exception\
          \ des ressources publiques, tout doit \xEAtre bloqu\xE9 par d\xE9faut.\n\
          - Centraliser l'impl\xE9mentation des m\xE9canismes de contr\xF4le d'acc\xE8\
          s et les r\xE9utiliser dans l'ensemble de l'application. Cela comprend de\
          \ minimiser l'utilisation de CORS.\n- Le mod\xE8le de contr\xF4le d'acc\xE8\
          s doit imposer l'appartenance des enregistrements, plut\xF4t que de permettre\
          \ \xE0 l'utilisateur de cr\xE9er, lire, modifier ou supprimer n'importe\
          \ quel enregistrement.\n- Les exigences m\xE9tier sp\xE9cifiques de l'application\
          \ doivent \xEAtre appliqu\xE9es par domaines.\n- D\xE9sactiver le listing\
          \ de dossier sur le serveur web, et v\xE9rifier que les fichiers de m\xE9\
          tadonn\xE9es (ex : .git) et de sauvegardes ne se trouvent pas dans l'arborescence\
          \ web.\n- Tracer les \xE9checs de contr\xF4les d'acc\xE8s, alerter les administrateurs\
          \ quand c'est appropri\xE9 (ex : \xE9checs r\xE9p\xE9t\xE9s).\n- Limiter\
          \ la fr\xE9quence d'acc\xE8s aux API et aux contr\xF4leurs d'acc\xE8s, afin\
          \ de minimiser les d\xE9g\xE2ts que causeraient des outils d'attaques automatis\xE9\
          s.\n- Les identifiants de session avec \xE9tat doivent \xEAtre invalid\xE9\
          s c\xF4t\xE9 serveur apr\xE8s une d\xE9connexion. Les JWT, sans \xE9tat,\
          \ doivent \xEAtre \xE0 dur\xE9e de vie relativement courte pour que la fen\xEA\
          tre d'opportunit\xE9 d'un attaquant soit minimis\xE9e. Pour les JWT avec\
          \ une dur\xE9e de vie plus longue, il est fortement recommand\xE9 de suivre\
          \ le standard OAuth de r\xE9vocation d'acc\xE8s.\n\nLes d\xE9veloppeurs\
          \ et les testeurs qualit\xE9 doivent proc\xE9der \xE0 des tests unitaires\
          \ et d'int\xE9gration sur les fonctionnalit\xE9s de contr\xF4le d'acc\xE8\
          s.\n\n\n## Example attack scenarios\n\n**Scenario 1 :** L'application utilise\
          \ des donn\xE9es non v\xE9rifi\xE9es dans une requ\xEAte SQL qui acc\xE8\
          de \xE0 des informations d'un compte :\n\n```\n pstmt.setString(1, request.getParameter(\"\
          acct\"));\n ResultSet results = pstmt.executeQuery( );\n```\n\nEn modifiant\
          \ simplement le param\xE8tre 'acct' dans le navigateur, un attaquant peut\
          \ envoyer le num\xE9ro de compte qu'il veut. Si ce num\xE9ro n'est pas v\xE9\
          rifi\xE9, l'attaquant peut acc\xE9der \xE0 n'importe quel compte utilisateur.\n\
          \n```\n https://example.com/app/accountInfo?acct=notmyacct\n```\n\n**Scenario\
          \ 2 :** Un attaquant force le navigateur \xE0 visiter des URL arbitraires.\
          \ Il faut imposer des droits pour acc\xE9der \xE0 une page d'administration.\n\
          \n```\n https://example.com/app/getappInfo\n https://example.com/app/admin_getappInfo\n\
          ```\nSi un utilisateur non-authentifi\xE9 peut acc\xE9der \xE0 l'une des\
          \ pages, c'est une faille. Si un non-administrateur peut acc\xE9der \xE0\
          \ une page d'administration, c'est une faille.\n\n\nPour plus d\u2019informations\
          \ sur les r\xE9f\xE9rences et la liste des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A01_2021-Broken_Access_Control/"
      id:
        name: Kerusakan Akses Kontrol
        description: 'Akses Kontrol menetapkan sebuah peraturan yang dimana user tidak
          dapat melakukan sebuah aksi diluar permission yang diberikan. Kegagalan
          atas hal ini dapat mengakibatkan pengeluaran informasi yang tidak diizinkan,
          modifikasi, atau penghancuran dari semua data atau pemberlakuan sebuah fungsi
          bisnis di luar limit sebuah user. Kelemahan Akses Kontrol termasuk dari
          :


          Melewati pengecekan akses kontrol dengan memodifikasi URL, internal application
          state, atau HTML page, atau menggunakan custom API attack tool.


          Membolehkan primary key untuk dapat diganti ke record user lain, membolehkan
          penglihatan atau perubahan akun orang lain.


          Penaikan sebuah privilege (Elevation Privilege). Yang dimana sebuah orang
          dapat dianggap sebagai user tanpa melakukan logged in dan yang dimana sebuah
          user dapat dianggap sebagai admin tanpa melakukan logged in.


          Manipulasi metadata, seperti memanipulasi dengan JSON Web Token (JWT) akses
          kontrol token, atau memanipulasi cookie atau hidden field untuk menaikan
          privilege (elevation privilege) atau menyalahgunakan penggunaan dari JWT
          invalidation.


          Konfigurasi yang salah pada CORS sehingga menyebabkan API akses yang tidak
          diizinkan.


          Force browsing untuk mengakses authenticated pages sebagai unauthenticated
          user atau mengakses privileged pages sebagai user standard. Mengakses API
          yang tidak memiliki akses kontrol untuk POST, PUT, dan DELETE.'
        annotation: "## Score table\n\n| Klasifikasi CWE | Tingkat Kejadian Maksimum\
          \ | Rata - Rata Tingkat kejadian | Cakupan Maksimum | Rata - Rata Cakupan\
          \ | Rata-rata Bobot Eksploitasi | Rata - Rata Bobot Dampak | Total Kejadian\
          \ | Total CVEs |\n| :---------: | :----------------: | :----------------------:\
          \ | :----------: | :----------------: | :------------------------: | :-----------------------:\
          \ | :------------: | :--------: |\n|     34      |       55.97%       |\
          \          3.81%           |    94.55%    |       47.72%       |       \
          \     6.92            |           5.93            |    318,487     |   19,013\
          \   |\n\n\n## How to prevent\n\nAkses Kontrol hanya efektif pada kode server-side\
          \ yang dapat dipercaya dan server-less API, yang dimana penyerang tidak\
          \ dapat memodifikasi pengecek akses kontrol atau meta datanya.\n\n- Menolak\
          \ semua akses kecuali ke public resource.\n\n- Melakukan implementasi mekanisme\
          \ akses kontrol sekali dan digunakan kembali pada seluruh aplikasi sehingga\
          \ meminimalisir penggunaan CORS.\n\n- Agar user tidak dapat melakukan create,\
          \ read, update, atau mendelete record secara bebas, model akses kontrol\
          \ seharusnya membatasi hal tersebut dengan menggunakan ownership untuk tiap\
          \ record.\n\n- Batas yang diperlukan oleh bisnis yang unik pada aplikasi\
          \ seharusnya dilakukan oleh domain models.\n\n- Nonaktifkan direktori listing\
          \ web server dan pastikan file metadata (contohnya .git) dan file backup\
          \ tidak ada di dalam web roots.\n\n- Catat kegagalan akses kontrol dan alert\
          \ admin jika diperlukan (seperti adanya kegagalan yang terjadi berulang\
          \ - ulang).\n\n- Ukur batasan dari API dan akses ke kontroler untuk meminimalisir\
          \ kerusakan dari automated attack tooling.\n\n- JWT tokens harus langsung\
          \ di hilangkan validasinya pada server setelah logout.\n\nDevelopers and\
          \ QA staff should include functional access control unit\nand integration\
          \ tests.\n\n\n## Example attack scenarios\n\n**Skenario #1:** Aplikasi menggunakan\
          \ data yang belum diverifikasi pada sebuah pemanggilan SQL yang mengakses\
          \ informasi akun\n\n> pstmt.setString(1, request.getParameter(\"acct\"));\n\
          >\n> ResultSet results = pstmt.executeQuery( );\n\nPenyerang hanya perlu\
          \ untuk memodifikasi parameter \u2018acct\u2019 pada browser untuk mengirim\
          \ nomer akun mana yang diinginkan. Jika parameter tersebut tidak diverifikasi\
          \ secara benar, maka penyerang dapat mengakses akun user manapun.\n\nhttps://example.com/app/accountInfo?acct=notmyacct\n\
          \n**Skenario #2:** Penyerang dapat memaksa untuk melakukan penjelajahan\
          \ ke target URLs. Halaman Admin memerlukan hak admin untuk dapat diakses.\n\
          \n> https://example.com/app/getappInfo\n>\n> https://example.com/app/admin_getappInfo\n\
          \nJika sebuah user yang belum di autentikasi dapat mengakses kedua page\
          \ tersebut maka itu merupakan suatu kelemahan. Jika user yang non-admin\
          \ dapat mengakses halaman admin, maka merupakan suatu kelemahan.\n\n\nUntuk\
          \ informasi lebih lanjut tentang referensi dan daftar CWE yang dipetakan:\
          \ https://top10.owasp.org/2021/id/A01_2021-Broken_Access_Control/"
      it:
        name: Broken Access Control
        description: "Il controllo degli accessi fa rispettare la policy in modo che\
          \ gli utenti non possano agire al di fuori dei\npermessi previsti. Problematiche\
          \ su questo tipo di controllo tipicamente portano alla divulgazione non\
          \ autorizzata di\ninformazioni, alla modifica o alla distruzione di tutti\
          \ i dati o l'esecuzione di una funzione di business al di fuori dei limiti\
          \ dell'utente. Le vulnerabilit\xE0 pi\xF9 comuni che affliggono i meccanismi\
          \ di controllo degli accessi includono:\n\n- Violazione del principio del\
          \ minimo privilegio o deny by default,\n  dove l'accesso dovrebbe essere\
          \ concesso solo per particolari capabilities,\n  ruoli o utenti, ma \xE8\
          \ disponibile a chiunque.\n\n- Bypassare i controlli di accesso modificando\
          \ l'URL (modifica dei parametri o\n  navigazione forzata), lo stato interno\
          \ dell'applicazione o la\n  pagina HTML, o utilizzando uno strumento di\
          \ attacco che modifica le richieste API.\n\n- Permettere la visualizzazione\
          \ o la modifica dell'account di qualcun altro, fornendo\n  il suo identificatore\
          \ unico (insecure direct object references)\n\n- Accesso all'API con controlli\
          \ di accesso mancanti per POST, PUT e DELETE.\n\n- Elevazione dei privilegi.\
          \ Agire come un utente senza essere loggato o\n  agire come amministratore\
          \ quando si \xE8 svolto il login come utente base.\n\n- Manipolazione dei\
          \ metadati, come la riproduzione o la modifica di un JSON\n  Web Token (JWT),\
          \ o un cookie o un campo nascosto\n  manipolati per elevare i privilegi\
          \ o abusare dell'invalidazione del JWT.\n\n- La configurazione errata di\
          \ CORS permette l'accesso all'API da origini non autorizzate/non fidate.\n\
          \n- Forzare la navigazione verso pagine autenticate come utente non autenticato\
          \ o\n  a pagine privilegiate come utente base."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 34          | 55.97%             | 3.81%              | 6.92         \
          \        | 5.93                | 94.55%       | 47.72%       | 318,487 \
          \          | 19,013     |\n\n\n## How to prevent\n\nIl controllo degli accessi\
          \ \xE8 efficace solo nel codice lato server o\nAPI server-less, dove l'attaccante\
          \ non pu\xF2 modificare i meccanismi di controllo dell'accesso\no i metadati.\n\
          \n- Tranne che per le risorse pubbliche, applicare il principio di deny\
          \ by default.\n\n- Implementare i meccanismi di controllo dell'accesso una\
          \ volta sola e riutilizzarli in tutta\n  l'applicazione, incluso limitare\
          \ l'utilizzo di Cross-Origin Resource Sharing (CORS).\n\n- I controlli di\
          \ accesso del Model dovrebbero imporre la propriet\xE0 dei record piuttosto\
          \ che\n  accettare che l'utente possa creare, leggere, aggiornare o cancellare\
          \ qualsiasi\n  record.\n\n- I requisiti unici dei vincoli di business di\
          \ un'applicazione dovrebbero essere applicati nei\n  modelli di dominio.\n\
          \n- Disabilitare il directory listing del server web e garantire che i metadati\
          \ dei file (ad es,\n  .git) e i file di backup non siano presenti all'interno\
          \ delle web roots.\n\n- Registrare i fallimenti dei meccanismi di controllo\
          \ dell'accesso, avvisare gli amministratori quando appropriato (ad es,\n\
          \  fallimenti ripetuti).\n\n- Implementare meccanismi di rate limiting per\
          \ accesso all'API e al controller per minimizzare il danno da\n  strumenti\
          \ di attacco automatizzati.\n\n- Gli identificatori di sessione stateful\
          \ dovrebbero essere invalidati sul server dopo il logout.\n  I token JWT\
          \ stateless dovrebbero piuttosto essere di breve durata in modo che la finestra\
          \ di \n  opportunit\xE0 per un attaccante sia ridotta al minimo. Per i JWT\
          \ di lunga durata \xE8 altamente raccomandato di\n  seguire gli standard\
          \ OAuth per revocare l'accesso.\n\nGli sviluppatori e lo staff di QA dovrebbero\
          \ includere test funzionali di controllo dell'accesso\ne test di integrazione.\n\
          \n\n## Example attack scenarios\n\n**Scenario #1:** L'applicazione usa dati\
          \ non verificati in una chiamata SQL che\nsta accedendo alle informazioni\
          \ dell'account:\n\n```\n pstmt.setString(1, request.getParameter(\"acct\"\
          ));\n ResultSet results = pstmt.executeQuery( );\n```\n\nUn attaccante modifica\
          \ semplicemente il parametro 'acct' del browser per inviare\nnumero di conto\
          \ a piacere. Se il parametro non \xE8 verificato correttamente, l'attaccante\
          \ pu\xF2 accedere all'account di qualsiasi utente.\n\n```\n https://example.com/app/accountInfo?acct=notmyacct\n\
          ```\n\n**Scenario #2:** Un attaccante forza semplicemente la navigazione\
          \ verso gli URL di destinazione. Sono richiesti i diritti di amministratore\
          \ per accedere alla pagina di amministrazione.\n\n```\n https://example.com/app/getappInfo\n\
          \ https://example.com/app/admin_getappInfo\n```\nSe un utente non autenticato\
          \ pu\xF2 accedere a una delle due pagine, \xE8 una falla. Se un non amministratore\
          \ pu\xF2 accedere alla pagina dell'amministratore, questa \xE8 una falla.\n\
          \n\nPer maggiori informazioni sui riferimenti e sull'elenco delle CWE mappate:\
          \ https://top10.owasp.org/2021/it/A01_2021-Broken_Access_Control/"
