      pt:
        name: Falhas de Software e Integridade de Dados
        description: "Falhas na integridade de software e dados est\xE3o relacionadas\
          \ a c\xF3digo e infraestrutura que n\xE3o protegem contra viola\xE7\xF5\
          es de integridade. Um exemplo disso \xE9 quando um aplicativo depende de\
          \ plugins, bibliotecas ou m\xF3dulos de fontes, reposit\xF3rios e redes\
          \ de entrega de conte\xFAdo (CDNs) n\xE3o confi\xE1veis. \nUm pipeline de\
          \ CI/CD inseguro pode introduzir a possibilidade de acesso n\xE3o autorizado,\
          \ c\xF3digo malicioso ou comprometimento do sistema. Por \xFAltimo, muitos\
          \ aplicativos agora incluem funcionalidade de atualiza\xE7\xE3o autom\xE1\
          tica, onde as atualiza\xE7\xF5es s\xE3o baixadas sem verifica\xE7\xE3o de\
          \ integridade suficiente e aplicadas ao aplicativo previamente confi\xE1\
          vel. \nAtacantes podem potencialmente fazer upload de suas pr\xF3prias atualiza\xE7\
          \xF5es para serem distribu\xEDdas e executadas em todas as instala\xE7\xF5\
          es. Outro exemplo \xE9 quando objetos ou dados s\xE3o codificados ou serializados\
          \ em uma estrutura que um atacante pode ver e modificar, o que torna a deserializa\xE7\
          \xE3o insegura."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 10          | 16.67%             | 2.05%              | 6.94         \
          \        | 7.94                | 75.04%       | 45.35%       | 47,972  \
          \          | 1,152      |\n\n\n## How to prevent\n\n- Use assinaturas digitais\
          \ ou mecanismos similares para verificar se o software ou os dados s\xE3\
          o provenientes da fonte esperada e n\xE3o foram alterados.\n\n- Certifique-se\
          \ de que as bibliotecas e depend\xEAncias, como npm ou Maven, est\xE3o consumindo\
          \ reposit\xF3rios confi\xE1veis. Se voc\xEA tiver um perfil de risco mais\
          \ alto, considere hospedar um reposit\xF3rio interno conhecido como bom\
          \ que foi examinado.\n\n- Certifique-se de que uma ferramenta de seguran\xE7\
          a da cadeia de suprimentos de software, como OWASP Dependency Check ou OWASP\
          \ CycloneDX, \xE9 usada para verificar se os componentes n\xE3o cont\xEA\
          m vulnerabilidades conhecidas.\n\n- Certifique-se de que haja um processo\
          \ de revis\xE3o para mudan\xE7as de c\xF3digo e configura\xE7\xE3o para\
          \ minimizar a chance de que c\xF3digo ou configura\xE7\xE3o maliciosos possam\
          \ ser introduzidos no seu pipeline de software.\n\n- Certifique-se de que\
          \ seu pipeline de CI/CD tenha uma segrega\xE7\xE3o adequada, configura\xE7\
          \xE3o e controle de acesso para garantir a integridade do c\xF3digo que\
          \ flui atrav\xE9s dos processos de constru\xE7\xE3o e implanta\xE7\xE3o.\n\
          \n- Certifique-se de que dados serializados n\xE3o assinados ou n\xE3o criptografados\
          \ n\xE3o sejam enviados a clientes n\xE3o confi\xE1veis sem algum tipo de\
          \ verifica\xE7\xE3o de integridade ou assinatura digital para detectar adultera\xE7\
          \xE3o ou retransmiss\xE3o dos dados serializados.\n\n\n## Example attack\
          \ scenarios\n\n**Cen\xE1rio n\xBA 1 Atualiza\xE7\xE3o sem assinatura:**\
          \ Muitos roteadores dom\xE9sticos, set-top boxes, firmware de dispositivos\
          \ e outros n\xE3o verificam as atualiza\xE7\xF5es por meio de firmware assinado.\
          \ Firmware n\xE3o assinado \xE9 um alvo crescente para ataques e espera-se\
          \ que piore ainda mais. Isso \xE9 uma grande preocupa\xE7\xE3o, pois muitas\
          \ vezes n\xE3o h\xE1 mecanismo de remedia\xE7\xE3o a n\xE3o ser corrigir\
          \ em uma vers\xE3o futura e esperar que as vers\xF5es anteriores sejam descontinuadas.\n\
          \n**Cen\xE1rio #2 Atualiza\xE7\xE3o maliciosa do SolarWinds**: Estados-na\xE7\
          \xF5es s\xE3o conhecidos por atacar mecanismos de atualiza\xE7\xE3o, com\
          \ um recente ataque not\xE1vel sendo o ataque SolarWinds Orion. A empresa\
          \ que desenvolve o software tinha processos de integridade de constru\xE7\
          \xE3o e atualiza\xE7\xE3o seguros. Ainda assim, eles foram subvertidos,\
          \ e por v\xE1rios meses, a empresa distribuiu uma atualiza\xE7\xE3o maliciosa\
          \ altamente direcionada para mais de 18.000 organiza\xE7\xF5es, das quais\
          \ cerca de 100 foram afetadas. Esse \xE9 um dos mais amplos e significativos\
          \ viola\xE7\xF5es desse tipo na hist\xF3ria.\n\n**Cen\xE1rio #3 Desserializa\xE7\
          \xE3o Insegura:** Uma aplica\xE7\xE3o React chama um conjunto de microsservi\xE7\
          os Spring Boot. Sendo programadores funcionais, eles tentaram garantir que\
          \ seu c\xF3digo seja imut\xE1vel. A solu\xE7\xE3o que encontraram \xE9 serializar\
          \ o estado do usu\xE1rio e pass\xE1-lo de volta e para frente em cada solicita\xE7\
          \xE3o. Um atacante percebe a assinatura do objeto Java \"rO0\" (em base64)\
          \ e usa a ferramenta Java Serial Killer para obter execu\xE7\xE3o remota\
          \ de c\xF3digo no servidor de aplica\xE7\xE3o.\n\n\nPara mais informa\xE7\
          \xF5es sobre as refer\xEAncias e a lista de CWEs mapeadas: https://top10.owasp.org/2021/pt-BR/A08_2021-Software_and_Data_Integrity_Failures/"
      tr:
        name: Software and Data Integrity Failures
        description: "Software ve data integrity hatalar\u0131; integrity ihlallerine\
          \ kar\u015F\u0131 koruma sa\u011Flamayan code ve infrastructure ile ilgilidir.\
          \ \xD6rne\u011Fin bir uygulaman\u0131n, g\xFCvenilmeyen kaynaklardan, repository\u2019\
          lerden ve content delivery network\u2019lerden (CDN) plugin, library veya\
          \ module\u2019lere dayanmas\u0131. G\xFCvensiz bir CI/CD pipeline, yetkisiz\
          \ eri\u015Fim, malicious code veya sistem compromise riskini art\u0131rabilir.\
          \ Son olarak, bir\xE7ok uygulamada art\u0131k auto-update fonksiyonu vard\u0131\
          r; burada update\u2019ler yeterli integrity do\u011Frulamas\u0131 olmadan\
          \ indirilir ve daha \xF6nce trusted olan uygulamaya uygulan\u0131r. Sald\u0131\
          rganlar potansiyel olarak kendi update\u2019lerini y\xFCkleyip t\xFCm kurulumlara\
          \ da\u011F\u0131t\u0131lmas\u0131n\u0131 ve \xE7al\u0131\u015Ft\u0131r\u0131\
          lmas\u0131n\u0131 sa\u011Flayabilir. Ba\u015Fka bir \xF6rnek; object\u2019\
          lerin veya verilerin attacker\u2019\u0131n g\xF6r\xFCp de\u011Fi\u015Ftirebilece\u011F\
          i bir yap\u0131ya encode veya serialize edilmesi; bu, insecure deserialization\u2019\
          a kar\u015F\u0131 savunmas\u0131zd\u0131r."
        annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
          \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg\
          \ Coverage | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 10          | 16.67%             | 2.05%              | 6.94         \
          \        | 7.94                | 75.04%       | 45.35%       | 47,972  \
          \          | 1,152      |\n\n\n## How to prevent\n\n-   Software veya verinin\
          \ beklenen kaynaktan geldi\u011Fini ve de\u011Fi\u015Ftirilmedi\u011Fini\
          \ do\u011Frulamak i\xE7in dijital imza (digital signature) veya benzeri\
          \ mekanizmalar kullan\u0131n.\n\n-   npm veya Maven gibi library ve dependency\u2019\
          lerin trusted repository\u2019lerden t\xFCketildi\u011Finden emin olun.\
          \ Risk profiliniz y\xFCksekse, vet edilmi\u015F internal known-good bir\
          \ repository bar\u0131nd\u0131rmay\u0131 d\xFC\u015F\xFCn\xFCn.\n\n-   OWASP\
          \ Dependency Check veya OWASP CycloneDX gibi bir software supply chain security\
          \ arac\u0131 kullanarak bile\u015Fenlerin bilinen zafiyetler i\xE7ermedi\u011F\
          ini do\u011Frulay\u0131n.\n\n-   Software pipeline\u2019\u0131n\u0131za\
          \ malicious code veya configuration sokulma olas\u0131l\u0131\u011F\u0131\
          n\u0131 en aza indirmek i\xE7in code ve configuration de\u011Fi\u015Fiklikleri\
          \ i\xE7in bir review s\xFCreci sa\u011Flay\u0131n.\n\n-   CI/CD pipeline\u2019\
          \u0131n\u0131z\u0131n build ve deploy s\xFCre\xE7lerinden ge\xE7en code\u2019\
          un integrity\u2019sini korumak i\xE7in uygun ayr\u0131\u015Ft\u0131rma (segregation),\
          \ configuration ve access control\u2019e sahip oldu\u011Fundan emin olun.\n\
          \n-   \u0130mzalanmam\u0131\u015F veya encrypt edilmemi\u015F serialized\
          \ veriyi, integrity check veya digital signature olmaks\u0131z\u0131n untrusted\
          \ client\u2019lara g\xF6ndermeyin; serialized verinin kurcalanmas\u0131\
          n\u0131 (tampering) veya replay\u2019ini tespit edecek bir mekanizma kullan\u0131\
          n.\n\n\n## Example attack scenarios\n\n**Senaryo #1 \u0130mzas\u0131z update:**\
          \ Bir\xE7ok ev router\u2019\u0131, set-top box, device firmware\u2019i ve\
          \ di\u011Ferleri firmware update\u2019lerini signed olarak do\u011Frulamaz.\
          \ Unsigned firmware, sald\u0131rganlar i\xE7in b\xFCy\xFCyen bir hedeftir\
          \ ve yaln\u0131zca k\xF6t\xFCle\u015Fmesi beklenir. \xC7o\u011Fu zaman remediation\
          \ mekanizmas\u0131 yoktur; bir sonraki versiyonda d\xFCzeltmek ve eski versiyonlar\u0131\
          n kullan\u0131m d\u0131\u015F\u0131 kalmas\u0131n\u0131 beklemekten ba\u015F\
          ka \xE7are olmaz.\n\n**Senaryo #2 SolarWinds malicious update:** Devlet\
          \ akt\xF6rlerinin update mekanizmalar\u0131n\u0131 hedef ald\u0131\u011F\
          \u0131 bilinmektedir; yak\u0131n ge\xE7mi\u015Fte dikkat \xE7eken \xF6rnek\
          \ SolarWinds Orion sald\u0131r\u0131s\u0131d\u0131r. Software\u2019\u0131\
          \ geli\u015Ftiren \u015Firketin secure build ve update integrity s\xFCre\xE7\
          leri vard\u0131; yine de bunlar atlat\u0131ld\u0131 ve birka\xE7 ay boyunca\
          \ 18.000\u2019den fazla kurulu\u015Fa y\xFCksek hedefli malicious bir update\
          \ da\u011F\u0131t\u0131ld\u0131; bunlar\u0131n yakla\u015F\u0131k 100 kadar\u0131\
          \ etkilendi. Bu, t\xFCr\xFCn\xFCn en kapsaml\u0131 ve en \xF6nemli ihlallerinden\
          \ biridir.\n\n**Senaryo #3 Insecure Deserialization:** Bir React uygulamas\u0131\
          \ bir dizi Spring Boot microservice\u2019i \xE7a\u011F\u0131r\u0131yor.\
          \ Fonksiyonel programlama yakla\u015F\u0131m\u0131yla code\u2019u immutable\
          \ tutmak istiyorlar. \xC7\xF6z\xFCm olarak user state\u2019i serialize edip\
          \ her istekte ileri-geri ta\u015F\u0131yorlar. Bir sald\u0131rgan, \u201C\
          rO0\u201D Java object imzas\u0131n\u0131 (base64 i\xE7inde) fark ediyor\
          \ ve Java Serial Killer arac\u0131n\u0131 kullanarak application server\
          \ \xFCzerinde remote code execution elde ediyor.\n\n\nReferanslar ve e\u015F\
          lenen CWE listesi hakk\u0131nda daha fazla bilgi: https://top10.owasp.org/2021/tr/A08_2021-Software_and_Data_Integrity_Failures/"
      zh:
        name: Software and Data Integrity Failures
        description: "\u7A0B\u5F0F\u7801\u6216\u57FA\u7840\u67B6\u6784\u672A\u80FD\
