      de:
        name: Unzureichendes Logging und Sicherheitsmonitoring
        description: "Mit Blick auf die OWASP Top 10 2021 soll diese Kategorie bei\
          \ der Erkennung, Eskalation und Reaktion auf laufende Angriffe unterst\xFC\
          tzen. Ohne Protokollierung und \xDCberwachung k\xF6nnen Angriffe nicht erkannt\
          \ werden. Unzureichende Protokollierung, Erkennung, \xDCberwachung und aktive\
          \ Reaktion sind jederzeit m\xF6glich:\n\n- Nachvollziehbare Ereignisse,\
          \ wie Anmeldungen, fehlgeschlagene Anmeldungen und wertvolle Transaktionen,\
          \ werden nicht protokolliert.\n\n- Warnungen und Fehler erzeugen keine,\
          \ unangemessene oder unklare Log-Eintr\xE4ge.\n\n- Die Logs von Anwendungen\
          \ und APIs werden nicht auf verd\xE4chtige Aktivit\xE4ten \xFCberwacht.\n\
          \n- Protokolle werden nur lokal gespeichert.\n\n- Geeignete Schwellenwerte\
          \ f\xFCr Warnmeldungen und Eskalationsprozesse f\xFCr Gegenma\xDFnahmen\
          \ sind nicht vorhanden oder nicht wirksam.\n\n- Penetrationstests und Scans\
          \ durch DAST-Tools (Dynamic Application Security Testing) (wie OWASP ZAP)\
          \ l\xF6sen keine Alarme aus.\n\n- Die Anwendungen k\xF6nnen Angriffe weder\
          \ in Echtzeit noch nahezu in Echtzeit erkennen, eskalieren oder Alarm schlagen.\n\
          \nEs besteht die Gefahr von Informationslecks, falls Sie die Logging- und\
          \ Alerting Ereignisse f\xFCr Nutzende oder Angreifende sichtbar gemacht\
          \ werden (siehe [A01:2021-Broken Access Control](A01_2021-Broken_Access_Control.md))."
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 4           | 19.23 %             | 6.51 %              | 6.87       \
          \          | 4.99                | 53.67 %       | 39.97 %       | 53,615\
          \            | 242        |\n\n\n## How to prevent\n\nJe nach dem Risiko\
          \ der Anwendung sollten Entwickler einige oder alle der folgenden Ma\xDF\
          nahmen ergreifen:\n\n- Sicherstellen, dass alle Anmeldevorg\xE4nge, Zugriffskontrollen\
          \ und Fehler bei der serverseitigen Eingabe\xFCberpr\xFCfung mit ausreichendem\
          \ Sitzungskontext der Nutzenden erfasst werden, um verd\xE4chtige oder b\xF6\
          swillige Anwendende zu identifizieren und ausreichend lange gespeichert\
          \ werden, um eine sp\xE4tere forensische Analyse zu erm\xF6glichen.\n\n\
          - Stellen Sie sicher, dass die Protokolle in einem Format gespeichert werden,\
          \ das von Protokollmanagement L\xF6sungen leicht verarbeitet werden k\xF6\
          nnen.\n\n- Es sollte sichergestellt werden, dass die Protokolldaten korrekt\
          \ umgewandelt werden, sodass Injection-Angriffe oder Angriffe auf Logging-\
          \ oder \xDCberwachungssysteme verhindert werden.\n    \n- Es soll sichergestellt\
          \ sein, dass hochwertige Transaktionen einen Pr\xFCfpfad mit Integrit\xE4\
          tskontrollen aufweisen um Manipulationen oder L\xF6schungen zu verhindern,\
          \ z. B. durch Datenbanktabellen, die nur erweitert werden k\xF6nnen, oder\
          \ \xE4hnliches.\n\n- DevSecOps-Teams sollten eine effektive \xDCberwachung\
          \ und Alarmierung einrichten, sodass verd\xE4chtige Aktivit\xE4ten schnell\
          \ erkannt und darauf reagiert werden kann.\n\n- Erstellen oder \xFCbernehmen\
          \ Sie einen Notfallplan f\xFCr die Reaktion auf Vorf\xE4lle und f\xFCr die\
          \ Wiederherstellung, wie z. B. dem Leitfaden des National Institute of Standards\
          \ and Technology (NIST) 800-61r2 oder neuer.\n\nEs gibt kommerzielle und\
          \ Open-Source-Frameworks zum Schutz von Anwendungen wie das OWASP ModSecurity\
          \ Core Rule Set, und Open-Source-Log correlation software, wie Elasticsearch,\
          \ Logstash, Kibana (ELK) Stack, die individuelle Dashboards und Warnmeldungen\
          \ bereitstellen.\n\n\n## Example attack scenarios\n\n**Szenario 1:**  Der\
          \ Betreiber der Website eines Anbieters von Kinderkrankenversicherungen\
          \ konnte das Eindringen in das System aufgrund mangelnder \xDCberwachung\
          \ und Protokollierung nicht erkennen. Eine externe Partei informierte den\
          \ Krankenversicherungsanbieter, dass Angreifende auf Tausende der mehr als\
          \ 3,5 Millionen sensiblen Gesundheitsdaten der Kinder zugegriffen und diese\
          \ ver\xE4ndert hatten. Eine \xDCberpr\xFCfung nach dem Vorfall ergab, dass\
          \ die Entwickler der Website wesentliche Schwachstellen nicht behoben hatten.\
          \ Da es weder eine Protokollierung noch eine \xDCberwachung des Systems\
          \ gab, bestand die Datenl\xFCcke m\xF6glicherweise bereits seit 2013, also\
          \ \xFCber einen Zeitraum von mehr als sieben Jahren.\n\n**Szenario #2:**\
          \ Bei einer gr\xF6\xDFeren indischen Fluggesellschaft kam es zu einer Datenpanne,\
          \ die mehr als zehn Jahre lang personenbezogene Daten von Millionen von\
          \ Flugg\xE4sten betraf, einschlie\xDFlich Reisepass- und Kreditkartendaten.\
          \ Die Datenpanne trat bei einem externen Cloud-Hosting-Anbieter auf, der\
          \ die Fluggesellschaft nach einiger Zeit \xFCber die L\xFCcke informierte.\n\
          \n**Szenario #3:** Bei einer gro\xDFen europ\xE4ischen Fluggesellschaft\
          \ kam es zu einem meldepflichtigen Versto\xDF gegen die DSGVO. Der Versto\xDF\
          \ wurde Berichten zufolge durch Sicherheitsschwachstellen in Zahlungsanwendungen\
          \ verschuldet, die von Angreifenden ausgenutzt wurden, die mehr als 400.000\
          \ Zahlungsdatens\xE4tze von Kunden abfingen. Die Fluggesellschaft wurde\
          \ daraufhin von der Datenschutzbeh\xF6rde mit einer Geldstrafe von 20 Millionen\
          \ Pfund belegt.\n\n\nWeitere Informationen zu den Referenzen und zur Liste\
          \ der zugeordneten CWEs: https://top10.owasp.org/2021/de/A09_2021-Security_Logging_and_Monitoring_Failures/"
      es:
        name: Fallas en el Registro y Monitoreo
        description: "Volviendo al OWASP Top 10 2021, la intenci\xF3n es apoyar la\
          \ detecci\xF3n, escalamiento y respuesta ante brechas activas. Sin registros\
          \ y monitoreo, las brechas no pueden ser detectadas. Registros, detecciones,\
          \ monitoreo y respuesta activas insuficientes pueden ocurrir en cualquier\
          \ momento:\n\n-   Eventos auditables, tales como los inicios de sesi\xF3\
          n, fallas en el inicio de sesi\xF3n y transacciones de alto valor no son\
          \ registradas.\n\n-   Advertencias y errores generan registros poco claros,\
          \ inadecuados y en algunos casos ni se generan.\n\n-   Registros en aplicaciones\
          \ y API no son monitoreados para detectar actividades sospechosas.\n\n-\
          \   Los registros son \xFAnicamente almacenados en forma local.\n\n-   Los\
          \ umbrales de alerta y procesos de escalamiento no est\xE1n correctamente\
          \ implementados o no son efectivos.\n\n-   Las pruebas de penetraci\xF3\
          n y los escaneos utilizando herramientas de pruebas din\xE1micas de seguridad\
          \ en aplicaciones (como ser OWASP ZAP) no generan alertas.\n\n-   Las aplicaciones\
          \ no logran detectar, escalar, o alertar sobre ataques activos en tiempo\
          \ real ni cercanos al tiempo real.\n\nSe es vulnerable a la fuga de informaci\xF3\
          n haciendo registros y eventos de alertas que sean visibles para un usuario\
          \ o un atacante (consulte [A01: 2021-P\xE9rdida de Control de Acceso](A01_2021-Broken_Access_Control.md))."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom| Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 4           | 19.23%             | 6.51%              | 6.87         \
          \        | 4.99                | 53.67%       | 39.97%       | 53,615  \
          \          | 242        |\n\n\n## How to prevent\n\nLos desarrolladores\
          \ deber\xEDan implementar algunos o todos los siguientes controles, dependiendo\
          \ del riesgo de la aplicaci\xF3n:\n\n-   Aseg\xFArese de que todos los errores\
          \ de inicio de sesi\xF3n, de control de acceso y de validaci\xF3n de entradas\
          \ de datos del lado del servidor se pueden registrar con suficiente contexto\
          \ como para identificar cuentas sospechosas o maliciosas y mantenerlo durante\
          \ el tiempo suficiente para permitir un posterior an\xE1lisis forense.\n\
          \n-   Aseg\xFArese de que los registros se generen en un formato f\xE1cil\
          \ de procesar por las herramientas de gesti\xF3n de registros.\n\n-   Aseg\xFA\
          rese de que los datos de registros son correctamente codificados para prevenir\
          \ inyecciones o ataques en el sistema de monitoreo o registros.\n\n-   Aseg\xFA\
          rese de que las transacciones de alto valor poseen una traza de auditoria\
          \ con controles de integridad para evitar la modificaci\xF3n o el borrado,\
          \ tales como permitir \xFAnicamente la inserci\xF3n en las tablas de base\
          \ de datos o similares.\n\n-   Los equipos de DevSecOps debe establecer\
          \ alertas y monitoreo efectivo tal que se detecte actividades sospechosas\
          \ y responderlas r\xE1pidamente.\n\n-   Establezca o adopte un plan de respuesta\
          \ y recuperaci\xF3n, tal como NIST 800-61r2 o posterior.\n\nExisten frameworks\
          \ de protecci\xF3n de aplicaciones comerciales y de c\xF3digo abierto, tales\
          \ como el conjunto de reglas de ModSecurity de OWASP y el conjunto de programas\
          \ de correlaci\xF3n de registros de c\xF3digo abierto como ser ELK (Elasticsearch,\
          \ Logstash, Kibana) con paneles personalizados y alertas.\n\n\n## Example\
          \ attack scenarios\n\n**Escenario #1:** El sitio web de un prestador de\
          \ salud que provee un plan para ni\xF1os no pudo detectar una brecha debido\
          \ a la falta de monitoreo y registro. Alguien externo inform\xF3 al prestador\
          \ que un atacante hab\xEDa accedido y modificados registros m\xE9dicos sensibles\
          \ de m\xE1s de 3,5 millones de ni\xF1os. Una revisi\xF3n post incidente\
          \ detect\xF3 que los desarrolladores del sitio web no hab\xEDan encontrado\
          \ vulnerabilidades significativas. Como no hubo ni registro ni monitores\
          \ del sistema, la brecha de datos pudo haber estado en proceso desde el\
          \ 2013, por un per\xEDodo de m\xE1s de 7 a\xF1os.\n\n**Escenario #2:** Una\
          \ gran aerol\xEDnea India tuvo una brecha de seguridad que involucr\xF3\
          \ a la p\xE9rdida de datos personales de millones de pasajeros por m\xE1\
          s de 10 a\xF1os, incluyendo pasaportes y tarjetas de cr\xE9dito. La brecha\
          \ se produjo por un proveedor de servicios de almacenamiento en la nube,\
          \ quien notific\xF3 a la aerol\xEDnea despu\xE9s de un tiempo.\n\n**Escenario\
          \ #3:** Una gran aerol\xEDnea Europea sufri\xF3 un incumplimiento de la\
          \ GRPD que debe reportar. La causa de la brecha se debi\xF3 a que un atacante\
          \ explot\xF3 una vulnerabilidad en una aplicaci\xF3n de pago, obteniendo\
          \ m\xE1s de 400,000 registros de pagos de usuarios. La aerol\xEDnea fue\
          \ multada con 20 millones de libras como resultado del regulador de privacidad.\n\
          \n\nPara obtener m\xE1s informaci\xF3n sobre las referencias y la lista\
          \ de CWE asociadas: https://top10.owasp.org/2021/es/A09_2021-Security_Logging_and_Monitoring_Failures/"
      fr:
        name: "Carence des syst\xE8mes de contr\xF4le et de journalisation"
        description: "De retour dans le Top 10 2021 de l'OWASP, cette cat\xE9gorie\
          \ a pour but d'aider \xE0 la d\xE9tection, \xE0 l'escalade et \xE0 la r\xE9\
          ponse aux br\xE8ches actives. Sans journalisation et surveillance, les br\xE8\
          ches ne peuvent \xEAtre d\xE9tect\xE9es. Une journalisation, une d\xE9tection,\
          \ une surveillance et une r\xE9ponse active insuffisantes peuvent survenir\
          \ \xE0 tout moment :\n\n- les traces d\u2019audit, telles que les acc\xE8\
          s r\xE9ussis ou \xE9chou\xE9s et les transactions sensibles, ne sont pas\
          \ enregistr\xE9es ;\n- les alertes et les erreurs g\xE9n\xE9r\xE9es ne sont\
          \ pas enregistr\xE9es, ou leur journalisation est inad\xE9quate, ou impr\xE9\
          cise ;\n- les journaux des applications et des API ne sont pas contr\xF4\
          l\xE9s pour d\xE9tecter les actions suspectes ;\n- les journaux ne sont\
          \ stock\xE9s que localement ;\n- aucun processus de seuil d\u2019alerte\
          \ convenable ni de remont\xE9es d'information pour y r\xE9pondre n'ont \xE9\
          t\xE9 d\xE9finis, ou ils sont inad\xE9quats, ou inefficaces ;\n- les tests\
          \ d'intrusion et de balayage avec des outils de test dynamique de s\xE9\
          curit\xE9 des applications (DAST), tels que OWASP ZAP, ne g\xE9n\xE8rent\
          \ pas d'alertes ;\n- l\u2019application est incapable de d\xE9tecter, de\
          \ g\xE9n\xE9rer des remont\xE9es d'information et des alertes en temps r\xE9\
          el, ou assimil\xE9, en cas d\u2019attaque active.\n\nVous \xEAtes vuln\xE9\
          rable \xE0 une fuite d\u2019information en rendant les enregistrements de\
          \ journalisation et d\u2019alertes accessibles \xE0 vos utilisateurs ou\
          \ attaquants (voir [A01:2021-Contr\xF4les d'acc\xE8s d\xE9faillants](A01_2021-Broken_Access_Control.md))."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       4        |       19,23 %        |         6,51 %         |     \
          \        6,87              |         4,99         |    53,67 %     |   \
          \   39,97 %       |           53 615           |         242          |\n\
          \n\n## How to prevent\n\nLes d\xE9veloppeurs doivent mettre en \u0153uvre\
          \ tout ou partie des contr\xF4les suivants, en fonction du risque de l'application\
          \ :\n\n- s'assurer que toutes les authentifications, les erreurs de contr\xF4\
          le d'acc\xE8s et de contr\xF4le des entr\xE9es c\xF4t\xE9 serveur sont enregistr\xE9\
          es, avec un contexte utilisateur suffisant pour identifier les comptes suspects\
          \ ou malveillants, et conserv\xE9es suffisamment longtemps pour permettre\
          \ une analyse l\xE9gale diff\xE9r\xE9e ;\n- s'assurer que les enregistrements\
          \ des journaux sont dans un format standard pour permettre de les int\xE9\
          grer facilement \xE0 une solution de gestion de logs centralis\xE9e ;\n\
          - veiller \xE0 ce que les donn\xE9es des journaux soient correctement encod\xE9\
          es afin d'\xE9viter les injections ou les attaques sur les syst\xE8mes de\
          \ journalisation ou de surveillance ;\n- s'assurer que les transactions\
          \ \xE0 haute valeur ajout\xE9e ont une piste d'audit, avec un contr\xF4\
          le d'int\xE9grit\xE9, pour \xE9viter la modification ou la suppression,\
          \ comme des tables de bases de donn\xE9es en ajout seul ou \xE9quivalent\
          \ ;\n- les \xE9quipes DevSecOps devraient mettre en place une supervision\
          \ et une gestion d'alertes efficaces pour d\xE9tecter et r\xE9agir aux actions\
          \ suspectes en temps opportun ;\n- d\xE9finir ou adopter un plan de r\xE9\
          action et de reprise sur incident, comme celui du *National Institute of\
          \ Standards and Technology* (NIST) 800-61r2 ou ult\xE9rieur.\n\nOn trouve\
          \ des logiciels, commerciaux ou open source, de protection d'applications\
          \ tels que OWASP ModSecurity Core Rule Set, et des logiciels de corr\xE9\
          lation de journaux, comme la pile Elasticsearch, Logstash, Kibana (ELK),\
          \ qui propose des tableaux de bord et d'alertes configurables.\n\n\n## Example\
          \ attack scenarios\n\n**Sc\xE9nario n\xB01** : l'op\xE9rateur du site Web\
          \ d'un fournisseur de soins de sant\xE9 pour enfants n'a pas pu d\xE9tecter\
          \ une violation en raison d'un manque de surveillance et de journalisation.\
          \ Une partie externe a inform\xE9 le fournisseur du plan de sant\xE9 qu'un\
          \ attaquant avait acc\xE9d\xE9 et modifi\xE9 des milliers de dossiers m\xE9\
          dicaux sensibles de plus de 3,5 millions d'enfants. Un examen post\xE9rieur\
          \ \xE0 l'incident a r\xE9v\xE9l\xE9 que les d\xE9veloppeurs du site Web\
          \ n'avaient pas corrig\xE9 d'importantes vuln\xE9rabilit\xE9s. Comme il\
          \ n'y avait pas de journalisation ou de surveillance du syst\xE8me, la violation\
          \ de donn\xE9es pourrait \xEAtre en cours depuis 2013, soit une p\xE9riode\
          \ de plus de sept ans.\n\n**Sc\xE9nario n\xB02** : une grande compagnie\
          \ a\xE9rienne indienne a subi une violation de donn\xE9es portant sur plus\
          \ de dix ans de donn\xE9es personnelles de millions de passagers, y compris\
          \ des donn\xE9es de passeport et de carte de cr\xE9dit. La violation des\
          \ donn\xE9es s'est produite chez un fournisseur tiers d'h\xE9bergement en\
          \ nuage, qui a inform\xE9 la compagnie a\xE9rienne de la violation apr\xE8\
          s un certain temps.\n\n**Sc\xE9nario n\xB03** : une grande compagnie a\xE9\
          rienne europ\xE9enne a subi une violation \xE0 d\xE9clarer au titre de la\
          \ RGPD. La violation aurait \xE9t\xE9 caus\xE9e par des vuln\xE9rabilit\xE9\
          s de s\xE9curit\xE9 des applications de paiement exploit\xE9es par des attaquants,\
          \ qui ont r\xE9colt\xE9 plus de 400 000 enregistrements de paiement de clients.\
          \ La compagnie a\xE9rienne a \xE9t\xE9 condamn\xE9e \xE0 une amende de 20\
          \ millions de livres sterling en cons\xE9quence par le r\xE9gulateur de\
          \ la vie priv\xE9e.\n\n\nPour plus d\u2019informations sur les r\xE9f\xE9\
          rences et la liste des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A09_2021-Security_Logging_and_Monitoring_Failures/"
      id:
        name: Kegagalan dalam Keamanan Logging dan Monitoring
        description: "Kembali ke OWASP Top 2021, Kategori ini membantu untuk mendeteksi,\
          \ meningkatkan dan respon\nterhadap penjebolan yang sedang aktif. Tanpa\
          \ mencatat dan memonitor, penjebolan tidak\ndapat dideteksi. Ketidakcukup\
          \ melakukan log, deteksi, memonitor dan respon aktif terjadi setiap waktu:\n\
          \n-   Kejadian yang dapat di Audit, seperti login,\n    kegagalan login\
          \ dan transaksi dengan nilai yang tinggi tidak di catat.\n\n-   Peringatan\
          \ dan Error tidak menghasilkan pencatatan yang \n    memadai atau catatan\
          \ pesan yang tidak jelas.\n\n-   Log dari aplikasi dan API tidak di monitor\
          \ untuk aktifitas mencurigakan.\n\n-   Log hanya disimpan secara lokal.\n\
          \n-   Threshold peringatan yang sesuai dan proses dari respon eskalasi tidak\
          \ efektif.\n\n-   Tool Penetration testing dan Scan dari dynamic application\
          \ security testing (DAST) (seperti OWASP ZAP) tidak memicu peringatan.\n\
          \n-   Aplikasi tidak dapat mendeteksi, mengeskalasi atau memperingati untuk\
          \ serangan aktif\n    di waktu sebenarnya(real-time) atau bahkan mendekati\
          \ waktu sebenarnya.\n\nAnda sangatlah rentan terhadap kebocoran data saat\
          \ pencatatan dan peringatan kejadian\nterlihat kepada user atau bahkan penyerang\
          \ (lihat A01:2021 - Broken Access Control)"
        annotation: "## Score table\n\n| Klasifikasi CWE | Tingkat Kejadian Maksimum\
          \ | Rata - Rata Tingkat kejadian | Cakupan Maksimum | Rata - Rata Cakupan\
          \ | Rata-rata Bobot Eksploitasi | Rata - Rata Bobot Dampak | Total Kejadian\
          \ | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 4           | 19.23%             | 6.51%              | 53.67%       |\
          \ 39.97%       | 6.87                 | 4.99                | 53,615   \
          \         | 242        |\n\n\n## How to prevent\n\nPengembang harus mengimplementasikan\
          \ beberapa atau semua kontrol dibawah ini\nyang tergantung pada risiko dari\
          \ aplikasi:\n\n-   Pastikan semua kesalahan login, kontrol akses dan validasi\
          \ input dari server-side\n    dapat di catat dengan konteks pengguna yang\
          \ cukup untuk mengidentifikasikan\n    akun yang mencurigakan atau jahat\
          \ serta catatan tersebut di simpan\n    dengan waktu yang cukup untuk analisa\
          \ forensik yang terlambat.\n\n-   Pastikan semua catatan dihasilkan dalam\
          \ format dimana \n    solusi pengelola catatan dapat dengan mudah digunakan.\n\
          \n-   Pastikan data catatan telah di encode dengan benar untuk \n    mencegah\
          \ injeksi atau serangan pada pencatatan atau sistem monitor.  \n\n-   Pastikan\
          \ transaksi dengan nilai yang tinggi \n    memiliki jejak audit dengan kontrol\
          \ integritas\n    untuk mencegah gangguan dan penghapusan, \n    seperti\
          \ hanya dapat ditambahkan ke database atau yang mirip seperti itu.\n\n-\
          \   Tim DevSecOps harus membuat monitoring secara efektif dalam memonitor\
          \ dan memperingati\n    aktifitas mencurigakan yang terdeteksi dan merespon\
          \ secara cepat.\n\n-   Membuat atau adopsi sebuah respon insiden dan rencana\
          \ pemulihan, \n    seperti NIST 800-61r2 atau versi atas nya.\n\nThere are\
          \ commercial and open-source application protection frameworks\nsuch as\
          \ the OWASP ModSecurity Core Rule Set, and open-source log\ncorrelation\
          \ software, such as the ELK stack, that feature custom\ndashboards and alerting.\n\
          \n\n## Example attack scenarios\n\n**Skenario #1:** oeprator website Provider\
          \ Rencana Kesehatan anak-anak \ntidak dapat mendeteksi penerobosan dikarenakan\
          \ kurang nya dalam memonitor\ndan mencatat. pihak luar menginformasikan\
          \ kepada provider bahwa penyerang\nmemiliki akses dan telah memodifikasi\
          \ ribuan rekam medis yang sensitif\ndari 3.5 juta anak. tinjauan pasca insiden\
          \ telah menemukan bahwa\npengembang website tidak menindak kerentanan yang\
          \ signifikan. \nseperti disana tidak ada pencatatan atau pemonitoran dari\
          \ sistem,\npenjebolan data telah berperkembang dari tahun 2013, penjebolan\n\
          telah aktif lebih dari periode tujuh tahun.\n\n**Skenario #2:** Sebuah perusahaan\
          \ penerbangan india besar telah terbobol yang \nlebih dari 10 tahun melibatkan\
          \ jutaan data penumpang. termasuk\npassport dan data kartu kredit. Pembobolan\
          \ data terjadi saat\nthird party cloud dari hosting provider, tidak menotifikasi\n\
          bahwa sistem penerbangan tersebut telah di bobol untuk beberapa waktu.\n\
          \n**Skenario #3:** Sebuah perusahaan penerbangan eropa besar menderita sebuah\
          \ kebobolan\nlaporan GDPR yang dapat dilaporkan. Kebobolan tersebut telah\
          \ dikabrkan\ndikarenakan oleh kerentanan aplikasi keamanan pembayaran di\
          \ eksploitasi\npenyerang yang telah memanen lebih dari 400.000 rekam pembayaran\
          \ pelanggan.\nperushaan penerbangan tersebut telah di denda sebesar 20 juta\
          \ pound \nsehingga menghasilkan pengatur privacy.\n\n\nUntuk informasi lebih\
          \ lanjut tentang referensi dan daftar CWE yang dipetakan: https://top10.owasp.org/2021/id/A09_2021-Security_Logging_and_Monitoring_Failures/"
      it:
        name: Security Logging and Monitoring Failures
        description: "Tornando alla Top 10 2021 di OWASP, questa categoria \xE8 per\
          \ aiutare a rilevare,\nsvolgere escalation e rispondere alle violazioni\
          \ attive. Senza logging e\nmonitoraggio, le violazioni non possono essere\
          \ rilevate. Il logging,\nil rilevamento, il monitoraggio e la risposta attiva\
          \ insufficienti si verificano ogni volta che:\n\n-   Gli eventi verificabili,\
          \ come i login, i login falliti e le transazioni ad alto valore, non vengono\
          \ registrati.\n\n-   Warning ed errori non generano messaggi di log, oppure\
          \ sono inadeguati o poco chiari.\n\n-   I log di applicazioni e API non\
          \ sono monitorati per attivit\xE0 sospette.\n\n-   I file di log vengono\
          \ memorizzati solo localmente.\n\n-   Non sono presenti o sono inefficaci\
          \ le soglie di allarme e processi di escalation della risposta\n\n-   I\
          \ penetration test e le scansioni da parte di strumenti DAST (Dynamic Application\
          \ Security Testing) (come OWASP ZAP) \n    non attivano nessun allarme.\n\
          \n-   L'applicazione non \xE8 in grado di rilevare, svolgere escalation\
          \ o avvisare per gli attacchi attivi\n    in real-time o quasi in real-time.\
          \ \n\nSi \xE8 vulnerabili alla fuga di informazioni se gli eventi di logging\
          \ e gli alert sono\nvisibili ad un utente o ad un attaccante (vedi [A01:2021-Broken\
          \ Access Control](A01_2021-Broken_Access_Control.md))."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 4           | 19.23%             | 6.51%              | 6.87         \
          \        | 4.99                | 53.67%       | 39.97%       | 53,615  \
          \          | 242        |\n\n\n## How to prevent\n\nGli sviluppatori dovrebbero\
          \ implementare alcuni o tutti i seguenti controlli, \na seconda del rischio\
          \ dell'applicazione:\n\n-   Assicurarsi che tutti i login, il controllo\
          \ degli accessi e gli errori a seguito della verifica degli input lato server\n\
          \    possono essere registrati con un contesto utente sufficiente per identificare\n\
          \    account sospetti o malevoli e conservati per un tempo sufficiente a\
          \ consentire\n    un'analisi forense a posteriori.\n\n-   Assicurarsi che\
          \ i log siano generati in un formato che le soluzioni di gestione dei log\n\
          \    possano facilmente consumare.\n\n-   Assicurarsi che i dati di log\
          \ siano codificati correttamente per prevenire injection o\n    attacchi\
          \ ai sistemi di registrazione o monitoraggio.\n\n-   Assicurarsi che le\
          \ transazioni di alto valore abbiano un audit trail con controlli di integrit\xE0\
          \n    per prevenire manomissioni o cancellazioni, come le tabelle append-only\
          \ di un database, o simili.\n\n-   I team DevSecOps dovrebbero stabilire\
          \ sistemi di monitoraggio di allerta efficaci\n    in modo che le attivit\xE0\
          \ sospette siano rilevate e affrontate rapidamente.\n\n-   Stabilire o adottare\
          \ un piano incident response e recovery, come ad esempio il\n    National\
          \ Institute of Standards and Technology (NIST) 800-61r2 o successivo.\n\n\
          Ci sono framework di protezione delle applicazioni commerciali e open-source\n\
          come l'OWASP ModSecurity Core Rule Set, e software di correlazione dei log\
          \ open-source, \ncome Elasticsearch, Logstash, Kibana (ELK) che dispongono\
          \ di dashboard e sistemi di alerting personalizzati.\n\n\n## Example attack\
          \ scenarios\n\n**Scenario #1:** L'operatore del sito web di un fornitore\
          \ di piani sanitari per bambini\nnon ha potuto rilevare una violazione a\
          \ causa di una mancanza di logging e monitoraggio. Una\nterza parte ha informato\
          \ il fornitore del piano sanitario che un attaccante aveva\nacceduto e modificato\
          \ migliaia di cartelle cliniche di pi\xF9 di\n3,5 milioni di bambini. Una\
          \ indagine post-incidente ha rilevato che gli sviluppatori del sito web\n\
          non avevano corretto delle vulnerabilit\xE0 significative presenti. Poich\xE9\
          \ non c'era\nnessuna forma di logging o monitoraggio del sistema, la violazione\
          \ dei dati potrebbe essere stata\nin corso dal 2013, un periodo di pi\xF9\
          \ di sette anni.\n\n**Scenario #2:** Una grande compagnia aerea indiana\
          \ ha subito una violazione dei dati che ha coinvolto \npi\xF9 di dieci anni\
          \ di dati personali di milioni di passeggeri, compresi i dati dei passaporti\
          \ e delle carte di credito. \nLa violazione dei dati si \xE8 verificata\
          \ presso un fornitore di hosting cloud di terze parti, \nche ha notificato\
          \ la compagnia aerea della violazione dopo qualche tempo.\n\n**Scenario\
          \ #3:** Una grande compagnia aerea europea ha subito una violazione riferibile\
          \ al GDPR. \nLa violazione \xE8 stata causata da delle vulnerabilit\xE0\
          \ dell'applicazione di pagamento \nsfruttate dagli aggressori, che hanno\
          \ raccolto pi\xF9 di 400.000\nrecord di pagamento dei clienti. A seguito\
          \ di ci\xF2, la compagnia aerea \xE8 stata multata 20 milioni di sterline\
          \ \ndal garante della privacy.\n\n\nPer maggiori informazioni sui riferimenti\
          \ e sull'elenco delle CWE mappate: https://top10.owasp.org/2021/it/A09_2021-Security_Logging_and_Monitoring_Failures/"
