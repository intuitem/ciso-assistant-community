          \u0645\u0629 CWE \u0627\u0644\u0645\u0639\u064A\u0651\u0646\u0629: https://top10.owasp.org/2021/ar/A04_2021-Insecure_Design/"
      de:
        name: Unsicheres Anwendungsdesign
        description: "Unsicheres Design ist eine umfassende Kategorie, die verschiedene\
          \ Schwachstellen umfasst und als \u201Efehlendes oder ineffektives Design\
          \ von Schutzmechanismen\u201C beschrieben wird.Unsicheres Anwendungsdesign\
          \ ist nicht die Ursache f\xFCr alle anderen Top-10-Risikokategorien. Es\
          \ gibt einen Unterschied zwischen unsicherem Design und unsicherer Implementierung.\
          \ Designfehler und Implementierungsfehler unterscheiden sich aus gutem Grund,\
          \ da sie unterschiedliche Ursachen und Mitigationen erfordern. Ein sicheres\
          \ Design kann immer noch Implementierungsfehler enthalten, die zu ausnutzbaren\
          \ Schwachstellen f\xFChren. Ein unsicheres Design l\xE4sst sich nicht durch\
          \ eine perfekte Implementierung beheben, da die notwendigen Sicherheitskontrollen\
          \ von vornherein nicht zur Abwehr bestimmter Angriffe vorgesehen waren.\
          \ Ein Faktor, der zu einem unsicheren Design beitr\xE4gt, ist das Fehlen\
          \ eines Gesch\xE4ftsrisikoprofils, das der entwickelten Software oder dem\
          \ System zugrunde liegt, was dazu f\xFChrt, dass das erforderliche Ma\xDF\
          \ an Sicherheitsdesign nicht bestimmt wird.\n\n### Anforderungs- und Ressourcenmanagement\n\
          \nLegen Sie zusammen mit den Gesch\xE4ftseinheiten die fachlichen Anforderungen\
          \ an die Anwendung fest, einschlie\xDFlich des Schutzbedarfs hinsichtlich\
          \ Vertraulichkeit, Integrit\xE4t, Verf\xFCgbarkeit und Authentizit\xE4t\
          \ aller Datenbest\xE4nde, sowie die vorgesehene Gesch\xE4ftslogik. Ber\xFC\
          cksichtigen Sie, wie exponiert Ihre Anwendung sein wird und ob Sie (zus\xE4\
          tzlich zur Zugangskontrolle) eine Mandantentrennung ben\xF6tigt. Stellen\
          \ Sie die technischen Anforderungen zusammen, einschlie\xDFlich funktionaler\
          \ und nicht funktionaler Sicherheitsanforderungen. Planen Sie das Budget\
          \ f\xFCr alle Design-, Entwicklungs-, Test- und Betriebsaktivit\xE4ten,\
          \ unter Ber\xFCcksichtigung der Sicherheit.\n\n\n### Sicheres Design\n\n\
          Sicheres Design ist sowohl eine Denkweise als auch eine Vorgehensweise,\
          \ die kontinuierlich Bedrohungen analysiert und sicherstellt, dass der Code\
          \ robust entwickelt und getestet wird, um bekannte Angriffsmethoden zu verhindern.\
          \ Die Bedrohungsmodellierung sollte in *Backlog Refinement* Terminen oder\
          \ vergleichbaren Aktivit\xE4ten integriert werden. Dabei sollten \xC4nderungen\
          \ im Datenfluss, in der Zugriffskontrolle und anderen Sicherheitsma\xDF\
          nahmen \xFCberpr\xFCft werden. Identifizieren Sie w\xE4hrend der Entwicklung\
          \ der User Story die richtigen Ablauf- und Fehlerzust\xE4nde und stellen\
          \ Sie sicher, dass sie gut verstanden sind und die Verantwortlichen und\
          \ sonstigen Beteiligten dazu \xFCbereinstimmen. Analysieren Sie Annahmen\
          \ und Bedingungen f\xFCr erwartete sowie fehlgeschlagene Prozesse, um sicherzustellen,\
          \ dass diese weiterhin angemessen und die erw\xFCnschten sind. Bestimmen\
          \ Sie, wie Annahmen \xFCberpr\xFCft und Bedingungen erzwingt werden k\xF6\
          nnen, die f\xFCr das korrekte Verhalten erforderlich sind. Stellen Sie sicher,\
          \ dass die Ergebnisse in der User Story dokumentiert sind. Lernen Sie aus\
          \ Fehlern und bieten Sie positive Anreize, um kontinuierliche Verbesserungen\
          \ voranzutreiben. Sicheres Design ist weder ein Add-on noch ein Tool, das\
          \ Sie einer Software hinzuf\xFCgen k\xF6nnen.\n\n### Sicherer Entwicklungslebenszyklus\n\
          \nSichere Software erfordert einen sicheren Entwicklungslebenszyklus, den\
          \ Einsatz von sicheren Entwurfsmustern, eine bew\xE4hrte Methodik, sichere\
          \ Komponentenbibliotheken, geeignete Tools und Bedrohungsmodellierung. Wenden\
          \ Sie sich zu Beginn eines Softwareprojekts w\xE4hrend der gesamten Projektlaufzeit\
          \ und Wartung Ihrer Software an Ihre Sicherheitsspezialisten. Erw\xE4gen\
          \ Sie die Nutzung des [OWASP Software Assurance Maturity Model (SAMM)](https://owaspsamm.org),\
          \ um Ihre Bem\xFChungen zur sicheren Softwareentwicklung zu strukturieren."
        annotation: "## Score table\n\n| Zugeordnete CWEs | Maximale H\xE4ufigkeit\
          \ | Durchschn. H\xE4ufigkeit | Durchschn. Ausnutzbarkeit (gewichtet) | Durchschn.\
          \ Auswirkungen (gewichtet) | Maximale Abdeckung | Durchschnittliche Abdeckung\
          \ | Gesamtanzahl | CVEs insgesamt |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 40          | 24.19 %             | 3.00 %              | 6.46       \
          \          | 6.78                | 77.25 %       | 42.51 %       | 262,407\
          \           | 2,691      |\n\n\n## How to prevent\n\n- Entwickeln und nutzen\
          \ Sie einen sicheren Entwicklungslebenszyklus mit Unterst\xFCtzung durch\
          \ AppSec-Experten bei der Bewertung und Gestaltung von Sicherheits- und\
          \ Datenschutzkontrollen.\n\n- Erstellen und verwenden Sie eine Bibliothek\
          \ mit sicheren Entwurfsmustern und bew\xE4hrten, erprobten Komponenten.\n\
          \n- Verwenden Sie Bedrohungsmodellierung f\xFCr kritische Bereiche wie Authentifizierung,\
          \ Zugriffskontrolle, Gesch\xE4ftslogik und wichtige Abl\xE4ufe.\n\n- Integrieren\
          \ Sie Sicherheitsvorgaben und -kontrollen in den User Stories.\n\n- Implementieren\
          \ Sie Plausibilit\xE4tspr\xFCfungen auf allen Ebenen Ihrer Anwendung, vom\
          \ Frontend bis zum Backend.\n\n- Schreiben Sie Unit- und Integrationstests,\
          \ um zu validieren, dass alle kritischen Abl\xE4ufe resistent gegen das\
          \ Bedrohungsmodell sind. Stellen Sie Anwendungs- *und* Missbrauchsf\xE4\
          lle f\xFCr jede Ebene Ihrer Anwendung zusammen.\n\n- Trennen Sie die Ebenen\
          \ basierend auf Gef\xE4hrdungs- und Schutzbedarf auf System- und Netzwerkebene.\n\
          \n- Stellen Sie sicher, dass die Trennung der Mandanten konsequent auf allen\
          \ Ebenen erfolgt.\n\n- Begrenzen Sie den Ressourcenverbrauch pro Nutzerin/Nutzer\
          \ oder Dienst\n\n\n## Example attack scenarios\n\n**Szenario Nr. 1:** Ein\
          \ Workflow zur Wiederherstellung von Anmeldeinformationen kann \u201EFragen\
          \ und Antworten\u201C enthalten, was jedoch gem\xE4\xDF NIST 800-63b, dem\
          \ OWASP ASVS und den OWASP Top 10 nicht zul\xE4ssig ist. Fragen und Antworten\
          \ k\xF6nnen nicht als vertrauensw\xFCrdiger Identit\xE4tsnachweis  betrachtet\
          \ werden. Mehr als eine Person kann die Antworten kennen, weshalb sie verboten\
          \ sind. Dieser Code sollte entfernt und durch ein sichereres Design ersetzt\
          \ werden.\n\n**Szenario Nr. 2:** Eine Kinokette bietet Gruppenbuchungsrabatte\
          \ an und verlangt erst bei mehr als f\xFCnfzehn Besuchern eine Anzahlung.\
          \ Angreifende k\xF6nnten dieses System ausnutzen, indem sie versuchen, mit\
          \ wenigen Anfragen sechshundert Sitzpl\xE4tze in allen Kinos gleichzeitig\
          \ zu reservieren, was zu erheblichen Einnahmeverlusten f\xFChren k\xF6nnte.\n\
          \n**Szenario Nr. 3:** Die E-Commerce-Website einer Einzelhandelskette ist\
          \ nicht vor Bots gesch\xFCtzt, die von Scalpern betrieben werden, die High-End-Grafikkarten\
          \ kaufen, um sie auf Auktionsplattformen weiterzuverkaufen. Dies sorgt f\xFC\
          r schreckliche Publicity bei den Grafikkartenherstellern und Besitzern von\
          \ Einzelhandelsketten und sorgt f\xFCr anhaltende Frustration bei Enthusiasten,\
          \ die diese Karten nicht erwerben k\xF6nnen. Sorgf\xE4ltiges Anti-Bot-Design\
          \ sowie Automatismen, die z. B. K\xE4ufe ablehnen, die innerhalb weniger\
          \ Sekunden nach Verf\xFCgbarkeit get\xE4tigt werden, k\xF6nnen helfen, unechte\
          \ K\xE4ufe zu identifizieren und solche Transaktionen zu verhindern.\n\n\
          \nWeitere Informationen zu den Referenzen und zur Liste der zugeordneten\
          \ CWEs: https://top10.owasp.org/2021/de/A04_2021-Insecure_Design/"
      es:
        name: "Dise\xF1o Inseguro"
        description: "El dise\xF1o inseguro es una categor\xEDa amplia que representa\
          \ diferentes debilidades, expresadas como \"dise\xF1o de control faltante\
          \ o ineficaz\". El dise\xF1o inseguro no es la fuente de las otras 10 categor\xED\
          as. Existe una diferencia entre un dise\xF1o inseguro y una implementaci\xF3\
          n insegura. Distinguimos entre fallas de dise\xF1o y defectos de implementaci\xF3\
          n por un motivo, difieren en la causa ra\xEDz y remediaciones. Incluso un\
          \ dise\xF1o seguro puede tener defectos de implementaci\xF3n que conduzcan\
          \ a vulnerabilidades que pueden explotarse. Un dise\xF1o inseguro no se\
          \ puede arreglar con una implementaci\xF3n perfecta, ya que, por definici\xF3\
          n, los controles de seguridad necesarios nunca se crearon para defenderse\
          \ de ataques espec\xEDficos. Uno de los factores que contribuyen al dise\xF1\
          o inseguro es la falta de perfiles de riesgo empresarial inherentes al software\
          \ o sistema que se est\xE1 desarrollando y, por lo tanto, la falta de determinaci\xF3\
          n del nivel de dise\xF1o de seguridad que se requiere.\n\n### Gesti\xF3\
          n de requerimientos y recursos\n\nRecopile y negocie los requerimientos\
          \ para la aplicaci\xF3n con el negocio, incluidos los requisitos de protecci\xF3\
          n relacionados con la confidencialidad, integridad, disponibilidad y autenticidad\
          \ de todos los activos de datos y la l\xF3gica de negocio esperada. Tenga\
          \ en cuenta qu\xE9 tan expuesta estar\xE1 su aplicaci\xF3n y si necesita\
          \ segregaci\xF3n de funcionalidades (adem\xE1s del control de acceso). Recopile\
          \ los requerimientos t\xE9cnicos, incluidos los funcionales de seguridad\
          \ y los no funcionales. Planifique y negocie que el presupuesto cubra el\
          \ dise\xF1o, construcci\xF3n, prueba y operaci\xF3n, incluyendo las actividades\
          \ de seguridad.\n\n### Dise\xF1o seguro\n\nEl dise\xF1o seguro es una cultura\
          \ y metodolog\xEDa que eval\xFAa constantemente las amenazas y garantiza\
          \ que el c\xF3digo est\xE9 dise\xF1ado y probado de manera s\xF3lida para\
          \ prevenir m\xE9todos de ataque conocidos. El modelado de amenazas debe\
          \ estar integrado en sesiones de refinamiento (o actividades similares);\
          \ buscar cambios en los flujos de datos y el control de acceso u otros controles\
          \ de seguridad. Durante la creaci\xF3n de las historias de usuario, determine\
          \ el flujo correcto y los estados de falla. Aseg\xFArese de que sean bien\
          \ entendidos y acordados por las partes responsables e impactadas. Analice\
          \ las suposiciones y las condiciones para los flujos esperados y de falla,\
          \ aseg\xFArese de que a\xFAn sean precisos y deseables. Determine c\xF3\
          mo validar las suposiciones y hacer cumplir las condiciones necesarias para\
          \ los comportamientos adecuados. Aseg\xFArese de que los resultados est\xE9\
          n documentados en las historias de usuario. Aprenda de los errores y ofrezca\
          \ incentivos positivos para promover mejoras. El dise\xF1o seguro no es\
          \ un complemento ni una herramienta que pueda agregar al software.\n\n###\
          \ Ciclo de Desarrollo Seguro (S-SDLC)\n\nEl software seguro requiere un\
          \ ciclo de desarrollo seguro, alguna forma de patr\xF3n de dise\xF1o seguro,\
          \ metodolog\xEDas de carretera pavimentada (\"paved road\"), bibliotecas\
          \ de componentes seguros, herramientas y modelado de amenazas. Comun\xED\
          quese con sus especialistas en seguridad desde el comienzo y durante todo\
          \ el proyecto, as\xED como durante su fase de mantenimiento. Considere aprovechar\
          \ el [Modelo de Madurez para el Aseguramiento del Software (SAMM)](https://owaspsamm.org)\
          \ para ayudar a estructurar sus esfuerzos de desarrollo de software seguro."
        annotation: "## Score table\n\n| CWEs mapeadas | Tasa de incidencia m\xE1\
          x | Tasa de incidencia prom | Explotabilidad ponderada prom| Impacto ponderado\
          \ prom | Cobertura m\xE1x | Cobertura prom | Incidencias totales | Total\
          \ CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 40          | 24.19%             | 3.00%              | 6.46         \
          \        | 6.78                | 77.25%       | 42.51%       | 262,407 \
          \          | 2,691      |\n\n\n## How to prevent\n\n- Establezca y use un\
          \ ciclo de desarrollo seguro apoyado en Profesionales en Seguridad de Aplicaciones\
          \ para ayudarlo a evaluar y dise\xF1ar la seguridad y controles relacionados\
          \ con la privacidad.\n\n- Establezca y utilice un cat\xE1logo de patrones\
          \ de dise\xF1o seguros o componentes de \"camino pavimentado\" listos para\
          \ ser utilizados.\n\n- Utilice el modelado de amenazas para flujos cr\xED\
          ticos de autenticaci\xF3n, control de acceso, l\xF3gica de negocio y todo\
          \ clave.\n\n- Integre el lenguaje y los controles de seguridad en las historias\
          \ de usuario.\n\n- Integre verificaciones de viabilidad en cada capa de\
          \ su aplicaci\xF3n (desde el frontend al backend).\n\n- Escriba pruebas\
          \ unitarias y de integraci\xF3n para validar que todos los flujos cr\xED\
          ticos son resistentes al modelo de amenazas. Recopile casos de uso *y* casos\
          \ de mal uso para cada capa de la aplicaci\xF3n.\n\n- Separe las capas del\
          \ sistema y las capas de red seg\xFAn las necesidades de exposici\xF3n y\
          \ protecci\xF3n.\n\n- Separe a los tenants de manera robusta por dise\xF1\
          o en todos los niveles.\n\n- Limitar el consumo de recursos por usuario\
          \ o servicio.\n\n\n## Example attack scenarios\n\n**Escenario #1:** Un flujo\
          \ de trabajo de recuperaci\xF3n de credenciales puede incluir \"preguntas\
          \ y respuestas\", lo cual est\xE1 prohibido por NIST 800-63b, OWASP ASVS\
          \ y OWASP Top 10. No se puede confiar en preguntas y respuestas como evidencia\
          \ de identidad ya que m\xE1s de una persona puede conocer las respuestas.\
          \ Dicho c\xF3digo debe eliminarse y reemplazarse por un dise\xF1o m\xE1\
          s seguro.\n\n**Escenario #2:** Una cadena de cines permite descuentos en\
          \ la reserva de grupos y tiene un m\xE1ximo de quince asistentes antes de\
          \ solicitar un dep\xF3sito. Los atacantes podr\xEDan modelar este flujo\
          \ y probar si pod\xEDan reservar seiscientos asientos en todos los cines\
          \ a la vez utilizando unas pocos pedidos, lo que provocar\xEDa grandes p\xE9\
          rdidas de ingresos.\n\n**Escenario #3:** El sitio web de comercio electr\xF3\
          nico de una cadena minorista no tiene protecci\xF3n contra bots administrados\
          \ por revendedores que compran tarjetas de video de alta gama para revender\
          \ sitios web de subastas. Esto crea una publicidad terrible para los fabricantes\
          \ de tarjetas de video y los propietarios de cadenas minoristas y una mala\
          \ sangre duradera con\nentusiastas que no pueden obtener estas tarjetas\
          \ a ning\xFAn precio. El dise\xF1o cuidadoso de anti automatizaci\xF3n y\
          \ las reglas de l\xF3gica de negocio, como compras realizadas a los pocos\
          \ segundos de disponibilidad, pueden identificar compras no aut\xE9nticas\
          \ y rechazar dichas transacciones.\n\n\nPara obtener m\xE1s informaci\xF3\
          n sobre las referencias y la lista de CWE asociadas: https://top10.owasp.org/2021/es/A04_2021-Insecure_Design/"
      fr:
        name: "Conception non s\xE9curis\xE9e"
        description: "Conception non s\xE9curis\xE9e est une vaste cat\xE9gorie repr\xE9\
          sentant diff\xE9rentes insuffisances, exprim\xE9es par \xAB contr\xF4les\
          \ de conception manquants ou inefficaces \xBB. La conception non s\xE9curis\xE9\
          e n'est pas la source de toutes les autres cat\xE9gories de risques du Top\
          \ 10. Il existe une diff\xE9rence entre une conception non s\xE9curis\xE9\
          e et une impl\xE9mentation non s\xE9curis\xE9e. Nous diff\xE9rencions les\
          \ d\xE9fauts de conception et les d\xE9fauts d'impl\xE9mentation pour une\
          \ raison, ils ont des causes racines et des mesures correctives diff\xE9\
          rentes. Une conception s\xE9curis\xE9e peut toujours pr\xE9senter des d\xE9\
          fauts d'impl\xE9mentations conduisant \xE0 des vuln\xE9rabilit\xE9s pouvant\
          \ \xEAtre exploit\xE9es. Une conception non s\xE9curis\xE9e ne peut pas\
          \ \xEAtre corrig\xE9e par une impl\xE9mentation parfaite car, par d\xE9\
          finition, les contr\xF4les de s\xE9curit\xE9 n\xE9cessaires n'ont jamais\
          \ \xE9t\xE9 cr\xE9\xE9s pour se d\xE9fendre contre des attaques sp\xE9cifiques.\
          \ L'un des facteurs qui contribuent \xE0 la conception non s\xE9curis\xE9\
          e est le manque de profilage des risques commerciaux inh\xE9rent au logiciel\
          \ ou au syst\xE8me en cours de d\xE9veloppement, et donc l'incapacit\xE9\
          \ \xE0 d\xE9terminer le niveau de s\xE9curit\xE9 requis.\n\n### Gestion\
          \ des exigences et des ressources\n\nRecueillez et n\xE9gociez les exigences\
          \ m\xE9tier pour une application avec les \xE9quipes fonctionnelles, y compris\
          \ les exigences de s\xE9curit\xE9 concernant la confidentialit\xE9, l'int\xE9\
          grit\xE9, la disponibilit\xE9 et l'authenticit\xE9 de l'ensemble des donn\xE9\
          es et de la logique m\xE9tier attendue. Prenez compte du degr\xE9 d'exposition\
          \ de votre application et si vous avez besoin de s\xE9parer les tenants\
          \ (en plus du contr\xF4le d'acc\xE8s). Rassemblez les exigences techniques,\
          \ y compris les exigences de s\xE9curit\xE9 fonctionnelles et non fonctionnelles.\
          \ Planifiez et n\xE9gociez le budget couvrant l'ensemble de la conception,\
          \ de la construction, des tests et de l'exploitation, y compris les activit\xE9\
          s de s\xE9curit\xE9.\n\n### Conception s\xE9curis\xE9e\n\nLa conception\
          \ s\xE9curis\xE9e est une culture et une m\xE9thodologie qui \xE9value en\
          \ permanence les menaces et garanti que le code est con\xE7u et test\xE9\
          \ de mani\xE8re robuste pour emp\xEAcher les m\xE9thodes d'attaques connues.\
          \ La mod\xE9lisation des menaces doit \xEAtre int\xE9gr\xE9e aux sessions\
          \ de *refinement* (ou activit\xE9s similaires) et rechercher des changements\
          \ dans les flux de donn\xE9es et le contr\xF4le d'acc\xE8s. Dans les *user\
          \ stories*, d\xE9terminez le cas passant et les \xE9tats d'\xE9checs, assurez-vous\
          \ qu'ils sont bien compris et accept\xE9s par les parties responsables et\
          \ impact\xE9es. Analysez les hypoth\xE8ses et les conditions pour les cas\
          \ passants et en \xE9checs, assurez-vous qu'ils sont toujours exacts et\
          \ souhait\xE9s. D\xE9terminez comment valider les hypoth\xE8ses et mettez\
          \ en place les conditions n\xE9cessaires pour un comportement appropri\xE9\
          . Assurez-vous que les r\xE9sultats sont document\xE9s dans la *user story*.\
          \ Apprenez de vos erreurs, incitez et faites la promotion des am\xE9liorations.\
          \ La conception s\xE9curis\xE9e n'est ni un module compl\xE9mentaire, ni\
          \ un outil que vous pouvez ajouter au logiciel.\n\n### Cycle de d\xE9veloppement\
          \ s\xE9curis\xE9\n\nUn logiciel s\xE9curis\xE9 n\xE9cessite un cycle de\
          \ vie de d\xE9veloppement s\xE9curis\xE9, une m\xE9thode de conception s\xE9\
          curis\xE9e, une voie pav\xE9e, une biblioth\xE8que de composants s\xE9curis\xE9\
          s, des outils et une mod\xE9lisation des menaces. Faites appel \xE0 vos\
          \ sp\xE9cialistes de la s\xE9curit\xE9 tout au long du projet et de la maintenance\
          \ de votre logiciel. Essayez de tirer parti de l'[OWASP Software Assurance\
          \ Maturity Model (SAMM)](https://owaspsamm.org) pour vous aider \xE0 structurer\
          \ vos efforts de d\xE9veloppement s\xE9curis\xE9."
        annotation: "## Score table\n\n| CWEs associ\xE9es | Taux d'incidence max\
          \ | Taux d'incidence moyen | Exploitation pond\xE9r\xE9e moyenne | Impact\
          \ pond\xE9r\xE9 moyen | Couverture max | Couverture moyenne | Nombre total\
          \ d'occurrences | Nombre total de CVEs |\n|:--------------:|:--------------------:|:----------------------:|:-----------------------------:|:--------------------:|:--------------:|:------------------:|:--------------------------:|:--------------------:|\n\
          |       40       |       24,19 %        |         3,00 %         |     \
          \        6,46              |         6,78         |    77,25 %     |   \
          \   42,51 %       |          262 407           |        2 691         |\n\
          \n\n## How to prevent\n\n- mettez en place et utilisez un cycle de vie de\
          \ d\xE9veloppement s\xE9curis\xE9 avec des professionnels de la s\xE9curit\xE9\
          \ applicative pour aider \xE0 \xE9valuer et \xE0 concevoir des contr\xF4\
          les li\xE9s \xE0 la s\xE9curit\xE9 et \xE0 la confidentialit\xE9 ;\n- mettez\
          \ en place et utilisez une biblioth\xE8que de mod\xE8les de conception s\xE9\
          curis\xE9s ou de composants pr\xEAts \xE0 l'emploi pour une voie pav\xE9\
          e ;\n- utilisez la mod\xE9lisation des menaces pour l'authentification critique,\
          \ le contr\xF4le d'acc\xE8s, la logique m\xE9tier et la gestion de cl\xE9\
          s ;\n- int\xE9grez les contr\xF4les de s\xE9curit\xE9 dans les *user stories*\
          \ ;\n- int\xE9grez des contr\xF4les de vraisemblance \xE0 chaque niveau\
          \ de votre application (du frontend au backend) ;\n- \xE9crivez des tests\
          \ unitaires et d'int\xE9gration pour valider que tous les flux critiques\
          \ sont r\xE9sistants aux mod\xE8les de menaces. Assemblez des cas d'usage\
          \ *et* des cas de d\xE9tournement pour chaque niveau de votre application\
          \ ;\n- s\xE9parez les couches syst\xE8mes et r\xE9seaux en fonction de l'exposition\
          \ et des besoins de protection ;\n- s\xE9parez les tenants via une conception\
          \ robuste sur l'ensemble des niveaux ;\n- restreignez les ressources par\
          \ utilisateur ou service.\n\n\n## Example attack scenarios\n\n**Sc\xE9nario\
          \ 1 :** Un processus de r\xE9cup\xE9ration d'informations d'identification\
          \ peut inclure des \xAB&nbsp;questions secr\xE8tes&nbsp;\xBB, ce qui est\
          \ interdit par le NIST 800-63b, l'OWASP ASVS et le Top 10 de l'OWASP. Les\
          \ questions et les r\xE9ponses ne peuvent pas \xEAtre consid\xE9r\xE9es\
          \ comme une preuve d'identit\xE9, car plus d'une personne peut conna\xEE\
          tre les r\xE9ponses, c'est pourquoi elles sont interdites. Un tel code doit\
          \ \xEAtre supprim\xE9 et remplac\xE9 par une conception plus s\xE9curis\xE9\
          e.\n\n**Sc\xE9nario 2 :** Une cha\xEEne de cin\xE9ma permet des r\xE9ductions\
          \ sur les r\xE9servations de groupe et compte un maximum de quinze participants\
          \ avant d'exiger un acompte. Les attaquants pourraient mod\xE9liser ce cas\
          \ d'usage et tester s'ils peuvent r\xE9server six cents places et tous les\
          \ cin\xE9mas \xE0 la fois en quelques demandes, provoquant une perte massive\
          \ de revenus.\n\n**Sc\xE9nario 3 :** Le site e-commerce d'une cha\xEEne\
          \ de vente au d\xE9tail n'est pas prot\xE9g\xE9 contre les robots qui ach\xE8\
          tent des cartes vid\xE9o haut de gamme pour les revendre sur le march\xE9\
          \ noir. Cela cr\xE9e une mauvaise publicit\xE9 pour les fabricants de cartes\
          \ vid\xE9o et les propri\xE9taires de cha\xEEnes de vente au d\xE9tail,\
          \ provoque du ressentiment de la part des acheteurs qui ne peuvent pas se\
          \ procurer ces cartes quel qu'en soit le prix. Des r\xE8gles prudentes de\
          \ conception anti-bot, telles que les achats effectu\xE9s dans les quelques\
          \ secondes suivant la disponibilit\xE9, peuvent identifier des achats non\
          \ authentiques et rejeter de telles transactions.\n\n\nPour plus d\u2019\
          informations sur les r\xE9f\xE9rences et la liste des CWE mapp\xE9es : https://top10.owasp.org/2021/fr/A04_2021-Insecure_Design/"
      id:
        name: Rancangan Tak Aman
        description: 'Desain yang tidak aman adalah sebuah representasi kategori yang
          luas dari banyak kelemahan yang berbeda, yang diekspresikan sebagai "desain
          kontrol yang tidak ada atau kurang efisien." Desain tidak aman bukan sumber
          dari semua kategori risiko Top 10 yang lain. Ada perbedaan antara desain
          tidak aman dan implementasi tidak aman. Kami membedakan antara cacat desain
          dan kerusakan implementasi karena suatu alasan, mereka memiliki akar masalah
          dan remediasi yang berbeda. Sebuah desain aman masih bisa memiliki kerusakan
          implementasi yang mengarah ke kerentanan yang dapat dieksploitasi. Suatu
          desain tidak aman tidak dapat diperbaiki oleh sebuah implementasi yang sempurna
          karena menurut definisi, kendali keamanan yang diperlukan tidak pernah dibuat
          untuk bertahan terhadap serangan tertentu. Satu dari faktor yang berkontribusi
          terhadap desain tidak aman adalah ketiadaan pembuatan profil risiko bisnis
          yang inheren dalam perangkat lunak atau sistem yang sedang dikembangkan,
          maka menjadi kegagagalan untuk menentukan desain keamanan level apa yang
          diperlukan.


          ### Persyaratan dan Manajemen Sumber Daya


          Kumpulkan dan negosiasikan persyaratan bisnis bagi suatu aplikasi dengan
          pemilik bisnis, termasuk persyaratan perlindungan menyangkut kerahasiaan,
          integritas, ketersediaan, dan otentisitas dari semua aset data dan logika
          bisnis yang diharapkan. Perhitungkan akan seberapa terpapar aplikasi Anda
          dan bila Anda perlu segregasi tenant (sebagai tambahan ke kendali akses).
          Kumpulkan persyaratkan teknis, termasuk persyaratan keamanan fungsional
          dan non-fungsional. Rencanakan dan negosiasikan budget yang mencakup semua
          desain, build, uji coba, dan operasi, termasuk aktivitas-aktivitas keamanan.


          ### Desain Aman


          Desain yang aman adalah sebuah budaya dan metodologi yang secara konstan
          mengevaluasi ancaman dan memastikan bahwa kode yang telah didesain dan dites
          sudah kuat (robust) untuk mencegah metode penyerangan yang telah diketahui.
          Pemodelan ancaman mesti diintegrasikan ke sesi-sesi ''refinement'' (atau
          aktivitas-aktivitas serupa); cari perubahan dalam aliran data dan kendali
          akses atau kendali keamanan lain. Dalam pengembangan cerita pengguna tentukan
          aliran yang benar dan keadaan-keadaan gagal, memastikan bahwa mereka dipahami
          dengan baik dan disetujui oleh pihak-pihak yang bertanggung jawab dan terdampak.
          Analisis asumsi dan kondisi bagi aliran gagal dan yang diharapkan, pastikan
          bahwa mereka masih akurat dan dikehendaki. Tentukan bagaimana memvalidasi
          asumsi dan menegakkan kondisi yang diperlukan untuk perilaku yang layak.
          Pastikan hasil didokumentasikan dalam cerita pengguna. Belajar dari kesalahan
          dan tawarkan insentif positif untuk mempromosikan perbaikan. Desain aman
          bukanlah tambahan atau perkakas yang dapat Anda tambahkan ke perangkat lunak.


          ### Siklus Hidup Pengembangan Aman


          Perangkat lunak aman memerlukan sebuah siklus hidup pengembangan aman, beberapa
          bentuk pola desain aman, metodologi ''paved road'', pustaka komponen yang
          diamankan, ''tooling'', dan pemodelan ancaman. Hubungi spesialis keamanan
          Anda di awal proyek perangkat lunak untuk keseluruhan proyek dan pemeliharaan
          perangkat lunak Anda. Pertimbangkan untuk memanfaatkan [OWASP Software Assurance
          Maturity Model (SAMM)](https://owaspsamm.org) untuk membantu menstrukturkan
          upaya pengembangan perangkat lunak aman Anda.'
        annotation: "## Score table\n\n| CWE Dipetakan | Tingkat Kejadian Maksimum\
          \ | Rata - Rata Tingkat kejadian | Rata-rata Eksploitasi Terbobot | Rata-rata\
          \ Dampak Terbobot | Cakupan Maksimum | Rata-rata Cakupan | Total Kejadian\
          \ | Total CVE |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 40          | 24,19%             | 3,00%              | 6,46         \
          \        | 6,78                | 77,25%       | 42,51%       | 262.407 \
          \          | 2.691      |\n\n\n## How to prevent\n\n-   Buat dan gunakan\
          \ alur pengembangan aman dengan para profesional AppSec\n    untuk membantu\
          \ dalam mengevaluasi dan mendesain keamanan serta kontrol \n    yang terkait\
          \ privasi\n\n-   Buat dan gunakan sebuah pustaka dari design pattern yang\
          \ aman atau gunakan \n    komponen jalan beraspal siap pakai\n\n-   Gunakan\
          \ pemodelan ancaman untuk autentikasi kritis, kontrol akses, logika \n \
          \   bisnis, dan alur-alur kunci\n\n-   Integrasikan kendali dan bahasa keamanan\
          \ ke dalam cerita pengguna\n\n-   Integrasikan uji plausabilitas pada setiap\
          \ tier dari aplikasi Anda (dari \n    frontend ke backend)\n\n-   Tulis\
          \ tes unit dan tes integrasi untuk memvalidasi bahwa semua aliran \n   \
          \ kritis tahan ke pemodelan ancaman. Kompail use-case dan misuse-case bagi\
          \ \n    setiap tier aplikasi Anda\n\n-   Segregasikan lapisan tier pada\
          \ sistem dan lapisan jaringan bergantung pada \n    kebutuhan eksposur dan\
          \ proteksi\n\n-   Segregasikan tenant secara robust dengan desain pada seluruh\
          \ tier\n\n-   Batasi konsumsi sumber daya oleh pengguna atau layanan\n\n\
          \n## Example attack scenarios\n\n**Skenario #1:** Sebuah alur kerja untuk\
          \ pemulihan kredensial mungkin\ntermasuk \"pertanyaan dan jawaban\" yang\
          \ telah dilarang oleh NIST 800-63b,\nOWASP ASVS, dan OWASP TOP 10. Pertanyaan\
          \ dan jawaban tidak dapat dipercayai\nsebagai bukti dari identitas dimana\
          \ bisa jadi jawaban diketahui lebih\ndari satu orang, dimana inilah mengapa\
          \ mereka dilarang. Kode seperti\nitu harus dihilangkan dan diganti dengan\
          \ desain yang lebih aman.\n\n**Skenario #2:** Sebuah bioskop memungkinkan\
          \ agar mendapatkan diskon bila\nmemesan secara grup dan memiliki maksimal\
          \ 15 peserta sebelum memerlukan deposit.\nPenyerang dapat memodelkan sebuah\
          \ ancaman untuk alur ini dan mereka melakukan\npengujian apakah mereka dapat\
          \ memesan enam ratus kursi dan semua bioskop\ndalam satu waktu dengan request\
          \ yang sedikit, hal ini menyebabkan hilangnya pemasukan\nsecara besar-besaran\
          \ oleh bioskop tersebut.\n\n**Skenario #3:**  Sebuah situs web e-commerce\
          \ rantai retail tidak memiliki \nperlindungan dari bot yang dijalankan oleh\
          \ \"scalper\" untuk membeli kartu grafis\nkelas tinggi untuk dijual kembali\
          \ di website tersebut. Hal ini membuat image \njelek dari pembuat kartu\
          \ grafis dan pemiliki rantai retail dan membuat \npenggemar kecewa dikarenakan\
          \ tidak bisa mendapat kartu ini pada harga apa pun. \nHati-hati juga desain\
          \ anti-bot dan aturan logika domain, seperti pembelian yang\ndilakukan beberapa\
          \ detik setelah ketersediaan mungkin mengidentifikasikan\n pembelian tidak\
          \ autentik dan menolak beberapa transaksi.\n\n\nUntuk informasi lebih lanjut\
          \ tentang referensi dan daftar CWE yang dipetakan: https://top10.owasp.org/2021/id/A04_2021-Insecure_Design/"
      it:
        name: Insecure Design
        description: "Insecure design \xE8 un'ampia categoria che rappresenta diverse\
          \ debolezze, espressa come \"progettazione inefficace o mancante dei controlli\
          \ di sicurezza\". Il design insicuro non \xE8 la fonte di tutte le altre\
          \ categorie di rischio nella Top 10. Design insicuro e implementazione insicura\
          \ sono differenti. Distinguiamo tra difetti di progettazione e difetti di\
          \ implementazione per un motivo: hanno cause e rimedi diversi. Un design\
          \ sicuro pu\xF2 ancora avere difetti di implementazione che portano a vulnerabilit\xE0\
          \ che possono essere sfruttate. Un design insicuro non pu\xF2 essere corretto\
          \ da un'implementazione perfetta, poich\xE9 per definizione, i controlli\
          \ di sicurezza necessari non sono mai stati creati per difendersi da attacchi\
          \ specifici. Uno dei fattori che contribuiscono al design insicuro \xE8\
          \ la mancanza di un profilo di rischio aziendale inerente al software o\
          \ al sistema che viene sviluppato, e quindi il fallimento nel determinare\
          \ quale livello di security design \xE8 richiesto.\n\n### Requisiti e gestione\
          \ delle risorse\n\nRaccogliere e negoziare i requisiti di business per un'applicazione\
          \ con l'azienda, compresi i requisiti di protezione relativi a riservatezza,\
          \ integrit\xE0, disponibilit\xE0 e autenticit\xE0 di tutte le risorse di\
          \ dati e la logica di business prevista. Prendete in considerazione quanto\
          \ sar\xE0 esposta la vostra applicazione e se avete bisogno della segregazione\
          \ dei tenants (oltre al controllo degli accessi). Compilare i requisiti\
          \ tecnici, compresi i requisiti di sicurezza funzionali e non funzionali.\
          \ Pianificare e negoziare il budget che copre tutte le attivit\xE0 di progettazione,\
          \ costruzione, test e funzionamento, comprese quelle di sicurezza.\n\n###\
          \ Secure Design\n\nIl secure design \xE8 una cultura e una metodologia che\
          \ valuta costantemente le minacce e assicura che il codice sia progettato\
          \ e testato in modo robusto per prevenire attacchi conosciuti. La fase di\
          \ threat modeling dovrebbe essere integrata nelle sessioni di perfezionamento\
          \ (o attivit\xE0 simili); prestare particolare attenzione ai cambiamenti\
          \ nei flussi di dati e nel controllo degli accessi o altri controlli di\
          \ sicurezza. Nello sviluppo della user story determinare il flusso corretto\
          \ e gli stati considerati invalidi, assicurarsi che siano ben compresi e\
          \ concordati dalle parti responsabili e interessate. Analizzare i presupposti\
          \ e le condizioni per i flussi attesi e non attesi, assicurarsi che siano\
          \ ancora accurati e auspicabili. Determinare come convalidare i presupposti\
          \ e applicare le condizioni necessarie per i comportamenti corretti. Assicurarsi\
          \ che i risultati siano documentati nella user story. Imparare dagli errori\
          \ e offrire incentivi positivi per promuovere i miglioramenti. La progettazione\
          \ sicura non \xE8 n\xE9 un add-on n\xE9 uno strumento che si pu\xF2 aggiungere\
          \ al software.\n\n### Secure Development Lifecycle\n\nIl software sicuro\
          \ richiede un ciclo di vita di sviluppo sicuro, una qualche forma di modello\
          \ di progettazione sicuro, una metodologia paved road, una libreria di componenti\
          \ sicura, strumenti e threat modeling. Rivolgetevi agli specialisti della\
          \ sicurezza all'inizio di un progetto software per tutto il progetto e la\
          \ manutenzione del vostro software. Considerate di sfruttare il [OWASP Software\
          \ Assurance Maturity Model (SAMM)](https://owaspsamm.org) per aiutare a\
          \ strutturare i vostri sforzi di sviluppo del software sicuro."
        annotation: "## Score table\n\n| CWEs corrispondenti | Tasso di incidenza\
          \ Max | Tasso di incidenza Medio | Sfruttabilit\xE0 pesata | Impatto Medio\
          \ | Copertura Max | Copertura media | Occorrenze Totali | CVE Totali |\n\
          |:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 40          | 24.19%             | 3.00%              | 6.46         \
          \        | 6.78                | 77.25%       | 42.51%       | 262,407 \
          \          | 2,691      |\n\n\n## How to prevent\n\n-   Stabilire e utilizzare\
          \ un ciclo di vita di sviluppo sicuro con i professionisti di AppSec\n \
          \   per aiutare a valutare e progettare la sicurezza e i controlli relativi\
          \ alla privacy\n\n-   Stabilire e utilizzare una libreria di design pattern\
          \ sicuri o\n    componenti pronti all'uso\n\n-   Usare il threat modeling\
          \ per i componenti di autenticazione pi\xF9 critici, il controllo     dell'accesso,\
          \ logica di business e flussi chiave\n\n-   Integrare il linguaggio e i\
          \ controlli di sicurezza nelle user stories\n\n-   Integrare i controlli\
          \ di plausibilit\xE0 ad ogni livello della vostra applicazione\n    (dal\
          \ frontend al backend)\n\n-   Scrivere test unitari e di integrazione per\
          \ convalidare che tutti i flussi critici \n    siano resistenti al modello\
          \ di minaccia rappresentato. Compilare i casi d'uso *e* i casi di uso improprio\
          \ per ogni livello della vostra applicazione.\n\n-   Segregare i tier su\
          \ livelli di sistema e di rete a seconda delle\n    esigenze di esposizione\
          \ e protezione.\n\n-   Segregare i tenant in modo robusto by design in tutti\
          \ i tier.\n\n-   Limitare il consumo di risorse per utente o servizio\n\n\
          \n## Example attack scenarios\n\n**Scenario #1:**  Un flusso per il recupero\
          \ delle credenziali potrebbe includere \"domande\ne risposte\", che \xE8\
          \ proibito da NIST 800-63b, OWASP ASVS e\nOWASP Top 10. Domande e risposte\
          \ non possono essere attendibili come prova di\nidentit\xE0 in quanto pi\xF9\
          \ di una persona pu\xF2 conoscere le risposte, ed \xE8 per questo che sono\n\
          state proibite. Tale codice dovrebbe essere rimosso e sostituito con un\
          \ design pi\xF9\npi\xF9 sicuro.\n\n**Scenario #2:** Una catena di cinema\
          \ permette sconti per prenotazioni di gruppo e ha un\nmassimo di quindici\
          \ partecipanti prima di richiedere un pagamento. Gli attaccanti potrebbero\n\
          svolgere il threat modeling di questo flusso e testare se possono prenotare\
          \ seicento posti in\ntutti i cinema in una volta sola con poche richieste,\
          \ causando una massiccia perdita di incassi.\n\n**Scenario #3:** Il sito\
          \ di e-commerce di una catena di negozi non ha\nprotezione contro i bot\
          \ gestiti da scalper che comprano schede video di fascia alta per\nrivenderle\
          \ su siti di aste online. Questo crea una terribile pubblicit\xE0 per i\
          \ produttori di schede video e i proprietari di catene di vendita al dettaglio\
          \ e il perdurare del cattivo sangue con\nappassionati che non possono acquistare\
          \ queste schede in nessun modo. Un'attenta progettazione anti-bot e regole\
          \ di logica di dominio, come gli acquisti effettuati entro pochi\nsecondi\
          \ dalla disponibilit\xE0, potrebbero identificare gli acquisti non autentici\
          \ e\nrespingere tali transazioni.\n\n\nPer maggiori informazioni sui riferimenti\
          \ e sull'elenco delle CWE mappate: https://top10.owasp.org/2021/it/A04_2021-Insecure_Design/"
