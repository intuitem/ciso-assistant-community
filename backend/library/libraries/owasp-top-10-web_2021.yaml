          \u306E\u624B\u6BB5\u3067\u3042\u308B\u3002\n\n-   \u30B9\u30C6\u30FC\u30C8\
          \u30D5\u30EB\u306A\u30BB\u30C3\u30B7\u30E7\u30F3\u8B58\u5225\u5B50\u306F\
          \u3001\u30ED\u30B0\u30A2\u30A6\u30C8\u5F8C\u306B\u306F\u30B5\u30FC\u30D0\
          \u30FC\u4E0A\u3067\u7121\u52B9\u3068\u3055\u308C\u308B\u3079\u304D\u3067\
          \u3042\u308B\u3002\u30B9\u30C6\u30FC\u30C8\u30EC\u30B9\u306AJWT\u30C8\u30FC\
          \u30AF\u30F3\u306F\u3001\u653B\u6483\u8005\u306E\u6A5F\u4F1A\u3092\u6700\
          \u5C0F\u306B\u3059\u308B\u305F\u3081\u306B\u3001\u3080\u3057\u308D\u77ED\
          \u547D\u3067\u3042\u308B\u3079\u304D\u3067\u3042\u308B\u3002\u5BFF\u547D\
          \u306E\u9577\u3044JWT\u306E\u5834\u5408\u306F\u3001\u30A2\u30AF\u30BB\u30B9\
          \u3092\u53D6\u308A\u6D88\u3059\u305F\u3081\u306BOAuth\u6A19\u6E96\u306B\u5F93\
          \u3046\u3053\u3068\u304C\u5F37\u304F\u63A8\u5968\u3055\u308C\u308B\u3002\
          \n\n\u958B\u767A\u8005\u3068QA\u30B9\u30BF\u30C3\u30D5\u306F\u3001\u30A2\
          \u30AF\u30BB\u30B9\u5236\u5FA1\u306B\u95A2\u3059\u308B\u6A5F\u80FD\u9762\
          \u3067\u306E\u5358\u4F53\u53CA\u3073\u7D50\u5408\u30C6\u30B9\u30C8\u3092\
          \u53D6\u308A\u5165\u308C\u308B\u3079\u304D\u3067\u3059\u3002\n\n\n## Example\
          \ attack scenarios\n\n**\u30B7\u30CA\u30EA\u30AA #1:** \u30A2\u30D7\u30EA\
          \u30B1\u30FC\u30B7\u30E7\u30F3\u304C\u3001\u30A2\u30AB\u30A6\u30F3\u30C8\
          \u60C5\u5831\u306B\u30A2\u30AF\u30BB\u30B9\u3059\u308BSQL\u547C\u51FA\u3057\
          \u306B\u672A\u691C\u8A3C\u306E\u30C7\u30FC\u30BF\u3092\u4F7F\u7528\u3057\
          \u3066\u3044\u307E\u3059\u3002\n\n```\n pstmt.setString(1, request.getParameter(\"\
          acct\"));\n ResultSet results = pstmt.executeQuery( );\n```\n\n\u653B\u6483\
          \u8005\u306F\u3001\u5358\u306B\u30D6\u30E9\u30A6\u30B6\u3067\u30D1\u30E9\
          \u30E1\u30FC\u30BF'acct'\u3092\u4EFB\u610F\u306E\u30A2\u30AB\u30A6\u30F3\
          \u30C8\u756A\u53F7\u306B\u6539\u5909\u3057\u3066\u9001\u4FE1\u3057\u307E\
          \u3059\u3002\u9069\u5207\u306A\u691C\u8A3C\u304C\u306A\u3044\u5834\u5408\
          \u3001\u653B\u6483\u8005\u306F\u4EFB\u610F\u306E\u30A2\u30AB\u30A6\u30F3\
          \u30C8\u306B\u30A2\u30AF\u30BB\u30B9\u3067\u304D\u307E\u3059\u3002\n\n```\n\
          \ https://example.com/app/accountInfo?acct=notmyacct\n```\n\n**\u30B7\u30CA\
          \u30EA\u30AA #2:** \u3042\u308B\u653B\u6483\u8005\u306F\u3001\u30D6\u30E9\
          \u30A6\u30B6\u3067URL\u3092\u6307\u5B9A\u3057\u3066\u30A2\u30AF\u30BB\u30B9\
          \u3057\u307E\u3059\u3002\u7BA1\u7406\u8005\u30DA\u30FC\u30B8\u306B\u30A2\
          \u30AF\u30BB\u30B9\u3059\u308B\u306B\u306F\u7BA1\u7406\u8005\u6A29\u9650\
          \u304C\u5FC5\u8981\u3067\u3059\u3002\n\n```\n https://example.com/app/getappInfo\n\
          \ https://example.com/app/admin_getappInfo\n```\n\u8A8D\u8A3C\u3055\u308C\
          \u3066\u3044\u306A\u3044\u30E6\u30FC\u30B6\u304C\u3053\u308C\u3089\u306E\
          \u30DA\u30FC\u30B8\u306B\u30A2\u30AF\u30BB\u30B9\u3059\u308B\u3053\u3068\
          \u304C\u3067\u304D\u308B\u306A\u3089\u3001\u6B20\u9665\u304C\u3042\u308A\
          \u307E\u3059\u3002\n\u7BA1\u7406\u8005\u3067\u306A\u3044\u4EBA\u304C\u7BA1\
          \u7406\u8005\u306E\u30DA\u30FC\u30B8\u306B\u30A2\u30AF\u30BB\u30B9\u3067\
          \u304D\u308B\u306A\u3089\u3001\u305D\u308C\u3082\u6B20\u9665\u3067\u3059\
          \u3002\n\n\n\u53C2\u8003\u8CC7\u6599\u304A\u3088\u3073\u30DE\u30C3\u30D4\
          \u30F3\u30B0\u3055\u308C\u305FCWE\u306E\u4E00\u89A7\u306B\u3064\u3044\u3066\
          \u3001\u8A73\u3057\u304F\u306F\u3053\u3061\u3089\uFF1A https://top10.owasp.org/2021/ja/A01_2021-Broken_Access_Control/"
      pt:
        name: Quebra de Controle de Acesso
        description: "O controle de acesso imp\xF5e a pol\xEDtica de modo que os usu\xE1\
          rios n\xE3o possam\nagir fora de suas permiss\xF5es pretendidas. As falhas\
          \ normalmente levam\n\xE0 divulga\xE7\xE3o, modifica\xE7\xE3o ou destrui\xE7\
          \xE3o de informa\xE7\xF5es n\xE3o autorizadas\nde todos os dados ou ao desempenho\
          \ de uma fun\xE7\xE3o comercial fora dos\nlimites do usu\xE1rio. Vulnerabilidades\
          \ comuns de controle de acesso incluem:\n\n- Viola\xE7\xE3o do princ\xED\
          pio de privil\xE9gio m\xEDnimo ou nega\xE7\xE3o por padr\xE3o,\n    onde\
          \ o acesso deve ser concedido apenas para determinados recursos,\n    fun\xE7\
          \xF5es ou usu\xE1rios, mas est\xE1 dispon\xEDvel para qualquer pessoa.\n\
          \n- Ignorar verifica\xE7\xF5es de controle de acesso modificando a URL\n\
          \    (adultera\xE7\xE3o de par\xE2metros ou navega\xE7\xE3o for\xE7ada),\
          \ o estado interno\n    do aplicativo, a p\xE1gina HTML ou usando uma ferramenta\
          \ de ataque que\n    modifica as requisi\xE7\xF5es de API.\n\n- Permitir\
          \ a visualiza\xE7\xE3o ou edi\xE7\xE3o da conta de outrem, mediante a\n\
          \    disponibiliza\xE7\xE3o do seu identificador \xFAnico (refer\xEAncias\
          \ diretas\n    n\xE3o seguras a objetos).\n\n- Acessando API sem controles\
          \ de acesso para POST, PUT e DELETE.\n\n- Eleva\xE7\xE3o de privil\xE9gio.\
          \ Agir como um usu\xE1rio sem estar logado\n    ou agir como um administrador\
          \ quando logado como um usu\xE1rio.\n\n- Manipula\xE7\xE3o de metadados,\
          \ como reproduzir ou adulterar um token\n    de controle de acesso _JSON\
          \ Web Token_ (JWT), um cookie ou campo\n    oculto manipulado para elevar\
          \ privil\xE9gios ou abusar da invalida\xE7\xE3o de JWT.\n\n- A configura\xE7\
          \xE3o incorreta do CORS permite o acesso \xE0 API de origens\n    n\xE3\
          o autorizadas / n\xE3o confi\xE1veis.\n\n- For\xE7a a navega\xE7\xE3o para\
          \ p\xE1ginas autenticadas como um usu\xE1rio n\xE3o\n    autenticado ou\
          \ para p\xE1ginas privilegiadas como um usu\xE1rio padr\xE3o."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:-------------------------:|:------------------------:|:--------------------------:|:-----------------------:|:----------------:|:---------------:|:--------------------:|:-------------:|\n\
          | 34            | 55.97%                    | 3.81%                    |\
          \ 6.92                       | 5.93                    | 94.55%        \
          \   | 47.72%          | 318,487              | 19,013        |\n\n\n## How\
          \ to prevent\n\nO controle de acesso s\xF3 \xE9 eficaz em c\xF3digo confi\xE1\
          vel do lado do servidor ou API sem servidor,\nem que o invasor n\xE3o pode\
          \ modificar a verifica\xE7\xE3o de controle de acesso ou metadados.\n\n\
          - Exceto para recursos p\xFAblicos, negar por padr\xE3o.\n\n- Implemente\
          \ mecanismos de controle de acesso uma vez e reutilize-os em todo o aplicativo,\n\
          \    incluindo a minimiza\xE7\xE3o do uso de _Cross-Origin Resource Sharing_\
          \ (CORS).\n\n- Os controles de acesso ao modelo devem impor a propriedade\
          \ do registro em vez de\n    aceitar que o usu\xE1rio possa criar, ler,\
          \ atualizar ou excluir qualquer registro.\n\n- Os requisitos de limite de\
          \ neg\xF3cios de aplicativos exclusivos devem ser\n    impostos por modelos\
          \ de dom\xEDnio.\n\n- Desative a lista de diret\xF3rios do servidor da web\
          \ e certifique-se de que os\n    metadados do arquivo (por exemplo, o _.git_)\
          \ e os arquivos de backup n\xE3o\n    estejam presentes nas ra\xEDzes da\
          \ web (_web roots_).\n\n- Registrar falhas de controle de acesso e alertar\
          \ os administradores quando\n    apropriado (por exemplo, falhas repetidas).\n\
          \n- Limite de taxa o acesso da API e do controlador para minimizar os danos\n\
          \    do conjunto de ferramentas de ataque automatizado.\n\n- Os identificadores\
          \ de sess\xE3o com estado devem ser invalidados no servidor\n    ap\xF3\
          s o logout. Os tokens JWT sem estado devem ter vida curta, para que a\n\
          \    janela de oportunidade para um invasor seja minimizada. Para JWTs de\n\
          \    longa dura\xE7\xE3o, \xE9 altamente recomend\xE1vel seguir os padr\xF5\
          es OAuth para revogar o acesso.\n\nOs desenvolvedores e a equipe de QA devem\
          \ incluir uma unidade de controle de\nacesso funcional e testes de integra\xE7\
          \xE3o.\n\n\n## Example attack scenarios\n\n**Cen\xE1rio #1:** O aplicativo\
          \ usa dados n\xE3o verificados em uma chamada SQL que\nest\xE1 acessando\
          \ informa\xE7\xF5es da conta:\n\n```\n pstmt.setString(1, request.getParameter(\"\
          acct\"));\n ResultSet results = pstmt.executeQuery( );\n```\n\nUm invasor\
          \ simplesmente modifica o par\xE2metro 'acct' do navegador para enviar\n\
          o n\xFAmero de conta que desejar. Se n\xE3o for verificado corretamente,\
          \ o invasor\npode acessar a conta de qualquer usu\xE1rio.\n\n```\n https://example.com/app/accountInfo?acct=notmyacct\n\
          ```\n\n**Cen\xE1rio #2:** Um invasor simplesmente for\xE7a a navega\xE7\xE3\
          o para URLs de destino.\nDireitos de administrador s\xE3o necess\xE1rios\
          \ para acessar a p\xE1gina de administrador.\n\n```\n https://example.com/app/getappInfo\n\
          \ https://example.com/app/admin_getappInfo\n```\nSe um usu\xE1rio n\xE3\
          o autenticado pode acessar qualquer p\xE1gina, \xE9 uma falha.\nSe um n\xE3\
          o administrador pode acessar a p\xE1gina de administra\xE7\xE3o, isso \xE9\
          \ uma falha.\n\n\nPara mais informa\xE7\xF5es sobre as refer\xEAncias e\
          \ a lista de CWEs mapeadas: https://top10.owasp.org/2021/pt-BR/A01_2021-Broken_Access_Control/"
      tr:
        name: "Broken Access Control (K\u0131r\u0131k Eri\u015Fim Kontrol\xFC)"
        description: "Eri\u015Fim kontrol\xFC, kullan\u0131c\u0131lar\u0131n ama\xE7\
          lanan yetkilerinin d\u0131\u015F\u0131na \xE7\u0131kamamas\u0131 i\xE7in\
          \ politikay\u0131 uygular. Hatalar genellikle yetkisiz bilgi if\u015Fas\u0131\
          na, verilerin de\u011Fi\u015Ftirilmesine veya yok edilmesine ya da kullan\u0131\
          c\u0131n\u0131n s\u0131n\u0131rlar\u0131 d\u0131\u015F\u0131nda bir i\u015F\
          levin icra edilmesine yol a\xE7ar. Yayg\u0131n eri\u015Fim kontrol\xFC a\xE7\
          \u0131klar\u0131 \u015Funlard\u0131r:\n\n* Asgari ayr\u0131cal\u0131k (least\
          \ privilege) veya varsay\u0131lan olarak reddet (deny by default) ilkesinin\
          \ ihlali; belirli yetenekler, roller veya kullan\u0131c\u0131lar i\xE7in\
          \ verilmesi gereken eri\u015Fimin herkese a\xE7\u0131k olmas\u0131.\n* URL\u2019\
          yi (parameter tampering/force browsing), uygulaman\u0131n i\xE7 durumunu\
          \ veya HTML sayfas\u0131n\u0131 de\u011Fi\u015Ftirerek ya da API request\u2019\
          lerini de\u011Fi\u015Ftiren bir attack tool kullanarak eri\u015Fim kontrol\
          \ kontrollerinin atlat\u0131lmas\u0131.\n* Benzersiz tan\u0131mlay\u0131\
          c\u0131y\u0131 vererek ba\u015Fkas\u0131n\u0131n hesab\u0131n\u0131 g\xF6\
          r\xFCnt\xFCleme veya d\xFCzenleme (insecure direct object references).\n\
          * POST, PUT ve DELETE i\xE7in access control eksikli\u011Fi bulunan API\u2019\
          lere eri\u015Fim.\n* Yetki y\xFCkseltme (privilege escalation). Login olmadan\
          \ bir kullan\u0131c\u0131 gibi davranmak veya user olarak login iken admin\
          \ gibi davranmak.\n* Metadata manip\xFClasyonu; \xF6rn. bir JSON Web Token\
          \ (JWT) access control token\u2019\u0131n\u0131, cookie\u2019yi veya hidden\
          \ field\u2019\u0131 yeniden oynatarak/tahrif ederek yetki y\xFCkseltme ya\
          \ da JWT invalidation\u2019\u0131n\u0131 suistimal etme.\n* CORS misconfiguration\
          \ nedeniyle yetkisiz/g\xFCvenilmeyen origin\u2019lerden API eri\u015Fimine\
          \ izin verilmesi.\n* Auth olmadan authenticated sayfalara ya da standard\
          \ user iken privileged sayfalara force browsing."
        annotation: "## Score table\n\n| E\u015Flenen CWE'ler | Maks. G\xF6r\xFClme\
          \ Oran\u0131 | Ort. G\xF6r\xFClme Oran\u0131 | Ort. A\u011F\u0131rl\u0131\
          kl\u0131 Exploit | Ort. A\u011F\u0131rl\u0131kl\u0131 Etki | Maks. Kapsama\
          \ | Ort. Kapsama | Toplam G\xF6r\xFClme | Toplam CVE |\n| :-------------:\
          \ | :-----------------: | :----------------: | :--------------------: |\
          \ :-----------------: | :-----------: | :----------: | :------------: |\
          \ :--------: |\n|        34       |        55.97%       |        3.81% \
          \      |          6.92          |         5.93        |     94.55%    |\
          \    47.72%    |     318,487    |   19,013   |\n\n\n## How to prevent\n\n\
          Eri\u015Fim kontrol\xFC yaln\u0131zca g\xFCvenilen server-side code veya\
          \ server-less API i\xE7inde etkilidir; sald\u0131rgan\u0131n access control\
          \ kontrol\xFCn\xFC veya metadata\u2019y\u0131 de\u011Fi\u015Ftiremeyece\u011F\
          i yerlerde.\n\n* Public kaynaklar hari\xE7, varsay\u0131lan olarak reddet\
          \ (deny by default).\n* Access control mekanizmalar\u0131n\u0131 bir kez\
          \ uygulay\u0131p t\xFCm uygulamada yeniden kullan\u0131n; Cross-Origin Resource\
          \ Sharing (CORS) kullan\u0131m\u0131n\u0131 en aza indirin.\n* Model access\
          \ control\u2019leri, herhangi bir kayd\u0131 create/read/update/delete etmesine\
          \ izin vermek yerine kay\u0131t sahipli\u011Fini (record ownership) zorlamal\u0131\
          d\u0131r.\n* Benzersiz application business limit gereksinimleri domain\
          \ model\u2019lerince zorlanmal\u0131d\u0131r.\n* Web server directory listing\u2019\
          i devre d\u0131\u015F\u0131 b\u0131rak\u0131n ve dosya metadata\u2019s\u0131\
          n\u0131n (\xF6rn. .git) ve yedek dosyalar\u0131n web root i\xE7inde bulunmad\u0131\
          \u011F\u0131ndan emin olun.\n* Access control hatalar\u0131n\u0131 log\u2019\
          lay\u0131n, uygun oldu\u011Funda (\xF6rn. tekrar eden hatalarda) admin\u2019\
          leri uyar\u0131n.\n* Otomatize attack tooling\u2019in zarar\u0131n\u0131\
          \ en aza indirmek i\xE7in API ve controller eri\u015Fimini rate limit edin.\n\
          * Stateful session identifier\u2019lar\u0131 logout sonras\u0131 server\
          \ taraf\u0131nda ge\xE7ersiz k\u0131l\u0131n. Stateless JWT token\u2019\
          lar\u0131 k\u0131sa \xF6m\xFCrl\xFC yap\u0131n ki sald\u0131rgan i\xE7in\
          \ f\u0131rsat penceresi minimal olsun. Daha uzun \xF6m\xFCrl\xFC JWT\u2019\
          lerde eri\u015Fimi revoke etmek i\xE7in OAuth standartlar\u0131n\u0131 takip\
          \ etmek kuvvetle tavsiye edilir.\n\nGeli\u015Ftiriciler ve QA ekipleri fonksiyonel\
          \ access control unit ve integration testlerini dahil etmelidir.\n\n\n##\
          \ Example attack scenarios\n\n**Senaryo #1:** Uygulama, account bilgilerine\
          \ eri\u015Fen bir SQL \xE7a\u011Fr\u0131s\u0131nda do\u011Frulanmam\u0131\
          \u015F veriyi kullan\u0131yor:\n\n```\n pstmt.setString(1, request.getParameter(\"\
          acct\"));\n ResultSet results = pstmt.executeQuery( );\n```\n\nSald\u0131\
          rgan, browser\u2019daki 'acct' parametresini istedi\u011Fi hesap numaras\u0131\
          n\u0131 g\xF6nderecek \u015Fekilde de\u011Fi\u015Ftirir. Do\u011Fru \u015F\
          ekilde do\u011Frulanmam\u0131\u015Fsa sald\u0131rgan herhangi bir kullan\u0131\
          c\u0131n\u0131n hesab\u0131na eri\u015Febilir.\n\n```\n https://example.com/app/accountInfo?acct=notmyacct\n\
          ```\n\n**Senaryo #2:** Sald\u0131rgan hedef URL\u2019lere basit\xE7e force\
          \ browse yapar. Admin sayfas\u0131na eri\u015Fim i\xE7in admin haklar\u0131\
          \ gerekir.\n\n```\n https://example.com/app/getappInfo\n https://example.com/app/admin_getappInfo\n\
          ```\n\nAuth olmayan bir kullan\u0131c\u0131 bu sayfalardan herhangi birine\
          \ eri\u015Febiliyorsa bu bir hatad\u0131r. Non-admin bir kullan\u0131c\u0131\
          \ admin sayfas\u0131na eri\u015Febiliyorsa bu da bir hatad\u0131r.\n\n\n\
          Referanslar ve e\u015Flenen CWE listesi hakk\u0131nda daha fazla bilgi:\
          \ https://top10.owasp.org/2021/tr/A01_2021-Broken_Access_Control/"
      zh:
        name: "\u6743\u9650\u63A7\u5236\u5931\u6548"
        description: "\u5B58\u53D6\u63A7\u5236\u5F37\u5316\u653F\u7B56\uFF0C\u4F7F\
          \u7528\u6237\u4E0D\u80FD\u91C7\u53D6\u5728\u9884\u671F\u6743\u9650\u4E4B\
          \u5916\u7684\u884C\u52A8\u3002\u63A7\u5236\u5931\u6548\u901A\u5E38\u4F1A\
          \u5BFC\u81F4\u672A\u7ECF\u6388\u6743\u7684\u8D44\u8BAF\u6CC4\u6F0F\u3001\
          \u4FEE\u6539\u6216\u635F\u574F\u6240\u6709\u8D44\u6599\uFF0C\u6216\u6267\
          \u884C\u8D85\u51FA\u7528\u6237\u6743\u9650\u7684\u4E1A\u52A1\u529F\u80FD\
          \u3002\u5E38\u89C1\u7684\u5B58\u53D6\u63A7\u5236\u5F31\u70B9\u5305\u62EC\
          \uFF1A\n\n- \u901A\u8FC7\u4FEE\u6539 URL\u3001\u5167\u90E8\u5E94\u7528\u7A0B\
