  - urn: urn:intuitem:risk:threat:a07
    ref_id: A07:2021
    name: Identification and Authentication Failures
    description: "Confirmation of the user's identity, authentication, and session\n\
      management is critical to protect against authentication-related\nattacks. There\
      \ may be authentication weaknesses if the application:\n\n-   Permits automated\
      \ attacks such as credential stuffing, where the\n    attacker has a list of\
      \ valid usernames and passwords.\n\n-   Permits brute force or other automated\
      \ attacks.\n\n-   Permits default, weak, or well-known passwords, such as \"\
      Password1\"\n    or \"admin/admin\".\n\n-   Uses weak or ineffective credential\
      \ recovery and forgot-password\n    processes, such as \"knowledge-based answers,\"\
      \ which cannot be made\n    safe.\n\n-   Uses plain text, encrypted, or weakly\
      \ hashed passwords data stores (see\n    [A02:2021-Cryptographic Failures](A02_2021-Cryptographic_Failures.md)).\n\
      \n-   Has missing or ineffective multi-factor authentication.\n\n-   Exposes\
      \ session identifier in the URL.\n\n-   Reuse session identifier after successful\
      \ login.\n\n-   Does not correctly invalidate Session IDs. User sessions or\n\
      \    authentication tokens (mainly single sign-on (SSO) tokens) aren't\n   \
      \ properly invalidated during logout or a period of inactivity."
    annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
      \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg Coverage\
      \ | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
      | 22          | 14.84%             | 2.55%              | 7.40             \
      \    | 6.50                | 79.51%       | 45.72%       | 132,195         \
      \  | 3,897      |\n\n\n## How to prevent\n\n-   Where possible, implement multi-factor\
      \ authentication to prevent\n    automated credential stuffing, brute force,\
      \ and stolen credential\n    reuse attacks.\n\n-   Do not ship or deploy with\
      \ any default credentials, particularly for\n    admin users.\n\n-   Implement\
      \ weak password checks, such as testing new or changed\n    passwords against\
      \ the top 10,000 worst passwords list.\n\n-   Align password length, complexity,\
      \ and rotation policies with\n    National Institute of Standards and Technology\
      \ (NIST)\n    800-63b's guidelines in section 5.1.1 for Memorized Secrets or\
      \ other\n    modern, evidence-based password policies.\n\n-   Ensure registration,\
      \ credential recovery, and API pathways are\n    hardened against account enumeration\
      \ attacks by using the same\n    messages for all outcomes.\n\n-   Limit or\
      \ increasingly delay failed login attempts, but be careful not to create a denial\
      \ of service scenario. Log all failures\n    and alert administrators when credential\
      \ stuffing, brute force, or\n    other attacks are detected.\n\n-   Use a server-side,\
      \ secure, built-in session manager that generates a\n    new random session\
      \ ID with high entropy after login. Session identifier\n    should not be in\
      \ the URL, be securely stored, and invalidated after\n    logout, idle, and\
      \ absolute timeouts.\n\n\n## Example attack scenarios\n\n**Scenario #1:** Credential\
      \ stuffing, the use of lists of known\npasswords, is a common attack. Suppose\
      \ an application does not implement\nautomated threat or credential stuffing\
      \ protection. In that case, the\napplication can be used as a password oracle\
      \ to determine if the\ncredentials are valid.\n\n**Scenario #2:** Most authentication\
      \ attacks occur due to the continued\nuse of passwords as a sole factor. Once\
      \ considered best practices,\npassword rotation and complexity requirements\
      \ encourage users to use\nand reuse weak passwords. Organizations are recommended\
      \ to stop these\npractices per NIST 800-63 and use multi-factor authentication.\n\
      \n**Scenario #3:** Application session timeouts aren't set correctly. A\nuser\
      \ uses a public computer to access an application. Instead of\nselecting \"\
      logout,\" the user simply closes the browser tab and walks\naway. An attacker\
      \ uses the same browser an hour later, and the user is\nstill authenticated.\n\
      \n\nFor more information about the references and the list of mapped CWEs: https://top10.owasp.org/2021/A07_2021-Identification_and_Authentication_Failures/"
