          \ NIST 800-63 \u0648\u0627\u0633\u062A\u062E\u062F\u0627\u0645 \u0627\u0644\
          \u062A\u062D\u0642\u0651\u0642 \u0627\u0644\u062B\u0646\u0627\u0626\u064A\
          .\n\n**\u0633\u064A\u0646\u0627\u0631\u064A\u0648 #3:** \u0644\u0627 \u064A\
