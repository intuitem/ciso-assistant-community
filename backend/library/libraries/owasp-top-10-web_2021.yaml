      pt:
        name: "Falhas de registro e monitoramento de seguran\xE7a"
        description: "Retornando \xE0 lista OWASP Top 10 de 2021, essa categoria ajuda\
          \ a detectar, escalonar e responder a viola\xE7\xF5es ativas. Sem o monitoramento\
          \ e registro, as viola\xE7\xF5es n\xE3o podem ser detectadas. A falta de\
          \ registro, detec\xE7\xE3o, monitoramento e resposta ativa ocorre sempre\
          \ que:\n\n- Eventos audit\xE1veis, como logins, logins falhos e transa\xE7\
          \xF5es de alto valor, n\xE3o s\xE3o registrados.\n\n- Avisos e erros geram\
          \ mensagens de log inexistentes, inadequadas ou confusas.\n\n- Logs de aplicativos\
          \ e APIs n\xE3o s\xE3o monitorados quanto a atividades suspeitas.\n\n- Logs\
          \ s\xE3o armazenados apenas localmente.\n\n- Limiares de alerta apropriados\
          \ e processos de escalonamento de resposta n\xE3o est\xE3o em vigor ou s\xE3\
          o eficazes.\n\n- Testes de penetra\xE7\xE3o e varreduras por ferramentas\
          \ de teste de seguran\xE7a de aplicativos din\xE2micos (DAST), como OWASP\
          \ ZAP, n\xE3o acionam alertas.\n\n- A aplica\xE7\xE3o n\xE3o pode detectar,\
          \ escalonar ou alertar para ataques ativos em tempo real ou quase em tempo\
          \ real.\n\nVoc\xEA est\xE1 vulner\xE1vel a vazamento de informa\xE7\xF5\
          es tornando eventos de registro e alerta vis\xEDveis para um usu\xE1rio\
          \ ou um atacante \n(veja [A01:2021-Quebra de Controle de Acesso](A01_2021-Broken_Access_Control.md))."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 4           | 19.23%             | 6.51%              | 6.87         \
          \        | 4.99                | 53.67%       | 39.97%       | 53,615  \
          \          | 242        |\n\n\n## How to prevent\n\nOs desenvolvedores devem\
          \ implementar alguns ou todos os controles a seguir, dependendo do risco\
          \ da aplica\xE7\xE3o:\n\n- Garantir que todas as falhas de login, controle\
          \ de acesso e valida\xE7\xE3o de entrada no lado do servidor possam ser\
          \ registradas com contexto de usu\xE1rio suficiente para identificar contas\
          \ suspeitas ou maliciosas e mantidas por tempo suficiente para permitir\
          \ an\xE1lise forense atrasada.\n\n- Garantir que os logs sejam gerados em\
          \ um formato que as solu\xE7\xF5es de gerenciamento de logs possam facilmente\
          \ consumir.\n\n- Garantir que os dados de log sejam codificados corretamente\
          \ para evitar inje\xE7\xF5es ou ataques nos sistemas de registro ou monitoramento.\n\
          \n- Garantir que transa\xE7\xF5es de alto valor tenham uma trilha de auditoria\
          \ com controles de integridade para evitar adultera\xE7\xE3o ou exclus\xE3\
          o, como tabelas de banco de dados somente para adi\xE7\xE3o ou similares.\n\
          \n- As equipes de DevSecOps devem estabelecer monitoramento e alerta efetivos\
          \ para que atividades suspeitas sejam detectadas e respondidas rapidamente.\n\
          \n- Estabelecer ou adotar um plano de resposta e recupera\xE7\xE3o de incidentes,\
          \ como o National Institute of Standards and Technology (NIST) 800-61r2\
          \ ou posterior.\n\nExistem estruturas de prote\xE7\xE3o de aplicativos comerciais\
          \ e de c\xF3digo aberto, como o OWASP ModSecurity Core Rule Set, e software\
          \ de correla\xE7\xE3o de logs de c\xF3digo aberto, como o Elasticsearch,\
          \ Logstash, Kibana (ELK) stack, que possuem pain\xE9is personalizados e\
          \ alertas.\n\n\n## Example attack scenarios\n\n**Cen\xE1rio 1:** O operador\
          \ do site do provedor de plano de sa\xFAde infantil n\xE3o conseguiu detectar\
          \ uma viola\xE7\xE3o devido \xE0 falta de monitoramento e registro. Uma\
          \ parte externa informou ao provedor do plano de sa\xFAde que um invasor\
          \ havia acessado e modificado milhares de registros de sa\xFAde sens\xED\
          veis de mais de 3,5 milh\xF5es de crian\xE7as. Uma revis\xE3o p\xF3s-incidente\
          \ descobriu que os desenvolvedores do site n\xE3o haviam abordado vulnerabilidades\
          \ significativas. Como n\xE3o houve registro ou monitoramento do sistema,\
          \ a viola\xE7\xE3o de dados pode ter estado em andamento desde 2013, um\
          \ per\xEDodo de mais de sete anos.\n\n**Cen\xE1rio 2:** Uma grande companhia\
          \ a\xE9rea indiana teve uma viola\xE7\xE3o de dados envolvendo dados pessoais\
          \ de milh\xF5es de passageiros por mais de dez anos, incluindo dados de\
          \ passaporte e cart\xE3o de cr\xE9dito. A viola\xE7\xE3o de dados ocorreu\
          \ em um provedor de hospedagem em nuvem de terceiros, que notificou a companhia\
          \ a\xE9rea da viola\xE7\xE3o depois de algum tempo.\n\n**Cen\xE1rio n\xBA\
          \ 3:** Uma grande companhia a\xE9rea europeia sofreu uma viola\xE7\xE3o\
          \ relat\xE1vel do GDPR. A viola\xE7\xE3o foi supostamente causada por vulnerabilidades\
          \ de seguran\xE7a do aplicativo de pagamento exploradas por invasores, que\
          \ colheram mais de 400.000 registros de pagamento de clientes. A companhia\
          \ a\xE9rea foi multada em 20 milh\xF5es de libras como resultado pelo regulador\
          \ de privacidade.\n\n\nPara mais informa\xE7\xF5es sobre as refer\xEAncias\
          \ e a lista de CWEs mapeadas: https://top10.owasp.org/2021/pt-BR/A09_2021-Security_Logging_and_Monitoring_Failures/"
      tr:
        name: Security Logging and Monitoring Failures
        description: "OWASP Top 10 2021\u2019e geri d\xF6nen bu kategori, aktif ihlallerin\
          \ tespiti, y\xFCkseltilmesi (escalate) ve bunlara yan\u0131t verilmesine\
          \ yard\u0131mc\u0131 olur. Logging ve monitoring olmadan ihlaller tespit\
          \ edilemez. Yetersiz logging, detection, monitoring ve aktif yan\u0131t\
          \ a\u015Fa\u011F\u0131daki durumlar\u0131n herhangi birinde ger\xE7ekle\u015F\
          ir:\n\n* Login\u2019ler, ba\u015Far\u0131s\u0131z login\u2019ler ve y\xFC\
          ksek de\u011Ferli i\u015Flemler gibi denetlenebilir (auditable) event\u2019\
          ler log\u2019lanm\u0131yorsa.\n* Uyar\u0131lar ve hatalar hi\xE7, yetersiz\
          \ veya belirsiz log mesajlar\u0131 \xFCretiyorsa.\n* Uygulama ve API log\u2019\
          lar\u0131 \u015F\xFCpheli aktivite i\xE7in monitor edilmiyorsa.\n* Log\u2019\
          lar sadece lokal olarak tutuluyorsa.\n* Uygun alerting e\u015Fikleri ve\
          \ response escalation s\xFCre\xE7leri yoksa veya etkisizse.\n* Dynamic application\
          \ security testing (DAST) ara\xE7lar\u0131 (\xF6r. OWASP ZAP) ile yap\u0131\
          lan penetration test ve taramalar alert tetiklemiyorsa.\n* Uygulama aktif\
          \ sald\u0131r\u0131lar\u0131 ger\xE7ek zamanl\u0131 veya near real-time\
          \ olarak tespit, escalate veya alert edemiyorsa.\n* Logging ve alerting\
          \ event\u2019lerini bir kullan\u0131c\u0131ya veya sald\u0131rgana g\xF6\
          r\xFCn\xFCr k\u0131larak bilgi s\u0131z\u0131nt\u0131s\u0131na (information\
          \ leakage) a\xE7\u0131k hale geliniyorsa (bkz. [A01:2021-Broken Access Control](A01_2021-Broken_Access_Control.md)).\n\
          * Log verisi do\u011Fru \u015Fekilde encode edilmezse logging veya monitoring\
          \ sistemlerine injection veya sald\u0131r\u0131lara a\xE7\u0131k olunuyorsa."
        annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
          \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg\
          \ Coverage | Total Occurrences | Total CVEs |\n| :---------: | :----------------:\
          \ | :----------------: | :------------------: | :-----------------: | :----------:\
          \ | :----------: | :---------------: | :--------: |\n|      4      |   \
          \    19.23%       |        6.51%       |         6.87         |        \
          \ 4.99        |    53.67%    |    39.97%    |       53,615      |     242\
          \    |\n\n\n## How to prevent\n\nUygulaman\u0131n riskine ba\u011Fl\u0131\
          \ olarak geli\u015Ftiriciler a\u015Fa\u011F\u0131daki kontrollerin bir k\u0131\
          sm\u0131n\u0131 veya tamam\u0131n\u0131 uygulamal\u0131d\u0131r:\n\n* T\xFC\
          m login, access control ve server-side input validation hatalar\u0131n\u0131\
          n; \u015F\xFCpheli veya k\xF6t\xFC niyetli hesaplar\u0131 tan\u0131mlayacak\
          \ yeterli user context ile log\u2019lanmas\u0131n\u0131 ve gecikmeli adli\
          \ analiz (forensic analysis) i\xE7in yeterince uzun s\xFCre tutulmas\u0131\
          n\u0131 sa\u011Flay\u0131n.\n* Log\u2019lar\u0131n, log management \xE7\xF6\
          z\xFCmlerinin kolayca t\xFCketebilece\u011Fi bir formatta \xFCretilmesini\
          \ sa\u011Flay\u0131n.\n* Logging veya monitoring sistemlerine injection/sald\u0131\
          r\u0131lar\u0131 \xF6nlemek i\xE7in log verisini do\u011Fru \u015Fekilde\
          \ encode edin.\n* Y\xFCksek de\u011Ferli i\u015Flemler i\xE7in, kurcalamay\u0131\
          \ (tampering) veya silmeyi \xF6nleyecek integrity kontrollerine sahip audit\
          \ trail (\xF6r. append-only database tablolar\u0131) sa\u011Flay\u0131n.\n\
          * DevSecOps ekipleri, \u015F\xFCpheli aktivitelerin h\u0131zl\u0131ca tespit\
          \ edilip yan\u0131tlanaca\u011F\u0131 etkili monitoring ve alerting kurmal\u0131\
          d\u0131r.\n* National Institute of Standards and Technology (NIST) 800-61r2\
          \ veya daha yenisi gibi bir incident response ve recovery plan\u0131 olu\u015F\
          turun veya benimseyin.\n\nOWASP ModSecurity Core Rule Set gibi ticari ve\
          \ a\xE7\u0131k kaynak uygulama koruma framework\u2019leri ile Elasticsearch,\
          \ Logstash, Kibana (ELK) stack gibi a\xE7\u0131k kaynak log korelasyon yaz\u0131\
          l\u0131mlar\u0131; custom dashboard ve alerting \xF6zellikleri sunar.\n\n\
          \n## Example attack scenarios\n\n**Senaryo #1:** Bir \xE7ocuk sa\u011Fl\u0131\
          k plan\u0131 sa\u011Flay\u0131c\u0131s\u0131n\u0131n web sitesi i\u015F\
          letmecisi, monitoring ve logging eksikli\u011Fi nedeniyle bir ihlali tespit\
          \ edemedi. Harici bir taraf, sald\u0131rgan\u0131n 3.5 milyonun \xFCzerinde\
          \ \xE7ocu\u011Fa ait binlerce hassas sa\u011Fl\u0131k kayd\u0131na eri\u015F\
          ip bunlar\u0131 de\u011Fi\u015Ftirdi\u011Fini bildirdi. Olay sonras\u0131\
          \ incelemede, web sitesi geli\u015Ftiricilerinin \xF6nemli zafiyetleri ele\
          \ almad\u0131\u011F\u0131 g\xF6r\xFCld\xFC. Sistem \xFCzerinde logging veya\
          \ monitoring olmad\u0131\u011F\u0131ndan, veri ihlali 2013\u2019ten beri\
          \ \u2014 yedi y\u0131l\u0131 a\u015Fk\u0131n bir s\xFCre \u2014 devam ediyor\
          \ olabilirdi.\n\n**Senaryo #2:** B\xFCy\xFCk bir Hint havayolu \u015Firketi,\
          \ milyonlarca yolcunun on y\u0131l\u0131 a\u015Fk\u0131n ki\u015Fisel verilerini\
          \ (pasaport ve kredi kart\u0131 verileri d\xE2hil) etkileyen bir veri ihlali\
          \ ya\u015Fad\u0131. Veri ihlali, \xFC\xE7\xFCnc\xFC taraf bir cloud hosting\
          \ sa\u011Flay\u0131c\u0131s\u0131nda meydana geldi ve ihlal bir s\xFCre\
          \ sonra havayoluna bildirildi.\n\n**Senaryo #3:** B\xFCy\xFCk bir Avrupa\
          \ havayolu \u015Firketi GDPR kapsam\u0131nda raporlanabilir bir ihlal ya\u015F\
          ad\u0131. \u0130hlalin, sald\u0131rganlar taraf\u0131ndan istismar edilen\
          \ payment application g\xFCvenlik zafiyetlerinden kaynakland\u0131\u011F\
          \u0131 ve 400.000\u2019den fazla m\xFC\u015Fteri \xF6deme kayd\u0131n\u0131\
          n topland\u0131\u011F\u0131 bildirildi. Havayolu, gizlilik d\xFCzenleyicisi\
          \ taraf\u0131ndan 20 milyon pound para cezas\u0131na \xE7arpt\u0131r\u0131\
          ld\u0131.\n\n\nReferanslar ve e\u015Flenen CWE listesi hakk\u0131nda daha\
          \ fazla bilgi: https://top10.owasp.org/2021/tr/A09_2021-Security_Logging_and_Monitoring_Failures/"
