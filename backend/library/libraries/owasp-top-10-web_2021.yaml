          \ \u0645\u0646 \u0643\u0644\u0645\u0627\u062A \u0627\u0644\u0645\u0631\u0648\
          \u0631 \u0627\u0644\u0636\u0639\u064A\u0641\u0629\u060C \u0645\u062B\u0644\
          \ \u0627\u062E\u062A\u0628\u0627\u0631 \u0643\u0644\u0645\u0627\u062A \u0627\
          \u0644\u0645\u0631\u0648\u0631 \u0627\u0644\u062C\u062F\u064A\u062F\u0629\
          \ \u0623\u0648 \u0627\u0644\u062A\u064A \u062A\u0645 \u062A\u063A\u064A\u064A\
          \u0631\u0647\u0627 \u0648\u0645\u0642\u0627\u0631\u0646\u062A\u0647\u0627\
          \ \u0628\u0642\u0627\u0626\u0645\u0629 \u0623\u0633\u0648\u0623 10,000 \u0643\
          \u0644\u0645\u0629 \u0645\u0631\u0648\u0631.\n\n-   \u0627\u0636\u0628\u0637\
          \ \u0637\u0648\u0644 \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\
          \u0631 \u0648\u0635\u0639\u0648\u0628\u062A\u0647\u0627 \u0648\u0642\u0645\
          \ \u0628\u0627\u062A\u0628\u0627\u0639 \u0627\u0644\u0633\u064A\u0627\u0633\
          \u0627\u062A \u0648\u0627\u0644\u0625\u0631\u0634\u0627\u062F\u0627\u062A\
          \ \u0627\u0644\u0648\u0627\u0631\u062F\u0629 \u0641\u064A NIST 800-63b \u0641\
          \u064A \u0627\u0644\u0642\u0633\u0645 5.1.1 \"\u062A\u0630\u0643\u0651\u0631\
          \ \u0643\u0644\u0645\u0627\u062A \u0627\u0644\u0633\u0631 \u0627\u0644\u0645\
          \u062D\u0641\u0648\u0638\u0629 \u0623\u0648 \u0633\u064A\u0627\u0633\u0627\
          \u062A \u0643\u0644\u0645\u0629 \u0627\u0644\u0645\u0631\u0648\u0631\".\n\
          \n-   \u062A\u0623\u0643\u062F \u0645\u0646 \u0623\u0646 \u0645\u0633\u0627\
          \u0631\u0627\u062A \u0643\u064F\u0644\u064B\u0627 \u0645\u0646 \u0627\u0644\
          \u062A\u0633\u062C\u064A\u0644 \u0648\u0627\u0633\u062A\u0639\u0627\u062F\
          \u0629 \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u0627\u0639\u062A\
          \u0645\u0627\u062F \u0648\u0648\u0627\u062C\u0647\u0629 \u0628\u0631\u0645\
          \u062C\u0629 \u0627\u0644\u062A\u0637\u0628\u064A\u0642\u0627\u062A (API)\
          \ \u0645\u062D\u0645\u064A\u0651\u0629 \u0636\u062F \u0647\u062C\u0645\u0627\
          \u062A \u0641\u062D\u0635 \u0627\u0644\u062D\u0633\u0627\u0628\u0627\u062A\
          \ (Account Enumeration) \u060C \u0642\u0645 \u0628\u0625\u0638\u0647\u0627\
          \u0631 \u0646\u0641\u0633 \u0631\u0633\u0627\u0626\u0644 \u0627\u0644\u062E\
          \u0637\u0623 \u0644\u062C\u0645\u064A\u0639 \u0639\u0645\u0644\u064A\u0627\
          \u062A \u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\u0644\
          .\n\n-   \u0627\u0644\u062D\u062F \u0645\u0646 \u0645\u062D\u0627\u0648\u0644\
          \u0627\u062A \u062A\u0633\u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\
          \u0644 \u0627\u0644\u0641\u0627\u0634\u0644\u0629. \u0648\u0642\u0645 \u0628\
          \u062A\u0633\u062C\u064A\u0644 \u062C\u0645\u064A\u0639 \u062D\u0627\u0644\
          \u0627\u062A \u0641\u0634\u0644 \u0639\u0645\u0644\u064A\u0629 \u062A\u0633\
          \u062C\u064A\u0644 \u0627\u0644\u062F\u062E\u0648\u0644 \u0648\u0642\u0645\
          \ \u0628\u062A\u0646\u0628\u064A\u0647 \u0627\u0644\u0645\u0633\u0624\u0648\
          \u0644\u064A\u0646 \u0639\u0646\u062F \u0627\u0643\u062A\u0634\u0627\u0641\
          \ \u0645\u062D\u0627\u0648\u0644\u0629 \u0647\u062C\u0645\u0627\u062A \u0643\
          \u0633\u0631 \u0628\u064A\u0627\u0646\u0627\u062A \u0627\u0644\u0627\u0639\
          \u062A\u0645\u0627\u062F (Credential Stuffing) \u0623\u0648 \u0647\u062C\
          \u0648\u0645 \u0643\u0633\u0631 \u0643\u0644\u0645\u0627\u062A \u0627\u0644\
          \u0645\u0631\u0648\u0631 (Brute Force) \u0623\u0648 \u0623\u064A \u0647\u062C\
          \u0645\u0627\u062A \u0623\u062E\u0631\u0649.\n\n-   \u0627\u0633\u062A\u062E\
          \u062F\u0645 \u0645\u062F\u064A\u0631 \u062C\u0644\u0633\u0629 \u0645\u064F\
