          \ \u062C\u0639\u0644 \u0633\u064A\u0627\u0633\u0629 \u0643\u0644\u0645\u0629\
          \ \u0627\u0644\u0645\u0631\u0648\u0631 \u0645\u0639\u0642\u0651\u062F\u0629\
