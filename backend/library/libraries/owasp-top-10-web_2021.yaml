      pt:
        name: "Falhas de identifica\xE7\xE3o e autentica\xE7\xE3o"
        description: "Confirma\xE7\xE3o da identidade, autentica\xE7\xE3o e sess\xE3\
          o do usu\xE1rio\ngerenciamento \xE9 fundamental para proteger contra autentica\xE7\
          \xE3o relacionada\nataques. Pode haver pontos fracos de autentica\xE7\xE3\
          o se o aplicativo:\n\n- Permite ataques automatizados, como preenchimento\
          \ de credenciais, onde o\n     invasor tem uma lista de nomes de usu\xE1\
          rios e senhas v\xE1lidos.\n\n- Permite for\xE7a bruta ou outros ataques\
          \ automatizados.\n\n- Permite senhas padr\xE3o, fracas ou conhecidas, como\
          \ \"Senha1\" ou \"admin/admin\".\n\n- Usa recupera\xE7\xE3o de credenciais\
          \ fraca ou ineficaz e esqueci a senha\n     processos, como \"respostas\
          \ baseadas em conhecimento\", que n\xE3o podem ser feitas\n     de modo\
          \ seguro.\n\n- Usa armazenamento de dados e senhas em texto simples, criptografadas\
          \ ou com hash fraco (consulte\n    [A02:2021-Falhas Criptogr\xE1ficas](A02_2021-Cryptographic_Failures.md)).\n\
          \n- Possui multifator de autentica\xE7\xE3o ausente ou ineficaz.\n\n- Exp\xF5\
          e o identificador de sess\xE3o na URL.\n\n- Reutiliza o identificador de\
          \ sess\xE3o ap\xF3s o login bem-sucedido.\n\n- N\xE3o invalida corretamente\
          \ IDs de sess\xE3o. Sess\xF5es de usu\xE1rio ou\n     tokens de autentica\xE7\
          \xE3o (principalmente tokens de logon \xFAnico (SSO)) n\xE3o s\xE3o\n  \
          \   devidamente invalidado durante o logout ou um per\xEDodo de inatividade."
        annotation: "## Score table\n\n| CWEs Mapeados | Taxa de Incid\xEAncia M\xE1\
          xima | Taxa de Incid\xEAncia M\xE9dia | Explora\xE7\xE3o M\xE9dia Ponderada\
          \ | Impacto M\xE9dio Ponderado | Cobertura M\xE1xima | Cobertura M\xE9dia\
          \ | Total de ocorr\xEAncias | Total de CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 22          | 14.84%             | 2.55%              | 7.40         \
          \        | 6.50                | 79.51%       | 45.72%       | 132,195 \
          \          | 3,897      |\n\n\n## How to prevent\n\n- Sempre que poss\xED\
          vel, implemente a autentica\xE7\xE3o multifator para evitar\n     preenchimento\
          \ automatizado de credenciais, for\xE7a bruta e credenciais roubadas\n\n\
          - N\xE3o permita ou implante nenhuma credencial padr\xE3o, especialmente\
          \ para\n     usu\xE1rios administradores.\n\n- Implementar verifica\xE7\xF5\
          es de senha fraca, como testar novas ou alteradas\n     contra a lista das\
          \ 10.000 piores senhas.\n\n- Alinhe o comprimento da senha, a complexidade\
          \ e as pol\xEDticas de rota\xE7\xE3o com\n     Instituto Nacional de Padr\xF5\
          es e Tecnologia (NIST)\n     as diretrizes do 800-63b na se\xE7\xE3o 5.1.1\
          \ para segredos memorizados ou outras\n     pol\xEDticas de senha modernas\
          \ e baseadas em evid\xEAncias.\n\n- Certifique-se de que o registro, a recupera\xE7\
          \xE3o de credenciais e os caminhos da API sejam\n     protegido contra ataques\
          \ de enumera\xE7\xE3o de contas usando a mesma mensagens para todos os resultados.\n\
          \n- Limite ou atrase cada vez mais as tentativas de login com falha, mas\
          \ tome cuidado para n\xE3o criar um cen\xE1rio de nega\xE7\xE3o de servi\xE7\
          o. Registrar todas as falhas e alertar os administradores quando o preenchimento\
          \ de credenciais, \n     for\xE7a bruta ou outros ataques s\xE3o detectados.\n\
          \n- Use um gerenciador de sess\xE3o integrado, seguro do lado do servidor\
          \ que gere um\n     novo ID de sess\xE3o aleat\xF3ria com alta entropia\
          \ ap\xF3s o login. Identificador de sess\xE3o\n     n\xE3o deve estar na\
          \ URL, deve ser armazenado com seguran\xE7a e invalidado ap\xF3s o logout.\n\
          \n\n## Example attack scenarios\n\n**Cen\xE1rio 1:** O preenchimento de\
          \ credenciais, que consiste no uso de listas de senhas conhecidas, \xE9\
          \ um ataque comum. \nSuponha que um aplicativo n\xE3o implemente prote\xE7\
          \xE3o automatizada contra amea\xE7as ou preenchimento de credenciais. \n\
          Nesse caso, o aplicativo pode ser usado como um or\xE1culo de senhas para\
          \ determinar se as credenciais s\xE3o v\xE1lidas.\n\n**Cen\xE1rio 2:** A\
          \ maioria dos ataques de autentica\xE7\xE3o ocorre devido ao uso cont\xED\
          nuo de senhas como \xFAnico fator. \nAntes considerada uma boa pr\xE1tica,\
          \ a rota\xE7\xE3o de senhas e os requisitos de complexidade encorajam os\
          \ usu\xE1rios a usar e reutilizar senhas fracas. As organiza\xE7\xF5es s\xE3\
          o recomendadas a interromper essas pr\xE1ticas conforme a norma NIST 800-63\
          \ e usar autentica\xE7\xE3o de m\xFAltiplos fatores.\n\n**Cen\xE1rio 3:**\
          \ Os tempos limite da sess\xE3o do aplicativo n\xE3o est\xE3o definidos\
          \ corretamente. \nUm usu\xE1rio usa um computador p\xFAblico para acessar\
          \ um aplicativo. \nEm vez de selecionar \"sair\", o usu\xE1rio simplesmente\
          \ fecha a aba do navegador e sai. \nUma hora depois, um atacante usa o mesmo\
          \ navegador, e o usu\xE1rio ainda est\xE1 autenticado.\n\n\nPara mais informa\xE7\
          \xF5es sobre as refer\xEAncias e a lista de CWEs mapeadas: https://top10.owasp.org/2021/pt-BR/A07_2021-Identification_and_Authentication_Failures/"
      tr:
        name: Identification and Authentication Failures
        description: "Kullan\u0131c\u0131n\u0131n kimli\u011Finin do\u011Frulanmas\u0131\
          , authentication ve session y\xF6netimi; authentication kaynakl\u0131 sald\u0131\
          r\u0131lara kar\u015F\u0131 korunmak i\xE7in kritiktir. A\u015Fa\u011F\u0131\
          daki durumlar varsa uygulamada authentication zafiyetleri olabilir:\n\n\
          -   Sald\u0131rgan\u0131n ge\xE7erli username/password listeleriyle credential\
          \ stuffing gibi otomatik sald\u0131r\u0131lar yapmas\u0131na izin veriyorsa.\n\
          -   Brute force veya di\u011Fer otomatik sald\u0131r\u0131lara izin veriyorsa.\n\
          -   \u201CPassword1\u201D veya \u201Cadmin/admin\u201D gibi varsay\u0131\
          lan, zay\u0131f veya yayg\u0131n parolalara izin veriyorsa.\n-   \u201C\
          Bilgiye dayal\u0131 sorular\u201D gibi g\xFCvenli h\xE2le getirilemeyen\
          \ zay\u0131f/hatal\u0131 credential recovery ve forgot-password s\xFCre\xE7\
          leri kullan\u0131l\u0131yorsa.\n-   Parolalar plain text, \u015Fifreli ama\
          \ hatal\u0131 veya zay\u0131f \u015Fekilde hash\u2019lenmi\u015F data store\u2019\
          larda tutuluyorsa (bkz. [A02:2021-Cryptographic Failures](A02_2021-Cryptographic_Failures.md)).\n\
          -   Multi-factor authentication eksik veya etkisizse.\n-   Session identifier\
          \ URL\u2019de a\xE7\u0131\u011Fa \xE7\u0131k\u0131yorsa.\n-   Ba\u015Far\u0131\
          l\u0131 login\u2019den sonra ayn\u0131 session identifier yeniden kullan\u0131\
          l\u0131yorsa.\n-   Session ID\u2019ler do\u011Fru \u015Fekilde ge\xE7ersiz\
          \ k\u0131l\u0131nm\u0131yorsa. Kullan\u0131c\u0131 session\u2019lar\u0131\
          \ veya authentication token\u2019lar\u0131 (\xF6zellikle single sign-on\
          \ (SSO) token\u2019lar\u0131) logout s\u0131ras\u0131nda veya belli bir\
          \ inactivity s\xFCresinden sonra d\xFCzg\xFCn bi\xE7imde invalid edilmiyorsa."
        annotation: "## Score table\n\n| CWEs Mapped | Max Incidence Rate | Avg Incidence\
          \ Rate | Avg Weighted Exploit | Avg Weighted Impact | Max Coverage | Avg\
          \ Coverage | Total Occurrences | Total CVEs |\n|:-------------:|:--------------------:|:--------------------:|:--------------:|:--------------:|:----------------------:|:---------------------:|:-------------------:|:------------:|\n\
          | 22          | 14.84%             | 2.55%              | 7.40         \
          \        | 6.50                | 79.51%       | 45.72%       | 132,195 \
          \          | 3,897      |\n\n\n## How to prevent\n\n-   M\xFCmk\xFCn olan\
          \ yerlerde multi-factor authentication uygulay\u0131n; credential stuffing,\
          \ brute force ve \xE7al\u0131nt\u0131 credential tekrar kullan\u0131m\u0131\
          na kar\u015F\u0131 koruma sa\u011Flar.\n-   \xD6zellikle admin kullan\u0131\
          c\u0131lar i\xE7in, varsay\u0131lan credential\u2019larla ship/deploy etmeyin.\n\
          -   Yeni veya de\u011Fi\u015Ftirilen parolalar\u0131 en k\xF6t\xFC 10.000\
          \ parola listesine kar\u015F\u0131 test etmek gibi zay\u0131f parola kontrollerini\
          \ uygulay\u0131n.\n-   Parola uzunlu\u011Fu, karma\u015F\u0131kl\u0131\u011F\
          \u0131 ve rotasyon politikalar\u0131n\u0131 NIST 800-63b\u2019nin 5.1.1\
          \ (Memorized Secrets) b\xF6l\xFCm\xFCndeki rehberle veya di\u011Fer modern,\
          \ kan\u0131ta dayal\u0131 parola politikalar\u0131yla hizalay\u0131n.\n\
          -   Kay\u0131t, credential recovery ve API ak\u0131\u015Flar\u0131n\u0131\
          ; t\xFCm sonu\xE7lar i\xE7in ayn\u0131 mesajlar\u0131 kullanarak account\
          \ enumeration sald\u0131r\u0131lar\u0131na kar\u015F\u0131 sertle\u015F\
          tirin.\n-   Ba\u015Far\u0131s\u0131z login denemelerini s\u0131n\u0131rlay\u0131\
          n veya giderek geciktirin; ancak bir denial of service senaryosu yaratmamaya\
          \ dikkat edin. T\xFCm ba\u015Far\u0131s\u0131zl\u0131klar\u0131 log\u2019\
          lay\u0131n ve credential stuffing, brute force veya di\u011Fer sald\u0131\
          r\u0131lar tespit edildi\u011Finde y\xF6neticileri uyar\u0131n.\n-   Login\
          \ sonras\u0131nda y\xFCksek entropili yeni ve rastgele bir session ID \xFC\
          reten, server-side, g\xFCvenli ve built-in bir session manager kullan\u0131\
          n. Session identifier URL\u2019de olmamal\u0131, g\xFCvenli bi\xE7imde saklanmal\u0131\
          \ ve logout, idle ve absolute timeout\u2019lardan sonra invalid edilmelidir.\n\
          \n\n## Example attack scenarios\n\n**Senaryo #1:** Credential stuffing,\
          \ bilinen parola listelerinin kullan\u0131m\u0131yla yap\u0131lan yayg\u0131\
          n bir sald\u0131r\u0131d\u0131r. Bir uygulama, otomatik tehdit veya credential\
          \ stuffing korumas\u0131 uygulam\u0131yorsa; bu uygulama, credential\u2019\
          lar\u0131n ge\xE7erli olup olmad\u0131\u011F\u0131n\u0131 test etmek i\xE7\
          in bir \u201Cpassword oracle\u201D olarak kullan\u0131labilir.\n\n**Senaryo\
          \ #2:** \xC7o\u011Fu authentication sald\u0131r\u0131s\u0131, parolalar\u0131\
          n tek fakt\xF6r olarak kullan\u0131lmaya devam edilmesi nedeniyle ger\xE7\
          ekle\u015Fir. Bir zamanlar en iyi uygulama say\u0131lan parola rotasyonu\
          \ ve karma\u015F\u0131kl\u0131k gereksinimleri, kullan\u0131c\u0131lar\u0131\
          \ zay\u0131f parolalar kullanmaya ve yeniden kullanmaya iter. NIST 800-63\u2019\
          e g\xF6re bu uygulamalardan vazge\xE7ilmesi ve multi-factor authentication\u2019\
          a ge\xE7ilmesi tavsiye edilir.\n\n**Senaryo #3:** Uygulama session timeout\u2019\
          lar\u0131 do\u011Fru ayarlanmam\u0131\u015Ft\u0131r. Bir kullan\u0131c\u0131\
          , public bir bilgisayardan uygulamaya eri\u015Fir. \u201CLogout\u201Du se\xE7\
          mek yerine yaln\u0131zca taray\u0131c\u0131 sekmesini kapat\u0131r ve uzakla\u015F\
          \u0131r. Bir sald\u0131rgan bir saat sonra ayn\u0131 taray\u0131c\u0131\
          y\u0131 kullan\u0131r ve kullan\u0131c\u0131 h\xE2l\xE2 authenticated durumdad\u0131\
          r.\n\n\nReferanslar ve e\u015Flenen CWE listesi hakk\u0131nda daha fazla\
          \ bilgi: https://top10.owasp.org/2021/tr/A07_2021-Identification_and_Authentication_Failures/"
      zh:
        name: "\u8BA4\u8BC1\u53CA\u9A8C\u8BC1\u673A\u5236\u5931\u6548"
        description: "\u786E\u8BA4\u7528\u6237\u7684\u8EAB\u5206\u3001\u8BA4\u8BC1\
          \u3001\u4F1A\u8BDD(session)\u7BA1\u7406\u5BF9\u4E8E\u9632\u6B62\u4E0E\u8BA4\
          \u8BC1\u76F8\u5173\u7684\u653B\u51FB\u81F3\u5173\u91CD\u8981\uFF0C\u5982\
          \u679C\u5E94\u7528\u7A0B\u5F0F\u5B58\u5728\u4EE5\u4E0B\u60C5\u51B5\uFF0C\
          \u5219\u53EF\u80FD\u6709\u8BA4\u8BC1\u7684\u6F0F\u6D1E:\n\n- \u5141\u8BB8\
          \u50CF\u662F\u653B\u51FB\u8005\u5DF2\u7ECF\u62E5\u6709\u6709\u6548\u7528\
          \u6237\u540D\u79F0\u548C\u5BC6\u7801\u5217\u8868\u7684\u649E\u5E93\u81EA\
          \u52A8\u5316\u653B\u51FB\u3002\n\n- \u5141\u8BB8\u66B4\u529B\u6216\u5176\
          \u4ED6\u81EA\u52A8\u5316\u653B\u51FB\u3002\n\n- \u5141\u8BB8\u9884\u8BBE\
