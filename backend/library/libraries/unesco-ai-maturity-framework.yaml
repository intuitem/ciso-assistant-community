    ref_id: UNESCO-AI-MATURITY
    name: UNESCO AI Maturity Framework
    description: |-
      Based on the UNESCO AI Maturity Framework - A self-positioning guide for public administrations (2025, SHS/REI/AI/FLMAT Rev. 3), developed within the "AI-Ready Flemish Public Administration" project funded by the European Commission DG REFORM. A reflective self-assessment of organisational AI readiness across 6 pillars and 29 categories: Strategy & Value; People & Culture; Technology & Infrastructure; AI Operations & Ecosystem; AI Governance, Ethics & Risk; and Data. Each category describes four progressive maturity levels (Basic, Ready, Dynamic, Advanced); assessors read the descriptors and record the level that best reflects current practice as the implementation score. The framework prescribes no target level - it helps an organisation understand where it is, where it aims to be, and what is required to get there.
      https://unesdoc.unesco.org/ark:/48223/pf0000397145
    min_score: 0
    max_score: 4
    scores_definition:
    - score: 0
      name: Not positioned
      description: The category has not been assessed yet. Select a level from 1 to 4 to record the organisation's
        current position. This is not a UNESCO maturity level.
    - score: 1
      name: Basic
      description: This represents an initial state where processes are often undocumented, inconsistent,
        reactive, or heavily reliant on individual efforts. At this level, there is typically limited
        awareness or capability concerning AI.
    - score: 2
      name: Ready
      description: Characterized as a managed state, this level means processes are documented and generally
        followed, perhaps at a project or team level. Basic capabilities and standards are established
        and repeatable, indicating a defined intent and growing awareness within the organisation.
    - score: 3
      name: Dynamic
      description: At this defined and measured state, processes are standardized, integrated, and consistently
        applied across relevant parts of the organisation. Performance is quantitatively measured and
        actively managed, with practices becoming proactive rather than reactive.
    - score: 4
      name: Advanced
      description: This optimized state signifies that processes are continuously improved based on quantitative
        insights and feedback loops. The focus is on optimization, innovation, and proactive refinement,
        with capabilities deeply embedded and strategically leveraged throughout the organization.
