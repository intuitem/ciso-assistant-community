    requirement_nodes:
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:scope
      assessable: false
      depth: 1
      ref_id: Annex II
      name: Criteria for Union assurance levels
      description: This Annex sets out the criteria to be met by cloud computing service providers and
        their cloud computing services in order to be recognised as offering services at Union assurance
        levels 1, 2, 3 and 4. For the purpose of the criteria under Union assurance levels 1, 2, 3, and
        4, ‘software’ within the meaning of Regulation (EU) 2024/2847, Article 3, point (4) falls within
        the scope of this Annex and Annex III to this Regulation. ‘Hardware’ within the meaning of Regulation
        (EU) 2024/2847, Article 3, point (5) is outside of the scope.
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-1
