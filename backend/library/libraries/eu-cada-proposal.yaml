    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-1:1.1:g
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-1:1.1
      ref_id: 1.1(g)
      implementation_groups:
      - UAL-1
      assessable: true
      description: Where the cloud computing service provider is subject to the control of a third country
        or a legal entity established in a third-country, the cloud computing service provider guarantees
