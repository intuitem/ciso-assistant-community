    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1:j
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1
      ref_id: 2.1(j)
      implementation_groups:
      - UAL-2
      typical_evidence: 'Annex III, audit criterion J – Open-source software

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (j) of Annex II based on the following evidence:

        (1) The audited provider should ensure transparency through remote access and source code auditability
        by: (a) making available to the auditing organisation a list of evidence to prove that there is
        no use of any remote features or mechanisms that could be used to materially tamper with or disrupt
        a device, system, or software. This should include: i. evidence related to the testing of the
        software component to prevent the use of any remote features or mechanisms that could be used
        to materially tamper with or disrupt a device, system, or software (test procedure, test reports,
        test plan, etc.); ii. evidence that the organisation’s change management procedures include any
        change in firmware, bios and software updates as well as integration of new components to prevent
        the use of any remote feature or mechanism; iii. evidence that the maintenance procedure is updated
        to include preventing any remote feature or mechanism that could be used to materially tamper
        with or disrupt a device, system or software;

        (2) The audited provider should provide: (a) evidence of a risk-based process to identify and
        mitigate: (i) a weak ecosystem and community support of the OSS; (ii) a failure to continuously
        monitor the updates released; (iii) cases where the OSS is deprecated or is no longer maintained.
        (b) evidence that the audited provider has applied the up-to-date OSS without undue delay; (c)
        evidence that the audited provider has identified one or several alternative open-source solutions.
        If the audited provider cannot identify an equivalent software, it must identify a solution ensuring
        minimal viable functionality. The audited provider must implement tests must and a switchover
        plan enabling migration to the alternative solutions.

        (3) Where the audited provider uses software released under an open-source licence, the audited
        provider should implement mechanisms to detect and provide timely notice to the public sector
        body if the software is acquired by or comes under control of a third country or a legal entity
        or foundation established in a third country.'
      assessable: true
      description: where software released under an open-source licence is used for the provision of the
        service, the audited provider demonstrates that it has implemented and documented the appropriate
        controls to prevent the use of any remote features or mechanisms that could be used to materially
        tamper with or disrupt a device, system, or software;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1:k
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1
      ref_id: 2.1(k)
      implementation_groups:
      - UAL-2
      typical_evidence: 'Annex III, audit criterion K – Global services and subsidiaries in third-countries

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (k) of Annex II based on the following evidence:

        (1) The auditing organisation should verify that the subsidiary is legally and operationally independent
        from the audited provider.

        (2) The audited provider must demonstrate that the subsidiary has no access to systems processing
        or storing the customer data.

        (3) The audited provider must demonstrate that the subsidiary has no privileged accounts within
        the Union production environments, including cloud administration, Identity and Access Management
        (IAM), Privileged Access Management (PAM), monitoring or database administration privileges.

        (4) The auditing organisation should verify that the personnel of the subsidiary cannot obtain
        access to Union customer data.

        (5) The auditing organisation should verify that the subsidiary has no authority to instruct Union
        operational staff to disclose customer data or bypass security procedures.

        (6) The auditing organisation should verify that all foreign government requests received by the
        subsidiary are formally redirected to the competent Union entity for legal assessment under Union
        and Member State law.'
      assessable: true
      description: to the extent that the audited provider provides its services globally and maintains
        a subsidiary in a third country, the audited provider has implemented the necessary measures to
        ensure and enforce the effective legal, technical and organisational separation between the Union
        parent company and any such third-country subsidiary.
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.2
