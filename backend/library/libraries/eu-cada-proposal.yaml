        other relevant documents regarding the decision-making procedures within the legal entity, investment
        agreements between the shareholders, etc.; iii. for any shareholders that are legal persons that
        hold at least 5% in the capital or at least 5% of the voting rights:

        (1) a graph describing the different ownership layers/chain of control until the ultimate owners;

        (2) the articles of association, bylaws or equivalent constitutional documents;

        (3) a register of directors, officers and signatories.

        (3) The audited provider should provide the auditing organisation with the following evidence
        related to the corporate governance: (a) The audited provider should provide the auditing organisation
        with a description of: i. the decision-making bodies, their composition as well as their nationality
        or place of establishment (where applicable); ii. the rules regarding election, appointment, nomination
        or tenure of members of the decision-making bodies or other management positions; iii. the decision-making
        procedures, including information on the required majority and/or quorum needed for decisions;
        iv. internal governance policies describing how ownership and control decisions are recorded and
        approved; board and management decisions reflecting the stated control structure; board minutes
        and resolutions for control changes. (b) The audited provider should provide the auditing organisation
        with supporting documents setting out or describing: the decision-making bodies and the rules
        on their election, appointment, nomination or tenure, decision-making procedures, voting rights,
        veto rights, appointment rights, approval rights within the legal entity (e.g. articles of association
        bylaws, reports on corporate governance, etc.). The supporting documents and information should
        be provided for each intermediate legal entity that directly or indirectly holds 5% or more of
        the capital or voting rights, up to the ultimate owners of all the layers involved.

        (4) The audited provider should provide the following control-related evidence to the auditing
        organisation: (a) The audited provider should provide the auditing organisation with the evidence
        of the commercial links conferring control. This includes, but is not limited to, a list of individuals
        or legal entities with whom the audited providers (or the owners of the audited provider, including
        intermediate layers until the ultimate owners) have a commercial relationship that (a) leads to
        a similar level of control on management and resources as the ownership of shares or assets; and
        (b) is of very long duration (e.g. very important long-term supply agreements or credits provided
        by software manufacturers/customers, coupled with structural links). (b) The supporting documents
        should include cooperation agreements with the public sector body or software manufacturers ,
        etc.

        (5) The audited provider should provide the auditing organisation with the following evidence
        related to the financial links conferring control: (a) The audited provider should list the individuals
        or legal entities (including controlling shareholders or owners) on whom the audited provider
        (or the owners) are financially dependent in a way that could allow them to obtain concessions
        in strategic business areas. (b) The supporting documents should include loan documents, by-laws,
        documents showing the financial link; etc.

        (6) The audited provider should provide the auditing organisation with the following evidence
        related to other sources of control: (a) The audited providers should indicate to the audited
        organisation if there is any other means, process or link ultimately conferring control to another
        third country or a legal entity established in a third country (similar level of control on management
        and resources as the ownership of shares or assets and of long duration). (b) Supporting documents
        should provide evidence of any such control or a declaration that there is no such control (this
        declaration may come from the management board of the service provider). NB: The elements that
        should be taken into account when assessing control are the ownership structures and specific
        rights, corporate governance, commercial links conferring control, financial links conferring
        control and any other sources of control.

        7.2. Additional steps based on the conclusion of the ownership and control test If the auditing
        organisation determines that the audited provider is subject to the control of a third country
        or a third-country legal entity, it should request the following additional evidence: (c) Demonstrating
        that the Commission has adopted a decision pursuant to Article 19 regarding the third country
        for which the cloud computing service provider is subject to the control of; (d) All evidence
        demonstrating that the audited provider and any subcontractorinvolved in the provision of the
        audited service has implemented the necessary measures to enforce the effective legal, technical
        and organisational separation between the cloud computing service provider and any third country
        or legal entity established in a third country, ensuring that the cloud computing service provider
        is unable to comply, legally, technically and operationally, with any request to access customer
        data, including encrypted data, or to disrupt service continuity or to degrade service quality.
        (e) All evidence demonstrating that the public sector body will be informed of any such request
        and a confirmation that the request has been refused; (f) All evidence demonstrating the maintenance
        of an up-to-date record of any request to access customer data, to disrupt service continuity
        or to degrade service quality from a third country or a legal entity established in a third country,
        containing at least the request and the response to the request.'
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1:h
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1
      ref_id: 2.1(h)
      implementation_groups:
      - UAL-2
      typical_evidence: 'Annex III, audit criterion H – No technical and operational support outside of
        the Union

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (h) of Annex II based on the following evidence:

        (1) evidence that the audited provider has implemented binding contractual clauses stating that
        all support, administration, maintenance, monitoring, incident response, and operational activities
        must be initiated and performed exclusively in the Union. This could include contractual clauses
        requiring advanced disclosure of all subcontractors and support locations, prior written approval
        before engaging any new subcontractors, and a right to reject any subcontractors located outside
        of the Union;

        (2) evidence that the audited provider maintains an up-to-date subcontractor register;

        (3) evidence that the audited provider does not subcontract or transfer such activities outside
        of the Union;

        (4) evidence that the audited provider has implemented the necessary legal, technical and organisational
        measures to ensure that there can be no remote access for technical and operational support from
        outside the Union for the audited service.

        (5) evidence that the audited provider’s help desk/support services, infrastructure administration,
        operations of its security operations centre (SOC) or network operations centre (NOC), privileged
        access, backup handling, and disaster recovery operations of the audited service are exclusively
        provided from the Union, including the access path to operate the service;

        (6) evidence that the audited provider ensures that the personnel upon the departure from the
        company have no further access to the audited service and revokes all access policies;

        (7) evidence that the audited provider has implemented the necessary technical and organisational
        measures to ensure that administrative access to systems used to operate the audited service is
        provided through access paths located within the Union. This can be demonstrated through the implementation
        of geographically restricted network controls, Union-based administrative infrastructure, privileged
        access management controls, and monitoring mechanisms;

        (8) evidence that the audited provider has procedures in place that there is no effective control
        of a third country or a legal entity established in a third country, including for subsequent
        sub-outsourcing.'
      assessable: true
      description: the technical and operational support or assistance related to the audited service,
        including subsequent sub-outsourcing arrangements, are initiated and performed exclusively within
        the Union;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1:i
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-2:2.1
      ref_id: 2.1(i)
      implementation_groups:
      - UAL-2
      typical_evidence: 'Annex III, audit criterion I – Ensuring the transparency of the software supply
        chain

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (i) of Annex II based on the following evidence:

        (1) The audited provider should make available to the auditing organisation a complete and up-to-date
        software bill of materials (SBOM) for all software components, including open-source software
        (OSS).

        (2) The audited provider should make available to the auditing organisation a list of dependencies.
        This should include: (a) all software modules, libraries or application programming interfaces
        (APIs) used, as well as development tools; (b) origin of software: where (country of origin) and
        by whom the software is designed, developed and maintained, the location and jurisdiction governing
        the software distribution, and updates; (c) degree of reliance on non-EU vendors, facilities,
        or proprietary technologies; for level 3, evidence that in case the software stack is provided
        by a third coutnry entity, no unduly unjustified licensing restrictions are in place. (d) degree
        of reliance on open-source software; (e) visibility into the entire software manufacturer and
        sub-manufacturer chain, including audit rights. N.B. The requirements above imply that joint ventures
        made, e.g., of a Union entity with a legal entity established in a third country can qualify for
        this level

        (3) The audited provider should provide: (a) evidence of a risk-based process for identifying
        and mitigating dependencies on external software manufacturers relevant to the operation of the
        cloud computing service; (b) evidence that it has identified one or more alternative software
        solutions, including open-source software. If equivalent software cannot be identified, a solution
        ensuring minimal viable functionality must be identified. Tests must be implemented and a switchover
        plan enabling migration to such alternative solutions; (c) evidence that it can migrate to an
        alternative solution in the event of any defect or failure of the vendor or restrictions from
        a third country or a legal entity established in a third country; (d) provide a list of open standards
        that are followed as part of the audited providers policies regarding the audited service;

        (4) The audited provider should ensure transparency through remote access and source code auditability
        by: (a) making available to the auditing organisation a list of evidence to prove that there is
        no use of any remote features or mechanisms that could be used to materially tamper with or disrupt
        a device, system, or software. This should include: i. evidence related to the testing of the
        software component to prevent the use of any remote features or mechanisms that could be used
        to materially tamper with or disrupt a device, system, or software (test procedure, test reports,
        test plan, etc.); ii. evidence that the organisation’s change management procedures cover any
        change in firmware, bios and software updates as well as integration of a new components to prevent
        the use of any remote feature or mechanism; iii. evidence that the maintenance procedure is updated
        to include preventing any remote feature or mechanism that could be used to materially tamper
        with or disrupt a device, system or software. (b) The audited provider must ensure that the third-party
        independent auditor is granted the right to access and audit the source code of such software.
        The audited provider must also ensure that all documentation, technical material, information
        necessary to evaluate and audit the source code are made available to the auditing organisation
        in a complete, accurate, and accessible format.'
      assessable: false
      description: 'the audited provider demonstrates that the following software supply chain measures
        are in place:'
