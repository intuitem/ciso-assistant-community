        related to other sources of control: (a) The audited providers should indicate to the audited
        organisation if there is any other means, process or link ultimately conferring control to another
        third country or a legal entity established in a third country (similar level of control on management
        and resources as the ownership of shares or assets and of long duration). (b) Supporting documents
        should provide evidence of any such control or a declaration that there is no such control (this
        declaration may come from the management board of the service provider). NB: The elements that
        should be taken into account when assessing control are the ownership structures and specific
