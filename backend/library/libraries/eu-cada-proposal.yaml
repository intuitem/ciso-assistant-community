    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:a
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1
      ref_id: 3.1(a)
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion A – Union establishment

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (a) of Annex II based on the following:

        (1) Any evidence demonstrating that the audited provider is incorporated under the law of a Member
        State in the Union or otherwise constituted in line with company law of a Member State in the
        Union.

        (2) Any evidence that the registered office, central administration, and main establishment of
        the audited provider is established within the Union.

        (3) The auditing organisation should verify the applicable Union legal framework of the audited
        provider and verify whether their establishment is genuine and stable or whether the audited provider
        instead qualifies only as a non-EU provider offering services in the Union.

        (4) The auditing organisation should verify whether the provider is legally incorporated in a
        Member State of the Union. Evidence of this could include, but is not limited to, the national
        company extracts, tax residency documentation, business licences, VAT registration, verification
        of whether the provider is registered in the Business Registers Interconnected System (BRIS) and
        the VAT information Exchange System (VIES).

        (5) The auditing organisation should verify the stable and effective presence in the Union of
        the audited provider. The auditing organisation should therefore verify that: (a) EU physical
        offices or operational premises exist (for example, through lease contracts, utility bills or
        property documents); (b) permanent staff is located in the Union and that customer support operations
        are carried out in the Union (for example, through employment contracts, payroll records, personnel
        timesheets); (c) contractual operations are handled in the Union (for example, through activity
        management records, incident reporting records); (d) banking and accounting functions are exclusively
        in the Union (for example, through financial statements and statutory audit reports).

        (6) The auditing organisation should verify the presence of EU Member State establishment units
        or branches (for example, through lease contracts, utility bills, property documents, employment
        contracts, timesheets, payroll records or purchase orders).'
      assessable: true
      description: the audited provider and the subcontractors which are involved in the provision of
        the audited service are established in the Union;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:b
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1
      ref_id: 3.1(b)
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion B – Location of infrastructure, assets, and personnel

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (b) of Annex II based on the following evidence:

        (1) Location of infrastructure (a) A list with relevant details of the location of the infrastructure
        and data storage locations used in the provision of the audited service. This list should include
        the precise location (number, street, city, postal code and country) of the infrastructure demonstrating
        that all elements remain within the Union for the provision of the audited service. This includes
        the location for the primary, backup, disaster recovery and log storage. (b) Any other evidence
        that the IT infrastructure is located in the Union such as lease agreements, property deeds, maintenance
        contracts, service contracts, facility access logs. (c) Network diagrams and architecture documents
        illustrating the exclusive use of Union-based infrastructure for data storage and processing,
        including backup and replicated data.

        (2) Location of assets (a) A list and relevant details of the assets used in the provision of
        the audited service, such as an asset register. (b) Evidence that servers, equipment, and operational
        assets are located in the Union, such as records identifying the server and its location, purchase
        invoices, delivery notes, licence agreements, subscription contracts, or invoices for software
        purchases or subscriptions, invoices with delivery proofs for hardware. (c) Evidence that service
        delivery capabilities are based in the Union, such as deployment records, installation records,
        service status reports, configuration reports, monitoring outputs, admin logs showing usage of
        the service.

        (3) Location of personnel (a) A list and relevant details of the personnel involved in the provision
        of the audited service. (b) Evidence that the personnel involved in the provision of the audited
        service are located in the Union, including employment contracts, payroll records, timesheets,
        activity records, and organisational charts showing Union-based staff with operational responsibilities.

        (4) Considerations regarding the infrastructure, assets and personnel (a) The auditing organisation
        should also assess where such infrastructure, assets, or personnel: i. store, transmit, access,
        process or otherwise handle customer data; ii. provide, enable, or could enable administrative
        access to, control over, configuration of, or visibility into customer data; iii. if compromised,
        misconfigured, made unavailable or disrupted could reasonably result in the disruption or unavailability
        of the audited service. NB: ‘Infrastructure’ means physical infrastructure, including but not
        limited to, data centre infrastructure or colocation infrastructure, network, cooling, and IT
        systems that allow for the management of the datacentre. ‘Assets’ means hardware and software,
        including, but not limited to, libraries, the internal network needed for software components
        to communicate, cryptographic materials that enables the provision of the cloud computing service.
        ‘Personnel’, including personnel managed by subcontractors, means individuals who support the
        delivery, administration, security, availability, or operation of the audited service.'
      assessable: true
      description: the infrastructure, assets, and personnel of the audited provider, including those
        of the subcontractors which are involved in the provision of the service, are located in the Union;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:c
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1
      ref_id: 3.1(c)
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion C – Data localisation in the Union

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (c) of Annex II based on the following evidence:

        (1) Evidence demonstrating that customer data are stored and processed exclusively in the Union
        and that third-parties or subcontractors that do not meet the conditions under this Annex are
        in no circumstances technically or operationally able to access, obtain, make unavailable, destroy
        or more generally process customer data without prior authorisation. Examples include access logs,
        support access policies, privileged access records, backup retention policy, data flows diagram
        demonstrating where the customer data are stored, processed, replicated and backed up. When processing
        personal data, contracts with the subcontractors that demonstrate compliance with Regulation (EU)
        2016/679.

        (2) Evidence of logs and monitoring records demonstrating that all data are stored and processed
        exclusively within the Union. Examples include master service agreements, data processing agreements,
        data residency contractual agreements or any EU data boundary.

        (3) Evidence (such as contractual agreements, logs, and procedures offered to public sector bodies
        ) demonstrating that the audited provider and the subcontractors which are involved in the provision
        of the audited service have put in place the necessary measures to ensure that: (a) no customer
        data, including encrypted data, are transferred outside of the Union without public sector body
        approval; (b) no data are transferred to any third-party other than subcontractors which are involved
        in the provision of the service or recipients expressly authorised by the public sector body.

        (4) A data flow diagram showing the flows of data between the cloud computing service provider
        and customer data, as well as with third-party services and subcontractors. The diagram must clearly
        identify the source and destination of data and demonstrate that the data does not leave the Union.
        NB: For the purpose of this Annex, a customer means a public sector body who has entered into
        a contractual or other legally binding arrangement with the cloud computing service provider for
        the purpose of accessing or using the cloud computing service. ‘Customer data’ could mean any
        data under the control of the cloud computing service customer, whether by legal, contractual,
        or other means, that are: (a) input into the cloud computing service by or on behalf of the customer,
        including authentication credentials; (b) produced through the customer’s use of the cloud computing
        service. Customer data may also include data under the audited providers control that are derived
        as a result of interaction with the audited service by the cloud service customer. This includes
        customer data and any data resulting from the usage of the cloud computing services (i.e. telemetry,
        metadata). ‘Cloud compunting service derived data’ includes the portion of log data containing
        records of who used the service, at what times, which functions, types of data involved and so
        on. It can also include information about the numbers of authorised users and their identities.
        It can also include any configuration or customisation data, where the cloud computing service
        has such configuration and customisation functionalities.'
      assessable: true
      description: the customer data, including metadata and telemetry data, that is processed, stored
        and transferred by the audited provider and the subcontractors which are involved in the provision
        of the service, remain exclusively within the Union unless the public sector body explicitly requires
        otherwise and at any time, including before, during or after the configuration or use of the service;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:d
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1
      ref_id: 3.1(d)
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion D – Union citizenship

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (d) of Annex II based on the following evidence:

        (1) The audited provider should provide the auditing organisation with proof that it has implemented
        the measures to ensure that, if a public sector body were to request Union citizenship, the personnel
        involved in the provision of the audited service are Union citizens. This can be demonstrated
        through valid official government issued documents (e.g. valid passport and national identity
        card);

        (2) The audited provider should provide organisational charts and job descriptions confirming
        that it can ensure, where requested, that only personnel with Union citizenship have access to
        the audited service''s operation, management, maintenance, and support.

        (3) The audited provider should provide documents demonstrating access control policies and audit
        trails showing that only authorised personnel who are Union citizens can access the service''s
        systems and data.

        (4) The audited provider should demonstrate that it has put in place procedures describing how
        citizenship is verified before assignment and how compliance with this audit criterion is maintained
        throughout employment. NB: Personnel involved in the provision of the audited service could include
        personnel who have logical or physical access to infrastructure and assets used to operate the
        cloud computing service, as well as those who are responsible for customer support, and all personnel
        who have management control of the cloud compunting service provider.'
      assessable: true
      description: the personnel, including the personnel of the subcontractors which are involved in
        the provision of the audited service are Union citizens and where appropriate, the personnel must
        also have the necessary national security clearance issued by a Member State when handling classified
        information, as defined in Article 2, point (21), of Regulation (EU) 2021/697;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:e
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1
      ref_id: 3.1(e)
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion E – European cybersecurity certification scheme adopted
        under Regulation 2019/881

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (e) of Annex II based on the following evidence:

        (1) A valid European cybersecurity certificate issued by a competent conformity assessment body
        demonstrating that the audited service has been assessed and found compliant with the requirements
        corresponding to the ‘basic’, ‘substantial’ or ‘high’ assurance levels under a European cybersecurity
        certification scheme adopted under Regulation (EU) 2019/881, provided that such shas been established
        ;

        (2) A certification report including a description of the main components used for the development
        and operation of the cloud computing service that is covered by the audit certificate.

        (3) Until the European cybersecurity certification scheme covering cloud computing services has
        been established, the audited provider can demonstrate compliance through valid cybersecurity
        certifications. This can include, but is not limited to, the following: (a) a valid certificate
        issued by a competent conformity assessment body (in line with CEN/CLC/TS 18072:2025) demonstrating
        that the cloud computing service has been assessed and found compliant with the requirements corresponding
        to the ‘basic’ or ‘substantial’ or ‘high’ assurance levels defined under CEN/TS 18026:2024; (b)
        A valid certificate issued by the relevant national competent authority demonstrating that the
        cloud computing service has been assessed and found compliant with the requirements under the
        national cybersecurity scheme currently in place in the Member State; (c) in the absence of a
        national scheme, evidence demonstrating adherence to the highest level of cybersecurity standards
        available on the market.'
      assessable: true
      description: the audited service obtains a European cybersecurity certificate of at least assurance
        level ‘substantial’ under a European cybersecurity certification scheme covering cloud computing
        services to be established under Regulation (EU) 2019/881, provided that such a scheme has been
        established under that Regulation and is available to cloud computing service providers. Until
        the establishment of such a scheme, national cybersecurity certification schemes shall apply,
        where they exisit. Where no Union or national cybersecurity certification schemes exist, the audited
        provider is to demonstrate that the service complies with the highest cybersecurity standards
        under applicable Union law;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:f
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1
      ref_id: 3.1(f)
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion F – AI systems operated by a third country or third
        country legal entity

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (f) of Annex II based on the following evidence:

        (1) Contractual clauses stating that data processed or generated by using the audited service,
        including customer-derived data, logs and telemetry, will not be used to train or fine-tune any
        AI model or system operated by a third country or a third-country legal entity, and are not transferred
        outside the Union in any case.

        (2) Contractual clauses specifying that data are processed solely for the delivery of the audited
        service and not for service improvements or model or system enhancements or any other secondary
        purpose.

        (3) Data flow diagrams documenting the end-to-end flow of data, covering data ingestion, storage,
        processing and deletion. The diagrams should also show where the AI pipelines or machine learning
        operations (MLOps) connect with customer data.

        (4) MLOps or deployment records demonstrating that the build, test and release locations are in
        the EU.

        (5) Model or system cards covering the model or system name, version, training and validation
        sources, including statements that the data generated by using the audited service does not leave
        the Union.

        (6) Data lineage polices and related implementation documentation that shows that the provider
        operates data lineage and provenance tools and that can demonstrate (per record) what the data
        has been used for.

        (7) A list of the subcontractors (indicating their country of establishment) that access the data
        generated by using the audited service.'
      assessable: true
      description: the data generated by using the audited service are not used to train or fine-tune
        any AI system operated by a third country or a legal entity established in a third-country and
        are not transferred outside the Union in any case;
    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:g
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1
      ref_id: 3.1(g)
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion G – Absence of third-country control or third-country
        entity control

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (g) of Annex II based on the following evidence:

        (1) The auditing organisation should identify and analyse: (a) all direct and indirect shareholders,
        up to the ultimate owners; (b) the cap table documenting the company’s ownership structure; (c)
        the body or bodies empowered to take strategic decisions (general assembly of shareholders, supervisory
        board, board of directors, etc.); (d) the rules for the appointment/election/removal of governing
        bodies and the actual composition of the governing bodies (e.g. to identify if any shareholder
        is entitled to nominate a board representative or has majority seats in the board); (e) the quorums
        and majority required for adopting strategic decisions, in order to determine if any shareholder
        can take a strategic decision (either because they have the required majority to approve such
        a decision or because they can block such a decision through a veto or other specific rights even
        if they cannot impose such a decision on their own, etc.); (f) the possible influence on strategic
        decisions through commercial links, financial links or other means, etc.

        (2) The audited provider should request all the above information from its subcontractors and
        make it available to the auditing organisation.

        7.1. Assessment of ownership and control:

        (1) The audited provider should provide the auditing organisation with the following evidence
        related to the headquarters: (a) the location and full address of the global headquarters and/or
        head office; (b) the locations of the executive management structures.

        (2) The audited provider should provide the auditing organisation with the following evidence
        related to the ownership structure and specific rights: (a) A detailed list describing any owners
        that: i. hold, directly or indirectly, at least 5% of the capital or at least 5% of the voting
        rights, including through any content, understanding, relationship or intermediary. This includes
        voting agreements between shareholders that would together have more than 5% of the voting rights
        or 5% of the capital; ii. have one or more of the following specific rights in relation to their
        ownership: (a) right to veto a transfer of shares; (b) pre-emption rights; (c) right to purchase
        additional shares or investment subject to conditions. (b) The auditing organisation should request
        the following supporting documents to assess the elements in paragraph 2(a): i. commercial registry
        extracts and shareholders’ books of the organisation and any other relevant document that clearly
        indicate the shareholders and their voting rights or percentage of interest; ii. shareholders’
        agreement, memorandum of understanding among shareholders, statutes, articles of association or
        other relevant documents regarding the decision-making procedures within the legal entity, investment
        agreements between the shareholders, etc.; iii. for any shareholders that are legal persons that
        hold at least 5% in the capital or at least 5% of the voting rights:

        (1) a graph describing the different ownership layers/chain of control until the ultimate owners;

        (2) the articles of association, bylaws or equivalent constitutional documents;

        (3) a register of directors, officers and signatories.

        (3) The audited provider should provide the auditing organisation with the following evidence
        related to the corporate governance: (a) The audited provider should provide the auditing organisation
        with a description of: i. the decision-making bodies, their composition as well as their nationality
        or place of establishment (where applicable); ii. the rules regarding election, appointment, nomination
        or tenure of members of the decision-making bodies or other management positions; iii. the decision-making
        procedures, including information on the required majority and/or quorum needed for decisions;
        iv. internal governance policies describing how ownership and control decisions are recorded and
        approved; board and management decisions reflecting the stated control structure; board minutes
        and resolutions for control changes. (b) The audited provider should provide the auditing organisation
        with supporting documents setting out or describing: the decision-making bodies and the rules
        on their election, appointment, nomination or tenure, decision-making procedures, voting rights,
        veto rights, appointment rights, approval rights within the legal entity (e.g. articles of association
        bylaws, reports on corporate governance, etc.). The supporting documents and information should
        be provided for each intermediate legal entity that directly or indirectly holds 5% or more of
        the capital or voting rights, up to the ultimate owners of all the layers involved.

        (4) The audited provider should provide the following control-related evidence to the auditing
        organisation: (a) The audited provider should provide the auditing organisation with the evidence
        of the commercial links conferring control. This includes, but is not limited to, a list of individuals
        or legal entities with whom the audited providers (or the owners of the audited provider, including
        intermediate layers until the ultimate owners) have a commercial relationship that (a) leads to
        a similar level of control on management and resources as the ownership of shares or assets; and
        (b) is of very long duration (e.g. very important long-term supply agreements or credits provided
        by software manufacturers/customers, coupled with structural links). (b) The supporting documents
        should include cooperation agreements with the public sector body or software manufacturers ,
        etc.

        (5) The audited provider should provide the auditing organisation with the following evidence
        related to the financial links conferring control: (a) The audited provider should list the individuals
        or legal entities (including controlling shareholders or owners) on whom the audited provider
        (or the owners) are financially dependent in a way that could allow them to obtain concessions
        in strategic business areas. (b) The supporting documents should include loan documents, by-laws,
        documents showing the financial link; etc.

        (6) The audited provider should provide the auditing organisation with the following evidence
        related to other sources of control: (a) The audited providers should indicate to the audited
        organisation if there is any other means, process or link ultimately conferring control to another
        third country or a legal entity established in a third country (similar level of control on management
        and resources as the ownership of shares or assets and of long duration). (b) Supporting documents
        should provide evidence of any such control or a declaration that there is no such control (this
        declaration may come from the management board of the service provider). NB: The elements that
        should be taken into account when assessing control are the ownership structures and specific
        rights, corporate governance, commercial links conferring control, financial links conferring
        control and any other sources of control.

        7.2. Additional steps based on the conclusion of the ownership and control test If the auditing
        organisation determines that the audited provider is subject to the control of a third country
        or a third-country legal entity, it should request the following additional evidence: (c) Demonstrating
        that the Commission has adopted a decision pursuant to Article 19 regarding the third country
        for which the cloud computing service provider is subject to the control of; (d) All evidence
        demonstrating that the audited provider and any subcontractorinvolved in the provision of the
        audited service has implemented the necessary measures to enforce the effective legal, technical
        and organisational separation between the cloud computing service provider and any third country
        or legal entity established in a third country, ensuring that the cloud computing service provider
        is unable to comply, legally, technically and operationally, with any request to access customer
        data, including encrypted data, or to disrupt service continuity or to degrade service quality.
        (e) All evidence demonstrating that the public sector body will be informed of any such request
        and a confirmation that the request has been refused; (f) All evidence demonstrating the maintenance
        of an up-to-date record of any request to access customer data, to disrupt service continuity
        or to degrade service quality from a third country or a legal entity established in a third country,
        containing at least the request and the response to the request.'
      assessable: false
      description: 'the audited provider and the subcontractors which are involved in the provision of
        the audited service are not subject to the control of a third country or a legal entity established
        in a third-country. By way of derogation to this criterion, a cloud computing service provider
        and its subcontractors which are involved in the provision of the audited service that are subject
        to the control of a third country or a legal entity established in a third-country may be audited
        for Union assurance level 3 where the Commission has adopted an implementing act under Article
        19. Where the Commission has adopted an implementing act under Article 19, the audited provider
        and the subcontractors which are involved in the provision of the audited service must also demonstrate
        that the necessary legal, technical and organisational measures have been implemented to ensure
        that the:'
