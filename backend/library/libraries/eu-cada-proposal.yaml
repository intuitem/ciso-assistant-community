    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:i:i
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-3:3.1:i
      ref_id: 3.1(i)(i)
      description: a complete and up-to-date SBOM and a list of identified dependencies relevant to the
        provision of the service are documented and made available to the auditing organisation;
      implementation_groups:
      - UAL-3
      typical_evidence: 'Annex III, audit criterion I – Ensuring the transparency of the software supply
        chain

        The auditing organisation should assess the audit criterion listed under Union assurance levels
        2, 3, and 4 paragraph (i) of Annex II based on the following evidence:

        (1) The audited provider should make available to the auditing organisation a complete and up-to-date
        software bill of materials (SBOM) for all software components, including open-source software
        (OSS).

        (2) The audited provider should make available to the auditing organisation a list of dependencies.
        This should include: (a) all software modules, libraries or application programming interfaces
        (APIs) used, as well as development tools; (b) origin of software: where (country of origin) and
        by whom the software is designed, developed and maintained, the location and jurisdiction governing
        the software distribution, and updates; (c) degree of reliance on non-EU vendors, facilities,
        or proprietary technologies; for level 3, evidence that in case the software stack is provided
        by a third coutnry entity, no unduly unjustified licensing restrictions are in place. (d) degree
        of reliance on open-source software; (e) visibility into the entire software manufacturer and
        sub-manufacturer chain, including audit rights. N.B. The requirements above imply that joint ventures
        made, e.g., of a Union entity with a legal entity established in a third country can qualify for
        this level

        (3) The audited provider should provide: (a) evidence of a risk-based process for identifying
        and mitigating dependencies on external software manufacturers relevant to the operation of the
        cloud computing service; (b) evidence that it has identified one or more alternative software
        solutions, including open-source software. If equivalent software cannot be identified, a solution
        ensuring minimal viable functionality must be identified. Tests must be implemented and a switchover
        plan enabling migration to such alternative solutions; (c) evidence that it can migrate to an
        alternative solution in the event of any defect or failure of the vendor or restrictions from
        a third country or a legal entity established in a third country; (d) provide a list of open standards
        that are followed as part of the audited providers policies regarding the audited service;

        (4) The audited provider should ensure transparency through remote access and source code auditability
        by: (a) making available to the auditing organisation a list of evidence to prove that there is
        no use of any remote features or mechanisms that could be used to materially tamper with or disrupt
        a device, system, or software. This should include: i. evidence related to the testing of the
        software component to prevent the use of any remote features or mechanisms that could be used
        to materially tamper with or disrupt a device, system, or software (test procedure, test reports,
        test plan, etc.); ii. evidence that the organisation’s change management procedures cover any
        change in firmware, bios and software updates as well as integration of a new components to prevent
        the use of any remote feature or mechanism; iii. evidence that the maintenance procedure is updated
        to include preventing any remote feature or mechanism that could be used to materially tamper
        with or disrupt a device, system or software. (b) The audited provider must ensure that the third-party
        independent auditor is granted the right to access and audit the source code of such software.
        The audited provider must also ensure that all documentation, technical material, information
        necessary to evaluate and audit the source code are made available to the auditing organisation
        in a complete, accurate, and accessible format.'
