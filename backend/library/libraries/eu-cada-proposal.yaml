    - urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-1:1.1:c
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:eu-cada-proposal:ual-1:1.1
      ref_id: 1.1(c)
      implementation_groups:
      - UAL-1
      assessable: true
      description: the customer data, including metadata and telemetry data, that is processed, stored
