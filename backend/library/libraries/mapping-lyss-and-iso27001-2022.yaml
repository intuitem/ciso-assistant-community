name: LYSS (draft 0.7.0) -> ISO/IEC 27001:2022
description: 'Mapping between LYSS (Lyaazale Switch Security) specification 0.7.0-draft
  and ISO/IEC 27001:2022 Annex A, from the informative references of the specification.
  Each LYSS control is a specific, testable part (subset) of the ISO control it maps
  to. Compliant LYSS requirements give at most partial coverage of the ISO control.
  Non-compliant ones make it non-compliant when no other mapped LYSS requirement is
  compliant; if some are compliant and some are not, the ISO control is partially
  compliant. One direction only: an ISO control judged compliant proves nothing about
  a given switch. DRAFT: controls and mappings may still change before LYSS 1.0, but
  control identifiers are stable: never renamed, renumbered or reused. Generated from
  spec/lyss-spec.yaml by tools/build_ciso_library.py in the LYSS repository (https://github.com/lyss-project/lyss).'
