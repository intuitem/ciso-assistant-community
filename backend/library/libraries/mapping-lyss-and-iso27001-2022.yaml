description: 'Mapping between LYSS (Lyaazale Switch Security) specification 0.4.0-draft
  and ISO/IEC 27001:2022 Annex A, from the informative references of the specification.
  Each LYSS control is a specific, testable part (subset) of the ISO control it maps
  to: a compliant LYSS requirement gives at most partial coverage of the ISO control,
  a non-compliant one makes it non-compliant. One direction only: an ISO control judged
  compliant proves nothing about a given switch. DRAFT: controls, identifiers and
