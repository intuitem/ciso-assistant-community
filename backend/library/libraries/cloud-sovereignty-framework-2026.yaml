urn: urn:intuitem:risk:library:cloud-sovereignty-framework-2026
locale: en
ref_id: cloud-sovereignty-framework-2026
name: Cloud Sovereignty Framework (June 2026)
description: 'Cloud Sovereignty Framework - Implementation guidance and Annex - Sovereignty assessment
  calculator, European Commission, 1 June 2026. 48 specific objectives across 8 sovereignty objectives.
  Each answer scores its official points rescaled to 0-100, and the audit''s weighted average equals the
  official sovereignty score divided by 10. Each answer also shows its SEAL level; the overall SEAL is
  the lowest SEAL among the answers (not computed by the app).


  SEAL-0 - No Sovereignty: Service, technology or operations under exclusive control of non-EU third parties,
  governed entirely by non-EU jurisdictions.

  SEAL-1 - Jurisdictional Sovereignty: EU law formally applies with limited practical enforceability;
  service, technology or operations under exclusive control of non-EU third parties.

  SEAL-2 - Data Sovereignty: EU jurisdictions apply, with material dependencies remain; service, technology
  or operations under indirect control of non-EU third parties.

  SEAL-3 - Technological Sovereignty: EU jurisdictions apply, EU actors exercising meaningful but not
  full influence; service, technology or operations under marginal control of non-EU third parties.

  SEAL-4 - Full Digital Sovereignty: Technology and operations under complete EU control, subject only
  to EU jurisdiction, with no critical non-EU dependencies.'
copyright: © European Union, 2026. Reuse is authorised provided the source is acknowledged (Commission
  Decision 2011/833/EU).
version: 1
publication_date: '2026-06-01'
