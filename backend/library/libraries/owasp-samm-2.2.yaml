    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v
      assessable: false
      depth: 1
      ref_id: V
      name: Verification
      description: Verification focuses on the processes and activities related to how an organization
        checks and tests artifacts produced throughout software development. This typically includes quality
        assurance work such as testing, but it can also include other review and evaluation activities.
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v
      ref_id: V-AA
      name: Architecture Assessment
      description: |-
        The Architecture Assessment (AA) practice ensures that the application and infrastructure architecture adequately meets all relevant security and compliance requirements, and sufficiently mitigates identified security threats. The first stream focuses on verifying that the security and compliance requirements identified in the Policy and Compliance, and Security Requirements, practices are met, first in an ad-hoc manner, then more systematically for each interface in the system. The second stream reviews the architecture, first for mitigations against typical threats, then against the specific threats identified in the Threat Assessment practice.

        In its more advanced form, the practice formalizes the architecture security review process, continuously evaluates the effectiveness of the architecture's security controls, their scalability and strategic alignment. Identified weaknesses and possible improvements are fed back to the Secure Architecture practice to improve reference architectures.

        Level 1 objective: Review the architecture to ensure baseline mitigations are in place for typical risks.

        Level 2 objective: Review the complete provision of security mechanisms in the architecture.

        Level 3 objective: Review the architecture effectiveness and feedback results to improve the security of the architecture.
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-a
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa
      ref_id: V-AA-A
      name: Architecture Validation
      description: Architecture validation confirms the security of the software and supporting architecture
        by identifying application and infrastructure architecture components and verifying their provision
        of security objectives and requirements.
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-1-a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-a
      ref_id: V-AA-1-A
      name: Assess application architecture
      description: |-
        Identify application and infrastructure architecture components and review for basic security provisioning.

        Create a view of the overall architecture and examine it for the correct provision of general security mechanisms such as authentication, authorization, user and rights management, secure communication, data protection, key management and log management. Also consider the support for privacy. Do this based on project artifacts such as architecture or design documents, or interviews with business owners and technical staff. Also consider the infrastructure components - these are all the systems, components and libraries (including SDKs) that are not specific to the application, but provide direct support to use or manage the application(s) in the organization.

        Note any security-related functionality in the architecture and review its correct provision. Do this in an ad hoc manner, from the point of view of anonymous users, authorized users, and specific application roles.
      annotation: 'Benefit: Understanding of high-level architecture and sensible security measures'
      implementation_groups:
      - '1'
      - '2'
      - '3'
      typical_evidence: |-
        - You have an agreed upon model of the overall software architecture
        - You include components, interfaces, and integrations in the architecture model
        - You verify the correct provision of general security mechanisms
        - You log missing security controls as defects
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-1-a:question:1:
          type: unique_choice
          text: Do you review the application architecture for key security objectives on an ad-hoc basis?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-1-a:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-1-a:question:1:choice:2
            value: Yes, for some applications
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-1-a:question:1:choice:3
            value: Yes, for at least half of the applications
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-1-a:question:1:choice:4
            value: Yes, for most or all of the applications
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-2-a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-a
      ref_id: V-AA-2-A
      name: Verify the application architecture for security methodically
      description: |-
        Validate the architecture security mechanisms.

        Verify that the solution architecture addresses all identified security and compliance requirements. For each interface in the application, iterate through the list of security and compliance requirements and analyze the architecture for their provision. Also perform an interaction or data flow analysis to ensure that the requirements are adequately addressed over different components. Elaborate the analysis to show the design-level features that address each requirement.

        Perform this type of analysis on both internal interfaces, e.g. between tiers, as well as external ones, e.g. those comprising the attack surface. Also identify and validate important design decisions made as part of the architecture, in particular when they deviate from the available shared security solutions in the organization. Finally, update the findings based on changes made during the development cycle, and note any requirements that are not clearly provided at the design level as assessment findings.
      annotation: 'Benefit: Consistent architecture review process across your organization'
      implementation_groups:
      - '2'
      - '3'
      typical_evidence: |-
        - You review compliance with internal and external requirements
        - You systematically review each interface in the system
        - You use a formalized review method and structured validation
        - You log missing security mechanisms as defects
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-2-a:question:1:
          type: unique_choice
          text: Do you regularly review the security mechanisms of your architecture?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-2-a:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-2-a:question:1:choice:2
            value: Yes, for some applications
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-2-a:question:1:choice:3
            value: Yes, for at least half of the applications
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-2-a:question:1:choice:4
            value: Yes, for most or all of the applications
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-3-a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-a
      ref_id: V-AA-3-A
      name: Verify the effectiveness of security components
      description: |-
        Review of the architecture components' effectiveness.

        Review the effectiveness of the architecture components and their provided security mechanisms in terms of alignment with the overall strategy of the organization, and scrutinize the degree of availability, scalability and enterprise-readiness of the chosen security solutions. While tactical choices for a particular application can make sense in specific contexts, it is important to keep an eye on the bigger picture and ensure future readiness of the designed solution.

        Feed any findings back into defect management to trigger further improvements to the architecture.
      annotation: 'Benefit: Assurance of effectiveness of architecture controls'
      implementation_groups:
      - '3'
      typical_evidence: |-
        - You evaluate the preventive, detective, and response capabilities of security controls
        - You evaluate the strategy alignment, appropriate support, and scalability of security controls
        - You evaluate the effectiveness at least yearly
        - You log identified shortcomings as defects
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-3-a:question:1:
          type: unique_choice
          text: Do you regularly review the effectiveness of the security controls?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:v-aa-3-a:question:1:choice:1
            value: 'No'
