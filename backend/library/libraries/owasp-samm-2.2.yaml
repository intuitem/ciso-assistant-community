            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-2-a:question:1:choice:2
            value: Yes, for some of our data
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-2-a:question:1:choice:3
            value: Yes, for at least half of our data
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-2-a:question:1:choice:4
            value: Yes, for most or all of our data
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-a
      ref_id: O-OM-3-A
      name: Respond to data breaches
      description: |-
        Automate detection of policy non-compliance, and audit compliance periodically. Regularly review and update to data catalog and data protection policy.

        Activities at this maturity level are focused on automating data protection, reducing your reliance on human effort to assess and manage compliance with policies. There is a focus on feedback mechanisms and proactive reviews, to identify and act on opportunities for process improvement.

        Implement technical controls to enforce compliance with your Data Protection Policy, and put monitoring in place to detect attempted or actual violations. You may use a variety of available tools for data loss prevention, access control and tracking, or anomalous behavior detection.

        Regularly audit compliance with established administrative controls, and closely monitor performance and operation of automated mechanisms, including backups and record deletions. Monitoring tools quickly detect and report failures in automation, permitting you to take timely corrective action.

        Review and update the data catalog regularly, to maintain its accurate reflection of your data landscape. Regular reviews and updates of processes and procedures maintain their alignment with your policies and priorities.
      annotation: 'Benefit: Technically enforced compliance with your data protection policy'
      implementation_groups:
      - '3'
      typical_evidence: |-
        - You have automated monitoring to detect attempted or actual violations of the Data Protection Policy
        - You have tools for data loss prevention, access control and tracking, or anomalous behavior detection
        - You periodically audit the operation of automated mechanisms, including backups and record deletions
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-a:question:1:
          type: unique_choice
          text: Do you regularly review and update the data catalog and your data protection policies
            and procedures?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-a:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-a:question:1:choice:2
            value: Yes, but we do it ad-hoc
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-a:question:1:choice:3
            value: Yes, we do it regularly
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-a:question:1:choice:4
            value: Yes, we do it continuously
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-b
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om
      ref_id: O-OM-B
      name: System Decommissioning / Legacy Management
      description: From the perspective of the organization as a consumer of resources, the activities
        in this stream focus on the identification, management, and tracking of systems, applications,
        application dependencies, and services that are no longer used, have reached end of life, or are
        no longer actively developed or supported. Removal of unused systems and services improves manageability
        of the environment and reduces the organization's attack surface, while affording direct and indirect
        cost savings (e.g., reduced license count, reduced logging volume, or reduced analyst effort).
