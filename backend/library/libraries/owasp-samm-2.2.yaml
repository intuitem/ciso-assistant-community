      ref_id: I-DM
      name: Defect Management
      description: |-
        The Defect Management (DM) practice focuses on collecting, recording, and analyzing software security defects and enriching them with information to drive metrics-based decisions.

        The practice’s first stream deals with the process of handling and managing defects to ensure released software has a given assurance level. The second stream focuses on enriching the information about the defects and deriving metrics to guide decisions about the security of individual projects and of the security assurance program as a whole.

        In a sophisticated form, the practice requires formalized, independent defect management and real-time, correlated information to detect trends and influence security strategy.

        Level 1 objective: All defects are tracked within each project.

        Level 2 objective: Defect tracking is used to influence the deployment process.

        Level 3 objective: Defect tracking across multiple components is used to help reduce the number of new defects.
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-a
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm
      ref_id: I-DM-A
      name: Defect Tracking
      description: Defect tracking manages the collection and follow-up of all potential issues in a piece
        of software, from architectural flaws to coding issues and run-time vulnerabilities.
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-a
      ref_id: I-DM-1-A
      name: Track security defects centrally
      description: |-
        Introduce a structured tracking of security defects and make knowledgeable decisions based on this information.

        Introduce a common definition / understanding of a security defect and define the most common ways of identifying these. These typically include, but are not limited to:

        * Threat assessments
        * Penetration tests
        * Output from static and dynamic analysis scanning tools
        * Responsible disclosure processes or bug bounties

        Foster a culture of transparency and avoid blaming any teams for introducing or identifying security defects. Record and track all security defects in a defined location. This location doesn't necessarily have to be centralized for the whole organization, however ensure that you're able to get an overview of all defects affecting a particular application at any single point in time. Define and apply access rules for the tracked security defects to mitigate the risk of leakage and abuse of this information.

        Introduce at least rudimentary qualitative classification of security defects so that you are able to prioritize fixing efforts accordingly. Strive for limiting duplication of information and presence of false positives to increase the trustworthiness of the process.
      annotation: 'Benefit: Transparency of known security defects impacting particular applications'
      implementation_groups:
      - '1'
      - '2'
      - '3'
      typical_evidence: |-
        - You can easily get an overview of all security defects impacting one application
        - You have at least a rudimentary classification scheme in place
        - The process includes a strategy for handling false positives and duplicate entries
        - The defect management system covers defects from various sources and activities
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-a:question:1:
          type: unique_choice
          text: Do you track all known security defects in accessible locations?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-a:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-a:question:1:choice:2
            value: Yes, for some applications
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-a:question:1:choice:3
            value: Yes, for at least half of the applications
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-a:question:1:choice:4
            value: Yes, for most or all of the applications
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-a
      ref_id: I-DM-2-A
      name: Rate and track security defects
      description: |-
        Rate all security defects over the whole organization consistently and define SLAs for particular severity classes.

        Introduce and apply a well defined rating methodology for your security defects consistently across the whole organization, based on the probability and expected impact of the defect being exploited. This will allow you to identify applications which need higher attention and investments. In case you don't store the information about security defects centrally, ensure that you're still able to easily pull the information from all sources and get an overview about "hot spots" needing your attention.

        Introduce SLAs for timely fixing of security defects according to their criticality rating and centrally monitor and regularly report on SLA breaches. Define a process for cases where it's not feasible or economical to fix a defect within the time defined by the SLAs. This should at least ensure that all relevant stakeholders have a solid understanding of the imposed risk. If suitable, employ compensating controls for these cases.

        Even if you don't have any formal SLAs for fixing low severity defects, ensure that responsible teams still get a regular overview about issues affecting their applications and understand how particular issues affect or amplify each other.
      annotation: 'Benefit: Consistent classification of security defects with clear expectations of their
        handling'
      implementation_groups:
      - '2'
      - '3'
      typical_evidence: |-
        - A single severity scheme is applied to all defects across the organization
        - The scheme includes SLAs for fixing particular severity classes
        - You regularly report compliance to SLAs
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-a:question:1:
          type: unique_choice
          text: Do you keep an overview of the state of security defects across the organization?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-a:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-a:question:1:choice:2
            value: Yes, for some applications
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-a:question:1:choice:3
            value: Yes, for at least half of the applications
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-a:question:1:choice:4
            value: Yes, for most or all of the applications
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-a
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-a
      ref_id: I-DM-3-A
      name: Enforce an SLA for defect management
      description: |-
        Enforce the predefined SLAs and integrate your defect management system with other relevant tooling.

        Implement an automated alerting on security defects if the fix time breaches the defined SLAs. Ensure that these defects are automatically transferred into the risk management process and rated by a consistent quantitative methodology. Evaluate how particular defects influence or amplify each other not only on the level of separate teams, but on the level of the whole organization. Use the knowledge of the full kill chain to prioritize, introduce and track compensating controls mitigating the respective business risks.

        Integrate your defect management system with the automated tooling introduced by other practices, e.g.:

        * Build and Deployment: Fail the build / deployment process if security defects above certain severity affect the final artifact, unless someone explicitly signs off the exception.
        * Monitoring: If possible, ensure that abuse of the security defect in production environment is recognized and alerted.
      annotation: 'Benefit: Assurance that security defects are handled within predefined SLAs'
      implementation_groups:
      - '3'
      typical_evidence: |-
        - You automatically generate alerts for SLA breaches and transfer respective defects to the risk management process
        - You integrate relevant tooling (e.g. monitoring, build, deployment) with the defect management system
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-a:question:1:
          type: unique_choice
          text: Do you enforce SLAs for fixing security defects?
