            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-b:question:1:choice:3
            value: Yes, for at least half of the applications
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-b:question:1:choice:4
            value: Yes, for most or all of the applications
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-b
      ref_id: I-DM-2-B
      name: Define advanced defect metrics
      description: |-
        Collect standardized defect management metrics and use these also for prioritization of centrally driven initiatives.

        Define, collect and calculate unified metrics across the whole organization. These might include:

        * Total amount of verification activities and identified defects.
        * Types and severities of identified defects.
        * Time to detect and time to resolve defects.
        * Windows of exposure of defects being present on live systems.
        * Number of regressions / reopened vulnerabilities.
        * Coverage of verification activities for particular software components.
        * Amount of accepted risk.
        * Ratio of security incidents caused due to unknown or undocumented security defects.

        Generate a regular (e.g. monthly) report for a suitable audience. This would typically reach audiences like managers, security officers, and engineers. Use the information in the report as an input for your security strategy, e.g. improving trainings or security verification activities.

        Share the most prominent or interesting technical details about security defects including the fixing strategy to other teams once these defects are fixed, e.g. in a regular knowledge sharing meeting. This will help scale the learning effect from defects to the whole organization and limit their occurrence in the future.
      annotation: 'Benefit: Improved learning from security defects in your organization'
      implementation_groups:
      - '2'
      - '3'
      typical_evidence: |-
        - You document metrics for defect classification and categorization and keep them up to date
        - Executive management regularly receives information about defects and has acted upon it in the last year
        - You regularly share technical details about security defects among teams
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-b:question:1:
          type: unique_choice
          text: Do you improve your security assurance program upon standardized metrics?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-b:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-b:question:1:choice:2
            value: Yes, for some applications
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-b:question:1:choice:3
            value: Yes, for at least half of the applications
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-2-b:question:1:choice:4
            value: Yes, for most or all of the applications
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-b
      ref_id: I-DM-3-B
      name: Use metrics to improve the security strategy
      description: |-
        Continuously improve your security defect management metrics and correlate it with other sources.

        Regularly (at least once per year) revisit the defect management metrics you're collecting and compare the effort needed to collect and track these to the expected outcomes. Make knowledgeable decisions about removing metrics which don't deliver the overall expected value. Wherever possible, include and automate verification activities for the quality of the collected data and ensure sustainable improvement if any differences are detected.

        Aggregate the data with your threat intelligence and incident management metrics and use the results as input for other initiatives over the whole organization, such as:

        * Planning security trainings for various personnel
        * Improvement of security verification activities for both internally and externally developed collected
        * Supply chain management, e.g. carrying out security audits of partner organizations
        * Monitoring of attacks against your infrastructure and applications
        * Investing in security infrastructure or compensating controls
        * Staffing your security team and setting up the security budget
      annotation: 'Benefit: Optimized security strategy based on defect information'
      implementation_groups:
      - '3'
      typical_evidence: |-
        - You have analyzed the effectiveness of the security metrics at least once in the last year
        - Where possible, you verify the correctness of the data automatically
        - The metrics are aggregated with other sources like threat intelligence or incident management
        - You derived at least one strategic activity from the metrics in the last year
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-b:question:1:
          type: unique_choice
          text: Do you regularly evaluate the effectiveness of your security metrics so that their input
            helps drive your security strategy?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-b:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-b:question:1:choice:2
            value: Yes, for some applications
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-b:question:1:choice:3
