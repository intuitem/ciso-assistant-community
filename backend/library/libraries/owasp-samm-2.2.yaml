            value: Yes, some of the time
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-2-b:question:1:choice:3
            value: Yes, at least half of the time
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-2-b:question:1:choice:4
            value: Yes, most or all of the time
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-b
      ref_id: O-OM-3-B
      name: Review application lifecycle state regularly
      description: |-
        Proactively manage migration roadmaps, for both unsupported end-of-life dependencies, and legacy versions of delivered software.

        Regularly evaluate the lifecycle state and support status of every software asset and underlying infrastructure component, and estimate their end-of-life. Follow a well-defined process for actively mitigating security risks arising as assets/components approach their end-of-life. Regularly review and update your process, to reflect lessons learned.

        Establish a product support plan, providing clear timelines for ending support on older product versions. Limit product versions in active use to only a small number (e.g., N.x.x and N-1.x.x only). Establish and publicize timelines for discontinuing support on prior versions, and proactively engage with customers and user groups to prevent disruption of service or support.
      annotation: 'Benefit: Full visibility into lifecycle of all software assets'
      implementation_groups:
      - '3'
      typical_evidence: |-
        - Your end of life management process is agreed upon
        - You inform customers and user groups of product timelines to prevent disruption of service or support
        - You review the process at least annually
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:o-om-3-b:question:1:
          type: unique_choice
          text: Do you regularly evaluate the lifecycle state and support status of every software asset
