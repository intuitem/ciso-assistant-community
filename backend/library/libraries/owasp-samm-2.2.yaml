            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-a:question:1:choice:3
            value: Yes, for at least half of the applications
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-3-a:question:1:choice:4
            value: Yes, for most or all of the applications
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-b
      assessable: false
      depth: 3
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm
      ref_id: I-DM-B
      name: Metrics and Feedback
      description: Defect tracking can drive the improvement of security activities within the organization
        through metrics and feedback.
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-b
      ref_id: I-DM-1-B
      name: Define basic defect metrics
      description: |-
        Regularly go over previously recorded security defects and derive quick wins from basic metrics.

        Once per defined period of time (typically at least once per year), go over your both resolved and still open recorded security defects in every team and extract basic metrics from the available data. These might include:

        * The total number of defects versus total number of verification activities. This could give you an idea whether you're looking for defects with an adequate intensity and quality.
        * The software components the defects reside in. This is indicative of where attention might be most required, and where security flaws might be more likely to appear in the future again.
        * The type or category of the defect, which suggests areas where the development team needs further training.
        * The severity of the defect, which can help the team understand the software's risk exposure.

        Identify and carry out sensible quick win activities which you can derive from the newly acquired knowledge. These might include things like a knowledge sharing session about one particular vulnerability type or carrying out or automating a security scan.
      annotation: 'Benefit: Identification of quick wins derived from available defect information'
      implementation_groups:
      - '1'
      - '2'
      - '3'
      typical_evidence: |-
        - You have analyzed your recorded metrics at least once in the last year
        - At least basic information about this initiative is recorded and available
        - You have identified and carried out at least one quick-win activity based on the data
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-b:question:1:
          type: unique_choice
          text: Do you use basic metrics about recorded security defects to carry out quick-win improvement
            activities?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:i-dm-1-b:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
