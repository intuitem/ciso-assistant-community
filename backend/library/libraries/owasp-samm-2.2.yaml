urn: urn:intuitem:risk:library:owasp-samm-2.2
locale: en
ref_id: OWASP-SAMM-2.2
name: OWASP SAMM v2.2
description: OWASP Software Assurance Maturity Model (SAMM) v2.2. Measures and improves software security
  posture across 5 business functions, 15 security practices and 30 streams, with 90 activities at maturity
  levels 1 to 3. Each activity is answered on SAMM's four-option scale, scaled by 4 (0, 1, 2, 4). The
  overall, business function and practice scores (0-3) follow the SAMM toolbox scorecard and assume the
  audit's default average score calculation. Implementation groups are cumulative target maturity levels.
  https://owaspsamm.org
