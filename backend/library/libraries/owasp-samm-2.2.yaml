            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-2-b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-b
      ref_id: D-SR-2-B
      name: Discuss security responsibilities with suppliers
      description: |-
        Build security into supplier agreements in order to ensure compliance with organizational requirements.

        Increase your confidence in the capability of your suppliers for software security. Discuss concrete responsibilities and expectations from your suppliers and your own organization and establish a contract with the supplier. The responsibilities can be specific quality requirements or particular tasks, and minimal service can be detailed in a Service Level Agreement (SLA). A quality requirement example is that they will deliver software that is protected against the OWASP Top 10, and in case issues are detected, these will be fixed. A task example is that they have to perform continuous static code analysis, or perform an independent penetration test before a major release. The agreement stipulates liabilities and caps in case an important issue arises.

        Once you have implemented this for a few suppliers, work toward a standard agreement for suppliers that forms the basis of your negotiations. You can deviate from this standard agreement on a case-by-case basis, but it will help you to ensure you do not overlook important topics.
      annotation: 'Benefit: Clearly defined security responsibilities of your software suppliers'
      implementation_groups:
      - '2'
      - '3'
      typical_evidence: |-
        - You discuss security requirements with the vendor when creating vendor agreements
        - Vendor agreements provide specific guidance on security defect remediation within an agreed-upon timeframe
        - The organization has a templated agreement of responsibilities and service levels for key vendor security processes
        - You measure key performance indicators
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-2-b:question:1:
          type: unique_choice
          text: Do vendors meet the security responsibilities and quality measures of service level agreements
            defined by the organization?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-2-b:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-2-b:question:1:choice:2
            value: Yes, some of the time
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-2-b:question:1:choice:3
            value: Yes, at least half of the time
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-2-b:question:1:choice:4
            value: Yes, most or all of the time
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-3-b
      assessable: true
      depth: 4
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-b
      ref_id: D-SR-3-B
      name: Align security methodology with suppliers
      description: |-
        Ensure proper security coverage for external suppliers by providing clear objectives.

        The best way to minimize the risk of issues in software is to align maximally and integrate closely between the different parties. From a process perspective, this means using similar development paradigms and introducing regular milestones to ensure proper alignment and qualitative progress. From a tools perspective, this might mean using similar build, verification and deployment environments, and sharing other supporting tools (e.g. requirements, architecture tools, or code repositories).

        In case suppliers cannot meet the objectives that you have set, implement compensating controls so that, overall, you meet your objectives. Execute extra activities (e.g., threat modeling before starting the actual implementation cycle) or implement extra tooling (e.g., third-party library analysis at solution intake). The more suppliers deviate from your requirements, the more work will be required to compensate.
      annotation: 'Benefit: Alignment of software development practices with suppliers to limit security
        risks'
      implementation_groups:
      - '3'
      typical_evidence: |-
        - The vendor has a secure SDLC that includes secure build, secure deployment, defect management, and incident management, meets the security expectations of your organization, and is able to demonstrate operating effectiveness of practices.
        - You verify the solution meets quality and security objectives before every major release
        - When standard verification processes are not available, you use compensating controls such as software composition analysis and independent penetration testing
      questions:
        urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-3-b:question:1:
          type: unique_choice
          text: Are vendors aligned with standard security controls and software development tools and
            processes that the organization utilizes?
          choices:
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-3-b:question:1:choice:1
            value: 'No'
            add_score: 0
            compute_result: non_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-3-b:question:1:choice:2
            value: Yes, some of the time
            add_score: 1
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-3-b:question:1:choice:3
            value: Yes, at least half of the time
            add_score: 2
            compute_result: partially_compliant
          - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sr-3-b:question:1:choice:4
            value: Yes, most or all of the time
            add_score: 4
            compute_result: compliant
    - urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d-sa
      assessable: false
      depth: 2
      parent_urn: urn:intuitem:risk:req_node:owasp-samm-2.2:d
      ref_id: D-SA
      name: Secure Architecture
      description: |-
        The Secure Architecture (SA) practice focuses on the security linked to components and technology you deal with during the architectural design of your software. Secure Architecture Design looks at the selection and composition of components that form the foundation of your solution, focusing on its security properties. Technology Management looks at the security of supporting technologies used during development, deployment and operations, such as development stacks and tooling, deployment tooling, and operating systems and tooling.

        Level 1 objective: Insert consideration of proactive security guidance into the software design process.

        Level 2 objective: Direct the software design process toward known secure services and secure-by-default designs.

        Level 3 objective: Formally control the software design process and validate utilization of secure components.
