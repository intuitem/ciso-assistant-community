urn: urn:intuitem:risk:library:workflow-operations-entra-identity-metrics
locale: en
ref_id: workflow-operations-entra-identity-metrics
name: Microsoft Entra ID — identity hygiene metrics
description: 'Reads three numbers from Microsoft Entra ID every Monday and records each one as a
  sample of a metric, so identity hygiene shows a trend instead of a screenshot: users not registered
  for MFA, Global Administrator role assignments, and guest accounts. After importing: create three
  metric instances (numeric) and set their ids in metric_no_mfa, metric_global_admins and
  metric_guests; set tenant_id and client_id from an Entra app registration; add its client secret as
  the entra_client_secret secret. The app needs the Microsoft Graph application permissions
  AuditLog.Read.All, User.Read.All and RoleManagement.Read.Directory, with admin consent. The MFA
  registration report requires an Entra ID P1 or P2 licence and leaves out disabled users. Role
  assignments are counted as Entra lists them: a role given through a group counts once, and roles
  that are only eligible through Privileged Identity Management are not included.'
copyright: © intuitem
version: 1
publication_date: 2026-10-07
provider: intuitem
packager: intuitem
objects:
  workflows:
  - urn: urn:intuitem:risk:library:workflow-operations-entra-identity-metrics:workflow:entra-identity-metrics
    schema_version: 1
    ref_id: entra-identity-metrics
    name: Microsoft Entra ID — identity hygiene metrics
    description: 'Every Monday: count users without MFA registered, Global Administrator assignments and guest
      accounts in Microsoft Entra ID, and record each count against its metric. A refused token or an
      unanswered request fails the run, so a stalled collection shows in the run history. A count
      cut short by the page limit is not recorded, since it would read lower than the truth.'
    requires:
      secrets:
      - entra_client_secret
    graph:
      variables:
      - key: tenant_id
        type: string
        default_value: ''
      - key: client_id
        type: string
        default_value: ''
      - key: global_admin_role
        type: string
        default_value: 62e90394-69f5-4237-9190-012177145e10
      - key: metric_no_mfa
        type: string
        default_value: ''
      - key: metric_global_admins
        type: string
        default_value: ''
      - key: metric_guests
        type: string
        default_value: ''
      - key: no_mfa_cut_short
        type: boolean
        default_value: false
      - key: global_admins_cut_short
        type: boolean
        default_value: false
      nodes:
      - ref: every_monday
        type: trigger
        label: Every Monday
        trigger_config:
          type: schedule
          cron_expression: 0 6 * * 1
          timezone: UTC
      - ref: count_no_mfa
        type: action
        label: Count users without MFA
        action_config:
          type: http_request
          method: GET
          url: https://graph.microsoft.com/v1.0/reports/authenticationMethods/userRegistrationDetails?$filter=isMfaRegistered
            eq false
          oauth:
            token_url: https://login.microsoftonline.com/{{tenant_id}}/oauth2/v2.0/token
            client_id: '{{client_id}}'
            client_secret: '{{secrets.entra_client_secret}}'
            scope: https://graph.microsoft.com/.default
          paginate:
            items: value
            next: '@odata.nextLink'
            count_only: true
            max_pages: 50
        retry:
          max_attempts: 3
          delay_seconds: 120
          backoff: exponential
        output_mapping:
          no_mfa_cut_short: truncated
      - ref: count_no_mfa_complete
        type: condition
        label: Is the MFA count complete?
        branches:
        - name: Complete
          condition_groups:
          - operator: and
            conditions:
            - variable: no_mfa_cut_short
              op: eq
              value: false
        - name: Cut short
          is_default: true
      - ref: log_count_no_mfa_cut_short
        type: action
        label: Say the users without MFA count is incomplete
        action_config:
          type: log
          message: 'Nothing recorded for users without MFA on {{today}}: Entra had more pages than one run reads, so
            the count would be too low.'
      - ref: record_no_mfa
        type: action
        label: Record users without MFA
        action_config:
          type: record_measurement
          metric_instance: '{{metric_no_mfa}}'
          value: '{{nodes.count_no_mfa.count}}'
          observation: Collected from Microsoft Entra ID on {{today}}
      - ref: count_global_admins
        type: action
        label: Count Global Administrators
        action_config:
          type: http_request
          method: GET
          url: https://graph.microsoft.com/v1.0/roleManagement/directory/roleAssignments?$filter=roleDefinitionId
            eq '{{global_admin_role}}'
          oauth:
            token_url: https://login.microsoftonline.com/{{tenant_id}}/oauth2/v2.0/token
            client_id: '{{client_id}}'
            client_secret: '{{secrets.entra_client_secret}}'
            scope: https://graph.microsoft.com/.default
          paginate:
            items: value
            next: '@odata.nextLink'
            count_only: true
        retry:
          max_attempts: 3
          delay_seconds: 120
          backoff: exponential
        output_mapping:
          global_admins_cut_short: truncated
      - ref: count_global_admins_complete
        type: condition
        label: Is the admin count complete?
        branches:
        - name: Complete
          condition_groups:
          - operator: and
            conditions:
            - variable: global_admins_cut_short
              op: eq
              value: false
        - name: Cut short
          is_default: true
      - ref: log_count_global_admins_cut_short
        type: action
        label: Say the Global Administrator count is incomplete
        action_config:
          type: log
          message: 'Nothing recorded for Global Administrator on {{today}}: Entra had more pages than one run reads, so
            the count would be too low.'
      - ref: record_global_admins
        type: action
        label: Record Global Administrators
        action_config:
          type: record_measurement
          metric_instance: '{{metric_global_admins}}'
          value: '{{nodes.count_global_admins.count}}'
          observation: Collected from Microsoft Entra ID on {{today}}
      - ref: count_guests
        type: action
        label: Count guest accounts
        action_config:
          type: http_request
          method: GET
          url: https://graph.microsoft.com/v1.0/users/$count?$filter=userType eq 'Guest'
          headers:
            ConsistencyLevel: eventual
          oauth:
            token_url: https://login.microsoftonline.com/{{tenant_id}}/oauth2/v2.0/token
            client_id: '{{client_id}}'
            client_secret: '{{secrets.entra_client_secret}}'
            scope: https://graph.microsoft.com/.default
        retry:
          max_attempts: 3
          delay_seconds: 120
          backoff: exponential
      - ref: record_guests
        type: action
        label: Record guest accounts
        action_config:
          type: record_measurement
          metric_instance: '{{metric_guests}}'
          value: '{{nodes.count_guests.body}}'
          observation: Collected from Microsoft Entra ID on {{today}}
      - ref: done
        type: end
      edges:
      - source: every_monday
        target: count_no_mfa
      - source: count_no_mfa
        target: count_no_mfa_complete
      - source: count_no_mfa_complete
        target: record_no_mfa
        source_branch: Complete
      - source: count_no_mfa_complete
        target: log_count_no_mfa_cut_short
        source_branch: Cut short
      - source: record_no_mfa
        target: count_global_admins
      - source: log_count_no_mfa_cut_short
        target: count_global_admins
      - source: count_global_admins
        target: count_global_admins_complete
      - source: count_global_admins_complete
        target: record_global_admins
        source_branch: Complete
      - source: count_global_admins_complete
        target: log_count_global_admins_cut_short
        source_branch: Cut short
      - source: record_global_admins
        target: count_guests
      - source: log_count_global_admins_cut_short
        target: count_guests
      - source: count_guests
        target: record_guests
      - source: record_guests
        target: done
