    description: "Indicateur relatif au maintien en conditions de s\xE9curit\xE9 des\
      \ ressources.\n\nTexte de l'arr\xEAt\xE9 : \xAB le pourcentage de postes utilisateurs\
      \ dont les ressources syst\xE8mes ne sont pas install\xE9es dans une version\
      \ support\xE9e par le fournisseur ou le fabricant \xBB"
    category: quantitative
    unit: percentage
    higher_is_better: false
    default_target: 0.0
    translations:
      en:
        name: Percentage of user workstations whose system resources are not installed
