# Inbox row titles, one per notification type, per locale.
#
# These live in the notification layer, NOT inside the email templates: a title is
# what the in-app row says, an email template is one channel's rendering. Keeping
# them apart is also what stops an enterprise CustomEmailTemplate override — which
# stores subject and body only, and replaces the built-in file rather than merging
# over it — from silently erasing the title of a type it customises.
#
# Types with no in_app channel have no entry here.
