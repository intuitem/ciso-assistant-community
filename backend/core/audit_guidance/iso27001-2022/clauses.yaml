framework_urn: urn:intuitem:risk:framework:iso27001-2022
guidance:
  "4.1":
    questions:
      - {stage: 1, text: "Show me where you recorded the internal and external issues that shape your ISMS, and when that list was last revisited."}
      - {stage: 1, text: "Did you decide whether climate change matters for your information security? Walk me through how you reached that answer."}
      - {stage: 2, text: "Pick one issue on this list and show me where it turned into a risk, an objective or a control."}
    requests:
      - {label: "Context analysis (internal and external issues, e.g. PESTLE/SWOT) with date and owner", kind: document}
      - {label: "Recorded decision on the relevance of climate change, with rationale", kind: document}
      - {label: "Management review minutes showing the issues list was revisited", kind: record, fresh_days: 400}
    sampling: {size: "2-3 issues", population: "issues listed in the context analysis", method: "trace each issue to a risk register entry, objective or control"}
    interviewees: [top, ciso]
    pitfalls:
      - "Climate change never considered, or dismissed in one line with no reasoning (since Amendment 1:2024 some certification bodies raise this as a nonconformity, others as an opportunity for improvement)"
      - "Context analysis written once for certification and never updated after a reorganisation, acquisition or move to cloud"
      - "Issues listed but disconnected from the risk assessment, so the auditor cannot see how they influenced anything"
  "4.2":
    questions:
      - {stage: 1, text: "Who are the interested parties that matter to your ISMS, and what does each of them expect from you on security?"}
      - {stage: 1, text: "Which of those expectations have you chosen to address through the ISMS, and which have you left out?"}
      - {stage: 2, text: "Take a customer contract or a regulation from this list and show me the controls that satisfy it."}
      - {stage: 2, text: "Do any of your interested parties have climate-related expectations, such as resilience commitments from customers or regulators?"}
    requests:
      - {label: "Interested parties register with requirements and which ones the ISMS addresses", kind: document}
      - {label: "Legal, regulatory and contractual requirements register (links to A.5.31)", kind: document}
      - {label: "Sample customer contract or DPA with security clauses", kind: record}
    sampling: {size: "2-3 requirements", population: "legal, regulatory and contractual obligations in the register", method: "trace each to an implemented control and its evidence"}
    interviewees: [ciso, legal, dpo]
    pitfalls:
      - "Register lists parties but not their actual requirements, or does not say which requirements the ISMS will address (an explicit 2022 expectation)"
      - "Major customer contract with specific security clauses (breach notification hours, audit rights) missing from the register"
      - "No review of interested parties after a new regulation (NIS2, DORA) came into force"
  "4.3":
    questions:
      - {stage: 1, text: "Read me your scope statement. Which locations, teams, products and systems are in, and what is excluded?"}
      - {stage: 1, text: "Where something is excluded, how do you control the interfaces and dependencies with that excluded part?"}
      - {stage: 2, text: "This team or site I saw on your org chart: is it in scope? Show me how the scope document says so."}
    requests:
      - {label: "ISMS scope statement (documented, approved, versioned)", kind: document}
      - {label: "Interfaces and dependencies list, including outsourced and cloud services", kind: document}
      - {label: "Network or architecture diagram matching the scope boundary", kind: technical}
    sampling: null
    interviewees: [ciso, top, it_lead]
    pitfalls:
      - "Scope wording on the certificate draft does not match the scope statement or the website marketing claims"
      - "Exclusions with no justification, or excluded areas that share networks, admins or data with in-scope systems"
      - "Cloud providers and remote workers ignored when drawing the boundary"
  "4.4":
    questions:
      - {stage: 1, text: "Show me how your ISMS processes fit together and how they interact."}
      - {stage: 2, text: "How do you know the ISMS is maintained and improved, not just documented? Give me an example of something that changed this year."}
    requests:
      - {label: "ISMS manual or process map showing processes, owners and interactions", kind: document}
      - {label: "Change log or version history of ISMS documents over the last 12 months", kind: record, fresh_days: 400}
    sampling: null
    interviewees: [ciso]
    pitfalls:
      - "Documents exist for each clause but nobody can explain how outputs of one process feed the next (e.g. audit results into management review)"
      - "No evidence of any improvement since the last audit, suggesting the ISMS is static"
  "5.1":
    questions:
      - {stage: 2, text: "What is your personal role in the ISMS? Tell me in your own words what the security objectives are."}
      - {stage: 2, text: "Give me an example where you allocated budget or people to information security in the last year."}
      - {stage: 2, text: "How do you make sure security requirements are built into business processes, not bolted on afterwards?"}
    requests:
      - {label: "Evidence of resources approved for the ISMS (budget line, headcount, tool purchase)", kind: record, fresh_days: 400}
      - {label: "Top management communications on information security (all-hands slide, memo, intranet post)", kind: record, fresh_days: 400}
      - {label: "Management review attendance list showing top management presence", kind: record, fresh_days: 400}
    sampling: null
    interviewees: [top]
    pitfalls:
      - "CEO or managing director delegates the whole interview to the CISO and cannot name the policy or objectives"
      - "Security spend requests repeatedly deferred, visible in risk treatment plan delays"
      - "Top management does not attend management review, only signs the minutes afterwards"
  "5.2":
    questions:
      - {stage: 1, text: "Show me your information security policy. Who approved it and when?"}
      - {stage: 1, text: "Where does the policy commit to meeting requirements and to continual improvement, and how does it frame objectives?"}
      - {stage: 2, text: "How did staff and relevant external parties get this policy? Show me."}
    requests:
      - {label: "Information security policy, signed or approved by top management, with version and date", kind: document}
      - {label: "Evidence of publication (intranet page, acknowledgement records)", kind: record}
    sampling: {size: "3-5 staff", population: "in-scope employees and contractors", method: "ask whether they know where the policy is and what it means for their role"}
    interviewees: [top, ciso, staff]
    pitfalls:
      - "Policy approved by the CISO only, not by top management"
      - "Policy is a long technical document instead of a short statement of intent, or lacks the commitment to continual improvement"
      - "Policy not reviewed since the 2013 version, still references the old Annex A"
  "5.3":
    questions:
      - {stage: 1, text: "Who is accountable for the ISMS conforming to the standard, and who reports its performance to top management?"}
      - {stage: 2, text: "Show me where security responsibilities are written into job descriptions or a RACI."}
      - {stage: 2, text: "You are listed as owner of this process. Tell me what you do as owner."}
    requests:
      - {label: "ISMS roles and responsibilities document or RACI", kind: document}
      - {label: "Appointment letter or org chart naming the ISMS manager / CISO", kind: document}
      - {label: "Job descriptions for key security roles", kind: document}
    sampling: {size: "2-3 role holders", population: "named owners in the RACI (risk owners, control owners)", method: "interview to confirm they know and perform the role"}
    interviewees: [top, ciso, hr]
    pitfalls:
      - "Named risk or control owners who have left the company or do not know they hold the role"
      - "Nobody formally assigned to report ISMS performance to top management"
  "6.1.1":
    questions:
      - {stage: 1, text: "How did the issues from 4.1 and the requirements from 4.2 feed into identifying risks and opportunities for the ISMS itself?"}
      - {stage: 2, text: "Show me one opportunity you identified and what you did with it."}
    requests:
      - {label: "Register of ISMS-level risks and opportunities (distinct from or part of the information security risk register)", kind: document}
      - {label: "Action plan showing how these actions are integrated and their effectiveness evaluated", kind: record}
    sampling: null
    interviewees: [ciso, risk]
    pitfalls:
      - "Only information security risks considered; risks to the ISMS achieving its outcomes (loss of key staff, budget cuts) ignored"
      - "Opportunities never identified or recorded"
  "6.1.2":
    questions:
      - {stage: 1, text: "Walk me through your risk assessment methodology: criteria for acceptance, how you score likelihood and consequence."}
      - {stage: 1, text: "How do you ensure repeated assessments give consistent, comparable results?"}
      - {stage: 2, text: "Show me the latest risk assessment. When was it done and what triggered it?"}
      - {stage: 2, text: "For this risk, who is the owner? Let me ask them about it."}
    requests:
      - {label: "Risk assessment methodology with acceptance criteria and scales", kind: document}
      - {label: "Risk register / latest risk assessment results with owners", kind: record, fresh_days: 400}
      - {label: "Evidence of reassessment after a significant change (new system, incident, supplier)", kind: record}
    sampling: {size: "3-5 risks", population: "risk register entries, weighted to high risks", method: "check scoring against methodology, interview owner, follow to treatment"}
    interviewees: [risk, ciso]
    pitfalls:
      - "Risk assessment not updated for over a year or after major changes (the most frequently cited finding area)"
      - "Risks without named owners, or owners are the CISO for everything"
      - "Scores do not match the documented scales, or acceptance criteria are not defined"
  "6.1.3":
    questions:
      - {stage: 1, text: "Show me your Statement of Applicability. For each excluded Annex A control, why is it excluded?"}
      - {stage: 1, text: "How did you compare your chosen controls with Annex A to confirm nothing necessary was missed?"}
      - {stage: 2, text: "Who approved the risk treatment plan and accepted the residual risks?"}
      - {stage: 2, text: "This control says implemented in the SoA. Show me it working."}
    requests:
      - {label: "Statement of Applicability (93 Annex A controls, justification, status), versioned", kind: document}
      - {label: "Risk treatment plan with actions, owners, deadlines and status", kind: record, fresh_days: 200}
      - {label: "Risk owner approval of the plan and acceptance of residual risk", kind: record, fresh_days: 400}
    sampling: {size: "5-10 controls", population: "SoA entries marked applicable and implemented", method: "request evidence of operation for each"}
    interviewees: [risk, ciso, top]
    pitfalls:
      - "SoA still on the 2013 structure (114 controls) or missing the 11 new 2022 controls such as threat intelligence and data masking"
      - "Exclusions justified with 'not applicable' only, or excluded controls that are clearly needed by the risks"
      - "Treatment plan overdue items with no rescheduling or residual risk acceptance by the owner"
  "6.2":
    questions:
      - {stage: 1, text: "Show me your information security objectives. How are they measured and who owns each?"}
      - {stage: 2, text: "Where are you against these objectives today? Show me the data."}
      - {stage: 2, text: "What happens when an objective is missed?"}
    requests:
      - {label: "Information security objectives with targets, owners, resources, deadlines and measurement method", kind: document}
      - {label: "Progress tracking against objectives (dashboard or report)", kind: record, fresh_days: 120}
    sampling: null
    interviewees: [ciso, top]
    pitfalls:
      - "Objectives are vague ('improve security') with no measurable target or date"
      - "Objectives set but never monitored; no data at the audit"
      - "Objectives not consistent with the policy or not communicated to those who must deliver them"
  "6.3":
    questions:
      - {stage: 1, text: "How do you decide that a change to the ISMS needs formal planning?"}
      - {stage: 2, text: "Tell me about a significant ISMS change this year, such as scope, structure or a key outsourcing. Show me how it was planned."}
    requests:
      - {label: "Procedure or criteria for planning ISMS changes", kind: document}
      - {label: "Plan for a recent ISMS change (purpose, consequences, resources, responsibilities)", kind: record, fresh_days: 400}
    sampling: {size: "1-2 changes", population: "ISMS-level changes in the last 12 months", method: "check planning was done before the change, not after"}
    interviewees: [ciso]
    pitfalls:
      - "Confused with operational change management (A.8.32); no evidence of planning for changes to the ISMS itself"
      - "Reorganisation or scope extension done without any recorded plan or impact assessment"
  "7.1":
    questions:
      - {stage: 2, text: "How did you determine what resources the ISMS needs? Is anything you asked for still missing?"}
      - {stage: 2, text: "How much of your working time actually goes to the ISMS?"}
    requests:
      - {label: "ISMS budget or resource plan", kind: record, fresh_days: 400}
      - {label: "Staffing of security roles (org chart, FTE allocation)", kind: document}
    sampling: null
    interviewees: [top, ciso]
    pitfalls:
      - "CISO role held part-time by an IT manager with no protected time, and treatment plan slips confirm under-resourcing"
      - "Resource needs never formally assessed or discussed in management review"
  "7.2":
    questions:
      - {stage: 1, text: "How did you define the competence required for roles that affect security?"}
      - {stage: 2, text: "Show me the competence evidence for your ISMS manager and internal auditor."}
      - {stage: 2, text: "When you identified a competence gap, what did you do and how did you check it worked?"}
    requests:
      - {label: "Competence matrix or requirements per security role", kind: document}
      - {label: "Training certificates, CVs or qualifications for key ISMS roles", kind: record}
      - {label: "Evaluation of training effectiveness", kind: record, fresh_days: 400}
    sampling: {size: "3-5 people", population: "holders of security-relevant roles (admins, developers, auditors)", method: "compare required competence to retained evidence"}
    interviewees: [hr, ciso]
    pitfalls:
      - "Internal auditor has no audit training or qualification on record"
      - "Training attended but no evaluation of whether it was effective"
      - "Competence requirements not defined for admins or developers"
  "7.3":
    questions:
      - {stage: 2, text: "What does the information security policy mean for your daily work?"}
      - {stage: 2, text: "What would you do if you clicked a suspicious link or lost your laptop?"}
    requests:
      - {label: "Awareness programme plan and content", kind: document}
      - {label: "Awareness completion records for in-scope staff", kind: record, fresh_days: 400}
    sampling: {size: "5-10 staff", population: "staff met during the site tour and interviews, including new joiners", method: "short conversational questions on policy, reporting and their role"}
    interviewees: [staff, hr]
    pitfalls:
      - "Staff do not know how or to whom to report a security event"
      - "Contractors and new joiners missing from completion records"
  "7.4":
    questions:
      - {stage: 1, text: "Show me how you decided what to communicate on security, to whom, when, and by whom."}
      - {stage: 2, text: "Give me an example of a security communication to an external party, such as a customer or authority."}
    requests:
      - {label: "Communication plan or matrix (what, when, with whom, who, how)", kind: document}
      - {label: "Examples of internal and external security communications", kind: record, fresh_days: 400}
    sampling: null
    interviewees: [ciso, legal]
    pitfalls:
      - "No defined communication with regulators or customers for incidents, despite contractual obligations"
      - "Plan exists but none of the communications listed can be evidenced"
  "7.5.1":
    questions:
      - {stage: 1, text: "Show me the documented information the standard requires and what you added yourselves."}
      - {stage: 1, text: "How did you decide how much documentation your organisation needs?"}
    requests:
      - {label: "Master list of ISMS documents and records", kind: document}
      - {label: "Mandatory documents: scope, policy, risk methodology, SoA, treatment plan, objectives", kind: document}
    sampling: null
    interviewees: [ciso]
    pitfalls:
      - "A required item missing, most often evidence of competence, monitoring results or internal audit programme"
      - "Procedures listed in the master list that do not exist or are drafts"
  "7.5.2":
    questions:
      - {stage: 1, text: "How do you identify, format, review and approve documents? Show me the version history of one."}
      - {stage: 2, text: "Who approved this policy revision and where is that recorded?"}
    requests:
      - {label: "Document control procedure (naming, versioning, approval, review frequency)", kind: document}
      - {label: "Approval records for recent document revisions", kind: record, fresh_days: 400}
    sampling: {size: "3-5 documents", population: "ISMS policies and procedures", method: "check version, owner, approval and review date"}
    interviewees: [ciso]
    pitfalls:
      - "Documents with no version, owner or approval date, or overdue for review"
      - "Different versions of the same policy in circulation (intranet vs shared drive)"
  "7.5.3":
    questions:
      - {stage: 2, text: "How do you make sure people use the current version and obsolete versions are withdrawn?"}
      - {stage: 2, text: "How are records protected, retained and eventually disposed of?"}
      - {stage: 2, text: "How do you control external documents, such as standards or supplier documentation?"}
    requests:
      - {label: "Record retention schedule", kind: document}
      - {label: "Access rights on the ISMS document repository", kind: technical}
    sampling: {size: "2-3 documents", population: "documents found at point of use during the tour", method: "compare against the current master list version"}
    interviewees: [ciso, it_lead]
    pitfalls:
      - "Printed or locally saved outdated procedures in use"
      - "Everyone has edit rights on the ISMS repository"
  "8.1":
    questions:
      - {stage: 2, text: "How do you plan and control the processes that deliver your risk treatment? Show me the criteria for one of them."}
      - {stage: 2, text: "Which processes are outsourced, and how do you control them?"}
      - {stage: 2, text: "Show me how an unplanned change was handled and how its effects were contained."}
    requests:
      - {label: "List of externally provided processes, products or services relevant to the ISMS and their controls", kind: document}
      - {label: "Operational records showing processes carried out as planned (e.g. backup logs, patch reports)", kind: record, fresh_days: 90}
    sampling: {size: "3-5 processes", population: "operational security processes and outsourced services", method: "check criteria exist and records prove execution"}
    interviewees: [it_lead, ciso, proc]
    pitfalls:
      - "Outsourced IT or cloud services not identified as externally provided processes, so no control over them"
      - "Processes run but no retained evidence they were carried out as planned"
  "8.2":
    questions:
      - {stage: 2, text: "How often do you reassess risks, and what triggers an unscheduled reassessment?"}
      - {stage: 2, text: "Show me the assessment you did after your last significant change."}
    requests:
      - {label: "Risk assessment results from planned intervals (last two cycles)", kind: record, fresh_days: 400}
      - {label: "Ad-hoc risk assessment following a significant change or incident", kind: record}
    sampling: {size: "1-2 changes", population: "significant changes in the last 12 months", method: "check a risk assessment was triggered and recorded"}
    interviewees: [risk]
    pitfalls:
      - "Reassessment done annually but never triggered by changes such as a new SaaS platform or acquisition"
      - "Results not retained, only the current snapshot of the register"
  "8.3":
    questions:
      - {stage: 2, text: "Show me progress on the risk treatment plan. Which actions are complete and how do you know they work?"}
      - {stage: 2, text: "What happens to treatment actions that miss their deadline?"}
    requests:
      - {label: "Risk treatment plan status report", kind: record, fresh_days: 120}
      - {label: "Evidence of completed treatment actions", kind: record}
    sampling: {size: "3-5 treatment actions", population: "actions due in the last 12 months", method: "verify completion evidence and update of residual risk"}
    interviewees: [risk, ciso]
    pitfalls:
      - "Actions marked done without evidence or without updating the residual risk score"
      - "Large backlog of overdue actions with no escalation"
  "9.1":
    questions:
      - {stage: 1, text: "What do you measure, how, how often, and who analyses the results?"}
      - {stage: 2, text: "Show me the latest measurement results and what decision they led to."}
      - {stage: 2, text: "How do you evaluate the effectiveness of the ISMS, not just activity counts?"}
    requests:
      - {label: "Measurement plan or KPI catalogue (what, method, frequency, owner, analyst)", kind: document}
      - {label: "Latest KPI / metrics report with analysis", kind: record, fresh_days: 120}
    sampling: {size: "2-3 metrics", population: "KPIs in the measurement plan", method: "check data source, frequency met and results used"}
    interviewees: [ciso, sec_ops]
    pitfalls:
      - "Metrics count activity (number of trainings) without saying anything about effectiveness"
      - "Results collected but never analysed or reported to management"
      - "Who measures and who analyses is not defined"
  "9.2.1":
    questions:
      - {stage: 2, text: "Show me the last internal audit report. Did it cover all of the ISMS clauses and the applicable Annex A controls?"}
      - {stage: 2, text: "How did you check the internal audit was done against both the standard and your own requirements?"}
    requests:
      - {label: "Internal audit report(s) with findings, covering the full ISMS before Stage 2", kind: record, fresh_days: 400}
      - {label: "Internal audit checklists and evidence notes", kind: record, fresh_days: 400}
    sampling: {size: "2-3 audit findings", population: "findings from the last internal audit", method: "trace to corrective action and closure"}
    interviewees: [auditor, ciso]
    pitfalls:
      - "No full internal audit completed before Stage 2, a common cause of major nonconformities"
      - "Internal audit is a checklist tick-off with no evidence recorded"
      - "Audit sampled only the policies and skipped Annex A controls marked applicable in the SoA"
  "9.2.2":
    questions:
      - {stage: 1, text: "Show me your audit programme. How did you decide frequency and coverage?"}
      - {stage: 2, text: "Who are your internal auditors, and how do you ensure they don't audit their own work?"}
      - {stage: 2, text: "How were the results reported to relevant management?"}
    requests:
      - {label: "Internal audit programme covering the 3-year certification cycle", kind: document}
      - {label: "Audit plans with criteria and scope for each audit", kind: record, fresh_days: 400}
      - {label: "Auditor independence and competence evidence", kind: record}
    sampling: null
    interviewees: [auditor, ciso]
    pitfalls:
      - "ISMS manager audits the processes they run, breaking objectivity"
      - "Programme does not consider importance of processes or results of previous audits"
      - "Sites or departments in scope never audited"
  "9.3.1":
    questions:
      - {stage: 2, text: "When was the last management review, who attended, and how often do you hold it?"}
      - {stage: 2, text: "Was the management review done before this certification audit?"}
    requests:
      - {label: "Management review minutes with date and attendance", kind: record, fresh_days: 400}
      - {label: "Management review schedule", kind: document}
    sampling: null
    interviewees: [top, ciso]
    pitfalls:
      - "No management review held before Stage 2"
      - "Top management absent, review done by the CISO alone"
  "9.3.2":
    questions:
      - {stage: 2, text: "Show me where the minutes cover each required input, including changes in interested parties' needs."}
      - {stage: 2, text: "How did audit results, nonconformities, metrics and risk status feed the discussion?"}
    requests:
      - {label: "Management review input pack (status of previous actions, context changes, interested party changes, performance, audits, risks, opportunities)", kind: record, fresh_days: 400}
      - {label: "Mapping of review agenda items to each required input", kind: document}
    sampling: null
    interviewees: [ciso, top]
    pitfalls:
      - "One or more required inputs missing, typically changes in interested parties' needs (new in 2022) or feedback from interested parties"
      - "Status of actions from the previous review not tracked"
  "9.3.3":
    questions:
      - {stage: 2, text: "What decisions came out of the last review, and where are they tracked?"}
      - {stage: 2, text: "Show me one decision from the review that has been implemented."}
    requests:
      - {label: "Management review outputs: decisions on improvements and changes, with action owners", kind: record, fresh_days: 400}
      - {label: "Action tracker showing follow-up of review decisions", kind: record, fresh_days: 200}
    sampling: {size: "2-3 actions", population: "decisions from the last management review", method: "verify implementation evidence"}
    interviewees: [top, ciso]
    pitfalls:
      - "Minutes record discussion only, with no decisions, owners or deadlines"
      - "Review decisions never followed up before the next review"
  "10.1":
    questions:
      - {stage: 2, text: "Give me examples of improvements to the ISMS in the last year. Where did they come from?"}
      - {stage: 2, text: "How do you capture improvement ideas from staff and incidents?"}
    requests:
      - {label: "Improvement register or log", kind: record, fresh_days: 400}
      - {label: "Before/after evidence for one completed improvement (e.g. revised procedure, KPI trend)", kind: record}
    sampling: null
    interviewees: [ciso]
    pitfalls:
      - "Improvement only reactive, through nonconformities, with no evidence of proactive enhancements"
      - "No measurable change in ISMS suitability or effectiveness between audits"
  "10.2":
    questions:
      - {stage: 2, text: "Walk me through a nonconformity from discovery to closure. How did you find the root cause?"}
      - {stage: 2, text: "How did you check the corrective action actually worked?"}
      - {stage: 2, text: "Did you check whether similar nonconformities exist elsewhere?"}
    requests:
      - {label: "Nonconformity and corrective action register", kind: record, fresh_days: 200}
      - {label: "Root cause analysis records for closed nonconformities", kind: record}
      - {label: "Effectiveness review records for corrective actions", kind: record}
    sampling: {size: "3-5 nonconformities", population: "nonconformities from internal audit, incidents and complaints in the last 12 months", method: "check correction, root cause, action, effectiveness review"}
    interviewees: [ciso, auditor]
    pitfalls:
      - "Correction only (fix the symptom) with no root cause analysis"
      - "Corrective actions closed without checking they were effective"
      - "Internal audit findings never logged as nonconformities, so no corrective action was started"
