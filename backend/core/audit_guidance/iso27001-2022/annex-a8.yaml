framework_urn: urn:intuitem:risk:framework:iso27001-2022
guidance:
  a.8.1:
    questions:
      - {stage: 1, text: "Which rules apply to laptops and phones that hold company data, and where are they written down?"}
      - {stage: 2, text: "Pick any laptop in this room. Show me it is encrypted, managed and patched."}
      - {stage: 2, text: "What happens when a device is lost or stolen? Walk me through the last case."}
    requests:
      - {label: "Endpoint or acceptable use policy covering company and personal devices", kind: document}
      - {label: "MDM or endpoint management export: device list with encryption, OS version and last check-in", kind: technical, fresh_days: 30}
      - {label: "Lost or stolen device records with remote wipe evidence", kind: record}
    sampling: {size: "5 to 10 devices", population: "managed endpoint inventory", method: "pick devices from the MDM list and from people met on site, compare compliance status with the policy"}
    interviewees: [endpoint, staff]
    pitfalls:
      - "Device inventory does not match HR headcount: some staff use unmanaged laptops"
      - "Personal phones read company email with no MDM or app protection policy, even though BYOD is said to be banned"
      - "Devices that stopped checking in months ago are still counted as compliant"
  a.8.2:
    questions:
      - {stage: 1, text: "How do you define a privileged account, and who approves granting one?"}
      - {stage: 2, text: "Show me the list of admin accounts on your identity provider, cloud console and production servers today."}
      - {stage: 2, text: "Do administrators use a separate account for admin work, or their everyday account?"}
    requests:
      - {label: "Inventory of privileged accounts, including service and break-glass accounts, with named owners", kind: record, fresh_days: 30}
      - {label: "Approval tickets for privileged access granted in the audit period", kind: record}
      - {label: "Last privileged access review with reviewer, decisions and removals applied", kind: record, fresh_days: 120}
      - {label: "Live export of admin role members from the IdP and main cloud tenant", kind: technical, fresh_days: 7}
    sampling: {size: "5 privileged accounts", population: "current admin role members across IdP, cloud and production", method: "trace each to an approval and a review entry; check for leavers and shared logins"}
    interviewees: [iam, ciso]
    pitfalls:
      - "No single list of privileged accounts exists; it is rebuilt for the audit"
      - "Global admin role held by more people than needed, including former contractors"
      - "Service accounts with admin rights have no owner and a password that never changed"
  a.8.3:
    questions:
      - {stage: 1, text: "How do you decide who can see what inside your main business applications?"}
      - {stage: 2, text: "Log in with a standard user and show me you cannot open records outside that user's role."}
      - {stage: 2, text: "How do you control access to shared drives and SharePoint sites holding confidential data?"}
    requests:
      - {label: "Role or permission matrix for key applications", kind: document}
      - {label: "Export of permissions on a confidential share or site", kind: technical, fresh_days: 30}
      - {label: "Access review evidence for one business application", kind: record, fresh_days: 200}
    sampling: {size: "3 to 5 users", population: "users of one critical application", method: "compare actual permissions with role matrix and job title"}
    interviewees: [iam, staff]
    pitfalls:
      - "Confidential folders shared with 'Everyone' or via anonymous links"
      - "Role matrix exists on paper but application permissions were granted ad hoc"
  a.8.4:
    questions:
      - {stage: 2, text: "Who has write access to your source code repositories, and how is that reviewed?"}
      - {stage: 2, text: "Can a developer push directly to the main branch? Show me the branch protection settings."}
    requests:
      - {label: "Repository access list with roles per repo or group", kind: technical, fresh_days: 30}
      - {label: "Branch protection or merge rule screenshots for production repositories", kind: technical, fresh_days: 30}
      - {label: "Offboarding evidence removing a leaver from the code platform", kind: record}
    sampling: {size: "2 to 3 repositories + 3 leavers", population: "production code repos and recent leavers with dev access", method: "check protection settings and confirm leaver accounts removed"}
    interviewees: [dev]
    pitfalls:
      - "Ex-employees or external contractors still members of the GitHub or GitLab organisation"
      - "Admins can bypass branch protection and do so without trace of review"
      - "Secrets committed in repositories readable by the whole company"
  a.8.5:
    questions:
      - {stage: 1, text: "What is your password and MFA rule, and which systems does it cover?"}
      - {stage: 2, text: "Show me the MFA enforcement settings and the list of users or apps excluded from it."}
      - {stage: 2, text: "How do you handle legacy protocols and apps that cannot do MFA?"}
    requests:
      - {label: "Authentication standard: password rules, MFA scope, lockout", kind: document}
      - {label: "IdP conditional access or MFA policy configuration export", kind: technical, fresh_days: 30}
      - {label: "Report of accounts without MFA registered", kind: technical, fresh_days: 30}
    sampling: {size: "3 to 5 systems", population: "internet-facing and critical apps", method: "test login flow and confirm SSO or MFA is enforced"}
    interviewees: [iam]
    pitfalls:
      - "MFA enforced for staff but excluded for admin, service or 'VIP' accounts"
      - "Legacy authentication still allowed, bypassing MFA"
      - "Some SaaS tools use local logins outside SSO with weak passwords"
  a.8.6:
    questions:
      - {stage: 2, text: "How do you know when a critical system is running out of storage, CPU or licences before it fails?"}
      - {stage: 2, text: "Show me a capacity alert and what was done about it."}
    requests:
      - {label: "Monitoring dashboard or thresholds for critical systems", kind: technical, fresh_days: 30}
      - {label: "Capacity review or planning minutes, or ticket resulting from a capacity alert", kind: record, fresh_days: 365}
    sampling: null
    interviewees: [infra]
    pitfalls:
      - "Thresholds configured but alerts go to an unmonitored mailbox"
      - "Past incident caused by full disk or quota with no follow-up capacity action"
  a.8.7:
    questions:
      - {stage: 2, text: "What anti-malware or EDR covers your endpoints and servers, and how do you know none are missing it?"}
      - {stage: 2, text: "Show me the last malware detection and how it was handled."}
      - {stage: 2, text: "How do staff learn to spot phishing, and what happens when they report one?"}
    requests:
      - {label: "EDR console export: coverage, agent health, outdated agents", kind: technical, fresh_days: 30}
      - {label: "Detection or quarantine events with handling tickets", kind: record, fresh_days: 90}
      - {label: "Email filtering configuration and phishing awareness records", kind: record, fresh_days: 365}
    sampling: {size: "5 devices + 2 detections", population: "asset inventory and EDR alerts", method: "reconcile inventory against EDR agents; trace detections to closure"}
    interviewees: [sec_ops, endpoint, staff]
    pitfalls:
      - "Asset inventory and EDR agent count differ, servers or Linux hosts left uncovered"
      - "Local admins can disable the agent and some have"
  a.8.8:
    questions:
      - {stage: 1, text: "What are your remediation deadlines per severity, and what is in scope of scanning?"}
      - {stage: 2, text: "Show me your latest scan and how many criticals are past their deadline."}
      - {stage: 2, text: "Take this critical from three months ago: when was it found, when fixed, and how did you verify the fix?"}
    requests:
      - {label: "Vulnerability management procedure with severity based SLAs", kind: document}
      - {label: "Latest internal and external vulnerability scan reports", kind: technical, fresh_days: 30}
      - {label: "Latest penetration test report and remediation tracker", kind: record, fresh_days: 365}
      - {label: "Patch compliance report for servers and endpoints", kind: technical, fresh_days: 30}
    sampling: {size: "5 to 10 high or critical findings", population: "scan and pentest findings in the audit period", method: "check detection date, ticket, fix date versus SLA, rescan evidence; exceptions need risk acceptance"}
    interviewees: [sec_ops, infra]
    pitfalls:
      - "Scans run but critical findings sit open for months with no risk acceptance"
      - "Scan scope misses cloud workloads, containers or newly added subnets"
      - "Pentest findings not tracked to closure; same issues reappear in next report"
  a.8.9:
    questions:
      - {stage: 1, text: "Which secure configuration baselines do you use for servers, endpoints, network gear and cloud, and who owns them?"}
      - {stage: 2, text: "Show me how you detect a system that has drifted from its baseline."}
      - {stage: 2, text: "Here is a production server: show me its current settings against the baseline."}
    requests:
      - {label: "Hardening baselines or templates (for example CIS based) per platform, with version and review date", kind: document}
      - {label: "Configuration compliance or drift report from a tool (Intune, GPO, CSPM, Ansible, Terraform state)", kind: technical, fresh_days: 30}
      - {label: "Records of deviations from baseline with approval", kind: record}
    sampling: {size: "3 to 5 systems", population: "critical servers, network devices and cloud accounts", method: "compare live configuration to the documented baseline"}
    interviewees: [infra, sec_ops]
    pitfalls:
      - "Baseline referenced in policy but never tailored, versioned or reviewed"
      - "Network devices and cloud services left out; only Windows covered by GPO"
      - "Default passwords or services still active on appliances"
  a.8.10:
    questions:
      - {stage: 1, text: "How do you decide when information must be deleted, and is that tied to your retention schedule?"}
      - {stage: 2, text: "Show me evidence that data past its retention date was actually deleted, in an application and in backups."}
      - {stage: 2, text: "How are disks and devices wiped or destroyed when retired, and by whom?"}
    requests:
      - {label: "Retention and deletion schedule per data category", kind: document}
      - {label: "Deletion logs or purge job outputs from a key system", kind: record, fresh_days: 365}
      - {label: "Certificates of destruction or wipe reports for retired media", kind: record}
      - {label: "Contract clauses or attestations of deletion from SaaS and cloud providers", kind: document}
    sampling: {size: "3 to 5 retired devices + 1 data category", population: "assets disposed in audit period", method: "trace asset tag to wipe or destruction certificate; check records older than retention period are gone"}
    interviewees: [infra, dpo, legal]
    pitfalls:
      - "Retention periods defined but no deletion mechanism exists; data is kept forever"
      - "Disposed laptops have no wipe or destruction certificate linked to serial numbers"
      - "Deletion of former customers' data in SaaS tools never requested or confirmed"
  a.8.11:
    questions:
      - {stage: 1, text: "Where do you use masking, pseudonymisation or anonymisation, and what drove that decision?"}
      - {stage: 2, text: "Show me how personal data looks in your test or analytics environment."}
      - {stage: 2, text: "Which users see full card numbers or IDs in the application, and why?"}
    requests:
      - {label: "Data masking or pseudonymisation rules mapped to data classification", kind: document}
      - {label: "Screenshot of masked fields in application or non-production database", kind: technical, fresh_days: 90}
      - {label: "Role configuration showing who can unmask data", kind: technical, fresh_days: 90}
    sampling: {size: "1 to 2 datasets", population: "non-production copies and reporting extracts", method: "inspect records for unmasked personal or sensitive data"}
    interviewees: [dev, dpo]
    pitfalls:
      - "Production database cloned to test with real personal data and no masking"
      - "Control marked applicable with no defined approach; or excluded without justification while personal data is processed"
  a.8.12:
    questions:
      - {stage: 1, text: "Which channels could sensitive data leak through, and which ones do you control?"}
      - {stage: 2, text: "Show me what happens if I email a file labelled confidential to a personal address or copy it to USB."}
      - {stage: 2, text: "Who reviews DLP alerts and what did the last ones lead to?"}
    requests:
      - {label: "DLP policy or rule set: monitored channels, data types, block or alert actions", kind: document}
      - {label: "DLP tool configuration export (M365 Purview, CASB, endpoint)", kind: technical, fresh_days: 30}
      - {label: "DLP alert log and triage records", kind: record, fresh_days: 90}
    sampling: {size: "5 alerts", population: "DLP events in last quarter", method: "check each was reviewed and closed with a decision"}
    interviewees: [sec_ops, endpoint]
    pitfalls:
      - "DLP in audit-only mode since rollout, alerts never reviewed"
      - "Rules do not match the classification scheme so labelled data is not detected"
      - "Personal cloud storage, USB and unmanaged browsers not covered"
  a.8.13:
    questions:
      - {stage: 1, text: "What is backed up, how often, how long is it kept, and where are copies held?"}
      - {stage: 2, text: "When did you last restore from backup as a test, and what was the result?"}
      - {stage: 2, text: "Could ransomware with admin rights delete or encrypt your backups?"}
    requests:
      - {label: "Backup policy or schedule per system with RPO and retention", kind: document}
      - {label: "Backup job reports showing success and failures", kind: technical, fresh_days: 30}
      - {label: "Restore test records with date, scope, outcome and duration", kind: record, fresh_days: 365}
      - {label: "Evidence of immutable or offline copy configuration", kind: technical, fresh_days: 90}
    sampling: {size: "3 to 5 systems", population: "critical systems in the asset register", method: "check each appears in backup jobs, verify recent success and at least one restore test"}
    interviewees: [infra]
    pitfalls:
      - "No restore test ever performed, or only single file restores"
      - "SaaS data (M365, CRM) assumed backed up by the provider"
      - "Failed jobs recurring for weeks with no ticket"
  a.8.14:
    questions:
      - {stage: 2, text: "Which systems must stay available, and what redundancy do they have?"}
      - {stage: 2, text: "Have you tested a failover? Show me the result."}
    requests:
      - {label: "Availability requirements per critical service (from BIA or risk assessment)", kind: document}
      - {label: "Architecture diagram showing redundant components, zones or sites", kind: document}
      - {label: "Failover test report", kind: record, fresh_days: 365}
    sampling: null
    interviewees: [infra]
    pitfalls:
      - "Single points of failure (one firewall, one internet link, one region) not covered by risk treatment"
      - "Redundancy designed but never tested"
  a.8.15:
    questions:
      - {stage: 1, text: "What events do you log, on which systems, and how long do you keep logs?"}
      - {stage: 2, text: "Show me the admin login events for this server from last month."}
      - {stage: 2, text: "Who can delete or alter logs, and how would you know?"}
    requests:
      - {label: "Logging standard: sources, event types, retention", kind: document}
      - {label: "List of log sources onboarded to the SIEM or log platform", kind: technical, fresh_days: 30}
      - {label: "Log retention settings and access rights to the log store", kind: technical, fresh_days: 90}
    sampling: {size: "3 to 5 systems", population: "critical assets", method: "confirm each sends logs, retrieve a specific historic event within retention"}
    interviewees: [sec_ops, infra]
    pitfalls:
      - "Critical apps or cloud services not sending logs centrally"
      - "Retention shorter than policy, e.g. 30 day default in a SaaS tier"
      - "Admins can clear the logs of their own activity"
  a.8.16:
    questions:
      - {stage: 1, text: "What counts as abnormal behaviour on your network and systems, and who is responsible for watching for it?"}
      - {stage: 2, text: "Show me your monitoring console and walk me through an alert from detection to closure."}
      - {stage: 2, text: "Who looks at alerts outside working hours?"}
    requests:
      - {label: "Monitoring procedure: use cases, alert severities, response times, on-call", kind: document}
      - {label: "SIEM or MDR alert rules list and coverage", kind: technical, fresh_days: 30}
      - {label: "Alert triage tickets or MDR monthly reports", kind: record, fresh_days: 90}
    sampling: {size: "5 to 10 alerts", population: "alerts raised in last 3 months", method: "check each was triaged within target time and outcome recorded"}
    interviewees: [sec_ops]
    pitfalls:
      - "SIEM collects logs but nobody reviews alerts; queue of thousands untouched"
      - "Monitoring outsourced to an MSSP with no reports reviewed internally"
      - "No baseline of normal activity, so 'anomalous' is undefined"
  a.8.17:
    questions:
      - {stage: 2, text: "Which time source do your systems use, and how do you know they agree?"}
    requests:
      - {label: "NTP configuration on domain controllers, network devices and cloud", kind: technical, fresh_days: 90}
    sampling: {size: "2 to 3 systems", population: "servers and network devices", method: "compare system time and NTP source settings"}
    interviewees: [infra]
    pitfalls:
      - "Network appliances or OT devices with their own drifting clock"
      - "Mixed time zones in logs without UTC normalisation, making correlation hard"
  a.8.18:
    questions:
      - {stage: 2, text: "Which tools can override system or security controls here, and who can run them?"}
      - {stage: 2, text: "How do you stop a normal user from running admin tools or scripting engines?"}
    requests:
      - {label: "List of restricted utility programs and who is authorised", kind: document}
      - {label: "Application control or local admin restriction configuration", kind: technical, fresh_days: 90}
    sampling: null
    interviewees: [iam, sec_ops]
    pitfalls:
      - "All users are local administrators on their laptops"
      - "No list of what is considered a privileged utility"
  a.8.19:
    questions:
      - {stage: 2, text: "Can a user install software on their laptop? Show me."}
      - {stage: 2, text: "How is software installed on production servers approved and tracked?"}
    requests:
      - {label: "Approved software list or catalogue", kind: document}
      - {label: "Installed software inventory report from endpoint management", kind: technical, fresh_days: 30}
      - {label: "Change tickets for software installed on production", kind: record}
    sampling: {size: "3 to 5 endpoints", population: "managed endpoints", method: "compare installed software with the approved list"}
    interviewees: [endpoint, staff]
    pitfalls:
      - "Unapproved or end-of-life software found on endpoints during spot checks"
      - "Browser extensions not controlled"
  a.8.20:
    questions:
      - {stage: 2, text: "Show me your current network diagram and tell me when it was last updated."}
      - {stage: 2, text: "How are firewall rules reviewed, and when was the last review?"}
      - {stage: 2, text: "How is admin access to network devices controlled?"}
    requests:
      - {label: "Up-to-date network diagram including cloud and remote access", kind: document}
      - {label: "Firewall rule review record with removals", kind: record, fresh_days: 365}
      - {label: "Firewall or security group rule export", kind: technical, fresh_days: 30}
    sampling: {size: "5 to 10 rules", population: "firewall and security group rules", method: "check each has a business justification and owner; look for any-any rules"}
    interviewees: [network]
    pitfalls:
      - "Network diagram outdated, missing cloud or new sites"
      - "Any-to-any or temporary rules never removed"
      - "Management interfaces reachable from the internet"
  a.8.21:
    questions:
      - {stage: 2, text: "Which network services do you buy (internet, SD-WAN, VPN, DNS), and what security terms are in those contracts?"}
      - {stage: 2, text: "How do you check the provider is meeting the agreed service levels?"}
    requests:
      - {label: "Network service contracts or SLAs with security clauses", kind: document}
      - {label: "Provider service reports or review minutes", kind: record, fresh_days: 365}
    sampling: null
    interviewees: [network, proc]
    pitfalls:
      - "No security requirements in ISP or managed network contracts"
      - "Provider reports received but never reviewed"
  a.8.22:
    questions:
      - {stage: 2, text: "How are guest, user, server, and management networks separated?"}
      - {stage: 2, text: "Connect me to guest Wi-Fi: can I reach any internal system?"}
    requests:
      - {label: "Network segmentation diagram with VLANs, zones and trust levels", kind: document}
      - {label: "Inter-zone firewall rules or ACLs", kind: technical, fresh_days: 90}
    sampling: {size: "1 to 2 tests", population: "network zones", method: "observe a connection attempt from guest or user zone to a restricted zone"}
    interviewees: [network]
    pitfalls:
      - "Flat network: user VLAN can reach servers and management interfaces directly"
      - "Guest Wi-Fi shares a VLAN with printers or IoT devices"
  a.8.23:
    questions:
      - {stage: 1, text: "Which website categories do you block and how did you decide?"}
      - {stage: 2, text: "Try to open a known malicious or blocked test site from this laptop: what happens?"}
      - {stage: 2, text: "Does filtering still apply when staff work from home off VPN?"}
    requests:
      - {label: "Web filtering policy with blocked categories", kind: document}
      - {label: "Filtering tool configuration (secure web gateway, DNS filter, firewall)", kind: technical, fresh_days: 90}
      - {label: "Block event logs or reports", kind: record, fresh_days: 90}
    sampling: {size: "2 to 3 devices", population: "office and remote devices", method: "live test of a blocked category or test URL"}
    interviewees: [network, staff]
    pitfalls:
      - "Filtering only at the office firewall; remote workers unprotected"
      - "Newly registered domains and malicious categories not blocked"
  a.8.24:
    questions:
      - {stage: 1, text: "What are your rules on encryption algorithms, key lengths and where encryption is mandatory?"}
      - {stage: 2, text: "Who manages keys and certificates, and how would you know one is about to expire?"}
      - {stage: 2, text: "Show me encryption at rest for this database and in transit for this web app."}
    requests:
      - {label: "Cryptography policy including key management", kind: document}
      - {label: "Key and certificate inventory with owners and expiry", kind: record, fresh_days: 90}
      - {label: "Encryption settings screenshots (KMS, disk, TLS scan result)", kind: technical, fresh_days: 90}
    sampling: {size: "3 systems", population: "systems storing or transmitting confidential data", method: "verify encryption setting and protocol versions"}
    interviewees: [infra, sec_ops, dev]
    pitfalls:
      - "Certificates expired causing outages; no inventory"
      - "Deprecated TLS versions or weak ciphers still enabled"
      - "Keys stored alongside data or in source code"
  a.8.25:
    questions:
      - {stage: 1, text: "Describe your development life cycle and where security activities sit in it."}
      - {stage: 2, text: "Take this recent release: show me the security steps it went through."}
    requests:
      - {label: "Secure development policy or SDLC description", kind: document}
      - {label: "Evidence trail for one release: requirements, review, tests, approval", kind: record, fresh_days: 180}
    sampling: {size: "2 to 3 releases", population: "releases in audit period", method: "trace release from ticket to deployment and check security gates"}
    interviewees: [dev, ciso]
    pitfalls:
      - "SDLC document describes gates that the CI pipeline does not enforce"
      - "Low-code or scripts outside the official SDLC"
  a.8.26:
    questions:
      - {stage: 2, text: "How do security requirements get into a new application or feature you build or buy?"}
      - {stage: 2, text: "Show me the security requirements captured for your last new system."}
    requests:
      - {label: "Security requirements template or checklist for projects and acquisitions", kind: document}
      - {label: "Completed requirements for one recent project or SaaS acquisition", kind: record, fresh_days: 365}
    sampling: {size: "2 projects", population: "new systems or major changes in audit period", method: "check security requirements were defined and verified"}
    interviewees: [dev, proc]
    pitfalls:
      - "SaaS tools bought by business units without any security requirements"
      - "Requirements defined but never tested before go-live"
  a.8.27:
    questions:
      - {stage: 1, text: "Which secure engineering principles do your architects follow, and where are they written?"}
      - {stage: 2, text: "Show me how a recent design was reviewed against them."}
    requests:
      - {label: "Secure architecture principles or reference architecture", kind: document}
      - {label: "Architecture or threat model review for a recent system", kind: record, fresh_days: 365}
    sampling: null
    interviewees: [dev]
    pitfalls:
      - "Principles are generic copies not applied in design reviews"
      - "No threat modelling for internet-facing systems"
  a.8.28:
    questions:
      - {stage: 1, text: "What secure coding standard do your developers follow, and how are they trained on it?"}
      - {stage: 2, text: "Show me a recent pull request: who reviewed it and what security checks ran automatically?"}
      - {stage: 2, text: "How do you track and update vulnerable third-party libraries?"}
    requests:
      - {label: "Secure coding guideline (for example OWASP based) per language", kind: document}
      - {label: "SAST and dependency scan results from the pipeline", kind: technical, fresh_days: 30}
      - {label: "Developer secure coding training records", kind: record, fresh_days: 365}
      - {label: "Exceptions to blocking findings with risk acceptance", kind: record}
    sampling: {size: "3 to 5 merged pull requests", population: "merges to main branch in last 3 months", method: "check peer review, scan result and handling of findings"}
    interviewees: [dev]
    pitfalls:
      - "Scanners run but results ignored; criticals merged without justification"
      - "Self-approved merges or reviews that are a rubber stamp"
      - "No dependency or secret scanning"
  a.8.29:
    questions:
      - {stage: 2, text: "What security testing happens before a release goes live, and who signs off?"}
      - {stage: 2, text: "Show me the acceptance test evidence for the last significant release."}
    requests:
      - {label: "Test plan or criteria including security tests", kind: document}
      - {label: "Security test results (DAST, pentest, functional security tests) for a recent release", kind: record, fresh_days: 365}
    sampling: {size: "2 to 3 releases", population: "major releases in audit period", method: "check security tests ran and acceptance was signed before deployment"}
    interviewees: [dev]
    pitfalls:
      - "Security testing only once a year via pentest, not per significant release"
      - "No acceptance criteria, so failed tests do not block go-live"
  a.8.30:
    questions:
      - {stage: 2, text: "Do you use external developers? What security terms are in their contracts?"}
      - {stage: 2, text: "How do you check the code they deliver?"}
    requests:
      - {label: "Contracts or SOWs with secure development, IP and access clauses", kind: document}
      - {label: "Acceptance or code review records for outsourced deliverables", kind: record}
    sampling: {size: "1 to 2 suppliers", population: "outsourced development suppliers", method: "check contract clauses and acceptance evidence"}
    interviewees: [dev, proc]
    pitfalls:
      - "External developers have production access with personal accounts"
      - "No review of delivered code; contract silent on security"
  a.8.31:
    questions:
      - {stage: 2, text: "How are development, test and production separated, and who can access production?"}
      - {stage: 2, text: "Can a developer change production directly? Show me."}
    requests:
      - {label: "Environment diagram showing separate accounts, subscriptions or networks", kind: document}
      - {label: "Production access list", kind: technical, fresh_days: 30}
    sampling: null
    interviewees: [dev, infra]
    pitfalls:
      - "Developers have standing admin rights in production"
      - "Test and production share credentials or databases"
  a.8.32:
    questions:
      - {stage: 1, text: "What is your change process, including emergency changes?"}
