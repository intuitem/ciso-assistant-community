framework_urn: urn:intuitem:risk:framework:iso27001-2022
guidance:
  a.5.1:
    questions:
      - {stage: 1, text: "Show me the top-level security policy and the topic-specific policies that sit under it. Who approved each one and when?"}
      - {stage: 2, text: "How do staff and relevant external parties learn about a new or changed policy, and how do you know they acknowledged it?"}
      - {stage: 2, text: "Pick one topic-specific policy and walk me through its last review: what triggered it and what changed."}
    requests:
      - {label: "Information security policy with approval signature or record and version history", kind: document}
      - {label: "List of topic-specific policies with owner, version, last review date and next review date", kind: document}
      - {label: "Policy acknowledgement records for staff and contractors", kind: record, fresh_days: 365}
      - {label: "Minutes or tickets showing the most recent policy review", kind: record, fresh_days: 400}
    sampling: {size: "5-10 staff, including contractors and recent joiners", population: "current workforce in scope", method: "check acknowledgement of the current policy versions"}
    interviewees: [top, ciso, staff]
    pitfalls:
      - "Policies reviewed on paper but the review date is older than the interval the policy itself sets"
      - "Acknowledgement collected at onboarding only, never after a policy change, and never from contractors or other interested parties"
      - "Policies still cite 2013 control numbers or titles after the 2022 transition"
  a.5.2:
    questions:
      - {stage: 1, text: "Show me where security roles and responsibilities are defined, including asset and risk owners."}
      - {stage: 2, text: "Pick an asset owner from your inventory. Can they tell me what they are accountable for in security terms?"}
    requests:
      - {label: "RACI or responsibility matrix for the ISMS and security processes", kind: document}
      - {label: "Job descriptions or role definitions for the CISO and other named security roles", kind: document}
      - {label: "Appointment letters or minutes formally assigning ISMS roles", kind: record}
    sampling: {size: "2-3 named role holders", population: "asset owners, risk owners and ISMS roles", method: "interview and compare stated duties to the documented role"}
    interviewees: [top, ciso, it_lead]
    pitfalls:
      - "Asset and risk owners named in registers have never been told they hold that role"
      - "Roles assigned to people who have since left or changed job"
  a.5.3:
    questions:
      - {stage: 1, text: "Which duties have you identified as conflicting, and where is that analysis recorded?"}
      - {stage: 2, text: "Show me how you stop one person from both requesting and approving their own access or change, in a real system."}
      - {stage: 2, text: "Where segregation is not possible because the team is small, what compensating control do you run and where is the evidence?"}
    requests:
      - {label: "Segregation of duties matrix or list of incompatible role combinations", kind: document}
      - {label: "Workflow configuration showing requester and approver must differ (change, access, payments)", kind: technical}
      - {label: "Records of compensating reviews where segregation is not technically enforced", kind: record, fresh_days: 120}
    sampling: {size: "5-10 changes or access approvals", population: "last 6 months", method: "check requester and approver are different people"}
    interviewees: [ciso, iam, dev]
    pitfalls:
      - "Developers can push straight to production with no second approver on the pipeline"
      - "Admins approve their own access tickets or changes"
      - "Small-team exception claimed but no compensating log review exists"
  a.5.4:
    questions:
      - {stage: 2, text: "How does management make sure managers and staff actually apply the security policies day to day?"}
      - {stage: 2, text: "Give me an example where a manager enforced or escalated a security rule within their team."}
    requests:
      - {label: "Management communications on security expectations (memos, town hall slides, objectives)", kind: record, fresh_days: 365}
      - {label: "Manager objectives or appraisal criteria that include security duties", kind: document}
      - {label: "Training completion report broken down by team or manager", kind: record, fresh_days: 120}
    sampling: {size: "2-3 line managers", population: "managers of in-scope teams", method: "interview on how they brief and supervise security behaviour"}
    interviewees: [top, hr, staff]
    pitfalls:
      - "Leadership commitment shown only in the policy signature, with no visible follow-through"
      - "Managers unaware of overdue training or open findings in their own team"
  a.5.5:
    questions:
      - {stage: 1, text: "Show me the list of authorities you would contact and in which situations."}
      - {stage: 2, text: "Who decides to notify the data protection authority or a national CSIRT, and within what deadline? Walk me through the last time it happened or was rehearsed."}
    requests:
      - {label: "Authority contact register (regulators, CSIRT, police, supervisory authority) with owner and trigger", kind: document}
      - {label: "Evidence the contact list was checked recently (review date, test call or email)", kind: record, fresh_days: 365}
      - {label: "Past notifications to authorities or exercise records", kind: record}
    sampling: null
    interviewees: [ciso, legal, dpo]
    pitfalls:
      - "Contact list has outdated numbers or names and no review date"
      - "Notification deadlines (for example 72 hours for personal data breaches, NIS2 timelines) not reflected in the incident procedure"
  a.5.6:
    questions:
      - {stage: 2, text: "Which professional groups, forums or information-sharing communities are you part of?"}
      - {stage: 2, text: "Give me one example where something learned from one of those groups changed what you do."}
    requests:
      - {label: "List of memberships and subscriptions (ISAC, CERT mailing lists, associations)", kind: document}
      - {label: "Evidence of participation (event attendance, shared advisories, forum posts)", kind: record, fresh_days: 365}
    sampling: null
    interviewees: [ciso, sec_ops]
    pitfalls:
      - "Memberships listed but no one can show anything received or acted upon in the past year"
  a.5.7:
    questions:
      - {stage: 1, text: "Show me which threat intelligence sources you use, who reads them, and how often."}
      - {stage: 2, text: "Pick a threat advisory from the last quarter and show me what decision or action it led to."}
      - {stage: 2, text: "How does threat intelligence feed into your risk assessment and your detection rules?"}
    requests:
      - {label: "Threat intelligence procedure or section defining sources, cadence, analysis and distribution", kind: document}
      - {label: "Recent threat intelligence summaries or bulletins issued internally", kind: record, fresh_days: 90}
      - {label: "Tickets, risk register updates or detection rule changes triggered by intelligence", kind: record, fresh_days: 180}
      - {label: "Configuration of feeds or platform integrations (SIEM, EDR, vulnerability scanner)", kind: technical}
    sampling: {size: "2-3 advisories", population: "intelligence received in the last 6 months", method: "trace each from receipt to assessment to action or documented no-action"}
    interviewees: [ciso, sec_ops, risk]
    pitfalls:
      - "Feeds subscribed to and landing in a mailbox nobody triages, with no record of analysis"
      - "No link between intelligence and the risk assessment: the threat catalogue has not changed since the last cycle"
      - "Only strategic news collected; no tactical or operational indicators used by the SOC"
  a.5.8:
    questions:
      - {stage: 1, text: "Show me where your project methodology requires a security assessment, and at which stage gates."}
      - {stage: 2, text: "Pick a project delivered this year and show me its security requirements, risk assessment and sign-off."}
    requests:
      - {label: "Project management methodology or gate checklist with security steps", kind: document}
      - {label: "Project portfolio list for the last 12 months", kind: record, fresh_days: 365}
      - {label: "Security requirement or risk assessment records for sampled projects", kind: record}
    sampling: {size: "2-3 projects", population: "projects started or closed in the last 12 months, including non-IT ones", method: "check security step at initiation and before go-live"}
    interviewees: [ciso, dev, it_lead]
    pitfalls:
      - "Security checklist exists in the template but is left blank or ticked without content"
      - "Business projects (new office, new process, outsourcing) never pass through the security gate because only IT projects are tracked"
  a.5.9:
    questions:
      - {stage: 1, text: "Show me your asset inventory. How does it cover information, not just hardware?"}
      - {stage: 2, text: "I will pick a laptop, a server and a SaaS application from what I see today. Show me each one in the inventory with its owner."}
      - {stage: 2, text: "How do new assets get into the inventory, and how is it kept accurate?"}
    requests:
      - {label: "Asset inventory export with owner, classification and location", kind: record, fresh_days: 90}
      - {label: "Reconciliation evidence against discovery tools (MDM, EDR, cloud console, CMDB)", kind: technical, fresh_days: 90}
      - {label: "Procedure describing how the inventory is maintained", kind: document}
    sampling: {size: "10-15 assets", population: "assets observed on site, in the cloud console and in discovery tools", method: "floor-to-list and list-to-floor tracing"}
    interviewees: [service_desk, ciso]
    pitfalls:
      - "Inventory lists hardware only; information assets and SaaS tools are missing"
      - "Devices seen in the EDR console are absent from the inventory, or the inventory still lists disposed devices"
      - "Owner column filled with a team name or with people who have left"
  a.5.10:
    questions:
      - {stage: 1, text: "Show me your acceptable use rules for information and devices."}
      - {stage: 2, text: "Ask any staff member: can they use personal cloud storage or AI chat tools for work data? Does their answer match the policy?"}
    requests:
      - {label: "Acceptable use policy covering devices, email, internet, cloud and generative AI tools", kind: document}
      - {label: "Signed acceptable use acknowledgements", kind: record}
      - {label: "Technical controls enforcing the rules (web filtering, DLP, app allow-list)", kind: technical}
    sampling: {size: "3-5 staff", population: "staff across departments", method: "short interview on key rules plus acknowledgement check"}
    interviewees: [staff, hr, endpoint]
    pitfalls:
      - "Policy silent on generative AI tools while staff use them with client data"
      - "Acknowledgement missing for contractors or temporary staff"
  a.5.11:
    questions:
      - {stage: 2, text: "Walk me through what happens to a leaver's laptop, badge and tokens on their last day."}
      - {stage: 2, text: "How do you make sure company data on personal devices is removed when someone leaves?"}
    requests:
      - {label: "Leaver checklist including asset return steps", kind: document}
      - {label: "Completed leaver checklists or asset return receipts", kind: record, fresh_days: 365}
      - {label: "MDM records of device wipe or retirement for leavers", kind: technical}
    sampling: {size: "5 leavers", population: "leavers in the last 12 months", method: "compare HR leaver list to asset return records and inventory status"}
    interviewees: [hr, endpoint]
    pitfalls:
      - "Leaver checklist completed for employees but not for contractors or interns"
      - "Laptops still assigned to leavers in the inventory months after departure"
  a.5.12:
    questions:
      - {stage: 1, text: "Show me your classification scheme and the handling rules for each level."}
      - {stage: 2, text: "Pick three documents from a shared drive. Who classified them and does the classification match the content?"}
    requests:
      - {label: "Classification policy with levels, criteria and handling rules", kind: document}
      - {label: "Asset or information inventory showing assigned classification", kind: record}
      - {label: "Classification tool configuration (for example sensitivity labels)", kind: technical}
    sampling: {size: "5-10 documents or data sets", population: "shared drives, document management and email", method: "check assigned label against content and scheme"}
    interviewees: [ciso, staff, dpo]
    pitfalls:
      - "Scheme defined but staff cannot name the levels or apply them"
      - "Everything marked internal by default, including clearly confidential HR and client data"
  a.5.13:
    questions:
      - {stage: 2, text: "Show me how a confidential document is labelled, both electronically and on paper."}
      - {stage: 2, text: "What happens with labelling when information is exported, printed or emailed outside?"}
    requests:
      - {label: "Labelling procedure covering electronic, physical and exported formats", kind: document}
      - {label: "Screenshot of labelling tool or document templates with labels", kind: technical}
      - {label: "Sample labelled documents and reports", kind: observation}
    sampling: {size: "5 documents", population: "documents classified above internal", method: "check presence and correctness of label"}
    interviewees: [staff, endpoint]
    pitfalls:
      - "Labels exist in templates but are stripped from exports, reports and printed copies"
      - "Exceptions where labelling is not applied (for example system outputs) are not documented"
  a.5.14:
    questions:
      - {stage: 1, text: "Show me the rules for sending information outside the organisation, by channel and classification level."}
      - {stage: 2, text: "Show me how a staff member would send a confidential file to a client today. Which tool, which protection?"}
    requests:
      - {label: "Information transfer policy or procedure (email, file transfer, removable media, verbal)", kind: document}
      - {label: "Agreements covering information exchange with key partners (NDA, data exchange clauses)", kind: document}
      - {label: "Configuration of secure transfer tools (email encryption, TLS enforcement, secure file share expiry)", kind: technical}
    sampling: {size: "3-5 transfers", population: "recent external transfers of sensitive data", method: "check channel used against policy for that classification"}
    interviewees: [network, staff, legal]
    pitfalls:
      - "Public file-sharing links with no expiry or password used for confidential data"
      - "Policy covers email but not messaging apps, phone calls or courier transfers"
  a.5.15:
    questions:
      - {stage: 1, text: "Show me your access control policy. How does it cover physical access as well as logical access?"}
      - {stage: 2, text: "How do you apply need-to-know and least privilege in practice? Show me the role model for one key application."}
    requests:
      - {label: "Access control policy covering logical and physical access, need-to-know and least privilege", kind: document}
      - {label: "Role or profile definitions for key applications", kind: document}
      - {label: "Privileged account list for critical systems", kind: technical, fresh_days: 30}
    sampling: null
    interviewees: [ciso, iam, facilities]
    pitfalls:
      - "Policy only covers logical access; physical access rules are not aligned with data sensitivity"
      - "Role model documented but most users hold an admin or broad default profile"
  a.5.16:
    questions:
      - {stage: 2, text: "Show me how an identity is created, who approves it, and how you link every account to a real person."}
      - {stage: 2, text: "How do you handle shared, service and generic accounts? Show me the list and their owners."}
    requests:
      - {label: "Identity lifecycle procedure (create, change, disable, delete)", kind: document}
      - {label: "Export of active accounts from the identity provider", kind: technical, fresh_days: 30}
      - {label: "Register of shared, service and non-personal accounts with owner and justification", kind: record, fresh_days: 180}
    sampling: {size: "10 accounts", population: "active accounts in the identity provider", method: "match each account to an HR record or a documented owner"}
    interviewees: [iam, hr]
    pitfalls:
      - "Generic and service accounts without an owner or justification"
      - "Accounts in the directory that do not match any current employee or contractor"
  a.5.17:
    questions:
      - {stage: 2, text: "Show me your password and MFA configuration in the identity provider."}
      - {stage: 2, text: "How are initial passwords and reset credentials delivered, and how do you verify the person asking for a reset?"}
      - {stage: 2, text: "Where are shared secrets, API keys and service passwords stored?"}
    requests:
      - {label: "Password and MFA policy settings screenshot from the identity provider", kind: technical, fresh_days: 30}
      - {label: "MFA coverage report listing users without MFA", kind: technical, fresh_days: 30}
      - {label: "Help desk reset procedure with identity verification steps", kind: document}
      - {label: "Evidence of a password manager or secrets vault in use", kind: technical}
    sampling: {size: "3-5 password reset tickets", population: "help desk tickets in the last 6 months", method: "check identity verification was performed and recorded"}
    interviewees: [iam, dev, staff]
    pitfalls:
      - "MFA enforced for most users but exempted for admins, service accounts or legacy protocols"
      - "Secrets hard-coded in repositories or shared in chat"
      - "Help desk resets passwords on a phone call without verification"
  a.5.18:
    questions:
      - {stage: 2, text: "Walk me through a joiner, a mover and a leaver, from the HR trigger to the account change."}
      - {stage: 2, text: "Show me your last two access review cycles for a critical system. What was removed as a result?"}
    requests:
      - {label: "Access request and approval records for sampled joiners and movers", kind: record}
      - {label: "Access review records for critical systems, last 2 cycles, with sign-off and actions", kind: record, fresh_days: 200}
      - {label: "HR leaver list and account disable dates for the same period", kind: record, fresh_days: 365}
      - {label: "Privileged access review evidence", kind: record, fresh_days: 200}
    sampling: {size: "5 joiners + 5 movers + 5 leavers", population: "last 12 months", method: "compare HR dates to account creation, change and disable dates; check approvals"}
    interviewees: [iam, hr, ciso]
    pitfalls:
      - "Access reviews signed off but no record that the revocations were actually carried out"
      - "Movers keep their previous rights because only joiners and leavers are processed"
      - "Leaver accounts disabled days or weeks after the exit date, or SaaS accounts outside SSO never disabled"
  a.5.19:
    questions:
      - {stage: 1, text: "Show me how you classify suppliers by security risk and what you require from each tier."}
      - {stage: 2, text: "Pick a supplier onboarded this year and show me the security assessment done before signing."}
    requests:
      - {label: "Supplier security policy or procedure with tiering criteria", kind: document}
      - {label: "Supplier register with criticality, data accessed and assessment status", kind: record, fresh_days: 180}
      - {label: "Completed pre-contract security assessments for new suppliers", kind: record}
    sampling: {size: "3-5 suppliers, weighted to critical tiers", population: "suppliers onboarded or renewed in the last 12 months", method: "check assessment happened before contract and matches tier"}
    interviewees: [proc, ciso, legal]
    pitfalls:
      - "Supplier register is a procurement list with no security tiering"
      - "Assessments done after the supplier was already in production"
      - "Exit provisions (return or destruction of data, removal of access) not defined for supplier relationships"
  a.5.20:
    questions:
      - {stage: 2, text: "Pick a critical supplier contract. Show me the security clauses: confidentiality, incident notification, audit rights, sub-processing, data return."}
      - {stage: 2, text: "How do you make sure older contracts are brought up to your current requirements?"}
    requests:
      - {label: "Standard security clauses or schedule used in supplier contracts", kind: document}
      - {label: "Signed contracts or DPAs for sampled critical suppliers", kind: document}
      - {label: "Gap tracking for legacy contracts lacking required clauses", kind: record}
    sampling: {size: "3-5 contracts", population: "critical and high-tier suppliers", method: "check each required clause is present"}
    interviewees: [legal, proc]
    pitfalls:
      - "Contracts signed on supplier paper with no incident notification timeframe"
      - "Audit or assessment rights missing, so the organisation relies on whatever the supplier chooses to share"
  a.5.21:
    questions:
      - {stage: 2, text: "How do you get assurance on the subcontractors of your critical ICT providers?"}
      - {stage: 2, text: "For software or hardware you buy, how do you check where components come from and that they are supported?"}
    requests:
      - {label: "Requirements imposed on suppliers to flow down security to their subcontractors", kind: document}
      - {label: "Sub-processor or subcontractor lists for critical providers", kind: record, fresh_days: 365}
      - {label: "Software bill of materials or component inventory for key products, if applicable", kind: technical}
    sampling: {size: "2-3 critical ICT suppliers", population: "ICT product and service providers", method: "review subcontractor list and flow-down evidence"}
    interviewees: [proc, ciso, dev]
    pitfalls:
      - "No visibility of fourth parties even for providers hosting sensitive data"
      - "Sub-processor change notifications received but never reviewed"
  a.5.22:
    questions:
      - {stage: 2, text: "Pick a critical supplier. Show me the last performance or security review you held with them."}
      - {stage: 2, text: "How did you assess the impact the last time a supplier changed their service, location or subcontractor?"}
    requests:
      - {label: "Supplier review schedule by tier", kind: document}
      - {label: "Minutes or reports of supplier security reviews", kind: record, fresh_days: 365}
      - {label: "Current third-party assurance reports for critical suppliers (ISO 27001 certificate, SOC 2 report)", kind: record, fresh_days: 365}
      - {label: "Records of supplier incidents and changes and how they were assessed", kind: record}
    sampling: {size: "3-5 suppliers", population: "critical and high-tier suppliers", method: "check review is within the tier interval and findings are followed up"}
    interviewees: [proc, ciso]
    pitfalls:
      - "Certificates on file expired or scope of the supplier certificate does not cover the service used"
      - "SOC 2 reports collected but complementary user entity controls never reviewed or implemented"
      - "Reviews scheduled annually but last one is two years old"
  a.5.23:
    questions:
      - {stage: 1, text: "Show me how you decide to adopt a new cloud service and what security checks happen before use."}
      - {stage: 2, text: "For your main cloud provider, show me which controls are yours and which are the provider's."}
      - {stage: 2, text: "If you had to leave this provider next quarter, what is the exit plan and has any part of it been tried?"}
    requests:
      - {label: "Cloud services policy or procedure covering acquisition, use, management and exit", kind: document}
      - {label: "Cloud service register including SaaS, with owner and data classification", kind: record, fresh_days: 180}
      - {label: "Shared responsibility matrix for key cloud providers", kind: document}
      - {label: "Exit plan and evidence of data export or portability test", kind: record}
    sampling: {size: "2-3 cloud services", population: "IaaS, PaaS and SaaS in use", method: "check selection assessment, responsibility split and exit provisions"}
    interviewees: [ciso, infra, proc]
    pitfalls:
      - "SaaS tools bought by business teams on a card never enter the cloud register"
      - "Organisation relies on the provider certificate and has not configured its own side of the shared responsibility"
      - "No exit strategy, or one that has never been tested even with a data export"
  a.5.24:
    questions:
      - {stage: 1, text: "Show me your incident management procedure, roles and escalation paths."}
      - {stage: 2, text: "When did you last exercise the incident process, and what did you change after it?"}
    requests:
      - {label: "Incident management policy and procedure with roles, severity scale and escalation", kind: document}
      - {label: "Incident response team contact list including external parties", kind: document}
      - {label: "Tabletop or simulation exercise report", kind: record, fresh_days: 365}
    sampling: null
    interviewees: [ciso, sec_ops, service_desk]
    pitfalls:
      - "Procedure exists but has never been exercised"
      - "Severity criteria do not tie to regulatory notification thresholds"
  a.5.25:
    questions:
      - {stage: 2, text: "Show me how an event becomes an incident: who decides, using which criteria?"}
      - {stage: 2, text: "Pick three events from the log that were not escalated. Why not?"}
    requests:
      - {label: "Event triage criteria or classification matrix", kind: document}
      - {label: "Event and incident log or ticket queue for the last 12 months", kind: record, fresh_days: 90}
    sampling: {size: "5-10 events", population: "events and alerts in the last 12 months", method: "check triage decision is recorded and consistent with criteria"}
    interviewees: [sec_ops, service_desk]
    pitfalls:
      - "Zero incidents recorded in a year, which suggests events are closed in the service desk without security triage"
      - "Triage decisions not recorded, so nobody can explain why an event was dismissed"
  a.5.26:
    questions:
      - {stage: 2, text: "Pick your most serious incident of the year. Walk me through detection, containment, communication and closure."}
      - {stage: 2, text: "Who was notified, including customers or authorities, and when?"}
    requests:
      - {label: "Incident records with timeline, actions and closure", kind: record, fresh_days: 365}
      - {label: "Communication records for notified parties", kind: record}
      - {label: "Playbooks for common incident types (phishing, ransomware, data leak)", kind: document}
    sampling: {size: "3-5 incidents, including the most severe", population: "incidents in the last 12 months", method: "trace from detection to closure against the procedure"}
    interviewees: [sec_ops, ciso, legal]
    pitfalls:
      - "Timeline missing, so notification deadlines cannot be shown to have been met"
      - "Incidents closed without root cause or with open containment actions"
  a.5.27:
    questions:
      - {stage: 2, text: "Show me a lessons-learned review from a past incident and the actions it produced."}
      - {stage: 2, text: "How do incident trends feed into your risk assessment and awareness programme?"}
    requests:
      - {label: "Post-incident review reports", kind: record, fresh_days: 365}
      - {label: "Corrective action tracking linked to incidents", kind: record}
      - {label: "Incident trend summary presented to management review", kind: record, fresh_days: 400}
    sampling: {size: "2-3 significant incidents", population: "incidents of medium severity or above", method: "check review held and actions closed"}
    interviewees: [ciso, sec_ops, risk]
    pitfalls:
      - "Lessons learned written but actions never assigned or closed"
      - "Repeated incidents of the same type with no change to controls or risk register"
  a.5.28:
    questions:
      - {stage: 1, text: "Show me your procedure for collecting and preserving digital evidence."}
      - {stage: 2, text: "If you needed to support legal action after an incident, how would you show the evidence was not altered?"}
    requests:
      - {label: "Evidence handling procedure with chain of custody form", kind: document}
      - {label: "Completed chain of custody records, if any", kind: record}
      - {label: "Log retention settings for key systems", kind: technical}
    sampling: null
    interviewees: [sec_ops, legal]
    pitfalls:
      - "No chain of custody form; responders reimage machines before preserving evidence"
      - "Log retention shorter than the period needed to investigate typical incidents"
  a.5.29:
    questions:
      - {stage: 2, text: "During a disruption, which security controls must stay in place and how is that written into your continuity plans?"}
      - {stage: 2, text: "In your last continuity test, how did you check that security controls such as access control and logging still worked?"}
    requests:
      - {label: "Business continuity plans with security requirements during disruption", kind: document}
      - {label: "Continuity test reports covering security aspects", kind: record, fresh_days: 365}
    sampling: null
    interviewees: [ciso, infra, risk]
    pitfalls:
      - "Continuity plans focus on availability and allow bypassing security (shared admin accounts, disabled MFA) without controls"
      - "Recovery site not covered by the same security monitoring as production"
  a.5.30:
    questions:
      - {stage: 1, text: "Show me how your ICT recovery objectives were derived from the business impact analysis."}
      - {stage: 2, text: "Show me the last disaster recovery or restore test for a critical service. Did you meet the RTO and RPO?"}
      - {stage: 2, text: "When a test failed or overran, what did you do about it?"}
    requests:
      - {label: "Business impact analysis listing critical processes, supporting ICT services, RTO and RPO", kind: document}
      - {label: "ICT continuity or disaster recovery plans for critical services", kind: document}
      - {label: "DR and restore test reports with measured recovery times", kind: record, fresh_days: 365}
      - {label: "Corrective actions raised from failed or partial tests", kind: record}
    sampling: {size: "2-3 critical ICT services", population: "services supporting critical processes in the BIA", method: "compare BIA objectives to plan and to measured test results"}
    interviewees: [infra, ciso, risk]
    pitfalls:
      - "RTO and RPO set by IT without a BIA, or BIA objectives that the architecture cannot meet"
      - "Backups tested by checking job success, never by an actual restore within the RTO"
      - "Test results not compared to objectives, so misses never become corrective actions"
  a.5.31:
    questions:
      - {stage: 1, text: "Show me your register of legal, regulatory and contractual requirements relevant to security."}
      - {stage: 2, text: "How do you find out about a new or changed law that affects you? Show me the last update you made."}
    requests:
      - {label: "Legal and regulatory requirements register with owner and applicability", kind: document}
      - {label: "Evidence of periodic review of the register", kind: record, fresh_days: 365}
      - {label: "Analysis of cryptography export or use restrictions where relevant", kind: document}
    sampling: {size: "2-3 requirements", population: "entries in the register", method: "check how each is met by a control or process"}
    interviewees: [legal, ciso, dpo]
    pitfalls:
      - "Register not updated for recent regulations such as NIS2, DORA or sector rules"
      - "Contractual security commitments to customers not captured, so nobody tracks them"
  a.5.32:
    questions:
      - {stage: 2, text: "How do you make sure software in use is licensed and that open source licences are respected?"}
      - {stage: 2, text: "Show me the licence count against installations for one commercial product."}
    requests:
      - {label: "Software licence register or software asset management report", kind: record, fresh_days: 180}
      - {label: "Software installation restrictions (no local admin, approved software list)", kind: technical}
      - {label: "Open source licence policy or scan results for developed software", kind: technical}
    sampling: {size: "2-3 products", population: "commercial software and SaaS in use", method: "compare entitlements to installations or users"}
    interviewees: [service_desk, legal, dev]
    pitfalls:
      - "No reconciliation of licences to installations"
      - "Copyleft components shipped in products without licence review"
  a.5.33:
    questions:
      - {stage: 1, text: "Show me your retention schedule for records, including legal basis."}
      - {stage: 2, text: "Pick a record type and show me that it is kept for the right period and then destroyed."}
    requests:
      - {label: "Records retention schedule by record type", kind: document}
      - {label: "Evidence of retention settings in systems (mail, document management, backups)", kind: technical}
      - {label: "Destruction or deletion logs", kind: record, fresh_days: 365}
    sampling: {size: "3 record types", population: "record types in the retention schedule", method: "check system configuration and existence of records at expected age"}
    interviewees: [legal, dpo, infra]
    pitfalls:
      - "Retention schedule exists but systems keep everything forever"
      - "Records needed for ISMS evidence (logs, review records) deleted before the audit cycle"
  a.5.34:
    questions:
      - {stage: 2, text: "Show me your record of processing activities and how it links to your security controls."}
      - {stage: 2, text: "Who is your DPO or privacy lead, and how do privacy and security work together on a breach?"}
    requests:
      - {label: "Record of processing activities", kind: record, fresh_days: 365}
      - {label: "Privacy policy and internal data protection policy", kind: document}
      - {label: "DPIAs for high-risk processing", kind: record}
      - {label: "Personal data breach register", kind: record, fresh_days: 365}
    sampling: {size: "2-3 processing activities", population: "entries in the record of processing", method: "check legal basis, retention and security measures are documented"}
    interviewees: [dpo, legal, ciso]
    pitfalls:
      - "Record of processing incomplete or not updated after new systems went live"
      - "Breach register kept separately from the incident log, with inconsistencies between them"
  a.5.35:
    questions:
      - {stage: 2, text: "When was your security approach last reviewed by someone independent of the people running it? Show me the report."}
      - {stage: 2, text: "Show me how the findings of that review were tracked to closure."}
    requests:
      - {label: "Internal audit programme covering all clauses and Annex A controls over the cycle", kind: document}
      - {label: "Independent review or internal audit reports", kind: record, fresh_days: 365}
      - {label: "Evidence of auditor independence and competence", kind: record}
      - {label: "Findings tracker with status and closure evidence", kind: record}
    sampling: null
    interviewees: [auditor, ciso, top]
    pitfalls:
      - "Internal auditor audits their own work"
      - "Audit programme cannot show which controls were covered over the three-year cycle"
      - "Findings from the last review still open with no target date"
  a.5.36:
    questions:
      - {stage: 2, text: "How do managers check compliance with security policies in their area? Show me the last check."}
      - {stage: 2, text: "Show me a technical compliance review, such as a configuration scan against your hardening standard."}
    requests:
      - {label: "Compliance check schedule or self-assessment programme", kind: document}
      - {label: "Results of compliance checks and technical scans", kind: record, fresh_days: 180}
      - {label: "Non-compliance log with corrective actions", kind: record}
    sampling: {size: "3-5 non-compliances", population: "issues raised in the last 12 months", method: "check root cause and corrective action recorded"}
    interviewees: [ciso, it_lead, auditor]
    pitfalls:
      - "Compliance checks only happen through the annual internal audit"
      - "Scans run but deviations from baseline never triaged"
  a.5.37:
    questions:
      - {stage: 1, text: "Show me the list of documented operating procedures for your IT operations."}
      - {stage: 2, text: "Pick a routine task such as backup or user creation. Show me the procedure and have the operator walk me through it."}
    requests:
      - {label: "Index of operating procedures with owner and review date", kind: document}
      - {label: "Sample procedures (backup, restore, patching, account provisioning, monitoring)", kind: document}
    sampling: {size: "2-3 procedures", population: "documented operating procedures", method: "compare procedure to what the operator actually does"}
    interviewees: [service_desk, dev]
    pitfalls:
      - "Procedures out of date with the current tooling"
      - "Key knowledge held by one person with no written procedure"
