{% load i18n core_extras %}
<ul class="evidence-list">
  {% for evidence in evidences %}
    <li>
      {% if evidence.last_revision and evidence.last_revision.attachment %}
        <a
          target="_blank"
          href="evidences/{{ archive_names|get_item:evidence.id|urlencode }}"
          >{{ evidence.name }}</a
        >
      {% else %}
        {{ evidence.name }}
        <span class="no-file">{% trans "No file attached" %}</span>
      {% endif %}
    </li>
  {% endfor %}
</ul>
