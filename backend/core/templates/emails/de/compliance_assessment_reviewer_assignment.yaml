subject: "CISO Assistant: Sie wurden als Gutachter für '${assessment_name}' hinzugefügt"
body: |
  Hallo,

  Sie wurden dem folgenden Audit als Gutachter hinzugefügt:

  - Name: ${assessment_name}
  - Beschreibung: ${assessment_description}
  - Referenzwerk: ${framework_name}
  - Status: ${assessment_status}
  - Fällig am: ${assessment_due_date}
  - Bereich: ${folder_name}

  Melden Sie sich in Ihrem CISO-Assistant-Portal an, um dieses Audit zu prüfen: [CISO Assistant öffnen](${ciso_assistant_url})

  Vielen Dank.
