subject: "CISO Assistant: Risikoakzeptanz '${acceptance_name}': ${decision}"
body: |
  Hallo,

  Eine Risikoakzeptanz für Risikoszenarien, die Ihnen gehören, hat einen neuen Status:

  - Name: ${acceptance_name}
  - Status: ${decision}
  - Entschieden von: ${actor_name}
  - Begründung: ${justification}
  - Risikoszenarien: ${risk_scenarios}
  - Bereich: ${folder_name}

  Melden Sie sich in Ihrem CISO-Assistant-Portal an, um sie anzuzeigen: [CISO Assistant öffnen](${ciso_assistant_url})

  Vielen Dank.
