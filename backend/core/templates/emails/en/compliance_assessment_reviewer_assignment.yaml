subject: "CISO Assistant: You have been added as a reviewer of '${assessment_name}'"
body: |
  Hello,

  You have been added as a reviewer of the following Audit:

  - Name: ${assessment_name}
  - Description: ${assessment_description}
  - Framework: ${framework_name}
  - Status: ${assessment_status}
  - Due Date: ${assessment_due_date}
  - Domain: ${folder_name}

  Log in to your CISO Assistant portal to review this audit: [Go to CISO Assistant](${ciso_assistant_url})

  Thank you.
