subject: "CISO Assistant: The quick form '${response_name}' is ready for your input"
body: |
  Hello,

  You have been picked as a respondent on the following quick form:

  - Response: ${response_name}
  - Form: ${quick_form_name}
  - Due Date: ${due_date}

  Please log in to CISO Assistant to fill it in: [Open the form](${ciso_assistant_url}/quick-form-responses/${response_id})

  Thank you.
