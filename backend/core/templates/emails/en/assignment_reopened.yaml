subject: "CISO Assistant: Your assignment on '${assessment_name}' has been reopened for editing"
body: |
  Hello,

  Your assignment on the following audit has been set back to draft so it can be edited:

  - Audit: ${assessment_name}
  ${reviewer_observation}

  Please log in to your CISO Assistant portal for more details: [Go to CISO Assistant](${ciso_assistant_url}/auditee-dashboard)

  Thank you.
