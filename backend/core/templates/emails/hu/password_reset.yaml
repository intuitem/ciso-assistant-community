subject: "CISO Assistant: Jelszó visszaállítása"
body: |
  <img src="https://intuitem.com/ciso-assistant.png" alt="CISO Assistant" width="200">

  **Az Ön átfogó GRC-platformja**

  Tisztelt Felhasználó!

  Jelszó-visszaállítási kérést kaptunk ehhez az e-mail-címhez. A folytatáshoz kattintson az alábbi hivatkozásra:

  [Jelszó visszaállítása](${reset_password_url})

  Ha a hivatkozás nem működik, másolja be az alábbi címet a böngészőjébe:
  ${reset_password_url}

  Ez a hivatkozás csak egyszer használható. Ha lejárt, nyissa meg [a saját példányát](${ciso_assistant_url}), és kérjen új jelszó-visszaállítást.

  Ha ezt a kérést nem Ön és nem is a szervezete kezdeményezte, ezt az e-mailt nyugodtan figyelmen kívül hagyhatja.

  A CISO Assistantról [itt](https://intuitem.com/) tudhat meg többet.

  Üdvözlettel:
  a CISO Assistant csapata
