subject: "CISO Assistant: Beküldték a(z) „${response_name}” gyors űrlapot"
body: |
  Tisztelt Felhasználó!

  Beküldtek egy űrlapválaszt, amelynek Ön a felülvizsgálója:

  - Űrlapválasz: ${response_name}
  - Űrlap: ${quick_form_name}

  A felülvizsgálatához jelentkezzen be a CISO Assistantba: [Az űrlapválasz megnyitása](${ciso_assistant_url}/quick-form-responses/${response_id})

  Köszönjük.
