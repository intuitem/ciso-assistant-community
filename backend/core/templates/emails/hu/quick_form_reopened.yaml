subject: "CISO Assistant: Újranyitották a(z) „${response_name}” gyors űrlapot"
body: |
  Tisztelt Felhasználó!

  A következő űrlapválaszt módosításra visszaküldték Önnek:

  - Űrlapválasz: ${response_name}
