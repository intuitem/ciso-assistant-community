subject: "CISO Assistant: Wachtwoord opnieuw instellen"
body: |
  <img src="https://intuitem.com/ciso-assistant.png" alt="CISO Assistant" width="200">

  **Uw alles-in-één GRC-beheerplatform**

  Hallo,

  We hebben een verzoek ontvangen om het wachtwoord voor dit e-mailadres opnieuw in te stellen. Klik hieronder om verder te gaan:

  [Mijn wachtwoord opnieuw instellen](${reset_password_url})

  Werkt de link niet, kopieer dan de volgende URL en plak deze in uw browser:
  ${reset_password_url}

  Deze link kan maar één keer worden gebruikt. Is hij verlopen, ga dan naar [uw instantie](${ciso_assistant_url}) en vraag opnieuw een wachtwoordherstel aan.

  Hebt u of uw organisatie dit verzoek niet gedaan, dan kunt u deze e-mail negeren.

  Meer informatie over CISO Assistant vindt u [hier](https://intuitem.com/).

  Met vriendelijke groet,
  Het CISO Assistant-team
