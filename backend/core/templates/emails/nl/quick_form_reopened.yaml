subject: "CISO Assistant: Het snelformulier '${response_name}' is heropend"
body: |
  Hallo,

  Het volgende antwoord op een snelformulier is naar u teruggestuurd voor wijzigingen:

  - Antwoord: ${response_name}
  - Formulier: ${quick_form_name}
  - Opmerking van de beoordelaar: ${observation}

  Meld u aan op CISO Assistant om uw antwoorden bij te werken: [Formulier openen](${ciso_assistant_url}/quick-form-responses/${response_id})

  Bedankt.
