subject: "CISO Assistant: Vous avez été affecté à '${exception_name}'"
body: |
  Bonjour,

  Vous avez été affecté à la dérogation de sécurité suivante :

  - Nom : ${exception_name}
  - ID : ${exception_ref_id}
  - Sévérité : ${exception_severity}
  - Statut : ${exception_status}
  - Date d'expiration : ${expiration_date}
  - Domaine : ${folder_name}

  Description :

  ${exception_description}

  Observation :

  ${exception_observation}

  Connectez-vous à votre portail CISO Assistant pour consulter et gérer cette dérogation de sécurité : [Consulter cette dérogation de sécurité](${exception_url})

  Merci.
