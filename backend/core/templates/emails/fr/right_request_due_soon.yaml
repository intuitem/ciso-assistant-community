subject: "CISO Assistant : ${request_count} demande(s) de personnes concernées à échoir dans ${days_remaining} jour(s)"
body: |
  Bonjour,

  Les demandes de personnes concernées suivantes arrivent à échéance dans ${days_remaining} jour(s) :

