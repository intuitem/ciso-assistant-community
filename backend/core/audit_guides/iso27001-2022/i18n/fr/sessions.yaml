framework_urn: urn:intuitem:risk:framework:iso27001-2022
locale: fr
sessions:
  opening:
    label: "Réunion d'ouverture"
    r1: "Ce qui a changé depuis l'étape 1 : domaine d'application, organisation, sites, systèmes, fournisseurs clés"
    r2: "Chaque constat de l'étape 1, avec l'action menée et sa preuve"
    r3: "Déclaration d'applicabilité en vigueur, datée, avec la justification de chaque exclusion"
    r4: "Un interlocuteur désigné, joignable pendant tout l'audit, communiqué avec les documents avant le premier jour"
    r5: "Réclamations portant sur le périmètre certifié et leur traitement ; usage de la marque de certification une fois certifié"
    r6: "Avancement des mesures que la Déclaration d'applicabilité présentait comme prévues ou en cours à l'étape 1"
    p1: "Documents pas prêts à la réunion d'ouverture, ou transmis par un canal non sécurisé"
    p2: "Un système du périmètre qui n'est pas dans son état de production le jour de l'audit peut être sorti du périmètre"
    p3: "Ce qui n'était que déclaré à l'étape 1 doit désormais être prouvé par un enregistrement : signatures, résultats de tests, journaux"
  context: {label: "Contexte et domaine d'application"}
  leadership: {label: "Leadership et gouvernance"}
  risk: {label: "Risques, objectifs et planification"}
  support: {label: "Support"}
  people: {label: "Sécurité des ressources humaines"}
  assets: {label: "Gestion des actifs"}
  information: {label: "Protection de l'information"}
  threats: {label: "Gestion des menaces et des vulnérabilités"}
  incidents: {label: "Gestion des événements de sécurité de l'information"}
  continuity: {label: "Continuité"}
  access: {label: "Gestion des identités et des accès"}
  configuration: {label: "Configuration sécurisée"}
  network: {label: "Sécurité des systèmes et des réseaux"}
  development: {label: "Sécurité des applications"}
  physical: {label: "Sécurité physique (visite du site)"}
  suppliers: {label: "Sécurité des relations avec les fournisseurs"}
  compliance: {label: "Juridique, conformité et revues indépendantes"}
  performance: {label: "Évaluation des performances"}
  improvement: {label: "Amélioration : non-conformités et actions correctives"}
  closing:
    label: "Réunion de clôture"
    r1: "La direction présente, ou une personne habilitée à accepter les constats et à engager des moyens"
    r2: "Votre propre liste des points soulevés pendant l'audit, avec ce qui a été montré ou promis pour chacun"
    r3: "La preuve de ce qui a été corrigé pendant l'audit, pour que l'auditeur en tienne compte"
    r4: "Un responsable et une date pour chaque plan d'actions correctives à envoyer à l'organisme de certification"
    p1: "Contester un constat pour la première fois en réunion de clôture : signalez un désaccord dès qu'il apparaît"
    p2: "Repartir sans connaître la gravité de chaque constat (majeur, mineur, observation) ni le délai pour y répondre"
    p3: "Une non-conformité majeure bloque la certification tant que sa correction n'est pas vérifiée, parfois lors d'une visite complémentaire"
