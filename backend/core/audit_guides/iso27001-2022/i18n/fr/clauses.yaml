framework_urn: urn:intuitem:risk:framework:iso27001-2022
locale: fr
entries:
  "4.1":
    q1: "Montrez-moi où vous avez consigné les enjeux internes et externes qui influencent votre SMSI, et quand cette liste a été revue pour la dernière fois."
    q2: "Avez-vous déterminé si le changement climatique est un enjeu pertinent pour votre sécurité de l'information ? Expliquez-moi comment vous êtes arrivés à cette conclusion."
    q3: "Choisissez un enjeu de cette liste et montrez-moi où il s'est traduit par un risque, un objectif ou une mesure."
    r1: "Analyse du contexte (enjeux internes et externes, par exemple PESTEL ou SWOT) avec date et responsable"
    r2: "Trace de la décision sur la pertinence du changement climatique (les auditeurs attendent le raisonnement, la norme ne l'impose pas)"
    r3: "Compte rendu de revue de direction montrant que la liste des enjeux a été revue"
    s1: {unit: "enjeux", population: "enjeux recensés dans l'analyse du contexte", method: "relier chaque enjeu à une entrée du registre des risques, à un objectif ou à une mesure"}
    p1: "Aucune décision sur la pertinence du changement climatique (exigée par le 4.1 depuis l'amendement 1:2024, donc probable non-conformité) ; une simple ligne d'exclusion vaut en général une question ou une piste d'amélioration, le 4.1 n'exigeant pas de justification écrite"
    p2: "Analyse du contexte rédigée une fois pour la certification et jamais mise à jour après une réorganisation, une acquisition ou un passage au cloud"
    p3: "Enjeux recensés mais sans lien avec l'appréciation des risques, si bien que l'auditeur ne voit pas ce qu'ils ont changé"
  "4.2":
    q1: "Quelles sont les parties intéressées qui comptent pour votre SMSI, et qu'attend chacune de vous en matière de sécurité ?"
    q2: "Parmi ces attentes, lesquelles avez-vous choisi de traiter dans le SMSI, et lesquelles avez-vous écartées ?"
    q3: "Prenez un contrat client ou une réglementation de cette liste et montrez-moi les mesures qui y répondent."
    q4: "Certaines de vos parties intéressées ont-elles des attentes liées au climat, par exemple des engagements de résilience demandés par des clients ou des autorités ?"
    r1: "Registre des parties intéressées avec leurs exigences et celles que le SMSI prend en charge"
    r2: "Registre des exigences légales, réglementaires et contractuelles (lien avec A.5.31)"
    r3: "Exemple de contrat client ou d'accord de sous-traitance (DPA) comportant des clauses de sécurité"
    s1: {unit: "exigences", population: "obligations légales, réglementaires et contractuelles du registre", method: "relier chacune à une mesure mise en œuvre et à sa preuve"}
    p1: "Le registre liste les parties mais pas leurs exigences réelles, ou n'indique pas lesquelles le SMSI prend en charge (attente explicite de la version 2022)"
    p2: "Contrat d'un client majeur comportant des clauses de sécurité précises (délai de notification des violations, droit d'audit) absent du registre"
    p3: "Aucune revue des parties intéressées après l'entrée en vigueur d'une nouvelle réglementation (NIS 2, DORA)"
  "4.3":
    q1: "Lisez-moi votre énoncé du domaine d'application. Quels sites, équipes, produits et systèmes sont inclus, et qu'est-ce qui est exclu ?"
    q2: "Pour ce qui est exclu, comment gérez-vous les interfaces et les échanges avec le reste ?"
    q4: "Quels enjeux de contexte et quelles exigences des parties intéressées ont déterminé la limite du domaine d'application ?"
    q3: "Cette équipe ou ce site que j'ai vu sur votre organigramme : est-il dans le périmètre ? Montrez-moi où le document de domaine d'application l'indique."
    r1: "Énoncé du domaine d'application du SMSI (documenté, approuvé, versionné)"
    r2: "Liste des interfaces et échanges avec ce qui est hors périmètre, y compris les services externalisés et cloud"
    r3: "Schéma réseau ou d'architecture cohérent avec la limite du périmètre"
    p1: "Le libellé du périmètre sur le projet de certificat ne correspond pas à l'énoncé du domaine d'application ni aux affirmations commerciales du site web"
    p2: "Des zones exclues partagent réseaux, administrateurs ou données avec des systèmes du périmètre sans que ces interfaces soient traitées (les organismes de certification attendent aussi une justification de chaque exclusion)"
    p3: "Fournisseurs cloud et télétravailleurs oubliés au moment de tracer la limite"
  "4.4":
    q1: "Montrez-moi comment s'articulent les processus de votre SMSI : quelles sorties alimentent quelles entrées ?"
    q2: "Comment savez-vous que le SMSI est tenu à jour et amélioré, et pas seulement documenté ? Donnez-moi un exemple de ce qui a changé cette année."
    r1: "Manuel du SMSI ou cartographie des processus montrant processus, responsables et interactions"
    r2: "Historique des modifications ou des versions des documents du SMSI sur les 12 derniers mois"
    p1: "Un document existe pour chaque chapitre, mais personne ne sait expliquer comment les sorties d'un processus alimentent le suivant (par exemple les résultats d'audit vers la revue de direction)"
    p2: "Aucune trace d'amélioration depuis le dernier audit, signe d'un SMSI figé"
  "5.1":
    q1: "Quel est votre rôle personnel dans le SMSI ? Dites-moi avec vos mots quels sont les objectifs de sécurité."
    q2: "Donnez-moi un exemple où vous avez alloué du budget ou des personnes à la sécurité de l'information au cours de l'année écoulée."
    q3: "Comment la sécurité est-elle prise en compte dans le fonctionnement existant de l'entreprise, par exemple le budget, les projets ou les achats ?"
    r1: "Preuves des ressources accordées au SMSI (ligne budgétaire, effectifs, achat d'outil)"
    r2: "Communications de la direction sur la sécurité de l'information (support de réunion plénière, note, article intranet)"
    r3: "Feuille de présence de la revue de direction attestant la participation de la direction"
    p1: "Le dirigeant délègue tout l'entretien au RSSI et ne sait citer ni la politique ni les objectifs"
    p2: "Demandes de budget sécurité reportées à répétition, ce qui se voit dans les retards du plan de traitement des risques"
    p3: "La direction n'assiste pas à la revue de direction et se contente d'en signer le compte rendu"
  "5.2":
    q1: "Montrez-moi votre politique de sécurité de l'information. Qui l'a approuvée, et quand ?"
    q2: "Lisez-moi les passages qui fixent l'intention de la politique. Indique-t-elle comment les objectifs sont fixés, vous engage-t-elle à satisfaire les exigences de sécurité qui vous sont applicables et à vous améliorer en continu ?"
    q3: "Comment le personnel et les parties externes concernées ont-ils reçu cette politique ? Montrez-moi."
    r1: "Politique de sécurité de l'information signée ou approuvée par la direction, avec version et date"
    r2: "Preuves que la politique a été communiquée en interne et mise à disposition des parties intéressées concernées (les accusés de lecture servent aussi pour A.5.1)"
    s1: {unit: "collaborateurs", population: "salariés et intervenants externes du périmètre", method: "leur demander s'ils savent où trouver la politique et ce qu'elle implique pour leur poste"}
    p1: "Politique approuvée par le seul RSSI, et non par la direction"
    p2: "Il manque à la politique un élément exigé : des objectifs ou la manière de les fixer, l'engagement à satisfaire les exigences applicables, ou l'engagement d'amélioration continue"
    p3: "Le texte de la politique ne correspond plus au SMSI actuel, par exemple il cite encore l'annexe A de 2013"
  "5.3":
    q1: "Qui répond de la conformité du SMSI à la norme, et qui rend compte de sa performance à la direction ?"
    q2: "Montrez-moi où les responsabilités de sécurité figurent dans les fiches de poste ou une matrice RACI."
    q3: "Vous êtes indiqué comme responsable de ce processus. Dites-moi ce que vous faites à ce titre."
    r1: "Document des rôles et responsabilités du SMSI ou matrice RACI"
    r2: "Lettre de nomination ou organigramme désignant le responsable du SMSI / RSSI"
    r3: "Fiches de poste des principaux rôles de sécurité"
    s1: {unit: "titulaires de rôles", population: "responsables nommés dans le RACI (propriétaires de risques, responsables de mesures)", method: "entretien pour confirmer qu'ils connaissent et exercent leur rôle"}
    p1: "Propriétaires de risques ou responsables de mesures nommés qui ont quitté l'entreprise ou ignorent qu'ils occupent ce rôle"
    p2: "Personne n'est formellement chargé de rendre compte de la performance du SMSI à la direction"
  "6.1.1":
    q1: "Partez de vos enjeux de contexte et des attentes des parties intéressées : quels risques et opportunités pour le SMSI lui-même en avez-vous tirés ?"
    q2: "Montrez-moi une opportunité que vous avez identifiée et ce que vous en avez fait."
    r1: "Registre des risques et opportunités propres au SMSI (distinct du registre des risques de sécurité de l'information ou intégré à celui-ci)"
    r2: "Plan d'actions sur les risques et opportunités du SMSI, indiquant quel processus du SMSI porte chaque action et comment vous en mesurerez l'efficacité"
    p1: "Seuls les risques de sécurité de l'information sont pris en compte ; les risques qui empêcheraient le SMSI d'atteindre ses résultats (départ de personnes clés, coupes budgétaires) sont ignorés"
    p2: "Opportunités jamais identifiées ni consignées"
  "6.1.2":
    q1: "Présentez-moi votre méthode d'appréciation des risques : critères d'acceptation, façon d'évaluer la vraisemblance et les conséquences."
    q2: "Si deux personnes évaluaient le même risque à un an d'intervalle, pourquoi arriveraient-elles au même résultat ?"
    q3: "Montrez-moi la dernière appréciation des risques. Quand a-t-elle été réalisée, et qu'est-ce qui l'a déclenchée ?"
    q4: "Qui est le propriétaire de ce risque ? Je vais lui poser la question."
    r1: "Méthode d'appréciation des risques avec critères d'acceptation et échelles"
    r2: "Registre des risques / résultats de la dernière appréciation des risques, avec les propriétaires"
    s1: {unit: "risques", population: "entrées du registre des risques, en privilégiant les risques élevés", method: "vérifier la cotation au regard de la méthode, interroger le propriétaire, suivre jusqu'au traitement"}
    p1: "Critères de risque ou méthode d'appréciation non définis, si bien que les résultats ne peuvent être ni reproduits ni comparés"
    p2: "Risques sans propriétaire nommé, ou le RSSI propriétaire de tout"
    p3: "Cotations non conformes aux échelles documentées, ou critères d'acceptation non définis"
  "6.1.3":
    q1: "Montrez-moi votre Déclaration d'applicabilité. Pour chaque mesure de l'annexe A exclue, pourquoi l'est-elle ?"
    q2: "Vous avez choisi vos mesures à partir de vos risques. Comment avez-vous ensuite vérifié dans l'annexe A que rien n'avait été oublié ?"
    q3: "Qui a approuvé le plan de traitement des risques et accepté les risques résiduels ?"
    q4: "Cette mesure figure comme mise en œuvre dans la Déclaration d'applicabilité. Montrez-moi qu'elle fonctionne."
    r1: "Déclaration d'applicabilité : toutes les mesures nécessaires (les 93 de l'annexe A plus celles que vous avez ajoutées), la justification de chaque inclusion ou exclusion, et leur état de mise en œuvre"
    r2: "Plan de traitement des risques avec actions, responsables, échéances et état d'avancement"
    r3: "Approbation du plan par les propriétaires des risques et acceptation des risques résiduels"
    s1: {unit: "mesures", population: "entrées de la Déclaration d'applicabilité indiquées comme applicables et mises en œuvre", method: "demander une preuve de fonctionnement pour chacune"}
    p1: "Déclaration d'applicabilité encore structurée selon la version 2013 (114 mesures) ou sans les 11 nouvelles mesures de 2022, comme le renseignement sur les menaces ou le masquage des données"
    p2: "Exclusions justifiées par un simple « non applicable », ou exclusion de mesures manifestement nécessaires au vu des risques"
    p3: "Actions du plan de traitement en retard, sans nouvelle échéance ni acceptation du risque résiduel par le propriétaire"
  "6.2":
    q1: "Montrez-moi vos objectifs de sécurité de l'information. Comment sont-ils mesurés et qui est responsable de chacun ?"
    q2: "Où en êtes-vous aujourd'hui par rapport à ces objectifs ? Montrez-moi les données."
    q3: "Que se passe-t-il lorsqu'un objectif n'est pas atteint ?"
    q4: "Quels risques ou quelles exigences ont conduit à ces objectifs, et quand les avez-vous révisés pour la dernière fois ?"
    r1: "Liste des objectifs : cible, responsable, budget ou personnes, échéance et manière de mesurer l'avancement"
    r2: "Suivi de l'avancement des objectifs (tableau de bord ou rapport)"
    p1: "Objectifs flous (« améliorer la sécurité ») sans cible mesurable ni échéance"
    p2: "Objectifs fixés mais jamais suivis ; aucune donnée le jour de l'audit"
    p3: "Objectifs incohérents avec la politique ou non communiqués à ceux qui doivent les atteindre"
    p4: "Objectifs et indicateurs définis, mais sans plan pour chacun : ce qui sera fait, avec quelles ressources, par qui, pour quand et comment le résultat sera évalué"
  "6.3":
    q1: "Comment décidez-vous qu'une modification du SMSI doit faire l'objet d'une planification formelle ?"
    q2: "Parlez-moi d'une modification importante du SMSI cette année, par exemple de périmètre, d'organisation ou une externalisation clé. Montrez-moi comment elle a été planifiée."
    r1: "Critères déterminant quand une modification du SMSI doit être planifiée (bonne pratique, non exigée par le 6.3)"
    r2: "Preuve qu'une modification récente du SMSI a été planifiée avant d'être réalisée (les auditeurs regardent souvent l'objectif, l'impact, les ressources et le responsable)"
    s1: {unit: "modifications", population: "modifications du SMSI lui-même sur les 12 derniers mois", method: "vérifier que la planification a eu lieu avant la modification, et non après"}
    p1: "Confusion avec la gestion des changements opérationnels (A.8.32) ; aucune preuve de planification des modifications du SMSI lui-même"
    p2: "Réorganisation ou extension du périmètre menée sans trace de planification préalable"
  "7.1":
    q1: "Comment avez-vous déterminé les besoins du SMSI en personnes, budget et outils, et où est-ce consigné ?"
    q2: "Une ressource que vous avez demandée manque-t-elle encore, et qu'est-ce que cela bloque ?"
    q3: "Quelle part de votre temps de travail consacrez-vous réellement au SMSI ?"
    r1: "Budget ou plan de ressources du SMSI"
    r2: "Affectation des rôles de sécurité (organigramme, répartition en ETP)"
    p1: "Rôle de RSSI tenu à temps partiel par un responsable informatique sans temps dédié, ce que confirment les retards du plan de traitement"
    p2: "Besoins en ressources jamais évalués formellement ni abordés en revue de direction"
  "7.2":
    q1: "Pour les administrateurs, les développeurs et l'équipe SMSI, quelles compétences avez-vous définies pour chaque rôle ?"
    q2: "Montrez-moi les preuves de compétence de votre responsable SMSI et de votre auditeur interne."
    q3: "Parlez-moi d'une personne à qui il manquait une compétence nécessaire à son poste. Qu'avez-vous fait, et comment savez-vous que cela a été efficace ?"
    r1: "Matrice des compétences ou exigences de compétence par rôle de sécurité"
    r2: "Attestations de formation, CV ou qualifications des principaux acteurs du SMSI"
    r3: "Évaluation de l'efficacité des formations"
    s1: {unit: "personnes", population: "titulaires de rôles sensibles pour la sécurité (administrateurs, développeurs, auditeurs)", method: "comparer la compétence requise aux preuves conservées"}
    p1: "Aucune preuve conservée (formation, qualification ou expérience) de la compétence de l'auditeur interne"
    p2: "Formations suivies sans évaluation de leur efficacité"
    p3: "Exigences de compétence non définies pour les administrateurs ou les développeurs"
  "7.3":
    q1: "Que doit savoir sur la sécurité chaque personne du périmètre, et où est-ce défini ?"
    q2: "Que signifie la politique de sécurité de l'information dans votre travail au quotidien ?"
    q3: "Que feriez-vous si vous aviez cliqué sur un lien suspect ou perdu votre ordinateur portable ?"
    q4: "Que se passe-t-il ici si quelqu'un ne respecte pas les règles de sécurité ?"
    r1: "Plan et contenus du programme de sensibilisation"
    r2: "Relevés de participation du personnel du périmètre à la sensibilisation"
    s1: {unit: "collaborateurs", population: "personnes rencontrées pendant la visite et les entretiens, y compris des nouveaux arrivants", method: "quelques questions informelles sur la politique, le signalement et leur rôle"}
    p1: "Les collaborateurs ne savent pas dire en quoi leur propre rôle contribue à la sécurité"
    p2: "Intervenants externes et nouveaux arrivants absents des relevés de participation"
  "7.4":
    q1: "Sur quels sujets de sécurité communiquez-vous en interne et en externe, quand, auprès de qui et par quel canal ?"
    q2: "Donnez-moi un exemple de communication de sécurité vers une partie externe, comme un client ou une autorité."
    r1: "Plan ou matrice de communication (sujet, destinataires, moment, canal ; responsable facultatif)"
    r2: "Exemples de communications de sécurité internes et externes"
    p1: "Aucune communication définie vers les autorités ou les clients en cas d'incident, malgré des obligations contractuelles"
    p2: "Le plan existe, mais aucune des communications prévues ne peut être prouvée"
  "7.5.1":
    q1: "Montrez-moi les informations documentées exigées par la norme et celles que vous avez ajoutées vous-mêmes."
    q2: "Comment avez-vous déterminé le niveau de documentation dont votre organisation a besoin ?"
    r1: "Liste maîtresse des documents et enregistrements du SMSI"
    r2: "Informations documentées exigées par la norme : domaine d'application, politique, objectifs, processus d'appréciation et de traitement des risques, Déclaration d'applicabilité, ainsi que les enregistrements demandés par les chapitres 7.2, 8.1 à 8.3, 9.1, 9.2, 9.3 et 10.2"
    p1: "Un élément exigé manque, le plus souvent les preuves de compétence, les résultats de surveillance ou le programme d'audit interne"
    p2: "Procédures figurant dans la liste maîtresse mais inexistantes ou encore à l'état de projet"
  "7.5.2":
    q1: "Comment un document reçoit-il son titre, sa version et son responsable, et qui le valide avant publication ? Montrez-moi l'historique de l'un d'eux."
    q2: "Qui a approuvé cette révision de la politique, et où est-ce consigné ?"
    r1: "Règles d'identification, de présentation et d'approbation des documents (une procédure écrite est facultative)"
    r2: "Enregistrements d'approbation des révisions récentes de documents"
    s1: {unit: "documents", population: "politiques et procédures du SMSI", method: "vérifier version, responsable, approbation et date de revue"}
    p1: "Documents sans version, sans responsable ou sans trace d'approbation"
    p2: "Plusieurs versions d'une même politique en circulation (intranet et partage réseau)"
  "7.5.3":
    q1: "Comment les documents du SMSI sont-ils approuvés, versionnés, diffusés et retirés, et combien de temps conservez-vous les enregistrements ?"
    q2: "Comment vous assurez-vous que les gens utilisent la version en vigueur et que les versions périmées sont retirées ?"
    q3: "Où sont conservés les enregistrements, qui peut les modifier, et quand les supprimez-vous ?"
    q4: "Comment maîtrisez-vous les documents que vous n'avez pas rédigés, comme des normes ou des manuels de fournisseurs ?"
    r1: "Calendrier de conservation des enregistrements"
    r2: "Droits d'accès sur le référentiel documentaire du SMSI"
    s1: {unit: "documents", population: "documents trouvés sur les lieux d'utilisation pendant la visite", method: "comparer à la version en vigueur dans la liste maîtresse"}
    p1: "Procédures périmées utilisées en version imprimée ou enregistrée localement"
    p2: "Tout le monde dispose de droits de modification sur le référentiel du SMSI"
  "8.1":
    q1: "Quels processus, y compris externalisés, avez-vous identifiés comme devant être planifiés et maîtrisés pour la sécurité ?"
    q2: "Choisissez un processus qui réalise une action de traitement des risques : à quoi ressemble un travail bien fait, et comment le vérifiez-vous ?"
    q3: "Quels processus sont externalisés, et comment les maîtrisez-vous ?"
    q4: "Parlez-moi d'un changement qui ne s'est pas passé comme prévu. Qu'avez-vous fait de ses effets indésirables ?"
    r1: "Liste des processus externalisés et services achetés dont dépend le SMSI, avec la façon dont chacun est maîtrisé"
    r2: "Enregistrements opérationnels montrant que les processus ont été réalisés comme prévu (par exemple journaux de sauvegarde, rapports de correctifs)"
    s1: {unit: "processus", population: "processus opérationnels de sécurité et services externalisés", method: "vérifier que des critères existent et que des enregistrements prouvent l'exécution"}
    p1: "Services informatiques ou cloud externalisés non recensés comme processus externalisés, et donc soumis à aucune maîtrise"
    p2: "Les processus tournent, mais rien n'est conservé pour prouver qu'ils ont été exécutés au bon moment et de la bonne manière"
  "8.2":
    q1: "Conservez-vous les résultats de chaque cycle d'appréciation des risques, ou seulement le registre du jour ?"
    q2: "À quelle fréquence réappréciez-vous les risques, et qu'est-ce qui déclenche une réappréciation non planifiée ?"
    q3: "Montrez-moi l'appréciation réalisée après votre dernier changement important."
    r1: "Résultats d'appréciation des risques de chaque cycle planifié (les deux derniers)"
    r2: "Appréciation des risques ponctuelle faisant suite à un changement important ou à un incident"
    s1: {unit: "changements", population: "changements importants des 12 derniers mois", method: "vérifier qu'une appréciation des risques a été déclenchée et consignée"}
    p1: "Réappréciation annuelle, mais jamais déclenchée par un changement comme une nouvelle plateforme SaaS ou une acquisition"
    p2: "Résultats non conservés, seul l'état actuel du registre existe"
    p3: "Réappréciations non réalisées aux intervalles que l'organisation s'était elle-même fixés, ou non déclenchées par les changements importants"
  "8.3":
    q1: "Quelles actions de traitement doivent être achevées avant l'étape 2, et lesquelles le sont déjà ?"
    q2: "Montrez-moi l'avancement du plan de traitement des risques. Quelles actions sont terminées, et comment savez-vous qu'elles sont efficaces ?"
    q3: "Que deviennent les actions de traitement qui dépassent leur échéance ?"
    r1: "État d'avancement du plan de traitement des risques"
    r2: "Preuves des actions de traitement réalisées"
    s1: {unit: "actions de traitement", population: "actions arrivées à échéance au cours des 12 derniers mois", method: "vérifier les preuves de réalisation et la mise à jour du risque résiduel"}
    p1: "Actions déclarées terminées sans preuve ou sans mise à jour de la cotation du risque résiduel"
    p2: "Nombreuses actions en retard sans remontée au niveau supérieur"
  "9.1":
    q1: "Quels indicateurs vous disent que le SMSI fonctionne, d'où viennent-ils, et qui les examine ?"
    q2: "Montrez-moi les derniers résultats de mesure et la décision qu'ils ont entraînée."
    q3: "Lequel de ces indicateurs bougerait si une mesure cessait de fonctionner ?"
    q4: "Si quelqu'un d'autre mesurait cet indicateur au trimestre prochain, obtiendrait-il un résultat comparable ? Et comment concluez-vous que le SMSI est efficace dans son ensemble ?"
    r1: "Catalogue d'indicateurs : pour chacun, la source, la fréquence, qui le collecte et qui l'interprète"
    r2: "Dernier rapport d'indicateurs avec analyse"
    s1: {unit: "indicateurs", population: "indicateurs du plan de mesure", method: "vérifier la source des données, le respect de la fréquence et l'utilisation des résultats"}
    p1: "Les indicateurs comptent de l'activité (nombre de formations) sans rien dire de l'efficacité"
    p2: "Résultats collectés mais jamais analysés ni présentés à la direction"
    p3: "Personne n'est désigné pour collecter ou interpréter les indicateurs"
  "9.2.1":
    q1: "Un audit interne complet a-t-il déjà été réalisé, et quelles parties du SMSI a-t-il couvertes ?"
    q2: "Sur l'ensemble de son cycle, votre programme d'audit couvre-t-il tous les chapitres de la norme et les mesures applicables de l'annexe A ? Montrez-moi où."
    q3: "L'audit a-t-il vérifié vos propres procédures en plus de la norme ? Où le rapport le montre-t-il ?"
    q4: "Qui a réalisé l'audit interne, comment savez-vous qu'il maîtrise la version en vigueur de la norme, et qu'il n'a pas audité son propre travail ?"
    r1: "Rapport(s) d'audit interne avec les constats (les organismes de certification attendent au moins un cycle d'audit interne couvrant le SMSI avant l'étape 2)"
    r2: "Listes de contrôle et notes de preuves de l'audit interne"
    s1: {unit: "constats d'audit", population: "constats du dernier audit interne", method: "suivre jusqu'à l'action corrective et sa clôture"}
    p1: "Aucun cycle d'audit interne achevé avant l'étape 2 ; les organismes de certification en attendent un et relèvent souvent son absence comme non-conformité majeure"
    p2: "Audit interne réduit à une liste de cases cochées, sans preuves consignées"
    p3: "Mesures applicables de l'annexe A laissées de côté sur tout le programme, seules les politiques étant auditées"
  "9.2.2":
    q1: "Montrez-moi votre programme d'audit. Comment en avez-vous fixé la fréquence et la couverture ?"
    q2: "Qui sont vos auditeurs internes, et comment vous assurez-vous qu'ils n'auditent pas leur propre travail ?"
    q3: "Qui a reçu le rapport d'audit, et qu'en a-t-il fait ?"
    r1: "Programme d'audit interne (fréquence, méthodes, responsabilités, planification, restitution), souvent calé sur le cycle de certification de 3 ans"
    r2: "Plan de chaque audit interne : ce qui a été vérifié et par rapport à quelles exigences"
    r3: "Preuves de l'indépendance et de la compétence des auditeurs"
    p1: "Le responsable du SMSI audite les processus qu'il pilote, ce qui compromet l'objectivité"
    p2: "Tous les domaines audités au même rythme, sans tenir compte des processus les plus importants ni des problèmes relevés au dernier audit"
    p3: "Sites ou services du périmètre jamais audités"
  "9.3.1":
    q1: "Quand a eu lieu la dernière revue de direction, et qui y a participé ?"
    q2: "À quelle fréquence tenez-vous la revue, et l'une d'elles a-t-elle été sautée ou reportée sur ce cycle ?"
    q3: "La revue de direction a-t-elle eu lieu avant cet audit de certification ?"
    r1: "Compte rendu de revue de direction avec date et liste des participants"
    r2: "Calendrier des revues de direction"
    p1: "Aucune revue de direction tenue avant l'étape 2"
    p2: "Direction absente, revue menée par le RSSI seul"
  "9.3.2":
    q1: "Montrez-moi l'ordre du jour de la dernière revue de direction. Où chaque élément d'entrée attendu est-il traité ?"
    q2: "Montrez-moi où le compte rendu aborde ce que les clients, les autorités et les autres parties intéressées attendent désormais."
    q3: "Comment les résultats d'audit, les non-conformités, les indicateurs et l'état des risques ont-ils nourri la discussion ? Montrez-moi les tendances, pas seulement les chiffres du moment."
    r1: "Dossier d'entrée de la revue de direction (suivi des actions précédentes, changements internes et externes, résultats de performance et d'audit, risques, pistes d'amélioration)"
    r2: "Correspondance entre les points de l'ordre du jour et chaque élément d'entrée exigé"
    p1: "Un ou plusieurs éléments d'entrée exigés manquent, en général l'évolution des attentes des parties intéressées (ajoutée en 2022) ou leurs retours"
    p2: "État des actions de la revue précédente non suivi"
    p3: "Résultats de l'appréciation des risques et avancement du plan de traitement absents du dossier de revue"
  "9.3.3":
    q1: "Quelles décisions sont sorties de la dernière revue de direction, et où sont-elles suivies ?"
    q2: "Quelles décisions de la revue ont modifié le périmètre, les ressources ou les objectifs du SMSI ?"
    q3: "Montrez-moi une décision de la revue qui a été mise en œuvre."
    r1: "Éléments de sortie de la revue de direction : ce qui a été décidé, le responsable de chaque action et l'échéance"
    r2: "Tableau de suivi des actions décidées en revue"
    s1: {unit: "actions", population: "décisions de la dernière revue de direction", method: "vérifier les preuves de mise en œuvre"}
    p1: "Le compte rendu ne retrace que les échanges, sans décision, responsable ni échéance"
    p2: "Décisions de la revue jamais suivies avant la revue suivante"
    p3: "Aucune conclusion consignée sur la pertinence, l'adéquation et l'efficacité du SMSI, ni décision sur les besoins en ressources"
  "10.1":
    q1: "Donnez-moi des exemples d'améliorations du SMSI au cours de l'année écoulée. D'où venaient-elles ?"
    q2: "Comment recueillez-vous les idées d'amélioration venant du personnel et des incidents ?"
    r1: "Registre ou journal des améliorations"
    r2: "Preuves avant/après pour une amélioration achevée (par exemple procédure révisée, évolution d'un indicateur)"
    p1: "Aucune amélioration visible au-delà du traitement des non-conformités (souvent relevé comme piste d'amélioration)"
    p2: "Rien dans le SMSI n'est mesurablement meilleur qu'au dernier audit"
  "10.2":
    q1: "Déroulez-moi une non-conformité, de sa détection à sa clôture. Qu'avez-vous fait de ses conséquences, comment avez-vous décidé s'il fallait en éliminer la cause, et cela a-t-il modifié le SMSI ?"
    q2: "Comment avez-vous vérifié que l'action corrective était réellement efficace ?"
    q3: "Le même problème pourrait-il se produire dans une autre équipe ou un autre système ? Comment l'avez-vous vérifié ?"
    r1: "Registre des non-conformités et des actions correctives"
    r2: "Analyses des causes des non-conformités clôturées"
    r3: "Enregistrements de vérification de l'efficacité des actions correctives"
    s1: {unit: "non-conformités", population: "non-conformités issues des audits internes, des incidents et des réclamations sur les 12 derniers mois", method: "vérifier la correction, l'analyse des causes, l'action et la vérification de son efficacité"}
    p1: "Correction seule, sans évaluer s'il fallait éliminer la cause, ou sans analyse des causes pour des non-conformités importantes ou répétées"
    p2: "Actions correctives clôturées sans vérification de leur efficacité"
    p3: "Constats d'audit interne jamais enregistrés comme non-conformités, si bien qu'aucune action corrective n'a été lancée"
