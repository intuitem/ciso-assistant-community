    p2: "Brassage non étiqueté, si bien que personne ne sait à quoi est relié un port actif d'une salle de réunion"
  a.7.13:
    q1: "Quel matériel fait l'objet d'une maintenance planifiée, et qui est autorisé à la réaliser ?"
    q2: "Qui assure la maintenance de votre matériel critique, à quelle fréquence, et comment encadrez-vous son accès au matériel ?"
    q3: "Que deviennent les données d'un matériel envoyé en réparation ?"
    r1: "Planning de maintenance du matériel critique, conforme aux recommandations des fournisseurs"
    r2: "Rapports de maintenance et d'intervention pour le matériel échantillonné"
    r3: "Contrats de maintenance ou SLA pour les onduleurs, la climatisation et les systèmes incendie"
    s1: {unit: "équipements critiques", population: "matériel critique inscrit au registre des actifs", method: "comparer la date de la dernière intervention à la périodicité prévue"}
    p1: "Contrats de maintenance échus sans que personne ne s'en aperçoive, les factures arrivant dans un autre service"
    p2: "Disques renvoyés sous garantie sans effacement, sans destruction et sans option de conservation du disque ni engagement d'effacement par le fournisseur"
  a.7.14:
    q1: "Quelle est votre procédure avant la réutilisation, la restitution ou la mise au rebut d'un matériel contenant des données ?"
    q2: "Décrivez-moi le parcours d'un portable depuis son retrait du service jusqu'à sa mise au rebut."
    q3: "Comment savez-vous que votre prestataire de destruction a réellement détruit ce que vous lui avez remis ?"
    q4: "Qui vérifie qu'un effacement a réellement abouti, et les logiciels sous licence et les étiquettes de l'organisation sont-ils retirés avant réutilisation ou revente ?"
    r1: "Procédure de mise au rebut et de réutilisation précisant les méthodes d'effacement ou de destruction"
    r2: "Certificats de destruction du prestataire"
    r3: "Journaux d'effacement des équipements réattribués"
    r4: "Visite du site : stockage du matériel retiré en attente de mise au rebut"
    s1: {unit: "équipements mis au rebut ou réattribués", population: "actifs retirés du service au cours des 12 derniers mois", method: "rapprocher les numéros de série du registre des actifs d'un journal d'effacement ou d'un certificat de destruction"}
    p1: "Certificats de destruction indiquant des poids ou des quantités, pas des numéros de série, si bien que rien ne permet de remonter au registre"
    p2: "Pile de portables retirés du service dans un local non fermé à clé, données encore présentes"
    p3: "Imprimantes et copieurs à disque interne rendus au loueur sans effacement"
