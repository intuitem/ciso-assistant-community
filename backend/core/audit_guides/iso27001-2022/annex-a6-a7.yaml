framework_urn: urn:intuitem:risk:framework:iso27001-2022
entries:
  a.6.1:
    questions:
      - {id: q1, stage: 1, text: "Which checks do you run for which roles, and who decided that privileged roles need more?"}
      - {id: q2, stage: 2, text: "Show me the screening file for this engineer, and tell me whether the checks were finished before their first day."}
      - {id: q3, stage: 2, text: "How do you make sure contractors and agency staff are screened to the level their role requires, and where is that written in the supplier contract?"}
      - {id: q4, stage: 2, text: "For critical or privileged roles, how and how often do you re-check that people are still suitable after they start?"}
    requests:
      - {id: r1, label: "Screening procedure with checks per role or risk level", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.bg_screening}
      - {id: r2, label: "Screening evidence for sampled hires (ID, right to work, references, criminal check where lawful)", kind: record}
      - {id: r3, label: "Contract clauses or attestations requiring suppliers to screen their staff", kind: document}
      - {id: r4, label: "HR starter list for the audit period with start dates", kind: record, fresh_days: 40}
    sampling:
      - {id: s1, min: 5, max: 10, unit: "starters", population: "starters in the last 12 months", method: "compare screening completion date to start date and to the checks required for the role", note: "at least 2 in privileged or IT roles, plus 2 contractors"}
    interviewees: [hr, proc]
    pitfalls:
      - {id: p1, text: "Checks completed weeks after the start date with no documented interim restriction on access"}
      - {id: p2, text: "Contractors and staff from agencies excluded from screening because HR only covers payroll employees"}
      - {id: p3, text: "The same intrusive checks, such as criminal records, run for every role with no role-based rationale or confirmed legal basis in the local jurisdiction"}
      - {id: p4, text: "Screening happens only at hiring, with no re-check for people promoted into or holding critical roles"}
  a.6.2:
    questions:
      - {id: q1, stage: 1, text: "Where in the employment contract do staff accept their information security responsibilities?"}
      - {id: q2, stage: 2, text: "Pick a recent hire: show me what they signed and which policies it points to."}
    requests:
      - {id: r1, label: "Employment contract and contractor agreement templates with security clauses highlighted", kind: document}
      - {id: r2, label: "Signed contracts or acknowledgements for sampled starters", kind: record}
      - {id: r3, label: "Staff handbook or code of conduct referenced by the contract", kind: document}
    sampling:
      - {id: s1, min: 5, max: 5, unit: "starters", population: "starters in the last 12 months", method: "check the signed contract or a signed addendum states security responsibilities and was in place before access was granted", note: "including 1 contractor"}
    interviewees: [hr, legal]
    pitfalls:
      - {id: p1, text: "Long-serving staff on contracts that say nothing about information security, with no addendum or signed acknowledgement filling the gap"}
      - {id: p2, text: "Contractor agreements managed by procurement with no security clauses at all"}
  a.6.3:
    questions:
      - {id: q1, stage: 1, text: "How did you decide what goes into the awareness programme, and how does it change for developers or admins?"}
      - {id: q2, stage: 2, text: "What percentage of staff completed training this year, and what happens to those who did not?"}
      - {id: q3, stage: 2, text: "Tell me, without looking it up, how you would report a suspicious email here."}
      - {id: q4, stage: 2, text: "When a policy or procedure changed this year, how did the people it affects find out? Show me."}
      - {id: q5, stage: 2, text: "How do you check that awareness actually landed (quiz, test, observed behaviour)? Show me the latest results."}
    requests:
      - {id: r1, label: "Awareness and training plan with topics per audience", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_plan}
      - {id: r2, label: "Training completion report from the LMS for all staff", kind: record, fresh_days: 100, reference_control: urn:intuitem:risk:function:doc-pol:doc.educ_register}
      - {id: r3, label: "Phishing simulation results and follow-up actions, if simulations are run", kind: record, fresh_days: 200}
      - {id: r4, label: "Role-based training records for the ISMS team and privileged users", kind: record, fresh_days: 400}
    sampling:
      - {id: s1, min: 5, max: 10, unit: "staff from different departments", population: "current headcount plus contractors and supplier staff with access", method: "trace each name to a completion record and ask each a short awareness question during interviews", note: "include 1-2 external personnel"}
    interviewees: [staff, ciso, hr]
    pitfalls:
      - {id: p1, text: "Completion below target with no chasing or escalation recorded"}
      - {id: p2, text: "New starters not trained until the next annual campaign"}
      - {id: p3, text: "Training content generic and never updated after incidents or risk changes"}
  a.6.4:
    questions:
      - {id: q1, stage: 1, text: "Where is it written what happens when someone breaches a security policy, and do staff know about it?"}
      - {id: q2, stage: 2, text: "Has the process been used since the last audit? Walk me through one case, anonymised if needed."}
    requests:
      - {id: r1, label: "Disciplinary procedure that explicitly covers security breaches", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.disciplinary}
      - {id: r2, label: "Anonymised log of security-related disciplinary cases", kind: record}
      - {id: r3, label: "Communication showing staff were made aware of the process", kind: record}
    sampling: []
    interviewees: [hr, legal]
    pitfalls:
      - {id: p1, text: "Generic HR disciplinary policy with no mention of information security, so incidents are handled informally"}
      - {id: p2, text: "Policy violations confirmed during incident review show no sign the disciplinary process was considered, nor a recorded reason for not using it"}
      - {id: p3, text: "Disciplinary process covers employees only; there is no contractual route to act on a contractor or supplier employee who breaks policy"}
  a.6.5:
    questions:
      - {id: q1, stage: 1, text: "Which obligations continue after someone leaves or changes role, and how are they told?"}
      - {id: q4, stage: 1, text: "In which contract or agreement are the duties that continue after leaving written down, and for how long do they apply?"}
      - {id: q2, stage: 2, text: "When someone leaves, how are they reminded of what still binds them, such as confidentiality?"}
      - {id: q3, stage: 2, text: "Show me the exit record for this leaver: which ongoing obligations were restated, and who took over their security duties?"}
    requests:
      - {id: r1, label: "Leaver procedure or exit checklist covering continuing obligations", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.hr_security}
      - {id: r2, label: "Completed exit checklists or exit letters for sampled leavers", kind: record}
      - {id: r3, label: "HR leaver list for the audit period with last working days", kind: record, fresh_days: 40}
    sampling:
      - {id: s1, min: 5, max: 10, unit: "leavers", population: "leavers and role changes in the last 12 months", method: "check continuing obligations were stated in the contract and restated at exit, and any security role held was handed to a named person (asset return and access removal are checked under A.5.11 and A.5.18)", note: "including 1 mover and 1 contractor"}
    interviewees: [hr, iam]
    pitfalls:
      - {id: p1, text: "Exit checklist exists but is blank or missing for contractors and short-notice departures"}
      - {id: p2, text: "A mover or leaver held a security duty (owner of a risk or an asset, an on-call role) and nobody was formally named to take it over"}
  a.6.6:
    questions:
      - {id: q1, stage: 1, text: "Who has to sign an NDA, and when were the templates last reviewed by legal?"}
      - {id: q3, stage: 1, text: "What do your agreements say about how long confidentiality lasts and what happens to information when the relationship ends?"}
      - {id: q2, stage: 2, text: "Show me signed agreements for these suppliers and staff who handle confidential data."}
    requests:
      - {id: r1, label: "NDA templates for staff, contractors and third parties", kind: document}
      - {id: r2, label: "Register of signed NDAs or signed copies for the sample", kind: record}
      - {id: r3, label: "Record of the last NDA template review", kind: record, fresh_days: 400}
    sampling:
      - {id: s1, min: 5, max: 5, unit: "staff or contractors and 3 suppliers with data access", population: "people and suppliers with access to confidential information", method: "confirm a signed agreement exists and predates access"}
    interviewees: [legal, hr, proc]
    pitfalls:
      - {id: p1, text: "Supplier NDAs signed during sales talks expired or never covered the later service"}
      - {id: p2, text: "Templates never reviewed since adoption, so the review requirement is not met"}
  a.6.7:
    questions:
      - {id: q1, stage: 1, text: "What rules apply when people work from home, a café or abroad, and where are they written?"}
      - {id: q2, stage: 2, text: "Show me how you enforce those rules technically on a laptop that is never in the office."}
      - {id: q3, stage: 2, text: "Can staff work from another country, and who approves that?"}
      - {id: q4, stage: 2, text: "How do remote users authenticate to internal systems, and is any remote path still single-factor?"}
    requests:
      - {id: r1, label: "Remote working policy or section of the acceptable use policy", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.work}
      - {id: r2, label: "Endpoint compliance report showing encryption, screen lock and VPN or ZTNA posture", kind: technical, fresh_days: 40}
      - {id: r3, label: "Approvals for working from abroad", kind: record}
    sampling:
      - {id: s1, min: 3, max: 5, unit: "remote workers", population: "staff working partly or fully remotely", method: "check device compliance in the management console and ask each how they handle calls and printing at home"}
    interviewees: [staff, endpoint, ciso]
    pitfalls:
      - {id: p1, text: "Policy forbids public wifi or printing at home but nothing enforces or checks it"}
      - {id: p2, text: "Personal devices used for remote work with no MDM or conditional access"}
      - {id: p3, text: "Staff work from other countries for weeks without approval or a check of local legal constraints"}
  a.6.8:
    questions:
      - {id: q1, stage: 1, text: "How should staff report a security event, and how did you tell them about those channels?"}
      - {id: q2, stage: 2, text: "If I saw something suspicious right now, how would I report it, and how fast would someone respond?"}
      - {id: q3, stage: 2, text: "Show me reports from staff in the last few months and what was done with them."}
    requests:
      - {id: r1, label: "Event reporting procedure and the channels advertised to staff", kind: document}
      - {id: r2, label: "Ticket or mailbox log of staff-reported events with triage outcome", kind: record, fresh_days: 100}
      - {id: r3, label: "Phishing report button statistics", kind: technical, fresh_days: 100}
    sampling:
      - {id: s1, min: 5, max: 5, unit: "reported events", population: "events reported by staff in the last 6 months", method: "check each report reached the defined channel promptly and was logged (triage quality is assessed under A.5.25)"}
    interviewees: [staff, sec_ops]
    pitfalls:
      - {id: p1, text: "Staff interviewed give different answers on how to report, or name a person who has left"}
      - {id: p2, text: "Very few reports logged, which an auditor may probe as a possible awareness or channel problem"}
      - {id: p3, text: "Reports handled in chat or by email with no record of triage"}
      - {id: p4, text: "Staff encouraged to confirm a suspected weakness themselves before reporting it, risking damage and lost evidence"}
  a.7.1:
    questions:
      - {id: q1, stage: 1, text: "Which sites are in scope, and how did you define the boundary of each secure area?"}
      - {id: q2, stage: 2, text: "Walk me around the perimeter. Where could someone get in without passing a control?"}
      - {id: q3, stage: 2, text: "Where provider data centres are in scope, how do you know their perimeter controls are adequate? (Otherwise this is covered under A.5.19 to A.5.23.)"}
    requests:
      - {id: r1, label: "Site list and floor plans marking secure zones and entry points", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:phys.secure_area}
      - {id: r2, label: "Site tour: doors, windows, fire exits and loading areas on the perimeter", kind: observation}
      - {id: r3, label: "Current ISO 27001 certificate or SOC 2 report for hosting or colocation providers, with scope covering the used regions", kind: record, fresh_days: 400}
    sampling: []
    interviewees: [facilities, ciso]
    pitfalls:
      - {id: p1, text: "Fire exits propped open or without alarms, giving an unmonitored way in"}
      - {id: p2, text: "Control marked not applicable for a remote-first company even though a small office or comms cupboard is in scope"}
      - {id: p3, text: "Provider SOC 2 report collected but its scope does not cover the region or service actually used (where provider sites are in scope)"}
  a.7.2:
    questions:
      - {id: q1, stage: 1, text: "Which entry points to your sites are controlled, and how are badges, keys and visitors handled on paper?"}
      - {id: q2, stage: 2, text: "How do visitors get in, who escorts them, and how long do you keep the visitor log?"}
      - {id: q3, stage: 2, text: "When were badge rights to the server room last reviewed, and who removed the ones no longer needed?"}
      - {id: q4, stage: 2, text: "Who holds keys or door codes for restricted rooms, when were codes last changed, and how are delivery areas kept apart from secure zones?"}
    requests:
      - {id: r1, label: "Visitor log for a recent period", kind: record, fresh_days: 40, reference_control: urn:intuitem:risk:function:doc-pol:phys.visitor_mgmt}
      - {id: r2, label: "Badge system export of people with access to restricted zones", kind: technical, fresh_days: 40}
      - {id: r3, label: "Records of the last physical access rights review", kind: record, fresh_days: 200}
      - {id: r4, label: "Site tour: reception, badge readers, tailgating behaviour at entry points", kind: observation}
    sampling:
      - {id: s1, min: 5, max: 5, unit: "leavers and 5 badge holders for restricted zones", population: "badge database and leavers in the last 12 months", method: "check leaver badges were disabled on the last day and that each restricted-zone holder has a role justification"}
    interviewees: [facilities, hr]
    pitfalls:
      - {id: p1, text: "Badges of leavers still active because HR does not notify facilities or the building manager"}
      - {id: p2, text: "Auditor follows staff through a door without being challenged"}
      - {id: p3, text: "Visitor log incomplete, with no exit times or host names"}
      - {id: p4, text: "Server room door code unchanged for years and known to former staff or contractors"}
  a.7.3:
    questions:
      - {id: q1, stage: 1, text: "Which rooms did you mark as needing extra protection, and how did you choose them?"}
      - {id: q2, stage: 2, text: "Which rooms hold sensitive information or equipment, and how are they protected from casual view and entry?"}
      - {id: q3, stage: 2, text: "Is there anything in public building directories or signage that tells outsiders where the sensitive rooms are?"}
    requests:
      - {id: r1, label: "List of sensitive rooms such as server rooms, HR and finance offices, with their protections", kind: document}
      - {id: r2, label: "Site tour: locks, window coverings and signage of sensitive rooms", kind: observation}
    sampling: []
    interviewees: [facilities]
    pitfalls:
      - {id: p1, text: "Server room labelled on the door and visible from a public corridor"}
      - {id: p2, text: "Meeting rooms with screens or whiteboards visible through glass from the street"}
  a.7.4:
    questions:
      - {id: q1, stage: 1, text: "What do you monitor physically, why those areas, and how long do you keep footage?"}
      - {id: q2, stage: 2, text: "Show me the last alarm test and what happened when an alarm went off out of hours."}
      - {id: q3, stage: 2, text: "If you record video, can you retrieve footage from last Tuesday morning for this door right now?"}
    requests:
      - {id: r1, label: "Coverage map of cameras, alarm zones and sensors against secure areas", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:phys.cctv}
      - {id: r2, label: "Alarm and intrusion test log with dates and results", kind: record, fresh_days: 100}
      - {id: r3, label: "CCTV retention and access rules, with the privacy notice and signage required by local law", kind: document}
      - {id: r4, label: "Live retrieval of a recorded clip from a chosen date, if video recording is used", kind: observation}
    sampling:
      - {id: s1, min: 2, max: 3, unit: "alarm events", population: "alarms and out-of-hours events in the last 6 months", method: "trace each event to a response record and check response time against the defined target"}
    interviewees: [facilities, sec_ops]
    pitfalls:
      - {id: p1, text: "Cameras installed but recording failed or the retention is shorter than stated, discovered when footage is requested"}
      - {id: p2, text: "Alarms with no defined out-of-hours responder or an outdated call list"}
      - {id: p3, text: "Monitoring delegated to the landlord with no agreement or report showing what they actually do"}
      - {id: p4, text: "CCTV recorder or alarm panel reachable on the office network or the internet with default credentials"}
      - {id: p5, text: "SoA carried over from the 2013 version with no line or justification for this control, which is new in 2022"}
  a.7.5:
    questions:
      - {id: q1, stage: 1, text: "Which physical and environmental threats did you consider for each site, such as flood, fire or heat?"}
      - {id: q2, stage: 2, text: "Show me the fire suppression and detection inspection records for the server room."}
    requests:
      - {id: r1, label: "Risk assessment entries for natural and environmental threats per site", kind: record}
      - {id: r2, label: "Fire detection and suppression inspection certificates", kind: record, fresh_days: 400}
      - {id: r3, label: "Site tour: water pipes, flood exposure and combustible storage near equipment", kind: observation}
    sampling: []
    interviewees: [facilities, risk]
    pitfalls:
      - {id: p1, text: "Server room below ground or under water pipes with no leak detection and no risk entry"}
      - {id: p2, text: "Cardboard and spare equipment stored in the server room, adding fire load"}
  a.7.6:
    questions:
      - {id: q1, stage: 1, text: "What rules apply inside your secure areas, and who are they shown to?"}
      - {id: q2, stage: 2, text: "What rules apply inside secure areas, for example on phones, photography and lone working?"}
      - {id: q3, stage: 2, text: "How is a third-party engineer supervised when they work in the server room?"}
    requests:
      - {id: r1, label: "Rules for working in secure areas, posted and documented", kind: document}
      - {id: r2, label: "Server room access log or sign-in sheet for third parties", kind: record, fresh_days: 100}
      - {id: r3, label: "Site tour: posted rules and state of the secure area", kind: observation}
    sampling:
      - {id: s1, min: 3, max: 3, unit: "third-party visits", population: "secure area visits in the last 6 months", method: "check each was authorised in advance and escorted"}
    interviewees: [facilities, infra]
    pitfalls:
      - {id: p1, text: "Contractors given a code or badge for the server room and left to work alone"}
      - {id: p2, text: "Server room used as storage, so many people have a reason to enter"}
  a.7.7:
    questions:
      - {id: q1, stage: 1, text: "Show me your clear desk and clear screen rule. Does it cover home and shared workspaces?"}
      - {id: q2, stage: 2, text: "What is the rule for desks and screens when people step away, and how do you check it is followed?"}
      - {id: q3, stage: 2, text: "What happens to documents left on the printer?"}
    requests:
      - {id: r1, label: "Clear desk and clear screen policy", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:phys.clear_desk}
      - {id: r2, label: "Screen lock timeout setting from the device management console", kind: technical, fresh_days: 40}
      - {id: r3, label: "Records of clear desk walk-arounds and follow-up", kind: record, fresh_days: 200}
      - {id: r4, label: "Site tour: unattended desks, printers, whiteboards and unlocked screens", kind: observation}
    sampling:
      - {id: s1, min: 10, max: 15, unit: "desks and the shared printers", population: "open-plan areas visited during the tour", method: "observe at random times, ideally at lunch or end of day"}
    interviewees: [staff, facilities]
    pitfalls:
      - {id: p1, text: "Sensitive printouts left on printers and whiteboards not wiped after meetings"}
      - {id: p2, text: "Screen lock enforced on laptops but not on shared or meeting room devices"}
      - {id: p3, text: "No lockable storage provided, so the policy cannot be followed"}
  a.7.8:
    questions:
      - {id: q1, stage: 1, text: "How did you decide where critical equipment sits and what protects it from damage and overlooking?"}
      - {id: q2, stage: 2, text: "Why is this equipment placed where it is, and what protects it from damage and unauthorised viewing?"}
    requests:
      - {id: r1, label: "Site tour: rack layout, cooling, equipment positioning and screens facing windows", kind: observation}
      - {id: r2, label: "Environmental monitoring readings for temperature and humidity in equipment rooms", kind: technical, fresh_days: 40}
    sampling: []
    interviewees: [facilities, infra]
    pitfalls:
      - {id: p1, text: "Network equipment in an open office cupboard or under a desk, reachable by anyone"}
      - {id: p2, text: "Equipment room with no temperature monitoring or alerting"}
  a.7.9:
    questions:
      - {id: q1, stage: 1, text: "What are the rules for laptops, phones and media used outside your premises?"}
      - {id: q2, stage: 2, text: "How do you protect laptops and other assets that leave the office, and what happens when one is lost?"}
      - {id: q3, stage: 2, text: "Show me the last lost or stolen device report and the actions taken."}
      - {id: q4, stage: 2, text: "Which of your equipment sits permanently outside your premises (kiosks, antennas, branch or remote-site network kit), and how is it protected against tampering and theft?"}
    requests:
      - {id: r1, label: "Rules for assets used off site, in the acceptable use or remote working policy", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.work}
      - {id: r2, label: "Device encryption and remote wipe compliance report", kind: technical, fresh_days: 40}
      - {id: r3, label: "Lost or stolen device incident records", kind: record}
      - {id: r4, label: "Record of approved equipment removals or custody hand-overs, where you require them", kind: record}
    sampling:
      - {id: s1, min: 5, max: 5, unit: "devices from the asset register", population: "laptops and mobiles issued to staff", method: "check encryption status and remote wipe enrollment in the management console"}
    interviewees: [endpoint, staff]
    pitfalls:
      - {id: p1, text: "Devices taken off site left unattended in vehicles or public places, and nobody reports or investigates it"}
      - {id: p2, text: "Lost device reported but no evidence it was wiped or that data exposure was assessed"}
  a.7.10:
    questions:
      - {id: q1, stage: 1, text: "Do you allow removable media at all? If yes, how is it controlled through its lifecycle?"}
      - {id: q3, stage: 1, text: "How do your media handling rules change with the classification level, from purchase through transport to disposal, and do they include paper?"}
      - {id: q2, stage: 2, text: "What stops sensitive data leaving on USB storage: a technical block, enforced encryption or something else? Show me."}
    requests:
      - {id: r1, label: "Removable media and storage media handling rules", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.removable_media}
      - {id: r2, label: "Endpoint policy blocking or encrypting removable storage, with exceptions list", kind: technical, fresh_days: 40}
      - {id: r3, label: "Register or transfer log for media carrying sensitive data, such as backup tapes", kind: record}
    sampling:
      - {id: s1, min: 3, max: 3, unit: "exceptions or media transfers", population: "approved USB exceptions and physical media transfers in the last 12 months", method: "check approval, encryption and return or destruction"}
    interviewees: [endpoint, sec_ops]
    pitfalls:
      - {id: p1, text: "USB storage technically allowed despite a policy that forbids it"}
      - {id: p2, text: "Exception list grows over time with no expiry or review"}
      - {id: p3, text: "Media rules make no reference to the classification scheme, so a confidential disk is handled like a public one"}
  a.7.11:
    questions:
      - {id: q1, stage: 1, text: "Which utilities do your critical systems depend on, and what backs each one up?"}
      - {id: q2, stage: 2, text: "What happens to the server room and network if mains power fails for two hours?"}
      - {id: q3, stage: 2, text: "When was the UPS or generator last tested under load?"}
      - {id: q4, stage: 2, text: "Are UPS, HVAC or building management controllers on a separate network, and can any of them be reached from the internet?"}
    requests:
      - {id: r1, label: "UPS and generator maintenance and load test records", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:phys.power_env}
      - {id: r2, label: "Utility dependency list covering power, cooling, network and telecoms", kind: document}
      - {id: r3, label: "Site tour: UPS status panel and battery age", kind: observation}
    sampling: []
    interviewees: [facilities, infra]
    pitfalls:
      - {id: p1, text: "UPS batteries past their replacement date and never tested"}
      - {id: p2, text: "Single internet line or cooling unit with no risk entry or fallback"}
  a.7.12:
    questions:
      - {id: q1, stage: 1, text: "Where are your power and network cables documented, and which runs did you decide to protect?"}
      - {id: q2, stage: 2, text: "Where do your power and network cables run, and could someone tap or damage them without being noticed?"}
    requests:
      - {id: r1, label: "Site tour: patch panels, cable trunking and comms cupboards", kind: observation}
      - {id: r2, label: "Cabling plan or labelled patch panel documentation", kind: document}
    sampling: []
    interviewees: [facilities, network]
    pitfalls:
      - {id: p1, text: "Comms cupboards in shared corridors left unlocked"}
      - {id: p2, text: "Unlabelled patching, so nobody can say what an active port in a meeting room connects to"}
  a.7.13:
    questions:
      - {id: q1, stage: 1, text: "Which equipment has scheduled maintenance, and who is allowed to carry it out?"}
      - {id: q2, stage: 2, text: "Who maintains your critical equipment, how often, and how do you control their access to it?"}
      - {id: q3, stage: 2, text: "What happens to data on equipment that goes away for repair?"}
    requests:
      - {id: r1, label: "Maintenance schedule for critical equipment, aligned with supplier recommendations", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:pol.maintenance}
      - {id: r2, label: "Maintenance and service records for sampled equipment", kind: record, fresh_days: 400}
      - {id: r3, label: "Maintenance contracts or SLAs for UPS, air conditioning and fire systems", kind: document}
    sampling:
      - {id: s1, min: 3, max: 5, unit: "critical items", population: "critical equipment in the asset register", method: "compare last service date to the planned interval"}
    interviewees: [facilities, infra]
    pitfalls:
      - {id: p1, text: "Maintenance contracts lapsed and nobody noticed because invoices go to another department"}
      - {id: p2, text: "Disks returned under warranty with no wipe, no destruction and no keep-your-drive or vendor sanitisation arrangement"}
  a.7.14:
    questions:
      - {id: q1, stage: 1, text: "What is your procedure before equipment holding data is reused, returned or thrown away?"}
      - {id: q2, stage: 2, text: "Take me through what happens to a laptop from the moment it is retired to its disposal."}
      - {id: q3, stage: 2, text: "How do you know your disposal provider actually destroyed what you gave them?"}
      - {id: q4, stage: 2, text: "Who checks that a wipe actually succeeded, and are licensed software and organisation labels removed before reuse or resale?"}
    requests:
      - {id: r1, label: "Disposal and reuse procedure covering wiping or destruction methods", kind: document, reference_control: urn:intuitem:risk:function:doc-pol:proc.disposal}
      - {id: r2, label: "Certificates of destruction from the disposal provider", kind: record, fresh_days: 400, reference_control: urn:intuitem:risk:function:doc-pol:phys.equipment_disposal}
      - {id: r3, label: "Wipe logs for reissued devices", kind: record}
      - {id: r4, label: "Site tour: storage of retired equipment awaiting disposal", kind: observation}
    sampling:
      - {id: s1, min: 5, max: 5, unit: "disposed or reissued devices", population: "assets marked retired in the last 12 months", method: "trace serial numbers from the asset register to a wipe log or destruction certificate"}
    interviewees: [endpoint, proc]
    pitfalls:
      - {id: p1, text: "Destruction certificates list weights or counts, not serial numbers, so nothing traces back to the register"}
      - {id: p2, text: "Pile of retired laptops in an unlocked store room with data still on them"}
      - {id: p3, text: "Printers and copiers with internal disks returned to the leasing company without wiping"}
