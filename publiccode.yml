description:
  en:
    shortDescription: CISO Assistant is a one-stop-shop GRC platform covering all
      cybersecurity management activities
    longDescription: CISO Assistant is a one-stop-shop GRC platform for Risk
      Management, AppSec, Compliance & Audit, TPRM, Privacy, and Reporting. It
      supports 220+ global frameworks and 45+ mapping sets with automatic
      control mapping, including ISO 27001, NIST CSF, SOC 2, CIS, PCI DSS,
      NIS2, DORA, GDPR, HIPAA, CMMC, and more. It also covers EBIOS RM,
      business impact analysis, cyber risk quantification, incident and
      vulnerability management, workflow automation, a REST API, MCP support
      and an AI assistant.
