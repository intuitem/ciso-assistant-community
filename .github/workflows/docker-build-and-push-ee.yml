name: Build and Push Docker Images EE
permissions:
  contents: read

on:
  push:
    tags:
      - "v*"

# Cancel older in-progress runs for the same PR or the same ref (branch)
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UBUNTU_VERSION: "ubuntu-24.04"

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Generate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          # On a tag push the pushed tag IS the version: git describe breaks
          # ties between tags on the same commit alphabetically, so a
          # powerbi-v* tag cut on the same commit would win over v*.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="$GITHUB_REF_NAME"
          else
            version="$(git describe --tags --always --match 'v[0-9]*')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "build=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build-frontend:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract frontend metadata
        id: meta-frontend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/intuitem/ciso-assistant-enterprise-frontend
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=CISO Assistant Enterprise Frontend
            org.opencontainers.image.description=Enterprise GRC platform for cybersecurity compliance and risk management
            org.opencontainers.image.vendor=intuitem
            org.opencontainers.image.licenses=LicenseRef-intuitem-Commercial
            org.opencontainers.image.url=https://intuitem.com
            org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant
      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./frontend
          file: ./enterprise/frontend/Dockerfile
          build-contexts: |
            enterprise_frontend=./enterprise/frontend
          push: true
          tags: ghcr.io/intuitem/ciso-assistant-enterprise-frontend:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          annotations: ${{ steps.meta-frontend.outputs.annotations }}

  build-backend:
    needs: prepare
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create .meta file
        shell: bash
        env:
          CISO_ASSISTANT_VERSION: ${{ needs.prepare.outputs.version }}
          CISO_ASSISTANT_BUILD: ${{ needs.prepare.outputs.build }}
        run: |
          set -euo pipefail
          {
            echo "CISO_ASSISTANT_VERSION=$CISO_ASSISTANT_VERSION"
            echo "CISO_ASSISTANT_BUILD=$CISO_ASSISTANT_BUILD"
          } > .meta
          cp .meta ./backend/
          cp .meta ./backend/ciso_assistant/
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract backend metadata
        id: meta-backend
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/intuitem/ciso-assistant-enterprise-backend
          tags: |
            type=raw,value=${{ needs.prepare.outputs.version }}
          labels: |
            org.opencontainers.image.title=CISO Assistant Enterprise Backend
            org.opencontainers.image.description=Enterprise GRC platform for cybersecurity compliance and risk management
            org.opencontainers.image.vendor=intuitem
            org.opencontainers.image.licenses=LicenseRef-intuitem-Commercial
            org.opencontainers.image.url=https://intuitem.com
            org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant
      - name: Build and Push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./backend
          file: ./enterprise/backend/Dockerfile
          build-contexts: |
            enterprise_backend=./enterprise/backend
          push: true
          tags: ghcr.io/intuitem/ciso-assistant-enterprise-backend:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
          platforms: linux/${{ matrix.arch }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          annotations: ${{ steps.meta-backend.outputs.annotations }}

  scan:
    needs: [prepare, build-frontend, build-backend]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        component: [frontend, backend]
    env:
      SCOUT_IMAGE: ghcr.io/intuitem/ciso-assistant-community/mirror/scout-cli:1.25.0
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate on CRITICAL
        shell: bash
        env:
          TARGET: ghcr.io/intuitem/ciso-assistant-enterprise-${{ matrix.component }}:${{ needs.prepare.outputs.version }}-amd64
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
          DOCKER_SCOUT_REGISTRY_USER: ${{ github.actor }}
          DOCKER_SCOUT_REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e DOCKER_SCOUT_HUB_USER -e DOCKER_SCOUT_HUB_PASSWORD \
            -e DOCKER_SCOUT_REGISTRY_USER -e DOCKER_SCOUT_REGISTRY_PASSWORD \
            "$SCOUT_IMAGE" \
            cves --platform linux/amd64 --only-severity critical,high --only-fixed --format markdown \
              "$TARGET" | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm \
            -e DOCKER_SCOUT_HUB_USER -e DOCKER_SCOUT_HUB_PASSWORD \
            -e DOCKER_SCOUT_REGISTRY_USER -e DOCKER_SCOUT_REGISTRY_PASSWORD \
            "$SCOUT_IMAGE" \
            cves --platform linux/amd64 --only-severity critical --only-fixed \
              --exit-code "$TARGET" > /dev/null

  merge-manifests:
    needs: [prepare, build-frontend, build-backend, scan]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch manifests
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          CREATED="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Frontend
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=CISO Assistant Enterprise Frontend" \
            --annotation "index:org.opencontainers.image.description=Enterprise GRC platform for cybersecurity compliance and risk management" \
            --annotation "index:org.opencontainers.image.vendor=intuitem" \
            --annotation "index:org.opencontainers.image.licenses=LicenseRef-intuitem-Commercial" \
            --annotation "index:org.opencontainers.image.url=https://intuitem.com" \
            --annotation "index:org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GIT_SHA" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            -t "ghcr.io/intuitem/ciso-assistant-enterprise-frontend:$VERSION" \
            -t "ghcr.io/intuitem/ciso-assistant-enterprise-frontend:latest" \
            "ghcr.io/intuitem/ciso-assistant-enterprise-frontend:$VERSION-amd64" \
            "ghcr.io/intuitem/ciso-assistant-enterprise-frontend:$VERSION-arm64"

          # Backend
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.title=CISO Assistant Enterprise Backend" \
            --annotation "index:org.opencontainers.image.description=Enterprise GRC platform for cybersecurity compliance and risk management" \
            --annotation "index:org.opencontainers.image.vendor=intuitem" \
            --annotation "index:org.opencontainers.image.licenses=LicenseRef-intuitem-Commercial" \
            --annotation "index:org.opencontainers.image.url=https://intuitem.com" \
            --annotation "index:org.opencontainers.image.documentation=https://intuitem.gitbook.io/ciso-assistant" \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.version=$VERSION" \
            --annotation "index:org.opencontainers.image.revision=$GIT_SHA" \
            --annotation "index:org.opencontainers.image.created=$CREATED" \
            -t "ghcr.io/intuitem/ciso-assistant-enterprise-backend:$VERSION" \
            -t "ghcr.io/intuitem/ciso-assistant-enterprise-backend:latest" \
            "ghcr.io/intuitem/ciso-assistant-enterprise-backend:$VERSION-amd64" \
            "ghcr.io/intuitem/ciso-assistant-enterprise-backend:$VERSION-arm64"
