name: Dependency scan

on:
  pull_request:
    paths:
      - "backend/uv.lock"
      - "backend/pyproject.toml"
      - "cli/uv.lock"
      - "cli/pyproject.toml"
      - "enterprise/backend/pyproject.toml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/package.json"
      - ".github/workflows/dependency-scan.yml"
  push:
    branches: [main]
    paths:
      - "backend/uv.lock"
      - "backend/pyproject.toml"
      - "cli/uv.lock"
      - "cli/pyproject.toml"
      - "enterprise/backend/pyproject.toml"
      - "frontend/pnpm-lock.yaml"
      - "frontend/package.json"
      - ".github/workflows/dependency-scan.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SCOUT_IMAGE: ghcr.io/intuitem/ciso-assistant-community/mirror/scout-cli:1.25.0

jobs:
  lockfiles:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate on CRITICAL
        shell: bash
        env:
          DOCKER_SCOUT_HUB_USER: ${{ secrets.DOCKERHUB_USER }}
          DOCKER_SCOUT_HUB_PASSWORD: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e DOCKER_SCOUT_HUB_USER -e DOCKER_SCOUT_HUB_PASSWORD \
            -v "$PWD:/src:ro" \
            "$SCOUT_IMAGE" \
            cves --only-severity critical,high --only-fixed --format markdown \
              fs:///src | tee -a "$GITHUB_STEP_SUMMARY"
          docker run --rm \
            -e DOCKER_SCOUT_HUB_USER -e DOCKER_SCOUT_HUB_PASSWORD \
            -v "$PWD:/src:ro" \
            "$SCOUT_IMAGE" \
            cves --only-severity critical --only-fixed --exit-code fs:///src > /dev/null
