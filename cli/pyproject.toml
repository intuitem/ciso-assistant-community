[project]
name = "ciso-assistant-cli"
version = "0.1.0"
description = "CISO Assistant CLI tools"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.1.0",
    "icecream>=2.1.0",
    # floor: 1.6.0 predates streamable_http_app/TransportSecuritySettings.
    # ceiling: v2 drops mcp.server.fastmcp and request_ctx, both imported here.
    "mcp[cli]>=1.28.1,<2",
    "python-dotenv>=1.0.0",
    "requests>=2.32.3",
    "rich>=13.0.0",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest>=7.0.0",
    "pytest-asyncio",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "pytest-xdist>=3.0.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["ca_mcp", "clica"]
