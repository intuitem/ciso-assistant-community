{{- if and .Values.ingress.enabled .Values.backend.mcp.enabled }}
{{- if not (or .Values.backend.mcp.ingressAnnotations .Values.backend.mcp.proxyRulesApplied) }}
{{- fail "backend.mcp: /mcp needs the proxy rules (strip Cookie and Set-Cookie, add Content-Security-Policy: sandbox): set backend.mcp.ingressAnnotations for your ingress controller (see the chart README), or backend.mcp.proxyRulesApplied=true if a gateway applies them" }}
{{- end }}
# apart from the main ingress, so that the MCP isolation annotations apply only here
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "ciso-assistant.fullname" . }}-mcp
  namespace: {{ .Release.Namespace }}
  {{- with merge (deepCopy .Values.backend.mcp.ingressAnnotations) .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  labels:
    {{- include "ciso-assistant.labels" (dict "context" .) | nindent 4 }}
spec:
  {{- with .Values.ingress.ingressClassName }}
  ingressClassName: {{ . }}
  {{- end }}
  rules:
  - host: {{ .Values.global.domain }}
    http:
      paths:
      {{- range list "/mcp" "/.well-known/oauth-protected-resource" }}
      - backend:
          service:
            name: {{ include "ciso-assistant.fullname" $ }}-backend
            port:
              name: mcp
        path: {{ . }}
        pathType: Prefix
      {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
      - {{ .Values.global.domain }}
      {{- if .Values.ingress.tls.existingSecret }}
      secretName: {{ .Values.ingress.tls.existingSecret }}
      {{- else }}
      secretName: {{ include "ciso-assistant.fullname" . }}-tls
      {{- end }}
  {{- end }}
{{- end }}
